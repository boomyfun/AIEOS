# TASK-081: the reader of files at the base (specification 7 revision 2, section 6; M7's first task). Plan: decisions
# D-2270 to D-2273 (session 3797498a): M7's cut (D-2271), the pin scan (MYSP/t81/pinscan81-out.txt and
# pinscan81-reading.md at af834d5d, D-2273), the risk run (MYSP/t81/risk/risk_class81.py); r1: reviews rv81a
# (claude-sonnet-5-5) and rv81b (claude-opus-5-5, partial) of r0 and their dispositions (MYSP/t81/disp81.md, D-2275);
# r2: round-2 reviews rv81c (claude-sonnet-5-5) and rv81d (claude-opus-5-5) of r1 and their dispositions
# (MYSP/t81/disp81r2.md, D-2277). AC5's decision-matrix value ac8a6116… was checked by machine as the SHA-256 of git
# show e0378695:docs/pre-genesis/decision-matrix.md in the dry run of decision D-2259 (exec_s7_d.sh :32, "pre ok").
#
# Scope:
# - A new src/aieos_bootstrap/base_files.py with two public functions that read the repository at a commit through
#   gitread.run's fixed forms only (src/aieos_bootstrap/gitread.py :4-15): read_file(repo, commit, path, read=None) and
#   list_paths(repo, commit, prefix, read=None). read is injectable (default gitread.run, the same signature
#   (repo, args, timeout) and result {exit, out, err, error}), so unit tests run with no Git.
# - It imports exactly hashlib, re and aieos_bootstrap.gitread, and uses on gitread exactly run, parse_commit and
#   form_error; it starts no
#   process but through read; it opens, writes and appends no file, reads no clock and no environment, makes no os
#   call, and never raises: every failure gives findings.
# - What it does not do: no caller yet (TASK-082 calls it for get_work_order and query); no MCP tool; no change to
#   gitread.py, scope_reconcile.py or any other existing file.
#
# The walk (D-2271 C1; specification 7 :56, "(proposed: reuse that walk for any path)"). Options:
# - (a) a new walk in base_files.py modelled on scope_reconcile._blob_at (src/aieos_bootstrap/scope_reconcile.py
#   :168-230: _read_failure, _cat, _listing, _blob_at);
# - (b) a public function made from _blob_at in scope_reconcile.py, which meets the proposal but changes an accepted
#   module and its pins (tests/unit/test_scope_reconcile.py, tests/integration/test_scope_reconcile_log.py);
# - (c) importing the private name _blob_at into src, rejected (a private name of an accepted module as an interface).
# This task's choice: (a). It departs from specification 7's "reuse that walk"; the departure is listed for
# specification 7's next revision. Its real differences from _blob_at: rev-parse and cat-file -t of the commit,
# gitread.form_error before any read, the name form of every listed name, the bounds below,
# the refusal of symbolic links, submodules and quoted names, MAX_DEPTH, the blob hash check, TIMEOUT 60 against
# gitread's default 30, and findings in place of _Stop. AC5 uses _blob_at as a test-only oracle.
#
# The functions (each returns (value, None) or (None, findings: a non-empty list of strs); on findings no value):
# - Inputs, checked before any read call: repo a str whose form gitread.form_error(repo, <the first fixed form>,
#   TIMEOUT) accepts (gitread.py :77-83: an absolute path to an existing directory), called by base_files itself
#   before any read, so a relative or missing repo gives findings with zero read calls; commit 40 or 64 lowercase
#   hexadecimal characters; path a repository path: "/"-separated names, each name 1 or more characters of
#   printable ASCII 0x21-0x7e other than `"` and `\` (so no space, no control character [\x00-\x1f\x7f], no
#   non-ASCII, nothing Git quotes), no name "." or "..", no leading or trailing "/", at most 4096 characters, at most
#   MAX_DEPTH names; path "" refused; prefix the same form, or "" for the root; exact type(x) is str and fullmatch;
#   read None or callable. Any other input gives findings with no read call.
# - The commit: rev-parse --verify --end-of-options <commit> must give back the commit itself (output stripped of its
#   final newline); cat-file -t <commit>'s output stripped of its final newline must equal b"commit"; cat-file -p
#   <commit> parsed by gitread.parse_commit must give no error and a tree id of 40 or 64 lowercase hexadecimal
#   characters (as scope_reconcile.py :239). A tag, a tree or a blob id, or a commit whose bytes parse_commit refuses
#   (a non-UTF-8 message among them, gitread.py :166-169) gives findings.
# - The walk: each tree is listed with cat-file -p <tree id>; each listing line is "<mode> <type> <id>\t<name>" as
#   scope_reconcile._LISTING reads it (:109); a line out of form, a name listed twice, or a listed name that does
#   not fit the path-name form above (a name beginning with `"`, which Git quotes; a space; a non-ASCII character,
#   which a Git with core.quotePath false may give unquoted; "." or "..") gives findings, so a tree holding such a
#   name fails closed; a listing over MAX_BYTES gives findings. Listings are cached by tree id: each distinct tree id
#   is read once, and every place it appears gives its paths.
# - read_file: the walk along path, a tree for every name but the last and a blob for the last, each mode fitting its
#   type (scope_reconcile.py :110, MODES); then cat-file -p <blob id>; the bytes must be at most MAX_BYTES, must hash as
#   Git hashes a blob ("blob <len>\0" + bytes: hashlib.sha1(data, usedforsecurity=False) for a 40-character id, so
#   bandit's B324 does not apply, and hashlib.sha256 for a 64-character id) to the listed id, and must be UTF-8;
#   value {"blob": <blob id>, "text": <the text>}. A missing name, a wrong type or mode, a symbolic link (mode
#   120000), a submodule (type commit) or any check above gives findings.
# - list_paths: the walk to the tree at prefix, then every blob path under it, depth first; value: the sorted list of
#   repository paths (code-point order). A prefix that names a blob or is missing, a symbolic link or a submodule
#   anywhere under the prefix (fail closed), more than MAX_ENTRIES paths, more than MAX_TREES distinct trees (the
#   root tree counted), more than MAX_PLACES tree places visited (a cached tree counted at every place it appears),
#   more than MAX_TOTAL_BYTES read in the call (listings and blobs), or a depth over MAX_DEPTH names counted from the
#   root (the prefix's names and the names below) gives findings; the walk stops at the first bound crossed.
# - Every read call is guarded, as scope_reconcile._read_failure (:168-178) checks: a call that raises (caught as
#   Exception and turned into findings, never pass or continue), a result that is not a dict with exit, out, err and
#   error, an error that is not None, a nonzero exit, or an out that is not bytes gives findings naming the
#   subcommand. Every call passes TIMEOUT.
#
# Stated choices (this task's; specification 7 section 10 point 8 stays open for its next revision):
# - The walk (a), above. The two public names and their value shapes. Module constants, read at call time so tests
#   may lower them: MAX_BYTES 4194304 (per blob and per listing), MAX_TOTAL_BYTES 67108864 (per call), MAX_ENTRIES
#   100000 paths, MAX_TREES 20000 distinct trees, MAX_PLACES 200000 tree places, MAX_DEPTH 64 names from the root,
#   TIMEOUT 60 seconds. Symbolic links and submodules give findings, never followed, in list_paths too: a tree that
#   holds one cannot be listed from above it (the trade-off of failing closed).
#   Path names limited to unquoted printable ASCII.
#
# Owner-act boundary: none reached. Nothing is launched or connected; no hook, setting, policy or measurement.
#
# Stated limits.
# - Git is trusted as the contract reader trusts it (specification 5 :121); gitread's own limits hold (gitread.py
#   :42-51), output not capped among them: MAX_BYTES is checked after a read returns.
# - A path with a non-ASCII or other quoted name cannot be read or listed.
# - Limit L2 of scope_reconcile (:53-56): a raw newline inside a name, from a stand-in or a Git that does not quote, can
#   make a listing line that is in form and wrong.
# - cat-file honours refs/replace: a tree read may not be the commit's own; a blob is checked by its hash, a tree
#   cannot be (cat-file -p prints text).
# - No wall-time bound beyond TIMEOUT per call times the reads MAX_TREES allows.
# - The function reads what the commit holds; that the commit is the base the launcher passed is the caller's
#   (TASK-082, TASK-084).
#
# The pins (L-0026; MYSP/t81/pinscan81-reading.md at af834d5d; D-2273):
# - .github/workflows/aieos-checks.yml :1489-1517 and :1597-1620 (the deterministic rule): base_files.py and its tests
#   get NONE: no deny-listed module (subprocess, importlib, socket and the others), name (exec, eval, compile,
#   __import__, open, input, breakpoint, __builtins__, as ast.Name, :1620) or os call; standard library and
#   aieos_bootstrap only; tests patch open by the string "builtins.open" and read sources with pathlib's read_bytes.
# - aieos-checks.yml :1512-1514, :1537-1584 and :1598-1599 (gitread's pattern rule; only gitread.py imports
#   subprocess): unchanged; base_files.py uses gitread.run only.
# - aieos-checks.yml :1677-1721 (OPS-003's pattern rule): no MEASURED, ENFORCED or GUARANTEED without a DM row on the
#   line; no src string constant exactly valid, accepted or approved (:1680-1681, :1716). :1727-1755 (bandit, every
#   test on src, and on tests every test but B101 and B311): no bare assert (B101), no try/except/pass (B110), no
#   try/except/continue (B112) in base_files.py, and no insecure hash call (B324): SHA-1 only as
#   hashlib.sha1(..., usedforsecurity=False), in the module and the tests.
# - aieos-checks.yml :423 and :490 (GOV-003's EVALUATOR list, src/aieos_bootstrap/**): a new evaluator path; its change
#   class ruled at acceptance; the list unchanged.
# - tests/unit/test_gitread.py :370-380 (only gitread imports subprocess); tests/unit/test_writer.py :397-411 (R8: no
#   open, .open or .connect call, no ".aieos" string); tests/unit/test_autonomy.py :237-246 (no src module imports or
#   calls autonomy): met by the import set.
# - tests/unit/test_claude_code_read_hook.py :35, :38, :492 (HOOK_SIDE, eight modules): base_files.py is not hook side
#   and no hook-side module imports it.
# - The conformance set tests (tests/integration/test_conformance_cb_set.py :75-83, test_conformance_rc_set.py
#   :153-158, test_conformance_risk_set.py :87-95): the new files name no conformance fixture folder.
# - tests/unit/test_bench_isolation.py :32-52: no new file holds "bench/".
# - tests/integration/test_ac_tests_tree.py :63 reads every test module but checks the naming of TASK-001 to TASK-022
#   only (:13); the new modules' own naming test (AC9) checks "TASK-081 ACn".
# - src/aieos_bootstrap/__init__.py :90 is not changed.
#
# Risk: high, computed over the base by MYSP/t81/risk/risk_class81.py (R2 medium and R3 high, not evaluable, for each
# path). GOV-003: src/aieos_bootstrap/** is an evaluator path; change class ruled at acceptance. Profile as TASK-080's.
# Reviews on Sonnet 5.5 or Opus 5.5 (never Fable). Naming (D-544 Q3): every new test function names "TASK-081 ACn" in
