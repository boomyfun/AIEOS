acceptance_criteria:
  - AC1: >-
      The file kind (conformance-files.md section 2), as TASK-005's AC1: the file is, byte for byte, the first part
      DATA = r''' then a JSON text then the last part ''' and one LF, the JSON text in section 2's canonical form;
      re-serialising the parsed text in that form gives the same bytes. The path is
      tests/conformance/fixtures_risk/risk_01.py (sections 2 and 10). The tests read the file's bytes with pathlib's
      read_bytes and never import or execute it.
  - AC2: >-
      The fixture's form (section 10's table): the object is exactly scenario, row_hash and cases; scenario is RISK-01
      and row_hash the SHA-256 of RISK-01's row line in the bound scenario file without its line end (recomputed by the
      tests); cases is a non-empty list; each case is exactly values, request, records, when and expected; values has
      exactly the thirteen keys of section 10's table in their forms; request is an evaluation request of spec 2 §6.5 with
      changed_paths equal to values.changed_paths and task_state VERIFYING; records holds records of spec 2 §6.2, each
      with no check_record finding at base_commit, with distinct record ids; when is evaluate; expected is exactly
      risk_not, profile_excludes and not_fixed. Each of these is a condition the runner at base_commit checks
      (TASK-017's AC4 and AC5), and the tests check it themselves without importing the runner.
  - AC3: >-
      Faithfulness (sections 5 and 10). expected comes only from RISK-01's Expected cell, "it is not classified low, and
      the low default profile is not applied", read with its Source cell: risk_not is exactly ["low"]; profile_excludes
      is exactly the two pairs {functional, build} and {functional, lint}; not_fixed is exactly decision and next_state.
      The unit tests hold the Expected cell's text and check that it equals the cell in the bound file; a fixture with any
      other list is a failing case of the tests. No expected element depends on a placeholder.
  - AC4: >-
      The placeholders (section 10, "Placeholders"), each a test: contract.risk is low and contract.owner_kept_act
      false; default_profiles gives low exactly the low default ({functional, [build, lint]}) and medium, high and
      critical profiles that hold neither pair; requirement_profiles is []; owner_kept_rules is []; delegation is true;
      evidence_comparison is {weakens: false}; auto_accept is false for every class; articles is [], so no article's
      scope meets a changed path (decision D-462); records holds, for every gate of contract.verification_plan and every
      type of the low default, a passing record of the request's evaluated_commit.
  - AC5: >-
      The rules and the Given (section 10, "The Given"; risk rules sections 2 and 3). values.risk_rules is the policy of
      risk-rules-gov-aieos.md section 3 at base_commit in {match, class} form, one entry per rule, in its order: R1,
      R2 and R4 to R11 with their path lists and classes, and R3 as {match: [src/**, tests/**], class: high} by section
      2 point 3's fail-closed reading; a test reads the section 3 block from the file and checks the list against it,
      rule by rule. Every pattern is well formed in TASK-017's AC5 sense. No path of changed_paths is matched by any
      pattern of any rule or any article's scope, checked in the tests by a matcher of their own for point 6's forms
      (never the runner's or the governor's), and in the contract's checker also by the runner's matcher at
      base_commit.
  - AC6: >-
      The freeze and what stays unchanged (section 7): the file is frozen only by the fixture-freeze approval at this
      task's acceptance (its SHA-256, an authority record of docs/records/TASK-018.jsonl and a DM section F row); the
      set file does not change and gets no new freeze; the integration test checks, in a form that holds in both states
      of RISK-01's set entry (decision D-461 E2), that tests/conformance/set.py has the SHA-256 that a freeze approval of
      the set file in docs/records/ binds (at this task, TASK-014-freeze-set of docs/records/TASK-014.jsonl, F31) and
      that RISK-01's entry is either null or names this file's path with its SHA-256.
  - AC7: >-
      Limits, stated and tested as such: no file outside the write set changes; the only modules that read
      tests/conformance/fixtures_risk/ from disk are this task's three test modules (a test lists every .py file under
      src/ and tests/ and finds the folder's name, outside this task's modules, only in conformance.py and in modules
      named test_runner_risk*.py, which name the path for in-memory bytes; in this form the test holds when TASK-019
      changes those modules, decision D-461 E2); RISK-01 stays NOT_RUN over the tree
      until TASK-020; the tests check form, the binding to the bound file and the policy, and the expected values
      against the Expected cell's text, never the governor's behaviour; an in-memory run of this fixture by the runner
      with the root's governor is worker evidence only, not conformance evidence.
  - AC8: >-
      Purity and the CI checks (INV-001, INV-002, INV-004; section 2), as TASK-005's AC7: the test modules import only
      the Python 3 standard library, use no exec, eval, compile, __import__ or importlib, start no process, open no
      network connection, call no model, write no file, read files only with pathlib's read_bytes and list them only
      with pathlib's glob; the fixture
      module holds one assignment of one string. The CI steps at the task's commits report no finding:
      deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit; the existing tests still pass, unchanged. Before each
      commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0.
  - AC9: >-
      Tests. Unit tests (tests/unit/test_conformance_risk_files.py) cover each rule of AC1 to AC5 with at least one
      passing case and one failing case, the failing cases built in memory from altered copies of the file; one
      integration test (tests/integration/test_conformance_risk_set.py) checks, end to end, the file against the bound
      scenario file, the policy and the set file (AC6), and that the folder holds exactly that file; property tests
      (tests/property/test_conformance_risk_properties.py; standard library only, fixed seeds) check that
      re-serialising the fixture is idempotent, that any one-byte change changes its hash, that any reordering of keys is
      not canonical, that the tests' matcher follows point 6 for random paths and patterns, and these properties of the
      invariants the task relates to: for INV-005, expected fixes no decision value (decision is in not_fixed); for
      INV-006, no expected element is an acceptance value; for INV-007, the request's evaluated_commit is the commit of
      every record; for INV-008, every record is of a source class other than an agent's own declaration.
      tests/run_tests.py, unchanged, runs all three groups.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC9]}
  - {gate: G3, check: constitution, args: [AC8, INV-001, INV-002, INV-004, INV-010, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts AND the fixture file has its freeze approval
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act, scenario_not_realisable]
owner_kept_act: false
