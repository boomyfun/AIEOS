  # base_commit is the `main` commit on top of which the approved contract is committed as its own commit C, changing
  # only docs/tasks/TASK-018.yaml; G0 requires C's one parent to equal base_commit, and the task starts from C. It is
  # filled by script from refs/heads/main just before C is made (D-198 C5): the placeholder and its quotes are replaced
  # by the 40-hex id, unquoted, with nothing after it on the line (G0 reads the line raw).
  base_commit: dbae77c2082068eaacb480de9464cf707cc2143a
  depends_on: [TASK-002, TASK-014, TASK-017]
  intent_versions:
    docs/specs/conformance-files.md: e10f714b83eb6de1ab9a014e523e542576158ad920d8b11331adf152ab6a8d92
    docs/pre-genesis/conformance-scenarios-initial.md: 6b5c0666a1f364f5ecec9ad516c9a749969a1963f4e5dbef566adcbc8c80e24d
    docs/pre-genesis/conformance-methodology.md: a11928199da9b908fad5805b44d341b21f961f0bc925350b0d46ac9adc454c87
    docs/specs/spec-02-aieos-file-format.md: 529b56d831d208594685aad3954fd3e8fc42cadc663e315b65bdfe615e3b09f7
    docs/specs/spec-04-verification-and-evidence.md: 48d4f5bf06461ad49409f21bc6ea8d511d17a84eaac15adda14277483176a8d5
    docs/pre-genesis/constitution.md: 9b396c3c0f31d3a3fbccf9433cf81eb820b6e0f0a3a7d099e2899043abfe1f5a
    docs/pre-genesis/assurance-model.md: 945615316968a5c064bf88be71add9271bbb9f95692eaa22582b6020fa69cb85
    docs/specs/risk-rules-gov-aieos.md: 79021d4c1a6ef506343e78c3bc045273f19efa1c2ac4f517de855ec015ebfbc7
