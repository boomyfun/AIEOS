# Task contract TASK-018, the fixture of RISK-01, the one scenario of the Risk Engine capability of gov-AIEOS (Master
# Plan revision 3, §4 M4; M4's work order of decisions D-428 and D-429, its step 3 split by decision D-459 into
# TASK-018 (this fixture), TASK-019 (the runner tests made to hold in both states of RISK-01's set entry) and TASK-020
# (the set file's entry, its freeze first); specification 2 §5.1). Revision 3, drafted under decisions D-460 (C1, C2),
# D-461, D-462 (C1) and D-467 (C1); whether it is approved is recorded in the decision files, not in this file. Fields
# and value forms follow specification 2 §5.1 and TASK-005's contract, the earlier fixture task.
# Step 3's names (decision D-459 C3): where TASK-017's contract (its lines 15 and 315) and the acceptance of decision
# D-458 name "TASK-018" for the fixture and the set file's entry, they are read as RISK-01's step 3, now TASK-018 to
# TASK-020.
# Task type: fixture (docs/specs/conformance-files.md section 8; section 10's last bullet). Every changed path is the
# Risk Engine fixture file of section 10 or a new test module test_conformance_risk_*.py directly under tests/unit/,
# tests/integration/ or tests/property/. GOV-002 does not apply, as the constitution writes its applicability
# (implementation, refactoring); every other article whose applicability names implementation is applied as to an
# implementation task, so no evidence requirement narrows (section 8; CR-002 part 4 limit 8).
# The cut (D-459): this task adds only the fixture file and its own test modules. It changes no existing file:
# tests/conformance/set.py stays as frozen (F31), with RISK-01's entry null, so no conformance run reads the new file and
# every run record over the repository's tree is unchanged. TASK-020 gives the set file RISK-01's entry naming this
# file's frozen hash, with `fixture_set_version` one more and its freeze approval first (section 7, revision 5, F30;
# F31's form); TASK-019, before TASK-020, makes the tests that assert RISK-01 "no fixture" over the tree hold in both
# states (D-455 C5's readers: test_runner_risk_run.py's test_the_tree_as_it_is and the module docstring's "Limits of
# TASK-017" in conformance.py).
# Readers (D-263 C3's practice; checked by script for this contract at base_commit): the runner reads a fixture only
# through its set entry's path (conformance.py's RISK_FIXTURE_DIR and run_scenario), so with RISK-01's entry null the
# file is never read and RISK-01 stays NOT_RUN "no fixture"; the three TASK-017 test modules name the file's path only to
# put in-memory bytes there, and their real_files() glob only tests/conformance/fixtures/ and fixtures_rc/; no other
# module of src/, tests/ or .github/ names tests/conformance/fixtures_risk/. After this task only its own test modules
# read the file from disk (AC7).
# The policy's rules as values (reading, D-460 (ii)): section 10 has the runner read the policy's rules only from a
# fixture's values (its "Not covered": how the rules are read from the repository is open, S4 §12 point 12), so the
# fixture holds the rules of docs/specs/risk-rules-gov-aieos.md section 3 at base_commit as risk_rules in section 10's
# {match, class} form: R1, R2 and R4 to R11 by their path lists; R3, which matches component tags, by its fail-closed
# reading of section 2 point 3 ("until then it matches every path under src/** and tests/**"), as {match: [src/**,
# tests/**], class: high}; no rule is dropped. The changed path is one that no rule and no article scope matches (the
# Given), shown by two matchers (AC5).
# The articles as [] (reading, decision D-462): section 10's table names `articles` "the constitution's articles"; the
# table gives the key's meaning and form, and its placeholder bullet ("no article's `scope` meets a changed path")
# governs its value. The constitution's scopes are named by role (constitution.md line 20: "Paths are named by role,
# because the layout is open"), SEC-003's `.github/` aside, and three are all paths (line 115, SEC-001; line 120,
# SEC-002; line 135, OPS-002), so the articles cannot be copied as values whose scopes keep every changed path out.
# values.articles is [], the one value that keeps every article out without choosing among the articles or inventing a
# scope; the runner's form check accepts it. Section 10's wording is carried in DEF-0043 item (e).
# Freeze approvals (section 7; the reading of decision D-460 (iii), as TASK-005's D-263 C2): one fixture-freeze approval
# on the fixture file's SHA-256, given in the decision that accepts this task as a separate element before the
# acceptance itself, an authority record with approval_binding {kind: change_request, hash} in
# docs/records/TASK-018.jsonl, and one DM section F row that lists that hash; no set-file freeze, since the set file does
# not change.
# Risk: critical, to be computed over the base by script and its output pasted unedited in the approval request
# (decision D-428 C3): R11 matches tests/conformance/** (critical); R2 and R3 read fail closed match tests/** (medium,
# high); the highest wins. Profile (assurance-model.md §5, gov-AIEOS, critical): medium's, high's and critical's
# entries: unit_test, integration_test, property_test, deterministic_rule, static_security_analysis, ai_review
# (cross-model) and human_review; plus the evidence_required of the applicable articles.
# Change class: normal_cr with a fixture-freeze approval on the fixture file's hash (DM B1, B10, with the A51 note;
# conformance-files.md sections 7 and 10); it changes the evaluator (A29 counts fixtures and scenarios), so it is judged
# by the base version and never auto-accepted (constitution GOV-003; governor-spec.md §8); computed by script.
# Reviews (as TASK-005's): five way-2 reviews by a Claude model other than the implementer's, each brief to the decision
# agent first (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002; governance
# ai_review for GOV-003; operational ai_review for OPS-003; the cross-model half, which also checks the fixture's
# faithfulness to RISK-01's row and section 10), and three decision-agent reviews (architecture human_review, which also
# checks faithfulness and that the property tests cover the related invariants; operational human_review for OPS-002;
# the cross-model half).
# Evaluation path (A61; as TASK-005 to TASK-017): the approved contract is committed on main as its own commit C, which
# changes only docs/tasks/TASK-018.yaml and has one parent equal to base_commit, and is pushed normally; the files are
# drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's commits, each
# carrying the trailer "AIEOS-Task: TASK-018" and no e-mail address in its message, go to the branch task/TASK-018 on
# GitHub, each push under its own decision of the decision agent after a secret scan and a dry run, never by force and
# never deleting; the CI channel runs on each push and its records are re-fetched into docs/records/TASK-018.jsonl; main
# receives the task only at its acceptance, by a fast-forward under its own decision.
# Not applicable: GOV-002 (above); OPS-001 (the task changes no ref); INV-009, INV-011, GOV-001, GOV-004, GOV-005,
# GOV-006 and SEC-003 (their scopes meet no path of the write-set).
# Owner-kept acts: none (nothing under .github/, no Claude Code setting, no push of its own; CR-002 part 4 limit 5 does
# not apply).
# Uncovered and stated limits (AC7): the set file names no Risk Engine fixture until TASK-020, so RISK-01 stays NOT_RUN in
# every run over the repository's tree and nothing here shows that the governor meets RISK-01; an in-memory probe in
# which the runner at base_commit runs this fixture with the root's governor is worker evidence only, not conformance
# evidence (TASK-017 AC15); the fixture holds the policy's rules of base_commit as values, so a later change of the
# policy is not followed by the fixture until a new freeze; how the rules are read from the repository, S4 §8's audit
# record and the component tags are not covered (section 10, "Not covered"); every review is by AI of one vendor.
task: TASK-018
contract_version: v1
task_type: fixture
objective: >-
  Add the executable fixture of RISK-01, the one scenario of the Risk Engine capability of the bound initial scenario
  set, set version 2, in the format of docs/specs/conformance-files.md revision 7, sections 2 and 10 (a Python module
  tests/conformance/fixtures_risk/risk_01.py that wraps canonical JSON text byte-exact), faithful to RISK-01's Given and
  Expected cells and section 10's placeholders, with unit, integration and property tests that check only that file
  against that document, the risk rules and the bound scenario file. It changes no existing file, adds no set-file
  entry and no runner entry, and freezes nothing: the freeze approval is given at its acceptance.
traces_to:
  - docs/specs/conformance-files.md#2
  - docs/specs/conformance-files.md#5
  - docs/specs/conformance-files.md#7
  - docs/specs/conformance-files.md#8
  - docs/specs/conformance-files.md#10
  - docs/specs/risk-rules-gov-aieos.md#2
  - docs/specs/risk-rules-gov-aieos.md#3
  - docs/pre-genesis/conformance-scenarios-initial.md#1
  - docs/pre-genesis/conformance-scenarios-initial.md#3
