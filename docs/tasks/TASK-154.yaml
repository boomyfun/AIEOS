acceptance_criteria:
  - AC1: >-
      The file. The committed docs/specs/evaluation-policy-gov-aieos.md has exactly the pinned bytes (the test compares its sha256 with the pinned value, and the approval script compares the staged file); it contains no "NOT DECIDED" and no "CANDIDATE"; it is valid UTF-8 with LF line ends.
  - AC2: >-
      The reader accepts it. read_evaluation_policy(text of the file) gives result present and findings []; the six source keys are exactly owner_kept_rules, articles, default_profiles, requirement_profiles, delegation, auto_accept and none is None (a test).
  - AC3: >-
      The owner's values. owner_kept_rules equals [{match: [docs/pre-genesis/measurement-protocol.md, docs/pre-genesis/measurements/**]}] (option A; no rule matches .github/**); delegation is True; auto_accept equals {low: False, medium: False, high: False, critical: False}; the three comment lines of the file name the answer "1 không, 2 có, 3 có" and the transcript line 37957 (tests; the quoted answer is the owner's words and is not edited).
  - AC4: >-
      The articles and profiles. The articles are exactly the 15 ids INV-001 to INV-008 (eight), GOV-003, GOV-004, GOV-005, GOV-006, SEC-002, OPS-002, OPS-003 with each evidence_required as in candidate v2; each article has a non-empty scope; GOV-003 has 40 scope entries; default_profiles has exactly the risks low, medium, high, critical with 1, 2, 5, 7 entries; requirement_profiles is [] (tests with the values written out in the test as the expected data, not read from the file).
  - AC5: >-
      The meeting with the governor and the paths. The six sources merged with the other governor.VALUE_KEYS as fixtures are accepted by governor.derive_inputs (a test, as TASK-153 AC4); and eval_inputs._POLICY_PATHS still contains docs/specs/evaluation-policy-gov-aieos.md (a test; so a change of this file by a later task is refused with reason policy_path).
  - AC6: >-
      Nothing else changes. Only the two paths of the write set; no .github change; no source change; the whole suite passes by the slice method (D-6249 C2, D-6328 E1.6); a pin scan (made at approval, brought to the decision agent) shows that no existing test pins a count or a list that the new file could change.
  - AC7: >-
      The CI evidence of the task push (pre-registered before the commit exists, with the D-6865 C3 rules: patterns anchored to the exact line form, run counts that name the branch): deterministic_rule 0 findings and no FAIL line; bandit "No issues identified"; the pyflakes step silent; the GOV-003 step: the CI's evaluator lists at base do not contain docs/specs/evaluation-policy-gov-aieos.md (E7 open), so the step does not treat it as an evaluator path; tests/unit/test_evaluation_policy_file.py is under tests/unit/**, which the lists name, so the step reports it as an evaluator change; the exact expected lines are made by script from .github/workflows/aieos-checks.yml at base and brought with the contract, stated, not hidden.
  - AC8: >-
      Limits and evidence, stated at acceptance. (1) The values are form-checked by the reader and value-checked by this task's tests against the pinned bytes; whether the policy is RIGHT is the decision agent's and the owner's judgment, not a test. (2) The scopes of the articles are the worker's proposal, each equal to or broader than the constitution's prose scope (D-6915); the high and critical default profiles are the text of assurance-model.md revision 5 that the owner approved (A59, A60), whose own label "Claude's, proposed" is kept. (3) The single type property_test is stricter than assurance-model :84. (4) E7 (the evaluator lists of GOV-003 in .github) is still open and is the decision agent's under A66 and SEC-003; BT3b-2 may not call the reader before it. (5) Acceptance is by explicit decision of the decision agent (GOV-003 :94, INV-011 :78 bar auto-accept). (6) This task creates a path of eval_inputs._POLICY_PATHS and of EVIDENCE_DEFINING_PATHS: once the runner exists such a change is refused with reason policy_path and has no evidence_comparison {weakens: false}; this task is therefore not run-evaluated and is accepted only by the decision agent's explicit decision. (7) The owner's answer is quoted from the transcript; no row of the decision matrix records it (GOV-005).
