      Scope. The task commits change only paths of the write set. Production changes only: decision_replay.py (the replay of acceptance lines, the governor pin argument, the usage text, the limits, the docstring, the guard of AC8), eval_inputs.py (one private function split out of eval_inputs, and the docstring), evaluation_sources.py (one keyword-only argument pin of load_sources, and the docstring). No production module is added; no public name is added to eval_inputs or evaluation_sources. Every existing test passes unchanged except one, where this contract makes its pinned text false: in tests/unit/test_decision_replay.py MainTests.test_arguments the expected usage line becomes the line stated in AC4, and nothing else in that test changes; otherwise tests are only added.
  - AC2: >-
      The shared values. eval_inputs._assemble(contract, changed_paths, sources) holds the steps that stand today between the argument checks and the call of governor.derive_inputs, in their order: the policy-path refusal, the open gaps, retries, plan, risk_rules, the form checks of the sources, the copies and the values mapping; it gives the declared mapping, the values and copies of the plan entries (which eval_inputs passes to ci_evidence), or the refusal's reason and detail. eval_inputs calls it once at that place. Every answer of eval_inputs, refusal texts and order included, is the base's. The replay calls this function and builds no values mapping of its own.
  - AC3: >-
      The pin of the loader. load_sources takes pin as a keyword-only argument, default None, so its positional arguments and defaults are the base's. With None everything is the base's. With a pin, it must be a str of 64 lowercase hexadecimal characters and ci_logs must be None, else the refusal argument; pinned_governor is not called; governor.py as read at policy_ref is checked against the pin by evaluation_derive.ruleset_version (refusal governor, as today), and the provenance entry is {pin: given, value: the pin}.
  - AC4: >-
      The argument. The entry takes --governor-pin <sha256> after the repository, at most once, 64 lowercase hexadecimal characters; a missing or malformed value, or a second one, is one FAIL line and exit 1. A positional engine pin is never read as a governor pin, and the governor pin is never an accepted engine. Without it every decision.acceptance line is counted failed and printed with the prefix "NOT REPLAYED: decision.acceptance", its place, and the text that no governor pin was given. With no repository argument the entry prints exactly one line, 'usage: decision_replay <repo> [--governor-pin <sha256>] [<accepted engine sha256> ...]', and exits 1.
  - AC5: >-
      The gate. No module that imports governor, directly or through its own imports (evaluation_sources through evaluation and scope_reconcile, eval_inputs, evaluate_command, evaluation), is imported unless all of these hold, each failure a FAIL line naming it: the engine gate of today passes (the acceptance path reads contracts through base_inputs, which imports the Resume Check); the governor file that a plain import would load is the repository's own src/aieos_bootstrap/governor.py (a path comparison, as for the engine); the SHA-256 of governor.py at the checked commit equals the pin; the record's ruleset_version is the text "governor-sha256:" and the pin. The fourth equal value, governor.py at the record's policy_ref, is checked by load_sources with the pin before the governor is called. The imports are plain import statements inside a function.
  - AC6: >-
      The replay of one line. The log passes records.check_log; the line is an object of type decision.acceptance with a task_id in form, an event_id and a payload that is a mapping; the log of the recomputation is the lines before it (the first line fails). The evaluated commit, the approved contract_hash and the payloads come from evaluation._task_events over those bytes; an evaluated commit that cannot be read fails with its own finding that names the commit and says this checkout cannot read it, and no line is skipped for it; the contract, its bytes and policy_ref come from evaluate_command's _contract and _policy_ref; the sources and the changed paths from load_sources with the pin and no logs, whose contract provenance must pass evaluate_command._same_contract; the declared mapping and the values from AC2's function. Then evaluation.evaluate_task is called with a read_log that gives the cut bytes and an append that writes nothing and captures its call; it must answer evaluated and call append exactly once. evaluate_task is called with extra_records [] as the command passes them (evaluate_command.py :252), read the replay's git read, and recorder and now taken from the logged line; these two are not compared beyond AC7; the capturing append answers with result 'appended'. No code of evaluate_task is copied and evaluation.py is not changed.
  - AC7: >-
      The comparison. The captured event type, event_id and task_id equal the line's, and the captured record equals the logged payload key by key, over the union of both key sets, by canonical JSON text, so 1, 1.0 and true differ; no key is skipped. Each difference is a FAIL line naming the keys. A line that passes is counted with the replayed and passed records and printed REPLAYED. Any refusal of a called function, any answer out of form and any Exception is a finding; none escapes. The execution-record replay and the violation-path rule are unchanged.
  - AC8: >-
      Carried findings, text and one guard: DEF-0138 items 1, 2, 5 and 6 (the docstring and the comment made true); DEF-0144 item 3 (violation_path_record answers False for a negative index) and item 11 (the docstring says the violation import precedes the gates); tests for DEF-0144 items 1, 2 and 16.
  - AC9: >-
      Limits, stated in the docstring and at acceptance: the readers, the evaluation modules and the governor run from the tree under check (GOV-003 is not met by them); after a change of governor.py, or of a reader in a way that changes a result, older records fail closed, with no loader of the old code; the CI and review records in the log are trusted as logged, and nothing reads GitHub or a reviews file again; the record holds no log position, so a line appended between the evaluation's read and its own append makes the replay differ (it fails closed); a record whose evaluated commit the checkout does not hold fails, and which of fetching it, keeping such a record out of main's log, or another course is taken is the decision of the later workflow step; no logged acceptance record of the self-build exists, so no real record has been replayed.
  - AC10: >-
      Tests, using only what the CI rules allow each module. At least one passing replay compares against a logged record written in the test as a literal payload with a literal record_id and event_id, computed apart from the code under test; the same case with each of these changed alone fails and names it: one payload value, an added key, a removed key, the event_id, the task_id; plus: no pin, a malformed pin, two pins, an engine pin that equals the governor pin without the flag, a governor at the checked commit or at policy_ref that differs, another ruleset_version, an unreadable evaluated commit, a refused source, a repeated record id in the log's payloads (left out as evaluate_task leaves it), a NaN in a line (refused by check_log), a renamed file whose old path is in the changed paths (diff form --no-renames), after each failing gate sys.modules holds no aieos_bootstrap.governor, aieos_bootstrap.evaluation_sources or aieos_bootstrap.evaluation; AC2 and AC3 each with their unchanged answers and their new refusals.
  - AC11: >-
      CI evidence: on the task branch and on main, "GOV-003 evaluator lists: 2 found, equal, 40 entries"; the evaluator-change line as the paths give, written into the pre-registration before each push; on the task branch the base tests run on the change (report only), their predicted failures named before the push: of the whole suite at the base (3866 tests), run with the three production files of this contract (the prediction run of D-7560, observed there, not predicted before it), exactly this one fails: test_decision_replay.py MainTests.test_arguments. The replay line of the CI stays "replay: event logs 1, decision records: 10, replayed and passed: 8, failed: 0, not replayed (violation path): 2".
  - AC12: >-
      Touch list (master plan section 6 point (6) (b)): DEF-0137 (the code part done here; the workflow step and the unreachable-commit choice stay); DEF-0138 (items 1, 2, 5, 6 by AC8, item 9 by this task; items 3 and 8 closed before; item 4 concerns review briefs and item 7 is a stated limit: judged at acceptance whether it closes); DEF-0144 (items 1, 2, 3, 11, 16 by AC8; items 4, 12, 13, 15 stated why not); DEF-0152 (F5, the repeated record id and NaN shown by AC10's tests; the rest not touched); DEF-0154 and DEF-0156 (they name eval_inputs.py or evaluation_sources.py; neither is changed by this task, said at acceptance). By script at base_commit: DEF-0137 (names decision_replay.py); DEF-0138 (names decision_replay.py); DEF-0144 (names decision_replay.py); DEF-0152 (names eval_inputs.py, evaluation_sources.py); DEF-0154 (names eval_inputs.py, evaluation_sources.py); DEF-0156 (names eval_inputs.py, evaluation_sources.py).
  - AC13: >-
      Unchanged: .github/, governor.py, evaluation.py, evaluate_command.py, records.py, the event log, the policy, the profiles and the specifications. No evidence requirement is lowered; the entry gains no way to pass a record without recomputing it. If the work needs any of these changed, the builder stops and escalates.
  - AC14: >-
      The rules of the checker: the new code and tests use none of the names or modules the deterministic rule denies, add no string naming the project-state directory, keep the module-text rules that the existing tests of these modules pin, and pass pyflakes and bandit as the workflow runs them. If a CI step refuses the new code, the builder stops and escalates; no rule is changed.
  - AC15: >-
      Records, in the records commit (no AIEOS-Task trailer, pushed only after the task commits are on main): a dated line on DEF-0137; the DEF-0152 lines for F5, the repeated record id and NaN; the state of DEF-0138 and DEF-0144 with cited evidence; the counts and accepted limits of master plan section 6 point (6) and, if this is the batch's fifth acceptance, the count comparison; a history page.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [src/aieos_bootstrap/decision_replay.py, src/aieos_bootstrap/eval_inputs.py, src/aieos_bootstrap/evaluation_sources.py, tests/unit/test_decision_replay.py, tests/unit/test_decision_replay_acceptance.py, tests/unit/test_eval_inputs.py, tests/unit/test_evaluation_sources.py]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
# Risk: src/** and tests/**: risk-rules-gov-aieos.md R2 raised by R3, unevaluable and therefore matching (:18); re-checked at the contract commit.
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 900k, wall_time: 6h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC10, AC14]}
  - {gate: G3, check: constitution, args: [AC9, AC11, AC12, AC13, AC15, INV-001, INV-002, INV-003, INV-004, INV-007, INV-008, INV-009, INV-010, INV-011, GOV-001, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of risk high is satisfied (an other_model_review and a separate decision_agent_review, both bound to the evaluated commit, the contract and the pins, before any fast-forward of main) AND the task acceptance by the decision agent before any landing step AND the aieos-checks run of the accepted commit succeeds
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
