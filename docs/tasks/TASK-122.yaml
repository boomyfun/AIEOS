acceptance_criteria:
  - AC1: >-
      The source. The diff of src/aieos_bootstrap/resume_check.py against base_commit has exactly two hunks: the removal of line 42 `from aieos_bootstrap import records` together with one of the two blank lines around it (so that exactly one blank line separates `import sys` from `INPUT_KEYS`), and line 33, which reads "It imports only the standard library. It opens, writes and removes no file, reads no clock," (the words "and aieos_bootstrap.records" removed, the rest of the sentence unchanged; the docstring's line widths and the other lines stay). The file's remaining imports are exactly ast, copy, hashlib, re and sys. A Grep of the new file for `records` finds no match. The pyflakes 4.0.3 default run over the new file (the CI lint step of TASK-119, when it lands) reports nothing for it; this task does not run pyflakes locally (D-4873) and its evidence for AC1 is the text diff plus AC3.
  - AC2: >-
      The tests. (a) tests/unit/test_runner_rc.py:341 reads `        go(files, check=stand_in(), asked=asked)` (the same call, no assignment; indentation unchanged); no other line of the file changes; the test keeps asserting on `asked` and on run_scenario as before. (b) tests/integration/test_resume_check_fixtures.py: the line `        self.assertIn('aieos_bootstrap.records', names)` (:85) is deleted and no other line changes; the test method keeps :84 (every import is a standard-library module or 'aieos_bootstrap.records') and :86 (no import names conformance), and its name and docstring stay (the docstring still says "standard library and records only", an upper bound as TASK-008 AC9 reads). The diff of each of these two test files has only the one changed or removed line. (c) tests/integration/test_ci_resume_pin_logic.py (the test of TASK-121) changes only what pins the two env values: the old pin constant stays as the previous value Q (e1578939...); a constant for the new pin P (b03c0b8a...) is added; ENV_PIN_LINE is built from P; ENV_PREVIOUS_LINE is built from Q (not empty); and the one test that asserted the previous value empty (docstring "TASK-121 AC6: the value ... is empty in this task") is replaced by one test that asserts the previous-value line equals ENV_PREVIOUS_LINE, that P and Q are 64-hex and that P differs from Q. The one other allowed change is the single docstring wording at :84, "the empty value line" becoming "the previous-value line" (D-4999 C2). Every other test, pin and the truth table of that file stay byte for byte. The exact diff is bound by SHA-256 in the A66 decision.
  - AC3: >-
      No side effect, and what the old import did. The contract's facts record, with file:line, that the name `records` is not used in resume_check.py, that importing records.py only builds constants, regular expressions and lambda tables, that nothing reads `resume_check.records`, and that the one test requiring the import is changed by AC2(b). The acceptance request repeats the Greps of C3 of D-4920 unedited (`aieos_bootstrap.records`, `resume_check.records`, `sys.modules`, `getattr(` aimed at resume_check) over src and tests, each hit explained. The one observable difference is that importing resume_check no longer imports records.py as a side effect; every module that needs records imports it itself (the Greps show it), and the full test suite is the evidence.
  - AC4: >-
      The pins, the line shift and the order of landing (N7). The landing is ONE commit L built fresh on the contract commit of this task (a docs commit with one parent, b0683361, the head of main when this contract is approved, changing only docs/tasks/TASK-122.yaml; not from P0, X or X' of the retired route; D-4955 C3), on the new branch task/TASK-122, pushed under that same name (the old local and GitHub branch task/TASK-120 with the commit 7f134cc3, parent 54fd38de, is not moved, rewritten, reused or deleted; no force-update). L carries: (i) the content of the task commit 7f134cc3 for src/aieos_bootstrap/resume_check.py, tests/unit/test_runner_rc.py and tests/integration/test_resume_check_fixtures.py, byte for byte (their blobs at the base are unchanged since 54fd38de; the machine proves this); (ii) tests/integration/test_ci_resume_pin_logic.py per AC2(c); (iii) .github/workflows/aieos-checks.yml with exactly two lines changed: `      AIEOS_PINNED_RESUME_CHECK: '<P>'` where P is the SHA-256 of the new resume_check.py (b03c0b8a1caaa77c2974da0b512bd38e1f330b5d08dda1bbd85427944eee2e76 for the file of 7f134cc3), and `      AIEOS_PINNED_RESUME_CHECK_PREVIOUS: '<Q>'` where Q = e1578939404da0b61d56d9187521b92c923e7cb841acdf15d0afb7155605a135 (every other line of the workflow byte for byte, including the comment block of the previous value and the governor pin); (iv) the one trailer `AIEOS-Task: TASK-122`. The limit to the two lines is checked as a diff of the workflow in which only those two lines differ from the base, in the A66 decision on the combined diff (a forbidden pattern cannot express single lines; D-4960 C4). This task does not touch tests/integration/test_launcher_repo.py (:19 and :124 compare the CI's pinned hash with the hash of the file at the fixed commit f216376e, which does not change). The history copies of the old hash stay unchanged. The line shift of M2: every line of resume_check.py after :41 moves up by 2; src/aieos_bootstrap/claude_code_channel.py:23 and its pin tests/unit/test_claude_code_channel.py:307 stay unchanged (outside the write_set); after acceptance the stale citations (claude_code_channel.py:23 and the two spec lines named in the facts) are recorded as one new DEF entry, as its own decision, and do not grow into new scope. Order, each step its own decision: the contract TASK-122 on main (a docs-only commit; the executor refuses unless HEAD = main = origin/main = b0683361); L on the new branch (never to main first), fetched into E:/AIEOS, reviewed; the A66 decision on the exact combined diff of L, bound by SHA-256, BEFORE the commit; the push of the branch and the CI read of the branch run (the first real exercise of the previous-version path of TASK-121: the base run's base is origin/main whose Resume Check file is the old one (= Q), the head's file is the new one (= P); the run must be green, and its notice must show "base resume check file" = Q and the pinned version = P); the acceptance; the push of L to main as a fast-forward with the one trailer; the CI read on main; the next push to main (the records commit) runs the base run on L, whose base file is the NEW file: its notice must show "base resume check file" = P with RC-01 to RC-11 PASS and outcome pass (the evidence that D-4958 C3 requires); that run is read and must be green, or the task stops and comes back to the decision agent; nothing else touching the Resume Check lands before that read; no TASK-119 r6 commit lands before it. If any run of these steps is red, the task stops and comes back to the decision agent.
  - AC5: >-
      Evidence and records. The risk class is critical, so the evidence profile is the critical profile of assurance-model section 5, as for TASK-117, TASK-118 and TASK-121: unit_test and integration_test (the CI runs the head's tests; the unit tests are this task's own changed test and the existing ones, the integration tests are the changed R8Imports file, the changed pin-logic file and the existing ones), deterministic_rule, static_security_analysis, ai_review cross-model by way-2 reviews on Haiku 5.5 of the diff and tests (read-only: Read, Grep and Glob only; no other model without the owner; the brief asks the per-article lines as the TASK-121 second review did, so that the article entries INV-001, INV-002, INV-004, GOV-003, SEC-002 and OPS-003 can be recorded), functional property_test (the existing property tests, untouched, run by the CI) and architecture human_review by a second decision_agent_review that is not the cross-model half (assurance-model section 5). The way-2 record names the implementer's model (the session that makes the task commit, expected claude-sonnet-5-5) and the reviewer's model (Haiku 5.5); if the reviewer's model equals the implementer's or the decision agent's, the pair counts nothing and the task stops. GOV-003 is recorded as it falls, and a stated departure (DEF-0107 points 2 to 4, DEF-0110) is part of the acceptance text from the start (the lesson of TASK-121, D-4985). If the governor shadow's raw output in the records dry run shows an entry unmet other than GOV-003, the task stops and comes back to the decision agent. Because the task changes tests/, its acceptance brings the raw output of the step 'GOV-003 base tests (report only)' of the task-branch run and names each base-test failure in its departures; the expected failures are the BASE's test_resume_check_fixtures.R8Imports (:85) against the new src and, for the base's test_ci_resume_pin_logic.py, the tests that pin the old values (report only), and any other failure is named.
  - AC6: >-
      Limits (N8). No change to any other source, test, workflow, spec or document than the paths of the write_set; the workflow changes only the two env value lines of AC4 (checked on the A66 diff); no formatting change; no new import anywhere; no use of `# noqa` or any ignore; the lint step is not changed to accept a finding (DEF-0124, TASK-119 AC4/AC6). No write access, secret, token, repository or security setting is added or changed (no `permissions:` change; no `secrets.`, `GITHUB_TOKEN`, `uses:`, `continue-on-error`, `curl`, `wget` in any added line). DEF-0126, DEF-0127, DEF-0120, DEF-0121 and DEF-0123 are untouched. The same tests in the same number pass as at the base apart from the one replaced test of AC2(c) (no other test added, removed or renamed); the full suite in parts (unit, integration, property) is green. DEF-0124 and DEF-0125 are closed by a docs commit after acceptance and after the read of the base run on L (its own decision).
