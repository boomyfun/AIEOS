# Task contract TASK-011, the execution decision record's keys in the record checker (Master Plan revision 3, §4 M3;
# the M3 work order of decision D-254, as amended by decisions D-262, D-263 and D-333; specification 2 §5.1). Revision
# 0, drafted under decisions D-333 (C3) and D-334 (E2), brought for approval in its own request; whether it is approved is recorded in
# the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of
# TASK-001, TASK-006 and TASK-007. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Id (reading): decision D-333 named this task "TASK-008a"; records.py checks a task id as "TASK-" followed by digits
# only (the subject rule, DEF-0027's point for TASK-005b), so the task takes the next free digits-only id, TASK-011.
# Order (decision D-333, K1): an M3 task inserted before TASK-008; TASK-008 depends on it and does not change
# records.py.
# Task type: implementation. What it changes: records.check_decision's decision.execution branch only, so that a
# decision.execution payload may carry the keys of specification 3 §9's execution decision record (DEF-0029's limit:
# the conformance runner checks a Resume Check's answer with records.check_decision, which now reports each of those
# keys as unknown, so a Resume Check that returns specification 3 §9's record would be NOT_RUN in every case), with
# form checks of some of them; and the module docstring's stated limit (records.py lines 19-20). Specification 3 §9
# names the keys (proposed names, its §12 point 12) and settles spec 2 §10 point 6.
# The key collision (reading, carried): specification 3 §9 names a key intent_versions "for each entry: the
# contract's version and the current one", while spec 2 §6.2's record key intent_versions maps ids to versions
# v<digits> and check_record checks it so. For a decision.execution payload only, the check reads §9's form; every
# other payload keeps the record form. The collision is carried to the next revision of specifications 2 and 3 as a
# new Deferred item, opened with this task's records.
# Readers of the changed path (D-263 C3's practice): src/aieos_bootstrap/records.py is imported by eventlog.py,
# governor.py and conformance.py and by their tests, and by the CI's G1 build and conformance runs; the conformance
# runner's execution_problem calls check_decision('decision.execution', ...) on a Resume Check's answer; the governor
# and the event log call it on decision.acceptance and on every event payload. Only the decision.execution branch
# changes; every other path through records.py, and every existing test, stays as it is (AC4, AC5).
# Risk: high. R2 matches src/** and tests/** (medium); R3 read fail closed matches them too, records.py being the
# checker the runner and the governor judge with (risk rules section 2 point 3); no path meets R10 or R11; the highest
# wins. Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule],
# functional [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus
# the evidence_required of the applicable articles (INV-005: property_test). Dimensions are named as TASK-006's records
# name them (decision D-181, reading R-dim).
# Change class: critical_cr (decision D-333 C3; as TASK-001, which wrote records.py, read fail closed as governor code):
# records.py is what the conformance runner uses to judge a Resume Check's answer and what the governor's records are
# checked with, an evaluator part (DM A29: the validator), so the task is judged by the base version and never
# auto-accepted (constitution GOV-003; governor-spec.md §8).
# Reviews (decision D-333 C3, as TASK-006's): five way-2 reviews by a Claude model other than the implementer's, each
# under a decision of the decision agent (architecture ai_review for INV-001, INV-002, INV-004; correctness ai_review
# for INV-005; security ai_review for SEC-002; governance ai_review for GOV-003; operational ai_review for OPS-003; the
# cross-model half), and three decision-agent reviews (architecture human_review for INV-003, which also checks that
# the property tests show no other payload type is loosened; operational human_review for OPS-002; the cross-model
# half). Each way-2 review record's basis names every article whose entry it covers and addresses each of their
# rules. Each reviewer's prompt is self-sufficient, with the scratchpad's absolute path in its first line (D-277).
# Evaluation path (A61; as TASK-006's and TASK-007's): the approved contract is committed on main as its own commit C,
# which changes only docs/tasks/TASK-011.yaml and has one parent equal to base_commit, and is pushed normally; the files
# are drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's commits,
# each carrying the trailer "AIEOS-Task: TASK-011" and no e-mail address in its message, go to the branch task/TASK-011
# on GitHub, each push under its own decision of the decision agent after a secret scan and a dry run against a bare
# single-branch copy (D-229, D-274), never by force and never deleting; the CI channel runs on each push and its
# records are re-fetched into docs/records/TASK-011.jsonl; main receives the task only at its acceptance, by a
# fast-forward under its own decision. Before each task commit, the added text is scanned with the workflow's SEC-001,
# SEC-002 and OPS-003 patterns (AC7).
# Not applicable: OPS-001 (scope: the repository's refs; the task changes no ref); INV-006 to INV-008, INV-010 and
# INV-011 (their scopes, the governor, evidence records and the policy, meet no path of the write-set; the governor's
# path through records.py does not change, AC4); INV-009 (scope: the event log; no log is written); GOV-001, GOV-004
# to GOV-006 and SEC-003 (their scopes, the concept file, the bound artifacts, the decision matrix, the records and
# pre-genesis documents, and .github/, meet no path of the write-set). INV-005 applies: the check is the schema rule
# on the execution decision contract that the article's check names.
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own (CR-002 part 4 limit 5 does not apply). It weakens no evidence requirement
# (CR-002 part 4 limit 8): it checks more of a decision.execution payload than before, and nothing less of any other.
# Uncovered and stated limits (AC6): no Resume Check exists until TASK-008, so no real execution record is checked by
# this task; the §9 keys whose inner forms are not checked (AC2) are checked as present-with-a-type only; the
# intent_versions reading is carried, not settled.
task: TASK-011
contract_version: v1
task_type: implementation
objective: >-
  Change records.check_decision in src/aieos_bootstrap/records.py so that a decision.execution payload may carry the
  keys of specification 3 section 9's execution decision record besides the record keys, decision and error, with the
  form checks of AC2 and, for that payload type only, section 9's form of intent_versions; update the module
  docstring's stated limit; with unit and property tests in new test modules. Every other payload type is checked
  exactly as before, and every existing test passes unchanged.
traces_to:
  - docs/specs/spec-03-resume-check-and-decision-engine.md#9
  - docs/specs/spec-02-aieos-file-format.md#6.2
  - docs/specs/spec-02-aieos-file-format.md#6.4
  - docs/specs/conformance-files.md#9
input_state:
  # base_commit is the `main` commit on top of which the approved contract is committed as its own commit C, changing
  # only docs/tasks/TASK-011.yaml; G0 requires C's one parent to equal base_commit, and the task starts from C. It is
  # filled by script from refs/heads/main just before C is made (D-198 C5): the placeholder and its quotes are replaced
  # by the 40-hex id, unquoted, with nothing after it on the line (G0 reads the line raw).
  base_commit: cc9273875ec893411f0e02764891783ab5d547fb
  depends_on: [TASK-001, TASK-006]
  # The interim documents have no id and no vN version, so each is named by its path and pinned by its SHA-256, as in
  # the contracts of TASK-003 to TASK-007.
  intent_versions:
    docs/specs/spec-03-resume-check-and-decision-engine.md: 05c53318cd756a3acfc13e5adaffbfaede8f05be3d00289e9fd45fef08c63c73
