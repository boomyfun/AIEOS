acceptance_criteria:
  - AC1: >-
      The keys (specification 3 §9). For event type decision.execution, check_decision allows, besides the record
      keys of spec 2 §6.2 and decision and error, exactly these keys: contract_hash, contract_version, base_commit,
      head_commit, log_seq, delta, checks, outcomes_fired, read_set, signatures, intent_versions, dependencies,
      constitution, runtime, budgets, policy_version, engine_identity, uncovered and state_effect. Any other key is
      still reported as an unknown key (rule 6.4:unknown_key), next_task_state included. None of the new keys is
      required (reading: specification 3 §9 does not say which keys a record with an error carries; the Resume Check's
      own contract, TASK-008, requires them of its records).
  - AC2: >-
      The forms checked when the key is present (reading: the keys whose values decide or bind the record):
      base_commit and head_commit full lowercase hex commit ids; log_seq an integer at least 0 and not a boolean;
      contract_hash 64 lowercase hex digits; contract_version "v" followed by digits; engine_identity an object with exactly
      the keys code_sha256 and python (decision D-334, E2; S3 §9: "the content hash of the code that decided ... with
      the interpreter's version"), code_sha256 null or 64 lowercase hex digits and python digits "X.Y.Z"; checks a list of exactly eight objects, each with exactly the keys check, status, outcome
      and detail, check the integers 1 to 8 each once, status one of passed, fired, skipped and not_run, outcome an
      execution decision value when status is fired and null otherwise, detail a string; outcomes_fired a list of
      execution decision values without repeats, in the order of specification 3 §7 (STOP: violation, STOP: scope
      invalid, STOP: runtime insufficient, ESCALATE, BLOCKED, REPLAN, CONTINUE_WITH), and, when the decision is not
      null, the decision equal to its first value or CONTINUE when it is empty; delta, read_set, signatures,
      dependencies, constitution, runtime, budgets, uncovered and state_effect of the JSON type §9's table implies
      (a list for delta, signatures, uncovered and state_effect; an object for read_set, dependencies, constitution,
      runtime and budgets); policy_version a non-empty string or null. Each failed form is one finding with a rule
      named 6.4:<key>.
  - AC3: >-
      intent_versions (reading, carried). For a decision.execution payload, intent_versions, when present, is an
      object mapping each entry to an object with exactly the keys contract and current, each a non-empty string or
      null (specification 3 §9: "the contract's version and the current one"); the record form of spec 2 §6.2 (ids
      mapped to v<digits>) is not applied to it. For every other payload type, and for check_record called alone, the
      record form is checked exactly as before.
  - AC4: >-
      Nothing else changes. check_record, check_payload, check_log, check_decision for decision.acceptance, and every
      other function and constant of records.py behave exactly as before for every input (shown by every existing test
      passing unchanged and by the property tests of AC8, and checked by the reviews in the diff); the record rules of
      §6.2 still apply to a decision.execution payload's record keys; every existing test module passes unchanged
      (forbidden), test_records.py's next_task_state case and the random unknown-key property included. If one can
      pass only by a change, the task escalates (needs_out_of_scope_change).
  - AC5: >-
      The docstring. The module docstring's stated limit "A decision.execution payload may hold only the record keys,
      decision and error ..." is replaced by one that says exactly what is now allowed and checked (AC1 to AC3) and
      what is not (the inner forms of the keys AC2 checks by type only).
  - AC6: >-
      Limits, stated and tested as such: no Resume Check exists until TASK-008; the keys are allowed, not required;
      inner forms beyond AC2 are not checked; the intent_versions reading is carried to the next revision of
      specifications 2 and 3.
  - AC7: >-
      Purity and the CI checks (INV-001 to INV-004). The change and its tests import only the Python 3 standard
      library and aieos_bootstrap.records; they use no exec,
      eval, compile, __import__ or importlib, start no process, open no network connection, call no model, open, write
      or remove no file, read the clock nowhere, and hold no assert in src (bandit B101). Before each commit the added
      text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, each count 0, and the file names with
      the same patterns and the records executors' pre-push pattern (D-282). The CI steps at the task's commits report
      no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit, as TASK-006's AC9 lists them.
  - AC8: >-
      Tests, with this rule-to-test list, each rule with at least one passing and one failing case, all in memory: R1
      AC1 (each new key allowed for decision.execution; the same keys still unknown for decision.acceptance and
      record.added; next_task_state and a random key still unknown); R2 AC2 (each checked form, one good and one bad
      value each; engine_identity with code_sha256 given and null, a missing or extra key, a bad python version; the order and the first-value rule of outcomes_fired; an error record with decision null and no
      outcomes_fired); R3 AC3 (§9's form accepted and the record form refused for decision.execution; the record form
      still required for record.added and in check_record); R4 AC4 (the existing tests run unchanged by
      tests/run_tests.py). Unit tests in tests/unit/test_records_execution.py. Property tests
      (tests/property/test_records_execution_properties.py; standard library only, fixed seeds; INV-005's
      property_test): for random well-formed execution records with the §9 keys, check_decision gives no finding; for
      random payloads of every other event type and for random acceptance decisions, check_decision, check_payload and
      check_log give no finding on well-formed values and the same rule names as before on the same corruptions
      (reading: no copy of the old module is loaded; the comparison is with the rules as test_records_properties.py
      generates them); removing
      or corrupting any checked key's form gives a finding named for that key.
