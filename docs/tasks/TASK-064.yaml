acceptance_criteria:
  - AC1: >-
      The record's form in records.py (spec 2 :181-183). read_paths joins RECORD_KEYS. A new check_read_set(record,
      where='record'), called from check_record after check_audit_copy, gives findings whose rules all begin
      "6.2:read_set": for a record whose evidence_type is observed_read_set, when fact_kind is not observation, when
      source_class is not deterministic_tool_local, when subject is not "TASK-" followed by digits, when read_paths is
      missing, when read_paths is not a list of
      non-empty strings with no repeat by exact string equality (an empty list is of form), and for each of session,
      outcome, gate, blocking_kind, dimension, commit and intent_versions that it carries; and for a record of any other
      evidence_type, or with none, that carries read_paths. A record that carries neither read_paths nor the name gets
      none of these findings. The values are the writer's statements and are not checked beyond their form (spec 2
      :182); no path form is checked (spec 2 §10 point 13); how the recorder names the adapter and the session, in words,
      is not checked (a limit). The module's docstring states these rules beside the audit
      copies' and that check_record no longer refuses read_paths as an unknown key.
  - AC2: >-
      Nothing else changes in records.py. Every other function, constant and finding of records.py is unchanged; the
      diff of records.py adds read_paths to RECORD_KEYS, adds check_read_set and its constants, adds its call in
      check_record and its docstring paragraph, and changes no other line. Every existing test passes unchanged (GOV-003),
      and a property test shows that over generated records carrying neither read_paths nor the name, check_read_set
      gives no finding and no finding of check_record has a rule beginning "6.2:read_set". That the other findings are
      the base's is shown by the unchanged existing tests and by the diff, not by a test that loads the base's copy (a
      limit).
  - AC3: >-
      The ids. record_ids(task_id, session_id) returns (event_id, record_id) with event_id
      "observed-read-set/" + task_id + "/" + session_id and record_id event_id + "/record"; it raises nothing and returns
      None for a task_id that is not "TASK-" followed by digits or a session_id that is not a non-empty string with no
      whitespace or "/". The docstring states that a second observe for the same task and session gives "duplicate"
      with the same list and the writer's refusal "conflict" with another (eventlog.py:180-184), so the log holds at
      most one such record per task and session_id, and that two session_ids for one session are not found (a limit).
  - AC4: >-
      The record. build(task_id, session_id, read_paths, recorder) gives None when any argument is out of form
      (record_ids None, read_paths not a list of non-empty strings, recorder not a non-empty string holding session_id
      verbatim), else a new mapping with exactly record_id (from record_ids), fact_kind "observation", source_class
      "deterministic_tool_local", recorder claude_code.RECORDER + claude_code_channel.RECORDER_JOIN + recorder (TASK-063's
      form, claude_code.py:89, claude_code_channel.py:103), subject task_id, evidence_type
      "observed_read_set" and read_paths, the given list with each repeat after its first occurrence removed by exact
      string equality, order kept; records.check_record gives no finding for it. The given list is never changed. No
      path is normalised, resolved, case-folded or checked against the root, the write-set or the disk.
  - AC5: >-
      observe(context, read_paths, now, append=None) returns a mapping with exactly result, reason, findings, record and
      core. In order, the first that applies gives the result: context findings (claude_code_channel.context_findings)
      give "refused", reason "context"; now not a timezone-aware datetime in UTC with whole seconds gives "refused",
      reason "now"; record_ids giving None for the context's task_id and session_id (a session_id holding "/", which
      TASK-063's context allows) gives "refused", reason "session_id"; build giving None gives "refused", reason
      "read_paths"; otherwise one call of append(root,
      "record.added", record, event_id, now, recorder, task_id=task_id, fencing_token=fencing_token), append defaulting
      at call time to writer.append_event, with the context's root, task_id, fencing_token and recorder; result
      "written" when its result is "appended", "duplicate" when it is "duplicate", else "refused" with reason "core"
      (the writer's fence refusal among them, reason "fence" in core); core holds the append result's result, reason,
