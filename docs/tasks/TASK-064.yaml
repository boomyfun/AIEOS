# Task contract TASK-064, the core side of the observed read-set record (Master Plan revision 4, §4 M5; concept line
# 945, "record the observed read-set"; specification 5 revision 3, sections 7 and 11 points 4 and 7; specification 2
# revision 6, section 6.2 :180-185 and section 10 point 13).
# Revision 0, drafted under decision D-1281 (candidate (1), C1 and C2); brought for approval in its own request; whether
# it is approved is recorded in the decision files, not in this file. Fields and value forms follow specification 2
# §5.1 and the contract of TASK-063. Readings marked "(reading)" are the worker's, for the decision agent's ruling;
# values marked "(filled by script)" are written by script from the base just before commit C.
# Task type: implementation. What it adds:
# - records.py (TASK-001, extended by TASK-029 for the audit copies) gets the form rules of specification 2 revision 6
#   for a record of evidence_type observed_read_set and for the key read_paths (spec 2 :181-183, "The record checker
#   applies these form rules once a task extends it"), in the audit copies' pattern (records.py:41-48, :83-85,
#   :315-344): read_paths joins RECORD_KEYS, and a new check_read_set(record, where) is called from check_record.
# - A new module src/aieos_bootstrap/read_set_record.py, called only by its tests, with record_ids(task_id,
#   session_id), build(task_id, session_id, read_paths, recorder) and observe(context, read_paths, now, append=None),
#   which writes one observed read-set record for the session through the core's writer (INV-004).
# claude_code.py, claude_code_hook.py, claude_code_channel.py, adapter.py, violation.py, eventlog.py and writer.py are not
# changed.
# The interface (specification 5 §11 point 7), as this task states it:
# - The context: TASK-063's context, checked by claude_code_channel.context_findings unchanged (TASK-063 AC1): root,
#   task_id, session_id, fencing_token, write_set, allowlist and recorder; this task uses root, task_id, session_id,
#   fencing_token and recorder, and the other two only through that check. The session is tied in words, by a recorder
#   that holds session_id verbatim (TASK-063 :16-20), and by the ids below; the lease by fencing_token.
# - The event (spec 2 :185, "whether that event is a lease holder's action"): settled here as a lease holder's action
#   (reading): the record is added by one record.added event with task_id the task and the context's fencing_token, so
#   the writer's fence (writer.py:209-224; eventlog.append) accepts it only from the session that holds the task's
#   lease; a token that is not the held lease's gives the writer's fence refusal, recorded by the writer as its own
#   record, and nothing else. So the caller passes the read-set before the lease is released (before adapter.end, and
#   before a violation releases it).
# - The ids: event_id and record_id are derived from the task and the session, not given by the caller:
#   "observed-read-set/<task_id>/<session_id>" and that text followed by "/record". So a second call for the same
#   session with the same list gives eventlog's "duplicate" (nothing appended, no error), and with another list gives
#   eventlog's refusal "conflict" (eventlog.py:180-184): at most one record per task and session is held by the log
#   (spec 2 :183's limit, here checked mechanically for one task and one session_id; two session_ids for one session,
#   or one session_id over two tasks, are not found: a limit).
# - The paths: read_paths is the caller's list; the core removes a repeated path by exact string equality, keeping the
#   first occurrence's order, before writing (spec 2 :182). No path is normalised, resolved or checked against the
#   root, the write-set or the disk: the form stays open (spec 2 §10 point 13, for the contract of spec 5 §11 point
#   8), so each path is the writer's statement, recorded and not checked. The list may be empty.
# - Left open, stated as limits: how reads are gathered across hook calls (state across hook processes; the hook
#   process's task, part CC-3's neighbour, the owner's for placing hooks, A51 item (4)); which tools a hook covers
#   (spec 5 §11 point 8; DEF-0076); abnormal session ends (spec 5 §11 point 10: a crash or an expired lease may leave no
#   record); the path form (spec 2 §10 point 13).
# What such a record shows (spec 2 :184, stated in the docstring): a lower bound at best; a missing record proves
# nothing; it is kept and not used: having no outcome and no dimension it meets no evidence entry, blocks nothing, is
# no gate result and has nothing to re-verify; specification 3 takes the observed source only from a measured runtime
# of tier T3 or above, and no runtime is measured (C6, P-LOC), so the read-set stays an estimate.
# Limits (carried at acceptance): C6 and P-LOC unmeasured; every limit TASK-061 to TASK-063 carried; the session tie in
# words only; a record never delivered is lost; DEF-0080's points stay with claude_code_channel.py, which is not
# changed.
# Deferred items: DEF-0076, DEF-0077, DEF-0078 and DEF-0080 stay open. Follow-up named, not taken: the specification 3
# alignment of its lines 25 and 29 to specification 2 revision 6 (D-1281 C4).
# Risk: high (risk rules revision 6, §2 point 3: R3 matches every path under src/** and tests/**), computed over the
# base by script before commit C. GOV-003: every path of the write-set is an evaluator path by the workflow's pinned
# list, by script; change class critical_cr, as for TASK-060 to TASK-063, ruled at acceptance. records.check_record is
# called by the governor, the evaluation path, conformance, drift, ac_coverage, ac_tests and verification_records, so
# a change to it changes what they accept as a record of form (reading: their results change only for records carrying
# read_paths or the name observed_read_set, which are refused today; every other record gets the findings it got
# before, AC2; such a record has no outcome, dimension, gate or commit, so it meets no evidence entry and no drift
# rule). Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture
# [deterministic_rule], functional [integration_test], security [static_security_analysis] and architecture [ai_review
# (cross-model)], plus the evidence_required of the applicable articles. Reviews: five way-2 reviews on Sonnet 5.5, a
# Claude model other than the implementer's (Opus 5.5), never Fable (the owner's words of 2026-10-17); and the decision
# agent's own reviews: INV-003's human_review, OPS-002's human_review and the cross-model half, each its own record
# (D-1148 Q2).
# Records: in the readable form, as TASK-063's; per-entry coverage checked by script before the acceptance request
# (L-0022), and the governor's evaluation over the records reported (D-1098).
# Naming (D-544 Q3): every test of the new test modules names the AC ids it stands for as "TASK-064 ACn" in its own
# docstring.
# Evaluation path (A61; as TASK-019 to TASK-063): commit C changes only docs/tasks/TASK-064.yaml and has one parent equal
# to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-064" and no e-mail address in its message, go to
# task/TASK-064 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011; GOV-001, GOV-004 to GOV-006
# and SEC-003 (no path of the write-set meets them). INV-004 applies: the module writes only through the core's writer.
# Owner-kept acts: none. No hook placed, no matcher chosen, no Claude Code setting, nothing measured, nothing under
# .github/ or .claude/, no push of its own; it weakens no evidence requirement; so its acceptance is one delegated
# approval of the decision agent (Master Plan section 6).
task: TASK-064
contract_version: v1
task_type: implementation
objective: >-
  Add the core side of the observed read-set record (concept line 945; specification 5 §7; specification 2 revision 6
  §6.2) in standard-library Python 3. records.py checks the form of a record of evidence_type observed_read_set and of
  the key read_paths, as specification 2 :181-183 gives it. A new module src/aieos_bootstrap/read_set_record.py gives
  record_ids(task_id, session_id), build(task_id, session_id, read_paths, recorder) and observe(context, read_paths,
  now, append=None): observe checks TASK-063's context, builds one record from the paths the adapter passes, repeats
  removed, and adds it by one fenced record.added event through the core's writer; it writes nothing else. With unit,
  integration and property tests in tests/unit/test_read_set_record.py, tests/unit/test_records_read_set.py,
  tests/integration/test_read_set_record_store.py and tests/property/test_read_set_record_properties.py, each test
  naming its AC ids in its own docstring.
