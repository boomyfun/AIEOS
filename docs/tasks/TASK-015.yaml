acceptance_criteria:
  - AC1: >-
      The parameters and results (TASK-007 AC1; F-a). append keeps its signature: log, event_type, payload, event_id,
      appended_at, and the keyword parameters task_id, fencing_token, corrects, lease, recorder and record_id, each
      None by default; recorder and record_id are used only to build AC7's refusal record. For arguments of the forms
      TASK-007's AC1 names, append returns one of "appended", "duplicate" or "refused" (reasons log, conflict, event,
      log_after, fence) and raises no ValueError for an absent, empty or non-string recorder or record_id; the TypeError
      for a log that is not bytes, and the RuntimeError of TASK-007's AC5, are unchanged.
  - AC2: >-
      Duplicate and conflict first (TASK-007 AC2; F-a). The log check of TASK-007's AC1 and then the event_id check of
      its AC2 come before anything that looks at recorder or record_id: a retried event already on the log gives
      "duplicate" (or "conflict") whether or not recorder and record_id are given, a retried task.submitted among
      them.
  - AC3: >-
      The fence and its record (TASK-007 AC6 and AC7; F-a, F-b; choice (r1) of the header). An event that needs a lease
      (it carries a fencing_token, or it is a task.submitted) and passes TASK-007's AC3 is refused with reason "fence"
      when it names no task_id (a finding "fence: the event names no task_id, so no lease can be on its task"), or when
      the lease findings of TASK-007's AC6 are not empty; nothing of the event is appended. The refusal carries the
      record of TASK-007's AC7, unchanged in its keys and values, when the event names a task_id and recorder and
      record_id are non-empty strings; otherwise it carries no record, and its findings hold one more line saying
      which input is missing: "fence: no refusal record, the event names no task_id" or "fence: no refusal record,
      recorder and record_id are not both non-empty strings". A lease-needing event that passes the fence is appended
      whether or not recorder and record_id are given. Every other reason and every other rule of TASK-007's AC1 to
      AC12 is unchanged.
  - AC4: >-
      The tests of F-d (DEF-0032), in tests/unit/test_eventlog.py. The test test_true_and_one_are_not_the_same is
      renamed test_an_extra_payload_key_is_a_conflict, its body unchanged. New tests: a retried task.submitted whose
      payload has compensating 0 where the logged one has false gives "conflict" (false against 0 kept apart by the
      sameness text, as True against 1 is); a lease whose token counter is True against an event's 1, and one whose counter is 1.0 against
      1, each give "fence"; a payload that is not an object gives "event"; a lease whose expires_at has a non-zero UTC
      offset gives "fence" (TASK-007's AC6: a timezone-aware UTC datetime); a retried task.submitted already on the log
      whose lease has since expired gives "duplicate". Changed expectations, listed as such (none appends more than
      before): test_recorder_and_record_id_are_required_for_a_lease_event (it expected ValueError) becomes a test that
      a fence-refused submission without them gives "fence" with no record and the finding of AC3, and that a
      lease-holding submission without them is appended; test_a_lease_event_naming_no_task_is_an_event_refusal (it
      expected "event") becomes test_a_lease_event_naming_no_task_is_a_fence_refusal, expecting "fence", no record and
      AC3's finding. A new test shows AC2: a retried logged task.submitted without recorder and record_id gives
      "duplicate". No other existing test line changes.
  - AC5: >-
      Every other test as on main passes unchanged: tests/integration/test_eventlog_log.py,
      tests/property/test_eventlog_properties.py, and the tests of records, governor, conformance, the runner, the
      Resume Check and recovery (all forbidden). A change that only a change to a forbidden file would make pass is a
      spec_conflict and the task escalates.
  - AC6: >-
      Purity and the CI checks (INV-001, INV-002, INV-003, INV-004). The module and its tests use no exec, eval,
      compile, __import__ or importlib, start no process, open no network connection, call no model, open, write or
      remove no file, read the clock nowhere, hold no assert in src (bandit B101), and name no project-state directory
      in src/; the tests build every input in memory. The module's imports are unchanged. The CI steps at the task's
      commits report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit, as TASK-006's AC9 lists them.
  - AC7: >-
      Limits, stated as such: no code writes the bytes append returns; no local store holds leases; whether a caller
      records every refusal is the caller's (the writer task); a "fence" refusal whose record cannot be built (no
      task_id, or recorder and record_id not both non-empty strings) carries no record: a narrowing of TASK-007's
      AC7, chosen as (r1); F-c, F-e, F-f, F-h and F-i stay open in DEF-0032; every
      existing module and test not in the write set is unchanged, and if one can pass only by a change the task
      escalates (needs_out_of_scope_change).
  - AC8: >-
      The added text. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0; the file names are scanned with the same patterns and the records executors'
      pre-push pattern (D-282).
  - AC9: >-
      Tests, with this rule-to-test list, each rule with at least one passing and one failing case, all in memory: R1
      AC1 (no ValueError for an absent, empty or non-string recorder or record_id; the TypeError for a log that is not
      bytes); R2 AC2 (a retried logged submission without recorder and record_id gives duplicate; with another payload,
      conflict); R3 AC3 (no task_id gives fence with no record; no lease, another task, another token and an expired
      lease, each with recorder and record_id given, give fence with the record, and each without them give fence with
      no record and the finding; a valid lease without them appends); R4 AC4 (the F-d cases); and the property of
      INV-009 unchanged in tests/property/test_eventlog_properties.py (forbidden, run as is). tests/run_tests.py,
      unchanged, runs all groups.
