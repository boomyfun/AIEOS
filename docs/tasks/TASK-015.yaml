# Task contract TASK-015, the event log's append rules: departures F-a and F-b of TASK-007 resolved (Master Plan
# revision 3, §4 M3; DEF-0030 and DEF-0032; specification 2 §5.1). Revision 0, drafted under decisions D-399 and D-401
# (C1), brought for approval in its own request; whether it is approved is recorded in the decision files, not in this
# file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-009. Readings marked
# "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it changes: src/aieos_bootstrap/eventlog.py's function append, so that the two
# departures of TASK-007's code from its contract's text, recorded at TASK-007's acceptance (decision D-328; DEF-0032
# F-a and F-b), are resolved before the event log's writer (DEF-0030, TASK-016), append's first caller, is contracted;
# and tests/unit/test_eventlog.py, with the test changes F-d names. Shape (P) of decision D-313 is kept: the module
# stays pure; it opens no file, reads no clock and starts no process.
# TASK-007's text, as accepted (docs/tasks/TASK-007.yaml), and how this task meets it:
# - AC1 lists append's parameters as "the log …, the event's type, its payload, its event_id …, the append time …, and,
#   when they apply, task_id, fencing_token, corrects and lease", and its results as "appended", "duplicate" or
#   "refused" with one of the reasons log, conflict, event, log_after and fence. The code also takes recorder and
#   record_id and raises ValueError, before anything is decided, when an event that needs a lease lacks them (F-a).
#   After this task append raises no ValueError for them: every call with arguments of the forms AC1 names gives one of
#   AC1's results. recorder and record_id stay keyword parameters, used only for AC7's record (AC1 here).
# - AC2: "When a line of the given log has the same event_id, the result is "duplicate" … if the line's type,
#   payload, task_id, fencing_token and corrects equal the new event's …; otherwise "refused" with reason
#   "conflict"". Today a retried submission already on the log raises when recorder or record_id is absent, instead
#   of "duplicate" (F-a). After this task the duplicate and conflict decisions come before anything that looks at
#   recorder or record_id, so AC2 holds for every call (AC2 here).
# - AC6: an event that needs a lease "is appended only when the lease given is a lease on the event's task_id whose
#   token equals the event's token and whose expiry is after the append time. No lease, another task, another token,
#   or an expiry at or before the append time gives the result "refused" with reason "fence" … A task.submitted
#   event without a fencing_token gives the result "refused" with reason "fence"." Today a lease-needing event that
#   names no task_id gives reason "event" (F-b), and one without recorder or record_id raises (F-a). After this task
#   both give "refused" with reason "fence": with no task_id no lease can be "a lease on the event's task_id"
#   (reading), and the absence of recorder or record_id does not change the fence's answer (AC3 here).
# - AC7: "A "fence" refusal also carries the payload of the record.added event that records it: an observation record
#   … subject the task id, refers_to the refused event's event_id, and a recorder and record_id the caller gives
#   (reading)". The record can be built only when the event names a task (its subject) and the caller gives recorder
#   and record_id. Choice argued against AC6 and AC7 (decision D-401 C1): (r1, chosen) a "fence" refusal whose record
#   cannot be built carries no record and a finding that says why; AC6's result is then met for every call, AC7's
#   record is carried whenever its inputs exist, and nothing is appended either way (fail closed). (r2, not chosen)
#   keep raising for a missing recorder, after the duplicate check: AC2 would hold, but AC6's "refused" would still
#   not be met for such a call, and the writer would have to catch an exception for a submission that is merely
#   refused (decision D-401, against S1-alt). (r3, not chosen) build the record with a placeholder recorder: a record
#   with a recorder no caller gave would break B5's rule that every record carries its real recorder. Under (r1) the
#   caller that must record every refusal (specification 1 §8: "The refusal is recorded as an observation") gives
#   recorder and record_id; TASK-016's contract will require its writer to give them always (stated, not tested here).
# F-d (DEF-0032): the test named test_true_and_one_are_not_the_same tests an extra payload key, not True against 1;
# it is renamed, and the cases DEF-0032 lists as untested are added (AC4 here). F-e (AC11's limits asserted "as
# such") is not taken: it is a test of TASK-007's limits text, not needed for the writer; it stays in DEF-0032. F-c,
# F-f, F-h and F-i stay in DEF-0032 as they are.
# Readers of the changed paths (D-263 C3's practice): eventlog.append is called by recovery.py (TASK-009), which always
# gives task_id, recorder and record_id on lease-needing events and builds observations itself (its AC3), and by the
# tests of eventlog and recovery; recovery's tests must pass unchanged (AC5 here). records.py is not changed. The
# deterministic_rule step and the GOV-003 step read every file under src/ and tests/.
# Risk: high. R2 matches src/** and tests/** (medium); R3 read fail closed matches them too, the append rules being
# the fence that limits authority (spec 1 §8; risk rules section 2 point 3); no path of the write set meets R10
# (.aieos/) or R11 (tests/conformance/**); the highest wins. Profile (assurance-model.md §5, gov-AIEOS, high):
# functional [unit_test], architecture [deterministic_rule], functional [integration_test], security
# [static_security_analysis] and architecture [ai_review (cross-model)], plus the evidence_required of the applicable
# articles. Dimensions are named as TASK-006's records name them (decision D-181, reading R-dim).
# Change class: critical_cr (computed, not asserted: GOV-003's tool part over the base, run by script, marks both
# paths as evaluator paths, src/aieos_bootstrap/** and tests/unit/** on the workflow's pinned list; decisions D-383 and
# D-391 ruled the same reading). The module is not an evaluator part named by DM A29 (no validator, fixture, scenario,
# runner or governor); the change is judged by the base version of every evaluator part.
# Reviews (as TASK-009's): five way-2 reviews by a Claude model other than the implementer's, each under a decision of
# the decision agent (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002; governance
# ai_review for GOV-003; operational ai_review for OPS-003; the cross-model half, which also covers INV-009's rule),
# and three decision-agent reviews (architecture human_review for INV-003, which also checks that the tests cover
# INV-009's rule; operational human_review for OPS-002; the cross-model half). Each way-2 review record's basis names
# every article whose entry it covers and addresses each of their rules, beyond what the tool parts decide. Each
# reviewer's prompt is self-sufficient, with the scratchpad's absolute path in its first line (D-277), and names for
# testing: the choice (r1) and its finding text; that no existing expectation is loosened except the two changed
# expectations and the one rename AC4 lists; that no assert stands in src (bandit B101, D-325).
# Evaluation path (A61; as TASK-007 to TASK-009): the approved contract is committed on main as its own commit C, which
# changes only docs/tasks/TASK-015.yaml and has one parent equal to base_commit, and is pushed normally; the files are
# drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's commits,
# each carrying the trailer "AIEOS-Task: TASK-015" and no e-mail address in its message, go to the branch
# task/TASK-015 on GitHub, each push under its own decision of the decision agent after a secret scan and a dry run
# against a bare single-branch copy (D-229, D-274), never by force and never deleting; the CI channel runs on each push
# and its records are re-fetched into docs/records/TASK-015.jsonl; main receives the task only at its acceptance, by a
# fast-forward under its own decision. Before each task commit, the added text is scanned with the workflow's SEC-001,
# SEC-002 and OPS-003 patterns (AC8).
# Not applicable: OPS-001 (scope: the repository's refs; the task changes no ref); INV-005 to INV-008, INV-010 and
# INV-011 (their scopes, the decision engine, the governor, evidence records and the policy, meet no path of the
# write-set; the module emits no decision and judges no evidence); GOV-001, GOV-004 to GOV-006 and SEC-003 (their
# scopes, the concept file, the bound artifacts, the decision matrix, the records and pre-genesis documents, and
# .github/, meet no path of the write-set). INV-009 (scope: the event log) is applied as a reading, as in TASK-007: no
# path of the write-set is an event log, but this module is where its rule is made, so its tests carry the rule.
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own (CR-002 part 4 limit 5 does not apply).
# Uncovered and stated limits (AC7): no code writes the bytes append returns; no local store holds leases; whether a
# caller records every refusal is the caller's (TASK-016); F-c, F-e, F-f, F-h and F-i stay open in DEF-0032; every
# review is by AI of one vendor.
task: TASK-015
contract_version: v1
task_type: implementation
objective: >-
  Change src/aieos_bootstrap/eventlog.py's function append so that the two departures of TASK-007's code from its
  contract's text (DEF-0032 F-a and F-b) are resolved: append raises no ValueError for a missing recorder or record_id,
  decides duplicate and conflict before anything that uses them, and gives "refused" with reason "fence" for an event
  that needs a lease and names no task_id or lacks them, carrying the refusal's record whenever the event names a task
  and the caller gives recorder and record_id, and a finding that says why when it does not; with the test changes and
  additions DEF-0032's F-d names, in tests/unit/test_eventlog.py. Every other rule of TASK-007 is unchanged, records.py
  is unchanged, and the module stays pure.
