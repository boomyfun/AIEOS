# Task contract TASK-060, the T0 manual adapter (Master Plan revision 4, §4 M5; specification 5 revision 3, sections 2,
# 4 and 11 points 9 to 11; specification 2 revision 5, section 6.2; assurance-model.md section 2).
# Revision 0, drafted under decision D-1179 (Q2 (1) to (6), C2); brought for approval in its own request; whether it is
# approved is recorded in the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and
# the contracts of TASK-051 and TASK-052. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Revision 1, under decision D-1180: its edits (a) to (d).
# Task type: implementation. What it adds: a new module src/aieos_bootstrap/t0.py, the T0 manual adapter (specification 5
# section 4: tier T0, "Chat", "Chỉ post-hoc" [AIEOS-concept.md:649]): a human or a chat session does the work and nothing
# is observed while it runs. Its session flow (section 11 point 9): start, through adapter.start (TASK-051), which runs
# the Resume Check and on CONTINUE or CONTINUE_WITH grants the lease; then the agent's declared claims, what it says it
# did and the read-set it estimates (AIEOS-concept.md:483), each passed to the core as one record.added record with
# fact_kind claim and source_class agent_declared, appended by the core's writer (writer.append_event) with the session's
# fencing token, never written by the adapter (INV-004; specification 5 line 19); then the submission, through
# adapter.submit (TASK-025's path); then the end, through adapter.end (TASK-028's release and the session's close).
# Violations are found afterwards by the gates (specification 3 section 8; specification 4's G0), never while running.
# The record form (D-1179 Q2 (2)): specification 2 revision 5 section 6.2's existing keys only, checked at main by
# records.check_payload('record.added', ·) with no finding for record_id, fact_kind claim, source_class agent_declared,
# recorder, subject, evidence_type and basis (SP/tools/claim_form60.py of session ee32c9d8: 0 findings for a claim and
# for a read-set estimate; the proposed key `session` of section 6.2 is not in records.py's RECORD_KEYS and gives an
# unknown-key finding, so the session is named in the recorder's words and not as a key; reading). records.py is not
# changed, so DEF-0071's items do not come in.
# What a claim proves (assurance-model.md:22, as specification 5 line 42 cites it): nothing. A claim record carries no
# outcome, no dimension, no gate, no stands_for, no decision_ref and no models, so it meets no evidence entry
# (governor-spec.md §4 rule 3 counts a record only with outcome pass in the entry's dimension) and blocks nothing (rule 4
# needs outcome blocking); the evidence that counts comes only from the gates afterwards (specification 5 line 42).
# Point 10 (an abnormal session end; D-1179 Q2 (3)): in scope only as section 2 item 5's fallback: if the caller never
# calls end, the lease's expiry releases it; t0 adds nothing for a crash, an expired lease or a resume after compaction,
# and states this as a limit. Point 11 (T0's conformance scenarios; D-1179 Q2 (4)): not in this task; carried as a named
# follow-up, a fixture task of its own.
# Limits (carried at acceptance): the claims are an agent's statements, recorded and not checked; the read-set is an
# estimate (AIEOS-concept.md:483) and is never the observed source (specification 5 section 7; specification 3 takes
# the observed source only from a measured runtime of tier T3 or above); no adapter declaration exists for any runtime
# (specification 5 section 3); t0 neither reads nor writes one, and what check 7 gives is the Resume Check's
# (resume_check.py, unchanged by this task); specification 5 section 11 point 14 carries the marker "lifted by the owner
# (DM A69)"; t0 is called only by its tests, and no other caller is added before a later task names one; no hook, no
# Claude Code setting, no measurement.
# Readers of the changed paths (D-263 C3's practice): tests/unit/test_writer.py's R8 test and tests/unit/test_gitread.py's
# subprocess test read every module of src/ and keep passing. No existing module imports t0.
# Risk: high (risk rules revision 6, §2 point 3: R3 matches every path under src/** and tests/**), computed over the base
# by script (SP/tools/risk_class60.py at 377c2920: "task risk class: high"). GOV-003: every path of the write-set is an
# evaluator path by the workflow's pinned list (SP/tools/gov003_class60.py: "GOV-003 evaluator change: yes (4 of 4
# paths)", all added). Change class critical_cr, computed by script and read as for TASK-053 (gov003_class60.py: "GOV-003
# evaluator change: yes (4 of 4 paths)"); the approval form is ruled at acceptance. Profile (assurance-model.md §5, gov-AIEOS,
# high): functional [unit_test], architecture [deterministic_rule], functional [integration_test], security
# [static_security_analysis] and architecture [ai_review (cross-model)], plus the evidence_required of the applicable
# articles. Reviews: five way-2 reviews on a model other than the implementer's: Opus 5.5 by the owner's configuration,
# and, for a task that Opus 5.5 implements, Sonnet 5.5, one of the two models the owner preferred at :1071 of session
# c52ac282, as decision D-1157 took it; and the decision agent's own reviews: INV-003's
# human_review, OPS-002's human_review and the cross-model half, each its own record (decision D-1148 Q2).
# Records (D-1179 Q2 (6); DEF-0074 (iii)): in the readable form, as TASK-059's: every observation carries the commit and in
# intent_versions the mapped version of every entity of input_state.intent_versions, as the self-build's script
# map_versions.py (revision r2, SHA-256 d2cbb635c910720487b6c62ca15082319a6008ac1a27c5b5f218b814f33debb1) gives it; an
# applicable article's entry is recorded under the article's id as the record's dimension, one record per entry. Its
# coverage is checked by a per-entry script before the acceptance request (L-0022), and the governor's evaluation over
# the records is reported (decision D-1098).
# Naming (D-544 Q3): every test of the new test modules names the AC ids it stands for as "TASK-060 ACn" in its own
# docstring.
# Evaluation path (A61; as TASK-019 to TASK-059): commit C changes only docs/tasks/TASK-060.yaml and has one parent equal
# to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-060" and no e-mail address in its message, go to
# task/TASK-060 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (decision contracts as the
# governor reads them, acceptance, evidence and the policy meet no path of the write-set); GOV-001, GOV-004 to GOV-006 and
# SEC-003 (the concept file, the bound artifacts, the decision matrix, the records and pre-genesis documents, and
# .github/, meet no path of the write-set). INV-004 applies: the module writes only through the writer's functions.
# INV-009 applies through the writer, which this task does not change.
# Owner-kept acts: none. No hook, no Claude Code setting, nothing under .github/, no push of its own; it weakens no
# evidence requirement; so its acceptance is one delegated approval of the decision agent (Master Plan section 6).
task: TASK-060
contract_version: v1
task_type: implementation
objective: >-
  Add the T0 manual adapter in standard-library Python 3. A new module src/aieos_bootstrap/t0.py gives start(...),
  claim(...), submit(...) and end(...): start, submit and end pass through to adapter.start, adapter.submit and
  adapter.end (TASK-051) with t0's own argument checks; claim(root, task_id, session_id, fencing_token, claims, event_id,
  recorder, now) builds, for each declared claim, one record with fact_kind claim and source_class agent_declared, checks
  it with records.check_payload('record.added', ·), and appends it through writer.append_event with the session's fencing
  token, so the writer's fence is the one check. With unit, integration and property tests in tests/unit/test_t0.py,
  tests/integration/test_t0_session.py and tests/property/test_t0_properties.py, each test naming its AC ids in its own
  docstring; the tests use stand-ins for the writer's functions and write no file.
