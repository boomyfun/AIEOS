constitution: [INV-001, INV-002, INV-003, INV-004, INV-009, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The arguments. Before anything is called: root a non-empty string; task_id "TASK-" followed by digits; session_id
      and recorder non-empty strings; fencing_token (for claim, submit and end) a mapping with exactly epoch (a non-empty
      string) and counter (an int, not a bool, at least 0); event_id a non-empty string; now a timezone-aware datetime in
      UTC with whole seconds; claims a non-empty list of at most 100 mappings, each with exactly kind ("did" or
      "read_set") and text (a non-empty string of at most 2000 characters with no line break). A wrong argument gives the
      result of AC5 with result "refused", reason "argument" and a finding naming it, and no function is called. The
      called functions are keyword arguments defaulting, at call time, to adapter.start, adapter.submit, adapter.end and
      writer.append_event; the module keeps no state.
  - AC2: >-
      The claim records. For the claim at position i (counted from 1) claim builds exactly the keys record_id (event_id
      followed by "/claim-" and i), fact_kind claim, source_class agent_declared, recorder (t0.RECORDER, 'the T0 manual
      adapter (aieos_bootstrap.t0)', followed by ", session " and session_id, and ", for " and recorder), subject task_id,
      evidence_type ("agent_claim" for kind "did", "read_set_estimate" for kind "read_set") and basis (the text). It
      never sets outcome, dimension, gate, blocking_kind, commit, intent_versions, stands_for, decision_ref, models,
      approval_binding, risk_class or evidence_profile. records.check_payload('record.added', record) gives no finding
      for every record before any append, else "refused", reason "record", naming the position, and nothing is appended.
  - AC3: >-
      The appends. For each record in order, append(root, 'record.added', record, event_id followed by "/claim-" and i,
      now, recorder, task_id=task_id, fencing_token=fencing_token) once. No separate check of the held lease: the
      writer's fence is the one check, so a token that is not the held lease's, a lease on another task, an expired lease
      or no lease gives reason "fence" at the first append, with the writer's refusal record in the log, and no later
      record is appended. A WriteResult other than "appended" or "duplicate", or a raised exception, stops the call with
      reason "append" and the position. "duplicate" (the same event_id given again) is no error, so a repeat of a
      completed call gives "done", every event_id under duplicate, nothing appended.
  - AC4: >-
      start, submit and end. t0.start(root, task_id, session_id, holder, inputs, code_sha256, expires_at, recorder, now),
      t0.submit(root, repo, commit_id, task_id, event_id, recorder, now) and t0.end(root, task_id, session_id,
      fencing_token, now) check their arguments as AC1 and TASK-051 AC1 to AC4 do, call the adapter's function once with
      the given functions, and return its result unchanged under "core" in AC5's form, with decision, fencing_token and
      released copied out as TASK-051 AC5 does; an adapter result "refused" gives "refused", reason "core". t0 makes no
      fence comparison and no acceptance or execution decision of its own (specification 5 lines 24 and 26).
  - AC5: >-
      The result. Each function returns a mapping with exactly the keys result ("done" or "refused"), reason (None or one
      of "argument", "record", "fence", "append", "core"), findings (a list of texts), appended (the event_ids appended,
      in order), duplicate (the event_ids the writer gave "duplicate"), core (the adapter's result, or None), decision,
      fencing_token and released (each copied from core, or None). An exception raised by a called function is caught
      and becomes a result with the step's reason; none escapes.
  - AC6: >-
      What a claim proves (assurance-model.md:22; specification 5 line 42). Over a log that holds the task's records of
      AC2 and nothing else, governor.evaluate, called as evaluation.evaluate_task calls it, counts none of them for any
      evidence entry and lists no blocking record; the test asserts that adding claim records to a log changes no entry
      the governor counts as met. The module's docstring states that a claim is an agent's statement, recorded and not
      checked, that the read-set is an estimate and never the observed source, and that the evidence that counts comes
      only from the gates afterwards.
  - AC7: >-
      Limits, stated in the module's docstring and carried at acceptance: point 10 only as section 2 item 5's fallback
      (no end means the lease's expiry releases it; nothing for a crash, an expired lease or a resume after compaction);
      no adapter declaration read or written (specification 5 section 3), so check 7's STOP: runtime insufficient applies
      as the core decides it; T0's conformance scenarios not in this task (a named follow-up fixture task); the session
      named only in the recorder's words, since records.py has no `session` key (specification 2 section 6.2's proposed
      key; a later task); t0 called only by its tests; __init__.py not changed. Every existing module is unchanged, and if
      one can pass only by a change the task escalates (needs_out_of_scope_change).
  - AC8: >-
      Purity and the CI checks (INV-001 to INV-004). t0.py imports only the Python 3 standard library and aieos_bootstrap's
      adapter, records and writer. It starts no process except through the adapter's submit (gitread.run), opens no file,
      reads no clock or environment, builds no event-log line itself, and makes no network or model call; no exec, eval,
      compile, __import__ or importlib; no assert in src (bandit B101); no string that names the project-state directory;
      tests/unit/test_writer.py's R8 test and tests/unit/test_gitread.py's subprocess test pass unchanged. At the task's
      commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC9: >-
      Its own tests and the added text. Every test function of the three new test modules names the AC ids it stands for
      as "TASK-060 ACn" in its own docstring; no other task's AC is named in qualified form. No existing test is changed
      (GOV-003). Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns,
      and each count is 0; the file names are scanned with the same patterns and the records executors' pre-push pattern
      (D-282). The tests write and remove no file.
  - AC10: >-
      Tests, each rule with at least one passing and one failing case, with stand-ins for the writer's and the adapter's
      functions bound to the real signatures (inspect.signature(...).bind): R1 AC1 (each wrong argument refused before any
      call; the defaults at call time); R2 AC2 (the keys and values of both kinds; no forbidden key; a record that
      check_payload refuses gives "record" with no append); R3 AC3 (the order; each with the token; a refusal or exception
      at each position stops there; a foreign, stale or expired token and no lease each give "fence" with the writer's
      refusal record, over the real append_event logic through eventlog.append with an in-memory log and held lease; a
      repeat of a completed call gives "done", all duplicates, nothing appended); R4 AC4 (the pass-throughs and their
      argument checks); R5 AC5 (the keys; no exception escapes); R6 AC6 (an end-to-end session in an integration test:
      start over the real adapter, execution.execute and resume_check.check with in-memory stand-ins built on
      eventlog.append, reaching CONTINUE with the Resume Check inputs that TASK-051's tests supply for it
      (tests/unit/test_replay.py:155-184, inputs(): a READY task, matching contract hashes, a done dependency, an
      applicable article not violated, the intent versions current, and for check 7 the input runtime {'adapter':
      'an-adapter', 'max_risk': 'high'} with the contract's risk medium, an input of the test and not a declaration
      file), then claim with the granted token, then end, and governor.evaluate over the resulting records counting no
      claim; and the same session with the runtime input absent, where check 7 gives STOP: runtime insufficient, start
      grants no lease and claim with any token gives "fence");
      R7 AC7 and AC8 (a script check of the imports and of the absence of open, write, subprocess, clock and environment
      calls, and of the docstring's words); and a property test (standard library only, fixed seeds) that two claim calls
      over equal inputs give equal records and equal logs, and that no generated claim list gives a record with outcome,
      dimension or gate. tests/run_tests.py, unchanged, runs them.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC10]}
  - {gate: G3, check: constitution, args: [AC7, AC8, AC9, INV-001, INV-002, INV-003, INV-004, INV-009, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
