  - .gitattributes
  - .gitignore
constitution: [INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The reference document. `python tests/unit/test_export_reference.py --root tests/conformance` reads every .py file
      of <root>/fixtures and <root>/fixtures_rc (a folder named exactly `__pycache__` passed over; any other entry that
      is not a .py file fails closed) with pathlib's read_bytes only, unwraps each with
      aieos_bootstrap.conformance.unwrap, and for each case calls aieos_bootstrap.governor.evaluate(request, inputs,
      records) (fixtures/) or aieos_bootstrap.resume_check.check(inputs) (fixtures_rc/), each argument a deep copy, as
      aieos_bootstrap.conformance.run_scenario and _run_rc_cases call them. It prints to standard output, through
      sys.stdout.buffer, the bytes of aieos_bootstrap.conformance.canonical_text of one object whose keys are
      "<folder>/<file stem>" (30 keys) and whose values are the lists of that file's case records in case order. RISK-01
      is not in it.
  - AC2: >-
      The closed placeholder list (decision D-794 C2). In every record that has engine_identity.python, its value is
      replaced by the text "<engine>" before the document is built; no other value is replaced. A test makes
      aieos_bootstrap.resume_check._python_version return another value (by patching, restored after), builds the
      document again, and asserts that the set of value paths that differ is exactly {engine_identity.python} in the
      Resume Check records and that, after the placeholder, the two documents are byte-equal.
  - AC3: >-
      Byte identity (decision D-814 Q3). The module holds the constant REFERENCE_SHA256, the SHA-256 of the document at
      the task's commit. A test builds the document twice in one process and asserts byte equality, no CR byte, ASCII
      only and a final LF, and that its SHA-256 equals REFERENCE_SHA256. `--root tests/conformance --check` prints the
      document as AC1 and exits non-zero, printing nothing to standard output and its message to standard error, when
      the document's SHA-256 differs from REFERENCE_SHA256; the whole document is built before the single write. The
      module's docstring states that a later task changing the governor's or the Resume Check's decision code, or a
      frozen fixture of round 1, changes this pin, pin-only, with one exact new value.
  - AC4: >-
      The compare (decision D-814 C3). `--compare <a> <b>` reads both files with read_bytes and exits 0, printing
      nothing, when they are byte-equal; otherwise exits 1, printing to standard error the first key (and case index)
      whose canonical text differs, or "not a reference document" when a file is not one object of lists in the
      canonical form. Unit tests cover equal documents, a one-byte difference, a missing key, an extra key and a
      malformed input, each on texts held in memory, the file-reading part on a path that does not exist; no file is
      made.
  - AC5: >-
      Fail closed. The command line is the export only when the first argument is `--root` or `--compare`; otherwise
      the module is the test runner. A missing or extra argument, a missing folder, an entry that is not a .py file, a
      file unwrap refuses, a case whose call raises, or a record that is not an object exits non-zero and prints nothing
      to standard output. Tests cover each case on texts and folders held in memory (no file made), and one test runs
      the export over the real folders, read only, and checks 30 keys and 32 case records (acc_13 has 3 cases, every
      other file 1).
  - AC6: >-
      The workflow step (A66; decision D-814 C4). In each of the two jobs of .github/workflows/aieos-bench.yml, one step
      named "reference export (bootstrap decisions over the frozen fixtures)" is added right after the fixture export
      step, running `$PY tests/unit/test_export_reference.py --root tests/conformance --check >
      "$RUNNER_TEMP/reference.json"` and then `wc -c "$RUNNER_TEMP/reference.json"`; nothing else in the file changes:
      no trigger, permission, secret, token, `uses:`, port step or comment line other than the header's revision line.
      The earlier tests of tests/unit/test_export_fixtures.py (TASK-039 AC1 to AC3 and AC6) pass unchanged over it.
  - AC7: >-
      Advisory only. Nothing in the workflow writes a record the governor or the existing CI reads; the existing
      workflow .github/workflows/aieos-checks.yml is unchanged, byte for byte, and so are its two pins.
  - AC8: >-
      The allow-list (decisions D-774, D-814 C4). tests/integration/test_conformance_rc_set.py changes only by adding
      'tests/unit/test_export_reference.py' to the OTHERS tuple that not_allowed reads (the tuple's closing line may be
      rewrapped to hold it), because the module names the RC fixture folder; nothing else in it changes. The risk
      folder is not named by the module, so tests/integration/test_conformance_risk_set.py is not changed.
  - AC9: >-
      Purity and the CI checks (INV-001 to INV-003). The module imports only copy, hashlib, io, json, sys, unittest,
      unittest.mock, pathlib and aieos_bootstrap (its conformance, governor and resume_check modules); it runs no
      process and no model, reads no network, clock or environment except its arguments, and writes nothing; its only
      output is standard output and standard error. At the task's commits the existing CI steps report no finding: G0
      scope, deterministic_rule, OPS-003, SEC-001, SEC-002, SEC-003's record and bandit. Before the first push, the
      added lines are scanned for the bandit test patterns the CI applies, as in TASK-039 AC9; the scan is a stated
      limit, the CI's bandit run is the evidence.
  - AC10: >-
      Naming and its own tests. Every test function names "TASK-041 ACn" in its own docstring; a naming test reads the
      loaded TestCase classes' docstrings. tests/run_tests.py is unchanged; running it loads the module only as a unit
      test and runs no export. Every earlier test passes; if any can pass only by a change outside the write-set, the
      task escalates (needs_out_of_scope_change).
  - AC11: >-
      Stop conditions. If any step needs a secret, a token, write access, money or a setting, the task stops and the
      point goes to the owner (A66, fail closed).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 600k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
