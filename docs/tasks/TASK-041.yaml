# Task contract TASK-041, the stack benchmark's reference export (Master Plan revision 4, §4 "The benchmark and the
# stack ADR"; docs/plan/m4-exit-review.md §6, line 70: "byte-equal decision records required"; decisions D-794 C2,
# D-795 C4 and D-814; DEF-0063).
# Revision 0, drafted under decisions D-794 (C2), D-795 (C4), D-813 (NEXT) and D-814 (C2 to C4); brought for approval
# in its own request; whether it is approved is recorded in the decision files, not in this file. Fields and value forms
# follow specification 2 §5.1 and the contracts of TASK-007 to TASK-040. Readings marked "(reading)" are the worker's,
# for the decision agent's ruling.
# Task type: implementation. What it adds: the bootstrap's own decision records over the frozen conformance fixtures of
# round 1, in the canonical form, as one JSON document that each language port of the benchmark must print byte for
# byte (the reference). It reads the governor fixtures (tests/conformance/fixtures/, 19 files) and the Resume Check
# fixtures (tests/conformance/fixtures_rc/, 11 files) itself, as bytes with pathlib, unwraps them with
# aieos_bootstrap.conformance.unwrap (no import of another test module and no file write, which the CI channel's
# deterministic_rule refuses under tests/; decision D-773), calls aieos_bootstrap.governor.evaluate and
# aieos_bootstrap.resume_check.check exactly as the conformance runner calls them, and prints the document to standard
# output. It lives with its tests in one module, tests/unit/test_export_reference.py, as TASK-039's export does. RISK-01
# (tests/conformance/fixtures_risk/) is left out of round 1, since the derivation derive_inputs is not ported in round 1
# (decision D-794 Q1); stated as a limit.
# The placeholder list is closed (decision D-794 C2; D-814 Q2): exactly one path, engine_identity.python of the Resume
# Check's records, written as the fixed text "<engine>" by the reference and by every port; nothing else is replaced
# (record ids are compared as they are). Byte identity (D-814 Q3): the module pins the reference document's SHA-256;
# every later task that changes the governor's or the Resume Check's decision code, or a frozen fixture of round 1,
# must also change this pin, as a pin-only change with one exact new value (conformance-files.md section 8 (i) reading),
# and its contract must say so.
# The workflow change (A66, its own decision; D-814 C4): .github/workflows/aieos-bench.yml gains, on both jobs, one step
# after the fixture export that runs the reference export into the job's temporary folder and its --check; nothing
# else in the file changes (no trigger, permission, secret, token or `uses:` change); the compare of a port's output is
# added by each port task under its own A66 decision (D-814 Q4; D-767 C1). The workflow's first run with the new step
# is at the landing on main (its trigger includes the workflow file) and is read as a check after acceptance, not as
# evidence of it, as TASK-039's first run was.
# Limit: the workflow's trigger paths are not changed (TASK-039's test pins them), so a later change to this module or
# to the bootstrap's decision code alone does not run the Windows check; the Linux unit_test step of aieos-checks.yml
# checks the pin at every push, and a change to a trigger path or the owner's dispatch runs both jobs.
# What it is not: the benchmark's results are advisory (A31) and never feed the governor's gates, the existing CI
# channel's records or any evidence entry (A29). The existing workflow .github/workflows/aieos-checks.yml and its two
# pins are not touched. No port is written here; bench/ is not touched.
# Risk: critical, and change class critical_cr, each to be computed over the base by script (the scripts of TASK-040
# with only the write-set and the header line changed): .github/** is R9 (critical); tests/** is R2 (medium) with R3's
# fail-closed reading (high); all three paths are evaluator paths of GOV-003's pinned list.
# Profile (assurance-model.md §5, gov-AIEOS, critical): high's entries plus architecture [human_review], met for
# gov-AIEOS by the decision agent's review, and functional [the property/fuzz entry]; the cross-model entry by the pair
# of reviews (a way-2 review and the decision agent's separate review). Five way-2 reviews from built briefs on a model
# other than the main session's, the decision agent's reviews, one delegated approval (reading, as TASK-039).
# Naming (D-544 Q3): every test this task adds names the AC ids it stands for as "TASK-041 ACn" in its own docstring.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-041.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-041", go to task/TASK-041 under their own decisions; main receives the
# task only at its acceptance. (reading) The first task-branch push's conformance base run is RISK-01's first CI run
# over the risk rules policy v4 (decision D-814); it is read by its run id and recorded in DEF-0063.
# Not applicable: OPS-001 (no ref changed by the task's code); INV-004 to INV-008 and INV-010 to INV-011 (no project
# state, decision engine, governor, evidence record, replay or policy path in the write-set; the module calls the
# governor and the Resume Check read only); GOV-001, GOV-004 to GOV-006 (no path of theirs in the write-set). SEC-003
# applies (a .github/ path), under A66 as above.
# Owner-kept acts: none, on these conditions: the changed workflow grants no write, uses no secret or token, changes no
# repository or security setting and costs nothing (public repository, hosted runners); if any of these is not so, the
# task stops and the point is the owner's (CR-002 part 4 limit 5), fail closed.
task: TASK-041
contract_version: v1
task_type: implementation
objective: >-
  Add tests/unit/test_export_reference.py: run as a script with --root tests/conformance, it prints to standard output
  one JSON document holding the bootstrap's own decision records for every case of the 19 governor fixtures and the 11
  Resume Check fixtures, in the canonical form, with the one closed placeholder; with --check it also verifies the
  document against a pinned SHA-256; with --compare it compares two documents byte for byte; it fails closed on any
  other input; with its unit tests. Add one step to each job of .github/workflows/aieos-bench.yml that runs it into the
  job's temporary folder and checks it, and name the module in the allow-list of the RC fixture folder's earlier test.
  Nothing else changes; the results are advisory and feed nothing.
traces_to:
  - docs/plan/m4-exit-review.md#6
  - docs/plan/master-plan.md#4
  - docs/specs/conformance-files.md#2
  - docs/pre-genesis/constitution.md#SEC-003
