  # base_commit is the `main` commit on top of which the approved contract is committed as its own commit C, changing
  # only docs/tasks/TASK-041.yaml; G0 requires C's one parent to equal base_commit. It is filled by script from
  # refs/heads/main just before C is made: the placeholder and its quotes are replaced by the 40-hex id, unquoted.
  base_commit: 1121c235d8a55729f3631570e292e633ef152ada
  depends_on: [TASK-039, TASK-040]
  intent_versions:
    docs/plan/m4-exit-review.md: 6c41ca8200a4e757f04b22aa521e52cd67f7ac3122690e667ac4c864aa57c4a4
    docs/plan/master-plan.md: 8276a587bbf6f75be8867feb97df6726379babfcdb2266344bfdb4d01e6b2d23
    docs/pre-genesis/constitution.md: 9b396c3c0f31d3a3fbccf9433cf81eb820b6e0f0a3a7d099e2899043abfe1f5a
    docs/specs/risk-rules-gov-aieos.md: e33397c6c6a6ff92b6a355be54c3464bd0cc915f04424902f0a8be7e72abe57b
    docs/specs/conformance-files.md: 2f1c224466fe3657167b116b49f902648130bf76e1274367d7780cc38ec7b021
write_set:
  # One added path and two modified paths.
  paths:
