      The pins, the line shift and the order of landing. This task changes no path under .github/ and no pin; it does not touch tests/integration/test_launcher_repo.py (:19 and :124 compare the CI's pinned hash with the hash of the file at the fixed commit f216376e, which does not change; its docstring at :120 becomes a historical statement and is left as it is). The history copies of the old hash (docs/tasks/TASK-086.yaml:485, docs/tasks/TASK-117.yaml:36, docs/plan/bench-port-brief.md:14, DEF-0124:15) stay unchanged. The line shift of M2: every line of resume_check.py after :41 moves up by 2; src/aieos_bootstrap/claude_code_channel.py:23 ("resume_check.py:290, :405", which will stand at :288 and :403) and its pin tests/unit/test_claude_code_channel.py:307 stay unchanged (outside the write_set); after acceptance the stale citation is recorded as a new DEF entry (one line), as its own decision, and does not grow into new scope. Order, each step its own decision: contract C' on main (a docs-only commit before the P0 to P1 window of D-4920 C5); the task commit X on the branch task/TASK-120 (never to main first) and the branch CI read (the pin check of aieos-checks.yml:1064 runs only on main, :1034; the branch's base run compares the base's unchanged file with the unchanged pin and passes); the acceptance; then the A66 step P0 (a workflow-only commit that empties AIEOS_PINNED_RESUME_CHECK, no AIEOS-Task trailer, D-4920 C4); then X and the records commit land on main by one fast-forward with the one trailer (aieos-checks.yml:1055; with the pin empty :1064 and :1146 do not fire); then the CI read on main; then the A66 step P1 (a workflow-only commit that sets the pin to the SHA-256 of the new resume_check.py, after a conformance base-run notice whose "base resume check file" equals that value with RC-01 to RC-11 PASS and outcome pass, D-4920 C6). From P0 until P1 the only pushes to main are TASK-120's landing, its records and a push that produces the P1 evidence (D-4920 C