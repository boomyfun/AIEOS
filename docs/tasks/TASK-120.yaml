  - AC3: >-
      No side effect, and what the old import did. The contract's facts record, with file:line, that the name `records` is not used in resume_check.py, that importing records.py only builds constants, regular expressions and lambda tables, that nothing reads `resume_check.records`, and that the one test requiring the import is changed by AC2(b). The acceptance request repeats the Greps of C3 of D-4920 unedited (`aieos_bootstrap.records`, `resume_check.records`, `sys.modules`, `getattr(` aimed at resume_check) over src and tests, each hit explained. The one observable difference is that importing resume_check no longer imports records.py as a side effect; every module that needs records imports it itself (the Greps show it), and the full test suite is the evidence.
