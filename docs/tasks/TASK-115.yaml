acceptance_criteria:
  - AC1: >-
      The statement. run_task(..., owner_kept_act=None): with None the written contract ends with owner_kept_act: true, byte-equal to the pre-change output of the same call (a golden string: the whole text that run_task writes for one fixed call, a module constant GOLDEN_RUN_CONTRACT in tests/unit/test_cli_run.py, compared with the text of one fixed call by a test named in the AC1 docstrings, captured by running the unchanged code before the change is made). The template tail _RUN_TAIL (launcher.py:1688-1705) ends with the line owner_kept_act: %(kept)s, and the fill at launcher.py:1893 gains the key kept, whose value is the text true unless the statement is the text false; _run_contract (launcher.py:1885) gains the parameter for the statement and its call at launcher.py:1959 passes it. With the text false and source_class decision_agent the contract ends with owner_kept_act: false and nothing else in the text differs from the true case. Any other value (the boolean false, true, True, the text true or False, an empty text, a number), or the text false with source_class human_authority, is refused with reason argument before the clock, the log, any write or any append. The text false is also refused, with reason argument at the same step, when any path of write is under .github/ or is docs/pre-genesis/measurement-protocol.md, each compared without regard to case (D-4508 C3; constitution SEC-003 and OPS-002 route those paths by path rule); without the statement, write is checked exactly as before. Tests first: one refusal test for a path under .github/ and one for the measurement protocol, each with the statement false and source_class decision_agent, each named AC1 in its docstring. Tests first, in tests/unit/test_cli_run.py (where run_task is tested; AC1 named in each docstring). run_task refuses independently of the parser (defence in depth): the keyword is checked in run_task itself, at the argument step (the call at launcher.py:1929; _run_argument_findings keeps its signature).
  - AC2: >-
      The flag. aieos run takes --owner-kept-act <value> at most once, anywhere among the flags; the only value accepted is false. The flag is optional: it is validated outside the required-flag check of cli.py:255 (set(values) != set(allowed) would otherwise make every run without it a usage error). _parse returns a ninth element, the statement (None or the text false), with its docstring (cli.py:207-210) and the unpack at cli.py:660 updated; _intent_run (cli.py:633) gains the parameter owner_kept_act (default None), the call in _run (cli.py:693) passes it, and cli.py:638 passes owner_kept_act to run_task as a keyword only when it is not None; the test stub (tests/unit/test_cli_run.py:741, Stand.__call__(self, *args)) is extended with **kwargs recorded in the attribute self.kwargs, apart from the positional calls, so that the pins at :789 and :793 keep comparing the positional tuples unchanged. The parser itself refuses a repeat, a missing value, any other value, the flag on any command but run, and the flag with --class human_authority: each gives exit 2 and USAGE, with neither the clock nor run_task called (as --class is refused today, cli.py:257). The usage line gains the flag and the parser description at cli.py:11-16 and the run description name it; the pin at tests/unit/test_cli_run.py:952-953 on the run USAGE is updated; the run line of USAGE (cli.py:141-142) becomes exactly python -m aieos_bootstrap.cli run <task> <intent> --root <path> --class <decision_agent|human_authority> --by <decision id or name> [--owner-kept-act false] [--write <path>]... [--json] as one logical line, written in the source as the concatenated literal of cli.py:141-142; the pin at test_cli_run.py:952-953 is a concatenated string that quotes the new line from run on, and the wrapping of the source literal is free. Absent, run behaves as before. Tests first, in tests/unit/test_cli_run.py.
  - AC3: >-
      The two paths meet. A contract made by run with --class decision_agent --owner-kept-act false is accepted by approval_act for a decision_agent approval; the same contract made without the flag is refused by approval_act ("owner_kept_act: a decision_agent approval of a task whose owner_kept_act is set is refused"), as today. After the change, a decision_agent approval of such a contract makes the task READY (spec 7 :32 and the transition at spec 1 :65) and a lease may then be granted on it (spec 1 :78); only the governor stays owner-routed, and only through the conversion gap, which is not a control. governor.py's reading is unchanged (kept = ... is not False), so the governor's evaluation of a run-made contract stays owner-routed until the conversion gap is closed by its own task. Finding of the survey addendum (t115/survey.md section 7): base_inputs._parse_contract_text yields plain text (no booleans), the governor expects the boolean False in its contract mapping, and no code in src/ turns a contract file's text into that boolean (the verified chain, read in the files: governor.derive_inputs is called by evaluation.evaluate_task at evaluation.py:374 and by verification_records at verification_records.py:106 and :109 (record_evaluation, :142); both take the whole values mapping, whose 'contract' the caller supplies, and the one src caller that reaches evaluate_task is the conformance harness at conformance.py:1456, which passes ev['values'] and ev['contract_text'] from a fixture case; the mappings with a 'contract' key that src/ builds from parsed text are base_inputs.py:723 and resume_inputs.py:298, which are for the resume check and carry the parsed text; no src code builds the values['contract'] of evaluate_task or record_evaluation from a contract file's text; the other builders are tests and the scratchpad records makers); this task adds, in tests/unit/test_cli_run.py, a test that run's written text reads as the text false by base_inputs' parser and the absent flag as the text true; it does not change the governor and records nothing of the gap (the DEF candidate is written after acceptance, see AC6).
  - AC4: >-
      The stale texts, the replacements being those ruled in D-4581 as revised by D-4588 and D-4589 (meaning fixed, line wrapping free), each given as the whole new sentence in the form "OLD sentence (as at base_commit) => NEW sentence", the new sentence being what enters the file: (1) cli.py:67 "As shipped, launch starts no runtime: starting one stays the owner's (spec 7 :35)." => "As shipped, launch starts no runtime; who decides starting one, and building a starter, is set by specification 7 :35."; (2) cli.py:83-84 "it drafts nothing: reading the repository and drafting the proposals are a launched session's, the owner's." => "it drafts nothing: reading the repository and drafting the proposals are a launched session's."; (3) cli.py:90-91, the paragraph of import (the sentence just before it: "... and a raise in _render_import "cli: a step raised <type>"."), "It is not run on any real project: its real use is the owner's, asked separately." => "Its use on a real project is not decided by this text." (the new pinned phrase is is not decided by this text; the pin at tests/unit/test_cli_import.py:649 changes to it); (4) cli.py:94 "it drafts nothing: doing the change or drafting the proposal set is a launched session's, the owner's." => "it drafts nothing: doing the change or drafting the proposal set is a launched session's."; (5) cli.py:102-103, the paragraph of run (the sentence just before it: "... and a raise in _render_intent_run "cli: a step raised <type>"."), "It is not run on any real project: its real use is the owner's, asked separately." => "Its use on a real project is not decided by this text." (the pin at tests/unit/test_cli_run.py:945 changes to is not decided by this text); (6) cli.py:114-115 "Nothing runs this module but its tests and the owner's own use." => "Nothing runs this module but its tests and its uses on a real project, each decided on its own."; (7) cli.py:176 NO_STARTER "launch: no runtime starter (a runtime is started by the owner; specification 7 :35, DEF-0101)" => "launch: no runtime starter is shipped (specification 7 :35, DEF-0101)" (the docstring keeps the phrase no runtime starter); (8) launcher.py:3-4 "It starts no runtime: no process but through gitread, no hook placed, no setting changed; running `aieos launch` with a runtime stays the owner's (DM A51 item (4))." => "It starts no runtime: no process but through gitread, no hook placed, no setting changed; who decides running `aieos launch` with a runtime, and building a starter, is set by specification 7 :35."; (9) launcher.py:232-233 "Reading the repository and drafting the proposals are a launched session's, and every launch is the owner's." => "Reading the repository and drafting the proposals are a launched session's, and every launch is decided as specification 7 :35 says."; (10) writer.py:25-26 "No caller in the core yet; ``.gitignore`` is not changed here (carried to the task that first creates a real project-state directory)." => "Its callers are the core's modules (every write of the project-state directory goes through it); ``.gitignore`` is not changed here." Items (3), (5) and (6) are the docs fix of docs/Progress/2026-11.md:96 for cli.py only and say nothing about who decides; items (1), (8) and (9) only point to specification 7 :35 (D-4588 and D-4589 revised the D-4581 wording, which had named DM A73 in the code: A73 is a row of the matrix that does not name aieos import or aieos run, and who decides is not written in code); no claim of authority enters the code, and specification 7's own text stays carried. The implementer reads each old sentence at base_commit before editing and stops if it differs from the quoted one. The pins that follow are updated in the same commit and named in the commit message: tests/unit/test_cli_run.py:945 and :952-953, tests/unit/test_cli_import.py:649 (test_cli_launch.py:546/:552 pin the phrase no runtime starter, which the docstring keeps; :412 compares against cli.NO_STARTER by name). No code