  - AC5: >-
      Evidence and CI. The class is critical: the critical profile of assurance-model section 5 as for TASK-114 (unit_test is this task's own tests in tests/unit; integration_test and property_test are met by the existing tests under tests/integration and tests/property that the CI runs unchanged, which stay forbidden to this task, as TASK-114.yaml:61 says of its own evidence (unit_test and integration_test), its forbidden list being at :35-51; deterministic_rule, static_security_analysis, ai_review cross-model by a way-2 review of the diff and tests on Haiku 5.5, functional property_test, architecture human_review by a second decision_agent_review that is not the cross-model half). The task commit X is pushed to refs/heads/task/TASK-115 first; the CI runs there must show G0 detect: task TASK-115 (DEF-0115); then X goes to main. GOV-003 for the changed tests is met by the base-tests control or recorded as a stated departure in the TASK-103 form. The task's own session does not push (the capabilities forbid it). The pushes (the contract commit C to main; X to refs/heads/task/TASK-115; X to main; the records R; the docs D; the end records H) are made by the worker outside the task session, each its own decision of the decision agent, as for TASK-114. The change loosens approval_act's effective refusal for run-made contracts as the Authority header says; this is stated in the decision that approves the contract. The cross-model pair is a way-2 review on Haiku 5.5 of the diff and the tests and a separate decision_agent_review for the architecture entry, both bound to the evaluated commit; the way-2 record names the implementer's model, the model of the session that makes the task commit (expected claude-sonnet-5-5) and the reviewer's model (Haiku 5.5), and if the reviewer's model equals either of the other two the pair counts nothing and the task stops (as TASK-114.yaml:61).
  - AC6: >-
      Limits. It writes no file but through the writer; it starts no runtime; it adds no flag besides --owner-kept-act; it does not run `aieos run` on any project; the first docs-only core run, spec 7 revision 11 with row F83 and the logs' lasting place are their own steps (spec 7 revision 11 with row F83 and the conversion-gap DEF candidate are a docs commit after this task is accepted, each its own decision, as TASK-114.yaml:63 did; no docs path is in the write set).
