# Task contract TASK-115, r7 (session bdca08a6; r0 a new file in the layout of TASK-114.yaml r6, r1 by Edit of a copy of r0 under D-4581 C2 (reviewed by R115c1), r2 by Edit of a copy of r1 under D-4583 C3 (the R115c1 findings; reviewed by R115c2), r3 by Edit of a copy of r2 under D-4586 (the R115c2 findings); r3b by Edits of a copy of r3 under D-4587 (reviewed by R115c3); r4 by Edits of a copy of r3b under D-4588 (the R115c3 findings); r5 by Edits of a copy of r4 under D-4589 (the AC4 launch items made neutral); r6 by Edits of a copy of r5 under D-4594 (the write-path refusal of D-4508 C3, missing from r0 to r5, and this line); r4, r5 and r6 not reviewed by any model after R115c3; r7 = r6 with the fifteen intent_versions values filled by fill115.py under D-4594). Whether this text is approved is recorded only in the decision agent's decision that names its SHA-256, not in this file. The keys follow TASK-114.yaml: task, contract_version, task_type, objective, traces_to, input_state (base_commit, depends_on, intent_versions), write_set, read_set, forbidden, constitution, acceptance_criteria, capabilities, risk, autonomy, verification_plan, exit_conditions, owner_kept_act.
# Why: D-4508 ruled route (C') for the first core run: P1 (TASK-114, accepted, on main) lets CI read a contract the core wrote, P2 (this task) lets `aieos run` write owner_kept_act false on an explicit statement of the caller and removes the stale texts, then the first docs-only low core run (D-4509 C3, D-4580). Facts read (file:line, main 6e376b6f): launcher.py:1704 (_RUN_TAIL writes owner_kept_act: true), :1913 (run_task), :1461-1464 (approval_act refuses a decision_agent approval unless the contract reads owner_kept_act: false); governor.py:586 (kept = ... is not False); cli.py:638 (the one call site), :209-260 (the flags); the stale texts in t115/survey.md section 4.
# Risk: critical. The write set holds paths of the GOV-003 evaluator lists ('src/aieos_bootstrap/**', 'tests/unit/**'); R3 gives src/** and tests/** high at least; D-4580 sets critical when a write-set path is an evaluator path. Change class: critical_cr.
# Authority. The change is a self-build change under DM A51/A66 and the decision agent's decisions (the purpose set for P2 by D-4508). It adds a way to write owner_kept_act: false, and writes it only on a literal statement of the caller; it changes no default (without the statement the field stays true). The statement is refused when the write set holds a path under .github/ or the measurement protocol (D-4508 C3), so those owner- or A66-routed paths never get a run-made contract reading false. The governor and approval_act are not changed, but the change LOOSENS approval_act's effective refusal for contracts made by run: after it, a contract made by run with --class decision_agent --owner-kept-act false passes a decision_agent approval, which today it cannot (every run contract reads true). The class is the caller's statement and is not checked (cli.py:154), as everywhere. The consequence in plain words: a decision_agent approval of such a contract makes the task READY (spec 7 :32 says a task is READY only once approved; the transition DRAFT to READY is only when every dependency is DONE, spec 1 :65), and a lease may then be granted on it (spec 1 :78). Only the governor stays owner-routed (governor.py:393-396; governor.py:586 needs the boolean False and the contract text is the text false), and only through the conversion gap of survey section 7; that is not a control and is not counted as one. The decision that approves this contract says this in plain words (SEC-003 form).
# Route (DEF-0115): the task commit X goes to refs/heads/task/TASK-115 on the remote before main; no record cites a CI step unless its run log shows G0 detect: task TASK-115.
