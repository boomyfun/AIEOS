  Let `aieos run` write owner_kept_act: false into the contract it makes only when the caller states it: add the keyword owner_kept_act (default None) to launcher.run_task and the flag --owner-kept-act to the run command; the only value accepted is the text false; the flag is accepted only with --class decision_agent; every other case, and the flag absent, writes owner_kept_act: true exactly as before. Replace the stale texts named in the survey (cli.py, launcher.py, writer.py) with true ones. No other behaviour changes; any other finding becomes a DEF entry.
