# Task contract TASK-004, the bootstrap governor of gov-AIEOS, its first version (Master Plan revision 2, §4 M2 and §5
# points 5 and 6; the M2 work plan of decision D-195, P4 to P6; governor-spec.md). Revision 0, drafted under decisions
# D-218 C4 and D-219 C2, brought for approval as a template; whether it is approved is recorded in the decision files,
# not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-001 to TASK-003.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. Constitution GOV-002 applies: tests/conformance/** is in the forbidden set.
# Risk: high. R3 matches the governor (component tag governor; risk rules §5: "at least high" for the governor), R2
# matches src/** and tests/**; the highest wins. Profile (assurance-model.md §5, gov-AIEOS, high): functional
# [unit_test], architecture [deterministic_rule], functional [integration_test], security [static_security_analysis] and
# architecture [ai_review (cross-model)], plus the evidence_required of the applicable articles.
# Change class: critical_cr (governor-spec.md §8 point 2; D-195 P4): judged by the base version (which has no governor),
# never auto-accepted.
# Owner-kept act: true. This first version puts into force governor-spec.md §4 rule 5, "Leaving IN_REVIEW" point 4, the
# rules that set the owner-kept act input and the definitions of the owner-kept act, weakens-evidence and
# delegation-in-force inputs, which §3.2 names as "a change to who may approve what in this governor"; so its
# acceptance is the owner's (decision D-166 (ii) and C1; CR-002 part 4 limit 5; Master Plan §5 point 5), asked once
# when this version exists (O2, D-195 P6), in plain words: what the governor decides, that its decisions stay advisory,
# and that A29 cannot be met. The decision agent's reviews and the way-2 reviews are evidence; they do not approve.
# Reviews (as TASK-003's): five way-2 reviews by a Claude model other than the implementer's, each under a decision of
# the decision agent, and three decision-agent reviews, the cross-model entry met only by the pair (A59).
# Evaluation path (A61; A62, A63; as TASK-003's): the approved contract is committed on main as its own commit C,
# changing only docs/tasks/TASK-004.yaml, with one parent equal to base_commit; the task's commits, each with the
# trailer "AIEOS-Task: TASK-004", go to the branch task/TASK-004, each push under its own decision after a secret scan;
# the CI channel (workflow revision 3) runs on each push: its conformance base run reports the base (no governor), and
# its candidate run runs this governor file with every other input from the base, advisory (A29; governor-spec §10);
# main receives the task only after the owner's acceptance, by a fast-forward whose head commit carries the trailer, so
# that the base run on main runs over the landed governor (D-219 C2, review F5 (b)).
# The pin: after the landing, the job's AIEOS_PINNED_GOVERNOR is set to the SHA-256 computed from the bytes of the
# accepted src/aieos_bootstrap/governor.py, never taken from a run's annotation (D-219 C2, review F7), by a later
# workflow revision, the owner's (A61); until then the base run on main reports and does not fail (review C-F10:
# landing first, then the pin revision).
# Not applicable: OPS-001, INV-009, INV-011, GOV-001, GOV-004, GOV-005, GOV-006 and SEC-003 (their scopes meet no path
# of the write-set).
# Uncovered and stated limits (AC12): the decision records are advisory (DM label rule; governor-spec §10); the inputs of
# governor-spec §3.2 are derived only from values passed in (AC9), not from the repository's documents; the candidate
# run in the CI channel runs this governor inside the runner's process, so a candidate could forge its own result
# there, and the acceptance therefore rests also on the review pair and a local run in a clean clone (advisory), never
# on CI step conclusions alone (D-219 C2, review F1); every review is by AI of one vendor.
task: TASK-004
contract_version: v1
task_type: implementation
objective: >-
  Add the first version of the bootstrap governor of governor-spec.md revision 5: one standard-library Python 3 module,
  src/aieos_bootstrap/governor.py, whose function evaluate takes an evaluation request (specification 2 §6.5), the
  inputs of governor-spec §3.2 as values (conformance-files.md section 4) and the records it reads (specification 2
  §6.2), and returns one acceptance decision record (specification 2 §6.4) by the rules of governor-spec §4 and the
  table of §5, with the derivation of the §3.2 inputs from values, and unit, integration and property tests. It
  writes, reads and runs nothing outside its arguments, emits no execution decision, changes no fixture, runner or
  workflow, and sets no pin.
