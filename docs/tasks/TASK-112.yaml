task: TASK-112
contract_version: v1
task_type: implementation
objective: >-
  A new module src/aieos_bootstrap/metrics_report.py holds a pure function report(log) that takes an event log (bytes, bytearray or str), reads it with records.check_log, and returns a mapping with exactly the keys ok, findings, corrections_present and metrics.
  If check_log gives any finding (text or line), ok is false, findings lists them as strings and metrics is empty (fail closed: no figure from a log that is not clean). Otherwise ok is true and metrics holds the eight metrics of concept
  section 12, each as a mapping with status (mechanical, needs_judgement or no_source), the figures its definition gives, sources (event types and payload keys with file:line) and limits (plain words); a metric with status
  no_source carries no value of its own (a context count sits under its own named key, AC3). Duplicate lines (duplicate_of not None) are ignored; the function reads no clock, no file and no environment, and raises nothing but the TypeError of an argument that check_log refuses (anything but bytes, bytearray or str, records.py :812-817).
