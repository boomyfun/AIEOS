acceptance_criteria:
  - AC1: >-
      The frame. report(log) reads with records.check_log and no second parser. Any text finding or line finding gives ok false, the findings as strings (line number and finding) and metrics empty. An argument that check_log refuses (anything but bytes, bytearray or str, records.py :812-817) raises its TypeError. Lines with duplicate_of not None are skipped
      (an identical repeat; a repeat with other content is already a finding). Lines that carry corrects are counted as they stand. The report does not apply corrections, as base_inputs.py :40 does not read corrects either. Their number is reported as the top-level key corrections_present (beside ok, findings and metrics; a mapping with the number of such lines and the sorted event ids that are corrected, the corrects targets, so that a double count is visible; with ok false it is null); every metric's limits say that corrections are not applied and that a corrected and a correcting decision are both counted. Every join of an event to a task uses the envelope task_id (records.py :97); an event without a task_id is counted apart as without_task_id and is attributed to no task. The metrics are separate cuts of the same events: no figure is added to another metric's figure, and an event may appear under two metrics' names (for example a REWORK decision in caught_rate and in rework_before_acceptance). The result's key order and the metric names are fixed: caught_rate, first_pass_acceptance, drift_false_positive_rate, escaped_defects, human_time_per_task, evidence_coverage, cost_per_accepted_task, rework_rate. Each metric has the keys status, sources, limits and its own figures (AC2 to AC4). The pin scan, the first step, confirms that LineReport.event is the parsed envelope (event_id, type, appended_at, seq, task_id, payload, fencing_token, corrects) for every line without findings; if it is not, the task stops and the choice comes back to the decision agent.
  - AC2: >-
      Caught rate (status mechanical for the counts; its sub-field reason_share has status needs_judgement and no number). submissions = the task.submitted events whose payload compensating is not true. The outcome of a submission is read from the first decision.acceptance of the same task_id after it and before that task's next task.submitted, by its next_task_state (records.py :122-125; at L1 the governor never gives decision ACCEPT, governor.py :474-475, and an accepted task has decision NEEDS_REVIEW with next_task_state ACCEPTED, :476-482): blocked = REWORK, REJECTED or ESCALATED; not_blocked = IN_REVIEW or ACCEPTED, which at L1 means waiting for approval or approved, not accepted, and is split by the decision value into not_blocked_needs_review (NEEDS_REVIEW, governor.py :477) and not_blocked_insufficient_human (INSUFFICIENT_EVIDENCE whose only missing types are human ones, governor.py :470-473); undecided = no such decision; a decision whose decision is null (an error record, governor.py :232) is counted as undecided_error and is not in blocked. The headline is blocked out of submissions, with not_blocked (and its split), undecided and undecided_error beside it. violation_detected (the count of violation.detected events) and fence_refusals (the count of record.added events whose payload evidence_type is 'refused_submission', the form of eventlog.refusal_record, eventlog.py :117-122) are two further counts, never added into the headline; the pin scan confirms from eventlog.py :217-229 that a refused submission is not appended as a task.submitted, and if it is, the task stops and the choice comes back to the decision agent. compensating_submissions is a count of its own. The share of blocked
      submissions with a correct reason is reported as 'needs judgement (AI-judged, CR-002 K6), not estimated' and carries no number. First-pass acceptance (status mechanical; concept :815, every gate passed at the first submission): the denominator is the tasks with at least one non-compensating task.submitted whose first such submission has a decision.acceptance before the task's next task.submitted; the numerator is the tasks whose first decision.acceptance in that same window (after the first submission and before the task's next task.submitted) has decision NEEDS_REVIEW or ACCEPT (rows 4 and 5 of the governor, reached only when no earlier row applied, governor.py :474-477) with missing_gates, failed_gates and blocking all empty and every profile_used item's missing_types empty (governor.py :430-431, :450-455, :493-495). Tasks with no task.submitted are counted and listed (task ids sorted). Tasks whose first submission has no decision yet, and tasks whose first decision in the window has decision null (an error record, governor.py :232), are counted apart as without_decision and first_decision_error. None of these groups is in the denominator. The raw figure is reported as it is.
  - AC3: >-
      Drift, escaped defects and human time. Drift false positive rate: status no_source for the rate; drift_warning_counts (a context count under its own name, not the rate) gives the counts by event type, drift.detected and violation.detected separately (the envelope has no emitter field, so the split is by event type only; the sources name the emitters: drift.detected by scope_drift.py :68 and scope_reconcile.py :105, violation.detected by drift.py :51 and violation.py), counted apart and never summed; the same violation.detected events are also the violation_detected count of caught_rate, and the two are never added;
      the limit says that no record in the log judges a warning right or wrong. Escaped defects: status no_source, no number; the limit says that no event or record says a defect was found after DONE. Human time per task by risk: status no_source, no number; beside it, under the key human_authority_records_by_risk_class (a name that cannot be read as time), the count of record.added events whose payload source_class is human_authority, grouped by the risk class of the task (the latest risk_class audit-copy record of the task, the last in log order: a record.added whose payload evidence_type is 'risk_class', whose source_class is one of the audit-copy sources and whose subject is the task, its payload key risk_class giving the class, records.py :106-114; a task with none is grouped unknown); the limit says that in the self-build most approvals are the decision agent's, and the count is not a time.
  - AC4: >-
      Evidence coverage, cost and rework. Evidence coverage (status mechanical): for the LAST decision.acceptance of each task whose decision is not null and whose profile_used is non-empty (governor.py :450-455), a dimension is satisfied when its item has missing_types empty (records.py :126; the governor's reading is checked in the pin scan, governor.py, L-0034); the figures are the dimensions satisfied out of the dimensions required over those decisions, and the union of the payloads' uncovered lists, sorted, so that uncovered zones are listed (concept :819); a last decision with a null decision or an empty or absent profile_used is counted apart. Cost per accepted task (status mechanical for wall_seconds; its sub-field tokens has status no_source and no number; an accepted task here means a task that has a task.done): wall_seconds = appended_at of the task's first task.approved to appended_at of its task.done, for the tasks that have both (the core's UTC time, spec-01 :49), as a list per task id and the median and maximum (null for an empty set); tasks with a task.done but no task.approved, and tasks with neither done, are counted apart and excluded;
      the figure is labelled wall time that includes idle time; tokens are no_source with no number. Rework (status mechanical under its own name rework_before_acceptance): per task the number of decision.acceptance events with next_task_state REWORK since the task's last task.approved (spec-01 :73; for a task with a decision and no task.approved in the log the window starts at the first line and the task is counted in without_approved) and the total; the concept's rework rate (DONE tasks reopened or reverted) is status no_source in metric rework_rate and carries no number; the rework_before_acceptance figure is never placed in rework_rate.
  - AC5: >-
      Purity and honesty. report is a function of its argument only: no import beyond the standard library and aieos_bootstrap.records, no name open, exec, eval, compile or input, no one-argument .replace, no '.aieos' string, no clock or environment read, no write; the result is the same for the same bytes. Every no_source metric has no numeric value of its own (its value field is null); a context count (drift_warning_counts, human_authority_records_by_risk_class) sits under its own named key and is labelled a count, not the metric; every needs_judgement figure is a label, not a number; every status is one of the three words. The words MEASURED, ENFORCED and GUARANTEED do not appear in the module (OPS-003). The module docstring says in plain words: the figures are descriptive over a small self-build log, the judged parts are AI-judged under CR-002 K6 and no basis for the product's L1 default or any level, and no measurement of the trust boundary is involved (master-plan :113).
  - AC6: >-
      Pins and no write-path change. The pin scan (the first step, reads only) names every test or workflow rule that pins the list of src modules, the module docstrings or the test files; each is amended only by a contract revision. No event type is added; writer.py, eventlog.py, records.py and every write path are not touched (they are in forbidden). Tests build their logs in the test with fixed text; no test writes a file (only the three writer test files may import tempfile and sqlite3, aieos-checks.yml :1564-:1571).
  - AC7: >-
      Evidence and CI. Unit tests on synthetic logs cover each AC (a clean log of several tasks with accepted, blocked, rework and approved-done paths; a log with a finding giving ok false and no metrics; a duplicate line; a compensating submission; a task with no submission; a decision without profile_used; human_authority records with and without a risk class; a task accepted at L1 (NEEDS_REVIEW, then NEEDS_REVIEW with next_task_state ACCEPTED); an ESCALATED decision; an error decision (decision null); a line with corrects; a fence refusal record built by eventlog.refusal_record); static analysis and the deterministic rule report no finding; every job and step of aieos-checks and aieos-native succeeds on the accepted commit and on main after the records commit, read by run id; each push and each job-data read is a decision of the decision agent.
  - AC8: >-
      The records and acceptance. Per-article records through records.check_record and the governor shadow over a dry list at the approval request, with raw output; expected NEEDS_REWORK at the GOV-003 row as TASK-102 to TASK-111. GOV-003: proposed as a stated departure as TASK-102 to TASK-111; ruled at the C request on the governor shadow's raw output (the compensating controls named in D-4271; DEF-0107 points 2 to 5); the way-2 review and the reviews on Haiku 5.5 only (no other model without the owner; no Fable). Proposed DEF texts (each its own decision, not written here): a record kind that judges a drift warning (metric 3), a defect-found record (metric 4), a human-attention time record (metric 5), a token-count source (metric 7), a reopened-or-reverted event for DONE tasks (metric 8).
