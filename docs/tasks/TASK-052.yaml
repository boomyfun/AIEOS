acceptance_criteria:
  - AC1: >-
      The arguments of violation.record. Before anything is called: root a non-empty string; task_id "TASK-"
      followed by digits; fencing_token a mapping with exactly epoch (a non-empty string) and counter (an int, not a
      bool, at least 0); event_id and recorder non-empty strings; now a timezone-aware datetime in UTC with whole
      seconds; observation a mapping for which records.check_payload('violation.detected', observation) gives no
      finding, whose subject is task_id, whose source_class is deterministic_tool_local or agent_declared, and whose
      record_id is a non-empty string. A wrong argument gives the result of AC5 with result "refused", reason
      "argument" and a finding naming it, and no function is called. append and release are keyword arguments
      defaulting, at call time, to writer.append_event and writer.release_lease_token; the module keeps no state.
  - AC2: >-
      The decision record (decision D-999 point 1 and M1). Before any append, record builds one decision.execution
      payload with exactly the keys record_id (event_id followed by "/decision-record"), fact_kind interpretation,
      source_class deterministic_tool_local, recorder violation.RECORDER ('the violation path
      (aieos_bootstrap.violation)'), subject task_id, decision 'STOP: violation', outcomes_fired ['STOP: violation'],
      refers_to event_id (the violation.detected event's event_id), state_effect [] and uncovered (a list of texts
      that names the inputs a Resume Check record has and this one has not, and, when the observation's source_class
      is agent_declared, that the stop rests on a declared claim); records.check_decision('decision.execution', it)
      gives no finding, else "refused", reason "decision", and nothing is appended.
  - AC3: >-
      The order (specification 3 line 106; M2 of decision D-999). append(root, 'violation.detected', observation,
      event_id, now, recorder, task_id=task_id, fencing_token=fencing_token) once; then append(root,
      'decision.execution', the AC2 payload, event_id followed by "/decision", now, recorder, task_id=task_id,
      fencing_token=fencing_token) once; then release(root, task_id, fencing_token) once. No separate check of the held
      lease: the writer's fence is the one check. A WriteResult other than "appended" or "duplicate" for an append, or
      a raised exception, stops the call with reason "violation" or "decision" (or "fence" when the writer refused by
      the fence, its refusal record then in the log), and no later step runs. A release refused with reason "none" or
      "token" is no error: released stays None and a finding notes it (as TASK-051 AC4 and adapter.NO_ERROR_RELEASE);
      any other release result, or a raised exception, gives reason "release" (the lease's expiry is the fallback, a
      limit). "duplicate" for both appends (the same event_id given again) is no error, and the release then runs
      (idempotent: a repeat of a completed call gives "done", both event_ids under duplicate, nothing appended,
      released None).
  - AC4: >-
      The fence and its label (decision D-999 amendment 1). A fencing token that is not the held lease's, a lease on
      another task, an expired lease or no lease gives reason "fence" at the first append, with the writer's
      record.added refusal in the log, and neither the decision nor the release is attempted. That refusal's record
      carries evidence_type 'refused_submission' (eventlog.py:117-122, unchanged here), and a test asserts the label as
      it is.
  - AC5: >-
      The result. record returns a mapping with exactly the keys result ("done" or "refused"), reason (None or one of
      "argument", "decision", "violation", "fence", "release"), findings (a list of texts), appended (the event_ids
      appended, in order), duplicate (the event_ids the writer gave "duplicate") and released (the released lease, or
      None). An exception raised by a called function is caught and becomes a result with the step's reason; none
      escapes.
  - AC6: >-
      adapter.violation(root, task_id, fencing_token, observation, event_id, recorder, now, append=None,
      release=None) checks its arguments as AC1 (a wrong one gives the adapter's result of TASK-051 AC5 with reason
      "argument"), calls violation.record once with the given functions, and returns its result under "core" in the
      adapter's result form (TASK-051 AC5: result, reason, findings, core, decision, fencing_token, released), the
      decision 'STOP: violation' when the decision event is in the log after the call (appended, or "duplicate"),
      else None, released copied out; a core result "refused" gives
      "refused", reason "core". The adapter's other calls are unchanged.
  - AC7: >-
      The replay document (decision D-999 point 4). The document may carry the key violation: absent, or a mapping
      with exactly observation, event_id and at (a time text as TASK-051 AC6); every other key and form as TASK-051
      AC6. A document with a violation and a non-null submission is refused "document"; so is one whose observation's
      source_class is not agent_declared or deterministic_tool_local, or whose observation's recorder is not the
      document's recorder. With a violation, the run is: read_log, open_store and the setup as TASK-051 AC7; adapter.start;
      on a granted lease, the token comparison as TASK-051 AC7, then adapter.violation with the granted token, the
      document's event_id and at, then adapter.end with the token (end's release then finds no lease: "none", no
      error, TASK-051 AC4). A violation refused by the core gives reason "violation" and end is still called (TASK-051
      AC8). The replay result's reason gains "violation". A document without violation runs exactly as before. E1
      (decision D-987) is extended: the recorders named in the log's records are a subset of {the document's
      recorder, resume_check.RECORDER, violation.RECORDER}, violation.RECORDER only on the STOP: violation decision
      record, and every record's source_class is deterministic_tool_local, agent_declared or none.
  - AC8: >-
      Limits, stated in the three modules' docstrings and carried at acceptance: a STOP: violation does not yet make
      acceptance reject (evaluation.py:179 passes the governor only record.added payloads); violation.record is
      called only by adapter.violation, and adapter.violation only by replay and the tests, and no other caller of
      either is added before the later task that widens evaluation.py:179 is accepted; no task.* event follows
      STOP: violation, so the task stays READY (or REWORK) with no lease and the next Resume Check may CONTINUE again;
      no bound on repeated STOP: violation (specification 5 §11 point 12); the fence refusal labelled
      refused_submission (AC4); F-a kept (a caller must give replay a fresh root); a passing replay with a violation
      shows the core's handling of a recorded violation, never that any hook observes anything (C6 unmeasured); no
      observed read-set call; a run against the real writer's files not tested; __init__.py not changed. Every
      existing module other than the write-set is unchanged, and if one can pass only by a change the task escalates
      (needs_out_of_scope_change).
  - AC9: >-
      Purity and the CI checks (INV-001 to INV-004). violation.py imports only the Python 3 standard library and
      aieos_bootstrap's records and writer; adapter.py adds only violation to its imports; replay.py's imports are
      unchanged. None of the three starts a process, opens a file, reads a clock or the environment, builds an
      event-log line itself, or makes a network or model call; no exec, eval, compile, __import__ or importlib; no
      assert in src (bandit B101); no string that names the project-state directory; tests/unit/test_writer.py's R8
      test and tests/unit/test_gitread.py's subprocess test pass unchanged. At the task's commits the CI steps report
      no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC10: >-
      Its own tests and the added text. Every test function of tests/unit/test_violation.py, and every test added or
      changed in test_adapter.py and test_replay.py, names the AC ids it stands for as "TASK-052 ACn" in its own
      docstring; a TASK-051 test left unchanged keeps its "TASK-051 ACn"; no other task's AC is named in qualified
      form. No TASK-051 test is removed or weakened (GOV-003); each changed one is listed with its reason in the
      first task commit's request. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002
      and OPS-003 patterns, and each count is 0; the file names are scanned with the same patterns and the records
      executors' pre-push pattern (D-282). The tests write and remove no file.
  - AC11: >-
      Tests, each rule with at least one passing and one failing case, with stand-ins for the writer's functions bound
      to the real signatures (inspect.signature(...).bind): R1 AC1 (each wrong argument refused before any call; the
      defaults at call time); R2 AC2 (the record's keys and values; refers_to; uncovered with and without
      agent_declared; a record check_decision refuses gives "decision" with no append); R3 AC3 (the order of the two
      appends and the release, each with the token; a refusal or exception at each step stops there; a release
      refused "none" or "token" is no error; a repeat of a completed call gives "done", two duplicates, nothing
      appended, released None); R4 AC4 (a foreign, stale or expired token and no lease each give "fence" with the
      refusal record, labelled refused_submission, and no decision or release), over the real writer's append_event
      logic through eventlog.append with an in-memory log and held lease; R5 AC5 (the keys; no exception escapes); R6
      AC6 (adapter.violation's argument checks and pass-through); R7 AC7 (the document's violation forms; exclusive
      with submission; the run order with a violation; end after it with "none"; a refused violation still ends; the
      extended E1 sets over the log of an end-to-end replay over the real adapter, execution.execute,
      resume_check.check and violation.record with in-memory stand-ins built on eventlog.append; a document without
      violation unchanged); R8 AC8 and AC9 (a script check of the imports and of the absence of open, write,
      subprocess, clock and environment calls, and of the docstrings' words); and a property test (standard library
      only, fixed seeds) that two replays with a violation over equal documents give equal steps and equal logs.
      tests/run_tests.py, unchanged, runs them.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC11]}
  - {gate: G3, check: constitution, args: [AC8, AC9, AC10, INV-001, INV-002, INV-003, INV-004, INV-009, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
