# Task contract TASK-052, the violation path (Master Plan revision 4, §4 M5; specification 5 revision 3, sections 2
# item 3, 8 and 11 points 5 and 12; specification 3 revision 4, section 8 line 106 and section 10 line 154;
# specification 1 revision 2, section 5.3 line 87; specification 2 revision 4, section 6.3).
# Revision 0, drafted under decision D-999 (C2) and its amendment 1, from the scope note approved there with its
# changes M1 and M2; brought for approval in its own request; whether it is approved is recorded in the decision files,
# not in this file. Fields and value forms follow specification 2 §5.1 and the contract of TASK-051. Readings marked
# "(reading)" are the worker's, for the decision agent's ruling.
# Revision 1, under decision D-1000: E1 to E4.
# Task type: implementation. What it adds: a new module src/aieos_bootstrap/violation.py, whose record() appends, for
# the session that holds the task's lease, violation.detected with the given observation, then a decision.execution
# STOP: violation that refers to it, then releases the lease by its token (specification 3 line 106: "The core
# appends violation.detected (spec 1 §5.3) and a decision.execution with this value; the session stops and the lease is
# released"); a pass-through call adapter.violation (specification 5 §2 item 3's violation half); and an optional
# violation step in the replay document (specification 5 §8 line 81: ADV-02's fixture is written in the replay form).
# The fence (M2 of decision D-999): no separate check of the held lease. violation.detected and the decision are
# appended through writer.append_event with the given fencing token, so the writer's fence is the one check:
# eventlog.py:112-114 (_needs_lease: "An event that carries a fencing_token, task.submitted always"), :125-144
# (_lease_findings: no lease given, a lease on another task, the event's token not the lease's, a lease expired at or
# before the append time) and :210-217 (the fence applied to any event that needs a lease); writer.py:209-223 (the
# store's held lease on task_id passed to eventlog.append; a fence refusal appended as its own record.added, with the
# derived event_id of _digest('refusal', event_id)). A session that does not hold the lease therefore gets reason
# "fence", the writer's refusal record stays in the log, and nothing further runs. Known label limit (decision D-999
# amendment 1): eventlog.py:117-122 builds every fence refusal's record with evidence_type 'refused_submission', so a
# refused violation append is labelled a refused submission; eventlog.py is not changed here, and the tests assert the
# label as it is, so a later change shows.
# The decision record (point 1 of decision D-999, with its addition, and M1): built by violation.py under its own
# RECORDER, 'the violation path (aieos_bootstrap.violation)', with record_id, fact_kind interpretation, source_class
# deterministic_tool_local, recorder, subject the task, decision 'STOP: violation', outcomes_fired ['STOP: violation'],
# state_effect [] (specification 3 line 154 lists no further event), refers_to the violation.detected event's event_id
# (specification 2 §6.2: "for a record about another record, an event …: its id"; records.py RECORD_KEYS), and
# uncovered naming what it does not have (it is not a Resume Check record: no contract hash, head commit, log seq or
# checks) and, when the observation's source_class is agent_declared, that the stop rests on a declared claim; checked
# by records.check_decision before any append.
# Limits (point 6 (a) of decision D-999; carried at acceptance): "the change is rejected at acceptance" (specification
# 3 line 106) does not yet follow: evaluation.py:179 passes the governor only the task's record.added payloads, so a
# violation.detected payload never reaches governor.py's row 1 (ROW_1_KINDS, governor.py:44); widening it is a later
# task; violation.record is called only by adapter.violation, and adapter.violation only by replay and the tests, and
# no other caller of either is added before that later task is accepted. No
# task.* event follows STOP: violation (specification 3 line 154), so execution's projection leaves the task READY (or
# REWORK) with no lease, and the next Resume Check may CONTINUE again; a bound on repeated STOP: violation
# (specification 5 §11 point 12) is not addressed. F-a (decision D-988) is kept: replay needs a fresh root from its
# caller. A passing replay with a violation shows how the core records a recorded violation and stops the session,
# never that any hook observes anything (specification 5 line 80; C6 unmeasured). No observed read-set call; no hook;
# no setting; no measurement.
# Readers of the changed paths (D-263 C3's practice): tests/unit/test_adapter.py and tests/unit/test_replay.py (in the
# write-set; every changed test is listed in the first task commit's request with its reason, and none is weakened,
# GOV-003); tests/unit/test_writer.py's R8 test and tests/unit/test_gitread.py's subprocess test read every module of
# src/ and keep passing. No other module imports adapter, replay or violation.
# Risk: high (risk rules revision 6, policy v4, §2 point 3: R3 matches every path under src/** and tests/**), computed
# over the base by script. Change class normal: the governor is not touched. Profile (assurance-model.md §5, gov-AIEOS,
# high): functional [unit_test], architecture [deterministic_rule], functional [integration_test], security
# [static_security_analysis] and architecture [ai_review (cross-model)], plus the evidence_required of the applicable
# articles. Reviews as TASK-051's: five way-2 reviews on a model other than the implementer's and the main session's,
# and the decision agent's own review for the cross-model entry.
# Naming (D-544 Q3): every test of the new or changed test modules names the AC ids it stands for as "TASK-052 ACn"
# (or, for a TASK-051 test left unchanged, its "TASK-051 ACn") in its own docstring.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-052.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-052", go to task/TASK-052 under their own decisions; main receives
# the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (decision contracts as
# the governor reads them, acceptance, evidence and the policy meet no path of the write-set: the execution decision
# record written here is checked by records.check_decision, unchanged); GOV-001, GOV-004 to GOV-006 and SEC-003 (the
# concept file, the bound artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no
# path of the write-set). INV-004 applies: the modules write only through the writer's functions. INV-009 applies
# through the writer, which this task does not change.
# Owner-kept acts: none. No hook, no Claude Code setting, nothing under .github/, no push of its own; it weakens no
# evidence requirement; so its acceptance is one delegated approval of the decision agent (Master Plan section 6).
task: TASK-052
contract_version: v1
task_type: implementation
objective: >-
  Add the violation path in standard-library Python 3. A new module src/aieos_bootstrap/violation.py gives
  record(root, task_id, fencing_token, observation, event_id, recorder, now): it checks every argument and builds and
  checks the STOP: violation execution decision before any call, then appends violation.detected with the observation
  and the given fencing token through writer.append_event, then the decision.execution that refers to it with the same
  token, then releases the lease through writer.release_lease_token by that token. src/aieos_bootstrap/adapter.py gains
  violation(...), a pass-through to violation.record with the adapter's argument checks. src/aieos_bootstrap/replay.py
  takes an optional violation step in the replay document, exclusive with a submission. With unit, integration and
  property tests in tests/unit/test_violation.py and the changed tests/unit/test_adapter.py and test_replay.py, each
  test naming its AC ids in its own docstring; the tests use stand-ins for the writer's functions and write no file.
