# Task contract TASK-025, the submission path (Master Plan revision 3, §4 M4; specification 1 sections 5.1 and 8;
# specification 2 sections 6.1, 6.3 and 6.6; DEF-0030, the core's caller). Revision 0, drafted under decision D-591
# (Q2 to Q5, C1, C2), and revision 1 under decision D-592 (M1, M2), brought for approval in its own request; whether it
# is approved is recorded in the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-024.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: one module, src/aieos_bootstrap/submit.py, the second piece of the core's
# caller (DEF-0030; the row 13 note of decision D-567 as amended by decision D-591 Q4): one function, submit, that reads
# one commit through the Git reader (TASK-024), takes its AIEOS-Task and AIEOS-Fence trailers with recovery.trailers
# (TASK-009, the same trailer rules recovery applies), and appends the task.submitted event through the single writer
# (TASK-016), whose existing fence check decides whether the submission holds and records a refusal as an observation
# (specification 1 section 8); on success it releases the lease (specification 1 section 5.1, task.submitted row).
# Which refusals are recorded (decision D-592 M1; specification 1 section 8, "The refusal is recorded as an
# observation"): a commit that identifies this task (a message with a body and exactly one AIEOS-Task equal to the
# task) but carries no usable AIEOS-Fence is a submission whose token is not the lease's, so submit appends the
# task.submitted event with no fencing token and the writer refuses it and records the observation; a commit that
# cannot be identified as this task's submission (no body, no, a doubled or a different AIEOS-Task, or a trailer
# finding on the task key), and a commit that cannot be read, are refused before the writer with nothing appended,
# since there is no submission of this task to record. Which lease is released (decision D-592 M2): after an
# appended event, the held lease; after a duplicate, only a held lease whose token is the commit's, never a lease
# granted to another holder since.
# What it does not do (decision D-591 Q4): no recovery at start (TASK-026: specification 1 section 7 step 1, the walk
# over parents and its bound), no evaluation path (TASK-027: the Resume Check, stale evidence, the AC checks and the
# governor on a submitted task, and the execution decision's state effect), no lease grant and no store creation, no
# projection of task state, no check that the commit's changed paths lie in the write set, no check that the commit is
# reachable from a branch, no Git write of any kind, no process except through gitread.run, no file opened except
# through the writer's functions, no clock read, nothing under .github/ and no workflow change (decision D-591 Q3,
# option (i)), no policy, no frozen fixture. It changes no other module of src/ apart from the package's docstring and
# __all__.
# The two caller requirements of DEF-0030 (decisions D-580 F6 and D-584 G1): (1) the trailer is trusted only when the
# commit message has a body, that is at least two paragraphs, so that its last paragraph is not the subject line (AC3);
# (2) the PATH that gitread passes to git is the caller's precondition: gitread refuses an empty or relative entry, but
# whether an absolute entry is trusted cannot be checked in code; a refused PATH comes back as a refusal result with
# nothing appended (AC2, AC11).
# DEF-0041 (c) (decision D-414): "never give an earlier store's epoch to a recreated store" does not apply here,
# because submit grants no lease and never calls open_store, so it creates no store and gives no epoch; it reads the
# held lease only through the writer's append_event (AC8, AC11).
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain submit; it must not name the Resume Check
# fixture folder (TASK-010's assertion) nor the Risk Engine fixture folder (TASK-020's allow list). No module of the
# repository calls submit yet.
# Risk: high, and change class critical_cr, each computed over the base by script (risk_class25.py and
# gov003_class25.py of the drafting session). Profile (assurance-model.md §5, gov-AIEOS, high): functional
# [unit_test], architecture [deterministic_rule], functional [integration_test], security [static_security_analysis]
# and architecture [ai_review (cross-model)], plus the evidence_required of the applicable articles.
# Reviews (as TASK-024's): five way-2 reviews by a Claude model other than the implementer's, and the decision agent's
# three, each brief naming for testing: that no event is appended before every check of AC1 to AC3 passes; that the
# fence decision is the writer's and is not duplicated or weakened; compensating false; the trailer-body rule; which
# refusals are recorded (M1); the lease release after an appended event, and after a duplicate only for a held lease
# with the commit's token (M2); the result form and that no exception escapes; the injected defaults;
# AC11's limits, the end-to-end gap among them.
# Naming: every test of the three new test modules names the AC ids it stands for as "TASK-025 ACn" in its own
# docstring, following DEF-0049's convention as TASK-023 and TASK-024 did, for this contract only.
# Evaluation path (A61; as TASK-007 to TASK-024): commit C changes only docs/tasks/TASK-025.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-025", go to task/TASK-025 under their own
# decisions; main receives the task only at its acceptance. The task push's CI base run is a RISK-01 conformance run
# over the set file of DM F35, reported advisory, never MEASURED.
# Not applicable: OPS-001 (the task changes no ref; gitread runs only read-only subcommands); INV-005 to INV-008,
# INV-010 and INV-011 (the decision engine, the governor, evidence records other than the writer's fence refusal, the
# replay and the policy meet no path of the write-set); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the
# bound artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the
# write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (CR-002 part 4 limit 8 does not apply),
# so its acceptance is one delegated approval of the decision agent (Master Plan section 6), for the decision agent's
# ruling.
task: TASK-025
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/submit.py, the submission path of the core's caller
  (DEF-0030): submit(root, repo, commit_id, task_id, event_id, recorder, now) reads one commit through gitread.run,
  requires a message body, takes the AIEOS-Task and AIEOS-Fence trailers with recovery.trailers, and appends the
  task.submitted event with payload {commit, compensating false} and the trailer's fencing token through
  writer.append_event, whose fence check decides and records any refusal, a commit of this task with no usable fence
  trailer among them; it releases the lease when the event is appended, or when it was already appended and the
  held lease carries the commit's token; a commit that cannot be read or identified as this task's submission is a
  refusal result with nothing appended. With unit tests on injected stand-ins for gitread.run, writer.append_event,
  writer.release_lease and writer.held_lease, a read-only integration test over
  this repository's history, and property tests, each test naming its AC ids as "TASK-025 ACn" in its own docstring.
