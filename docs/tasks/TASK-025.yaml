acceptance_criteria:
  - AC1: >-
      The interface and its arguments. submit(root, repo, commit_id, task_id, event_id, recorder, now, read=None,
      append=None, release=None, held=None) takes root and repo, non-empty strings that are absolute paths; commit_id, 40
      lowercase hexadecimal characters (reading: the full commit id of specification 2, as recovery takes it);
      task_id, TASK- followed by digits; event_id and recorder, non-empty strings (decision D-405 (h): both always
      given); now, a timezone-aware datetime in UTC with whole seconds (specification 2 section 6.1), used as the
      event's appended_at. Any other value gives the refusal result of AC6 with reason "argument" and a finding naming
      the argument, before read is called (fail closed).
  - AC2: >-
      Reading the commit. submit calls read exactly with (repo, ["cat-file", "-t", commit_id]) and, only when that
      call's result has error None, exit 0 and out exactly b"commit\n", with (repo, ["cat-file", "-p", commit_id]); the
      second result must have error None and exit 0, and gitread.parse_commit of its out must give error None. Any
      other result (a refused form, a refused PATH, a timeout, a git that cannot be started, a non-zero exit, an object
      that is not a commit, bytes out of form) gives the refusal result with reason "git" and a finding that names the
      call and its error or exit, and append and release are not called.
  - AC3: >-
      The trailers (decisions D-580 F6, D-584 and D-592 M1; specification 2 section 6.6; specification 1 section 8).
      Identification: the parsed message must have at least two paragraphs, split as recovery.trailers splits them
      (lines that are empty or hold only spaces and tabs between paragraphs), so that its last paragraph is not its
      subject, and recovery.trailers of the message must give exactly one AIEOS-Task, equal to task_id, and no
      finding on the AIEOS-Task key; else refusal, reason "trailer", with recovery's findings and a finding for a
      missing body or a missing, doubled or different task, and append, release and held are not called (the commit
      cannot be identified as this task's submission, so there is nothing to record). The fence: when the commit is
      identified and recovery.trailers gives a usable AIEOS-Fence ({epoch, counter}) and no finding on that key, its
      value is the token of AC4; when the AIEOS-Fence is missing or gives a finding, submit calls append as AC4 says
      with fencing_token None, so that the writer refuses the submission by its fence check and records the
      observation (specification 1 section 8); submit adds a finding that the commit carries no usable fence, does
      not call release or held, and returns "refused" with the writer's reason.
  - AC4: >-
      The append. When AC1 to AC3 pass, submit calls append exactly once as append(root, "task.submitted",
      {"commit": commit_id, "compensating": false}, event_id, now, recorder, task_id=task_id,
      fencing_token=<the AIEOS-Fence value as {epoch, counter}, or None in AC3's case of no usable fence>); compensating is false on every event submit appends,
      true being only recovery's (specification 2 section 6.3); no other event and no other call of append is made.
      The fence decision is the writer's (writer.append_event passes the store's held lease to eventlog.append, which
      refuses a token that is not the held lease's or a lease that expired at or before now, and records the refusal
      as an observation, specification 1 section 8); submit makes no fence comparison of its own and weakens none.
  - AC5: >-
      The outcome and the lease (specification 1 section 5.1, task.submitted row: "the lease is released"; decision
      D-592 M2). When the append's result is "appended", submit calls release(root, task_id) once and returns result
      "submitted"; when it is "duplicate" (the same event already appended, for example after a stop between the
      append and the release), it calls held(root, task_id) once and calls release(root, task_id) once only when held
      returns a lease whose fencing_token equals the commit's token (compared as eventlog compares tokens, the
      canonical JSON text), else it does not call release and adds a finding that the held lease, if any, is not the
      commit's, so that a lease granted to another holder since is never released; it returns result "duplicate";
      when the result is "refused", it does not call release or held and returns result "refused" with the writer's
      reason (for example "fence", "form", "conflict" or "log"), its findings, and whether the writer appended the
      refusal record.
  - AC6: >-
      The result. submit returns a mapping with exactly the keys result, reason, findings, appended and released:
      result one of "submitted", "duplicate" and "refused"; reason None for "submitted" and "duplicate", else a short
      English word (argument, git, trailer, store, or the writer's reason); findings a list of short English texts;
      appended the append's result object, or None when append was not called; released the lease release returned, or
      None. An exception raised by append or release (an OSError, a ValueError of the writer's own argument checks, or
      any other Exception) is caught and gives result "refused" with reason "store" and a finding naming its type, or,
      when raised by release after an appended or duplicate event, result "submitted" or "duplicate" with a finding
      that the lease was not released (it expires by its own expiry, specification 1 section 8). No exception escapes
      submit for these cases.
  - AC7: >-
      The injected functions. read, append, release and held, when None, are gitread.run, writer.append_event,
      writer.release_lease and writer.held_lease, resolved at call time from those modules; tests pass stand-ins. A
      test pins the defaults: with read, append, release and held None, the functions called are exactly those four of
      those modules (shown by
      replacing the module attributes for the duration of the test and restoring them).
  - AC8: >-
      Purity apart from the calls (INV-001, INV-004). submit.py imports only the Python 3 standard library and
      aieos_bootstrap's gitread, recovery and writer; it imports no subprocess, opens, writes and removes no file
      itself, starts no process except through read, reads no clock and no environment variable, calls of the writer only
      append_event, release_lease and held_lease (through append, release and held), and no open_store,
      start_session, end_session, grant_lease, expire_leases or held_leases, and builds no event-log line itself (the writer and
      eventlog do). Its docstring states this and the limits of AC11.
  - AC9: >-
      This repository's history, read only. tests/integration/test_submit_repo.py finds the repository root from its
      own path (pathlib, two parents up) and calls submit with the real gitread.run and stand-ins for append and release
      that record calls: for commit 057cc530e8fa39814eed4431c4de0fd9887014cf (a commit of main whose last paragraph
      holds "AIEOS-Task: TASK-024" and no AIEOS-Fence) with task_id TASK-024, append is called exactly once with
      fencing_token None (AC3, AC4), release and held are not called, and the result is "refused" with the reason the
      stand-in's refusal gives and a finding of the missing fence; with task_id TASK-025, "refused", "trailer", with a
      finding of the different task, and append, release and held are not called; for
      c7b8728f2d0a4bb0efec66076fe3ad0b4f2da441 (that commit's tree), "refused" with reason "git", and append, release
      and held are not called. root is a path that is never written (the stand-ins write
      nothing). These are data about accepted commits: they reopen nothing.
  - AC10: >-
      Purity and the CI checks (INV-001, INV-002, INV-003). No exec, eval, compile, __import__ or importlib; no assert
      in src (bandit B101); no string that names the project-state directory; deterministic_rule, OPS-003, SEC-001,
      SEC-002 and bandit report no finding at the task's commits, on the base with the workflow's revision 8, with no
      change under .github/ (decision D-591 Q3).
  - AC11: >-
      Limits, stated: the PATH git is found by is the caller's precondition (DEF-0052 G1): gitread refuses an empty or
      relative entry, and an absolute entry is trusted as given; the tests use stand-ins for the writer, so the real
      store's fence path is covered by the writer's own tests (TASK-016) and not end to end with submit (decision D-591
      Q3, option (i)), and no test makes a commit with an AIEOS-Fence trailer; DEF-0041 (c) does not apply, since
      submit grants nothing and creates no store; submit does not check that the commit's changed paths lie in the
      task's write set, that the commit is reachable from a branch, or the task's state in the log (the held lease
      stands for IN_PROGRESS, and the evaluation path is TASK-027); recovery at start is TASK-026; the lease is released
      after the append in a separate call, so a stop between them leaves the lease until a retry (AC5's duplicate,
      which releases it only while the store holds that same token) or its expiry; recorded and not recorded
      refusals (decision D-592 M1): a commit of this task with no usable fence is refused by the writer and recorded as
      an observation, while a commit that cannot be read, has no body, or names no, a doubled or a different task is
      refused with nothing appended and no record, since it cannot be identified as this task's submission. Every existing module and test not in the write set is unchanged, and if one can pass only by a change
      the task escalates (needs_out_of_scope_change).
  - AC12: >-
      Its own tests and the added text. Every test function of the three new test modules names the AC ids it stands
      for as "TASK-025 ACn" in its own docstring and names no other task's AC in qualified form there. Before each
      commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0;
      the file names are scanned with the same patterns and the records executors' pre-push pattern (D-282).
  - AC13: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 (each argument wrong in turn, read not
      called); R2 AC2 (each failing read result of AC2 from a stand-in, append not called); R3 AC3 (a one-paragraph
      message "AIEOS-Task: TASK-025" plus a fence line refused with append not called; a different, missing, doubled
      or misspelled task key refused with append not called; a missing fence and a malformed fence each reaching
      append once with fencing_token None and returning the stand-in's refusal, release and held not called; a
      well-formed two-paragraph message reaching append with its token); R4 AC4 (the exact append call, compensating
      false, the token as {epoch, counter} with the counter an integer); R5 AC5 (appended, duplicate and refused
      results from a stand-in; release called once after appended; after duplicate, release called once when held
      returns the same token, and not called when held returns a different token or None; neither after refused); R6 AC6 (the result keys; exceptions from append and from release);
      R7 AC7 (the four defaults pinned); R8 AC8 and AC10 (a script check of the module's imports and of the absence of
      process, file, clock, environment and store-changing calls); R9 AC9 (the integration test). Unit tests in
      tests/unit/test_submit.py; AC9 in tests/integration/test_submit_repo.py; property tests in
      tests/property/test_submit_properties.py (standard library only, fixed seeds): random arguments outside AC1's
      forms never reach read; random two-paragraph messages with a valid task and fence always reach append exactly
      once with that fence; random read failures never reach append. tests/run_tests.py, unchanged, runs all groups.
