acceptance_criteria:
  - AC1: >-
      The listing and the inputs: tools/list answers status, acknowledge, ask, report and handoff, each with an object
      input schema of section 4's keys; each tool reads its input from params.arguments and checks its shape first,
      as the header states (non-empty strs; handoff's six lists required with one item at least; report with a
      criterion or notes), and answers invalid_input for any other shape, a missing or non-object arguments among
      them, before any writer call. Tests for each tool and shape in tests/unit/test_mcp_server.py.
  - AC2: >-
      The lease rule: before writing, each of the four tools reads writer.session_leases; no row, an ended session or a
      session never seen answers no_lease; rows of which none is unexpired answer lease_expired; more than one unexpired
      row answers core_error; root and no_store answer no_session; argument, unreadable, link, tables and any other
      answer core_error; on every one of these the tool calls no other writer function; any other append_event refusal,
      answer of another form or exception of a writer call answers core_error; a missing or out-of-form identity
      answers no_session with no writer call. Tests with stand-ins for each.
  - AC3: >-
      The claim form: each item is one record.added event through writer.append_event whose payload is the header's
      record, task_id the lease's task and fencing_token the lease's token from session_leases (never a value from the
      tool's input, which takes no token); a report criterion carries acs with its one AC id, its notes none; every
      record passes records.check_record; the recorder argument of each append_event call is the payload's
      recorder. Tests with stand-ins recording the calls, and one test in
      tests/unit/test_writer.py over real stores that runs the four tools and reads the log's new events back through
      records.check_log with no finding.
  - AC4: >-
      The ids: event_id and record_id follow the header's rule exactly (the call digest, the argument name, the place
      from 1), for ask's question and report's notes too; an identical repeated call answers the same record ids and
      appends nothing new (the log's "duplicate"); a call that differs anywhere, one with an item of the same text at
      the same place among them, appends new events. Tests over real stores in tests/unit/test_writer.py.
  - AC5: >-
      The fence (specification 6 revision 7 section 8): when writer.append_event refuses on the fence, the tool reads
      session_leases again and answers by AC2's rule, exactly one unexpired row answering core_error; the refusal
      record the writer appends is the writer's; items appended earlier in the call stay. Tests with a stand-in
      refusal in tests/unit/test_mcp_server.py, and over a real store whose lease expires before the append in
      tests/unit/test_writer.py.
  - AC6: >-
