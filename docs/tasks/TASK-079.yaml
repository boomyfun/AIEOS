# TASK-079: the MCP server's four claim tools (specification 6 revision 7, sections 3, 4, 7 and 8; M6's second slice,
# S2). Plan: decisions D-2131 and D-2132; reviews and revision 7: D-2133 to D-2137 (session 308d8b07).
#
# Scope (D-2131 (a) to (e), D-2132):
# - src/aieos_bootstrap/mcp_server.py gains the tools acknowledge, ask, report and handoff (specification 6 section 4,
#   rows 4 to 7), listed by tools/list beside status, in one task (D-2131 (e)).
# - The lease rule as code (section 3 bullet 5): every tool but status first reads writer.session_leases with the
#   session id and root of TASK-078's identity: exactly one unexpired row is the live lease; a session never seen, an
#   ended session or one with no row answers no_lease; rows of which none is unexpired answer lease_expired; more than
#   one unexpired row answers core_error (TASK-078's one-lease reading); the refusals of session_leases map as status's
#   do (root and no_store no_session; argument, unreadable, link, tables and any other core_error). An error the tool
#   finds before its first append writes nothing (specification 6 revision 7 section 8).
# - The order (D-2134 N2; D-2139): the identity first (AIEOS_SESSION_ID or AIEOS_ROOT missing or out of form:
#   no_session, as status, before any writer call); then the inputs from params.arguments and their shape (arguments
#   missing or not an object: invalid_input); then the lease; then, for handoff, the log; then the appends, one item
#   at a time.
# - Other outcomes (D-2134 N1): any other refusal of writer.append_event ('event', 'log', 'log_after'), an answer of
#   another form, any exception of a writer call, and a fence reread that finds exactly one unexpired row answer
#   core_error; each tool body runs under the guard status runs under (mcp_server.py :114-121).
# - The claim form (section 4; specification 2 section 6.2 as TASK-077 checks it): each item is one record.added event
#   appended through writer.append_event, its payload the record {record_id, fact_kind "claim", source_class
#   "agent_declared", recorder "aieos mcp_server, session <id>", subject <the lease's task>, session <the session id>,
#   text <the item>}, a report criterion's record also carrying acs [<its AC id>]; the event's task_id is the lease's
#   task and its fencing_token the live lease's token, taken from the store's answer, never from the agent's input;
#   appended_at is the clock's time; the recorder argument passed to writer.append_event is the payload's recorder,
#   "aieos mcp_server, session <id>", which the writer's fence-refusal record also carries (D-2139).
# - The ids (D-2131 (c); D-2134 B1, B2), a stated rule: C = SHA-256 hex of the call's checked arguments as canonical
#   JSON (UTF-8, keys sorted, no insignificant whitespace, non-ASCII kept); for the item at place n (from 1) of the
#   argument L of a call of tool T, digest = SHA-256 hex of the UTF-8 text of session id, task id, T, C, L, n and the
#   item's text joined by LF; L is the argument's name (acknowledge "assumptions"; ask "question", n 1; report
#   "criteria", the item's text its AC id and its text joined by a space, and "notes", n 1; handoff each of its six
#   lists by its name); event_id "mcp-" + digest; record_id "mcp-claim/" + digest. Only an identical call repeats
#   the ids: an identical repeated call is a retry, the log answers "duplicate" and the tool answers the same record
#   ids (a stated choice; acknowledge and report "may be called more than once" for calls that differ); a call that
#   differs anywhere gets new ids.
# - The fence (D-2131 (d); specification 6 revision 7 section 8): a lease that changes or expires between the tool's
#   lease read and an append is refused by the writer's fence; the tool then reads session_leases again and answers
#   no_lease, lease_expired or core_error by the rule above; the refusal record the writer appends is the writer's, as
#   a refused submission is recorded; the claims the call appended before it stay, each a valid claim under the lease
#   live at its append; the answer names the error.
# - handoff (D-2131 (a), (b); D-2134 B2, B4): its six lists done, not_done, assumptions, discoveries, risks and
#   proposals, each required, each a list of non-empty strs, with at least one item in all six (else invalid_input);
#   called once per session (D-2133 C1): before appending, the tool reads the log through writer.read_log; if the log
#   holds earlier claims whose payload session is the session id and whose refers_to begins "handoffs/" (under any
#   task the session held, D-2139), the call goes on only
#   when every such claim's record_id is among the record ids this call computes, which with C in the digest means
#   the identical call (a cut-off handoff completed by its retry: the items already appended answer "duplicate", the
#   rest are appended); otherwise invalid_input, nothing appended; each item's record carries refers_to
#   "handoffs/<task>-<session>.md#<list>/<n>", n its place from 1 (specification 2 section 5.2). Writing the handoff
#   file itself, after the submission or the session's end, is the launcher's (specification 7, M7): not in this
#   task, a stated limit and a DEF line at acceptance.
# - Inputs and outputs (section 4): acknowledge {assumptions: a non-empty list of non-empty strs}, ask {question: a
#   non-empty str}, report {criteria: a list of {ac, text}, ac matching AC followed by digits and text a non-empty str,
#   notes: a str, possibly empty, a call with no criterion and empty notes answering invalid_input}; any other shape
#   answers invalid_input; the success answer is {"records": [the record ids in the order appended]}, for ask a list
#   of one (a stated choice, one answer form; specification 6 :41 says "the record id"); report's notes, when not
#   empty, is one more claim without acs.
# - DEF-0092's three points (D-2131 C2): a line whose JSON nests too deep (json.loads raising RecursionError) answers
#   -32700 like any line that is not JSON; tests of session_leases' unreadable, link and tables refusals in
#   tests/unit/test_writer.py; a session holding two tasks' unexpired leases stays core_error (stated again).
#
# Owner-act boundary: none reached. Launching the server in a runtime and connecting it to one stay the owner's
# (specification 6 section 10; A51 item (4)); nothing here does either; no hook, setting, policy or measurement.
#
# Stated limits.
# - Every record is the agent's statement: source_class agent_declared; nothing here raises its standing
#   (specification 4, as section 7 says).
# - writer.read_log reads the whole log (its cost grows with the log, unmeasured) and has no link check, unlike
#   session_leases; the once-per-session check rests on it; writer.append_event makes no link check either
#   (writer.py :46-48).
# - The read of the lease and the append are two steps; the writer's fence check at the append is the guard, and its
#   refusal record is the writer's (specification 6 revision 7 section 8).
# - A retried call after a new lease was granted carries another token; the log then answers "conflict" for the same
#   event_id, which the tool answers core_error.
# - The handoff file is not written (above); the review queue of discoveries and proposals stays open (section 11).
# - MCP alone is at most tier T2, as a target and unmeasured; environment inheritance unmeasured (as TASK-078).
#
# The pins (L-0026 read for what each line binds; MYSP/m6s2/pinscan79-out.txt at 8d317dec; D-2132):
# - tests/unit/test_mcp_server.py :79-83 (tools/list lists exactly status), :93-95 (acknowledge as an unknown tool),
#   :251-289 (AC6: the imports and the writer attributes {session_leases, StoreResult}), :297-301 (AC8's phrases;
#   those this task makes false, "writes nothing" among them, reworded), :309-312 (names_its_criteria, its regex
#   admitting TASK-078 only) and :316-331 (AC8Naming: TASK-078 only): changed in this task, in its write-set; the
#   naming rule is widened to "TASK-078 or TASK-079 ACn and no other task's AC" in both MCP test modules (a named
#   pin change, as TASK-076's).
# - tests/property/test_mcp_server_properties.py :24 (an ask call among the arbitrary lines): stays met; the call has
#   no arguments, so it answers invalid_input before any lease read or append, and the test checks only the answer's
#   form.
# - tests/unit/test_writer.py R14 (:860-880), R20 (:1694-1737), R23 and R24: unchanged; writer.py is not changed.
# - tests/unit/test_writer.py R8 (:396-411) binds every src module, mcp_server.py among them: the new code makes no
#   open, .open or .connect call and names no ".aieos" string (AC8).
# - The deterministic rule: mcp_server.py stays under NONE (writer calls only; hashlib is in the standard library).
# - records.check_payload for record.added (eventlog.py :198): every claim passes it, shown over real stores.
# - No test hashes mcp_server.py; the export pins and HOOK_SIDE are not reached.
#
# Risk: high, computed over the base by MYSP/m6s2/risk_class79.py (R2 medium and R3 high for each path). GOV-003:
# src/aieos_bootstrap/** is an evaluator path (aieos-checks.yml :423, :490); change class critical_cr, as TASK-078's,
# ruled at acceptance. Profile as TASK-078's, plus the evidence_required of the applicable articles. Reviews on Sonnet
# 5.5 or Opus 5.5 (never Fable). Naming (D-544 Q3): every new test function names "TASK-079 ACn" in its own docstring.
# Not applicable: OPS-001; INV-005 to INV-008, INV-010, INV-011; GOV-001, GOV-004 to GOV-006, SEC-003. INV-004
# applies (the writer); INV-009 applies (every event an idempotent id: the id rule, AC4). INV-008: every claim is
# agent_declared and no src module reads acs, so nothing here raises a record's standing.
# Owner-kept acts: none in this task.
# Shadow (D-2042 C3 as amended by D-2068): the governor's evaluate at acceptance, any difference named.
# Records obligations of the acceptance (AC10; outside the write-set): the shadow's result; a DEF line for the handoff
# file (the launcher's, M7); DEF-0092's log line closing its three TASK-078 points as this task meets them.
# Local runs: the unit group in three parts (suite79_unitA, B and C, D-2131 C1).
# Evaluation path (A61): commit C changes only docs/tasks/TASK-079.yaml, has one parent equal to base_commit, and goes
# to main under its own decision; the task's commits carry "AIEOS-Task: TASK-079" and go to task/TASK-079; main
# receives them only at acceptance. X, in AC9 and the records, is the task head at acceptance.
