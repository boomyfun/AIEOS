acceptance_criteria:
  - AC1: >-
      Scope and bytes. The task commit changes only paths of the write set. ci_evidence.py differs from base only by the new public function eligible_run(run, task_id, commit), by ci_evidence calling it in the one place where it filtered the runs (the list comprehension at :196-:197 of base, inside the same try, after the argument check at :189-:191 and the .github path refusal at :192-:194, so the order of refusals is unchanged), and by one docstring sentence that names it. evaluation_sources.py differs only by the surrogate refusal of AC5 and its docstring sentence. evaluation_policy.py differs only by one entry, src/aieos_bootstrap/evaluation_intake.py, appended last to EVIDENCE_DEFINING_PATHS (seventeen entries, no duplicate), and the docstring changes that keep its text true: the sentence at :62 "Five other entries follow" and the paragraph at :54-:69 it belongs to; test_evaluation_policy.py and test_evaluation_derive.py differ only by the pins of that tuple; test_evaluation_sources.py differs by the new tests of AC5 and by the pins of that tuple in test_the_six_entries_follow_the_derive_entry_in_this_order (:305-:311 at base: the length and the slice that held the six entries now cover seventeen, the six unchanged and the new one last); test_ci_evidence.py differs by the new tests of AC2 and by the two public-name pins (:105-:118 at base), which gain eligible_run and nothing else. No check of base is removed or loosened.
  - AC2: >-
      eligible_run returns True exactly when run['head_sha'] equals commit, run['event'] is "push", run['workflow_path'] is the module's pinned workflow ".github/workflows/aieos-checks.yml" and run['head_branch'] is "task/" followed by task_id; otherwise False. It presumes validated input: the run mapping that ci_evidence's argument check accepts and a task_id and commit already checked; for other input its result is not specified. It keeps the import and forbidden-name rules of test_ci_evidence.py :120-:133. Tests: a table with each of the four conditions failing alone and the passing row; a test that, for a list of runs holding eligible and ineligible ones, the (run_id, attempt) pairs of ci_evidence's evidence are exactly those eligible_run accepts; every existing test of ci_evidence passes unchanged except the two public-name pins of AC1; the refusal of an empty intent_versions stays as it is.
  - AC3: >-
      read_ci_data(files, task_id, evaluated_commit) returns exactly the keys result, runs, files, findings. THE ORDER (the first refusal ends the call): (1) arguments: files is a dict whose keys and values are str, task_id is TASK- and digits, evaluated_commit is 40 lowercase hex (reason argument); (2) names (reason files): every name is run-<id>-<attempt>.api.json, run-<id>-<attempt>.view.json or run-<id>-<attempt>.log with id and attempt each matching [1-9][0-9]{0,18}, and each (id, attempt) has all three; an empty files is refused (reason files); (3) every text can be encoded as UTF-8 (reason plain; M8); (4) per (id, attempt) in numeric order: both JSON texts are parsed by evaluation_sources.parse_json (any finding: reason json; so a surrogate escape in an api or view text, which AC5 makes a parse_json finding of reason plain, gives reason json here); (5) the binding (reason binding): a parsed value that is not a dict, a missing key (api: id, run_attempt, head_sha, event, head_branch, status, conclusion, path; view: databaseId, attempt, headSha, event, headBranch, status, conclusion, jobs; each job: steps; each step: name, conclusion), a jobs or steps that is not a list, or a job or step that is not a dict is refused; each of these pairs must be equal, and a mismatch is refused: api id = the id of the name = view databaseId; api run_attempt = the attempt of the name = view attempt; api head_sha = view headSha; api event = view event; api head_branch = view headBranch; api status = view status; api conclusion = view conclusion; ids and attempts are int (a bool refused), the others str (conclusion str or null); the api object's path is a str and is the only source of the workflow path; the view's jobs is a list of dicts each with a list steps of dicts with a non-empty str name (as ci_evidence.py :127-:128) and a str or null conclusion; (6) the runs: one mapping per attempt with exactly the keys of ci_evidence._RUN_KEYS: run_id, attempt, head_sha, event, head_branch, workflow_path (the api path), status, conclusion, steps ({name, conclusion} of every step of every job of the view, in order) and log (the .log text itself); (7) eligible_run chooses; none eligible: refused (reason run); (8) for each id that has an eligible attempt, the attempts given for that id among ALL files must be exactly 1 to the highest given, and each of them eligible (reason attempts); (9) the content check (reason binding): each eligible log holds at least one line in the pinned three-field form of ci_evidence (job TAB step TAB timestamp message; the text is split on "\n", as ci_evidence.py :138) whose job is "checks", whose step is "Fetch the pushed commit, its history and main (no third-party action, no token)" and whose message is exactly two spaces, "SHA: " and evaluated_commit; one trailing carriage return is removed from the whole line first (as ci_evidence.py :145); a line with other leading space, another job or step or other trailing text does not count. result "present": runs holds ONLY the eligible mappings sorted by (run_id, attempt); files holds {name, sha256 of the UTF-8 bytes} of EVERY file given, eligible or not, sorted by name; findings []. Refused: runs and files None, findings exactly ONE {reason, detail}; closed set: argument, files, plain, json, binding, run, attempts. It never raises an Exception: any unexpected Exception is caught and refused with reason argument and a detail naming the exception type (as ci_evidence.py :240-:241). THE FETCH FORMS (outside the package, made by an executor script under its own decision at each use; M6): api: gh api repos/<owner>/<repo>/actions/runs/<id>/attempts/<n>; view: gh run view <id> --attempt <n> --json attempt,conclusion,databaseId,event,headBranch,headSha,jobs,status,workflowName; log: gh run view <id> --attempt <n> --log. THE EVIDENCE OF THE CONTENT LINE (M5), counted by script over six saved aieos-checks logs, each holding exactly one such line in step "Fetch the pushed commit, its hist