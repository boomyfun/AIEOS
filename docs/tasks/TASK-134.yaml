objective: >-
  Add the real runtime starter of `aieos launch` as a caller of the launcher, in a new module src/aieos_runtime/claude_starter.py (with the package file src/aieos_runtime/__init__.py): a function starter(env) that, given the launcher's environment copy (exactly AIEOS_SESSION_ID, AIEOS_ROOT, AIEOS_BASE), starts the pinned Claude Code program through ONE process form and waits for it to end; and wire it into the entry line of cli.py (main's `starter` argument stays for tests; main with starter=None still gives NO_STARTER). The starter writes no event, calls no governor, reconcile, done or writer function, builds no log line and adds no acceptance logic beside the governor's (DA-2's limit). Tests use stand-in process runners and values only; no test starts a real runtime. In the same task, every sentence of cli.py and launcher.py that says the shipped command starts no runtime is made true (AC10, AC13), the one test that pins it is changed to match, and the TASK-132 label in the new files is replaced by TASK-134 (AC14). No behaviour of launcher.py or of the launch path changes beyond the starter being wired.
