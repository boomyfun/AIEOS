acceptance_criteria:
  - AC1: >-
      Form: starter(env) -> None. It raises, before any process starts, when env lacks a string AIEOS_SESSION_ID (form [A-Za-z0-9._-]{1,128}, mcp_server.py:19-20), AIEOS_ROOT (an absolute path) or AIEOS_BASE (exactly 40 lowercase hexadecimal characters); launch_outside then records "run: the starter raised ..." and still ends the session.
  - AC2: >-
      Executable (D-5985 C3, D-5986 ruling (b)). Constants, verbatim: EXE_PATH = C:\Users\Admin\AppData\Roaming\Claude\claude-code\2.1.321\d0e23af87588\claude.exe; EXE_SHA256 = e6dae5fc45902b15751f2591a02f51760351c4788c5fd8291b3f1443d40c13a4 (346487456 bytes). The other installed copy, d020ce1b5d30, SHA-256 185dbc197835e568c1701f928b9c5b3a3e233731d9ae22f46fb80f5f09ffa1d9 (346487968 bytes), has a version and a --help text byte-equal to the pinned one; which copy the desktop app uses is NOT known and the 512-byte size difference is not explained. No PATH search, no ~, no environment-variable expansion. Before any process starts the starter refuses if the file is missing, is not a regular file, does not end in .exe, or its SHA-256 differs; a .cmd or .bat target is refused outright. Gap stated: the file can change between the hash check and the start. Each update of the desktop app changes the folder name and the hash, so the starter refuses until a new pin, which is its own decision (stated in plain words at acceptance). `claude` is on no PATH on this machine (the four probes of D-5984 C1).
  - AC3: >-
      Argument form, fixed, quoted from the installed --help (2.1.321), passed as a list with no shell, in this order: [EXE_PATH, "-p", PROMPT, "--permission-prompts", "none", "--strict-mcp-config", "--mcp-config", MCP_FILE, "--settings", SETTINGS_FILE]. The prompt follows "-p" at once and never follows the variadic --mcp-config (a test pins the order). NO --setting-sources: the run loads the default sources (user, project, local) plus the --settings file, so the OWNER'S COMMAND GUARD (the PreToolUse hooks of C:\Users\Admin\.claude\settings.json:49-71, user source) stays loaded in the launched run. --permission-prompts none: "nobody: anything that would prompt is denied automatically; the permission mode still decides everything else" (--help lines 155-160): a prompt is denied and never answered in anyone's place; work that needs a prompt stops (stated limit). NO option that skips, pre-answers or widens permissions or tools: no --dangerously-skip-permissions, no --allow-dangerously-skip-permissions, no --permission-mode, no --allowedTools, no --tools, no --add-dir. The permission rules come from the default settings sources and the --settings file named below, and are NOT all pinned by this contract: only the two runtime files are hash-pinned; the user, project, local and any managed sources are NOT checked by the starter or the launcher (stated limit; the first real run's pre-run record, AC12, must show the effective permission mode and its source). The two files below set no defaultMode, no permission rule, and never bypassPermissions, auto or acceptEdits. With no allow rule in any source, every edit and command that needs permission is denied: stated.
      The two runtime files (D-5986 M3), OUTSIDE E:\AIEOS because the project-state directory is the core's and a new untracked file in the root gives "root after" (spec-07:50; .gitignore:1-2; spec-07:26): MCP_FILE = C:\Users\Admin\AIEOS-runtime\claude-mcp.json and SETTINGS_FILE = C:\Users\Admin\AIEOS-runtime\claude-settings.json. Their draft content is in the scratchpad (runtime-files\, sha256 of the drafts: claude-mcp.json cbfc039cd668ca362c5713ad5498a3c18eeca7a59505363756e303c81035f882 (315 bytes); claude-settings.json bb9c8724b7e24955f07ea185b045008adcf313dfe9ecc9268a3023c9e75bf26b (619 bytes)); placing them was its own A73 settings decision (D-5988): MCP_SHA256 = cbfc039cd668ca362c5713ad5498a3c18eeca7a59505363756e303c81035f882; SETTINGS_SHA256 = bb9c8724b7e24955f07ea185b045008adcf313dfe9ecc9268a3023c9e75bf26b. The starter refuses when a file is missing, is not a regular file, or its SHA-256 differs.
  - AC4: >-
      Prompt, verbatim, ONE constant string in the module, no file read: PROMPT = "Call the AIEOS tool get_work_order of the connected aieos MCP server, do the work its Work Order describes within its limits, and stop when it is done." The starter has no task id and no Work Order, only the three variables; the server serves get_work_order from AIEOS_SESSION_ID, AIEOS_ROOT and AIEOS_BASE (mcp_server.py:19-20).
  - AC5: >-
      Process form (INV-001): no shell; standard input closed; a pinned working directory, the root (AIEOS_ROOT); a fixed timeout of 6600 seconds (110 minutes, below launch_outside's two-hour lease); on a timeout the process is terminated and the starter raises; a non-zero exit raises; child processes the runtime started may survive its termination (stated limit); the runtime's output is inherited to the console, not captured, stored or parsed. The starter reads no file besides the bytes of the executable and of the two runtime files (for the hashes), and the existence of the two files.
  - AC6: >-
      Environment, a constant list in the module, pinned by a test; nothing else is passed. From the launcher's copy: AIEOS_SESSION_ID, AIEOS_ROOT, AIEOS_BASE (the readers are the hooks and the MCP server). From the starter's own process environment (os.environ; refused if PATH is absent): PATH, unchanged (the owner's guard hooks run `python`, and the runtime's Bash tool needs Git Bash, found through it; stated limit: PATH is passed without the check that the project's rule E1 applies to git); SYSTEMROOT, SYSTEMDRIVE, COMSPEC, PATHEXT (Windows process creation and program lookup); USERPROFILE, APPDATA, LOCALAPPDATA (where the desktop app's program and the runtime's own stored login live; Claude Code finds the user settings, and so the owner's command guard, through USERPROFILE; the starter reads none of their content); TEMP, TMP (scratch). PYTHONPATH is NOT passed: the two runtime files set it themselves for the hook and server commands. HOME is not passed. No variable that holds a credential (no API key or token variable) is ever passed; if the runtime's login needs one, that is the owner's (accounts) and the work stops there. Whether the runtime's stored login costs money per use is checked at the first-run decision (money is the owner's).
  - AC7: >-
      No acceptance logic and no event: the module imports no aieos_bootstrap module at all (a test pins the import list), so it can reach none of governor, reconcile, done, writer, execution, records or evaluation. A finish refused "stored_reads" is left to `aieos end` or the lease's expiry. Lease renewal is NOT in this task: a session longer than the timeout is ended by it. A denied permission prompt is NOT detected by the starter (the run goes on and can exit 0, and the owner then sees "run: returned" and "end: done"); its effect shows only in the run's output and records (stated limit).
  - AC8: >-
      Carried gaps of done() (DEF-0119, TASK-131), STATED and unchanged: (G1) done()'s reads of the log are not atomic with its append; (G2) the approval_record named by an accepting NEEDS_REVIEW record is checked for form only, not for existence; (G3) the real writer path with a lease has not been run (done() was tested with stand-ins only): the first real run exercises it and must record what it shows. DA-2's limit holds: no caller of the governor, reconcile or done adds acceptance logic beside the governor's. Carried findings of the reviews of TASK-133, STATED and NOT fixed by this task, each its own later task: (F1) launch_outside records only the class name of an exception the starter raises, so the reason for a failure (which file or hash, the exit code, the timeout) is lost; (F3) the import of aieos_runtime in the `if __name__ == '__main__':` block of cli.py sits outside main's never-raises guard and no test executes that block, so a failed import would fail every command; (F2) the settings sources of AC3; (F5) a launch can report "done" after a run that did nothing useful; (F4) no test joins the real starter to the launcher.
  - AC9: >-
      Tests: tests/unit/test_claude_starter.py (each refusal of AC1; each refusal of AC2 and AC3 for a missing, non-regular or hash-differing file; the exact argument list of AC3 and the prompt of AC4 against a stand-in process runner; the order of the prompt after "-p"; no shell; stdin closed; the timeout and the termination; a non-zero exit; the environment of AC6 equal to the constant list and refused without PATH; the import list of AC7); tests/unit/test_cli.py (the entry line passes the real starter; main with starter=None still gives NO_STARTER; the help line of AC10; a stand-in starter still works; a test that asserts the old help text is changed only as AC10 states); tests/property/test_claude_starter_properties.py (for random env values a refused input never starts a process, the starter returns no value, the environment passed is a subset of the AC6 list); tests/unit/test_cli_run.py (AC10, AC13: only the pinned sentences named there, and nothing else in that file). No test starts a real runtime or writes a file in the repository. The whole suite passes locally (`timeout 110 python tests/run_tests.py < /dev/null`, in slices) and on the CI's branch run; pyflakes silent; CI revision 20 accepts the module. In tests/unit/test_gitread.py only the test test_no_other_src_module_imports_subprocess changes: its assertion is exact equality to the sorted list ['src/aieos_bootstrap/gitread.py', 'src/aieos_runtime/claude_starter.py'], no looser form; its docstring keeps "TASK-024 AC6" and names TASK-134 as the amending task (AC14); no other line of the file changes (the diff is brought at acceptance). Tests named in AC14 require "TASK-134 AC" where TASK-133's required "TASK-132 AC".
  - AC10: >-
      cli.py edit: (1) the help line `launch <task>  launch a session for a task (no runtime starter is shipped)` becomes `launch <task>  launch a session for a task through the pinned runtime starter`; (2) NO_STARTER stays for starter=None; (3) in the `if __name__ == '__main__':` block the import of aieos_runtime.claude_starter is added inside that block and the entry line passes `starter=claude_starter.starter`; (4) the docstring sentences that say the shipped command passes no starter or starts no runtime are made true, and nothing else in the docstring changes. They are exactly: (a) the module docstring sentence "As shipped, launch starts no runtime; who decides starting one, and building a starter, is set by specification 7 :35." (file line 70 at d0cfbe9e) becomes, in the wording approved at D-6168, "As shipped, the entry line passes the starter of src/aieos_runtime, which starts the pinned runtime; who decides each real launch, and the first real run, is set by specification 7 :35."; (b) the docstring of main, "starter is None unless a caller passes one; the entry line passes none." (file line 728) becomes, in the wording approved at D-6168, "starter is None unless a caller passes one; the entry line passes the starter of src/aieos_runtime."; (c) the sentence at file lines 62-63, "else, with no starter (main's starter is None, as in a test; the entry line passes the starter of src/aieos_runtime), it gives exit 1 and the one finding NO_STARTER, no runtime starter being shipped, with neither the clock nor launch_outside called;", is made true by replacing the words "no runtime starter being shipped" with, in the wording approved at D-6168, "no starter given to main (the entry line always passes the starter of src/aieos_runtime, so this is the case of a test)", everything else in that sentence unchanged; the constant NO_STARTER and its text 'launch: no runtime starter is shipped (specification 7 :35, DEF-0101)' stay unchanged (a test of tests/unit/test_cli_run.py