# Task contract TASK-045, the stack benchmark's third port: Rust (Master Plan revision 4, §4 "The benchmark and the
# stack ADR"; docs/plan/m4-exit-review.md §6; docs/plan/bench-port-brief.md revision 2; decisions D-794, D-800 C3,
# D-814 Q4, D-854, D-855, D-871; DEF-0063).
# Revision 0, drafted under decision D-871 (the scope note, B1 to B8, C1 to C4); brought for approval in its own
# request; whether it is approved is recorded in the decision files, not in this file. Fields and value forms follow
# specification 2 §5.1 and the contracts of TASK-007 to TASK-044. Readings marked "(reading)" are the worker's, for the
# decision agent's ruling.
# Task type: implementation, with two writers on two path sets (as TASK-043 and TASK-044):
# - the port, bench/rust/** except Cargo.toml and Cargo.lock (src/lib.rs, src/main.rs, any modules src/lib.rs
#   declares, and tests/port_test.rs, AC3), is written by a fresh agent (claude-opus-5-5, started for this task only)
#   given only the inputs of the port brief's section 1: the brief at revision 2 (its hash below),
#   the four Python files at commit aed226dc6d50fc44fac0ae11d39dfb6b3cb1dc79 by the hashes the brief names, the fixture
#   document and the reference document made at that commit (with the source of tests/unit/test_export_reference.py at
#   that commit, 2acae51b…), and this contract. It works only in a scratch folder of the worker's scratchpad, with no
#   access to the repository, the archives, other ports or their reviews, and runs only cargo there, through the
#   worker's wrapper script, which sets the environment of AC4 and refuses the forms that decision D-871 B6 lists;
# - everything else (Cargo.toml, Cargo.lock, the workflow step and the tests of AC8) is written by the worker.
# The toolchain (brief §3 as revised by decision D-855; D-871 B1, B2): in CI, the cargo and rustc the hosted runners
# provide (rustc 1.99.0 on both in the benchmark's run 4; printed by the toolchain-versions step, cargo, rustfmt and
# clippy printed by the rust step), not downloaded; locally, the same version, 1.99.0, as the standalone archive for
# the x86_64-pc-windows-gnu target from the Rust project's distribution server, checked against the SHA-256 the server
# publishes beside it, unpacked and assembled in the scratchpad only by the worker's own Python (the archive's install
# script is never run), nothing installed; the gnu target because it carries its own linker, so nothing machine-wide
# is used. Every cargo run, in CI and locally, has --locked and --offline where the subcommand takes them,
# CARGO_NET_OFFLINE=true and its target folder outside the checkout ($RUNNER_TEMP in CI); locally also CARGO_HOME,
# RUSTUP_HOME, TMP and TEMP under the scratchpad and PATH limited to the scratchpad's toolchain and the system's basic
# folders, so no user-level rustup proxy is found and nothing is written outside the scratchpad.
# The workflow change (A66, its own element at code time): in both jobs of .github/workflows/aieos-bench.yml, the
# existing step "port rust (only if bench/rust exists)" keeps its one guard and becomes: the versions of cargo,
# rustfmt and clippy printed, cargo fmt's check, cargo clippy with warnings as errors, cargo build, the port run on the
# fixture document, the compare by test_export_reference.py --compare, and cargo test with the two documents as
# arguments; the header names the Rust steps; the revision line goes to 4. No download, trigger, permission, secret,
# token or `uses:`; the TypeScript and Go steps' bytes are unchanged.
# Carried: nothing of TASK-043's or TASK-044's carries is folded in (DEF-0063 keeps them for a hardening task after
# this port), so no accepted port's bytes change.
# Limits: the benchmark workflow runs on pushes to main only (its triggers are pinned by TASK-039's tests), so it does
# not run on the task branch; the port's CI evidence on Linux and Windows comes from the first run at the landing, read
# after acceptance, as for TASK-041, TASK-043 and TASK-044; before acceptance, the evidence of byte equality is the
# worker's local run (rustc 1.99.0, x86_64-pc-windows-gnu) and the reviews; the hosted Windows runner builds for its
# own default target (msvc, a reading) while the local check builds for gnu; the runners' Rust version is not pinned
# and may move, and clippy's lint set moves with it; the distribution server's hash is self-attested by its publisher;
# the two unexpected-error paths of resume_check.check fail closed (brief §2, revision 1); the ports are written one
# after another (order bias); every writer and reviewer is an AI of one vendor.
# What it is not: the results are advisory (A29, A31) and feed no gate, record or evidence entry; aieos-checks.yml and
# its two pins are not touched; src/ is not touched; no TypeScript or Go change.
# Risk: critical, and change class critical_cr, computed over the base by script (risk_class45.py: risk_class44.py
# with only the write-set and its header line changed): .github/** is R9 (critical); bench/** is R12 (high);
# tests/** is R2 (medium) with R3's fail-closed reading (high); .github/** and tests/unit/** are evaluator paths of
# GOV-003's list.
# Profile (assurance-model.md §5, gov-AIEOS, critical): high's entries plus architecture [human_review], met for
# gov-AIEOS by the decision agent's review, and functional [the property/fuzz entry] by the CI's property_test step over
# the existing property suite (the task adds no property test; it changes no decision code); the cross-model entry by
# the pair of reviews: five way-2 reviews from the port review template (revision 1, port-neutral, decision D-870) on
# claude-sonnet-5-5 (a model other than the port writer's and the main session's), and the decision agent's separate
# review. One delegated approval (reading, as TASK-043 and TASK-044).
# Naming (D-544 Q3): every Python test this task adds names the AC ids it stands for as "TASK-045 ACn" in its docstring.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-045.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-045", go to task/TASK-045 under their own decisions; main receives the
# task only at its acceptance.
# Not applicable: OPS-001 (no ref changed by the task's code); INV-004 to INV-011 (no project state, decision engine,
# governor, evidence record, replay or policy path in the write-set); GOV-001, GOV-004 to GOV-006. SEC-003 applies (a
# .github/ path), under A66 as above.
# Owner-kept acts: none, on these conditions: the changed workflow grants no write, uses no secret or token, changes no
# repository or security setting and costs nothing (public repository, hosted runners); the local toolchain's download
# needs none of these and installs nothing outside the scratchpad. If any of these is not so, the task stops and the
# point is the owner's (CR-002 part 4 limit 5), fail closed.
task: TASK-045
contract_version: v1
task_type: implementation
objective: >-
  Add bench/rust/, the Rust port of the governor's acceptance decision and the Resume Check, written from the port
  brief (revision 2) by a fresh agent, which prints a document byte-equal to the reference export from the fixture
  export, with its own tests; make the rust step of both jobs of .github/workflows/aieos-bench.yml format-check, lint,
  build and run it, compare its output with the reference and run its tests, with the runners' cargo and no download;
  pin that step, Cargo.toml and Cargo.lock in tests/unit/test_export_fixtures.py. Nothing else changes; the results
  are advisory and feed nothing.
traces_to:
  - docs/plan/m4-exit-review.md#6
  - docs/plan/master-plan.md#4
  - docs/plan/bench-port-brief.md
  - docs/pre-genesis/constitution.md#SEC-003
input_state:
  # base_commit is the `main` commit on top of which the approved contract is committed as its own commit C, changing
  # only docs/tasks/TASK-045.yaml; G0 requires C's one parent to equal base_commit. It is filled by script from
  # refs/heads/main just before C is made: the placeholder and its quotes are replaced by the 40-hex id, unquoted.
  base_commit: 30fa3d3724fe8adf28f2983cc78a2090b1af3834
  depends_on: [TASK-039, TASK-041, TASK-043, TASK-044]
  intent_versions:
    docs/plan/m4-exit-review.md: 6c41ca8200a4e757f04b22aa521e52cd67f7ac3122690e667ac4c864aa57c4a4
    docs/plan/master-plan.md: 8276a587bbf6f75be8867feb97df6726379babfcdb2266344bfdb4d01e6b2d23
    docs/plan/bench-port-brief.md: d307c6ede5080a9012c16697184437d5a579ebfd41e9bedee69dfffcd25a15e0
    docs/pre-genesis/constitution.md: 9b396c3c0f31d3a3fbccf9433cf81eb820b6e0f0a3a7d099e2899043abfe1f5a
    docs/specs/risk-rules-gov-aieos.md: 29dd803aed6a55c11fad04d01dac32ee10a8f15f96f099857a00212c100d4ed5
    docs/specs/conformance-files.md: 2f1c224466fe3657167b116b49f902648130bf76e1274367d7780cc38ec7b021
write_set:
  # The port's files under bench/rust/ (the Cargo files by the worker), one modified workflow, one modified test module.
  paths:
    - bench/rust/**
    - .github/workflows/aieos-bench.yml
    - tests/unit/test_export_fixtures.py
read_set:
  paths:
    - docs/plan/**
    - docs/pre-genesis/constitution.md
    - docs/specs/risk-rules-gov-aieos.md
    - docs/specs/conformance-files.md
    - docs/tasks/**
    - src/aieos_bootstrap/**
    - tests/conformance/**
    - tests/unit/**
    - tests/run_tests.py
    - .github/workflows/aieos-checks.yml
  interfaces:
    - tests/unit/test_export_fixtures.py (the fixture document, run as a script)
    - tests/unit/test_export_reference.py (the reference document and --compare, run as a script)
    - bench/rust (new; the port, built by cargo and run as `cargo run --locked --offline --release --quiet -- <fixture
      document>`)
  schemas:
    - conformance-files canonical form (2)
    - the reference document's form (TASK-041 AC1)
forbidden:
  - .github/workflows/aieos-checks.yml
  - .aieos/**
  - .claude/**
  - CLAUDE.md
  - AIEOS-concept.md
  - bench/ts/**
  - bench/go/**
  - bench/rust/build.rs
  - bench/rust/.cargo/**
  - bench/rust/target/**
  - docs/**
  - src/**
  - tests/conformance/**
  - tests/integration/**
  - tests/property/**
  - tests/run_tests.py
  - tests/unit/test_bench_isolation.py
  - tests/unit/test_export_reference.py
  - .gitattributes
  - .gitignore
constitution: [INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The port's output. Built from bench/rust by cargo and run as `cargo run --locked --offline --release --quiet --
      <fixture document>`, the port prints a document byte-equal to the reference document of
      tests/unit/test_export_reference.py at base_commit (REFERENCE_SHA256 unchanged), and exits 0; on a missing or
      extra argument, a file that is not a fixture document, or a case it cannot compute (the two unexpected-error
      paths of resume_check.check among them, brief §2), it exits non-zero and prints nothing to standard output.
      Evidence before acceptance: the worker's run with rustc 1.99.0 (x86_64-pc-windows-gnu) on this machine, compared
      by `--compare`, its output saved; the hosted runners' compare at the landing is read after acceptance (a stated
      limit).
  - AC2: >-
      The writer and its inputs (the brief's section 1; decision D-871 B6). The port is written by a fresh agent on
      claude-opus-5-5, given only the brief's inputs (the documents made again at aed226dc and checked equal by hash to
      those TASK-043's and TASK-044's writers were given) and the worker's Cargo.toml and Cargo.lock, in a scratch
      folder; its tool calls are only file reads there, writes inside its own folder and cargo commands there through
      the worker's wrapper (checked by script over its transcript before any of its files is used); every bench/rust
      file but Cargo.toml and Cargo.lock is committed byte-equal to the hash the decision agent accepts after that
      check. No file under bench/rust holds a record id, a placeholder-free engine_identity or any other 64-hex value
      of the reference document, nor any case's expected values (checked by script against the two documents, the
      Python source compared with `\'` unescaped, decision D-861).
  - AC3: >-
      The port's form (the brief's section 3; D-871 B4, C2; D-872 M1, M2). bench/rust holds only: Cargo.toml and
      Cargo.lock, written by the worker; src/lib.rs (the computation, with any further modules under src/ that it
      declares), src/main.rs (the entry: the argument, the single write, the exit code) and tests/port_test.rs (the
      one test file), written by the port writer; and at most one README.md. The test target reaches the port's code
      only through the library. Cargo.toml holds exactly: the [package] table (name aieos-bench-port, version 0.1.0,
      edition 2021, publish = false, autobins = false, autoexamples = false, autotests = false, autobenches = false);
      one [lib] with path src/lib.rs, test = false and doctest = false; one [[bin]] named port with path src/main.rs
      and test = false; one [[test]] named port_test with path tests/port_test.rs and harness = false; and nothing
      else: no [dependencies], [dev-dependencies] or [build-dependencies] table (even empty), no build key, no
      [patch], [workspace], [features] or [profile] table. Cargo.lock holds lock version 4 and the one package, with no
      source or checksum line. No build.rs and no .cargo/ folder. The code uses only Rust's standard library; it holds
      no `unsafe`, `extern`, `extern crate`, `#![feature`, `#[path`, `include!`, `include_str!`, `include_bytes!`,
      `env!` or `option_env!`; it uses no std::process, std::net or std::env item other than std::env::args, and
      std::fs only to read the one argument path (its tests only the two documents given as arguments); it writes
      nothing but standard output and standard error and reads no clock or random value.
  - AC4: >-
      The static checks and the build (brief §3 as revised; D-871 B1 to B3). In bench/rust, with CARGO_NET_OFFLINE=true
      and the target folder outside the checkout: `cargo fmt --check` exits 0; `cargo clippy --locked --offline
      --release -- -D warnings` exits 0; `cargo build --locked --offline --release` builds the binary. Before the first
      push the worker runs the same checks on this machine with rustc 1.99.0 for x86_64-pc-windows-gnu, fetched under
      its own decisions (the .sha256 read, then the download, its SHA-256 check before unpacking, and the assembly,
      D-871 B2) in the scratchpad only, with CARGO_HOME, RUSTUP_HOME, the target folder, TMP and TEMP under the
      scratchpad and PATH limited as in the header.
  - AC5: >-
      The port's own tests. bench/rust's only test target is port_test (tests/port_test.rs, harness = false; the library
      and the binary have test = false), run as `cargo test --locked --offline --release -- <fixture document>
      <reference document>` (its own main reads the two arguments), that
      checks at least: the byte equality over the whole fixture document against the reference document; one governor
      case and one Resume Check case field by field; the placeholder; each fail-closed input of AC1; it exits non-zero
      on any failure. The tests pass on the worker's machine, and the workflow runs them.
  - AC6: >-
      The workflow (A66, its own element). In each of the two jobs of .github/workflows/aieos-bench.yml, identically,
      the step "port rust (only if bench/rust exists)", under its one existing guard, sets CARGO_NET_OFFLINE=true and
      CARGO_TARGET_DIR="$RUNNER_TEMP/rust", prints `cargo --version`, `cargo fmt --version` and `cargo clippy
      --version`, and runs, from bench/rust, `cargo fmt --check`, `cargo clippy --locked --offline --release -- -D
      warnings` and `cargo build --locked --offline --release`; then `cargo run --locked --offline --release --quiet --
      "$RUNNER_TEMP/fixtures.json"` into "$RUNNER_TEMP/rust.json"; then, from the checkout's root, `$PY
      tests/unit/test_export_reference.py --compare "$RUNNER_TEMP/reference.json" "$RUNNER_TEMP/rust.json"`; then, from
      bench/rust, `cargo test --locked --offline --release -- "$RUNNER_TEMP/fixtures.json"
      "$RUNNER_TEMP/reference.json"`. The header names the Rust steps; the revision line goes from 3 to 4. Nothing else
      changes: no download, trigger, permission, secret, token, `uses:`, TypeScript or Go byte. The earlier tests of
      tests/unit/test_export_fixtures.py pass over it unchanged.
  - AC7: >-
      Isolation (decision D-800 C3; the risk rules policy revision 6, R12). tests/unit/test_bench_isolation.py, unchanged,
      passes: no file under src/ or tests/ outside its allow-list, nor aieos-checks.yml, names bench/ or imports from it,
      and aieos-bench.yml is the only workflow naming bench/.
  - AC8: >-
      The pins (D-871 B4, C1, C2), in tests/unit/test_export_fixtures.py, in a new test class whose docstrings start
      with TASK-045: in each job, the rust step's lines of AC6 in their order, CARGO_NET_OFFLINE=true and
      CARGO_TARGET_DIR set before the first cargo command, every cargo build, lint, run and test command carrying
      --locked and --offline, and no `cargo install`, `cargo add`, `cargo update`, `cargo fetch` or `rustup`;
      bench/rust/Cargo.toml's exact bytes as AC3, Cargo.lock's form as AC3, bench/rust's file set as AC3, and no
      build.rs or .cargo/ folder (read only if bench/rust exists); the TypeScript and Go steps of each job unchanged
      from base_commit. The module's export, its other tests and its main guard are unchanged.
  - AC9: >-
      The CI checks and purity. At the task's commits the existing CI steps report no finding: G0 scope,
      deterministic_rule, OPS-003, SEC-001, SEC-002, SEC-003's record and bandit; every earlier test passes; the added
      Python lines are scanned for the bandit test patterns the CI applies before the first push, as in TASK-044 AC9;
      the forbidden forms of AC3 (`include!` among them) are checked by script over bench/rust before the first push;
      if any earlier test can pass only by a change outside the write-set, the task escalates
      (needs_out_of_scope_change).
  - AC10: >-
      Naming. Every Python test function the task adds names "TASK-045 ACn" in its own docstring; no existing test's
      docstring changes; tests/run_tests.py is unchanged and runs no export or port.
  - AC11: >-
      Stop conditions. If any step needs a secret, a token, write access, money, a setting or anything installed
      outside the scratchpad, or the local toolchain's download differs from its published SHA-256, the task stops and
      the point goes to the decision agent, and to the owner when it is the owner's (A66, fail closed).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell:
    allow:
      - "timeout 110 python tests/run_tests.py < /dev/null"
      - >-
        cargo fmt --check / cargo clippy --locked --offline --release -- -D warnings / cargo build --locked --offline
        --release / cargo run --locked --offline --release --quiet -- <file> / cargo test --locked --offline --release
        -- <file> <file> / cargo generate-lockfile --offline (the worker only, once) (with CARGO_NET_OFFLINE=true and,
        locally, the scratchpad environment of AC4)
      - >-
        curl -sS --fail --proto =https --max-time 60 --max-filesize 1000
        https://static.rust-lang.org/dist/rust-1.99.0-x86_64-pc-windows-gnu.tar.xz.sha256 -o <SP>/rust/archive.sha256
      - >-
        curl -sS --fail --proto =https --max-time 900 --max-filesize 600000000
        https://static.rust-lang.org/dist/rust-1.99.0-x86_64-pc-windows-gnu.tar.xz -o <SP>/rust/archive.tar.xz
      - "sha256sum <SP>/rust/archive.tar.xz (compared with the published value before unpacking)"
      - >-
        timeout 110 python <SP script> < /dev/null (the standard library's tarfile and lzma, unpacking and assembling
        into <SP>/rust only)
  network:
    allow:
      - >-
        https://static.rust-lang.org/dist/rust-1.99.0-x86_64-pc-windows-gnu.tar.xz and its .sha256 (one local read and
        one local download for AC4, each its own decision); none in the workflow
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 900k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC7, AC8, AC10]}
  - {gate: G3, check: constitution, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC9, AC11, INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
