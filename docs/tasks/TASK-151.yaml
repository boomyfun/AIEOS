# Task contract TASK-151 (DRAFT v1, scratchpad only until approved; session dc7cf6ca, 2026-11-21; BT3a, the pure CI-evidence module of the evaluation runner, DEF-0136 and DEF-0152; decisions D-6795, D-6796 (C3 and C4) and D-6797; v2 = v1 with D-6797 R1 to R6 and D-6798 R7; the first contract draft of BT3a). The id TASK-151 is the next free one by Glob at this draft (docs/tasks ends at TASK-150, .aieos/tasks at TASK-143; re-read at approval). The contract is approved by the decision agent (A41, A51) at the decision of its commit, not by the owner.
# Authority and scope: BT3a is ONLY a pure module: no process, no file, no clock, no network, no credential (D-6796 C2, D-6607 C2). CI data enters it as plain data that an EXECUTOR step outside src has fetched (the saved, unedited output of `gh run view <id> --log` and the run metadata, with every attempt). It does NOT change gate_records.py, governor.py, evaluation.py, reconcile.py, launcher.py, cli.py, the CI workflow or any DEF text. It does NOT settle G3 (DEF-0153, the owner's question). BT3b (the D-6606 C3 input assembler, the provenance records, the `aieos evaluate` wiring, the cli test file) is a later task and needs a note v1 first (D-6796 C5).
# Not in this task: any file under src/aieos_runtime or .github, any launch, any settings file, the fetch itself, the appending of records to the event log, the writer, the pin tasks (BT5), any change of DEF-0152 or DEF-0136 (their log lines are a records item of the acceptance commit, D-6796 Q4).
task: TASK-151
contract_version: v1
task_type: implementation
objective: >-
  Add a pure core module src/aieos_bootstrap/ci_evidence.py that decides whether the saved CI data of ONE task commit may be used as gate evidence, and if so turns it into the gate-result records of gate_records, so that the five duties of DEF-0152 (and the two refinements of D-6796) are checked in one place before the maker is called. NO process, no file, no clock, no network, no environment variable, no credential; it imports hashlib, re and aieos_bootstrap.gate_records only (the import list is tested by ast); public names ci_evidence and nothing else. ci_evidence(task_id, commit, contract_sha256, intent_versions, plan, changed_paths, runs, recorder) returns a mapping with exactly the keys records (a list of the maker's records), uncovered (the maker's list of mappings gate, check, detail), evidence (None, or a mapping, below) and refusal (None, or a mapping {reason, detail}); on any refusal records and uncovered are empty lists and evidence is None. The reasons form a closed set: argument, log_format, detect, run, rerun, path, maker. It never raises an Exception; a BaseException that is not an Exception passes through. THE ARGUMENTS (checked first; each failure is refusal reason argument and nothing else is read): task_id TASK- and digits; commit 40 lowercase hexadecimal characters; contract_sha256 64 lowercase hexadecimal characters; intent_versions a non-empty dict from a non-empty str to a str v and digits (a COPY of the declared mapping that evaluation.evaluate_task uses; the module checks the form and passes a fresh copy on, it cannot see the declared mapping itself: whether it is equal is the caller's, and a test shows that the records carry exactly the copy given); plan a non-empty list of dicts whose keys are gate (G and digits) and check (a non-empty str), plus the OPTIONAL key args which is dropped (a contract's verification_plan entry, DEF-0152 duty 4); any other key is an argument refusal; changed_paths a list of non-empty str (the task's changed paths, may be empty); runs a list (may be empty) of dicts with exactly the keys run_id (an int, not a bool, greater than 0), attempt (an int, not a bool, greater than 0), head_sha (a str), event (a str), head_branch (a str), workflow_path (a str), status (a str), conclusion (a str or None), steps (a list of dicts with exactly the keys name (a non-empty str) and conclusion (a str or None): the steps of the job "checks" of that run attempt) and log (a str: the saved, unedited text of `gh run view <run_id> --attempt <attempt> --log` for that attempt); recorder a non-empty str. THE ORDER OF THE CHECKS after the arguments: (1) path, (2) the eligible runs, (3) the log of each eligible run, (4) the rerun agreement, (5) the maker. (1) PATH (D-6796 C3 (g)): when any changed path is exactly '.github' or starts with '.github/' the answer is refusal reason path ('the workflow that produced the evidence comes from the pushed commit itself, so a task that changes .github cannot self-attest its CI evidence'; the stated limit is that a task which changes the workflow is refused, not evaluated). (2) ELIGIBLE RUNS: a run is eligible when head_sha equals commit, event is 'push', workflow_path is exactly '.github/workflows/aieos-checks.yml' AND head_branch is exactly 'task/' followed by task_id; every other run is IGNORED (a run of the same sha on main after a fast-forward, a pull_request run, a run of another workflow); with no eligible run the answer is refusal reason run ('no eligible run'); every eligible run must have status 'completed' and a conclusion that is 'success' or 'failure', else refusal reason run (a run in progress, queued, cancelled or skipped is refused; duplicates of (run_id, attempt) among the eligible runs are refused). (3) THE LOG of an eligible run (D-6796 C3 (a), (b)): the pinned form is the output of `gh run view --log`: every line (after dropping one final empty element from splitting on LF, and a CR at the end of a line) is `<job>` TAB `<step>` TAB `<text>`, split at the first two TAB characters only (the message may hold TABs), where text is an optional byte-order mark U+FEFF, an UTC timestamp of the form YYYY-MM-DDTHH:MM:SS, an optional fraction of digits, and Z, then end of line or a space and the message; a line of any other form, an empty log, or a log with no line of the job 'checks' is refusal reason log_format (no other format is parsed). From the lines whose job is 'checks' and whose step is exactly 'G0 task detection (the contract commit on main)': the step must have exactly one line whose message is '##[endgroup]' (else detect refusal); the OUTPUT lines are those that come after it in that step (the lines before it, which echo the script's source, are never read: a log whose 'no task' text occurs only in the echoed source is not a 'no task' log, and a log whose 'task' text occurs only in the echoed source names no task); among the output lines there must be exactly one line whose message matches `G0 detect: task (TASK-[0-9]+) contract commit ([0-9a-f]{40}) base ([0-9a-f]{40})` in full, with the task equal to task_id, and exactly one line whose message matches `G0 contract sha256 ([0-9a-f]{64})` in full and equals contract_sha256; any output line that begins 'G0 detect: no task' is refusal reason detect; any other shortfall is refusal reason detect (the detail names which). (4) THE RERUN AGREEMENT (D-6796 C3 (d)): ALL eligible runs and attempts must agree on the detect line (the same text) and, for EVERY step name of DEFAULT_CHECK_MAP, on the list, in order, of the conclusions of the steps of that name in the run's steps (so a mapped step absent in one attempt and present in another, or present once in one and twice in another, is a disagreement); any disagreement is refusal reason rerun; a mapped step absent or repeated alike in every attempt is not refused here: the maker lists it as uncovered ('a flaky failure then a pass refuses; the remedy is a new commit': that cost is stated in the module docstring and in the acceptance). The steps given to the maker are those of the eligible run with the highest (run_id, attempt) pair, built afresh as dicts with exactly name and conclusion. (5) THE MAKER: gate_records.gate_records(task_id, commit, a fresh copy of intent_versions, the plan entries rebuilt as dicts with exactly gate and check, the steps, a fresh copy of DEFAULT_CHECK_MAP (a dict of fresh lists: the constant is never passed and never mutated), recorder); an error text of the maker is refusal reason maker with that text as detail; otherwise the answer carries the maker's records and uncovered lists unchanged. THE EVIDENCE mapping (the provenance that BT3b keeps, D-6796 reason 6): exactly the keys head_sha (commit), workflow_path, detect_line (the full text of the detect output line), contract_sha256, and runs (a list, sorted by (run_id, attempt), of dicts with exactly run_id, attempt and log_sha256 = the SHA-256 hex of the log's UTF-8 bytes). All values are plain str, int, list and dict. THE G3 RESULT (D-6795 C2 (ii), DEF-0153): the default map has no entry for review, tests or constitution; for the run-made plan G0 scope, G1 build, G2 lint, G3 review the module gives records for G0, G1, G2 when their steps are present and concluded and G3 stays uncovered, and with the public governor.evaluate the missing gate is ['G3'] and the decision INSUFFICIENT_EVIDENCE; nothing here changes that.
