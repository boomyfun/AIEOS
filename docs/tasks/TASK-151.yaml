acceptance_criteria:
  - AC1: >-
      The module. ci_evidence.py defines ci_evidence and nothing else public; it imports hashlib, re and aieos_bootstrap.gate_records only (a test reads the file with read_bytes and ast and checks the import list and the absence of the direct calls open, exec, eval, compile and __import__, and of the names subprocess, system, environ, time and now); the return form has exactly the four keys and, on a refusal, empty lists and evidence None; every argument check of the objective is a test and each case asserts its EXACT refusal reason and detail text (no case may pass for another reason); a bool or a float where an int is required is refused; a dict subclass whose own method raises RuntimeError gives refusal reason argument and no exception escapes; a test-defined BaseException raised from an argument's own method passes through.
  - AC2: >-
      The log (D-6796 C3 (a), (b)). Fixtures are cut from the saved logs of the TASK-150 runs and embedded in the test file as constants (the tests read no log file): the job 'checks' lines of the detect step of the branch run (44780942904: the echoed source before '##[endgroup]', then the output lines 'G0 detect: task TASK-150 contract commit 3572f958... base f48804f6...' and 'G0 contract sha256 7c45fd60...') and of the main run (44777971143: the output 'G0 detect: no task ...'). The branch fixture is accepted; the main fixture is refused with reason detect; a log whose 'no task' text is only in the echoed source (before the endgroup) and whose output names the task is accepted; a log whose 'task TASK-<n>' text is only in the echoed source and whose output says 'no task' is refused; a log with no '##[endgroup]' line, with two, with two detect output lines, with no contract sha256 line, with a contract sha256 that differs from the argument, with another task id in the detect line, with a line out of the pinned form, with an empty log and with no 'checks' job line is each refused with its own reason and detail; lines of other jobs or other steps never count.
  - AC3: >-
      The runs (D-6796 C3 (c)). Ignored (not refused): a run of the same sha on main, a pull_request run, a run of another workflow path, a run of another sha; refused (reason run): no eligible run, an eligible run not completed, with a conclusion that is not success or failure, a repeated (run_id, attempt); a head_branch that is not exactly 'task/' + the task id is not eligible (a test with a branch 'task/TASK-1500' for the task 'TASK-150'); each is a test with the exact detail.
  - AC4: >-
      The rerun rule (D-6796 C3 (d)). Two eligible attempts that agree (same detect line, same conclusion of every mapped step) give the same records as one; two that differ in one mapped step's conclusion (failure then success, and success then failure) are refused with reason rerun; two that differ in the detect line are refused; a mapped step absent in one attempt and present in another, or present once in one and twice in another, is refused with reason rerun; a single eligible run whose mapped step is absent, or present twice, is not refused and the maker lists it as uncovered ('step not present', 'step named more than once'); the steps given to the maker are those of the highest (run_id, attempt) (shown by two agreeing attempts that differ only in the conclusion of an unmapped step, with a stand-in maker as in AC5 that captures the steps it receives); the cost is stated in the module docstring (a test reads the docstring for the sentence 'a new commit').
  - AC5: >-
      The maker and the duties (DEF-0152 duties 3 to 6). The records equal what gate_records.gate_records gives for the same steps, plan (args dropped), a copy of the given intent_versions and the recorder (compared as whole values); the plan entry {gate: G3, check: review, args: [AC1, AC2]} is accepted and G3 is uncovered ('no CI step is evidence of this check'); a plan entry with another extra key is refused; the intent_versions of every record equal the mapping given, are a copy (the argument is not changed and the records do not alias it); DEFAULT_CHECK_MAP is equal before and after every call (a deep comparison) and the object given to the maker is not the constant; the arguments are not changed (a deep comparison before and after); the same arguments give equal results; a maker error text is refusal reason maker with that detail: the module's own argument checks cover the maker's, so the branch is shown in the test by replacing the module's gate_records.gate_records attribute with a stand-in that returns an error text (unittest.mock.patch.object, undone after the test) and by a stand-in that raises RuntimeError (no refusal reason of its own: the call returns refusal reason maker with the exception's type name) and by one that raises a test-defined BaseException (which passes through).
  - AC6: >-
      The .github rule (D-6796 C3 (g)). A changed path '.github/workflows/aieos-checks.yml', '.github/x' or '.github' gives refusal reason path with that detail, before any run is read (a test with an otherwise unusable runs list shows the order); '.githubx/y' and 'docs/.github/z' do not.
  - AC7: >-
      The evidence mapping (D-6796 reason 6). On an accepted call the evidence has exactly the keys head_sha, workflow_path, detect_line, contract_sha256 and runs; each run entry has exactly run_id, attempt and log_sha256 (recomputed in the test from the UTF-8 bytes of the fixture log); the runs are sorted by (run_id, attempt); all values are plain types; on a refusal the evidence is None.
  - AC8: >-
      The G3 result and the governor. With the run-made plan G0 scope, G1 build, G2 lint, G3 review (args AC1, AC2) and the branch fixture, the records cover G0, G1, G2 and not G3; a test calls the PUBLIC governor.evaluate with a minimal request and inputs built in memory as test_gate_records.py builds them (the test reads no file; no private function) and shows missing_gates == ['G3'], failed_gates == [] and the decision INSUFFICIENT_EVIDENCE; with a failed mapped step the governor's failed_gates names the gate.
  - AC9: >-
      Nothing else changes. Only the two paths of the write set; the whole suite passes by the slice method (D-6249 C2, D-6328 E1.6); a pin scan of the existing tests (made at approval, brought to the decision agent) shows that no existing test pins the list or the count of the modules of src/aieos_bootstrap (TASK-150's scan found none; test_writer.py :428 and test_autonomy.py :241 must pass with the new module); tests/run_tests.py discovers the new test file without a change.
  - AC10: >-
      The CI evidence of the task push (pre-registered before the commit exists, as at TASK-150). deterministic_rule must report 0 findings and no FAIL line; bandit "No issues identified" and the pyflakes step silent; the GOV-003 step reports an evaluator change for the two paths (a report, not a block) and the "GOV-003 base tests (report only)" line shows NO failure; acceptance is by the decision agent's explicit decision only (constitution.md :94).
  - AC11: >-
      Limits and evidence, stated at acceptance. (1) The module reads no CI run and appends nothing: an executor step outside src fetches the data and BT3b assembles the inputs (D-6607 C2, D-6606 C3). (2) The log is trusted as the executor's unedited fetch; the module cannot check that it is unedited (BT3b keeps the sha256 and the run ids: the evidence mapping). (3) A task that changes anything under .github is refused: the workflow that made the evidence comes from the pushed commit itself (D-6796 reason 9). (4) A rerun that disagrees refuses; the remedy is a new commit. (5) The default map covers scope, build and lint only; G3 stays uncovered and the owner's question (DEF-0153) is not answered here. (6) The output lines of the detect step are read after its first and only '##[endgroup]'; a change of the step's output wording or of the log form refuses (fail closed). (7) The module does not check that intent_versions equals the declared mapping of evaluation.evaluate_task (it cannot see it); BT3b must pass the same copy (DEF-0152 log). (8) The evidence profile of the high class: unit_test, deterministic_rule, static_security_analysis, ai_review by a PAIR of blind reviews on Haiku 5.5 in their own sessions (same vendor, a stated departure), a per-article review (GOV-003, INV-008 applies, INV-001 not applicable) and a decision_agent_review; no launched session judges its own work. (9) A launch needs the owner's typed yes; the contract authorises none. (10) The risk class is high (risk-rules R3, fail closed): the module decides whether CI data may become gate evidence.
