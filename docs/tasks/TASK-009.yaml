acceptance_criteria:
  - AC1: >-
      The entry. The module defines reconcile(log, commits, leases, now, recorder). log is the event log's bytes
      (empty bytes for an empty log); commits is a list of objects with exactly the keys commit (40 lowercase hex
      digits) and message (a string), oldest first (reading: the commits of the branch being recovered, as the caller
      read them from Git), and they are judged in that order (decision D-390 C2 (c)); leases is a list of mappings with exactly eventlog.LEASE_KEYS (task_id,
      fencing_token, expires_at), the leases the local store holds, [] when the store was lost; now is a
      timezone-aware UTC datetime; recorder is a non-empty string. reconcile returns a result with: log, the bytes
      after every appended event; events, each {event_id, type, task_id, result} with result appended or duplicate in
      the order they were built; expired, the given leases whose expires_at is at or before now, in the given order;
      findings, as text. A log that has a finding under records.check_log, or that is not empty and does not end with
      LF, gives a result with the given log unchanged, no event, and the reason in findings (fail closed: a damaged
      log is never extended, as eventlog.append's AC1). Arguments not in these forms raise TypeError or ValueError
      before anything is decided. The given arguments are not changed.
  - AC2: >-
      The trailers (specification 2 §7). trailers(message) returns the values of the lines "AIEOS-Task: <id>" and
      "AIEOS-Fence: <epoch>:<counter>" of the message's last paragraph (reading: Git's trailer block), as {task,
      fence}, each null when absent; the task is TASK- followed by digits, the fence {epoch, counter} in the form of
      specification 2 §6.1 (reading: epoch the text before the last ":", counter a non-negative integer); a line that
      names either key with another form, or a key given twice, gives a finding and that commit is reported, not
      recovered.
  - AC3: >-
      Step 1 (specification 1 §7; concept line 855). For each given commit whose trailer names a task and whose id no
      task.submitted event of the log names in its payload's commit: when a given lease counts, that is, it has that
      task_id, a fencing_token equal to the trailer's fence and an expires_at after now, and no task.submitted event
      of the log (the given one or the one built so far in this call) already carries that task_id and that
      fencing_token, a task.submitted event with payload
      {commit, compensating: true}, that task_id and that fencing_token, appended by eventlog.append under that lease
      with appended_at now; otherwise, also when the trailer has no fence or the store was lost, a record.added event
      whose payload is the observation of specification 2 §6.2 (record_id, fact_kind observation, source_class
      deterministic_tool_local, recorder, subject the task id, evidence_type unfenced_write, outcome fail, refers_to
      the commit), with task_id the task id (records.check_log's task_id rule) and no fencing_token, appended by
      eventlog.append with appended_at now, and nothing else for that commit. Reading (t1)
      of decision D-390, a departure from specification 1 §7 step 1's proposed parenthetical, stated in the header: a
      lease still in the store whose expires_at is at or before now does not count, so it gives the observation,
      never a compensating event. One submission per lease (decision D-390 C2 (b); spec 1 §5.1, the lease released on
      submission, proposed): a lease whose token a task.submitted event already carries for that task no longer
      counts, so when several given commits name one task with no submission, the oldest under a counting lease gives
      the compensating event and every later one the observation. A trailer naming a task with no AIEOS-Fence gives
      the observation; a malformed trailer gives the finding of AC2 and no event; never a submission (C2 (f)).
      Commits whose trailer names no task are left alone.
  - AC4: >-
      Step 2 (Git wins; concept line 847). A task.submitted event of the log whose commit is not among the given
      commits gives a finding naming the event and the commit, and no event; the log is never rewritten (reading: the
      caller gives the commits it read; nothing the log says about code is taken over a commit). Step 3 has nothing to act on (no projection in
      the bootstrap; AC10). Step 4: an event recovery would append that the log already holds under its event_id is
      reported with result duplicate and changes nothing (TASK-007's AC2).
  - AC5: >-
      Step 5 and the append rules. expired lists the given leases whose expires_at is at or before now (spec 1 §8:
      "An expired lease is expired, whatever its holder believes"); the given lease mappings are returned as given and
      never changed, and nothing else is done with them. Every event is
      built by eventlog.append, one at a time, each on the log the previous one returned; recovery builds no log line
      itself, and the returned log's bytes are the given bytes followed by exactly the appended lines (INV-009). An
      append refused by eventlog.append is reported in findings with its reason and leaves the log as it was before
      that event (fail closed; reading: with the inputs of AC3 a refusal is not expected, and a test shows it is
      reported).
  - AC6: >-
      Ids (concept line 856; decision D-390 C2 (d)). The compensating event's event_id is the SHA-256 hex digest of the
      UTF-8 text "recovery", the commit id and "task.submitted", joined by LF; the observation's event_id is the same
      with "record.added" in place of "task.submitted", and its record_id the same with "unfenced_write"; no time and
      no random part enters any id. So reconcile over its own returned log with the same commits, leases and now
      appends nothing new: a submitted commit is skipped, and every observation it builds is a duplicate (idempotency).
  - AC7: >-
      The checkers as on main. records.py and eventlog.py are forbidden: every payload the module builds gives no
      finding under records.check_payload as on main, and every returned log no finding under records.check_log; a
      payload or log that only a change to either module would accept is a spec_conflict and the task escalates.
      Every existing test of records.py, eventlog.py, governor.py, conformance.py and resume_check.py passes
      unchanged (forbidden).
  - AC8: >-
      Imports. The module imports only the Python 3 standard library, aieos_bootstrap.records and
      aieos_bootstrap.eventlog, and nothing from aieos_bootstrap.conformance or any fixture folder; it names no
      fixture folder; a script check reads the module's syntax tree and lists every Import and ImportFrom node, and the
      list holds only standard-library names and those two modules (DEF-0028).
  - AC9: >-
      Purity and the CI checks (INV-001, INV-002, INV-003, INV-004). The module and its tests use no exec, eval,
      compile, __import__ or importlib, start no process, open no network connection, call no model, open, write or
      remove no file, read the clock nowhere (now is given), hold no assert in src (bandit B101), and name no
      project-state directory in src/; the tests build every input in memory. The CI steps at the task's commits
      report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit, as TASK-006's AC9 lists them.
  - AC10: >-
      Limits, stated and tested as such: reconcile reads nothing, so how the commits are read from Git and the leases
      from the local store is not shown; no code writes the bytes it returns and no lease is expired by it (expired is
      returned); step 3 has nothing to act on; whether an unfenced write blocks the task's acceptance stays open
      (specification 2 §10 point 7); the tension of reading (t1) is carried to specification 1's next revision; every
      existing module and test not in the write set is unchanged, and if one can pass only by a change the task
      escalates (needs_out_of_scope_change).
  - AC11: >-
      The added text. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0; the file names are scanned with the same patterns and the records executors'
      pre-push pattern (D-282).
  - AC12: >-
      Tests, with this rule-to-test list, each rule with at least one passing and one failing case, all in memory: R1
      AC1 (each argument form; the damaged log; arguments not changed); R2 AC2 (both trailers, each absent, each
      malformed, a key twice, a trailer outside the last paragraph); R3 AC3 (a held unexpired lease; another token;
      another task; a lease still in the store with an expiry equal to now and one before now, each giving the
      observation (C2 (a)); a lost store; no fence; two commits of one task under one lease, the second giving the
      observation (C2 (b)); the same two commits given in the other order, judged in the given order (C2 (c)); a
      lease whose token the log's task.submitted already carries; a commit already submitted; a commit naming no
      task); R4 AC4 (a submission whose commit is not given, the log not rewritten; a duplicate); R5 AC5 (expired
      leases returned unchanged; the returned log equal to the given bytes followed by the appended lines; a refused
      append reported); R6 AC6 (the ids' formula; a second reconcile over the returned log appends nothing); R7 AC7 (no
      check_payload finding for every payload built; no check_log finding for every returned log); R8 AC8 (the import
      list). Unit tests in tests/unit/test_recovery.py; integration tests in tests/integration/test_recovery_log.py,
      over logs built with eventlog.append (a log with drafted, approved and submitted events of several tasks, then
      commits with and without submissions). Property tests (tests/property/test_recovery_properties.py; standard
      library only, fixed seeds; INV-009): for random well-formed logs, commits, leases and times, the returned log
      has no check_log finding and its first bytes are the given log (append-only); reconcile is idempotent (a second
      run over its returned log appends nothing); every commit with a task trailer and no submission gives exactly one
      event, compensating only under a counting lease; and the arguments are never changed. tests/run_tests.py,
      unchanged, runs all groups.
