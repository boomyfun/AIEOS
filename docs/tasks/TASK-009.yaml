# Task contract TASK-009, recovery between Git and the event log (Master Plan revision 3, §4 M3; the M3 work order of
# decision D-254, as amended by decisions D-262 and D-263; specification 2 §5.1). Revision 0, drafted under decisions
# D-388 (C4) and D-390, brought for approval in its own request; whether it is approved is recorded in the decision
# files, not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 and
# TASK-008. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: a pure module, src/aieos_bootstrap/recovery.py, whose function reconcile
# takes, as values, the event log's bytes, the commits whose messages the caller read from Git, the leases the local
# store holds and the recovery time, and returns what specification 1 §7 makes the core do at start: the events to
# append, built by TASK-007's eventlog.append one at a time (step 1: a compensating task.submitted for a commit made
# under a held lease, else the observation of an unfenced write; step 4: duplicates have no effect), the leases whose
# expiry has passed (step 5), and findings that change no state (step 2: Git wins). A pure helper reads the AIEOS-Task
# and AIEOS-Fence trailers of a commit message (specification 2 §7).
# Shape (P) of decision D-313: it opens, writes and removes no file, reads no clock, starts no process and calls no
# model; reading Git and the local store, writing the log and expiring leases come with a later task (DEF-0030). It
# changes neither records.py nor eventlog.py: their checks as on main accept the payloads it returns (worker's probe,
# decision D-390).
# Departure from a proposed sentence (decision D-390, reading (t1)): specification 1 §7 step 1 counts "a lease on that
# task which the local store still holds (this step runs before step 5)", whose parenthetical reads as counting a lease
# past its expiry that the store has not yet expired; §8 says "The core refuses a submission whose token is not that of
# the lease the local store holds on the task, or whose lease has passed its expiry time even if the store has not yet
# expired it", and TASK-007's append (AC6) refuses such an event with reason fence. Both sentences are proposed (spec 1
# §10 point 10). This contract follows concept line 849 ("lease hết hạn là hết hạn, bất kể agent nghĩ gì"): a lease
# counts at step 1 only when it is held and its expiry is after the recovery time; a commit made under a lease past its
# expiry gives the unfenced-write observation, never a compensating event (the stricter side; the commit still stands
# as the fact of what changed in code, line 847). The tension is carried to specification 1's next revision in a
# Deferred item opened with this task's records.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain recovery; it must not name the Resume
# Check fixture folder (TASK-010's assertion). The new module is read by nothing else in the repository; the
# deterministic_rule step and the GOV-003 step read every file under src/ and tests/.
# Risk: high. R2 matches src/** and tests/** (medium); R3 read fail closed matches them too, recovery being part of
# the fencing that limits authority (spec 1 §8; risk rules section 2 point 3); no path of the write set meets R10
# (.aieos/) or R11 (tests/conformance/**); the highest wins. Profile (assurance-model.md §5, gov-AIEOS, high):
# functional [unit_test], architecture [deterministic_rule], functional [integration_test], security
# [static_security_analysis] and architecture [ai_review (cross-model)], plus the evidence_required of the applicable
# articles. Dimensions are named as TASK-006's records name them (decision D-181, reading R-dim).
# Change class: critical_cr (reading, fail closed, decision D-390 C3: computed, not asserted). GOV-003's tool part
# over the base, run by script, marks all five paths as evaluator paths (src/aieos_bootstrap/**, tests/unit/**,
# tests/integration/**, tests/property/** on the workflow's pinned list), the reading by which decision D-383 ruled
# TASK-014 critical_cr. The M3 work plan's row gave normal_cr, and TASK-008 kept normal_cr under D-254 P3 with its
# paths on the same list; the stricter class is proposed here and lowers nothing. The change is judged by the base
# version of every evaluator part; the module is not an evaluator part named by DM A29 (no validator, fixture,
# scenario, runner or governor), and no evaluator file at the base changes but the package docstring and __all__.
# Reviews (as TASK-007's): five way-2 reviews by a Claude model other than the implementer's, each under a decision of
# the decision agent (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002; governance
# ai_review for GOV-003; operational ai_review for OPS-003; the cross-model half, which also covers INV-009's rule),
# and three decision-agent reviews (architecture human_review for INV-003, which also checks that the property tests
# cover INV-009's rule and the idempotency of AC6; operational human_review for OPS-002; the cross-model half). Each
# way-2 review record's basis names every article whose entry it covers and addresses each of their rules, beyond what
# the tool parts decide. Each reviewer's prompt is self-sufficient, with the scratchpad's absolute path in its first
# line (D-277), and names for testing: the reading (t1) of AC3; that recovery imports nothing from the runner
# (DEF-0028); that no assert stands in src (bandit B101, D-325).
# Evaluation path (A61; as TASK-007's and TASK-008's): the approved contract is committed on main as its own commit C,
# which changes only docs/tasks/TASK-009.yaml and has one parent equal to base_commit, and is pushed normally; the
# files are drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's
# commits, each carrying the trailer "AIEOS-Task: TASK-009" and no e-mail address in its message, go to the branch
# task/TASK-009 on GitHub, each push under its own decision of the decision agent after a secret scan and a dry run
# against a bare single-branch copy (D-229, D-274), never by force and never deleting; the CI channel runs on each push
# and its records are re-fetched into docs/records/TASK-009.jsonl; main receives the task only at its acceptance, by a
# fast-forward under its own decision. Before each task commit, the added text is scanned with the workflow's SEC-001,
# SEC-002 and OPS-003 patterns (AC11).
# Not applicable: OPS-001 (scope: the repository's refs; the task changes no ref); INV-005 to INV-008, INV-010 and
# INV-011 (their scopes, the decision engine, the governor, evidence records and the policy, meet no path of the
# write-set; the module emits no execution or acceptance decision and judges no evidence); GOV-001, GOV-004 to GOV-006
# and SEC-003 (their scopes, the concept file, the bound artifacts, the decision matrix, the records and pre-genesis
# documents, and .github/, meet no path of the write-set). INV-009 (scope: the event log) is applied as a reading, as
# in TASK-007: no path of the write-set is an event log, but this module returns log bytes, so its tests carry the
# rule (AC5, AC12).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own (CR-002 part 4 limit 5 does not apply).
# Uncovered and stated limits (AC10): the module reads nothing, so how the commits are read from Git and the leases
# from the local store is not shown; no code writes the bytes it returns, and no lease is expired by it; step 3 of
# specification 1 §7 (an intent file against a projection) has nothing to act on, since no projection exists in the
# bootstrap; whether an unfenced write blocks the task's acceptance stays open (specification 2 §10 point 7); every
# review is by AI of one vendor.
task: TASK-009
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/recovery.py, whose function reconcile takes an event
  log's bytes, the commits whose messages the caller read from Git, the leases the local store holds and the recovery
  time, and returns what specification 1 section 7 makes the core do at start: for every commit whose trailer names a
  task and that no task.submitted event names, a compensating task.submitted when a held, unexpired lease on that
  task has the trailer's token, else the observation of an unfenced write; the leases whose expiry has passed; and
  findings that change no state; every event built by TASK-007's eventlog.append, so that its idempotency and fence
  apply unchanged; with a pure helper that reads the AIEOS-Task and AIEOS-Fence trailers of a commit message; with unit,
  integration and property tests in new test modules. It opens, writes and removes no file, reads no clock, keeps no
  lease and changes neither records.py nor eventlog.py.
