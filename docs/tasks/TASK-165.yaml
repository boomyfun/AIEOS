acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only paths of the write set. Production changes only: gate_records.py (one new public function type_records, the private constants it needs, and the module docstring), ci_evidence.py (one new optional parameter typed, its form check, the one call of type_records, and the docstring), eval_inputs.py (the derivation moved before the CI call, the building of the pairs, and the docstring). No production module or import is added. Tests are added in the three write-set test files; an existing test changes only where this contract makes its pinned text false (test_gate_records.py's pin of the module's public names, which gains type_records), and every other existing test passes unchanged.
  - AC2: >-
      The maker. gate_records.type_records(task_id, commit, intent_versions, wanted, steps, recorder) returns a mapping with exactly the keys records and error. task_id, commit, intent_versions, steps and recorder are checked by the same rules as in gate_records; wanted is a list whose entries are dicts with exactly the keys dimension and evidence_type, dimension a non-empty text that UTF-8 can encode, evidence_type one of build and lint; any other form gives error, a short text, with records empty. An empty wanted gives no record and no error. The step names of a type are those that DEFAULT_CHECK_MAP gives for the check of the same name (build, lint), read from that constant and typed nowhere else; DEFAULT_CHECK_MAP is unchanged. For each pair, in order, a repeated pair once: when every step name of the type occurs exactly once with the conclusion success or failure, one record is made, outcome fail when one concluded failure and pass when all concluded success; otherwise no record is made for the pair (fail closed; the governor then names the type as missing). The record has exactly the keys record_id, fact_kind (observation), source_class (deterministic_tool_external_ci), recorder, subject (the task), commit, intent_versions (a copy), evidence_type, dimension, outcome; record_id is the SHA-256 of the five texts "ci-type", the task, the commit, the type and the dimension joined by line feeds, the dimension last because it alone may hold a line feed, so two different five-tuples never join to one text. The function starts no process, opens no file, reads no clock and no network, and never raises an Exception.
  - AC3: >-
      ci_evidence takes one more optional parameter, typed, the last one, default None; a value other than None must have the form of wanted in AC2, which ci_evidence checks with its other arguments, and a wrong form gives the refusal argument (a test passes each wrong form of AC2 to ci_evidence and gets argument, so the two checks do not drift apart unseen). After the maker's gate records, and only when typed holds at least one pair, ci_evidence calls type_records once with the steps of the same chosen run that gives the gate records (the eligible run with the highest run_id and attempt, after every check of the module, the rerun agreement among them; the build and lint step names are in the names that agreement covers, since they are DEFAULT_CHECK_MAP's), and appends its records after the gate records; a maker error gives the refusal maker, with no records. With typed None or empty the answer is the same as at the base, byte for byte in its records, uncovered, evidence and refusal. uncovered and evidence do not change in form or content.
  - AC4: >-
