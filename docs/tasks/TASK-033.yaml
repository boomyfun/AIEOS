# Task contract TASK-033, scope drift (Master Plan revision 3, §4 M4; specification 4 revision 3, section 7 item 2,
# with section 12 point 11 closed by the risk rules' revision 4, policy version v3, DM F38; concept lines 745 and 948).
# Revision 0, drafted under decisions D-696 (Q3), D-702 (Q2, Q3, C1 to C3) and D-701, from the scope note approved by
# decision D-702; brought for approval in its own request; whether it is approved is recorded in the decision files,
# not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-032.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling; R1 and R2 are the scope note's
# readings, accepted by decision D-702 as stated readings, not the specification's own words.
# Task type: implementation. What it adds: one pure module, src/aieos_bootstrap/scope_drift.py. Its function
# non_task_list reads the risk rules' `non_task_paths` line from the policy's text, fail closed; its function claims
# takes, as values, one base commit's facts (the commit, its parent count, its task trailers, its changed paths, the
# write-sets of the named tasks' contracts, the non-task list, the policy's rules in the governor's form, the evaluator
# list and the constitution's and the policy's paths) and returns the drift.detected event of specification 4 section 7
# item 2 when the commit is a claim, with an event id derived from the commit; whether the commit was detected and
# exempt; and what it could not check (uncovered). It reads no Git, no file and no log, and appends nothing: reading the
# facts at the base and appending the event through the core's single writer (TASK-016) are TASK-034's, the caller
# (decision D-702 Q2), not built here.
# The specification's text (spec 4 line 81): "**Scope drift:** the concept's "Commit sửa file không thuộc task nào"
# [...] So (proposed): a base commit with no `AIEOS-Task` trailer, or with a trailer whose contract (the version the
# task's lease named) does not hold a changed path, is detected. A detected commit is not a claim when all its changed
# paths lie in a list of non-task paths that the approved policy at the base names; never by its message or trailer
# alone. A commit that touches the constitution, the policy, the evaluator paths or `.github/` is always a claim. Every
# other detected commit is a `drift.detected` claim, which changes no state [...] and is closed by an authority
# record". The policy's section 2 point 7 (revision 4) fixes the list's meaning and form.
# Reading R1 (proposed; decision D-702): the sentence "A commit that touches the constitution, the policy, the
# evaluator paths or `.github/` is always a claim" is read as a limit on the exemption of a detected commit, by its
# place in spec 4 line 81 (between "A detected commit is not a claim when ..." and "Every other detected commit ..."):
# a detected commit that touches such a path is never exempt. A task commit whose contract holds every changed path is
# not detected, so it is no claim, although its paths are evaluator paths (those are judged as evaluator changes under
# GOV-003 at the task's own evaluation). Reading R2 (proposed; decision D-702): the event's payload is {paths, entities}
# (specification 2 line 190): paths the sorted changed paths that are not non-task, entities the sorted trailer task
# ids; the event id is derived from the commit only, so a rerun gives the same id.
# What it does not do: no Git read, no file read, no policy-file read (the caller gives the text), no writer call, no
# caller, no classification or proposal (specification 4 section 7: DETECT, CLASSIFY, PROPOSE; the last two are
# records of an authority), no closing of a claim, no task state, no lease, no governor rule, no constitution or stale
# finding, nothing under .github/, no policy change, no frozen fixture. It changes no governor, writer, records,
# eventlog, drift, reconcile or other existing module.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain scope_drift; it must not name the
# Resume Check fixture folder (TASK-010's assertion) nor the Risk Engine fixture folder (TASK-020's allow list). No
# module of the repository calls scope_drift yet.
# Risk: high, and change class critical_cr, each computed over the base by script, as for TASK-030 and TASK-032.
# Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule],
# functional [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus
# the evidence_required of the applicable articles.
# Review points (for the five way-2 reviews and the decision agent's three): the list's reading and every fail-closed
# case of AC2; detection (AC3) and its uncovered cases; the four conditions of non-task (AC4), the class computed equal
# to the governor's and compared by test; R1's consequence (AC5); R2's payload and the derived id (AC6); a parent
# count other than one (AC3); purity; AC11's limits.
# Naming (D-544 Q3, as TASK-023 to TASK-032): every test of the three new test modules names the AC ids it stands for
# as "TASK-033 ACn" in its own docstring.
# Evaluation path (A61; as TASK-007 to TASK-032): commit C changes only docs/tasks/TASK-033.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-033", go to task/TASK-033 under their own
# decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-004 and INV-009 (the module writes no file and no log; the
# event is returned, not appended); INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the governor,
# evidence records as stored, the replay and the policy meet no path of the write-set: the module returns an event and
# stores none); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the bound artifacts, the decision matrix,
# the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (it reports claims and blocks no task;
# CR-002 part 4 limit 8 does not apply), so its acceptance is one delegated approval of the decision agent (Master Plan
# section 6), for the decision agent's ruling.
task: TASK-033
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/scope_drift.py, the scope-drift computation of
  specification 4 section 7 item 2: non_task_list(policy_text) reads the risk rules' non-task list, fail closed, and
  claims(inputs) takes one base commit's facts as values (the commit, its parent count, its task trailers, its changed
  paths, the named contracts' write-sets, the non-task list, the policy's rules, the evaluator list and the
  constitution's and the policy's paths) and returns, when the commit is a scope-drift claim, one drift.detected event
  with an event id derived from the commit; whether it was detected and exempt; what it could not check; and, for a
  malformed input, an error and no event (fail closed). It reads and writes nothing. With unit, integration and property
  tests in new test modules, each test naming its AC ids as "TASK-033 ACn" in its own docstring; the integration test
  appends the returned event to an in-memory log with aieos_bootstrap.eventlog.append.
