acceptance_criteria:
  - AC1: >-
      The input of claims. claims(inputs) takes a mapping with exactly the keys commit, parents, trailer_tasks,
      changed_paths, contracts, non_task, risk_rules, evaluator, constitution_path and policy_path: commit 40 or 64
      lowercase hex characters; parents an int (not a bool) of 0 or more; trailer_tasks a list of strings, each
      "TASK-" followed by digits; changed_paths a non-empty list of non-empty strings (a rename given under both its old
      and its new path by the caller, the risk rules' section 2 point 5); contracts a mapping from task id to a value
      (AC3 reads it); non_task a list of strings or None (AC2's result); risk_rules a list (AC4 reads it); evaluator a
      list of strings; constitution_path and policy_path non-empty strings. Any other form gives the result of AC8 with
      error naming the first key that fails, in the order above, and no event (fail closed).
  - AC2: >-
      The list (the risk rules' section 2 point 7). non_task_list(policy_text) takes a string and returns a list of
      patterns or None. It reads section 3's yaml block (the text between the "```yaml" line after "## 3. The rules" and
      the next "```" line) and in it the lines that start "non_task_paths:". Exactly one such line, after the
      "policy_version:" line, of the form `non_task_paths: ["p1", "p2", ...]` (one or more items, ", " between them),
      each item holding no `"`, `,` or `]` and of point 6's form (names of letters, digits, ".", "_", "-" and "*", a
      name holding "**" only as the whole name "**", no empty, "." or ".." name), gives the items in order. Anything
      else gives None: a text that is not a string, no block, no line, a repeated line, a line out of form, an item
      out of form, the line before "policy_version:". None means no path is non-task (fail closed).
  - AC3: >-
      Detection (specification 4 line 81). A commit with parents other than 1 gives no event and an uncovered entry
      {ref commit, detail "not one parent"} (a merge's paths are read against its first parent by the caller, who marks
      a merge uncovered, TASK-034; reading). Otherwise, with no trailer task the commit is detected. With exactly one
      trailer task T, the commit is detected when some changed path is matched by no pattern of contracts[T]
      (aieos_bootstrap.governor.matches, called, not copied); contracts[T] must be a non-empty list of strings of
      point 6's form. With more than one trailer task, with T not a key of contracts, or with contracts[T] out of form,
      the commit is detected and an uncovered entry names the case ({ref the commit, detail "several trailers"}, {ref T,
      detail "no contract"} or {ref T, detail "write set cannot be evaluated"}). A commit that is not detected gives no
      event and is not exempt.
  - AC4: >-
      Non-task paths (the risk rules' section 2 point 7). A changed path is non-task only when all four hold: (1)
      non_task is a list and some pattern of it matches the path (governor.matches); (2) the path's class under
      risk_rules is exactly "low", computed by a function equal to the governor's per-path derivation in derive_inputs
      (the highest class among the rules whose match holds the path; a rule whose match cannot be evaluated matches
      every path, and one whose class cannot be read gives "critical"; a path no rule matches has no class), and every
      rule is a mapping
      with exactly the keys match and class, match a non-empty list of strings and class one of low, medium, high and
      critical (any other rule: no path is non-task); (3) evaluator is a non-empty list of strings of point 6's form
      and no pattern of it matches the path (otherwise no path is non-task); (4) the path is not constitution_path, not
      policy_path and not under ".github/". A unit test compares the class function with
      aieos_bootstrap.governor.derive_inputs on the same rules and single paths, for every rule of the policy at the
      base and paths that hit each rule.
  - AC5: >-
      Claim or exempt (reading R1, proposed, decision D-702). A detected commit is exempt (no event) when every changed
      path is non-task by AC4; otherwise it is a claim and gives one event. A detected commit that touches
      constitution_path, policy_path, a path under ".github/" or an evaluator path is therefore never exempt; a commit
      that is not detected (AC3) is no claim whatever its paths. The module's docstring states R1 as a reading of
      specification 4 line 81 by the sentence's place, not as the specification's words.
  - AC6: >-
      The event (reading R2, proposed, decision D-702). A claim gives exactly one event {event_id, event_type
      "drift.detected", payload}, payload exactly {paths: the sorted changed paths that are not non-task, without
      duplicates, entities: the sorted trailer task ids, without duplicates}; event_id is the SHA-256 hex digest of the
      UTF-8 text "drift.detected", "scope" and the commit joined by LF (as drift's _digest joins its parts), so it
      depends on the commit only and a second call gives the same id. aieos_bootstrap.records.check_payload
      ("drift.detected", payload) finds nothing. The event carries no task_id (the subject is a commit; no task's state
      changes, specification 1 line 86).
  - AC7: >-
      What it does not decide. The module classifies and proposes nothing, closes no claim, changes no task state,
      blocks no task, appends nothing, reads no file and makes no constitution or stale-evidence finding; its docstring
      says so and names the caller as TASK-034 (decision D-702). No module of src/ changes except __init__.py's
      docstring and __all__.
  - AC8: >-
      The result. claims returns a mapping with exactly the keys events, detected, exempt, uncovered and error: events
      the list of AC6 (empty or one event); detected and exempt bools (exempt true only when detected); uncovered a list
      of mappings with exactly the keys ref and detail, sorted by (ref, detail), without duplicates; error None, or for
      a malformed input a short English text, with events [], detected false, exempt false and uncovered []. claims and
      non_task_list are pure functions: the same input gives the same output, and the input is not changed; no
      exception escapes either.
  - AC9: >-
      Purity and the CI checks (INV-001, INV-002, INV-003). The module imports only the Python 3 standard library
      (hashlib and re among the allowed) and aieos_bootstrap.governor and aieos_bootstrap.records; it opens, writes and
      removes no file, reads no clock and no environment, and makes no process, network or model call; no exec, eval,
      compile, __import__ or importlib; no assert in src (bandit B101); no string that names the project-state
      directory. At the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002
      and bandit.
  - AC10: >-
      The event in a log (integration). tests/integration/test_scope_drift_log.py builds, in the test, a policy text
      in policy v3's form, reads its list with non_task_list, runs claims for a claim commit, an exempt commit and a
      commit that is not detected, and appends each returned event in order to an empty in-memory log with
      aieos_bootstrap.eventlog.append (fixed appended_at, no fencing token, no task_id): each result is "appended", the
      final log has records.check_log findings none, and appending the same event again gives "duplicate". No file is
      opened.
  - AC11: >-
      Limits, stated: the facts are the caller's and are not checked against Git, the contracts or the policy at the
      base; the write-sets are the caller's (the version the task's last task.approved names); a commit with other than
      one parent is uncovered; R1 and R2 are readings; the event's appending, reading the base and the caller are
      TASK-034's (DEF-0030). Every existing module and test not in the write set is unchanged, and if one can pass only
      by a change the task escalates (needs_out_of_scope_change).
  - AC12: >-
      Its own tests and the added text. Every test function of the three new test modules names the AC ids it stands
      for as "TASK-033 ACn" in its own docstring and names no other task's AC in qualified form there. The tests write
      and remove no file, and open none except the package's own source files, read for AC13 R9's script checks (as
      TASK-032's erratum E1 reads its AC12). Before each commit, the added text is scanned with the workflow's SEC-001,
      SEC-002 and OPS-003 patterns, and each count is 0; the file names are scanned with the same patterns and the
      records executors' pre-push pattern (D-282).
  - AC13: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 (each malformed form, the first one
      named; no event on error); R2 AC2 (the list read; each None case: no block, no line, two lines, a line before
      policy_version, an item with `"`, `,` or `]`, an item out of point 6's form, an empty list); R3 AC3 (no trailer
      detected; a trailer whose contract holds every path not detected; a path outside it detected; several trailers,
      no contract and a write set that cannot be evaluated, each detected and uncovered; parents 0 and 2 uncovered and
      no event); R4 AC4 (each of the four conditions failing alone; R5's "**/contracts/**" under a listed folder not
      non-task; an evaluator build-file name under a listed folder not non-task; a malformed rule or evaluator list: no
      path non-task; the class function equal to governor.derive_inputs's per-path class on the policy's rules); R5
      AC5 (exempt; claim; a detected commit touching each always-claim kind is a claim; a task commit on evaluator paths
      held by its contract is not detected); R6 AC6 (the payload's keys and values; the id's value; a second call the
      same id; check_payload finds nothing; no task_id); R7 AC8 (the keys, the sorting, no duplicates, purity: the input
      unchanged, a second call equal; no exception for any input form); R8 AC7 and AC9 (a script check of the module's
      imports and of the absence of open, write and clock calls, and of the docstring's R1 and TASK-034 sentences); R9
      AC12 (the naming). Unit tests in tests/unit/test_scope_drift.py; AC10 in
      tests/integration/test_scope_drift_log.py; property tests in tests/property/test_scope_drift_properties.py
      (standard library only, fixed seeds): for random well-formed inputs, an event is given exactly when the commit
      is detected and some changed path is not non-task; exempt implies detected and no event; the payload's paths are
      exactly the changed paths that are not non-task; the result never depends on the order of changed_paths,
      trailer_tasks, non_task or evaluator. tests/run_tests.py, unchanged, runs all groups.
