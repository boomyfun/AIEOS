constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      import_task by stand-ins (keyword callees; a counting clock), over a log without the task: one clock read, one
      _head read, one read_log, one write_contract with (root, task, text), then one append (root, 'task.drafted',
      {contract_version 'v1', contract_hash the SHA-256 of text's UTF-8 bytes}, the event id, now, IMPORT_RECORDER)
      with task_id the task and no fencing token, in that order; "done" with the path, the hash, the event id and
      'appended'; the text is the template filled with the task and the head only (every other line equal to a
      literal expected text in the test), its keys in TASK-096's order, its owner_kept_act true, its risk critical,
      its git capability forbidding push, its write set outside the project-state directory; the filled text parses
      by task_contract.parse_contract(text, task) with no finding and by base_inputs' contract parser with every
      CONTRACT_NEEDS key; the resulting log passes records.check_log; a rerun over that log gives
      "refused" "exists" with no write; each callee defaults at call time (mock.patch.object of gitread.run,
      writer.read_log, writer.write_contract and writer.append_event made after import are the ones called); the
      result has exactly IMPORT_KEYS.
  - AC2: >-
      import_task's refusals: each wrong argument ("argument", nothing called); a raising or out-of-form clock
      ("clock"); _head's findings or a raising read ("head"); a raising or non-bytes read_log or a log check_log
      refuses ("log"); a log holding any event of the task, a duplicate line included ("exists", no write); a
      write_contract "refused" "exists" ("exists") or "layout" ("layout"), any other refusal, a raise or an answer
      out of form ("write"), each with no append; an append "refused" or raising ("append", with the exact finding
      "append: the contract <path> (<hash>) is written, the task.drafted is not"; E8); a head that is not 40 lowercase
      hex ("head", nothing written; E4); no Exception escapes; by ast, import_task and the names beginning _import
      name no open,
      exec, eval, compile, __import__, subprocess, os, sys or time, and no string
      constant naming the project-state directory, every such path built from writer.STATE_DIR (D1).
  - AC3: >-
      writer.write_contract over real temporary folders (in tests/unit/test_writer.py, a TASK-097 class): "done" with
      ".aieos/tasks/<task>.yaml" and the exact bytes, over a folder where .aieos/tasks exists; no .aieos/tasks folder
      gives "layout" with nothing made; a second call refused "exists" with the file unchanged; an argument out of
      form, text '' among them ("argument"), a root that is no folder ("root"), a link at root, .aieos, .aieos/tasks or
      the path ("link", where the platform allows links, and in every case with os.path.islink patched to return
      True), a raise ("unwritable"); its only
      open modes 'ab' and 'rb'; no exception escapes; writer.py's names test (:2080-2095) widened by write_contract
      and the two prefixes and passing; write_contract and the names beginning _write_contract above the TASK-066
      marker.
  - AC4: >-
      The command by stand-ins (mock.patch.object of launcher.import_task; a counting clock): "import TASK-1 --root R"
      gives one import_task call with (R, 'TASK-1', the clock); each argv out of form (no task, a bad task, no --root,
      a flag twice, a value empty or beginning "--", an extra word) gives exit 2 and USAGE with nothing called, inside
      a runtime too; an environ holding any one of the three RUNTIME_VARS ('' included) gives exit 1 and the runtime
      refusal with nothing called; "done" gives exit 0 and the two lines, or under --json the exact sorted string;
      "refused" gives exit 1 and "finding: import: refused <reason>" then the findings; each answer out of form (not a
      dict, a dict subclass, other keys, a result outside the two, a done with a reason or a path, hash or event id
      not a
      str, an append outside its two words, a reason outside IMPORT_REASONS, a non-str finding) gives the out-of-form
      finding; a raising import_task gives "import: a step raised <type>"; a raising _render_import
      gives "cli: a step raised <type>"; the earlier commands' tests all still pass.
  - AC5: >-
      The modules: launcher.py's import set unchanged (tests/unit/test_launcher.py :697-707); its names test passes;
      launcher.py's and writer.py's diffs from the base are added lines only (checked at G3 by a scratchpad git-diff
      script); cli.py's imports unchanged and its refused names and strings (tests/unit/test_cli.py :333-375) pass;
      the deterministic rule passes with launcher.py and cli.py at NONE and writer.py at its ALLOW; no recorder text
      holds "owner"; the new test file uses no tempfile, sqlite3, shutil, subprocess or open, roots only the literal
      'C:/import-root-97', and uses no one-argument .replace() and no .replace(target=...).
  - AC6: >-
      Docstrings: writer.py's module docstring gains a paragraph holding "write_contract", "TASK-097", "create-only"
      and "'ab'", and keeps every phrase of its pinned tests; launcher.py's gains "import_task", "TASK-097", "drafts
      nothing", "task.drafted", "not changed" (base_inputs), "reads the caller's clock once" and
      "writer.write_contract" (E5), and keeps every pinned phrase; cli.py's gains
      "aieos import", "TASK-097", "drafts nothing" and "not run on any real project", holds "COMMANDS, tasks, end,
      status, init, launch, approve, edit, reject or import" and "end and init call it after the parse" and not
      "COMMANDS, tasks, end, status, init, launch, approve, edit or reject"; USAGE names import; the five widened tests
      pass; every test of tests/unit/test_cli_import.py names "TASK-097 AC", checked by its own naming test, more than
      20 tests.
  - AC7: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) task.drafted appended before the write
      (AC1); (2) the hash of other bytes than the written text (AC1); (3) a fencing token passed to append (AC1); (4) a
      callee bound at import time (AC1); (5) the template's owner_kept_act false (AC1); (6) the template's risk lower
      than critical (AC1); (7) push allowed in the template (AC1); (8) the exists check dropped (AC2); (9) a raise
      escaping import_task (AC2); (10) import_task naming os (AC2, AC5); (11) a write refusal not stopping the append
      (AC2); (12) write_contract opening in 'wb' (AC3's ast test of the open modes); (13) write_contract's size check
      dropped (AC3); (14) write_contract's link check dropped (AC3, the patched os.path.islink case); (15) the command
      not refusing inside a runtime (AC4); (16) the in_runtime check made before the parse (AC4); (17) the --json line
      without sort_keys (AC4);
      (18) cli.py importing writer (AC5); (19) a line of approval_act changed (AC5, the G3 diff script); (20) a line of
      init_layout changed (AC5, the G3 diff script); (21) a string naming the project-state directory in launcher.py
      (AC2, AC5); (22) write_contract's layout check dropped (AC3); (23) the template's write set under the
      project-state directory (AC1); twenty-three copies in all; each copy made in a scratchpad script at
      G3, not committed; the governor's evaluate at acceptance (the shadow) with any difference named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6]}
  - {gate: G3, check: constitution, args: [AC7, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
