acceptance_criteria:
  - AC1: >-
      Triggers and permissions (decisions D-766 C1, D-765 C2, D-773). The workflow's `on:` holds exactly `push` with
      `branches: [main]` and `paths:` listing exactly `bench/**`, `.github/workflows/aieos-bench.yml` and
      `tests/unit/test_export_fixtures.py`, and `workflow_dispatch` with a comment saying it is for the owner only; no
      other trigger (no pull_request, no schedule, no other branch). A top-level `permissions: contents: read`; no job
      widens it.
  - AC2: >-
      Jobs and checkout (decision D-766 C2). Two jobs: `linux` on ubuntu-24.04 and `windows` on windows-latest, each
      with `timeout-minutes` of at most 20 and an explicit `shell:` for its run steps (bash on Linux; on Windows the
      shell named in the job's defaults). No `uses:` line anywhere (no action at all). Each job's first step fetches
      exactly the commit `$GITHUB_SHA` from the repository's public URL with no credential and no token (a `git init`,
      `git fetch --depth 1 origin $GITHUB_SHA` and `git checkout --detach FETCH_HEAD`, or an equivalent that names the
      SHA), and the next step fails unless `git rev-parse HEAD` equals `$GITHUB_SHA`.
  - AC3: >-
      No secret, token or write. The file references no `secrets.` expression, no `GITHUB_TOKEN`, no `github.token`
      and no `env` value from a secret; it pushes, tags, uploads, comments and calls no API; nothing in it writes
      outside the runner's workspace and temporary folder.
  - AC4: >-
      The export (decisions D-765 C1, D-766 C3, D-773, D-774). `python tests/unit/test_export_fixtures.py --root
      tests/conformance` reads every file of fixtures/, fixtures_rc/ and fixtures_risk/, named literally as the tuple
      ('fixtures', 'fixtures_rc', 'fixtures_risk'), with pathlib's read_bytes only, decoded as UTF-8; a folder named
      exactly `__pycache__` inside one is passed over, and any other entry that is not a .py file fails closed. It
      takes each file's `DATA = r'''…'''` string and parses it, and prints to standard output one JSON document: an
      object whose keys are "<folder>/<file stem>" and whose values are the parsed objects, dumped with sort_keys=True
      and ensure_ascii=True. It imports only json, sys, pathlib and unittest (io and contextlib allowed in the tests),
      imports no fixture and no repository module, and writes nothing. Its docstring states that it depends on the
      three frozen folders and that the two earlier checks allow it by name.
  - AC5: >-
      Fail closed. The command line is the export only when the first argument is `--root`; otherwise the module is
      the test runner. The export exits non-zero and prints nothing to standard output, with its message on standard
      error only, on a file not in the exact form (no `DATA = r'''`, more than one, or text after the closing quotes
      other than one newline), on JSON that does not parse, on a missing folder, or on a missing, unknown or repeated
      argument; the whole document is built before the single write. Tests cover each case on texts held in memory and
      on a path that does not exist, and no file is made; one test runs the export over the real folders, read only,
      and checks 31 entries (19, 11 and 1) and an ASCII-only document.
  - AC6: >-
      The workflow's steps. After the checkout check, each job runs the export and redirects its standard output to
      "$RUNNER_TEMP/fixtures.json", and the step fails if the export fails; it prints the toolchain versions (node, go,
      rustc), and for each of bench/ts/, bench/go/ and bench/rust/ runs that port's step only if the folder exists (a
      test of the folder in the step itself), so no port step runs in this task. On Windows the job's default shell
      is `bash` or `pwsh`, never `powershell`. The port steps' commands are named in the file as the ports' contracts
      will need them (proposed in this task's code, reviewed with it) and may be changed only by those tasks' own
      decisions.
  - AC7: >-
      Advisory only. Nothing in the new workflow writes a record the governor or the existing CI reads; its results
      are its own job logs. The existing workflow .github/workflows/aieos-checks.yml is unchanged, byte for byte, and so
      are its two pins.
  - AC8: >-
      The suite and the tools. tests/run_tests.py is unchanged; running it loads the module only as a unit test and
      runs no export. INV-002's manifest check in the existing workflow's deterministic_rule step reports no finding for
      the task's paths.
  - AC9: >-
      Purity and the CI checks (INV-001 to INV-003). The module and its tests use the standard library only; the module
      runs no process and no model, reads no network, clock or environment except its arguments, and writes nothing;
      its only output is standard output and standard error. At the task's commits the existing CI steps report no
      finding: G0 scope, deterministic_rule, OPS-003, SEC-001, SEC-002, SEC-003's record and bandit. Before the first
      push, the added lines are scanned for the bandit test patterns the CI applies, as in TASK-036 AC9; the scan is a
      stated limit, the CI's bandit run is the evidence.
  - AC10: >-
      Naming and its own tests. Every test function names "TASK-039 ACn" in its own docstring; a naming test reads the
      loaded TestCase classes' docstrings. The tests open only the module's own source, the workflow file (read only,
      for AC1 to AC3 and AC6 by text), tests/run_tests.py (read only), texts held in memory, and the fixture folders
      read only. Every earlier test passes; the two tests tests/integration/test_conformance_rc_set.py and
      tests/integration/test_conformance_risk_set.py change only by adding 'tests/unit/test_export_fixtures.py' to the
      allowed-module tuple that their not_allowed function reads (the tuple's closing line may be rewrapped to hold
      it); nothing else in them changes. If any other earlier test can pass only by a change outside the write-set,
      the task escalates (needs_out_of_scope_change).
  - AC11: >-
      Stop conditions (decision D-766 C4). If the repository is not public, if the hosted runners would cost money,
      or if any step needs a secret, a token, write access or a setting, the task stops and the point goes to the owner
      (A66, fail closed); none is assumed away.
