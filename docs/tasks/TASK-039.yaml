# Task contract TASK-039, the stack benchmark's workflow and fixture export (Master Plan revision 4, §4 "The benchmark
# and the stack ADR"; docs/plan/m4-exit-review.md §6; decisions D-765 and D-766).
# Supersedes TASK-038 (decision D-776: G0 reads the write-set only from the adding commit). It is TASK-038's contract
# with that contract's errata E1 (decision D-773) and E2 (decision D-774) written into its text, the task id and the
# base changed; TASK-038 is never accepted.
# Revision 0, drafted under decisions D-765 (C1 to C4), D-766 (C1 to C5), D-773, D-774 and D-776; brought for approval
# in its own request; whether it is approved is recorded in the decision files, not in this file. Fields and value forms
# follow specification 2 §5.1 and the contracts of TASK-007 to TASK-038. Readings marked "(reading)" are the worker's,
# for the decision agent's ruling.
# Task type: implementation. What it adds: a new CI workflow file, .github/workflows/aieos-bench.yml, that runs the
# stack benchmark of the review's §6 on GitHub's hosted Linux and Windows runners, and the export of the frozen
# conformance fixtures' JSON by text, held with its tests in tests/unit/test_export_fixtures.py and run as a script that
# prints to standard output, which the workflow redirects into the job's temporary folder. The export lives in a test
# module because the CI channel's deterministic_rule lets a module under tests/ import only the standard library and
# aieos_bootstrap and refuses every file write (decision D-773). The two earlier checks that limit which modules name
# the RC and risk fixture folders name the new module (decision D-774). The workflow's port steps (TypeScript, Go,
# Rust) are built in and skipped until a port's folder bench/<language>/ exists at the repository root (decision D-773:
# the CI file rule refuses non-.py files under src/ and tests/), so the three port tasks change no .github/ file unless
# a port step's command must change. No port is written here.
# What it is not: the benchmark's results are advisory (A31) and never feed the governor's gates, the existing CI
# channel's records or any evidence entry (A29: the workflow runs code from the commit it checks); the workflow is not
# a trust-boundary measurement (Master Plan §9 item 3 names P-CRED, P-GH, P-LOC and C13 only); the stack choice is
# the owner's, asked with the results (decision D-765 Q5).
# The existing CI workflow .github/workflows/aieos-checks.yml, its governor pin and its Resume Check pin are not
# touched (decision D-765 C2; D-748: a pin is replaced, never emptied, and none is changed here).
# Owner points (A66, fail closed; decision D-766 C4): the new workflow grants no write, uses and references no secret
# or token, changes no repository or security setting and costs nothing (the repository is public by
# docs/WORKING-RECORDS.md line 9; GitHub-hosted standard runners are free for public repositories, from GitHub's
# published billing rules, not read from the account). If any of these is not so, the task stops and the point is
# the owner's (money, secrets, write access or settings). Triggers: pushes to main touching bench/**, the workflow file
# or the export module only (decisions D-766 C1, D-773); workflow_dispatch is present only as a trigger for the owner
# and is never used by the agent without its own decision; no other branch is pushed.
# Risk: critical, and change class critical_cr, each to be computed over the base by script (the scripts of TASK-038
# with only the write-set and the header line changed): .github/** is R9 (critical); tests/** is R2 (medium) with
# R3's fail-closed reading (high); all four paths are evaluator paths of GOV-003's pinned list (the workflow under
# .github/**, the module under tests/unit/** and the two tests under tests/integration/**); computed:
# risk_class39.py "task risk class: critical", gov003_class39.py "GOV-003 evaluator change: yes (4 of 4 paths)".
# Profile (assurance-model.md §5, gov-AIEOS, critical): high's entries plus architecture [human_review], met for
# gov-AIEOS by the decision agent's review, and functional [the property/fuzz entry]; the cross-model entry by the pair
# of reviews (a way-2 review and the decision agent's separate review).
# Review points (five way-2 reviews and the decision agent's): the workflow's triggers, permissions, absence of any
# action, secret or token, and the checkout pinned to GITHUB_SHA (AC1 to AC3); the export's fail-closed reading
# (AC4, AC5); that nothing feeds the existing CI or the governor (AC7); the shell and paths on Windows (AC2, AC6); that
# the existing workflow and pins are unchanged (AC7); that the two allow-list additions change nothing else (AC10).
# Naming (D-544 Q3): every test this task adds names the AC ids it stands for as "TASK-039 ACn" in its own docstring.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-039.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-039", go to task/TASK-039 under their own decisions; main receives
# the task only at its acceptance. (reading) The new workflow's first run is at the landing on main, since its trigger
# is main only; the task's own evidence comes from the existing workflow at the task's commits, and the new workflow's
# first run at the landing is read as a check after acceptance, not as evidence of it.
# Not applicable: OPS-001 (no ref changed by the task's code); INV-004 to INV-008 and INV-010 to INV-011 (no project
# state, decision engine, governor, evidence record, replay or policy path in the write-set); GOV-001, GOV-004 to
# GOV-006 (the concept file, bound artifacts, the decision matrix, the records and pre-genesis documents meet no path
# of the write-set). SEC-003 applies (a .github/ path), under A66 as above.
# Owner-kept acts: none, on the conditions above; if any condition fails, the task is the owner's (CR-002 part 4
# limit 5), fail closed.
task: TASK-039
contract_version: v1
task_type: implementation
objective: >-
  Add .github/workflows/aieos-bench.yml, a CI workflow that runs the stack benchmark's jobs on GitHub's hosted Linux
  and Windows runners with read-only permissions, no action, no secret and no token, triggered only by pushes to main
  that touch bench/**, the workflow file or the export module (and by the owner through workflow_dispatch); and the
  export function in tests/unit/test_export_fixtures.py, run as a script, which prints the frozen conformance
  fixtures' JSON, read by text, as one document to standard output, failing closed on any other form; with its unit
  tests; and name that module in the two earlier allow-list tests of the RC and risk fixture folders. The existing
  workflow and its pins are not touched; no port is written; the results are advisory and feed nothing.
traces_to:
  - docs/plan/m4-exit-review.md#6
  - docs/plan/master-plan.md#4
  - docs/pre-genesis/constitution.md#SEC-003
