constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      No behaviour change. For each of claude_code_read_hook.py and claude_code_store.py, an acceptance-time script
      parses the base's and the head's source, removes the docstring node of the module and of every function and class,
      and finds ast.dump of the two trees equal (every statement, expression, constant, import and definition
      unchanged); it then lists every changed docstring and refuses any not named in AC2 to AC4 (the module docstring and
      run's and main's of claude_code_read_hook.py; the module docstring of claude_code_store.py), and within them any
      changed sentence not named there. Every existing test of both modules passes with only the change named in AC4.
  - AC2: >-
      The read hook's sentences that said more than the code does (DEF-0089 P1, P2, P3), in claude_code_read_hook.py:
      (a) P1, at :49-50, "a hook killed by that timeout stores nothing." becomes "a hook killed by that timeout may store
      nothing, and a kill after add_reads' COMMIT may have stored the read."; (b) P2, at :38, "Exit code 0 on every
      outcome, and the program prints nothing:" becomes "Exit code 0 on every outcome, and the program prints nothing,
      for every exception inheriting Exception (a BaseException that is not an Exception, or a failure before main runs,
      can give a non-zero exit code and text):", and run's "Exit code 0 always; never raises." and main's "Prints
      nothing; never raises." end "never raises an exception inheriting Exception." in place of "never raises."; and at :39-40 "An error while reading standard input, the environment or the
      clock gives exit code 0 too, with nothing written." becomes "An error inheriting Exception while reading
      standard input, the environment or the clock gives exit code 0 too, with nothing written."; (c) P3,
      at :38, "a PostToolUse hook runs after the read," becomes "a PostToolUse hook runs after the read (as documented,
      unmeasured: C6),". A new test pins, whitespace collapsed, each new phrase ("a kill after add_reads' COMMIT may have
      stored the read", "a BaseException that is not an Exception", "(as documented, unmeasured" in the module docstring;
      "never raises an exception inheriting Exception" in run's and in main's docstring; "An error inheriting
      Exception while reading" in the module docstring) and that each replaced phrase
      ("timeout stores nothing", "never raises.", "An error while reading") is absent.
  - AC3: >-
      The read hook's wording (DEF-0089 P5, P6, DA-1 (ii)), in claude_code_read_hook.py's module docstring: (a) P5, at
      :47-48, "a limit in the fail-open direction, kept because add_reads checks the lease after its own wait, so a second
      clock reading would leave about 5 seconds anyway." becomes "a limit in the fail-open direction, kept (decision
      D-1484 C2): a second clock reading before add_reads would not close it, since add_reads checks the lease against
      the now it is given only after its own lock wait of up to about 5 seconds."; (b) P6, at :30, "(specification 5 line
      108; specification 7)" becomes "(specification 5 section 7 and section 11 point 7; specification 7)"; (c) DA-1 (ii), one
      sentence added as a new paragraph between step 6 (:24-25) and "The working folder ..." (:27): "RESULT_KEYS, the four keys of run's result in that order, is a
      public constant of this module, as SESSION_VAR and ROOT_VAR (the two names step 2 reads) are.". A new test pins the three new phrases ("kept
      (decision D-1484 C2)", "specification 5 section 7 and section 11 point 7", "RESULT_KEYS, the four keys of run's result"), that
      "kept because" and "line 108" are absent, that hook.RESULT_KEYS equals ('exit_code', 'outcome',
      'reason', 'findings'), and, in a new test that runs Flow().run(...) over a listed set (the 14 bad-argument cases of
      :130-136; the judge answers "enforce_nothing", "refuse" and "tied" with read_paths "uncovered" and "read";
      add_reads "done", "refused" and an exception), that each result's key set equals set(hook.RESULT_KEYS).
  - AC4: >-
      The store's wording (DEF-0089 P4), in claude_code_store.py's module docstring at :57-59: "where the hook entry
      takes them from is a later contract's. A now earlier than the real time would make an expired lease read as
      unexpired (the fail-open direction), so that contract must take now from the process clock." becomes "this module's two
      hook-side callers, claude_code_read_hook (task TASK-068) and claude_code_pretool_hook (task TASK-072), take them
      from the environment, the process's own working folder and the process clock. A now earlier than the real time
      would make an expired lease read as unexpired (the fail-open direction), so every caller must take now from the
      process clock." The pin at tests/unit/test_claude_code_store.py :311, 'a later contract\'s', is replaced in place
      by 'this module\'s two hook-side callers, claude_code_read_hook (task TASK-068) and claude_code_pretool_hook (task
      TASK-072)', the function's docstring gaining "and TASK-073 AC4"; every other phrase of that function is kept, and
      "a later contract's" is absent from the module docstring (asserted in a new test).
  - AC5: >-
      Subclasses fail closed (DEF-0089 P7), shown as the code is: (a) stdin_bytes of a subclass of bytes (a made-up
      class) gives exit 0, "skip", reason "argument", findings ["argument: stdin_bytes"], and no stand-in is called;
      (b) a session id of a subclass of str, with a recording stand-in judge answering "tied", reaches add_reads (the
      read hook itself does not refuse it, stated in the test's docstring); with the real writer.add_reads and a made-up
      root, the result is exit 0, "lost", reason "argument", findings[0] starting "argument:" (add_reads' exact-type
      check, writer.py :690, refuses before any root is used); (c) on a real store (a new class in
      tests/integration/test_writer_files.py, the store made by tied_store), the same str-subclass session id with the
      real judge and add_reads gives "lost", reason "argument", and the store's dump is unchanged; the findings are ["argument: ValueError"], as a scratchpad probe on main's code
      showed (D-1763 C2; a plain str on a fresh store gave "recorded" and one added line of the dump); the same test also
      makes the call with a plain str 's-1' on a second fresh store and asserts "recorded" and exactly one added line
      starting 'INSERT INTO "reads"', so the unchanged dump is not vacuous. If the task's
      run shows another outcome for (c), the worker stops and escalates (spec_conflict) rather than changing the
      expectation.
  - AC6: >-
      The integration class's departures (D-1510 C2 E1; DEF-0089 P8), by in-place changes of two functions of
      ReadHookFiles in tests/integration/test_writer_files.py: (a) test_a_read_is_recorded_once takes dump(root) before
      the first call and after each call: after the first, the lines of the dump, counted with collections.Counter, gain
      exactly one line, which starts 'INSERT INTO "reads"' and holds 'made-up/a.txt', and lose none; after the second the
      dump equals the one after the first; its existing assertions are kept; (b)
      test_nothing_is_stored_without_a_live_tie asserts, besides the reason prefix, the exact findings of the two
      "leases" cases: ['leases: not exactly one unexpired lease of the session (0)'] for the expired lease and ['leases:
      not exactly one unexpired lease of the session (2)'] for the two leases (writer.py :560), every other case and
      assertion kept. Each function's docstring adds "and TASK-073 AC6".
  - AC7: >-
      The property direction and the TypeError path (DEF-0089 P9, DA-1 (i)): (a) a new property function in
      tests/property/test_claude_code_read_hook_properties.py, fixed seed 73, at most 50 cases, at least half of them
      forced to the live tie (JUDGED[0]), the covered read (READS[0]) and a session id drawn from ('s-1', ' '), asserts
      that add_reads is called if and only if judge's answer is JUDGED[0], read_paths' answer is READS[0] and the
      environment's session id is a non-empty str, in the order judge, read_paths, add_reads, and that the outcome is
      "recorded" for STORED[0] and "lost" for every other STORED value; the existing functions are byte-identical; (b) a
      new unit test: add_reads' stand-in answering a writer.StoreResult('refused', 'path', ['path: x']) whose findings
      attribute is then set to None gives exit 0, "lost", reason "entry", findings ["entry: TypeError"] (step 6, not
      step 5's ["entry: add_reads"]), pinned as it is; the code is not changed.
  - AC8: >-
      The test files change only as named, and the pins hold. An acceptance-time script by source segment (as TASK-068
      AC8's) refuses any change in the four test modules other than: added functions, classes and module-level
      assignments of new names, and the imports they need; the one phrase of test_claude_code_store.py :311 and its
      function's docstring (AC4); the two functions of AC6; every other existing definition byte-identical, none
      removed. Every new test function names "TASK-073 ACn" in its own docstring. Every pin named in the header passes
      unchanged. Before each commit the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns,
      each count 0; at the task's commits the CI steps deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit report no
      finding. The unit and property additions use stand-ins only, write no file and read sources only by pathlib's
      read_bytes relative to __file__; real stores, sqlite3 and tempfile only in tests/integration/test_writer_files.py;
      no real path of this machine's user folders, no real session id, no credential-shaped string, no literal "/tmp".
  - AC9: >-
      Broken copies (DEF-0089 P8, P12), made and run in the scratchpad, outside tests/, each run with all four changed
      test modules and the integration class ReadHookFiles copied beside the source (P8), each failing at least one test:
      for every phrase pinned by a docstring word check of the two modules (test_claude_code_read_hook.py R6WhatIsStated's
      22 and R7StoreWords' 4, test_claude_code_store.py R6WhatIsStated's 26 with AC4's phrase, and the new phrases of AC2
      to AC4) one copy that removes that phrase alone (P12); one copy per replaced sentence of AC2 to AC4 restoring the
      base's text; a copy of claude_code_read_hook.py accepting a bytes subclass (type(...) is not bytes replaced by not
      isinstance(..., bytes)); a copy whose _stored catches the TypeError and gives ["entry: add_reads"]; a copy of the
      read hook calling add_reads with a session id copied to str (str(session_id)), against AC5 (b); a copy of the read hook that skips add_reads on a whitespace-only session id, against AC7 (a)
      (the new property function); a scratchpad-only copy of writer.py (writer.py stays outside the write-set) whose
      finding at :560 counts len(leases) in place of len(live), against AC6 (b)
      (test_nothing_is_stored_without_a_live_tie); a copy of the read hook that calls writer.add_reads a second time
      with the extra path 'made-up/b.txt', against AC6 (a) (test_a_read_is_recorded_once); a copy of the read hook
      that calls add_reads without the live-tie guard, against AC7 (a) (the new property function); and a copy with
      RESULT_KEYS reordered, against AC3 (its new test). The copy-making script refuses any copy whose edit text is not found exactly once; the
      list of copies and each one's failing tests go to the decision agent with the acceptance request.
  - AC10: >-
      What stays and is stated (shown by the records, not by a test): docs/tasks/TASK-068.yaml is not changed (P1's half
      in its header, :146, and P11 stay for its next revision, DEF-0089 :18); P10, DA-3 (iii), R2's point and the limits
      stay in DEF-0089; DEF-0089's log line at the records step names each point taken by this task (P1 to P9, P12,
      DA-1 (i), DA-1 (ii), E1) and each point left with where it goes, as the header's lists say.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 600k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC2, AC3, AC4, AC5, AC6, AC7]}
  - {gate: G3, check: constitution, args: [AC1, AC8, AC9, AC10, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
