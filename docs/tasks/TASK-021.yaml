acceptance_criteria:
  - AC1: >-
      The input (specification 2 section 5.1). check(contract) takes a mapping with at least the keys
      acceptance_criteria (a list of one-entry mappings from an AC id, a string "AC" followed by digits and optionally
      one lowercase letter, to its text, a non-empty string), verification_plan (a list of mappings with gate, a string
      "G" followed by digits, check, a non-empty string, and optionally args, a list of non-empty strings) and
      constitution (a list of non-empty strings); other keys are ignored. Any other form of these three fields, a
      repeated AC id, or a contract that is not a mapping gives exactly one finding of kind "malformed" naming the
      first form that fails, and no other finding (fail closed: a malformed contract is never "covered").
  - AC2: >-
      An uncovered AC (specification 4 section 6 item 1; concept line 730). For a well-formed contract, each AC id of
      acceptance_criteria that appears in the args of no gate of verification_plan gives one finding of kind
      "uncovered" naming that id, in the order of acceptance_criteria.
  - AC3: >-
      An empty list. A well-formed contract whose acceptance_criteria is the empty list gives one finding of kind
      "no_acceptance_criteria".
  - AC4: >-
      A stray args entry. For a well-formed contract, each distinct args entry, over all gates in plan order and within
      a gate in args order, that is neither an AC id of acceptance_criteria nor an entry of the contract's constitution
      list gives one finding of kind "stray_arg" naming that entry and its gate (reading: article ids of the contract's
      own constitution list are allowed, as every G3 plan on main names them).
  - AC5: >-
      The result. check returns a list of findings, each a mapping with exactly the keys kind, ref and detail (ref the
      AC id, args entry or field concerned, detail a short English text); for a well-formed contract the order is the
      no_acceptance_criteria finding, then the uncovered findings, then the stray_arg findings; a contract with none of
      them gives the empty list. check is a pure function: the same input gives the same output, and the input is not
      changed.
  - AC6: >-
      The record (specification 4 section 6 item 1 and section 10; specification 2 section 6.2).
      coverage_record(task_id, contract_version, findings, recorder, source_class) returns None for an empty findings
      list; otherwise the one record {record_id, fact_kind "observation", source_class, recorder, subject task_id,
      evidence_type "ac_coverage", outcome "blocking", blocking_kind "other"}, whose record_id is the SHA-256 hex digest
      of the UTF-8 text "ac-coverage", task_id and contract_version joined by LF (one record per contract version,
      spec 4 section 10); source_class must be "deterministic_tool_local" or "deterministic_tool_external_ci", task_id
      a task id "TASK-" followed by digits, contract_version "v" followed by digits, and recorder a non-empty string,
      else ValueError; records.check_record finds nothing in every record it returns. It writes and appends nothing.
  - AC7: >-
      What it does not decide. The module decides no acceptance and no execution, refuses no approval, and settles
      neither how a corrected contract clears such a record nor whether the governor should name an uncovered AC as a
      missing gate result (DEF-0042 point 7; specification 4 section 12 item 7): its docstring says so. No module of src/
      changes except __init__.py's docstring and __all__.
  - AC8: >-
      Purity and the CI checks (INV-001, INV-002, INV-003). The module imports only the Python 3 standard library
      (hashlib and re among the allowed) and aieos_bootstrap.records; it opens, writes and removes no file, reads no
      clock and no environment, and makes no process, network or model call; no exec, eval, compile, __import__ or
      importlib; no assert in src (bandit B101); no string that names the project-state directory. At the task's
      commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC9: >-
      Limits, stated: the mapping is by AC id at gate level only; test-to-AC (spec 4 section 6 item 2) and a record key
      for covered ACs (item 3; DEF-0042 point 8) are not this task's; there is no caller in the core and no YAML reader
      in src; clearing the record is open (AC7). Every existing module and test not in the write set is unchanged, and if
      one can pass only by a change the task escalates (needs_out_of_scope_change).
  - AC10: >-
      The contracts on main, read only (decision D-515 C2). tests/integration/test_ac_coverage_contracts.py reads
      docs/tasks/TASK-001.yaml to TASK-021.yaml from the tree with pathlib's read_bytes only, extracts the three fields
      with its own line-based reader (an AC line "  - AC<n>:" under acceptance_criteria, a gate line "  - {gate: ...,
      check: ..., args: [...]}" under verification_plan, the line "constitution: [...]"), asserts that each contract
      gives well-formed values, runs check over each, and asserts that the findings equal a list written in the test,
      which the task's request states with its source lines: a finding on an accepted contract is data, reported to the
      decision agent; it is not fixed by this task and reopens no acceptance.
  - AC11: >-
      The added text. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0; the file names are scanned with the same patterns and the records executors'
      pre-push pattern (D-282).
  - AC12: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 (each malformed form, one finding only); R2
      AC2; R3 AC3; R4 AC4 (an AC id of another contract, a typo, an article not in the constitution list, each a finding;
      an article in the list not); R5 AC5 (the order, the keys, purity: the input unchanged, a second call equal); R6
      AC6 (None for no findings; the record's keys and values; its id; check_record finds nothing; each ValueError); R7
      AC7 and AC8 (a script check of the module's imports and of the absence of open, write and clock calls). Unit tests
      in tests/unit/test_ac_coverage.py; AC10 in tests/integration/test_ac_coverage_contracts.py; property tests in
      tests/property/test_ac_coverage_properties.py (standard library only, fixed seeds): for random well-formed
      contracts, every AC id is either named by a gate or reported uncovered, never both; adding a gate that names every
      AC leaves no uncovered finding; the result never depends on the order of the input's other keys.
      tests/run_tests.py, unchanged, runs all groups.
