# Task contract TASK-021, the AC coverage check (Master Plan revision 3, §4 M4; specification 4 revision 3, section 6
# item 1; concept line 730). Revision 0, drafted under decisions D-515 (Q3, C1, C2) and D-512 (C3), brought for
# approval in its own request; whether it is approved is recorded in the decision files, not in this file. Fields and
# value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-016.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: one pure module, src/aieos_bootstrap/ac_coverage.py, whose function check
# takes one task contract as values (specification 2 §5.1: acceptance_criteria, verification_plan, constitution) and
# returns the findings of specification 4 section 6 item 1, and whose function coverage_record returns, when there is a
# finding, the one record of specification 2 §6.2 that item 1 names (outcome blocking, blocking_kind other), checked
# by records.check_record. It writes nothing, appends nothing and reads no file: the caller gives the contract's values
# and writes the record, if at all, through the core's single writer (TASK-016), which this task does not call.
# What it does not do (D-515 C1): it does not settle DEF-0042 point 7 (specification 4 section 12 item 7): how a
# corrected contract clears such a record, and whether the governor specification should name an uncovered AC as a
# missing gate result instead, stay open. It changes no governor, writer, records or conformance code, nothing under
# .github/ and no policy. It does not parse YAML: the integration test reads the contracts on main with its own
# line-based reader of the three fields, which is test code, not the module's (reading: a contract reader for the
# core is a later task's; stated in AC9).
# The finding "an args entry that names no AC of the contract" (spec 4 line 70): a gate's args also name constitution
# articles (for example TASK-016's G3 args: AC9, AC11, INV-001, ...), so an args entry is a finding unless it is an AC
# id of the contract or an article id the contract's own constitution list names (reading, for ruling: otherwise
# every G3 plan on main would be a finding).
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain ac_coverage; it must not name the
# Resume Check fixture folder (TASK-010's assertion) nor the Risk Engine fixture folder (TASK-020's allow list). No
# module of the repository calls ac_coverage yet.
# Risk: high. R2 matches src/** and tests/** (medium); R3 read fail closed matches them too (risk rules section 2
# point 3); no path of the write set meets R10 (.aieos/) or R11 (tests/conformance/**); the highest wins (to be
# computed over the base by script, as for TASK-020). Profile (assurance-model.md §5, gov-AIEOS, high): functional
# [unit_test], architecture [deterministic_rule], functional [integration_test], security [static_security_analysis]
# and architecture [ai_review (cross-model)], plus the evidence_required of the applicable articles.
# Change class: critical_cr (to be computed over the base by script: all write-set paths are on the workflow's pinned
# evaluator list, src/aieos_bootstrap/** and tests/unit|integration|property/**).
# Reviews (as TASK-016's): five way-2 reviews by a Claude model other than the implementer's, and the decision
# agent's three, each brief naming for testing: the three findings and only them; that the record passes
# records.check_record and is blocking with kind other; purity (no file, no clock, no write); the limits of AC9.
# Evaluation path (A61; as TASK-007 to TASK-020): commit C changes only docs/tasks/TASK-021.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-021", go to task/TASK-021 under their own
# decisions; main receives the task only at its acceptance. The task push's CI base run is RISK-01's first
# conformance run over the set file of DM F35, reported advisory, never MEASURED (decision D-509 C4).
# Not applicable: OPS-001 (the task changes no ref); INV-004 and INV-009 (the module writes no file and no log);
# INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the governor, evidence records as stored, the replay
# and the policy meet no path of the write-set: the module returns a record and stores none); GOV-001, GOV-004 to
# GOV-006 and SEC-003 (the concept file, the bound artifacts, the decision matrix, the records and pre-genesis
# documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (it adds a finding; CR-002 part 4
# limit 8 does not apply), so its acceptance is one delegated approval of the decision agent (Master Plan section 6),
# for the decision agent's ruling.
# Uncovered and stated limits (AC9): the mapping is by AC id only, at gate level (spec 4 section 6 item 1); test-to-AC
# (item 2) and a record key for covered ACs (item 3, DEF-0042 point 8) are not this task's; no caller in the core and no
# YAML reader; clearing the record on a corrected contract is open (DEF-0042 point 7).
task: TASK-021
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/ac_coverage.py, the AC coverage check of specification 4
  section 6 item 1: check(contract) takes a task contract's acceptance_criteria, verification_plan and constitution as
  values and returns its findings, in a fixed order: each AC id that no gate's args names, an empty acceptance_criteria
  list, and each args entry that is neither an AC id of the contract nor an article id of its constitution list; a
  contract whose three fields are not in their forms gives one malformed finding (fail closed). coverage_record returns,
  when there are findings, the one record of specification 2 section 6.2 with outcome blocking and blocking_kind
  other, and None when there are none; it writes nothing. With unit, integration and property tests in new test
  modules; the integration test runs check over the contracts TASK-001 to TASK-021 in the tree, read only, and reports
  what it finds as data.
