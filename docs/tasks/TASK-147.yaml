objective: >-
  Add the NEW module src/aieos_runtime/task_capture.py, written to the revision-28 shape of .github/workflows/aieos-checks.yml at c186685b, and its unit test tests/unit/test_task_capture.py. THE PUBLIC FUNCTIONS (fixed here so that BT1b can inject them; no exception escapes either; each returns a mapping with exactly the keys named): capture(repo, ref, old_head, paths, message, identity, state_name) -> {'result': 'done', 'commit': <40 lowercase hex>} or {'result': 'refused', 'reason': <word>, 'findings': [..]}; restore(repo, paths, classes, state_name) -> {'result': 'done'} or {'result': 'refused', 'reason': <word>, 'findings': [..]}. THE ARGUMENTS are ALL given by the caller and the module makes no decision about scope: repo an absolute path; ref exactly refs/heads/task/TASK-<digits>; old_head the 40-hex id of HEAD that the caller read; paths a non-empty list of exact repository-relative file paths in git form (never a directory); classes (restore only) a mapping of each path to exactly one of 'modified', 'added', 'deleted' (the classes are the caller's; the module does not re-derive them, a stated limit); message the commit message (non-empty, UTF-8, no NUL); identity a mapping with exactly the keys 'name' and 'email' (the author and committer name and e-mail; each non-empty, none containing '<', '>', LF or NUL); state_name the project-state directory's name, a PARAMETER (never a literal: aieos_string is false for this path). THE CLOSED SET OF reason WORDS: invalid-argument, head-moved, ref-exists, name-list-mismatch, git-failed, timeout (each has a test; the findings list gives the detail; no other word is returned). VALIDATION before any process starts (reason invalid-argument, each its own finding and its own test): an empty path list; duplicate paths (also compared without regard to letter case); a path with a backslash, a ':', an empty segment, a '.' or '..' segment, a leading '-', an absolute path, a segment ending in a dot or a space, any character outside 0x20 to 0x7e, or any of '"', '*', '?', '[', ']'; a path whose first segment equals state_name, or any segment equal to '.git', compared without regard to case; for restore, a path without a class, a class without a path, or a class that is not one of the three; an empty state_name or one that does not begin with '.'; an empty or unsafe identity; a bad ref; an old_head not 40 lowercase hex; an empty message or one with NUL. A stated invariant, not a validation item: every '<paths>' slot of every argument vector is a subset of the listed paths (shown by the fake subprocess of AC4). THE PROCESS FORM (the CI rule of revision 28 judges exactly this): ONE subprocess.run call whose only positional argument is ['git'] + list(CAPTURE_OPTIONS) + ['-c', 'core.hooksPath=' + os.devnull] + <a name>, with keywords from shell the constant False, timeout an int constant (its value named in the module and in AC1) and env a name (all three required) plus stdout, stderr, stdin, cwd, check, input; the module-level literals CAPTURE_FORMS, CAPTURE_OPTIONS and CAPTURE_ENV_FIXED each bound ONCE and equal to the workflow's pins (the ten forms of the nine subcommands read-tree, update-index, write-tree, commit-tree, update-ref, rev-parse, diff, restore, clean; the tuples are those at aieos-checks.yml c186685b); both CAPTURE_FORMS and CAPTURE_ENV_FIXED are read; exactly one top-level `import os`, and no other binding of the name os (no `import os.path`, no `from x import os`, no alias, parameter, def, class, global or match capture); no other binding of the three pins (no global, augmented assignment, parameter, except-as or alias); no def or class named list and no binding of list; no store of an attribute devnull; no setattr, globals, vars or sys.modules (computed routes are forbidden by this contract so that the review has a rule to apply); no import of any module of aieos_bootstrap; every argument vector is validated against CAPTURE_FORMS before the call (a form not in the table, or a placeholder filled with a value out of its form, is refused before any process starts; the '<null>' of CAPTURE_ENV_FIXED is replaced by os.devnull). THE ENVIRONMENT is built from nothing: PATH (every entry absolute), SYSTEMROOT when present, the pairs of CAPTURE_ENV_FIXED, GIT_INDEX_FILE ONLY for read-tree, update-index and write-tree (D-6617 C3: not for rev-parse, commit-tree, update-ref, diff, restore or clean), and GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL, GIT_COMMITTER_NAME, GIT_COMMITTER_EMAIL for commit-tree only; no GIT_DIR or GIT_WORK_TREE from the caller's environment reaches git. THE INDEX FILE is <absolute git dir from rev-parse --absolute-git-dir>/aieos-capture-index, a fixed name, never deleted, overwritten by read-tree. capture: rev-parse --absolute-git-dir; rev-parse --verify HEAD must equal old_head (else reason head-moved); read-tree HEAD; update-index --add --remove -- <paths> (on the temporary index; it keeps HEAD's file modes and handles deletions; a directory path fails here); write-tree; commit-tree --no-gpg-sign <tree> -p <old_head> -F - (message by the input keyword); update-ref <ref> <commit> <forty zeros> (create only; no form of CAPTURE_FORMS reads the ref, so the module tells an existing ref from another failure ONLY by update-ref's non-zero exit code together with the standard-error text under LC_ALL=C (pinned in CAPTURE_ENV_FIXED): when the text contains the substring that the probe BT1a_probe.py case 4 shows git writes for a create-only update of an existing ref (the substring is 'already exists': the probe BT1a_probe.py case 4, run once at D-6625 C1 with git version 2.52.0.windows.1, showed rc 128 and the text "fatal: update_ref failed for ref 'refs/heads/ctl': cannot lock ref 'refs/heads/ctl': reference already exists"), the reason is ref-exists, and every other update-ref failure is git-failed; AC1 has a test for each of the two with a fake process); rev-parse --verify HEAD must still equal old_head; diff --no-ext-diff --no-textconv --name-only <old_head> <commit> (the commit id from commit-tree in the second id slot, D-6623 E2) must list exactly the given paths (a mismatch is reason name-list-mismatch and the ref STAYS); it returns the commit id. restore: for the paths of class 'modified' or 'deleted' `restore --source=HEAD --worktree -- <paths>` and for the paths of class 'added' `clean -f -- <paths>` (never -d, never -x), on exactly the listed paths; it does NOT read the status (CAPTURE_FORMS has no status form: the core checks the tree afterwards, BT1b). A forced stop between the steps or a refused step leaves what exists on disk and in the repository as it is; the module never undoes.
