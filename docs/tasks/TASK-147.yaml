acceptance_criteria:
  - AC1: >-
      The interface. task_capture.py defines capture and restore with the argument lists and return forms of the objective and the closed set of reason words, and nothing else public; the int timeout constant is 60 (seconds) for every call; no exception escapes either function (a test calls each with a fake process that raises, times out or returns a non-zero code and sees a refused mapping with the right reason word); the module's docstring states the limits of AC8 in plain words and without the labels MEASURED, ENFORCED or GUARANTEED (OPS-003).
  - AC2: >-
      Validation. Each refusal of the objective is a test that shows NO process was started (a fake subprocess that records calls): empty path list; duplicate paths including a letter-case duplicate; backslash; ':'; empty segment; '.'; '..'; leading '-'; absolute path; a segment ending in a dot; a segment ending in a space; a character below 0x20 and one above 0x7e; each of '"', '*', '?', '[' and ']'; first segment the state name in another letter case; a '.git' segment (first and later, in another letter case); for restore a class missing, extra or invalid; an empty state name; a state name not beginning with '.'; an empty or unsafe identity (empty, '<', '>', LF, NUL); a bad ref; a bad old_head; an empty message; a message with NUL; an argument vector not in CAPTURE_FORMS.
  - AC3: >-
      The pins and the source shape (in the unit test, by reading files with read_bytes and parsing with ast and literal_eval, as tests/unit/test_gitread.py :568, :608 and :630 do): the module's CAPTURE_FORMS, CAPTURE_OPTIONS and CAPTURE_ENV_FIXED equal the workflow's; the module source has exactly one subprocess.run call, exactly one top-level `import os`, no other binding of os, of the three pins or of list, no store of devnull, and no use of setattr, globals, vars or sys.modules. The cut-out run of check_capture on the module source is NOT a test (a test cannot use exec, compile, importlib or runpy): it is done by the scratch harness of AC5 and by the CI run of AC7.
  - AC4: >-
      The environment, with a fake subprocess: for every call the env keyword holds only PATH, SYSTEMROOT when present, the CAPTURE_ENV_FIXED pairs ('<null>' replaced by os.devnull), GIT_INDEX_FILE only for read-tree, update-index and write-tree, and the four identity variables only for commit-tree; GIT_DIR, GIT_WORK_TREE and GIT_INDEX_FILE set in the caller's environment never reach git; every call list begins ['git', '--no-pager', '-c', 'core.fsmonitor=false', '-c', 'diff.external=', '-c', 'commit.gpgsign=false', '-c', 'core.hooksPath=' + os.devnull] and then the form; the commit-tree call carries --no-gpg-sign and the message in the input keyword as UTF-8 bytes; the diff call carries old_head and the commit id from commit-tree; every '<paths>' slot is a subset of the listed paths.
  - AC5: >-
      The real-git behaviour, shown at acceptance by the scratch harness (the one whose exact source the decision agent releases before acceptance; at the contract's approval the scratchpad file BT1a_harness_v3.py (v2 with H8 of D-6625 C3 applied)) (outside the repository, never run in E:\AIEOS: it builds a throwaway repository in the scratchpad, imports a COPY of the module taken from the task's commit (git show into the scratch directory; never the file in E:\AIEOS) and reads a COPY of the workflow file taken from the same commit, runs each case below and prints one line per case with its result; its exact source is released by the decision agent before acceptance; its unedited output is acceptance evidence, labelled worker-supplied; if git's behaviour breaks a case, that is a finding and is brought to the decision agent, the case is not loosened). Cases: capture of a modified path, of an added path and of a deleted path in one commit; the commit's parent is the old HEAD, its tree differs from HEAD's exactly in the listed paths with HEAD's file modes kept, its message, author and committer are the given ones; refs/heads/task/<id> is the only ref written and main is unchanged; the real index and HEAD are byte-equal before and after capture and after restore; a second capture for the same ref is refused (ref-exists, the ref stays); a HEAD that moved since old_head is refused (head-moved); a name-list mismatch is refused and the ref stays; a directory path is refused by capture; an added path in a NEW directory is removed by restore (clean) and the emptied directory stays; restore recreates the deleted path, restores the modified path and does not touch an untouched file; a hook planted at .git/hooks/reference-transaction and a core.hooksPath set in the repository's config to a planted directory do NOT run; a filter driver named in the repository's config: the harness records whether it ran (the expected result is that it runs, and it is stated as AC8 (4)); the harness also runs the cut-out check_capture on the built module source (expecting 0 findings) and check_source on it, like SR evidence ci28_selftest.py.
  - AC6: >-
      The suite. tests/run_tests.py discovers the new unit test without a change (it discovers test_*.py in each group, run_tests.py :12-20); the whole suite passes by the slice method (D-6249 C2, D-6328 E1.6) and the new file passes alone; the test identity has an e-mail value with no '@' at all (git accepts one) and no GitHub URL appears in an added line; the CI's own SEC-002 rule is run on the new files before the task push (L-0048, L-0050); no test file works around the deny sets of check_source (no io.FileIO, os.open variants or computed imports: a test that would need that is not written). THE ONE AMENDMENT OF AN EXISTING TEST (D-6635): in tests/unit/test_gitread.py exactly two places change and no other byte: the docstring of test_no_other_src_module_imports_subprocess (lines 603-605: it names the capture module and reads 'as amended by TASK-134 and TASK-147', with no qualified 'TASK-147 AC' form, because the test of the criteria in that file would then fail) and the expected list at line 613, which gains 'src/aieos_runtime/task_capture.py' after 'src/aieos_runtime/claude_starter.py' (the order of the sorted walk); no test is added, removed, weakened or skipped. The change is under tests/unit/**, an EVALUATOR path (aieos-checks.yml :524-528), so the GOV-003 evaluator-change report names it (a report, not a block); it is a one-line widening of an assertion that the new module's existence requires, as TASK-134 widened the same list for the starter; the CI step 'GOV-003 base tests (report only)' will show the base's test_gitread.py failing against the change, and that failure is expected and named at acceptance.
  - AC7: >-
      The evidence of the task push (D-6616 C2). It is the FIRST real run of check_capture and of the revision-28 bandit lines. On that run the CI read must show: the deterministic_rule summary line "deterministic_rule: files N, changed paths M, findings 0" with N equal to the files count of the last main run plus 2, and no FAIL line; and the bandit invocation of `[ -e "$CR" ]` run on src/aieos_runtime/task_capture.py with its own output lines ("No issues identified" or its findings). An absent line is a finding, not a pass, and comes to the decision agent; a finding from either step blocks acceptance. src/aieos_runtime/** is not in the EVALUATOR list (aieos-checks.yml :525), so the module is not reported as an evaluator change; its guard is the check_capture rule plus the reviews.
  - AC8: >-
      Limits, class, evidence and departures, stated at acceptance. (1) The classes are the caller's; restore trusts them. (2) A path inside the write set that git ignores is not seen by the status form and is not captured by the core (BT1b); the module acts only on listed paths. (3) Directories emptied by clean stay on disk (no -d). (4) A filter driver named in the clone's own configuration runs under update-index --add and restore; the options close it only in part; the core's repeated configuration read (refusing filter.* and core.worktree) is BT1b's. (5) git is found by its name (the limit of gitread.py :49-53). (6) The state name rule accepts any name beginning with '.' (gitread's limit). (7) The module is not called by anything until BT1b. (8) The reading that src/aieos_runtime is outside INV-001's "core's source tree" is the decision agent's (D-6609), not the concept's meaning and not an owner decision. (9) restore discards uncaptured work-tree changes on the listed paths and does not check that a capture came first; the order of calls is BT1b's. (10) A listed path that names a directory would make restore and clean act on everything under it; the module has no file-system access to tell; in BT1b the paths come from the status form with --untracked-files=all, which lists files; capture refuses a directory path (update-index fails) and the harness shows it. (11) The stored content is git's form under the clone's attributes (eol and text conversion). (12) One fixed index-file name means two captures at once in one clone are not supported. (13) The real-git behaviour is not re-checked by the CI suite (it is shown by the harness at acceptance). (14) The risk class is high; the evidence profile is that of docs/pre-genesis/assurance-model.md :82 as for TASK-144 AC4 (3): unit_test, deterministic_rule, static_security_analysis, ai_review by a PAIR of blind reviews on Haiku 5.5 in their own sessions (same vendor, stated as a departure), a per-article review, a decision_agent_review; the shadow governor result is a stated departure; no launched session is used. (15) Departures from the decisions it applies: D-6617 C3 is amended by D-6623 E1 (harness in place of an integration test file); others none known at the contract's approval. (16) The ref-exists text is git's own English message under LC_ALL=C and can change between git versions; a changed text makes an existing ref read as git-failed, and the ref is left alone either way; the probe saw git version 2.52.0.windows.1; the AC5 harness case "second capture for the same ref is refused (ref-exists)" is the end-to-end check of the substring through the module's real options. (17) The probe (D-6625 C1) showed on that git version that restore --worktree leaves the real index bytes and ls-files -s equal (also after a status refresh), that update-index through a temporary index keeps mode 100755, and that a planted reference-transaction hook runs under plain update-ref but not under the null hooks path: AC5's byte-equality and hook cases stand as written. (18) The module has public names that are not callable (REASONS, CLASSES, INDEX_NAME, EXISTS_TEXT, ZERO); 'nothing else public' means no other public callable (stated at the D-6635 read; the unit test reads it so). (19) The state-name rule is stricter than the objective's validation text and than (6): it refuses a name that is only '.' and a name that holds '/' or a backslash (a tightening, not a loosening). (20) The git directory that rev-parse prints is decoded as ASCII, so a repository under a path with a non-ASCII character is refused as git-failed (fail closed; a limit). (21) pyflakes and bandit were not available on the machine that wrote the post-images; their first run on the three files is the CI run of the task branch push (a red result there is fixed inside the write set before main moves). (22) TASK-146 replaced: the committed docs/tasks/TASK-146.yaml stays on main as history of a contract that never ran, as TASK-132 did