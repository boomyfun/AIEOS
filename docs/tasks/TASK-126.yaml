task_type: implementation
objective: >-
  Make the launch reader refuse the segment forms that `aieos run` already refuses. In src/aieos_bootstrap/launcher.py add one private helper, `_segment_forms_ok(path)`, true when the path does not start with "/" or "./", does not end with "/", and has no segment that is "", "." or ".." or that ends with "." or " " (the test `_run_path_ok` already makes, launcher.py:1829-1833), and use it in two places: `_run_path_ok` (its result for every input stays what it is today) and `_launch_write_set` (in the same condition as the pattern rule, so a path for which the helper is false gives (None, ['contract: a write-set path is outside the pattern rule']), the finding it gives today for a path outside the pattern rule, and launch_outside ends the session without calling the starter, with the reason it already gives for a contract read that does not pass). The order of the checks in `_launch_write_set` stays: the pattern rule and the segment forms first, then a first segment that holds "*", then the exact first-segment test `_under_state_dir`. A "*" in a segment after the first stays allowed to the launch reader. The directory is taken from writer.STATE_DIR; its name is never written as a literal in src. Tests are added to tests/unit/test_cli_launch.py. The docstring limit that TASK-125 wrote in launcher.py is updated to say what is now refused.
