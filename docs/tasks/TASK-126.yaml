acceptance_criteria:
  - AC1: >-
      The refusal. `launcher._launch_write_set` gives (None, ['contract: a write-set path is outside the pattern rule']) when any path of the write set starts with "./", or has a segment "." or ".." or a segment that ends with "." (and, for the form the pattern rule admits, a segment that ends with " " cannot occur because the pattern rule refuses a space already), and gives what it gives today for every other write set (a test passes a list of write sets that today give (paths, None) and a list that today give a refusal, and checks the answers are unchanged, byte for byte). The test cases for the new refusal are `./x`, `a/./b`, `../x`, `a/../b`, `src/../<state directory>/x` (the directory name is taken from writer.STATE_DIR in the test), `./<state directory>/x`, `<state directory>./x`, `a/b./c` and `x.`. The test is made with `launcher.launch_outside` and the `World` stand-ins of tests/unit/test_cli_launch.py, as the TASK-125 tests are: the answer's reason is 'contract', the calls are exactly clock, begin, contract_at, clock, finish_outside, write_handoff in that order, the starter is not called, and the findings hold the finding above. The list of write sets that must be unchanged holds a plain path, a glob after the first segment (`docs/**`, `src/*.py`), a path whose first segment only begins with the directory name, a path that holds the directory name as a later segment, and the paths the TASK-125 tests already pass, and holds none of the new forms (a Grep of docs/tasks at the drafting of this contract must find no write-set item that begins with "./" or holds a "." or ".." segment or a segment ending with "."; its output is brought to the approval).
  - AC2: >-
      The order. A test pins the order of the checks in `_launch_write_set`: a path that is both outside the pattern rule (for example a space) and has a first segment holding "*" gives the pattern-rule finding; a path whose first segment holds "*" and that has a segment form the helper refuses (`*/../x`, `*./x`) gives the pattern-rule finding; a path whose first segment is the directory name and that has a segment form the helper refuses (`./<state directory>/x`, `<state directory>/./x`; the name taken from writer.STATE_DIR in the test) gives the pattern-rule finding; a path whose first segment holds "*" and is not outside the pattern rule gives 'contract: a write-set path may cover the project-state directory'; a path whose first segment is the directory name in upper case gives 'contract: a write-set path is under the project-state directory'. The three findings are unchanged from TASK-125 (they are tested there for the single forms; this test pins the order, the segment forms included).
  - AC3: >-
      The helper and parity. `_segment_forms_ok` is used by `_run_path_ok` and `_launch_write_set` and by nothing else; `_run_path_ok` gives for every input the answer it gives at base_commit (a test compares it with the base text's behaviour on a list that holds a plain path, the directory itself, a path under it in each letter case, a path with the directory name as a later segment, a path whose first segment only begins with the directory name, and every form the function already refuses, including the forms of AC1).
  - AC4: >-
      Purity (INV-001, INV-002, INV-004). The directory's name appears as a string in no changed src file (the string rule of spec 7 :57 and the pinned tests in test_cli_init.py, test_cli_import.py and test_cli_approve.py); no new finding text contains it; no new import; no new process form; no read of the clock or of the file system beyond what the module does today. The new docstring sentences use none of the effect labels MEASURED, ENFORCED and GUARANTEED, and no string constant in a changed src file is exactly "valid", "accepted" or "approved" (aieos-checks.yml :1800-:1813), and no string in a changed src file names the state directory (aieos-checks.yml :1756-:1758; test_cli_init.py :297); the deterministic rule, OPS-003, SEC-001, SEC-002 and bandit report no finding at the task commits; the pinned phrases in the launcher.py docstring that other modules test stay unchanged (the sentences of TASK-109 AC3 and AC6 are not touched).
  - AC5: >-
      Tests and records. Each added test function's docstring begins "TASK-094 ACn (amended by TASK-126 ACm)", in the form of TASK125StateDir in tests/unit/test_cli_launch.py, so the module's rule that every test names "TASK-094 AC" still holds; no existing test changes; the whole suite passes locally (`timeout 110 python tests/run_tests.py < /dev/null`) and on the CI; no test starts a runtime or touches this repository's real state. The risk class is high; the evidence profile is that of assurance-model section 5 for high, as for TASK-125 (unit_test, integration_test, deterministic_rule, static_security_analysis, ai_review cross-model by a pair of reviews on Haiku 5.5 and a separate decision_agent_review, plus the profile's other entries); the expected governor shadow result at the GOV-003 row is a stated departure as in TASK-125 AC5 (the change class is critical_cr; the acceptance names it). The raw output of the step 'GOV-003 base tests (report only)' of the task-branch run is brought at acceptance with each base-test failure named. The first run is on the task branch (DEF-0115's route). The limit is stated in the launcher.py docstring in plain words: the launch reader refuses the segment forms that `aieos run` refuses and a first segment holding "*", and it still allows a "*" in a later segment; a contract whose write set is read at the base by another reader (the hook, base_inputs) is not changed here; the state commit is not automated (option S) and the root's state after the check is open (DEF-0101).
  - AC6: >-
      Limits. No change to cli.py, writer.py, gitread.py, base_inputs.py, the hook, the workflows, any spec or doc, any DEF file (their Log lines are written by their own decisions after landing: DEF-0095 gets a Log line that the three forms and the order are closed; spec 7 :75's wording follows in a later revision); no launching of a runtime; no change to the autonomy level or the measurement protocol.
