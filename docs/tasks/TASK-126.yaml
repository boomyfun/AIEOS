# Task contract TASK-126 (r1; the follow-up task ordered at D-5319 C3 after TASK-125: step 1 of the first-real-run prerequisites, the second half of a1.1; session ce14b08a, 2026-11-07). Drafted in the scratchpad; whether this text is approved is recorded only in the decision agent's decision that names its SHA-256, not in this file. Form: TASK-125 (docs/tasks/); the worker's own claim until checked.
# Why: TASK-125 made the launch reader refuse a write-set path whose first segment is the project-state directory (in any letter case) or holds "*", and stated the limit in its acceptance: a first segment that differs from the directory name only by a trailing dot, a leading "./", or "."/".." segments are not refused by the launch reader in that task (review finding 1 of D-5319). `aieos run` refuses all of these forms (launcher._run_path_ok), so a hand-written or imported contract whose write set reads src/../<state directory>/x, ./<state directory>/x or <state directory>./x passes the launch reader. This task closes the three forms and the order check (finding 2), before the runtime starter (a2) and before any real launch.
# Not in this task: the state commit and its automation (option S), the "committed at the base" finding, the root's state after the check (DEF-0101 open part (a)), the runtime starter (a2), a change to the glob rule (a "*" outside the first segment stays allowed to the launch reader), any change to cli.py, writer.py, gitread.py, the hook, base_inputs.py, the workflows, any spec or docs.
# Risk, change class: high, as TASK-125: R2 reads src/** and tests/** as medium, and R3 cannot be evaluated so it matches every path it could cover (risk-rules section 2 point 3); the change class is critical_cr because the CI's EVALUATOR list holds src/aieos_bootstrap/** and the tests folders.
task: TASK-126
