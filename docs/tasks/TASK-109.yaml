acceptance_criteria:
  - AC1: >-
      The fifth form. gitread.SUBCOMMANDS is ('cat-file', 'diff-tree', 'rev-list', 'rev-parse', 'status') bound once as a literal tuple (the workflow's revision 15 accepts it). The form
      is a module constant STATUS_HEAD = ['status', '--porcelain=v1', '-z', '--no-renames', '--untracked-files=all', '--ignore-submodules=all', '--', '.'] and form_error accepts the
      status subcommand only when args equals STATUS_HEAD followed by exactly one more argument ':(exclude)' + NAME where is_state_name(NAME) holds: a str of 2 to 40 characters from
      the ASCII letters, digits, '.', '_' and '-', whose first character is '.', with at least one letter or digit, '..' nowhere and no '/' (so '.', '..', 'src', 'docs', '-x', 'a/b' and
      magic characters are refused and '.aieos' is accepted); a dot-name such as '.github' still passes the rule, so the pin of the NAME to writer.STATE_DIR is the launcher test, stated in limit (2). The launcher passes list(STATUS_HEAD) + [':(exclude)' + writer.STATE_DIR] (the reading of spec 7 r7's "written as a constant" under
      the fallback ruled in D-4139 C1, because test_gitread.py :399 pins gitread's imports, so gitread cannot import writer; a launcher test pins that the whole argument list passed to read equals
      list(gitread.STATUS_HEAD) + [':(exclude)' + writer.STATE_DIR]). gitread.py gains no import, no new os attribute or os call, no literal of the state directory's name, and still calls subprocess.run once;
      every other form, FIXED_OPTIONS and environment() are unchanged. Every deviation from the form is refused before any process starts: another option, a different order, a
      missing or extra argument, a NAME out of form, a non-str, the form with the subcommand missing. The docstring lists the fifth form and states the limits of stated limit (5).
  - AC2: >-
      The step "root". launcher.start, right after the step "base" (a HEAD that is the base tip) and before the log read, reads the status form once through the same read callee
      (read(repo, args, TIMEOUT)); a clean root (b'' output, exit 0, error None) goes on; the whole of start is otherwise as today. The gone sessions' records and the expiry still
      run before it; a refusal or a non-grant at "root" opens no session row, no lease, no adapter.start or end, calls neither read_log nor held, and returns head_commit. The
      arguments check is unchanged. `launch_outside` is unchanged (it maps a "not granted" through and any other non-granted answer to "refused").
  - AC3: >-
      The outcomes. A non-empty answer gives "not granted" with the reason "root" and the findings 'root: <n> entries (changes against HEAD in the index or the working tree, or untracked files)' and at most 20 lines 'root: <repr of the
      entry's path bytes>' in git's order (the number counts all entries; the names are the paths as git gave them, as bytes, with no decoding). "refused" with the reason "root" and a
      'root: ...' finding for: an answer that is not a mapping, error not None (a refusal of the form or a timeout), a non-zero exit, output that is not bytes, an entry that is not two
      status characters, a space, a non-empty path and a NUL, each status character being one of ' ', 'M', 'T', 'A', 'D', 'R', 'C', 'U', '?' and '!' (so ' M' for an unstaged change,
      '??' for an untracked file and the unmerged pairs such as 'UU' and 'AA' are entries, and '!!' cannot occur because the form has no --ignored), an answer that does not end in the NUL of its
      last entry (the answer split on NUL must end with an empty element; b'' is zero entries), and an entry whose status characters are '##' (a defensive refusal: the form has no --branch).
      The parser is a private pure function of launcher.py, _root_entries(output), returning (entries, None) or (None, finding); it raises nothing and is covered by tests with stand-in
      answers only; the integration test of AC5 calls it by that name.
  - AC4: >-
      The order and the call bounds. Tests show: the status read is the third read (after HEAD and the base tip) and before read_log: the callee names begin
      ['expire', 'read', 'read', 'read', 'read_log', 'held', ...] on a granted path; a refusal or non-grant at "root" ends the callee names at ['expire', 'read', 'read', 'read'] and no
      later callee is called; the gone sessions' callees still come first; with a clean stand-in the rest of start's calls are as before. A raise in the status read gives "refused"
      with the reason "root" and no escape (the existing step guard). The launcher module docstring has the step 3b and states the limits (1) to (8) of the header in plain words.
  - AC5: >-
      The pins and the tests. tests/unit/test_gitread.py: the import and attribute pin (:399-:427) is unchanged and passes; the SUBCOMMANDS pin (:469) is amended to the five; added
      tests, each docstring naming 'TASK-024 ACn' with the words 'amended by TASK-109': the accepted status form; each deviation refused (a table); is_state_name's accepted and refused
      names (the table includes 'src' refused and '.github' accepted by the rule); the form's options as a table equal to the contract's list; the real-command shape. tests/unit/test_launcher.py: the Repo stand-in answers the status form (clean by
      default, dirty and malformed answers settable); the callee-order pins are amended to three reads; added tests, each docstring naming 'TASK-086 AC1 (amended by TASK-109)' or
      the AC it amends: clean continues, dirty gives "not granted"/"root" with the cap and the repr, each refusal kind, the order, no later call, a raise, the argument list built from
      writer.STATE_DIR, the findings with a path holding a newline and a non-ASCII byte. tests/unit/test_launcher_gone.py: ok_head answers the status form with b''. In
      tests/integration/test_launcher_repo.py the Intercept answers the exact status form with b'' (like the exact HEAD and base forms) and every other read is forwarded
      unchanged. tests/integration/test_gitread_repo.py gains one test that runs gitread.run on the repository's own clone with list(gitread.STATUS_HEAD) + [':(exclude)' + writer.STATE_DIR]
      (no '.aieos' literal in the test; test_gitread_repo.py's module docstring "the four pinned forms" is amended to name the fifth) and asserts error None, exit 0 and that every entry parses by the launcher's parser, whatever it holds (it shows that CI's git accepts the options); no test
      makes a temporary repository, starts a process itself or writes into the repository.
  - AC6: >-
      The stated limits. The docstrings of gitread.py and launcher.py state, in plain words, the eight limits of the header (once, before the grant, so a change between the read and the grant is not seen; the state directory left out; the
      ignore set; what may not be counted; the filter question with its (i) to (vi); the first run of the workflow's SUBCOMMANDS check on the task branch; the git version; the
      self-build's clean-root consequence), and the later A66 decision that drops the four-subcommand tuple after this task lands. DEF-0101's Log line (which carries the filter limit) and any Log line of DEF-0095 or DEF-0105 whose text changes are
      written by their own decisions after landing.
  - AC7: >-
      Parity and purity (INV-001, INV-002, INV-004). tests/conformance/, the native ports, the CI files, writer.py, cli.py, base_files.py, base_inputs.py and every file of the
      forbidden list are unchanged; no new import in either src file; no new process form beyond the one status form; the state directory's name appears as a string in no changed
      src file; the new docstrings and findings use none of the effect labels MEASURED, ENFORCED and GUARANTEED (OPS-003's rule allows them only on a line that cites a decision-matrix row), and no string constant in a changed src file is exactly "valid", "accepted" or "approved" (aieos-checks.yml :1729-:1742); the deterministic rule (including revision 15's SUBCOMMANDS check on gitread.py), OPS-003, SEC-001, SEC-002 and bandit report no finding at the task commits.
  - AC8: >-
      The CI evidence. On the aieos-checks and aieos-native runs of the accepted commit every job and step is successful, read by run id (the first run of revision 15's check on
      gitread.py is on the task branch); on main after the records commit likewise. Each push and each GitHub job-data read is a decision of the decision agent, outside the
      capabilities above.
  - AC9: >-
      The records (L-0034, L-0037). The task's evidence records' forms are built and checked through records.check_record and a governor shadow over a dry records list at the
      approval request, with their raw output: per-article records, and the profile entries of risk high; the expected result is NEEDS_REWORK at the GOV-003 row as in TASK-102 to
      TASK-108, stated in the acceptance as a departure. The contract's budgets and exit conditions are printed at the first step of the work (L-0037).
