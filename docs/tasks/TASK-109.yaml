# Task contract TASK-109 (draft r3 (r1: the D-4140 edits E1 to E4; r2: the review R109c's findings as ruled in D-4141; r3: the D-4141 edits E1 to E4), session c7d6f32b, 2026-10-31; direction ruled in D-4128, D-4139; the text it builds is specification 7 revision 7, approved by row F79, on main): the
# untouched-root check of DEF-0101 (docs/Deferred/DEF-0101-the-launchers-open-requirements-before-a-runtime-is-launched.md), as a step "root" of launcher.start that reads
# the root's Git state once through gitread and grants only on an empty answer.
# The text it builds is specification 7 revision 7 (on main, sha256 8730907cb9c76a415a815bc2df872f5307e127babb55b5301e5e200afcae97a6): section 5, the bullet on the base's
# limits (the step "root", its fixed form, its outcomes and its limits), section 10 items 7 and 8. The workflow's revision 15 (decision D-4135; on main at 5cbffc20, a loosening
# under DM A66) lets gitread.py bind SUBCOMMANDS to the four subcommands or to the four plus 'status'; this task makes it five.
# Fields and value forms follow specification 2 section 5.1 and TASK-108's contract (docs/tasks/TASK-108.yaml).
# Not in this task: max_risk (stays the caller's), launching a runtime, the end-time re-check of the root, any change to cli.py, writer.py, the adapter, the hook, base_inputs.py,
# base_files.py, resume_*, mcp_server.py, the CI workflows or docs/**, DEF-0113, the write after a submission, the later A66 decision that drops the four-subcommand tuple (it
# comes only after this task has landed on main; until then main's gitread carries four, and after landing it carries five while the workflow still accepts both tuples).
# Risk: high. R3 reads src/** and tests/** fail closed as high (risk-rules section 2 point 3); no critical rule matches the write set (no docs/specs/**, no .github/**). Confirmed
# by script over the base in the approval request (TASK-108's form). Change class: critical_cr, because the CI's EVALUATOR list holds src/aieos_bootstrap/** and the tests folders;
# confirmed by script in the approval request.
# Evidence profile (assurance-model.md section 5, gov-AIEOS, high): unit_test, integration_test, property_test, deterministic_rule, static_security_analysis, ai_review
# (cross-model), plus the evidence_required of the applicable articles, recorded per article from the start (L-0034) through records.check_record and the governor shadow in the
# approval request. GOV-003 is recorded as it falls (DEF-0107's policy): acceptance is a stated per-task departure from the advisory governor in the form of TASK-102 to TASK-108;
# compensating controls: the local run of the base's tests against the change's src and a review of the test diff by a reviewer whose model differs from every model that did
# task work (L-0038), listed by machine.
# Models (L-0044): the main session writes the code and the tests; reviewers and helpers run on Haiku 5.5 only; any other model for them needs the owner first; no Fable; the
# decision agent runs on Opus 5.5. Each brief goes to the decision agent first.
# Pin scan so far (reads only, at main 5cbffc20; the first step of the work re-runs it and writes the hits in the map of commit X; a pin not listed here stops the work and comes
# to the decision agent): (1) tests/unit/test_gitread.py :399-:427 pins gitread.py's imports to exactly {os, re, subprocess} with no ImportFrom, the os attributes to {path, environ,
# devnull, pathsep} and the os calls to {isabs, isdir, get}: so gitread.py gains NO import and no new os attribute (the reason for AC1's form, below); :469 pins gitread.SUBCOMMANDS
# to the four-subcommand tuple and is amended to the five; :441 pins that every test function of the three gitread test modules (unit, integration, property) names "TASK-024 ACn"
# in its docstring: every added test there says "TASK-024 ACn (amended by TASK-109)". (2) tests/unit/test_launcher.py: the Repo stand-in (:63-:120) answers HEAD_ARGS and
# BASE_ARGS only, so a status read needs an answer in it; the callee-order pins that continue past the base step, ['expire','read','read','read_log',...] at :394, :492, :500 and :507 (['read_sessions','expire','read','read',
# 'read_log','held']), become three reads, while :427, :446 and :458 end at the base step (['expire','read','read']) and stay as they are; test_a_raise_in_the_inputs_reads_is_refused
# (:461-:479) raises on the third read and expects the reason 'inputs': the third read is now the status read, so it is amended to raise on the fourth read; :875 pins that every test function names "TASK-086 AC" in its docstring (an added test says "TASK-086 AC1 (amended by TASK-109)"); :854 pins launcher.py's
# docstring phrases (kept); the launcher.py docstring's phrases are also pinned in six modules outside the write set, which stay unchanged and must keep passing: tests/unit/
# test_launcher_outside.py :600-:605 (TASK-092 phrases and two reworded sentences), test_cli_run.py :934-:938, test_cli_launch.py :534-:538, test_cli_init.py :349-:352,
# test_cli_import.py :639-:643, test_cli_approve.py :695-:699, and test_cli_init.py :296-:302 forbids the state directory's name as a substring in launcher.py strings; the module
# docstring's sentence about the untouched-root check being open (launcher.py :95-:97) becomes stale and is updated without touching any pinned phrase; in particular it keeps "not before DEF-0101's open points are closed", pinned at tests/unit/test_launcher.py :858 and tests/unit/test_launcher_gone.py :425-:426 (DEF-0101 keeps the end-time re-check and max_risk open). (3) tests/unit/test_launcher_gone.py: ok_head (:110) answers any arguments with the head's bytes, which the status read would refuse as "root";
# it is amended to answer the status form with an empty answer. (4) tests/integration/test_launcher_repo.py: Intercept (:46-:57; its module docstring :1-:5 is amended too) answers the exact HEAD and base forms and forwards
# every other read to gitread.run on the real repository, which would run the status form on a repository whose cleanliness the test does not control; it is amended to answer the
# exact status form with b''. (5) tests/unit/test_cli_launch.py stands in for begin and is unaffected (to be confirmed by the scan). (6) The CI INV-004 string rule refuses a src
# string containing the state directory's name outside writer.py and the shell allowlist reader: neither changed src file may contain it. (7) tests/unit/test_gitread.py :461-:468 pins phrases of gitread.py's docstring ('single process wrapper', 'pinned list is [git]', 'revision 8',
# 'Limits (TASK-024 AC10)', and the rest listed there); the amended docstring keeps every one, 'no caller exists yet' included (stale and pinned).
# Stated limits: (1) the check is made once, before the grant, so a change between the read and the grant (the steps log, view and inputs come after it, spec 7 r7 section 5) is not seen, and that the session's change leaves the root untouched afterwards is not checked and stays open (DEF-0101); (2) the
# project-state directory is left out of the check, and a change to a tracked file inside it is not counted (only the task's own contract there is covered, by check 0); gitread's rule accepts any leading-dot name ('.gitattributes', '.github' and '.claude' among them: a caller that passed one would hide it from the check; a hidden '.gitattributes' would matter for the filter question); that the launcher passes writer.STATE_DIR is pinned by a launcher test only, which compares the whole argument list passed to read; (3) the
# ignore set depends on the repository's ignore files and the clone's own .git/info/exclude: the user's global ignore file is not read (gitread's environment passes no home
# directory and a null global configuration), so any untracked file the repository's own ignore files do not list, caches and tool files included, refuses the launch, as does any
# uncommitted edit of the owner's; (4) mode-only, symlink and case-only changes, files flagged assume-unchanged or skip-worktree, and a change only in line endings may not be
# counted; changes of a submodule are not counted; paths outside the root are not counted; an unfinished merge, rebase or cherry-pick, stashes and other refs are not looked at; (5)
# the filter question, ruled in D-4139 (a): no repository content can define a filter driver; a driver named in the clone's own .git/config (or a file it includes, or the config a
# linked worktree shares) is started for files whose attributes name it when their stat data changed, and gitread cannot override unknown driver names; `status` is the first form
# of gitread that can make git start a program named in configuration; the alternatives considered and not taken: (b) refusing the launch when .gitattributes at HEAD holds
# "filter=" (it misses .git/info/attributes and costs a tree read), (c) `-c core.attributesFile` and git's --attr-source (each closes only part of the risk and would change the
# existing forms and the line-ending handling); INV-001's text is unchanged (its pinned list stays [git]); the decision agent's reading in D-4139 (a), and its consequence that no constitution route is needed, is that the limit is a stated limit and a review finding for INV-001's review part, not a change to INV-001, and the limit is carried to DEF-0101; the departure from spec 7 r7's "written as a constant" (the launcher builds the last argument from writer.STATE_DIR because test_gitread.py :399 forbids gitread a writer import) is recorded here as ruled in D-4139 C1;
# (6) revision 15 of the workflow first runs its SUBCOMMANDS check on gitread.py on this task's branch (on main the step prints "no task"); if it is red there, the fix is a second
# task commit or a workflow decision; (7) the form needs a git that honours GIT_OPTIONAL_LOCKS (2.15 or later) and accepts --no-renames, --untracked-files=all and --ignore-submodules=all on status; the contract claims no minimum version for the whole form and the git version is not checked, and the real-form shape test (AC5) shows that CI's git accepts the options; a git that refuses an option exits non-zero, which refuses the launch with the reason "root" (AC3), so the check fails closed; (8) the self-build's own use: E:/AIEOS must be
# clean to be launched from; the owner's own uncommitted edits refuse the launch.
task: TASK-109
contract_version: v1
task_type: implementation
objective: >-
  Build specification 7 revision 7's untouched-root check: gitread gains a fifth read-only subcommand, status, in one fixed form (a constant list whose last argument is
  ':(exclude)' followed by a state-directory name that a strict rule accepts), and launcher.start gains a step "root" right after the step "base" and before the log read, that
  reads the root's Git state once through the same read callee with that form built from writer.STATE_DIR, grants only on an empty answer, gives "not granted" with the reason
  "root" and findings (the number of entries and at most 20 names, each the repr of the path's bytes) on a dirty root, and "refused" with the reason "root" on a read that fails, a
  timeout, an answer that is not a mapping, a non-zero exit, a non-bytes output, an entry that is not two status characters, a space, a non-empty path and a NUL, or a "##" entry;
  nothing else in start, end or launch_outside changes, and neither file gains an import or the state directory's name as a string.
