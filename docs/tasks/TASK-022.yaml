# Task contract TASK-022, the test-to-AC listing (Master Plan revision 3, §4 M4; specification 4 revision 3, section 6
# item 2; concept lines 730 and 781). Revision 0, drafted under decisions D-529 (Q2, C1 to C4) and D-530 (Q1, Q2, C1
# to C4), brought for approval in its own request; whether it is approved is recorded in the decision files, not in
# this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-021.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling; the naming rules of AC2 are the
# decision agent's reading (D-529 C2), not the specification's words.
# Task type: implementation. What it adds: one pure module, src/aieos_bootstrap/ac_tests.py. Its function listing takes
# one task id, that task's contract as values (specification 2 §5.1: acceptance_criteria, verification_plan,
# constitution), the test files as a mapping from a path to its source text, and every task's write set as values; it
# returns, per AC id of the contract, the tests that name it, the tests whose naming is ambiguous, and the findings of
# specification 4 section 6 item 2: each AC of the contract's G2 tests gate that no counting test names. Its function
# listing_record returns, when there is a finding, the one record of specification 2 §6.2 in item 1's form (outcome
# blocking, blocking_kind other), checked by records.check_record. It writes nothing, appends nothing and reads no
# file: the caller gives the sources and writes the record, if at all, through the core's single writer (TASK-016),
# which this task does not call.
# The specification's text (spec 4 line 71): "A test names the ACs it stands for in its name or docstring (the
# concept's "test khai báo AC nó chứng minh" [AIEOS-concept.md:781]); a script lists, per AC, the tests that name it;
# an AC with no test is a finding for G2's criteria, written in item 1's form. The listing is evidence of mapping, not
# of correctness; until item 3's key exists, concept line 730 is covered at gate and test level only." Its limit (spec 4
# line 73): "a name-based mapping shows that a test claims an AC, not that it tests it".
# The past (D-530): a scratch prescan of AC2's rules over main found 180 of the 183 G2 ACs of TASK-001 to TASK-021
# without a counting test, because the tree names ACs mainly in module and class docstrings and comments (8 of 620 test
# functions have a docstring). These are findings under the specification; they are data, recorded in a Deferred entry
# at the acceptance, and rework no accepted task. AC10 asserts them as counts per task.
# What it does not do: it does not add specification 4 section 6 item 3's record key for the ACs a gate covers
# (DEF-0042 point 8), and it does not settle how a corrected contract or new tests clear such a record (DEF-0042 point 7
# applies to it as to TASK-021's record). It changes no governor, writer, records, conformance or ac_coverage code,
# nothing under .github/ and no policy. It does not parse YAML: the integration test reads the contracts on main with
# its own line-based reader, which is test code, not the module's (reading: a contract reader for the core is a later
# task's; stated in AC9).
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain ac_tests; it must not name the Resume
# Check fixture folder (TASK-010's assertion) nor the Risk Engine fixture folder (TASK-020's allow list). No module of
# the repository calls ac_tests yet.
# Risk: high, and change class critical_cr, each to be computed over the base by script, as for TASK-021. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles.
# Reviews (as TASK-021's): five way-2 reviews by a Claude model other than the implementer's, and the decision agent's
# three, each brief naming for testing: AC2's naming rules and only them (qualified, bare, ambiguous, several in one
# docstring); the untested finding and only it; that the record passes records.check_record and is blocking with kind
# other; purity (no file, no clock, no write); line 73's limit and AC9's.
# Evaluation path (A61; as TASK-007 to TASK-021): commit C changes only docs/tasks/TASK-022.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-022", go to task/TASK-022 under their own
# decisions; main receives the task only at its acceptance. The task push's CI base run is a RISK-01 conformance run
# over the set file of DM F35, reported advisory, never MEASURED.
# Not applicable: OPS-001 (the task changes no ref); INV-004 and INV-009 (the module writes no file and no log);
# INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the governor, evidence records as stored, the replay
# and the policy meet no path of the write-set: the module returns a record and stores none); GOV-001, GOV-004 to
# GOV-006 and SEC-003 (the concept file, the bound artifacts, the decision matrix, the records and pre-genesis
# documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (it adds a finding; CR-002 part 4
# limit 8 does not apply), so its acceptance is one delegated approval of the decision agent (Master Plan section 6),
# for the decision agent's ruling.
# Uncovered and stated limits (AC9): the mapping is by name and docstring only and shows a claim, not a test of the
# criterion (spec 4 line 73); module docstrings, class docstrings and comments do not count; the record key of item 3
# (DEF-0042 point 8) and clearing the record (point 7) are not this task's; no caller in the core and no YAML reader.
task: TASK-022
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/ac_tests.py, the test-to-AC listing of specification 4
  section 6 item 2: listing(task_id, contract, tests, write_sets) takes a task id, its contract's acceptance_criteria,
  verification_plan and constitution as values, the test files as a mapping from a path to its source text, and every
  task's write set, and returns per AC id the tests that name it under the naming rules of AC2, the tests whose naming
  is ambiguous, and one finding for each AC of the contract's G2 tests gate that no counting test names; a malformed
  input gives one malformed finding (fail closed). listing_record returns, when there are findings, the one record of
  specification 2 section 6.2 with outcome blocking and blocking_kind other, and None when there are none; it writes
  nothing. With unit, integration and property tests in new test modules, each test naming its AC ids with "TASK-022"
  in its own docstring; the integration test runs listing over the contracts TASK-001 to TASK-022 and the tests in the
  tree, read only, and asserts the past as counts per task and TASK-022's own findings as empty.
