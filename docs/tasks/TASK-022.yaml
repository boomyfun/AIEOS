acceptance_criteria:
  - AC1: >-
      The input. listing(task_id, contract, tests, write_sets): task_id a string "TASK-" followed by three digits;
      contract a mapping whose acceptance_criteria, verification_plan and constitution fields are in the forms of
      TASK-021's AC1, as aieos_bootstrap.ac_coverage.check finds them (any finding of kind "malformed" from it is
      malformed here); tests a mapping from a path (a non-empty string with "/" separators, no backslash, not starting with
      "/") to its source text (a string that Python's ast module parses); write_sets a mapping from a task id to a list
      of paths. Any other form, or a source that does not parse, gives exactly one finding of kind "malformed" naming
      the first form that fails (in the order task_id, contract, tests by sorted path, write_sets), and no other
      finding (fail closed: a malformed input never gives "named").
  - AC2: >-
      The naming rules (the decision agent's reading, D-529 C2; spec 4 line 71's "in its name or docstring"). A test is
      a function whose name starts with "test", defined at a module's top level or directly in a top-level class; its
      key is "<path>::<name>" or "<path>::<class>.<name>". It names ACs only by its own name and its own docstring
      (ast.get_docstring); module docstrings, class docstrings and comments do not count. (a) A qualified mention is
      the text "TASK-" with three digits, one space and an AC id ("AC" followed by digits and optionally one lowercase
      letter) in the docstring; it counts for that task and that AC, in any test file; a docstring naming several,
      including the form "TASK-020 AC4 (in place of TASK-014 AC4)", counts for each one it names. (b) A bare mention is
      an AC id in the docstring that is not part of a qualified mention, or a part "ac" followed by digits and
      optionally one lowercase letter between underscores of the name (or at its start or end), read as that AC id in
      upper case; it counts only when the test's name and docstring name no task id ("TASK-" with three digits), and
      then only for a task whose write set lists the test's path. (c) If the write sets of more than one task list the
      path, a bare mention counts for none of them, and the test is listed as ambiguous for each such task, an
      informational entry, not a finding.
  - AC3: >-
      The untested finding (spec 4 section 6 item 2). For a well-formed input, each AC id named in the args of a gate of
      the contract's verification_plan with gate "G2" and check "tests", in plan order and within a gate in args order,
      counted once, that no test names under AC2 for task_id gives one finding of kind "untested" naming that id. An AC
      that the plan's G2 tests gate does not name gives no finding here (gate coverage is TASK-021's check).
  - AC4: >-
      The result. listing returns a mapping with exactly the keys named, ambiguous and findings: named maps each AC id
      of acceptance_criteria, in their order, to the sorted list of the keys of the tests that name it for task_id;
      ambiguous is the sorted list of the keys of the tests listed as ambiguous for task_id; findings is a list of
      mappings with exactly the keys kind, ref and detail (ref the AC id or the input concerned, detail a short English
      text). A malformed input gives named {}, ambiguous [] and the one finding. listing is a pure function: the same
      input gives the same output, and the input is not changed.
  - AC5: >-
      The record (specification 4 section 6 items 1 and 2 and section 10; specification 2 section 6.2).
      listing_record(task_id, contract_version, findings, recorder, source_class) returns None for an empty findings
      list; otherwise the one record {record_id, fact_kind "observation", source_class, recorder, subject task_id,
      evidence_type "ac_tests", outcome "blocking", blocking_kind "other"}, whose record_id is the SHA-256 hex digest of
      the UTF-8 text "ac-tests", task_id and contract_version joined by LF; source_class must be
      "deterministic_tool_local" or "deterministic_tool_external_ci", task_id a task id, contract_version "v" followed
      by digits, and recorder a non-empty string, else ValueError; records.check_record finds nothing in every record
      it returns. It writes and appends nothing.
  - AC6: >-
      What it does not decide. The module decides no acceptance and no execution, refuses no approval, and settles
      neither how a corrected contract or new tests clear such a record nor a record key for the ACs a gate covers
      (DEF-0042 points 7 and 8): its docstring says so, and states spec 4 line 73's limit. No module of src/ changes
      except __init__.py's docstring and __all__.
  - AC7: >-
      Purity and the CI checks (INV-001, INV-002, INV-003). The module imports only the Python 3 standard library (ast,
      hashlib and re among the allowed) and aieos_bootstrap.records and aieos_bootstrap.ac_coverage; it opens, writes
      and removes no file, reads no clock and no environment, and makes no process, network or model call; no exec,
      eval, compile, __import__ or importlib (ast.parse is allowed); no assert in src (bandit B101); no string that names
      the project-state directory. At the task's commits the CI steps report no finding: deterministic_rule, OPS-003,
      SEC-001, SEC-002 and bandit.
  - AC8: >-
      Its own tests (D-530 C1). Every test function of the three new test modules names the AC ids it stands for with
      "TASK-022" in its own docstring and names no other task's AC in qualified form there (so the counts of AC10
      stay the past's), and listing over TASK-022's contract and the tree gives TASK-022 no finding.
  - AC9: >-
      Limits, stated: the mapping is by name and docstring only and shows that a test claims an AC, not that it tests
      it (spec 4 line 73); the record key of item 3 (DEF-0042 point 8) and clearing the record (point 7) are not this
      task's; there is no caller in the core and no YAML reader in src. Every existing module and test not in the write
      set is unchanged, and if one can pass only by a change the task escalates (needs_out_of_scope_change).
  - AC10: >-
      The tree, read only (decision D-530 Q1, C2). tests/integration/test_ac_tests_tree.py reads docs/tasks/TASK-001.yaml
      to TASK-022.yaml and every .py file under tests/unit, tests/integration and tests/property with pathlib's
      read_bytes only, extracts each contract's acceptance_criteria, verification_plan, constitution and write_set
      paths with its own line-based reader, runs listing for each task with all 22 write sets, and asserts: the number
      of untested findings per task for TASK-001 to TASK-021 equals {TASK-001: 8, TASK-002: 6, TASK-003: 11, TASK-004:
      12, TASK-005: 7, TASK-006: 11, TASK-007: 10, TASK-008: 12, TASK-009: 10, TASK-010: 5, TASK-011: 7, TASK-012: 4,
      TASK-013: 8, TASK-014: 6, TASK-015: 7, TASK-016: 10, TASK-017: 14, TASK-018: 8, TASK-019: 8, TASK-020: 7,
      TASK-021: 9} (180 in all; the prescan's numbers, D-530 C2: if the module's own output differs, the task stops
      and the difference goes to the decision agent before the values are fixed); the ambiguous keys over all tasks
      number 2 (the same rule); TASK-022's findings are the empty list. A finding on an accepted task is data: it is
      not fixed by this task and reopens no acceptance.
  - AC11: >-
      The added text. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0; the file names are scanned with the same patterns and the records executors'
      pre-push pattern (D-282).
  - AC12: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 (each malformed form, one finding only; a
      source that does not parse); R2 AC2 (a qualified mention in another task's file counts; several in one docstring,
      the "in place of" form; a bare mention in the task's own file counts; a bare mention beside a task id does not; a
      name part ac3 counts; a mention in a module docstring, a class docstring or a comment does not; a nested function
      is not a test; a path in two write sets gives ambiguous and no count); R3 AC3 (untested in plan order, once each;
      an AC not in the G2 tests gate gives none); R4 AC4 (the keys, the sorting, purity: the input unchanged, a second
      call equal); R5 AC5 (None for no findings; the record's keys and values; its id; check_record finds nothing; each
      ValueError); R6 AC6 and AC7 (a script check of the module's imports and of the absence of open, write and clock
      calls). Unit tests in tests/unit/test_ac_tests.py; AC10 in tests/integration/test_ac_tests_tree.py; property tests
      in tests/property/test_ac_tests_properties.py (standard library only, fixed seeds): for random well-formed inputs,
      every G2 tests AC is either named by a counting test or reported untested, never both; adding a test whose
      docstring names every AC qualified by task_id leaves no untested finding; the result never depends on the order
      of the tests mapping. tests/run_tests.py, unchanged, runs all groups.
