acceptance_criteria:
  - AC1: >-
      DETECT_LINES of tests/integration/test_g0_detect_copies.py (:15-:24) gains exactly four lines, each as it stands
      stripped in the workflow: the condition and the refusal of a contract commit that is not on main
      (aieos-checks.yml :369 and :370) and the condition and the refusal of a contract that names another task or base
      (:379 and :380), read at the base_commit blob whose sha256 the header gives. The existing test
      test_the_copy_holds_the_lines_of_the_two_folders checks them with the eight others, and its docstring names the four
      lines under TASK-175 AC1. The eight lines at base_commit stay. The lines that read the contract and its parents
      (:371 and :378) are not held: without :378 the condition at :379 raises, and without :371 the conditions at :375 and
      :379 raise, so the detect step fails and does not pass silently; the step (:247-:253) runs as a python3 script with
      no continue-on-error and no "|| true".
  - AC2: >-
      The origin rule of the module's own tests (OwnTests, :77-:88) is widened openly, in both its regular expressions
      (:87 and :88): a test docstring names "TASK-114 ACn" or "TASK-175 ACn", and no other task's criterion in qualified
      form; its docstring says so. On a copy of the module with the new docstring words and the old rule, that test fails;
      with the widened rule it passes.
  - AC3: >-
      Each of the four new lines is shown to be needed: on a scratch copy of the tree whose workflow lacks that one line
      in both copies of the detect step, the test of AC1 fails and names it; on the unchanged copy it passes. The output
      is returned unedited.
  - AC4: >-
      Checks. The whole suite passes by the slice method (each slice under timeout 110) before the task commit; the base
      tests have 0 failing on the task tree, since no file of src changes; a different result is brought to the decision
      agent before the commit. In CI on the task commit unit_test, integration_test, property_test, deterministic_rule,
      static_security_analysis, lint, OPS-003 and the SEC steps report no finding; before the commit the added lines are
      scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, each 0. The CI run cited is one on
      refs/heads/task/TASK-175 whose log prints "G0 detect: task TASK-175 contract commit" with the contract commit and
      base, and "G0 contract sha256" (aieos-checks.yml :386-:387); the acceptance cites both lines, and the task commit
      goes to main only after the acceptance.
  - AC5: >-
      Records. DEF-0115 stays open (D-7870). The records commit adds one dated Log line to it that states: follow-up 1 is
      done by this task's change, cited by file:line; follow-up 2 is met only inside the records maker's intake
      (src/aieos_bootstrap/ci_evidence.py :198-:199); and the item stays open because other writers of CI-class records
      exist in src (conformance.py :1646, reconcile.py :366, and the writers parameterised by source_class that the
      contract review names) and the governor counts a CI-class record by its class and type alone
      (src/aieos_bootstrap/governor.py :298). No new entry is made in DEF-0152. No text of the task, its records or its
      history page says that the governor reads step output or that a hollow record cannot count (D-7869 C5). The
      acceptance states under master plan section 6 point (6): the touch list with why each item is not done; the counts,
      unchanged by this task (80 open, resumed or waiting-owner, 14 'Blocks v0.1: yes'); the first batch's running total
      (20 of 36, unchanged); that batch 2's rise of 12 is deferred to the end of batch 3 (D-7839); and batch 3's count
      from its start of 83, each accepted limit and each entry raising it. A history page goes into the same commit.
  - AC6: >-
      GOV-003 (a stated departure, the policy of DEF-0110): tests/** is on the pinned evaluator list; GOV-003 is not
      claimed to hold. The acceptance states it, gives the base-tests step's printed line, and a review of the whole diff
      by a model other than the implementer's. The push of main's head has exactly one AIEOS-Task trailer line; the
      pushes are the worker's route under their own decisions, outside the task's capabilities.
  - AC7: >-
      Limits. The slice runs, the base-test run, the broken-copy runs and the added-text scans are the worker's own runs
      outside the task's shell capability. The test reads the workflow's text; it does not run the workflow, and a change
      of the detect step that keeps the four lines and defeats them elsewhere is not seen. The task changes no behaviour
      and runs neither a hook, the runtime program nor a launch.
