# Task contract TASK-050, the stack benchmark's third and last round-2 port: TypeScript (Master Plan revision 4, §4 "The
# benchmark and the stack ADR"; docs/plan/m4-exit-review.md §6, line 70; docs/plan/bench-port-brief.md revision 3, §6;
# decisions D-794, D-800 C3, D-814 Q4, D-905, D-919, D-934 C4, D-954 C2, D-957; DEF-0063).
# Revision 0, drafted under decision D-957 (the scope note, B1 to B9, with its rulings on B2, B3, B4 and B6); brought
# for approval in its own request; whether it is approved is recorded in the decision files, not in this file. Fields
# and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-049. Readings marked "(reading)" are
# the worker's, for the decision agent's ruling.
# Task type: implementation, with two writers on two path sets (as TASK-043, TASK-048 and TASK-049):
# - the round-2 code, the new files of bench/ts named in the write-set (AC3), is written by a fresh agent
# (claude-opus-5-5, started for this task only) given only the inputs of the port brief's §6.2: the brief at revision 3
# (its hash below), the four Python files at commit 6b026569b4c62ec5d5b061138d8522d2ab651542 by the hashes the brief
# names, the round-2 input and reference documents made at that commit and checked against their pins (with the source
# of tests/unit/test_export_round2.py, 6fd0c9d2…), bench/ts's round-1 code at base_commit, and this contract. It works
# only in a scratch folder of the worker's scratchpad holding a copy of bench/ts at base_commit, with no access to the
# repository, the archives, the other ports (bench/go's and bench/rust's round 2 included) or any review, and runs only
# node and the type checker there, through the worker's wrapper script (TASK-042/043's form, its own decision);
# - everything else (the workflow step and the tests of AC8) is written by the worker.
# Round 1 unchanged (brief §6.3; decision D-957 B2): bench/ts's ten round-1 files (bytes.ts, export.ts, governor.ts,
# json.ts, main.ts, node.d.ts, records.ts, resume_check.ts, test.ts, tsconfig.json) stay byte-equal to base_commit;
# checked by script before any writer file is used.
# The second program (a reading of §6.3 for TypeScript; decision D-957 B2 with its added rule): bench/ts's round-1 code
# is ten files in one folder, run directly by node's type stripping and type-checked by `tsc -p bench/ts` with
# tsconfig.json's "include": ["*.ts"], which covers the folder's root only. TypeScript modules import each other, and
# round 1 already exports what round 2 needs, so round 2 is new files in bench/ts's root, named apart from round 1's,
# importing round-1 library modules unchanged; no round-1 file is copied (Go's M1 is not needed); no subfolder (it would
# need a tsconfig change or a second project). The new names are fixed (reading): the entry main2.ts (run as `node
# main2.ts <round-2 input document>`), the tests test2.ts (run as `node test2.ts <round-2 input document> <round-2
# reference document>`), and the round-2 modules, each named r2_<name>.ts with <name> of lowercase letters, digits and
# underscores; the exact set is named in the writer's report and pinned by AC8 after the writer. The round-1 modules a
# round-2 file may import (D-957 B2's added rule): json.ts, bytes.ts and records.ts only, by their .ts file names, with
# round-2 modules among themselves; never main.ts, export.ts (round 1's entry and its argument rule, usage and single
# write), test.ts, governor.ts or resume_check.ts (round 1's computations, which round 2 does not need). node.d.ts (the
# declarations of node:fs and node:process round 1 uses) is unchanged; if round 2 needs a declaration it does not hold,
# that is a stop for a ruling, not a change (D-957 B2).
# The toolchain (brief §3 and §6.4; D-957 B6): in CI, the node of the hosted runners, not downloaded, its version printed
# by the toolchain-versions step, and the type checker TypeScript 6.0.3 fetched and checked by the existing type-check
# step (TASK-043 AC4), unchanged; locally, node v24.11.1 (this machine's, as TASK-043 stated as a limit) and the type
# checker from the tarball fetched in session 6042fed6 (decisions D-838 to D-843), copied into this session's scratchpad
# and checked against the integrity value of TASK-043 AC12
# (sha512-y2TvuxSZPDyQakkFRPZHKFm+KKVqIisdg9/CZwm9ftvKXLP8NRWj38/ODjNbr43SsoXqNuAisEf1GdCxqWcdBw==) before it is unpacked,
# its own decision; no network. The SHA-256 is round 1's own sha256Hex in bytes.ts (brief §6.4).
# The workflow change (A66, its own element at code time; D-957 B3): in both jobs of .github/workflows/aieos-bench.yml,
# identically, the type-check step stays unchanged (reading: `tsc -p bench/ts` with "include": ["*.ts"] covers the new
# root files; confirmed before the first push by a local type check whose listed files name them, AC4), and the step
# "port ts (only if bench/ts exists)" keeps its one guard and its round-1 lines unchanged and after its round-1 test line
# adds the round-2 run, compare, no-argument probe and tests (AC6); the header names the round-2 lines; the revision line
# goes from 8 to 9. No download, trigger, permission, secret, token or `uses:`; the go and rust steps, the export steps
# and the round-2 export step are unchanged. TASK-048's carried D4 is applied to the new header words only ("print
# nothing to standard output"); the earlier wording stays for D4's own decision (D-935 C2).
# Limits: the benchmark workflow runs on pushes to main only, so the round-2 port's hosted evidence on Linux and Windows
# comes from the landing's run, read after acceptance; before acceptance, the evidence of byte equality is the worker's
# local run (node v24.11.1, Windows) and the reviews; the runners' node is not pinned and differs from this machine's
# (brief §3); the integrity value is self-attested by the registry; the texts the Python builds naming a Python type fail
# closed (brief §6.3), reached by no generated input; no file behaviour is compared; round 2's ports are written one
# after another, TypeScript last after Rust and Go (order bias; TypeScript was first in round 1); every writer and
# reviewer is an AI of one vendor; TASK-046's carried limit (a probe passes when its program is missing) holds for the
# new probe as for the others, and the landing's log is read for the round-2 program's own usage line; TASK-048's D1,
# D2 and D6 kinds and TASK-049's D1 to D3 kinds (fail-closed inputs tested in-process only; a refusal asserted without
# its cause; a refusal the Python does not state; first-occurrence order marks) are review points here; the round-2
# files are pinned by name only, as every port's code files are (R3-1, a benchmark-wide limit, D-954).
# What it is not: the results are advisory (A29, A31) and feed no gate, record or evidence entry; aieos-checks.yml and
# its two pins are not touched; src/ is not touched; no Go or Rust change; the round-1 port's results do not change.
# Risk: critical, and change class critical_cr, computed over the base by script (risk_class50.py: risk_class49.py with
# only the write-set and its header line changed): .github/** is R9 (critical); bench/** is R12 (high); tests/** is R2
# (medium) with R3's fail-closed reading (high); .github/** and tests/unit/** are evaluator paths of GOV-003's list.
# Profile (assurance-model.md §5, gov-AIEOS, critical): high's entries plus architecture [human_review], met for
# gov-AIEOS by the decision agent's review, and functional [the property/fuzz entry] by the CI's property_test step over
# the existing property suite (the task adds no property test; it changes no decision code); the cross-model entry by
# the pair of reviews: five way-2 reviews from the port review template (revision 1, unchanged, brief §6.5) with D-934
# C4's five round-2 fill texts, only their task facts changed, on claude-sonnet-5-5 (a model other than the port
# writer's and the main session's), and the decision agent's separate review. One delegated approval (reading, as
# TASK-048 and TASK-049). Round 2's findings are counted apart from round 1's (§6.5).
# Naming (D-544 Q3): every Python test this task adds names the AC ids it stands for as "TASK-050 ACn" in its docstring.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-050.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-050", go to task/TASK-050 under their own decisions; main receives the
# task only at its acceptance.
# Not applicable: OPS-001 (no ref changed by the task's code); INV-004 to INV-011 (no project state, decision engine,
# governor, evidence record, replay or policy path in the write-set); GOV-001, GOV-004 to GOV-006. SEC-003 applies (a
# .github/ path), under A66 as above.
# Owner-kept acts: none, on these conditions: the changed workflow grants no write, uses no secret or token, changes no
# repository or security setting and costs nothing (public repository, hosted runners); the local type checker needs no
# network and installs nothing outside the scratchpad. If any of these is not so, the task stops and the point is the
# owner's (CR-002 part 4 limit 5), fail closed.
task: TASK-050
contract_version: v1
task_type: implementation
objective: >-
  Extend bench/ts with round 2 of the benchmark (the brief's §6): a second program, new files in bench/ts's root (the
  entry main2.ts, its modules r2_*.ts and its tests test2.ts), written from the port brief (revision 3) by a fresh agent,
  which prints a document byte-equal to round 2's reference from round 2's input, importing only round 1's library
  modules json.ts, bytes.ts and records.ts, round 1's ten files unchanged; extend the ts port step of both jobs of
  .github/workflows/aieos-bench.yml to run, compare and test it and probe it with no argument; update TASK-043's,
  TASK-044's and TASK-046's pins of bench/ts in tests/unit/test_export_fixtures.py. Nothing else changes; the results
  are advisory and feed nothing.
traces_to:
  - docs/plan/m4-exit-review.md#6
  - docs/plan/master-plan.md#4
  - docs/plan/bench-port-brief.md
  - docs/pre-genesis/constitution.md#SEC-003
input_state:
  # base_commit is the `main` commit on top of which the approved contract is committed as its own commit C, changing
  # only docs/tasks/TASK-050.yaml; G0 requires C's one parent to equal base_commit. It is filled by script from
  # refs/heads/main just before C is made: the placeholder and its quotes are replaced by the 40-hex id, unquoted.
  base_commit: 686eb9bc62c61204b892e5d3cbfa4af386a114dd
  depends_on: [TASK-039, TASK-043, TASK-046, TASK-047, TASK-048, TASK-049]
  intent_versions:
    docs/plan/m4-exit-review.md: 6c41ca8200a4e757f04b22aa521e52cd67f7ac3122690e667ac4c864aa57c4a4
    docs/plan/master-plan.md: 8276a587bbf6f75be8867feb97df6726379babfcdb2266344bfdb4d01e6b2d23
    docs/plan/bench-port-brief.md: 1f5376c7113c3286cfe67dfa1567da31ed0dfae74b7d43f4ff455ea3141d4450
    docs/pre-genesis/constitution.md: 9b396c3c0f31d3a3fbccf9433cf81eb820b6e0f0a3a7d099e2899043abfe1f5a
    docs/specs/risk-rules-gov-aieos.md: 29dd803aed6a55c11fad04d01dac32ee10a8f15f96f099857a00212c100d4ed5
    docs/specs/conformance-files.md: 2f1c224466fe3657167b116b49f902648130bf76e1274367d7780cc38ec7b021
write_set:
  # The round-2 files in bench/ts's root (the writer's files, by the fixed names), one modified workflow, one modified
  # test module.
  paths:
    - bench/ts/main2.ts
    - bench/ts/test2.ts
    - bench/ts/r2_*.ts
    - .github/workflows/aieos-bench.yml
    - tests/unit/test_export_fixtures.py
read_set:
  paths:
    - docs/plan/**
    - docs/pre-genesis/constitution.md
    - docs/specs/risk-rules-gov-aieos.md
