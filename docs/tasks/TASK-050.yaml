acceptance_criteria:
  - AC1: >-
      The round-2 program's output. Run from bench/ts as `node main2.ts <round-2 input document>`, the program prints a
      document byte-equal to round 2's reference document (tests/unit/test_export_round2.py at base_commit,
      REFERENCE2_SHA256 unchanged) and exits 0; on a missing or extra argument, a file that is not a round-2 input
      document, or a call or case it cannot compute (the texts naming a Python type among them, brief §6.3), it exits
      non-zero and prints nothing to standard output. Evidence before acceptance: the worker's run with node v24.11.1
      (Windows) on this machine, compared by `--compare`, its output saved; the hosted runners' compare at the landing
      is read after acceptance (a stated limit).
  - AC2: >-
      The writer and its inputs (the brief's §6.2; decision D-957 B1). The round-2 code is written by a fresh agent on
      claude-opus-5-5, given only the brief's §6.2 inputs (the documents made at 6b026569 and checked against
      INPUT_SHA256 and REFERENCE2_SHA256) and a copy of bench/ts at base_commit, in a scratch folder; its tool calls are
      only file reads there, writes inside its own folder, and node and type-checker runs there through the worker's
      wrapper (checked by script over its transcript before any of its files is used); its file set holds no file of
      another port; every file it writes is committed byte-equal to the hash the decision agent accepts after that
      check. No round-2 file holds a 64-hex value, record id or line of the round-2 reference document that the input
      document and the given Python sources do not hold, nor any entry's expected values (checked by script against the
      two documents, by the rule as corrected in decision D-927).
  - AC3: >-
      The port's form (the brief's §3 and §6.3; D-957 B2, B5). bench/ts holds its ten round-1 files byte-equal to
      base_commit and, beside them, only the round-2 files written by the port writer: main2.ts (the argument, the
      single write, the exit code), test2.ts (its tests), and one or more modules r2_<name>.ts (<name> of lowercase
      letters, digits and underscores); no other file, no subfolder, no further declaration file, no package.json, lock
      file or node_modules. A round-2 file imports only node:fs and node:process (by node.d.ts's declarations,
      unchanged), the round-1 modules json.ts, bytes.ts and records.ts, and the round-2 modules r2_*.ts, each by its .ts file name; no file imports main2.ts or test2.ts;
      never main.ts, export.ts, test.ts, governor.ts or resume_check.ts. It uses only erasable TypeScript syntax; node:fs
      only for reading the one argument path (test2.ts only for its two documents) and node:process only for argv,
      stdout, stderr and exitCode; it writes nothing but standard output and standard error, reads no network, clock
      (no Date, no timers used for time), environment variable or random value (no Math.random), and starts no
      process; its SHA-256 is bytes.ts's sha256Hex (brief §6.4).
  - AC4: >-
      The type check. The existing step "type-check ts (only if bench/ts exists)" (TASK-043 AC4) is unchanged and
      covers the new files through tsconfig.json's "include": ["*.ts"]; before the first push the worker runs, on this
      machine, `node <SP>/tsc/package/bin/tsc -p bench/ts` over the head's bench/ts (exit 0, no output) and `node
      <SP>/tsc/package/bin/tsc -p bench/ts --listFilesOnly`, whose output must name main2.ts, test2.ts and every
      r2_*.ts file (the local confirmation of D-957 B3), with the tarball of D-957 B6 checked by its SHA-512 before it is
      unpacked, in the scratchpad only. If the listing does not name a new file, the task stops for a ruling (a
      tsconfig change is forbidden).
  - AC5: >-
      The round-2 program's own tests. test2.ts, run from bench/ts as `node test2.ts <round-2 input document> <round-2
      reference document>`, checks at least: the byte equality over the whole input against the reference; one append
      call and one reconcile case field by field; the carried log (an entry after an appended one and after a refused
      one); each fail-closed input of AC1. `node test.ts <fixture document> <reference document>` still passes
      unchanged. Both pass on the worker's machine, and the workflow runs both.
  - AC6: >-
      The workflow (A66, its own element). In each of the two jobs of .github/workflows/aieos-bench.yml, identically,
      the step "port ts (only if bench/ts exists)", under its one existing guard, keeps its lines unchanged and after its
      round-1 test line runs, from bench/ts, `node main2.ts "$RUNNER_TEMP/round2-input.json"` into
      "$RUNNER_TEMP/ts2.json"; then, from the checkout's root, `$PY tests/unit/test_export_reference.py --compare
      "$RUNNER_TEMP/round2-reference.json" "$RUNNER_TEMP/ts2.json"`; then one run of `node main2.ts` with no argument
      that must exit non-zero and print nothing to standard output, its output kept in the job's temporary folder, in
      TASK-046's probe form; then, from bench/ts, `node test2.ts "$RUNNER_TEMP/round2-input.json"
      "$RUNNER_TEMP/round2-reference.json"`. The header names the round-2 lines; the revision line goes from 8 to 9.
      Nothing else changes: no download, trigger, permission, secret, token, `uses:`, type-check, Go or Rust byte,
      export step or round-2 export step. The earlier tests of tests/unit/test_export_fixtures.py pass over it, with
      only the pins of AC8 updated.
  - AC7: >-
      Isolation (decision D-800 C3; the risk rules policy revision 6, R12). tests/unit/test_bench_isolation.py,
      unchanged, passes: no file under src/ or tests/ outside its allow-list, nor aieos-checks.yml, names bench/ or
      imports from it, and aieos-bench.yml is the only workflow naming bench/.
  - AC8: >-
      The pins (D-957 B4), in tests/unit/test_export_fixtures.py: the ts port step's pin (TS_PORT_STEP, read by
      RustStepTests.test_ts_and_go_steps_kept, updated in place to the step of AC6) and TASK-046's pin of bench/ts's
      file set (TS_FILES, updated to the exact new set: the ten round-1 files and the round-2 files) are each updated to
      their one exact new value, as pin updates and not a loosening; TS_CHECK_STEP and TSCONFIG unchanged; and a new
      test class whose docstrings start with TASK-050 pins the round-2 files' exact names, each of the ten round-1 files
      byte-equal to its bytes at base_commit by SHA-256 (written out, as Round2GoTests does, since the module's imports
      are pinned by TASK-039 AC4), and the round-2 lines' order in each job by comparing the whole step with
      TS_PORT_STEP (not by first-occurrence marks; TASK-049's D3), and that no round-2 file names main.ts, export.ts,
      test.ts, governor.ts, resume_check.ts, main2.ts or test2.ts in an import. The Go and Rust steps of each job unchanged from
      base_commit. No earlier assertion is removed or loosened beyond these updates; the module's export, its other
      tests and its main guard are unchanged.
  - AC9: >-
      The CI checks and purity. At the task's commits the existing CI steps report no finding: G0 scope,
      deterministic_rule, OPS-003, SEC-001, SEC-002, SEC-003's record and bandit; every earlier test passes; the added
      Python lines are scanned for the bandit test patterns the CI applies before the first push (a stated limit: that
      scan is not bandit; the branch run's bandit step is the evidence); the forbidden forms of AC3 are checked by
      script over the round-2 files before the first push; if any earlier test can pass only by a change outside the
      write-set, the task escalates (needs_out_of_scope_change).
  - AC10: >-
      Naming. Every Python test function the task adds names "TASK-050 ACn" in its own docstring; no existing test's
      docstring changes, with one exception (D-957 B4): the docstring of HardeningTests.test_ts_and_go_file_sets
      changes only in its bench/ts clause, from "bench/ts holds exactly its ten files" to a statement of bench/ts's new
      exact set (its ten round-1 files and the round-2 files), the rest of that docstring and its assertions staying
      unchanged apart from TS_FILES's exact new value; keeping the old clause is rejected, since it would become false
      (OPS-003); RustStepTests.test_ts_and_go_steps_kept's docstring ("the bytes of base_commit") stays unchanged, a
      stated limit as in TASK-049; tests/run_tests.py is unchanged and runs no export or port.
  - AC11: >-
      Stop conditions. If any step needs a secret, a token, write access, money, a setting, the network or anything
      installed outside the scratchpad, or the copied tarball's SHA-512 differs from the integrity value above, or
      round 2 needs a declaration node.d.ts does not hold, the task stops and the point goes to the decision agent, and
      to the owner when it is the owner's (A66, fail closed).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell:
    allow:
      - "timeout 110 python tests/run_tests.py < /dev/null"
      - "node main.ts <file> / node test.ts <file> <file> / node main2.ts <file> / node test2.ts <file> <file>"
      - "node <SP>/tsc/package/bin/tsc -p bench/ts [--listFilesOnly]"
      - "sha512 of <SP>/tsc/typescript-6.0.3.tgz in base64 (compared with the integrity value before unpacking)"
      - "tar -xzf <SP>/tsc/typescript-6.0.3.tgz -C <SP>/tsc"
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 900k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC7, AC8, AC10]}
  - {gate: G3, check: constitution, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC9, AC11, INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
