#   closing quotes, and after the file's last code line a block under the marker "# ---- path_class (task TASK-098)
#   ----" holding only path_class(rules, path), which returns _path_class(rules, path) unchanged: the highest class of
#   the rules whose match holds the path, None when no rule matches.
# - In src/aieos_bootstrap/records.py: a bullet added to the module docstring after TASK-096's Edit bullet, naming
#   "An intent's claim", "TASK-098" and the marker "intent"; a helper _is_intent_claim(record) added after
