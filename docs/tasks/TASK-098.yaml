constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      run_task by stand-ins (keyword callees; a counting clock), over a log without the task: for a write set classed
      low, one clock read, one _head read, one read_log, one read_base, one write_contract with (root, task, text),
      one claim append and one task.drafted append, in that order, "done" with kind single, risk low and every
      RUN_KEYS value as the header states; for no write set, a class other than low, a path no rule matches, and one
      low path beside one path no rule matches, kind drafting with no read_base call where no write set is given;
      each text equal to a literal expected text in the test (t1 and t2, every line as the header fixes it), its keys
      in TASK-097's order, owner_kept_act true, t1's risk low with its G1 build gate and its G3 review gate over AC1
      and AC2, t2's risk critical with its G3 gate over AC1 to AC4, forbidden the project-state directory built
      from writer.STATE_DIR; each text parses by task_contract.parse_contract with no finding and by base_inputs'
      contract parser with every CONTRACT_NEEDS key; the claim's record, record_id, intent id (a second intent
      INT-002; a rerun of the same intent under the same class reusing INT-001, under the other class a new id) and
      event id exactly as the header states, with no task_id and no fencing token,
      and records.check_record giving no finding; the task.drafted payload and event id as the
      header states; the resulting log passes records.check_log; each callee defaults at call time
      (mock.patch.object of gitread.run, writer.read_log, scope_reconcile.read_base, writer.write_contract and
      writer.append_event made after import are the ones called); the result has exactly RUN_KEYS.
  - AC2: >-
      run_task's refusals and fail-closed paths: each wrong argument ("argument", nothing called), an intent '' or over
      2000 characters or with a line end, a write path holding "*", "docs/", "a//b", ".", "./x", "a/./b", "-",
      ".." or "docs/specs./x.md", a path under the project-state directory in any case (".AIEOS/x" among them), a
      repeated path, a source_class outside APPROVAL_CLASSES; a raising or out-of-form clock ("clock"); _head's
      findings or a head not 40 lowercase hex ("head"); a raising or non-bytes read_log or a log check_log refuses
      ("log"); a log holding any event of the task ("exists", nothing appended); read_base raising, rules empty, rules
      holding a rule with no valid class, a path no rule matches, a raising path_class, and "DOCS/specs/x.md",
      ".GITHUB/workflows/x.md" and "AIEOS-CONCEPT.md" (classed by their lowercased forms too) each give kind drafting
      with its "class:" finding as the header words it, or the higher class, and no refusal; a root with no layout
      gives "layout" with nothing appended and no project-state directory made;
      a write_contract "exists" or "layout" passed through, any other answer or a raise ("write", nothing
      appended); a claim append refused, raising or out of form after the write ("append" with its exact finding,
      no task.drafted); a
      task.drafted append refused or raising ("append" with the exact finding); no Exception escapes; by ast, run_task
      and the names beginning _run, _RUN or RUN_ name no open, exec, eval, compile, __import__, subprocess, os, sys
      or time, and hold no string constant naming the project-state directory.
  - AC3: >-
      records.py: a claim with evidence_type intent, subject INT-<digits>, text and no session gives no finding by
      check_record; with a TASK- or other subject, another evidence_type, a session key that is '' or not a str, or
      as an observation, text gives "6.2:text"; the session and acs rules and every TASK-077 and TASK-096 case are
      unchanged; records.py's
      diff from the base is added lines and the one changed line :431 only. scope_drift.py: path_class equals
      _path_class over test_scope_drift.py's existing cases, None included; its diff is added lines only.
  - AC4: >-
      The command by stand-ins (mock.patch.object of launcher.run_task; a counting clock): "run TASK-1 <intent> --root
      R --class decision_agent" and with each --write gives one run_task call with (R, 'TASK-1', intent, class, the
      write paths as a tuple in order, the clock); each argv out of form (no task, a bad task, no intent, an intent
      beginning "--", no --root, no --class, a class outside the two, a flag twice but --write, a value empty or
      beginning "--", an extra word) gives exit 2 and USAGE with nothing called, inside a runtime too; an environ
      holding any one of the three RUNTIME_VARS ('' included) gives exit 1 and the runtime refusal with nothing called;
      "done" gives exit 0 and the lines, or under --json the exact sorted string; "refused" gives exit 1 and "finding:
      run: refused <reason>" then the findings; each answer out of form gives the out-of-form finding; a raising
      run_task gives "run: a step raised <type>"; a raising _render_intent_run gives "cli: a step raised <type>".
  - AC5: >-
      The modules: launcher.py's import set equal to the base's with exactly scope_drift and scope_reconcile added
      (test_launcher.py :703-707 widened) and its names test passing; cli.py's, records.py's and scope_drift.py's
      import sets unchanged; launcher.py's and scope_drift.py's diffs from the base added lines only, records.py's
      added lines and the one changed line (checked at G3 by a scratchpad git-diff script); the deterministic rule
      passes with every changed src path at NONE, test_cli_run.py at NONE and test_writer_files.py at its allowance;
      no recorder text holds "owner"; the new unit test file uses no tempfile, sqlite3, shutil, subprocess or open,
      roots only the literal 'C:/run-root-98', and uses no one-argument .replace() and no .replace(target=...).
  - AC6: >-
      Docstrings: launcher.py's gains "run_task", "TASK-098", "records the intent", "drafts nothing", "path_class" and
      "reads the caller's clock once"; records.py's gains "An intent's claim", "TASK-098" and "intent" and keeps its
      pinned phrases; scope_drift.py's gains "path_class" and "TASK-098"; cli.py's gains "aieos run", "TASK-098",
      "records the intent", "drafts nothing" and "not run on any real project", holds "COMMANDS, tasks, end, status,
      init, launch, approve, edit, reject, import or run", "end and init call it after the parse", "run also calls
      it after the parse" and main's environ sentence naming run, and not "COMMANDS, tasks, end, status, init,
      launch, approve, edit, reject or import"; USAGE names run; the six widened
      pins pass; every test of tests/unit/test_cli_run.py names "TASK-098 AC", checked by its own naming test, more
      than 20 tests; the end-to-end class of tests/integration/test_writer_files.py runs init, import and run (single
      and drafting; import on a Windows root only, D6) through cli.main over a temporary folder with the real
      writer and launcher, read and read_base stood in, and checks the twelve folders, the contract files' bytes
      against their task.drafted hashes, and the log by records.check_log.
  - AC7: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) the claim appended before the contract's
      write (AC1); (2) the claim's record_id not from the intent's text (AC1); (3) a task_id on the claim's event
      (AC1); (4) a fencing token passed to an append (AC1); (5) a callee bound at import time (AC1); (6) the single
      kind made for a class other than low (AC1, AC2); (7) the single kind made with no write set (AC1); (8) a failure
      of the class step giving low (the fail-closed path, AC2); (9) a path no rule matches classed low (AC1); (10) t1's
      owner_kept_act false (AC1); (11) t2's owner_kept_act false (AC1); (12) t1 without its G3 review gate (AC1); (13)
      a raise escaping run_task (AC2); (14) run_task naming os (AC2, AC5); (15) records.py :431 without
      _is_intent_claim (AC3); (16) _is_intent_claim accepting a TASK- subject (AC3); (17) _is_intent_claim not
      checking evidence_type (AC3);
      (18) path_class differing from _path_class (AC3); (19) a default --class (AC4); (20) the
      command not refusing inside a runtime (AC4); (21) the --json line without sort_keys (AC4); (22) cli.py importing
      writer (AC5); (23) a line of import_task changed (AC5, the G3 diff script); (24) a line of records.py other than
      :431 changed (AC5, the G3 diff script); (25) a string naming the project-state directory in launcher.py (AC2,
      AC5); (26) run_task skipping write_contract (AC6, the end-to-end class);
      (27) a write path holding "*" accepted and classed (AC2);
      (28) the lowercased form of a path not classed (AC2); twenty-eight copies in all; each copy made in a
      scratchpad script at G3, not committed; the governor's evaluate at acceptance (the shadow) with any
      difference named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6]}
  - {gate: G3, check: constitution, args: [AC7, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
