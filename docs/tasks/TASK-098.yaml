#   `        elif not (session_claim or _is_edit_claim(record) or _is_intent_claim(record)):` (D3 of TASK-096's form).
#   The session and acs rules are unchanged; every other record keeps the text rule. The marker `intent` is this task's
#   choice, carried to specification 2's next revision with `contract_edit`.
# - In src/aieos_bootstrap/launcher.py, by added lines only: the imports of scope_drift and scope_reconcile; a
#   paragraph added to the module docstring before its closing quotes (after the import_task paragraph) naming
#   "run_task", "TASK-098", "records the intent", "drafts nothing", "path_class" and "reads the caller's clock once";
#   and a block after the file's last code line (after import_task), under the marker "# ---- run_task, `aieos run`
#   (task TASK-098) ----", holding only run_task and names that begin "RUN_", "_RUN" or "_run":
#   - run_task(root, task_id, intent, source_class, write, clock, read=None, read_log=None, read_base=None,
#     write_contract=None, append=None) -> a mapping with exactly RUN_KEYS = ('result', 'reason', 'findings',
#     'intent_id', 'claim_id', 'kind', 'risk', 'path', 'contract_hash', 'event_ids', 'appends'); RUN_REASONS =
#     ('argument', 'clock', 'head', 'log', 'exists', 'layout', 'write', 'append'); RUN_KINDS = ('single', 'drafting');
#     RUN_RECORDER = 'aieos cli run'. It never raises an Exception; a raise at a step gives that step's reason with the
#     finding "<step>: a step raised <type>". Its steps, in order:
#     1. argument: root an absolute Windows or POSIX path (launcher's _ROOT, as start takes it; D6); task_id
#        TASK-<digits>; intent a str of 1 to 2000 printable characters with no line end; source_class one of
#        APPROVAL_CLASSES, stated by the caller and not checked; write a tuple or list of 0 to 50 distinct literal
#        file paths (a write set names files, not patterns; D2), each matching `[A-Za-z0-9_./-]+` (no "*"), not
#        beginning with "/" or "./", not ending with "/", holding no empty, "." or ".." segment (task_contract's
#        _item_ok form; D1) and no segment ending with "." or " " (E1), not "-", and whose first segment
#        lowercased is not writer.STATE_DIR lowercased (D14);
#        clock callable; each callee None or callable. Nothing is called on a refusal.
#     2. clock: read once; a time not timezone-aware UTC with whole seconds gives "clock".
#     3. head: start's own reader, _head(read, root), and 40 lowercase hex, else "head".
#     4. log: read_log(root), bytes, and records.check_log with no finding, else "log".
#     5. exists: any event of the log with task_id the task, a duplicate line included, gives "exists" with nothing
#        appended.
#     6. the class: with a write set, read_base(root, head, read) (scope_reconcile.read_base) and
#        scope_reconcile.rules_from_policy over its policy text, then each path's class by scope_drift.path_class in
#        its own form and in its lowercased form, the higher of the two (E1); the task's class the highest. It is
#        None, never a refusal (fail closed; D4), with one finding kept in the result's findings, when read_base
#        raises ("class: the policy at the base was not read (<type>)"), when the rules are empty or hold a rule whose
#        class is not one of low, medium, high and critical ("class: the policy's rules are not in form"), when either
#        form of a path matches no rule ("class: <path> matches no rule"), or when anything else in this step raises
#        ("class: a step raised <type>"; E3). With no write set, no class and nothing read.
#     7. the intent: its claim's record_id "intent/" followed by the SHA-256 of "intent", LF, the source class, LF
#        and the intent's UTF-8 bytes (E4); its intent id
#        the one already recorded under that record_id in the log, else "INT-" followed by 1 +
#        the highest number among the INT- subjects of intent claims in the log (0 when none), written with at least
#        three digits (D10); the record {record_id, fact_kind claim, source_class the caller's, recorder
#        RUN_RECORDER, subject the intent id, evidence_type `intent`, text the intent}.
#     8. the kind and the template: "single" when the class is "low"; else "drafting". The template is filled:
#        single with the task id, the head, the intent id and the write set; drafting with the task id, the head and
#        the intent id. A project-state path in a template is built from writer.STATE_DIR.
#     9. write: write_contract(root, task_id, text), before any append (E2), so a "layout" refusal appends nothing
#        and makes no folder; "done" with value "<STATE_DIR>/tasks/<task_id>.yaml" goes on; its "exists" and
#        "layout" pass through with their findings; any other answer or a raise gives "write"; none appends.
#     10. the claim's append: record.added with event id the SHA-256 of "run-event", LF, "record.added", LF and the
#        record_id, now, RUN_RECORDER, no task_id and no fencing token. "appended" or "duplicate" goes on; anything
#        else, a raise or an answer that is not a WriteResult gives "append" with the findings "append: record.added:
#        ..." and the exact "append: the contract <path> (<hash>) is written, the intent's claim is not" (E2).
#     11. append: task.drafted {contract_version 'v1', contract_hash the SHA-256 of the text's UTF-8 bytes}, event id
#        the SHA-256 of "run-event", LF, "task.drafted", LF, the task id, LF and the hash, now, RUN_RECORDER,
#        task_id the task, no fencing token; "appended" or "duplicate" gives "done"; else "append" with the exact
#        finding "append: the contract <path> (<hash>) is written, the task.drafted is not".
#     12. the result: "done" with the intent id, the claim id, the kind, the risk (the class, or None), the path, the
#        hash, the two event ids and the two appends; "refused" keeps what earlier steps fixed.
#     Each callee defaults at call time: gitread.run, writer.read_log, scope_reconcile.read_base,
#     writer.write_contract and writer.append_event.
#   - The single task's template (t1), its lines fixed but for the task id, the head, the intent id and the write set:
