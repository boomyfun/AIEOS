# TASK-098: `aieos run`, an intent recorded and its task made (specification 7 revision 3, section 3 :30 and section
# 10 points 12 and 13; specification 1 section 12; concept :789-798, unchanged; M7's remaining part, its eighth and
# last task). A new launcher function launcher.run_task, added after import_task by added lines, records the intent
# as a claim through writer.append_event, classes the user's write set at the base through scope_reconcile's public
# readers and a new public wrapper scope_drift.path_class, fills one of two fixed templates, writes it through
# writer.write_contract and appends `task.drafted`; records.py's text rule admits an intent's claim by one changed line;
# a new command in cli.py calls it. The core runs no model (INV-001): it drafts no write set, classes no bare intent and
# writes no task-specific criteria; doing the single task's change and drafting a proposal set are a launched
# session's, and every launch is the owner's (TASK-094; A51 item (4)). Plan: decisions D-3276 to D-3283 (session
# ea6ea0a3): the scope reads and the scope note (MYSP/t98/scope98.md) with D-3277's rulings Q1 (a given write set
# classed low gives a single task; any other class, no class, or no write set gives a drafting task), Q2 (the intent's
# claim: _is_intent_claim and records.py :431 widened, the marker `intent`), Q3 ((r3): the reader of the tasks folder
# left, with the question of who commits it, carried to M7's exit review), Q4 (the end-to-end tests in
# tests/integration/test_writer_files.py), Q5 (the classing through scope_reconcile and a public wrapper in
# scope_drift), Q6 (Reading 1: this task's owner_kept_act false; both templates' true), Q7 (no CR-002 matter) and Q8
# (the single task's fixed criteria judged by a G3 review gate); the pin scan (pinscan98-out.txt at abf312d3) and its
# reading (pinscan98-reading.md) with D-3279's rulings Q1 (test_cli_import.py :641 widened to COMMANDS[-2:]), Q2
# (scope_drift's wrapper tested in tests/unit/test_scope_drift.py) and Q3 (`--class` required, no default); the risk
# run (MYSP/t98/risk_class98.py at abf312d3: high) and the forbidden list (MYSP/t98/forbid98.txt at abf312d3; the write
# set's existing files left out; the new tests/unit/test_cli_run.py is not in it); the reviews rv98a
# (claude-sonnet-5-5) and rv98b (claude-opus-5-5) of r0 and their dispositions (MYSP/t98/disp98.md, D1 to D14,
# D-3281); the round-2 review rv98c (claude-opus-5-5) of r1 and its dispositions (MYSP/t98/disp98r2.md, E1
# to E5, D-3283); the decision agent's read of r2 in place of a third round.
#
# Scope:
