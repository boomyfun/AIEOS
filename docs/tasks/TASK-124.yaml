task: TASK-124
contract_version: v1
task_type: implementation
objective: >-
  Make the CI produce the lint entry of the low default profile: add ONE step to .github/workflows/aieos-checks.yml, after the bandit step, that installs pyflakes 4.0.3 into a venv in the runner's temp folder from the default package index, accepting only the one wheel whose hash is pinned (the form of the bandit step: --no-deps --require-hashes --only-binary :all:) and runs it with its default checks and no ignore or selection option over src and tests of the checked-out work tree, and fails the job when pyflakes reports any message or fails to run. Like the other task-gated steps it exits at once with "no task" when the run has no task. No other line of the workflow changes except a revision 19 paragraph in its header comment. A text test, tests/integration/test_ci_lint_step.py, checks the step's text. The record of the step (evidence_type lint, dimension functional) is made by the records maker of a later task from the run's step; the plan that `aieos run` writes is a later task.
