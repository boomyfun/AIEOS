acceptance_criteria:
  - AC1: >-
      The step. The unified diff of the workflow against main adds exactly one step, placed directly after the step "static_security_analysis (bandit, every package pinned by version and hash)" and named "lint (pyflakes 4.0.3, pinned by version and hash)". It has `if: ${{ !cancelled() }}`, begins with `set -euo pipefail` and exits 0 printing "lint: no task" when task.json holds `"task": null` (the form of the bandit step); it sets no `working-directory`; it sets `A="$RUNNER_TEMP/aieos-lint"` and makes the venv at `$A/venv`; its requirements file holds exactly one line, `pyflakes==4.0.3 --hash=sha256:330ba92b8c1db2eb0b8f4068f6c58674e2649a99e334769aa50e3e9c5b11c23a`; it installs with `--quiet --no-deps --require-hashes --only-binary :all:`; after `cd "$A"`, its last line is exactly `"$A/venv/bin/pyflakes" "$GITHUB_WORKSPACE/work/src" "$GITHUB_WORKSPACE/work/tests"` (default checks, no option; pyflakes reads no configuration file). Blocking is by form: `set -euo pipefail` and that last line as a bare command, so the step's exit status is pyflakes's. The step's text contains none of `continue-on-error`, `||`, `set +e`, `set +o`, `true`, `trap`, `python3 -m pyflakes`; its `run:` text has no `exit` other than the `exit 0` of the "no task" line and no shell `if` other than that line's (the step's `if: ${{ !cancelled() }}` key is outside the `run:` text); in its `run:` text no line names pyflakes other than the requirements line and the last line (the step's name also names it). The text of the step is the text the decision agent approved (its unified diff SHA-256 is bound in the A66 approval). The text test tests/integration/test_ci_lint_step.py (text only: it does not show that a line is reached) checks that the step exists directly after the bandit step, that it has no `working-directory`, the folder line, the exact requirements line, the install flags, the exact last line, the absence of each forbidden token of this AC and of AC3, and the "no task" line, and that the step's keys are exactly name, if and run (a key line at the step's key indentation other than `- name:`, `if:` and `run:` fails the test, so a `shell:`, a `timeout-minutes:` or any other key is refused; DEF-0126); it shows the text only, not that the job fails when pyflakes fails, which follows from the form above; it uses no subprocess, tempfile, exec, compile or open (deterministic_rule, as TASK-114 AC3), and each of its tests names "TASK-124 ACn" in its docstring.
  - AC2: >-
      Nothing is loosened. No existing line of the workflow changes (the diff has only added lines); the step list, every `if:`, every pinned list (the GOV-003 evaluator lists, the bandit pins) and the order of the existing steps are byte-for-byte as at base_commit. A raw `diff` of the base text and the new text with the added lines removed is empty. The change adds a check and loosens none; the header comment at the top of the workflow gains a "Revision 19 (TASK-124; ...)" paragraph (the last paragraph there is revision 18, for TASK-114) that says so and names the step (a comment line is an added line). The step 'GOV-003 base tests (report only)' stays the job's last step (TASK-103 AC6); the job's timeout-minutes 15 is not changed; if a branch run hits it, the stop rule of AC4 applies. The revision 19 paragraph is written only after the header (aieos-checks.yml :1-160) has been read in full.
  - AC3: >-
      The A66 limits. The step grants no write access (no `permissions:` change), uses no secret or token (no `secrets.` or `GITHUB_TOKEN` reference is added), changes no repository or security setting, adds no third-party action (no `uses:` line), and fetches from the network only the default package index page for pyflakes and the one hash-pinned wheel, where pip may also read its own version-check page as the bandit step does (DEF-0127 stays open). A Grep of every added line (the revision 19 paragraph included, which is written without these words) for `permissions`, `secrets`, `GITHUB_TOKEN`, `uses:`, `continue-on-error`, `env:`, `PIP_`, `index-url`, `find-links`, `trusted-host`, `curl`, `wget` finds none; the text test checks the same list over the step.
  - AC4: >-
      First run and risk. The lint step ran once, on the stopped branch task/TASK-119 (run aieos-checks 41965451678, head 5b9330c1), and was red with two findings, DEF-0124 and DEF-0125, which TASK-122 fixed on main (the unused import in resume_check.py and the unused local in test_runner_rc.py); the branch task/TASK-119 stays as it is and is never force-updated. The first run of this task is on the new task branch task/TASK-124 (DEF-0115's branch-first route), never on main; the workflow change goes to main only after a green run on the branch, or after code fixes that are themselves approved by their own decision and task (this task changes no source file, and no test file other than its own new text test tests/integration/test_ci_lint_step.py). The CI's python is 3.12.3 and the local interpreter is 3.14; pyflakes 4.0.3 requires python >=3.10, which both meet; a result on 3.12 may differ from one on 3.14; the CI's result governs. The first run is expected to be green, because both findings of the stopped branch were fixed on main; it may still be red on a finding not yet seen. STOP RULE: if the first branch run of the lint step is red, the task stops (exit condition escalate: needs_out_of_scope_change); each finding goes into a new DEF entry; any fix is its own task and its own decision, landing on main before TASK-124 resumes; the step's text is never changed to ignore a finding, because merging a red step would block every later task.
  - AC5: >-
      Evidence and records. The risk class is critical, so the evidence profile is the critical profile of assurance-model section 5: unit_test and integration_test (this task's test is an integration test and the CI runs the existing unit tests unchanged), deterministic_rule, static_security_analysis and ai_review (cross-model), plus functional [property/fuzz] (met by property_test records) and architecture [human_review] (met by a second decision_agent_review, which is never also the cross-model half: assurance-model section 5), as for TASK-103 and TASK-114. The tool entries are met by the CI's own steps on the accepted commit; if the governor shadow's raw output in the records dry run at the acceptance request shows any entry unmet, the task stops and comes back to the decision agent, and no workaround is used. The cross-model pair is a way-2 review on Haiku 5.5 (no other model without the owner) of the diff and the test, and a separate decision_agent_review that stands for that entry, both bound to the evaluated commit and the intent versions; the way-2 record names the implementer's model, the model of the session that makes the task commit (expected claude-sonnet-5-5) and the reviewer's model (Haiku 5.5); if the reviewer's model equals either of the other two, the pair counts nothing and the task stops. The lint step's own run is a record. The A66 decision is a precondition of the commit: it is requested after this contract is approved, after the workflow file and the test file are built and before the commit; it binds the SHA-256 of the built workflow file and of the base blob it replaces, of the unified diff of the workflow against base_commit, of the test file, and of this contract as approved; the executor refuses the commit on any mismatch (the route of TASK-114, D-4516 C2). After the first green branch run, the records maker of this task (a copy of the TASK-118 maker) gains one row ('lint (pyflakes', 'G2', 'lint', 'functional') (the gate value is a proposal; the governor does not read the gate); that row is a records-step matter after acceptance and not part of this task's write set. Because the task changes tests/, its acceptance brings the raw output of the step 'GOV-003 base tests (report only)' of the task-branch run and names each base-test failure in its departures (TASK-103 AC4; DEF-0107 point 4 (i)).
  - AC6: >-
      Limits. No change to the low profile or to assurance-model.md, to any spec, to any source file, to any test file other than the new tests/integration/test_ci_lint_step.py, or to aieos-native.yml or aieos-bench.yml; no continue-on-error; no tool beyond the one pinned wheel; the plan that `aieos run` writes (DEF-0118's second follow-up) is a later task; what counts as lint for a docs-only change stays the owner's; any finding in the existing code becomes a DEF entry or a task of its own, never an ignore in this step. DEF-0127 (pip's own version check in the bandit and lint steps) stays open and is not touched: the step's text stays exactly as approved at r5 (the line-by-line text of TASK-119 r5, AC1); DEF-0120, DEF-0121 and DEF-0123 stay untouched.
