# Task contract TASK-036, autonomy L1 to L2 as a product feature (Master Plan revision 3, §4 M4; specification 4
# revision 3, section 9; decisions D-736 C3 and D-738).
# Revision 0, drafted under decisions D-736 (C3) and D-738 (P1 to P6; the first handback's C1 to C4 and the second's
# C1 to C7), from the scope note approved by decision D-738; brought for approval in its own request; whether it is
# approved is recorded in the decision files, not in this file. Fields and value forms follow specification 2 §5.1
# and the contracts of TASK-007 to TASK-035. Readings marked "(reading)" are the worker's, for the decision agent's
# ruling.
# Task type: implementation. What it adds: one pure module, src/aieos_bootstrap/autonomy.py, with one function,
# auto_accept_allowed(levels, allowance, risk, status, touches), that states the product's rule for L1 and L2 of
# specification 4 §9: whether the policy's half of the governor's row 4 allows auto-accept for a task's risk class.
# What it is not (decision D-738 second C1): `allowed` is neither an acceptance, nor a gate result, nor a ruling on
# "sufficient assurance" (concept line 622); it is only the policy's half of row 4, whose other half (every gate
# passed, the profile complete) stays the governor's. The caller must take the levels and the allowance only from an
# approved, versioned policy and the statuses only from pinned values (assurance-model.md §6; INV-011). The module
# defines no level, allowance or status for any project, and nothing in this task names gov-AIEOS's levels, allowance
# or statuses. Connecting it to the governor is a separate governor change, not made here: governor.py is forbidden,
# LEVEL_AT_LEAST_L2 stays False and row 4 stays unreachable. No module of the repository calls the new function.
# Reading R1 (the implementer's; decision D-738 P2 and second C2): the function fails closed when P-CRED is not
# exactly "PASS", as it does for C13. Whether L2 may be used while P-CRED or C13 is not PASS is the owner's
# (master-plan.md §9 item 5; assurance-model.md §10 point 2); failing closed decides nothing in the permissive
# direction, and only the owner may loosen it. R1 is stricter than §9, which names only C13.
# The L2 entry (decision D-738 P3 and first C3): a check of form only. The module checks that an L2 entry names a
# change request and metrics; whether the change request is approved and whether the metrics suffice are the caller's
# and the approver's. Any bound above L2 is not expressible: any level other than "L1" or "L2" fails closed.
# Owner points not touched (decision D-738 Q2): the auto-accept policy, "sufficient assurance", any bound above L2,
# and L2 while P-CRED or C13 is not PASS are the owner's (master-plan.md §9 item 5; A54 point 2); none is set, changed
# or used. Raising a low or medium class of gov-AIEOS to L2 (the decision agent's under A54 point 2) is not proposed.
# Limit, stated (decision D-738 P5): no integration test, since the function has no caller.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; only its docstring changes (TASK-036 in the task list, "twenty-one
# modules" and one entry for the new module). The new module is read by nothing.
# Risk: high, and change class critical_cr, each computed over the base by script (risk_class36.py and
# gov003_class36.py: the scripts of TASK-035 with only the write-set and the header line changed): every path R2
# medium and R3 high by component tags; every path an evaluator path (GOV-003, 4 of 4).
# Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule],
# functional [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus
# the evidence_required of the applicable articles. (reading) The integration_test entry is met by the CI's
# integration step over the whole suite at the task's commits; no integration test of this task exists (the limit
# above).
# Review points (for the five way-2 reviews and the decision agent's three): the rule of AC2 against its sources; the
# strict checks by type and identity (AC3); never raising (AC4); the docstring's statements (AC5); no caller, no
# gov-AIEOS value, the governor untouched (AC6); the positive case and the facts case (AC7); purity (AC9).
# Naming (D-544 Q3, as TASK-023 to TASK-035): every test this task adds names the AC ids it stands for as
# "TASK-036 ACn" in its own docstring, and no other task's AC in qualified form.
# Evaluation path (A61; as TASK-007 to TASK-035): commit C changes only docs/tasks/TASK-036.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-036", go to task/TASK-036 under their own
# decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-004 (the module appends nothing and calls no writer);
# INV-005 to INV-008 and INV-010 (the decision engine, the governor, evidence records as stored and the replay meet no
# path of the write-set); INV-011 (reading: its check is a policy rule over the self-build's policy, which this task
# neither changes nor reads; the module states the product's rule, never looser than INV-011 for the self-build);
# GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the bound artifacts, the decision matrix, the records and
# pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (CR-002 part 4 limit 8 does not apply),
# and it sets no autonomy level or auto-accept policy; so its acceptance is one delegated approval of the decision
# agent (Master Plan section 6), for the decision agent's ruling.
task: TASK-036
