task_type: implementation
objective: >-
  Add src/aieos_bootstrap/autonomy.py, a pure module with one function auto_accept_allowed(levels, allowance, risk,
  status, touches) that returns a new mapping with exactly the keys allowed, level and reasons, never raises, and
  fails closed: allowed is True only when the risk class is low or medium, its level entry is L2 in form, the
