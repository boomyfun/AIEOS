acceptance_criteria:
  - AC1: >-
      The function and its result. src/aieos_bootstrap/autonomy.py defines auto_accept_allowed(levels, allowance,
      risk, status, touches). It returns a new dict with exactly the keys "allowed" (a bool), "level" ("L1" or "L2")
      and "reasons" (a new list of str in the fixed order of AC2); "allowed" is True if and only if "reasons" is
      empty.
  - AC2: >-
      The rule, fail closed (specification 4 §9; assurance-model.md §6; concept lines 622 and 626; INV-011; risk rules
      point 2). The reasons, each added when its condition holds, in this order: "risk" when risk is not a str among
      low, medium, high and critical; "level" when risk is one of them and levels is not a dict, or holds no entry for
      the class, or the entry is neither exactly {"level": "L1"} nor a dict with exactly the keys level, change_request
      and metrics where level is "L2" and change_request and metrics are non-empty str (the level is then "L1"; with
      risk not one of the four the level is "L1" and "level" is not added); "L1" when the level is "L1"; "risk above
      medium" when the level is "L2" and risk is high or critical; "policy" unless allowance is a dict and its value
      for risk is True; "C13" unless status is a dict whose value for "C13" is a str equal to "PASS" (a missing value
      counts as not PASS); "P-CRED" likewise for "P-CRED" (reading R1); "touches policy" unless touches is False.
  - AC3: >-
      Strict checks by type and identity, never by truthiness (decision D-738 second C3). The allowance value must be
      True itself (1, "true" and other truthy values fail); a status must be a str exactly equal to "PASS" ("pass",
      " PASS" and a non-str fail); touches must be False itself (0, None, "False" and an empty value fail); risk must
      be a str among the four (True, a list, a dict and a str of another class fail); the level strings, the keys and
      the entry form must be exact; a dict subclass is treated by its type as not a dict (reading). A unit test covers
      each strict case.
  - AC4: >-
      Never raising (decision D-738 first C1). For every parameter, a test passes odd values: unhashable values (a
      list, a dict, a set) as risk and as a level entry's fields, non-str level values, levels, allowance and status as
      a list, a str, None, an int and a tuple, a dict with non-str keys, and touches as 0, None and "False"; each call
      returns a result in AC1's form with the reasons AC2 gives and raises nothing. The module tests membership only
      after checking a value's type, so it never hashes a value of unknown type.
  - AC5: >-
      The docstring (decision D-738 first C2 and C3, second C1 and C2). The module docstring states: allowed is a
      necessary condition only, the policy's half of row 4, not an acceptance, a gate result or a ruling on
      "sufficient assurance"; the caller supplies the levels and the allowance only from an approved, versioned
      policy and the statuses only from pinned values; the module defines no level, allowance or status for any
      project and does not read gov-AIEOS's; the L2 entry check is a check of form only, approval of the change
      request and sufficiency of the metrics being the caller's and the approver's; any bound above L2 is not
      expressible; reading R1, labelled as the implementer's, stricter than §9, which only the owner may loosen;
      connecting the function to the governor is a separate governor change, not made here.
  - AC6: >-
      No caller, no project value, the governor untouched (decision D-738 second C4 and C5). No module of src/
      imports or calls autonomy (a test scans the package's own source files); no file of the write-set holds a level
      table, allowance or status value for gov-AIEOS or names gov-AIEOS's levels; governor.py and every other path
      outside the write-set are unchanged.
  - AC7: >-
      The positive case and the self-build's facts (decision D-738 P4). A unit test whose docstring says its values are
      made up shows allowed True and level "L2" for risk low and for risk medium with a made-up L2 entry, an allowance
      of True, both statuses "PASS" and touches False; and that changing any one of these conditions alone makes
      allowed False with that condition's reason. A unit test of the self-build's present facts (no level table, an
      empty allowance, C13 and P-CRED not PASS, touches False) gives allowed False for every one of the four classes,
      with reasons "level", "L1", "policy", "C13" and "P-CRED".
  - AC8: >-
      Properties. Over generated inputs (the standard library's random with a fixed seed, in the test module only):
      allowed is True only when every condition of AC2 holds; adding any failing condition never makes allowed True;
      the function is deterministic for equal inputs and leaves its inputs unchanged (compared with deep copies); each
      call returns a new result and a new reasons list.
  - AC9: >-
      Purity and the CI checks (INV-001 to INV-003). The module imports nothing beyond the standard library and does
      no I/O: it reads no file, clock, environment or network and writes nothing (a test scans its source for open,
      eval, exec, compile, __import__ and for imports of os, sys, subprocess, socket, time, datetime, random, io and
      pathlib). The tests use the standard library only. At the task's commits the CI steps report no finding:
      deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit ("bandit reports no finding in CI"). Before the first
      push, the added and changed lines of the write-set are scanned for the patterns of bandit's tests that the CI
      applies (decision D-738 P6, as decision D-725 P6): B324 (hashlib md5 or sha1 without usedforsecurity=False),
      B404, B602 to B607 (subprocess and shell use), B605 (os.system, os.popen), B307 (eval), B102 (exec), B301 and
      B403 (pickle, marshal), B506 (yaml.load), B306 (tempfile.mktemp), B101 (assert, in src only), B311 (random, in
      src only), B104 (a bind to 0.0.0.0), B105 to B107 (password-like names), B310 (urllib urlopen), B313 to B320 and
      B405 to B411 (xml parsers); every count is 0 or the hit is brought to the decision agent before the push. The
      scan is a stated limit, not bandit; the CI's bandit run is the evidence.
  - AC10: >-
      Naming and the package docstring. Every test function of the two test modules names "TASK-036 ACn" (at least
      one) in its own docstring and no other task's AC in qualified form; each module has a naming test that reads the
      loaded TestCase classes' docstrings, not the file. src/aieos_bootstrap/__init__.py changes only in its
      docstring: "TASK-036" in the task list, "twenty-one modules" in place of "twenty modules", and one entry for
      ``autonomy``.
  - AC11: >-
      Its own tests and the added text. The tests write and remove no file and open none except the package's own
      source files. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0; the file names are scanned with the same patterns and the records executors'
      pre-push pattern (D-282). tests/run_tests.py, unchanged, runs all groups, and every earlier test passes
      unchanged; if one can pass only by a change outside the write-set the task escalates (needs_out_of_scope_change).
