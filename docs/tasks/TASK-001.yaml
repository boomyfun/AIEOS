constitution: [INV-001, INV-002, INV-003, INV-004, INV-005, INV-006, INV-007, INV-008, INV-010, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      Line form (section 6.1; section 2). Given the text of an event log, the module returns, for each line, either the
      parsed event or the list of its errors, each naming the rule broken. The text is malformed if it starts with a
      byte-order mark or holds a CR byte (section 2: UTF-8 without a BOM, LF line ends). A line is malformed if it is
      not valid UTF-8 or not one JSON object; if it lacks event_id, type, appended_at, seq or payload; if it has a key
      other than event_id, type, appended_at, seq, task_id, fencing_token, corrects and payload (section 2, unknown
      fields); if event_id is not a non-empty string; if type is not one of the event types of section 6.3; or if
      payload is not an object. A last empty line after the final LF is not a line.
  - AC2: >-
      Order, time and duplicates (section 6.1; specification 1 sections 4 and 7 point 4). seq is an integer (not a
      boolean), 1 on the first line and one more than the previous line's on each next line; every line counts for
      seq, an ignored duplicate included (reading). appended_at is a UTC time in ISO 8601 form YYYY-MM-DDTHH:MM:SS
      with an optional fraction and a final Z, and is a real calendar time. A line whose event_id occurs on an earlier
      line is an ignored duplicate, reported as such and never an error, when its object equals the earlier line's in
      every key other than seq and appended_at; otherwise it is an error (reading).
  - AC3: >-
      Conditional envelope keys (section 6.1; specification 1 section 8). task_id, where present, has the task-id form
      TASK- followed by digits (section 2) (reading); it is required on every task.* and decision.* event and on every
      event whose payload is a record whose subject is a task id, and there it equals that subject; it is absent when
      the payload is a record about an intent entity (reading). fencing_token is an object with exactly epoch and
      counter: counter is an integer of 0 or more, and epoch is a non-empty string or an integer of 0 or more
      (specification 1 section 8: "a new random id") (reading); it is required on task.submitted, the one event
      section 6.1 names, and on other events it is allowed and checked for form only (reading). corrects is a string
      equal to the event_id of an earlier line (reading).
  - AC4: >-
      Records (section 6.2), wherever a record occurs (record.added, violation.detected, decision.*). Keys other than
      those of section 6.2 are an error. record_id, fact_kind, source_class, recorder and subject are required (B5;
      governor-spec.md section 3.3) (reading). fact_kind is claim, observation, interpretation or authority;
      source_class is one of DM B3's classes (agent_declared, same_lineage_review, deterministic_tool_local,
      deterministic_tool_external_ci, cross_vendor_review, decision_agent, human_authority, delegate_ai); outcome,
      where present, is pass, fail or blocking, and blocking_kind is present exactly when outcome is blocking and is
      out_of_scope, forbidden_path, violation, constitution or other; commit is a full lowercase hex commit id;
      intent_versions maps ids to versions of the form v followed by digits; an authority record has approval_binding
      with kind contract, acceptance, change_request or baseline and a 64-hex hash; a decision_agent record and an
      other_model_review record have decision_ref; an other_model_review record has models with reviewer and
      implementer; a decision_agent_review record has basis and stands_for; gate, where present, is G followed by
      digits; evidence_type and dimension are open vocabularies (section 6.2) and are checked as non-empty strings only.
  - AC5: >-
      Payloads (section 6.3). Each event type's payload has exactly the keys section 6.3 gives it, with these forms:
      contract_version, and intent.changed's from_version and to_version, v followed by digits; contract_hash and the
      hash of approval_binding 64 lowercase hex; task.submitted's commit a full lowercase hex commit id;
      intent.changed's entity a non-empty string; blocked_by, paths, entities, records and tasks lists of strings;
      compensating a boolean; task.stale cause intent_change or conflict; evidence.stale reason commit or
      intent_version; conflict.detected has paths or interfaces or both; intent.changed change_request of the form
      CHG- followed by digits (section 2); violation.detected's payload is one record with fact_kind observation,
      outcome blocking and blocking_kind violation; record.added's payload is one record (AC4). The forms of reason,
      approval_record, decision_record and refers_to are non-empty strings only (AC7).
  - AC6: >-
      The decision contract (section 6.4), the payload of decision.acceptance and decision.execution: a record (AC4)
      with decision, which is null exactly when error is present. For decision.acceptance, fact_kind is
      interpretation, decision is ACCEPT, NEEDS_REVIEW, INSUFFICIENT_EVIDENCE, NEEDS_REWORK or REJECT, next_task_state
      is a state name of section 2, profile_used is a list of objects with exactly dimension, required, satisfied_by
      and missing_types, and every other key is one section 6.4 names. For decision.execution, decision is exactly
      one of the eight strings of A15; its other keys are specification 3's and not yet named, so under the
      unknown-field rule any key beyond the record keys, decision and error is reported as unknown (a stated limit).
  - AC7: >-
      Limits, stated and tested as such: the module checks form only; its results never call a record valid,
      accepted or approved (they say only "no error found" or list the errors); it never decides whether a record
      satisfies an evidence entry, counts as an approval, or is current; it does not check that ids named in
      approval_record, decision_record, refers_to or blocked_by exist, and checks reason only as a non-empty string; it
      checks no state transition (specification 1 sections 5 and 6); it recomputes no hash; it treats the fencing
      rule of specification 1 section 8 as out of scope beyond AC3.
  - AC8: >-
      Purity (INV-001, INV-002, INV-004). The module and its tests import only the Python 3 standard library and the
      module itself; they use no exec, eval, compile, __import__ or importlib; they start no process, open no network
      connection, call no model, and open no file for writing; records.py opens no file at all, and the tests hold
      their data in the test files. The CI steps at P check this as follows, and each must report no finding: the
      deterministic_rule step refuses, in src/ and tests/, the names exec, eval, compile, __import__, open, input,
      breakpoint and __builtins__; the modules importlib, subprocess, multiprocessing, socket, ssl, http, urllib,
      ftplib, smtplib, poplib, imaplib, telnetlib, xmlrpc, asyncio, ctypes, pty, shutil, tempfile, sqlite3, webbrowser,
      runpy, pickle, marshal, shelve, dbm, zipimport, pkgutil, code, codeop and builtins; the os calls os.system,
      popen, fork, forkpty, kill, remove, unlink, rename, renames, replace, mkdir, makedirs, rmdir, removedirs, chmod,
      chown, write, open, fdopen, truncate, link, symlink, and any os.spawn*, os.exec* or os.posix_spawn*; and a call
      named .open, .fdopen,
      .write_text, .write_bytes, .touch, .mkdir, .unlink, .rmdir, .rename, .symlink_to or .hardlink_to on any object
      (io.open, codecs.open and Path(...).open included); no string in src/, docstrings included, names .aieos; the
      OPS-003 step finds no string in src/ that is exactly the lowercase word valid, accepted or approved, and a line
      in src/ or tests/ that uses MEASURED, ENFORCED or GUARANTEED cites a decision-matrix row on that line; and
      bandit, as the static_security_analysis step runs it (src/ with every bandit test; tests/ with every test but
      B101 and B311), reports no issue.
  - AC9: >-
      Tests. Unit tests cover each rule of AC1 to AC7 with at least one passing and one failing case; one integration
      test checks, end to end, a log held in the test file with every event type of section 6.3 at least once; the
      property tests (standard library only, fixed seeds) check that generated well-formed lines give no error, that
      removing a required key, adding an unknown key or breaking seq gives an error naming it, and that the same input
      always gives the same output; and these form properties: for INV-005, a decision value outside the five
      acceptance values or the eight execution strings is always reported, and decision is null exactly when error is
      present; for INV-007, a malformed commit or intent_versions in a record is always reported; for INV-008, a
      source_class outside DM B3's list is always reported, and an agent_declared record gets the same form result as
      any other class. INV-006 has no form property in this module. tests/run_tests.py runs all three groups with the
      standard library's unittest and exits non-zero if any test fails; it is for local runs only, and the CI channel
      runs its own discovery from the workflow (GOV-003).
capabilities:
