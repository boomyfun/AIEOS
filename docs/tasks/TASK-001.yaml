# Task contract TASK-001, the first code task of gov-AIEOS (Master Plan revision 2, §8; specification 2 §5.1).
# Revision 5, under decisions D-178 C4, D-181 C1, D-182 C1 and D-183 C1, brought for approval in D-186; whether it is
# approved is recorded in the decision files, not in this file. No code exists at base_commit. Fields and value forms
# follow specification 2 §5.1. Readings marked "(reading)" are the worker's, ruled in D-181 P5 or brought in D-182.
# Change class: critical_cr. Read fail closed as governor code, this task changes the evaluator (governor-spec.md §8
# point 2; risk rules §4); today the only effect is "never auto-accepted", which L1 already gives.
# Uncovered (governor-spec.md §6.2): the tool parts of INV-005 to INV-008 (the conformance scenarios; the schema rule
# on the decision contract; the record schema and source-class rules as governor checks) have no checker yet, and
# this change has nothing for them to judge: the module emits no decision and no record. AC9 names the form
# properties its property tests exercise for INV-005, INV-007 and INV-008; INV-006 has none in this module.
# Not applicable: OPS-001 (scope: the repository's refs). Refs are not changed paths (governor-spec.md §3.2); the task
# changes no ref and may not push; every push of the evaluation path carries OPS-001's push rule (D-181 P1).
# Reviews (D-181 P2, P3, reading R-dim): five way-2 reviews (architecture ai_review for INV-001, INV-002, INV-004;
# security ai_review for SEC-002; governance ai_review for GOV-003; operational ai_review for OPS-003; the cross-model
# half) and three decision-agent reviews (architecture human_review for INV-003; operational human_review for
# OPS-002; the cross-model half). Each way-2 review record's basis names every article whose entry it covers and
# addresses each of their rules, beyond what the tool parts decide (constitution §2, way 1).
task: TASK-001
contract_version: v1
task_type: implementation
objective: >-
  Add, under a new source tree, a standard-library Python 3 module that checks the form of event-log lines, records
  and event payloads of specification 2 sections 6.1 to 6.4, as the first part of the bootstrap governor's input
  handling (governor-spec.md section 3.3 and section 4 rules 6 and 7: a malformed record is not used; a malformed
  request gets no decision value), with unit, integration and property tests and a local test runner. It reads only
  the text it is given, writes nothing, and decides nothing.
traces_to:
  - docs/specs/spec-02-aieos-file-format.md#6.1
  - docs/specs/spec-02-aieos-file-format.md#6.2
  - docs/specs/spec-02-aieos-file-format.md#6.3
  - docs/specs/spec-02-aieos-file-format.md#6.4
  - docs/pre-genesis/governor-spec.md#3.3
