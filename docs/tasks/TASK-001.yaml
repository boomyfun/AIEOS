  # only docs/tasks/TASK-001.yaml; G0 requires C's one parent to equal base_commit, and the task starts from C (D-181
  # P9). It holds the CI workflow's revision 2 unchanged from P, 8a21a57e0702b31634aeadf230aaa41e3dfaa964 (D-184).
  base_commit: 49b791fea199a59a1d93f3f49feba913f7d46289
  depends_on: []
  # The interim documents have no id and no vN version (spec 2 §4.2 waits for `.aieos/intent/`), so each is named by
  # its path and pinned by its SHA-256. How a record binds them (a hash, not AC4's `v` form) is settled with the
  # record-store details before the first acceptance (D-166 C2; D-181 C1 (i)).
  intent_versions:
    docs/specs/spec-02-aieos-file-format.md: 31109a65ee144f3edd271bce108cfeb631c972186c7f44540c8e29a450a7fcbe
    docs/specs/spec-01-state-and-event-model.md: ae1f1f880c63b27d2d1257d2b7623bd6efc4528667be2657078ffce38f53858b
    docs/pre-genesis/governor-spec.md: 423a1f3743b124bab7e672f7be5615e18f2a178d9b9991587d5aaa9f6ea37cea
    docs/pre-genesis/constitution.md: 16e78d30214082d1248369b910b051e7e4c48929036fced1488acc2f3efcf836
    docs/pre-genesis/assurance-model.md: 945615316968a5c064bf88be71add9271bbb9f95692eaa22582b6020fa69cb85
    docs/specs/risk-rules-gov-aieos.md: ba1e9f145a9950315663746f0b5944e931bc39008b1b4bcca2d0e622161bfdcc
write_set:
  paths:
    - src/aieos_bootstrap/__init__.py
    - src/aieos_bootstrap/records.py
    - tests/unit/test_records.py
    - tests/integration/test_records_log.py
    - tests/property/test_records_properties.py
    - tests/run_tests.py
read_set:
  paths:
    - docs/specs/spec-02-aieos-file-format.md
    - docs/specs/spec-01-state-and-event-model.md
    - docs/pre-genesis/governor-spec.md
    - docs/pre-genesis/constitution.md
    - docs/pre-genesis/decision-matrix.md
  interfaces: []
  schemas: [spec-02 event line (6.1), spec-02 record (6.2), spec-02 event types and payloads (6.3), spec-02 decision contract (6.4)]
forbidden:
