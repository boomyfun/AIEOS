# Task contract TASK-061, the Claude Code adapter's hooks mapping, part CC-1 (Master Plan revision 4, §4 M5; specification
# 5 revision 3, sections 6 and 8 and section 11 points 7 and 8; specification 2 revision 5, section 6.2).
# Revision 0, drafted under decision D-1207 (Q3 (1) to (6), C3); brought for approval in its own request; whether it is
# approved is recorded in the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and
# the contract of TASK-060. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: a new module src/aieos_bootstrap/claude_code.py, the hooks mapping of the
# Claude Code adapter (specification 5 section 6's table, lines 57-62) as pure functions over one hook-input mapping:
# for a file-writing call, the path against the lease's write-set; for a shell call, `git push` and the shell allowlist;
# for a file-reading call, nothing is judged (the observed read-set record is CC-2's, section 7 and point 4 being open).
# Each call gives a verdict "allow", "refuse" or "uncovered"; a refusal also gives the observation record the core would
# write (specification 5 section 8 line 78: outcome blocking, blocking_kind violation; line 64: deterministic_tool_local),
# checked by records.check_payload('record.added', ·) as records.py is (D-1207 Q3 (6)). "uncovered" is never an allow;
# what a caller does with it is CC-2's, under specification 5 §8 and point 5 (D-1207 Q3 (2); D-1208 M3).
# Revision 1, under decision D-1208: its changes M1 to M5.
# The pattern matcher (D-1208 r3, M4): governor.matches (governor.py:514), the matcher the core's write-set scope check
# already uses (scope_drift.py:212), so the adapter's allow and refuse stay in step with the gate's; resume_check.matches
# is not used.
# Not in this task (D-1207 Q1): the channel from a hook to the core (point 7's rest), any hook entry program reading
# standard input, the observed read-set record, the adapter declaration, and every owner act: placing any hook program,
# any Claude Code settings entry, any live run in a Claude Code session, and any measurement of C6 or P-LOC
# (specification 5 lines 89-93; Master Plan §9 item 2). The hooks installed for this project's own work are not touched,
# not read and not named by this task.
# Sources for tool names (D-1207 Q3 (1)), by SP/tools/tool_names61.py of session 1947b313 over every main transcript of
# this project (first file and line of each, with the input keys seen):
#   observed: Write (02bd7476…:161; keys content, file_path), Edit (02bd7476…:297; file_path, new_string, old_string,
#   replace_all), Bash (02bd7476…:25; command, description, run_in_background, timeout), PowerShell (0302fdd2…:56;
#   command, description, timeout), Read (02bd7476…:291; file_path, allow_large, limit, offset), Grep (0302fdd2…:555;
#   path, pattern, …), Glob (0302fdd2…:24; path, pattern), and tool names beginning "mcp__" (for example
#   mcp__Claude_Browser__navigate, 0b5e69bd…:1388).
#   unverified (never seen as a tool_use name in these transcripts): MultiEdit, NotebookEdit.
#   The hook input's keys tool_name and tool_input (with tool_input.command for Bash) are those the installed project
#   guard reads (its source, not cited here as a measurement) and that refused and allowed live in session 1947b313
#   (decisions D-1202, D-1203); the key session_id was also used live there. No other key of the hook input is relied on.
# No coverage is claimed (D-1207 Q3 (4)): no acceptance criterion assumes that a hook point fires for a tool. In session
# 1947b313 a hook with matcher "*" did not refuse Read calls it was written to refuse (D-1202, D-1203), and specification
# 5 lines 65 and 80 state that firing, coverage, fail-open behaviour and timeouts are unmeasured and that a hook that does
# not fire neither refuses nor records. Every AC proves only how the functions handle a given hook-input mapping.
# Limits (carried at acceptance): specification 5 open points 4 (the read-set record's evidence_type), 6 (the allowlist's
# content, a policy matter: here the allowlist is an argument), 10 (an abnormal session end) and 12 (a bound on repeated
# STOP: violation); the shell checks read the command text only and refuse when unsure, so they over-refuse (AC5, AC6);
# links and junctions are not resolved (AC3); a record's session is named only in the recorder's words (records.py has
# no `session` key; specification 2 section 6.2's proposed key, DEF-0071 (i), not taken up here); claude_code is called
# only by its tests; nothing is installed or measured; a shell command can write files (">", tee, cp, a script), and
# those writes are not judged against the write-set, only Write and Edit calls are, and pushes by other means (gh, git
# send-pack, a network call) are not detected: a lower bound, as specification 5 line 73 says of the read-set (D-1208
# M2); the tool names are the model-side tool_use names seen in this project's main transcripts (tool_names61.py), and
# that a hook input's tool_name carries the same names is supported live only for Bash (D-1202, D-1203), unmeasured for
# the other tools (C6) (D-1208 M5).
# Readers of the changed paths (D-263 C3's practice): tests/unit/test_writer.py's R8 test and tests/unit/test_gitread.py's
# subprocess test read every module of src/ and keep passing. No existing module imports claude_code.
# Risk: high (risk rules revision 6, §2 point 3: R3 matches every path under src/** and tests/**; no path under
# tests/conformance/** (R11) or .claude/** (R9)), to be computed over the base by script before commit C. GOV-003: every
# path of the write-set is an evaluator path by the workflow's pinned list (.github/workflows/aieos-checks.yml:392-395),
# so "GOV-003 evaluator change: yes"; change class critical_cr, as for TASK-060, ruled at acceptance. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles. Reviews: five way-2 reviews on a Claude model other than the
# implementer's, Opus 5.5 or Sonnet 5.5 and never Fable (the owner's words of 2026-10-17 in :3 item 3 of session
# 1947b313); and the decision agent's own reviews: INV-003's human_review, OPS-002's human_review and the cross-model
# half, each its own record (decision D-1148 Q2).
# Records: in the readable form, as TASK-060's (D-1179 Q2 (6); DEF-0074 (iii)); per-entry coverage checked by script
# before the acceptance request (L-0022), and the governor's evaluation over the records reported (decision D-1098).
# Naming (D-544 Q3): every test of the new test modules names the AC ids it stands for as "TASK-061 ACn" in its own
# docstring.
# Evaluation path (A61; as TASK-019 to TASK-060): commit C changes only docs/tasks/TASK-061.yaml and has one parent equal
# to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-061" and no e-mail address in its message, go to
# task/TASK-061 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011; GOV-001, GOV-004 to GOV-006
# and SEC-003 (no path of the write-set meets them). INV-004 applies: the module writes nothing.
# Owner-kept acts: none. No hook placed, no Claude Code setting, nothing under .github/ or .claude/, no push of its own;
# it weakens no evidence requirement; so its acceptance is one delegated approval of the decision agent (Master Plan
# section 6).
