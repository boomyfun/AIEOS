acceptance_criteria:
  - AC1: >-
      The arguments. Before anything else: hook_input a mapping; root an absolute Windows path string (a drive letter,
      ":" and "\" or "/"), non-empty; task_id "TASK-" followed by digits; write_set a non-empty list of strings, each a
      pattern of the risk rules' §2 point 6 (no character other than letters, digits, ".", "_", "-", "*" and "/", no
      empty name); allowlist a list of non-empty strings with no line break; record_id and recorder non-empty strings.
      A wrong argument gives verdict "refuse" with reason "argument" and a finding naming it, and no record (a wrong
      argument is the caller's error, not a policy refusal; reading). The module keeps no state.
  - AC2: >-
      The concerns (D-1207 Q3 (1), (2)). tool_name "Write" or "Edit" is concern write, its path tool_input.file_path;
      "Bash" or "PowerShell" is concern shell, its text tool_input.command; "Read", "Grep" or "Glob" is concern read;
      every other name, including "MultiEdit", "NotebookEdit" (unverified), every name beginning "mcp__", a missing or
      non-string tool_name, and a tool_input that is not a mapping, is "uncovered" with reason "tool" and no record. A
      write or shell call whose path or command is missing or not a string is "uncovered" with reason "input". Concern
      read gives "allow" with reason "read" and no record (nothing judged; the read-set record is CC-2's). No verdict
      "allow" is given for any input that this criterion does not name.
  - AC3: >-
      Windows paths (D-1207 Q3 (5)). normalise_path(root, cwd, path): "\" becomes "/"; a relative path is joined to cwd
      when cwd is an absolute path, else the result is "uncovered" with reason "path"; "." names are dropped and ".."
      removes the name before it, lexically; the drive letter and every name of root are compared without regard to
      case (Windows); a path that is not under root after this gives "outside"; the part under root keeps its case and
      is the normalised form "a/b/c" (no leading "/", no "./", no trailing "/"), compared with the write-set
      case-sensitively as Git records paths (risk rules §2 point 6), so a path that differs from an allowed one only in
      case is refused (over-refuses; stated). A path with a NUL, a name of only spaces or dots, a trailing space or dot
      on a name, a ":" after the drive (an alternate data stream), a "\\?\" or "\\.\" prefix, or a UNC root gives
      "uncovered" with reason "path". Links and junctions are not resolved (no file is opened): stated as a limit, the
      lexical form is what is judged.
  - AC4: >-
      The write-set. A write call whose normalised path matches a pattern of write_set by governor.matches gives
      "allow" with reason "write_set"; one that matches none, or whose path is "outside", gives "refuse" with reason
      "write_set" and the record of AC7 with evidence_type "write_outside_write_set" and refers_to the normalised path,
      or, for "outside", the given path's text; "uncovered" of AC3 gives "uncovered".
  - AC5: >-
      git push (D-1207 Q3 (3)). A shell call is split into simple commands at newlines, ";", "&", "|", "(", ")", "{",
      "}", "`" and "$(" outside quotes, with single and double quotes honoured; text with an unclosed quote gives
      "refuse" with reason "parse" and the record of AC7 (evidence_type "shell_not_allowed"). A simple command whose
      first word, after leading assignments and the prefixes env, command, exec, nohup, time, sudo, xargs, is "git" or
      ends in "/git", "\git", "git.exe", and in which any later word is "push", whatever options or option values
      come between (for example "git -C dir push", "git -c a=b push", "git --git-dir=x push origin"), gives "refuse"
      with reason "push" and evidence_type "git_push_refused"; so does any command text where "git" and "push" both
      appear as words and the text could not be split (refuse when unsure). Also (D-1208 M1), any shell command text in
      which "git" (or a word ending in "/git", "\git" or "git.exe") and "push" both appear as words anywhere, inside
      quotes included (for example bash -c "git push", sh -c 'git push', powershell -Command "git push"), gives
      "refuse" with reason "push" and evidence_type "git_push_refused". For PowerShell the same split and rules apply
      to its command text; its own syntax is not parsed (stated).
  - AC6: >-
      The allowlist. After AC5, every simple command must start, word by word, with the words of one allowlist entry
      (the entry split at spaces; quotes in the command honoured); a simple command that starts with none gives
      "refuse" with reason "allowlist" and evidence_type "shell_not_allowed", refers_to the first such simple command
      (at most 200 characters). An empty allowlist refuses every shell call. The allowlist's content is the caller's
      (point 6), never a default of the module.
  - AC7: >-
      The refusal record (D-1207 Q3 (6)). Exactly the keys record_id, fact_kind "observation", source_class
      "deterministic_tool_local", outcome "blocking", blocking_kind "violation", recorder (claude_code.RECORDER, 'the
      Claude Code adapter (aieos_bootstrap.claude_code)', followed by ", for " and recorder), subject task_id,
      evidence_type, refers_to. records.check_payload('record.added', record) gives no finding for every record the
      module returns; if it gives one, the verdict is "refuse" with reason "record" and the findings, and no record is
      returned. No new key; no session key.
  - AC8: >-
      The result. judge returns a mapping with exactly verdict ("allow", "refuse" or "uncovered"), concern ("write",
      "shell", "read" or None), reason (one of "argument", "tool", "input", "path", "write_set", "parse", "push",
      "allowlist", "record", "read"), findings (a list of texts), record (the record of AC7, or None). Only "refuse"
      with a reason other than "argument" carries a record. No exception escapes: any raised inside gives "uncovered"
      with reason "input" and the exception's type in findings.
  - AC9: >-
      No coverage claimed (D-1207 Q3 (4)). The module's docstring states: the functions judge a given hook-input
      mapping only; whether Claude Code runs a hook for a tool, with which input, and whether a refusal stops the call
      are unmeasured (specification 5 lines 65 and 80; C6, the owner's); a hook with matcher "*" was seen not to refuse
