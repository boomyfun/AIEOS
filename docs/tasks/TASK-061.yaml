contract_version: v1
task_type: implementation
objective: >-
  Add the Claude Code adapter's hooks mapping (part CC-1) in standard-library Python 3. A new module
  src/aieos_bootstrap/claude_code.py gives normalise_path(root, cwd, path) and judge(hook_input, root, task_id,
  write_set, allowlist, record_id, recorder): judge reads only hook_input's tool_name and tool_input, sorts the tool into
  a concern (write, shell, read, or uncovered), and returns allow, refuse or uncovered with its reason and, for a refusal,
  the observation record checked by records.check_payload('record.added', ·). With unit, integration and property tests
  in tests/unit/test_claude_code.py, tests/integration/test_claude_code_inputs.py and
  tests/property/test_claude_code_properties.py, each test naming its AC ids in its own docstring; the tests write no
