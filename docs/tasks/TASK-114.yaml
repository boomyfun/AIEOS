  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3]}
  - {gate: G3, check: constitution, args: [AC4, AC5, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
