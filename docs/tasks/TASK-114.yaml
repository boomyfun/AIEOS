acceptance_criteria:
  - AC1: >-
      The two copies. Both copies of detect (the first in the step "G0 task detection (the contract commit on main)", the second in the step "G0 scope (V0)") are byte-equal when dedented, and so are the two G0 scripts from their header comment to the end of detect (the imports and every line before detect included); both pinned EVALUATOR lists hold '.aieos/tasks/**' directly after 'docs/tasks/**' and are equal (the step "GOV-003 evaluator lists equal" passes); the header comment at the top of the file and the two comments in the scripts name the second folder; a revision 18 paragraph in the header states that the change LOOSENS detect, what it accepts, and the limits (a state commit with two contracts or any third path is refused as a contract commit; the event-log change is not checked to be append-only; a task's own commits that change .aieos/ stay refused by INV-004; a committed log is public once pushed). The unified diff of the workflow against main is exactly the diff the decision agent approved (its SHA-256 is bound in the approval). Raw output of scope_reconcile.evaluator_from_workflow on the new text shows the full list with '.aieos/tasks/**', and on the base text the old list (as TASK-103 AC2); this output is produced at the approval request, and the step "GOV-003 evaluator lists equal" is shown passing only by the CI run of the accepted commit.
  - AC2: >-
      The accepted cases, as evidence from outside the repository. A scratchpad harness, never committed, extracts the first copy of detect and runs it in temporary Git repositories that have a local refs/remotes/origin/main. It is not committed because deterministic_rule refuses subprocess, tempfile, exec, compile and open under tests/ (aieos-checks.yml at base_commit: the lists DENY_MODULES and DENY_NAMES :1551-1555 and the function check_source :1648-1696). The worker runs it under the decision agent's decision (D-4510 C3), once on the built workflow (all pass) and once on the base workflow (the docs case passes, the two state cases fail). A contract added at docs/tasks/<id>.yaml by a commit that changes only it is accepted (unchanged behaviour); a contract added at .aieos/tasks/<id>.yaml by a commit that changes only it is accepted; the same with .aieos/events.jsonl in the same commit is accepted; in each the output names the task, the contract commit and the base equal to the parent. Both raw outputs and the harness's SHA-256 go in the acceptance record. This is same-lineage evidence, and CI does not run it.
  - AC3: >-
      The refused cases, from the same scratchpad runs, each a "G0 FAIL: " message with no task.json, and the text test. The harness shows these fail closed with the workflow's own message: a state contract commit that also changes a third path; a docs/tasks contract commit that also changes .aieos/events.jsonl; the same id added in both folders, in one commit and in two; no contract in either folder; a state contract added, removed and added again (two adds); a contract commit that origin/main does not hold; a contract whose base_commit is not the parent; a contract added by a merge commit (two parents), refused at the zero-adds step with "0 (expected 1 in one folder)" because git log without -m lists no merge as adding a file; the one-parent test of detect is kept as a defence; under git's default log output (a merge is not listed as adding a file) it can fire only for a root commit, which the harness does not build, and no run shows that branch firing. In the repository, tests/integration/test_g0_detect_copies.py (which passes deterministic_rule) checks the text of both copies of detect, of the two G0 scripts from their header comment to the end of detect, and of both lists (text only: it does not show that a line is reached), and its own tests each name "TASK-114 ACn" in their docstrings.
  - AC4: >-
      Evidence and CI. The risk class is critical, so the evidence profile is the critical profile of assurance-model section 5: unit_test and integration_test (this task's test is an integration test and the CI runs the existing unit tests unchanged), deterministic_rule, static_security_analysis and ai_review (cross-model), plus functional [property/fuzz] (met by property_test records) and architecture [human_review] (met by a second decision_agent_review, which is never also the cross-model half: assurance-model section 5), as for TASK-103. The tool entries are met by the CI's own steps on the accepted commit; if the governor shadow's raw output in the records dry run at the acceptance request (as for TASK-113) shows any entry unmet, the task stops and comes back to the decision agent, and no workaround is used. The cross-model pair is a way-2 review on Haiku 5.5 (no other model without the owner) of the diff and the test, and a separate decision_agent_review that stands for that entry, both bound to the evaluated commit and the intent versions; the way-2 record names the implementer's model, the model of the session that makes the task commit (expected claude-sonnet-5-5) and the reviewer's model (Haiku 5.5); if the reviewer's model equals either of the other two, the pair counts nothing and the task stops. The aieos-checks and aieos-native runs succeed on the accepted commit and on main after the records commit, read by run id. The checks that touch the contract path (detect, scope) are run on this task's own push with its contract at docs/tasks/TASK-114.yaml by the changed workflow (the job runs the head's code) on its docs path; the state path is exercised only by the scratch harness until the first core-written contract is pushed.
  - AC5: >-
      Limits of the change. It grants no write access, adds no permission block, no secret, no token, no new action and no setting; it uses no network. It removes no check. It loosens exactly one: what detect accepts as a task's contract (a second folder, with an event log beside it). The decision that approves the change says this in plain words (SEC-003, "changes that remove or loosen a check included"). No other path is changed: G0 scope sees only the two write-set paths. It does not decide whether any task is run with `aieos run` (TASK-115 and the first core run are their own decisions), changes no spec text (spec 7 revision 11, which describes this behaviour, is a docs commit after this task is accepted), and does not touch DEF-0031 (its Log gets the D-4509 finding at the end records).
capabilities:
