# Task contract TASK-114, r6 DRAFT (session bdca08a6; r6 by Edit of a copy of r5 under D-4515 C3 (E6 to E8: this line, the shadow at the acceptance request, the second decision_agent_review), not reviewed by any model; r0 by a new file; r1 by Edit under D-4510 K; r2 = r1 filled by fill114.py under D-4511 C2; r3 by Edit of a copy of r2 under D-4511 C3; r4 by Edit of a copy of r3 under D-4512 C3, reviewed by the round-2 review R114c; r5 by Edit of a copy of r4 under D-4514 C3 (the R114c fixes F1, F2, F3 and F7), not reviewed by any model after R114c; scratchpad only; not approved; not committed). Layout of TASK-113's contract (the layout that base_inputs._parse_contract_text reads: every comment on its own line, lists as blocks). The keys were compared one by one with TASK-113.yaml (L-0031): task, contract_version, task_type, objective, traces_to, input_state (base_commit, depends_on, intent_versions), write_set, read_set, forbidden, constitution, acceptance_criteria, capabilities, risk, autonomy, verification_plan, exit_conditions, owner_kept_act.
# Why: D-4508 ruled route (C') for the first core run: P1 (this task) lets CI read a contract that the core wrote, P2 (TASK-115) lets `aieos run` declare owner_kept_act false and removes the stale texts, then the first docs-only low core run. D-4509 chose P1-a: G0 detect accepts .aieos/tasks/<id>.yaml beside docs/tasks/<id>.yaml (spec 7 section 10 item 17, DEF-0105 link 1). Facts read (file:line, main 0723c786): aieos-checks.yml :281-317 and the second copy :716-752 (detect), :460 and :530 (the EVALUATOR lists), :436-441 (the SEC-003 record step), header :82-141 (revisions 10 to 17); constitution.md :122-125 (SEC-003 revision 4); governor.py :585-590; spec-07 :57 and :76.
# Risk: critical. R9 (.github/**) is critical (risk-rules section 3, :54). Every path of the write set is a GOV-003 evaluator path ('.github/**', 'tests/integration/**'). Change class: critical_cr.
# Authority. The change of the workflow is the decision agent's own decision under DM A66 and constitution SEC-003 revision 4 ("for gov-AIEOS, a decision of the decision agent that approves exactly that change as its own decision, changes that remove or loosen a check included"). This change LOOSENS what G0 detect accepts (a second place for a task's contract) and the decision says so. It grants no write access, uses no secret or token, changes no setting (AC5). owner_kept_act false, as TASK-103's contract reads A66 (TASK-103.yaml :22-29); nothing under governor.py or the workflow's pinned checks routes .github/ to the owner (D-4509 section 4 finding): the only owner-routed path check is OPS-002 for the measurement protocol (aieos-checks.yml :471); DEF-0031's open texts (Master Plan section 9 item 1, governor-spec :165, :196, :200) are documents, not a live routing.
# The workflow's revision number: the header holds revisions up to 17, so this change is revision 18.
task: TASK-114
contract_version: v1
task_type: implementation
objective: >-
  Let G0 detect accept a task's contract at .aieos/tasks/<id>.yaml (the file the core writes) beside docs/tasks/<id>.yaml, in both copies of detect in .github/workflows/aieos-checks.yml: the contract commit must be on main, have one parent equal to the contract's base_commit and change only the contract file, except that a state contract may share its commit with .aieos/events.jsonl; the same id added in both folders is a failure. Add '.aieos/tasks/**' to both pinned GOV-003 lists, update the header comments and add the revision 18 paragraph that names the loosening. Add tests/integration/test_g0_detect_copies.py, which checks the text of both copies of detect and of both lists. No other check changes.
