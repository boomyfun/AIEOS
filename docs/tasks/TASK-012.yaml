acceptance_criteria:
  - AC1: >-
      The change. The diff of tests/unit/test_runner_rc.py is exactly one line: line 483's
      changed({'delta': []}) becomes changed({'next_task_state': 'DONE'}); the label "a key that check_decision does
      not know", lines 491-492 and every other line of the module are byte-equal.
  - AC2: >-
      The subtest keeps its point. At the task's commit, R5CallAndComparison.test_each_not_run_rule passes, its
      subtest "a key that check_decision does not know" giving NOT_RUN with the reason "case 1: the call returned a
      value with a check_decision finding"; a script check run in the scratchpad shows the same result with TASK-011's
      draft records.py in place (next_task_state is unknown for decision.execution before and after TASK-011, TASK-011
      AC1), and the record of that check is cited in the acceptance request (reading: the check is repeated at
      TASK-011's acceptance, AC3).
  - AC3: >-
      Nothing else changes, and the limits. Every other test that tests/run_tests.py runs passes unchanged at the
      task's commit. Limits: one unknown key is shown, not every one; the check of AC2 against TASK-011 uses a draft.
  - AC4: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The module's imports do not change; it uses no exec, eval,
      compile, __import__ or importlib, starts no process, opens no network connection, calls no model and writes no
      file. The CI steps at the task's commit report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and
      bandit, as TASK-006's contract lists them. Before the commit, the added text and the file name are scanned with
      the workflow's SEC-001, SEC-002 and OPS-003 patterns and the records executors' pre-push pattern (D-282), and
      each count is 0.
  - AC5: >-
      Tests, with this rule-to-test list: R1 AC1 (the one-line diff, checked by script); R2 AC2 (the subtest at the
      task's commit; the scratchpad check against TASK-011's draft). tests/run_tests.py, unchanged, runs them.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 400k, wall_time: 2h, retries: 2, human_attention: 0m}
verification_plan:
