acceptance_criteria:
  - AC1: >-
      Scope and bytes. The task commit changes only the two paths of the write set. The committed .github/workflows/aieos-checks.yml equals, byte for byte, the after-file (sha256 fa670081233f1e27c4a367256f672fe4093881b1d4834e2236a9fd3ef65fc990); a diff against the base shows exactly three hunks: the Revision 30 header comment before the line "name: aieos-checks" and the four entries in each of the two lists (+7 -2 lines: one header line added before "name: aieos-checks", and in each list one line changed ('**/package-lock.json'] to '**/package-lock.json',) and two lines added); the committed test file has the sha256 e8395e4f678e632e830518a4d1684544ddf913af7194bec40bee01b0ce5271eb (the approval script compares the staged files).
  - AC2: >-
      The lists. Both EVALUATOR literals are single plain quoted lists that scope_reconcile.evaluator_from_workflow accepts, are identical and hold 40 entries: the 36 entries of the base list unchanged and in place, then the four added entries; no other line starts with "EVALUATOR = ["; the pattern order of the first 36 is the base's. Raw output of evaluator_from_workflow on the after text and on the base text (40 and 36 entries) is brought at acceptance.
  - AC3: >-
      The coverage test. The new test file reads the committed workflow and checks, with governor.matches, that every entry of EVIDENCE_DEFINING_PATHS is matched by the list that scope_reconcile.evaluator_from_workflow returns, that both literals hold the four added entries, that the check finds a missing entry, and that the four added paths are entries of the reader list; it passes on the after-file and FAILS on the base workflow (local sandbox run: 4 tests ok on the after-file, 2 failures on the base file; brought at acceptance).
  - AC4: >-
      Nothing else changes. Every other step and line of the workflow is byte-equal to the base; permissions stay "contents: read"; no secret, no token, no write access, no third-party action and no setting change; the isolation tests (test_native_isolation, test_bench_isolation, test_task_contract_repo, test_g0_detect_copies) pass unchanged; the tests that hold local copies of the list (test_scope_drift, test_scope_reconcile, the integration and property fixtures) do not read the workflow and do not pin its list (the C1 scan of D-6967, brought with r324); the test files that read the workflow (test_ci_evidence, test_ci_lint_step, test_ci_resume_pin_logic, test_capture_submit, test_task_capture, test_gate_records, test_launcher_repo, test_task_contract_repo, test_g0_detect_copies, test_native_isolation, test_bench_isolation) pass unchanged; the whole suite ran on a scratch clone of d39e67aa with the after-file and the test draft before approval: unit 3032, integration 229, property 226, every slice exit 0 (local); the whole suite passes by the slice method (D-6249 C2, D-6328 E1.6).
  - AC5: >-
      The CI evidence (pre-registered before the commit exists, with the D-6865 C3 rules: patterns anchored to the exact line form, run counts that name the branch). The step "GOV-003 evaluator lists equal" reads the checkout of the pushed commit, so on the task branch and on main after the landing it prints exactly "GOV-003 evaluator lists: 2 found, equal, 40 entries". The step "GOV-003 evaluator paths" prints "GOV-003 evaluator change: yes (2 of 2 changed paths)" and two "GOV-003 evaluator path:" lines, one for the workflow and one for the new test. Only the governor's judgment at acceptance (scope_reconcile) reads the BASE list of 36 entries, and under it both changed paths are still evaluator paths (.github/** and tests/unit/**). deterministic_rule 0 findings, bandit "No issues identified", pyflakes silent; unit, integration and property steps OK.
  - AC6: >-
      Limits and evidence, stated at acceptance. (1) The lists match by name: a later change of EVIDENCE_DEFINING_PATHS is covered only while the new test is kept and passes. (2) A later change to any of the four files is judged by the base version of the evaluator and is never auto-accepted; records commits that touch decision-matrix.md now print "evaluator change: yes". (3) This task is judged by the BASE evaluator (GOV-003 :94): acceptance is by the explicit decision of the decision agent; the evidence is same-lineage. (4) The pins of the old list text in fixtures stay as they are. (5) No BT3b-2 contract that calls read_evaluation_policy is approved before this task has landed and the main CI read shows 40 entries, equal (D-6967 C5). (6) A push of a workflow change may be refused for want of a workflow permission: that is a credential matter of the owner (A73). (7) The evidence profile for critical (assurance-model section 5, as for TASK-103): unit_test, integration_test, deterministic_rule and static_security_analysis (CI and the slices); ai_review (cross-model), met only by a pair: an other_model_review record of a way-2 review by a Claude model other than the implementer's, checked by machine against every model that did task work, and a separate decision_agent_review; architecture [human_review]: a second, separate decision_agent_review; functional [property/fuzz] by the property_test records; all bound to the evaluated commit and the intent versions.
