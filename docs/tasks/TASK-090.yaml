constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      writer.read_sessions over real stores (tests/unit/test_writer.py): with no reads, the reads of one session, of
      several sessions of the task and of another task, it gives "done" with exactly the task's session ids, sorted,
      each once; after remove_reads of a session that session is not listed; arguments out of form (task_id not in
      the writer's form, timeout 0 or above 60) give "argument", a root that names no existing folder "root", a folder
      with no store "no_store", a store of another table form "tables", each with one finding and nothing created
      (the folder's file list unchanged) and the store's bytes unchanged after every call; a stored session id that
      is not text gives "unreadable"; a write lock held by a second sqlite3 connection opened in the test (BEGIN
      EXCLUSIVE), with a small timeout and no wall-clock sleep, gives "unreadable"; no finding holds caller text (no
      root, session id or task id; test_writer.py :1675-1692's rule for the older functions); no call raises.
  - AC2: >-
      writer.py's names and form: its top-level names are exactly BASE's 94 plus session_leases, read_sessions and
      names beginning "_session_leases", "_SESSION_LEASES", "_read_sessions" or "_READ_SESSIONS", all above the
      TASK-066 marker (R23's test widened); the TASK-067 AC9 test passes unchanged (no INSERT, UPDATE, DELETE or
      PRAGMA after the marker, two "finally:"); the TASK-067 AC6 test passes unchanged (every query a constant,
      _READ_SESSIONS among them); the diff of writer.py from the base is added lines only (checked at G3 by the
      scratchpad script and by the review, not by a unit test).
  - AC3: >-
      start's new arguments: each of read_sessions, session_leases, stored_reads, remove_reads and observe_gone given
      out of form (neither None nor callable) gives "refused" with reason "argument" and zero callee calls; with none
      given, each defaults at call time to its named function (a patch after import is the one called; tested in
      tests/unit/test_launcher_gone.py with a non-empty listing, each of the five patched by mock.patch.object on its
      module, restored after the test, and seen called); _CALLEES ends
      with the five names; START_KEYS is unchanged.
  - AC4: >-
      The step, by recording stand-ins: read_sessions(root, task_id) is called once, first, before expire; for a
      listed session with no row unexpired at now (no row, or only rows with expires_at <= now, of any task), with
      "ended" true and with "ended" false, the calls are session_leases (with root, the session id and now),
      stored_reads (root, the session id, task_id),
      observe_gone (root, task_id, the session id, the reads, 'lease gone (released or expired)', now, recorder + " at
      the next start, for session " + the session id), remove_reads (root, the session id, task_id), in that order,
      then the next session, then expire; a session with any row unexpired at now (of the task or of another task)
      gets only its session_leases call, and so does an "ended" true session with an unexpired row;
      with stored_reads giving [] the record call still comes with [];
      the real
      read_set_record.observe_gone, given that recorder text and a recording append stand-in, gives "written" with
      one append whose recorder holds the session id and ends with read_set_record.GONE_JOIN + 'lease gone (released
      or expired)'.
  - AC5: >-
      Failing per session, never stopping start: a refused (with "no_store", "root" and "tables"), raising or
      malformed listing (not a list, an item not a non-empty str) gives its "gone_records: " findings, no
      per-session call, and expire next; per session, a refused ("session" among them), raising or malformed
      session_leases answer (the malformed forms end's AC7 lists) gives no stored_reads; a refused, raising or
      non-list stored_reads answer gives no record; a record not found present (a "core" refusal with core reason
      "fence" or "log", an "argument", a "read_paths" or an "observe" refusal) or a raising observe_gone gives no
      remove_reads; "duplicate" and a core
      "conflict" are followed by remove_reads as "written" is, the conflict named; a refused or raising remove_reads
      is named; an answer object whose attributes raise, given as the listing and as each per-session answer, gives a
      finding; after each of these the next listed session is processed and expire follows; no call raises.
  - AC6: >-
      The findings: every line of the step begins "gone_records: <session_id>: " (the listing's lines
      "gone_records: <task_id>: "), a session's refusal giving one or several such lines, a present record's line
      naming its result and the removed count; the lines come first, in
      order, in the findings of the refused, not granted and granted results that follow (each tested once); an empty
      listing gives no line; a session skipped for an unexpired row gives exactly the line "gone_records:
      <session_id>: skipped, a lease row is unexpired"; the result has exactly START_KEYS.
  - AC7: >-
      TASK-086's tests: launch() passes a non-recording read_sessions stand-in giving "done" with [] unless the test
      gives its own, and four per-session stand-ins that record any call into a list, launch() raising
      AssertionError after start returns if it is not empty;
      TASK086AC2Order.test_the_order shows read_sessions recorded first, before expire, in an added
      run; TASK086AC1Arguments' each-wrong-argument test covers the five new callees; TASK086AC12Docstrings
      .test_the_new_module takes the replaced phrase; these three keep "TASK-086 AC" beside "TASK-090 ACn"; every other
      test of tests/unit/test_launcher.py, tests/unit/test_launcher_end.py, tests/unit/test_read_set_gone.py and
      tests/integration/test_launcher_repo.py passes unchanged, and TASK086Naming passes unchanged.
  - AC8: >-
      DEF-0102: start's findings from adapter.start and from adapter.end, and _store_findings' findings, keep only
      the str items of a list or a tuple; a string, a number and a mapping given as findings each give no item from it
      and no raise, tested at each of the three places, in tests/unit/test_launcher_gone.py: start's two places by
      mock.patch.object of exactly resume_inputs.git_inputs, resume_log_inputs.log_inputs, base_files.read_file and
      execution.task_view, each restored after its test, never of writer, read_set_record or the five new callees;
      _store_findings directly.
  - AC9: >-
      The modules: launcher.py's import set is unchanged (TASK086AC10Modules.test_the_import_sets passes unchanged)
      and it names no open, exec, eval, compile, __import__, subprocess, os, sys or time, no attribute environ,
      getenv, now, write or open_store, no ".aieos" string, and no assert; end is unchanged (its diff touches no line
      of end, _path, _present or _conflict except _store_findings' findings line; checked at G3 by the scratchpad
      script and by the review, not by a unit test); the new test file uses no
      tempfile, sqlite3, shutil or open and roots only the literal 'C:/launcher-gone-root-90'; the new test file and
      the changed tests use no one-argument .replace() and no .replace(target=...) (aieos-checks.yml :1622-1625),
      keyword-only datetime.replace staying allowed;
      tests/unit/test_writer.py :397-412 and tests/unit/test_mcp_server.py :285-292 pass.
  - AC10: >-
      Docstrings: launcher.py's holds "starts no runtime", "never raises", "not before DEF-0101's open points are
      closed" (replacing "not before TASK-090 lands"), "the store is the caller's", "max_risk null never grants",
      "AIEOS_BASE is the head_commit", "the log is read twice", "this task's choice", "the record before the
      release", "no fencing token", "TASK-090", "gone_records", "before the expiry" and "at the next start", and no
      longer "the
      third, the next start's record of a session gone without an end, is TASK-090's"; read_sessions' docstring says
      read only, core-only, that it writes and creates nothing, and that its read is a hand-kept copy of
      _read_reads' transaction steps; every new test names "TASK-090 ACn", checked by a naming test in
      tests/unit/test_launcher_gone.py (tests/unit/test_launcher_end.py :359-364's form).
  - AC11: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) the step after expire (AC4); (2) a
      session with an unexpired row of another task processed (AC4); (3) observe_gone given the reason "violation"
      (AC4); (4) the recorder text without the session id (AC4); (5) the reads removed after a record not found
      present (AC5); (6) a refused listing stops start (AC5); (7) a raising session_leases ends the step, so later
      sessions are skipped (AC5); (8) the record skipped when reads is empty (AC4); (9) the step's findings dropped
      from the result (AC6); (10) a key added to start's result (AC6); (11) read_sessions' query without its task
      condition (AC1); (12) read_sessions creating the store when it is missing (AC1); (13) a new callee bound at
      import time (AC3); (14) start's adapter.start findings line back to list(...) (AC8); (15) a listing given as a
      string of several characters taken item by item (AC5); (16) observe_gone called after a refused stored_reads
      (AC5); (17) start's adapter.end findings line back to list(...) (AC8); (18) _store_findings back to its base
      line (AC8); (19) a session with an unexpired row of its own task processed (AC4); (20) a refused session_leases
      answer ("session") taken as gone, the session processed (AC5); twenty copies
      in all; each copy made in a scratchpad script at G3, not committed; the governor's evaluate at acceptance (the
      shadow) with any difference named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9, AC10]}
  - {gate: G3, check: constitution, args: [AC11, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
