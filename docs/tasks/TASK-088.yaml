constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The arguments and the reader: log_inputs(repo, commit, task_id, log, read=None); repo not a str, commit not 40
      or 64 lowercase hex, task_id not TASK-<digits>, log not bytes, or read neither None nor callable, each give
      (None, findings) with zero reads; read defaults, at call time, to gitread.run (a patch after import is the one
      called); every read is one of gitread's fixed forms (gitread.form_error gives None for each recorded call).
  - AC2: >-
      dependencies through execution.task_states: for a log built by eventlog.append, a dependency approved and done
      gives state DONE, one approved and blocked BLOCKED, one with no task.approved null; stale_evidence is true only
      when an evidence.stale of that task follows its last task.done (one before it, or of another task, gives false);
      a duplicate line is not counted; a task.* event _project does not name (made, since records.EVENT_TYPES leaves
      no such type, by mock.patch.object(execution, 'STATE_OF', …) as TASK-084's tests do; disp88 row 11), or a log
      check_log refuses, gives findings; task_states over an empty id list gives {}.
  - AC3: >-
      budget_use: one entry per budget of the contract's autonomy.budgets, exactly {used, reported}; retries'
      used is execution.rework_count (two decision.acceptance events with next_task_state REWORK after the last
      task.approved give 2, one before it does not count, one with ACCEPTED does not count) with reported true; every
      other budget {used: 0, reported: false}; a contract with no retries budget gives no retries entry; a contract
      without input_state, depends_on, intent_versions or autonomy.budgets in form gives findings (disp88c row 5).
  - AC4: >-
      intent_current: for each intent_versions entity, the SHA-256 of the file's bytes at the given commit (a changed
      byte changes it, an unchanged file equals the contract's value; the stand-in file holds non-ASCII text and a
      trailing newline, so a hash of another encoding or of a stripped text differs, disp88 row 6); an absent file
      gives null; an entity out of base_files' path form gives findings.
  - AC5: >-
      articles: one entry per "### <ID> · " heading of the constitution at the commit, in file order, exactly {id,
      scope, applicability, violated}, scope the article's Scope prose as a str ("" when there is none), running to
      the first ". " or the line's end (SEC-003's is "`.github/`"), violated null; applicability
      {task_types: [...]} from
      "Applicability: implementation, refactoring." and null for a prose that is not a list of lowercase words; a
      constitution with no heading, or an id twice, gives findings.
  - AC6: >-
      risk_rules and policy_version: each rule of the policy at the commit as {match: {paths: [...]}, risk: class},
      in order, a component_tags rule as its TAGS_MATCH entry's paths ({match: {paths: [src/**, tests/**]}, risk:
      class}); with a write set outside src/ and tests/ (docs/x.md) that no other stand-in rule meets, resume_check's
      _task_risk leaves it unmatched, so check 7's ESCALATE can fire (D-2602 C1); a rule rules_from_policy refuses
      gives findings; policy_version the block's value;
      a policy with no block, or no or two policy_version lines, gives findings.
  - AC7: >-
      The output and failing closed: exactly the seven keys, observed_read_set null; merged with TASK-085's git_inputs
      over the same stand-in commit and fixed task_id, log_seq, task_state, approved_contract_hash and runtime, the 22
      keys equal resume_check.INPUT_KEYS and resume_check.check gives a record with no error, whose uncovered list
      names "article <id>: no check result at HEAD" for every article of the stand-in constitution whose
      applicability is null or names the stand-in contract's task_type, listed or not (disp88c row 1), and an unlisted
      stand-in article whose applicability leaves out that task_type is not named; a read that raises
      (RuntimeError, RecursionError, MemoryError), an answer out of form, or a refused log give (None, findings); no
      call raises or returns a partial dict.
  - AC8: >-
      The modules: by ast over pathlib's read_bytes, execution.py's and scope_reconcile.py's import sets are exactly
      those their tests pin (tests/unit/test_execution.py :704-727 and tests/unit/test_scope_reconcile.py :508-532
      unchanged and passing); task_states, rework_count and policy_block exist and give their stated values; by
      ast, task_states and rework_count use no attribute of writer and task_states calls _project (TASK-084's AC5 and
      AC6 forms; disp88 row 12); the
      existing lines of both files are unchanged (checked at review from C..X); the new module imports only hashlib and
      re of the standard library and aieos_bootstrap's base_files, base_inputs, execution, gitread, resume_check and
      scope_reconcile, and names no open, exec, eval, compile, __import__, subprocess, os, sys, time or autonomy, no
      attribute now, environ, getenv, write, grant_lease, append_event or expire_leases, and no ".aieos" string.
  - AC9: >-
      Over this repository (an integration test through gitread.run, the repository found by pathlib; it needs the
      full history): log_inputs at ed4d482e42396f0ec0b2a447a1b3b43174051f36 for TASK-085 with the log b"" gives
      intent_current equal to TASK-085.yaml's intent_versions for all ten entities (the ten hashes confirmed at
      ed4d482e by ivhash88, D-2587; disp88 row 13); articles whose ids are exactly the
      constitution's headings in order (INV-001 first); risk_rules of twelve rules, the second (R2) a paths rule as
      the policy writes it and the third (R3) as {match: {paths: [src/**, tests/**]}, risk: high}; policy_version "v4";
      dependencies with every one
      of TASK-085's three
      dependencies null (the log is empty); budget_use retries {used: 0, reported: true}.
  - AC10: >-
      Every existing test passes, the pins of the header among them; resume_inputs.py, resume_check.py and their tests
      are unchanged; the full suite runs locally in three unit parts, integration and property before the first code
      commit; the deterministic rule's local run gives no finding. The new module's docstring holds, whitespace read as
      single spaces, "the commit is an argument", "read is injectable", "never raises", "writes nothing", "fails
      closed", "this task's choice", "seven of the 22 inputs", "DEF-0100" and "observed_read_set is null"; execution.py
      and scope_reconcile.py each gain a docstring paragraph naming their new functions and "TASK-088", execution.py's
      saying that task_states and rework_count read the log for TASK-088's readers while execute itself still gathers no
      Resume Check input (the kept phrase "it gathers no Resume Check input" unchanged), scope_reconcile.py's holding
      no "assert " text and no .run( call (disp88 row 10); every new test
      names "TASK-088 ACn".
  - AC11: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) resume_log_inputs.py binds read at
      import time (AC1); (2) execution.py's task_states counts an evidence.stale before the last task.done (AC2); (3)
      execution.py's task_states gives READY for an unknown task (AC2); (4) execution.py's rework_count counts events
      before the last task.approved (AC3); (5) resume_log_inputs.py marks every budget reported (AC3); (6)
      resume_log_inputs.py hashes the decoded text with another encoding or a stripped text (AC4); (7)
      resume_log_inputs.py gives an absent intent file an empty hash instead of null (AC4); (8) resume_log_inputs.py
      skips the last heading (AC5); (9) resume_log_inputs.py drops a refused rule and goes on (AC6); (10)
      scope_reconcile.py's policy_block returns the lines after the block (AC6); (11) resume_log_inputs.py returns the
      dict found so far on a read error (AC7); (12) execution.py gains an import (AC8); (13) resume_log_inputs.py
      skips the contract-keys check (AC3); each copy made in a scratchpad
      script at G3 (brk85b, as brk85), not committed; copy (12)'s text is shown failing AC8's ast check; the governor's
      evaluate at acceptance (the shadow) with any difference named; the stated choices in the records (not tests).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1200k, wall_time: 6h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9, AC10]}
  - {gate: G3, check: constitution, args: [AC11, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
