# TASK-088: the rest of the Resume Check's inputs, read at a given commit and from the log, in a new module
# resume_log_inputs.py (specification 3 revision 5, sections 1 and 2; conformance-files.md section 9; DEF-0097; M7's
# fifth task, its second part; planned as TASK-085b (D-2533, D-2582), numbered TASK-088 (D-2585), done before
# TASK-086). Plan: decisions D-2582 to D-2585 (session 3797498a): the scope note
# (MYSP/t85b/scope85b.md) and the nine rulings of D-2582 as amended by D-2584 (a new module, so resume_inputs.py and
# its tests stay untouched), the pin scan (MYSP/t85b/pinscan85b-out.txt at ed4d482e and its reading
# MYSP/t85b/pinscan85b-reading.md, D-2583, D-2584), the risk run (MYSP/t85b/risk/risk_class85b.py), the forbidden list
# (MYSP/t85b/forbid85b.txt, the two write-set files under src/ that exist left out), DEF-0100's draft
# (MYSP/t85b/def0100.md).
#
# Scope:
# - A new module src/aieos_bootstrap/resume_log_inputs.py with one public function, log_inputs(repo, commit, task_id,
#   log, read=None), returning (a dict, None) or (None, findings), findings a non-empty list of strs, never a partial
#   dict. The dict holds exactly seven of the Resume Check's 22 input keys (resume_check.py :44-48), in
#   conformance-files.md section 9's forms (:94): dependencies, observed_read_set, budget_use, intent_current,
#   articles, risk_rules and policy_version. With TASK-085's ten (resume_inputs.git_inputs), the 22 are covered once
#   TASK-086
#   adds task_id and runtime and derives log_seq, task_state and approved_contract_hash from the log (disp88 row 2);
#   the call that joins them and calls resume_check.check is TASK-086's. read defaults, at call time, to gitread.run.
# - In src/aieos_bootstrap/execution.py, by added lines only (no existing line changed), two public functions over its
#   existing helpers (D-2582 rulings 3 and 4):
#   - task_states(log, task_ids): for each id, {state, stale_evidence}: state the one _project gives over the log's
#     lines (records.check_log, duplicates left out), or null when the log holds no task.approved of it (tested in
#     the lines before _project is called, since _project's two refusals share one reason, execution.py :209, :220;
#     any _Stop of _project then fails closed; disp88 row 7); stale_evidence true when the log holds
#     an evidence.stale event of that task after its last task.done, else false (false when the task has no
#     task.done; disp88 row 8; an evidence.stale with no task_id, records.py :675, never counted; disp88c row 7);
#     returns (a dict, None) or (None, findings);
#   - rework_count(log, task_id): the count of the task's decision.acceptance events with next_task_state REWORK after
#     its last task.approved (specification 1 section 5.1's retries), an int, 0 when the log holds no task.approved
#     of the task (disp88 row 8); (int, None) or (None, findings).
#   They add no import and name nothing tests/unit/test_execution.py :704-727 refuses.
# - In src/aieos_bootstrap/scope_reconcile.py, by added lines only, one public function policy_block(text): the
#   policy's section 3 yaml block's lines as _block gives them, or None (D-2582 ruling 7). It adds no import, no
#   "assert " text and no attribute call that tests/unit/test_scope_reconcile.py :508-532 refuses.
# - What it does not do: no write, append, grant or lease; resume_check.py, resume_inputs.py and their tests are not
#   changed; no gitread form is added.
#
# The rulings (D-2582 as amended by D-2584), each this task's choice (proposed):
# - The contract: base_inputs.contract_at at the given commit (TASK-085's wrapper), for depends_on, intent_versions
#   and autonomy.budgets, a contract without input_state, depends_on, intent_versions or autonomy.budgets in form
#   failing closed (disp88 row 8); the log given as bytes.
# - dependencies: execution.task_states(log, contract's depends_on), keyed by task id; state null when the log does
#   not know the task (resume_check check 5 then gives BLOCKED); stale_evidence as above (a reading, carried to
#   DEF-0100).
# - observed_read_set: null, by rule: specification 3 takes the observed source only from a runtime of tier T3 or above
#   and no tier counts until the owner measures it (read_set_record.py :38-43; C6, P-LOC).
# - budget_use: for each budget named in the contract's autonomy.budgets: retries {used: rework_count, reported:
#   true}; every other budget {used: 0, reported: false} (no source reads a runtime's reports; used 0 because
#   resume_check's form check refuses null, resume_check.py :266-267, the R5 F2 reading; disp88 row 9); the retries
#   limit stays a str in the contract (base_inputs.py
#   :17), so check 8 names retries as "a form that cannot be parsed" (resume_check.py :652-655), a stated limit carried
#   to DEF-0100 (rv85b N11).
# - intent_current: for each entity of the contract's input_state.intent_versions, read as a repository path at the
#   given commit: the SHA-256 hex of the file's bytes (base_files.read_file's text encoded as UTF-8, which gives the
#   bytes back exactly, as contract_at does; a non-UTF-8 or over-size file fails closed; disp88 row 6), or null when
#   the path is not in its folder's listing
#   (base_inputs.paths_under then base_files.read_file); an entity that is not a path in base_files' form fails
#   closed. resume_check check 4 compares by equality (:584-595), so the self-build's file hashes compare directly.
# - articles: docs/pre-genesis/constitution.md at the given commit; one entry per heading "### <ID> · " (the id in the
#   form [A-Z]+-[0-9]+), in file order: {id, scope, applicability, violated: null}; applicability
#   {task_types: [...]} when the article's "Applicability: <words>." prose is a comma-separated list of lowercase words
#   ([a-z][a-z_-]*), else null; scope the article's "Scope: <text>" prose as a str, running from "Scope: " to
#   the first ". " or the line's end (so SEC-003's is "`.github/`", constitution.md :125; disp88c row 6; disp88 row 1):
#   a scope that is not a mapping makes resume_check's _scope_patterns give None (:425-426), so every article whose
#   applicability is null or names the contract's task_type counts as applicable (_applicable tests applicability
#   first, :443-447; disp88c row 1), as specification 3 :45 says for a scope that cannot be evaluated (a null scope
#   would give [] and leave an unlisted article out, :421-424, :450-453); a stated departure from section 9's {paths,
#   components} form, which _check_inputs does not check (:251-255); an article with no "Scope:" prose gets the str ""
#   (also not a mapping); violated null (no check result at an unevaluated commit; check 6 names each applicable one as
#   uncovered, :624-625). A constitution with no heading, or one id twice, fails closed.
# - risk_rules: scope_reconcile.rules_from_policy over docs/specs/risk-rules-gov-aieos.md at the given commit (no
#   parser copied, INV-003), each rule {match, class} turned into section 7's {match: {paths: [...]}, risk: class};
#   a component_tags rule is given as its TAGS_MATCH entry's paths ({match: {paths: [src/**, tests/**]}, risk: high}
#   for R3), the risk rules' point 3 (:18) reading, not a departure (D-2602 C1, reversing D-2589 C1; disp88c rows 3
#   and 4), so a write-set path outside src/ and tests/ that no other rule meets stays unmatched and check 7's
#   ESCALATE (point 2, :17) can fire; any refused rule (class null) fails closed.
# - policy_version: the value of the block line "policy_version: <v>" in scope_reconcile.policy_block's lines, exactly
#   one such line, or fail closed.
# - The output: exactly the seven keys, or (None, findings); never raises. Every Git read goes through read, one
#   memoized read shared by all calls in one call (as resume_inputs): log_inputs' own memo, passed as read to
#   contract_at, paths_under and base_files.read_file, whose own caches sit inside it (disp88 row 5).
#
# Stated limits: seven of the 22 inputs; observed_read_set null; three budgets unreported; the retries limit unparsed
# by check 8, so check 8 is inert for every budget of the self-build; stale_evidence a reading (an evidence.stale with
# no task_id never counted); every article's scope its prose (a stated departure) and violated null; component_tags
# rules read as point 3's paths until the architecture names components; intent_current as file hashes, a non-UTF-8
# or over-size file failing the call; the repository read at one moment; a listed folder with a symbolic link, a
# submodule or an out-of-form name fails the call (base_files' rules), and an intent entity at the repository root
# lists the whole tree (base_inputs.py :415-418), so one such entry anywhere fails it (disp88c row 8). Those named in
# DEF-0100 are carried there for specification 3's next revision (disp88 row 4).
#
# DEF-0097: stays open (disp88 row 2): task_id and runtime are the launcher's (DEF-0097 :13), so it closes at
# TASK-086's records, once every input is read by TASK-085, TASK-088 or TASK-086, or stated and moved to DEF-0100.
# DEF-0100 (MYSP/t85b/def0100.md) is written with the records as a second path.
#
# Owner-act boundary: none reached. The module reads only; no hook, setting, policy, gitread form, measurement or
# runtime tier (DM A51 item (4)).
#
# The pins (L-0026; MYSP/t85b/pinscan85b-out.txt at ed4d482e; D-2583, D-2584): tests/unit/test_execution.py :704-744
# (R10Purity: execution.py imports exactly datetime, re and aieos_bootstrap's records, resume_check and writer; no
# ast.Assert; no Name open, exec, eval, compile, __import__, importlib, subprocess, os, sys or time; no attribute now,
# utcnow, today, environ, getenv, system, Popen, write, open_store, start_session, end_session, expire_leases,
# release_lease or evaluate; no ".aieos" string; the docstring's nine phrases; __init__.py names execution), kept;
# tests/unit/test_execution_list_tasks.py, unchanged and passing; tests/unit/test_scope_reconcile.py :508-532 (imports
# exactly datetime, hashlib, re and gitread, records, scope_drift, writer; no bare call open, eval, exec, compile,
# __import__; no attribute call write, now, utcnow, time, run, Popen, system, getenv, import_module; no "assert " in the
# text; the docstring's four phrases), kept; tests/unit/test_resume_inputs.py and resume_inputs.py, unchanged.
# __init__.py is not changed, so __all__ does not name the new module. The package-wide scans test_writer.py :397-412,
# test_gitread.py :370-380 and test_autonomy.py :238-246 hold for the new module. The deterministic rule
# (.github/workflows/aieos-checks.yml :1489-1513): no allowance for any write-set path, so no DENY_MODULES module
# (tempfile, sqlite3, shutil among them), no DENY_NAMES name, no DENY_OS call, no DENY_ATTR_CALLS call, no one-argument
# .replace(. GOV-003's EVALUATOR list (src/aieos_bootstrap/**, aieos-checks.yml :423), unchanged. No change under
# .github/.
#
# Risk: high, computed over the base by MYSP/t85b/risk/risk_class85b.py (R2 medium and R3 high, not evaluable, for each
# path). GOV-003: an evaluator path; change class ruled at acceptance. Reviews on Sonnet 5.5 and Opus 5.5 (never
# Fable), read tools only; the acceptance review on Sonnet 5.5, by the two-models rule for a way-2 review (governor.py
# :270-275; disp88 row 15). Naming (D-544 Q3): every new
# test function names "TASK-088 ACn" in its own docstring. Not applicable: OPS-001; INV-005 to INV-011; GOV-001, GOV-004
# to GOV-006, SEC-003. INV-004 is not reached (nothing is written); it stays listed for the evaluator path's profile.
# Owner-kept acts: none in this task.
# Shadow (D-2042 C3 as amended by D-2068): the governor's evaluate at acceptance, any difference named.
# Local runs: the unit group in three parts.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-088.yaml, has one parent equal to base_commit, and goes
# to main under its own decision; the task's commits carry "AIEOS-Task: TASK-088" and go to task/TASK-088; main
# receives them only at acceptance.
