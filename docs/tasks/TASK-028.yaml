acceptance_criteria:
  - AC1: >-
      The interface. writer.release_lease_token(root, task_id, fencing_token) takes root as the writer's other
      functions take it, task_id as _check_task checks it, and fencing_token as AC2 checks it; it returns a
      StoreResult: result "done" with value the removed lease in eventlog.LEASE_KEYS' form (as held_lease returns it)
      when the held lease on task_id has exactly that token; result "refused", reason "none", value None, and one
      finding, when no lease on task_id is held or no store exists under root (no store is created); result "refused",
      reason "token", value None, and one finding naming the held lease's epoch and counter and the given ones, when a
      lease on task_id is held with another token. Nothing in the store changes on a refused result.
  - AC2: >-
      The token (decision D-606 C1). fencing_token must be a mapping (a dict) with exactly the keys "epoch" and
      "counter", epoch a non-empty str and counter an int that is not a bool and is at least 0; anything else (None, a
      list, a missing or extra key, an int, float or empty epoch, a bool, float, str or negative counter) raises
      ValueError naming the token before the store is opened, as the writer's other argument checks raise. Two tokens
      are equal only when their epochs are equal strings and their counters equal ints; so an integer epoch and a text
      epoch are never equal (recovery's rule), since the former raises.
  - AC3: >-
      One transaction (DEF-0053 F3). The read of the held lease and its removal run in one call of the writer's
      _transaction: the held lease on task_id is read, its token compared with the given one, and only on equality
      the row is removed by "DELETE FROM leases WHERE task_id = ? AND fencing_epoch = ? AND fencing_counter = ?" with
      the given values, a constant query text with parameters as every query of the writer; the function checks that
      exactly one row was removed on "done" (the DELETE's row count is 1), else it raises and _transaction rolls the
      change back. So a lease granted to another holder after the given token's lease expired or was released, which
      has a new counter, is never removed by the old token.
  - AC4: >-
      The rest of the writer unchanged. release_lease, grant_lease, expire_leases, held_lease, held_leases, open_store,
      start_session, end_session, append_event, the schema, the tables, the constants and every query text other than
      the new one are unchanged; the new function is added after release_lease; the module docstring gains one line
      naming it, and no other claim.
  - AC5: >-
      submit's release (decisions D-605, D-606 C2). submit's release parameter defaults, at call time, to
      writer.release_lease_token and is called as release(root, task_id, fence) with the commit's token, exactly once,
      in the same two places as before: after an appended task.submitted, and after a duplicate when held gives a
      lease whose token is the commit's (the held() pre-check of TASK-025 AC5 is kept unchanged). Its result is
      mapped: an object whose result is "done" gives released equal to its value; any other result, a refused one
      included, gives released None and the finding "store: the held lease, if any, is not the commit's; nothing was
      released"; an exception raised by release keeps TASK-025's result and finding ("the release raised <type>; the
      lease was not released, and it expires by its own expiry"). submit's result keys and every other branch are
      unchanged.
  - AC6: >-
      No exception escapes submit (DEF-0053 F5). Every read of an object returned by append or release (its result,
      reason, findings, refusal, value, and the refusal's result) is made so that an attribute that raises any
      Exception, or findings that are not an iterable of strings, gives result "refused" with reason "store" and a
      finding naming the exception's type or the bad form (or, for the release's result after an appended or
      duplicate event, released None and a finding), never an exception out of submit.
  - AC7: >-
      The defaults and the docstrings. A test pins submit's four defaults at call time as gitread.run,
      writer.append_event, writer.release_lease_token and writer.held_lease (TASK-025 AC7's test, changed for the
      third). submit.py's docstring replaces the limit sentence "The release after an appended event takes no token
      ..." with: the release removes the lease only while the store holds the commit's token (writer
      release_lease_token, TASK-028), so a lease granted to another holder since is never released; and names
      release_lease_token where it names release_lease; no other claim is added (decision D-606 C2).
  - AC8: >-
      Purity and the CI checks (INV-001 to INV-004). writer.py keeps to the workflow's revision-7 allowances for it
      (sqlite3, os.makedirs, open only as open(<path>, "rb") or open(<path>, "ab"), strings naming the project-state
      directory) and adds no import; submit.py adds no import; no exec, eval, compile, __import__ or importlib; no
      assert in src (bandit B101); deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit report no finding at the
      task's commits, on the base with the workflow's revision 8, with no change under .github/.
  - AC9: >-
      Limits, stated: v0.1 runs one task at a time (concept line 951) and the store has no lock beyond SQLite's own
      transaction (TASK-016 AC10), which the comparison and removal now share; release_lease stays token-less for
      end_session's use and is no longer called by submit; the lease is still released after the append in a separate
      call, so a stop between them leaves the lease until a retry (the duplicate path) or its expiry (TASK-025 AC11);
      the trusted PATH stays the caller's precondition (DEF-0052 G1). Every existing module and test not in the write
      set is unchanged, and if one can pass only by a change the task escalates (needs_out_of_scope_change).
  - AC10: >-
      Its own tests and the added text. Every test this task adds names the AC ids it stands for as "TASK-028 ACn" in
      its own docstring and names no other task's AC in qualified form there, except a changed TASK-025 test, which
      keeps its own names and adds TASK-028's. Before each commit, the added text is scanned with the workflow's
      SEC-001, SEC-002 and OPS-003 patterns, and each count is 0.
  - AC11: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 (done with the lease returned and the
      store then holding none; refused "none" with no lease and with no store, nothing created; refused "token" for
      another epoch and for another counter, the lease still held); R2 AC2 (each malformed token raises ValueError,
      the bool counter and the integer epoch among them, and the store is unchanged); R3 AC3 (the F3 window on a real
      store: grant, expire_leases past the expiry, grant again to another holder, then release_lease_token with the
      first token is refused "token" and the second lease is still held; a test that the DELETE names epoch and
      counter); R4 AC4 (release_lease's own tests pass unchanged; AC4 is checked by the diff, read by the decision agent and
      the way-2 reviewers); R5 AC5 (with stand-ins: release called with (root, task_id, token) once after
      appended and after a duplicate with the same token; a done result gives released the value; a refused, None or
      unknown result gives released None and the finding; an exception keeps the finding); R6 AC6 (stand-in results
      whose attributes raise and whose findings are not iterable, from append and from release); R7 AC7 (the four
      defaults pinned). Unit tests in tests/unit/test_writer.py and tests/unit/test_submit.py; R3's real-store test in
      tests/integration/test_writer_files.py. tests/run_tests.py, unchanged, runs all groups.
