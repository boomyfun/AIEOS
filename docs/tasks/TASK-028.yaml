# Task contract TASK-028, release by token (Master Plan revision 3, §4 M4; specification 1 sections 5.1, 5.2 and 8;
# specification 2 section 3; DEF-0053 F3 and F5; DEF-0030, the core's caller). Revision 0, drafted under decisions
# D-605 (Q2, C1) and D-606 (Q1, C1 to C3), brought for approval in its own request; whether it is approved is recorded
# in the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of
# TASK-007 to TASK-025. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it changes: the core's single writer (TASK-016) gains one function,
# release_lease_token(root, task_id, fencing_token), that removes the held lease on a task only when the lease's
# fencing token equals the given one, compared and removed inside one SQLite transaction; and the submission path
# (TASK-025) releases through it with the commit's token, so that a lease granted to another holder after the
# submitter's lease expired is never released (DEF-0053 F3: "the release after an appended event takes no token").
# The same change to submit.py closes DEF-0053 F5 (its resume condition: "the next task that changes submit.py"):
# reading the writer's result never raises out of submit, whatever the stand-in.
# Why first (decision D-605): recovery at start (TASK-026) must release the lease after each compensating submission
# (specification 1 section 5.1, task.submitted row, "the lease is released (proposed)"), because a lease left held
# after a compensating task.submitted would let submit append a second task.submitted for the same task; and
# DEF-0053 F3's resume condition puts release by token before TASK-026 or TASK-027 relies on the release.
# What it does not do: no change to release_lease (end_session and TASK-016's tests use it), grant_lease,
# expire_leases, held_lease, held_leases, open_store, start_session, end_session or append_event; no new table or
# column, no schema change; no recovery (TASK-026), no evaluation path (TASK-027); no change to eventlog's fence rule;
# no Git read or write of its own; no clock read; nothing under .github/ and no workflow change (the workflow's
# revision 7 allowances, which name exactly src/aieos_bootstrap/writer.py and its three test modules, cover the writer
# paths of this write set; submit.py and its tests need none, as TASK-025 needed none); no policy, no frozen fixture.
# The token's form (decision D-606 C1): a mapping with exactly the keys epoch and counter, epoch a non-empty string,
# counter an int that is not a bool and is not negative, the form the store keeps (specification 2 section 3,
# fencing_epoch TEXT and fencing_counter INTEGER) and held_lease returns; the comparison is of that form, so an
# integer epoch, or a counter that is a bool or a float, is not a token of the store and never matches (it raises, as
# the writer's other argument checks raise).
# DEF-0041 (c) (decision D-414): "never give an earlier store's epoch to a recreated store" does not apply: the new
# function grants nothing and never creates a store; with no store it changes nothing and says so.
# Readers of the changed paths (D-263 C3's practice): writer.py is imported by submit.py and by the writer's three test
# modules; submit.py by its three test modules; no other module of src/ imports either. The package's __init__.py is
# not changed (its __all__ lists modules, not functions).
# Risk: high, and change class critical_cr, each computed over the base by script (risk_class28.py and
# gov003_class28.py of the drafting session). Profile (assurance-model.md §5, gov-AIEOS, high): functional
# [unit_test], architecture [deterministic_rule], functional [integration_test], security [static_security_analysis]
# and architecture [ai_review (cross-model)], plus the evidence_required of the applicable articles.
# Reviews (as TASK-025's): five way-2 reviews by a Claude model other than the implementer's, and the decision agent's
# three, each brief naming for testing: that the comparison and the removal happen in one transaction with the
# removal keyed on task, epoch and counter; that no lease other than the one with the given token is ever removed
# (the F3 window: a lease expired, then re-granted with a new counter); the token validation of AC2; that
# release_lease and every other writer function are unchanged; submit's mapping of the release result (AC5); that no
# exception escapes submit for any stand-in result (F5, AC6); the changed TASK-025 tests and the defaults pin (AC7).
# Naming: every test this task adds names the AC ids it stands for as "TASK-028 ACn" in its own docstring, following
# DEF-0049's convention; a TASK-025 test that this task changes keeps its "TASK-025 ACn" names and adds the
# "TASK-028 ACn" it now also stands for.
# Evaluation path (A61; as TASK-007 to TASK-025): commit C changes only docs/tasks/TASK-028.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-028", go to task/TASK-028 under their own
# decisions; main receives the task only at its acceptance. The task push's CI base run is a RISK-01 conformance run
# over the set file of DM F35, reported advisory, never MEASURED.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the
# governor, evidence records, the replay and the policy meet no path of the write-set); GOV-001, GOV-004 to GOV-006
# and SEC-003 (the concept file, the bound artifacts, the decision matrix, the records and pre-genesis documents, and
# .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (CR-002 part 4 limit 8 does not apply),
# so its acceptance is one delegated approval of the decision agent (Master Plan section 6), for the decision agent's
# ruling.
task: TASK-028
contract_version: v1
task_type: implementation
objective: >-
  Add to the core's single writer, src/aieos_bootstrap/writer.py, the function release_lease_token(root, task_id,
  fencing_token), which removes the held lease on task_id only when its fencing token equals the given {epoch,
  counter}, compared and removed in one SQLite transaction, and otherwise changes nothing and returns a refused
  StoreResult; and switch the submission path, src/aieos_bootstrap/submit.py, to release through it with the
  commit's token, mapping its result, and never raising on a writer or release result of any shape (DEF-0053 F3 and
  F5). With unit tests in tests/unit/test_writer.py and tests/unit/test_submit.py and an integration test on a real
  store in tests/integration/test_writer_files.py, each added test naming its AC ids as "TASK-028 ACn".
