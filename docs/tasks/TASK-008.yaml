acceptance_criteria:
  - AC1: >-
      The entry (conformance-files.md section 9). The module defines check(inputs, code_sha256=None). inputs is
      one object with exactly the keys section 9 names (task_id, log_seq, task_state, contract, contract_hash,
      approved_contract_hash, head_commit, base_is_ancestor, commits, components, interfaces, symbols, schemas,
      derived_read_set, observed_read_set, intent_current, dependencies, articles, runtime, risk_rules,
      policy_version, budget_use), in the forms section 9 gives. check never raises for any JSON-like value of
      inputs. Every key of inputs that is missing or not in its section 9 form gives a record with decision null and
      error, the reason in error (reading: specification 3 §7's list of inputs whose absence or malformed form gives
      error is read as every key of section 9's object, since each stands for one of those inputs). Within
      well-formed values, the cases the other criteria name are uncovered, never error: a budget use with reported
      false, an article with violated null, observed_read_set null, and a budget form AC2 cannot parse; runtime's
      max_risk null is check 7's STOP: runtime insufficient. The given inputs are not changed.
  - AC2: >-
      Check 0 and the eight checks (specification 3 §2). Check 0: contract_hash differs from approved_contract_hash:
      error, no decision. Check 1: base_commit equal to head_commit: checks 2 and 3 skipped; base_is_ancestor false:
      ESCALATE, checks 2 and 3 not_run; otherwise Δ is the union of the paths of every commit of commits whose
      submitted is false (reading: commits is base_commit..HEAD in the caller's order, each with its paths against its
      first parent; no rename detection). Check 2: Δ ∩ write-set not empty: STOP: scope invalid (§6: no rebase
      branch). Check 3: Δ meets an entry of the effective read-set: CONTINUE_WITH when every met entry is
      non-breaking, REPLAN when any is breaking (AC4). Check 4: an intent_versions entry whose intent_current differs
      or is null: REPLAN. Check 5: a depends_on task whose state is not DONE, or that is STALE, or null: BLOCKED; a
      DONE task with stale_evidence true passes. Check 6: an applicable article (§2 check 6's rule, its scope met by
      write-set ∪ effective read-set as AC3 defines meeting, a scope.components entry standing for its component's
      paths, an article with no scope not applicable, an unevaluable scope applicable, applicability naming the
      task_type, and every article the contract lists) whose violated is true: ESCALATE; violated null on an
      applicable article: uncovered, not a stop. Check 7: the task's risk is the higher of contract.risk and the class
      of every risk rule whose pattern meets a write_set.paths pattern; max_risk null or lower: STOP: runtime
      insufficient; a write_set.paths pattern that no rule meets: ESCALATE. Check 8: retries' used over the
      contract's retries limit (a count equal to the limit passes), or a reported use over its budget: ESCALATE; an
      unreported use: uncovered (reading: tokens, wall_time and human_attention compared by a fixed parse of their
      forms, "10k", "400k", "10m", "2h", "0m"; a form it cannot parse is uncovered, never a stop). Every check that
      applies runs even after one has fired, and each ends passed, fired (with its outcome), skipped or not_run.
  - AC3: >-
      Path matching (specification 3 §3; the risk rules §2 point 6). A path matches a pattern, and two patterns meet,
      by the rules of §3: names compared from the root, "**" for any number of names, "*" within one name, a pattern
      without "/" read as "**/" followed by it, a component path with no wildcard that names a folder standing for
      "<it>/**"; when the rule cannot decide, the patterns meet (fail closed). Δ ∩ write-set is the paths of Δ that a
      write_set.paths pattern matches; an interface entry is met when a path of Δ lies under its component; a schema
      entry when a path of Δ matches the file it resolves to; a path entry when a path of Δ matches it.
  - AC4: >-
      The effective read-set and the signature verdicts (specification 3 §4, §5). The effective read-set is the
      union of read_set.paths, read_set.interfaces and read_set.schemas, derived_read_set and observed_read_set, each
      entry keeping its sources; observed_read_set null marks the read-set an estimate. A met interface entry is
      non-breaking when its symbols entry has base equal to head, both not null and not ambiguous; breaking when they
      differ, or either is null or ambiguous, or the interface or its component is unknown. A met schema entry is
      non-breaking when base and head are equal {path, sha256} objects; breaking otherwise (null, ambiguous or
      different). A met path entry is non-breaking. Every met entry's verdict and reason are in the record's
      signatures.
  - AC5: >-
      The decision (specification 3 §7, INV-005). The decision is exactly one A15 value (records.EXECUTION_DECISIONS):
      the first fired outcome in the order STOP: violation, STOP: scope invalid, STOP: runtime insufficient,
      ESCALATE, BLOCKED, REPLAN, CONTINUE_WITH; CONTINUE when none fires. outcomes_fired lists every fired outcome in
      that order. The module never emits STOP: violation (it is a decision during the run, §8; reading).
  - AC6: >-
      The record (specification 3 §9). The returned object has the record keys of spec 2 §6.2 (record_id, fact_kind
      interpretation, source_class deterministic_tool_local (reading: the bootstrap's Resume Check runs locally; S3 §9
      gives the class of where it ran), recorder "the Resume Check (aieos_bootstrap.resume_check)",
      subject the task id) and the keys of §9's table: decision, contract_hash, contract_version, base_commit,
      head_commit, log_seq, delta (each path with added, modified or deleted; reading: a path changed by several
      commits takes the last commit's change), checks (eight entries {check, status, outcome, detail}, check 1 to
      8), outcomes_fired, read_set ({entries, estimate, unresolved, unanalysed}), signatures, intent_versions (for
      each entry {contract, current}), dependencies, constitution ({applicable, violated, no_result}), runtime
      ({adapter, max_risk, task_risk}), budgets (for each budget {limit, used, reported}), policy_version,
      engine_identity, uncovered, state_effect, and error only when decision is null. records.check_decision
      ('decision.execution', record) gives no finding for every record the module returns, error records included.
  - AC7: >-
      The checker as TASK-011 leaves it (DEF-0029's limit). records.py is forbidden: the record of AC6 is checked by
      records.check_decision as TASK-011 changes it (the keys of specification 3 §9 allowed for decision.execution,
      with their forms); a record AC6 requires that check_decision still reports is a spec_conflict and the task
      escalates instead of dropping the key. Every existing test of records.py, eventlog.py, governor.py and
      conformance.py passes unchanged (forbidden).
  - AC8: >-
      Ids, engine identity and state effect (specification 3 §9, §10). engine_identity is an object with exactly the
      keys code_sha256 and python (decision D-334, E2; S3 §9: "the content hash of the code that decided ... with the
      interpreter's version"): code_sha256 is the caller's (reading: a pure module cannot hash its own file), 64
      lowercase hex digits when given and null when not, uncovered then naming it; python is the interpreter's version
      "X.Y.Z" from sys.version_info (no file or clock read). record_id is the SHA-256 hex of the task id, log_seq,
      head_commit, code_sha256 (the empty string when null) and "decision.execution", joined by LF (reading).
      state_effect lists the events §10 gives for the decision, each {event_id, type, payload, task_id} with its
      event_id formed the same way with the event's type, in the order the caller would append them, and payloads in
      spec 2 §6.3's form: CONTINUE and CONTINUE_WITH none (the lease is the caller's); REPLAN by check 3 a
      conflict.detected, then one task.stale with cause conflict referring to that conflict.detected's event_id;
      REPLAN by check 4 (the lowest-numbered REPLAN check being 4) no task.stale (reading, decision D-334 E1: the
      intent.changed event it must refer to is not an input, specification 3 §12 point 4), uncovered naming it;
      BLOCKED task.blocked reason dependency; ESCALATE task.blocked reason escalate, blocked_by the record_id; STOP:
      scope invalid conflict.detected then task.blocked reason scope_invalid; STOP: runtime insufficient none; a READY
      task given REPLAN gets no task.stale (§10). Every conflict.detected has tasks [] (reading, E1: commit trailers
      are not an input), uncovered naming it. Nothing is appended.
  - AC9: >-
      The runner, the fixtures and the runner's test (conformance-files.md section 9; DEF-0028; DEF-0029). The module
      imports only the Python 3 standard library and aieos_bootstrap.records, and nothing from
      aieos_bootstrap.conformance or any fixture folder; it names no fixture folder; a script check reads the module's
      syntax tree and lists every Import and ImportFrom node, and the list holds only standard-library names and
      aieos_bootstrap.records (DEF-0028: a module under src/ that imports the runner could reach the fixtures without
      naming the folder). The eleven frozen fixtures of
      tests/conformance/fixtures_rc/ each give PASS when the runner runs them with check (the integration test builds
      the set value with RC-01 to RC-11 pointing at the frozen files, as test_runner_rc_run.py's set_with_rc does, and
      takes every path from conformance.expected_path, naming no fixture folder literally). In
      tests/integration/test_runner_rc_run.py only the assertion that resume_check.py does not exist changes, to an
      assertion that it exists while the run over the repository's tree still does not import it; every other test of
      that module is unchanged and passes.
  - AC10: >-
      Purity and the CI checks (INV-001, INV-002, INV-003, INV-004). The module and its tests use no exec, eval,
      compile, __import__ or importlib, start no process, open no network connection, call no model, open, write or
      remove no file, read the clock nowhere (sys.version_info, read for engine_identity's python, is neither a file
      nor a clock), hold no assert in src (bandit B101), and name no project-state directory
      in src/; the tests build every input in memory, except the integration test, which reads the frozen fixtures
      and the set file through the runner's own readers. The CI steps at the task's commits report no finding:
      deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit, as TASK-006's AC9 lists them.
  - AC11: >-
      Limits, stated and tested as such: check reads nothing, so how its inputs are read from Git, the log, the files
      at HEAD and the runtime is not shown; the helpers of AC13 compute from given texts only; the events are returned,
      not appended, and no lease is granted or released; engine_identity's code_sha256 is the caller's; a check-4
      REPLAN returns no task.stale and every conflict.detected names no task (AC8), both named in uncovered and
      supplied by the later task that reads the log and Git (DEF-0030); the set file names no
      Resume Check fixture until TASK-005b, so no CI conformance run calls check before then; every existing module
      and test not in the write set is unchanged, and if one can pass only by a change the task escalates
      (needs_out_of_scope_change).
  - AC12: >-
      The added text. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0; the file names are scanned with the same patterns and the records executors'
      pre-push pattern (D-282).
  - AC13: >-
      The two helpers (specification 3 §4, §5). signature_form(source, name) parses a given Python source text with
      the standard library's parser and returns the fixed form of §5 of the top-level function or class named name
      (the dump of its syntax tree without positions: for a function its name, parameters, defaults' presence,
      annotations, return annotation and decorators; for a class its name, bases and the forms of its methods and
      class-level names not starting with "_"), or null when no top-level definition has that name, or "ambiguous"
      when more than one does; a text that cannot be parsed gives "unparsable" (reading). direct_imports(source,
      roots, paths) returns the repository paths of the modules the text imports directly that resolve under the given
      module roots to one of the given paths, and the names that do not resolve (unresolved), or "unanalysed" when the
      text cannot be parsed (one level, §4).
  - AC14: >-
      Tests, with this rule-to-test list, each rule with at least one passing and one failing case, all in memory but
      the integration test's fixture reads: R1 AC1 (each missing or malformed input of the error list; inputs not
      changed); R2 AC2 (each check's fire and pass, check 1's equal, not-ancestor and submitted-commit cases, check 5's
      not DONE, STALE, unknown and DONE with stale evidence, check 6's applicability and scope cases, check 7's lower,
      null and unmatched pattern, check 8's limit, over the limit, over a budget and unreported); R3 AC3 (the pattern
      rules, the folder reading, the fail-closed case); R4 AC4 (each verdict and its reason; the estimate); R5 AC5
      (every pair of fired outcomes gives the earlier one); R6 AC6 and AC7 (check_decision gives no finding on every
      returned record, for every decision value and for an error record); R7 AC8 (the ids' formula, distinct ids for distinct log_seq, the events per decision, a READY
      REPLAN, a check-4 REPLAN with no task.stale and uncovered naming it, engine_identity's form with and without
      code_sha256; and, for every decision value, each state_effect entry's payload gives no finding under
      records.check_payload(type, payload) as TASK-011 leaves it: if one cannot pass, that is a spec_conflict and the
      task escalates, decision D-334 E5); R8 AC9 (the eleven fixtures PASS; the import list); R9 AC13 (each helper's cases). Unit tests in
      tests/unit/test_resume_check.py; integration tests in
      tests/integration/test_resume_check_fixtures.py. Property tests (tests/property/test_resume_check_properties.py;
      standard library only, fixed seeds; INV-005's property_test): for random well-formed inputs, check returns a
      record with no check_decision finding and exactly one A15 value or an error; the same inputs give the same
      record; the decision is the first of outcomes_fired in §7's order, CONTINUE when it is empty; adding a fired
      condition never yields a milder decision; and the inputs are never changed. tests/run_tests.py, unchanged, runs
      all groups.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1200k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9, AC11, AC13, AC14]}
  - {gate: G3, check: constitution, args: [AC10, AC12, INV-001, INV-002, INV-003, INV-004, INV-005, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
