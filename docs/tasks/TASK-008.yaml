# Task contract TASK-008, the Resume Check (Master Plan revision 3, §4 M3; the M3 work order of decision D-254, as
# amended by decisions D-262 and D-263; specification 2 §5.1). Revision 0, drafted under decisions D-331 (C3), D-333 (C2) and D-334 (E1 to E5),
# brought for approval in its own request; whether it is approved is recorded in the decision files, not in this file.
# Fields and value forms follow specification 2 §5.1 and the contracts of TASK-006 and TASK-007.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: a pure module, src/aieos_bootstrap/resume_check.py, whose function check
# takes the inputs of specification 3 §1 as values, in the form of conformance-files.md section 9 (the object a
# Resume Check fixture's case gives), and returns one execution decision record of specification 3 §9: the check 0
# precondition, the eight checks of §2 with the path matching of §3, the effective read-set of §4 from the given
# sources, the signature verdicts of §5 from the given fixed forms, the deferral of §6, the decision table and its order
# of §7, the record and its ids of §9, and the events §10 would append, returned in the record and appended by no code.
# Two pure helpers compute what the inputs give as values (§4's direct imports and §5's fixed form) from given texts.
# Shape (P) of decision D-313: it opens, writes and removes no file, reads no clock, starts no process and calls no
# model; reading Git, the event log, the files at HEAD and the runtime's records, and writing the record, come with a
# later task (DEF-0030). It does not change records.py: TASK-011, a task of its own before this one (decision D-333,
# K1), lets a decision.execution payload carry specification 3 §9's keys (DEF-0029's limit: the runner checks the
# Resume Check's answer with records.check_decision). It changes one assertion of the runner's integration test
# (DEF-0029 R3-2, R5-2).
# DEF-0026 (reading): the module returns the conflict.detected events that specification 3 §10 lists, as event
# descriptions; it does not rely on specification 1 §5.3's stated effect of conflict.detected ("CONTINUE_WITH or
# REPLAN") and derives no task state from any event, so DEF-0026 stays open for specification 1's next revision.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its __all__ gains resume_check; it must not name the Resume Check
# fixture folder (TASK-010's assertion). src/aieos_bootstrap/resume_check.py is read by the runner's Resume Check entry (load_resume_check, from the base) and
# by the CI workflow's conformance step (revision 5: its SHA-256 in the notice, the pin AIEOS_PINNED_RESUME_CHECK still
# empty); the set file names no Resume Check fixture until TASK-005b, so no run over the repository's tree imports it
# (AC9). tests/integration/test_runner_rc_run.py is read by tests/run_tests.py only.
# Risk: high. R2 matches src/** and tests/** (medium); R3 read fail closed matches them too, the Resume Check being a
# part that limits authority (risk rules section 2 point 3); no path
# of the write set meets R10 (.aieos/) or R11 (tests/conformance/**); the highest wins. Profile (assurance-model.md §5,
# gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional [integration_test], security
# [static_security_analysis] and architecture [ai_review (cross-model)], plus the evidence_required of the applicable
# articles (INV-005: property_test). Dimensions are named as TASK-006's records name them (decision D-181, reading R-dim).
# Change class: normal_cr (D-254 P3; the M3 work plan's TASK-008 row): the Resume Check emits execution decisions only
# (A15) and is not an evaluator part named by DM A29 (no validator, fixture, scenario, runner or governor); it changes
# no evaluator part (records.py and the runner are forbidden, the runner's integration test apart, AC9), although
# src/aieos_bootstrap/** is on GOV-003's pinned list, so the CI step reports it as an evaluator change and it is
# judged by the base version. Its first version needs no owner acceptance (D-254 P5).
# Reviews (as TASK-006's and TASK-007's): five way-2 reviews by a Claude model other than the implementer's, each under
# a decision of the decision agent (architecture ai_review for INV-001, INV-002, INV-004; correctness ai_review for
# INV-005; security ai_review for SEC-002; governance ai_review for GOV-003; operational ai_review for OPS-003; the
# cross-model half), and three decision-agent reviews (architecture human_review for INV-003, which also checks that the
# property tests cover INV-005's rule; operational human_review for OPS-002; the cross-model half). Each way-2 review
# record's basis names every article whose entry it covers and addresses each of their rules, beyond what the tool
# parts decide. Each reviewer's prompt is self-sufficient, with the scratchpad's absolute path in its first line
# (D-277), and names for testing: that resume_check imports nothing from the runner (DEF-0028); that no assert stands
# in src (bandit B101, D-325); and the readings of AC2, AC6 and AC8.
# Evaluation path (A61; as TASK-006's and TASK-007's): the approved contract is committed on main as its own commit C,
# which changes only docs/tasks/TASK-008.yaml and has one parent equal to base_commit, and is pushed normally; the
# files are drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's
# commits, each carrying the trailer "AIEOS-Task: TASK-008" and no e-mail address in its message, go to the branch
# task/TASK-008 on GitHub, each push under its own decision of the decision agent after a secret scan and a dry run
# against a bare single-branch copy (D-229, D-274), never by force and never deleting; the CI channel runs on each push
# and its records are re-fetched into docs/records/TASK-008.jsonl; main receives the task only at its acceptance, by a
# fast-forward under its own decision. Before each task commit, the added text is scanned with the workflow's SEC-001,
# SEC-002 and OPS-003 patterns (AC12).
# Not applicable: OPS-001 (scope: the repository's refs; the task changes no ref); INV-006 to INV-008, INV-010 and
# INV-011 (their scopes, the governor, evidence records and the policy, meet no path of the write-set; the module
# judges no evidence and emits no acceptance decision); INV-009 (scope: the event log; the module appends nothing and
# returns no log bytes); GOV-001, GOV-004 to GOV-006 and SEC-003 (their scopes, the concept file, the bound artifacts,
# the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own (CR-002 part 4 limit 5 does not apply). Setting AIEOS_PINNED_RESUME_CHECK in
# the workflow is a later .github/ change under its own decision (DM A66), not this task's.
# Uncovered and stated limits (AC11): the module reads nothing, so how its inputs are read from Git, the event log, the
# files at HEAD and the runtime is not shown here (conformance-files.md section 9, "Not covered"); the set file names
# no Resume Check fixture until TASK-005b, so no CI conformance run calls it before then; the events of §10 are
# returned, not appended; the code hash inside engine_identity is the caller's (AC8); a check-4 REPLAN returns no
# task.stale, since the intent.changed event it must refer to is not an input (specification 3 §12 point 4), and every
# conflict.detected names no task, since commit trailers are not an input; both are named in uncovered and supplied by
# the later task that reads the log (DEF-0030) (decision D-334, E1); every review is by AI of one vendor.
task: TASK-008
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/resume_check.py, whose function check takes the inputs
  of specification 3 section 1 as values, in the form of conformance-files.md section 9, and returns one execution
  decision record of specification 3 section 9: the check 0 precondition, the eight checks, the decision table and its
  order, the effective read-set, the signature verdicts, the record and its ids, and the events of section 10 returned
  in the record; with two pure helpers for the fixed signature form of section 5 and the direct imports of section 4,
  computed from given texts; with unit, integration and property tests in new test modules. It changes no evaluator
  part but one assertion of the runner's integration test; it opens, writes and removes no file, reads no clock,
  appends no event and imports nothing from the conformance runner.
