acceptance_criteria:
  - AC1: >-
      The state. A test that needs ADV-02's state reads the set file of the tree (conformance.SET_FILE, unwrapped as the
      runner reads it) and takes the entries whose capability is Capability Boundaries; it asserts that their ids are
      exactly [ADV-02] and that its fixture is either null (the null state) or has the path conformance.expected_path
      gives for it and the sha256 f6fed8e0db041705f870631ca46b32ba50cb43ed29f6f143f97d19c152938385, which is that file's
      SHA-256 in the tree and the hash DM row F49's freeze binds (the present state); any other value fails the test.
      In the present state the set file's own SHA-256 is d237d5dcded3fd9fa5bdacd68b098d5818a5d12d0acfa918fd29141e699d7506
      and its fixture_set_version 5; another value fails the test. No test reads the state from anywhere else.
  - AC2: >-
      Class (a), the fixed set value and the in-memory runs. In tests/unit/test_runner.py, tests/unit/test_runner_rc.py
      and tests/property/test_runner_properties.py, the helper that returns TASK-013's fixed set value (as TASK-019's AC2
      extended it for Risk Engine) also sets the fixture of every Capability Boundaries entry to null, so its bytes keep
      the pinned SHA-256 158323324f2803bceee870403bc6c0e297c407fbe50902d60bec90624cc95208 in both states, and the pin test
      stays byte-equal. The class (a) tests of the scratch run pass through it or through an in-memory mirror that holds
      the fixtures_cb files as the tree holds them (the fourteen ids listed in the approval request, from classify58.py).
      In tests/unit/test_runner_cb.py, R9Record.test_the_key_only_with_the_entry_run and
      test_the_counting_reading_and_the_lazy_load branch on AC1's state only for their run over the tree: in the null
      state they keep every assertion; in the present state they assert that the plain run has the capability_boundaries
      key with the three module paths and ADV-02 (PASS, ''), and that load_cb is called. A script shows every line of the
      changed modules outside the changed lines byte-equal and in order before and after, and every assertion line
      byte-equal or re-indented only.
  - AC3: >-
      Class (b), the null state keeps every assertion. The tree-run tests test_governor_conformance.py
      GovernorConformanceTest.test_the_verification_scenarios_pass_and_the_others_are_not_run, test_runner_cb_run.py
      RepositoryTree.test_the_run_over_the_repository_tree, test_runner_rc_run.py
      R7RepositoryTree.test_ac8_the_results_over_the_repositorys_tree_are_unchanged, test_runner_risk_run.py
      RunnerRiskEndToEndTest.test_the_tree_as_it_is, test_runner_run.py RunnerEndToEndTest.test_no_governor,
      test_a_stand_in_that_answers_from_the_expected_values and test_a_stand_in_with_one_decision_outside_a_list, and
      test_runner_cb_properties.py Properties.test_the_invariants read ADV-02's state by AC1 and branch on it. In the null
      state each asserts exactly what it asserts at the base: a script shows that every line of the changed modules at
      the base is present, byte-equal after stripping its leading spaces and in order, and lists every re-indented line;
      no added line in the null-state path is a return, a raise, a skip or a condition that can be true in the null
      state and leave a kept assertion unexecuted; the added lines hold no assertion that a value may be either of two
      results.
  - AC4: >-
      Class (b), the present state is exact. In the present state each test of AC3 asserts exact values, never one of
      several: every scenario's result and, for each NOT_RUN, its reason; the record's outcome and the run record's
      counts and capability_boundaries key. ADV-02 is never dropped from a compared map. In the present state ADV-02 is
      (PASS, '') in every test of AC3: in test_governor_conformance.py's test, test_runner_rc_run.py's R7 test,
      test_runner_risk_run.py's test and test_runner_cb_run.py's RepositoryTree test (the root's governor), and also in
      test_runner_run.py's test_no_governor and test_a_stand_in_that_answers_from_the_expected_values (a stand-in or no
      governor), with the value 'PASS' in test_a_stand_in_with_one_decision_outside_a_list's map of results; every other
      scenario's result and reason is as in the null state. Each run's record in the present state holds the key
      capability_boundaries, exactly the three entries {path, sha256} for conformance.cb_path of replay, adapter and
      evaluation, in that order, each sha256 that module's SHA-256 in the tree; the record's counts and outcome are as
      in the null state. Source: the run of SP/tools/full_diffs58.py over AC8's simulation at 6acf11a7 (unittest's diff
      limit removed; output SP/t58/full-diffs.txt of session 060d2763, given unedited in decision D-1111's request).
      Reading of why, from the runner's text: the Capability Boundaries entry is loaded from the root whenever a set
      entry of that capability has a fixture (src/aieos_bootstrap/conformance.py:1588-1598, cb_used then load_cb), and
      that load does not depend on the evaluate, check or derive seams (:1492-1500, the docstring: only cb is the
      entry's seam), so a stand-in governor or no governor leaves ADV-02 to the root's core, which passes the frozen
      fixture (AC5); the key is written when the entry read its modules (:1629-1633, cb_reads), with the hashes null only
      for a stand-in entry (STAND_IN), which no test of AC3 gives.
  - AC5: >-
      M13's control (decisions D-1079, D-1086, D-1109 C5), a new test in tests/integration/test_runner_cb_run.py: the
      frozen fixture's one case, read from tests/conformance/fixtures_cb/adv_02.py with pathlib's read_bytes and
      unwrapped as the runner does, run through the runner's own case path with the root's core and in-memory stand-ins
      only: with the case as frozen, the step-1 decision is STOP: violation and the evaluation gives REJECT and REJECTED
      (ADV-02 PASS); with only the replay document's violation key removed, the second session's log_seq set to 3 (the
      value the core's log then needs), and step 1's comparison bypassed for this run only (without the violation the
      runner fails the case at step 1, "a done replay without the stop", before the continuation; the test patches
      conformance._violation_step to return the STOP decision, as the scratch runs did, and changes nothing of the
      core), the evaluation gives NEEDS_REVIEW and IN_REVIEW, table row 5, with missing_gates [] and every
      profile entry's missing_types [] (the scratch run AR/t57/out/build.txt (b) of session d0060457). So the fixture's
      REJECT comes from the violation alone.
  - AC6: >-
      The PASS run (decision D-1086): a test runs conformance.run over in-memory files equal to the tree's with the set
      file replaced by the present state's bytes of AC1 (built in the test from the tree's set value by setting ADV-02's
      fixture and fixture_set_version 5, its SHA-256 asserted equal to d237d5dc…) and one in-memory freeze record of that
      hash, with the root's core: ADV-02 is (PASS, ''), the run counts, and its record's outcome is pass.
  - AC7: >-
      R2's case (decision D-1096 C3). Reading: the retries cannot give another decision: the evaluation's retries used
      are "the decision.acceptance events that sent the task to REWORK" (src/aieos_bootstrap/evaluation.py:12-13) and
      its request's retry_count is {used, limit: declared retries} (:379); the governor reads it only to choose the next
      state ESCALATED or REWORK (src/aieos_bootstrap/governor.py:409-410), never the decision, and a case with no
      earlier evaluation has used 0; the scratch run with declared retries 0 and no violation gives NEEDS_REVIEW,
      IN_REVIEW, table row 5, as the control. So the false PASS that D-1096 C3 names does not exist through the
      retries, and AC5's control covers it. The named variant, a test: AC5's case without the violation, the same
      log_seq and the same bypass, with the extra record of gate G1 given outcome fail, gives NEEDS_REWORK and REWORK,
      table row 2, missing_gates [G1], failed_gates [G1], and the runner's result FAIL (not met: step 3), asserted
      exactly; so another reason changes the decision away from both NEEDS_REVIEW and REJECT, and the frozen fixture's
      own values carry none (AC5). Source: SP/tools/sim_variant58.py over AC8's simulation (output SP/t58/variants.txt of
      session 060d2763, given unedited in decision D-1111's request). Nothing else changes: every other test that
      tests/run_tests.py runs passes unchanged at the task's
      commit; the changed modules other than test_runner_cb*.py name the fixtures_cb folder only through conformance's
      constants, so the name guards of the three test_conformance_*_set.py modules are unchanged in outcome.
  - AC8: >-
      Both states, by the whole suite. At the task's commit, tests/run_tests.py passes in full over the tree (the null
      state) on a compiled tree. In a scratch clone at the task's commit with the present state simulated by
      sim_adv02b.py (the set file of AC1's present state, one scratch freeze record of its hash), on a compiled tree, the
      failing tests are exactly the seven class (c) tests of the test_conformance_* modules (TASK-059's) and nothing
      else. Both runs and the id comparison are in the request that brings the first push.
  - AC9: >-
      Purity, the CI checks and no loosening (INV-001, INV-002, INV-004, GOV-003). The modules import only what they
      import at the base and the standard library; they use no exec, eval, compile, __import__ or importlib, start no
      process, open no network connection, call no model and write no file. The CI steps at the task's commits report no
      finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit. A script over the base and the task's commit
      shows: no assertion line of the ten modules removed or changed other than by re-indentation under AC3; no test
      removed or skipped; every added assertion compares with one exact value; the count of assertion calls in each
      module does not fall. Before each commit, the added text and the file names are scanned with the workflow's
      SEC-001, SEC-002 and OPS-003 patterns and each count is 0.
  - AC10: >-
      Tests, with this rule-to-test list: R1 AC1 (a wrong state fails: the state check over an in-memory set value with
      ADV-02's fixture naming another path, or another hash, gives a failure); R2 AC2 (the pin of the fixed value's
      SHA-256, unchanged; the line check by script); R3 AC3 (the line check by script; the null branch passes over the
      tree); R4 AC4 (the present branch passes under AC8's simulation); R5 AC5; R6 AC6; R7 AC7; R8 AC8 (both suite runs).
      tests/run_tests.py, unchanged, runs them.
