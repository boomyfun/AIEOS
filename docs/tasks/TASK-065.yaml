# Task contract TASK-065, the read-path extraction of the Claude Code adapter (Master Plan revision 4, §4 M5; concept
# line 945, "record the observed read-set"; specification 5 revision 3, section 6's table row "Observed read-set",
# sections 7 and 11 point 8; specification 2 revision 6, section 6.2 :180-185 and section 10 point 13).
# Revision 1, drafted under decisions D-1303 (candidate (5), C1 to C5) and D-1304 (readings r1 to r6 ruled; fixes F1 to
# F5) and D-1306; brought for approval in its own request; whether it is approved is recorded in the decision files, not
# in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-062 and TASK-064. Readings
# marked "(reading)" are the worker's, ruled by decision D-1304; values marked "(filled by script)" are written by
# script from the base just before commit C.
# Task type: implementation. What it adds: a new module src/aieos_bootstrap/claude_code_reads.py, one pure function
# called only by its tests, read_paths(stdin_bytes): from the bytes Claude Code would write to a PostToolUse hook's
# standard input after a file-reading tool call to the list of paths that call read, as the list that
# read_set_record.observe takes (TASK-064 AC5), or "uncovered" with a reason. It is the step between a hook's input and
# the core side of TASK-064 (spec 5 :62, "after a file-reading tool call | the path read"). claude_code.py,
# claude_code_hook.py, claude_code_channel.py, read_set_record.py, records.py and every other existing module are not
# changed, so DEF-0080 and DEF-0081 stay deferred (D-1303 C3).
# The input and its parse (D-1303 C1 (b)): the bytes are parsed as strictly as TASK-062's entry parses them
# (claude_code_hook.py:136-152: bytes only, no byte-order mark, UTF-8 strict, one JSON value, no duplicate key, no
# NaN or Infinity constant, a JSON object); the parse is restated in the new module, not imported from
# claude_code_hook's private helpers (reading), and a test checks that both modules give "uncovered" for the same
# malformed inputs. Of the hook input only tool_name and tool_input are read, as in TASK-062 (D-1236 Q2):
# hook_event_name, session_id, cwd, transcript_path, tool_response and every other key are not read (reading: placed on
# another hook event the function would give the same result; whether a read succeeded is not seen, below).
# The tools covered, part of specification 5 §11 point 8 settled here (D-1303 C2):
# - Read: covered. tool_input.file_path, a non-empty string, is the one path read; the result is [file_path]. The name
#   is the model-side tool_use name seen in this project's transcripts (as TASK-061's names, claude_code.py:31-32);
#   that a PostToolUse input carries tool_name "Read" and tool_input.file_path is cited from Claude Code's hooks
#   documentation (https://code.claude.com/docs/en/hooks, summarised by a web-reading tool on 2026-10-18: a summary,
#   not the page; read on 2026-10-18 in two parts (characters 0 to 200000 of the page)): the PostToolUse input
#   "includes both `tool_input`, the arguments sent to the tool, and `tool_response`, the result it returned", with
#   tool_name in its example; Read's tool_input fields file_path (an absolute path), offset and limit are given in the
#   PreToolUse section, and file-tool paths in PostToolUse "arrive in the same format as for PreToolUse"; that Read's
#   PostToolUse input holds file_path is so an inference from the documentation, not stated there for Read (a limit),
#   and never measured (C6). The tool names are supported live only for Bash (claude_code.py:31-32), and in session
#   1947b313 a hook with matcher "*" did not refuse Read calls it was written to refuse (D-1202, D-1203): whether a
#   hook fires for Read is unknown, and the live evidence is negative.
# - Uncovered, each with reason "tool" and listed as uncovered, never as an empty read: Grep and Glob (their input
#   names a pattern and a folder, not the files read; Grep does read file contents, so its reads are real but not
#   attributable from its input), Bash and PowerShell (reads by a shell command are not seen, spec 5 :73), every name
#   beginning "mcp__", subagent tools (Task, Agent), NotebookEdit, MultiEdit, Write and Edit (an Edit reads the file it
#   changes; not taken here, a limit), and every other name.
# - A partial read (tool_input.offset or limit present) counts as a read of the whole path: the over-inclusive side,
#   which is the fail-safe side for a read-set (D-1303 C2). A read that failed (the file missing, a refused read) is not
#   seen: tool_response is not read, so the path is still returned (reading: over-inclusive again). The documentation
#   (the same summary) says PostToolUse "Runs immediately after a tool completes successfully" and that failed calls go
#   to a separate event, PostToolUseFailure, which this function is not meant for; placed there, it would return the
#   path of a failed read (over-inclusive); unmeasured (C6).
# - Left open of point 8: path semantics on Windows (case, separators, relative and absolute paths, drive letters,
#   links and junctions, normalisation): the path stays the raw string of tool_input.file_path, not normalised,
#   resolved, case-folded or checked against the root, the write-set or the disk, as TASK-064 records it (D-1281 C1;
#   D-1303 C1 (c)); spec 2 §10 point 13 stays open. Named alternative, not chosen: claude_code.normalise_path(root,
#   None, path), which would in effect settle point 13 and make a relative path uncovered.
# What a result shows (stated in the docstring): a lower bound at best (spec 5 :73); the hook may not fire, may not
# cover a tool, and cannot show its own completeness (A25); the record built from these paths is kept and not used
# (spec 5 :72; spec 2 :184). Gathering the paths across hook calls, the hook process and its context, placing the hook
# and choosing its matcher stay out (CC-3, the owner's under A51 item (4); spec 5 §11 points 7 and 10; DEF-0076).
# Limits (carried at acceptance): C6 and P-LOC unmeasured; the PostToolUse input form cited, not measured, and Read's
# file_path in it inferred from the documentation, not stated there for Read; the tool names supported live only for
# Bash, and the live evidence about a hook on Read negative (D-1202, D-1203); every limit
# TASK-061 to TASK-064 carried; reads by Grep, Glob, shell, PowerShell, MCP tools, subagents and Edit not seen; a failed
# read not told from a successful one; DEF-0076, DEF-0077, DEF-0078, DEF-0080 and DEF-0081 stay open. Follow-up named,
# not taken: the specification 3 alignment of its lines 24 and 29 (D-1281 C4; D-1303 C5).
# Risk: high (risk rules revision 6, §2 point 3: R3 matches every path under src/** and tests/**), computed over the
# base by script before commit C. GOV-003: every path of the write-set is an evaluator path by the workflow's pinned
# list, by script; change class critical_cr, as for TASK-060 to TASK-064, ruled at acceptance. No existing module
# imports the new one, so no other result changes. Profile (assurance-model.md §5, gov-AIEOS, high): functional
# [unit_test], architecture [deterministic_rule], functional [integration_test], security [static_security_analysis]
# and architecture [ai_review (cross-model)], plus the evidence_required of the applicable articles. Reviews: five way-2
# reviews on Sonnet 5.5, a Claude model other than the implementer's (Opus 5.5), never Fable (the owner's words of
# 2026-10-17); and the decision agent's own reviews: INV-003's human_review, OPS-002's human_review and the cross-model
# half, each its own record (D-1148 Q2).
# Records: in the readable form, as TASK-064's; per-entry coverage checked by script before the acceptance request
# (L-0022), and the governor's evaluation over the records reported (D-1098).
# Naming (D-544 Q3): every test of the new test modules names the AC ids it stands for as "TASK-065 ACn" in its own
# docstring.
# Evaluation path (A61; as TASK-019 to TASK-064): commit C changes only docs/tasks/TASK-065.yaml and has one parent equal
# to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-065" and no e-mail address in its message, go to
# task/TASK-065 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011; GOV-001, GOV-004 to
# GOV-006 and SEC-003 (no path of the write-set meets them). INV-004 applies, as for TASK-062: the module writes nothing.
# Owner-kept acts: none. No hook placed, no matcher chosen, no Claude Code setting, nothing measured, nothing under
# .github/ or .claude/, no push of its own; it weakens no evidence requirement; so its acceptance is one delegated
# approval of the decision agent (Master Plan section 6).
task: TASK-065
contract_version: v1
task_type: implementation
objective: >-
  Add the Claude Code adapter's read-path extraction (concept line 945; specification 5 §6 and §11 point 8) in
  standard-library Python 3. A new module src/aieos_bootstrap/claude_code_reads.py gives read_paths(stdin_bytes): it
  parses the bytes Claude Code would write to a PostToolUse hook's standard input as strictly as TASK-062's entry does,
  reads only tool_name and tool_input, and returns for tool_name "Read" the list [tool_input.file_path], the raw string,
  and for every other tool or a malformed input "uncovered" with a reason. With unit, integration and property tests in
  tests/unit/test_claude_code_reads.py, tests/integration/test_claude_code_reads_inputs.py and
  tests/property/test_claude_code_reads_properties.py, each test naming its AC ids in its own docstring; the tests write
  no file.
