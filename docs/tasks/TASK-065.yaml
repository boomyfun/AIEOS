acceptance_criteria:
  - AC1: >-
      The parse. read_paths(stdin_bytes) returns a mapping with exactly result, reason, findings and read_paths. In
      order, the first that applies gives the result: stdin_bytes not a bytes object gives "uncovered", reason
      "argument"; a leading UTF-8 byte-order mark or bytes that are not strict UTF-8 give reason "input_bytes"; text
      that is not one JSON value, or holds a duplicate key or a NaN or Infinity constant, or whose parse raises
      RecursionError (deep nesting), as at claude_code_hook.py:149, gives "input_json"; a value
      that is not a JSON object gives "input_shape"; tool_name not a string or tool_input not an object gives "input".
      In each case read_paths is the empty list. For every input of these kinds, claude_code_hook.entry (with a
      well-formed allowlist) also gives a non-allow verdict (a test over the same inputs).
  - AC2: >-
      The covered tool. For tool_name exactly "Read" (case-sensitive) with tool_input.file_path a non-empty string, the
      result is "read", reason "read", findings empty, and read_paths the one-element list holding file_path's value
      unchanged: not normalised, resolved, case-folded, stripped or checked against any root, write-set or the disk.
      tool_input.offset and limit, of any value, do not change the result (a partial read counts as a read of the path,
      the over-inclusive side). file_path missing, not a string or empty gives "uncovered", reason "input", with
      read_paths empty.
  - AC3: >-
      The uncovered tools. Every other tool_name gives "uncovered", reason "tool", read_paths empty, and one finding of
      fixed words naming the class: "a search tool whose reads are not attributable" for Grep and Glob, "a shell tool"
      for Bash and PowerShell, "an MCP tool" for a name beginning "mcp__", "a subagent tool" for Task and Agent, and "a
      tool not covered" for every other name (Write, Edit, MultiEdit and NotebookEdit among them). No text of the input
      is copied into findings.
  - AC4: >-
      What is read and kept. Of the decoded object only tool_name and tool_input are read; hook_event_name,
      session_id, cwd, transcript_path, tool_response and every other key change no result (tests vary each). The
      given bytes are never changed (bytes are immutable; the test checks the value), and the function keeps no state:
      equal inputs give equal results. No exception escapes: any exception inside gives "uncovered", reason "entry",
      the exception's type name in findings, read_paths empty.
  - AC5: >-
      Fit with the core side. For a "read" result, read_set_record.build(task_id, session_id, result['read_paths'],
      recorder) with well-formed other arguments gives a record that records.check_record finds no fault with, and
      read_set_record.observe given that list with a stand-in append (in memory, as TASK-064's tests) calls append
      once; the integration test joins several results' lists in call order and shows observe's record holds each
      distinct path once in first-occurrence order. No file is written.
  - AC6: >-
      What is stated. The module's docstring states: the parse and its source (TASK-062's entry); the tools covered and
      uncovered, with the reason for Grep and Glob; partial and failed reads (over-inclusive; tool_response not read);
      the raw path and that spec 2 §10 point 13 stays open, naming claude_code.normalise_path as the alternative not
      chosen; that the PostToolUse input form is cited from documentation and unmeasured (C6), and that Read's
      file_path in that input is inferred from the documentation, not stated there for Read; that tool names are those
      seen in this project's transcripts, supported live only for Bash, and that in session 1947b313 a hook with matcher
