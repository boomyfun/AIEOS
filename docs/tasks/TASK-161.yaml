  - AC4: >-
      The guard. With expected_log_sha256 given: (a) if the store is not present (AC3's test), the call is refused with result "refused", reason "nostore", before anything is created (no project-state directory is made) and nothing is written; (b) otherwise, under the lock, the SHA-256 of the log bytes just read (b"" when the log is absent) is compared; a difference gives result "refused", reason "changed", and nothing is written; eventlog.append is not called, so the guard comes before every check eventlog makes (the log's form, idempotency, the event, the fence). Both refusals are a WriteResult with seq None, line None, refusal None and findings holding exactly one str; the writer builds them itself and eventlog.py, its REASONS included, is unchanged. A duplicate event over a changed log is refused "changed"; a call with the fresh hash answers "duplicate".
  - AC5: >-
      Unchanged behaviour. With expected_log_sha256 None: where the store is not present the call behaves exactly as before; where it is present and no one else holds it, the results, the log bytes and the exceptions of every current case are the same as before, except the cases of AC6. The tests pin literal expected log bytes and results computed from the base commit (not computed from the code under test). New, and stated in the docstring: a call that names no task now opens a present store and takes its write lock; SQLite may then roll back a hot journal left by a stopped process, which changes the store's bytes (SQLite's behaviour); no store row is changed by the append.
  - AC6: >-
      The new waits and raises of an unguarded call, each stated in the docstring and tested, each writing nothing: (1) another connection holds a RESERVED, PENDING or EXCLUSIVE lock: the call waits and raises sqlite3.OperationalError (a task event waited the default 5 s and raised before this task too, in held_lease; it now waits APPEND_LOCK_TIMEOUT; an event that names no task did not wait before); (2) a present store that cannot be opened for writing or locked, each with the class the test asserts (the classes observed by the probes on the owner's host): a folder at the store path, sqlite3.OperationalError "unable to open database file" (the test points writer.store_path at a temporary folder with mock.patch.object); a file that is not a database, sqlite3.DatabaseError "file is not a database" (the test runs init_layout and writes bytes into the store path with the allowed "ab" open); a store that cannot be written, sqlite3.OperationalError "attempt to write a readonly database" from the no-row UPDATE (the test patches writer.sqlite3.connect to open the same store with "?mode=ro", on which BEGIN IMMEDIATE passes); an empty store file (init_layout, then the "ab" open writing nothing): for an event that names no task sqlite3.OperationalError from the no-row UPDATE, since it has no table store (not observed by a probe; the build establishes it and the test asserts it), and for a task event ValueError from the table check, as before (the test asserts both); a path _store_uri refuses, ValueError (the test patches writer._store_uri to raise it); a broken link at the store path, which now counts as present and whose open raises (before, it counted as no store): stated, not testable, since the CI rules give the test modules no way to make a link. A test whose asserted class differs where the CI runs (Linux) fails the build and comes back to the decision agent; no assertion is widened to Exception or to a set of classes after the fact; (3) a call made inside a held write transaction of the same process on the same store waits and raises (no caller in src does that: trace of D-7217). While another connection holds BEGIN IMMEDIATE, session_lease answers as before (a test). Tests set APPEND_LOCK_TIMEOUT to a short value; no test waits 30 s.
  - AC7: >-
      Tests, in the three writer test modules, using only what the CI rules allow them (sqlite3, tempfile, mock, open "rb" and "ab"; no os call that creates, changes or removes): AC2's argument cases (int, bytes, short, upper case); AC4's refusals (a log changed between a caller's read and the append gives "changed" and writes nothing, D-7118 C5; the duplicate case; "nostore" with no folder created; no fence record under "changed"); two guarded appends in sequence where the second expected hash is the SHA-256 of the first log bytes plus the first line; a guarded task append with a live lease succeeds and a fenced one with a wrong token is refused as today; the lock cases of AC3 and AC6 with real files and two connections; AC5's pinned bytes, among them an event that names no task on a present store; the store file's bytes and the listing of its folder unchanged after an unguarded and after a guarded append on a store with no hot journal (no -journal or -wal file left; probe 2, part C); and a relative root with a present store (a temporary folder made under the current folder with tempfile and removed afterwards, passed by its relative path).
  - AC8: >-
      CI evidence, pre-registered before the task commit exists: on the task branch and on main (for main in the reading of D-7153 and D-7154), "GOV-003 evaluator lists: 2 found, equal, 40 entries"; "GOV-003 evaluator change: yes (N of N changed paths)" where N is the number of write-set paths the task's commits change, with the path lines; both conformance steps run the base's conformance.py (workflow :885-:901, :1126 runner_blob = blob(base, RUNNER), extract(base) before the run), and no candidate run happens for this task because it changes no governor file (:1142-:1145), so neither conformance step runs the changed runner (GOV-003); the changed runner is imported in CI only as the subject of the task's own unit, integration and property tests and of the report-only base-tests step; deterministic_rule 0 findings; bandit "No issues identified"; pyflakes silent; unit, integration and property steps OK. The base-tests line is predicted by script on scratch clones with a stub before approval (D-6865 C3), checked against the head tree before the commit, and compared in CI; the shape of the main run is written before the push.
  - AC9: >-
      Limits and open items, stated at acceptance. (1) Writers outside append_event are not excluded: Git operations on the working log, an editor, another clone or machine, any other program, and an older build of writer.py; the guard sees their change only if it comes before the comparison, and a change that lands after it is found only by the read-back, after the line is written. (2) A root without a store takes no lock (unguarded calls); a guarded call is refused there; a call that started before a store existed writes without the lock even if a store is created meanwhile. (3) No realpath or link check is made on the store path; a link under the project-state directory could separate the lock from the log (the writer's log writes check no link either). (4) SQLite's release of a lock when a holding process dies is relied on and not tested; Windows and Linux lock differently, and the tests establish the behaviour on each where they run (the owner's host and the CI). (5) No src caller passes expected_log_sha256 yet; the races the guard is for remain until a caller uses it (launcher.py :276-:281 states one). (6) A hook process (the pretool hook through session_violation) can now wait up to APPEND_LOCK_TIMEOUT; Claude Code's own hook time limit is not measured (writer.py :1500-:1501). (7) A multi-append caller whose later call raises leaves the earlier lines; the lock raises only for a holder stuck longer than the timeout or the cases of AC6, and the same states can already follow any append failure (disk error, read-back mismatch). The caller table. One append, nothing half: evaluation, done, read_set_record (observe, observe_gone). Recovered by running the same call again: mcp claim (while the session lease is live); launcher approval_act (approve again appends task.approved); submit and adapter.submit (a held lease of the commit is released); startup recovery; reconcile; scope_reconcile (at most one event, with a derived id); t0 claim; verification_records; violation.record and adapter.violation with the same event_id; replay only with a new empty root (it refuses a non-empty log). NOT recovered by a rerun: X1 execution.execute (also reached by adapter.start): the decision record may stand without its full state effect and the lease may already be released; a rerun is refused (D-687 M2). X2 the hook paths (claude_code_pretool_hook through session_violation, and claude_code_channel.deliver): violation.detected may stand without its STOP decision and the lease stays held until it expires; the observation still blocks the task (fail closed); that a rerun needs the same tool call is an assumption, not checked. launcher run_task and import_task: the contract file stays, a rerun is refused at write, and the file must be removed by hand. (8) A deferred item DEF-0157 is written in the records commit after the task: "recovery of a half-written multi-append (X1, X2, run_task and import_task): a follow-up candidate, not part of TASK-161; one lock across both appends would remove only the lock as a trigger". (9) writer.py is the INV-004 core module; its review pair is its own and the task is judged by the decision agent's explicit acceptance. (10) The shell line uses POSIX timeout and /dev/null (Git Bash on the owner's host; the CI uses its runner's bash). (11) The evidence is same-lineage: Haiku 5.5 reviewers and the decision agent are Claude models and are recorded as not independent.
  - AC10: >-
      The stand-in. conformance._CbLog.append_event gains expected_log_sha256=None as its last parameter, as writer.append_event's (test_runner_cb.py :303-:305 requires equal parameter lists). With None its behaviour is unchanged. With a value that differs from the SHA-256 of self.log it returns a WriteResult with result "refused", reason "changed", seq None, line None, refusal None and one finding, and adds nothing to self.log; eventlog's append is not called. It makes no argument check, lock or store call of its own (it is an in-memory stand-in; writer's "nostore" has no counterpart). It adds no new top-level name to conformance.py and changes no other line of it (the class docstring's sentence that every append is decided by eventlog.append is left as it is, a stated limit). A new test in test_runner_cb.py shows, with well-formed 64-character values only (the stand-in checks no argument form), the refusal with the log unchanged and, with the fresh hash, the append, and says so in its docstring; R4StandIns is not edited.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [src/aieos_bootstrap/writer.py, tests/unit/test_writer.py, tests/integration/test_writer_files.py, tests/property/test_writer_properties.py, src/aieos_bootstrap/conformance.py, tests/unit/test_runner_cb.py]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
# Risk: every path is src/** or tests/**: risk-rules-gov-aieos.md R2 raised by R3 (high), R3's component tags not being evaluable yet (:18, :34, :37), among them the tag verification, which section 4 (:74) says covers the conformance runner; no R4 to R13 path in the write set.
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 600k, wall_time: 4h, retries: 3, human_attention: 0m}
