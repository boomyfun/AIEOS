acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only paths of the write set. writer.py changes only: one new module constant (AC3), the new parameter of append_event and what AC2 to AC6 need inside append_event and in private helpers it uses, the refusal results of AC4, and docstring sentences, among them the module docstring's limit "No lock beyond SQLite's own transaction (v0.1 runs one task at a time, concept line 951)" (:23) and append_event's docstring (:272-:282), which must say what is true after the change. Every other function keeps its behaviour. The writer's imports gain nothing. writer.py adds exactly two top-level names, APPEND_LOCK_TIMEOUT and _guard_refusal (a function that returns the refusal result object of AC4, whose class is defined inside it), both above the TASK-066 marker of writer.py; in tests/unit/test_writer.py R23TheNamesAtTheBase exactly those two names join the explicit set of its added-name check (:2130-2131) and its docstring, and its BASE of 94 names and its other checks stay as they are (the precedent for widening that set is TASK-117 AC4). conformance.py changes only what AC10 states; test_runner_cb.py changes only by the new test of AC10. No check of an existing test is removed or loosened; an existing assertion changes only where it asserts a behaviour that this contract changes, and the build report lists every changed existing test by name with one line of why.
  - AC2: >-
      The argument. append_event(root, event_type, payload, event_id, appended_at, recorder, task_id=None, fencing_token=None, corrects=None, expected_log_sha256=None). A value other than None that is not a str, or a str that re.fullmatch of [0-9a-f]{64} refuses, raises ValueError (the type is checked first, so no TypeError comes from the match), after the root and recorder checks and before anything is created or read. The value is not passed to eventlog.append.
  - AC3: >-
      The lock. The store is present when os.path.lexists(store_path(root)) is true, so a folder or a broken link at that path counts as present and its open raises. For a present store the call opens one connection to it with sqlite3.connect on the URI of writer._store_uri(os.path.abspath(store_path(root)), os.sep, os.altsep) (an absolute path, with no link resolution, so a relative root works as an absolute one) with its final "?mode=ro" replaced by "?mode=rw" (checked to end in "?mode=ro" first, as _write_store does), uri=True, timeout=APPEND_LOCK_TIMEOUT, isolation_level=None, so a missing store is never created; then BEGIN IMMEDIATE, then, only for an event whose task_id passes the writer's present test (isinstance str and the _TASK form, writer.py :289), the table check _check_schema on that connection (a read; a store of another form raises ValueError, as held_lease does today), and then the statement "UPDATE store SET counter = counter WHERE 0", all before the log is read. SQLite lets BEGIN IMMEDIATE pass on a read-only open and takes no write lock there (probe 2, part A); on a write-protected file opened "?mode=rw" BEGIN IMMEDIATE passes (probe 2, part D); on both the no-row UPDATE raises sqlite3.OperationalError "attempt to write a readonly database" (probe 2, parts A and D), and where the lock is held it passes, changing no byte and leaving no journal (probe 2, part C). The UPDATE changes no row. It needs the table store, so a present store without that table (an empty file among them) now raises for every call: a task event raises ValueError at the table check, as before; an event that names no task raises at the UPDATE, which is new; no other table or column form is checked for an event that names no task. No realpath or link check is made (the writer's log writes make none either; AC9). APPEND_LOCK_TIMEOUT is a new module constant equal to 30.0, read as a module global at call time (not a default argument), whose comment gives the reason: a hold is one