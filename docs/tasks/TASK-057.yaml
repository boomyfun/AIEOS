# Task contract TASK-057, the fixture of ADV-02, the one scenario of the Capability Boundaries capability that names a
# runtime observation (Master Plan revision 4, §4 M5; DEF-0072 step 3, split by decision D-1085 into TASK-057 (this
# fixture), TASK-058 (the runner tests made to hold in both states of ADV-02's set entry, with M13's control and the
# fixture's PASS run through the root's core) and TASK-059 (the set file's entry, its freeze first); specification 2
# §5.1). Revision 0, drafted under decisions D-1086 and its amendment 1; whether it is approved is recorded in the
# decision files, not in this file. Fields and value forms follow specification 2 §5.1 and TASK-018's contract, the
# earlier fixture task. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: fixture (docs/specs/conformance-files.md section 8, line 80). Every changed path is the Capability
# Boundaries fixture file of section 11 or a new test module test_conformance_cb_*.py directly under tests/unit/,
# tests/integration/ or tests/property/ that checks only that file against conformance-files.md and the bound scenario
# file. GOV-002 does not apply, as the constitution writes its applicability (implementation, refactoring); every other
# article whose applicability names implementation is applied as to an implementation task, so no evidence requirement
# narrows (section 8, line 81; CR-002 part 4 limit 8).
# The cut (D-1085, D-1086): this task adds only the fixture file and its own test modules, which import nothing of
# aieos_bootstrap and never run the core (decision D-1086, reading (iii) ruled the narrower way: a test that runs the
# core tests the core's behaviour, not only the file). M13's control (the same case without the violation gives
# NEEDS_REVIEW / IN_REVIEW with every gate and every profile type met) and the fixture's ADV-02 PASS through the root's
# core and the runner's entry are TASK-058's tests (D-1086, amending D-1079 M13's placement); this task's acceptance
# request carries the unedited output of a scratch run of both over the built file. The set file does not change:
# ADV-02's entry stays null (frozen set file e37f1639…, TASK-040-freeze-set), so no conformance run reads the new file
# and every run record over the repository's tree is unchanged. TASK-059 gives the set file ADV-02's entry naming this
# file's frozen hash, with fixture_set_version one more and its freeze approval first (section 7, revision 5).
# Readers: the runner reads a Capability Boundaries fixture only through its set entry's path (conformance.py's
# expected_path and run_scenario), so with ADV-02's entry null the file is never read; the TASK-056 test modules name
# the path only to put in-memory bytes there. After this task only its own test modules read the file from disk (AC8).
# The placeholders (reading (p2), approved by decision D-1086): ADV-02's Given cell fixes no risk, no profile and no
# plan, so section 5 (conformance-files.md line 58) takes them from the set's section 1 acceptance defaults
# (conformance-scenarios-initial.md line 11): risk low, the default profile functional [build, lint], the plan G0 scope,
# G1 build and G2 lint, all passed on the evaluated commit, one external-CI record per profile type bound to the
# evaluated commit and the intent versions the task names, which are current; L1. The high and critical profiles of
# assurance-model.md §5 apply in the set only "where the task's risk is high or critical (ACC-16, ACC-17)" (line 58).
# These values meet section 11's placeholder bullet (line 145) as values; whether the core then gives NEEDS_REVIEW
# without the violation is TASK-058's control. The values are built by a deterministic script kept in the scratchpad
# (build_adv02.py), never by hand; the second session's log_seq and tokens come from the root's core at base_commit.
# Freeze approvals (section 7; as TASK-018's): one fixture-freeze approval on the fixture file's SHA-256, given in the
# decision that accepts this task as a separate element before the acceptance itself, an authority record with
# approval_binding {kind: change_request, hash} in docs/records/TASK-057.jsonl, and one DM section F row that lists that
# hash; no set-file freeze, since the set file does not change.
# Risk: critical, computed over the base by script (risk_class57.py; output pasted unedited in the approval request):
# R11 matches tests/conformance/** (critical); R2 and R3 read fail closed match tests/** (medium, high); the highest
# wins. Profile (assurance-model.md §5, gov-AIEOS, critical): medium's, high's and critical's entries: unit_test,
# deterministic_rule, integration_test, static_security_analysis, ai_review (cross-model), human_review and
# property_test; plus the evidence_required of the applicable articles.
# Change class: normal_cr with a fixture-freeze approval on the fixture file's hash (DM B1, B10, with the A51 note;
# conformance-files.md sections 7 and 11); it changes the evaluator (A29 counts fixtures and scenarios; GOV-003:
# gov003_class57.py "yes (4 of 4 paths)"), so it is judged by the base version and never auto-accepted (constitution
# GOV-003; governor-spec.md §8).
# Reviews (as TASK-018's): five way-2 reviews by a Claude model other than the implementer's (claude-sonnet-5-5), each
# brief to the decision agent first (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for
# SEC-002; governance ai_review for GOV-003; operational ai_review for OPS-003; the cross-model half, which also checks
# the fixture's faithfulness to ADV-02's row and section 11), and the decision agent's reviews (architecture
# human_review, which also checks faithfulness and that the property tests cover the related invariants; the
# cross-model half; operational human_review for OPS-002).
# Evaluation path (A61; as TASK-018 to TASK-056): the approved contract is committed on main as its own commit C, which
# changes only docs/tasks/TASK-057.yaml and has one parent equal to base_commit, and is pushed normally; the files are
# drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's commits, each
# carrying the trailer "AIEOS-Task: TASK-057" and no e-mail address in its message, go to the branch task/TASK-057 on
# GitHub, each push under its own decision of the decision agent after a secret scan and a dry run, never by force and
# never deleting; the CI channel runs on each push and its records are re-fetched into docs/records/TASK-057.jsonl; main
# receives the task only at its acceptance, by a fast-forward or a rebuild under its own decision.
# Not applicable: GOV-002 (above); OPS-001 (the task changes no ref); INV-009, INV-011, GOV-001, GOV-004, GOV-005,
# GOV-006 and SEC-003 (their scopes meet no path of the write-set).
# Owner-kept acts: none (nothing under .github/, no Claude Code setting or hook, no measurement, no push of its own;
# CR-002 part 4 limit 5 does not apply).
# Uncovered and stated limits (AC8): the set file names no Capability Boundaries fixture until TASK-059, so ADV-02
# stays NOT_RUN in every run over the repository's tree and nothing here shows that the core meets ADV-02; this task's
# tests check the file's values and never the core's behaviour (M13's control and the PASS run are TASK-058's); the
# fixture's log_seq values depend on the exact number of lines the core appends, so a core change shows as NOT_RUN at
# step 2 (TASK-056's limit) and needs the fixture's next version under section 7; a passing ADV-02 will show only the
# core's handling of a recorded observation, never that any hook observes anything (C6 and the T3 tier unmeasured); the
# metrics part of the Expected cell is never observed (Master Plan §7); every review is by AI of one vendor.
task: TASK-057
contract_version: v1
task_type: fixture
objective: >-
  Add the executable fixture of ADV-02, the scenario of the Capability Boundaries capability of the bound initial
  scenario set, set version 2, that names a runtime observation, in the format of docs/specs/conformance-files.md
  revision 10, sections 2 and 11 (a Python module tests/conformance/fixtures_cb/adv_02.py that wraps canonical JSON text
  byte-exact), faithful to ADV-02's Given and Expected cells, the set's section 1 defaults and section 11's
  placeholders, with unit, integration and property tests that check only that file against that document and the bound
  scenario file, without importing or running the core. It changes no existing file, adds no set-file entry and no
  runner entry, and freezes nothing: the freeze approval is given at its acceptance.
