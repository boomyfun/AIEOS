acceptance_criteria:
  - AC1: >-
      The file kind (conformance-files.md section 2), as TASK-018's AC1: the file is, byte for byte, the first part
      DATA = r''' then a JSON text then the last part ''' and one LF, the JSON text in section 2's canonical form;
      re-serialising the parsed text in that form gives the same bytes. The path is
      tests/conformance/fixtures_cb/adv_02.py (sections 2 and 11). The tests read the file's bytes with pathlib's
      read_bytes and never import or execute it.
  - AC2: >-
      The fixture's form (section 11's table): the object is exactly scenario, row_hash and cases; scenario is ADV-02
      and row_hash the SHA-256 of ADV-02's row line in the bound scenario file without its line end (recomputed by the
      tests); cases is a list of exactly one case, exactly document, continuation, evaluation, given and expected;
      document is replay.replay's form (replay.py's DOCUMENT_KEYS and the key violation, with exactly observation,
      event_id and at), submission null; continuation is exactly session (in the form of the document's session), a
      submission that is not null (in the form of the document's submission) and end_at; evaluation is exactly
      task_id, contract_text, declared, values, extra_records, recorder, now and commits, with commits a non-empty list
      of exactly {id, text, paths}; given is exactly outside_path and write_set; expected is exactly stop, decision,
      next_state and not_fixed. The key lists are held in the tests as values, compared with the runner's at
      base_commit by the contract's checker (not by the tests), and checked by the tests without importing the runner.
  - AC3: >-
      Faithfulness (sections 5 and 11). expected comes only from ADV-02's Expected cell, "STOP: violation; the change is
      rejected; the violation is recorded in the runtime's and the agent's metrics", read with its Source cell: stop is
      exactly ["STOP: violation"], decision exactly ["REJECT"], next_state exactly ["REJECTED"], not_fixed exactly
      ["metrics"], and metrics is absent as a key. The unit tests hold the Expected cell's text and check that it equals
      the cell in the bound file; a fixture with any other list is a failing case of the tests. No expected element
      depends on a placeholder.
  - AC4: >-
      The Given (section 11, line 144), each condition a test, from the fixture's values alone: the violation's
      observation is an object with fact_kind observation, outcome blocking, blocking_kind violation, source_class
      deterministic_tool_local and recorder equal to the document's recorder; given.outside_path is matched by no pattern
      of given.write_set, by a matcher of the tests' own for the risk rules' section 2 point 6 forms (never the runner's
      or the governor's); outside_path is among the paths of the commit whose id is continuation.submission.commit_id,
      which occurs exactly once in evaluation.commits; given.write_set equals the write_set.paths of
      evaluation.contract_text (a check TASK-056 left out, moved here by decision D-1085); the SHA-256 of contract_text
      encoded as UTF-8 equals the contract_hash of the document's last setup event of type task.approved; and
      values.changed_paths equals that commit's paths, sorted.
  - AC5: >-
      The placeholders (section 11, line 145, and the set's section 1 defaults, decision D-1086 (p2)), each a test,
      from the values alone: values.contract.risk is low, contract.owner_kept_act false and contract.verification_plan
      exactly [G1, G2]; values.risk_rules gives low to every path of values.changed_paths and to given.outside_path, by
      the tests' matcher, and no rule gives another class to any of them; values.default_profiles gives low exactly
      {functional, [build, lint]}; requirement_profiles, owner_kept_rules and articles are []; auto_accept is false for
      every class; delegation is true; evidence_comparison is {weakens: false}; extra_records holds passing records of
      source class deterministic_tool_external_ci for the gates G0, G1 and G2 and for the types build and lint, each
      with commit equal to the submitted commit's id, subject the task and intent_versions equal to declared's; record
      ids are distinct and every record is in spec 2 §6.2's form (the keys the tests check listed in the tests); the
      Resume Check inputs of both sessions are section 9's placeholders for a READY task (every check passes).
  - AC6: >-
      Consistency (decision D-1079, M14): continuation.submission.commit_text equals the text of the commit of
      evaluation.commits with that id; the observation's refers_to equals given.outside_path; the submitted commit's
      text carries the trailer AIEOS-Task with the task id and the trailer AIEOS-Fence of the second session's expected
      token; the commit below it, when present, carries no AIEOS-Task trailer.
  - AC7: >-
      The freeze and what stays unchanged (section 7): the file is frozen only by the fixture-freeze approval at this
      task's acceptance (its SHA-256, an authority record of docs/records/TASK-057.jsonl and a DM section F row); the
      set file does not change and gets no new freeze; the integration test checks, in a form that holds in both states
      of ADV-02's set entry, that tests/conformance/set.py has the SHA-256 that a freeze approval of the set file in
      docs/records/ binds (at this task, TASK-040-freeze-set) and that ADV-02's entry is either null or names this
      file's path with its SHA-256.
  - AC8: >-
      Limits, stated and tested as such: no file outside the write set changes; the only modules that name the folder
      fixtures_cb are this task's three test modules, conformance.py and the modules named test_runner_cb*.py (a test
      lists every .py file under src/ and tests/ and finds the name only there; the form holds when TASK-058 changes
      those modules or adds one named test_runner_cb*.py); ADV-02 stays NOT_RUN over the tree until TASK-059; the tests
      check form, the binding to the bound file, the Given, the placeholders and the expected values against the
      Expected cell's text, never the core's behaviour; M13's control and the PASS run are TASK-058's (decision D-1086).
  - AC9: >-
      Purity and the CI checks (INV-001, INV-002, INV-004; section 2), as TASK-018's AC8: the test modules import only
      the Python 3 standard library, use no exec, eval, compile, __import__ or importlib, start no process, open no
      network connection, call no model, write no file, read files only with pathlib's read_bytes and list them only
      with pathlib's glob; the fixture module holds one assignment of one string. The CI steps at the task's commits
      report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit; the existing tests still pass,
      unchanged. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0.
  - AC10: >-
      Tests. Unit tests (tests/unit/test_conformance_cb_files.py) cover each rule of AC1 to AC6 with at least one
      passing case and one failing case, the failing cases built in memory from altered copies of the file; one
      integration test (tests/integration/test_conformance_cb_set.py) checks, end to end, the file against the bound
      scenario file and the set file (AC7), that the folder holds exactly that file, and AC8's name guard; property
      tests (tests/property/test_conformance_cb_properties.py; standard library only, fixed seeds) check that
      re-serialising the fixture is idempotent, that any one-byte change changes its hash, that any reordering of keys
      is not canonical, that the tests' matcher follows point 6 for random paths and patterns, and these properties of
      the invariants the task relates to: for INV-005, expected fixes only REJECT and REJECTED and no other decision or
      state; for INV-006, no expected element is an acceptance value other than the scenario's; for INV-007, the
      submitted commit is the commit of every extra record; for INV-008, every extra record is of a source class other
      than an agent's own declaration. tests/run_tests.py, unchanged, runs all three groups.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC10]}
  - {gate: G3, check: constitution, args: [AC9, INV-001, INV-002, INV-004, INV-010, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts AND the fixture file has its freeze approval
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act, scenario_not_realisable]
owner_kept_act: false
