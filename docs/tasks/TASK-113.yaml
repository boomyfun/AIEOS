contract_version: v1
task_type: implementation
objective: >-
  Create the repository's root file .gitignore holding one comment line and the line .aieos/local/ (spec-02 section 3, :40 and :44), so that the local store (SQLite: leases, sessions, reads) that the writer creates under .aieos/local/ is not swept into a commit. Nothing else is ignored. The task decides nothing about whether, when or by whom the other files under .aieos/ are committed. It adds no capability and changes no code.
