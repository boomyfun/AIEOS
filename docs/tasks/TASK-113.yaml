acceptance_criteria:
  - AC1: >-
      The file. The new root file .gitignore holds exactly two lines, in this order, each ended by one LF, with no other byte: line 1 is "# The local store of leases, sessions and reads is never committed (specification 2, section 3)." and line 2 is ".aieos/local/". The executor compares the bytes before the task commit. The task commit's changed paths are exactly the root path .gitignore; the executor refuses any other path (a G0 pattern without a slash also matches a nested .gitignore). After the commit, `git check-ignore -v .aieos/local/state.sqlite` names the file, line 2 and the pattern; `git check-ignore -v .aieos/events.jsonl` prints nothing and exits 1 (the log is not ignored). The raw outputs are kept as evidence; each command is read-only and its own decision.
  - AC2: >-
      What the file does not decide. Not ignored by this file: everything else under .aieos/ (spec-02 :28-39; that events.jsonl is committed is spec-02's proposed reading). Whether, when and by whose decision state files are committed is not settled by this task (spec-07 :49, "the state-file rule's question"; DEF-0105 stays open). No state file is committed except by a decision of its own. The state-file rule (spec 7 section 10 or spec 2 section 3, with its DM row) comes as a specification revision before the first commit of any file under .aieos/, not before this task (D-4430 C3). The Log line for DEF-0105 is written in the end records, under its own decision, not in this task.
  - AC3: >-
      Carries and non-changes. (a) `aieos init` still writes no ignore rule (TASK-095's limit stands); that `init` should write the line for product projects is named as a carry, not done. (b) DEF-0041 (c), never give an earlier store's epoch to a recreated store, is not touched by this file; it stays a requirement on the first task that calls the store. (c) First `aieos init` on E:\AIEOS: nothing moves; the interim documents under docs/plan/ and docs/specs/ stay where they are (spec-07 :28, section 10 stays open). (d) The stale texts of cli.py (:67, :90-91, :102-103) and spec-07 :35 and :50 on whose act a launch, an import or a run is, which predate DM A73, are named here for a later docs fix and not changed. (e) The step "root" of the launcher leaves .aieos out of its status read (spec-07 :49), so this file does not make a launch refuse.
  - AC4: >-
      Evidence and CI. The risk class is high, so the evidence profile is medium's entries (unit_test, deterministic_rule) plus integration_test, static_security_analysis and the cross-model pair of reviews (assurance-model section 5, :82, and section 3, :50). The tool entries are expected to be met by the CI's own steps on the accepted commit; if the governor shadow's raw output at the approval request shows any profile entry unmet, the task stops and comes back to the decision agent, no test is added except by a contract revision, and no workaround is used. The cross-model pair is a way-2 review on Haiku 5.5 (no other model without the owner) and a separate decision_agent_review that stands for that entry, both bound to the evaluated commit and the intent versions. The way-2 record names the implementer's model, the model of the session that makes the task commit (expected claude-sonnet-5-5), and the reviewer's model (Haiku 5.5); if the two are the same, the pair counts nothing and the task stops and comes back to the decision agent. The aieos-checks and aieos-native runs succeed on the accepted commit and on main after the records commit, read by run id; G0 scope sees only .gitignore; the risk class is high (R4). Per-article records through records.check_record and the governor shadow over a dry list at the approval request, with raw output; GOV-003 is expected to read as for TASK-102 to TASK-112 (stated departure) or, for a one-file non-code change, as the governor gives it: the decision agent rules it on the raw output.
