# Task contract TASK-066, the store lookup of the Claude Code adapter's hook process (Master Plan revision 4, §4 M5;
# concept line 945; specification 5 revision 4, section 11 point 7, bullets 3 to 6; specification 2 revision 7,
# section 3).
# Revision 1, drafted under decisions D-1360 (K2 first; C1 (a) to (e)), D-1361 (the scoping note approved) and D-1362
# (round k2a's dispositions; D-1361 C1 amended by D-1362 C1), with round k2b's non-blocking points applied (D-1362
# C7); brought for approval in its own request; whether it is
# approved is recorded in the decision files, not in this file. Fields and value forms follow specification 2 §5.1
# and the contracts of TASK-062 to TASK-065. Readings marked "(reading)" are the worker's, for the decision agent to
# rule; values marked "(filled by script)" are written by script from the base just before commit C.
# Task type: implementation. What it adds: the read-only judgement every hook call of the Claude Code adapter needs
# before any concern, in two parts (D-1360 C1 (a); spec 5 :109-110):
# - in the writer module (src/aieos_bootstrap/writer.py, changed): one new public function session_lease(root,
#   session_id, now, timeout=5.0), the only part that opens the store, read-only, giving the store's answer for a
#   session or for no session; and private helpers and private module-level constants that only session_lease uses
#   (reading). No existing function, class or module-level assignment changes; no import is added; the module
#   docstring gains lines (AC7);
# - in a new hook-side module src/aieos_bootstrap/claude_code_store.py, judge(session_id, root, working_folder, now):
#   the session id and root rules and the upward search for the store (bullet 4), calling only writer.store_path and
#   writer.session_lease of the core; it never opens the store or the event log itself (the workflow's
#   deterministic_rule refuses sqlite3 and open outside writer.py and the three writer test files,
#   aieos-checks.yml:1449-1470, and strings naming the
#   project-state directory in every src/ file but writer.py, docstrings included, aieos-checks.yml:1589-1591).
# Both take the session id, the root, the working folder and the time now as arguments; where the hook entry takes
# them from (environment variable names, the process's working folder, the process clock) is a later contract's
# (reading). A now earlier than the real time would make an expired lease read as unexpired (the fail-open
# direction), so that contract must take now from the process clock. Nothing calls either function yet but the
# tests.
# The three outcomes (spec 5 :109-112), judge's result "outcome":
# - "enforce_nothing" (bullet 5): neither a session id nor a root, and no store found upward ("no_store_found"), or the
#   store found holds no lease row at all, expired or not (session id absent; "no_lease_row");
# - "refuse" (bullet 6, no record): every other case with no live tied lease, with one fixed reason;
# - "tied" (bullet 3): the one unexpired lease the store holds for the session, in eventlog.LEASE_KEYS' form, and the
#   root it was found at.
# Read-only, and the lock (D-1361, D-1362 C1; DEF-0084 h4c Y2-8): session_lease connects with
# sqlite3.connect(uri, uri=True, timeout=timeout, isolation_level=None), where uri is made by the private helper
# _store_uri(path, sep, altsep) from the link check's verified left-hand string, os.path.realpath(store_path(root))
# (absolute, so the store opened is the store checked; no lexical ".." collapse), with sep and altsep given by
# session_lease as os.sep and os.altsep, by one rule (D-1362 C1): only sep and altsep become "/" (a "\" on POSIX is an
# ordinary byte and is encoded as %5C); a "/" goes before a drive, an ASCII letter A-Z or a-z followed by ":" at the
# start; every UTF-8 byte outside A-Z, a-z, 0-9, "-", ".", "_", "~", "/" and the drive's ":" becomes %XX (uppercase
# hex), by a character loop or two-argument str.replace only (a one-argument .replace is refused,
# aieos-checks.yml:1578-1581); the result is "file:" + "//" + that path + "?mode=ro". A path that starts with two
# separators (a UNC path) is not encoded and is refused ("unreadable"; a limit). A path not encodable as UTF-8 (a
# surrogate-escaped byte) is refused ("unreadable"; on a non-UTF-8 POSIX file-system encoding, a limit). No import is
# added for this (tests/unit/test_writer.py:408-412
# allows writer.py only datetime, hashlib, json, os, re, secrets, sqlite3 and aieos_bootstrap), and no PRAGMA is used.
# It runs a deferred BEGIN; _check_schema and every query run inside that one transaction; it ends the transaction and
# closes the connection in a finally block. SQLite's read-only mode then refuses any write and never creates the
# file; no row is inserted, changed or removed, no table created, no expiry run (the launcher's, spec 5 :108), and the
# store file and its folders are never created. Unlike held_lease (writer.py:465-473, through _transaction's BEGIN
# IMMEDIATE, writer.py:256, a write lock), the lookup's deferred BEGIN takes only a shared lock, at its first read; a
# writer's commit waits for it while it reads; a writer that holds, or waits at, an exclusive or pending lock longer
# than the timeout, or a journal or WAL state a read-only connection cannot use, makes the lookup refuse
# ("unreadable"). Cost stated: a hook call during a long commit is refused without a record. A hot rollback journal
# left by a crash cannot be rolled back by a read-only connection; AC9's hot-journal test shows that the lookup then
# refuses (D-1362 C6). Claude Code's own hook timeouts are unmeasured (C6).
# The table form before and after K1 (D-1360 C1 (c)): specification 2 revision 7 §3 already lists four tables, reads
# among them; the lookup checks the store with the existing _check_schema against the pre-K1 writer's TABLES (three
# tables, writer.py:44-48, :241-248), so a store in specification 2's four-table form is refused ("tables") until K1;
# when K1 adds reads, TABLES gains it, the lookup follows without a change of its own, and a store of the old form is
# refused until K1's migration, as bullet 6 says (spec 5 :112). K1's contract changes the tests that pin three
# tables. No hook is placed before the owner places it.
# The store's presence and the link check (D-1362 C2, C3; DEF-0084 h4d Y2-4): session_lease first takes
# os.lstat(store_path(root)): FileNotFoundError or NotADirectoryError gives "no_store"; any other OSError, or
# ValueError, gives "unreadable"; an entry that is not a regular file ((st_mode & 0o170000) == 0o100000 is false: a
# directory, a link, any other kind) gives "link". Then, just before the store is opened, the two folders between the
# store and the root (the project-state directory and its local folder) and the file are checked together:
# os.path.normcase of os.path.realpath(store_path(root)) must equal os.path.normcase of os.path.join(
# os.path.realpath(root), the three names); else "link". normcase on both sides keeps case and separator
# differences from giving a false refusal; short (8.3) names are resolved by realpath on both sides on Windows, and
# where it does not resolve them the result is a false refusal (fail closed). Tests use stand-ins for os.lstat,
# os.path.realpath and os.path.normcase (unittest.mock), since the workflow refuses creating links and folders in
# tests (aieos-checks.yml:1455-1460, :1469); in tests/unit/test_writer.py they are patched on writer's os functions
# for one call and pass every path other than the one under test to the real function (posixpath.realpath itself
# calls os.lstat). Limits: real
# links and junctions are never exercised in CI, which runs on Linux (aieos-checks.yml:84); a junction or link that
# realpath does not resolve on the running Python leaves the path unchanged and is not seen; hard links and bind
# mounts are not seen; the check and the open are two steps (a change between them is not seen).
# Values (DEF-0084 h4d Y2-4; spec 5 :110): in judge, a session id or root is absent when it is None or the empty str;
# any other str is present, whitespace-only included (reading; a whitespace root is not absolute and refuses: fail
# closed); any other type is "argument". session_lease takes session_id None or a non-empty str only; the
# empty-as-absent rule is judge's. A present root must be absolute (os.path.isabs); the working folder is used only
# when the search is made (neither a session id nor a root), and must then be an absolute path of an existing folder
# (os.path.isabs and os.path.isdir), else "argument" (reading; fail closed); so no result depends on the process's
# current folder. The upward search starts at os.path.abspath(working_folder) and goes to
# each parent in turn (os.path.dirname until it no longer changes: the drive or share root), taking
# os.lstat(writer.store_path(folder)) in each: FileNotFoundError or NotADirectoryError passes the folder over (a
# folder whose project-state directory has no store file); a regular file stops the search there; any other OSError,
# ValueError, or an entry that is not a regular file (a dangling link among them) refuses ("search") (reading; fail
# closed, under spec 5 :112's "every other case": spec 5 :111 names only a store not found).
# DEF-0084 points taken: Y2-4 (values, links, where the search ends), Y2-8 (the lock), h4b Y2-6 in part (the
# lookup's refusal of "not exactly one unexpired lease"), Y1-6 and Y5-8 (AC6's check of calls), and the base
# commit's source (filled by script, D-198 C5).
# Limits (carried at acceptance; D-1361 C5, the scoping note's §5 and §6 unchanged in meaning): C6 and P-LOC
# unmeasured; no hook placed, no matcher, no setting, nothing measured (CC-3, the owner's, A51 item (4)); every limit
# TASK-061 to TASK-065 carried; the lock, link and UNC limits above; a store found first inside an inner project is
# judged alone, and a hook outside every project's folder tree is not judged (spec 5 :111); a store created, removed
# or swapped between judge's search and session_lease's open is a race (refused if gone, judged if it appears). Stay
# deferred in DEF-0084: the reads table's size (Y2-11, K1); the cost of fail closed when a lease expires during a run;
# the hook input's own session_id; the token-less observe, reading and removing stored reads and finding a task's
# leftover sessions (K1 and point 10's contract); the record's place among spec 1 §7's start steps (Y1-7); the lease
# length (Y2-10); an unreadable contract (Y3-2, the write-set concern's contract); a global placement under a parent
# folder (Y5-7, Y5-9: the upward search states its behaviour, the placement is the owner's); whether the core should
# refuse a second grant to one session (h4b Y2-6; the lookup refuses "not exactly one unexpired lease"); the h4d
# points Y1-1, Y1-3, Y2-6, Y4-6, Y5-7, and Y5-8 beyond AC6's check (that no hook program's function reaches the
# core-only path is tested in K1's contract, which adds that path). DEF-0080, DEF-0081 and DEF-0082 stay deferred:
# this task changes none of their modules, and none waits for the next change of writer.py; DEF-0076, DEF-0077,
# DEF-0078 and DEF-0083 are not touched.
# Risk: high (risk rules revision 6, §2 point 3: R3 matches every path under src/** and tests/**), computed over the
# base by script before commit C. GOV-003: every path of the write-set is an evaluator path by the workflow's pinned
# list, by script; change class critical_cr, as for TASK-060 to TASK-065, ruled at acceptance. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles. Reviews: five way-2 reviews on Sonnet 5.5, a Claude model other than
# the implementer's (Opus 5.5), never Fable (the owner's words of 2026-10-17); and the decision agent's own reviews:
# INV-003's human_review, OPS-002's human_review and the cross-model half, each its own record (D-1148 Q2).
# Records: in the readable form, as TASK-065's; per-entry coverage checked by script before the acceptance request
# (L-0022), and the governor's evaluation over the records reported (D-1098). Two checks against the base run as
# acceptance-time scripts over the task's commits, not as tests in tests/ (they would fail at the next legitimate
# change of these files): AC6's unchanged definitions of writer.py and AC8's unchanged test functions.
# Naming (D-544 Q3): every new test function names the AC ids it stands for as "TASK-066 ACn" in its own docstring.
# Evaluation path (A61; as TASK-019 to TASK-065): commit C changes only docs/tasks/TASK-066.yaml and has one parent equal
# to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-066" and no e-mail address in its message, go to
# task/TASK-066 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011; INV-009 (the task touches
# no event log); GOV-001, GOV-004 to GOV-006 and SEC-003 (no path of the write-set meets them). INV-004 applies: the
# writer stays the only module that opens the store, and the new function writes nothing.
# Owner-kept acts: none. No hook placed, no matcher chosen, no Claude Code setting, nothing measured, nothing under
# .github/ or .claude/, no push of its own; it weakens no evidence requirement; so its acceptance is one delegated
# approval of the decision agent (Master Plan section 6).
task: TASK-066
contract_version: v1
task_type: implementation
objective: >-
  Add the Claude Code adapter's store lookup (concept line 945; specification 5 §11 point 7, bullets 3 to 6) in
  standard-library Python 3: in src/aieos_bootstrap/writer.py one new read-only function session_lease(root,
  session_id, now, timeout=5.0), which opens the store read-only and gives the store's answer for a session or for no
  session; and a new module src/aieos_bootstrap/claude_code_store.py with judge(session_id, root, working_folder, now),
  which applies the session id and root rules and the upward search for the store and returns enforce_nothing, refuse
  or tied, calling only writer.store_path and writer.session_lease. With new test functions added to
  tests/unit/test_writer.py, tests/integration/test_writer_files.py and tests/property/test_writer_properties.py (no
  existing test function or class changed), and new test modules tests/unit/test_claude_code_store.py and
  tests/property/test_claude_code_store_properties.py, each new test naming its AC ids in its own docstring.
