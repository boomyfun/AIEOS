constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      session_lease's arguments and result. It returns a writer.StoreResult: result "done" with reason "tied" (value
      the lease in eventlog.LEASE_KEYS' form, as held_lease gives it) or reason "no_lease_row" (only when session_id is
      None and the store holds no lease row; value None), so StoreResult's documented values ("done" or "refused",
      writer.py:92-94) stay true; or result "refused" with exactly one finding and a reason from this fixed list:
      "argument" (session_id neither None nor a non-empty str, or not encodable as UTF-8; now not a timezone-aware UTC
      datetime in whole seconds; timeout not an int or float, or a bool, or not in 0 < timeout <= 60, a range test
      that also refuses inf and NaN, so no math import is needed), "root" (the root not a non-empty str, not absolute,
      or not an existing folder: _check_root raising included), "no_store", "link", "unreadable", "tables",
      "lease_row_without_session", "no_lease_row", "session", "ended", "leases". No exception escapes: the argument
      checks run inside a try whose any exception (a raising tzinfo among them) gives "argument", and the root check
      inside one that gives "root"; everything after the "root" check (the presence step, the link check,
      the URI, the connect and the reads) runs inside one try/except Exception; a failure inside the link-check step
      gives "link", any other "unreadable"; _check_schema's ValueError gives "tables" in its own try. Every handler
      returns a value (no pass or continue: bandit B110, B112); a failure while ending the transaction or closing the
      connection also gives "unreadable" (the connection name is set to None before the try). A finding names the
      exception's type, never its message.
  - AC2: >-
      session_lease's order and cases (spec 5 :110-112). In this order the first that applies gives the result:
      "argument"; "root"; the presence step of the header ("no_store", "unreadable" or "link"); the link check
      ("link"); a failure to make the URI (a UNC path), to open, or to read (a lock held past the timeout, a damaged
      file) gives "unreadable"; tables other than TABLES or not exactly one store row (_check_schema) gives "tables".
      Then, with session_id None: no lease row at all gives "done"/"no_lease_row", and any lease row, expired or not,
      gives "lease_row_without_session". With session_id given: no lease row at all gives the refusal "no_lease_row";
      no sessions row with that id gives "session"; a row whose ended_at IS NOT NULL (any non-NULL value, "" included)
      gives "ended"; then the stored times of that session's lease rows only are parsed (a malformed one gives
      "unreadable"), and not exactly one lease row of that session whose expires_at is after now (expires_at > now, the
      same comparison as expire_leases, writer.py:457) gives "leases"; else "tied" with that lease. One unexpired and
      one expired lease of the session give "tied". All reads, _check_schema included, run inside the one deferred
      BEGIN.
  - AC3: >-
      Read-only and the lock. session_lease connects only as the header says (the URI from the private helper,
      "?mode=ro", uri=True, the timeout passed, isolation_level None), runs a deferred BEGIN, and closes the connection
      in a finally block on every path. Over every case of AC2 the store file's bytes, and the list of files under the
      root's project-state directory (taken after any other test connection is closed), are the same before and after
      the call; no store, folder or journal is left created. A root whose path holds a space, "#" and "%" (and, where
      os.sep is "/", a "?": Windows file names cannot hold it, so that part is skipped there by unittest.skipIf) is
      looked up correctly. _store_uri gives fixed expected strings on every platform, its sep and altsep given by the
      test: a POSIX path (sep "/", altsep None), a Windows-form path (sep "\", altsep "/"), a "\" in a POSIX name (%5C), a
      space, "#", "%", "?" and a non-ASCII name; and refuses a path starting with two separators. While another
      connection holds a write transaction that has not reached its commit (BEGIN IMMEDIATE), the lookup still reads;
      while another holds an exclusive lock (BEGIN EXCLUSIVE), the lookup with a short timeout (about 0.2 seconds) gives
      "unreadable". With a hot rollback journal beside the store, the lookup gives "unreadable" (D-1362 C6; built as
      AC9 R2 says).
  - AC4: >-
      judge's rules (spec 5 :110-111). judge(session_id, root, working_folder, now) returns a mapping with exactly
      outcome, reason, findings, root and lease. In order: now not a timezone-aware UTC datetime in whole seconds, or a
      session_id or root that is present but not a str (any type other than None and str: 0, False, [], b"", a number
      among them), or a present root that is not absolute, gives "refuse", reason "argument"; a root without a session
      id gives "refuse", "root_without_session"; a session id without a root gives "refuse", "session_without_root";
      with both, the result is session_lease(root, session_id, now)'s, mapped as AC5 says, no upward search is made and
      working_folder is not used. With neither: working_folder not a str that is absolute and names an existing folder
      gives "refuse", "argument" (reading; fail closed); then the search of the header from working_folder; a search
      refusal gives "refuse", "search" (reading; fail closed); no store found gives "enforce_nothing",
      "no_store_found"; else session_lease(found, None, now) mapped as AC5 says. root is the root given (both present)
      or the folder found, else None.
  - AC5: >-
      judge's mapping. session_lease's "done"/"tied" with a lease that is not None gives outcome "tied", reason "tied",
      lease the value; "done"/"no_lease_row" gives "enforce_nothing", reason "no_lease_row", lease None, only when
      judge's own session_id and root were both absent and the search was made; every "refused" gives "refuse" with
      the same reason and findings, lease None; any other shape of answer ("done" with another reason, "tied" with no
      lease, "no_lease_row" on the both-present path, a value that is not a StoreResult) gives "refuse", reason
      "entry". So "enforce_nothing" arises only with both absent. judge calls only writer.store_path and
      writer.session_lease of the core and nothing else that reads or writes the store or the event log; it never
      opens a file. No exception escapes: any exception inside gives "refuse", reason "entry", the exception's type
      name in findings. Equal arguments over an unchanged disk give equal results; judge keeps no state.
  - AC6: >-
      What the modules import and do (INV-001 to INV-004; D-1360 C1 (a)). claude_code_store.py imports exactly os and,
      of aieos_bootstrap, writer; it calls no writer name other than store_path and session_lease (a check over its
      AST); its regular-file test reads st_mode as the header says, with no stat import; it opens no file, starts no
      process, reads no standard input or environment, prints nothing, calls no sys.exit, reads no clock, and makes no
      network or model call; no exec, eval, compile, __import__ or importlib; no assert in src (bandit B101); no string,
      docstrings included, naming the project-state directory. writer.py's change adds no import (its imports stay
      within tests/unit/test_writer.py:410's set), adds only session_lease and the private helpers and private
      module-level constants it alone uses (_store_uri's encoding by a character loop or two-argument str.replace
      only), and reads no clock; every function, class and module-level assignment present at the base is unchanged (an
      acceptance-time script by source segment over the task's commits). tests/unit/test_writer.py's R8 tests and
      tests/unit/test_gitread.py's subprocess test pass unchanged. At the task's commits the CI steps report no
      finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC7: >-
      What is stated. writer.py's module docstring gains lines naming session_lease and TASK-066, and its Limits gain
      the read-only and lock text; session_lease's and claude_code_store's docstrings state: the three outcomes and
      their sources (spec 5 :109-112); read-only and the lock, with the refusal cost, and the refusal on a hot journal
      or a journal or WAL state a read-only connection cannot use; the URI rule, built from the checked realpath, and
      the UNC and non-UTF-8 refusals;
      the table form before and after K1, and that spec 2 revision 7 §3 already lists four tables; the presence step,
      the link check and their limits (untested in CI on Linux; junctions and unresolved links; hard links and bind
      mounts; check and use apart); the values rule, and that the empty-as-absent rule is judge's; the upward search,
      where it ends, its refusal on an unexaminable entry as a fail-closed reading, the inner-store and
      outside-the-tree limits, and the race between search and open; that the session id, root, working folder and
      now are arguments, their source a later contract's, and that a now earlier than the real time is the fail-open
      direction, so now must come from the process clock; and that no hook is placed
      and nothing is measured (CC-3, the owner's; C6). No test asserts anything about a running Claude Code.
  - AC8: >-
      Its own tests and the added text (GOV-003; D-1361 C2). Every new test function names the AC ids it stands for as
      "TASK-066 ACn" in its own docstring; no other task's AC is named in qualified form. In tests/unit/test_writer.py,
      tests/integration/test_writer_files.py and tests/property/test_writer_properties.py every top-level and
      class-level function and class present at the base is byte-identical after the change and none is removed, and
      nothing else in them changes but added functions and classes and the imports they need (an acceptance-time
      script by source segment over the AST, over the task's commits). Before each commit, the added text is scanned
      with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0. Every test is buildable under
      deterministic_rule (D-1362 C5): tests that make a real store (open_store, start_session, grant_lease, end_session
      in a tempfile folder) or use sqlite3 or tempfile are only in the three writer test files, and no other test
      module imports sqlite3 or tempfile; no test calls mkdir or makedirs, exec, compile, __import__ or importlib, or
      open in a mode other than "rb" or "ab"; the two new test modules write no file, read sources only by pathlib's
      read_bytes on paths relative to __file__, and use stand-ins for writer.session_lease and for the file checks:
      claude_code_store's name os is replaced, for one call, by a stand-in namespace giving only the functions judge
      uses (lstat, and path.abspath, isabs, isdir, dirname); in tests/unit/test_writer.py the presence-step and
      link-check stand-ins patch writer's os functions for one call and pass every other path to the real function;
      no test creates a link or a folder; no test value is a real path of this machine's user folders, a real session
      id or a credential-shaped string other than made-up ones that the scans do not match, and no literal "/tmp" path
      (bandit B108); paths are built from tempfile in the three writer test files and from absolute pieces derived from
      os.sep in the two new modules.
  - AC9: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 and AC2 (each reason, in order, over
      real stores in the writer test files: a missing and a non-folder root and a relative root, each with a session
      id set, through session_lease and through judge; no store; a 0-byte store file ("tables") and a non-empty garbage
      file of at least 100 bytes ("unreadable"), both built thus: open_store run with writer._SCHEMA patched to a
      failing statement leaves the folders and an empty store file after its rollback, and the garbage is written to
      it with open "ab" (if open_store leaves no file so, the raw evidence goes to the decision agent); a
      malformed stored time on the session's own lease row; tables of another form and a fourth table; no lease row
      with and without a session id; an expired and an unexpired lease row with no session id; no such session; an
      ended session, built with two sessions (a lease granted to the second, the first ended); ended_at ""; zero, one
      and two unexpired leases of the session; one unexpired and one expired; an expired lease at exactly now; each
      bad argument kind, a raising tzinfo, a lone surrogate session id and each bad timeout; the tied case); R2 AC3
      (bytes and files unchanged; the special-character root, made by tempfile's prefix and suffix; _store_uri's fixed
      strings and the UNC refusal; the IMMEDIATE and
      EXCLUSIVE locks; the hot journal, built in a writer test file thus: a second store made by open_store gives the
      folders, since tests may not make folders; on a first store a write transaction is held open after it has
      written pages, and that store's journal bytes, read with open "rb", are written with open "ab" to the journal
      path beside the second store (or, if the copied journal is not hot, a journal whose header the test writes with
      open "ab": SQLite's journal magic and a non-zero record count); the lookup on the second store gives
      "unreadable"; if no journal can be produced, the raw evidence goes to the decision agent, and if the lookup does
      not give "unreadable", that is a blocking finding for the decision agent, not a dropped test, D-1362 C6); R3, in
      tests/unit/test_writer.py, the presence step and the link check through stand-ins for os.lstat,
      os.path.realpath and os.path.normcase (each errno case, a directory, a link and another kind at the store path; a
      store file, a local folder and a project-state folder each resolving elsewhere give "link"; case and separator
      differences only, with ntpath.normcase standing in for os.path.normcase, do not; a realpath stand-in returning
      the same expanded form on both sides for a short name does not; a raising realpath gives "link" and a raising
      _store_uri "unreadable"); R4 AC4 and AC5 (each rule and mapping, with stand-ins: None, "", whitespace and each
      non-str value; a bad now; relative paths; a working folder that is not an existing folder; a bad working folder
      ignored when both are present; the upward search finding the nearest store, passing a folder without a store
      file, ending at the root, refusing on another OSError, a ValueError and a non-regular entry, an inner store
      judged alone; each odd answer shape of AC5 giving "entry"; exceptions giving "entry"); R5 AC6 by an in-suite check of the current text
      (imports, absent names and calls) and the acceptance-time script for the base definitions; R6 AC7 by an in-suite
      check of the docstring words, matched with whitespace collapsed (D-1286); R7 AC8 by the acceptance-time script
      of the three writer test files; and property tests (standard library only, fixed seeds, at most 50 cases each):
      over generated session ids, roots and stand-in answers judge's result has exactly the five keys, lease is None
      unless the outcome is "tied", "enforce_nothing" occurs only when session id and root were both absent, and equal
      inputs give equal results (tests/property/test_claude_code_store_properties.py); over generated real stores
      session_lease never changes the store's bytes (tests/property/test_writer_properties.py). Broken copies of session_lease and judge, one per rule, are made and run in the
      scratchpad, outside tests/, as for TASK-059 to TASK-065, and each fails at least one test. tests/run_tests.py,
      unchanged, runs the tests.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 600k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC9]}
  - {gate: G3, check: constitution, args: [AC6, AC7, AC8, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
