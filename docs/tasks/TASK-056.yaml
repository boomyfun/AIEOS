task_type: implementation
objective: >-
  Add to the conformance runner (src/aieos_bootstrap/conformance.py, TASK-003, TASK-006 and TASK-017) the Capability
  Boundaries entry of docs/specs/conformance-files.md revision 10, section 11: the expected fixture path for the
  capability Capability Boundaries; the form check of a Capability Boundaries fixture, with section 11's Given checked
  from the fixture's values alone; per case, an in-memory stand-in for the writer and a read stand-in, then
  replay.replay, the continuation through adapter.start, adapter.submit and adapter.end, and evaluation.evaluate_task,
  all taken from the root, with the comparison and the FAIL and NOT_RUN order of section 11; the run record's
  capability_boundaries key when a run includes this entry; with unit, integration and property tests in new test
  modules, and the change of exactly the assertions of tests/unit/test_runner_rc.py and tests/unit/test_runner_risk.py
  that assert the limit this task lifts. It adds no fixture, changes no set file, changes nothing a run over the
  repository's own tree reports but the runner's own hash, and does not wire the CI channel.
