acceptance_criteria:
  - AC1: >-
      Unchanged where the task does not reach (TASK-003's AC1 to AC9 and AC11, TASK-006's AC1 to AC8, TASK-017's AC1 to
      AC10). The run's inputs, the reader and listing, the wrapped-file and canonical-form rules, the set file's form, its
      freeze approval, the governor entry point, the Verification, Resume Check and Risk Engine entries and comparisons,
      the run record's keys and its record, and the command-line entry stay as those contracts say, apart from the
      changes AC2 to AC11 name. Every result of a Verification, Resume Check or Risk Engine scenario is the same as before
      this task for the same tree, governor, Resume Check and stand-ins.
  - AC2: >-
      The route (section 11, "Where the file is"). expected_path gives tests/conformance/fixtures_cb/<module name>.py for
      the capability Capability Boundaries, the module name formed as section 2 says; Verification, Resume Check and Risk
      Engine keep their paths; any other capability gives none and its scenario stays NOT_RUN for "the entry point of
      <capability> is absent until its milestone". TASK-006's order is kept: the path, then the row hash, then the
      capability against the bound scenario file, all before the fixture file is read.
  - AC3: >-
      The entry point (section 11, "The entry and the comparison"; GS §4 rule 1). The entry calls replay.replay,
      adapter.start, adapter.submit, adapter.end and evaluation.evaluate_task of the root's src/aieos_bootstrap/ modules,
      loaded by plain import statements guarded as TASK-003's AC6 guards the governor's; no other module is loaded for
      it but aieos_bootstrap.eventlog and aieos_bootstrap.writer (for eventlog.append and the writer's result types,
      AC5). When one of them is absent, failed to load, or lacks a callable of that name, every Capability Boundaries
      scenario with a fixture is NOT_RUN for "the entry point is absent" (reading: the run's counting stays as TASK-003's
      AC6 gives it). The run function also takes a Capability Boundaries entry function as a test seam (reading): a run
      with a stand-in entry never counts; the command-line entry never takes one.
  - AC4: >-
      A Capability Boundaries fixture's form and the Given (section 11, the fixture file, its table, "Faithfulness" and
      the Given; section 5 applied). After the conditions of TASK-003's AC5 that read the set entry, the row and the
      file's bytes and hash, and the wrapped-file and canonical-form rules, the fixture is malformed, and its scenario
      NOT_RUN with no call made, unless: its object is exactly scenario, row_hash and cases, those two equal to the set
      entry; cases is a list of exactly one case; the case is exactly document, continuation, evaluation, given and
      expected; document is an object holding the key violation and submission null (its other keys are replay.replay's
      to check, reading); continuation is exactly session, submission and end_at, submission not null; evaluation is
      exactly task_id, contract_text, declared, values, extra_records, recorder, now and commits, contract_text a string
      that encodes as UTF-8, commits a non-empty list of objects exactly {id, text, paths} (id 40 lowercase hex, text a
      string, paths a list of strings); given is exactly outside_path and write_set; expected is exactly stop, decision,
      next_state and not_fixed, with stop exactly ["STOP: violation"], decision exactly ["REJECT"], next_state exactly
      ["REJECTED"] and not_fixed exactly ["metrics"] (reading of section 4's rule that a key is present with a value or
      named in not_fixed, never both: metrics, the one key section 11 never gives a value, is named in not_fixed and is
      absent as a key). The Given, checked from these values alone before any call: the violation's
      observation is an object with fact_kind observation, outcome blocking, blocking_kind violation, source_class
      deterministic_tool_local and recorder equal to the document's recorder; given.outside_path is matched by no pattern
      of given.write_set, by the runner's own matcher of TASK-017's AC5 (the same forms; never imported from the
      governor); outside_path is among the paths of the commit whose id is continuation.submission.commit_id; the
      SHA-256 of contract_text encoded as UTF-8 equals the contract_hash of the document's last setup event of type
      task.approved; and values.changed_paths equals that commit's paths, sorted. A fixture whose values break the Given
      is malformed (NOT_RUN).
  - AC5: >-
      The stand-ins (section 11, "The entry and the comparison"; decision D-1067 addition (i)). Per case the runner
      builds one in-memory store and log: open_store, read_log, append_event, start_session, end_session, grant_lease,
      release_lease_token and held_lease as replay.replay's functions and the adapter's and evaluation's keyword
      arguments take them, with the signatures of the writer's functions (bound with inspect.signature(...).bind in the
      tests); every append is decided by eventlog.append over the in-memory log bytes; every result is the writer's own
      result type (writer.WriteResult, writer.StoreResult and the others the core checks); the root given to the core is
      an absolute path on every CI platform that names no existing folder (reading: built from the run's root and a
      fixed name; nothing is created there). The read stand-in answers only "cat-file -t" and "cat-file -p" of a commit
      of evaluation.commits (its text) and the pinned diff-tree form of evaluation.py's DIFF_FORM followed by such a
      commit (its paths, NUL-separated), and gives an error result for every other read. The runner opens and writes no
      file for the entry and starts no process; a test checks, with the stand-ins bound to the real signatures, that a
      case runs with every write of the writer replaced by a function that fails the test if called.
  - AC6: >-
      Step (1), the replay (section 11). replay.replay is called with a copy of the document, the root and the
      stand-ins. Observed stop is the decision of the step named violation in the result's steps. The case fails if the
      result is done and that decision is not in expected.stop; or if the result is refused with reason violation after
      a violation step whose result is refused with reason core, also when the decision event is already in the log
      (decision D-1067 addition (ii): fail closed). The scenario is NOT_RUN, with the reason in the runner's output, if
      the result is refused for any other reason (document, store, setup, start, token, end), or with reason violation
      and no violation step (no lease was granted) or a violation step refused with reason argument.
  - AC7: >-
      Step (2), the continuation (section 11). Only when step (1) gave done: adapter.start with the continuation's
      session values, the document's recorder and the stand-ins; then, only on a granted lease whose token equals
      continuation.session.expected_token, adapter.submit with the root as repository, the read stand-in and the
      continuation's submission values; then adapter.end with the granted token. No lease (also when the session's
      inputs, such as log_seq, do not agree with the log step (1) left), a differing token, or a refused submission or
      end makes the scenario NOT_RUN with the reason in the runner's output, never FAIL.
  - AC8: >-
      Step (3), the evaluation (section 11). Only when step (2) submitted: evaluation.evaluate_task with the root, the
      root as repository, evaluation's task_id, contract_text encoded as UTF-8, declared, values, extra_records, recorder
      and now (each a copy), the read stand-in and the stand-ins' read_log and append. The case fails if the result is
