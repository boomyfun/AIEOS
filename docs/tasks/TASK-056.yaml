# Task contract TASK-056, the conformance runner's Capability Boundaries entry (Master Plan revision 4, §4 M5; DEF-0072
# step 2, the route of decision D-1056; specification 2 §5.1). Revision 0, drafted under decision D-1067 (the scope
# note, with its additions (i) and (ii)), brought for approval in its own request; whether it is approved is recorded in
# the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and TASK-017's contract, the
# same kind of change to the same runner. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. Constitution GOV-002 applies: tests/conformance/** (the fixtures and the set file,
# scenario files in the sense of conformance-files.md section 8) is in the forbidden set, so the task can read them but
# never change them.
# What it changes (conformance-files.md revision 10, section 11, DM F48): the runner routes the capability Capability
# Boundaries to the fixture folder tests/conformance/fixtures_cb/; it checks a Capability Boundaries fixture's form and
# section 11's Given from the fixture's values alone; per case it builds one in-memory stand-in for the writer (a store
# and a log whose append decisions are eventlog.append's, returning the writer's own result types, opening and writing
# no file) and a read stand-in that answers from the fixture's commit table; then it calls replay.replay, then
# adapter.start, adapter.submit and adapter.end (the continuation), then evaluation.evaluate_task, and compares as
# section 11 says, with its FAIL and NOT_RUN order. No Capability Boundaries fixture exists, and the set file's ADV-02
# entry is null until DEF-0072 step 3's fixture task, so over the repository's own tree every run record is unchanged by
# this task, byte for byte except the runner's own sha256 (AC11).
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/conformance.py is read by the CI workflow's
# conformance base run (from the base) and candidate run (from the base too; only the governor files come from the
# head), and imported by the runner's test modules. Of these, three assertions assert the very limit this task lifts:
# tests/unit/test_runner_rc.py lines 315 to 327 (ADV-02 "the entry point of Capability Boundaries is absent until its
# milestone", and expected_path None for it) and tests/unit/test_runner_risk.py line 137 (expected_path None); they
# change by AC12 and in no other way (decision D-1067). Every other assertion of the existing modules must keep passing
# unchanged (AC14), among them those that stay true while ADV-02's set entry is null (test_runner_risk.py:151,
# test_runner_rc_run.py:81, test_runner_run.py:72, test_runner_risk_run.py:135-154) and test_conformance_files.py's
# guard that the set file names no ADV-02 fixture (lines 558 to 621), which is step 3's to change. The run record gains
# one key, capability_boundaries, only when a run includes this entry (section 11), so over the repository's tree it
# gains none. The workflow (.github/workflows/aieos-checks.yml) reads named fields of the run record (its record checks
# at lines 868 and 1204, the runner's sha256 at 1007 and 1343, resume_check at 1012 and 1348), not an exact key set
# (reading, to be shown in full in the approval request, with a script that passes a record holding the added key
# through those check functions); no file under .github/ changes. src/aieos_bootstrap/__init__.py's docstring
# describes the runner's entries and gains this one (as TASK-017 changed it); __all__ does not change.
# Risk: high. Computed over the base by script (risk_class56.py, output pasted unedited in the approval request): every
# path of the write set matches R2 (medium) and R3 read fail closed (high, risk rules section 2 point 3); no path meets
# R11 (tests/conformance/**); the highest wins: "task risk class: high". Profile (assurance-model.md §5, gov-AIEOS,
# high): functional [unit_test], architecture [deterministic_rule], functional [integration_test], security
# [static_security_analysis] and architecture [ai_review (cross-model)], plus the evidence_required of the applicable
# articles.
# Change class: critical_cr (an evaluator part that enforces acceptance, not bound: DM B1; A29; constitution GOV-003;
# governor-spec.md §8), computed over the base by script (gov003_class56.py: "GOV-003 evaluator change: yes (7 of 7
# paths)"; the runner is on the workflow's pinned evaluator list).
# Reviews (as TASK-017's): five way-2 reviews by a Claude model other than the implementer's (claude-sonnet-5-5), and
# the decision agent's own review, each brief naming for testing: that a core that does not stop a recorded violation,
# or a governor that does not reject after one, is FAIL and never PASS or a silent NOT_RUN; that a NOT_RUN for a
# fixture failure can never hide such a FAIL; that the stand-ins decide appends exactly as eventlog.append does and
# write no file; that the two changed test modules lose nothing but the lifted limit; that a run over the repository's
# tree is byte-equal before and after; the limits of AC16. Each reviewer's prompt is self-sufficient, with the
# scratchpad's absolute path in its first line (D-277).
# Evaluation path (A61; as TASK-006 to TASK-055): the approved contract is committed on main as its own commit C, which
# changes only docs/tasks/TASK-056.yaml and has one parent equal to base_commit, and is pushed normally; the files are
# drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's commits,
# each carrying the trailer "AIEOS-Task: TASK-056" and no e-mail address in its message, go to the branch
# task/TASK-056 on GitHub, each push under its own decision of the decision agent after a secret scan and a dry run
# against a bare single-branch copy, never by force and never deleting; the CI channel runs on each push and its
# records are re-fetched into docs/records/TASK-056.jsonl; main receives the task only at its acceptance, by a
# fast-forward under its own decision.
# Not applicable: OPS-001 (the task changes no ref); INV-009, INV-011, GOV-001, GOV-004, GOV-005, GOV-006 and SEC-003
# (their scopes, the event log, the policy, the concept file, the bound artifacts, the decision matrix, the records and
# pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting or hook, no measurement, no push of its own (CR-002 part 4 limit 5 does not apply).
# Uncovered and stated limits (AC16): no Capability Boundaries fixture exists and ADV-02's set entry is null, so ADV-02
# stays NOT_RUN in every run over the repository's tree and nothing here shows that the core meets ADV-02; a passing
# ADV-02 will show only the core's handling of a recorded observation, never that any hook observes anything (C6 and
# the T3 tier unmeasured, the owner's); in the CI channel the base run takes the runner from the base, so this entry
# first runs there after it lands on main; the stand-ins copy test code into the runner (a known cost; no new module,
# so the workflow's pinned list does not change); every review is by AI of one vendor.
task: TASK-056
