acceptance_criteria:
  - AC1: >-
      The arguments. execute(root, task_id, inputs, code_sha256, grant_request, recorder, now, read_log=None,
      append=None, grant=None, release=None, held=None, check=None) checks every argument before anything is read:
      root a non-empty string; task_id "TASK-" followed by digits; inputs a mapping whose task_id equals task_id (its
      other keys are resume_check.check's to judge); code_sha256 64 lowercase hex characters; grant_request a mapping
      with exactly the keys holder (a non-empty string), session_id (a non-empty string) and expires_at (a
      timezone-aware datetime in UTC with whole seconds); recorder a non-empty string; now a timezone-aware datetime in
      UTC with whole seconds. A wrong argument gives the result of AC9 with result "refused", reason "argument" and a
      finding naming it, and nothing is read, appended or changed in the store. read_log, append, grant, release, held
      and check default, at call time, to writer.read_log, writer.append_event, writer.grant_lease,
      writer.release_lease_token, writer.held_lease and resume_check.check.
  - AC2: >-
      The log and the task's state. The log is read once through read_log(root) and checked by records.check_log; a
      result that is not bytes, or a log with a finding, gives "refused", reason "log". The task's events are its own
      (task_id equal), duplicates of an earlier line left out; with no task.approved among them the result is
      "refused", reason "state". From its last task.approved the state is READY, and each later event of the task sets
      it in log order: task.drafted DRAFT, task.blocked BLOCKED, task.unblocked READY, task.submitted VERIFYING,
      decision.acceptance its payload's next_task_state when that is a string, task.stale STALE, task.done DONE,
      task.replanned DRAFT; a task.* type this list does not name gives "refused", reason "state" (decision D-687 M1);
      other types leave it (reading; the transitions are not checked, DEF-0055 P6). held(root, task_id) is read once: a
      lease whose expires_at is after now, on a task the log has in READY or REWORK, makes the state IN_PROGRESS
      (specification 1 line 60); a held lease whose expires_at is at or before now gives "refused", reason "lease"
      (its expiry is the caller's, writer.expire_leases); a lease held on a task the log has in another state gives
      "refused", reason "state". A state other than READY, REWORK or IN_PROGRESS gives "refused", reason "state", and
      nothing is appended.
  - AC3: >-
      The inputs agree with the log. Before the check is called, inputs' task_state must equal the projected state,
      inputs' log_seq the seq of the log's last line, and inputs' approved_contract_hash the contract_hash of the
      task's last task.approved; each difference is a finding, and any gives "refused", reason "inputs", with nothing
      appended (no decision on a stale view of the log is recorded). The other inputs are the caller's and are not
      checked here (AC10).
  - AC4: >-
      The check. check(inputs, code_sha256) is called once. Its result must be a mapping whose record_id is a
      non-empty string, whose subject equals task_id, which has a decision key, and whose state_effect is a list of
      mappings with exactly the keys event_id (a non-empty string), type, payload and task_id (equal to task_id); a
      result in another form, or a raised exception, gives "refused", reason "check", before anything is released or
      appended. A record with decision null and an error is the record of a failed check: it is appended as AC6 says,
      no state effect follows, and its lease effect is AC7's "any other outcome".
  - AC5: >-
      The release first (reading R1, accepted by decision D-687; specification 1 section 5.1). When the state is
      IN_PROGRESS and the record's decision is not CONTINUE or CONTINUE_WITH (an error record included), the held lease
      is released once through release(root, task_id, its fencing_token) before anything is appended; a result other
      than a StoreResult with result "done", or a raised exception, gives "refused", reason "lease", and nothing is
      appended.
  - AC6: >-
      The state effect (specification 3 sections 9 and 10). The record is appended through append(root,
      "decision.execution", record, record["record_id"], now, recorder, task_id=task_id) with no fencing token, then
      each event of its state_effect in its order through append(root, its type, its payload, its event_id, now,
      recorder, task_id=task_id), the plan built inside the guarded step. Each "appended" and "duplicate" result is
      listed; the first other result (a refusal, a result that is not a WriteResult, or a raised exception) stops the
      appends and gives "refused", reason "append", with the ids appended so far listed, and no lease is granted. The
      ids are the record's, so a second append of the same record or event gives "duplicate" (the writer's
      behaviour); a rerun of execute with the same inputs after any append is refused with reason "inputs" by AC3,
      since the log's last seq has moved, and it appends nothing (decision D-687 M2). The log is append-only, so
      nothing is undone. The record and its events are appended as check returns them, unchanged.
  - AC7: >-
      The lease (specification 3 sections 1 and 10). After every append is "appended" or "duplicate": on CONTINUE or
      CONTINUE_WITH for a task in READY or REWORK, grant(root, task_id, the state, holder, session_id, now, expires_at)
      is called once with grant_request's values; a StoreResult with result "done" gives the lease in the result, and a
      refusal (held, session, expiry or state) or a raised exception gives "refused", reason "lease", with the store's
      reason and findings named, the record staying in the log. On CONTINUE or CONTINUE_WITH for a task IN_PROGRESS,
      the held lease is kept and given in the result, and no store function is called; the kept lease is the store's
      held lease, and whether grant_request's holder and session_id hold it is not checked (AC10). On any other outcome for a task
      in READY or REWORK (STOP: runtime insufficient, STOP: scope invalid, REPLAN, BLOCKED, ESCALATE, an error record),
      no store function is called and no lease exists after the call; for IN_PROGRESS, AC5's release has happened.
  - AC8: >-
      The limits of the Resume Check, stated (scope note points (i) and (ii); decision D-683): a READY task given
      REPLAN gets the conflict.detected that check returns and no task.stale, though specification 1 revision 2 line 70
      allows READY -> STALE then; a check-4 REPLAN gives no task.stale; every conflict.detected has tasks []. Each is
      appended as returned and named in the result's uncovered from the record's own uncovered entries; resume_check.py
      is not changed.
  - AC9: >-
      The result. execute returns a mapping with exactly the keys result ("decided" or "refused"), reason (None or one
      of "argument", "log", "state", "lease", "inputs", "check", "append"), findings (a list of texts), decision (the
      record's decision, or None when no record was made), record_id (the record's, or None), appended (the event ids
      appended), duplicate (the event ids found already appended), lease (the lease granted or kept, in
      eventlog.LEASE_KEYS' form, or None), released (the lease released, or None) and uncovered (the record's
      uncovered entries, sorted, without duplicates). An exception raised by a called function is caught and becomes a
      result with the step's reason; none escapes.
  - AC10: >-
      Limits, stated: the Resume Check's inputs other than task_state, log_seq and approved_contract_hash are the
      caller's and not checked (as TASK-031's facts); the projection does not check transitions (DEF-0055 P6); one run
      at a time (the log is read, then appended to, with no check that it is unchanged since; the store's own
      transaction is the only lock, as the writer's limit); a crash between the release, the appends and the grant
      leaves a state the next Resume Check repairs under new ids; the store, its epoch, sessions and expiry are the
      caller's (D-414's requirement stays with the caller that opens the store); on CONTINUE or CONTINUE_WITH for a
      task IN_PROGRESS the lease kept is the store's held lease, and that grant_request's holder and session_id are
      the ones holding it is not checked, since writer.held_lease gives no holder and writer.py is not changed here
      (specification 3 section 1: "a lease it still holds"; carried to the caller, decision D-687 M4); no
      task.unblocked, no task.replanned,
      no Work Order, no decision while a session runs, and no STOP: violation (check never returns it). Every existing
      module and test not in the write set is unchanged, and if one can pass only by a change the task escalates
      (needs_out_of_scope_change).
  - AC11: >-
      Purity and the CI checks (INV-001 to INV-004). The module imports only the Python 3 standard library and
      aieos_bootstrap's records, resume_check and writer; it starts no process, opens no file except through read_log,
      append, grant, release and held, reads no clock and no environment, builds no event-log line itself and makes no
      network or model call; no exec, eval, compile, __import__ or importlib; no assert in src (bandit B101); no string
      that names the project-state directory. Its docstring names what it does not do (AC10), DEF-0030 (the two parts
      it closes), point (i) and DEF-0055 P6. No module of src/ changes except __init__.py's docstring and __all__. At
      the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC12: >-
      Its own tests and the added text. Every test function of the three new test modules names the AC ids it stands
      for as "TASK-032 ACn" in its own docstring and names no other task's AC in qualified form there. Before each
      commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0;
      the file names are scanned with the same patterns and the records executors' pre-push pattern (D-282). The tests
      open, write and remove no file (the deterministic_rule step's exemption covers only the writer's tests).
  - AC13: >-
      Tests, each rule with at least one passing and one failing case, with stand-ins for read_log, append, grant,
      release, held and check (no process, no file): R1 AC1 (each wrong argument refused before any read; each
      default is, at call time, the named function of writer or resume_check; every call a stand-in records binds to
      the real function's signature, by inspect.signature(...).bind for read_log, append_event, grant_lease,
      release_lease_token and held_lease (decision D-687 M3)); R2 AC2 (the projection from each event type; a
      task.drafted after the last task.approved gives DRAFT and is refused; a task.* type the list does not name is
      refused; no task.approved; an expired lease; a lease on a task in another state; a refused log); R3 AC3 (each of the three differences refused with nothing appended); R4 AC4 (each malformed
      record form and a raising check refused before any release or append; an error record appended alone); R5 AC5
      (the release before the appends for each non-continue decision from IN_PROGRESS; a refused release stops with
      nothing appended); R6 AC6 (the order of the record and its events; a refusal mid-way stops with the ids so far and
      no grant; a second append of the same record or event gives "duplicate" at the stand-in append; a rerun of
      execute with the same inputs after an append is refused "inputs" and appends nothing); R7 AC7 (a grant on CONTINUE and CONTINUE_WITH from READY and REWORK, after
      the appends; a store refusal named; a kept lease on IN_PROGRESS; no store call for any other decision from READY
      or REWORK); R8 AC8 (REPLAN on READY appends conflict.detected only and names it uncovered); R9 AC9 (the keys; an
      exception caught at each step); R10 AC10 and AC11 (a script check of the imports and of the absence of open,
      write, subprocess, clock and environment calls, and of the docstring's words). Unit tests in
      tests/unit/test_execution.py; an end-to-end run of the real resume_check.check over inputs built in the test,
      with a log appended in memory through eventlog.append and an in-memory stand-in store, in
      tests/integration/test_execution_store.py; property tests in tests/property/test_execution_properties.py
      (standard library only, fixed seeds): for random decisions, states and store answers, a second run appends
      nothing new, and is refused "inputs" when the first appended anything; a lease exists after the call only on CONTINUE or CONTINUE_WITH, and is granted only after the
      record is in the log; no lease survives any other outcome on a task IN_PROGRESS. tests/run_tests.py, unchanged,
      runs all groups.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9, AC13]}
  - {gate: G3, check: constitution, args: [AC10, AC11, AC12, INV-001, INV-002, INV-003, INV-004, INV-005, INV-009, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
