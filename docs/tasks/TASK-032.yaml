# Task contract TASK-032, the execution path (Master Plan revision 3, §4 M3 and M4; specification 3 revision 4,
# sections 1, 9 and 10; specification 1 revision 2, sections 5.1 and 5.2; concept lines 489, 506, 541 and 876).
# Revision 1, drafted under decisions D-683 (Q2, C1) and D-685 (Q3, C3), from the scope note approved in D-683, with
# decision D-687's changes M1 to M5 and its rulings R1 to R8; brought for approval in its own request; whether it is approved is recorded in the decision files, not in this file. Fields
# and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-031. Readings marked "(reading)"
# are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: one module, src/aieos_bootstrap/execution.py, the core's caller of the
# Resume Check (resume_check.check, TASK-008), as evaluation.py is the governor's (TASK-027). It closes the two parts of
# DEF-0030 that decision D-415 C3 left open at M3's exit: the execution decision's state effect, appended through the
# writer, and the lease granted on CONTINUE. Its function execute reads the event log through the writer, projects the
# task's state from its own events and the store's held lease, checks that the Resume Check's inputs agree with the log
# on that state, the log's last sequence number and the approved contract hash, calls the Resume Check once, appends the
# returned record as decision.execution and then each event of its state_effect under the ids the record stores, and
# grants, keeps or releases the lease as specification 3 sections 1 and 10 say.
# The specification's text (spec 3 section 1): "Only CONTINUE and CONTINUE_WITH let the lease be granted and the Context
# Compiler run (line 506). Every other decision grants no lease." and "On IN_PROGRESS, any decision other than CONTINUE
# or CONTINUE_WITH releases the lease (proposed)." Section 9: the record_id and the event_id of every event section 10
# appends with it are "computed once when the check runs and stored in the record. A retried append of the same record
# reuses the stored ids and has no effect". Specification 1 line 60: IN_PROGRESS is not a log event; "a task that the
# log has in READY or REWORK is IN_PROGRESS while the local store holds an unexpired lease on it (proposed)".
# Point (i) of the scope note, a stated limit (decision D-683 Q2): specification 1 revision 2 (line 70) allows READY ->
# STALE when the Resume Check gives REPLAN on a READY task, while resume_check.py's READY branch (_effect: "if
# inp['task_state'] == 'READY': return [conflict]") gives no task.stale for it, as specification 3 section 10's older
# text says. This task appends exactly what resume_check.check returns and does not change resume_check.py; the
# alignment of the Resume Check is carried as its own later item (DEF-0030's log line of 2026-10-14). The outcome fails
# safe: no lease is granted on REPLAN, the task stays READY, and the next Resume Check gives REPLAN again.
# The order (scope note point (iii), as decision D-683 accepted it, with one change, the worker's reading R1, accepted
# by decision D-687): a lease is granted only after the record and its state effect are in the log; a held lease that the
# decision ends is released before the record is appended, as specification 1 section 5.1 says for task.blocked ("a
# lease on the task is released first (proposed)") and for task.stale ("the lease of a task in IN_PROGRESS is
# released"), so that no lease is ever held on a task the log has already moved to BLOCKED or STALE (reading). A crash
# between the steps leaves either a record with no lease, or a released lease with no record; both are repaired by the
# next Resume Check under a new log_seq and new ids.
# What it does not do: no Resume Check input gathering (Git, the files at HEAD, the architecture entities, the runtime's
# max_risk and telemetry, the observed read-set are the caller's values; only task_state, log_seq and
# approved_contract_hash are checked against the log); no Work Order and no Context Compiler (spec 3 sections 1 and
# 11); no decision taken while a session runs (section 8: STOP: violation and a running ESCALATE are specification 5's
# runtime's); no task.unblocked (section 10's BLOCKED row needs a trigger over all blocked tasks, a later piece); no
# task.replanned; no store creation, no session start or end, and no lease expiry (open_store, start_session,
# end_session and expire_leases stay the caller's; D-414's requirement on epochs stays with the caller that opens the
# store, DEF-0041 (c)); no governor call and no acceptance; no network; no change to resume_check.py, writer.py,
# eventlog.py, records.py or any other existing module; nothing under .github/.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain execution; tests/unit/test_gitread.py
# and tests/unit/test_ac_tests.py assert that __all__'s text holds 'gitread' and 'ac_tests', which stay; it must not
# name the Resume Check fixture folder (TASK-010's assertion) nor the Risk Engine fixture folder (TASK-020's allow
# list). No module of the repository calls execute yet; its next caller is the session start of specification 3
# section 1, in the adapter or CLI milestones (M5, M7).
# The projection (scope note point 2 (b); DEF-0055 P6): the task's state is read from its own events after its last
# task.approved, as evaluation's _task_events reads them; the transitions are not checked against specification 1's
# state machine (a stated limit).
# Risk: high, and change class critical_cr, each computed over the base by script, as for TASK-027 to TASK-031. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles.
# Reviews (as TASK-031's): five way-2 reviews by a Claude model other than the implementer's, and the decision agent's
# three, each brief naming for testing: the projection (a task.drafted after the last task.approved, and a task.* type
# it does not name) and the agreement of the inputs with the log; the record's form check before any append; the order
# of the release, the appends and the grant; the ids and "duplicate" on a second append, and a rerun refused "inputs";
# each decision's lease effect from READY, REWORK and IN_PROGRESS; the kept lease on IN_PROGRESS, whose holder is not
# checked; an error record; a store refusal; the stand-ins bound to the real signatures; purity (the writer and the
# Resume Check only); point (i) and AC10's limits.
# Naming (D-544 Q3, as TASK-023 to TASK-031): every test of the new test modules names the AC ids it stands for as
# "TASK-032 ACn" in its own docstring.
# Evaluation path (A61; as TASK-007 to TASK-031): commit C changes only docs/tasks/TASK-032.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-032", go to task/TASK-032 under their own
# decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-006 to INV-008, INV-010 and INV-011 (acceptance, evidence and
# the policy meet no path of the write-set); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the bound
# artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the write-set).
# INV-004 applies: the module appends only through writer.append_event and changes the store only through
# writer.grant_lease and writer.release_lease_token. INV-005 applies: the decision.execution payload is the decision
# contract of specification 2 section 6.4 as resume_check.check returns it, appended unchanged. INV-009 applies through
# the writer (append-only), which this task does not change.
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; a lease in the local store is not an owner-kept act; it weakens no evidence
# requirement (CR-002 part 4 limit 8 does not apply), so its acceptance is one delegated approval of the decision agent
# (Master Plan section 6), for the decision agent's ruling.
task: TASK-032
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/execution.py, the core's execution path of specification
  3 sections 1, 9 and 10: execute(root, task_id, inputs, code_sha256, grant_request, recorder, now) reads the event log
  through the writer, projects the task's state from its own events and the store's held lease, checks that the Resume
  Check's inputs agree with the log, calls resume_check.check once, appends the returned execution decision record as
  decision.execution and then each event of its state_effect through writer.append_event under the ids the record
  stores, so that a rerun gives "duplicate", and grants the lease through writer.grant_lease only on CONTINUE or
  CONTINUE_WITH for a task in READY or REWORK, keeps a held lease on those decisions for a task IN_PROGRESS, and
  releases it by its token through writer.release_lease_token on every other outcome. With unit, integration and
  property tests in new test modules, each test naming its AC ids as "TASK-032 ACn" in its own docstring; the tests use
  stand-ins for the writer's functions and for the check, and the integration test runs the real resume_check.check
  over a log appended in memory with eventlog.append and an in-memory stand-in store.
