acceptance_criteria:
  - AC1: >-
      The context (point 7; D-1262 M1). context_findings(context) gives a list of findings, empty only when context is a
      mapping with exactly the keys root, task_id, session_id, fencing_token, write_set, allowlist and recorder, where:
      root is an absolute Windows path as judge's AC1 requires; task_id is "TASK-" followed by digits; session_id is a
      non-empty string with no whitespace; fencing_token is {epoch: a non-empty string, counter: an int at least 0} as
      violation.argument_findings requires; write_set is a non-empty list of patterns as judge requires; allowlist is a
      list for which claude_code_hook.allowlist_findings gives no finding; and recorder is a non-empty string that holds
      session_id verbatim. A missing, extra or malformed key, or a context that is not a mapping, gives findings and
      nothing is called. The module keeps no state.
  - AC2: >-
      The record's form (D-1262 M4). record_findings(record) gives a list of findings, empty only when record is a
      mapping with exactly the keys judge's records have (record_id, fact_kind, source_class, outcome, blocking_kind,
      recorder, subject, evidence_type, refers_to), with fact_kind "observation", source_class
      "deterministic_tool_local", outcome "blocking", blocking_kind "violation", record_id, subject and refers_to
      non-empty strings, recorder a string beginning with claude_code.RECORDER followed by ", for ", and evidence_type
      one of write_outside_write_set, git_push_refused and shell_not_allowed. A record of any other form is never
      passed to the core.
  - AC3: >-
      Shell redaction (DEF-0079; D-1262 M2). redact(record), for a record with no finding under AC2 and evidence_type
      git_push_refused, gives a new mapping equal to record except refers_to "a git push command; its text is not kept
      (D-1262 M2)"; for shell_not_allowed, refers_to "a shell command; its text is not kept (D-1262 M2)". refers_to is
      exactly the fixed text; nothing derived from the original refers_to (no part of it and no hash of it) is kept. For a record with a finding under AC2, redact gives None. The
      given record is never changed.
  - AC4: >-
      Path redaction (DEF-0079; D-1262 M3). For write_outside_write_set, refers_to is kept unchanged only when it is
      non-empty, holds no ":" and no "\", does not begin with "/", and none of its "/"-separated segments is empty, "."
      or ".."; otherwise refers_to becomes "a path outside the root; it is not kept (D-1262 M3)". Every other key is
      kept. The docstring states the limit: a name under the root can itself hold a secret, and segments are not
      hashed; and it states why the form test catches every outside path, citing claude_code.py:61-66, :169 and
      :183-186: judge gives a path inside the root in the "/"-joined root-relative form with no drive, and a path
      outside it as given, which is always absolute with a drive, since relative and driveless rooted paths are
      "uncovered" there, so every outside path holds a ":".
  - AC5: >-
      deliver (point 7; D-1262 M5). deliver(context, hook_result, event_id, now, append=None, release=None) returns a
      mapping with exactly result, reason, findings, record and core. In order, the first that applies gives the
      result: context findings (AC1) give result "refused", reason "context"; hook_result not a mapping with exactly
      claude_code_hook.RESULT_KEYS, a verdict outside claude_code.VERDICTS, an exit_code that is not 0 for "allow" and
      2 otherwise, or a record that is not None for a verdict other than "refuse", gives "refused", reason
      "hook_result";
      event_id that is not a non-empty string with no whitespace gives "refused", reason "event_id"; verdict "allow"
      gives result "nothing", reason "allow"; verdict "uncovered" gives "nothing", reason "uncovered"; verdict "refuse"
      with record None gives "nothing", reason "no_record" (a caller's error, stated as a limit against specification 5
      §8); a record with findings under AC2, or whose subject is not the context's task_id, or whose recorder is not
      claude_code.RECORDER + ", for " + the context's recorder, gives "refused", reason "record". Otherwise the record is
      redacted (AC3, AC4), and adapter.violation is called exactly once with the context's root, task_id and
      fencing_token, the redacted record, event_id, the context's recorder, now, append and release; its result is
