# Task contract TASK-063, the Claude Code adapter's channel to the core, part CC-2 part 2 (Master Plan revision 4, §4
# M5; specification 5 revision 3, sections 6 and 8 and section 11 points 5 and 7; specification 2 revision 6, section
# 6.2; working records DEF-0079, DEF-0076 and DEF-0077).
# Revision 0, drafted under decision D-1262 (outline (i) with M1 to M7); brought for approval in its own request;
# whether it is approved is recorded in the decision files, not in this file. Fields and value forms follow
# specification 2 §5.1 and the contract of TASK-062. Readings marked "(reading)" are the worker's, for the decision
# agent's ruling; values marked "(filled by script)" are written by script from the base just before commit C.
# Task type: implementation. What it adds: a new module src/aieos_bootstrap/claude_code_channel.py, called only by its
# tests, with four functions: context_findings(context), the form of the per-session context a hook call needs (M1);
# record_findings(record), whether a record has the exact form claude_code.judge gives a refusal (M4); redact(record),
# the record with its refers_to redacted (M2, M3; DEF-0079); and deliver(context, hook_result, event_id, now,
# append=None, release=None), which passes a refusal's redacted record to the core through adapter.violation (M5).
# claude_code.py (TASK-061), claude_code_hook.py (TASK-062), adapter.py (TASK-051/052) and violation.py (TASK-052) are
# not changed.
# The interface (point 7), as this task states it:
# - The context (M1): exactly root, task_id, session_id, fencing_token, write_set, allowlist and recorder. root is one
#   root, for judging and for the core's writer (writer.py:11 puts the store under <root>/.aieos/local). The lease is
#   tied by fencing_token, the token adapter.start's grant returns (adapter.py:8-11); the session is tied in words
#   only, by a recorder that holds session_id verbatim, since specification 2 revision 6 keeps no session key on a
#   record (section 6.2) and adapter.violation takes no session id (adapter.py:276).
# - The write-set (M7; proposed): the caller takes it from the lease's task contract at the base,
#   docs/tasks/<task>.yaml write_set.paths, the same key the Resume Check reads from the contract it is given
#   (resume_check.py:290, :405); this module reads no file and only checks the form, as judge does.
# - The ids (M6): event_id and record_id are the caller's; only their form is checked. A repeated event_id gives
#   adapter.violation's "duplicate", which appends nothing and is no error (violation.py:20-21). How a hook process
#   makes them is left to the task that starts the hook process; candidates named, not decided: the hook input's
#   tool_use_id (not read today: entry reads only tool_name and tool_input, D-1236 Q2), or a counter per session (needs
#   state across hook processes).
# - Out of this task, stated as limits: how a hook process obtains the context and how it is started (tied to placing
#   the hook, CC-3, the owner's act, A51 item (4), and to INV-004); the observed read-set record (it needs state across
#   hook calls; specification 2 revision 6's form; a later task); the allowlist's content and source (point 6, policy
#   at the base; DEF-0077's open names).
# Redaction (DEF-0079; M2, M3):
# - A record of evidence_type git_push_refused gets refers_to "a git push command; its text is not kept (D-1262 M2)",
#   and one of shell_not_allowed "a shell command; its text is not kept (D-1262 M2)": no command text, no first word
#   and no hash is kept (judge cut the text to 200 characters, claude_code.py:259, so a hash would be of the cut text,
#   and a hash of a short text holding a short secret can be found by guessing; a first word can be an assignment).
#   Keeping a first word or a hash is a later choice, not taken.
# - A record of evidence_type write_outside_write_set keeps refers_to only when it has judge's root-relative form
#   (claude_code.py:186): non-empty, no ":", no "\", no leading "/", and no empty, "." or ".." segment; otherwise
#   refers_to becomes "a path outside the root; it is not kept (D-1262 M3)". The test fails closed. Limit, stated: a
#   file or folder name under the root can itself hold a secret; segments are not hashed, since the path under the
#   root is the evidence ADV-02 and the gates need.
# - A departure from specification 5 §6's table, named: for the shell allowlist and git push rows (spec 5 :60-61),
#   "the command" is recorded redacted, not as typed.
# deliver (M5): entry's exit code and standard-error text are never changed (deliver changes nothing in hook_result,
# and the caller keeps entry's exit code). Nothing is written for "allow", for "uncovered", or for a "refuse" without
# a record; the last (entry's reasons argument, allowlist_form and record) is a caller's error, and is stated as a
# limit against specification 5 §8's "every refusal ... is recorded". For a "refuse" with a record, the record must
# pass record_findings and its subject and recorder must match the context (the task id; judge's prefix followed by
# the context's recorder); then redact, then one call of adapter.violation(root, task_id, fencing_token, redacted
# record, event_id, recorder, now, append, release). So the module writes, but only through adapter.violation, which
# writes through the core's writer (INV-004); it is not called pure: it opens no file itself, starts no process, reads
# no clock or environment and makes no network or model call. append and release default to adapter.violation's own
# defaults; tests pass stand-ins and write no file.
# Limits (carried at acceptance): specification 5 open points 4 (the observed read-set: no call here), 10 (an abnormal
# session end), 12 (a bound on repeated STOP: violation); C6 and P-LOC unmeasured; every limit TASK-061 and TASK-062
# carried; a hook that does not fire neither refuses nor records (spec 5 :80), so no record proves nothing (DEF-0076);
# the session tie is in words only (the recorder), not checked by the core; a refusal that the hook process never
# delivers (a crash, a timeout, a missing context) is lost, and the gates find the violation afterwards (spec 5 :80).
# Deferred items: DEF-0079 closes only at this task's acceptance, if the redaction of AC3 and AC4 lands; DEF-0076 and DEF-0077
# stay open, as inputs to CC-3 and to the allowlist contract.
# Risk: high (risk rules revision 6, §2 point 3: R3 matches every path under src/** and tests/**), computed over the
# base by script before commit C. GOV-003: every path of the write-set is an evaluator path by the workflow's pinned
# list, by script; change class critical_cr, as for TASK-060 to TASK-062, ruled at acceptance. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles. Reviews: five way-2 reviews on Sonnet 5.5, a Claude model other than
# the implementer's (Opus 5.5), never Fable (the owner's words of 2026-10-17); and the decision agent's own reviews:
# INV-003's human_review, OPS-002's human_review and the cross-model half, each its own record (D-1148 Q2).
# Records: in the readable form, as TASK-062's; per-entry coverage checked by script before the acceptance request
# (L-0022), and the governor's evaluation over the records reported (D-1098).
# Naming (D-544 Q3): every test of the new test modules names the AC ids it stands for as "TASK-063 ACn" in its own
# docstring.
# Evaluation path (A61; as TASK-019 to TASK-062): commit C changes only docs/tasks/TASK-063.yaml and has one parent equal
# to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-063" and no e-mail address in its message, go to
# task/TASK-063 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011; GOV-001, GOV-004 to GOV-006
# and SEC-003 (no path of the write-set meets them). INV-004 applies: the module writes only through the core's writer.
# Owner-kept acts: none. No hook placed, no matcher chosen, no Claude Code setting, nothing under .github/ or .claude/,
# no push of its own; it weakens no evidence requirement; so its acceptance is one delegated approval of the decision
# agent (Master Plan section 6).
task: TASK-063
contract_version: v1
task_type: implementation
objective: >-
  Add the Claude Code adapter's channel to the core (part CC-2 part 2) in standard-library Python 3. A new module
  src/aieos_bootstrap/claude_code_channel.py gives context_findings(context), record_findings(record), redact(record)
  and deliver(context, hook_result, event_id, now, append=None, release=None): deliver checks the context and entry's
  result, and for a refusal with a record of judge's form, redacts its refers_to and passes it once to
  adapter.violation with the context's root, task id, fencing token and recorder; it writes nothing else and changes
  nothing in entry's result. With unit, integration and property tests in tests/unit/test_claude_code_channel.py,
  tests/integration/test_claude_code_channel_flow.py and tests/property/test_claude_code_channel_properties.py, each
  test naming its AC ids in its own docstring; the tests write no file.
