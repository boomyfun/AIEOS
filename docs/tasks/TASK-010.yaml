acceptance_criteria:
  - AC1: >-
      The new assertion. The module holds, by name, the allowed readers of the folder: under src/ exactly
      src/aieos_bootstrap/conformance.py; under tests/ exactly TASK-005's three modules (tests/unit/test_conformance_rc_files.py,
      tests/integration/test_conformance_rc_set.py, tests/property/test_conformance_rc_properties.py) and TASK-006's three
      new modules (tests/unit/test_runner_rc.py, tests/integration/test_runner_rc_run.py,
      tests/property/test_runner_rc_properties.py), as TASK-006's write set names them. One function of the module
      returns, for a list of repository paths, those not allowed, sorted. The test lists every .py file under src/ and
      tests/ whose bytes hold the folder's name, as the test does now, and asserts that the function returns [] for
      that list and that TASK-005's three modules are in it (reading: an allowed module that does not exist yet, such
      as the runner before TASK-006 lands, is allowed but not required).
  - AC2: >-
      The case pair (D-287 C2). Two more tests in the module call the function of AC1 on lists given in memory: a list
      that adds src/aieos_bootstrap/resume_check.py (a module under src/ other than the runner) returns that path; a
      list that adds a test module not named in AC1 returns that path; the list of the allowed modules returns [].
  - AC3: >-
      Nothing else changes. The diff of the module touches only the comment and the constant that name the allowed
      modules, the one new function, the changed test method and the two new test methods; every other test method,
      constant and import of the module is byte-equal; the module's docstring may name this task. The other tests of
      the module pass unchanged at the task's commit, and so does every other test that tests/run_tests.py runs at
      base_commit.
  - AC4: >-
      Limits, stated and tested as such: the test finds a module that names the folder by its literal text only; the
      allowed list is a snapshot, which a later task needing the folder changes under its own contract; the change
      weakens no evidence requirement: no fixture, set-file, record or bound-file check changes.
  - AC5: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The module imports only the Python 3 standard library, as
      now; it uses no exec, eval, compile, __import__ or importlib, starts no process, opens no network connection,
      calls no model and writes no file; it reads files only with pathlib's read_bytes and lists them only with
      pathlib's rglob, iterdir or glob. The CI steps at the task's commit report no finding: deterministic_rule,
      OPS-003, SEC-001, SEC-002 and bandit, as TASK-005's contract lists them. Before the commit, the added text and the
      file name are scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns and the records executors'
      pre-push pattern (D-282), and each count is 0.
  - AC6: >-
      Tests, with this rule-to-test list: R1 AC1 over the repository's own tree (passes at the task's commit, before
      and after TASK-006's runner exists); R2 AC2's three in-memory cases. tests/run_tests.py, unchanged, runs them.
