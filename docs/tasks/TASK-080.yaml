acceptance_criteria:
  - AC1: >-
      The inputs: build_work_order takes exactly the header's keys in their forms and returns (None, findings) with a
      non-empty list otherwise, never raising; among the cases, not a closed list: a missing or extra key; a decision
      other than CONTINUE or CONTINUE_WITH; a record whose subject, contract_hash or contract_version differs; articles
      keys other than constitution.applicable; traced or adrs keys other than the header's; a contract whose task
      differs; a missing, non-int, bool or non-positive budget; a duplicate ref; a non-JSON value (a float NaN or
      infinity, a set, a non-str key, a str UTF-8 cannot encode); a read_set.interfaces entry naming no given
      interface; malformed files or derived_read_set; no partial Work Order. A read_set without schemas, and a finite
      float in the contract, are taken. Tests for each in tests/unit/test_context_compiler.py.
  - AC2: >-
      The Work Order's keys and hash: exactly the nine keys of specification 6 §5; contract is the contract as given;
      decision the record's; work_order_hash the SHA-256 of the canonical form without it; the same inputs give the
      same bytes, and any change of an included value changes the hash. Tests, among them a hash recomputed by the test
      from the object.
  - AC3: >-
      The layers: five, in order 1 to 5 with the header's names; layer 1 from constitution.applicable only (an article
      of the contract's constitution that is not applicable is absent); layer 2 the components that meet a write-set
      or read_set.paths pattern, a bare component path read as "<it>/**", and those a read_set.interfaces entry names,
      with their interfaces; layer 3 the non-ADR traces_to entries, the ACs and the ADRs, each once; layer 4 the files
      that a write-set or read_set.paths pattern matches (a "**" entry among the tests), the files under an interface's
      component, the schemas' files and the derived paths present in files; an unselected entry of files is absent;
      layer 5 the last handoff or nothing. Tests for each layer and each exclusion.
  - AC4: >-
      Schemas (specification 3 :71, :73): a read_set.schemas entry resolves to the one file of files whose last name
      without its extension equals it, under a path of a component an interface entry names or a component the write-set
      or read_set.paths meet, and that file is in layer 4; no such file gives findings; two such files give findings; a
      schema under a component named only by an interface resolves. Tests for each in tests/unit/test_context_compiler.py.
  - AC5: >-
      The items and budgets: items {ref, hash, content} with content a str as the header states (a component's the
      canonical JSON of its declaration and interfaces) and hash the SHA-256 of its UTF-8 bytes, ordered by ref in
      code-point order; over a layer's budget, items become {ref, hash} largest first, ties by ref, until the layer
      fits; never a shortened content; a budget large enough keeps every content. Tests, among them one at the exact
      budget.
  - AC6: >-
      Purity: build_work_order reads no file, clock or environment, starts no process and mutates no input (deep-equal
      before and after). Tests with stand-ins installed after the import that fail on any open (patched by the string
      "builtins.open"), time or environment call, and by ast.
  - AC7: >-
      What the module may touch: context_compiler.py imports only the standard library and aieos_bootstrap.resume_check;
      the attributes it uses on resume_check are exactly meet and matches; no name compile; no open, .open or .connect
      call, no ".aieos" string, no "bench/", no name of a conformance fixture folder (the names taken from the
      conformance module's constants); no try/except/pass or try/except/continue. Tests by ast over pathlib's
      read_bytes.
  - AC8: >-
      Properties: over seeded random inputs of the header's form, build_work_order returns a Work Order whose hash
      matches its canonical form, whose every layer fits its budget or holds only references, and whose references
      keep the hash of the content they replace. Tests in tests/property/test_context_compiler_properties.py.
  - AC9: >-
      Every existing test passes, the pins of the header among them; the full suite runs locally in three unit parts,
      integration and property before the first code commit; the deterministic rule's local run gives no finding. The
      docstring of context_compiler.py holds, whitespace read as single spaces, the phrases "a pure module", "reads no
      file, no clock and no environment", "never calls resume_check.check", "layer 1 is not recomputed", "budgets are
      required", "the largest content first, ties by ref", "never a summary", "this task's choice", "S3b waits for M7"
      and "the inputs' truth is the caller's", read by a test in tests/unit/test_context_compiler.py by ast over
      pathlib's read_bytes; every new test names "TASK-080 ACn".
  - AC10: >-
      Broken copies, each failing the tests its AC names and no other cause: for each of AC1 to AC8 at least one, among
      them a copy that recomputes layer 1 from the contract's constitution instead of the record, one that calls
      resume_check.check, one that drops the folder reading of a bare component path, one that matches the declared
      read-set by exact path only, one that drops read_set.interfaces, one that drops schemas, one that shortens a
      content over budget, one that turns items into references smallest first, one that hashes with keys unsorted,
      one that keeps work_order_hash inside the hashed form, and one that reads a file; the governor's evaluate at
      acceptance (the shadow) with any difference named; S3b's dependence on M7 and the stated choices in the records
      (not tests).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 600k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9]}
  - {gate: G3, check: constitution, args: [AC10, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
