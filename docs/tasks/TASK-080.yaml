# TASK-080: the Context Compiler v1 as a pure module (specification 6 revision 7, sections 5 and 6; M6's third slice,
# S3a). Plan: decisions D-2170 to D-2172; reviews m80-R1 to m80-R3 and their dispositions: D-2173 to D-2175 (session
# 308d8b07).
#
# Scope (D-2171):
# - A new src/aieos_bootstrap/context_compiler.py with one public function build_work_order(inputs) that returns the
#   Work Order object of specification 6 section 5 from values given, in resume_check.check's pure form: it reads no
#   file, no clock and no environment, starts no process, writes and appends nothing, mutates no input, never raises,
#   and imports only the standard library and aieos_bootstrap.resume_check, of which it uses only meet and matches
#   (specification 3 :55, :56); it never calls resume_check.check, which would recompute layer 1 (specification 6 :60:
#   not recomputed). No import of writer, gitread, eventlog, execution or mcp_server. The name "compile" is a name the
#   deterministic rule refuses (aieos-checks.yml :1494, :1620), so neither the module nor its tests name it (D-2174 B1).
# - What it does not do (S3b, which waits for M7, D-2171): no reader of the inputs at the base, no MCP tool
#   (get_work_order and query stay unlisted in mcp_server.py; tests/unit/test_mcp_server.py :99 and :447 use
#   "get_work_order" as an unlisted name, a pin for S3b's contract). execution.py (TASK-032) appends the Resume Check
#   record and grants the lease with inputs its caller gives; the caller that reads those inputs is the launcher's (M7).
#
# The inputs (D-2171 C2), a dict with exactly these keys:
# - task: "TASK-" and digits; session_id: [A-Za-z0-9._-]{1,128}; base: 40 or 64 lowercase hex digits.
# - contract: the task contract read at the base, a dict of specification 2's keys (§5.1, spec 2 :94-114), with at
#   least task (equal to task), contract_version ("v" and digits), traces_to (a list of strs), write_set {paths: strs},
#   read_set {paths, interfaces, schemas: strs, an absent subkey read as [], as resume_check.py :292 does} and
#   acceptance_criteria (a list of one-entry maps from an AC id to its text); contract_hash: 64 lowercase hex digits,
#   the caller's (specification 2 §2).
# - resume_record: the Resume Check record that made the grant (spec 3 :112-136), a dict whose decision is CONTINUE or
#   CONTINUE_WITH, whose constitution is {applicable, violated, no_result: lists of article ids} (resume_check.py
#   :689), and whose subject, contract_hash and contract_version equal task, contract_hash and
#   contract.contract_version (spec 3 :113, :119; D-2174 N1); its base and HEAD are not compared with base (spec 6
#   :54).
# - articles: {article id: its text at the base}, keyed exactly by resume_record.constitution.applicable.
# - components: a list of {id, paths: strs, tags: strs}; interfaces: a list of {id, component} (spec 2 :83).
# - adrs: {ADR id: its text at the base}; an entry of contract.traces_to that is a key of adrs is an ADR; adrs holds
#   no other key. traced: {entry: its text at the base}, keyed exactly by the traces_to entries that are not ADRs.
# - files: {repository path: its text at the base}; an entry no rule below selects is ignored (D-2175 R3-3);
#   derived_read_set: a list of repository paths (spec 3 :63).
# - last_handoff: null or {ref: str, text: str}.
# - budgets: {layer name: an int above 0, not a bool, of bytes} for the five layers; required, no default (D-2171;
#   specification 6 §11 point 9: the numbers stay open).
# - Values (D-2174 N2; D-2175 R3-4): every map and the contract hold JSON values only (str, int, finite float, bool,
#   None, list, dict with str keys; a float in json.dumps's form; NaN and infinity refused), every str encodes as
#   UTF-8; anything else, a missing or extra key, or any failure gives findings, never an exception.
#
# The output (specification 6 revision 7 §5 and §6): build_work_order returns (work_order, None) or (None, findings: a
# non-empty list of strs); on findings no partial Work Order. The Work Order is a dict with exactly the keys task,
# contract_version, contract_hash, base, session_id, decision, contract, layers and work_order_hash (spec 6 :52):
# contract is every key of the contract as given (spec 6 :53); decision is the record's; work_order_hash is the SHA-256
# hex of the canonical form of the object without that key: UTF-8, keys sorted, no insignificant whitespace (this
# task: json.dumps with sort_keys, separators (',', ':') and ensure_ascii False). The same inputs give the same bytes.
# - The declared read-set is read_set.paths, read_set.interfaces and read_set.schemas (spec 3 :62); a component path
#   with no wildcard is read as "<it>/**" (spec 3 :57; D-2174 B2). The selected components are those one of whose paths
#   meets (resume_check.meet) a write-set pattern or a read_set.paths pattern, and those a read_set.interfaces entry
#   names through the interfaces input (an entry naming no given interface gives findings) (D-2175 R3-1).
# - Schemas (D-2175, spec 3 :71, :73): each read_set.schemas entry resolves to the one path of files whose last name
#   without its extension equals the entry and which lies under (resume_check.matches) a path of a component that a
#   read_set.interfaces entry names or of a component whose paths meet the write-set or read_set.paths; no such path,
#   or more than one, gives findings (fail closed).
# - layers: a list of five {layer: 1..5, name, items} in the concept's order (spec 6 :60):
#   (1) "constitution": one item per article of resume_record.constitution.applicable (not recomputed).
#   (2) "components": one item per selected component, with the interfaces that name it (the registry from declared
#   interfaces only, spec 6 :65).
#   (3) "traced": one item per traces_to entry that is not an ADR, one per AC of the contract, one per ADR.
#   (4) "files": one item per path of files that a write-set pattern or a read_set.paths pattern matches
#   (resume_check.matches), that lies under a path of a component a read_set.interfaces entry names, that a schema
#   resolves to, or that derived_read_set holds (D-2174 B3; D-2175); a pattern matching no file gives none.
#   (5) "handoff": the last handoff, or no item.
# - Items: {ref, hash, content} or {ref, hash} (spec 6 :63); every content is a str: an article's, an entry's, an
#   ADR's, a file's or the handoff's text; an AC's text; a component's the canonical JSON of {"component": <its
#   declaration>, "interfaces": [the ids that name it, sorted]} (D-2174 B4); hash is the SHA-256 hex of the content's
#   UTF-8 bytes; refs are unique within a layer (a collision gives findings); items are ordered by ref in Python's str
#   order (code points).
# - The budget: a layer's bytes are the sum of its items' content UTF-8 bytes; while over its budget, items become
#   references ({ref, hash}, never a summary or a shortened content, spec 6 :64).
#
# Stated choices (each "this task's choice; specification 6 §11 point N stays open for its next revision", D-2171):
# - The order of turning items into references: the largest content first, ties by ref (§11 point 9).
# - Item refs: an article's id; "component:<id>"; a traces_to entry as written; "<AC id>"; "adr:<id>"; a repository
#   path; the handoff's own ref (§11 points 7 and 8).
# - ADRs only through traces_to and adrs, one item each (§11 point 8); the layer and item shapes (§11 point 7); the
#   findings form and "no partial Work Order" (§11 point 13).
#
# Owner-act boundary: none reached. Nothing is launched or connected; no hook, setting, policy or measurement.
#
# Stated limits.
# - The inputs' truth is the caller's: build_work_order checks their form and their ties, not that they are what the
#   base holds; derived_read_set is not compared with the record's read_set (D-2174 N1).
# - "The last" handoff is the caller's choice (specification 6 §11 point 6 stays open).
# - No reader and no MCP tool (S3b, M7); nothing calls build_work_order but its tests.
#
# The pins (L-0026 read for what each line binds; MYSP/m6s3/pinscan80-out.txt and pinscan80-reading.md at 2c0ef3b7;
# reviews m80-R1 to m80-R3; D-2172, D-2174, D-2175):
# - tests/unit/test_writer.py :397-411 (R8): context_compiler.py makes no open, .open or .connect call and holds no
#   ".aieos" string.
# - .github/workflows/aieos-checks.yml :1489-1517 and :1597-1620 (the deterministic rule): the module and both test
#   modules get NONE: no deny-listed module (builtins among them), name (compile, open, __builtins__ among them) or os
#   call; standard library and aieos_bootstrap only; tests patch open by the string "builtins.open" and read sources
#   with pathlib's read_bytes (D-2174 N9).
# - aieos-checks.yml :1677-1721 (OPS-003's pattern rule): no MEASURED, ENFORCED or GUARANTEED without a DM row on the
#   line; no src string constant exactly valid, accepted or approved. :1727-1755 (bandit, every test on src): no bare
#   assert (B101), no try/except/pass (B110) and no try/except/continue (B112) in context_compiler.py; every caught
#   failure returns findings (D-2174 N6; D-2175 R3-6).
# - tests/unit/test_gitread.py :370-380 (only gitread imports subprocess) and tests/unit/test_autonomy.py :237-246 (no
#   src module imports or calls autonomy): met by the import set.
# - The conformance set tests (tests/integration/test_conformance_rc_set.py :153-158 and the cb and risk sets): the new
#   files name no conformance fixture folder; AC7's check takes the names from the conformance module's constants.
# - tests/unit/test_bench_isolation.py :35-52: no new file holds "bench/" (D-2174 N7).
# - tests/integration/test_ac_tests_tree.py :63: every new test names "TASK-080 ACn".
# - src/aieos_bootstrap/__init__.py is not changed (only tests/unit/test_execution.py :739-741 pins it, for execution).
#
# Risk: high, computed over the base by MYSP/m6s3/risk_class80.py (R2 medium and R3 high for each path). GOV-003:
# src/aieos_bootstrap/** is an evaluator path (aieos-checks.yml :423, :490); change class ruled at acceptance. Profile as
# TASK-079's. Reviews on Sonnet 5.5 or Opus 5.5 (never Fable). Naming (D-544 Q3): every new test function names
# "TASK-080 ACn" in its own docstring.
# Not applicable: OPS-001; INV-005 to INV-011; GOV-001, GOV-004 to GOV-006, SEC-003. INV-004 is not reached (the module
# writes nothing); it stays listed for the evaluator path's profile.
# Owner-kept acts: none in this task.
# Shadow (D-2042 C3 as amended by D-2068): the governor's evaluate at acceptance, any difference named.
# Records obligations of the acceptance (AC10; outside the write-set): the shadow's result; S3b's dependence on M7
# named; the stated choices listed for specification 6's next revision.
# Local runs: the unit group in three parts.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-080.yaml, has one parent equal to base_commit, and goes
