# handoff claim records in the event log, in specification 2 section 5.2's form, and writes it through a new
# create-only writer.write_handoff (specification 7 revision 2, section 7 :60-62; specification 6 revision 7, sections 4
# :43 and 7 :69; specification 2 revision 10, section 5.2 :116-118; DEF-0095; M7's seventh task, the last before M7's
# exit review). Plan: decisions D-2970 to D-2983 (session ea6ea0a3): the owner's word to finish M7 in this session
# (D-2970); the scope note (MYSP/t87/scope87.md) with D-2974's rulings (b2), (c), (d2), (e) and R1 to R4, its (a2)
# (docs/handoffs/) reversed to (a1) (.aieos/handoffs/) by D-2979 under INV-001 (constitution.md :29: "the core writes
# files only to the project-state directory and its logs"); the pin scan (pinscan87-out.txt at 1a193ff7) and its
# reading (pinscan87-reading.md) with D-2976's rulings (1) and (6), (5)'s prefix copy dropped under (a1); the risk run
