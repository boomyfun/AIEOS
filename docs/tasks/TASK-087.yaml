constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      compose over logs built in mcp_server's record form: a handoff of all six lists (some empty) gives "composed"
      with path ".aieos/handoffs/<task>-<session>.md" and exactly the text of the scope (front matter with session and
      commit JSON-quoted, lists in HANDOFF_LISTS order, "[]" for an empty list, items in place order, each item line's
      JSON part decoding back to its text, non-ASCII kept, U+0085, U+2028 and U+2029 written escaped, a final LF, no
      CR), with "commit: <the quoted 40 hex>" and with "commit: null", and with a session id "123"; empty and
      whitespace-only lines are skipped; claims of another session, of another task, with no refers_to, of another kind
      than "claim", and other event types are left out; a log with no handoff claim gives "none"; arguments out of form,
      a log line that is not UTF-8, not JSON or not a JSON object, a refers_to naming another file or out of form, a
      list not in HANDOFF_LISTS, a place 0, with a leading zero or not a number, an empty, non-str or unencodable (a
      lone surrogate) text, a gap (1, 3) and a repeated place each give "refused" with findings and no text; no call
      raises, and the result has exactly the keys result, path, text and findings.
  - AC2: >-
      write by stand-ins: arguments out of form (task_id not TASK-<digits>, a session_id with "/" or "\\", "." or ".."
      alone, empty or over 128 characters, a commit not 40 lowercase hex, an empty root, a callee neither None nor
      callable) give "refused" with reason "argument" and no callee called; read_log is called once with root, then
      write_handoff once with (root, task_id, session_id, the composed text) on "composed", and not at all on "none"
      ("none", path None) or on a claims refusal ("claims"); a log that is not bytes or a raising read_log gives
      "log"; a write_handoff refusal, an answer that is not a StoreResult, an answer whose findings are a string, and
      a raise each give "write", the string giving no finding item; "done" gives "written" with the path; with no
      callee given, each defaults at call time (mock.patch.object of writer.read_log and writer.write_handoff,
      restored after the test, seen called); the result has exactly the keys result, reason, findings and path; no
      call raises.
  - AC3: >-
      writer.write_handoff over real folders (tests/unit/test_writer.py, class TASK087WriteHandoff,
      tempfile.TemporaryDirectory): it creates .aieos/handoffs and the file with exactly the text's UTF-8 bytes and
      gives "done" with value ".aieos/handoffs/<task>-<session>.md", nothing else created under the root; a second call
      with any text gives "refused" with reason "exists" and the file's bytes unchanged; an existing empty file (made by
      a first call with '') is written; arguments out of form (the forms of AC2, a non-str text, a text with a lone
      surrogate) give "argument" and a root that names no existing folder "root", each creating nothing (the folder's
      file list unchanged); a link at each of root, root/.aieos, root/.aieos/handoffs and the path, given by
      mock.patch.object of writer.os.path.islink true for that one path (islink being called on each whether or not it
      exists; the path's case also run after a first call with '', when the file exists), and a realpath that differs
      from the expected one, given by mock.patch.object of writer.os.path.realpath, each give "link" with nothing
      written; an OSError raised by the open, by mock.patch('aieos_bootstrap.writer.open', create=True,
      side_effect=OSError), gives "unwritable"; a read-back that differs, by
      mock.patch('aieos_bootstrap.writer.open', create=True, side_effect=...) handing back, for the 'rb' call only, a
      stand-in whose read gives other bytes, gives "unwritable"; no finding holds caller text (no root, session id or
      task id); no call raises.
  - AC4: >-
      writer.py's names and form: its top-level names are exactly BASE's 94 plus session_leases, read_sessions,
      write_handoff and names beginning "_session_leases", "_SESSION_LEASES", "_read_sessions", "_READ_SESSIONS",
      "_write_handoff" or "_HANDOFF", all above the TASK-066 marker (R23's test widened); the TASK-066 AC3/AC6 test
      (:861-877, no makedirs after the marker) and the TASK-067 AC6 and AC9 tests pass unchanged; writer.py uses open
      only with "rb" or "ab" and os only with makedirs among the deterministic rule's refused calls; the diff of
      writer.py from the base is added lines only (checked at G3 by the scratchpad script and by the review, not by a
      unit test).
  - AC5: >-
      The module: handoff_file.py's imports are exactly json, re and writer (from aieos_bootstrap); it names no open,
      exec, eval, compile, __import__, subprocess, os, sys, time or datetime, no attribute environ, getenv, now,
      write_text or open_store, no ".aieos" string anywhere (its docstring included; the path built from
      writer.STATE_DIR), and no assert; HANDOFF_LISTS equals mcp_server.HANDOFF_LISTS and the module holds no prefix
      constant; tests/unit/test_writer.py :397-412, tests/unit/test_gitread.py
      :370-380 and tests/unit/test_autonomy.py :238-246 pass; the new test file uses no tempfile, sqlite3, shutil or
      open, roots only the literal 'C:/handoff-root-87', and uses no one-argument .replace() and no
      .replace(target=...) (aieos-checks.yml :1622-1625).
  - AC6: >-
      Docstrings: handoff_file.py's holds "the handoff file", "specification 2 section 5.2", "nothing calls write but
      its tests", "not committed", "the last handoff", "the caller's commit", "create-only", "never raises" and
      "TASK-087"; write_handoff's says create-only by a size check after opening in append mode, and that two
      concurrent writers are not excluded; writer.py's module docstring says the writer also creates
      .aieos/handoffs/<task>-<session>.md (both tested in tests/unit/test_writer.py's TASK087WriteHandoff); every new
      test names "TASK-087 ACn", checked by a naming test in tests/unit/test_handoff_file.py
      (tests/unit/test_launcher_end.py :359-364's form) over its own tests and those of TASK087WriteHandoff in
      tests/unit/test_writer.py.
  - AC7: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) the lists in another order (AC1); (2)
      an empty list written as "<list>:" with no item (AC1); (3) a gap not refused (AC1); (4) another session's claim
      taken (AC1); (5) items written without JSON quoting (AC1); (6) "commit: null" written as "commit:" (AC1); (7)
      write_handoff called on "none" (AC2); (8) a callee bound at import time (AC2); (9) a raising read_log escaping
      (AC2); (10) write_handoff writing over a non-empty file (AC3); (11) write_handoff skipping the path's link check
      (AC3); (12) write_handoff placed after the TASK-066 marker (AC4); (13) handoff_file importing os (AC5); (14)
      HANDOFF_LISTS missing "risks" (AC5); (15) write_handoff called after a "claims" refusal (AC2); (16) the tell()
      check replaced by an os.path.exists check (AC3); (17) a place with a leading zero accepted (AC1); (18) another
      task's claim taken (AC1); (19) a commit out of form accepted (AC2); (20) write_handoff skipping the realpath check
      (AC3); (21) a text with a lone surrogate not refused by write_handoff (AC3); (22) a place 0 accepted (AC1); (23)
      write_handoff skipping the read-back (AC3); twenty-three copies in all; each copy
      made in a scratchpad script at G3, not committed; the governor's evaluate at acceptance (the shadow) with any
      difference named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6]}
  - {gate: G3, check: constitution, args: [AC7, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
