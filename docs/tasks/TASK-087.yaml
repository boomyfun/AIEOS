# and test_writer.py left out; the new handoff_file.py and test_handoff_file.py are not in it) (D-2977); the reviews
# rv87a (claude-sonnet-5-5) and rv87b (claude-opus-5-5) of r0 and their dispositions (MYSP/t87/disp87.md, D-2979); the
# round-2 review rv87c (claude-opus-5-5) of r1 and its dispositions (MYSP/t87/disp87r2.md, D-2981), the ASCII fix
# (fix87.py, D-2982) and the decision agent's read of r2 in place of a third round (D-2983).
# The task's records commit amends DEF-0095 (D-2974 R1: the file's writing closed by this task; its wiring by the CLI
# frame, how the file reaches Git, the reader's place and "the last handoff" still open; D-2979 C5), under its own
# decision (docs/** is forbidden to this task's commits).
#
# Scope:
# - New src/aieos_bootstrap/handoff_file.py (D-2974 (b2), (c); D-2976 (5) as D-2979 narrowed it):
#   - HANDOFF_LISTS = ('done', 'not_done', 'assumptions', 'discoveries', 'risks', 'proposals'), its own copy, tested
#     equal to mcp_server.HANDOFF_LISTS (mcp_server.py :100); no prefix constant (the path is the writer's, D-2979 row
#     1); its imports are exactly json, re and writer (from aieos_bootstrap).
#   - compose(log, task_id, session_id, commit): pure. task_id TASK-<digits>, session_id in the session form below
#     and commit None or 40 lowercase hex, else "refused" with an argument finding. From the log's bytes, split at LF,
#     empty and whitespace-only lines skipped (mcp_server.py :293-295), each other line must decode as UTF-8 and parse
#     by json.loads (RecursionError included) as a JSON object, else "refused". It takes, in log order, the payloads of
#     the events of type "record.added" whose payload has session equal to session_id and refers_to a str beginning
#     "handoffs/" (the test of mcp_server.py :290-301), and, this task's additions, fact_kind "claim" and subject equal
#     to task_id. Each such refers_to must be exactly "handoffs/<task_id>-<session_id>.md#<list>/<n>", <list> in
#     HANDOFF_LISTS and <n> a decimal from 1 with no leading zero, and its text a non-empty str that encodes as UTF-8;
#     within each list the places must be 1 to k with no gap and no repeat. The result is a mapping with exactly the
#     keys result, path, text and findings: "none" (no such claim; path and text None; spec 6 :69: no handoff call, no
#     file); "composed" (path writer.STATE_DIR + "/handoffs/<task_id>-<session_id>.md", that is
#     ".aieos/handoffs/<task_id>-<session_id>.md", text below); or "refused" (findings, path and text None), for a bad
#     argument, a log line out of form, a refers_to out of that form or naming another file, a bad list or place, an
#     empty, non-str or unencodable text, a gap or a repeat. It never raises. The path is built from writer.STATE_DIR:
#     no string of handoff_file.py, its docstring included, names ".aieos" (R8, tests/unit/test_writer.py :388, :412;
#     the docstring says "the project-state directory"; D-2981 row 2). compose's own argument checks were added in r1
#     (D-2981 row 9).
#   - The text (spec 2 section 5.2): the line "---", then "task: <task_id>", "session: <J(session_id)>", "commit:
#     <J(commit)>"
#     or "commit: null" (the key always present, null when the caller gives none: a stated choice, spec 2 :118's "if
#     any"), then each of the six lists in HANDOFF_LISTS order, a list with no item as "<list>: []", a list with items
#     as "<list>:" followed by one line "  - <J(item)>" per item in place order, then "---" and a final LF; no body
#     (spec 2 section 5.2's free notes: none, since no claim carries them). LF only. J(x) is json.dumps(x,
#     ensure_ascii=False), with the characters U+0085, U+2028 and U+2029 then written as JSON's six-character escapes
#     (a backslash, the letter u and four hex digits)
#     (a JSON string is a YAML double-quoted
#     scalar; a stated choice; session and commit quoted so that ids like "123" or "null" stay strings).
#   - The session form (D-2979 row 3): [A-Za-z0-9._-]{1,128}, mcp_server's (mcp_server.py :137, :147), with "." and
#     ".." alone refused; the same in compose, write and writer.write_handoff.
#   - write(root, task_id, session_id, commit, read_log=None, write_handoff=None): checks its arguments (task_id
#     TASK-<digits>; session_id in the session form; commit None or 40 lowercase hex characters; root a non-empty str,
#     its form left to the writer; each callee None or callable),
#     reads the log once by read_log(root) (default writer.read_log at call time), composes, and on "composed" calls
#     write_handoff(root, task_id, session_id, text) once (default writer.write_handoff at call time). It returns a
#     mapping with exactly the keys result ("written", "none" or "refused"), reason (None, or "argument", "log",
#     "claims" or "write"), findings (a list of str) and path; a log that is not bytes or a raising read_log gives
#     "log"; compose's refusal gives "claims"; a write_handoff answer that is not StoreResult "done", or a raise, gives
#     "write" with its findings (only the str items of a list or a tuple, as DEF-0102's rule). It never raises and
#     writes nothing itself. Nothing calls write but its tests (D-2974 R1).
# - In src/aieos_bootstrap/writer.py, by added lines only, above the marker "# ---- the read-only lookup of the store
#   (task TASK-066) ----" (tests/unit/test_writer.py :861-877, :1726-1738), one public function and its private
#   helpers (D-2974 R2; D-2976 (1)):
#   - write_handoff(root, task_id, session_id, text): checks task_id by _check_task's form (TASK-<digits>),
#     session_id against [A-Za-z0-9._-]{1,128} with "." and ".." alone refused, and text a str ('' accepted) that
#     encodes as UTF-8, all before anything else ("argument"); root by _check_root (an existing folder), a refusal
#     reported by the exception's type only, as _named does (writer.py :777-780; D-2981 row 11); the path is
#     root/.aieos/handoffs/<task_id>-<session_id>.md, inside the project-state directory (INV-001's tool part,
#     constitution.md :29; spec 2 section 3 :35; D-2979 row 1). It refuses ("link") when root, root/.aieos,
#     root/.aieos/handoffs or the path is a link, os.path.islink being called on each of the four whether or not it
#     exists (D-2981 row 6), or when the path's
#     os.path.realpath, normcased, is not equal to the normcased realpath of root joined with ".aieos", "handoffs" and
#     the file name (_store_present's form, writer.py :579-585); the realpath check runs before os.makedirs, after it,
#     and before the open. It makes root/.aieos/handoffs by os.makedirs(..., exist_ok=True) (the writer's allowance:
#     makedirs; aieos-checks.yml :1506-1507), opens the path with open(path, 'ab'), and if f.tell() is above 0 refuses
#     ("exists") with nothing written; otherwise it writes the text's UTF-8 bytes, then flush and os.fsync, then reads
#     the file back with open(path, 'rb'), whose bytes must equal the text's, else "unwritable" (the file then stays).
#     The result is a StoreResult: "done" with value the path relative to root, ".aieos/handoffs/<task_id>-
#     <session_id>.md"; or "refused" with one finding, reason "argument", "root", "link", "exists" or "unwritable" (an
#     OSError, or a read-back that differs). No finding holds caller text. No exception escapes. The module docstring
