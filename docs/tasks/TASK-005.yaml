acceptance_criteria:
  - AC1: >-
      The file kind (conformance-files.md section 2). Every fixture file is, byte for byte, the first part DATA = r'''
      then a JSON text then the last part ''' and one LF; the JSON text holds no ''' and is in the canonical form of
      section 2: UTF-8 without a byte-order mark, LF line ends, object keys sorted by code point, an indent of two
      spaces with one key or list item per line, [] and {} for empty values, integers only, only " and \ escaped with a
      backslash in strings and control characters as \u with four lowercase hex digits, one final LF; re-serialising the
      parsed JSON text in that form gives the same bytes. The path is tests/conformance/fixtures_rc/<module name>.py,
      the module name being the scenario id in lowercase with - replaced by _ (sections 2 and 9). The tests read each
      file's bytes with pathlib's read_bytes and never import or execute a fixture module.
  - AC2: >-
      The fixture file (section 9). Its JSON object has exactly scenario, row_hash and cases; scenario is its id and
      row_hash the SHA-256 of that scenario's row line in the bound scenario file without its line end (recomputed by the
      tests from the bound file; section 3's method); cases holds exactly one case (each Given names one task). The case
      has exactly inputs, when and expected. when is resume. expected is exactly {decision, not_fixed} with not_fixed []
      and decision a list of exactly one A15 decision value (CONTINUE, CONTINUE_WITH, REPLAN, BLOCKED, ESCALATE, STOP:
      violation, STOP: scope invalid, STOP: runtime insufficient), the one the scenario's Expected cell names; a list
      with any other value, or more or fewer than one, is a failing case of the tests. inputs has exactly the 22 keys of
      section 9's inputs row (task_id, log_seq, task_state, contract, contract_hash, approved_contract_hash,
      head_commit, base_is_ancestor, commits, components, interfaces, symbols, schemas, derived_read_set,
      observed_read_set, intent_current, dependencies, articles, runtime, risk_rules, policy_version, budget_use) in
      that row's forms: task_id TASK- followed by digits; log_seq an integer of 0 or more; task_state READY, REWORK or
      IN_PROGRESS; contract an object with at least input_state (base_commit, depends_on, intent_versions), write_set,
      read_set, constitution, task_type, risk and autonomy.budgets in specification 2 §5.1's form; contract_hash and
      approved_contract_hash 64 lowercase hex; head_commit and input_state.base_commit full lowercase hex commit ids;
      base_is_ancestor true or false; commits a list of {id, paths, submitted} with paths a list of {path, change},
      change added, modified or deleted; symbols a list of {interface, base, head}; schemas a list of {name, base,
      head}; observed_read_set a list or null; dependencies one {state, stale_evidence} per task of depends_on, keyed by
      task id; articles a list of {id, scope, applicability, violated}, violated true, false or null; runtime {adapter,
      max_risk}; budget_use one {used, reported} per budget of autonomy.budgets.
  - AC3: >-
      Faithfulness (sections 5 and 9). expected.decision comes only from the scenario's own Expected cell: the unit
      tests hold, for each of RC-01 to RC-11, the expected value together with the text of its Expected cell, and check
      both that this text equals the cell in the bound file and that the fixture's expected.decision is the one-item
      list of that value. The Given comes from the scenario's Given cell and the Resume Check defaults of the set's
      section 1; values none of these fix (ids, hashes, log_seq, adapter names) are placeholders of their specification
      2 form, and no expected element depends on them. A scenario that no fixture can realise faithfully gets no file,
      is listed with its reason in the test module and in the acceptance request, and is never re-expected, narrowed or
      replaced (section 5; CR-002 part 4 limit 8).
  - AC4: >-
      The placeholder constraints (section 9), each a test over every fixture with the exception that section 9 names:
      approved_contract_hash equals contract_hash; base_is_ancestor is true; intent_current equals
      contract.input_state.intent_versions for every entity (RC-06 apart); contract.risk, and the class of every rule
      of risk_rules whose pattern meets a write_set.paths pattern, are at most runtime.max_risk, and every write_set.paths
      pattern is met by at least one rule (RC-09 apart); every symbols and schemas entry resolves at both commits (not
      null, not ambiguous) and, where the scenario needs Δ to miss it, lies outside Δ; every dependency is DONE with
      stale_evidence false (RC-07 and RC-11 as their Givens say); no article is violated or without a result where it
      applies (RC-08 apart); every budget's use is under its limit (RC-10 apart); and where a scenario names the declared
      read-set (RC-02 to RC-06), derived_read_set and observed_read_set do not meet Δ. Δ is the union of the paths of
      commits; every path pattern in a fixture is either a literal path or a folder followed by /**, and the tests decide
      "meets" and "matches" for those two forms as specification 3 §3 does (a literal matches itself; folder/** matches
      every path under that folder, and two patterns meet when one path could match both).
  - AC5: >-
      Each scenario's Given (the set's section 4 and section 1), each a test: RC-01 head_commit equals
      input_state.base_commit and commits is []; RC-02 to RC-06 head_commit differs from base_commit and commits is not
      []; RC-02 Δ meets neither write_set.paths nor read_set.paths; RC-03 Δ meets write_set.paths and no commit is
      submitted (section 9: "the conflict cannot be resolved automatically" is no input); RC-04 Δ misses write_set.paths
      and meets read_set (a path entry, or an interface whose component's paths Δ meets, or a schema whose file Δ
      matches), and every symbols and schemas entry has base equal to head; RC-05 as RC-04, but at least one symbols
      entry of a met interface has base different from head; RC-06 commits is exactly one commit whose paths are one
      path, the file of one entity of intent_versions, intent_current gives that entity a newer version, every other
      entity is current, and Δ meets neither write_set.paths nor read_set; RC-07 one dependency's state is STALE; RC-08
      exactly one applicable article has violated true; RC-09 runtime.max_risk is below contract.risk; RC-10
      budget_use.retries.used is over the contract's retries limit; RC-11 one dependency is DONE with stale_evidence
      true. In each, no other check of specification 3 §2 would fire on the fixture's inputs by AC4's constraints.
  - AC6: >-
      What stays unchanged, and limits, stated and tested as such: the task changes no existing file (the integration
      test checks that tests/conformance/set.py has the SHA-256 that the set file's freeze approval in
      docs/records/TASK-002.jsonl binds, and that its entries for RC-01 to RC-11 are null); no file under
      tests/conformance/fixtures/ is added; the only modules that read tests/conformance/fixtures_rc/ are this task's
      three test modules (a test lists every .py file under src/ and tests/ and finds the folder's name in no other);
      the files are data for a Resume Check and a runner entry that do not exist yet, so nothing here shows that any
      Resume Check meets them, and every RC scenario is NOT_RUN until TASK-005b names them in the set file and a Resume
      Check runs in the CI channel; the tests check form, the binding to the bound file and the expected values against
      the Expected cells' text, never a Resume Check's behaviour; no file is frozen before the acceptance's freeze
      approvals; no expected value uses a name that a later specification defines.
  - AC7: >-
      Purity and the CI checks (INV-001, INV-002, INV-004; conformance-files.md section 2). The test modules import only
      the Python 3 standard library; they use no exec, eval, compile, __import__ or importlib, start no process, open no
      network connection, call no model, write no file, and read files only with pathlib's read_bytes; each fixture
      module holds one assignment of one string. The CI steps at the task's commits report no finding: deterministic_rule
      (its file, import and pattern rules over every file under src/ and tests/), OPS-003 (an effect label MEASURED,
      ENFORCED or GUARANTEED only with a decision-matrix row on its line), SEC-001 and SEC-002 (no secret pattern,
      e-mail address or GitHub URL in any added line, file name or message), and bandit as the static_security_analysis
      step runs it; the existing tests still pass, unchanged. Before each commit, the fixture and test text is scanned
      with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0.
  - AC8: >-
      Tests. Unit tests (tests/unit/test_conformance_rc_files.py) cover each rule of AC1 to AC5 with at least one passing
      case and one failing case, the failing cases built in memory from altered copies of the files; one integration test
      (tests/integration/test_conformance_rc_set.py) checks, end to end, the 11 files against the bound scenario file
      and the set file (AC6), and that the folder holds exactly those 11 files; the property tests
      (tests/property/test_conformance_rc_properties.py; standard library only, fixed seeds) check that re-serialising
      any fixture is idempotent, that any one-byte change of a fixture changes its hash, that any reordering of keys is
      not canonical, that the same input always gives the same result, and these properties of the invariants the task
      relates to: for INV-005, every expected decision is exactly one A15 value; for INV-006, no expected decision is an
      acceptance value (ACCEPT, NEEDS_REVIEW, REJECT, INSUFFICIENT_EVIDENCE, REPAIR_ALLOWED), so the execution and
      acceptance decisions stay apart (A15); for INV-007, every fixture's contract names base_commit and intent_versions,
      and the one fixture whose intent is not current (RC-06) expects REPLAN; for INV-008, no fixture's inputs hold a
      record or a source_class, so no agent-declared record stands as evidence in any case. tests/run_tests.py,
      unchanged, runs all three groups.
