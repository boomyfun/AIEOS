# Task contract TASK-005, the fixtures of the 11 Resume Check scenarios of gov-AIEOS (Master Plan revision 3, §4 M3;
# the M3 work order of decision D-254, as amended by decisions D-262 and D-263; specification 2 §5.1). Revision 0,
# drafted under decisions D-261 (C3), D-262 (C1, C4) and D-263 (C2, C3), brought for approval in D-267; whether it is
# approved is recorded in the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and
# TASK-002's contract.
# Task type: fixture (docs/specs/conformance-files.md section 8, revision 4). Every changed path is a file of that
# document's section 9 under tests/conformance/fixtures_rc/ or a new test module test_conformance_rc_*.py directly under
# tests/unit/, tests/integration/ or tests/property/. GOV-002 does not apply, as the constitution writes its
# applicability (implementation, refactoring); every other article whose applicability names implementation is applied
# as to an implementation task, so no evidence requirement narrows (section 8; CR-002 part 4 limit 8).
# The cut (D-262 option (a); D-263 option (iii)): this task adds only the 11 fixture files and their own test modules.
# It changes no existing file: tests/conformance/set.py stays as frozen at TASK-002's acceptance (its freeze stands),
# with the entries of RC-01 to RC-11 null, so no conformance run reads these files and every pinned base run is
# unchanged. TASK-005b, a later fixture task placed after TASK-008, gives the set file the 11 entries,
# fixture_set_version 2 and a new set freeze, and changes the TASK-002 set tests that this needs (test_conformance_set.py
# :181, :196, :200, :205-207 and the same checks in test_conformance_files.py and test_conformance_properties.py); its
# placement against O1 is settled in its own contract. TASK-006's contract makes the runner's path check
# capability-aware (conformance-files.md section 9, revision 4), with the Verification path unchanged, and its
# dependency reads "TASK-005 accepted and its 11 files frozen".
# Readers (D-262 C4, D-263 C3): the CI workflow's conformance base and candidate runs read fixtures only through set
# entries (conformance.py:532-541); its unit_test, integration_test and property_test steps run every test_*.py of the
# three test folders; the seven existing test modules that list a fixtures folder (test_runner.py:33,
# test_runner_run.py:22, test_runner_properties.py:29 and test_governor_conformance.py:50 by glob('*.py');
# test_conformance_set.py:336 and :354, test_conformance_files.py:336 and test_conformance_properties.py:337 by
# iterdir) all list tests/conformance/fixtures/ only, not recursively; at base_commit no file under src/, tests/ or
# .github/ names tests/conformance/fixtures_rc/ (checked by script for this contract). After this task only its own
# three test modules read that folder (AC6).
# Risk: critical. R11 matches tests/conformance/** (critical); R3 read fail closed matches tests/** (high); the highest
# wins (risk rules section 2 point 1). Profile (assurance-model.md §5, gov-AIEOS, critical): medium's entries, high's
# entries and critical's: unit_test, integration_test, property_test, deterministic_rule, static_security_analysis,
# ai_review (cross-model) and human_review; plus the evidence_required of the applicable articles. Dimensions are named
# as TASK-002's records name them (decision D-181, reading R-dim).
# Change class: normal_cr with a fixture-freeze approval on each fixture file's hash (DM B1, B10, with the A51 note;
# conformance-files.md section 7 and section 9, last bullet); it changes the evaluator (A29 counts fixtures and
# scenarios), so it is judged by the base version and never auto-accepted (constitution GOV-003; governor-spec.md §8).
# Freeze approvals: given by the decision agent in the decision that accepts this task, as separate elements before
# the acceptance itself, one per fixture file (11), each an authority record with approval_binding {kind:
# change_request, hash} in docs/records/TASK-005.jsonl, and one DM section F row that lists the 11 hashes; no set-file
# freeze (the set file does not change; D-263 C2).
# Reviews (as TASK-002's): five way-2 reviews by a Claude model other than the implementer's, each under a decision of
# the decision agent (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002; governance
# ai_review for GOV-003; operational ai_review for OPS-003; the cross-model half), and three decision-agent reviews
# (architecture human_review, which is both INV-003's entry and the critical profile's, and which also checks that
# every fixture is faithful to its scenario and that the property tests cover the related invariants
# (assurance-model.md §5); operational human_review for OPS-002; the cross-model half). Each way-2 review record's basis
# names every article whose entry it covers and addresses each of their rules, beyond what the tool parts decide.
# Evaluation path (A61; as TASK-002's, D-181 P1 and D-182): the approved contract is committed on main as its own commit
# C, which changes only docs/tasks/TASK-005.yaml and has one parent equal to base_commit, and is pushed normally; the
# files are drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's
# commits, each carrying the trailer "AIEOS-Task: TASK-005" and no e-mail address in its message, go to the branch
# task/TASK-005 on GitHub, each push under its own decision of the decision agent after a secret scan, never by force
# and never deleting; the CI channel runs on each push and its records are re-fetched into docs/records/TASK-005.jsonl;
# main receives the task only at its acceptance, by a fast-forward under its own decision. Before each task commit, the
# added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns (AC7). The first push of the task's
# commits is the first task push of M3, so it exercises the pinned conformance base run on GitHub (D-241's limit); its
# result goes to the decision agent first, and a failure is an M2 defect, fixed first.
# Not applicable: GOV-002 (above); OPS-001 (scope: the repository's refs; the task changes no ref); INV-009, INV-011,
# GOV-001, GOV-004, GOV-005, GOV-006 and SEC-003 (their scopes, the event log, the policy, the concept file, the bound
# artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Uncovered (conformance-files.md section 9, "Not covered"): the fixtures give the inputs of specification 3 §1 as
# values, so how the Resume Check reads them from Git, the event log, the files at HEAD and the runtime, derives its
# read-set and computes a symbol's fixed form is not tested by these files; no Resume Check and no runner entry for it
# exist, and the set file names none of these fixtures, so every RC scenario stays NOT_RUN and nothing here shows that
# any Resume Check meets a fixture; the tests check a fixture's Given only through the checks AC4 and AC5 name, with the
# path rule of specification 3 §3 for the two pattern forms AC4 allows; every review is by AI of one vendor.
task: TASK-005
contract_version: v1
task_type: fixture
objective: >-
  Add the executable fixtures of the 11 scenarios of the Resume Check capability (RC-01 to RC-11) of the bound initial
  scenario set, set version 2, in the formats of docs/specs/conformance-files.md revision 4, sections 2 and 9 (Python
  modules under tests/conformance/fixtures_rc/ that wrap canonical JSON text byte-exact), each fixture faithful to its
  scenario's own Given and Expected cells and the set's Resume Check defaults, with unit, integration and property
  tests that check only those files against that document, specification 3 and the bound scenario file. It changes no
  existing file, adds no set-file entry, no runner entry and no Resume Check, and freezes nothing: the freeze approvals
  are given at its acceptance.
