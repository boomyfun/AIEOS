  - .gitignore
constitution: [INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      No port changes. At the task's head every file under bench/ is byte-equal to base_commit (the three ports'
      accepted bytes: bench/ts at TASK-043's, bench/go at TASK-044's, bench/rust at TASK-045's manifests), checked by
      script before each push.
  - AC2: >-
      The go step (item 6; A66). In each job, the go step's command `test -z "$(gofmt -l .)"` becomes
      `out="$(gofmt -l .)" && test -z "$out"`, so a gofmt that fails ends the step; nothing else in the go step's
      existing lines changes.
  - AC3: >-
      The probes (item 9; A66). In each job, each port step, after its compare line and before its tests, runs its
      program once with no argument, its standard output redirected to a file in "$RUNNER_TEMP" named
      <port>-noarg.txt: TypeScript `(cd bench/ts && node main.ts)`; Go `"$RUNNER_TEMP/go/port.exe"`; Rust the binary
      cargo built, chosen by `p="$RUNNER_TEMP/rust/release/port"; if [ -f "$p.exe" ]; then p="$p.exe"; fi` and run
      as `"$p"`; in the form
      `if <program> > <file>; then echo "<port>: the port exits 0 with no argument"; false; fi` followed by
      `test ! -s <file>`, so a zero exit or any byte on standard output ends the step (the step runs under bash -e).
      The form holds no "exit 1" (TASK-043's test counts that string once per job, in the type-check step).
  - AC4: >-
      The header (item 8; A66). The header states that each job makes one download, the pinned type checker, checked
      by its integrity value before use, and that every port's own toolchain (node, go, cargo and rustc) is the
      runners' and is not downloaded; it names CGO_ENABLED=0 with the Go step's settings, the no-argument probes and
      gofmt's exit; its revision line goes from 4 to 5 and names this task. Nothing else in the workflow changes: no
      download, curl, trigger, permission, secret, token, `uses:` or type-check byte.
  - AC5: >-
      The earlier pins. In tests/unit/test_export_fixtures.py the constants GO_STEP, TS_PORT_STEP and RUST_STEP each
      become the whole new step's bytes of AC2 and AC3 (an update of a pin to the A66 bytes); no assertion of any
      earlier test is removed, weakened or reworded, and every earlier test passes over the change.
  - AC6: >-
      The new pins (items 1 to 5), in one new test class of tests/unit/test_export_fixtures.py whose docstrings start
      with TASK-046: bench/ts, bench/go and bench/rust each exist as a folder; bench/ts's file set is exactly its ten
      files and bench/go's exactly its eight (no other file, no subfolder); bench/ts/tsconfig.json's exact bytes;
      bench/rust/Cargo.lock's exact bytes; and over every .rs file of bench/rust, none of TASK-045 AC3's forbidden forms
      (`unsafe`, `extern`, `extern crate`, `#![feature`, `#[path`, `include!`, `include_str!`, `include_bytes!`,
      `env!`, `option_env!`, std::process, std::net, a std::env item other than std::env::args, a std::fs item other
      than std::fs::read), matched as whole words. Each test can fail: the scan's helper is also run over a short
      in-memory sample holding a forbidden form and must find it.
  - AC7: >-
      Isolation (decision D-800 C3; the risk rules policy revision 6, R12). tests/unit/test_bench_isolation.py,
      unchanged, passes.
  - AC8: >-
      The CI checks and purity. At the task's commits the existing CI steps report no finding: G0 scope,
      deterministic_rule, OPS-003, SEC-001, SEC-002, SEC-003's record and bandit; every earlier test passes; the added
      Python lines are scanned for the bandit test patterns the CI applies before the first push, as in TASK-045 AC9;
      if any earlier test can pass only by a change outside the write-set, the task escalates
      (needs_out_of_scope_change).
  - AC9: >-
      Local evidence before the first push. The suite on a compiled tree in a scratch clone with the head's files
      (L-0018); each new or changed step's shell form run on this machine where its program exists: the TypeScript
      probe under node, and the probe form with a stand-in command that exits 0 (the probe must fail) and one that
      exits 1 with no output (the probe must pass); the earlier local no-argument probes of the Go and Rust programs
      cited (TASK-045 local-runs.txt line 18; TASK-043's and TASK-044's local runs).
  - AC10: >-
      Naming. Every Python test function the task adds names "TASK-046 ACn" in its own docstring; no existing test's
      docstring changes; tests/run_tests.py is unchanged and runs no export or port.
  - AC11: >-
      Stop conditions. If any step needs a secret, a token, write access, money, a setting or anything installed
      outside the scratchpad, or any file under bench/ would change, the task stops and the point goes to the decision
      agent, and to the owner when it is the owner's (A66, fail closed).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell:
    allow:
      - "timeout 110 python tests/run_tests.py < /dev/null"
      - "node main.ts (in a scratch copy of bench/ts, no argument, for AC9's probe check)"
  network:
    allow: []
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 500k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC5, AC6, AC7, AC10]}
  - {gate: G3, check: constitution, args: [AC1, AC2, AC3, AC4, AC8, AC9, AC11, INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
