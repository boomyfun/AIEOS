acceptance_criteria:
  - AC1: >-
      The paths (INV-004; specification 2 section 3). Every function takes root, an existing folder given by the caller,
      and touches only two files under it: <root>/.aieos/events.jsonl and <root>/.aieos/local/state.sqlite, creating
      <root>/.aieos/ and <root>/.aieos/local/ when absent; no other path is opened, created, renamed or removed by the
      module, and the store includes SQLite's own rollback journal <root>/.aieos/local/state.sqlite-journal, which
      SQLite creates and removes during a transaction (the default rollback journal mode; no WAL). A root that is not an
      existing folder raises before anything is opened.
  - AC2: >-
      append_event (specification 1 section 4; TASK-007, TASK-015). append_event(root, event_type, payload, event_id,
      appended_at, recorder, task_id=None, fencing_token=None, corrects=None) reads the log file's bytes (empty when
      absent), takes the lease append needs from the store (held_lease of AC6 for the event's task, None when there is
      none), and calls eventlog.append with recorder and a record_id derived as in AC3; on "appended" it appends exactly
      the returned line to the file opened with mode "ab", flushes and syncs it, and reads the file back to check that
      its bytes are the given bytes followed by that line (INV-009); if that check fails, append_event raises, writes
      nothing more and repairs nothing (fail closed); on "duplicate" or a refusal it writes nothing of the event. A log
      file that append refuses with reason "log" (a damaged or cut last line) is never extended and
      never repaired (AC10). recorder must be a non-empty string, else ValueError before anything is read: the writer
      always gives append what it needs to build a refusal's record (DEF-0030; decision D-405, disposition (h)).
  - AC3: >-
      Every refusal recorded (specification 1 section 8: "The refusal is recorded as an observation"). When append
      refuses an event with reason "fence" and returns its record, append_event appends that record as one record.added
      event through append, with the event's task_id, event_id the SHA-256 hex digest of the UTF-8 text "refusal" and
      the refused event's event_id joined by LF, and record_id the same digest of "refusal-record" and that event_id; a
      retry of the same refused event appends nothing new (idempotency, concept line 856). A fence refusal without a
      record (an event naming no task_id, TASK-015's choice (r1)) is returned with its findings and records nothing
      (reading: no subject exists for it); the result says so.
  - AC4: >-
      The store (specification 2 section 3; specification 1 section 8). open_store(root, epoch=None) creates the SQLite
      file with exactly the tables store (epoch, counter), leases (task_id, holder, session_id, fencing_epoch,
      fencing_counter, granted_at, expires_at) and sessions (session_id, holder, started_at, ended_at) when it does not
      exist, with one store row whose epoch is the given text or, when None, secrets.token_hex(16), and counter 0; an
      existing store is opened unchanged and a given epoch that differs from its own raises. A new store (after a lost
      one) has a new epoch, so a token it grants never equals an earlier store's token (spec 1 section 8).
  - AC5: >-
      Grants (specification 1 sections 5.2 and 8). grant_lease(root, task_id, task_state, holder, session_id, now,
      expires_at) grants a lease only when task_state is READY or REWORK (the caller's reading of the log; the store does
      not project it), no lease on task_id is held, expires_at is after now, and the session is started and not ended;
      it increases the counter by one and inserts the lease in one SQLite transaction, and returns the lease in
      eventlog.LEASE_KEYS' form (task_id, fencing_token {epoch, counter}, expires_at); any other case returns a refusal
      with its reason and changes nothing. The caller runs the Resume Check first (specification 3 section 1); the store
      does not.
  - AC6: >-
      Release, expiry and lookup. release_lease(root, task_id) removes the held lease on task_id and returns it, or
      None; expire_leases(root, now) removes every lease whose expires_at is at or before now and returns them, oldest
      first (spec 1 section 8: "An expired lease is expired, whatever its holder believes"; recovery step 5);
      held_lease(root, task_id) and held_leases(root) return the held leases in eventlog.LEASE_KEYS' form, as recovery's
      reconcile takes them. Times are timezone-aware UTC datetimes, stored as ISO 8601 text with "Z".
  - AC7: >-
      Sessions. start_session(root, session_id, holder, now) inserts a session once (a second start of the same id is
      refused); end_session(root, session_id, now) sets ended_at once and releases the session's leases; both return
      what they did.
  - AC8: >-
      The single writer and the imports (INV-004, INV-001, INV-002). The module imports only the Python 3 standard
      library (datetime, hashlib, json, os, secrets, sqlite3 among the allowed), aieos_bootstrap.records and
      aieos_bootstrap.eventlog; it opens files only with the builtin open on the log path (modes "rb" and "ab") and
      sqlite3.connect on the store path (SQLite's own journal beside it, AC1, default rollback mode); no other module of
      src/ changes except __init__.py's docstring and __all__; a
      script check lists every Import, every call of open and every string naming the directory in src/, and they are
      only in writer.py.
  - AC9: >-
      Purity of what remains and the CI checks. No exec, eval, compile, __import__ or importlib; no process, network or
      model call; the clock is read nowhere (every time is an argument; secrets is used only for a new store's epoch);
      no assert in src (bandit B101). With revision 7 on main, the CI steps at the task's commits report no finding:
      deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC10: >-
      Limits, stated and tested as such where they can be: a damaged last line is refused and never repaired; a failed
      read-back after an append raises and repairs nothing; no lock
      beyond SQLite's own transaction (one task at a time, concept line 951); the caller runs the Resume Check before a
      grant and gives the task's state; no .gitignore change (carried); no caller in the core yet; every existing module
      and test not in the write set is unchanged, and if one can pass only by a change the task escalates
      (needs_out_of_scope_change).
  - AC11: >-
      The added text. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0; the file names are scanned with the same patterns and the records executors'
      pre-push pattern (D-282).
  - AC12: >-
      Tests, each rule with at least one passing and one failing case, each test in its own temporary folder: R1 AC1
      (the two paths only, checked after each transaction ends, created on first use; a root that is not a folder); R2
      AC2 (an append, a duplicate, a refusal
      writing nothing; the file equal to the given bytes plus the line; a cut last line never extended; recorder
      required); R3 AC3 (a fence refusal recorded once, its ids, a retry appending nothing; no record for no task_id);
      R4 AC4 (the tables, the epoch given or random, an existing store unchanged, a differing epoch refused, a new store
      in another folder, standing for a lost one, giving tokens unequal to the first store's; no test calls a removal
      function itself; each temporary folder is removed by tempfile's own cleanup); R5 AC5 (each refusal reason; the
      counter only increasing);
      R6 AC6 (release, expiry at and before now, lookups in LEASE_KEYS' form); R7 AC7; R8 AC8 (the script check of the
      imports, opens and directory strings). Unit tests in tests/unit/test_writer.py; integration tests in
      tests/integration/test_writer_files.py (a full flow: a session, a grant, appends under the lease, a refused
      submission recorded, recovery's reconcile over the file's bytes and the store's held leases, expiry); property
      tests in tests/property/test_writer_properties.py (standard library only, fixed seeds): for random sequences of
      appends, grants and releases, the file's bytes only grow and every earlier prefix is kept (INV-009), records.check_log
      finds nothing, and no two grants ever carry the same token. tests/run_tests.py, unchanged, runs all groups.
