# Task contract TASK-016, the event log's single file writer and the local store (Master Plan revision 3, §4 M3:
# "the core's single writer"; DEF-0030; specification 2 §5.1). Revision 0, drafted under decisions D-401 (S2, C2, C3)
# and D-406 (C2), brought for approval in its own request; whether it is approved is recorded in the decision files,
# not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-015.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: one module, src/aieos_bootstrap/writer.py, the only module of the core that
# opens files in the project-state directory for writing (constitution INV-004's code rule), holding both the event
# log's file writer (specification 1 §4; specification 2 §3 and §6.1, events.jsonl) and the local store of leases and
# sessions (specification 1 §5.2 and §8; specification 2 §3, local/state.sqlite, SQLite), in one module because the
# store lives inside the same directory (decision D-401: one task, one module). Every event line is decided by
# TASK-007's eventlog.append as TASK-015 left it; the writer only reads the log's bytes, calls append, and appends the
# returned line to the file.
# Order (decisions D-401 C2 and D-406): this contract is approved first and not committed; then the CI workflow's
# revision 7, the deterministic_rule step's exemption for exactly the paths of this write set, sized to what this
# contract's code needs (section "What the exemption must allow" below), as the decision agent's own .github/ decision
# under DM A66, named as a loosening of a check; then commit C of this contract; then the code. Without revision 7
# this task's CI fails by construction (the step refuses `open`, `sqlite3`, `tempfile`, `os.makedirs` and any string
# naming the directory in src/), so G0's base_commit must be at or after revision 7's commit.
# What the exemption must allow (for revision 7; each allowance justified by an AC of this contract):
# - in src/aieos_bootstrap/writer.py only: the builtin name `open` (AC2 reads the log with mode "rb" and appends with
#   mode "ab"; AC2 opens nothing else); `os.makedirs` (AC1 creates the directory and its local/ folder); `os.fsync`
#   (AC2; not refused today); the module `sqlite3` (AC4 to AC7); `secrets` is not refused (AC4's epoch); a string naming
#   the project-state directory (AC1's two fixed relative paths). Not needed, so not to be allowed: the attribute call
#   `.open` (the module uses the builtin and sqlite3.connect, not Path.open or io.open), `os.replace`, `os.rename`,
#   `os.remove`, `shutil`, `tempfile`, any process or network module;
# - in the three test modules of the write set only: the modules `tempfile` (each test works in its own temporary
#   folder, removed by the context manager) and `sqlite3` (tests read the store back), and the builtin `open` (tests
#   read the files back, and write a damaged log line to test AC2's refusal); nothing else.
# Reading of INV-004 for the tests (decision D-407 C1 (d)): INV-004's code rule is "inside the core", so the test modules
# may write into their own temporary project-state folder only to make a damaged log for AC2's refusal; no test writes
# outside its temporary folder.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain writer; it must not name the Resume Check
# fixture folder (TASK-010's assertion). No module of the repository calls the writer yet: governor.py, conformance.py,
# resume_check.py and recovery.py stay pure and forbidden here.
# Risk: high. R2 matches src/** and tests/** (medium); R3 read fail closed matches them too, the writer and the store
# being where the fence's tokens are made (spec 1 §8; risk rules section 2 point 3); no path of the write set meets R10
# (.aieos/) or R11 (tests/conformance/**); the highest wins. Profile (assurance-model.md §5, gov-AIEOS, high):
# functional [unit_test], architecture [deterministic_rule], functional [integration_test], security
# [static_security_analysis] and architecture [ai_review (cross-model)], plus the evidence_required of the applicable
# articles.
# Change class: critical_cr (to be computed over the base by script, as for TASK-009 and TASK-015: all write-set paths
# are on the workflow's pinned evaluator list).
# Reviews (as TASK-015's): five way-2 reviews by a Claude model other than the implementer's, and the decision agent's
# three, each brief naming for testing: that only writer.py opens files in the directory and only the two fixed paths;
# that every line is append's; the fence's tokens never repeat after a store is recreated; the limits of AC10.
# Evaluation path (A61; as TASK-007 to TASK-015): revision 7 on main first; then commit C, which changes only
# docs/tasks/TASK-016.yaml and has one parent equal to base_commit; the task's commits, each carrying "AIEOS-Task:
# TASK-016", go to task/TASK-016 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the
# governor, evidence records and the policy meet no path of the write-set); GOV-001, GOV-004 to GOV-006 and SEC-003
# (the concept file, the bound artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet
# no path of the write-set; revision 7 is its own decision). INV-009 (scope: the event log) applies directly: this
# module is the first code that writes an event log file.
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/ (revision
# 7 is a separate decision, the decision agent's under DM A66 unless it grants write access, secrets or settings), no
# Claude Code setting, no push of its own.
# Departures from proposed text, stated openly: specification 2 §3 says `.aieos/local/` is "listed as ignored by Git";
# this task adds no .gitignore line (no .aieos/ exists in the repository, and the CI refuses any changed path under it),
# carried to the task that first creates a real project-state directory (decision D-401 C3). Specification 1 §5.2
# grants a lease "only on a task in READY or REWORK": the store cannot project task states from the log, so the caller
# gives the task's state and the store refuses any other (reading). Specification 3 §1: a lease is granted only after the
# Resume Check's CONTINUE or CONTINUE_WITH; the store does not run the Resume Check; the caller does (decision D-401).
# Uncovered and stated limits (AC10): no repair of a damaged last line; no lock beyond SQLite's own transaction (v0.1
# runs one task at a time, concept line 951); no caller in the core yet; every review is by AI of one vendor.
task: TASK-016
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/writer.py, the core's single writer of the project-state
  directory: append_event appends one event to <root>/.aieos/events.jsonl, every line decided by TASK-007's
  eventlog.append, flushed and synced, and records every fence refusal as its own record.added event; and the local
  store <root>/.aieos/local/state.sqlite (tables store, leases and sessions of specification 2 section 3) creates its
  epoch once, grants one lease per task with a counter that only increases, and releases, expires and looks up leases
  in the form append takes, and starts and ends sessions; with unit, integration and property tests in new test
  modules, each in its own temporary folder. The time is always an argument; no other file is opened for writing.
