acceptance_criteria:
  - AC1: >-
      (DEF-0034 F-a, its CONTINUE half) records.check_decision gives a "6.4:checks" finding for a decision.execution
      payload whose fired check carries an outcome outside EXECUTION_ORDER (records.py :133-:134, the seven values
      without CONTINUE); today :587-:589 accepts any value of EXECUTION_DECISIONS (:119-:121), which holds CONTINUE. The
      docstrings of the module (:27-:29) and of _is_checks (:576-:578) are changed to say that a fired check carries a
      value of EXECUTION_ORDER. A unit test in tests/unit/test_records_execution.py shows a fired check with CONTINUE
      refused and each of the seven values of EXECUTION_ORDER passing. The Resume Check emits no fired check with
      CONTINUE (resume_check.py, whose decision at :664 is CONTINUE only when nothing fired), and at base_commit neither
      .aieos/events.jsonl nor a file of docs/records holds an "outcome" of "CONTINUE". The EXECUTION_* constants and every
      other rule of records.py stay.
  - AC2: >-
      (DEF-0052 G4) gitread.path_error (:196-:201) refuses a PATH that holds a NUL byte, so run gives its result
      mapping instead of raising ValueError (run catches only the time limit and OSError, :215-:218). The docstring says
      so and says why no pinned args form can hold a NUL: every argument is a literal or passes a full match (_is_id
      :110-:111, is_base_name :118-:128 through _is_branch_ref :144-:145, is_state_name :134-:141), and a repository
      path holding a NUL is refused as not an existing directory by os.path.isdir (:153). Unit tests show path_error
      refuses such a PATH; run, with gitread.environment patched to give such a PATH, returns the refusal; and form_error
