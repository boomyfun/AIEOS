acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only paths of the write set. Production changes only decision_replay.py. No public name
      is added to or removed from any module; no module other than decision_replay.py changes. Existing tests pass
      unchanged except those named in AC10; their assertions are only added to or made stricter, except where this
      contract changes the text they pin.
  - AC2: >-
      The form of a log, one definition. A private function of decision_replay.py gives, for the bytes of an event log and
      the report of records.check_log over them, the findings of a form the writer never writes: the bytes do not end with
      LF ("log: the log does not end with LF"); a line that the report marks as an ignored duplicate ("log: line N is an
      ignored duplicate of line M, which the writer never writes"); a line that differs from eventlog._canonical of its
      object ("log: line N is not in the form the writer writes"). An empty log has none.
  - AC3: >-
      The entry. For each tracked events.jsonl, after its records.check_log findings and before any line is replayed, each
      finding of AC2 over the whole file is printed as a FAIL line naming the file and counted failed. In a file with such a
      finding no decision.execution or decision.acceptance line is counted as replayed and passed: each is counted failed
      with the finding "log: the file is not in the form the writer writes". A violation-path record of such a file is
      counted failed in the same way, not "NOT REPLAYED".
  - AC4: >-
      The replays of one line. replay_execution and replay_detail refuse with the findings of AC2 over the log bytes they
      are given, after the check_log findings. The acceptance replay keeps its three findings of erratum E2.1 of TASK-167
      for its own line, and fails with the findings of AC2 for any line before its own.
  - AC5: >-
      The manifest. The acceptance replay requires, among the task's record.added payloads of the lines before the record,
      at least one with evidence_type evaluation_manifest and commit the evaluated commit whose basis is a list of exactly
