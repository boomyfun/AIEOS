capabilities:
  filesystem: {read: [the repository at base_commit], write: [src/aieos_bootstrap/decision_replay.py, tests/unit/test_decision_replay.py, tests/unit/test_decision_replay_acceptance.py]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
# Risk: src/** and tests/**: risk-rules-gov-aieos.md R2 raised by R3, unevaluable and therefore matching (:18); re-checked at the contract commit.
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 900k, wall_time: 6h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC9, AC10, AC14]}
  - {gate: G3, check: constitution, args: [AC7, AC8, AC11, AC12, AC13, AC15, INV-001, INV-002, INV-003, INV-004, INV-007, INV-008, INV-009, INV-010, INV-011, GOV-001, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of risk high is satisfied (an other_model_review and a separate decision_agent_review, both bound to the evaluated commit, the contract and the pins, before any fast-forward of main) AND the task acceptance by the decision agent before any landing step AND the aieos-checks run of the accepted commit succeeds
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
