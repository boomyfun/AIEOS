acceptance_criteria:
  - AC1: >-
      The arguments (point 7). stdin_bytes must be a bytes object; root, task_id, write_set, record_id and recorder are
      passed to judge unchanged and checked by judge's own AC1 (TASK-061); allowlist is checked by AC4 first. stdin_bytes
      that is not bytes gives verdict "refuse" with reason "argument", a finding naming it, exit code 2 and no record;
      judge's "refuse" with reason "argument" is passed through with exit code 2 and no record (a wrong argument is the
      caller's error, not a policy refusal, as in TASK-061). The module keeps no state. The checks run in this order, and the first that fails gives
      the result: stdin_bytes's type (AC1), the allowlist's form (AC4), the decoding and parsing (AC2), then judge.
  - AC2: >-
      The channel's input (point 7). stdin_bytes is decoded as strict UTF-8 (a byte that is not UTF-8, or a leading
      byte-order mark, is not accepted) and parsed as JSON with duplicate keys in any object refused and the constants
      NaN, Infinity and -Infinity refused; a decoding error gives "uncovered" with reason "input_bytes", a parse error
      or a refused key or constant gives "uncovered" with reason "input_json", and a value that is not an object gives
      "uncovered" with reason "input_shape"; each with exit code 2 and no record, never "allow". From the object, only
      the keys tool_name and tool_input are read (D-1236 Q2): judge is given a new mapping holding exactly those two
      keys, each only if present, so judge cannot read any other key; root is the caller's argument, never the input's
      cwd (D-1212 F4). Changing or removing any other key of the object never changes the result.
  - AC3: >-
      The channel's output (point 7; D-1236 Q5). For "allow", exit code 0 and an empty standard-error text. For every
      other verdict, exit code 2 and a standard-error text of one line, "AIEOS claude_code_hook: " followed by the
      verdict, " (", the reason and ")", in ASCII, with no line break and no text taken from the input (no path,
      command or tool name is echoed). The entry returns no standard-output text, and no exit code other than 0 or 2.
      A refusal's record is returned unchanged from judge (equal keys and values) for the core; how it reaches the core
      is point 7's rest (D-1236 Q3).
  - AC4: >-
      The allowlist's form (point 6; DEF-0077; D-1236). allowlist_findings(allowlist) gives a list of findings, empty
      only when allowlist is a list (possibly empty) of strings each of which: is non-empty; has only the characters
      ASCII letters, digits, space and - _ . / : = , + (F9's safe set less tab, newline and ; & | ( ), which no
      allowlist entry can usefully hold since judge splits commands at them); does not begin or end with a space and
      holds no two spaces in a row; whose first word holds no "="; and whose first word's name (the part after its
      last "/" or ":", compared without regard to letter case and with a final ".exe" removed) is not one of bash, sh, zsh, dash, ksh, fish, powershell, pwsh, cmd, wsl, python, python3, py,
      node, deno, npx, perl, ruby, php, env, xargs, find, timeout, nohup, exec, eval, command, sudo, time, nice, and does
      not end in ".sh", ".ps1", ".py", ".bat", ".cmd", ".js", ".pl" or ".rb"; and, when its first word's name
      is git, it has a second word that does not begin with "-" and is not one of config, submodule, bisect,
      rebase, filter-branch, difftool, mergetool, help. The lists are the module's minimum, not complete (D-1236); an
      entry not on them that runs code stays under TASK-061's program limit. Any finding gives, for every call
      whatever its tool (reading: the allowlist is the caller's configuration, so a malformed one is a caller's error
      and judge is not called), verdict "refuse" with reason "allowlist_form", the findings, exit code 2 and no record.
      An empty allowlist is well formed (judge then refuses every shell call, TASK-061 AC6). The allowlist's content
      stays the caller's policy (point 6), never a default of the module.
  - AC5: >-
      The caller's handling, fail closed (point 5; D-1236 Q4). judge's "allow" gives exit code 0; judge's "refuse"
      gives exit code 2 with judge's record when it has one (a blocking violation: specification 5 section 8, STOP:
      violation follows from the record in the core, which this task does not call); judge's "uncovered", whatever its
      reason, gives exit code 2 and no record. A result of judge that is not a mapping with exactly
      claude_code.RESULT_KEYS and a verdict in claude_code.VERDICTS gives "uncovered" with reason "entry". Any exception
      raised inside entry or allowlist_findings gives "uncovered" with reason "entry", the exception's type in findings,
      exit code 2 and no record; no exception escapes either function.
  - AC6: >-
      The result. entry returns a mapping with exactly exit_code (0 or 2), stderr (the text of AC3), verdict ("allow",
      "refuse" or "uncovered"), concern (judge's concern, or None when judge was not called), reason (one of
      claude_code.REASONS, or one of the module's own reasons "allowlist_form", "input_bytes", "input_json",
      "input_shape", "entry", kept in claude_code_hook.REASONS and not added to claude_code.REASONS), findings (a list
      of texts) and record (judge's record, or None). exit_code is 0 exactly when verdict is "allow"; only "refuse"
      from judge with a reason other than "argument" and "record" carries a record.
  - AC7: >-
      No coverage claimed. The module's docstring states: the functions judge given bytes only; whether Claude Code runs
      the hook, with which input, and whether exit code 2 blocks are unmeasured (specification 5 lines 65 and 80; C6,
      the owner's); the exit-code form is cited from Claude Code's documentation (the header's source), not measured;
      the documentation says a hook that does not start, exits otherwise or prints invalid JSON lets the action go
