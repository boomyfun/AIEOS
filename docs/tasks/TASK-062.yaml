# Task contract TASK-062, the Claude Code adapter's hook entry, part CC-2 (Master Plan revision 4, §4 M5; specification
# 5 revision 3, sections 6 and 8 and section 11 points 5, 6 and 7; specification 2 revision 5, section 6.2).
# Revision 0, drafted under decisions D-1235 (option (ii): parts (a), (c), (d); (b) out), D-1236 (the outline's rulings
# Q1 to Q5 and its three further rulings) and D-1238 (Q3, C5); brought for approval in its own request; whether it is
# approved is recorded in the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and
# the contract of TASK-061. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: a new module src/aieos_bootstrap/claude_code_hook.py, as pure functions only,
# called only by its tests: (a) the hook entry, from the bytes Claude Code would write to a PreToolUse hook's standard
# input to claude_code.judge's verdict and then to what the hook would return (an exit code and one line for standard
# error), with the refusal's observation record returned as a value for the core; (c) the allowlist's form check, run
# before judge is called (point 6 and DEF-0077); (d) the caller's handling of every verdict, fail closed (point 5).
# claude_code.py, accepted at 2158df6b (TASK-061), is not changed (D-1236 Q1); judge's own AC1 check stays as it is.
# The interface (point 7, as far as this task states it): the entry takes the standard-input bytes and, from its caller,
# the root, the lease's task id and write-set, the allowlist, a record id and a recorder; where the caller takes them
# from is the caller's and is not read from any file here. Of the hook input only tool_name and tool_input are read
# (D-1236 Q2): root comes from the caller only, never from the input's cwd (D-1212 F4); session_id, cwd,
# hook_event_name, transcript_path, permission_mode, tool_use_id and every other key are not read, and the ids that tie
# an observation to a session and a lease are point 7's rest, out of this task. The observation leaves the function as
# a value only: no file is written and no channel is opened (D-1236 Q3).
# The exit-code form, cited as documentation of Claude Code, never as a measurement (D-1236 Q5): the hooks reference
# (https://code.claude.com/docs/en/hooks, read on 2026-10-18; sections "Exit code output", "Exit code 0", "Exit code 2",
# "Other exit codes", "Exit code 2 behavior per event" and "Common input fields") says that exit 0 is success and
# Claude never sees standard error then; that exit 2 on PreToolUse blocks the tool call, with the hook's standard error
# as the message, unless JSON printed on standard output makes a blocking decision, whose reason is then used; and that
# any other exit code, a hook that does not start, or invalid JSON output is a non-blocking error and the action goes
# ahead. So the entry gives only 0 or 2 and prints nothing on standard output; that a hook which never starts or is
# killed lets the call go ahead is the documentation's statement, unmeasured (C6), and is carried as a limit.
# Every "uncovered" gives exit 2 (D-1236 Q4): a tool that is not judged, a malformed input, an exception, an uncovered
# path. The entry is meant for a hook whose matcher names only the judged tools (Write, Edit, Bash, PowerShell, Read,
# Grep, Glob); under a matcher "*" it would block every other tool's call. Which matcher is used is part of placing the
# hook: CC-3, the owner's act (A51 item (4)); this task places nothing and names no matcher as chosen.
# No coverage is claimed (as TASK-061's AC9): no acceptance criterion assumes that a hook fires for a tool, that its
# input has the documented form, or that exit 2 blocks. In session 1947b313 a hook with matcher "*" did not refuse Read
# calls it was written to refuse (D-1202, D-1203); specification 5 lines 65 and 80 state that firing, coverage,
# fail-open behaviour and timeouts are unmeasured and that a hook that does not fire neither refuses nor records.
# Limits (carried at acceptance): specification 5 open points 3 (the adapter declaration), 4 (the observed read-set
# record's evidence_type; part (b) waits for a specification 2 revision, D-1235), 10 (an abnormal session end) and 12 (a
# bound on repeated STOP: violation); C6 and P-LOC unmeasured; every limit TASK-061 carried (its header and AC9), among
# them: the shell checks read the command text only and over-refuse; F9's safe set unchanged (DEF-0078; D-1236); a
# program that runs code, admitted by an entry, can do anything, a push built from parts included; AC4's list of
# refused first words is the module's minimum and not complete, and an entry not on it that runs code is still covered
# only by that program limit (D-1236); an "uncovered" result carries no record (D-1236: no new record key; a marked
# observation waits for a specification 2 revision, like (b)); the entry does not check hook_event_name, so placed on
# another hook event it would judge in the same way (stated, D-1236 Q2); a refusal record is returned unchanged,
# so a credential typed into a command stays in its refers_to (claude_code.py's docstring; D-1219 R2-2); redaction
# before any record is written is not done here and goes with point 7's rest, where the record is written (a
# Deferred item); nothing is installed or measured.
# Readers of the changed paths (D-263 C3's practice): tests/unit/test_writer.py's R8 test and tests/unit/test_gitread.py's
# subprocess test read every module of src/ and keep passing. No existing module imports claude_code_hook.
# Risk: high (risk rules revision 6, §2 point 3: R3 matches every path under src/** and tests/**; R2 medium; no path
# under tests/conformance/** (R11) or .claude/** (R9)), computed over the base by SP/tools/risk_class62.py. GOV-003:
# every path of the write-set is an evaluator path by the workflow's pinned list (.github/workflows/aieos-checks.yml:
# 392-395), by SP/tools/gov003_class62.py, so "GOV-003 evaluator change: yes"; change class critical_cr, as for TASK-060
# and TASK-061, ruled at acceptance. Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test],
# architecture [deterministic_rule], functional [integration_test], security [static_security_analysis] and
# architecture [ai_review (cross-model)], plus the evidence_required of the applicable articles. Reviews: five way-2
# reviews on a Claude model other than the implementer's, Opus 5.5 or Sonnet 5.5 and never Fable (the owner's words of
# 2026-10-17, quoted in :3 item 3 of session 89ad39be); and the decision agent's own reviews: INV-003's human_review,
# OPS-002's human_review and the cross-model half, each its own record (decision D-1148 Q2).
# Records: in the readable form, as TASK-061's (D-1179 Q2 (6)); per-entry coverage checked by script before the
# acceptance request (L-0022), and the governor's evaluation over the records reported (decision D-1098).
# Naming (D-544 Q3): every test of the new test modules names the AC ids it stands for as "TASK-062 ACn" in its own
# docstring.
# Evaluation path (A61; as TASK-019 to TASK-061): commit C changes only docs/tasks/TASK-062.yaml and has one parent equal
# to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-062" and no e-mail address in its message, go to
# task/TASK-062 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011; GOV-001, GOV-004 to GOV-006
# and SEC-003 (no path of the write-set meets them). INV-004 applies: the module writes nothing.
# Owner-kept acts: none. No hook placed, no matcher chosen, no Claude Code setting, nothing under .github/ or .claude/,
# no push of its own; it weakens no evidence requirement; so its acceptance is one delegated approval of the decision
# agent (Master Plan section 6).
task: TASK-062
contract_version: v1
task_type: implementation
objective: >-
  Add the Claude Code adapter's hook entry (part CC-2) in standard-library Python 3. A new module
  src/aieos_bootstrap/claude_code_hook.py gives allowlist_findings(allowlist) and entry(stdin_bytes, root, task_id,
  write_set, allowlist, record_id, recorder): entry checks the allowlist's form, decodes the bytes as one JSON object,
  passes a mapping of only its tool_name and tool_input to claude_code.judge, and returns the exit code (0 only for
  "allow", else 2), one line for standard error, the verdict and its reason, and for a refusal judge's observation
  record unchanged. With unit, integration and property tests in tests/unit/test_claude_code_hook.py,
  tests/integration/test_claude_code_hook_inputs.py and tests/property/test_claude_code_hook_properties.py, each test
  naming its AC ids in its own docstring; the tests write no file.
