# Task contract TASK-031, the reconciliation caller (Master Plan revision 3, §4 M4; specification 4 revision 3, section 7
# items 1, 3 and 4; concept lines 742-749 and 948). Revision 0, drafted under decisions D-671 (Q1 to Q3, C1 and C2) and
# D-663, brought for approval in its own request; whether it is approved is recorded in the decision files, not in this
# file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-030. Readings marked
# "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: one module, src/aieos_bootstrap/reconcile.py, the core's caller of the two
# pure reconciliation computations that are on main: stale.stale (TASK-023, section 7 item 3) and drift.violations
# (TASK-030, section 7 item 1). Its function reconcile runs at one base commit (the trigger, a commit that reached the
# base): it reads the event log through the writer, finds every task the log shows DONE, builds stale.stale's inputs for
# each from the log and a bounded first-parent walk of Git through gitread, builds drift.violations' inputs for the
# trigger, and appends every returned event through the writer under the ids those functions derive. A pure helper,
# rule_results_from_steps, turns the CI's step results for one commit into article-form rule results by a mapping the
# caller gives (decision D-664 C4; DEF-0057). It changes no task state, grants and releases no lease, calls no governor
# and reads no network.
# The specification's text (spec 4 line 83): "**Where it runs** (plan o4): in the CI channel as evidence, and in the
# core when a task is submitted, as the governor's input; the core's caller is the item carried in DEF-0030 (D-415 C3).
# All three are pure computations; their events are appended only through the single writer (INV-004)." Line 82 (stale
# evidence): "each base commit gives at most one `evidence.stale` event per task and reason [...], idempotent by an event
# id derived from the task, the commit and the reason". Line 80 (constitution drift): "a failed rule on the base is a
# `violation.detected` with the article's id in `refers_to`; its subject is the commit, no task's state changes".
# Specification 1 line 88: an evidence.stale event's effect is that a "re-verify is scheduled; execution is not blocked; a
# DONE task stays DONE with stale evidence".
# What it does not do: no governor call and no change to its reads (spec 4 section 12 point 10); no evaluation (section 3
# rule 1 stays the governor's); no lease, no state effect (DEF-0030's state effect and lease on CONTINUE stay open, before
# M4's exit review point); no scope drift (section 7 item 2, which waits for the policy's list of non-task paths); no
# network and no CI read (the CI's step results are the caller's values); no run of a G3 rule; no change to stale.py,
# drift.py, evaluation.py, writer.py, gitread.py, records.py or any other existing module; nothing under .github/.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain reconcile; it must not name the Resume
# Check fixture folder (TASK-010's assertion) nor the Risk Engine fixture folder (TASK-020's allow list). No module of
# the repository calls reconcile yet.
# Source classes (decision D-671, DEF-0057, D-668 C3): a rule result or a task record reaches drift only when its
# source_class is deterministic_tool_external_ci or deterministic_tool_local; the class is the writer's statement, not
# checked against the channel (DEF-0051), a stated limit.
# The task's kept G3 records (decision D-671 C1 item 1; reading): they are given to drift as they are, filtered by class;
# the CI's G3 records in docs/records name a CI step in refers_to, not an article id, so they match no article and the
# one-finding rule finds nothing in them: a G3 failure at a task's evaluation and the same failure on the base may then
# be two findings, a stated limit (mapping those records would need parsing their free-text refers_to, which this task
# does not do).
# Risk: high, and change class critical_cr, each computed over the base by script, as for TASK-030. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles.
# Reviews (as TASK-030's): five way-2 reviews by a Claude model other than the implementer's, and the decision agent's
# three, each brief naming for testing: the DONE-task facts taken from the log; the walk's bound and its fail-closed
# outcome; the source-class filter; the mapping helper's form; the order of appends and a partial refusal; the derived
# ids and "duplicate" on a rerun; purity (gitread and the writer only); AC12's limits.
# Naming (D-544 Q3, as TASK-023 to TASK-030): every test of the new test modules names the AC ids it stands for as
# "TASK-031 ACn" in its own docstring.
# Evaluation path (A61; as TASK-007 to TASK-030): commit C changes only docs/tasks/TASK-031.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-031", go to task/TASK-031 under their own
# decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the
# governor, evidence records as stored, the replay and the policy meet no path of the write-set); GOV-001, GOV-004 to
# GOV-006 and SEC-003 (the concept file, the bound artifacts, the decision matrix, the records and pre-genesis documents,
# and .github/, meet no path of the write-set). INV-004 applies: the module appends only through writer.append_event.
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (it records stale evidence and violations
# and blocks no task; CR-002 part 4 limit 8 does not apply), so its acceptance is one delegated approval of the decision
# agent (Master Plan section 6), for the decision agent's ruling.
task: TASK-031
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/reconcile.py, the core's reconciliation caller of
  specification 4 section 7 items 1, 3 and 4: reconcile(root, repo, trigger_commit, values, rule_results, recorder, now)
  reads the event log through the writer, builds stale.stale's inputs for every task the log shows DONE from the log
  and a bounded first-parent walk of Git through gitread, builds drift.violations' inputs for the trigger with only the
  deterministic source classes counted, and appends every returned event through writer.append_event in a fixed order
  under the ids those functions derive, so that a rerun gives "duplicate"; and a pure helper,
  rule_results_from_steps(steps, step_articles, commit, recorder), turns the CI's step results for one commit into
  article-form G3 observations by a mapping the caller gives. With unit, integration and property tests in new test
  modules, each test naming its AC ids as "TASK-031 ACn" in its own docstring; the tests use stand-ins for gitread,
  read_log and append, and the integration test runs a stand-in log and repository end to end with eventlog.append in
  memory.
