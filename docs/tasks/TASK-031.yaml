constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The arguments. reconcile(root, repo, trigger_commit, values, rule_results, recorder, now, max_commits=1000,
      read=None, read_log=None, append=None) checks every argument before anything is read: root and repo non-empty
      strings; trigger_commit 40 or 64 lowercase hex characters; values a mapping with exactly the keys articles (a
      list) and tasks (a mapping from task ids to mappings with exactly the keys intent_current, read_set and
      read_set_estimate, in stale.stale's forms); rule_results a list of mappings; recorder a non-empty string; now a
      timezone-aware datetime in UTC; max_commits an int from 1 to 10000. A wrong argument gives the result of AC10
      with result "refused", reason "argument" and a finding naming it, and nothing is read or appended. read,
      read_log and append default, at call time, to gitread.run, writer.read_log and writer.append_event.
  - AC2: >-
      The log and the DONE tasks. The log is read once through read_log(root) and checked by records.check_log; a log
      with a finding gives "refused", reason "log". A task is DONE when the log holds a task.done event for it; its
      accepted commit is the evaluated_commit of the decision.acceptance whose record_id is that task.done's
      decision_record. A task.done whose decision record is absent, not an ACCEPT decision, or has no evaluated_commit
      gives an uncovered entry {ref the task id, detail naming the gap} and no stale computation for that task (fail
      closed). Its records are its record.added payloads, its earlier events its evidence.stale payloads, and its
      submitted commits the commits of its task.submitted events, all in log order.
  - AC3: >-
      The walk (decision D-671 C1 item 3). From trigger_commit back along first parents, each commit is read once with
      read(repo, ["cat-file", "-p", id]) and parsed by gitread.parse_commit, and its changed paths are read with
      evaluation's pinned diff-tree form against its first parent (a root commit against the empty tree) and parsed by
      gitread.parse_paths. For a DONE task the base commits are the walked commits after its accepted commit, in base
      order (oldest first). If the walk reads more than max_commits commits, or reaches a root, before it reaches a DONE
      task's accepted commit, that task gets no stale computation and an uncovered entry {ref the task id, detail
      "accepted commit not reached"}; it is never treated as fresh. A read that fails or gives a parse error gives
      "refused", reason "git", and nothing is appended. A merge (a commit with more than one parent) is followed by its
      first parent, but its changed paths are not read: gitread's one pinned diff-tree form gives no paths for a merge.
      So every DONE task whose base commits would include a merge gets no stale computation and an uncovered entry {ref
      the task id, detail "merge commit on the walk"}, and when the trigger itself is a merge, drift.violations is not
      called and an uncovered entry {ref the trigger commit, detail "trigger is a merge"} is given (fail closed).
  - AC4: >-
      Stale evidence. For each DONE task with values["tasks"] holding its facts, stale.stale is called once with
      task_id, accepted_commit, trigger_commit, records, intent_current, read_set, read_set_estimate, base_commits (each
      {commit, paths, submitted_by_task}, the last true when the commit is one of the task's submitted commits) and
      earlier_events; a DONE task without facts in values["tasks"] gives an uncovered entry {ref the task id, detail
      "no facts given"} and no call. stale.stale's own uncovered entries are passed on with the task id; its error, if
      any, gives "refused", reason "stale".
  - AC5: >-
      The source-class filter (decision D-671 and DEF-0057). Before drift.violations is called, a rule result or a task
      record is kept only when its source_class is "deterministic_tool_external_ci" or "deterministic_tool_local"; each
      other entry is left out and gives an uncovered entry {ref its record_id when it is a non-empty string, otherwise
      its list and index, detail "source class not counted"}. A left-out pass leaves the article without a result
      (drift names it); a left-out failing task record cannot suppress a finding. The class is the writer's statement
      (DEF-0051): a stated reading.
  - AC6: >-
      Constitution drift. drift.violations is called once with base_commit trigger_commit, changed_paths the trigger's
      changed paths from the walk, articles values["articles"], rule_results the kept rule results, task_records the
      kept records of every task whose last decision.acceptance's evaluated_commit equals trigger_commit, and recorder.
      Its uncovered entries are passed on; its already list is in the result; its error gives "refused", reason
      "drift".
  - AC7: >-
      The mapping helper (decision D-671 C1 items 2 and 5). rule_results_from_steps(steps, step_articles, commit,
      recorder) is pure: steps is a list of {name, conclusion} with non-empty string names; step_articles a mapping from
      step names to non-empty lists of article ids; commit 40 or 64 lowercase hex characters. For each step whose name
      step_articles holds and whose conclusion is "success" or "failure", it returns one record per named article:
      {record_id, fact_kind "observation", source_class "deterministic_tool_external_ci", recorder, subject commit,
      commit, gate "G3", outcome "pass" for success and "fail" for failure, refers_to the article id}, record_id the
      SHA-256 hex digest of "ci-rule", the commit, the step name and the article id joined by LF; records.check_record
      finds nothing in each. A step the mapping does not name, or another conclusion, gives no record and one uncovered
      entry {ref the step name, detail naming why}. It returns {records, uncovered, error}, error a short text for a
      malformed argument (then no record). A step's success counts as the article's deterministic rule passing, not as
      the article being satisfied (reading). The records are reconcile's caller's inputs; they are not appended.
  - AC8: >-
      The appends (decision D-671 C1 item 4). The events are appended through append(root, event_type, payload,
      event_id, now, recorder, task_id=...) with no fencing token, in a fixed order: the evidence.stale events by task
      id, then by reason as stale returns them, each with task_id the task; then the violation.detected events as drift
      returns them, with no task_id. Each "appended" and "duplicate" result is listed; the first other result (a
      refusal, a result that is not a WriteResult, or a raised exception) stops the appends and gives "refused", reason
      "append", with the ids appended so far listed. A rerun gives "duplicate" for those and goes on; the log is
      append-only, so nothing is undone (the writer's behaviour, stated).
  - AC9: >-
      What it does not do. The module calls no governor function, evaluates no task, grants, releases or expires no
      lease, creates no store, changes no task state, makes no scope-drift finding and reads no network; its docstring
      says so and names DEF-0030 (the state effect and the lease on CONTINUE), DEF-0051 (the class not checked against
      the channel) and DEF-0057 (the one-finding limit). No module of src/ changes except __init__.py's docstring and
      __all__.
  - AC10: >-
      The result. reconcile returns a mapping with exactly the keys result ("reconciled" or "refused"), reason (None or
      one of "argument", "log", "git", "stale", "drift", "append"), findings (a list of texts), appended (the event ids
      appended), duplicate (the event ids found already appended), already (drift's), and uncovered (a list of
      {ref, detail}, sorted, without duplicates). An exception raised by a called function is caught and becomes a
      result with the step's reason; none escapes.
  - AC11: >-
      Purity and the CI checks (INV-001 to INV-004). The module imports only the Python 3 standard library and
      aieos_bootstrap's drift, gitread, records, stale and writer; it starts no process except through read, opens no
      file except through read_log and append, reads no clock and no environment, builds no event-log line itself and
      makes no network or model call; no exec, eval, compile, __import__ or importlib; no assert in src (bandit B101);
      no string that names the project-state directory. At the task's commits the CI steps report no finding:
      deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC12: >-
      Limits, stated: the DONE tasks' facts other than the log and Git (intent_current, the resolved read-set and its
      estimate flag, the articles and the rule results) are the caller's and not checked; the source class is the
      writer's statement (DEF-0051); the task's kept G3 records name a CI step, not an article, so they match no article
      and a G3 failure at a task's evaluation and on the base may be two findings (DEF-0057); one run at a time (the
      writer reads the log and appends with no check that it is unchanged since this module's read, as evaluate_task's
      limit); the walk has a bound; a merge's changed paths are not read (gitread's pinned form), so the tasks whose
      range holds one and a merge trigger are uncovered; the PATH git is found by is the caller's precondition (DEF-0052
      G1). Every existing module and test not in the write set is unchanged, and if one can pass only by a change the
      task escalates (needs_out_of_scope_change).
  - AC13: >-
      Its own tests and the added text. Every test function of the three new test modules names the AC ids it stands
      for as "TASK-031 ACn" in its own docstring and names no other task's AC in qualified form there. Before each
      commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0;
      the file names are scanned with the same patterns and the records executors' pre-push pattern (D-282).
  - AC14: >-
      Tests, each rule with at least one passing and one failing case, with stand-ins for read, read_log and append (no
      process, no file): R1 AC1 (each wrong argument refused before any read); R2 AC2 (a DONE task found; each gap in
      its decision record uncovered; a refused log); R3 AC3 (base commits after the accepted commit in base order; the
      bound exceeded and a root reached give "accepted commit not reached"; a failing read refused; a merge followed by
      its first parent, the tasks whose range holds it uncovered, and a merge trigger not given to drift); R4 AC4
      (stale called with the built inputs; submitted commits flagged; no facts uncovered); R5
      AC5 (each other class left out and named; a left-out pass and a left-out failing task record); R6 AC6 (drift
      called with the trigger's paths and the right task records); R7 AC7 (the mapping's records, their ids and
      check_record; an unmapped step and another conclusion uncovered; a malformed argument); R8 AC8 (the order; a
      refusal mid-way stops with the ids so far; a rerun gives duplicates); R9 AC10 (the keys, an exception caught); R10
      AC9 and AC11 (a script check of the imports and of the absence of open, write, subprocess and clock calls). Unit
      tests in tests/unit/test_reconcile.py; an end-to-end run over a stand-in repository and a log appended in memory
      with eventlog.append in tests/integration/test_reconcile_log.py; property tests in
      tests/property/test_reconcile_properties.py (standard library only, fixed seeds): for random well-formed logs and
      walks, a second run appends nothing new; every DONE task is either computed or uncovered; no left-out class ever
      reaches drift. tests/run_tests.py, unchanged, runs all groups.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9, AC10, AC14]}
  - {gate: G3, check: constitution, args: [AC11, AC12, AC13, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
