# Appendix B: the Python-versus-specification-3 findings (t101/trace/trace-table.md section 3, unchanged) and finding
# 21, added by the worker (D-3484 C4); findings only, not fixed by this task.
# 1. An unparsable signature is not breaking: _verdicts tests only null and "ambiguous" (resume_check.py:375-382; UNPARSABLE :58 is never compared), so "unparsable" at both commits is equal and non_breaking; spec §5 :73 says a file that cannot be parsed at either commit gives breaking.
# 2. Ids omit the interpreter's version: _ids joins code_sha256 only (resume_check.py:108), while spec §9 :139 names "the `engine_identity`", which is {code_sha256, python} (:503; spec §9 :133).
# 3. Subject "TASK-0" for a malformed task_id (resume_check.py:61, :502); spec §9 :113 says the subject is the task id.
# 4. A well-formed task_id "TASK-0" still gets the "task_id is malformed" uncovered line in an error record (resume_check.py:513-514); spec says nothing of it.
# 5. Error records for a malformed code_sha256 (resume_check.py:521-522) and for any exception (:527-528, :533-534); spec §7 :86 lists the inputs that give `error` and names neither.
# 6. Every one of the 22 input keys gives `error` when malformed (resume_check.py:197-267), among them budget_use, intent_current, dependencies; spec §7 :86's list does not name budget telemetry, intent artefacts or task states.
# 7. An error record carries only the _base keys plus decision, error, uncovered, state_effect (resume_check.py:510); spec §9 :114-136 gives no reduced key set for it.
# 8. Check 1 has no separate "not a commit of the repository" case: only base_is_ancestor (resume_check.py:552); spec §2 :40 names both conditions.
# 9. A path changed by several commits takes the last commit's change (resume_check.py:559; docstring :15-16); spec §2 :40 and §9 :122 do not say which change.
# 10. A contract-listed article absent from the articles is made applicable with no result (resume_check.py:619-623); spec §2 :45 does not say this.
# 11. An applicability without a string-list task_types does not filter (resume_check.py:444-447); spec §2 :45 says the applicability, if present, names the task_type.
# 12. A risk rule with a missing or invalid class counts as critical (resume_check.py:471); spec §2 :46 does not say this.
# 13. Within check 7, STOP: runtime insufficient wins over the unmatched-pattern ESCALATE, and the ESCALATE is then not recorded (resume_check.py:633-637); spec §2 :46 gives both conditions without precedence, and §7 :84 says every fired outcome is listed.
# 14. Budget forms: a fixed parse (tokens k/m, times s/m/h/d), an unparsable form uncovered, retries integers only, any budget name compared when both values are integers (resume_check.py:481-493, :651-656); spec §2 :47 does not say how forms are compared.
# 15. read_set.unanalysed is always [] and unresolved holds only interface and schema names (resume_check.py:363, :387, :685); spec §4 :63 lists unparsable files as unanalysed and unresolved imports as unresolved.
# 16. A check-4 REPLAN never appends task.stale (resume_check.py:708-711); spec §10 :149 gives task.stale with cause intent_change, and §12 :172 leaves open only the case where the log holds no intent.changed.
# 17. conflict.detected tasks is always [] (resume_check.py:714, :727); spec §10 :149 and :152 say the tasks named by the commits' trailers.
# 18. engine_identity.code_sha256 may be null, listed uncovered (resume_check.py:503, :511-512, :669-670); spec §9 :133 says the content hash of the code that decided.
# 19. log_seq must be below 2**63 (resume_check.py:63, :204); spec §9 :121 gives no bound.
# 20. A REPLAN's conflict.detected paths include every delta path for an unresolvable schema entry (resume_check.py:712, :737-738); spec §10 :149 says only "the `interfaces` or `paths` met".
