acceptance_criteria:
  - AC1: >-
      The Resume Check-only reference (tests/unit/test_export_resume.py). Run from the repository root as `python
      tests/unit/test_export_resume.py --root tests/conformance [--check]`, it reads every .py file of the Resume Check
      fixture folder ('fixtures_' + 'rc'; a __pycache__ folder passed over; any other entry fails closed), unwraps each
      with aieos_bootstrap.conformance.unwrap, calls aieos_bootstrap.resume_check.check(inputs) for each case with a deep
      copy, applies the closed placeholder list of test_export_reference.py (engine_identity.python written as
      "<engine>", nothing else), and prints the canonical text (conformance.canonical_text) of one object whose keys are
      "<folder>/<file stem>" and whose values are the case records in case order; ASCII with LF only; `--check` fails
      when the document's SHA-256 differs from its pin REFERENCE_RC_SHA256 (one exact value, filled from the scratch run
      and named in the approval of commit X); for any other argument form main returns 2, and on a missing folder, a
      refused file, a call that raises or a record that is not an object it returns non-zero, in each case printing
      nothing to standard output (D-3492 F12). It runs no process, reads no network, clock or environment, writes no
      file, reads files only with Path.read_bytes, and imports only the standard library and aieos_bootstrap, within the
      import and pattern rules of aieos-checks.yml :1456-1665. Its bytes, comments and docstrings included, contain none
      of the byte strings 'fixtures_rc', 'fixtures_risk', 'fixtures_cb' and 'bench/', and it has no line matching
      `^\s*(?:import|from)\s+bench\b`; those folder names are built from parts (D-3492 F7).
  - AC2: >-
      The tie to the full reference (D-3478 C4). The module's tests compute the full round-1 document (the governor
      fixture folder with aieos_bootstrap.governor.evaluate and the Resume Check fixture folder with
      resume_check.check, names built from parts, the Resume Check's records with the closed placeholder, as
      test_export_reference.py does) and assert that its SHA-256 equals the constant FULL_REFERENCE_SHA256 =
      01aeec8f12bcf11303e1ec08c1d87d866a7aa823066fe9c5f5eeace4c0ac6443, that this constant occurs once in
      tests/unit/test_export_reference.py's bytes (read with Path.read_bytes) as REFERENCE_SHA256's value, and that the
      Resume Check document equals the canonical text of the full document's keys of the Resume Check folder. The full
      document and its pin are unchanged.
  - AC3: >-
      The native program (native/go/resume). One Go package main, go.mod naming the module aieosresume and the Go version
      of bench/go/go.mod (go 1.24), no require and no other file than the write-set's. Run with exactly one argument, the
      fixture document (tests/unit/test_export_fixtures.py's output), it writes the Resume Check-only document in one
      write and exits 0, byte-equal to AC1's output; it reads the fixture document as bench export.go does (the shared
      key and fixture-object checks for every key, the per-case checks and the computation for the Resume Check keys
      only, the governor and risk keys passed over after the shared checks), requires at least one Resume Check key,
      and fails closed as bench/go's program does for the Resume Check part (bench/go port_test.go's TestFailClosed
      cases that apply to it, kept by name: no argument, an extra argument, a file that cannot be read, an empty file,
      not JSON, a truncated document, not one object, the three not-canonical cases, a byte-order mark, not UTF-8, a
      repeated key, a fixture that is a number, a number with a fraction, an integer of more than 4300 digits, no Resume
      Check fixture, an unknown folder, a key without a folder, an empty file stem, a fixture that is not an object, no
      cases, cases not a list, a case that is not an object, a Resume Check case without inputs and a record that is
      not ASCII; plus difference (b)'s cases; every case whose bench form changes a governor fixture changes
      fixtures_rc/rc_01 instead, and "a record that is not ASCII" changes a value that appears in the Resume Check
      record, so shown by the Python scratch run (D-3492 F3); the governor-only cases are dropped, and port_test.go's "a
      budget amount Python's int() refuses" case becomes the error record of AC4 (c), not a refusal); with no argument
      it exits non-zero and writes nothing to standard output. port_test.go's other tests: TestWholeDocumentByteEqual,
      TestRunWritesTheDocumentOnce, TestResumeCheckCaseFieldByField and TestBigIntegersKept are kept; TestPlaceholder
      becomes Resume Check-only (its governor branch dropped); TestUnexpectedErrorsFailClosed keeps its guarded-panic
      half, and its budget half changes under AC4 (c); TestGovernorCaseFieldByField is dropped (D-3492 F9). It imports
      only Go's standard library, opens only the one file named by its argument, starts no process, uses no network and
      writes no file.
  - AC4: >-
      Today's Resume Check (appendix A). (a) Difference (a), rows 7 and 12: engine_identity.python is "<engine>" in the
      Go record, equal to the reference document (no change from the copy). (b) Difference (b), row 1: where
      resume_check.check would return an error record naming a Python exception type, the Go program fails closed
      where its own computation cannot go on (no record, exit 1, nothing on standard output); a Go test shows that path;
      a RecursionError of the deepcopy at resume_check.py :532 has no Go path, a named limit (D-3492 F5). The deepcopy
      has no other effect on the output: check copies the inputs before _decide so that _decide's work cannot change
      the caller's object; _decide reads the copy and builds the record from its values, which equal the inputs', so
      the record is the same with or without the copy; the Go decide reads its input and changes nothing in it.
      (c) Difference (c), row 45: a budget amount above Python's digit limit gives the Go record rcError(inputs, code,
      "the check could not complete: ValueError"), and the boundary is not assumed: Python-computed constants give at
      least the largest accepted digit count, the smallest refused one and a refused case made of leading zeros, and a
      Python test in tests/unit/test_export_resume.py recomputes them, so that another interpreter limit fails that
      test; the Python and Go sides are tied only by the same literals written in both files (D-3492 F11). An integer
      literal of more than 4300 digits in a fixture is another case: the Python fixture reader (conformance.unwrap, its
      _loads, json.loads with hooks) raises a ValueError that unwrap does not turn into Malformed (it catches only
      UnicodeDecodeError and JSONDecodeError, conformance.py :249-253), and the export's main catches only
      ReferenceError and OSError (test_export_reference.py :192-196; the new module's main has the same handlers), so
      the ValueError propagates out of main and nothing is written to standard output; the module's test asserts it
      with assertRaises(ValueError) and an empty output buffer, since no process may be started (D-3492 F4). The Go
      reader refuses such a literal as "an integer of more than 4300 digits" (bench/go json.go :279-280) and the
      program exits 1 (AC3); no record either way. A budget amount of more than 4300 digits is a JSON string, which
      both readers read, so it reaches _amount and gives the error record above (D-3484 C4). (d) Go tests over every
      branch that appendix A column 8 marks as not reached by a fixture: a branch is in scope when column 8 says
      "none", "not exercised" or "not determined" for it, or names the reached branch with "only" or a parenthesised
      value list, in which case the row's other branches are in scope (D-3492 F2). A branch with no Go form (row 31's
      non-string branch, which check cannot reach since it passes only strings) is named in commit X's map with that
      reason instead of a test (D-3493). At least: the error records of
      check (code_sha256 malformed, an input missing or malformed, a failing input of _check_contract, check 0) and a
      valid non-null code_sha256; NO_TASK (rows 10, 11); check 1 with base_commit not an ancestor (ESCALATE, checks 2
      and 3 not_run; rows 27, 28); _star_match and _names_meet's star branches (rows 33, 34); _parts' no-"/" branch
      (row 32); _verdicts' null, ambiguous, no-single-symbol and schema-met branches (row 35); the other branches of
      rows 36 to 39 (the unresolved ones, and row 38's non-wildcard one); the "**" entry of _task_patterns (row 40);
      _applicable's task_types
      filter and scope fallback (row 41); _scope_patterns (row 42); _task_risk's invalid class and its unmatched
      pattern (row 43); _rule_patterns' non-match.paths branch (row 44); added and deleted changes (row 24); a 64-hex
      commit (row 18); budget units s, d and m (rows 47, 48) and an unparsable budget form; _meets_entry (row 52); the
      task.stale branch (task_state not READY); two checks firing at once. Each test is compared with
      resume_check.check's whole record for the same input. The expected values of (c) and (d) are constants taken
      from a scratch run of the Python (TASK-100's cases.json form); its script and unedited output are in the
      approval request of commit X, with a map from each in-scope row and branch to its Go test's name and a script
