task: TASK-101
contract_version: v1
task_type: implementation
objective: >-
  Write the native Resume Check in shadow: one Go package in native/go/resume/ (standard library only) whose program
  reads the fixture document and prints, byte for byte, the Resume Check-only reference document of the round-1 Resume
  Check fixtures, computing every case as resume_check.check at main computes it; its Go tests; and
  tests/unit/test_export_resume.py, the Resume Check-only reference export with its own pin and its tie to the full
  reference. The native code decides nothing: it writes no record and nothing reads its output but the advisory
  workflow aieos-native.yml.
