# Task contract TASK-035, hardening of the scope-drift caller (Master Plan revision 3, §4 M4; specification 4
# revision 3, section 7 items 2 and 4; DEF-0061; decisions D-719 C2, D-720 and D-723 C3).
# Revision 0, drafted under decisions D-723 (Q3, C3) and D-725 (P1 to P7, C1 to C4), from the scope note approved by
# decision D-725; brought for approval in its own request; whether it is approved is recorded in the decision files,
# not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-034.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation (hardening). What it changes: src/aieos_bootstrap/scope_reconcile.py (TASK-034, accepted
# at 427e71a2, decision D-720) and its three test modules, closing DEF-0061's m1 to m4 and t4, with t3 and part of t5;
# the tree listing becomes stricter (a name listed twice, a raw control character in a name, a walked element's mode
# that does not fit its type each stop the run, reason "base"), the event id is taken inside the append's try, and the
# docstring states the new refusals and reading R1. Nothing else changes: not the function's signature, the result's
# keys, the order of steps, the events appended, nor any other module.
# Reading R1 (the implementer's, unprobed; decision D-725 C2): "git cat-file -p <tree>" prints a tree as ls-tree does,
# so a name holding a control character, a double quote or a backslash (and, under the default core.quotePath, any
# non-ASCII name) comes C-quoted in double quotes; a raw tab or newline therefore never reaches the parser from the
# pinned read. The refusals of AC1 and AC2 hold whether or not R1 is right; it was not probed on this machine.
# Limit L2, stated (DEF-0061 m1 (c); decision D-725 P1): a reader that gives a raw newline inside a name (a stand-in,
# or a Git that does not quote) can make a line in form naming a path element no other line names; the parser cannot
# tell such a line apart. Bounded by AC1 for an element that exists, by R1 for the pinned read, and by the parent being
# governed history (decision D-719's reason).
# A change to an accepted task's test, stated (decision D-725 P5): TASK-034's unit naming test (Naming.
# test_every_test_names_its_criteria, TASK-034 AC14) is widened so that each test's docstring names "TASK-034 ACn" or
# "TASK-035 ACn" (at least one) and no other task's AC in qualified form. TASK-034's other criteria are unchanged, and
# AC3 of TASK-034 holds as made stricter by AC1 to AC3 below.
# Placed, not done here (decision D-725 P4; carried to DEF-0061's log at acceptance): t1 (an independent property
# oracle, a differing hash, coverage counters, the rerun test's vacuity, "reconciled" in the base-read test) and t2
# (each of the eleven real rules' match lists) and the rest of t5 (contracts and risk_rules in the claims input
# asserted directly; the tautological negative control) go to M4's exit review point; L1 (a merge not read against its
# first parent) stays a named limit of TASK-034 and this task.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; only its docstring's task list gains TASK-035. No module of the
# repository calls scope_reconcile yet; its stricter refusals change no caller.
# Risk: high, and change class critical_cr, each computed over the base by script (the scripts of TASK-034, the
# write-set being the same five paths), as for TASK-034.
# Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule],
# functional [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus
# the evidence_required of the applicable articles.
# Review points (for the five way-2 reviews and the decision agent's three): every listing line's form (AC1, AC2); the
# walked elements' modes (AC3); the event id inside the try (AC4); the docstring's R1 and L2 (AC5); no other behaviour
# changed (AC8); the widened naming rule (AC7); the new tests' oracles (AC6, AC10).
# Naming (D-544 Q3, as TASK-023 to TASK-034, widened by decision D-725 P5): every test this task adds names the AC ids
# it stands for as "TASK-035 ACn" in its own docstring.
# Evaluation path (A61; as TASK-007 to TASK-034): commit C changes only docs/tasks/TASK-035.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-035", go to task/TASK-035 under their own
# decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the
# governor, evidence records as stored, the replay and the policy meet no path of the write-set); GOV-001, GOV-004 to
# GOV-006 and SEC-003 (the concept file, the bound artifacts, the decision matrix, the records and pre-genesis
# documents, and .github/, meet no path of the write-set; the workflow is read, not changed). INV-004 applies: the
# module still appends only through writer.append_event.
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (its refusals are stricter; CR-002 part 4
# limit 8 does not apply), so its acceptance is one delegated approval of the decision agent (Master Plan section 6),
# for the decision agent's ruling.
