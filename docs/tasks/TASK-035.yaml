acceptance_criteria:
  - AC1: >-
      A name listed twice (DEF-0061 m1 (a); decision D-725 P1). In every tree listing the base read parses (every line
      of every tree it walks, not only the walked element's), a name that appears on two lines gives result "refused",
      reason "base", a finding naming the tree and the name, and no event; the last line no longer wins.
  - AC2: >-
      Control characters and quoted names (DEF-0061 m1 (b); decision D-725 C1). In every listing line parsed, a name
      holding a raw control character (U+0000 to U+001F or U+007F; a tab inside the name included) is out of form and
      gives result "refused", reason "base", and no event. A name beginning with a double quote (Git's C-quoted form,
      reading R1) is kept as an entry under its quoted text, so it never equals a walked element and does not stop the
      run; a quoted non-ASCII name beside a walked element leaves the run as it was. The rest of TASK-034 AC3's line
      form is unchanged.
  - AC3: >-
      Modes (DEF-0061 m2; decision D-725 P2 and C1). For each walked element only (a sibling's mode is not checked: a
      repository may hold symbolic links and submodules beside the walked path), a directory element must have mode
      040000 and the final blob mode 100644 or 100755; any other mode (a symbolic link 120000, a submodule 160000, a
      legacy 100664 or any other) gives result "refused", reason "base", a finding naming the file, the element and
      the mode, and no event.
  - AC4: >-
      The event id inside the try (DEF-0061 m3). The event id is taken inside the append's try: a returned event that
      is not a mapping, or that lacks event_id or payload, gives result "refused", reason "append", a finding that the
      returned event is out of form, and no append call; so TASK-034 AC9's "no exception escapes" holds by the
      module's own form, not only through claims' form.
  - AC5: >-
      The docstring (DEF-0061 m4; decision D-725 C2). Points 3 and 5 of the module docstring state AC1 to AC3's
      refusals and that a task with no task.approved event, no value given or another hash gets no entry (claims names
      it "no contract") and only facts.contracts says which; the reading "Git's "cat-file -p" prints names unquoted"
      is replaced by reading R1, labelled as the implementer's unprobed reading, with the sentence that the refusals
      hold whether or not R1 is right; limit L2 is stated; B1, D1, L1 and DEF-0030's caller stay stated.
  - AC6: >-
      Tests added (DEF-0061 t3, t4 and part of t5; decision D-725 P4). Unit tests show: a stand-in repository whose
      object ids are 40 hex characters gives the same outcome as one with 64-hex ids (a change under src/ is a claim,
      facts.policy_blob 40 characters) (t4); contract bytes whose hash matches with a changed path outside the
      write-set give a detected commit and one appended event (t3); a commit with one trailer in form and one out of
      form passes no trailer task, is detected and names "trailer out of form" (t5); facts is a mapping after a claims
      refusal and after an append refusal (t5, TASK-034 AC8 as amended by erratum E1).
  - AC7: >-
      Naming (decision D-725 P5). Every test function of the three test modules names "TASK-034 ACn" or "TASK-035
      ACn" (at least one) in its own docstring and no other task's AC in qualified form; the unit module's naming test
      is widened to this rule, and the integration and property modules each gain a naming test of the same rule that
      reads the loaded TestCase classes' docstrings, not the file.
  - AC8: >-
      Nothing else changes. reconcile_scope's and read_base's signatures, the result's keys and values, the order of
      steps, the events appended and every other behaviour of TASK-034 AC1 to AC13 are unchanged except as AC1 to AC4
      make the base read and the append stricter; TASK-034's tests pass unchanged except the naming test (AC7); no
      module of src/ changes except scope_reconcile.py and __init__.py's docstring task list; every other module and
      test is unchanged, and if one can pass only by a change the task escalates (needs_out_of_scope_change).
  - AC9: >-
      Purity and the CI checks (INV-001 to INV-004). The module's imports stay exactly datetime, hashlib, re and
      aieos_bootstrap.gitread, records, scope_drift and writer (TASK-034 AC11); the tests use the standard library only
      (unittest.mock.patch of scope_drift.claims in the unit module allowed, restored after its test, decision D-725
      P3). At the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and
      bandit ("bandit reports no finding in CI"). Before the first push, the added and changed lines of the write-set
      are scanned for the patterns of bandit's tests that the CI applies (decision D-725 P6): B324 (hashlib md5 or sha1
      without usedforsecurity=False), B404, B602 to B607 (subprocess and shell use), B605 (os.system, os.popen), B307
      (eval), B102 (exec), B301 and B403 (pickle, marshal), B506 (yaml.load), B306 (tempfile.mktemp), B101 (assert, in
      src only), B311 (random, in src only), B104 (a bind to 0.0.0.0), B105 to B107 (password-like names), B310
      (urllib urlopen), B313 to B320 and B405 to B411 (xml parsers); every count is 0 or the hit is brought to the
      decision agent before the push. The scan is a stated limit, not bandit; the CI's bandit run is the evidence.
  - AC10: >-
      Its own tests and the added text. The tests write and remove no file and open none except the package's own
      source files (TASK-034 AC14's rule). Before each commit, the added text is scanned with the workflow's SEC-001,
      SEC-002 and OPS-003 patterns, and each count is 0; the file names are scanned with the same patterns and the
      records executors' pre-push pattern (D-282). Tests, each rule with at least one passing and one failing case:
      R1 AC1 (a name listed twice in the walked element's tree and in a tree whose sibling is listed twice: refused
      "base"; distinct names: as before); R2 AC2 (a tab and another control character inside a name: refused "base";
      a quoted non-ASCII sibling: the run as before; a quoted name never matches a walked element); R3 AC3 (a symbolic
      link at the policy's path, a tree element with a blob mode, a submodule mode and a legacy 100664: refused
      "base"; 100755 for the blob: as before; a sibling symbolic link: as before); R4 AC4 (claims patched to return a
      non-mapping event and an event without event_id: refused "append", no append call); R5 AC5 (a script check of
      the docstring's R1, L2, B1, D1, L1 and DEF-0030 sentences and of the absence of the replaced reading); R6 AC6;
      R7 AC7 (the three naming tests). tests/run_tests.py, unchanged, runs all groups.
  - AC11: >-
      The placements (decision D-725 P4 and C3). t1, t2 and the rest of t5 are carried to M4's exit review point, and
      L1 stays a named limit; the acceptance records name them and DEF-0061's log carries them at acceptance (a
      records change of its own, outside this write-set).
