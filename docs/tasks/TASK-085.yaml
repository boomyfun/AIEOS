constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The arguments and the reader: git_inputs(repo, commit, task_id, log, read=None); repo not a str, commit not 40
      or 64 lowercase hex, task_id not TASK-<digits>, log not bytes, or read neither None nor callable, each give
      (None, findings) with zero reads (a stand-in counts them); read defaults, at call time, to gitread.run (a patch
      of gitread.run after import is the one called); every read is one of gitread's four fixed forms
      (gitread.form_error gives None for each recorded call); a commit that rev-parse --verify does not give back
      as itself, or that cat-file -t does not give as "commit", gives findings.
  - AC2: >-
      is_ancestor(repo, commit, base, read=None), over a stand-in Git of commits with known parents: true when base is
      commit itself, its parent, a later ancestor, or reached only through a merge commit's second parent; false when
      it is not reached and the walk runs out; each commit visited once (a diamond is walked with no repeat, counted);
      MAX_WALK is a module constant read at call time and visiting more commits gives findings (patched lower for the
      test); its arguments checked as git_inputs' are; it never raises.
  - AC3: >-
      commits: for a chain base, c1, c2, c3 the list is [c1, c2, c3] (oldest first, base left out), each exactly
      {id, paths, submitted}; a path present at the commit and its parent is modified, only at the commit added, only
      at the parent deleted, a nested path (a/b/c.py) classified through its folder's listings; a path diff-tree
      names that is in neither listing gives findings; each (commit, folder) is listed once (a counting stand-in);
      submitted is true only for a commit a task.submitted of task_id names (one of another task, and a duplicate
      line, do not count); a
      merge commit on the chain gives findings; base_is_ancestor false gives commits []; MAX_COMMITS and MAX_PATHS are
      module constants and reaching either gives findings.
  - AC4: >-
      contract, contract_hash, components, interfaces and schemas: the contract is docs/tasks/<task_id>.yaml at the
      given commit, contract_hash the SHA-256 of its bytes (a changed byte changes it); a missing file, a contract
      out of base_inputs' subset, a missing CONTRACT_NEEDS key, a contract whose task is not task_id, or a
      base_commit not a commit id gives findings;
      components and interfaces are base_inputs.components_of's for the contract (an interface entry out of the
      aieos_bootstrap.<module>.<name> form gives findings); schemas is []; a non-empty read_set.schemas gives
      findings; a base_commit in form that names no object (cat-file -t exits non-zero, error None) or names a blob
      gives base_is_ancestor false, commits [], derived_read_set [] and each symbol's base null, with no findings,
      while a cat-file -t answer with an error gives findings; a given commit naming no object or a blob gives
      findings.
  - AC5: >-
      symbols and derived_read_set: for each interface entry, in order, {interface, base, head} with base and head
      resume_check.signature_form's form at base_commit and at the given commit (a changed signature differs, an
      unchanged one is equal, a module absent at base_commit gives base null, the same unparsable text at both
      commits gives base and head null, an entry with trailing words keeps the whole entry as interface);
      derived_read_set is the sorted union of resume_check.direct_imports' paths for the write set's .py files
      present at base_commit (roots "src/" and
      ""), a write-set file absent at base_commit adding nothing, a file that cannot be parsed adding nothing, a
      standard-library import adding nothing.
  - AC6: >-
      The output and failing closed: the dict has exactly the ten keys; merged with fixed placeholders for the other
      twelve keys (in section 9's forms), resume_check.check gives a record with no error (the form of every value
      the module returns is section 9's); a read that raises (RuntimeError, RecursionError, MemoryError), a read
      answer out of form, or records.check_log's findings give (None, findings); no call returns a partial dict or
      raises; findings are a non-empty list of strs.
  - AC7: >-
      base_inputs.py: contract_at, components_of, paths_under and submitted_commits exist and give their stated
      values over a stand-in;
      by ast over pathlib's read_bytes, base_inputs.py's imports and the attributes it uses of base_files, gitread,
      records and resume_check are exactly those of tests/unit/test_base_inputs.py :537-545 (that file unchanged and
      passing); its existing lines are unchanged (checked at review from the change C..X, not by a test). The new
      module imports only hashlib and re of the standard library, if any, and aieos_bootstrap's base_files,
      base_inputs, gitread, records and resume_check; it names no open, exec, eval, compile, __import__, subprocess,
      os, sys, time or autonomy, no attribute now, environ, getenv, write, grant_lease or append_event, and no
      ".aieos" string; it reads no clock and no environment (mock patches of time.time and os.getenv that raise are
      not reached).
  - AC8: >-
      Over this repository (an integration test through gitread.run, the repository found by pathlib as
      tests/integration/test_base_inputs_repo.py :13 does; it needs the full history): git_inputs with commit
      bd0df8b6689815bdec446979fdb74fe419f78740 for TASK-084 (its contract's base_commit
      80934ee51e923a7a0a9785948d46da5c332ab332) gives base_is_ancestor true; commits exactly e3afc15d… with
      [docs/tasks/TASK-084.yaml added], 156351ea… with
      [docs/Deferred/DEF-0099-list-tasks-does-not-re-check-a-tasks-dependencies.md added,
      docs/records/TASK-084.jsonl added], 6efa8d70… with [src/aieos_bootstrap/execution.py
      modified, tests/unit/test_execution_list_tasks.py added] and bd0df8b6… with
      [tests/unit/test_execution_list_tasks.py modified], in that order, each by its full id; contract_hash the
      literal 9aa14f2af34e1446599361e177d4280b020f527ce1fc3649d6061455244fd807; the symbols of its four interface
      entries equal at both commits; derived_read_set exactly [src/aieos_bootstrap/records.py,
      src/aieos_bootstrap/resume_check.py, src/aieos_bootstrap/writer.py] (execution.py's imports, :113-115; the
      test file absent at base_commit); the log given is b"" (so submitted is false for each) (disp85 row 10; the
      false case stays with AC2's stand-ins, since a false walk over this repository visits its whole history,
      disp85r2 row 5).
  - AC9: >-
      Every existing test passes, the pins of the header among them; tests/unit/test_base_inputs.py is unchanged; the
      full suite runs locally in three unit parts, integration and property before the first code commit; the
      deterministic rule's local run gives no finding. The new module's docstring holds, whitespace read as single
      spaces, the phrases "the commit is an argument", "read is injectable", "never raises", "writes nothing",
      "fails closed", "this task's choice", "ten of the 22 inputs", "DEF-0097" and "R5 F4", read by a test by ast;
      base_inputs.py's docstring gains a paragraph naming the four wrappers and "TASK-085", which also says that
      :8's "TASK-085 is to pass HEAD" now reads as a commit argument given by the launcher (disp85 row 16); every
      new test names
      "TASK-085 ACn".
  - AC10: >-
      Broken copies, each failing the tests of its AC, each naming the file it changes (disp85 row 15): (1)
      resume_inputs.py binds read at import time (AC1); (2) resume_inputs.py's is_ancestor follows the first parent
      only (AC2); (3) resume_inputs.py lists the commits newest first (AC3); (4) resume_inputs.py marks every path
      modified (AC3); (5) base_inputs.py's submitted_commits drops its task_id filter, so a task.submitted of
      another task counts (AC3; disp85r2 row 6); (6) base_inputs.py's contract_at hashes the parsed contract
      instead of the file's bytes (AC4, a case changing only a comment byte);
      (7) resume_inputs.py drops components_of's findings and goes on (AC4); (8) resume_inputs.py takes the symbol's
      base form at the given commit (AC5); (9) resume_inputs.py adds the write set's files themselves to
      derived_read_set (AC5); (10) resume_inputs.py returns the dict found so far on a read error (AC6); (11)
      base_inputs.py gains an import (AC7); (12) resume_inputs.py follows a merge commit on the chain by its first
      parent (AC3); (13) resume_inputs.py passes "unparsable" through as a symbol value (AC5); (14) resume_inputs.py
      marks a path in neither listing as modified (AC3; disp85r2 row 3);
      each copy made in a scratchpad script at G3 (brk85, as brk84: the module copied, one exact replacement, the named
      tests run), not committed, since the test files may not exec or compile source (aieos-checks.yml :1494); copy
      (11)'s text is shown failing AC7's ast check; the governor's evaluate at acceptance (the shadow) with any
      difference named; the stated choices in the records (not tests).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1200k, wall_time: 6h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9]}
  - {gate: G3, check: constitution, args: [AC10, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
