# TASK-085: the Git side of the Resume Check's inputs, read at a given commit, in a new module resume_inputs.py
# (specification 3 revision 5, sections 1 and 4; conformance-files.md section 9; specification 7 revision 2, section 5;
# DEF-0097; M7's fifth task). Plan: decisions D-2533 to D-2538 (session 3797498a): the scope note
# (MYSP/t85/scope85.md) and the ten rulings of D-2533, the pin scan (MYSP/t85/pinscan85-out.txt at bd0df8b6 and its
# reading MYSP/t85/pinscan85-reading.md, D-2535 to D-2537), the risk run (MYSP/t85/risk/risk_class85.py, D-2538), the
# forbidden list (MYSP/t85/forbid85.txt, D-2538, the write-set file base_inputs.py left out), and the rulings (a) to
# (c) of D-2538.
#
# Scope:
# - A new module src/aieos_bootstrap/resume_inputs.py with two public functions, is_ancestor(repo, commit, base,
#   read=None) (the walk, below) and git_inputs(repo, commit, task_id, log, read=None), the latter returning (a
#   dict, None) or (None, findings), findings a non-empty list of strs, never a partial dict.
#   The dict holds exactly ten of the Resume Check's 22 input keys (resume_check.py :44-48), in conformance-files.md
#   section 9's forms (:94): head_commit, base_is_ancestor, commits, contract, contract_hash, components, interfaces,
#   symbols, schemas and derived_read_set. read defaults, at call time, to gitread.run, and every Git read goes
#   through it in one of gitread's four fixed forms (gitread.py :5-12); no new form.
# - In src/aieos_bootstrap/base_inputs.py, by added lines only (no existing line changed or removed), four public
#   wrappers over its existing helpers (D-2533 ruling 2; D-2538 (a), (c); disp85 row 6):
#   - contract_at(repo, commit, task_id, read=None): docs/tasks/<task_id>.yaml at commit through _read and
#     _parse_contract_text, task_id's form checked before the path is built, CONTRACT_NEEDS checked and the contract's
#     task equal to task_id, as _contract does (:450-460; disp85 row 4); returns ((contract, sha256 hex of the
#     file's bytes), None) or (None, findings); no log, approval or Resume Check record is read (a first Resume Check
#     has none, so _contract, which needs them, is not used);
#   - components_of(contract): _components(contract), as ((components, interfaces), None) or (None, findings);
#   - paths_under(repo, commit, prefix, read=None): _listing (an absent prefix gives []), as (paths, None) or (None,
#     findings);
#   - submitted_commits(log, task_id): the payload.commit of every task.submitted event of task_id that
#     _log_events gives (records.check_log's lines, duplicates left out; its findings fail closed), as (a list of
#     commit ids, None) or (None, findings) (disp85 row 6: no copy of the log filter, INV-003).
#   Each wrapper builds its state as _inputs does (:625) and catches _Stop and any other exception as
#   work_order_inputs does (:641-646). They use no import and no attribute of another module beyond those base_inputs
#   uses now (tests/unit/test_base_inputs.py :528-545).
# - What it does not do: the other twelve inputs (task_id and runtime are the launcher's, TASK-086; log_seq, task_state
#   and approved_contract_hash are execution.py's; dependencies, observed_read_set, budget_use, intent_current,
#   articles, risk_rules and policy_version are TASK-085b's, D-2533 ruling 1); no call of resume_check.check; no write,
#   no append, no grant, no lease; no HEAD read (the commit is an argument, D-2533 ruling 6).
#
# The rulings (D-2533, D-2538), each this task's choice (proposed):
# - head_commit (ruling 1): the given commit, checked by rev-parse --verify to name itself and by cat-file -t to be a
#   commit.
# - contract and contract_hash (D-2538 (a)): base_inputs.contract_at at the given commit; contract_hash the SHA-256
#   hex of the file's bytes there (specification 2 section 2); the contract's input_state.base_commit must be a commit
#   id (40 or 64 lowercase hex), or fail closed. base_commit is then checked by cat-file -t alone (disp85 row 3;
#   disp85r2 row 2): an answer with error None and a non-zero exit, or exit 0 with a type other than "commit", means
#   that it is not a commit; an answer with an error, or out of gitread.run's form, fails closed; the given commit
#   fails closed on the same "not a commit" answers, since it must exist. When base_commit is not a commit of the
#   repository, base_is_ancestor is false, commits [], derived_read_set
#   [] and each symbol's base null, so that check 1 of specification 3 decides (ESCALATE, :40); a stated choice.
# - base_is_ancestor (ruling 3; disp85 row 2): a second public function of the module, is_ancestor(repo, commit,
#   base, read=None), returning (True or False, None) or (None, findings), never raising, which git_inputs calls: a
#   breadth-first walk from commit by rev-list --parents -n 1, every parent followed, each commit visited once; true
#   when base is reached (base equal to commit included); false when the walk ends with no commit left (a root reached
#   without base, or a shallow clone's cut, a stated limit); visiting more than MAX_WALK commits (a module constant,
#   20000, read at call time) fails closed. AC2 tests is_ancestor directly, so a base reached only through a merge's
#   second parent gives true there, while git_inputs then fails closed on the merge (the commits ruling).
# - commits (ruling 4; D-2538 (c)): when base_is_ancestor is true, the first-parent chain from the given commit back
#   to base_commit, base_commit left out, oldest first (resume_check.py :15-16 reads a path changed by several commits
#   as the last one's change), at most MAX_COMMITS commits (a module constant, 1000); a commit on the chain with more
#   than one parent fails closed (a stated limit: the self-build's main has no merge commit, it moves by fast-forward
#   and cherry-pick, .git/logs/HEAD; disp85 row 14). When
#   base_is_ancestor is false, commits is [] (check 1 of specification 3 then decides; a stated limit). Each commit:
#   {id, paths, submitted}; paths from diff-tree --name-only of the commit (against its one parent), each {path,
#   change}: modified when the path is in the listing of its folder at the commit and at the parent, added when only
#   at the commit, deleted when only at the parent (both listings through base_inputs.paths_under; no tree parser is
#   copied, INV-003); a path in neither listing fails closed; git_inputs passes one memoized read (its own memo of
#   each (repo, args, timeout)) to every wrapper and base_files call, and lists each (commit, folder) once (disp85 row
#   7), at most MAX_PATHS paths per commit (a module constant, 5000); submitted true when a task.submitted
#   event of task_id in the log (records.check_log's lines, duplicates left out) has payload.commit equal to the id.
# - components and interfaces: base_inputs.components_of(contract) (the self-build's one component per module named
#   by an interface entry, base_inputs.py :496-518); a stated limit inherited from TASK-082: specification 3 :29
#   reads the architecture entities' files at HEAD (specification 2 section 4.2), not one component per module
#   (disp85 row 9).
# - schemas (D-2538 (b)): [] for the self-build; a non-empty read_set.schemas fails closed, as components_of refuses it
#   (base_inputs.py :500-501); a stated limit, carried with DEF-0097's remainder to TASK-085b.
# - symbols: for each read_set.interfaces entry, in the contract's order, {interface, base, head}: interface the
#   entry exactly as written (resume_check.py :370 matches on it; base_inputs.py :514), its first word
#   aieos_bootstrap.<module>.<name> used only to find the module and the name; a file's absence told by its
#   membership in paths_under(repo, c, "src/aieos_bootstrap"), then its text by base_files.read_file (disp85 row 8);
#   base the fixed form resume_check.signature_form(text, name) of
#   src/aieos_bootstrap/<module>.py's text at base_commit, head the same at the given commit; null when the file is
#   absent at that commit (signature_form itself gives null or "ambiguous" for the text); "unparsable" at either
#   commit is given as null (passed through, it would compare equal at both commits and read non-breaking, against
#   specification 3 :73; a null base or head reads breaking, resume_check.py :375-376, before the equality test at
#   :379, which is :73's verdict; disp85r2 row 1, reversing disp85 row 1).
# - derived_read_set (D-2538 (a); specification 3 :63): every path of the write set's paths that ends in ".py" and is
#   in the listing at base_commit (a write-set entry with "*" matched by resume_check.matches over the whole
#   listing at base_commit, the one listing direct_imports is also given, so no prefix code; disp85r2 row 4), read
#   at base_commit and given to resume_check.direct_imports(text, ["src/", ""], the paths at base_commit); the
#   union of the "paths" it returns, sorted, each once. A file direct_imports cannot parse and the
#   imports it leaves unresolved add nothing and are not returned (section 9's derived_read_set is a list of paths;
#   a stated limit: the record's unresolved and unanalysed stay the caller's, R5 F4).
# - The output (ruling 7): exactly the ten keys, or (None, findings); never raises. Of the contract's values only
#   CONTRACT_NEEDS, task and input_state.base_commit are checked here; the forms of its other fields (risk,
#   contract_version, constitution, autonomy.budgets, depends_on, intent_versions) are resume_check's, which gives an
#   error record for one out of form (resume_check.py :277-301; disp85 row 5).
# - The log (ruling 4): given as bytes, read only for task.submitted, through base_inputs.submitted_commits;
#   records.check_log's findings fail closed.
# - The module's own Git reads (rev-parse, cat-file -t, rev-list, diff-tree; disp85 row 6) go through one helper: the
#   answer must be a mapping with exit 0, out bytes and error None (gitread.run's form, gitread.py :126-127), else
#   findings, cat-file -t of base_commit apart (its non-zero exit with error None means "not a commit", above); the
#   timeout is gitread's default, 30; rev-list's output's first token must be the id asked and every other token a
#   commit id; diff-tree's output is read by gitread.parse_paths, whose error fails closed. MAX_WALK,
#   MAX_COMMITS and MAX_PATHS are read at call time.
#
# DEF-0035's carried findings (D-2533 ruling 8): R5 F4 is closed here as documentation only (resume_check's record
# keeps read_set.unanalysed [], resume_check.py :685; disp85 row 13): the module docstring says that
# derived_read_set is computed from the write set at base_commit, that unresolved imports and unparsable files are not
# returned, and that every other input stays the caller's. Staying, each with its reason: R2 a, R2 e, R5 F6, R1 2, R1 3,
# R3 and R4 (TASK-008's own tests and code, not reached here); R2 b, R2 c, R2 d and R5 F5 (resume_check's matching and
# check 7, specification 3's next revision); R5 F2 and R5 F3 (budget_use and risk_rules, TASK-085b).
#
# Owner-act boundary: none reached. The module reads only; it grants nothing and launches nothing; no hook, setting,
# policy, gitread form or measurement (DM A51 item (4); gitread.py :13-15).
#
# Stated limits:
# - Ten of the 22 inputs; no call of resume_check.check with all of them until TASK-085b.
# - schemas always [] for the self-build (a non-empty entry fails closed).
# - A merge commit on the first-parent chain fails closed; commits is [] when base_commit is not an ancestor.
# - Renames are not detected (diff-tree --no-renames, as resume_check.py :16 reads it).
# - The repository is read at one moment; a ref that moves during the read is the launcher's (ruling 6), and so is
#   whether the commit given is the base branch's tip (specification 3 :20); base_commit equal to the commit gives
#   base_is_ancestor true and commits []; a shallow clone's cut reads as a root, so base_is_ancestor may be false
#   where the full history would say true (disp85 row 12).
# - derived_read_set holds only the resolved direct imports, one level; unresolved and unanalysed are not returned.
# - Each bound (MAX_WALK, MAX_COMMITS, MAX_PATHS) fails closed when reached.
# - A symbolic link, a submodule or a name out of base_files' form anywhere under a folder that is listed (a touched
#   folder, src/aieos_bootstrap, or the whole tree at base_commit for derived_read_set) fails the whole call
#   (base_files.py :174-181; disp85 row 7).
#
# The pins (L-0026; MYSP/t85/pinscan85-out.txt at bd0df8b6; D-2535 to D-2537): tests/unit/test_base_inputs.py :528-545
# (base_inputs imports exactly hashlib, re, base_files, gitread, records and resume_check, and uses exactly
# base_files {read_file, list_paths, MAX_BYTES}, gitread {run}, records {check_log}, resume_check {matches}), kept:
# the wrappers add no import and no such attribute; :547-564 (no refused name, call, string or handler), kept; :566-586
# (reads through read only, never raises), kept; :589-598 (the docstring's eight phrases), kept, a docstring paragraph
# added; :600-607 (every test of that file names "TASK-082 ACn"), unchanged since the file is not changed.
# src/aieos_bootstrap/__init__.py is not changed, so __all__ does not name the new module (as adapter.py :53 and
# replay.py :60 state). The package-wide scans tests/unit/test_writer.py :397-412 (no open, no project-state string),
# tests/unit/test_gitread.py :370-380 (no subprocess) and tests/unit/test_autonomy.py :238-246 (no autonomy) hold for
# the new module. The deterministic rule (.github/workflows/aieos-checks.yml :1489-1513): the four write-set paths
# have no allowance, so they import only the standard library and aieos_bootstrap, no DENY_MODULES module (tempfile,
# sqlite3 and shutil among them, :1490-1493), no DENY_NAMES name (:1494), no DENY_OS call (:1495-1496) and no
# DENY_ATTR_CALLS call (:1499-1500). GOV-003's EVALUATOR list (src/aieos_bootstrap/**, aieos-checks.yml :423),
# unchanged. bandit (no B101, B110, B112). tests/unit/test_base_inputs.py is not changed. No change under .github/.
#
# Risk: high, computed over the base by MYSP/t85/risk/risk_class85.py (R2 medium and R3 high, not evaluable, for each
# path). GOV-003: src/aieos_bootstrap/** is an evaluator path; change class ruled at acceptance. Reviews on Sonnet 5.5
# and Opus 5.5 (never Fable), read tools only; the acceptance review on Sonnet 5.5, the implementer being Opus 5.5
# (governor.py :270-275). Naming (D-544 Q3): every new test function names "TASK-085 ACn" in its own docstring. Not
# applicable: OPS-001; INV-005 to INV-011; GOV-001, GOV-004 to GOV-006, SEC-003. INV-004 is not reached (nothing is
# written); it stays listed for the evaluator path's profile.
# Owner-kept acts: none in this task.
# Shadow (D-2042 C3 as amended by D-2068): the governor's evaluate at acceptance, any difference named.
# Local runs: the unit group in three parts.
