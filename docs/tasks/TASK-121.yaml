# Task contract TASK-121, r2 FILLED DRAFT (r2 with the FILL_BY_SCRIPT values filled by script from the blobs at base_commit, nothing else changed; r2 = r1 with the changes C1 to C3 of D-4958 and nothing else, written as a new file; r1 = r0 with the changes M1 to M5 of D-4956; session 43f86835; a new file in the layout of TASK-119.yaml and TASK-120.yaml; written in the scratchpad; NOT approved, NOT in the repository). Whether this text is approved is recorded only in the decision agent's decision that names its SHA-256, not in this file.
# Why: D-4955 (D2). The check code of the CI conformance steps judges a push to main that changes src/aieos_bootstrap/resume_check.py against ONE pin value P read from the pushed head's own workflow: the pushed file must equal P (aieos-checks.yml:1064-1066 and :1400-1402) and the base run (base = the tip before the push on main, origin/main on a branch) fails unless the base's file and the run's record equal P (:1146-1148 and :1482-1484). A change of the pinned file from h_old to h_new therefore needs P = h_new and P = h_old at once, which is impossible, so every pinned upgrade of the file forces a main commit with P empty. TASK-120's landing needs exactly that, and the push of such a commit (P0) was stopped by the app's classifier (D-4954). This task fixes the defect so that TASK-120 can land with P never empty. The governor pin has the same flaw; it is the owner's (DM A65) and stays untouched.
# Facts read (main 54fd38de; Read, Grep): aieos-checks.yml:172-179 is the comment of the Resume Check pin (":174-175" the sentence beginning "Pinned:") and :180 is the value line AIEOS_PINNED_RESUME_CHECK; the first conformance step reads PINNED_RC at :906, sets on_main at :1033 (before the `if on_main:` branch at :1034), judges a push to main at :1034-1069 (touched at :1052-1054, the single-trailer rule :1055-1057, the pushed-file check :1064-1066, "no run" without a trailer :1067-1069), takes base = the tip before the push on main and refs/remotes/origin/main on a branch (:1070, :1076), computes rc_sha of the base's file at :1081-1082, and checks the base run at :1146-1148; the second step is a copy: PINNED_RC at :1242, touched at :1388-1390, the pushed-file check :1400-1402, the base check :1482-1484. The base-run check does not depend on on_main, so it applies to a task-branch run too (base = origin/main); this is why the rule below must not depend on the run kind.
# Risk: critical (a change under .github/ is a GOV-003 evaluator path, and it edits the project's own gate).
# Authority: a self-build change under DM A41/A51 and DM A66 (changes under .github/, each its own decision, the decision agent reading the exact diff, bound by SHA-256). It ADDS one bounded acceptance to two checks (AC3) and loosens nothing else; the governor pin, its checks, write access, secrets, tokens and settings are untouched (AC4, AC6).
task: TASK-121
