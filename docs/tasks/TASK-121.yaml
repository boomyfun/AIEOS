objective: >-
  Let a pinned upgrade of the Resume Check file land with the pin never empty, by design (beta): add a second job env value AIEOS_PINNED_RESUME_CHECK_PREVIOUS (empty = off) and, in both conformance steps, accept in the BASE run the previous version as the base's file when, and only when, the previous version is a 64-hex value, the base's file equals it, and the HEAD's file equals AIEOS_PINNED_RESUME_CHECK. The rule does not depend on the run kind (main push or task branch). Every other behaviour of the Resume Check pin stays as at base_commit. A text test, tests/integration/test_ci_resume_pin_logic.py, checks the new text and a reference model of the rule.
