constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The state. A test that needs the state reads the set file of the tree (conformance.SET_FILE, unwrapped as the
      runner reads it) and takes the entries whose capability is Resume Check; it asserts that their ids are exactly
      RC-01 to RC-11 and that either every one has fixture null (the null state) or every one has a fixture whose path
      is the frozen file conformance.expected_path gives for it and whose sha256 is that file's (the present state); any
      other mix fails the test. No test reads the state from anywhere else.
  - AC2: >-
      Class (a), the fixed set value. In each of tests/unit/test_runner.py, tests/unit/test_runner_rc.py and
      tests/property/test_runner_properties.py, one new helper returns the module's in-memory files with the set file
      replaced by the fixed value: the tree's set value with every Resume Check entry's fixture null and
      fixture_set_version 1, written as the runner writes a set file; a test asserts that its bytes have the SHA-256
      158323324f2803bceee870403bc6c0e297c407fbe50902d60bec90624cc95208 (the set file at 1659a8cb, frozen by
      TASK-002's record), so in the null state the helper's files equal the module's real_files() byte for byte and
      no freeze line is added in either state (reading: the fixed bytes are already approved by TASK-002's freeze
      record, which stays in docs/records/). The class (a) tests switch to that helper and nothing else in them
      changes: in test_runner.py R1ReaderAndRoot.test_the_running_runner_must_be_the_roots,
      R3DoesNotCount.test_a_set_without_its_freeze_approval and
      test_a_stand_in_never_counts_but_its_results_are_computed, R4FreezeApproval.test_a_human_authority_approval_counts
      (through without_the_set_freeze), R5FixtureConditions.test_a_path_outside_the_fixtures_is_never_read and
      test_an_id_on_two_rows, R6EntryPoint.test_absent and test_loaded_from_the_root, R8RunRecord.test_keys_order_and_record
      and test_outcome_pass_and_fail, R9Main.test_output_and_return_values (its in-memory part); in test_runner_rc.py
      R3EntryPoint.test_no_load_when_no_resume_check_entry_has_a_fixture, R4FixtureForm.test_each_malformed_condition
      (through the helper its malformed cases build on), R5CallAndComparison.test_the_call_gets_a_copy_of_the_inputs and
      R6RunRecord.test_the_key_is_absent_without_a_resume_check_fixture; in test_runner_properties.py
      RunnerProperties.test_inv_008_only_an_approver_makes_the_run_count. A shared helper the module already has (for
      example real_files, set_value, with_rc) may be pointed at the fixed value for these tests only by a new helper,
      never by changing what real_files returns. A script shows every assertion line of these tests, and every line of
      the modules outside the new helpers and the changed call lines, byte-equal and in order before and after.
  - AC3: >-
      The mirror. In tests/unit/test_runner.py and tests/property/test_runner_properties.py, one new helper returns the
      module's real_files() plus the Resume Check module (conformance.RESUME_CHECK_PATH) and every .py file of
      conformance.RC_FIXTURE_DIR, as the tree holds them. The tests whose point is the real tree use it:
      test_runner.py R1ReaderAndRoot.test_inputs_come_only_through_the_reader, R3DoesNotCount.test_the_real_set_counts and
      R4FreezeApproval.test_the_real_approval_and_two_approvals_of_one_hash, and test_runner_properties.py
      RunnerProperties.test_the_same_inputs_give_the_same_run_record. Their assertions stay byte-equal and hold in both
      states; any one that cannot hold in both states takes AC4's form instead, and the request that brings the first
      push names it. real_files() itself does not change.
  - AC4: >-
      Class (b), the null state keeps every assertion. The tree-run tests test_runner_rc_run.py
      R7RepositoryTree.test_ac8_the_results_over_the_repositorys_tree_are_unchanged, test_governor_conformance.py
      GovernorConformanceTest.test_the_verification_scenarios_pass_and_the_others_are_not_run, and test_runner_run.py
      RunnerEndToEndTest.test_no_governor, test_a_stand_in_that_answers_from_the_expected_values and
      test_a_stand_in_with_one_decision_outside_a_list read the state by AC1 and branch on it. In the null state each
      asserts exactly what it asserts at the base: a script check shows that every line of the three modules at the
      base is present, byte-equal after stripping its leading spaces and in order, in the changed module, and lists
      every re-indented line; the added lines hold no assertion that a value may be either of two results.
  - AC5: >-
      Class (b), the present state is exact. In the present state each test of AC4 asserts exact values, never one of
      several: every scenario's result and, for each NOT_RUN, its reason; the counts of PASS, FAIL and NOT_RUN; the
      record's outcome and the run record's counts; and the run record's resume_check, {path, sha256} with the SHA-256
      of src/aieos_bootstrap/resume_check.py in the tree, wherever the runner loads the Resume Check. For the R7 test:
      32 results, RC-01 to RC-11 PASS with reason '', ACC-01 to ACC-17, ADV-01 and ADV-03 PASS, exactly RISK-01 and
      ADV-02 NOT_RUN, the outcome pass, and the Resume Check searched for and loaded from the tree (reading: in the
      present state the run loads it, so the null state's "not searched, not imported" becomes "searched and loaded
      from the root"). The values of the other four tests are those a run at the task's commit gives over the present
      state of AC7, written in the tests as literals and listed in the request that brings the task's first push.
  - AC6: >-
      Nothing else changes. Every other test that tests/run_tests.py runs passes unchanged at the task's commit. The
      changed modules name the Resume Check fixture folder only through conformance.RC_FIXTURE_DIR or the constants
      they hold at the base, so tests/integration/test_conformance_rc_set.py's folder check is unchanged in outcome.
  - AC7: >-
      Both states, by the whole suite. At the task's commit, tests/run_tests.py passes in full over the tree (the null
      state). In a scratch clone at the task's commit with the present state simulated as decision D-365's experiment
      did (the eleven Resume Check entries pointing at their frozen files, fixture_set_version 2, one freeze record of
      the new hash; the script exp_present.py, archived with the evidence of session 6d406b7f), the failing tests are exactly the 25 class (c) ids of
      decision D-369 (test_conformance_files 15, test_conformance_properties 5, test_conformance_rc_set 3,
      test_conformance_set 2) and nothing else. Both runs and the id comparison are in the request that brings the first
      push.
  - AC8: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The modules import only what they import at the base and
      the standard library; they use no exec, eval, compile, __import__ or importlib, start no process, open no
      network connection, call no model and write no file; they name no project-state directory. The CI steps at the
      task's commits report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit, as TASK-006's
      contract lists them. Before each commit, the added text and the file names are scanned with the workflow's
      SEC-001, SEC-002 and OPS-003 patterns and the records executors' pre-push pattern (D-282), and each count is 0.
  - AC9: >-
      Does not loosen (GOV-003), and the limits. A script over the base and the task's commit shows: no assertion line
      of the six modules removed or changed other than by re-indentation under AC4; no test removed or skipped; every
      added assertion compares with one exact value; the count of assertion calls in each module does not fall. Limits:
      until TASK-014 lands, the present state is run only by AC7's simulation; the exact present-state results rest on
      the frozen fixtures and TASK-008's Resume Check; AC2's pin fails closed if TASK-014 changes the set file beyond
      the eleven fixtures and fixture_set_version.
  - AC10: >-
      Tests, with this rule-to-test list: R1 AC1 (a mixed state fails: the state check run over an in-memory set value
      with one entry filled gives a failure); R2 AC2 (the pin of the fixed value's SHA-256; the line check by script);
      R3 AC3 (the mirror tests pass over the tree and under AC7's simulation); R4 AC4 (the line check by script; the
      null branch passes over the tree); R5 AC5 (the present branch passes under AC7's simulation); R6 AC7 (both suite
      runs). tests/run_tests.py, unchanged, runs them.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC10]}
  - {gate: G3, check: constitution, args: [AC8, AC9, INV-001, INV-002, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
