# Task contract TASK-013, the runner tests that depend on the set file's Resume Check entries, made to hold in both
# states of those entries (Master Plan revision 3, §4 M3; the M3 work order of decision D-254, as amended by decisions
# D-262, D-263, D-333, D-337, D-364 and D-365; specification 2 §5.1). Revision 1, drafted under decisions D-365 (C2) and
# D-369 (C3) from the unapproved revision 0 of D-364; brought for approval in its own request; whether it is approved
# is recorded in the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and
# TASK-012's contract. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Why (D-364, D-365, D-369): the fixture task that gives RC-01 to RC-11 their set-file entries (TASK-014, the Master
# Plan's "TASK-005b") makes 73 tests fail: a scratch run of the whole suite at 1659a8cb with the set file in that state
# (the eleven Resume Check entries pointing at their frozen files, fixture_set_version 2, one freeze record of the new
# hash) gave "FAILED (failures=54, errors=19)" in ten modules. Classified by decision D-369: 41 in unit and property
# tests that read the tree's set file only for a set value (class (a)); 7 in tests whose point is a run over the
# repository's tree or its in-memory mirror (class (b)); 25 in test_conformance_* modules, which belong to TASK-014
# (class (c)); none caused by the simulation itself. A fixture task may change only files under tests/conformance/ and
# test_conformance_* modules (conformance-files.md section 8, :78), and an implementation task may not change
# tests/conformance/** (:81), so the six modules of classes (a) and (b) change first, in this task, and no assertion
# becomes weaker (D-364, the stricter form).
# The id: digits only, as G0's trailer pattern requires; TASK-012 is the highest id used, so this is TASK-013 (checked by
# script against docs/tasks/ and the decision files); TASK-014 is the next.
# Task type: implementation (reading, as TASK-012's: the changed paths are tests of the conformance runner, of its Resume
# Check part and of the governor's conformance run, not tests of the conformance files of section 8, so not a fixture
# task). GOV-002 applies: tests/conformance/** is forbidden.
# Readers of the changed paths: tests/run_tests.py and the CI workflow's unit_test, property_test and integration_test
# steps run them; tests/integration/test_conformance_rc_set.py reads the bytes of every .py file under src/ and tests/
# for the Resume Check fixture folder's last path part and allows it only in the modules it lists
# (test_runner_rc.py and test_runner_rc_run.py among them; test_runner.py and test_runner_properties.py not), so the
# changed modules name that folder only through conformance.RC_FIXTURE_DIR or the constants they already hold (AC6); no
# other file imports or reads them (checked by script).
# Risk: high. R2 matches tests/** (medium); R3 read fail closed matches tests/** (high; risk rules section 2 point 3); no
# path of the write set meets R11 (tests/conformance/**); the highest wins. Profile (assurance-model.md §5, gov-AIEOS,
# high): functional [unit_test], architecture [deterministic_rule], functional [integration_test], security
# [static_security_analysis] and architecture [ai_review (cross-model)], plus the evidence_required of the applicable
# articles (none adds an entry). Dimensions are named as TASK-006's records name them (decision D-181, reading R-dim).
# Change class: critical_cr (reading, fail closed, as TASK-012's): the six modules are tests of the conformance runner,
# of its Resume Check part and of the governor's conformance run, evaluator parts (DM A29), so the change is judged by
# the base version and never auto-accepted (constitution GOV-003; governor-spec.md §8).
# Evidence: the task changes no evidence requirement and weakens no test (D-364): every assertion line of the class (a)
# tests is kept byte-equal (AC2); the null-state branch of every class (b) test keeps today's assertions (AC4), and the
# present-state branch asserts exact values of its own (AC5); a script shows that no assertion line is removed and none
# added that accepts either of two values (AC7).
# Reviews (as TASK-012's): five way-2 reviews by a Claude model other than the implementer's, each under a decision of
# the decision agent (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002; governance
# ai_review for GOV-003, which also checks that no test is weakened; operational ai_review for OPS-003; the cross-model
# half), and three decision-agent reviews (architecture human_review for INV-003; operational human_review for OPS-002;
# the cross-model half). Each way-2 review record's basis names every article whose entry it covers and addresses each
# of their rules. Each reviewer's prompt is self-sufficient, with the scratchpad's absolute path in its first line (D-277).
# Evaluation path (A61; as TASK-012's): the approved contract is committed on main as its own commit C, which changes
# only docs/tasks/TASK-013.yaml and has one parent equal to base_commit, and is pushed normally; the files are drafted
# and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's commits, each carrying
# the trailer "AIEOS-Task: TASK-013" and no e-mail address in its message, go to the branch task/TASK-013 on GitHub, each
# push under its own decision of the decision agent after a secret scan and a dry run against a bare single-branch copy
# (D-229, D-274), never by force and never deleting; the CI channel runs on each push and its records are re-fetched
# into docs/records/TASK-013.jsonl; main receives the task only at its acceptance, by a fast-forward under its own
# decision. Before each task commit, the added text and the file names are scanned with the workflow's SEC-001, SEC-002
# and OPS-003 patterns and the records executors' pre-push pattern (AC8).
# Not applicable: OPS-001 (scope: the repository's refs; the task changes no ref); INV-005 (scope: the decision engine
# and the governor; tests of the runner meet neither); INV-006 to INV-011, GOV-001, GOV-004 to GOV-006 and SEC-003
# (their scopes, the governor, evidence records, the event log, the policy, the concept file, the bound artifacts, the
# decision matrix, the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. Nothing under .github/, no workflow change, no Claude Code setting (CR-002 part 4 limit 5 does
# not apply). Whether the CI workflow pins the Resume Check's hash (AIEOS_PINNED_RESUME_CHECK) is brought with TASK-014
# (D-364 C3), not here.
# Uncovered and stated limits (AC9): until TASK-014 lands, the tree is in the null state, so the present-state branches
# and the present-state suite run only over the simulation of AC7 (a scratch clone), not over the tree; the exact
# results of the present state rest on the eleven frozen fixtures and the landed Resume Check of TASK-008; the fixed
# set value of AC2 is the set file at 1659a8cb, so a TASK-014 that changes any other field of the set file than the
# eleven fixtures and fixture_set_version makes AC2's pin fail, and TASK-014 must then bring it (fail closed); every
# review is by AI of one vendor.
task: TASK-013
contract_version: v1
task_type: implementation
objective: >-
  Change only six test modules so that every test of theirs passes in both states of the set file's eleven Resume Check
  entries (all without a fixture, the null state of the tree today; all with their frozen fixture, the present state
  TASK-014 makes), with no assertion weakened. In tests/unit/test_runner.py, tests/unit/test_runner_rc.py and
  tests/property/test_runner_properties.py, the class (a) tests named in AC2 take a fixed set value of their own, the
  set file as it is at 1659a8cb, instead of the tree's, with every assertion line kept; the four mirror tests named in
  AC3 take an in-memory mirror that also holds the Resume Check module and the Resume Check fixture files. In
  tests/integration/test_runner_run.py, tests/integration/test_governor_conformance.py and
  tests/integration/test_runner_rc_run.py, the five tree-run tests named in AC4 first read the state from the tree,
  keep today's assertions in the null state and assert exact values of their own in the present state. No other test,
  file, fixture or set file changes.
traces_to:
  - docs/specs/conformance-files.md#6
  - docs/specs/conformance-files.md#7
  - docs/specs/conformance-files.md#8
  - docs/specs/conformance-files.md#9
input_state:
  # base_commit is the `main` commit on top of which the approved contract is committed as its own commit C, changing
  # only docs/tasks/TASK-013.yaml; G0 requires C's one parent to equal base_commit, and the task starts from C. It is
  # filled by script from refs/heads/main just before C is made (D-198 C5): the placeholder and its quotes are replaced
  # by the 40-hex id, unquoted, with nothing after it on the line (G0 reads the line raw).
  base_commit: 1659a8cb2e12ff9f4c4e8f34a20379890160dd97
  depends_on: [TASK-006, TASK-007, TASK-008]
  # The interim documents have no id and no vN version, so each is named by its path and pinned by its SHA-256, as in
  # TASK-012's contract.
  intent_versions:
    docs/specs/conformance-files.md: 31e2853d78ecad81b27eea2e9738fc45787c22dc751fe5bc0f846e337cf8a114
    docs/specs/spec-03-resume-check-and-decision-engine.md: 05c53318cd756a3acfc13e5adaffbfaede8f05be3d00289e9fd45fef08c63c73
    docs/specs/spec-02-aieos-file-format.md: 529b56d831d208594685aad3954fd3e8fc42cadc663e315b65bdfe615e3b09f7
    docs/pre-genesis/constitution.md: 9b396c3c0f31d3a3fbccf9433cf81eb820b6e0f0a3a7d099e2899043abfe1f5a
    docs/pre-genesis/assurance-model.md: 945615316968a5c064bf88be71add9271bbb9f95692eaa22582b6020fa69cb85
    docs/specs/risk-rules-gov-aieos.md: 79021d4c1a6ef506343e78c3bc045273f19efa1c2ac4f517de855ec015ebfbc7
write_set:
  # Six modified paths; nothing is added.
  paths:
