# Task contract TASK-059, the set file's ADV-02 entry and the conformance-file tests that check the set file (Master
# Plan revision 4, §4 M5; DEF-0072 step 3, split by decision D-1085 into TASK-057 (the fixture, accepted, DM F49),
# TASK-058 (the runner tests, accepted) and TASK-059 (this task, the set file's entry with its freeze first);
# specification 2 §5.1). Revision 0, drafted under decisions D-1131 (the scope) and D-1132 (the freeze); whether it is
# approved is recorded in the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and
# TASK-020's contract, whose method this task repeats for the Capability Boundaries entry. Readings marked "(reading)"
# are the worker's, for the decision agent's ruling.
# Why: TASK-057 added and froze the Capability Boundaries fixture tests/conformance/fixtures_cb/adv_02.py (SHA-256
# f6fed8e0db041705f870631ca46b32ba50cb43ed29f6f143f97d19c152938385, DM F49) and left the set file's ADV-02 entry null;
# TASK-058 made the runner tests hold in both states of that entry. This task gives the set file ADV-02's entry and
# fixture_set_version 5, and changes the test_conformance_* modules whose checks of the set file and its freeze fail in
# that state, or would pass in it only because every input then gives an error.
# The set file's freeze is already given (conformance-files.md section 7, revision 5; decision D-1132; DM F52): the
# approval of the set file's bytes, SHA-256 d237d5dcded3fd9fa5bdacd68b098d5818a5d12d0acfa918fd29141e699d7506 (10621
# bytes), is the record TASK-059-freeze-set of docs/records/TASK-059.jsonl, on main since commit b8a35c5e with DM row
# F52. So the set file at each of the task's commits and at its acceptance must be exactly those bytes, and any other set
# file is refused (AC1); the acceptance cites that freeze and gives no other (section 7 (c)); other bytes would need a
# new freeze under section 7 before any acceptance.
# A scratch run (session 8ecb9ff5, a clone at 42bcb6ae with only the frozen set file and a scratch freeze record put in
# place by sim_adv02b.py, on a compiled tree) gave "Ran 1377 tests", "FAILED (failures=7)", exactly the seven class (c)
# ids of decision D-1085 (TASK-058 AC8); in that state every copy of check_set in tests/unit/test_conformance_files.py,
# tests/integration/test_conformance_set.py and tests/property/test_conformance_properties.py returns three errors over
# the tree's own set file and fixture folders (vacuity59.py, archived with that session's evidence: "fixture_set_version
# is not 4"; "ADV-02 is outside the Verification, Resume Check and Risk Engine capabilities and has a fixture"; "the
# fixture path of ADV-02 is not tests/conformance/fixtures/adv_02.py"), so the altered-set cases that assert "an error"
# would pass whatever they alter (reading: a weakening by vacuity under GOV-003, so the property module changes too, as
# in TASK-020).
# The id: TASK-058 is the highest contract id used, and TASK-059 is the id decision D-1085 gave this task and the freeze
# record names (checked by script against docs/tasks/ and docs/records/).
# Task type: fixture (docs/specs/conformance-files.md section 8, revision 10). Every changed path is the set file of
# section 3 under tests/conformance/ or a test module test_conformance_*.py directly under tests/unit/,
# tests/integration/ or tests/property/ that checks only the conformance files against that document and the bound
# scenario file. GOV-002 does not apply, as the constitution writes its applicability (implementation, refactoring);
# every other article whose applicability names implementation is applied as to an implementation task, so no evidence
# requirement narrows (section 8; CR-002 part 4 limit 8).
# Readers of the changed paths: the CI workflow's conformance base and candidate runs read the set file from the base,
# so this task's own pushes run the base's set file (ADV-02 null) and the first conformance run over the new set file is
# the base run of the next push after this task lands; tests/run_tests.py and the CI workflow's unit_test,
# integration_test and property_test steps run the changed modules; TASK-058's runner tests (test_runner.py,
# test_runner_cb.py, test_runner_rc.py, test_governor_conformance.py, test_runner_cb_run.py, test_runner_rc_run.py,
# test_runner_risk_run.py, test_runner_run.py, test_runner_cb_properties.py, test_runner_properties.py) read the set
# file's state from the tree and hold in both states; tests/integration/test_conformance_rc_set.py,
# test_conformance_risk_set.py and test_conformance_cb_set.py read every .py file under src/ and tests/ for their
# fixture folders' last path parts and allow them only in the modules they list (AC5 changes the Capability Boundaries
# list).
# Risk: critical. R11 matches tests/conformance/** (critical); R2 and R3 read fail closed match tests/** (medium, high);
# the highest wins (risk rules section 2 point 1); computed over 42bcb6ae by script (risk_class59.py, its output in
# decision D-1131's request).
# Profile (assurance-model.md §5, gov-AIEOS, critical): functional [unit_test, integration_test, property_test],
# architecture [deterministic_rule, ai_review (cross-model), human_review], security [static_security_analysis]; plus
# the evidence_required of the applicable articles.
# Change class: critical_cr (reading, fail closed, as TASK-020's; computed, not asserted): GOV-003's tool part over the
# base marks every path of the write set as an evaluator path, all modified, none added (gov003_class59.py "yes (6 of 6
# paths)"); five of them are existing evaluator tests whose assertions change; the set file's change is a change under a
# freeze that is already given (DM B10: normal_cr with a freeze), which alone would be normal_cr. The stricter class is
# taken. Either way the change is judged by the base version and never auto-accepted (constitution GOV-003;
# governor-spec.md §8).
# Freeze: no freeze approval is given in this task's acceptance (section 7, revision 5, (c)): the acceptance cites
# TASK-059-freeze-set. No fixture changes (the files of fixtures/, fixtures_rc/, fixtures_risk/ and fixtures_cb/ are
# forbidden).
# Reviews (as TASK-020's): five way-2 reviews by a Claude model other than the implementer's (claude-sonnet-5-5), each
# brief to the decision agent first (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for
# SEC-002 with SEC-001; governance ai_review for GOV-003, which also checks that no test is weakened, by vacuity
# included, and that AC5's list change is exactly the three names; operational ai_review for OPS-003; the cross-model
# half), and the decision agent's separate reviews: architecture human_review (the critical profile's entry, which also
# checks that the set file names the fixture faithfully and that the property tests still cover the related
# invariants, assurance-model.md §5), INV-003's human_review, OPS-002's human_review and the cross-model half; each its
# own record with its exact stands_for, all bound to the commit that is accepted (assurance-model.md line 50; decisions
# D-1098 (b1), D-1123).
# Records (specification 2 revision 5, section 6.2; decisions D-1108, D-1118 C4, D-1125 C4, D-1130): docs/records/
# TASK-059.jsonl, after its first line TASK-059-freeze-set, is in the readable form: each record carries in
# intent_versions the mapped version of every entity of input_state.intent_versions, as the self-build's script
# map_versions.py (revision r2, SHA-256 d2cbb635910720487b6c62ca15082319a6008ac1a27c5b5f218b814f33debb1) gives it from
# the DM rows that name each file's exact SHA-256; an applicable article's entry is recorded under the article's id as
# the record's dimension, one record per entry; each record's basis names map_versions.py's SHA-256. Its coverage is
# checked by a per-entry script before the acceptance request (L-0022), refusing a cross-model pair whose halves name
# different commits (cov58s.py's rule), and the governor's evaluation over the records is reported (decision D-1098).
# Evaluation path (A61; as TASK-019 to TASK-058): the approved contract is committed on main as its own commit C, which
# changes only docs/tasks/TASK-059.yaml and has one parent equal to base_commit, and is pushed normally; the files are
# drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first), the suite run on a
# compiled tree (L-0018); the task's commits, each carrying the trailer "AIEOS-Task: TASK-059" and no e-mail address in
# its message, go to the branch task/TASK-059 on GitHub, each push under its own decision after a secret scan, a check of
# the set file's SHA-256 (AC1) and a dry run against a bare copy, never by force and never deleting; the CI records are
# re-fetched into docs/records/TASK-059.jsonl, after the freeze record, which stays its first line; main receives the
# task only at its acceptance, by a fast-forward or rebuilt commits checked equal, under its own decision.
# Not applicable: GOV-002 (above); OPS-001 (scope: the repository's refs; the task changes no ref); INV-009, INV-011,
# GOV-001, GOV-004, GOV-005, GOV-006 and SEC-003 (their scopes, the event log, the policy, the concept file, the bound
# artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. Nothing under .github/, no workflow change, no Claude Code setting or hook, no measurement
# (CR-002 part 4 limit 5 does not apply); no evidence requirement is weakened (limit 8 does not apply). Approver of the
# acceptance (reading, as decisions D-492 and D-507 ruled for TASK-019 and TASK-020): one delegated approval of the
# decision agent (Master Plan §6).
# Pinning ADV-02 in the CI workflow, if a pin is wanted, is not part of this task: it is a later .github/ change of its
# own under DM A66.
# Uncovered and stated limits (AC9): this task's own conformance runs take the set file from the base, so no CI
# conformance run over the new set file exists before the task lands; ADV-02's result over the tree is shown at the
# task's commits only by TASK-058's tree-run tests, which then run their present-state branches over the tree for the
# first time; ADV-02's first conformance run is the CI's base run after landing, reported and advisory, never "MEASURED"
# and not part of this acceptance; a passing ADV-02 shows only the core's handling of a recorded observation, never that
# any hook observes anything (C6 and the T3 tier unmeasured); the Capability Boundaries fixture is checked in its own
# form by TASK-057's three modules, not by the Verification form; TASK-057's
# test_the_set_file_is_frozen_and_adv_02_is_null_or_this_file keeps its two allowed states (this task does not narrow
# it); every review is by AI of one vendor.
