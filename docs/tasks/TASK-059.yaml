acceptance_criteria:
  - AC1: >-
      The set file, byte for byte, at each commit and at acceptance. At each of the task's commits and at its
      acceptance, tests/conformance/set.py has the SHA-256
      d237d5dcded3fd9fa5bdacd68b098d5818a5d12d0acfa918fd29141e699d7506 (10621 bytes), the bytes the freeze record
      TASK-059-freeze-set binds (decision D-1132, DM F52), checked by script before each push and in the acceptance
      request; a set file with any other SHA-256 is refused: no push and no acceptance is brought with it, and other
      bytes need a new freeze under section 7 first. A script also shows again that it differs from the set file at the
      base (e37f16392a74ce5a2836791743ff232be0d0f58c6f3ce5b88b8bf19b989afad9, DM F44) only in fixture_set_version (4 to
      5) and in ADV-02's fixture, now the path conformance.expected_path gives for ADV-02 and Capability Boundaries
      (tests/conformance/fixtures_cb/adv_02.py) and the SHA-256
      f6fed8e0db041705f870631ca46b32ba50cb43ed29f6f143f97d19c152938385 bound by DM F49; and that the bytes are the
      canonical form of section 2.
  - AC2: >-
      The set checks (tests/unit/test_conformance_files.py, tests/property/test_conformance_properties.py,
      tests/integration/test_conformance_set.py; the helpers repeated in each, as today). check_set accepts a fixture
      for exactly the Verification, the Resume Check, the Risk Engine and the Capability Boundaries capabilities, each
      at the path its capability gives (the Verification folder, tests/conformance/fixtures_rc/,
      tests/conformance/fixtures_risk/ or tests/conformance/fixtures_cb/, sections 2, 9, 10 and 11), and requires
      fixture_set_version 5; the tree load reads the fixture files of the four folders; every other condition of
      check_set is kept. Over the tree, check_set returns exactly [] in each of the three modules (a test asserts it in
      each, so that no altered-input case passes by vacuity). The set file test and the end-to-end test assert exactly:
      32 entries in the bound file's order; 32 with a fixture, the 19 Verification, the 11 Resume Check, RISK-01 and
      ADV-02, by id; no entry without a fixture; each named file's SHA-256 equal to its entry's; scenario_set_version
      2, the bound file's hash and fixture_set_version 5. The altered-set cases keep every case and each still gives an
      error (the fixture set version case uses a value other than 5; every entry of the bound file is now in one of the
      four capabilities, so the case "a fixture outside Verification", which gives entry 17, RISK-01, a Verification
      fixture, keeps its form and still errs by the wrong path for its capability), and new cases give an error for the Capability
      Boundaries fixture at the Verification, the Resume Check or the Risk Engine folder's path, for a Verification
      fixture at the Capability Boundaries folder's path, and for ADV-02's fixture dropped. The property module's
      one-byte-change test covers the Capability Boundaries fixture file too.
  - AC3: >-
      The fixture checks keep to their kind. The Verification fixture checks (check_fixture, the fixture tests and the
      faithfulness tests of tests/unit/test_conformance_files.py, and the tree loads of
      tests/property/test_conformance_properties.py) run over exactly the 19 Verification fixtures, as they did at the
      base, with every assertion and every altered-fixture case kept; they do not apply the Verification form to the
      Capability Boundaries fixture, which TASK-057's modules (test_conformance_cb_files.py, test_conformance_cb_set.py,
      test_conformance_cb_properties.py) check in its own form. The end-to-end test checks ADV-02's entry by its path
      (module_path for its id and capability) and its SHA-256 only, as it checks RISK-01's. The existing test that the
      Verification fixtures run over are exactly the 19 Verification entries still holds.
  - AC4: >-
      The Resume Check set test (tests/integration/test_conformance_rc_set.py).
      test_the_set_file_is_unchanged_and_frozen becomes a test that the set file is bound by exactly one freeze
      approval of TASK-059 (docs/records/TASK-059.jsonl, an authority record with approval_binding {kind:
      change_request, hash} equal to the set file's SHA-256, its record_id TASK-059-freeze-set), that TASK-040's freeze
      record of the replaced set file (e37f1639…) still exists unchanged, and that TASK-020's, TASK-014's and TASK-002's
      freeze records of the earlier set files still exist unchanged; every other test of the module is kept, with its
      assertions.
  - AC5: >-
      The folder check (tests/integration/test_conformance_cb_set.py; decision D-1131 C3). Its list of the modules
      allowed to name the Capability Boundaries fixture folder adds, each by name, exactly
      tests/unit/test_conformance_files.py, tests/property/test_conformance_properties.py and
      tests/integration/test_conformance_set.py, which name it for AC2; no name is removed and nothing else in the
      module changes but the docstrings and comments that name the list; test_a_module_that_is_not_allowed_is_named
      still catches each of its unnamed paths except tests/unit/test_conformance_files.py, which is replaced there by
      another unnamed test_conformance_* path so that the test keeps its count of cases, and
      test_the_allowed_modules_are_all_allowed names the added modules; the guard's assertion
      (not_allowed(found) == []) is as strict as before for every other path.
  - AC6: >-
      Nothing else changes, and the runner tests run over the tree. Every other test that tests/run_tests.py runs passes
      unchanged at the task's commit, with the freeze record of docs/records/TASK-059.jsonl in the tree; in particular
      the present-state branches of TASK-058's tree-run tests now run over the tree and pass with their exact values
      (TASK-058 AC4 with erratum E1: ADV-02 (PASS, '') in test_governor_conformance.py's test, test_runner_rc_run.py's
      R7 test, test_runner_risk_run.py's test, test_runner_cb_run.py's RepositoryTree test and test_runner_run.py's
      three tests; the record's capability_boundaries key; the record's outcome pass), and TASK-013's and TASK-058's
      fixed-value pin (158323324f…) still holds.
  - AC7: >-
      The seven, and nothing else. At the base, with only the set file of AC1 and a scratch freeze record of its hash
      put in place in a scratch clone on a compiled tree, the failing tests are exactly the seven class (c) ids of
      decision D-1085 (TASK-058 AC8): test_conformance_files SetFileTest.test_altered_sets_give_errors and
      test_the_set_file; test_conformance_properties FormPropertiesTest.test_any_one_byte_change_is_caught and
      test_the_same_input_gives_the_same_result; test_conformance_set ConformanceSetEndToEndTest
      test_the_set_binds_the_bound_file and test_the_whole_set; test_conformance_rc_set
      RcSetTest.test_the_set_file_is_unchanged_and_frozen; at the task's commit the whole suite passes over the tree on
      a compiled tree; both runs and the id comparison are in the request that brings the first push.
  - AC8: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The modules import only what they import at the base and
      the standard library; they use no exec, eval, compile, __import__ or importlib, start no process, open no
      network connection, call no model and write no file; they name no project-state directory; no fixture or set
      module is imported or executed (files are read as bytes). The CI steps at the task's commits report no finding:
      deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit. Before each commit, the added text and the file names
      are scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns and the records executors' pre-push
      pattern, and each count is 0.
  - AC9: >-
      Does not loosen (GOV-003), and the limits. A script over the base and the task's commit shows, for the five
      modules: no test removed or skipped; every assertion line of the base either byte-equal in the changed module or
      listed with its replacement, each replacement comparing with one exact value (no assertion that a value may be
      either of two results); every altered-set and altered-fixture case of the base kept, or listed with its
      replacement under AC2 or AC5; the count of assertion calls in each module does not fall; and, over the tree at
      the task's commit, check_set returns [] in each module that holds it (no vacuous error case). Limits: as the
      header states.
  - AC10: >-
      Tests, with this rule-to-test list: R1 AC1 (the pin of the set file's SHA-256, by script at each commit and at
