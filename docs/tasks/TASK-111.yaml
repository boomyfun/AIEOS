task: TASK-111
contract_version: v1
task_type: implementation
objective: >-
  handoff_file.write gains a keyword fencing_token (default None). When it is a mapping, write finds the session's submitted commit in the same log it already reads: the task.submitted events of task_id, not duplicates,
  with payload compensating false and a fencing_token whose canonical JSON text equals the given token's. Exactly one such event with a commit of 40 lowercase hexadecimal characters gives that commit; none gives
  commit None with no finding (as today); two or more, or a commit out of form, give commit None and a finding. The commit argument must then be None (any other value with a token is an argument refusal). A compensating
  task.submitted is never matched (stated limit). launcher._launch_finish passes the grant's token by keyword; a handoff result of "written" or "none" now has its findings added to the launch's findings. Nothing else in
  start, end, end_outside or launch_outside changes.
