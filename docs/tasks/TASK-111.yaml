acceptance_criteria:
  - AC1: >-
      The lookup. A pure function of handoff_file.py takes (log bytes, task_id, token) and returns (commit or None, findings); it parses each line with json.loads with an object_pairs_hook that refuses a repeated key and a parse_constant that refuses NaN and Infinity (records.py :752's reading), with no new import (F8 (1)); blank lines are skipped as compose does; any other line that is not UTF-8, is refused by json.loads or those hooks (ValueError or RecursionError), or is not a JSON object gives (None, a finding) and no commit (fail closed, as check_log refuses and base_inputs._log_events raises on any finding in the log, records.py :753-:755, :819-:822; base_inputs.py :472-:477); tokens are compared by the text json.dumps(token, sort_keys=True, separators=(',', ':'), ensure_ascii=True, allow_nan=False), the form of eventlog._canonical (eventlog.py :79-:81); among matching events an event_id repeated with identical content counts once, identity being the text of records._without_order (records.py :718-:724: the line's object without seq and appended_at, json.dumps(..., sort_keys=True) with its other arguments at their defaults, as records.py :722; a line whose identity text cannot be made (None at :721-:724) gives (None, a finding)), and one repeated with other content gives commit None and a finding (records.py :783-:789's reading); the lookup does not check the token's form (records._check_fence, :678-:689, refuses an out-of-form token line for the whole log), only its text (stated limit). Tests with stand-in logs: a matching line with a repeated key is not matched; a log whose only refused line does not match gives (None, a finding); an identical repeat gives the commit; a same-event_id repeat with other content gives (None, a finding); the lookup's token text equals eventlog._token_text on every test token; on every well-formed stand-in log the lookup's commit equals the one found in the test through records.check_log's lines with duplicate_of None (the test file may import records and eventlog); and: none -> (None, []); one match -> the commit; two matches -> (None, one finding); a commit out of form
      -> (None, a finding); a match on another task or another token is ignored; a compensating event with the token is ignored; two tokens with the same canonical text but different key order match; a token that cannot be written
      as canonical JSON gives a finding and no commit; the function raises nothing.
  - AC2: >-
      write. With fencing_token a mapping and commit None, write reads the log once, looks up the commit, composes with it and writes once, as today; the result keys are unchanged (WRITE_KEYS); the lookup's findings ride in
      the result's findings for every result, "written", "none" and "refused" (today "none" carries no findings, handoff_file.py :188-:189); with fencing_token a mapping and commit not None, write refuses with reason "argument" and writes nothing; a fencing_token that is neither None nor a mapping is refused with reason "argument" and nothing is written (the launcher can pass the raw answer of an out-of-form grant that has a str session id, launcher.py :1194, :1197-:1202); with fencing_token None the behavior is byte-for-byte today's.
  - AC3: >-
      The launcher. _launch_finish calls write_handoff(root, task_id, session_id, None, fencing_token=token) by keyword, the token being the grant's (state['token'], launcher.py :1194, :1197) as it is, on every path that reaches write_handoff (the else branch at :1122-:1123 is reached after a grant when the write set is None, :1212-:1213, so it passes the grant's token too; no path without a grant reaches write_handoff, returns at :1164, :1192, :1201); the findings of a handoff result "written" or "none" are added to
      the launch's findings (strings only); a refused handoff is handled as today. World.write_handoff of test_cli_launch.py takes the keyword and its :143 pin is amended. A composed-path test, in tests/integration/test_writer_files.py (F8 (2b)), with the real launcher.end path, using the real
      writer.release_lease_token, writer.session_leases and writer.end_session over a temporary store (writer.py :512-:513 deletes the row), with a stand-in only for the git read of submit (and a stand-in for observe_gone that records its call and
      asserts its reason GONE_WHY[1] if the scan of that module's helpers shows the real one cannot run there; then the record's content is not asserted and the contract names that limit), shows what end gives after a submission has released the
      lease (path "gone", the record by observe_gone, adapter.end's release refusal "none" or "token" not an error) and that the handoff file's text then holds that commit; the expected result is "done". If the test
      shows a refusal, the task stops and is split (an end-path task first).
  - AC4: >-
      The stated limits. The docstrings of handoff_file.py (:17-:20, :25) and launcher.py (:197-:206) are updated in plain words: the file is written after a submission with the matched commit; the match is on the fence token
      only; a compensating submission (recovery's) is never matched; a session that submitted twice gets commit None and a finding; a commit with no usable AIEOS-Fence trailer is not refused by submit (submit.py :161-:163) and is passed to the append with
      fencing_token None (:195); records.py :679-:681 makes that line out of form; in every case no event carries the grant's token, so commit None (and eventlog.append refuses a task.submitted with no fencing_token at the fence: eventlog.py :112-:114, :132-:133, :218-:229); abnormal ends still write none (the launcher writes only after a done end, launcher.py :1124-:1126); a session that submitted but made no handoff call gets no file, so its commit is in no handoff; with two matches the file is written with commit null and the launch still reports "done" with the finding in its findings; the end of a session that submitted takes the "gone" path because the submission released the lease first, so its read-set record carries the reason 'lease gone (released or expired)' (read_set_record.py :216) and not the fenced path's, and this task changes no record; the lookup refuses per log as stated in AC1 and differs from check_log only on malformed logs (blank lines skipped; a leading byte-order mark or a CR byte not refused, records.py :819-:822; the token's form unchecked); how the file reaches Git stays open (DEF-0095 (b)); the :25 limit is rewritten, not deleted: the pinned phrase "the caller's commit" stays in a true sentence (with no fencing_token, write writes the caller's commit as given); :18-:20's "nothing calls write after a submission" is replaced; 'calls write after the launcher' stays. Pinned docstring phrases of both files stay byte-exact (the scan lists them).
  - AC5: >-
      Pins and purity. The pin scan (the first step, reads only, listed in the map of commit X) names every test that pins handoff_file.py's or launcher.py's imports, docstring phrases, callee orders or the
      write_handoff stand-ins' signature; each is amended as TASK-110 amended its pins, with 'amended by TASK-111' in the docstring. No new import in either src file; the import pin of test_handoff_file.py stays; no state-directory name as a string in a
      changed src file; no new process form; none of the effect labels MEASURED, ENFORCED, GUARANTEED outside a cited decision-matrix line (OPS-003).
  - AC6: >-
      The text. Specification 7 revision 9 (before this contract, as S) says in section 7 (lines 62, 66), section 10 and the revision history that the write after a submission is built by TASK-111, with the lookup rule, and
      the matching decision-matrix row; the items of DEF-0095's log that revision 7 already settled (the unclaimed-file choice, the TASK-105 name, spec 7 :117) are checked in the scan and not repeated. DEF-0095's Log
      line is written by its own decision after landing (it stays open for (b) and (c)).
  - AC7: >-
      Evidence and CI. Unit, integration and property tests as the scan shows are needed; static analysis and the deterministic rule report no finding; every job and step of aieos-checks and aieos-native succeeds on the accepted commit
      and on main after the records commit, read by run id; each push and each job-data read is a decision of the decision agent.
  - AC8: >-
      The records and acceptance. Per-article records through records.check_record and the governor shadow over a dry list at the approval request, with raw output; expected NEEDS_REWORK at the GOV-003 row. GOV-003: proposed as a stated departure as TASK-102 to TASK-110; ruled at the C request on the governor
      shadow's raw output (D-4297 C3 (f); the compensating controls named in D-4271; DEF-0107 points 2 to 5); the way-2 review and the reviews on Haiku 5.5 only (no other model without the owner; no Fable).
