objective: >-
  Add src/aieos_bootstrap/evaluation_derive.py and tests/unit/test_evaluation_derive.py, and extend EVIDENCE_DEFINING_PATHS (src/aieos_bootstrap/evaluation_policy.py) by the entry src/aieos_bootstrap/evaluation_derive.py (appended after src/aieos_bootstrap/eval_inputs.py; the list extension removes and loosens nothing), with the matching EXPECTED tuple in tests/unit/test_evaluation_policy.py. THE I/O: none; the four functions are pure and the module imports only hashlib, math and evaluation_policy (no other import). THE FUNCTIONS. (1) ruleset_version(governor_bytes, pinned_sha256) returns {value, findings}: value is the text "governor-sha256:" followed by the sha256 hex of governor_bytes (the bytes of src/aieos_bootstrap/governor.py that the caller read at the pinned policy_ref), or None with one finding {reason, detail} when that hex differs from pinned_sha256 (the value of the CI's AIEOS_PINNED_GOVERNOR printed by the same run: enforced by the caller; evaluation_policy.py :66-:68) or an argument is of a wrong form. (2) level_version(policy_version) returns {value, findings}: the text "L1:" followed by policy_version, a non-empty text that the caller took from the risk-rules file; L1 is the level in force for every class of the self-build (assurance-model :90, spec-04 :93). (3) evidence_comparison(changed_paths) returns the BARE mapping {weakens: bool} and never None (the consumers: eval_inputs.py :254-:256 requires a dict whose only key is weakens with a bool value; governor.py :592-:594 sets weakens_evidence unless it is exactly {weakens: false}); see AC3. (4) plain_data_problem(value) returns None for plain data or one {reason, detail}. PLAIN DATA is exactly: dict (every key a text), list, str, bool, None, int and finite float, nested; anything else is refused: a tuple, bytes, bytearray, set, frozenset, a subclass of these types or any other object, a float that is NaN, Infinity or -Infinity, a key that is not a text, and a nest of more than 50 levels (the top value is level 1; level 51 is refused); detail at most 40 characters. None of the four functions raises an Exception; ruleset_version and level_version never return a partial answer ({value, findings} is complete or value is None).
