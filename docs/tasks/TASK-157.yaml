acceptance_criteria:
  - AC1: >-
      Scope and bytes. The task commit changes only the four paths of the write set. evaluation_policy.py differs from base by exactly: the added tuple entry, and three docstring changes (D-7017 C6 for (a) and (b); (c) was approved at D-7018, because the unchanged :62-:65 text would otherwise disagree with the behaviour of AC3). (a) Old text of the sentence at :61-:62: "src/aieos_bootstrap/evaluation_policy.py and src/aieos_bootstrap/" newline "eval_inputs.py (the modules that give the sources)"; new text: "src/aieos_bootstrap/evaluation_policy.py, src/aieos_bootstrap/" newline "eval_inputs.py and src/aieos_bootstrap/evaluation_derive.py (the modules that give the sources)". (b) Old text at :66: "It names the derivations that BT3b-2 computes (not coded here):"; new text: "It names the derivations that BT3b-2 computes (coded in src/aieos_bootstrap/evaluation_derive.py; the loader of their inputs is BT3b-2c's):". (c) (approved at D-7018) the words "that none holds an evidence entry." at :65 become "that none holds an evidence entry (done at D-7015, outcome (a): none does at main; the standing condition of TASK-157 AC3 stays)."; the rest of line :65 ("Shrinking the list later is") is unchanged and stays on that line; the exact old line :65 is "decision records, with a Grep over every requirement entity, that none holds an evidence entry. Shrinking the list later is" and the exact new line is "decision records, with a Grep over every requirement entity, that none holds an evidence entry (done at D-7015, outcome (a): none does at main; the standing condition of TASK-157 AC3 stays). Shrinking the list later is". Every other byte of evaluation_policy.py is equal, and the new docstring text contains no string with a dot directly before "aieos". test_evaluation_policy.py differs by exactly the EXPECTED tuple (:560-:563, the same entry added at the end) and nothing else. The after-files' sha256 and the new files' sha256 are brought at approval (the approval script compares the staged files). tests/unit/test_evaluator_covers_evidence_paths.py passes unchanged (src/aieos_bootstrap/** already matches the entry; no .github change).
  - AC2: >-
      ruleset_version and level_version. Tests: the exact texts "governor-sha256:" + 64 lowercase hex and "L1:" + policy_version; a governor_bytes whose hash differs from pinned_sha256 gives value None and one finding; a pinned_sha256 that is not 64 lowercase hex, governor_bytes that is not bytes, a policy_version that is empty or not a text, each a refusal (value None, one finding); no function raises (a table over None, int, list, bytearray, a very long text). A test computes the real hash of src/aieos_bootstrap/governor.py at the working tree and checks that ruleset_version accepts it as pinned value (the test reads the file; the module does not).
  - AC3: >-
      evidence_comparison, F3 and rule (f) (D-7015 C2, C3; D-7016 M3, M4; D-7017 C1, C3, C4, C5). The derivation returns {weakens: true} when changed_paths is not a list of non-empty texts; when any path is MALFORMED: a backslash, a leading "./" or "/", a ".." segment, an interior "." segment, an empty segment, a trailing "/", any control character (a code point below U+0020 or U+007F), whitespace (str.isspace) at either end of the path or of a segment, a colon, a trailing dot or space in a segment, any non-ASCII character, or a "~" in a segment; when any path equals, after str.casefold, an entry of EVIDENCE_DEFINING_PATHS (read from the tuple by name, not a copy); and, RULE (f), when any path has a first segment that begins with "." (this includes a bare ".aieos" and ".aieos/intent"; case does not matter for it, since a dot is a dot; only the FIRST segment is tested, so a nested directory such as "docs/<dot>aieos/x" gives {weakens: false}, which is consistent with the project-state directory being at the repository root, INV-004, aieos-checks.yml :2121). It returns {weakens: false} otherwise, and for the empty list (meaning "no path changed"). RULE (f) is chosen because the INV-004 guard (aieos-checks.yml :2103-:2105) refuses any string constant under src/ that contains a dot directly before "aieos", with only writer.py (:1662-:1663) and claude_code_shell_allow.py (:1672-:1674) allowed: the module therefore contains NO string constant, docstring included, with that text, and NEVER builds that text by concatenation, formatting, character codes or any other means (an ALLOW entry would be a .github change and an A66 decision; building the text would defeat the guard by disguise). The deterministic_rule step checks the constants (AC6); the reviewer of the contract and of the task checks by reading the code that no such construction exists. Rule (f) is a superset of D-7015 C3 (any path under .aieos/intent/). Its cost, STATED AS A LIMIT of option B (M4): the result is a path-based over-approximation, not the reference comparison of governor-spec :44; a change under .aieos/tasks, to .gitignore or .gitattributes, under .claude/ or .github/ also gives {weakens: true}; any later narrowing is a weakens-evidence change and needs its own decision. {weakens: false} says only that no evidence-defining path and no dot-first path was changed, and holds only under the F3 standing condition: a task that writes, reads or derives requirement entities adds the matching path to EVIDENCE_DEFINING_PATHS in the same change, with its A66 decision for the EVALUATOR lists (rule (f) covers a requirement source under .aieos/intent/, not a requirement source that might later live elsewhere). THIS task writes, reads and derives none. F3 status: the Grep arm is closed for the derivation as designed by D-7015 (outcome (a): at main no requirement entity holds an evidence entry; requirement_profiles is [] in docs/specs/evaluation-policy-gov-aieos.md :83-:84). Tests: every entry of EVIDENCE_DEFINING_PATHS alone and mixed with unrelated paths; ".aieos/intent/requirements/x.md", ".aieos/intent", ".aieos", ".AIEOS/Intent/x", ".aieos/project.yaml", ".aieos/tasks/TASK-1.yaml", ".github/workflows/x.yml", ".gitignore" and each mixed with unrelated paths, each asserted {weakens: true} (the tests are exempt from the INV-004 string rule: it needs path.startswith src/); one test for each malformed form above; a non-list, None, a str, an empty text, a non-text entry; the empty list gives {weakens: false}; an ordinary path such as "docs/runs/x.md" or "src/aieos_bootstrap/cli.py" gives {weakens: false}; the rows "SRC/AIEOS_BOOTSTRAP/GOVERNOR.PY" and "docs/Pre-Genesis/constitution.md" (upper and mixed case spellings of entries, free of any malformed form and of a leading dot, so only the casefold of the tuple comparison can flag them) each give {weakens: true}; a test pins that the function reads evaluation_policy.EVIDENCE_DEFINING_PATHS by name (unittest.mock.patch.object of the tuple to a tuple holding one extra entry, the call, and the restore: a path equal to the extra entry then gives {weakens: true}). TABLE-ADEQUACY CHECK (not a mutation of the shipped code; the guard forbids exec, compile and importlib): the test file holds at least three weaker reference implementations written by hand, one without rule (f), one without the casefold and one without the malformed check, and the test asserts that the table above REJECTS each of them (at least one table row on which each returns {weakens: false} where the shipped function returns {weakens: true}: for the reference without rule (f), the dot-first rows; for the one without the casefold, the two mixed-case rows; for the one without the malformed check, the malformed rows); no refused name is used.
  - AC4: >-
