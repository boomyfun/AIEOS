capabilities:
  filesystem: {read: [the repository at base_commit], write: [src/aieos_bootstrap/evaluation_derive.py, tests/unit/test_evaluation_derive.py, src/aieos_bootstrap/evaluation_policy.py, tests/unit/test_evaluation_policy.py]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 400k, wall_time: 3h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5]}
  - {gate: G3, check: constitution, args: [AC6, AC7, INV-001, INV-002, INV-003, INV-004, INV-008, INV-011, GOV-001, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND the aieos-checks run of the accepted commit succeeds
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
