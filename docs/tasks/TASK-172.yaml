acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only the three files of the write set. In launcher.py only docstring text changes (the
      module docstring and the docstrings of approval_act, import_task and run_task); no statement, name or signature
      changes. In conformance.py the only change of behaviour is that of AC3. Existing tests pass unchanged; tests are only
      added. No test writes a file, starts a process or imports a module that the workflow's deterministic_rule step
      refuses; no exec, eval, compile, __import__ or importlib is used; the only imports added are of the own package or of
      a standard library module that the same test module already imports. The existing pins of launcher.py's docstrings
      still hold (among them: test_cli_run.py's run_task phrases and "owner_kept_act" in run_task's docstring,
      test_cli_import.py's import phrases, test_cli_approve.py's approval_act phrases and test_launcher_outside.py's
      end_outside phrases and absent phrases).
  - AC2: >-
      DEF-0113 (a), the lead sentences. The passage "each step's name being the reason of a refusal or a raise at it" of
      launcher.py at :194 (the end_outside paragraph of the module docstring), :1580 (approval_act), :1775 (import_task)
      and :2155 (run_task) is rewritten, and no such passage remains in launcher.py. Each rewritten text says what the
      code does at the task commit, in these points. (i) The listed items are the function's steps in order. (ii) A
      refusal carries the reason of the step that refuses, and the text names every listed item whose name is not a reason
