  # filled by script from refs/heads/main just before C is made (D-198 C5; the D-184/D-185 lesson): the placeholder
  # and its quotes are replaced by the 40-hex id, unquoted, with nothing after it on the line (G0 reads the line raw).
  base_commit: 96376a1b387d5e95c84db6f47417834da033235d
  depends_on: [TASK-001]
  # The interim documents have no id and no vN version, so each is named by its path and pinned by its SHA-256, as in
