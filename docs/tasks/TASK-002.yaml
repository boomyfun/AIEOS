# Task contract TASK-002, the fixtures of the 19 Verification scenarios of gov-AIEOS (Master Plan revision 2, §4 M2;
# the M2 work plan of decision D-195; specification 2 §5.1). Revision 0, drafted under decisions D-195 (P1, P2, P6, P7),
# D-198 (f, C5) and D-199, brought for approval in D-200; whether it is approved is recorded in the decision files, not in
# this file. Fields and value forms follow specification 2 §5.1 and TASK-001's contract.
# Task type: fixture (docs/specs/conformance-files.md section 8, revision 2). Every changed path is a file of that
# document's sections 2 to 4 under tests/conformance/ or a test module test_conformance_*.py directly under tests/unit/,
# tests/integration/ or tests/property/. GOV-002 does not apply, as the constitution writes its applicability
# (implementation, refactoring); every other article whose applicability names implementation is applied as to an
# implementation task, so no evidence requirement narrows (section 8; CR-002 part 4 limit 8).
# Risk: critical. R11 matches tests/conformance/** (critical); R3 read fail closed matches tests/** (high); the highest
# wins (risk rules section 2 point 1). Profile (assurance-model.md §5, gov-AIEOS, critical): medium's entries, high's
# entries and critical's: unit_test, integration_test, property_test, deterministic_rule, static_security_analysis,
# ai_review (cross-model) and human_review; plus the evidence_required of the applicable articles. Dimensions are named
# as TASK-001's records name them (decision D-181, reading R-dim).
# Change class: normal_cr with a fixture-freeze approval on each file's hash (DM B1, B10, with the A51 note); it changes
# the evaluator (A29 counts fixtures and scenarios), so it is judged by the base version and never auto-accepted
# (constitution GOV-003; governor-spec.md §8). Freeze approvals: given by the decision agent in the decision that
# accepts this task, as separate elements before the acceptance itself, one per fixture file and one for the set file,
# each an authority record with approval_binding {kind: change_request, hash} in docs/records/TASK-002.jsonl, and one
# DM section F row that lists the set file's hash (conformance-files.md section 7; D-195 P2).
# Reviews (as TASK-001's, D-181 P2, P3): five way-2 reviews by a Claude model other than the implementer's, each under a
# decision of the decision agent (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002;
# governance ai_review for GOV-003; operational ai_review for OPS-003; the cross-model half), and three decision-agent
# reviews (architecture human_review, which is both INV-003's entry and the critical profile's, and which also checks
# that every fixture is faithful to its scenario and that the property tests cover the related invariants
# (assurance-model.md §5); operational human_review for OPS-002; the cross-model half). Each way-2 review record's basis
# names every article whose entry it covers and addresses each of their rules, beyond what the tool parts decide.
# Evaluation path (A61; as TASK-001's, D-181 P1 and D-182): the approved contract is committed on main as its own commit
# C, which changes only docs/tasks/TASK-002.yaml and has one parent equal to base_commit, and is pushed normally; the
# files are drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's
# commits, each carrying the trailer "AIEOS-Task: TASK-002" and no e-mail address in its message, go to the branch
# task/TASK-002 on GitHub, each push under its own decision of the decision agent after a secret scan, never by force
# and never deleting; the CI channel runs on each push and its records are re-fetched into docs/records/TASK-002.jsonl;
# main receives the task only at its acceptance, by a fast-forward under its own decision. Before each task commit, the
# added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns (AC6).
# Not applicable: GOV-002 (above); OPS-001 (scope: the repository's refs; the task changes no ref); INV-009, INV-011,
# GOV-001, GOV-004, GOV-005, GOV-006 and SEC-003 (their scopes, the event log, the policy, the concept file, the bound
# artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Uncovered (governor-spec.md §6.2; conformance-files.md section 1): the fixtures give the inputs of governor-spec.md
# §3.2 as values, so how the governor derives them is not tested by these files; no runner and no governor exist, so
# every scenario stays NOT_RUN and nothing here shows that any governor meets a fixture; until the CI workflow's next
# revision (the owner's, A61), GOV-003's pinned list in the CI channel does not name tests/conformance/**, so a fixture
# change is not reported there as an evaluator change and is caught only by each task's write-set and forbidden set (G0)
# (D-195 P6); every review is by AI of one vendor.
task: TASK-002
contract_version: v1
task_type: fixture
objective: >-
  Add the frozen set file and the executable fixtures of the 19 scenarios of the Verification capability (ACC-01 to
  ACC-17, ADV-01, ADV-03) of the bound initial scenario set, set version 2, in the formats of
  docs/specs/conformance-files.md revision 2 (Python modules that wrap canonical JSON text byte-exact), each fixture
  faithful to its scenario's own Given, When and Expected cells, with unit, integration and property tests that check
  only those files against that document and the bound scenario file. It adds no runner and no governor, and freezes
  nothing: the freeze approvals are given at its acceptance.
traces_to:
  - docs/specs/conformance-files.md#2
  - docs/specs/conformance-files.md#3
  - docs/specs/conformance-files.md#4
  - docs/specs/conformance-files.md#5
  - docs/specs/conformance-files.md#7
  - docs/specs/conformance-files.md#8
  - docs/pre-genesis/conformance-scenarios-initial.md#2
  - docs/pre-genesis/conformance-scenarios-initial.md#5
