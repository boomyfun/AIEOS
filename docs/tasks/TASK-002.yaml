acceptance_criteria:
  - AC1: >-
      The file kind (conformance-files.md section 2). The set file and every fixture file is, byte for byte, the first
      part DATA = r''' then a JSON text then the last part ''' and one LF; the JSON text holds no ''' and is in the
      canonical form of section 2: UTF-8 without a byte-order mark, LF line ends, object keys sorted by code point, an
      indent of two spaces with one key or list item per line, [] and {} for empty values, integers only, only " and \
      escaped with a backslash in strings and control characters as \u with four lowercase hex digits, one final LF;
      re-serialising the parsed JSON text in that form gives the same bytes. The tests read each file's bytes with
      pathlib's read_bytes and never import or execute a fixture or set module.
  - AC2: >-
      The set file (section 3). Its JSON object has exactly scenario_set_version 2, scenario_set_file_hash equal to the
      SHA-256 of docs/pre-genesis/conformance-scenarios-initial.md (the value Genesis charter version 2 §2 binds),
      fixture_set_version 1 and scenarios: 32 entries, one per scenario row of the bound file, in the order of its rows,
      each exactly {id, row_hash, capability, fixture}, with row_hash the SHA-256 of the row line without its line end
      (recomputed by the tests from the bound file), capability the row's capability (Verification for the 17 rows of
      section 2 and for ADV-01 and ADV-03; Risk Engine, Resume Check or Capability Boundaries for the others), and
      fixture either {path, sha256} or null. The 13 entries outside the Verification capability are null. Each non-null
      path is tests/conformance/fixtures/<module name>.py with the module name of section 2, and its sha256 is the
      SHA-256 of that file's bytes. Every file in tests/conformance/fixtures/ is named by exactly one entry.
  - AC3: >-
      The fixture file (section 4). Its JSON object has exactly scenario and row_hash, equal to its set-file entry, and
      cases: one case per task the scenario's Given names (three for ACC-13, one otherwise). Each case has exactly
      request, inputs, records, when and expected. request has exactly the keys of specification 2 §6.5 in their forms
      (task_id TASK- followed by digits; task_content_hash 64 lowercase hex; evaluated_commit a full lowercase hex
      commit id; intent_versions a map of ids to v followed by digits; task_state a state name; changed_paths a list of
      strings; retry_count {used, limit}, integers of 0 or more). when is evaluate exactly when task_state is VERIFYING
      and re_evaluate exactly when it is IN_REVIEW. inputs has exactly the keys and forms section 4 gives. Every record
      gives no finding under aieos_bootstrap.records.check_record, and record ids are unique in a case. In expected,
      every key other than not_fixed is present with a value or named in not_fixed, never both; decision is a list of
      the five acceptance values, next_state a list of state names, missing a list of {dimension, evidence_type},
      reverify a list of record ids of the case, approval null or {record_id, source_class} naming a record of the case
      with that source class, ai_approval_shown true or false.
  - AC4: >-
      Faithfulness (section 5). Every value of expected comes from the scenario's own Expected cell read with its Source
      cell, and every element that cell does not fix is in not_fixed; the Given comes from the scenario's Given cell and
      the set's section 1 defaults, with the profile of assurance-model.md §5 where the risk is high (ACC-16, ACC-17);
      placeholder values (ids, hashes, times) fix no expected element. The unit tests hold, for each realised scenario,
      the expected values together with the text of its Expected cell, and check both that this text equals the cell in
      the bound file and that the fixture's expected equals those values. A scenario that no fixture can realise
      faithfully gets null, is listed with its reason in the test module and in the acceptance request, and is never
      re-expected, narrowed or replaced (section 5; CR-002 part 4 limit 8).
  - AC5: >-
      Limits, stated and tested as such: the files are data for a runner that does not exist yet, so nothing here shows
      that a governor meets them, and every scenario is NOT_RUN until a runner and a governor run in the CI channel; the
      fixtures give the inputs of governor-spec.md §3.2 as values (section 1); the tests check form, the set's binding to
      the bound file and the fixtures' expected values against the Expected cells' text, never a governor's behaviour; no
      file is frozen before the acceptance's freeze approvals; no expected value uses a name that a later specification
      defines.
  - AC6: >-
      Purity and the CI checks (INV-001, INV-002, INV-004; conformance-files.md section 2). The test modules import only
      the Python 3 standard library and aieos_bootstrap.records; they use no exec, eval, compile, __import__ or
      importlib, start no process, open no network connection, call no model, write no file, and read files only with
      pathlib's read_bytes; the fixture and set modules hold one assignment of one string each. The CI steps at the task's
      commits report no finding: deterministic_rule (its file, import and pattern rules over every file under src/ and
      tests/), OPS-003 (an effect label MEASURED, ENFORCED or GUARANTEED only with a decision-matrix row on its line),
      SEC-001 and SEC-002 (no secret pattern, e-mail address or GitHub URL in any added line, file name or message), and
      bandit as the static_security_analysis step runs it. Before each commit, the fixture and test text is scanned
      with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0.
  - AC7: >-
      Tests. Unit tests (tests/unit/test_conformance_files.py) cover each rule of AC1 to AC4 with at least one passing
      case and one failing case, the failing cases built in memory from altered copies of the files; one integration
      test (tests/integration/test_conformance_set.py) checks, end to end, the whole set file against the bound scenario
      file and the fixtures folder; the property tests (tests/property/test_conformance_properties.py; standard library
      only, fixed seeds) check that re-serialising any fixture is idempotent, that any one-byte change of a fixture
      changes its hash and is caught by the set check, that any reordering of keys is not canonical, that the same input
      always gives the same result, and these properties of the invariants the task relates to: for INV-005, every
      expected decision is one of the five acceptance values, never an execution string; for INV-006, no fixture
      expects ACCEPT unless its inputs set auto_accept, and a case with a failed gate never expects NEEDS_REVIEW; for
      INV-007, every evidence record of a case is bound to a commit and intent versions, and every reverify id names a
      record bound to another commit or to another intent version than the request's; for INV-008, no agent_declared
      record is named as an approval, and a profile type whose only record in a case is agent_declared is in that case's
      expected missing list unless missing is in not_fixed. tests/run_tests.py, unchanged, runs all three groups.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC7]}
  - {gate: G3, check: constitution, args: [AC6, INV-001, INV-002, INV-004, INV-010, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts AND every fixture file and the set file have their freeze approvals
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act, scenario_not_realisable]
owner_kept_act: false
