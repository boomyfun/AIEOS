acceptance_criteria:
  - AC1: >-
      The log given (reading). The function append takes the log as bytes (empty bytes for a new log), the event's
      type, its payload, its event_id (required, a non-empty string chosen by the caller, so that a retried append is
      recognised: spec 1 §4, concept line 856), the append time as a timezone-aware datetime in UTC, and, when they
      apply, task_id, fencing_token, corrects and lease. Before anything else, the given log is checked with
      records.check_log; a log with any finding, or that does not end with LF when it is not empty, gives the
      result "refused" with reason "log", and nothing is appended (fail closed: a damaged log is never extended). The
      result is one of "appended", "duplicate" or "refused", a refusal with one of the reasons log, conflict, event,
      log_after and fence.
  - AC2: >-
      Idempotency (spec 1 §4; spec 2 §6.1 event_id). When a line of the given log has the same event_id, the result is
      "duplicate", naming that line's seq, if the line's type, payload, task_id, fencing_token and corrects equal the
      new event's (absent equals absent); otherwise "refused" with reason "conflict", naming that seq. Nothing is
      appended in either case.
  - AC3: >-
      The line (spec 2 §6.1, §6.3). Otherwise the new event is one JSON object with event_id, type, appended_at (the
      given time as ISO 8601 UTC with "Z", to the second), seq (one more than the given log's number of lines, 1 for
      an empty log; records.check_log counts every line, an ignored duplicate included), payload, and task_id,
      fencing_token and corrects only when given; corrects must name an event_id of the given log (reading: check_log
      does not check that it exists); its payload is checked with records.check_payload. Its JSON text has sorted keys,
      no spaces after separators, ASCII-only escapes, and one LF at the end (reading: one canonical form, so that the
      same inputs always give the same bytes). Any finding gives "refused" with reason "event" and the findings.
  - AC4: >-
      The whole log after the append (spec 2 §6.1). The given bytes followed by the new line are checked with
      records.check_log; any finding gives "refused" with reason "log_after" and the findings, so the module never
      returns bytes whose log check_log rejects (for example a seq or task_id rule that AC3 does not restate).
  - AC5: >-
      Append-only (INV-009, reading). The result "appended" carries the line's bytes and the new log's bytes, and the
      new log's bytes are the given bytes followed by exactly that one line: the given bytes are an exact prefix and
      nothing before them changes; no line is removed, reordered or rewritten; a correction is a new event (spec 1
      §4).
  - AC6: >-
      Fencing (spec 1 §8; spec 2 §6.1). An event that carries a fencing_token, task.submitted always, is appended only
      when the lease given is a lease on the event's task_id whose token equals the event's token and whose expiry is
      after the append time. No lease, another task, another token, or an expiry at or before the append time gives
      the result "refused" with reason "fence", and nothing of the event is appended (reading: the module trusts the
      lease it is given; the local store that holds leases is a later task). The lease is a mapping with exactly
      task_id, fencing_token ({epoch, counter} as spec 2 §6.1) and expires_at (a timezone-aware UTC datetime). A
      task.submitted event without a fencing_token gives the result "refused" with reason "fence".
  - AC7: >-
      The refusal's record (spec 1 §8; spec 2 §6.2 the core's observation types). A "fence" refusal also carries the
      payload of the record.added event that records it: an observation record with source_class
      deterministic_tool_local, evidence_type refused_submission, outcome fail, subject the task id, refers_to the
      refused event's event_id, and a recorder and record_id the caller gives (reading); the module does not append it
      itself: the caller appends it with append, as one more event.
  - AC8: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The module and its tests import only the Python 3 standard
      library and aieos_bootstrap.records, the tests also aieos_bootstrap.eventlog; they use no exec, eval, compile,
      __import__ or importlib, start no process, open no network connection, call no model, open, write or remove no
      file, read the clock nowhere (the time is always given), and name no project-state directory in src/; the
      tests build every log in memory. The CI steps at the task's commits report no finding: deterministic_rule,
      OPS-003, SEC-001, SEC-002 and bandit, as TASK-006's AC9 lists them.
  - AC9: >-
      The existing modules and tests unchanged and passing. records.py and every existing test module are not changed
      (forbidden) and pass at the task's commits, TASK-010's assertion included (the package file names no Resume
      Check fixture folder). If one of them can pass only by a change, the task escalates (needs_out_of_scope_change)
      instead of changing it.
  - AC10: >-
      The added text. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0; the file names are scanned with the same patterns and the records executors'
      pre-push pattern (D-282).
  - AC11: >-
      Limits, stated and tested as such: the module returns bytes and writes none, so no code of the repository writes
      an event log yet, and nothing shows that a log on disk is append-only; the lease is the caller's, and nothing
      here grants, holds, releases or expires one; it rebuilds no projection and derives no task state, retry count
      or record view (spec 1 §6); it does not check that a submitted commit exists or carries its trailer (recovery,
      spec 1 §7, TASK-009); it checks the forms TASK-001's checker checks and the rules AC2 to AC7 add, nothing more.
  - AC12: >-
      Tests, with this rule-to-test list, each rule with at least one passing case and one failing case, all in
      memory: R1 AC1 (an empty log; a log with a finding; a log without its final LF); R2 AC2 (a known event_id with
      the same event, a different payload, a different type and a different token; the seq named); R3 AC3 (each envelope key; the time's form; seq after a log
      with an ignored duplicate; corrects known and unknown; a payload with a finding; the canonical bytes); R4 AC4 (a
      case that only the whole-log check refuses, if one exists, else a stated reason why none does); R5 AC5 (the
      prefix, one line, a correction as a new line); R6 AC6 (no lease, another task, another token, expiry equal to
      and before the time, a valid lease; an event without a token that needs none; a task.submitted without a token); R7 AC7 (the record's keys and
      values, and that check_record finds no fault in it; appending it). Unit tests in tests/unit/test_eventlog.py;
      integration tests in tests/integration/test_eventlog_log.py build a log of every event type of spec 2 §6.3 by
      successive appends, check it with records.check_log (no finding), and replay a retried append of each event to
      show it changes nothing. Property tests (tests/property/test_eventlog_properties.py; standard library only,
      fixed seeds): for random sequences of valid appends, the bytes only grow and every earlier prefix is kept
      (INV-009), seq runs 1 to n, every event_id is unique, appending any event a second time changes nothing, the
      same inputs always give the same bytes, and no submission with a mismatched or expired lease is ever appended.
      tests/run_tests.py, unchanged, runs all three groups.
