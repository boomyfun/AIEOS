# Task contract TASK-007, the event log's append rules (Master Plan revision 3, §4 M3; the M3 work order of decision
# D-254, as amended by decisions D-262 and D-263; specification 2 §5.1). Revision 0, drafted under decisions D-311 (C5)
# and D-313, brought for approval in its own request; whether it is approved is recorded in the decision files, not in
# this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-001 and TASK-006.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: a pure module that, given an event log's bytes and one new event, decides
# whether and how the event is appended under specification 1 §4 and §8 and specification 2 §6.1 to §6.3: idempotency
# by event_id, the sequence number and the append time, the task_id rule, the form of the whole log after the append
# (TASK-001's check_log), append-only bytes, and the fencing check of a submission against a lease the caller gives,
# with the refusal's observation record. It returns the exact bytes to append; it opens no file (shape (P) of decision
# D-313: the CI channel's deterministic_rule refuses any file write in src/ and tests/, and any string in src/ that
# names the project-state directory, "no core writer exists yet"). The single file writer of INV-004, the local store
# of leases (spec 2 §3) and the directory's path come with a later task and a later workflow revision; until then this
# module is the only producer of log lines, and the lines it produces are written by no code of the repository.
# Departure from the M3 work order (D-254 P3, TASK-007's row: "the core's single writer (S1, S2 §6.3; INV-004)"),
# declared under D-313 C5: this task writes no file; the writer module, its tests and the workflow's exemption for
# exactly that module are carried to a later M3 task and to the workflow's revision 6, with the Resume Check pin;
# TASK-008 and TASK-009 take the same pure shape unless a later decision says otherwise.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its __all__ gains eventlog; it must not name the Resume Check fixture
# folder (TASK-010's assertion, tests/integration/test_conformance_rc_set.py). The new module is read by nothing
# else in the repository; the deterministic_rule step and the GOV-003 step read every file under src/ and tests/.
# Risk: high. R2 matches src/** and tests/** (medium); R3 read fail closed matches them too, the event log being one of
# the parts that limit authority (spec 1 §8 fencing; risk rules section 2 point 3); no path meets R10 (.aieos/) or R11;
# the highest wins. Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture
# [deterministic_rule], functional [integration_test], security [static_security_analysis] and architecture [ai_review
# (cross-model)], plus the evidence_required of the applicable articles. Dimensions are named as TASK-006's records
# name them (decision D-181, reading R-dim).
# Change class: normal_cr (D-254 P3): not an evaluator part named by DM A29 (no validator, fixture, scenario, runner or
# governor), although src/aieos_bootstrap/** is on GOV-003's pinned list, so the CI step reports it as an evaluator
# change and it is judged by the base version.
# Reviews (as TASK-006's): five way-2 reviews by a Claude model other than the implementer's, each under a decision of
# the decision agent (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002; governance
# ai_review for GOV-003; operational ai_review for OPS-003; the cross-model half), and three decision-agent reviews
# (architecture human_review for INV-003, which also checks that the property tests cover INV-009's rule; operational
# human_review for OPS-002; the cross-model half). Each way-2 review record's basis names every article whose entry it
# covers and addresses each of their rules, beyond what the tool parts decide. Each reviewer's prompt is
# self-sufficient, with the scratchpad's absolute path in its first line (D-277).
# Evaluation path (A61; as TASK-006's): the approved contract is committed on main as its own commit C, which changes
# only docs/tasks/TASK-007.yaml and has one parent equal to base_commit, and is pushed normally; the files are drafted
# and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's commits, each
# carrying the trailer "AIEOS-Task: TASK-007" and no e-mail address in its message, go to the branch task/TASK-007 on
# GitHub, each push under its own decision of the decision agent after a secret scan and a dry run against a bare
# single-branch copy (D-229, D-274), never by force and never deleting; the CI channel runs on each push and its
# records are re-fetched into docs/records/TASK-007.jsonl; main receives the task only at its acceptance, by a
# fast-forward under its own decision. Before each task commit, the added text is scanned with the workflow's SEC-001,
# SEC-002 and OPS-003 patterns (AC11).
# Not applicable: OPS-001 (scope: the repository's refs; the task changes no ref); INV-005 to INV-008, INV-010 and
# INV-011 (their scopes, the decision engine, the governor, evidence records and the policy, meet no path of the
# write-set; the module emits no decision and judges no evidence); GOV-001, GOV-004 to GOV-006 and SEC-003 (their
# scopes, the concept file, the bound artifacts, the decision matrix, the records and pre-genesis documents, and
# .github/, meet no path of the write-set). INV-009 (scope: the event log) is applied as a reading: no path of the
# write-set is an event log, but this module is where its rule is made, so its tests carry the rule (AC5, AC12).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own (CR-002 part 4 limit 5 does not apply).
# Uncovered and stated limits (AC11): no code writes the bytes this module returns, no local store holds leases, and
# no event log exists in the repository, so nothing here shows that any log on disk is append-only; the module trusts
# the lease it is given; whether a submission's commit exists and carries the trailer is recovery's (TASK-009); every
# review is by AI of one vendor.
task: TASK-007
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/eventlog.py, that decides how one event is appended to
  an event log given as bytes, under specification 1 sections 4 and 8 and specification 2 sections 6.1 to 6.3: an
  event_id already in the log has no effect; otherwise the next sequence number, the given append time, the task_id
  rule and the payload's form; the whole log after the append free of findings under TASK-001's check_log; the old
  bytes an exact prefix of the new; and, for an event that carries a fencing token, the token and expiry of a lease
  the caller gives, with the observation record of a refusal. It returns the exact bytes to append, or why nothing is
  appended, with unit, integration and property tests in new test modules. It opens, writes and removes no file,
  keeps no lease, rebuilds no projection and decides no execution or acceptance.
