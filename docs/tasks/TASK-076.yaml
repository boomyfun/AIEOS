constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The reader. read_allowlist(root, base, task_id, run=None) reads both files at base through gitread.run only, by a
      walk copied from task_contract's (commit, root tree, then the path's trees, then the blob; each call
      "cat-file -p <id>" with 10 s; the same caps: 1 MiB, strict UTF-8, no U+FEFF, no C0 control but the line feed, no
      DEL, C1, U+2028 or U+2029); the two walks share the commit and root-tree calls, at most seven git calls in all. It
      gives a mapping with exactly result, policy, contract, allowlist and findings: result "read" when both arguments
      and walks were attempted, or "unreadable" for an argument out of form (root, base, task_id as read_contract checks
      them), with every list empty and one finding. Tests in tests/unit/test_claude_code_shell_allow.py: an absent
      .aieos tree, an absent project.yaml, a project.yaml that is not a blob, an unreadable or over-cap blob, and a
      contract missing at the base each give that list empty, the other list still read; a stand-in run that raises
      gives both empty. The walk is held equal to task_contract's: the new test module builds, in its own code, stand-in
      object stores of task_contract's shape extended with a capabilities line and a .aieos tree, and asserts the new
      walk reaches the same contract blob as read_contract and leaves the contract list empty in every case read_contract
      refuses at its git, tree or bytes step. No file is opened.
  - AC2: >-
      The policy grammar (parse_policy(text)): the list is the lines after a top-level line exactly "shell_allow:" up to
      the next top-level line, each exactly "  - " followed by the entry text; blank and "#"-comment lines skipped as
      task_contract skips them. Any second top-level line starting "shell_allow:", an item line of any other form, an
      empty section, or "shell_allow:" with a value on its line gives an empty list. Tests: each of those cases, and a
      valid list of three made-up entries read in order.
  - AC3: >-
      The contract grammar (parse_contract_shell(text)): within the top-level "capabilities:" section, the value of the
      line beginning "  shell: " together with the following lines indented four or more spaces, joined by single
      spaces after their indentation is removed, must be exactly "{allow: [" then zero or more double-quoted strings
      separated by ", " then "]}", read by a quoted-string scan (a string may hold ", "); a string holding a backslash
      or a double quote inside, or any other shape, gives an empty list. Also empty: a second "  shell: " line, a second
      top-level "capabilities:", a blank or comment line inside the continuation. Tests: each of those; a made-up text
      of TASK-074.yaml's shape (an entry with "<", a first word "timeout", a line wrap inside a string) reads empty after
      allowlist_findings; a well-formed list of two made-up entries over two lines is read. The acceptance-time scan of
      every contract is AC10's.
  - AC4: >-
      The form check. Each list is passed to claude_code_hook.allowlist_findings; any finding makes that whole list
      empty (specification 2 section 7.2), the finding words kept in findings. Tests: one malformed entry among good
      ones voids its list; a list of only good entries stays.
  - AC5: >-
      The one list (combine(policy, contract)): for every pair of a policy entry and a contract entry where one's words
      are a prefix of the other's (split on single spaces), the longer of the two, without repeats, in policy order then
      contract order. A property test in tests/property/test_claude_code_shell_allow_properties.py over generated word
      lists checks that a simple command matches the one list by the judge's rule (claude_code.py :327-331) exactly
      when it matches an entry of each list; either list empty gives an empty list.
  - AC6: >-
      The hook program. claude_code_pretool_hook gains a strict parse helper for the input's tool_name, as strict as
