# TASK-076: the shell allowlist reader of the Claude Code adapter's PreToolUse program (M5; specification 2 revision 8,
# section 7.2; specification 5 revision 5, section 11 points 5 and 6). TASK-076 supersedes
# TASK-075, whose revision 2 (commit 6eb56b29) is never accepted and whose file stays on main: G0 reads a contract
# only at the commit that adds it (aieos-checks.yml :258-269; L-0019), so a change of TASK-075.yaml would not be
# read. The content is TASK-075's revision 3 (session 308d8b07, D-1975, D-1979), drawn from its revision 2 (session
# 58b6a0c7, decisions D-1930 to D-1954, rounds t75a and t75b): tests/unit/test_writer.py joins the write-set for its
# INV-004 string pin (below), which the pin scan of revision 0 missed.
#
# Scope (D-1944, D-1945): a new module src/aieos_bootstrap/claude_code_shell_allow.py reads, at the base the launcher
# gives (AIEOS_BASE, as the PreToolUse program already reads it), two lists from Git's object store only: the policy's
# `shell_allow` in the policy file and the lease task's `capabilities.shell.allow` in docs/tasks/<task>.yaml; checks
# each with claude_code_hook.allowlist_findings, reading a list with any finding as empty; and gives one list, the longer
# entry of each pair of a policy entry and a contract entry where one is a word prefix of the other (specification 2
# section 7.2). The PreToolUse program passes that list to claude_code_hook.entry in place of its empty list, and reads
# the lists only for a Bash or PowerShell call (D-1953, R1-10).
#
# Precondition: the CI channel's revision 12 (fa4e4574, DM A66, D-1946 to D-1949) lets this one new module hold strings
# naming the project-state directory and lets it open no file; it is on main with CI green (run 39900775702). The hook
# program gets no such allowance: its source and docstring name only "the policy file" (the :742 pin stays).
#
# Owner-act boundary: the task adds no entry to any list, writes no policy file, places no hook and changes no setting
# (A51 item (4); CR-002 part 4 limit 5 not reached). Every entry of `shell_allow` is a policy change approved on its own
# (specification 5 :108).
#
# Stated limits. In the new module's docstring: the policy file's path .aieos/project.yaml and the limits below. In the
# hook's docstring: the same limits, naming the file only as "the policy file".
# - The tree walk is a copy of task_contract's (its object-store walk), kept in step by hand, as R-4 of DEF-0092 states
#   for the hook's other copies; native takeover (A11) retires it. A contract that read_contract refuses only at its
#   parse or task step may still give a shell list here; harmless, since the hook stops at its step 3 first.
# - Each existing contract's capabilities.shell.allow reads as empty, by no entries or by entries outside the form; the
#   count comes from the acceptance-time scan (AC3); only a contract written later with entries in the form gains any.
# - No policy file exists: the policy list reads as empty, so every leased shell call stays refused, and by
#   specification 5 section 8 ends the session, until a policy file with entries exists at the base.
# - The entry check accepted with TASK-062 refuses a first word such as timeout or python (claude_code_hook.py
#   :68-70), so no list can allow the project's own command forms (for example "timeout 110 python ..."); this task's
#   own capabilities line reads empty for that reason; under a placed hook those commands stay refused whatever the
#   policy holds (a point for the M5 exit review).
# - The grammars of AC2 and AC3 are this module's fixed forms, narrower than YAML: any other shape reads as empty.
# - For a Bash or PowerShell call the new reads share the commit and root-tree calls: at most seven more git calls of
#   ten seconds each on top of the hook's own five, twelve calls, about 120 seconds at worst for the git calls alone;
#   other tools keep the hook's five; against Claude Code's hook timeout (unmeasured, C6).
#
# The pins (L-0026; MY2/shell/pinscan75.txt and rounds t75a and t75b). Line numbers are those of
# fa4e45743fbdc264415eef4f3f36651cecfd8c47, unchanged at the base d382f4c4. Each pin passes unchanged unless named here:
# - Changed, in the write-set: tests/unit/test_claude_code_pretool_hook.py: Calls.patches() (:121-131) gains the new
#   reader's stand-in appended after index 4 (:547's patches()[:4] slice unchanged; the shell tests at :362-364, :420
#   and :891 run through Calls and so get it); the patch sites :124, :260 and :289 (Read inputs, never reaching the
#   reader); :394-407 (the empty-allowlist test) stays for the no-list case and is joined by AC6's cases; the run-seam
#   check (:558-579: SEAM_STRINGS at :559, the module tuple at :579; the attribute special cases at :620 and :627-629;
#   the "two imports" message at :633-634; LEGIT and the samples :638-710, the hostile bodies :656-675 and the call
#   sample :687) admits claude_code_shell_allow with read_allowlist as a three-argument call and no run seam, and
#   TEXT.count of each core call stays exactly once; the imports and names (:719-752; the import set :731-734;
#   attrs_of :749-752, where claude_code stays {'RECORDER'} at :752 and claude_code_shell_allow gains
#   {'read_allowlist'}); AC9WhatIsStated (:916-931) and the phrases at :922-929 and :995-1001 change in step with the
#   new limits ("about 50 seconds" becomes the twelve-call sentence; "every shell call is refused" stays for the case of
#   no policy file); test_every_test_names_its_criteria (:933-956; regexes :941-942 and :952; :956 stays TASK-072 only
#   for PretoolHookFiles; the property loop) admits "TASK-076 ACn" (the regex TASK-07[246]: TASK-072,
#   TASK-074 and TASK-076) and still refuses every other task, TASK-075 among them; an assertion added with the
