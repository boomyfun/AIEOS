#   tests/property/test_claude_code_pretool_hook_properties.py: its patches (:93, :162, :190, :226) gain the new
#   reader's stand-in. tests/unit/test_claude_code_read_hook.py: HOOK_SIDE (:35-36) and OWN_IMPORTS (:37-42) admit
#   claude_code_shell_allow (its own imports as the code fixes them), ALLOWED (:43-44) gains the pairs it needs, and the
#   separation check still holds over eight modules.
# - Changed, added in revision 3 (D-1975): tests/unit/test_writer.py :396-406, R8SingleWriter's
#   test_only_the_writer_opens_files_or_names_the_directory (INV-004): every src module but writer.py holds no
#   str constant naming the project-state directory (:387); it admits exactly
#   src/aieos_bootstrap/claude_code_shell_allow.py for such strings, as the CI channel's revision 12 does, its opens
