# Task contract TASK-135 (r2; the judge-fix task of D-6240 conditions 1 to 4, ordered first by D-6244; session 26136a0a, 2026-11-14). Approved in substance by the decision agent at D-6246, with the edits of its condition 1 made here.
# Why: claude_code._judge (src/aieos_bootstrap/claude_code.py:288-332) gives "uncovered" to every tool name beginning "mcp__" (docstring :15-16, fall-through :332), and claude_code_pretool_hook turns "uncovered" into exit code 2 (a refusal). The launched session of the first real run calls only the seven tools of the server "aieos" (mcp_server.py: SERVER_INFO name 'aieos', TOOL_NAMES = status, acknowledge, ask, report, handoff, get_work_order, query), the first being get_work_order, so every one of its MCP calls would be refused (confirmed on the pure function by the worker's finding3_out.txt; whether Claude Code applies exit 2 to MCP calls in -p mode is unmeasured and stays a measurement of the first run, D-6240 C5). D-6238 to D-6240 (finding 3).
# Not in this task: the hook script, any settings file, the MCP file, claude_starter.py, claude_code_pretool_hook.py, claude_code_hook.py, claude_code_reads.py and claude_code_read_hook.py (the read hook keeps skipping every mcp__ name), .github/**, every docs file. A change to any of them is its own decision (D-6240 C3). No other tool name changes its verdict.
# Specification 5: its text says nothing that this change makes false (line 65 lists "tool coverage, including ... MCP tools" as unmeasured, which stays true; line 123 point 8 leaves the tool-name detail to a later contract). Specification 5: nothing in it is made false by this change (lines 65 and 123); no spec edit, ruled by the decision agent at D-6246 (b). So no docs/specs path is in the write set; D-6240 C4 is met by this finding and by the docstring fix.
# Risk, change class: high (R3 matches every path under src/** and tests/** until an architecture names the components, risk-rules-gov-aieos.md:18); not critical: no docs/specs, no .github, no .claude, no conformance path in the write set (computed by script from base acf4b41d, output brought with this draft); the change class is critical_cr because the CI's EVALUATOR list holds src/aieos_bootstrap/** and the tests folders, as for TASK-125 to TASK-131.
