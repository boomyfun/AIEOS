acceptance_criteria:
  - AC1: >-
      The tuple and the verdict (D-6240 C1). claude_code.MCP_TOOLS is a tuple of exactly seven str, each equal to "mcp__aieos__" followed by one of status, acknowledge, ask, report, handoff, get_work_order, query, in that order. For a hook input whose tool_name is a str equal to one of them (membership by ==, no other comparison) and whose tool_input is a dict, judge gives {'verdict': 'allow', 'concern': 'mcp', 'reason': 'mcp', 'findings': [], 'record': None}, whatever the tool_input holds and without reading any other key. The check sits after the argument findings and the existing READ, WRITE and SHELL branches and before the final fall-through, so no existing branch changes. For a tool_name that is a str not in the tuple, including every near-miss of AC2, and for a non-dict tool_input, the result is what it is at the base (uncovered, reason tool). 'mcp' is added to REASONS (the tuple then holds 'argument', 'tool', 'input', 'path', 'write_set', 'parse', 'push', 'allowlist', 'record', 'read', 'mcp'); no other constant changes.
  - AC2: >-
      Tests of the judge, tests/unit/test_claude_code.py: each of the seven names gives the AC1 result; the near-misses each give uncovered, reason tool, no record: another server (mcp__other__status, mcp__aieos2__status, mcp__aieos_x__status), wrong case (MCP__aieos__status, mcp__AIEOS__status, mcp__aieos__Status, mcp__aieos__GET_WORK_ORDER), a suffix (mcp__aieos__status2, mcp__aieos__status_, mcp__aieos__status with a trailing space or newline), a prefix only (mcp__aieos, mcp__aieos__, mcp__), an empty tool part, a leading space, a name of another tool (status, get_work_order, Status), a tool of the aieos server that does not exist (mcp__aieos__write, mcp__aieos__exec), and the older uncovered names the existing tests use; a non-str tool_name and a non-dict tool_input stay uncovered. The verdicts of Read, Grep, Glob, Write, Edit, Bash, PowerShell, TodoWrite, MultiEdit and a relative file path are unchanged (pinned by a table equal to the base behaviour). One test holds claude_code.MCP_TOOLS equal to tuple('mcp__aieos__' + n for n in mcp_server.TOOL_NAMES) (so the tuple cannot drift from the server) and mcp_server.SERVER_INFO['name'] equal to 'aieos'; the test file imports mcp_server for this only. The existing test test_other_tools_uncovered keeps passing without an edit to its assertions (its mcp__ name is another server's).
  - AC3: >-
      End to end, tests/unit/test_claude_code_pretool_hook.py: one new test, with the file's own stand-ins, that a call input for mcp__aieos__get_work_order gives exit_code 0, outcome 'allow', reason 'tied_allow' with nothing passed to the violation path, and that an input for mcp__aieos__nothing gives exit_code 2, reason 'uncovered'. No other test of that file changes.
  - AC4: >-
      Docstring (D-6240 C4). The module docstring of claude_code.py is corrected: the list at file lines 15-16 no longer says every name beginning "mcp__" is uncovered but says that exactly the seven names of MCP_TOOLS are allowed with concern "mcp" and every other tool name, every other name beginning "mcp__" included, is uncovered; the AC9 paragraph states that whether Claude Code runs a hook for an MCP call and applies exit 2 to it in -p mode stays unmeasured. No other sentence of the docstring changes. Specification 5: stated finding above (nothing false to correct); no docs path in the write set.
  - AC5: >-
      Limits stated at acceptance: (1) the allow is by tool name only: it does not judge the tool_input of an MCP call, and the server's own checks (session, lease, scope) are the server's; (2) a server named "aieos" in any other MCP file would be allowed by name: the launched run loads only the pinned MCP file with --strict-mcp-config (TASK-134 AC3), which the starter hash-checks, and at acceptance a script checks that the top-level server key of that file is exactly "aieos" and that the file's sha256 equals the starter's pin, its output brought unedited (the file is outside the repository, so no test reads it); (3) the read hook (claude_code_reads, claude_code_read_hook) still skips every mcp__ name; (4) whether the run's MCP calls reach this hook is a measurement of the first real run, not shown here; (5) the tool names are exact: a rename of a tool in mcp_server.py fails the drift test until this tuple is changed by its own task; (6) the property tests (tests/property/test_claude_code_properties.py and the hook property tests) generate no aieos name, so the new allow is covered by the unit and end-to-end tests only; tests/property stays forbidden; (7) the docstring of claude_code_pretool_hook.py (lines 43-44) lists examples of "allow" that do not name an MCP call; that file is forbidden and its list is not exhaustive (it omits a shell allow already).
  - AC6: >-
      Purity and the suite (INV-001, INV-002, INV-004). claude_code.py keeps its imports (re, governor, records), starts no process and opens no file; the new text uses none of the words MEASURED, ENFORCED and GUARANTEED; the whole suite passes locally (`timeout 110 python tests/run_tests.py < /dev/null`, in slices if it does not finish) and on the CI's task-branch run, and pyflakes is silent on src and tests. The raw output of the full unit suite and of pyflakes is brought unedited. The diff of the three files is brought at acceptance and shows only the changes above.
  - AC7: >-
      Class, evidence and the departures. The risk class is high; the change class is critical_cr; the evidence profile is that of assurance-model section 5 for high, as for TASK-131: unit_test, integration_test (named at acceptance or its absence stated as a departure), deterministic_rule, static_security_analysis, ai_review by a pair of reviews on Haiku 5.5 in their own sessions (D-6206; labelled same-vendor, not cross-model, and the cross-model entry stated as a departure), a per-article review, and a separate decision_agent_review. The governor's shadow result at the GOV-003 row is a stated departure as in TASK-125 to TASK-134, and a run-made evidence gap (no G3 record) is stated if it shows. The task BUILDS the fix and launches nothing; the first real run is its own decision under A73. DM A73 gives hooks and settings of the self-build to the decision agent; this change installs no hook and changes no setting.
