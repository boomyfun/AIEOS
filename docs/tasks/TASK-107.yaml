acceptance_criteria:
  - AC1: >-
      The module. contract_path.py imports only writer and reads no attribute of it but STATE_DIR; it opens no file, starts no process and imports
      no os, subprocess, gitread or time; no string constant, docstring or comment in it holds the substring of the state directory's name (CI's
      string rule allows it only in writer.py and claude_code_shell_allow.py). candidates(task_id) checks the id (TASK-<digits>) and returns the
      ordered pair of component tuples ((STATE_DIR, 'tasks', '<id>.yaml'), ('docs', 'tasks', '<id>.yaml')) and nothing else (no joined string; the
      interfaces list stays at two names). decide(state, docs) takes each side as one of 'present', 'absent', 'refused' and returns, for the nine
      pairs: (present, absent) gives ('read', 'state'); (absent, present) gives ('read', 'docs'); (present, present) gives ('both', None); (absent,
      absent) gives ('absent', None); whenever either side is 'refused' it gives ('refused', 'state') when the state side is refused (also when both are)
      and ('refused', 'docs') otherwise (a stated choice of this task, proposed and fail closed, not the specification's words: an unreadable docs
      side cannot be shown absent, which the both-folders rule of specification 7 section 6 needs, so (present, refused) gives ('refused', 'docs')
      although the specification consults docs when the state side is absent); any other argument raises ValueError, as candidates does for an id not of the form TASK-<digits>; a
      test covers each of the two. Each of the nine
      pairs is a row of the table test; a purity test (AST) pins the module's imports, its used names and attributes and the absence of the substring.
      A test shows contract_path's state directory equals writer.STATE_DIR and claude_code_shell_allow.POLICY_DIR.
  - AC2: >-
      base_inputs. _contract and _contract_at read the contract through one helper: the state candidate is read with base_files.read_file and
      classified (found is present; exactly one finding equal to "<ancestor or path> is missing", the rule of base_inputs._absent, is absent; any other
      finding is refused), the docs candidate likewise, and contract_path.decide gives the outcome: read gives the text of that side; absent gives the
      docs candidate's findings exactly as today (each finding prefixed by its path as _read does); both gives the finding "contract: <task> is in
      both folders" (the state directory is not named by a literal); refused gives the refused side's findings; when both sides are refused, the state side's findings come first, then the docs side's. With the docs folder only, the git call list
      is today's (a state lookup of a name that the root listing does not hold makes no call; base_inputs memoizes identical calls) and
      test_read_cache's property (no identical call repeats) holds. The hash and parse checks after the read are unchanged.
  - AC3: >-
      task_contract. read_contract reads the commit and the root tree once, classifies each side by the entry check (the name absent from the
      listing is absent; present with a wrong kind or mode, or a listing error, is refused; else present) at the state folder, its tasks folder and
      the contract name, and likewise at docs, its tasks and the contract name; contract_path.decide gives the outcome; only the chosen blob is
      read. With the docs folder only the calls are today's five (commit, root, docs, tasks, blob, all cat-file -p with the timeout of today) and
      every finding, reason and shape is unchanged ('tree: docs missing', 'tree: tasks missing', 'tree: contract missing'); with a state folder the
      calls are at most seven. New findings, exactly: 'tree: state not a tree', 'tree: state tasks not a tree', 'tree: state contract not a blob'
      (a state-side refusal), 'tree: contract in both folders' (both), all with the reason 'tree' as the existing tree findings and no paths in the
      answer; no fallback to docs after a state-side refusal. The source and the docstring of task_contract.py hold no substring of the state
      directory's name (the pins at test_task_contract.py :448 and :477); its docstring keeps 'The five calls' and 'about 50 seconds' for the docs-only
      case and adds the case with a state folder (seven calls, about 70 seconds).
  - AC4: >-
      claude_code_shell_allow. _read keeps one commit read and one root read, reads the state folder's tree once for both the policy walk and the
      contract walk, and classifies and decides the contract as in AC3 with the findings prefixed 'contract: ' ('contract: tree: contract missing' as
      today for neither side; 'contract: tree: state not a tree', 'contract: tree: state tasks not a tree', 'contract: tree: state contract not a
      blob', 'contract: tree: contract in both folders'). POLICY_DIR stays and is the folder step of the policy walk (the contract walk takes the state
      folder from contract_path); the answer shapes, the reasons and the policy findings ('policy: tree: .aieos missing', 'policy: tree: policy
      missing') are unchanged. Each walk's outcome for a state-side refusal, in order (the state folder entry is not a tree, or a link, or has a wrong
      mode): the policy walk gives its existing finding ('policy: tree: .aieos not a tree', test_claude_code_shell_allow.py :114 and :121-123) and an
      empty policy list; the contract walk gives 'contract: tree: state not a tree' and no contract list, because the state side is refused and never
      falls back; the two findings come in that order (policy, then contract), the answer's shape is as today, and the case at :114 and :121-123,
      which expects the contract list still read, is an amended assertion (an amendment of TASK-076 AC1) listed among AC6's exemptions. The other state-side refusals (a stated choice of this task, fail closed, covered by one test): when the state
      tasks entry is not a tree, or the state contract entry is not a 100644 blob, or a git failure or out-of-form tree text occurs when reading the
      state folder's tree or its tasks tree, the contract walk gives its fixed finding ('contract: tree: state tasks not a tree', 'contract: tree:
      state contract not a blob', or the existing git or text finding with the 'contract: ' prefix), no list and no fallback; the policy walk is as
      today, except where the failure is in reading the state folder's tree itself, which is read once for both walks: there each walk gives its own
      finding, policy first. With a store like the tests' (the state
      folder holding the policy file only) the calls stay at most seven, with a state tasks folder at most eight, all cat-file -p with the timeout of
      today, the commit and the root once each. A contract that is refused or in both folders is refused at step 3 of the hook through task_contract's
      reader (claude_code_pretool_hook.py :30-36: any contract result other than "read" is refused before step 4); the empty allowlist (the
      hook's _allowlist, :223-237, the returns at :227, :231, :233 and :236) is a second fail-closed layer.
  - AC5: >-
      The pins and the docstrings. The three import pins are widened by exactly the name contract_path, each named as an amendment: TASK-071 AC5 at
      tests/unit/test_task_contract.py :436; TASK-076 AC8 at tests/unit/test_claude_code_shell_allow.py :322-323; TASK-082 AC8 at
      tests/unit/test_base_inputs.py :537-538, with its used-attribute pin (:541-545) widened to include contract_path and its exact used
      attributes; 'writer' stays a forbidden name in test_claude_code_shell_allow.py :327. The hook module's docstring changes only: the reader
      sentence at :30 names the two folders, and the call-and-time sentence (:90-94) states the true worst case (fifteen calls, about 150 seconds
      for the git calls alone; thirteen when the state folder holds the policy file only); the pinned phrases at
      tests/unit/test_claude_code_pretool_hook.py :1138 and :1216 are amended and named as amendments of TASK-072 AC9, TASK-074 AC3 and TASK-076
      AC7, and :1219-1220 is kept; an added test pins that the hook module's AST with its docstrings removed equals the base's. If a pinned phrase of
      test_task_contract.py :471-472 must change, it is named as a TASK-071 AC7 amendment. The separation check of
      tests/unit/test_claude_code_read_hook.py (OWN_IMPORTS at :45, run at :389-390 and :489-495) widens its entry for claude_code_shell_allow.py
      by exactly contract_path and is named as an amendment of TASK-076 AC7; the hook's import closure gains writer through contract_path, which
      uses writer.STATE_DIR only (the closure already holds writer through claude_code_store.py and session_violation.py). The
      fourth pin: tests/unit/test_resume_inputs.py test_base_inputs_imports_and_attributes (:518-:535, TASK-085 AC7) widens its
      import set (:527-:528) by exactly aieos_bootstrap.contract_path and its used-attribute filter and dict (:531-:535) by contract_path
      with exactly candidates and decide, an amendment of TASK-085 AC7; no other assertion of that file changes and resume_inputs.py
      itself is unchanged.
  - AC6: >-
      Tests. Every existing test function that the task changes keeps its assertions or gets stronger ones, shown by a script that compares, per test
      function, the ordered list of ast.dump of each assert statement and each self.assert* call at the base and at the task commit (TASK-102's
      AC3 form), with the exempted assertions listed in commit X's map and named in the approval request; added tests: the table of AC1 (nine
      rows), base_inputs, task_contract and claude_code_shell_allow each for the six cases (state only, docs only, both, neither, state refused, docs
      refused) with real tree-object stand-ins or the existing fake tables and the call bounds of AC3 and AC4, a property test (random presence
      and refusal combinations give the decide table and never a fallback past a refused state), a parity test stated against the public returns
      (on one stand-in each reader's answer equals that same reader's answer on a docs-only stand-in that holds the same contract bytes; no
      bytes are compared across readers), and in tests/integration/test_base_inputs_repo.py a test that reads the commit named by BASE (:14)
      through base_inputs (docs only), with the expected answer written in the test. For task_contract no test is added to
      tests/integration/test_task_contract_repo.py (its naming pin :45 and check :132-140): its existing test at :116-131 (TASK_070_ADDED, docs
      only) is the real-repository check and is kept unchanged. Where the existing test modules carry naming pins that allow only the owning task's
      criteria in a test docstring (tests/unit/test_task_contract.py :27, test_claude_code_shell_allow.py :360-361, test_claude_code_pretool_hook.py
      :1159-1160, tests/integration/test_task_contract_repo.py :45, tests/property/test_task_contract_properties.py :21), a TASK-107 test is not
      added there; any change left in such a file cites the owning task's ACn as an amendment, and the property file is not touched. The
      exempted assertions include test_claude_code_shell_allow.py :114 and :121-123 (AC4) and the widened assertions at
      tests/unit/test_resume_inputs.py :527-:535 (AC5). No test makes a temporary repository and none reads the working tree
      of the real repository beyond what the existing tests read (aieos-checks.yml deterministic rule). An added test fails on a stated broken copy
      where the item says "pin".
  - AC7: >-
      Parity and purity (INV-001, INV-002, INV-004). tests/conformance/, the native ports, the CI files, writer.py, gitread.py, base_files.py,
      launcher.py, resume_inputs.py, resume_log_inputs.py, mcp_server.py and the hook's program are unchanged; no new process form, no import beyond the
      standard library already used and contract_path; the substring of the state directory's name appears in no changed src file except
      claude_code_shell_allow.py's existing POLICY_DIR; the deterministic rule, OPS-003, SEC-001, SEC-002 and bandit steps report no finding at the
      task commits.
  - AC8: >-
      The stated limits. The docstrings of contract_path.py, base_inputs.py, task_contract.py and claude_code_shell_allow.py state the order, the
      both-folders finding, the refusal without fallback, the committed-base-only rule, the call bounds, and that the handoff reader (DEF-0095)
      and DEF-0113 are not done by this task, and the stated choice that a refused docs side with a present state side is a refusal. DEF-0105's Log
      line is written by its own decision after landing.
  - AC9: >-
      The CI evidence. On the aieos-checks and aieos-native runs of the accepted commit every job and step is successful, read by run id; the
      real-repository tests run on the Linux leg; on main after the records commit likewise. Each push and each GitHub job-data read is a
      decision of the decision agent, outside the capabilities above.
  - AC10: >-
      The records (L-0034, L-0037). The task's evidence records' forms are built and checked through records.check_record and a governor shadow over a
      dry records list at the approval request, with their raw output: per-article records, the property records, and the profile entries of risk
      high; the expected result is NEEDS_REVIEW or NEEDS_REWORK at the GOV-003 row as in TASK-102 to TASK-106, stated in the acceptance as a departure.
