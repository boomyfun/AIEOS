# TASK-107 replaces TASK-105 (decisions D-4035 to D-4037, session 96aec1d9, 2026-10-31). TASK-105's contract (docs/tasks/TASK-105.yaml,
# committed at c569dd4f, approved in D-4025) was never run: the full run of the unit tests with the change found a fourth pin on
# base_inputs.py's own imports, tests/unit/test_resume_inputs.py :518-:535 (TASK-085 AC7), which the pin scan missed and which was not in
# TASK-105's write set; the G0 scope check reads only the commit that added a contract, so a revision cannot widen a write set, and the task
# restarts under a new id. This contract is TASK-105's v2 draft (the 14 paths plus tests/unit/test_resume_inputs.py) with the new id and the
# base_commit c569dd4f; the criteria are otherwise TASK-105's. Nothing here is a statement of what ran under TASK-105: nothing did.
# Task contract TASK-107 (its text is TASK-105's contract, drafted r0 to r3 in session 96aec1d9 and approved as v1 in D-4025, with the
# changes named above; the haiku review of TASK-105's draft r1p did not count, because the reviewer used the Bash tool (read-only) against the
# save script's tool assertion, and its findings were used as data under D-4022; this contract's check is the decision agent's own read): the shared
# resolution of a task contract's path (DEF-0105 link 1, docs/Deferred/DEF-0105-the-zero-friction-paths-open-links.md). Scope ruled in
# decisions D-4002, D-4015 and D-4016 (design option (a) of D-4015: a new module that the three readers use; M1 to M8 of D-4016). The text it
# builds is specification 7 revision 6 (approved by D-4004 and D-4005; DM row F78; on main at 0341cf8b, sha256
# 97026c84ba96e198bfa33a87f924487845bf0649335a72abd5e053f9b706c852), section 6 (the state directory of the readers), section 7 (only a
# committed file at the base counts; the core does not commit) and section 10 item 17.
# Fields and value forms follow specification 2 section 5.1 and TASK-106's contract (docs/tasks/TASK-106.yaml).
# Not in this task: the handoff reader and the write after a submission (DEF-0095), the rule that a contract's write set does not list the
# state directory (proposed, read by no check), DEF-0113, DEF-0101's untouched-root check, any change to cli.py, launcher.py, writer.py,
# gitread.py, base_files.py, the program of the hook, settings or the CI workflows.
# Risk: high. R3 reads src/** and tests/** fail closed as high (risk-rules section 2 point 3); no critical rule matches the write set (no
# docs/specs/**, no .github/**). Confirmed by script over the base in the approval request (TASK-106's form). Change class: critical_cr,
# because the CI's EVALUATOR list holds src/aieos_bootstrap/** and the tests folders; confirmed by script in the approval request.
# Evidence profile (assurance-model.md section 5, gov-AIEOS, high): unit_test, integration_test, property_test, deterministic_rule,
# static_security_analysis, ai_review (cross-model), plus the evidence_required of the applicable articles, recorded per article from the
# start (L-0034) through records.check_record and the governor shadow in the approval request. GOV-003 is recorded as it falls (DEF-0107's
# policy): no "holds" is claimed for the tests part; acceptance is a stated per-task departure from the advisory governor in the form of
# TASK-102 to TASK-106; compensating controls: the local run of the base's tests against the change's src and a review of the test diff by
# a reviewer whose model differs from every model that did task work (L-0038), listed by machine.
# Models: the main session writes the code and the tests; helpers read only; each brief goes to the decision agent first.
# Pin scan (first step of the work, reads only, written in the map of commit X): the scan of D-4016 (the three import pins, the call-count pins,
# the finding-text pins, the docstring pins) is re-run at the base, and extended to claude_code_pretool_hook.py and
# tests/unit/test_claude_code_pretool_hook.py; a pin by hash or in CI on the hook, or any pin not in the list below, stops the work and comes
# to the decision agent.
# Stated limits: (1) a contract in both folders refuses the task until an approved act removes one; (2) only the committed base is read;
# (3) a state entry that is present but not a plain tree or blob is a refusal, never a fallback; (4) no speed measurement in this task; call
# counts are bounded by stand-in tests; (5) the hook is unchanged as a program: only its docstring and the modules it calls change; hook
# placement and settings stay the owner's.
