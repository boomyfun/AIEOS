  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1500k, wall_time: 8h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7]}
  - {gate: G3, check: constitution, args: [AC8, AC9, AC10, INV-001, INV-002, INV-003, INV-004, INV-009, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts AND the aieos-checks and aieos-native runs of the accepted commit succeed
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
# owner_kept_act: false: the task's acts are edits to source and test files in the write set; it never launches a runtime on E:/AIEOS or any
# real project (the tests use stand-ins and read-only reads of this repository); A51 item (4) keeps launching with a runtime with the owner.
owner_kept_act: false
