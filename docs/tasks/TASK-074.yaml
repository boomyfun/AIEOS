acceptance_criteria:
  - AC1: >-
      No behaviour change. For claude_code_pretool_hook.py, an acceptance-time script parses the base's and the head's
      source, removes the docstring node of the module and of every function and class, and finds ast.dump of the two
      trees equal (every statement, expression, constant, import and definition unchanged); it then lists every changed
      docstring and refuses any other than the module docstring, and within it any changed sentence not named in AC2 and
      AC3. Every existing test of the module passes with only the changes named in AC5 and AC7.
  - AC2: >-
      N3 and N4 stated (DEF-0092 :12-13), in the module docstring's step 5: (a) at :51-52 "The input bytes are hashed for
      any bytes object, a subclass included; an input that is not bytes is hashed as no bytes, and the entry then refuses
      it without a record." becomes "The input bytes are hashed for any bytes object, a subclass included; an input that
      is not bytes is hashed as no bytes: on the judged path (steps 4 and 5) the entry then refuses it without a record,
      while on the bad-base and contract paths of steps 2 and 3 its record goes to step 5 (the form check, redaction, then
      the core path) with the empty-bytes hash in its ids (main passes bytes only, so main reaches neither)."; (b) a
      sentence added after it: "The tool_use_id and the hash are read from bytes() of the input while the entry parses
      the object itself, so a bytes subclass whose __bytes__ gives other bytes gets ids from those other bytes (main
      cannot reach it either)." A new test in tests/unit/test_claude_code_pretool_hook.py (one new class for the phrases of AC2 and
      AC3) pins, whitespace collapsed, the new phrases ("on the judged path (steps 4 and
      5) the entry then refuses it without a record", "its record goes to step 5 (the form check, redaction, then the
      core path) with the empty-bytes hash", "whose __bytes__ gives other bytes") and that "is hashed as no bytes, and
      the entry then refuses it without a record" is absent; two new tests pin the code as it is, with the module's
      Calls stand-ins: (i) stdin '{}' (a str) with AIEOS_BASE absent gives reason "base", the core called once, its
      event id SID + '/pretool-contract/sha256-' + the SHA-256 of b''; the same stdin with an unreadable contract gives
      reason "contract" and the same event id; (ii) on the judged path (a readable contract), with a stand-in entry that
      records its first argument and answers a refuse with a record that passes record_findings (as :434-435 do), a
      bytes subclass (a made-up class) whose own bytes hold no tool_use_id and whose __bytes__ returns other bytes
      holding no tool_use_id gives the event id SID + '/pretool/sha256-' + the SHA-256 of those other bytes, while the
      entry's stand-in got the object itself.
  - AC3: >-
