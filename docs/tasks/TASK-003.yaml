# Task contract TASK-003, the conformance runner of gov-AIEOS (Master Plan revision 2, §4 M2; the M2 work plan of
# decision D-195, P4 and P5; specification 2 §5.1). Revision 0, drafted under decision D-208 (C4, C5), brought for
# approval in D-209 as a template; whether it is approved is recorded in the decision files, not in this file. Fields
# and value forms follow specification 2 §5.1 and the contracts of TASK-001 and TASK-002. Readings marked "(reading)"
# are the worker's, for the decision agent's ruling.
# Task type: implementation. Constitution GOV-002 applies: tests/conformance/** (the fixtures and the set file, scenario
# files in the sense of conformance-files.md section 8) is in the forbidden set, so the task can read them but never
# change them.
# Risk: high. R2 matches src/** and tests/** (medium); R3 read fail closed matches them too, the runner falling under
# its tag verification (risk rules section 2 point 3: R3 cannot be evaluated until an architecture entity exists); the
# highest wins. Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture
# [deterministic_rule], functional [integration_test], security [static_security_analysis] and architecture [ai_review
# (cross-model)], plus the evidence_required of the applicable articles. Dimensions are named as TASK-001's records name
# them (decision D-181, reading R-dim).
# Change class: critical_cr (D-195 P4): an evaluator part that enforces acceptance and is not bound (DM B1; A29: the
# evaluator includes the runner), so it is judged by the base version and never auto-accepted (constitution GOV-003;
# governor-spec.md §8). critical_cr adds no profile entry; it adds that rule.
# Reviews (as TASK-001's, D-181 P2, P3): five way-2 reviews by a Claude model other than the implementer's, each under a
# decision of the decision agent (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002;
# governance ai_review for GOV-003; operational ai_review for OPS-003; the cross-model half), and three
# decision-agent reviews (architecture human_review for INV-003, which also checks that the property tests cover the
# related invariants; operational human_review for OPS-002; the cross-model half). Each way-2 review record's basis
# names every article whose entry it covers and addresses each of their rules, beyond what the tool parts decide.
# Evaluation path (A61; as TASK-002's, D-181 P1 and D-182): the approved contract is committed on main as its own commit
# C, which changes only docs/tasks/TASK-003.yaml and has one parent equal to base_commit, and is pushed normally; the
# files are drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's
# commits, each carrying the trailer "AIEOS-Task: TASK-003" and no e-mail address in its message, go to the branch
# task/TASK-003 on GitHub, each push under its own decision of the decision agent after a secret scan, never by force
# and never deleting; the CI channel runs on each push and its records are re-fetched into docs/records/TASK-003.jsonl;
# main receives the task only at its acceptance, by a fast-forward under its own decision. Before each task commit, the
# added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns (AC10).
# Not applicable: OPS-001 (scope: the repository's refs; the task changes no ref); INV-009, INV-011, GOV-001, GOV-004,
# GOV-005, GOV-006 and SEC-003 (their scopes, the event log, the policy, the concept file, the bound artifacts, the
# decision matrix, the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Uncovered (governor-spec.md §6.2) and stated limits (AC11): no governor exists, so a run over the frozen set gives 32
# NOT_RUN and outcome fail, and nothing here shows that any governor meets a fixture; the runner and the governor are
# "taken from the base" only when the CI channel checks out the base and runs the runner from it, which is the CI
# workflow's next revision (the owner's, A61; D-195 P6, O1), not this task; until then GOV-003's pinned list in the CI
# channel covers the runner and the governor (src/aieos_bootstrap/**) but not tests/conformance/**, so a change to the fixtures or the set file is not reported there as an evaluator
# change and is caught only by each task's write-set and forbidden set (G0); how a run's results are read without a
# run-record file in the repository and with step output behind sign-in (DEF-0024; D-196 C5) is left to that revision
# (AC9); the fixtures give the inputs of governor-spec.md §3.2 as values (conformance-files.md section 1); every review
# is by AI of one vendor.
task: TASK-003
contract_version: v1
task_type: implementation
objective: >-
  Add the conformance runner of docs/specs/conformance-files.md revision 2 section 6, a standard-library Python 3
  module of the bootstrap source tree: it reads the frozen set file, its freeze approval, the fixtures and the bound
  scenario file from the tree it is given (the base), calls the governor's entry point for each case when one exists,
  compares the observed decision records with the expected values, and returns the run record and its record of
  specification 2 §6.2, with unit, integration and property tests. It writes nothing, adds no governor, changes no
  fixture or set file, and does not wire the CI channel.
