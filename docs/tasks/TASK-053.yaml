acceptance_criteria:
  - AC1: >-
      The selection (decision D-1012). evaluation.evaluate_task gives the governor, as the records read from the log,
      the payloads of the events whose type is record.added or violation.detected and whose task_id is the task's, in
      log order, over the whole log (the events check_log reads with duplicate_of None, as at the base); then
      extra_records, as at the base. Every other step, argument check, refusal, result key and the event id's form are
      unchanged (TASK-027 AC1 to AC11).
  - AC2: >-
      The decision. When a kept payload is a violation.detected of the task (fact_kind observation, outcome blocking,
      blocking_kind violation), the governor's record has decision REJECT and next_task_state REJECTED (row 1,
      governor.py unchanged), the decision.acceptance is appended once as at the base, and the event id
      (evaluation.event_id_of) covers the violation's record_id among the kept record ids, so a rerun gives
      "duplicate".
  - AC3: >-
      What is not read or is left out. A violation.detected of another task (its task_id and subject another task id)
      is not given to the governor; a violation.detected whose record_id an earlier kept record has is left out with
      the finding _kept gives at the base; extra_records are read as at the base.
  - AC4: >-
      The span (M1 of decision D-1012). A violation.detected of the task anywhere in the log, also before a later
      task.approved and a later task.submitted, gives REJECT at every later evaluation of the task; a test shows a
      violation, then a new task.approved and a new submission, still giving REJECT.
  - AC5: >-
      Unchanged behaviour. A log with no violation.detected of the task gives the same result, decision and event id
      as at the base: tests/unit/test_evaluation.py, tests/integration/test_evaluation_repo.py and
      tests/property/test_evaluation_properties.py pass unchanged, and a property test compares the new selection with
      the base's expression over generated logs with no violation.detected.
  - AC6: >-
      The texts (OPS-003). evaluation.py's docstring states the new selection (its item 7) and the span's consequence
      (AC4) as a limit. violation.py's docstring no longer states that a STOP: violation does not make acceptance reject
      or the bar on callers (task TASK-052 AC8, decision D-1000 E4), states that it does (task TASK-053), and marks its
      quotation of specification 3 line 106 "(abridged, not verbatim)"; adapter.py's and replay.py's docstrings drop the
      same limit and bar. The code of violation.py, adapter.py and replay.py does not change: each module's text
      after the line that closes its module docstring is byte-equal to the base's. The word tests that read those
      docstrings (test_violation.py R8, test_replay.py R9Purity, test_adapter.py R9Purity) require the new words in
      place of the old and keep every other requirement; none is weakened (GOV-003), and each change is listed with
      its reason in the first task commit's request.
  - AC7: >-
      Limits, stated in evaluation.py's and violation.py's docstrings and carried at acceptance: the whole-log span
      (AC4); no task.* event follows STOP: violation, so until an evaluation runs the task stays READY with no lease
      and the next Resume Check may CONTINUE again; no bound on repeated STOP: violation (specification 5 §11 point 12);
      a fence refusal's record labelled refused_submission; F-a kept; a passing replay shows no hook observing
      anything (C6 unmeasured); no conformance set or fixture changed (ADV-02's fixture is a later task); no observed
      read-set call; a run against the real writer's files not tested. Every existing module other than the write-set
      is unchanged, and if one can pass only by a change the task escalates (needs_out_of_scope_change).
  - AC8: >-
      Purity and the CI checks (INV-001 to INV-004). evaluation.py's imports are unchanged (test_evaluation.py's
      import test passes unchanged); no module starts a process except as at the base, opens a file, reads a clock or
      the environment, builds an event-log line itself, or makes a network or model call; no exec, eval, compile,
      __import__ or importlib; no assert in src (bandit B101); no string that names the project-state directory. At
      the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC9: >-
      Its own tests and the added text. Every test function of tests/unit/test_evaluation_violation.py names the AC
      ids it stands for as "TASK-053 ACn" in its own docstring; a changed test names "TASK-053 ACn" beside its earlier
      ids; no other task's AC is named in qualified form in the new module. No earlier test is removed or weakened
      (GOV-003). Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and for constant values beside password- or token-like names (decision D-1003 amendment 1), each count
      0; the file names are scanned with the same patterns and the records executors' pre-push pattern (D-282). The
      tests write and remove no file.
  - AC10: >-
      Tests, each rule with at least one passing and one failing case, with stand-ins for the writer's and Git's
      functions bound to the real signatures (inspect.signature(...).bind): R1 AC1 (the selection's types, task_id
      and order; extra_records after the log's); R2 AC2 (REJECT, REJECTED, row 1 with a violation; the event id with
      its record_id; a rerun "duplicate"); R3 AC3 (another task's violation not read; a repeated record_id left out
      with its finding); R4 AC4 (a violation before a new task.approved and submission still gives REJECT); R5 AC5
      (no violation: the base's decision and event id; the property test over generated logs, standard library only,
      fixed seeds); R6 AC6 (for each of violation.py, adapter.py and replay.py, the SHA-256 of its text after the
      line that closes its module docstring equals a value recorded in the test module, computed from the base's
      file (reading: the tests read no Git history, and a text hash does not depend on the Python version); the
      docstrings' new words present and the old words absent); R7 AC7 and AC8 (a script check of evaluation.py's
      docstring words and of the imports); and an end-to-end test whose in-memory log, built with the real
      eventlog.append, holds in this order: the task's task.approved; a first lease granted to the task;
      violation.record with that lease's token (violation.detected, the decision STOP: violation and the release); a
      second lease granted to the task; a task.submitted of the task's commit with the second lease's token; then
      evaluate_task over that log, the task being in VERIFYING after its task.submitted (evaluation.py:176-178), with
      stand-in reads of the task's commit and the real governor,
      giving REJECT at row 1 with the violation's record_id among the kept record ids (decision D-1013 E3).
      tests/run_tests.py, unchanged, runs them.
