# Task contract TASK-053, a STOP: violation makes acceptance reject (Master Plan revision 4, §4 M5; specification 3
# revision 4, section 8 line 106 and section 10 line 154; specification 5 revision 3, sections 8 and 11 point 12;
# governor-spec.md section 4; the scenario ADV-02, conformance-scenarios-initial.md line 64).
# Revision 0, drafted under decision D-1012 (C2), from the scope note approved there with its changes M1 to M3; brought
# for approval in its own request; whether it is approved is recorded in the decision files, not in this file. Fields
# and value forms follow specification 2 §5.1 and the contract of TASK-052. Readings marked "(reading)" are the
# worker's, for the decision agent's ruling.
# Revision 1, under decision D-1013: E1 to E3.
# Task type: implementation. What it changes: src/aieos_bootstrap/evaluation.py passes the governor, beside the task's
# record.added payloads, the task's violation.detected payloads (specification 3 line 106: "the change is rejected at
# acceptance"). One expression changes, evaluation.py line 179 at the base:
# `payloads = [e['payload'] for e in events if e['type'] == 'record.added' and e.get('task_id') == task_id]` selects
# the events of type record.added or violation.detected, in log order, with the same task_id test and the same span.
# The governor is not changed: governor._sort_records (governor.py:338-343) puts any record of the task with outcome
# 'blocking' among the blocking ones with its blocking_kind, ROW_1_KINDS (governor.py:44) holds 'violation', and row 1
# (governor.py:457, 463-464) gives REJECT and next state REJECTED; a violation.detected payload passes
# records.check_record, since check_payload('violation.detected') is check_record and three key checks
# (records.py:546-551), so evaluation's _kept (evaluation.py:250-263) keeps it.
# The span (reading (a) of decision D-1012): the whole log, as for record.added (evaluation.py:155, 179): a
# violation.detected of the task makes every later evaluation of that task REJECT, also after a later task.approved and
# a new submission (M1 of decision D-1012), as a blocking record.added already does (governor-spec.md section 4 rule
# 4). A narrower span (only after the last task.approved) was rejected: a violation could be laundered by re-approving
# the contract.
# A session fenced out leaves no violation.detected: the writer's fence refuses the append (eventlog.py:112-114,
# 125-144, 210-217) and only its refusal record.added (eventlog.refusal_record, evidence_type refused_submission,
# outcome fail) is in the log, read as before.
# The texts that state the old limit become false and change (OPS-003): violation.py's first limit and its bar on
# callers (task TASK-052 AC8 and decision D-1000 E4), adapter.py's and replay.py's sentences on the same limit and bar,
# and evaluation.py's docstring item 7; violation.py's quotation of specification 3 line 106 is marked "(abridged, not
# verbatim)" (DEF-0067, D11 of decision D-1009). The word tests that require the old words change to require the new
# words, keeping every other requirement (GOV-003): test_violation.py's R8 docstring test, test_replay.py's R9Purity and
# test_adapter.py's R9Purity. The code of violation.py, adapter.py and replay.py does not change: only their module
# docstrings (AC6, tested by the SHA-256 of each module's text after its docstring).
# Check before the contract (M2 of decision D-1012): no test of the forbidden test_evaluation.py,
# test_evaluation_repo.py or test_evaluation_properties.py requires a phrase of evaluation.py's docstring (their only
# read of the module's text is test_evaluation.py's import and attribute test and its ".aieos" test, lines 593-617).
# Limits (carried at acceptance): no task.* event follows STOP: violation (specification 3 line 154), so until an
# evaluation runs the task stays READY with no lease and the next Resume Check may CONTINUE again; no bound on repeated
# STOP: violation (specification 5 §11 point 12); a fence refusal's record is labelled refused_submission; F-a (decision
# D-988) kept; a passing replay with a violation shows the core's handling of a recorded violation, never that any hook
# observes anything (C6 unmeasured); the conformance runs read governor.evaluate with fixture records and do not read
# evaluation.py, so no conformance set or fixture changes (ADV-02's fixture is a later task with its own freeze); no
# observed read-set call; a run against the real writer's files not tested.
# Readers of the changed paths (D-263 C3's practice): tests/unit/test_evaluation.py, tests/integration/
# test_evaluation_repo.py and tests/property/test_evaluation_properties.py read evaluation.py and keep passing unchanged
# (forbidden here); src/aieos_bootstrap/verification_records.py names evaluation.evaluate_task in its docstring only;
# tests/unit/test_writer.py's R8 test and tests/unit/test_gitread.py's subprocess test read every module of src/ and
# keep passing.
# Risk: high (risk rules revision 6, policy v4, §2 point 3: R3 matches every path under src/** and tests/**), computed
# over the base by script (risk_class53.py: every path R2 medium and R3 high). Change class critical_cr, computed by
# script and read as for TASK-027 (gov003_class53.py: "GOV-003 evaluator change: yes (8 of 8 paths)"; the evaluation
# path's decision inputs change); decided by decision D-1012; the approval form is ruled at acceptance (decision D-492's
# precedent). TASK-052's header read "normal" for evaluator paths, a stated inconsistency in precedent (M3 of decision
# D-1012), not reopened. Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture
# [deterministic_rule], functional [integration_test], security [static_security_analysis] and architecture
# [ai_review (cross-model)], plus the evidence_required of the applicable articles. Reviews as TASK-052's: five way-2
# reviews on a model other than the implementer's and the main session's, and the decision agent's own review for the
# cross-model entry.
# Naming (D-544 Q3): every test of the new test module names the AC ids it stands for as "TASK-053 ACn" in its own
# docstring; a changed test names "TASK-053 ACn" beside its earlier ids.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-053.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-053", go to task/TASK-053 under their own decisions; main receives
# the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (the governor, its
# decision contracts and the policy are not changed); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the
# bound artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the
# write-set). INV-004 applies: the modules write only through the writer's functions. INV-009 applies through the
# writer, which this task does not change.
# Owner-kept acts: none. No hook, no Claude Code setting, nothing under .github/, no push of its own; it weakens no
# evidence requirement; the approval form is ruled at acceptance (Master Plan section 6).
