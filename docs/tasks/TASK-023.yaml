acceptance_criteria:
  - AC1: >-
      The input. stale(inputs) takes a mapping with exactly the keys task_id, accepted_commit, trigger_commit, records,
      intent_current, read_set, read_set_estimate, base_commits and earlier_events: task_id a string "TASK-" followed by
      three digits; accepted_commit and trigger_commit each 40 or 64 lowercase hex characters; records a list of
      mappings, each with a non-empty string record_id (unique in the list), a commit, when present, in the same hex
      form, and intent_versions, when present, a mapping from a non-empty string to "v" followed by digits (the record
      form of specification 2 section 6.2), other keys ignored; intent_current a mapping in that same form; read_set a
      list of mappings {entry, kind, patterns} with entry a non-empty string, kind "path", "interface" or "schema", and
      patterns a list of non-empty strings or None (None: the caller could not resolve the entry); read_set_estimate a
      bool; base_commits a list, in base order, of mappings {commit, paths, submitted_by_task} with commit in the hex
      form (no commit twice, none equal to accepted_commit), paths a list of strings and submitted_by_task a bool;
      earlier_events a list of mappings {reason, records} with reason "commit" or "intent_version" and records a list
      of strings. Any other form gives the result of AC8 with error naming the first key that fails, in the order
      above, and no stale id and no event (fail closed).
  - AC2: >-
      Rule 2 (spec 4 line 40): a record with intent_versions is stale with reason intent_version when, for some id it
      names, intent_current has that id with a different version. An id it names that intent_current lacks gives an
      uncovered entry {rule "rule 2", ref the record_id, detail naming the id} and does not by itself make the record
      stale (reading).
  - AC3: >-
      Rule 3 (spec 4 line 41) and the decision agent's reading of D-544 Q2 point 1. A base commit meets the read-set
      when submitted_by_task is false and one of its paths matches an entry: a path entry when
      aieos_bootstrap.resume_check.matches(entry, path) is true; an interface or schema entry when matches(pattern,
      path) is true for one of its patterns. An entry whose patterns is None gives one uncovered entry {rule "rule 3",
      ref the entry, detail "not resolved by the caller"} and meets nothing; read_set_estimate true gives one uncovered
      entry {rule "rule 3", ref "read_set", detail naming the estimate}. Path matching is resume_check's own (called,
      not copied), so it follows specification 3 section 3.
  - AC4: >-
      The order of commits (the decision agent's reading of D-544 Q2 point 2, with its addition). The position of
      accepted_commit is before every base commit, and a base commit's position is its index in base_commits. A record
      with a commit is stale with reason commit when some base commit that meets the read-set has a later position than
      the record's commit. A record whose commit is neither accepted_commit nor in base_commits is treated as earlier
      than every base commit (fail closed), and is also named in an uncovered entry {rule "rule 3", ref the record_id,
      detail "commit order not known"}.
  - AC5: >-
      Records that cannot be checked (the decision agent's reading of D-544 Q2 point 3). A record with no
      intent_versions gives an uncovered entry {rule "rule 2", ref the record_id, detail "no intent_versions"}; a record
      with no commit gives an uncovered entry {rule "rule 3", ref the record_id, detail "no commit"}. Such a record is
      never stale by that rule and never reported as passed.
  - AC6: >-
      The events (spec 4 section 7 item 3 and the decision agent's reading of D-544 Q2 point 4). For each reason, in
      the order commit then intent_version, the new ids are the stale ids of that reason that no earlier_events entry of
      the same reason lists, sorted. When they are not empty, the result holds one event {event_id, event_type
      "evidence.stale", task_id, payload {records: the new ids, reason}}, whose event_id is the SHA-256 hex digest of
      the UTF-8 text "evidence.stale", task_id, trigger_commit and the reason joined by LF (as the writer's _digest
      joins its parts), and aieos_bootstrap.records.check_payload("evidence.stale", payload) finds nothing. When they
      are empty, no event of that reason. The same inputs always give the same event ids.
  - AC7: >-
      What it does not decide. The module runs neither rule 1 nor any governor rule, changes no task state, blocks
      nothing and appends nothing (spec 4 line 41: a re-verify is scheduled and a DONE task stays DONE, by the event's
      effect in specification 1, not by this module); its docstring says so, names the caller as DEF-0030's, and states
      that whether the governor uses rule 3 is DEF-0042 point 10. No module of src/ changes except __init__.py's
      docstring and __all__.
  - AC8: >-
      The result. stale returns a mapping with exactly the keys stale, events, uncovered and error: stale maps
      "commit" and "intent_version" each to the sorted list of the stale record ids of that reason (all of them, not
      only the new ones); events is the list of AC6; uncovered is a list of mappings with exactly the keys rule, ref and
      detail, sorted by (rule, ref, detail), without duplicates; error is None, or for a malformed input a short English
      text, with stale {"commit": [], "intent_version": []}, events [] and uncovered []. stale is a pure function: the
      same input gives the same output, and the input is not changed.
  - AC9: >-
      Purity and the CI checks (INV-001, INV-002, INV-003). The module imports only the Python 3 standard library
      (hashlib and re among the allowed) and aieos_bootstrap.records and aieos_bootstrap.resume_check; it opens, writes
      and removes no file, reads no clock and no environment, and makes no process, network or model call; no exec,
      eval, compile, __import__ or importlib; no assert in src (bandit B101); no string that names the project-state
      directory. At the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002
      and bandit.
  - AC10: >-
      Main's records, read only (decision D-544 C1). tests/integration/test_stale_records.py reads
      docs/records/TASK-022.jsonl and docs/tasks/TASK-022.yaml with pathlib's read_bytes only, takes the contract's
      read_set paths, interfaces and schemas with its own line-based reader (path entries with their own text as the
      pattern; interface and schema entries with patterns None), and runs stale with task_id TASK-022, accepted_commit
      4ef7dfa91df7eed00e7c3d5180d3aac12e94f768, read_set_estimate true, intent_current {}, earlier_events [], and, as
      fixed inputs in the test, the two base commits after it on main with their changed paths against their first
      parent: 92da3802e54722b9232507ceac402052916e6bd7 (docs/records/TASK-022.jsonl) and
      a4c2255be6e29b5e020018b6f32943787129aa50 (its six paths, DEF-0042's among them), both submitted_by_task false,
      trigger_commit a4c2255b…. It asserts (reading; values to be confirmed against a scratch prescan before the code is
      pushed, and a difference goes to the decision agent): stale commit holds all 25 record ids (24 bound to
      4ef7dfa9…, one bound to e71f7bb3…, the contract commit, named "commit order not known"); stale intent_version is
      empty; one event, reason commit, with the 25 ids and the event id of AC6; the uncovered list has 32 entries (25 "no
      intent_versions", one "commit order not known", five unresolved interface and schema entries, one estimate).
      These are data about an accepted task: they reopen no acceptance and schedule nothing (no caller exists).
  - AC11: >-
      Limits, stated: the facts are the caller's and are not checked against Git or the log; interface and schema
      entries are only as good as the caller's resolution; the derived and observed read-sets are the caller's;
      appending the events, the writer and the caller are DEF-0030's; rule 1 is the governor's. Every existing module
      and test not in the write set is unchanged, and if one can pass only by a change the task escalates
      (needs_out_of_scope_change).
  - AC12: >-
      Its own tests and the added text. Every test function of the three new test modules names the AC ids it stands
      for as "TASK-023 ACn" in its own docstring and names no other task's AC in qualified form there (D-544 Q3). Before
      each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count
      is 0; the file names are scanned with the same patterns and the records executors' pre-push pattern (D-282).
  - AC13: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 (each malformed form, the first one
      named; no event on error); R2 AC2 (a differing version is stale; an equal one is not; a missing current id is
      uncovered only); R3 AC3 (a path entry met; an interface or schema pattern met; a submitted commit ignored; an
      unresolved entry uncovered; the estimate flag); R4 AC4 (a meeting commit later than the record's is stale, an
      earlier one is not; the accepted commit before all; an unknown record commit stale and uncovered); R5 AC5 (no
      intent_versions, no commit); R6 AC6 (dedup against earlier events of the same reason only; no event when nothing
      is new; the event id's value; check_payload finds nothing); R7 AC8 (the keys, the sorting, no duplicates, purity:
      the input unchanged, a second call equal); R8 AC7 and AC9 (a script check of the module's imports and of the
      absence of open, write and clock calls). Unit tests in tests/unit/test_stale.py; AC10 in
      tests/integration/test_stale_records.py; property tests in tests/property/test_stale_properties.py (standard
      library only, fixed seeds): for random well-formed inputs, every record id is in at most the stale lists and the
      uncovered refs it should be in and an event's ids are a subset of its reason's stale ids; a second run with the
      first run's events as earlier_events gives no event; the result never depends on the order of records or of
      read_set. tests/run_tests.py, unchanged, runs all groups.
