# Task contract TASK-023, the stale-evidence computation (Master Plan revision 3, §4 M4; specification 4 revision 3,
# section 3 rules 2 and 3 and section 7 item 3; concept lines 728 and 746). Revision 0, drafted under decision D-544
# (Q2, Q3, C1 to C3), brought for approval in its own request; whether it is approved is recorded in the decision
# files, not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-022.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling; the four readings of AC3 to AC6 are the
# decision agent's (D-544 Q2, points 1 to 4), marked proposed, not the specification's own words.
# Task type: implementation. What it adds: one pure module, src/aieos_bootstrap/stale.py. Its function stale takes, as
# values, one task's facts for reconciliation (its accepted commit, its records, the current intent versions at the
# base's head, its effective read-set with each entry resolved by the caller, the base commits after the accepted commit
# with their changed paths, the triggering base commit and the task's earlier evidence.stale events) and returns the
# stale record ids by specification 4 section 3 rule 2 (reason intent_version) and rule 3 (reason commit), at most one
# evidence.stale event per reason with only the ids no earlier event of the same reason listed, each with an event id
# derived from the task, the triggering commit and the reason, and the list of what it could not check (uncovered). It
# reads no Git, no file and no log, and appends nothing: reading the facts and appending the events through the core's
# single writer (TASK-016) are the caller's, the item carried in DEF-0030 (specification 4 section 7 item 4), which this
# task does not build.
# The specification's text (spec 4 lines 40-42): rule 2: "a record whose `intent_versions` differ from the current
# version of each intent artefact the record concerns, read at the base's head, is stale"; rule 3: "reconciliation
# only: when a later commit on the base changes a path in the task's effective read-set (specification 3 §4), leaving
# out the commits that the task's own `task.submitted` events name, as check 1 does [...], every record of the task
# bound to an earlier commit is reported stale. [...] it schedules a re-verify and blocks nothing, and a DONE task stays
# DONE [...]. Where the read-set is an estimate, the rule inherits its flags, and a check it could not complete is
# listed as uncovered, never as passed." Line 42: "its result is a list of stale record ids, each with its `reason`
# [...]: `commit` for rules 1 and 3, `intent_version` for rule 2". Section 7 item 3 (line 82): "section 3's rules 2 and
# 3, run at the same point (rule 1 applies at an evaluation only); each base commit gives at most one `evidence.stale`
# event per task and reason, with the list of the stale record ids that no earlier `evidence.stale` event of the same
# task and reason has listed [...], idempotent by an event id derived from the task, the commit and the reason
# (proposed, as the writer derives refusal ids)."
# What it does not do: rule 1 (the governor's rule 2, TASK-004) is not run; the governor's counting is unchanged
# (spec 4 line 42; whether the governor should also use rule 3 is DEF-0042 point 10, not settled here). No Git read,
# no file read, no derived read-set computation (specification 3 §4; the caller's, as for resume_check), no
# resolution of interfaces and schemas to paths (the caller's), no writer call, no caller in the core, nothing under
# .github/, no policy, no frozen fixture. It changes no governor, writer, records, resume_check, conformance, ac_coverage
# or ac_tests code.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain stale; it must not name the Resume Check
# fixture folder (TASK-010's assertion) nor the Risk Engine fixture folder (TASK-020's allow list). No module of the
# repository calls stale yet.
# Risk: high, and change class critical_cr, each to be computed over the base by script, as for TASK-022. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles.
# Reviews (as TASK-022's): five way-2 reviews by a Claude model other than the implementer's, and the decision agent's
# three, each brief naming for testing: rules 2 and 3 and only them; the four readings of AC3 to AC6; the dedup and the
# event id; the uncovered list (never stale, never passed); purity (no file, no clock, no write); AC11's limits.
# Naming (D-544 Q3): every test of the three new test modules names the AC ids it stands for as "TASK-023 ACn" in its
# own docstring, following DEF-0049's convention, adopted for this contract only; whether it applies generally stays
# open in DEF-0049.
# Evaluation path (A61; as TASK-007 to TASK-022): commit C changes only docs/tasks/TASK-023.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-023", go to task/TASK-023 under their own
# decisions; main receives the task only at its acceptance. The task push's CI base run is a RISK-01 conformance run
# over the set file of DM F35, reported advisory, never MEASURED.
# Not applicable: OPS-001 (the task changes no ref); INV-004 and INV-009 (the module writes no file and no log; the
# events are returned, not appended); INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the governor,
# evidence records as stored, the replay and the policy meet no path of the write-set: the module returns events and
# stores none); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the bound artifacts, the decision matrix,
# the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (it reports stale evidence and blocks
# nothing; CR-002 part 4 limit 8 does not apply), so its acceptance is one delegated approval of the decision agent
# (Master Plan section 6), for the decision agent's ruling.
# Uncovered and stated limits (AC11): the facts are the caller's and are not checked against Git or the log; interface
# and schema entries are only as good as the caller's resolution; an estimate read-set is flagged, never trusted as
# complete; the event's appending, its writer and its caller are DEF-0030's.
task: TASK-023
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/stale.py, the stale-evidence computation of specification
  4 section 3 rules 2 and 3 and section 7 item 3: stale(inputs) takes one task's reconciliation facts as values and
  returns the stale record ids by reason (intent_version for rule 2, commit for rule 3), at most one evidence.stale
  event per reason listing only the ids no earlier evidence.stale event of the task and reason listed, with an event id
  derived from the task, the triggering commit and the reason, and the list of what it could not check; a malformed
  input gives an error and no event (fail closed). It reads and writes nothing. With unit, integration and property
  tests in new test modules, each test naming its AC ids as "TASK-023 ACn" in its own docstring; the integration test
  runs stale over TASK-022's records on main with the later base commits as fixed inputs and asserts the result as data.
