acceptance_criteria:
  - AC1: >-
      Link 2. launcher.import_task accepts an absolute Windows or POSIX root (launcher's _ROOT form, as run_task does, so '/x',
      '//host/share', '..' segments and embedded newlines are accepted exactly as run_task accepts them; _check_root is the backstop);
      its finding for another root reads "argument: root is not an absolute Windows or POSIX path"; the refused samples are tested
      ('relative/root', '', None, 3, 'C:foo' and a backslash-UNC root); every other step of import_task is unchanged; end, launch_outside
      and approval_act keep their Windows-only root and finding text (shown by their unchanged tests). The skipIf of the end-to-end
      import leg in tests/integration/test_writer_files.py (:861) is removed and the docstrings at :786 (TASK-097's limit) and :863
      ("on a Windows root") and at tests/unit/test_cli_import.py :6-7 and :600-601 are corrected, so the leg runs in CI on Linux (the
      aieos-checks job is ubuntu-24.04; the aieos-native and aieos-bench windows jobs do not run the unit or integration tests) and, on
      Windows, in the worker's own local run of the tests (the contract's shell capability), not as an owner act. The POSIX root case
      added to tests/unit/test_cli_import.py uses its own literal '/import-root-104', a string constant that does not start with 'C:/',
      so the pin at :611-613 (which stays as it is, collecting only 'C:/' constants, and does not see the POSIX literal) is neither
      widened nor tripped; the rewritten docstring at :600-601 names both literals. New run tests in tests/unit/test_cli_run.py use that
      file's ROOT.
  - AC2: >-
      Link 3. launcher.run_task refuses, before write_contract and with the new reason "intent", exactly when eventlog.append (through
      writer.append_event), given the same log, would answer "conflict" for the intent's claim event. The check is a dry run of eventlog
      itself, with no copy of its rule: after claim_id is set (launcher.py :1729) and before the kind is chosen (:1730), run_task calls
      eventlog.append(log_bytes, 'record.added', record, claim_event, moment) with the same event type, payload, event id and time as the
      real claim append (no task_id, fencing_token or corrects, which the real claim append leaves None too; lease, recorder and
      record_id, which writer.append_event adds, are read by eventlog only for a fence refusal after the duplicate-or-conflict answer,
      eventlog.py :153-156, :176-184, so they cannot change that answer), where log_bytes is the bytes read at step "log" (read_log's result is kept in a local
      and passed on to _run_log) and claim_event is sha256 of '\n'.join(('run-event', 'record.added', claim_id)) (launcher.py :1737). Only
      an answer that is a refusal with the reason "conflict" refuses the run with "intent"; the rule it reflects is eventlog.py :176-184
      (the first line whose duplicate_of is None and whose event_id is the claim event id; its _same_text, eventlog.py :84-90, is None or
      differs from the new event's). Nothing is written and nothing is appended. The finding names the intent id (the subject of the
      conflicting line, found by the answer's seq in the report's lines; the new intent id is not shown) and the recorder of that line, each
      shown only if it is a str (otherwise named as "not a string"), and states that the subject alone can cause the refusal (_run_intent
      takes the first claim of the record_id by its INT-digits subject, launcher.py :1645-1651). The refused answer carries intent_id and
      claim_id and risk as computed, kind None, path None, contract_hash None, event_ids [] and appends [], and the class findings as
      every refusal does; read_base is called before the refusal. RUN_REASONS gains "intent" between "exists" and "layout" and the pin at
      tests/unit/test_cli_run.py :441-442 is widened by that one name; run_task's docstring step list (launcher.py :1693-1699) gains the
      step. cli.py is unchanged (it reads launcher.RUN_REASONS). The refusal is an explicit stop of the step "intent": the step variable that
      gives the reason of a raise is not changed, so a raise inside _run_intent, _run_contract or the dry run keeps the reason "log" as
      today.
  - AC3: >-
      The unchanged cases. The same intent under the same class and the same who still gives the claim "duplicate" and a new task;
      a claim with the same record_id under another event id keeps today's behaviour (test_cli_run.py :522 stays "done"); a new intent
      still gets the next INT id; the refusals "exists", "layout", "write" and "append" keep their reasons and order; the reason of a raise
      inside _run_intent or _run_contract stays "log"; any other answer of the dry run (a duplicate, an append that would succeed, or
      the reason "log" for a log without a final LF, which _run_log does not check) lets the run go on as today; E2 (write before claim) and
      E4 (who does not enter the record_id) hold; event ids are unchanged.
  - AC4: >-
      Tests. Every existing test function that the task changes keeps its assertions or gets stronger ones, shown by a script that
      compares, per test function, the ordered list of ast.dump of each assert statement and each self.assert* call at the base and at
      the task commit (TASK-102's AC3 form), with exactly two exempted assertions whose value changes, both listed in commit X's map: the
      RUN_REASONS equality at tests/unit/test_cli_run.py :441-442 (it gains 'intent') and the launcher import-set equality at
      tests/unit/test_launcher.py :703-707 (it gains 'aieos_bootstrap.eventlog', and the docstring at :696-699 names eventlog, with no
      TASK-104 id); an added test passes at the task commit and fails on a stated broken copy where the item says "pin"; no test is
      deleted. The AC2 tests assert written(w) == [], no 'append' in w.names() and the reason "intent", and cover the subject-only case
      (a log with line A: the claim's record_id with subject INT-001 under event id 'ev-1', and line B: the same record_id under the claim
      event id with subject INT-002; _run_intent gives INT-001, eventlog conflicts on B, the finding names INT-002), the case of the same
      record_id under another event id (still "done"), a stand-in case whose log bytes carry the claim event id with another payload, and
      a log without a final LF (the run goes on); one real-writer case is added in tests/integration/test_writer_files.py: a real init, a
      run under who A, then the same intent under who B gives "intent", the contract folder is unchanged and the log is byte-equal before
      and after. A test added or changed in a module whose naming test requires a task's criteria in every test docstring
      (tests/unit/test_cli_import.py requires "TASK-097 AC", TASK097AC6Docs :645-652; tests/unit/test_cli_run.py requires "TASK-098 AC",
      TASK098AC6Docs :866-873; tests/unit/test_launcher.py requires "TASK-086 AC", :750-757) names the criteria that naming test requires
      and no TASK-104 id (TASK-102's AC3 form); the link to TASK-104 is in commit X's map; tests/integration/test_writer_files.py has no
      such naming test. New run tests use ROOT, not a new 'C:/' literal. Any new helper in launcher.py is named _run... or _import... so
      the ast pins (test_cli_run.py :623-642, test_cli_import.py :424-444) cover it. A docstring edit in launcher.py keeps every phrase
      that a test pins (test_launcher.py, test_launcher_outside.py, test_launcher_gone.py, test_launcher_end.py, test_cli_launch.py,
      test_cli_init.py, test_cli_approve.py :693-699) and adds none that such a test refuses by assertNotIn; otherwise the point leaves.
  - AC5: >-
      Parity and purity (INV-001, INV-002, INV-004). The frozen fixtures and reference outputs, tests/conformance/ and the native ports
      are unchanged; launcher.py adds exactly one import, `from aieos_bootstrap import eventlog`, and no other import, no exec, eval,
      compile, __import__ or importlib, no process, no connection and no file write at import; eventlog.py is unchanged; the literal
      ".aieos" appears nowhere in launcher.py, comments, docstrings and finding texts included (test_launcher.py :725); the phrases
      'TASK-097', 'TASK-098' and 'not changed' stay (launcher.py :155-174); the deterministic rule, OPS-003, SEC-001, SEC-002 and
      bandit steps report no finding at the task commits.
  - AC6: >-
      The stated limits. launcher's docstrings state the four limits of the header (the race, with the check seeing the bytes read at step
      "log"; the Windows-only roots of end, launch_outside and approval_act; link 1 open under DEF-0105; the second statement of an intent
      not recorded) without the literal ".aieos"; TASK-097's root limit and TASK-098's G2 limit are stated as closed.
  - AC7: >-
      The CI evidence. On the aieos-checks and aieos-native runs of the accepted commit every job and step is successful, read by run
      id; the Linux leg of the import end-to-end test is the real test of the POSIX root through write_contract (a failure there
      stops the task: the task does not widen); on main after the records commit likewise. Pushes and GitHub job-data reads are the
      worker's own decisions outside the capabilities above (push is forbidden there).
  - AC8: >-
      The records (L-0034). The task's evidence records' forms are built and checked through records.check_record and a governor
      shadow over a dry records list at the approval request, with their raw output: per-article records, the property or replay
      records only where the constitution gives an article of the task that evidence, and the profile entries of risk high; the expected
      result is NEEDS_REVIEW or NEEDS_REWORK at the GOV-003 row as in TASK-102/TASK-103, stated in the acceptance as a departure.
