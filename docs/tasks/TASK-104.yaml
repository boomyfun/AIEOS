# Task contract TASK-104 (draft r4 = r3 with D-3877's R1 only, in the scratchpad; not reviewed, not approved, not committed): links 2 and 3 of DEF-0105
# (docs/Deferred/DEF-0105-the-zero-friction-paths-open-links.md): `aieos import` takes a POSIX root as well as a Windows root, and
# `aieos run` refuses, BEFORE it writes the contract, an intent whose claim the later append would answer "conflict", with the new reason "intent".
# Scope ruled in decision D-3867 (options 2a and 3a; the split of DEF-0105: link 1, the reader of `.aieos/tasks/`, waits for its own
# specification decision with DEF-0095's question and then gets TASK-105). Fields and value forms follow specification 2 section 5.1
# and TASK-102's contract. Place in the order (m8-plan section 7): DEF-0105 first, then DEF-0101, then DEF-0095. "Commit X" below is
# the task's map commit, as in TASK-102.yaml :13: the commit whose map lists the scan's hits, the rename map and the exemptions.
# Pin scan (D-3867 C1, reads only, at main 302d50b1): RUN_REASONS is defined at src/aieos_bootstrap/launcher.py :1472 and read by
# src/aieos_bootstrap/cli.py :614 (`_intent_run_in_form`) and pinned exactly at tests/unit/test_cli_run.py :441-442 (the tuple); the
# import root finding text is at launcher.py :1366 (the same text for end :482, launch_outside :848 and approval_act :1080, which
# stay Windows-only) and no test file names it; _WINDOWS_ROOT is at :468, _ROOT at :208; the literal root of import's tests is
# 'C:/import-root-97' (tests/unit/test_cli_import.py :26; its docstring at :600-601 names it, the pin is the assertion at :611-613, which
# collects string constants that start with 'C:/' and are longer than 3 characters, so it is kept as it is and not widened, and it does not
# see a POSIX literal); the end-to-end import leg is skipped off Windows at tests/integration/test_writer_files.py :861 and its docstring
# at :863 says "on a Windows root"; run_task's docstring (launcher.py :1693-1699) lists the steps whose names are the reasons;
# launcher.py's import set is pinned exactly by tests/unit/test_launcher.py :703-707 (docstring :696-699; its naming test :750-757 requires
# "TASK-086 AC" in every test docstring of that file) and the new import of AC5 changes it. Also seen: tests/integration/test_writer_files.py
# :786 is a class docstring that states TASK-097's limit ("import_task takes a Windows root only") and becomes false with AC1;
# tests/unit/test_cli_import.py :6-7 says "the root is a literal Windows path" and becomes false as well (it is rewritten with :600-601);
# tests/unit/test_cli_launch.py :174 (about launch_outside) and tests/unit/test_reconcile.py :744 (run_task as a forbidden name of
# another module) were seen and need no change. launcher.py's module docstring and its function docstrings are pinned by tests
# outside the write set (test_launcher_outside.py :600/:629, test_launcher_gone.py :422/:446, test_launcher_end.py :364,
# test_cli_launch.py :515/:547, test_cli_init.py :349/:361, test_cli_approve.py :693-699) and by three inside it (test_launcher.py :731-757,
# test_cli_run.py :844/:873, test_cli_import.py :625/:652), so a docstring edit keeps every phrase those tests pin and adds none that they
# refuse. The first step of the work re-runs this scan and writes its hits in commit X's map. Existing tests were checked for logs that hold
# the run's claim event id: the only ones are built by run_task itself with the same payload (test_cli_run.py :171, :304, :386-388, :418),
# which eventlog answers "duplicate", so no existing case changes.
# What the task does not do: it changes no specification (links 2 and 3 need none), no workflow, no DEF file (each DEF log line is
# its own decision), no behaviour of end, launch_outside or approval_act (their Windows-only roots stay and are a stated limit),
# nothing under native/, bench/, .github/, docs/ or tests/conformance/. It does not read `.aieos/tasks/` (link 1).
# Risk: high. R2 matches src/** and tests/** (medium) and R3 reads them fail closed as high (risk-rules section 2 point 3); no
# critical rule matches the write set (no docs/specs/**, no .github/**); the highest rule that matches is R3: high. Confirmed by
# script over the base (risk_class104c.py, TASK-102's form) in the approval request.
# Change class: critical_cr, because the CI's EVALUATOR list (aieos-checks.yml, 35 entries) holds src/aieos_bootstrap/** and the
# tests folders, so every path of the write set is a GOV-003 evaluator path (read as D-3599 M3 reads it). Confirmed by script
# (gov003_class104c.py) in the approval request.
# Evidence profile (assurance-model.md section 5, gov-AIEOS, high): unit_test, integration_test, deterministic_rule,
# static_security_analysis, ai_review (cross-model), plus the evidence_required of the applicable articles, recorded per article
# from the start (L-0034), built at the approval request through records.check_record and the governor shadow. GOV-003 is
# recorded as it falls (DEF-0107's policy, D-3740, applies: the task changes files under tests/): no "holds" is claimed for the
# tests part; acceptance is a stated departure from the advisory governor, per task, in the form of D-3706/D-3707; the
# compensating controls are the local run of the base's tests against the change's src and a review of the test diff by a
# reviewer whose model differs from every model that did task work (L-0038), listed by machine.
# Reviews: round 1 of this contract was by Sonnet 5.5 and Opus 5.5, read tools only (the Opus copy in the scratchpad is partial; see
# review104_opus.SOURCE.txt); round 2 was by Haiku 5.5 (the owner's instruction and D-3873 C4); r3 was reviewed by the decision agent
# against the list of D-3876 in D-3877 (no round 3 by a helper), and r4 is r3 with D-3877's R1 only; every later helper review in this session is on Haiku 5.5; each brief is brought
# to the decision agent first; the decision agent's own review stands for the pair's half; the acceptance review is on a model that did
# no task work.
# Applicable articles: as listed; INV-001 to INV-004 and GOV-002 are listed fail closed (INV-003, the bootstrap source tree, is the
# tree the task changes and its evidence is human_review; GOV-002 is met by the path rule that tests/conformance/** is forbidden). INV-009
# (the event log) is listed too, because AC2 works on event-id idempotency; it is met by: eventlog.py unchanged, event ids unchanged
# (AC3), and the new refusal appending nothing. Not applicable, with reasons: INV-005 to INV-008 and INV-010 (their scope is the
# decision engine, the governor and their records; the task changes none of them); INV-011 (no auto-accept is set or used); GOV-001 (the
# concept file is not touched); GOV-004 (no Genesis-bound artifact is touched); GOV-005 and GOV-006 (the task changes no decision-matrix
# row, record or pre-genesis document; the records after acceptance fall under their own decisions); SEC-003 (no .github/ change);
# OPS-001 (the task changes no ref: its git capabilities forbid push, and every push, the task branch's included, is the worker's
# own decision and carries OPS-001's push rule).
# owner_kept_act: false is read as follows: the task's acts are source and test edits in the write set; A51 item (4) keeps real use of
# the zero-friction paths on E:/AIEOS or a real project (DEF-0105 :6) and settings, accounts and keys; this task never runs `import` or `run`
# on E:/AIEOS or on any real project (the tests use stand-ins and a temporary folder), so no owner-kept act is in it; A73 (2026-10-30)
# amends A51 item (4) for other acts (TASK-103.yaml :26) and is not relied on here. OPS-002 is listed and is met by this reading.
# Stated limits (D-3867 C3, D-3874, D-3876): (1) the check of AC2 and the write are not one step, and the window runs from read_log
# (step 4: the check sees the bytes read there) to the claim append, so a race can still end in eventlog's "conflict" refusal
# (eventlog.py :180-184), seen as run reason "append" (launcher.py :1686-1687), after the write; the task does not claim that window
# closed; (2) the roots of end, launch_outside and approval_act stay Windows-only; (3) link 1 stays open under DEF-0105; (4) the second
# person's statement of the same intent is not recorded: run_task takes the first claim of the record_id (launcher.py :1649) and the
# refused statement leaves no trace in the log.
task: TASK-104
