task_type: implementation
objective: >-
  Take up links 2 and 3 of DEF-0105 in src/aieos_bootstrap/launcher.py and its tests: import_task accepts an absolute Windows or
  POSIX root as run_task does, and run_task refuses, before write_contract and with the reason "intent", exactly the case in which
  eventlog.append (which the launcher reaches through writer.append_event), given the same log, would answer "conflict" for the
  intent's claim event: nothing written, nothing appended; no other behaviour changes, no DEF file changes.
