acceptance_criteria:
  - AC1: >-
      The three files, byte for byte, at each commit and at acceptance. At each of the task's commits and at its
      acceptance, docs/specs/risk-rules-gov-aieos.md has the SHA-256
      e33397c6c6a6ff92b6a355be54c3464bd0cc915f04424902f0a8be7e72abe57b (DM F42),
      tests/conformance/fixtures_risk/risk_01.py d04f33395b7dad7f296038dbdf277dba3fadbd00bfbf85cb8ae32bfc6f8723df
      (record TASK-040-freeze-risk-01, DM F43) and tests/conformance/set.py
      e37f16392a74ce5a2836791743ff232be0d0f58c6f3ce5b88b8bf19b989afad9 (record TASK-040-freeze-set, DM F44), checked by
      script before each push and in the acceptance request; any other bytes are refused: no push and no acceptance is
      brought with them, and other bytes need a new decision first.
  - AC2: >-
      The policy's rules (tests/unit/test_conformance_risk_files.py). test_the_policy_is_read_rule_by_rule asserts the
      rule ids exactly R1 to R12 (range(1, 13)), an exact list; every other assertion of the module is kept, and the
      fixture's values.risk_rules equal the policy's rules one for one, as at the base.
  - AC3: >-
      The set checks (tests/unit/test_conformance_files.py, tests/property/test_conformance_properties.py,
      tests/integration/test_conformance_set.py). check_set's copy in each requires fixture_set_version 4 (the
      comparison and its error text), and the end-to-end test asserts fixture_set_version 4; every other condition and
      assertion is kept; the altered-set cases keep every case and each still gives an error (the fixture set version
      case keeps a value other than 4); over the tree check_set returns exactly [] in each module.
  - AC4: >-
      The freeze test (tests/integration/test_conformance_rc_set.py). test_the_set_file_is_unchanged_and_frozen asserts
      that the set file is bound by exactly one freeze approval, TASK-040-freeze-set of docs/records/TASK-040.jsonl, and
      that TASK-020's freeze record of the replaced set file (2d952987…), TASK-014's and TASK-002's still exist
      unchanged; every other test of the module is kept, with its assertions.
  - AC5: >-
      The runner tree-run pins (tests/integration/test_governor_conformance.py, test_runner_rc_run.py,
      test_runner_risk_run.py, test_runner_run.py). RISK_01_SHA256 in each is
      d04f33395b7dad7f296038dbdf277dba3fadbd00bfbf85cb8ae32bfc6f8723df, and the docstrings that name DM row F34 name
      F43; the 'null' and 'present' states and every assertion are kept, and the present-state branches pass over the
      tree with their exact values.
  - AC6: >-
      Nothing else changes. Every other test that tests/run_tests.py runs passes unchanged at the task's commit, on a
      compiled tree, with the freeze records of docs/records/TASK-040.jsonl in the tree; the scratch run of the header
      (the fifteen failures, in exactly the nine modules) and the task commit's run are in the request that brings the
      first push.
  - AC7: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The modules import only what they import at the base; they
      use no exec, eval, compile, __import__ or importlib, start no process, open no network connection, call no model
      and write no file. The CI steps at the task's commits report no finding (deterministic_rule, OPS-003, SEC-001,
      SEC-002, bandit). Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns and the records executors' pre-push pattern, each count 0.
  - AC8: >-
      Does not loosen (GOV-003), shown by a script over the base and the task's commit, its output and SHA-256 in the
      accepting decision. (a) The four runner modules (test_governor_conformance.py, test_runner_rc_run.py,
      test_runner_risk_run.py, test_runner_run.py), pins only (conformance-files.md section 8 (i), revision 9): every
      changed line is listed, and each only replaces RISK-01's SHA-256 8a0bdb16… by d04f3339…, the value of the file
      this task writes, or is docstring or comment text only naming that value or its approval (DM F34 by F43); nothing
      else changes. (b) The five test_conformance_* modules (fixture-task checks under section 8's first sentence): no
      test removed or skipped; every assertion of the base either byte-equal or replaced by one exact new value (the
      rule ids R1 to R11 by R1 to R12, fixture_set_version 3 by 4, the freeze record TASK-020-freeze-set by
      TASK-040-freeze-set); added assertions allowed and listed (the replaced set file's freeze record kept as a further
      assertion); the count of assertion calls in each module does not fall.
  - AC9: >-
      Tests, with this rule-to-test list: R1 AC1 (the three pins by script at each commit and at acceptance, and the
      tests that read the set file's freeze and RISK-01's state); R2 AC2; R3 AC3; R4 AC4; R5 AC5; R6 AC6.
      tests/run_tests.py, unchanged, runs them.
