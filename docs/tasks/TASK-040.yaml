# Task contract TASK-040, the risk rules policy v4 (rule R12, bench/** high), RISK-01's next fixture version and the
# next set file, with the tests that pin them (Master Plan revision 4, §4, the benchmark and the stack ADR; decisions
# D-794 Q3, D-795 and D-796: the stack benchmark's ports live under bench/<language>/, which no rule of policy v3
# classes, and RISK-01's fixture carries the policy's rules as values). Revision 0, drafted under decisions D-800 (C2)
# and D-801 (NEXT); brought for approval in its own request; whether it is approved is recorded in the decision files,
# not here.
# Fields and value forms follow specification 2 §5.1 and TASK-020's contract, whose method this task repeats.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# The three data files are already approved and frozen by hash before this task (conformance-files.md section 7,
# revisions 5 and 8; decision D-800; DM F42 to F44; records TASK-040-freeze-risk-01 and TASK-040-freeze-set of
# docs/records/TASK-040.jsonl, on main since commit b54c6eb7): the policy
# e33397c6c6a6ff92b6a355be54c3464bd0cc915f04424902f0a8be7e72abe57b (F42), the fixture
# d04f33395b7dad7f296038dbdf277dba3fadbd00bfbf85cb8ae32bfc6f8723df (F43) and the set file
# e37f16392a74ce5a2836791743ff232be0d0f58c6f3ce5b88b8bf19b989afad9 (F44). At each of the task's commits and at its
# acceptance the three files must be exactly those bytes (AC1; D-800 C2); other bytes need a new decision first
# (revision 8 (e)); the acceptance cites those approvals and gives no other.
# A scratch run (session 5551e765, a clone at b54c6eb7 with only the three files put in place, on a compiled tree) gave
# "Ran 1149 tests", "FAILED (failures=15)", in nine test modules, each failure a pin of the old values: the rule ids R1
# to R11 (one), fixture_set_version 3 (five through check_set's three copies, and one end-to-end assertion), RISK-01's
# frozen SHA-256 in the four runner tree-run modules (seven), and the set file's one freeze record of TASK-020 (one).
# So the test modules change only those pins, each to the new exact value, and the docstrings and comments that name the
# old row or version (AC2 to AC5).
# The id: TASK-039 is the highest contract id used; TASK-040 is the id decision D-800 gave this task and its freeze
# records name.
# Task type: fixture (docs/specs/conformance-files.md section 8, revision 9, DM F45; decision D-802): the fixture and
# the set file are files of sections 2 to 4 under tests/conformance/; the five test_conformance_* modules check only
# those files; the four runner modules change only pins of the files this task writes, each with one exact new value
# (section 8 (i), shown by AC8's script); the policy changes only to the bytes F42 approves before the task (section 8
# (ii)). GOV-002 does not apply, as the constitution writes its applicability (implementation, refactoring); every other
# article whose applicability names implementation is applied as to an implementation task, so no evidence requirement
# narrows (section 8; CR-002 part 4 limit 8).
# Readers of the changed paths: the governor and the CI's base conformance runs read the policy, the set file and the
# fixtures from the base, so this task's own pushes run the base's (RISK-01 against v3's rules) and the first
# conformance run over the new files is the base run of the next push after this task lands; scope_drift.py and
# scope_reconcile.py read the policy's non-task list and rules at a base, and the non-task list does not change;
# tests/run_tests.py and the CI's unit_test, integration_test and property_test steps run the changed modules.
# Risk: critical. R6 matches docs/specs/** (critical) and R11 matches tests/conformance/** (critical); R3 read fail
# closed matches tests/** (high); the highest wins (risk rules section 2 point 1); computed over the base by script, its
# output in the approval request.
# Profile (assurance-model.md §5, gov-AIEOS, critical): unit_test, integration_test, property_test, deterministic_rule,
# static_security_analysis, ai_review (cross-model) and human_review; plus the evidence_required of the applicable
# articles.
# Change class: critical_cr (reading, fail closed, as TASK-020's; computed, not asserted): GOV-003's tool part over the
# base marks the test modules as evaluator paths, all modified, whose assertions change; the data files change under
# freezes already given (DM B10: normal_cr with a freeze). The stricter class is taken.
# Freeze: no freeze approval is given in this task's acceptance (section 7, revisions 5 and 8, (c) and (e)): the
# acceptance cites TASK-040-freeze-risk-01 and TASK-040-freeze-set and F42. No other fixture changes.
# Reviews (as TASK-020's): five way-2 reviews by a Claude model other than the implementer's, each brief to the decision
# agent first (architecture, security, governance (GOV-003, that no test is weakened, by vacuity included), operational,
# and the cross-model half), and the decision agent's reviews (architecture human_review, also checking that the fixture
# and the set file name the policy and the fixture faithfully; operational human_review; the cross-model half). Each
# reviewer's prompt is self-sufficient, every input a copy under the scratchpad's review folders.
# Evaluation path (A61; as TASK-020): the approved contract is committed on main as its own commit C, which changes only
# docs/tasks/TASK-040.yaml and has one parent equal to base_commit, and is pushed normally; the files are made in
# scratchpad clones (push URL disabled, the no-reply identity set first), the suite run on a compiled tree (L-0018); the
# task's commits, each carrying the trailer "AIEOS-Task: TASK-040" and no e-mail address in its message, go to the
# branch task/TASK-040 on GitHub, each push under its own decision after a secret scan, a check of the three files'
# SHA-256 (AC1) and a dry run, never by force and never deleting; the CI channel's records are re-fetched into
# docs/records/TASK-040.jsonl after the two freeze records, which stay its first lines; main receives the task only at
# its acceptance, by a fast-forward under its own decision (or by rebuilt commits checked equal).
# Not applicable: GOV-002 (above); OPS-001 (the task changes no ref); INV-009, INV-011, GOV-001, GOV-004, GOV-005,
# GOV-006 and SEC-003 (their scopes meet none of the write-set's paths (reading); the policy is not a Genesis-bound
# artifact (reading)).
# Owner-kept acts: none. Nothing under .github/, no workflow change, no Claude Code setting (CR-002 part 4 limit 5 does
# not apply); no class is lowered and no evidence requirement is weakened (limit 8 does not apply; F42). Approver of the
# acceptance (reading): one delegated approval of the decision agent (Master Plan §6).
# Uncovered and stated limits: this task's own conformance runs take the policy, the set file and the fixture from the
# base, so no CI conformance run over the new files exists before the task lands; RISK-01's first run over v4 is the
# CI's base run after landing, advisory and not part of this acceptance; no port exists yet, so R12 classes no change
# until the first port task; every review is by AI of one vendor.
task: TASK-040
contract_version: v1
task_type: fixture
objective: >-
  Write the risk rules policy v4 (docs/specs/risk-rules-gov-aieos.md, rule R12: bench/** high), RISK-01's next fixture
  version (tests/conformance/fixtures_risk/risk_01.py, its values.risk_rules gaining R12) and the next set file
  (tests/conformance/set.py, RISK-01's entry naming that version, fixture_set_version 4), each byte for byte the file
  approved or frozen before this task (DM F42 to F44), at each of the task's commits and at its acceptance; and change
  only the pins of the old values in the nine test modules that hold them, each to the new exact value, with no
  assertion weakened. No other fixture, runner, governor, source or test changes.
