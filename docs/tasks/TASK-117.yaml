objective: >-
  Make the core read the runtime's declaration at the base: (1) a base read of the policy text, added to claude_code_shell_allow.py (which may already name .aieos, K1 route 1) as a public function with three outcomes (present, absent, refused); (2) a new module aieos_bootstrap/adapter_declaration.py that PARSES that text (declared_max_risk) and composes the base read with the parse in one function read_declaration(repo, base, adapter, run=None), the real function behind the launcher's seam (it names no .aieos, anywhere, docstrings included; it opens no file and starts no process except through claude_code_shell_allow.read_policy_text, which runs git through gitread.run; declared_max_risk starts none) and returns, for an adapter id, the Resume Check's runtime.max_risk by spec-02:246-248: result absent with max_risk None when there is no declaration for the adapter (check 7 STOP), result refused when the base read is refused, result error for a malformed declaration or a repeated adapter id (no decision), and result low with the text low for a well-formed declaration, since no measurement resolves; the mapping has exactly result, max_risk and findings; (3) the new step "declaration" of launcher.start supplies the tier from that read (the parameter max_risk of start is removed, so no caller can pass a tier; launch_outside's call of the begin function loses its positional None); (4) writer.write_policy(root, text): create-only .aieos/project.yaml, link checks, read-back, in the form of write_contract; (5) the text of spec-02 section 7.1, section 10 point 12 (:291) and the revision record, and of spec-05:37 and its revision record, revised under R-b. No other behaviour changes; any other finding becomes a DEF entry.
