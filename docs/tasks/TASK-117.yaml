acceptance_criteria:
  - AC1: >-
      The base read (M2, F7, F8, F10). claude_code_shell_allow gains one public function read_policy_text(repo, base, run=None) that returns the text of .aieos/project.yaml at the base by the same git reads and the same blob checks as read_allowlist (gitread.run only, never the working tree; the run parameter is the test seam, as at claude_code_shell_allow.py:367; at most 1 MiB, strict UTF-8, no U+FEFF, no C0 control but LF, no DEL, no C1, no U+2028 or U+2029). `repo` is the repository path that launcher.start already holds in its own repo argument and `base` is the head commit that start's step "head" returns: the launcher gives adapter_declaration.read_declaration (AC2) exactly those two, and read_declaration passes repo, base and run to read_policy_text unchanged, never the launcher's root argument. The arguments are checked first, as read_allowlist does at :290-295 (repo by gitread.form_error, base by gitread.OBJECT_ID): a bad one gives result refused with the finding "argument: repo" or "argument: base" and no git call. It returns a mapping with exactly result, text and findings, and result is exactly one of: present (the blob read and checked; text is it), absent (the base commit and the root tree read, and EITHER there is no .aieos tree at the base OR the .aieos tree has no project.yaml entry: the two cases that read_allowlist folds into a refusal at :318-322 for its own purpose), or refused (a git error, an entry that is not a regular blob, a mode other than 100644, a failed byte check or a bad argument; text is the empty text; the finding is, by form: 'argument: repo' or 'argument: base' for a bad argument, a 'git: ...' finding of the reused call at claude_code_shell_allow.py:96-113 for a git error (exactly one of 'git: result shape', 'git: error', 'git: exit not an int', 'git: exit N', 'git: out not bytes' and 'git: run raised <type name>'), and a fixed word for a blob or byte-check refusal). read_allowlist, parse_policy and every existing result of this m