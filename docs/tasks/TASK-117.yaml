capabilities:
  filesystem: {read: [the repository at base_commit], write: [src/aieos_bootstrap/adapter_declaration.py, src/aieos_bootstrap/claude_code_shell_allow.py, src/aieos_bootstrap/launcher.py, src/aieos_bootstrap/writer.py, tests/unit/test_adapter_declaration.py, tests/unit/test_launcher.py, tests/unit/test_launcher_gone.py, tests/unit/test_writer.py, tests/unit/test_cli_launch.py, tests/integration/test_launcher_repo.py, docs/specs/spec-02-aieos-file-format.md, docs/specs/spec-05-adapter-contract.md]}
  shell: {allow: []}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 10h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4]}
  - {gate: G3, check: constitution, args: [AC5, AC6, AC7, AC8, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, GOV-004, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the risk class is satisfied AND one approval record counts AND the CI runs of the accepted commit succeed
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
# owner_kept_act: false: the one act is a change of source, tests and specifications of the self-build, which the decision agent decides under A51/A66 and the owner's A74 for the low reading; no runtime is launched and nothing of A51 item (4) that stays with the owner is carried out. Raising any assurance or autonomy because of an adapter, any measurement, and the form of point 12 stay the owner's (spec-02:250; spec-05 section 10).
owner_kept_act: false
