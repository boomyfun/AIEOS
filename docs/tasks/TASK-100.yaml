# Appendix A: the trace table (decision D-3416), drafted by a read-only agent and checked by the worker (D-3416 C3 to
# C5), at main cc283d35, carried here by script (mk_r1.py) as comment lines: its section 2 rows, verbatim (47 rows:
# 39 equivalent, 2 different (25, 26), 6 no counterpart (37 to 42)). gov.py = src/aieos_bootstrap/governor.py,
# rec.py = src/aieos_bootstrap/records.py, gov.go / rec.go / json.go / export.go = bench/go/*.go.
