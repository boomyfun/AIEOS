# Task contract TASK-100 (revision 3), the native governor in shadow: a Go port of governor.evaluate under native/go/governor/,
# compared byte for byte with the bootstrap over the frozen round-1 governor fixtures, deciding nothing (M8 plan,
# docs/plan/m8-plan.md §1 item 1, §2 to §5; decisions D-3336, D-3405 and D-3408 to D-3416). Revision 3, drafted under
# decisions D-3408 (the frame, C1 to C8), D-3409 (the workflow, C4), D-3416 (the trace table, C1 to C7), D-3427 (the
# contract review c100-R1's findings) and D-3417
# (r0's rulings R1 to R8, C1 to C5); brought for
# approval in its own request; whether it is approved is recorded in the decision files, not here. Fields and value
# forms follow specification 2 §5.1 and TASK-099's contract (the key list, checked by script, L-0031). Readings marked
# "(reading)" are the worker's, for the decision agent's ruling.
# Numbering (D-3347 C3): docs/plan/m8-plan.md :8 calls this task "TASK-099"; it is TASK-100.
# The workflow (D-3408 F1 a, D-3409): .github/workflows/aieos-native.yml landed on main before this contract, as its
# own commit cc283d35008fc0cf5afadd6b3d64d6a44ebfbc40 (parent bbb94609), SHA-256
# c41b67f50c0335093be123e8ea677fcf147cf2b385f4417441c22ffc658f102a (decisions D-3409 to D-3411); on main it printed "no
# port in native/go/governor" on both jobs (run 40798383923, D-3413). This task does not change it; its commands bind
# this task's names: tests/unit/test_export_governor.py --root tests/conformance --check, one Go package in
# native/go/governor built with `go vet .`, `gofmt -l .`, `go build -trimpath`, run with one argument (the fixture
# document), and `go test -count=1 -v . -args <fixture document> <governor reference>` (D-3409 C4).
# The copy (m8-plan.md §3): the code starts as a copy of bench/go's governor part (governor.go, records.go, json.go, the
# governor half of export.go, main.go, port_test.go's governor tests; not resume.go), made in this task's write-set and
# reviewed as new code; bench/go is not changed. The copy is brought to today's Python: the trace table (appendix A)
# lists every function governor.evaluate reaches in governor.py and records.py at main cc283d35, its Go counterpart,
# the verdict and each difference. It was drafted by a read-only agent (decision D-3416; agent a00245e6fd1f4c0a8 of
# session 87e2584b; only Read, Grep, Glob and one Write, by a tool-use count of its transcript) and checked by the
# worker (D-3416 C3 to C5: records.check_record and records.go read in full; the reached-function list checked by the
# worker's own Grep of governor.py's calls; every "different" and "no counterpart" row and five "equivalent" rows,
# evaluate, _sort_records, _entry, _approval and _candidate, checked at the cited lines on both sides). Its result: the
# governor rows are equivalent; records.go matches records.py as it stood before TASK-064, TASK-077 and TASK-096, so the
# port adds the four record keys read_paths, session, acs and text and the rules check_read_set and check_session_claim
# (with _is_read_paths, _is_edit_claim and _is_intent_claim), in records.py's order (AC4). No round-1 governor fixture
# holds those keys (a Grep of tests/conformance/fixtures/), so the byte compare cannot show this part; AC4's Go tests do.
# The governor-only reference: tests/unit/test_export_governor.py (new). The CI's deterministic_rule lets a module
# under tests/ import only the standard library and aieos_bootstrap (aieos-checks.yml :1465-1466, :1615; D-773), so it
# cannot import tests/unit/test_export_reference.py; it repeats that module's reading of the fixture folders and its
# document form for the governor folder only, with its own pin, and its tests compute the full round-1 document the
# same way and check that its SHA-256 equals test_export_reference.REFERENCE_SHA256's value (copied as a constant and
# compared with that module's text by a test that reads it as bytes) and that the governor document equals the full
# document's "fixtures/" part, so the two cannot drift apart (D-3408 C6) (reading).
# Isolation (D-3408 C7; D-800 C3's form, as tests/unit/test_bench_isolation.py): a new test reads every file under
# src/ and tests/ and .github/workflows/aieos-checks.yml and fails if any names "native/" or imports a module named
# native, except a closed allow-list of exactly two files, each with its reason (itself, and the frozen RISK-01
# fixture of tests/conformance/, whose path the test builds from parts; D-3417 C1, D-3427 C3); and it checks that
# aieos-native.yml is the only workflow that names "native/". The bootstrap never imports or runs the native code.
# Closed name lists of existing tests (D-3427 C3; c100-R1 finding 2): tests/integration/test_conformance_rc_set.py
# :37, :41-50, :164-169, test_conformance_risk_set.py :20, :24-34, :85-98, test_conformance_cb_set.py :19, :73-86 and
# tests/unit/test_bench_isolation.py :16-17, :19-23, :32 refuse any other .py under src/ or tests/ whose bytes name
# those fixture folders or bench/; so the bytes of neither new module, comments and docstrings included, name them
# (AC1, AC2, AC7), and folder names are built from parts.
# Risk: high. R13 matches native/** (high); R3 matches tests/** (high, read fail closed); no rule of class critical
# (R5 to R11) matches the write-set; the highest wins (risk rules section 2 point 1); computed over the base by
# script (risk_class100.py), its output in r1's approval request.
# Profile (assurance-model.md §5, gov-AIEOS, high): unit_test, integration_test, deterministic_rule,
# static_security_analysis, ai_review (cross-model); plus the evidence_required of the applicable articles, recorded
# per article from the start (L-0034; D-3395): built at r1's approval request through records.check_record and the
# governor shadow (gov99.py's form) before the reviews (D-3408 C7).
# Change class: critical_cr (decision D-3417 C4, as TASK-060's): GOV-003's tool part over the base marks the two new
# tests/unit/** modules as evaluator paths (aieos-checks.yml :427), computed by script (gov003_class100.py, the form
# of gov003_class60.py; its output in r1's approval request); read fail closed, the class is critical_cr; the
# approval form is ruled at acceptance. The risk class (high) and the profile do not change; the risk class is
# computed by script too (risk_class100.py, the form of risk_class60.py, policy v5's rules R1 to R13).
# Reviews (D-3408 C7; Master Plan :104, A59, A60): five way-2 reviews by a Claude model other than the implementer's,
# each brief to the decision agent first, each reading the workflow text as well (D-3409 C4): architecture (the port
# against today's governor.py and records.py, the trace table), security (no import beyond Go's standard library, no
# file write, no network, no process; the Python modules' purity), governance (GOV-003: no existing test changed; the
# shadow decides nothing), operational (the workflow's steps and the CI evidence of AC6), and the cross-model half; the
# decision agent's reviews (architecture human_review; INV-003 and OPS-002 per article; the cross-model half).
# Evaluation path (A61; as TASK-099): the approved contract is committed on main as its own commit C, which changes only
# docs/tasks/TASK-100.yaml and has one parent equal to base_commit; the files are made in scratchpad clones (push URL
# disabled, the no-reply identity set first); the Python modules' suite runs locally on a compiled tree (L-0018); the
# Go code is not built or run on the owner's machine (m8-plan.md §4; D-3405): every Go build, vet, format check and test
# runs only in CI, so each Go fix is a new push of task/TASK-100, and more than three pushes only for Go compile, vet,
# format or test errors stop the task and go to the decision agent (D-3408 C8). The task's commits carry the trailer
# "AIEOS-Task: TASK-100" and no e-mail address, go to task/TASK-100 each under its own push decision after a secret
# scan and a dry run, never by force; the records commit lands on main by the fast-forward form of TASK-099 (D-3400).
# Applicable articles (D-3427 C1; c100-R1 finding 1): besides INV-001 to INV-004, GOV-002, GOV-003, SEC-001, SEC-002,
# OPS-002 and OPS-003, also INV-005 to INV-008 and INV-010, whose applicability is implementation and whose scope is
# the governor (constitution.md :47-75; INV-005's rule names the native implementation): a Go governor
# implementation is in their scope (fail closed). INV-005 to INV-008 require property_test (AC10); INV-010 is a
# deterministic replay (the CI's INV-010 step) and is in G3, as in TASK-099's and TASK-059's contracts.
# Not applicable (reading): GOV-002's refactoring clause; OPS-001 (no ref changed by the task's code); INV-009, INV-011,
# GOV-001, GOV-004, GOV-005, GOV-006, SEC-003 (their scopes meet none of the write-set's paths).
# Owner-kept acts: none. Nothing under .github/ (the workflow landed under A66 before this task), no setting, no hook,
# no install (no local Go), no class lowered, no evidence requirement weakened. Approver of the acceptance (reading):
# one delegated approval of the decision agent (Master Plan §6).
# Uncovered and stated limits: the shadow runs over the round-1 governor fixtures only (m8-plan.md §2), not over any
# acceptance's real records (that is a later decision); the record-form rules added by AC4 are exercised by Go tests,
# not by any fixture; Python's lone-surrogate branch (governor.py :347-350) has no Go path, since the Go reader refuses
# such input (appendix A, row 3); every review is by AI of one vendor. The property_test record that INV-005 to INV-008
# count is the CI's Python property step, which this task does not change and which does not run the Go code; the
# native side of those articles is carried by AC3, AC4 and AC6 (D-3427 C2).
task: TASK-100
contract_version: v1
task_type: implementation
objective: >-
  Write the native governor in shadow: one Go package in native/go/governor/ (standard library only) whose program reads
  the fixture document and prints, byte for byte, the governor-only reference document of the round-1 governor
  fixtures, computing every case as governor.evaluate at main computes it, record forms included (records.check_record
  as today); its Go tests; tests/unit/test_export_governor.py, the governor-only reference export with its own pin and
  its tie to the full reference; and an isolation test that no bootstrap file names or runs native/. The native code
  decides nothing: it writes no record and nothing reads its output but the advisory workflow aieos-native.yml.
