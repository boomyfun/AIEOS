acceptance_criteria:
  - AC1: >-
      The governor-only reference (tests/unit/test_export_governor.py). Run from the repository root as `python
      tests/unit/test_export_governor.py --root tests/conformance [--check]`, it reads every .py file of
      tests/conformance/fixtures (a __pycache__ folder passed over; any other entry fails closed), unwraps each with
      aieos_bootstrap.conformance.unwrap, calls aieos_bootstrap.governor.evaluate(request, inputs, records) for each
      case with deep copies, and prints the canonical text (conformance.canonical_text) of one object whose keys are
      "fixtures/<file stem>" and whose values are the case records in case order; ASCII with LF only; `--check` fails
      when the document's SHA-256 differs from its pin REFERENCE_GOVERNOR_SHA256 (one exact value, filled from the scratch
      run and named in the approval of commit X); on any other argument form, a missing folder, a refused file, a call
      that raises or a record that is not an object it exits non-zero and prints nothing to standard output. It runs no
      process, reads no network, clock or environment, writes no file, reads files only with Path.read_bytes, and
      imports only the standard library and aieos_bootstrap, within the import and pattern rules of
      aieos-checks.yml :1464-1472 (decision D-3417 C5); so does tests/unit/test_native_isolation.py. The bytes of
      neither module, comments and docstrings included, contain the names of the Resume Check, risk or Capability
      Boundaries fixture folders or "bench/", and neither has a line matching `^\s*(?:import|from)\s+bench\b`; folder
      names are built from parts ('fixtures_' + 'rc') (D-3427 C3).
  - AC2: >-
      The tie to the full reference (D-3408 C6). The module's tests compute the full round-1 document (the governor
      and the Resume Check fixture folders, the second's name built from parts, the Resume Check's records with the closed placeholder engine_identity.python, as
      test_export_reference.py does) and assert that its SHA-256 equals the constant FULL_REFERENCE_SHA256 =
      01aeec8f12bcf11303e1ec08c1d87d866a7aa823066fe9c5f5eeace4c0ac6443, that this constant occurs once in
      tests/unit/test_export_reference.py's bytes (read with Path.read_bytes, never open(); decision D-3417 C5) as
      REFERENCE_SHA256's value, and that the governor document equals the
      canonical text of the full document's keys beginning "fixtures/". The full document and its pin are unchanged.
  - AC3: >-
      The native program (native/go/governor). One Go package main, go.mod naming the module aieosnative and the Go version
      of bench/go/go.mod (go 1.24), no require and no other file than the write-set's. Run with exactly one argument, the fixture
      document (tests/unit/test_export_fixtures.py's output), it writes the governor-only document in one write and
      exits 0, byte-equal to AC1's output; it accepts and passes over the fixtures_rc and fixtures_risk keys of the
      fixture document, requires at least one "fixtures/" key, and fails closed as bench/go's program does (port_test.go's
      TestFailClosed cases kept by name: no argument, an extra argument, a file that cannot be read, an empty file, not
      JSON, a truncated document, not one object, the three not-canonical cases, a byte-order mark, not UTF-8, a repeated
      key, a fixture that is a number, a number with a fraction, an integer of more than 4300 digits, no governor
      fixture, an unknown folder, a key without a folder, an empty file stem, a fixture that is not an object, no cases,
      a case that is not an object, a governor case without request, a governor case without records, the two
      evaluate-raises cases and a record that is not ASCII; the Resume Check cases are dropped); with no
      argument it exits non-zero and writes nothing to standard output. It imports only Go's standard library, opens
      only the one file named by its argument, starts no process, uses no network and writes no file.
  - AC4: >-
      Today's record forms (appendix A rows 25, 26, 37 to 42). The Go checkRecord gives the rules of
      records.check_record at main, in its order: recordKeys holds read_paths, session, acs and text; after the audit
      copy rules come the read-set rules (6.2:read_set_key, read_set_fact_kind, read_set_source_class, read_set_subject,
      read_set_value, read_set_forbidden, in records.py :386-414's order) and the session-claim rules (6.2:session,
      6.2:text with the edit-claim and intent-claim exceptions, 6.2:acs, in :434-458's order). (a) Go tests call
      checkRecord directly for every rule and compare its whole rule list with the list of rules of
      records.check_record for the same input; and evaluate-level tests show the first finding's effect (the uncovered
      note and the decision). (b) Go tests over the branches no fixture exercises (appendix A rows 15, 18, 19, 23, 24, 30,
      36 and the error, cross-model, approval and rework parts of rows 1, 8, 12, 13, 20, 21): the error record, the
      cross-model pair, the way-2 and decision-agent candidates, the approval at IN_REVIEW, rework and escalation, and
      audit-copy values, each compared with governor.evaluate's record for the same input. The expected values of (a)
      and (b) are constants taken from a scratch run of the Python; its script and unedited output are in the approval
      request of commit X (D-3417 C3; c100-R1 findings 3 and 4).
  - AC5: >-
      The trace (D-3408 C5). Appendix A is the trace table at main cc283d35. Commit X's approval request carries the
      table updated to native/go/governor (each row's Go function and line) as its own file, checked by a script that
      every named Go function exists at the named line; every "different" and "no counterpart" row is brought to
      today's Python by AC4; no row stays "different" (c100-R1 finding 5).
  - AC6: >-
      The CI evidence (D-3408 C4). On the aieos-native run of the accepted commit, both jobs, linux and windows, ran the
      native steps, not the "no port" branch: the logs show "native governor: byte-equal to the governor reference" and
      every go test result line PASS, read by a read-only script by run id (fetch_logw100.py's form), its output in the
      accepting decision; and the aieos-checks run of the same commit succeeded.
  - AC7: >-
      Isolation (tests/unit/test_native_isolation.py; D-800 C3's form). It reads with read_bytes every file under src/
      and tests/ (a __pycache__ folder passed over) and .github/workflows/aieos-checks.yml, and fails if any names
      "native/" or has a line matching `^\s*(?:import|from)\s+native\b`, except the files of a closed allow-list of
      exactly two entries, each with its reason: tests/unit/test_native_isolation.py itself (it names the folder it
      guards) and RISK-01's frozen fixture under tests/conformance/, its path built from parts (a frozen risk-rules
      fixture that names the R13 pattern "native/**" as data; decisions D-3417 C1 and D-3427 C3); a test asserts
      the allow-list's exact set and that every reason is non-empty (test_bench_isolation.py :70-74's form); and it
      fails unless aieos-native.yml is the only workflow under .github/workflows/ that names "native/". Every test's
      docstring begins "TASK-100 AC<n>". It runs no process and writes no file.
  - AC8: >-
      Nothing else changes. Every test that tests/run_tests.py runs passes at the task's commit on a compiled tree; the
      two new Python modules run under it; bench/go, test_export_reference.py and every existing test are unchanged.
  - AC9: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The Python modules import only the standard library and
      aieos_bootstrap, use no exec, eval, compile, __import__ or importlib, start no process, open no network connection
      and write no file; no Python file is added outside tests/unit; no non-Python file is added under src/ or tests/.
      The CI steps at the task's commits report no finding (deterministic_rule, OPS-003, SEC-001, SEC-002, bandit).
      Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns and the
      pre-push pattern, each count 0.
  - AC10: >-
      The records (L-0034; D-3395). The task's evidence records' forms are built and checked through
      records.check_record and a governor shadow over a dry records list (rec100_dry.py, gov99.py's form), at r1's
      approval request with their raw output (decision D-3417 C2): per-article records for INV-001, INV-002,
      INV-004, GOV-002, GOV-003, SEC-001, SEC-002 and OPS-003 (whichever of them the constitution gives an
      evidence_required) (way-2 copies naming the reviewer lines that address each
      article), INV-005 to INV-008 (property_test copies of the CI's property step record, in TASK-099's form; that step
      runs the Python property tests, unchanged by this task, and the native side of these articles is AC3, AC4 and AC6),
      INV-010 under its replay check (the CI's INV-010 step; no property copy), INV-003 and OPS-002 (decision agent reviews with that dimension), and the profile entries of risk high;
      the shadow gives NEEDS_REVIEW, row 5, no missing entry, before the reviews.
  - AC11: >-
      Tests, with this rule-to-test list: R1 AC1 and AC2 (test_export_governor.py's own tests); R2 AC3 (Go tests and the
      workflow's compare, AC6); R3 AC4 (Go tests); R4 AC7 (test_native_isolation.py); R5 AC8 (tests/run_tests.py,
      unchanged).
