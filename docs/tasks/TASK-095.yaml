acceptance_criteria:
  - AC1: >-
      init_layout over a real temporary folder (tests/unit/test_writer.py, class TASK095InitLayout): "done", value
      exactly the twelve '.aieos/<folder>' paths in _INIT_LAYOUT_DIRS' order; walking the temporary root (os.walk),
      the folders are exactly .aieos, .aieos/intent and the twelve, and no file exists anywhere under the root (no
      events.jsonl, project.yaml, constitution.yaml, ignore file or local/state.sqlite); a second call gives
      "refused", reason "exists", and the walk is unchanged.
  - AC2: >-
      init_layout's refusals: a root that is not a str, empty, or names no existing folder gives "root"; a .aieos that
      exists as a folder (made by a first init_layout call), an empty file or a non-empty file (made by open(path,
      'ab'), the module's allowance) gives "exists" with nothing created; os.path.islink (patched) true at the root or
      at .aieos gives "link" with nothing created; an islink stand-in that answers true for a layout folder only once
      os.path.isdir of that folder is true gives "link" (the check after the folders); os.path.realpath (patched) that
      resolves a layout folder elsewhere gives "link"; a raise in os.path.lexists or in os.makedirs (patched) gives
      "unwritable" naming the exception's type; each refusal has exactly the one finding the scope gives for its
      reason; no finding holds the root's text; no call raises.
  - AC3: >-
      launcher.init_project by stand-ins: init_layout is called exactly once with the root and defaults at call time
      (mock.patch.object of writer.init_layout made after import is the one called); a StoreResult "done" with reason
      None, no findings and a non-empty tuple of str, and a StoreResult "refused" with a str reason and a tuple of str
      findings, map to the mapping with exactly INIT_KEYS as the scope says; each answer out of form gives reason
      "init_layout" and the out-of-form finding: an object that is not a writer.StoreResult (a subclass included),
      "done" with an empty tuple, a non-tuple value, a non-str item, a reason or findings, "refused" with a non-str
      reason or findings that are not a tuple or hold a non-str item, a result other than done or refused; a raise
      gives "init_layout: a step raised <type>"; no call raises; by ast, init_project and its helpers name no open, os,
      sys, time or subprocess and no attribute now, environ, getenv or write.
  - AC4: >-
      The command init by stand-ins (mock.patch.object of launcher.init_project, restored after each test; a counting
      clock): "init --root R" and "init --root R --json" call init_project once with R and the clock never; "init",
      "init --root", "init --root R extra", "init R --root R" and "init --root R --json --json" give exit 2 and USAGE
      with nothing called, inside a runtime too; an environ holding any one of the three RUNTIME_VARS (an empty value
      included) gives exit 1 and the one runtime-refusal finding with nothing called; "done" gives exit 0 and the
      "created: " lines, or under --json the exact string '{"created": [...], "findings": []}'; "refused" gives exit 1
      and "finding: init: <reason>" then its findings; each answer out of form (not a dict, a dict subclass, other
      keys, a created list subclass, a non-str item, an empty created list for done, a done with a reason or findings,
      a refused with created items) gives the out-of-form finding; a raising init_project gives "init: a step raised
      <type>"; a raising _render_init (patched) gives "cli: a step raised <type>"; tasks', end's and status' tests all
      still pass.
  - AC5: >-
      The modules: writer.py's import set unchanged (tests/unit/test_writer.py :414-418 passes), its single-writer test
      (:397-412) passes, R23 as widened passes with init_layout and its helpers above the TASK-066 marker; by ast,
      init_layout and the names beginning _init_layout call no open; writer.py's diff from the base is an added
      docstring paragraph after :64 and a block inserted after :1144 only, and launcher.py's diff is added lines only
      (a docstring paragraph after :124 and a
      block after :719), each checked at G3 by a scratchpad git-diff script; launcher.py's import set unchanged
      (tests/unit/test_launcher.py :702-705 passes) and :707-719 passes; cli.py's imports unchanged and its refused
      names and strings (tests/unit/test_cli.py :333-356, :369-375) pass; the new test file uses no tempfile, sqlite3,
      shutil or open, roots only the literal 'C:/init-root-95', and uses no one-argument .replace() and no
      .replace(target=...).
  - AC6: >-
      Docstrings: writer.py's module docstring gains a paragraph holding "init_layout", "TASK-095", "exists" and "no
      file", and keeps every phrase of tests/unit/test_writer.py :883-904; launcher.py's gains a paragraph holding
      "init_project" and "TASK-095" and keeps every phrase of tests/unit/test_launcher.py :722-733,
      tests/unit/test_launcher_gone.py :420-429 and tests/unit/test_launcher_outside.py's launcher docstring test;
      cli.py's gains "aieos init" and "TASK-095", holds "COMMANDS, tasks, end, status or init" and "end and init call
      it after the parse" and not "COMMANDS, tasks, end or status", and keeps every phrase of tests/unit/test_cli.py
      :405-411 and tests/unit/test_launcher_outside.py :609-620; USAGE names init; tests/unit/test_execution_status.py's
      AC6 test as widened passes; every test of tests/unit/test_cli_init.py names "TASK-095 AC", checked by its own
      naming test, more than 20 tests; every test of the class TASK095InitLayout names "TASK-095 AC", checked by the
      class's own naming test.
  - AC7: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) init_layout writing into an existing
      .aieos (the exists step dropped) (AC1, AC2); (2) a folder of the layout left out (AC1); (3) a file created in the
      layout (an empty events.jsonl by open 'ab') (AC1); (4) the link check before the folders dropped (AC2); (5) the
      link check after the folders dropped (AC2); (6) the realpath comparison dropped (AC2); (7) a raise in
      os.makedirs escaping (AC2); (8) a finding holding the root's text (AC2); (9) init_layout defined after the
      TASK-066 marker (AC5, R23); (10) init_project calling init_layout twice (AC3); (11) init_project binding
      writer.init_layout at import time (AC3); (12) init_project giving "done" for an answer out of form (AC3); (13)
      the command not refusing inside a runtime (AC4); (14) the in_runtime check made before the parse (AC4); (15) the
      command calling the clock (AC4); (16) a refusal giving exit 0 (AC4); (17) the --json line without sort_keys
      (AC4); (18) an out-of-form answer printed (AC4); (19) cli.py importing writer (AC5); (20) a line of writer.py's
      write_handoff changed (AC5, the G3 diff script); (21) a line of launcher.py's end_outside changed (AC5, the G3
      diff script);
      twenty-one copies in all; each copy made in a scratchpad script at G3, not committed; the governor's evaluate at
      acceptance (the shadow) with any difference named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6]}
  - {gate: G3, check: constitution, args: [AC7, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
