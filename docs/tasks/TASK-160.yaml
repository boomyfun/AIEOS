acceptance_criteria:
  - AC1: >-
      Scope and bytes. The task commit changes only paths of the write set. evaluation_sources.py changes only what AC3 needs (the two imports, one path constant, one bound constant, the new step and its helpers, the provenance entries, the line that set intent_versions to None, and the docstring sentences that this task makes untrue, among them the first paragraph's list of what the module reads, the paragraph on load_sources, the list of reasons, the order of the checks and the sentence on the three files); every existing check of the module and its order stay. evaluation_policy.py differs only by one entry, src/aieos_bootstrap/intent_map.py, appended last to EVIDENCE_DEFINING_PATHS (eighteen entries, no duplicate), and the docstring sentences that keep its text true. test_evaluation_derive.py and test_evaluation_policy.py differ only by the pins of that tuple. test_evaluation_sources.py differs by the new tests of AC3, by the pins of that tuple, and by the changes that the new step forces: the stand-in scenario gains a contract file at the evaluated commit, and the pins of the imports, the provenance, the reads and their commits, the closed set of reasons and the open gap are updated. No check of base is removed or loosened; where a base test asserted the open gap "no producer", the new test asserts the open gap of a contract that names no entity. The build report lists every changed base test by name with one line of why.
  - AC2: >-
      The mapper. map_intent_versions(entities, dm_text) returns exactly the keys value and findings. value is a dict path to "v" and decimal digits for EVERY entity, with findings []; or value None with findings exactly ONE {reason, detail}; never a partial value. THE ORDER, over the entities in sorted key order: (1) entities is a dict (type dict) with 1 to 100 items and dm_text is a str, else reason argument (the bound of 100 is a resource bound, D-7163 Q3; 100 are accepted and 101 refused); (2) first every key and every value is checked to be a str, before any sorting (a non-str key or value: reason entity, fixed detail), then the checks over the entities in sorted key order: every key and value in form, else reason entity: a key is a str that the path rule of base_files accepts for a file path (base_files._names(key, 'path', False), the rule the loader's own read uses, D-7163 C3; a private name used as evaluation_sources already uses evaluation._task_commits, said in the docstring) and a value is a str that re.fullmatch of [0-9a-f]{64} accepts (exactly 64 lowercase hexadecimal characters, no trailing line feed; the script's "$" would take one, and the script never saw one because it read split lines); any Exception from base_files._names on a key, its _Stop among them, gives reason entity with a fixed detail naming the key's position in sorted order; base_files' rule accepts a name with a leading dot, so the mapper accepts such a key, and the loader refuses such a contract earlier (contract_at, reason contract); all entities are checked before any row is read; (3) the rows: the lines of dm_text.split("\n") that start with "| "; for each entity in order, the naming rows are those that hold the value as a substring; none: reason no_row. Each naming row must bind the value in at least one of the forms below, else reason form (the detail names the row id, the text between the first two "|", and the 1-based line number): (a) "`" path "` revision N (" value ")"; (b) "revision N (SHA-256 " value ")"; (c) a row that matches "^\| F[0-9]+ \| ", holds "SHA-256 " value exactly once and holds exactly one match of "`" path "`", an optional ",", a space, an optional "still ", "revision N" ending at a word boundary, that match starting before the "SHA-256 " value. The path is matched literally (escaped). N is [0-9]+ in forms (a), (b) and (c). The numbers of all bound rows are taken as integers; two different numbers: reason revisions; else the version is "v" followed by the integer in decimal. An N that cannot be converted to an integer gives reason form. The closed set of reasons is argument, entity, no_row, form and revisions; for each entity in sorted order the checks of (3) are no_row, then form, then revisions, and the first entity that fails ends the call. A row's status is not read; form (b) binds by the value alone; a row that names the value in a form and also elsewhere is not refused (the limits L1 to L3 of the script, carried in the module docstring). The docstring cites spec 2 section 6.2 (:175-:176), D-1130 and D-1131 and says "no new rule". The module starts no process, opens no file, reads no clock, environment or network, writes nothing, never raises an Exception (an unexpected one is refused with reason argument and a detail naming its type), mutates no argument, and every detail is cut to its first 200 characters. THE DIFFERENCES FROM THE SCRIPT: (1) the answer is all or nothing (D-7163 Q1); (2) the bound of 1 to 100 entities (Q3); (3) the key and value form checks of all entities before any row is read, the value check by re.fullmatch (a trailing line feed refused), and ASCII digits (Q4): digits are ASCII only (a row with a non-ASCII decimal digit as N gives reason form, where the script's pattern would take it), and a key or value out of form is a finding (the script asserted the value and did not check the key's path form), each of these two tightenings with its own test that shows the difference; (4) other reason names and detail texts and a closed set of reasons, a difference of form, new in this contract; (5) [0-9] also for the row id of form (c) (part of Q4).
  - AC3: >-
      The loader. load_sources keeps its name, signature, defaults, return keys and all existing steps in their order. After they pass (after evidence_comparison), the new steps run: (i) base_inputs.contract_at(repo, evaluated_commit, task_id, read); a refusal gives the loader's refusal with reason contract and the first finding as detail; the call is made with the loader's read argument as given (None means contract_at's own default, taken at call time). (ii) The test is "input_state" in contract, and st is that value. When input_state is absent, or st is a dict without intent_versions, or intent_versions is an empty dict, sources intent_versions stays None (the open gap that eval_inputs refuses at eval_inputs.py :233-:235; D-7119 C4, a task that names no path stays refused; the launcher writes intent_versions: {} at launcher.py :1661 and :1863). An absent st is treated like an empty mapping because such a contract names no entity, so D-7119 C4's rule for a task that names no path applies to it. When st is present and not a dict, a text such as "null" among them, or intent_versions is present and not a dict: refused, reason intent. (iii) Otherwise: more than 100 entities is refused, reason intent, before any further read; the decision matrix docs/pre-genesis/decision-matrix.md is read at policy_ref with base_files.read_file; map_intent_versions is called with the entities and that text; then each entity, in sorted key order, is read at policy_ref with base_files.read_file and the SHA-256 of the UTF-8 bytes of its text must equal the contract's value. Every failure of (iii) is a refusal with reason intent: the DM not read, the mapper's finding (the detail begins with its reason), a traced file not read (missing, not a file, not UTF-8, over base_files' bounds) and a traced file whose bytes differ (the detail begins with "stale"). The loader's read argument is passed to every base_files.read_file call of (iii), and each refusal of a read gives reason intent. An unexpected Exception in the new steps gives reason argument, as today (the existing handlers of load_sources). A refusal is never partial. On success sources intent_versions is a fresh dict of the mapped versions. PROVENANCE, in this order: the three policy files and the pin as today; then {contract: the SHA-256 that contract_at gave, commit: evaluated_commit}; then, only when mapped, one {path, commit, blob, sha256} for the decision matrix and one for each entity in sorted key order, all at policy_ref; then {source: intent_versions, state: "mapped", versions: a second fresh dict} when mapped, or {source: intent_versions, state: "open gap: the contract names no entity"} when not. No container is shared between two places of the answer. The closed set of reasons gains exactly contract and intent. Every answer is still checked once by plain_data_problem, and no Exception leaves the function.
  - AC4: >-
