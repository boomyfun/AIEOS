acceptance_criteria:
  - AC1: >-
      The low plan. After the change the contract text that `aieos run` writes for the single-task (low) form has, in its verification_plan, exactly these four entries in this order: "  - {gate: G0, check: scope}", "  - {gate: G1, check: build}", "  - {gate: G2, check: lint}", "  - {gate: G3, check: review, args: [AC1, AC2]}"; the lint gate has no args; 'risk' stays "low". The drafting form (`_RUN_DRAFTING`) is byte-for-byte unchanged: its risk stays "critical" and its plan stays G0 scope and G3 review over AC1 to AC4. The change in launcher.py is the one 'gates' string of `_RUN_SINGLE` and one comment line naming DEF-0118; `_RUN_TAIL`, `_RUN_HEAD`, `_run_contract` and every other line are unchanged (the diff is brought at acceptance).
  - AC2: >-
      The tests. In tests/unit/test_cli_run.py the three places that hold the gate text (lines 83, 180, 370 at the base commit) gain the line "  - {gate: G2, check: lint}" between the G1 and G3 lines, and the docstring of test_the_texts_parse (lines 364-367) says "its G1, G2 and G3 gates"; these edits, the one new assertion of AC3, the addition of ac_coverage to the module's import from aieos_bootstrap (lines 20-21) and nothing else are the changes to existing tests, each listed at acceptance. No new test file; no test in tests/ runs git init or a subprocess or touches this repository's real state.
  - AC3: >-
      The new assertion and the validators. In test_the_texts_parse, for the low text: the verification_plan of the mapping that base_inputs._parse_contract_text gives holds the gate G2 with the check lint exactly once, with no args (task_contract.parse_contract returns no plan, task_contract.py:261-262; its parse still gives no finding, as the existing assertion says); and `ac_coverage.check` of that mapping gives no finding (every AC of the contract is named in the args of G3 review, so the lint gate adds no uncovered or stray_arg finding). A reading, recorded at acceptance, shows that ac_tests.py:173 acts only on a gate G2 whose check is tests, so the lint gate is ignored there (the raw Grep output is brought). If that mapping does not give acceptance_criteria, verification_plan and constitution in ac_coverage's form, the task stops and the finding comes to the decision agent; no src file is changed to fit it.
  - AC4: >-
      The record of the lint gate (the statement of D-5746 Q3). No governor, evaluation, conformance or records-maker code is changed by this task. The gate id G2 for the lint step comes from the default plan (conformance-scenarios-initial.md:11); G2 means "tests" in the high contracts (docs/tasks/TASK-128.yaml:91) and "lint" in a low contract, and a low plan has no tests gate, so the two meanings do not meet in one contract. Governor.py:426-431 turns each plan gate into a required passing CI record: the records step of the first real low run must map the CI lint step (aieos-checks.yml:1880) to the gate G2, as the step22 lint record of docs/records/TASK-124.jsonl to TASK-128.jsonl (line 17 of each) does; the proof comes at that first real run and is not required of this task. The acceptance names this statement.
  - AC5: >-
      Purity and the suite (INV-001, INV-002, INV-004). No new import, process form, clock read or file access in src; the changed text uses none of the words MEASURED, ENFORCED and GUARANTEED and no string constant in a changed src file is exactly "valid", "accepted" or "approved"; the pinned phrases of the launcher.py docstring and the tests that pin the run text keep passing; the whole suite passes locally (`timeout 110 python tests/run_tests.py < /dev/null`, in slices if it does not finish) and on the CI, and pyflakes (the CI's pinned lint step) is silent on src and tests. The raw output of the full unit suite and of pyflakes is brought unedited. The first run is on the task branch.
  - AC6: >-
      Class and evidence. The risk class is high; the evidence profile is that of assurance-model section 5 for high, as for TASK-125 to TASK-128 (unit_test, integration_test, deterministic_rule, static_security_analysis, ai_review by a pair of reviews on Haiku 5.5, labelled same-vendor and not cross-model (D-5746 C3), with the profile's ai_review (cross-model) entry met or stated as a departure at acceptance as for TASK-128, a per-article review, and a separate decision_agent_review, plus the profile's other entries; the integration_test entry is met as TASK-128's acceptance met it, named at this acceptance, or its absence is stated there as a departure); the expected governor shadow result at the GOV-003 row is a stated departure as in TASK-125 to TASK-128 (the change class is critical_cr; the acceptance names it). The raw output of the step 'GOV-003 base tests (report only)' of the task-branch run is brought at acceptance with each base-test failure named.
  - AC7: >-
      Limits and the closing of DEF-0118. No change to any file outside the write set; no change under .github/; no docs, spec or DEF file in the task commit. DEF-0118 may be closed only at this task's acceptance: follow-up 1 is done (TASK-124), follow-up 3 of the Log's numbering (what counts as lint for a docs-only change) is closed (D-5306, row A76), and follow-up 2 (this task) is done by it; the acceptance decision must state that bullet 3 of the "Follow-ups owed" list (the re-evaluation of TASK-116 with evidence bound to T b202e609) is a standing condition and not owed work, and the DEF Log line uses the Log's numbering of the follow-ups and names that bullet. If the acceptance does not state this, DEF-0118 stays open with follow-up 2 logged as done. No launching of a runtime; no change to the autonomy level or the measurement protocol.
