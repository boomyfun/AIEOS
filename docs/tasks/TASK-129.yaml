# Task contract TASK-129 (DRAFT r2 for approval; DEF-0118 follow-up 2, the plan that `aieos run` writes for a low contract follows the default plan; plan approved at D-5746, plan file sha256 d50c49ed640a5cbe3b100ac7b261e8a2e3b0184739e69c6f496f687618137c1e; session 7d0b3852, 2026-11-12). Drafted in the scratchpad; whether this text is approved is recorded only in the decision agent's decision that names its SHA-256, not in this file. Form: TASK-127 (docs/tasks/); the worker's own claim until checked.
# Why: the plan that `aieos run` writes for a low contract names G0 scope, G1 build and G3 review but no lint gate (launcher.py:1827), although the default plan of the low class is G0 scope, G1 build, G2 lint (docs/pre-genesis/conformance-scenarios-initial.md:11; assurance-model.md section 5, line 78) and the CI now produces the lint entry (TASK-124, the step "lint (pyflakes 4.0.3, pinned by version and hash)" at .github/workflows/aieos-checks.yml:1880). Without the gate a run-made low contract cannot show the whole default plan (DEF-0118 :13 and :22; Blocks v0.1: yes; scheduled before the first real run).
# Not in this task: the drafting plan (`_RUN_DRAFTING`, risk critical, G3 only), `_RUN_TAIL`, the validators (ac_coverage.py, ac_tests.py, conformance.py, governor.py, evaluation.py), the CI and every file under .github/, the records maker's mapping of the lint step to a gate, a probe of the governor with a G2 lint record (D-5746 Q3), what counts as lint for a docs-only change (closed by D-5306, row A76), the re-evaluation of TASK-116 (DEF-0118 :23, a standing condition and not owed work), and any doc, spec or DEF file (DEF-0118's Log line and status are changed at the acceptance by the records change-set, in the Log's numbering of the follow-ups).
# Risk, change class: high, as TASK-125 to TASK-128 (launcher.py:1821-1829 is the template of every contract `aieos run` writes, and governor.py:426-431 makes each plan gate a required passing CI record); not critical: no governor, secrets or CI change; the change class is critical_cr because the CI's EVALUATOR list holds src/aieos_bootstrap/** and the tests folders.
