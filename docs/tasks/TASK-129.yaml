objective: >-
  In src/aieos_bootstrap/launcher.py change the 'gates' text of `_RUN_SINGLE` (line 1827) from
  "  - {gate: G1, check: build}\n  - {gate: G3, check: review, args: [AC1, AC2]}\n" to
  "  - {gate: G1, check: build}\n  - {gate: G2, check: lint}\n  - {gate: G3, check: review, args: [AC1, AC2]}\n",
  so that the plan written for a low contract is G0 scope, G1 build, G2 lint, G3 review over AC1 and AC2 (the lint gate carries no args). Nothing else in launcher.py changes except one comment line naming DEF-0118. In tests/unit/test_cli_run.py add the line "  - {gate: G2, check: lint}" between the G1 and G3 lines at lines 83, 180 and 370, change the docstring of test_the_texts_parse (lines 364-367) from "its G1 and G3 gates" to "its G1, G2 and G3 gates", and add one assertion to test_the_texts_parse: the verification_plan of the mapping that base_inputs._parse_contract_text (the parser the test already calls) gives for the low text holds the gate G2 with the check lint exactly once, and `ac_coverage.check` of that mapping gives no finding.
