#     before any callee call (gitread.py :77-83); a refusal by it or by the root pattern gives
#     "refused" with reason "argument" and zero callee calls; the module imports no os (AC10; disp86c row 7).
#   - end(root, task_id, session_id, fencing_token, now, release_lease_token=None, end_session=None): adapter.end's
#     result, passed through. adapter.end returns before end_session when the release raises or is refused with a
#     reason other than "none" or "token" (adapter.py :250-262), so the session row then stays open for `aieos end`
