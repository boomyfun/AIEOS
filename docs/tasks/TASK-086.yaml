#   Every callee is a keyword argument whose default is taken at call time, in adapter.py's form (:25-29).
# - In src/aieos_bootstrap/execution.py, by added lines only, one public function task_view(log, root, task_id, now,
#   held=None): ({task_state, log_seq, approved_contract_hash}, None) or (None, findings), over the log bytes given
#   (as task_states takes them, execution.py :59-66), by execution's own _log, _project and _state and the last line's
#   seq, as execute compares them (execution.py :335-345, _agree :264-271; _log :201, _project :213, _state :243)
#   (D-2673 ruling 3; disp86 rows 9, 10); a state such as DONE is returned, and the launcher stops on it (row 17); it
#   adds no import and names nothing tests/unit/test_execution.py :704-727 refuses.
# - What it does not do: it starts no runtime, places no hook, changes no setting, opens no store (open_store is the
#   caller's, adapter.py :50), writes no observed read-set record in any case, and runs no CLI; adapter.py, writer.py,
#   resume_check.py and the readers are not changed. The observed read-set record before every lease release
#   (specification 7 :45, specification 5 :112; read_set_record.py :19-24) is TASK-089's at all three call places:
#   the normal end (read_set_record.observe before adapter.end), the gone session's record at the end after a
#   violation or an expiry, and the gone session's record at the next start (specification 5 :125), with the stored
#   reads' removal (D-2681 Q1; disp86 rows 1, 3).
#
# The rulings (D-2673, D-2675, D-2681), each this task's choice (proposed):
# - With max_risk null the Resume Check's check 7 fires with "the runtime has no declaration" (resume_check.py
#   :632-635), so no lease is granted; the decision is the highest fired one by ORDER (:53-54), which may be "STOP:
#   scope invalid" (check 2, :572-574) or, for inputs out of form, an error record with decision null (:521-530)
#   (disp86 row 5). max_risk is the caller's: passing a non-null max_risk declares the runtime's tier, which only the
#   owner's measurement can back (C6, P-LOC); the self-build passes null until then, so no lease is granted; tests
#   pass a tier only to exercise the path (D-2673 ruling 2; D-2681 Q3).
# - DEF-0099 closes here: on the grant path a dependency not DONE makes check 5 fire BLOCKED (resume_check.py
#   :596-606), so no grant. A dependency's stale_evidence does not prevent a grant: check 5 reads only its state
#   (:601-604), stale_evidence is checked for form only (:245-250); stated, as DEF-0100 carries it.
# - AIEOS_BASE is the head_commit read once; that HEAD is the base branch's tip is not checked, and the root and its
#   Git state being untouched by the change and check 0 of the contract stay stated, for a later task (specification
#   7 :49, specification 5 :121; D-2673 ruling 5).
# - The log is read twice: once by the launcher, whose bytes go to task_view and log_inputs, and once by execute; a
#   change between the reads gives execute's "inputs" refusal (execution.py :342-345), which fails closed (D-2677 C4;
#   disp86 row 9).
#
# Stated limits: the observed read-set record at its three call places (the normal end, the gone session's record at
# the end after a violation or an expiry, and at the next start, step (1) of specification 7 :47) and the stored
# reads' removal are TASK-089's (D-2673 ruling 1; D-2681 Q1), so launching with a runtime, the owner's act, is not to
# happen before TASK-089 lands; this is a statement, not a lock, carried in the repository by DEF-0101 (below); the
# store is the caller's (open_store); the base's limits above; the log read twice; adapter.end's early return leaves
# the session row open (above); code_sha256 is the hash of HEAD's resume_check.py, not of the imported module that
# runs, so the record's engine identity may differ from the executing code (disp86 row 13); two starts of one task in
