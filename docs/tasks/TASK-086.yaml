# and starting no runtime (specification 7 revision 2, section 5; specification 5 revision 5, section 11 point 7;
# specification 3 revision 5, sections 1 and 2; DEF-0097; DEF-0099; M7's sixth task, split by decision D-2673: the gone
# sessions' records, specification 5 point 10, are TASK-089's). Plan: decisions D-2672 to D-2692 (session 3797498a;
# disp86c row 9):
# the scope note (MYSP/t86/scope86.md) with the eight rulings of D-2673 and the shape of D-2675, the pin scan
# (MYSP/t86/pinscan86-out.txt at f216376e and its reading MYSP/t86/pinscan86-reading.md, D-2674, D-2675), the risk run
# (MYSP/t86/risk/risk_class86.py: high), the forbidden list (MYSP/t86/forbid86.txt, execution.py left out).
#
# Scope:
# - A new module src/aieos_bootstrap/launcher.py with two public functions:
#   - start(root, repo, task_id, adapter_name, max_risk, holder, recorder, now, expires_at, read=None, read_log=None,
#     expire=None, start=None, end=None, check=None, append=None, grant=None, release=None, held=None,
#     start_session=None, end_session=None, release_lease_token=None): returns a mapping with exactly START_KEYS,
#     never raises. In order (specification 7 :47's order without its first step, D-2673 ruling 1; renumbered,
#     disp86 row 8):
#     (2) the core's expiry, expire(root, now) (writer.expire_leases; specification 5 :112 "the core's expiry runs
#         before a grant", adapter.py :50-51 leaving it to the caller);
#     (3) HEAD, read once through read by gitread's fixed form "rev-parse --verify --end-of-options HEAD" (gitread.py
#         :91-92); an answer that is not exactly 40 lowercase hex characters gives "refused" (the form the hooks
#         require of AIEOS_BASE, claude_code_pretool_hook.py :26; disp86 row 11);
#     (4) the log, read once by read_log(root) (writer.read_log), then execution.task_view over those bytes; task_view
#         findings (an expired or malformed lease, a log check_log refuses, no task.approved; execution.py :217-218,
#         :234-260) give "refused" with those findings; then, in this order, a task IN_PROGRESS (a lease still held
#         after the expiry) gives "not granted" with reason "held", and any other state outside READY and REWORK gives
#         "not granted" with reason "state" and the state in the result's findings; all three before adapter.start,
#         with no session row opened and no end (D-2681 Q2; disp86 rows 2, 17; disp86c rows 3, 4); a lease taken
#         between task_view and execute is refused by execute's "inputs" check (execution.py :264-271), so the start
#         fails closed and keeps or releases no other session's lease (disp86c row 6);
#     (5) the session id, "launch-" followed by the first 32 hex characters of the SHA-256 of
#         "<task_id> <now.isoformat()> <head_commit>" (D-2673 ruling 8), so of the form [A-Za-z0-9._-]{1,128} with
#         no "/" (mcp_server.py :19; read_set_record.py :28-29);
#     (6) the 22 inputs at HEAD: resume_inputs.git_inputs (ten), resume_log_inputs.log_inputs (seven), and the five
#         the launcher gives: task_id (the argument), runtime {adapter: adapter_name, max_risk: max_risk} (both the
#         caller's, D-2673 ruling 2; D-2681 Q3), and log_seq, task_state and approved_contract_hash from task_view;
#         code_sha256 the SHA-256 of src/aieos_bootstrap/resume_check.py's text at HEAD encoded as UTF-8, read by
#         base_files.read_file (D-2673 ruling 4; the quantity the CI pins, aieos-checks.yml :127, :135);
#     (7) adapter.start(root, task_id, session_id, holder, inputs, code_sha256, expires_at, recorder, now, …), which
#         opens the session row and runs execution.execute: the Resume Check, its record and state effect, and the
#         grant on CONTINUE or CONTINUE_WITH (adapter.py :132-165);
#     (8) when adapter.start's result holds no fencing token, adapter.end(root, task_id, session_id, None, now) at once
#         (specification 5 :112 "a start without a grant is ended at once"), when the session row was opened: by
#         adapter.start's result form, the row was opened unless its reason is "argument" or "session"
#         (adapter.py :146-153, against :155-165) (reading, D-2677 C2); a raising start_session also gives "session"
