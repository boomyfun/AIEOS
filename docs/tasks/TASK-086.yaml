#     fencing_token, environment ({AIEOS_SESSION_ID, AIEOS_ROOT, AIEOS_BASE} on a grant only, AIEOS_BASE the
#     head_commit, the names the hooks and the MCP server read, claude_code_pretool_hook.py :130-132, mcp_server.py
#     :94-95, :357), the adapter.start result and the adapter.end result. root must be an absolute path (a drive
