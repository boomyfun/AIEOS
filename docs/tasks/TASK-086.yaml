constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The arguments and the callees: start's root (an absolute path by the pattern of the header), repo (an
      existing absolute directory, as gitread.form_error requires; the unit stand-ins use the repository's own root),
      task_id (TASK-<digits>), adapter_name, max_risk (null or one of low, medium, high, critical), holder, recorder,
      now and expires_at (timezone-aware UTC whole seconds, expires_at after now) and every callee (None or callable)
      out of form (a relative root such as "x/y" among them) give a result "refused" with reason "argument" and zero
      callee calls; launcher.TIMEOUT equals 30, and repo is checked, before any callee call, by
      gitread.form_error(repo, ["rev-parse", "--verify", "--end-of-options", "HEAD"], launcher.TIMEOUT), a repo it
      refuses giving "refused" with reason "argument" and zero callee calls, and the HEAD read is made with that form
      and launcher.TIMEOUT (disp86c row 7; D-2695 C1); a HEAD answer that is not exactly 40 lowercase hex characters
      gives "refused" with no later
      callee call; every callee defaults, at call time, to its named function (a patch after import is the one
      called); every read is one of gitread's fixed forms (gitread.form_error gives None for each
      recorded call with its repo, args and timeout).
  - AC2: >-
      The order, by recording stand-ins: expire, then read (HEAD), then read_log, then held (task_view's lease check,
      the one held call before adapter.start), then the readers' reads, then adapter.start, then adapter.end when no
      token was granted and the row was opened; execute's own second read_log and held calls, made inside
      adapter.start, are allowed after adapter.start begins (disp86c row 5); after any refusal or "not granted" before
      adapter.start, no later callee is called; expire runs before
      adapter.start in every run that reaches it.
  - AC3: >-
      The session id: exactly "launch-" followed by 32 lowercase hex characters, the first 32 of the SHA-256 of
      "<task_id> <now.isoformat()> <head_commit>"; of the form [A-Za-z0-9._-]{1,128}, holding no "/"; the same
      arguments give the same id; a start_session refusal ("started") gives a result "refused" with adapter.end not
      called.
  - AC4: >-
      The inputs given to adapter.start: their keys equal resume_check.INPUT_KEYS; the ten and the seven are
      git_inputs' and log_inputs' at HEAD; task_id is the argument; runtime is {adapter: adapter_name, max_risk:
      max_risk}; log_seq, task_state and approved_contract_hash equal execution.task_view's; code_sha256 is the
      SHA-256 of the stand-in resume_check.py text at HEAD encoded as UTF-8, the stand-in text holding non-ASCII
      characters, and differs from the hash of that text in latin-1 (with replacement) and in UTF-16 (disp86 row 7); a
      reader's findings give a result "refused" with no adapter.start call.
  - AC5: >-
      The grant path, with the real resume_check, a Repo-style stand-in read (in tests/unit/test_resume_log_inputs.py's
      form) and writer stand-ins (disp86 row 12): a declared max_risk covering the task risk, a READY task with every
      dependency DONE and inputs where no check fires but CONTINUE or CONTINUE_WITH (resume_check.py :53-54) give a
      result "granted" with the fencing token and environment exactly {AIEOS_SESSION_ID: the session id,
      AIEOS_ROOT: root, AIEOS_BASE: head_commit}; adapter.end is not called.
  - AC5b: >-
      The held and state refusals (D-2681 Q2): with a held lease that is unexpired after the expiry, so task_view
      gives IN_PROGRESS, start gives "not granted" with reason "held"; with a log giving DONE (or another state
      outside READY and REWORK), start gives "not granted" with reason "state" and the state in its findings; in both,
      by recording stand-ins, adapter.start, start_session, release and end are called zero times and no environment
      is given. Each case asserts its reason word ("held" or "state") (disp86c row 3; D-2693 C2).
  - AC6: >-
      No grant: max_risk null with inputs where checks 1 to 6 do not fire (the Repo-style stand-in of AC5) gives check
      7 fired with "the runtime has no declaration" and decision "STOP: runtime insufficient" (resume_check.py
      :632-635), a result "not granted", no environment, and adapter.end called once with no token; a dependency
      whose state is not DONE, with a max_risk covering the task risk, gives check 5's BLOCKED (resume_check.py
      :596-606) and no grant, so DEF-0099's re-check holds on the grant path (disp86 row 5).
  - AC7: >-
      Failing closed: a raising expire, read, read_log or reader, an expiry answer out of form, task_view's findings
      (an expired or malformed lease, a log check_log refuses, no task.approved), which give "refused" with those
      findings, no adapter.start call and no adapter.end call (disp86c row 4), a HEAD answer that is not exactly 40
      lowercase hex characters, adapter.start refused before the session row (reason "argument" or
      "session", a raising start_session among them) or after it ("core"), and adapter.end refused give a result
      "refused" or "not granted" with findings and no environment; adapter.end is called exactly when the row was
      opened (reason neither "argument" nor "session") and no token was granted, so a raising start_session's row is
      not ended (disp86 row 16); no call raises.
  - AC8: >-
      end: adapter.end's result passed through for a token and for none; its callees default at call time; when the
      release raises or is refused with a reason other than "none" or "token", the result is refused and
      end_session is not called, so the session row stays open (adapter.py :250-262; disp86 row 6).
  - AC9: >-
      execution.task_view over the log bytes given: READY after task.approved, IN_PROGRESS under an unexpired held
      lease, a state such as DONE returned as it is (execute refuses such a state with reason "state", execution.py
      :346-348), a lease out of form or expired gives findings, a log check_log refuses gives findings, no
      task.approved gives findings, log_seq the seq of the log's last line, approved_contract_hash the last
      task.approved's contract_hash; it equals what execute compares (an execute run with those inputs is not refused
      with reason "inputs") (disp86 rows 9, 17).
  - AC10: >-
      The modules: by ast over pathlib's read_bytes, execution.py's import set is exactly the one its tests pin
      (tests/unit/test_execution.py :704-727 unchanged and passing), and the existing lines are unchanged (checked at
      review from C..X); launcher.py imports only datetime, hashlib and re of the standard library (datetime for
      AC1's time checks, as adapter.py :56, :82-84; disp86 row 4) and aieos_bootstrap's
      adapter, base_files, execution, gitread, resume_check, resume_inputs, resume_log_inputs and writer, and names no
      open, exec, eval, compile, __import__, subprocess, os, sys or time, no attribute environ, getenv, now, write or
      open_store, and no ".aieos" string; tests/unit/test_writer.py :397-412 passes.
  - AC11: >-
      Over this repository (an integration test through gitread.run, the repository found by pathlib; it needs the
      full history): start for TASK-088 with a stand-in read that answers only the exact args ["rev-parse",
      "--verify", "--end-of-options", "HEAD"] with f216376e75a25945d9056d195e7282b589457a0b and forwards every other
      call to gitread.run(repo, args, timeout) unchanged, the test asserting that rev-list, diff-tree and cat-file
      calls were made and forwarded (disp86c row 2; D-2699 C1), with a log stand-in holding TASK-088's task.approved
      bearing docs/tasks/TASK-088.yaml's contract hash at that commit, writer stand-ins and max_risk null: code_sha256
      equals e1578939404da0b61d56d9187521b92c923e7cb841acdf15d0afb7155605a135 (the CI's pinned Resume Check,
      aieos-checks.yml :135); the inputs' keys equal resume_check.INPUT_KEYS; the decision record's checks hold check
      7 fired with "the runtime has no declaration"; its decision equals "STOP: scope
      invalid" (check 2, resume_check.py :572-574: TASK-088's commits since its base are not submitted in the
      stand-in log); no lease is granted and adapter.end's stand-in is called once (disp86 row 5).
  - AC12: >-
      Every existing test passes, the pins of the header among them; adapter.py, writer.py, resume_check.py and the
      readers are unchanged; the full suite runs locally in three unit parts, integration and property before the
      first code commit; the deterministic rule's local run gives no finding. launcher.py's docstring holds,
      whitespace read as single spaces, "starts no runtime", "never raises", "writes no observed read-set record",
      "not before TASK-089 lands", "the store is the caller's", "max_risk null never grants", "AIEOS_BASE is the
      head_commit", "the log is read twice" and "this task's choice"; execution.py gains a docstring paragraph naming
      task_view and "TASK-086", its kept phrases unchanged: "it gathers no Resume Check input", and, as
      tests/unit/test_resume_log_inputs.py :517-518 pins them, "execute itself still gathers no Resume Check input",
      "task_states", "rework_count" and "TASK-088" (disp86 row 18); every new test names "TASK-086 ACn".
  - AC13: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) launcher.py binds a callee at import
      time (AC1); (2) launcher.py runs expire after adapter.start (AC2); (3) launcher.py makes the session id with a
      "/" (AC3); (4) launcher.py gives runtime max_risk "critical" whatever the argument (AC4, AC6); (5) launcher.py
      gives the environment on a refusal (AC6, AC7); (6) launcher.py does not call adapter.end on no grant (AC6);
      (7) launcher.py calls adapter.end after a "session" refusal (AC7); (8) launcher.py raises on a raising read
      (AC7); (9) launcher.py hashes the decoded resume_check text with another encoding (AC4; disp86 row 7); (10)
      execution.py's task_view gives READY under a held lease (AC9); (11) execution.py gains an import (AC10); (12)
      launcher.py's end drops adapter.end's findings (AC8); (13) launcher.py drops both the "held" refusal and the
      state refusal for a task IN_PROGRESS, so adapter.start is called on it (AC5b's held case); (14) launcher.py drops
      the refusal of a state outside READY and
      REWORK (AC5b); each copy made in a scratchpad script at G3 (brk86, as
      brk85b), not committed; copy (11)'s text is shown failing AC10's ast check; the governor's evaluate at
      acceptance (the shadow) with any difference named; the stated choices in the records (not tests).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1200k, wall_time: 6h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC5b, AC6, AC7, AC8, AC9, AC10, AC11, AC12]}
  - {gate: G3, check: constitution, args: [AC13, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
