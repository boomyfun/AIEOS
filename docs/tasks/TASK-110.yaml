acceptance_criteria:
  - AC1: >-
      The sixth form. gitread.SUBCOMMANDS is ('cat-file', 'diff-tree', 'rev-list', 'rev-parse', 'status', 'config') bound once as a literal tuple (the workflow's revision 17, W3, accepts exactly this six-tuple and no
      longer the five that revision 16 accepts). The form is a module constant CONFIG_LIST = ['config', '--list', '-z'] and form_error accepts the config subcommand only when args equals CONFIG_LIST exactly (no further argument, no other
      option, no other order). form_error gets an explicit `elif sub == 'config'` branch AND an explicit `elif sub == 'status'` branch, and any other subcommand name is refused before any process starts (a test passes a
      seventh unknown name that the SUBCOMMANDS pin does not hold and one that is injected into SUBCOMMANDS by the test to show that no branch falls through). gitread.py gains no import, no new os attribute or os call, no
      literal of the state directory's name, and still calls subprocess.run once; every other form, FIXED_OPTIONS and environment() are unchanged. The docstring lists the sixth form, says six read-only subcommands, and
      replaces the filter-route limit of the fifth form with the statement that the launcher now reads the configuration first.
  - AC2: >-
      The configuration read. launcher.start, in the step "root" (after the step "base", before the log read), reads the config form once through the same read callee (read(repo, args, TIMEOUT)) BEFORE the status read;
      a clean answer (b'' or records none of which is a refused key; exit 0; error None) goes on to the status read exactly as in TASK-109; the gone sessions' records and the expiry still run before it; a refusal or a
      non-grant at the config read opens no session row, no lease, no adapter.start or end, calls neither the status read, read_log nor held, and returns head_commit. The arguments check is unchanged.
      `launch_outside` is unchanged.
  - AC3: >-
      The outcomes. The parser is a private pure function of launcher.py, _config_keys(output), returning (refused_keys, None), where refused_keys is the list of refused key bytes in output order (possibly empty), or (None, finding); it raises nothing and is covered by tests with stand-in answers only. A
      record is the bytes up to a NUL; the output must end in a NUL (the answer split on NUL ends with an empty element; b'' is zero records); a record is split at its FIRST newline into key and value; a record with no
      newline is a key with no value; an empty key is a finding. A key is matched on bytes: ASCII-lowercased, it begins with b'filter.' or equals b'core.worktree'. Any such key gives "not granted" with the reason "root"
      and the findings 'root: configuration names filter driver or work tree keys: <n>' (n the number of all refused keys, both kinds together) and at most 20 lines 'root: key ' + repr(key[:80]) (the cut is applied to the bytes before repr; the lines are the first 20 refused keys in output order; never a value; a test
      with a value that looks like a credential shows that no value appears in findings, records or logs). A key line may show a user-chosen subsection name (the key only). Order of judgement: (0) the answer is a mapping with error None and exit 0, else "refused" with the finding 'root: git config gave no answer (%r)' of (error, exit) for a mapping and of the answer's type name otherwise, never the answer itself or its output; (1) the answer's output is bytes; (2) the output ends in a NUL (b'' is zero records) and every record has a non-empty key, all records scanned; (3) only then the refused keys: a malformed answer gives "refused" whatever keys it holds; the findings of a refusal are fixed texts that hold no byte of the answer ('root: the configuration answer is not bytes', 'root: the configuration answer does not end in NUL', 'root: the configuration answer has an empty key'). "refused" with the reason "root" and a 'root: ...' finding for: an answer that is not a mapping, error not
      None, a non-zero exit, output that is not bytes, a non-empty output not ending in NUL, an empty key. A raise in the config read gives "refused" with the reason "root" (the existing step guard). The status read keeps
      TASK-109's outcomes unchanged.
  - AC4: >-
      The order and the call bounds. Tests show: the config read is the third read (after HEAD and the base tip), the status read the fourth, then read_log: the callee names begin ['expire','read','read','read','read',
      'read_log','held', ...] on a granted path; a refusal or non-grant at the config read ends the callee names at ['expire','read','read','read']; a refusal or non-grant at the status read ends them at
      ['expire','read','read','read','read']; no later callee is called; the gone sessions' callees still come first; the argument list passed to the config read equals list(gitread.CONFIG_LIST) and to the status read
      equals list(gitread.STATUS_HEAD) + [':(exclude)' + writer.STATE_DIR]. The launcher module docstring has the step 3b amended and states the limits in plain words.
  - AC5: >-
      The pins and the tests. tests/unit/test_gitread.py: the import and attribute pin is unchanged and passes; the SUBCOMMANDS pin is amended to the six; added tests, each docstring naming 'TASK-024 ACn' with
      'amended by TASK-110': the accepted config form; each deviation refused (a table); no fall-through; the real-command shape. tests/unit/test_launcher.py: the Repo stand-in answers the config form (clean by default; a
      filter key, a core.worktree key, a key with different case, a valueless key, a key with a newline in its value, and malformed answers settable); the callee-order pins are amended as in the header; added tests, each
      docstring naming 'TASK-086 AC1 (amended by TASK-110)' or the AC it amends: clean continues; a filter key and a core.worktree key give "not granted"/"root" with the cap and the repr; each refusal kind; the order; no
      later call; a raise; no value in findings; keys such as 'filterx', 'core.worktreex', 'xfilter.a' and 'core.bare' do NOT match. Added tests: a refused key followed by an empty record, and a refused key with no final NUL, both give "refused"; no finding of the config read contains any byte of a value of the test inputs (the values are obviously fake and not secret-shaped: none of ghp_, github_pat_, gho_, sk-, AKIA, nor a PEM key header). tests/unit/test_launcher_gone.py: ok_head answers the config form with b''. In
      tests/integration/test_launcher_repo.py the Intercept answers the exact config form with b'' and every other read is forwarded unchanged. tests/integration/test_gitread_repo.py gains one test that runs
      gitread.run on the repository's own clone with list(gitread.CONFIG_LIST) and asserts error None, exit 0 and that the answer parses by the launcher's parser, whatever it holds (it shows that the git in use accepts the form and that the answer is in the parser's form); the test prints nothing; no assertion compares or shows the output, err or any key or value of the answer; it asserts only error is None, exit == 0 and that the parser's finding is None, each with a fixed message; no added test prints, and no assertion message carries an answer's output beyond what findings hold; no test makes a temporary repository, starts a process itself or writes into the repository.
  - AC6: >-
      The stated limits. The docstrings of gitread.py and launcher.py state, in plain words, the limits of the header (1) to (7); the stale phrases are updated: launcher.py :145-:147 on the workflow's SUBCOMMANDS check
      ("a later decision under DM A66 narrows it to the five", done by the workflow's revision 16; now: the six after W3), and gitread.py :5 ("five read-only subcommands" becomes six) and :56-:63 (the filter route is
      now refused by the launcher's configuration read; the sentence 'was not taken' is replaced); also gitread.py :54 ("none of the five subcommands runs a hook" becomes six) and launcher.py :128-:145, limits (1), (3) and (5): limit (1) says two reads, the configuration and then the status, made one after the other and not atomically; limit (3) takes specification 7 revision 8's wording that the user's own global ignore file is "meant not to be read"; limit (5) says that the configuration read refuses filter.* and core.worktree keys and keeps the limits of the header (2) and (3); the header paragraph that begins 'Departures from the contract' lists these places and those that follow; also gitread.py :19-20, where the pinned phrase "the CI workflow's revision 8" stays byte-exact and the sentence around it says "now revision 17", and gitread.py :56, where the pinned phrase 'no caller exists yet' stays as a quotation of the TASK-024 text and the sentence says that the launcher has called gitread since TASK-086; the unpinned test docstrings test_gitread.py :107-:113, test_launcher_gone.py :372-:376, test_launcher_repo.py :3 and test_gitread_repo.py :2. DEF-0101's Log line and any Log line of DEF-0095 or DEF-0105 whose text changes are written by their own decisions
      after landing.
  - AC7: >-
      Parity and purity (INV-001, INV-002, INV-004). tests/conformance/, the native ports, the CI files, writer.py, cli.py, base_files.py, base_inputs.py and every file of the forbidden list are unchanged; no new import in
      either src file; no new process form beyond the one config form; the state directory's name appears as a string in no changed src file; the new docstrings and findings use none of the effect labels MEASURED,
      ENFORCED and GUARANTEED (OPS-003's rule allows them only on a line that cites a decision-matrix row), and no string constant in a changed src file is exactly "valid", "accepted" or "approved"; the deterministic
      rule (including revision 17's SUBCOMMANDS check on gitread.py), OPS-003, SEC-001, SEC-002 and bandit report no finding at the task commits.
  - AC8: >-
      The CI evidence. On the aieos-checks and aieos-native runs of the accepted commit every job and step is successful, read by run id (the task branch is pushed only after W3 is on main); on main after the records
      commit likewise. Each push and each GitHub job-data read is a decision of the decision agent, outside the capabilities above.
  - AC9: >-
      The records (L-0034, L-0037). The task's evidence records' forms are built and checked through records.check_record and a governor shadow over a dry records list at the approval request, with their raw output:
      per-article records, and the profile entries of risk high; the expected result is NEEDS_REWORK at the GOV-003 row as in TASK-102 to TASK-109, stated in the acceptance as a departure. The contract's budgets and exit
      conditions are printed at the first step of the work (L-0037).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1500k, wall_time: 8h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC7]}
  - {gate: G3, check: constitution, args: [AC6, AC8, AC9, INV-001, INV-002, INV-003, INV-004, INV-009, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts AND the aieos-checks and aieos-native runs of the accepted commit succeed
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
