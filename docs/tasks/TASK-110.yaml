contract_version: v1
task_type: implementation
objective: >-
  Build specification 7 revision 8's configuration read: gitread gains a sixth read-only subcommand, config, in one fixed form (the constant CONFIG_LIST = ['config', '--list', '-z'], accepted only by exact equality in its own
  branch of form_error; the status branch is made explicit so that no unknown name can fall into it), and launcher.start's step "root" reads that form once through the same read callee BEFORE the status read: an answer
  (a sequence of NUL-ended records, each a key and a value split at the first newline, a record with no newline being a key with no value) in which any key, ASCII-lowercased, begins with "filter." or equals
  "core.worktree" gives "not granted" with the reason "root" and findings that name the keys only (the count of such keys and at most 20 names, each the repr of the key's bytes cut to 80 bytes, never a value); a read that
  fails, a timeout, an answer that is not a mapping, a non-zero exit, a non-bytes output, a non-empty output not ending in NUL, or a record with an empty key gives "refused" with the reason "root"; only a clean answer lets
  the status read run; nothing else in start, end or launch_outside changes, and neither file gains an import or the state directory's name as a string.
