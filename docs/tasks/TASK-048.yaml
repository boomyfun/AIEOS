# Task contract TASK-048, the stack benchmark's first round-2 port: Rust (Master Plan revision 4, §4 "The benchmark and
# the stack ADR"; docs/plan/m4-exit-review.md §6, line 70; docs/plan/bench-port-brief.md revision 3, §6; decisions
# D-794, D-800 C3, D-814 Q4, D-905, D-919, D-921; DEF-0063).
# Revision 0, drafted under decision D-921 (the scope note, B1 to B9, C1 to C4); brought for approval in its own
# request; whether it is approved is recorded in the decision files, not in this file. Fields and value forms follow
# specification 2 §5.1 and the contracts of TASK-007 to TASK-047. Readings marked "(reading)" are the worker's, for the
# decision agent's ruling.
# Task type: implementation, with two writers on two path sets (as TASK-045):
# - the round-2 code under bench/rust (src/round2_main.rs, tests/port2_test.rs, the new modules under src/ that
# src/lib.rs declares, and the added `pub mod` lines of src/lib.rs; AC3) is written by a fresh agent (claude-opus-5-5,
# started for this task only) given only the inputs of the port brief's §6.2: the brief at revision 3 (its hash
# below), the four Python files at commit 6b026569b4c62ec5d5b061138d8522d2ab651542 by the hashes the brief names, the
# round-2 input and reference documents made at that commit and checked against their pins (with the source of
# tests/unit/test_export_round2.py, 6fd0c9d2…), bench/rust's round-1 code at base_commit, and this contract. It works
# only in a scratch folder of the worker's scratchpad holding a copy of bench/rust at base_commit, with no access to
# the repository, the archives, the other ports or any review, and runs only cargo there, through the worker's wrapper
# script (TASK-045's, decisions D-878 and D-879, with this session's paths);
# - everything else (Cargo.toml's two added blocks, Cargo.lock if it changes, the workflow step and the tests of AC8) is
# written by the worker.
# Round 1 unchanged (brief §6.3; decision D-921 B2): src/main.rs, tests/port_test.rs and every round-1 module under
# src/ stay byte-equal to base_commit; src/lib.rs differs only by added `pub mod` lines; Cargo.toml only by one [[bin]]
# block (port2) and one [[test]] block (port2_test); checked by script before any writer file is used.
# The toolchain (brief §3; D-921 B6): in CI, the cargo and rustc the hosted runners provide, not downloaded, their
# versions printed by the rust step; locally, rustc 1.99.0 for x86_64-pc-windows-gnu, from the standalone archive
# already fetched in session 917ba401 (decisions D-875 to D-877), copied into this session's scratchpad and checked
# against the full SHA-256 saved in that session's rust/archive.sha256 before anything is unpacked or run, then
# unpacked and assembled by that session's script with this session's paths only, its own decision; no network. Every
# cargo run has --locked and --offline where the subcommand takes them, CARGO_NET_OFFLINE=true and its target folder
# outside the checkout ($RUNNER_TEMP in CI); locally also CARGO_HOME, RUSTUP_HOME, TMP and TEMP under the scratchpad and
# PATH limited as in TASK-045.
# The workflow change (A66, its own element at code time; D-921 B3): in both jobs of .github/workflows/aieos-bench.yml,
# identically, the step "port rust (only if bench/rust exists)" keeps its one guard and its round-1 lines, with two
# readings: the round-1 run line names its binary (`--bin port`) and the round-1 test line names its target (`--test
# port_test`), since a second [[bin]] and a second [[test]] would otherwise make cargo refuse the run line and pass the
# round-1 arguments to both test targets; after the round-1 lines it adds the round-2 run, the round-2 compare, the
# round-2 tests and one no-argument probe of the round-2 program (AC6); the header names the round-2 lines; the
# revision line goes from 6 to 7. No download, trigger, permission, secret, token or `uses:`; the TypeScript and Go
# steps' bytes, the export steps and the round-2 export step are unchanged.
# Limits: the benchmark workflow runs on pushes to main only, so the round-2 port's hosted evidence on Linux and Windows
# comes from the landing's run, read after acceptance; before acceptance, the evidence of byte equality is the
# worker's local run (rustc 1.99.0, x86_64-pc-windows-gnu) and the reviews; the hosted Windows runner builds for its
# own default target (msvc, a reading) while the local check builds for gnu; the runners' Rust version is not pinned
# and clippy's lint set moves with it; the archive's SHA-256 was self-attested by its publisher; the texts the Python
# builds naming a Python type fail closed (brief §6.3), reached by no generated input; no file behaviour is compared;
# round 2's ports are written one after another, Rust first (order bias); every writer and reviewer is an AI of one
# vendor; TASK-046's carried limit (a probe passes when its program is missing) holds for the new probe as for the
# others, and the landing's log is read for the round-2 program's own usage line.
# What it is not: the results are advisory (A29, A31) and feed no gate, record or evidence entry; aieos-checks.yml and
# its two pins are not touched; src/ is not touched; no TypeScript or Go change; the round-1 port's results do not
# change.
# Risk: critical, and change class critical_cr, computed over the base by script (risk_class48.py: risk_class47.py with
# only the write-set and its header line changed): .github/** is R9 (critical); bench/** is R12 (high); tests/** is R2
# (medium) with R3's fail-closed reading (high); .github/** and tests/unit/** are evaluator paths of GOV-003's list.
# Profile (assurance-model.md §5, gov-AIEOS, critical): high's entries plus architecture [human_review], met for
# gov-AIEOS by the decision agent's review, and functional [the property/fuzz entry] by the CI's property_test step over
# the existing property suite (the task adds no property test; it changes no decision code); the cross-model entry by
# the pair of reviews: five way-2 reviews from the port review template (revision 1, unchanged, brief §6.5) on
# claude-sonnet-5-5 (a model other than the port writer's and the main session's), and the decision agent's separate
# review. One delegated approval (reading, as TASK-045). Round 2's findings are counted apart from round 1's (§6.5).
# Naming (D-544 Q3): every Python test this task adds names the AC ids it stands for as "TASK-048 ACn" in its docstring.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-048.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-048", go to task/TASK-048 under their own decisions; main receives the
# task only at its acceptance.
# Not applicable: OPS-001 (no ref changed by the task's code); INV-004 to INV-011 (no project state, decision engine,
# governor, evidence record, replay or policy path in the write-set); GOV-001, GOV-004 to GOV-006. SEC-003 applies (a
# .github/ path), under A66 as above.
# Owner-kept acts: none, on these conditions: the changed workflow grants no write, uses no secret or token, changes no
# repository or security setting and costs nothing (public repository, hosted runners); the local toolchain needs no
# network and installs nothing outside the scratchpad. If any of these is not so, the task stops and the point is the
# owner's (CR-002 part 4 limit 5), fail closed.
task: TASK-048
contract_version: v1
task_type: implementation
objective: >-
  Extend bench/rust with round 2 of the benchmark (the brief's §6): a second program, port2, written from the port brief
  (revision 3) by a fresh agent, which prints a document byte-equal to round 2's reference from round 2's input, with
  its own tests, round 1's program, tests and modules unchanged; extend the rust step of both jobs of
  .github/workflows/aieos-bench.yml to run, compare and test it and probe it with no argument, naming the round-1 binary
  and test target; update TASK-045's pins in tests/unit/test_export_fixtures.py. Nothing else changes; the results are
  advisory and feed nothing.
traces_to:
  - docs/plan/m4-exit-review.md#6
  - docs/plan/master-plan.md#4
  - docs/plan/bench-port-brief.md
  - docs/pre-genesis/constitution.md#SEC-003
input_state:
  # base_commit is the `main` commit on top of which the approved contract is committed as its own commit C, changing
  # only docs/tasks/TASK-048.yaml; G0 requires C's one parent to equal base_commit. It is filled by script from
  # refs/heads/main just before C is made: the placeholder and its quotes are replaced by the 40-hex id, unquoted.
  base_commit: e420c2f9d890dc2ad6df7b18e3a841feda96d4c9
  depends_on: [TASK-039, TASK-045, TASK-046, TASK-047]
  intent_versions:
    docs/plan/m4-exit-review.md: 6c41ca8200a4e757f04b22aa521e52cd67f7ac3122690e667ac4c864aa57c4a4
    docs/plan/master-plan.md: 8276a587bbf6f75be8867feb97df6726379babfcdb2266344bfdb4d01e6b2d23
    docs/plan/bench-port-brief.md: 1f5376c7113c3286cfe67dfa1567da31ed0dfae74b7d43f4ff455ea3141d4450
    docs/pre-genesis/constitution.md: 9b396c3c0f31d3a3fbccf9433cf81eb820b6e0f0a3a7d099e2899043abfe1f5a
    docs/specs/risk-rules-gov-aieos.md: 29dd803aed6a55c11fad04d01dac32ee10a8f15f96f099857a00212c100d4ed5
    docs/specs/conformance-files.md: 2f1c224466fe3657167b116b49f902648130bf76e1274367d7780cc38ec7b021
write_set:
  # The round-2 files under bench/rust/ (the Cargo files by the worker), one modified workflow, one modified test module.
  paths:
    - bench/rust/**
    - .github/workflows/aieos-bench.yml
    - tests/unit/test_export_fixtures.py
read_set:
  paths:
    - docs/plan/**
    - docs/pre-genesis/constitution.md
    - docs/specs/risk-rules-gov-aieos.md
    - docs/specs/conformance-files.md
    - docs/tasks/**
    - src/aieos_bootstrap/**
    - tests/unit/**
    - tests/run_tests.py
    - .github/workflows/aieos-checks.yml
  interfaces:
    - tests/unit/test_export_round2.py (the round-2 input and reference documents, run as a script)
    - tests/unit/test_export_reference.py (--compare, run as a script)
    - bench/rust (the round-2 program, built by cargo and run as `cargo run --locked --offline --release --quiet --bin
      port2 -- <round-2 input document>`)
  schemas:
    - conformance-files canonical form (2)
    - the round-2 documents' forms (TASK-047 AC1, AC2)
forbidden:
  - .github/workflows/aieos-checks.yml
  - .aieos/**
  - .claude/**
  - CLAUDE.md
  - AIEOS-concept.md
  - bench/ts/**
  - bench/go/**
  - bench/rust/build.rs
  - bench/rust/.cargo/**
  - bench/rust/target/**
  - bench/rust/src/main.rs
  - bench/rust/tests/port_test.rs
  - docs/**
  - src/**
  - tests/conformance/**
  - tests/integration/**
  - tests/property/**
  - tests/run_tests.py
  - tests/unit/test_bench_isolation.py
  - tests/unit/test_export_reference.py
  - tests/unit/test_export_round2.py
  - .gitattributes
  - .gitignore
constitution: [INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The round-2 program's output. Built from bench/rust by cargo and run as `cargo run --locked --offline --release
      --quiet --bin port2 -- <round-2 input document>`, the program prints a document byte-equal to round 2's reference
      document (tests/unit/test_export_round2.py at base_commit, REFERENCE2_SHA256 unchanged) and exits 0; on a missing
      or extra argument, a file that is not a round-2 input document, or a call or case it cannot compute (the texts
      naming a Python type among them, brief §6.3), it exits non-zero and prints nothing to standard output. Evidence
      before acceptance: the worker's run with rustc 1.99.0 (x86_64-pc-windows-gnu) on this machine, compared by
      `--compare`, its output saved; the hosted runners' compare at the landing is read after acceptance (a stated
      limit).
  - AC2: >-
      The writer and its inputs (the brief's §6.2; decision D-921 B1, C4). The round-2 code is written by a fresh agent
      on claude-opus-5-5, given only the brief's §6.2 inputs (the documents made at 6b026569 and checked against
      INPUT_SHA256 and REFERENCE2_SHA256) and a copy of bench/rust at base_commit with the worker's two Cargo.toml
      blocks, in a scratch folder; its tool calls are only file reads there, writes inside its own folder and cargo
      commands there through the worker's wrapper (checked by script over its transcript before any of its files is
      used); its file set holds no file of another port; every file it writes is committed byte-equal to the hash the
      decision agent accepts after that check. No file under bench/rust holds a 64-hex value, record id or line of the
      round-2 reference document that the input document does not hold, nor any entry's expected values (checked by
      script against the two documents).
  - AC3: >-
      The port's form (the brief's §3 and §6.3; D-921 B2, B5, C3). bench/rust holds only its round-1 files and:
      src/round2_main.rs (the round-2 entry: the argument, the single write, the exit code), tests/port2_test.rs (the
      round-2 test file) and the new modules under src/ that src/lib.rs declares, written by the port writer.
      src/main.rs, tests/port_test.rs and every round-1 module are byte-equal to base_commit; src/lib.rs differs from
      base_commit only by added `pub mod` lines; Cargo.toml differs only by one [[bin]] block (name port2, path
      src/round2_main.rs, test = false) and one [[test]] block (name port2_test, path tests/port2_test.rs, harness =
      false), with no other key or table added; Cargo.lock keeps lock version 4 and the one package, with no source or
      checksum line. The test target reaches the code only through the library. The code uses only Rust's standard
      library and holds none of TASK-045 AC3's forbidden forms; it uses std::env only for std::env::args and std::fs
      only to read the one argument path (its tests only the two documents given as arguments); it writes nothing but
      standard output and standard error, and reads no clock or random value; its SHA-256 is src/sha256.rs (brief §6.4).
      TASK-046's forbidden-form scan passes over every file.
  - AC4: >-
      The static checks and the build. In bench/rust, with CARGO_NET_OFFLINE=true and the target folder outside the
      checkout: `cargo fmt --check` exits 0; `cargo clippy --locked --offline --release -- -D warnings` exits 0; `cargo
      build --locked --offline --release` builds both binaries. Before the first push the worker runs the rust step's
      exact lines of AC6, round 1 and round 2, on this machine with rustc 1.99.0 for x86_64-pc-windows-gnu (the archive
      of D-921 B6, checked by its full SHA-256 before it is unpacked), in the scratchpad only, with CARGO_HOME,
      RUSTUP_HOME, the target folder, TMP and TEMP under the scratchpad and PATH limited as in the header (D-921 C1).
  - AC5: >-
      The round-2 program's own tests. tests/port2_test.rs (harness = false), run as `cargo test --locked --offline
      --release --test port2_test -- <round-2 input document> <round-2 reference document>` (its own main reads the two
      arguments), checks at least: the byte equality over the whole input against the reference; one append call and one
      reconcile case field by field; the carried log (an entry after an appended one and after a refused one); each
      fail-closed input of AC1; it exits non-zero on any failure. `cargo test --locked --offline --release --test
      port_test -- <fixture document> <reference document>` still passes unchanged. Both pass on the worker's machine,
      and the workflow runs both.
  - AC6: >-
      The workflow (A66, its own element). In each of the two jobs of .github/workflows/aieos-bench.yml, identically,
      the step "port rust (only if bench/rust exists)", under its one existing guard, keeps its round-1 lines with the
      run line naming `--bin port` and the test line naming `--test port_test` (two readings, D-921 B3), and after them
      runs: `cargo run --locked --offline --release --quiet --bin port2 -- "$RUNNER_TEMP/round2-input.json"` into
      "$RUNNER_TEMP/rust2.json"; from the checkout's root, `$PY tests/unit/test_export_reference.py --compare
      "$RUNNER_TEMP/round2-reference.json" "$RUNNER_TEMP/rust2.json"`; from bench/rust, `cargo test --locked --offline
      --release --test port2_test -- "$RUNNER_TEMP/round2-input.json" "$RUNNER_TEMP/round2-reference.json"`; and one run
      of the built port2 program with no argument that must exit non-zero and print nothing to standard output, its
      output kept in the job's temporary folder, in TASK-046's probe form. The header names the round-2 lines; the
      revision line goes from 6 to 7. Nothing else changes: no download, trigger, permission, secret, token, `uses:`,
      TypeScript or Go byte, export step or round-2 export step. The earlier tests of tests/unit/test_export_fixtures.py
      pass over it, with only the pins of AC8 updated.
  - AC7: >-
      Isolation (decision D-800 C3; the risk rules policy revision 6, R12). tests/unit/test_bench_isolation.py,
      unchanged, passes: no file under src/ or tests/ outside its allow-list, nor aieos-checks.yml, names bench/ or
      imports from it, and aieos-bench.yml is the only workflow naming bench/.
  - AC8: >-
      The pins (D-921 B4), in tests/unit/test_export_fixtures.py, in a new test class whose docstrings start with
      TASK-048: TASK-045's pins of the rust step's lines, of bench/rust/Cargo.toml's exact bytes and of bench/rust's
      file set are updated, each to its one exact new value, as pin updates and not a loosening (the lines of AC6 in
      their order, CARGO_NET_OFFLINE=true and CARGO_TARGET_DIR set before the first cargo command, every cargo build,
      lint, run and test command carrying --locked and --offline, no `cargo install`, `cargo add`, `cargo update`,
      `cargo fetch` or `rustup`); TASK-046's HardeningTests pass unchanged (Cargo.lock's pin changes only if its bytes
      change, with its one exact new value); the TypeScript and Go steps of each job unchanged from base_commit. No
      earlier assertion is removed or loosened beyond these updates; the module's export, its other tests and its main
      guard are unchanged.
  - AC9: >-
      The CI checks and purity. At the task's commits the existing CI steps report no finding: G0 scope,
      deterministic_rule, OPS-003, SEC-001, SEC-002, SEC-003's record and bandit; every earlier test passes; the added
      Python lines are scanned for the bandit test patterns the CI applies before the first push (a stated limit: that
      scan is not bandit; the branch run's bandit step is the evidence); the forbidden forms of AC3 are checked by
      script over bench/rust before the first push; if any earlier test can pass only by a change outside the write-set,
      the task escalates (needs_out_of_scope_change).
  - AC10: >-
      Naming. Every Python test function the task adds names "TASK-048 ACn" in its own docstring; no existing test's
      docstring changes; tests/run_tests.py is unchanged and runs no export or port.
  - AC11: >-
      Stop conditions. If any step needs a secret, a token, write access, money, a setting, the network or anything
      installed outside the scratchpad, or the copied archive's SHA-256 differs from the saved published value, the task
      stops and the point goes to the decision agent, and to the owner when it is the owner's (A66, fail closed).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell:
    allow:
      - "timeout 110 python tests/run_tests.py < /dev/null"
      - >-
        cargo fmt --check / cargo clippy --locked --offline --release -- -D warnings / cargo build --locked --offline
        --release / cargo run --locked --offline --release --quiet --bin <port or port2> -- <file> / cargo test --locked
        --offline --release --test <port_test or port2_test> -- <file> <file> / cargo generate-lockfile --offline (the
        worker only, once) (with CARGO_NET_OFFLINE=true and, locally, the scratchpad environment of AC4)
      - "sha256sum <SP>/rust/archive.tar.xz (compared with the saved published value before unpacking)"
      - >-
        timeout 110 python <SP script> < /dev/null (the standard library's tarfile and lzma, unpacking and assembling
        into <SP>/rust only)
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 900k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC7, AC8, AC10]}
  - {gate: G3, check: constitution, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC9, AC11, INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
