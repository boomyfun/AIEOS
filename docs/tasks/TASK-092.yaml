constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      end_outside's arguments and form by stand-ins: a root that is not an absolute path, an empty or non-str
      session_id, a now that is naive, not UTC or with microseconds, a now whose checks raise, an empty recorder, and
      a callee neither None nor callable each give "refused" with reason "argument", released [] and no callee
      called; the result has exactly OUTSIDE_KEYS in every case; each callee defaults at call time
      (mock.patch.object of writer.session_leases, writer.stored_reads, writer.remove_reads,
      read_set_record.observe_gone and writer.end_session made after import is the one called); no call raises.
  - AC2: >-
      end_outside's order and records by stand-ins: with rows of two tasks given in reverse str order, one task in
      two rows, one task expired and one unexpired, the calls are session_leases once, then for each distinct task
      once, in str sorted order, stored_reads, observe_gone and remove_reads, then end_session once, after every
      record; observe_gone gets the task, the session, the reads as a list, read_set_record.GONE_WHY[2], now and
      exactly the recorder followed by " outside the runtime, for session ", the session id and ", its lease row
      possibly unexpired"; records holds each task's line exactly in the stated form for a written, a duplicate and
      a conflict (present) record and for a failed removal, a conflict adding its finding; "done" from end_session
      gives "done", reason None and released the released leases' task ids, a released task not among the rows
      adding its finding, and a "done" value out of form giving released [] and its finding; a session with no lease
      gives records [] with end_session still called.
  - AC3: >-
      Failing closed by stand-ins: a refused session_leases answer (its "session" refusal included, its findings
      kept), a value out of form (a row without a key, a naive expires_at, a task_id that is not a str, is a list or
      does not match _TASK) ("lease_rows"), ended true ("ended"), a refused stored_reads ("stored_reads"), a record
      not found present ("record") and a raise at each of these steps (its step's reason) each give "refused" and
      released [], with end_session not called, the records lines of earlier tasks kept and no call for a later
      task; a refused or raising remove_reads is named in the findings and end_session is still called; a refused
      end_session gives "refused" with reason "end" and its findings; a raise in end_session gives "refused", "end"
      and the "may be ended" finding; every raise names its step; no finding end_outside makes itself holds the root.
  - AC4: >-
      The command end by stand-ins (mock.patch.object of launcher.end_outside, restored after each test; a counting
      clock): an environ holding any of RUNTIME_VARS gives exit 1 and exactly "finding: end: refused inside a runtime
      (spec 7 :34)", or its JSON line under --json, with neither the clock nor end_outside called; a bad argv in such
      an environ gives exit 2 and USAGE; "end S --root R" and "end S --root R --json" are accepted and call
      end_outside once with (R, S, the clock's value, 'aieos cli end'); "end", "end --root R", "end . --root R",
      "end .. --root R", "end -x --root R", an empty session, a session of 129 characters, one with "/" or one
      ending in LF, and "end S" without --root give exit 2 and USAGE with nothing called; a session of 128
      characters is accepted; SESSION.pattern equals mcp_server._SESSION.pattern; a "done" answer gives exit 0 and
      the record, released (or "ended, no lease released", not printed after the "end_session's value is out of
      form" finding) and finding lines in that order, and under --json the one sorted JSON line with findings,
      records and released; a refused answer gives exit 1 and "end: <reason>", the
      record lines and its findings, in both forms; each out-of-form answer (not a dict, other keys, an unknown
      result, a non-list or a non-str item) gives the out-of-form finding; a raising clock or end_outside gives exit
      1 and "end: a step raised <type>"; tasks' tests of tests/unit/test_cli.py all still pass.
  - AC5: >-
      The modules: launcher.py's import set unchanged (tests/unit/test_launcher.py :695-705 passes) and its refused
      names and attributes unchanged (:707-719 passes; end_outside takes now as a parameter and reads no attribute
      now); launcher.py's diff from the base changes or removes base lines only in :86-90 and :95-96 and otherwise
      adds lines only, in the docstring's added paragraph or after end, checked at G3 by a scratchpad git-diff
      script; cli.py's imports are exactly
      datetime, json, os, re, sys and execution and launcher (from aieos_bootstrap) (tests/unit/test_cli.py :333-341
      as changed); cli.py still reads os.environ only in the entry line and names no open, exec, eval, compile,
      __import__, input, argparse, subprocess, writer, time or getenv; tests/unit/test_writer.py :397-412,
      tests/unit/test_gitread.py :370-380 and tests/unit/test_autonomy.py :238-246 pass; the new test file uses no
      tempfile, sqlite3, shutil or open, roots only the literal 'C:/outside-root-92', and uses no one-argument
      .replace() and no .replace(target=...).
  - AC6: >-
      Docstrings: launcher.py's module docstring gains a paragraph holding "end_outside", "aieos end", "the record
      before the release", "no fencing token given", "no lease is released before its record", "possibly unexpired"
      and "TASK-092", and not holding "writes no observed read-set record"; the sentence at :86-90 says "four call
      places" and keeps "at the next start" and "before the expiry", and the one at :95-96 says "or `aieos end` ends
      it"; it keeps every phrase tests/unit/test_launcher.py :722-733 and tests/unit/test_launcher_gone.py :421-429
      require; cli.py's docstring gains "end <session>", "refused inside a runtime" and "TASK-092", no longer holds
      "whose only entry is tasks" or "come with later tasks", and keeps every phrase of tests/unit/test_cli.py
      :403-409; USAGE names end; every test of tests/unit/test_launcher_outside.py names "TASK-092 AC", checked by
      its own naming test, more than 30 tests in all.
  - AC7: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) end_session called before the
      records (AC2); (2) end_session called after a record not found present (AC3); (3) the reason GONE_WHY[1] in
      place of GONE_WHY[2] (AC2); (4) the tasks not sorted (AC2); (5) a refused stored_reads ignored (AC3); (6)
      ended true not refused (AC3); (7) remove_reads called before the record (AC2); (8) a raising remove_reads
      stopping the end (AC3); (9) a callee bound at import time (AC1); (10) the in_runtime check skipped for end
      (AC4); (11) the clock called before the in_runtime check (AC4); (12) a session "." accepted (AC4); (13) a
      session beginning "-" accepted (AC4); (14) end_outside's refusal giving exit 0 (AC4); (15) cli.py importing
      writer (AC5); (16) a refused end_session reported "done" (AC3); (17) a raise in end_outside not caught by the
      command (AC4); (18) the loop stopping after the first task's record (AC2); (19) a line of launcher.py's end
      changed (AC5, failing the G3 diff script); (20) the in_runtime check before the parse (AC4);
      twenty copies in all; each copy made in a scratchpad script at G3, not committed; the governor's evaluate at
      acceptance (the shadow) with any difference named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6]}
  - {gate: G3, check: constitution, args: [AC7, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
