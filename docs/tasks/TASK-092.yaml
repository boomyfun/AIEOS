# TASK-092: `aieos end <session>`. A new core function launcher.end_outside, added to launcher.py after end with a
# docstring paragraph and two reworded docstring sentences, ends a crashed session from outside any runtime session:
# for each task among the session's lease rows it writes the session's observed read-set record as the core's own
# observation with no fencing token and removes the stored reads once the record is present, then ends the session
# by writer.end_session, which releases every lease of the session; a new command end in cli.py calls it, refusing
# inside a runtime (specification 7 revision 2, section 3 :33-34, section 5 :45, :48, section 10 point 11;
# specification 5 revision 5 :112, :119, :125; M7's remaining part, its second task). Plan: decisions D-3046 to
# D-3051 (session ea6ea0a3): the scope note (MYSP/t92/scope92.md) with D-3047's rulings (a3), (b), (c1), (d), (e)
# with E1 and E2, and (f); the pin scan (pinscan92-out.txt at 0ebd0dfc) and its reading (pinscan92-reading.md,
# D-3049); the risk run (MYSP/t92/risk_class92.py at 0ebd0dfc: high) and the forbidden list (MYSP/t92/forbid92.txt at
# 0ebd0dfc; launcher.py, cli.py and test_cli.py left out; the new tests/unit/test_launcher_outside.py is not in it)
# (D-3049); the reviews rv92a (claude-sonnet-5-5) and rv92b (claude-opus-5-5) of r0 and their dispositions
# (MYSP/t92/disp92.md, D-3051, fifteen rows, with R5a); the round-2 review rv92c (claude-opus-5-5) of r1 and its
# dispositions (MYSP/t92/disp92r2.md, D-3053, seven rows); the decision agent's read of r2 in place of a third
# round, with three text fixes (D-3056).
#
# Scope:
# - In src/aieos_bootstrap/launcher.py (D-3047 (a3); D-3051 row 1; D-3053 C1): lines added after end, and in the
#   module docstring an added paragraph (AC6) and two reworded sentences: :86-90 ("its three call places" becomes
#   "its four call places", the fourth being end_outside, keeping "at the next start" and "before the expiry") and
#   :95-96 (a "held" session stays open "until its unexpired lease expires or end is called with its token, or
#   `aieos end` ends it"), each keeping every phrase tests/unit/test_launcher.py :722-733 needs; start, end and
#   every existing helper and constant unchanged; the clauses at :94-95 ("for the next start or `aieos end`") and
#   :102-103 name `aieos end` as a remedy and stay true. Checked at G3 by a scratchpad script over git diff from
#   base_commit (D-3051 Q3): every removed or changed base line lies in :86-90 or :95-96; every other changed line
#   is an added line, in the docstring's added paragraph or after end:
#   - OUTSIDE_KEYS = ('result', 'reason', 'findings', 'records', 'released') and
#     end_outside(root, session_id, now, recorder, session_leases=None, stored_reads=None, remove_reads=None,
#     observe_gone=None, end_session=None) -> a mapping with exactly OUTSIDE_KEYS; it never raises an Exception: its
#     whole body, the result's building included, is inside one try. findings and records are lists of str; released
#     is a list of str, [] on every refusal; reason is None on "done" and a str on "refused".
#   - In order (each step's name is the reason a refusal or a raise at it takes, and each finding end_outside makes
#     itself begins "<step>: ", or "<task_id>: <step>: " at a step of one task; end_outside's own findings never
#     name the root; callees' findings are kept as given, after its own):
#     1. "argument": root an absolute path (_ROOT's form, launcher.py :139), session_id a non-empty str, now a
#        timezone-aware UTC datetime with whole seconds, recorder a non-empty str, each callee None or callable; a
#        wrong one, or a check that raises, gives "refused" with reason "argument" and no callee called. Each callee
#        defaults at call time to writer.session_leases, writer.stored_reads, writer.remove_reads,
#        read_set_record.observe_gone and writer.end_session.
#     2. "lease_rows": the session's rows, read once by session_leases(root, session_id, now); a refused answer
#        (writer.py :843-847's "session" refusal of a never-started session included, its findings kept) or a value
#        out of the form {ended: a bool, leases: a list of rows each with exactly task_id, fencing_token and a UTC
#        expires_at, task_id a str fully matching launcher._TASK} gives "refused" with reason "lease_rows"; the check
#        is end_outside's own, in the form of _path's (launcher.py :446-451) with the task_id check added (D-3051
#        row 4). "ended": ended true gives "refused" with reason "ended" and the one finding "ended: the session is
#        already ended", nothing written.
#     3. For each distinct task_id of the rows, expired or not, in str sorted order:
#        - "stored_reads": stored_reads(root, session_id, task_id); a refusal or a value that is not a list gives
#          "refused" with reason "stored_reads", its findings kept (as end does, launcher.py :510).
#        - "record": read_set_record.observe_gone(root, task_id, session_id, the reads as a list,
#          read_set_record.GONE_WHY[2] ('no fencing token given'), now, recorder + " outside the runtime, for
#          session " + session_id + ", its lease row possibly unexpired") (D-3047 (c1); D-3051 R5a); a record not
#          found present (launcher._present, :475-477) gives "refused" with reason "record", its findings kept; a
#          conflict (launcher._conflict, :469-472) counts as present and adds the finding "<task_id>: record: a
#          record is already present under its event id (conflict)".
#        - remove_reads(root, session_id, task_id): a refusal or a raise adds the finding "<task_id>: remove_reads:
#          " followed by its findings or "a step raised <type>", and does not stop the steps, the record being
#          present.
#        - The task's records line, exactly: "<task_id>: record <written|duplicate|conflict (present)>, <n> reads
#          removed", n written by %r of the removal's value (as launcher.py :268), or "<task_id>: record
#          <written|duplicate|conflict (present)>, reads not removed" when the removal failed (D-3051 row 9).
#     4. "end": end_session(root, session_id, now). "done" whose value is a list of mappings each with a str
#        task_id gives result "done", released those task ids in end_session's order; each released task_id not
#        among the rows read adds the finding "end: <task_id> released with no record (it was not among the rows
#        read)"; a "done" with any other value gives "done", released [] and the finding "end: end_session's value
#        is out of form"; a refusal gives "refused" with reason "end" and its findings (its "session" and "ended"
#        refusals arise only by a race after step 2); a raise gives "refused", "end" and the finding "end: a step
#        raised <type>; the session may be ended" (D-3051 row 2).
#   - Failing closed: a refusal or a raise at steps 2 or 3 (before the record of every task is present) ends
#     nothing: end_session is not called, so no lease is released before its record (spec 5 :112; spec 7 :45). A
#     raise names the step ("<step>: a step raised <type name>"); a refusal or a raise keeps the records lines
#     already made.
#   - A session whose rows list no lease gives records [] and goes straight to end_session.
# - In src/aieos_bootstrap/cli.py (D-3047 (d); D-3051 rows 3, 11, 13):
#   - It imports re. COMMANDS becomes ('tasks', 'end'); USAGE gains the line for end; SESSION =
#     re.compile(r'[A-Za-z0-9._-]{1,128}'), the text of mcp_server._SESSION's pattern (mcp_server.py :137), used
#     with fullmatch. The parser takes `end <session> --root <path> [--json]`: argv[1] is the session, which must
#     fully match SESSION, not be "." or "..", and not begin with "-"; else a usage error, exit 2 and USAGE, nothing
#     called; the flags after it as for tasks.
#   - The command end, in order: the parse (a bad argv gives exit 2 and USAGE inside a runtime too); then
#     in_runtime(environ): true gives exit 1 and the one finding "end: refused inside a runtime (spec 7 :34)"
#     through _findings in the chosen form, with neither the clock nor end_outside called; then clock() once; then
#     launcher.end_outside(root, session, now, RECORDER) once, looked up at call time, RECORDER = 'aieos cli end'. A
#     raise in the clock or end_outside gives exit 1 and the one finding "end: a step raised <type>".
#   - An answer is in form when it is a dict with exactly OUTSIDE_KEYS, result "done" or "refused" (reason a str
#     when "refused"), and records, released and findings each a list of str; else exit 1 and the one finding "end:
#     end_outside gave an answer out of form". "done" gives exit 0 and, in text, "record: <line>" for each records
#     line, then "released: <task_id>" for each released task, or, when released is empty and no finding "end:
#     end_session's value is out of form" is present, the one line "ended, no lease released"; then "finding: <f>"
#     for each finding; under --json the one line json.dumps({"findings": [...], "records": [...], "released":
#     [...]}, sort_keys=True). "refused" gives exit 1 and the findings "end:
#     <reason>", then "record: <line>" for each records line, then end_outside's findings, through _findings in the
#     chosen form. The frame's rules (one write, flush, a raising write giving 1, never raising) are TASK-091's,
#     unchanged.
#   - cli.py's docstring gains end's paragraph and rewords the sentences end makes false or incomplete: :9-11
#     ("whose only entry is tasks"; "neither the clock nor list_tasks called"), :25-26 ("the commands that refuse
#     inside a runtime (end, launch) come with later tasks"), :31-32 ("Nothing runs this module but its tests") and
#     main's docstring :147-148 (end reads environ); every phrase tests/unit/test_cli.py :403-409 needs stays,
#     "writes nothing" said of tasks; the module still reads os.environ only in the entry line.
# - In tests/unit/test_cli.py, only TASK091AC5Module.test_imports (:333-341): its import set becomes {datetime, json,
#   os, re, sys, aieos_bootstrap.execution, aieos_bootstrap.launcher}, and its docstring names them. No other test of
#   the file changes: BAD_ARGVS :101's ['end', '--root', ROOT] stays a usage case (its session slot holds "--root",
#   which begins with "-"), the USAGE test :129-133 and the docstring test :403-409 still hold their words (D-3047
#   E1; pinscan92-reading.md (2)).
# - New tests/unit/test_launcher_outside.py: end_outside by stand-ins (each callee recording its calls), and the CLI
#   command end by stand-ins (mock.patch.object of launcher.end_outside), a literal root 'C:/outside-root-92'
#   (L-0032); no tempfile, sqlite3, shutil or open; its naming test requires "TASK-092 AC" in every test.
# - What it does not do: no change to writer.py, read_set_record.py, adapter.py, mcp_server.py or __init__.py; no
#   change to start, end or any existing helper or constant of launcher.py; no process; no runtime, hook or setting.
#
# Stated limits: a session with no lease row left gets no record from this command (writer has no listing of reads
# by session; its reads wait for the next start of their task, TASK-090's step 1a). This path departs from spec 5
# :125's sentence "a session whose lease row is still unexpired is not processed": it processes a live row, because
# spec 7 :48 and spec 5 :119 give a way to end a crashed session before expiry and spec 5 :112 and spec 7 :45
# require the record before the release (D-3047 (c1); D-3051 Q1); while the row is live, the record's text "written
# by the core without a held lease" (read_set_record.py :208) is true of the writer but not of the session, so the
# recorder names the possibly unexpired row (D-3051 R5a); a spec revision item is opened at the records (R5b). An
# expired row also gets "no fencing token given", where "lease gone (released or expired)" would be true. The rows,
# the reads, the records and the end are read and written at separate moments: a lease granted to another session
# between them is not touched (end_session works by session id), and a lease or read added to the same session
# between the rows read and end_session is released, or left in the store, without a record (the "released with no
# record" finding names such a lease). A refusal or a raise at steps 2 or 3 leaves the session open, its leases live
# until they expire (as end's limit, launcher.py :94-96); a refusal at a later task's record keeps the earlier tasks'
# records and removals, and a retry is safe (the record is then a duplicate or a conflict, both present); a row out
# of form or a record that keeps failing refuses the end until the rows expire and a next start of the task
# processes the session. The command cannot see whether the session's runtime has stopped: run on a live session, it
# ends it (the owner's own use is the owner's; it is not run on a real project by this task). in_runtime sees only
# the three names (spec 5 :120): an agent's tool call in a runtime started without them is not refused (spec 5
# :119). cli.py now imports launcher, which loads gitread and so subprocess transitively; no pin refuses this, both
# pins being per file and on direct imports (pinscan92-reading.md (3)); cli.py's own source starts no process. One
# run at a time (the writer's limit). SESSION refuses a session id beginning "-", which mcp_server._SESSION allows,
# so that a flag is not taken for a session; the launcher's ids begin "launch-" (D-3050 Q1). A refused or raising
# remove_reads leaves the session's stored reads in the store after the end; the task's next start finds them, finds
# the record present (a conflict under the same event id, read_set_record.py :121; launcher.py :257-269, :469-477)
# and removes them (TASK-090's step 1a; D-3050 Q2; D-3051 row 14). __init__.py's stale module list stays.
#
# Owner-act boundary: none reached. Ending a crashed session from outside the runtime is a core act (spec 7 :33, :48;
# spec 5 :119): it changes the core's store and log through the writer, starts no process, launches nothing, places no
# hook and changes no setting (DM A51 item (4)); CR-002 part 4 limit 5 (CR-002-concept-errata.md :61) is not reached
