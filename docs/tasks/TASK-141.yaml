acceptance_criteria:
  - AC1: >-
      Recognition. violation_path_record is True for the exact form above, measured on the real log's line 24 of the fourth launch (True) and line 22, a Resume Check record (False), by a scratch prototype. It is False, and the line still fails exactly as before (a record finding), in each of these cases, each a test: (a) decision "STOP: violation" with another recorder; (b) recorder violation.RECORDER with another decision; (c) refers_to naming no violation.detected line; (d) refers_to naming a violation.detected line of another task; (e) a "STOP: violation" record that carries a head_commit; (f) an event_id that is not refers_to + "/decision"; (g) the violation.detected line placed AFTER the record; (h) an unparsable or non-object line (never raises).
  - AC2: >-
      The replay of the real log. With the four lines committed in a scratch clone, the command of the CI (PYTHONPATH=src python -B -P -m aieos_bootstrap.decision_replay <repo> b03c0b8a...2e76) prints REPLAYED for lines 13, 15, 17 and 22 unchanged, "NOT REPLAYED: violation-path record (no Resume Check ran)" for line 24, "decision records: 5, replayed and passed: 4, failed: 0, not replayed (violation path): 1" and exits 0 (the prototype did). Without this task it prints "failed: 1" and exits 1.
  - AC3: >-
      No silent pass. A decision.execution line that is not recognised is replayed as before and fails as before; a decision.acceptance line still fails; the exit code is 0 only when failed is 0; a recognised line is never added to the replayed count. A test shows a log holding ONLY a recognised violation-path record exits 0 with "replayed and passed: 0" and the "not replayed" count 1 (the limit of AC5 states what that means).
  - AC4: >-
      Tests and purity. The new cases are in tests/unit/test_decision_replay.py; no test is removed, weakened or skipped; the existing summary-line assertions (substring "decision records: 1, replayed and passed: 1, failed: 0") still hold. The CI step "INV-010 replay" (.github/workflows/aieos-checks.yml :636-670) judges the entry by its exit code only (:666, subprocess.run(...).returncode) and parses no summary text, so the added text of the summary line breaks no reader there. The whole suite passes by the slice method (D-6249 C2, D-6328 E1.6). The module keeps its imports except one added import of aieos_bootstrap.violation (constants only), starts no process at import, uses no exec, compile or importlib (INV-004); the new text uses none of the words MEASURED, ENFORCED and GUARANTEED.
  - AC5: >-
      Limits stated at acceptance: (1) a violation-path record is not recomputed by anything; the replay checks only its form and the violation.detected line it names, so a forged pair of such lines would be reported NOT REPLAYED and not fail; the standing gate amendment (B) closes that for the four named lines only; (2) a violation of a task makes every later evaluation of that task reject (violation.py :32-39), so TASK-136 cannot be accepted after this change and needs a new task (D); (3) this module runs from the tree under check, so GOV-003 is not met by it (the stated departure of TASK-139); (4) the CI step of INV-010 is unchanged (.github is not in the write set).
  - AC6: >-
      Class, evidence and departures. The risk class is high; the evidence profile is that of docs/pre-genesis/assurance-model.md :82 as for TASK-139 and TASK-140 (unit_test, integration_test named at acceptance or its absence stated, deterministic_rule, static_security_analysis, ai_review by a pair of reviews on Haiku 5.5 in their own sessions (D-6206; same vendor, stated as a departure), a per-article review and a separate decision_agent_review); the governor's shadow result at the GOV-003 row is a stated departure as in TASK-125 to TASK-140; the loosening of what the INV-010 CI step accepts is named in the acceptance and to the owner.
