# Task contract TASK-141 (r1 DRAFT; session 26136a0a, 2026-11-19; D-6424 BQ2; the fix of DEF-0143 part A).
# Why (the record DEF-0143, to be written by the records commit; this contract does not trace to it, because the file is not on main when the contract is committed): the fourth launch of TASK-136 ended in a violation (a Bash call, stopped by the hook). The violation path writes a decision.execution record "STOP: violation" (violation.py) that has no head_commit by design; the INV-010 replay (decision_replay.py) treats every decision.execution as a Resume Check record, so it fails on that line ("head_commit is not a commit id"), and the standing gate refuses to commit the log. Measured in a scratch clone: 5 records, 4 replayed and passed, 1 failed.
# Authority: D-6424 (route A first). Not in this task: the standing-gate amendment (B, a gate script outside the repository, its own decision), the 50,000-character limit of the Work Order (C), the replacement task for TASK-136 (D), the launch of any session (the owner's), TASK-137.
# Risk: high (R3 matches src/** and tests/** until an architecture names components, risk-rules :18, :36-38); not critical (no docs/specs, no .github, no .claude in the write set; to be computed by script at approval). The change LOOSENS what the INV-010 CI step accepts and is named so.
task: TASK-141
contract_version: v1
task_type: implementation
objective: >-
  In src/aieos_bootstrap/decision_replay.py add the function violation_path_record(lines, index) -> bool (pure, never raises) that is True only when the line at index is a decision.execution event of the form that violation.py writes: payload.decision equals violation.DECISION and payload.recorder equals violation.RECORDER (both imported from aieos_bootstrap.violation, not retyped), the payload has no key head_commit, the event_id equals payload.refers_to followed by "/decision", and payload.refers_to is the event_id of an EARLIER line of the same log whose type is violation.detected and whose task_id equals this line's task_id. In main's per-line loop, for a decision.execution line for which that function is True, print "NOT REPLAYED: violation-path record (no Resume Check ran) <record_id> <path>:<seq>", count it separately and do not replay it and do not count it as failed or as passed; the summary line becomes "replay: event logs N, decision records: T, replayed and passed: P, failed: F, not replayed (violation path): V". Every other decision.execution line is replayed exactly as before; a decision.acceptance line still prints "NOT REPLAYED: decision.acceptance" and fails. The module docstring (the paragraph at :39-41 and the Limits list) is updated: it states that a recognised violation-path record is reported and not replayed, because no Resume Check ran for it (violation.py UNCOVERED), and that the recognition is a limit (the record is accepted on its own form and on the earlier violation.detected line it names; nothing recomputes it). Tests are added in tests/unit/test_decision_replay.py.
