acceptance_criteria:
  - AC1: >-
      The keyword. `launch_outside(root, task_id, clock, starter, begin=None, contract_at=None, finish=None, finish_outside=None, write_handoff=None, base='main', read=None)`; a `read` that is neither None nor callable gives "refused" with the reason "argument" and a finding naming `read`, before the clock and `begin` are called (test: `dict(read=3)` added to the wrong-arguments test as a pure addition); with no `read` the default is `gitread.run`, looked up at each call (the defaults test patches `gitread.run` and checks the stand-in is the one called); `read` is not passed to `begin` (the begin keyword record stays `[{'base': 'main'}]`, test_cli_launch.py:145); `launcher.LAUNCH_REASONS` ends with "root after" and keeps its seven earlier values in their order; cli.py is unchanged (its form check accepts a non-done result whose reason is in LAUNCH_REASONS).
  - AC2: >-
      The after-read, clean. On a grant with a clean root (the fake `read` answers the config form and the status form in the existing mapping form `{exit, out (bytes), err, error}` with an empty configuration list and an empty status), the result stays "done", `findings` holds "root after: clean", and the callee calls are exactly as before (ORDER and CONTRACT_ORDER are unchanged: the fake read records into its own list, not into `world.calls`); a dedicated test records finish, the read and write_handoff into one shared sequence and checks: the end, then the configuration read and the status read, then the handoff.
  - AC3: >-
      The after-read, not clean. Each of these answers gives findings that begin "root after:", the reason "root after", the result "refused", the end and the handoff made as before, and an earlier reason is not overwritten (a starter that raised keeps "run"; an end that was not done keeps "end"): an untracked line, a tracked-edit line, a configuration key `filter.x` or `core.worktree`, exit 128, an `error` set, an answer out of form (a non-bytes `out`, a non-mapping), and a `read` that raises (caught, the try covering the whole `_root` call, so that an Exception from an answer whose own methods raise is caught in the same way, a finding "root after: ..." naming the exception type, the reason set, nothing raised out of `launch_outside`, a BaseException that is not an Exception, raised by `read`, is not caught: the end has been made, no handoff is written and it propagates; this is stated (AC7) and not tested).
  - AC4: >-
      The paths. The after-read is made on the normal path, on the path in which the starter raised, on the unreadable-write-set path (the contract path, with `finish_outside`), and on the path of a granted answer out of form with a string session id; it is not made when `begin` does not grant, when an argument is refused, when the clock is bad before the start, and when the granted answer is out of form with a session id that is not a string; a test for each.
  - AC5: >-
      The writes of the end. A reading, recorded at acceptance, shows that `end`, `end_outside` and the handoff write nothing in the root outside `writer.STATE_DIR`: launcher.py has no direct file write in them (a Grep of launcher.py for `open(`, `os.path`, `write_text`, `.write(`, `os.replace` and `os.makedirs`, its raw output brought at acceptance), writer.py builds every path under STATE_DIR (writer.py:106 and its joins), and the adapter's end (`adapter.end`, adapter.py) is read for any write (read by the decision agent at D-5441 by Grep: its defaults are writer.release_lease_token and writer.end_session and adapter.py has no direct file write; the acceptance brings the raw Grep again); if it writes in the root outside STATE_DIR, the task stops and comes back to the decision agent.
  - AC6: >-
      Purity and tests (INV-001, INV-002, INV-004). The directory's name appears as a string in no changed src file (writer.STATE_DIR only); no new import (gitread is already imported at launcher.py:296); no new process form, clock read or file access beyond `read`; the new docstring sentences use none of MEASURED, ENFORCED and GUARANTEED and no string constant in a changed src file is exactly "valid", "accepted" or "approved"; the pinned phrases of the launcher.py docstring that tests/unit/test_cli_launch.py pins stay (test_the_launcher_docstring), and test_what_launch_outside_names (the ast check of launch_outside and the names beginning `_launch`) holds. The existing tests amended, and only these, each listed in the acceptance: the defaults test (test_cli_launch.py:178-188, it also patches `gitread.run`), the done-path findings assertion (:132, which gains "root after: clean"), the World class (:54-108) and the helper `launch` (:111-115) (a `read` stand-in recording into its own list, passed by keyword), and the callee-name lists of the wrong-arguments test (:198-211, a pure addition); every new test's docstring begins with "TASK-094 ACn (amended by TASK-127 ACm)" so that the module's rule that every test names "TASK-094 AC" holds; no test runs git init or a subprocess or touches this repository's real state; the whole suite passes locally (`timeout 110 python tests/run_tests.py < /dev/null`, in slices if it does not finish) and on the CI. The criterion of D-5438 for an integration test on a temporary real repository is withdrawn (D-5439: no test in tests/ runs git init or a subprocess; that would be a new kind of test with its own risks; the logic is covered by the unit tests with the fake answers of the existing forms), and tests/integration/** is in the forbidden list. The risk class is high; the evidence profile is that of assurance-model section 5 for high, as for TASK-125 and TASK-126 (unit_test, integration_test, deterministic_rule, static_security_analysis, ai_review cross-model by a pair of reviews on Haiku 5.5 and a per-article review, and a separate decision_agent_review, plus the profile's other entries; the integration_test entry is met as TASK-126's acceptance met it, named at this acceptance, or its absence is stated there as a departure); the expected governor shadow result at the GOV-003 row is a stated departure as in TASK-125 AC5 and TASK-126 AC5 (the change class is critical_cr; the acceptance names it). The raw output of the step 'GOV-003 base tests (report only)' of the task-branch run is brought at acceptance with each base-test failure named. The first run is on the task branch.
  - AC7: >-
      Limits. No change to cli.py, writer.py, gitread.py, base_inputs.py, the hook, the workflows, any spec or doc, any DEF file or tests/integration/** (DEF-0101's bullet at :34-35, its Log line and its "Resume when" are changed at the acceptance by the records change-set, and spec 7 revision 12 lands before this task's contract is approved); no launching of a runtime; no change to the autonomy level or the measurement protocol. The limits are stated in the launcher.py docstring in plain words: a change made and undone within the session is not seen; a change after the read is not seen; the finding is advisory and no event is written; `aieos end` after a crash makes no read; every limit of the step "root" applies again; an interrupt (a BaseException that is not an Exception) during the after-read propagates after the end and before the handoff, so no handoff is written.
