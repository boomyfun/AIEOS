# Task contract TASK-127 (DRAFT r2 for approval; D-5304 C2 item 2: DEF-0101 part (a), the root's state after the session; D-5258 K6 option A; specification 7 revision 12, landed at b389945464a9 (F86); decisions D-5437 to D-5441; session d01f63a5, 2026-11-07). Drafted in the scratchpad; whether this text is approved is recorded only in the decision agent's decision that names its SHA-256, not in this file. Form: TASK-126 (docs/tasks/); the worker's own claim until checked.
# Why: the launcher reads the root's Git state once, before the grant (the step "root", TASK-109 and TASK-110). That the session leaves the root untouched afterwards is not checked (DEF-0101 :34-35; spec 7 :49). The first real run puts a runtime next to the owner's main checkout. This task adds one more read of the root after the session's end, with the existing check `_root`, so that a launch cannot report "done" over a root that is not clean.
# Not in this task: the state commit and its automation (option S), the runtime starter (a2, D-5304 C2 item 6, DM A75), an event written to the log for the finding, a new `gitread` form, any change to cli.py, gitread.py, writer.py, the hook, base_inputs.py, the workflows, any spec or doc or DEF file (spec 7 revision 12 is its own change and lands first; DEF-0101's bullet, Log line and "Resume when" are changed at this task's acceptance by the records change-set), a real-repository integration test (withdrawn at D-5439: no test in tests/ runs git init or a subprocess; see AC6), and the other open items of DEF-0101.
# Risk, change class: high, as TASK-109, TASK-110 and TASK-126 (a launcher gate change; R2 reads src/** and tests/** as medium and R3 cannot be evaluated so it matches every path it could cover); the change class is critical_cr because the CI's EVALUATOR list holds src/aieos_bootstrap/** and the tests folders.
task: TASK-127
contract_version: v1
task_type: implementation
objective: >-
  Read the root's Git state once more after the session's end. In src/aieos_bootstrap/launcher.py give `launch_outside` the keyword `read=None`, resolved at the call to `gitread.run` (as `start` resolves its own `read`, launcher.py:622) and checked callable with the other callees (`read=3` gives "refused" with the reason "argument"); `read` is not passed to `begin`. In `_launch_finish`, after the session's end has been made (the end call, and the fallback end through `finish_outside` where it is made) and before the handoff file is written, call `_root(read, root)` once (the same two fixed forms, the configuration read and then the status read, with the state directory left out, nothing new in gitread). A clean root adds the finding "root after: clean". A root that is not clean, a read that is refused, gives no answer or an answer out of form, or a read that raises (any Exception raised within the `_root` call), adds findings that begin "root after:" and, when no earlier reason is set, sets the reason "root after" (added at the end of launcher.LAUNCH_REASONS), so that the result is "refused"; the end and the handoff are made as before whatever the read finds, and the read never stops the end, the handoff or the return. The after-read is made in every case in which the end is made after a grant (the normal path, the path in which the starter raised, the unreadable write set, and the granted answer out of form with a string session id) and never when nothing was granted or an argument is refused. The directory's name is never written as a literal in src (writer.STATE_DIR only). Tests are added to tests/unit/test_cli_launch.py, where launch_outside is tested.
