constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The arguments: repo, commit (40 or 64 lowercase hex characters), task_id (TASK-[0-9]+), session_id
      ([A-Za-z0-9._-]{1,128}), log (bytes) and read (None or callable) are checked before any read call; any other
      value, a str subclass among them, gives findings with zero read calls (the stand-in counts its calls). Tests in
      tests/unit/test_base_inputs.py.
  - AC2: >-
      The contract reader: the subset of the header parses every form it names into strs, lists and dicts (block
      maps, block sequences, one-entry maps, nested and multi-line flow collections, multi-line plain scalars,
      multi-line plain scalars as a block-sequence item and inside a flow collection, multi-line double-quoted scalars
      in a flow collection, ">-" folded as YAML folds it with a blank line and a more-indented line, a folded scalar
      "- >-" as a block-sequence item as in the sixteen lines scan82 found, a continuation line starting with "`",
      double-quoted scalars, comments), "2" and "false" staying strs; each refused form of the header (the size,
      U+FEFF, CR, the controls, U+2028, U+2029, a tab, a repeated key, an anchor, an alias, a tag, a literal block, a
      multi-document marker, a single-quoted scalar, a "\" in a double-quoted scalar, " #" or ": "
      in a plain scalar, each listed leading indicator, an empty value, text after a flow collection closes, nesting
      over MAX_DEPTH, an indentation that is not two spaces, an unclosed flow collection) and a missing key
      context_compiler needs each give findings. Tests with stand-in files.
  - AC3: >-
      contract_hash and the log: the SHA-256 of the contract file's bytes; equal to the last task.approved
      contract_hash of the task in the log, else findings; the approval's contract_version equal to the contract's,
      else findings; no task.approved, an approval of another task only, and a log with any check_log finding each
      give findings; a line whose duplicate_of is set, placed after a newer line, does not change which is last.
  - AC4: >-
      resume_record: the task's last decision.execution payload in log order, coming after the last task.approved
      (one before it gives findings); a later decision.execution supersedes an earlier one; a last one whose
      decision is not CONTINUE or CONTINUE_WITH, or none, gives findings; a record whose task, contract_hash or
      contract_version differs from the contract's gives findings, one test each.
  - AC5: >-
      articles, components, interfaces, adrs, traced: each applicable article's block (start and end lines as the
      header says, trailing blank lines stripped, an id holding regular-expression characters read as text; a
      missing or doubled id gives findings); components and interfaces by point 5's reading (one component per
      module, tags []; an entry out of the form, or listed twice, gives findings); a non-empty read_set.schemas
      gives findings; adrs {}; an ADR id in traces_to gives findings; each other traces_to entry's file read whole,
      the entry as written the key; a missing file gives findings.
  - AC6: >-
      files and derived_read_set: exactly the paths a write_set.paths or read_set.paths pattern matches at commit,
      found by listing each pattern's literal prefix (a missing prefix giving none, and a write_set path with no
      wildcard that does not exist at commit giving no file), and the derived paths, each with its text; the derived
      read-set as the resume record's read_set.entries of kind "path" whose sources include "derived", one absent
      from its parent folder's listing left out; a read_set that is not an object with entries in its form (a bare
      list among them) gives findings; only base_files' exact "<p> is missing" counts as absent, any other finding
      failing the call; MAX_FILES, MAX_FILE_BYTES and MAX_PATTERNS each give findings when crossed (the constants
      lowered by the test); a file base_files refuses gives findings naming its path; the read cache asks each fixed
      form once per call, with a given read and with the default (the stand-in counts the calls; gitread.run patched
      for the default).
  - AC7: >-
      last_handoff and budgets: no docs/handoffs/<task>-*.md at commit gives None; exactly one gives {ref, text}; two
      or more give findings; budgets equals BUDGETS, read at call time.
  - AC8: >-
      Purity and touch: base_inputs.py imports exactly hashlib, re and aieos_bootstrap's base_files, gitread, records
      and resume_check, and uses exactly the names the header lists; no open (patched by the string
      "builtins.open"), no clock, no environment, no os call, no subprocess, no ast.Name compile, open, exec or eval,
      no call of .open, .connect, .read_text, .read_bytes, .listdir, .scandir, .stat or .walk; no ".aieos" string, no
      "bench/", no conformance fixture folder name, no src string constant exactly valid, accepted or approved, no
      except clause whose body is only pass or continue (bandit B110, B112); never raises (a stand-in that raises,
      and a stand-in that raises RecursionError, give findings; MAX_DEPTH refuses deep nesting before Python's own
      limit). The tests build the literals ".aieos", "bench/" and the fixture folder names by concatenation or from
      computed values, so the test files hold none of them (tests/unit/test_bench_isolation.py,
      tests/integration/test_conformance_cb_set.py). Tests by ast over pathlib's read_bytes.
  - AC9: >-
      This repository, in its own test class of three test methods (the Work Order of TASK-081, the older-commit case,
      the corpus parse), each expected to run within the runner's 110 seconds through the read cache (proposed; about
      220 blob reads and their trees for TASK-081, and only the 80 contract files for the corpus parse): at
      base_commit, with a log built in the test (one task.approved of TASK-081 with the SHA-256 of
      docs/tasks/TASK-081.yaml at that commit and its contract_version, and one decision.execution CONTINUE of
      TASK-081 after it, in records.check_log's form, whose read_set is an object whose entries hold the derived path
      entry docs/specs/spec-03-resume-check-and-decision-engine.md, outside TASK-081's patterns),
      work_order_inputs(<the repository root>, base_commit, "TASK-081", "s1", log, gitread.run) gives inputs that
      context_compiler.build_work_order accepts (no findings), whose contract equals the file's keys, whose files hold
      docs/specs/spec-07-cli-and-zero-friction-path.md with the SHA-256 that TASK-081's intent_versions names, and
      whose files and derived_read_set both hold the spec-03 path; at af834d5d4e1e85657bb6c08c823fd16c1b106682, where
      docs/tasks/TASK-081.yaml is absent, the same call gives findings; and every docs/tasks/*.yaml at base_commit
      parses with the subset reader except exactly the two of the closed excused list (TASK-028.yaml :118 and
      TASK-036.yaml :106, each with its reason in the header), both asserted refused. Tests in
      tests/integration/test_base_inputs_repo.py.
  - AC10: >-
      Properties: over seeded random contracts written in the subset, the reader gives back the value written; over
      seeded random byte changes of a contract text, it never raises and gives either findings or a value; over
      seeded random logs, the resume record and the approval are the last non-duplicate ones of the task in log
      order. Tests in tests/property/test_base_inputs_properties.py.
  - AC11: >-
      Every existing test passes, the pins of the header among them; the full suite runs locally in three unit parts,
      integration and property before the first code commit; the deterministic rule's local run gives no finding.
      The docstring of base_inputs.py holds, whitespace read as single spaces, the phrases "reads through base_files
      only", "read is injectable", "the commit is an argument", "never raises", "writes nothing", "the log is a value",
      "fails closed" and "this task's choice", read by a test by ast over pathlib's read_bytes; every new test names
      "TASK-082 ACn".
  - AC12: >-
      Broken copies, each failing the tests of its AC: (1) skips an argument check (AC1); (2) accepts a tab or a
      repeated key (AC2); (3) types a number or a boolean (AC2, AC10); (4) skips the approval check (AC3); (5) takes
      the first approval or the first decision.execution (AC3, AC4, AC10); (6) accepts a decision other than CONTINUE
      or CONTINUE_WITH (AC4); (7) cuts an article at the wrong line (AC5); (8) reads a "#section" only (AC5); (9)
      misses a derived path or a matched path (AC6, AC9); (10) drops MAX_FILES, MAX_FILE_BYTES or MAX_PATTERNS, each
      its own copy (AC6); (11) gives no handoff when exactly one exists, or one when two exist (AC7); (12) reads the
      working tree (AC8; also AC9's older-commit case); (13) imports subprocess or os (AC8); (14) reads a bound at
      import time (AC6); (15) accepts an approval of another task (AC3); (16) accepts an ADR id (AC5); (17) accepts a
      CR in the contract (AC2); (18) takes a duplicate line as the last (AC3, AC10); (19) accepts a decision.execution
      before the last approval (AC4); (20) drops the read cache (AC6); the governor's evaluate at acceptance (the
      shadow) with any difference named; the stated choices in the records (not tests).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9, AC10, AC11]}
  - {gate: G3, check: constitution, args: [AC12, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
