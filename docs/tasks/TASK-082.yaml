# TASK-082: the readers of the Work Order's inputs at a commit (specification 6 revision 7, sections 5 and 6;
# specification 7 revision 2, section 6; M7's second task). Plan: decisions D-2336 to D-2342 (session 3797498a): the
# scope note (MYSP/t82/scope82.md, D-2337), the split of the former TASK-082 into these readers and TASK-083's
# get_work_order and query (D-2337), the pin scan (MYSP/t82/pinscan82-out.txt at 4c496d7e, D-2339), the risk run
# (MYSP/t82/risk/risk_class82.py, D-2341), the Resume Check inputs' listing and DEF-0097's draft (D-2340, D-2341);
# r1: reviews rv82a (claude-sonnet-5-5) and rv82b (claude-opus-5-5) of r0 and their dispositions (MYSP/t82/disp82.md,
# D-2344); r1b: the partial round-2 reviews rv82c and rv82d of r1, the corpus scan scan82 and their dispositions
# (MYSP/t82/disp82r2.md, D-2347 to D-2349); r2: reviews rv82e (claude-sonnet-5-5) and rv82f (claude-opus-5-5) of r1b,
# read tools only, and their dispositions (MYSP/t82/disp82r3.md, D-2352).
#
# Scope:
# - A new src/aieos_bootstrap/base_inputs.py with one public function,
#   work_order_inputs(repo, commit, task_id, session_id, log, read=None), which returns (inputs, None), where inputs
#   is the dict that context_compiler.build_work_order takes (src/aieos_bootstrap/context_compiler.py :10-14; the
#   forms of TASK-080.yaml :18-41), or (None, findings: a non-empty list of strs) and no partial value. Every file is
#   read at a commit given as an argument through base_files.read_file and base_files.list_paths (TASK-081), with read
#   passed through (injectable, default gitread.run at call time); the log is a value given, the bytes
#   writer.read_log returns (src/aieos_bootstrap/writer.py :201-205), parsed by records.check_log
#   (src/aieos_bootstrap/records.py :781).
# - The commit is an argument (D-2340 (c); proposed): TASK-083 passes the session's base, so the Work Order is
#   compiled at the base (specification 6 :54); TASK-085 (the readers of the Resume Check's inputs, DEF-0097) is to
#   reuse the same readers at HEAD. AIEOS_BASE is not read here: this module reads no environment; reading AIEOS_BASE
#   stays with TASK-083 and TASK-086, and no part of DEF-0093 (AIEOS_BASE for specifications 5 and 7) is closed by
#   this task.
# - It imports exactly hashlib, re and, of aieos_bootstrap, base_files, gitread, records and resume_check; it uses on
#   base_files exactly read_file, list_paths and MAX_BYTES, on gitread exactly run (the default read, taken at call
#   time, D-2352 (3)), on records exactly check_log, on resume_check exactly matches; it starts no process but
#   through read; it opens, writes and appends no file, reads no clock and no
#   environment, makes no os call, and never raises: every failure, a RecursionError or MemoryError among them, is
#   caught at the public function's top and given as findings (D-2344 (11)).
# - Within one call, the read in use (given, or gitread.run by default) is wrapped by a cache keyed by its
#   arguments, so a fixed form asked twice for the same commit runs once (D-2344 (7), D-2352 (3); proposed).
# - What it does not do: no caller yet (TASK-083 calls it from get_work_order); no MCP tool; it does not call
#   build_work_order (its value is checked against it in the tests only); no change to any existing file.
#
# The inputs and their readers (D-2337; specification 6 :52-55, :60-65). Each reader fails closed.
# - task, session_id: the arguments, in context_compiler's forms (TASK-[0-9]+; [A-Za-z0-9._-]{1,128}); base: commit.
# - contract (point 2): docs/tasks/<task_id>.yaml read at commit and parsed. Options: (a) a parser of a fixed subset
#   of YAML in this module, refusing anything outside it; (b) widening task_contract.parse_contract (an accepted
#   module and its pins, src/aieos_bootstrap/task_contract.py :228-229 keeps seven keys); (c) taking the contract's
#   content from the log, which holds its hash only. This task's choice (proposed): (a). The text is refused first if
#   it is over MAX_CONTRACT_BYTES (1048576, as task_contract.py :17) or holds U+FEFF, CR, a C0 control other than LF,
#   DEL, a C1 control, U+2028 or U+2029 (as task_contract step (3), task_contract.py :17-18). The subset (D-2344 (1),
#   (2)): comment lines and blank lines; block maps by indentation of two spaces; block sequences ("- " items) whose
#   item is a scalar, a flow collection, a one-entry map, or a folded scalar "- >-" read as ">-" is read, its content
#   lines more indented than the "- " (D-2349; sixteen such items in TASK-042 to TASK-045, TASK-048 and TASK-049,
#   scan82 at 4c496d7e); flow lists [...] and flow maps {...} of plain or double-quoted scalars, nested, and a flow
#   collection that runs over several lines (as TASK-081.yaml :174-175); a plain scalar that runs over several lines,
#   its continuation lines more indented than its key (as TASK-081.yaml :463-464) or than its "- " (a block-sequence
#   item, as TASK-045.yaml :116-117, TASK-048.yaml :119-120, TASK-049.yaml :131-132), or inside a flow collection (as
#   TASK-069.yaml :251-252, TASK-070.yaml :262-265), and a double-quoted scalar that runs over several lines inside a
#   flow collection (as TASK-081.yaml :447-448), each line break with the spaces around it folded to one space, as
#   YAML folds them (D-2352 (2)); folded scalars ">-" folded as YAML folds them (a line break between two lines of the
#   same indentation becomes one space; a blank line gives "\n"; a more-indented line keeps the line breaks around
#   it; the rule is YAML's, tested with made-up texts, no contract needing its last part). Refused, each with
#   findings: a repeated key; a tab; an anchor, an alias or a tag; a literal block "|"; a multi-document marker; a
#   single-quoted scalar; a "\" inside a double-quoted scalar; " #" or ": " inside a plain scalar; a plain scalar
#   whose first character is @, `, %, ?, |, >, !, &, *, ', or a flow indicator outside its collection (the rule
#   reads only a scalar's first character, so a continuation line may start with one, as TASK-049.yaml :132); an
#   empty value ("key:" with nothing after and no nested block); text after a flow collection closes; nesting deeper
#   than MAX_DEPTH (200, as context_compiler.py :58); anything else. Values are kept as strs, with no number, boolean
#   or null typing ("2" and "false" stay strs; proposed; listed for specification 6's next revision). AC9's list of
#   docs/tasks/*.yaml excused from parsing is closed, with exactly two entries (D-2352 (2)): TASK-028.yaml, whose
#   :118 holds "{epoch, counter}" inside a plain scalar of a flow list, which YAML reads as a flow map; and
#   TASK-036.yaml, whose :106 holds ": " inside a plain scalar of a flow list, which YAML reads as a key-value pair;
#   both are refused by the subset (the fail-closed reading), and every other contract parses. The parsed map must
#   hold the keys context_compiler checks (TASK-080.yaml :20-24).
# - contract_hash (point 3, settled by D-2337): the SHA-256 of the contract file's bytes at commit (specification 2
#   :22); it must equal the contract_hash of the task's last task.approved event in the log (as execution.py
#   :18-20 reads it), else findings; a log with no task.approved for the task gives findings; the approval's
#   contract_version must equal the contract's.
# - The log (D-2344 (5)): records.check_log(log) once; any finding of its report (its text findings and line
#   findings, as execution.py :183-186 refuses them) gives findings; lines whose duplicate_of is set are skipped (as
#   execution.py :192); "last" means last in log order among the task's other lines; a line's corrects field is
#   not read, every non-duplicate line counting in log order (stated; D-2352 (13)).
# - resume_record (point 4): the payload of the task's last decision.execution event in the log, which must come
#   after the task's last task.approved, must be CONTINUE or CONTINUE_WITH, and must name the task, contract_hash and
#   contract_version (context_compiler's ties, each with its own test). Options:
#   (a) the last decision.execution of the task in log order; (b) the record bound to the session (no field ties a
#   decision.execution to a session id: specification 3 :112-136); (c) the record of the lease's grant, which the log
#   does not record by id. This task's choice (proposed): (a), with the binding to the session a stated limit.
# - articles: for each id of resume_record.constitution.applicable, its text in docs/pre-genesis/constitution.md at
#   commit: the block from the line that starts with "### " + id + " · " (constitution.md :27), compared as text
#   with no regular expression built from an id, up to the next line that starts with "### " or "## ", or the end,
#   its trailing blank lines stripped (D-2344 (9)); an id with no block, or with more than one, gives findings.
# - components, interfaces (point 5): the architecture entities' front matter (specification 2 :79, :83). Options:
#   (a) a fixed folder of architecture entities, read at commit; (b) none for the self-build; (c) a reading of the
#   read_set.interfaces entries themselves. This task's choice (D-2344 (3); proposed; this task's reading for the
#   self-build, not an approved architecture entity; a departure from specification 6 :65, which takes the registry
#   only from the interfaces the intent files declare, and from :62's graph of their components; listed for
#   specification 6 §11 point 10, D-2352 (8)): (c). Each read_set.interfaces entry whose first word has the form
#   "aieos_bootstrap.<module>.<name>" (<module> [a-z_][a-z0-9_]*, <name> a Python name; D-2352 (9)) gives one
#   interface {id: the entry as written, component: "aieos_bootstrap.<module>"} and, once per module, one component
#   {id: "aieos_bootstrap.<module>", paths: ["src/aieos_bootstrap/<module>.py"], tags: []}; any other entry, or an
#   entry listed twice, gives findings. The derived components carry tags [] only, never feed risk rule R3 or any
#   governance decision; R3 stays "not evaluable". context_compiler reads a component path with no wildcard as
#   "<it>/**" (context_compiler.py :290-294), and resume_check.meet lets "**" stand for no name
#   (src/aieos_bootstrap/resume_check.py :163-172), so the component path matches the module file itself; files are
#   read only for the write_set.paths and read_set.paths patterns, so a named module outside them gets no layer-4
#   file (a stated limit; D-2352 (7)). read_set.schemas is unsupported for the self-build: a non-empty list gives
#   findings (proposed; a stated limit).
# - adrs, traced (point 6): for each traces_to entry: an ADR id (ADR-[0-9]+) gives findings, since the self-build
#   has no ADR folder (specification 2 :43; stated limit); any other entry "<path>" or "<path>#<section>" is read as
#   the file at <path>. Options for "#<section>": (a) the whole file's text; (b) the section only. This task's choice
#   (proposed): (a), with the entry kept as written as the key; adrs {}.
# - files (D-2344 (7)): at most MAX_PATTERNS (1000) write_set.paths and read_set.paths patterns; for each, its
#   literal prefix (its names before the first wildcard, or the pattern itself when it has none) is listed with
#   base_files.list_paths (a prefix that does not exist gives no file; a pattern with no wildcard whose path does not
#   exist at commit, a write_set path the task will create among them, gives no file, D-2352 (4); a pattern naming
#   one file reads that file), and every listed path the pattern matches (resume_check.matches) is read with
#   base_files.read_file; then every derived path present at commit; a matched path that cannot be read (not UTF-8,
#   over base_files.MAX_BYTES, or any other refusal) gives findings for the call; every read counts toward MAX_FILES
#   and MAX_FILE_BYTES. "Does not exist" is told only by base_files' finding that is exactly "<p> is missing"
#   (src/aieos_bootstrap/base_files.py :191, :223) for the path or prefix, or one of its ancestors; every other
#   finding fails the call (D-2352 (5)).
# - derived_read_set (point 7; D-2344 (8)): options: (a) recomputed from the write-set's Python files at the
#   contract's input_state.base_commit by resume_check.direct_imports (specification 3 :63); (b) left to TASK-085 and
#   given as []; (c) the path entries of the resume record's read_set whose sources include "derived"
#   (src/aieos_bootstrap/resume_check.py :307-319), not recomputed, as layer 1 is taken from the record
#   (specification 6 :60). This task's choice (proposed): (c). The record's read_set must be an object whose entries
#   is a list of objects with exactly entry (a str), kind and sources (a list of strs), as resume_check.py :684-685
#   and :316-318 build it and records.py :548 checks it, else findings (D-2352 (1)); the entries of kind "path" whose
#   sources include "derived" are taken; each is absent when it is not among the listing of its parent folder at
#   commit (a missing parent folder meaning absent too), and is then left out (context_compiler.py :24-25 uses only
#   the derived paths present in files); a listed one that cannot be read gives findings (D-2348 C7).
#   input_state.base_commit is not read.
# - last_handoff (point 8, settled by D-2337; D-2344 (4)): the paths "docs/handoffs/<task_id>-*.md" among the listing
#   of the prefix "docs" at commit (proposed: the self-build keeps project files under docs/, as docs/tasks and
#   docs/records, while specification 2 :35's .aieos/ layout is open (specification 2 :46), and this module may name no
#   ".aieos" string, tests/unit/test_writer.py :402); none gives None (TASK-087 writes the file; DEF-0095); exactly one
#   gives {ref: its path, text: its text}; two or more give findings, since which one is "the last" is open
#   (specification 6 :97).
# - budgets (point 9, settled by D-2337): the module constant BUDGETS, read at call time: constitution 65536,
#   components 32768, traced 262144, files 524288, handoff 32768 bytes (proposed; specification 6 §11 point 9 leaves
#   the numbers open, listed for its next revision).
# - Points 10 and 11 (query's ref forms; AIEOS_BASE against the lease or the record) are TASK-083's, named and left
#   open here.
#
# Stated choices (this task's; specification 6 section 11 stays open for its next revision): the points above marked
# "This task's choice"; the public name and value shape; MAX_FILES 2000, MAX_FILE_BYTES 16777216 (the sum of the
# texts read), MAX_PATTERNS 1000, MAX_CONTRACT_BYTES 1048576 and MAX_DEPTH 200, read at call time; BUDGETS; the read
# cache within a call; values kept as strs; each listed for specification 6's next revision (proposed).
#
# Owner-act boundary: none reached. Nothing is launched or connected; no hook, setting, policy or measurement.
#
# Stated limits.
# - The value's truth is what the commit and the log hold; that the commit is the session's base is the caller's
