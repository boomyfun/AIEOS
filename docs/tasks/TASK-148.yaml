acceptance_criteria:
  - AC1: >-
      The new module. src/aieos_bootstrap/capture_submit.py defines capture_and_submit with the argument list and the return form of the objective and the closed set of reasons, and nothing else public; it imports no process, file, clock or aieos_runtime module and only gitread, conformance, submit and the standard library (a test reads the file with read_bytes and ast and checks the import list and the absence of open, exec, compile, subprocess, os.system); no exception escapes (a test calls it with callees that raise and sees a refused mapping); every refusal of the steps (1) to (5) and (7) to (13) is a test with fake callees, and each shows that on a refusal before the capture neither capture nor restore nor submit_fn was called, that after a refused capture restore was not called, that after a done capture a refused, raising or out-of-form submit gives reason 'submit' and restore was NOT called; that a 'duplicate' submit leads to the restore call; and that a refused or raising restore after a done submit gives reason 'capture'.
  - AC2: >-
      The classes, the parser and the scope (D-6633 M1, M2, M10). With a fake status output (the -z bytes) the parser gives: ' M' modified, ' D' deleted, '??' added; every other pair (staged 'M ', 'A ', 'D ', 'R ', 'C ', 'U', 'T', a double letter, '!!') a refusal 'staged'; the form rules equal launcher._root_entries on shared inputs (a '##' entry, a status character outside the set, a missing final NUL, a short entry) and the parser's paths equal _root_entries' paths on those inputs; a path outside the write set, a path that fails conformance.path_ok, a path that matches a forbidden pattern, a path under the state directory or '.git' in another letter case, a non-UTF-8 path and an empty status entry list each give their own result (reason 'scope', 'scope', 'scope', 'scope', 'status', and result 'none'); the pattern forms are tested against expected values that each equal what G0's pattern_re gives (a trailing '**' with the folder's own name, a middle '**', a pattern with no '/', '*' inside a name, each listed with its expected value); the function that refuses configuration keys is compared with launcher._config_keys on shared inputs (equal answers).
  - AC3: >-
      The message, the event id and the clock. The message passed to capture has a subject line, a body paragraph, and a last paragraph of exactly the two trailer lines; submit._identify (called from the test through recovery.trailers) reads the task and the fence from it; the event id is the SHA-256 hex of 'task.submitted', the task id and the commit id joined by LF, and equals verification_records' form on the same inputs (the test imports the helper if it is public, else recomputes it); the identity is the last user.name and the last user.email of the config output and is refused when absent or unsafe; the clock is read once after the capture and the value passed to submit_fn is that fresh read (a test with a counting clock shows it is read after capture returned and before submit_fn is called).
  - AC4: >-
      The launcher (D-6633 M3, M4, M6; D-6737 (i), (v)). The nine values of LAUNCH_REASONS in the order of the objective; the parameter tail of launch_outside is [base, read, capture, restore]; a lone capture or restore, or a non-callable one, is reason 'argument'; with both callables a fake run shows the order starter, capture_and_submit, finish; the step runs only when the run is 'returned'; a 'refused' answer gives the launch result 'refused' with reason 'capture' (when no earlier reason is set) and the end and the handoff are still made; 'none' and 'done' do not change the result; a test raises a test-defined BaseException subclass from the capture callee and shows that finish and the handoff were called and that the BaseException is re-raised after them; the contract step's refusals (_launch_write_set) are unchanged (a test); with both keywords None the existing tests of launch_outside pass unchanged (only the assertions of AC5 are edited); two tests for the post-restore check: a done capture and restore with a clean read gives 'root after: clean' and 'done', and a dirty read after the restore gives reason 'root after'; a test drives launch_outside with finish set to launcher.end, its store callees faked so that session_leases gives no unexpired row, a done capture and a 'submitted' submit_fn, and shows that the end gives 'done' by the gone path, that the handoff is called and that the launch result is 'done' (D-6633 M4).
  - AC5: >-
      The existing tests (D-6738 C1; the departures from D-6633 (d) and D-6617 C1). tests/unit/test_cli_launch.py, tests/unit/test_launcher.py and tests/unit/test_cli.py are edited at exactly the assertions named in THE EXISTING TESTS THAT THE CHANGE AMENDS of the objective, each listed in the acceptance note with its file and line; no test is removed, weakened or skipped; the whole suite passes by the slice method (D-6249 C2, D-6328 E1.6). The kept pins are constraints on the new code and are met (D-6738 C3; the scan SR/bt1b/pin_scan.md items 7 to 16): launcher.py names no open, exec, eval, compile, __import__, subprocess, os, sys or time, no attribute environ, getenv, now or open_store, no attribute write but handoff_file.write, no assert and no ".aieos" string (test_launcher.py :1373-1394); launch_outside and every _launch* name the same names (test_cli_launch.py :347-356); no string constant of launcher.py holds the state directory's name or is exactly valid, accepted or approved, and _launch_finish names _root (test_cli_launch.py :946-952); the text `_segment_forms_ok(` occurs exactly three times in launcher.py (test_cli_launch.py :760-775); the begin call has only the keyword base (test_cli_launch.py :830-840); the default callee order ORDER is unchanged (test_cli_launch.py :143); cli.py's _launch, _render_launch, _launch_in_form and the other helpers name no writer, held_leases or handoff_file (test_cli_launch.py :536-539 and the siblings in test_cli_run.py :922-925, test_cli_init.py :291-294, test_cli_import.py :596-599, test_cli_approve.py :652-655, test_execution_status.py :453-455); cli.py and launcher.py hold no string naming the project-state directory (test_cli_init.py :297-300); the docstrings only GAIN text and keep every pinned sentence (the assertIn and assertNotIn phrase pins listed in the scan, item 14; launcher.py's new paragraph must not contradict test_cli_run.py :1241-1248, "It starts no runtime: no process but through gitread" and "The shipped command passes no starter, so it starts no runtime": it says that the capture step starts no process itself, the injected callables do). tests/run_tests.py discovers tests/unit/test_capture_submit.py without a change (run_tests.py :12-20; D-6633 M9). If any other existing test fails because of the new keywords, that is escalation needs_out_of_scope_change, not an edit.
  - AC6: >-
      The CLI. main, _run and _launch have the keywords capture and restore after starter and no positional change; _launch calls launch_outside with the keywords only when both are not None, and the four-argument call of the existing tests is unchanged; the entry block is exactly the two statements of the objective (test_cli.py :277-280 amended to them), cli.py's import set gains exactly aieos_runtime.task_capture (test_cli.py :346-347), and a test by ast shows that cli.py names aieos_runtime only in the entry block and in ONE statement.
  - AC7: >-
      The CI evidence of the task push (D-6633 M13, D-6738 C2). deterministic_rule and the bandit step run on the three source files; the CI read must show deterministic_rule's summary line with 0 findings and no FAIL line, and the bandit lines for the new and changed core files with their own output; an absent line is a finding. The GOV-003 step reports an evaluator change for the seven paths (a report, not a block) and the "GOV-003 base tests (report only)" line (aieos-checks.yml :2240-2272) is part of the CI read: the ONLY base-test failures allowed are the assertions that THE EXISTING TESTS THAT THE CHANGE AMENDS names, each named: test_launcher.py's import set (:1369-1373), test_cli.py's entry line (:277-280) and import set (:346-347), test_cli_launch.py's parameter tail (:820-821) and LAUNCH_REASONS (:822-823); any other base-test failure is a finding brought to the decision agent. Acceptance is by the decision agent's explicit decision only (constitution.md :94). aieos-native is not run for a task branch and is not an acceptance condition. The CI's own SEC-002 rule (e-mail address or GitHub URL in an added line) is run on the new test files before the task push (D-6617 (3)).
  - AC8: >-
      The real-git behaviour, shown at acceptance by a scratch harness outside the repository (the one whose exact source the decision agent releases before acceptance; copies of the changed files from the task commit and of the TASK-147 module in a scratch directory; never run in E:\AIEOS; D-6623 E1 and E12, D-6633 M14): a throwaway repository, capture_and_submit with gitread.run, the real task_capture.capture and restore and a stub submit_fn, cases: a modified, an added and a deleted file in the write set (done, the ref holds one commit with the two trailers, the work tree clean afterwards by gitread's status form); a change outside the write set (refused scope, nothing captured, tree unchanged); a path under a forbidden pattern (refused scope); a staged change (refused staged); no changes (none); a configuration with a filter key (refused config); a submit_fn that refuses (the ref stays, restore not called, the tree unchanged, reason 'submit'). Its unedited output is acceptance evidence, labelled worker-supplied.
  - AC9: >-
      Limits, class, evidence and departures, stated at acceptance. (1) The ref name is fixed by the core; a task whose ref exists is refused by the module (reason 'capture'). (2) Ignored files are not seen by the status form and are not captured. (3) Empty directories left by clean stay. (4) The status and the config reads are two reads, not atomic; the capture checks HEAD again. (5) A session whose work is captured but whose submit failed leaves the ref and the commit; the lease is released only by a successful submit; the tree is left unrestored (D-6608 Q4); root after reports it and the next launch is not granted until it is resolved by hand. (6) The classes come from the status read of this module and are trusted by the TASK-147 module. (7) The end after a submit goes by the 'gone' path (launcher end/observe_gone; the lease was released by the submit): a departure from read_set_record.py :26-29, which says the caller passes the read set before adapter.submit (a submission may release the lease); the alternative of passing a no-op release to submit is rejected because it would change submit's own AC5; AC4 shows that the end gives 'done' by the gone path (D-6633 M4). (8) On a scope refusal the tree is left as it is, root after reports it, the result is 'refused' with reason 'capture', NO violation event is recorded (launch_outside calls end with violation at its default False and never records a violation), and the next launch of the task is not granted until the tree is clean (launcher.py :485-487) (D-6633 M5). (9) The matcher is conformance.path_matches gated by conformance.path_ok, with the forbidden check; it equals the CI's G0 scope step for well-formed paths and patterns; governor.matches, which the core's own scope_drift check uses (scope_drift.py :215), differs on a trailing '**' with the folder's own name and is not used here (D-6633 M1). (10) GOV-003: the seven paths are evaluator paths; the evidence profile of the high class (TASK-147 AC8 (14)) applies: unit_test, deterministic_rule, static_security_analysis, ai_review by a PAIR of blind reviews on Haiku 5.5 in their own sessions (same vendor, a stated departure), a per-article review and a decision_agent_review; no launched session may judge its own work; the per-article review covers two points (D-6633 M16): GOV-003 (whether the change alters any input the CI's evaluator reads) and INV-001 (the injection of the git-writing callee into the core's launch: the D-6609 reading, the precedent of the starter at cli.py's entry block and the revision-20 rule at aieos-checks.yml :1818-1831). (11) No new process starts in the core: capture_submit starts none; the module of TASK-147 does, under the CI rule check_capture. (12) The author and committer e-mail come from the clone's configuration; a later push of the task ref meets SEC-002 and the push conditions' e-mail check, which is the guard (D-6633 M15). (13) With the two keywords None (the shipped command if the entry block is not changed, or a test), the behaviour is today's and DEF-0147 remains on that path. (14) The lease: the lease is 2 hours (LAUNCH_LEASE, launcher.py :1074, begun at :1282), the starter's run is bounded by 6600 seconds (claude_starter.py :100), so 600 seconds remain; the step makes at most about ten git calls of 60 seconds each (task_capture.py limit (14)), 600 seconds in the worst case, equal to the margin; a submit after the lease's expiry is refused by the writer and is a refusal 'submit'; no code change; a deferred item for the margin is filed at acceptance under the next free DEF number found by Glob at that time (D-6737 (v), D-6608 M2). (15) Departures from the decisions it applies: D-6617 C1 (the end-to-end integration file replaced by the harness, D-6623 E1/E12, D-6633 M14), D-6633 (d) (the write set gains test_launcher.py and test_cli.py, D-6738), the matcher ruling of D-6633 M1; the gone path (7). (16) A launch needs the owner's typed yes and may cost money; this contract does not authorise one. (17) The risk class is high (risk-rules R3, fail closed). (18) forbidden is not among base_inputs.CONTRACT_NEEDS (base_inputs.py :77); a contract without a well-formed non-empty forbidden list passes the contract step unchanged (D-6633 M2) and its capture is refused with reason 'scope' after the session, leaving the tree as it is.
capabilities:
  filesystem: {read: [src/aieos_bootstrap/launcher.py, src/aieos_bootstrap/cli.py, src/aieos_bootstrap/submit.py, src/aieos_bootstrap/gitread.py, src/aieos_bootstrap/governor.py, src/aieos_bootstrap/conformance.py, src/aieos_bootstrap/recovery.py, src/aieos_bootstrap/read_set_record.py, src/aieos_bootstrap/task_contract.py, src/aieos_runtime/task_capture.py, tests/unit/test_cli_launch.py, tests/unit/test_launcher.py, tests/unit/test_cli.py, tests/unit/test_cli_run.py, tests/run_tests.py, docs/tasks/TASK-147.yaml, docs/specs/spec-05-adapter-contract.md, docs/specs/risk-rules-gov-aieos.md, docs/pre-genesis/constitution.md, docs/pre-genesis/assurance-model.md, docs/pre-genesis/decision-matrix.md], write: [src/aieos_bootstrap/capture_submit.py, src/aieos_bootstrap/launcher.py, src/aieos_bootstrap/cli.py, tests/unit/test_capture_submit.py, tests/unit/test_cli_launch.py, tests/unit/test_launcher.py, tests/unit/test_cli.py]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 600k, wall_time: 4h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6]}
  - {gate: G3, check: constitution, args: [AC7, AC8, AC9, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND the aieos-checks run of the accepted commit succeeds AND AC8's harness output and AC7's evidence are shown
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
# Rough size: capture_submit.py about 330 lines (arguments 45, config and identity 50, status parse and classes 70, scope with forbidden 50, message and event id 30, the steps 85); launcher.py about +55 lines (the import, the keywords and their checks, the forbidden helper, the step in the try, the docstring paragraph); cli.py about +20 lines (the keywords through main, _run and _launch, the entry block, the docstring); tests/unit/test_capture_submit.py about 800 lines; tests/unit/test_cli_launch.py about +90 lines (the amended assertions and the new launcher cases); tests/unit/test_launcher.py about +3 lines; tests/unit/test_cli.py about +6 lines. The BT1b harness about 220 lines.
