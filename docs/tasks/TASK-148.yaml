# Task contract TASK-148 (DRAFT v3 of the scratchpad contract, scratchpad only until approved; session dc7cf6ca, 2026-11-20; D-6604 to D-6739; BT1b, the core part of route (c) of DEF-0149: the capture-and-submit step of `aieos launch`). It is v1 (tp/BT1b_contract_draft_v1_t148.yaml) corrected by D-6633 M1 to M16, with D-6737 (the five design rulings (i) to (v), the base of v3) and D-6738 (the write set gains tests/unit/test_launcher.py and tests/unit/test_cli.py as named departures from D-6633 (d) and D-6617 C1) and D-6739 (the five flags ruled and the replacements R1 to R6: the reason 'capture' is added; there is NO restore after a refused submit; the forbidden key is present in the contract map; submit_fn None; the new state key). It also applies D-6605, D-6609 C1 to C4, D-6616, D-6617 C1 to C12 (C1's integration file replaced by the harness, D-6623 E1 and E12, D-6633 M14) and D-6623 E12. The contract is approved by the decision agent (A41, A51) at the decision of its commit, not by the owner. At the base (main c303608543170fdbba426f0425e4d7356039c200, re-read at approval) docs/tasks ends at TASK-149 (TASK-148 is free and reserved for this task) and .aieos/tasks ends at TASK-143 (Glob). It depends on the TASK-147 module (src/aieos_runtime/task_capture.py, on main since 9ae533a and fixed by TASK-149 at fabad6c6 and 34eb70e).
# Authority (the decision agent's, never the owner's): the git-writing step lives in src/aieos_runtime (D-6609, grounded on docs/specs/spec-05-adapter-contract.md :24); the core takes the runtime's two functions by INJECTION at the entry line only (the precedent: the starter, cli.py's entry block, and the CI rule check_runtime_imports at aieos-checks.yml :1818-1831, which exempts cli.py's `if __name__ == '__main__':` block), so no CI revision is needed. DEF-0149 and DEF-0147 are the reasons and ARE on main (landed with the backlog at 55f67634); this contract closes nothing: BT1b's restore is meant to close DEF-0147, and the closure is recorded at acceptance. DEF-0147 remains true on the path where the two injected callables are both None (a limit, AC9 (13)).
# Not in this task: the runtime module (TASK-147, TASK-149), any change under src/aieos_runtime or .github, any launch, any settings file, the gate maker (BT2), the evaluation runner (BT3), the pins (BT5). GOV-003: every path under src/aieos_bootstrap/** and tests/unit/** is an EVALUATOR path (aieos-checks.yml :528, :598), so the task push is reported as an evaluator change (a report, not a block) and acceptance is by the decision agent's explicit decision only (constitution.md :94, "never auto-accepted", D-6633 M13).
task: TASK-148
contract_version: v1
task_type: implementation
objective: >-
  Make `aieos launch` capture the session's change on refs/heads/task/<id> and submit it while the lease is held, through the two callees of the TASK-147 module, so that a session ends with its work as one commit that carries the AIEOS-Task and AIEOS-Fence trailers and a task.submitted event, and the working tree is clean again. THE NEW CORE MODULE src/aieos_bootstrap/capture_submit.py (no process, no file, no clock of its own; it imports gitread, conformance, submit and the standard library only; no import of aieos_runtime): one public function capture_and_submit(root, repo, task_id, token, base_head, write_set, forbidden, state_name, clock, recorder, read, capture, restore, submit_fn=None) returning a mapping with exactly the keys result ('done', 'none' or 'refused'), reason (None, or one of the closed set 'status', 'config', 'identity', 'scope', 'staged', 'capture', 'submit'), findings (a list of str), commit (a 40-hex id or None), paths (the list of captured paths, or []); submit_fn None means submit.submit with its defaults (so that launcher.py imports capture_submit only, D-6738 C1). It never raises an Exception. The interface forms are those of the TASK-147 module (task_capture.py :317 capture(repo, ref, old_head, paths, message, identity, state_name) and :347 restore(repo, paths, classes, state_name), docs/tasks/TASK-147.yaml): classes is a mapping from each path to 'modified', 'added' or 'deleted'; identity is a mapping {'name', 'email'}; capture returns {'result': 'done', 'commit': <40 hex>} or {'result': 'refused', 'reason', 'findings'}. THE STEPS, in this order, each refusal ending the step with no capture and no restore except where stated: (1) argument checks (the types of every argument; capture, restore and, when not None, submit_fn callable; token a mapping with an str epoch and an int counter; base_head 40 lowercase hex; write_set and forbidden non-empty lists of str, each passing conformance.pattern_ok, a violation being reason 'scope'; state_name beginning with '.'); (2) the configuration read, once, with exactly the argv and TIMEOUT of launcher._root (launcher.py :468, gitread.CONFIG_LIST): a refusal when it gives no answer, when a key begins with 'filter.' (ASCII-lowercased) or equals 'core.worktree' (the same rule as launcher._config_keys :443-462; the module repeats it and a test compares the two functions on shared inputs); the identity is the LAST user.name and the LAST user.email of that output, as git does (a refusal, reason 'identity', when either is absent, empty, or holds '<', '>', LF or NUL); (3) HEAD must equal base_head (a read with the form of launcher._head; reason 'status' on a mismatch); (4) the status read with exactly the argv of launcher._root (gitread.STATUS_HEAD plus the ':(exclude)' of state_name, launcher.py :478), parsed from its -z output by a parser in this module that KEEPS the form rules of launcher._root_entries (launcher.py :417, :426-434: a '##' entry is refused, the status-character set applies, the output must end in NUL) and ALSO returns the two status characters (D-6633 M10; launcher._root_entries drops them at :435 and is not changed; a test compares the parser's paths with _root_entries on shared inputs); every path is decoded as strict UTF-8 (a decode failure is a refusal 'status'); the classes are ' M' modified, ' D' deleted, '??' added (untracked, listed by --untracked-files=all so only files); ANY other pair (a staged change, a rename, a copy, a conflict, a type change, an ignored path) is a refusal 'staged' naming only the count and the first twenty pairs (a rename shows as a deletion plus an untracked path, so a rename pair is a fallback refusal only); (5) the scope check (D-6633 M1 and M2): every changed path must pass conformance.path_ok (conformance.py :659-663) and then match a write-set pattern under conformance.path_matches (conformance.py :666-689, whose semantics equal those of the CI's G0 scope step: its own pattern_re, aieos-checks.yml :761-773, and its scope function at G0 FAIL forbidden path / not in write_set); NO second matcher and NO intersection with governor.matches (the two differ only on a trailing '**' with the folder's own name, where path_matches is the stricter and equals G0); a path that matches a pattern of forbidden is also refused; a path under the state directory or '.git' in any letter case is refused; each of these is reason 'scope', nothing is captured or restored; (6) when there are no changed paths the result is 'none' (a finding says so; no capture, no submit) and the launch goes on as today; (7) the commit message: a subject line 'AIEOS task submission <task id>', one blank line, a body line of one sentence naming the count of paths, one blank line, and the trailer paragraph with exactly the two lines 'AIEOS-Task: <task id>' and 'AIEOS-Fence: <epoch>:<counter>' (submit._identify needs a body and a last-paragraph trailer block); (8) capture(repo, 'refs/heads/task/<task id>', base_head, paths, message, identity, state_name) (any non-'done' answer is a refusal 'capture' whose findings carry the module's reason word and findings; no restore after a refused capture); (9) the event id is the SHA-256 hex of the three texts 'task.submitted', the task id and the commit id joined by one LF, stated as a new derivation in the project's digest form (the form of verification_records.py :75-76 and :133-135; recovery's compensating id is a different form, recovery.py :71-73 and :237, so the two cannot collide; both are deterministic, so a retry gives 'duplicate'); (10) now2 for the submit is a FRESH clock read after the capture (a read that is not timezone-aware UTC with whole seconds is a refusal 'submit'); (11) submit_fn(root, repo, commit, task_id, event_id, recorder, now2) (the keywords read, append, release and held are NOT passed); the answer must be a mapping and its result must be 'submitted' or 'duplicate' (the two non-refused words of submit.submit, submit.py :203-218 and _release :243-261; a missing release is a finding, not a refusal); anything else is a refusal 'submit' with the answer's findings, and the commit and the ref STAY (nothing is undone); the restore is NOT called and the tree stays as the session left it (D-6608 Q4, D-6609 C3(b), D-6739); (12) restore(repo, paths, classes, state_name) only after a DONE capture AND a submit whose result is 'submitted' or 'duplicate' (D-6609 C3(b), D-6737 (v), D-6739); a refused or raising restore adds its findings and sets the result to 'refused' with reason 'capture' (D-6633 M12 as narrowed by D-6739); (13) the result 'done' only when the capture, the submit and the restore all gave done. THE ORDER OF THE WHOLE STEP is capture, then submit, then restore, then the session's end (D-6609 C3, D-6737 (v)): the submit gets the fresh clock value of step (10), and the end keeps the clock read that _launch_finish already makes after the step (launcher.py :1188, `now2 = clock()`), so the end has a value read after the restore and no clock code of the end changes. THE LAUNCHER (src/aieos_bootstrap/launcher.py; it imports capture_submit, one new name): LAUNCH_REASONS gains 'capture' appended AFTER 'root after' (nine values; a named change to test_cli_launch.py :822-823, brought to the decision agent, D-6738 C1); launch_outside gains two keywords capture=None and restore=None after read (the parameter tail is [base, read, capture, restore]), both None or both callable (a lone one, or a non-callable one, is reason 'argument' with the existing finding form, before the clock and begin are called); when both are given, the starter's run is 'returned' and the contract's write set was read, the step capture_submit.capture_and_submit is called INSIDE the existing try whose finally calls _launch_finish (launcher.py :1319-1329), after the starter returns, with the grant's head as base_head, the write set and the forbidden list of the SAME contract_at answer (a small helper beside _launch_write_set; the existing contract step's refusals, launcher.py :1141-1163, are unchanged and a test shows it), writer.STATE_DIR, the clock, state['recorder'], read and the two callees; an Exception from the step is a finding and the reason 'capture' (when no earlier reason is set); a BaseException is NOT caught there, so _launch_finish runs in the finally whatever the step raises and the BaseException is re-raised after the end and the handoff, as for the starter (D-6633 M3; a test raises a test-defined BaseException subclass from the capture callee); the answer's findings are added to the launch's findings; a 'refused' answer sets the reason 'capture' when no earlier reason is set (so the launch result is 'refused', as for 'root after'); 'none' and 'done' add their findings only; the end and the handoff are made as before in every case (a session that submitted has its lease released, so the end goes by the 'gone' path: launcher.py end/observe_gone, a departure from read_set_record.py :26-29, AC9 (7)); the post-restore check is the launcher's root-after check (launcher.py :1205-1215), which reads the root after the step and the end: a clean root after a done capture, submit and restore gives 'root after: clean' (D-6633 M6, D-6617 C4); when the two keywords are None nothing changes (every existing call and test of launch_outside that does not pass them behaves exactly as before). THE CLI (src/aieos_bootstrap/cli.py): main, _run and _launch gain the keywords capture=None and restore=None after starter (no positional change; cli.main's signature is not pinned, D-6738 C4); _launch passes them to launch_outside as keywords ONLY when both are not None (so the existing four-argument call stays as it is); the entry block (cli.py :748-750) becomes exactly `from aieos_runtime import claude_starter, task_capture` and `sys.exit(main(sys.argv[1:], sys.stdout, os.environ, _clock, starter=claude_starter.starter, capture=task_capture.capture, restore=task_capture.restore))` (ONE runtime import statement, D-6738 C1); _launch_in_form accepts the reason 'capture' through launcher.LAUNCH_REASONS (cli.py :465) with no other change. THE TESTS: with fake callees only, as the existing launch tests do (D-6623 E12: no real git in the suite; the real-git behaviour of the whole step is shown at acceptance by a scratch harness that the decision agent releases before acceptance, AC8). THE EXISTING TESTS THAT THE CHANGE AMENDS (D-6738 C1; each amended assertion is listed by file and line at the base c303608543170fdbba426f0425e4d7356039c200 and no other change is made in these files): tests/unit/test_launcher.py: the set at :1369-1373 gains exactly 'capture_submit' among the aieos_bootstrap names; the docstring at :1362-1365 gains "TASK-148" and the module's name; the execution.py set and the test at :1375-1392 are unchanged. tests/unit/test_cli.py: :277-280 becomes exactly the two statements of THE CLI above (the keyword order the same in the code and in the test); :346-347 gains exactly 'aieos_runtime.task_capture'; :459-473 is unchanged (one runtime import statement); the two docstrings (:270-272 and :337-339) gain "TASK-148" text only. tests/unit/test_cli_launch.py: :820 checks [-4:] == ['base', 'read', 'capture', 'restore']; :821 checks that the last two defaults are None; :822-823 (LAUNCH_REASONS) gains the ninth value 'capture' (the named change that adds a reason).
