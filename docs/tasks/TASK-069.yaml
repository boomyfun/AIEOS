# script from the base just before commit C.
# What was read for this draft (D-1524 C2; D-1528): specification 5 revision 4 sections 6 to 11; page D-1524 (the
# scoping note and its correction); src/aieos_bootstrap/adapter.py in full; src/aieos_bootstrap/violation.py in full;
# eventlog.append (:147-235) with _lease_findings (:125-144) and refusal_record (:117-122); writer.append_event
# (:235-264); writer.session_lease's docstring and _store_answer (:961-1021); spec 1 :87 (§5.3) and spec 2 :205 (§6.3);
# TASK-068.yaml in full; tests/integration/test_writer_files.py (:1-116, and its class list); tests/unit/test_adapter.py
# :320-367 (R9Purity and R9OwnTests, revision 2).
# Revision 2 (round t69a, reviews R1 to R5 on claude-sonnet-5-5; R3 "fail" on two blocking findings, the others
# "pass"; D-1532): no new import in adapter.py, an inline _LEASE_KEYS with an equality test, and the new unit tests in
# a new module tests/unit/test_adapter_session.py, so tests/unit/test_adapter.py stays unchanged and its R9Purity and
# R9OwnTests pass (R3-B1, R3-B2; R4-2 moot); a fixed finding for a refused lookup with no finding (R1-1); a non-mapping
# answer of adapter.violation (R1-2, R3-3); "entry: after the record" (R1-3, R2-5); the nested lists copied (R1-4); a
# relative root (R1-5); the race wording (R2-1); the retry after a partial outcome stated (R2-2); "no_lease_row:"
# after a done (R2-3); the filter on every path and the epoch-and-counter rule (R2-4, R3-5); one predicate (R3-4, and
# D-1530's note); the second-fence copy described (R3-6); depends_on, interfaces and forbidden (R4-1, R4-3, R4-4);
# spec 5 :109 cited (R5-1); the read-set record left for point 10 (R5-2); a "lease" refusal is no violation (R5-3);
# h4c Y1-7's cost (R5-4); DEF-0088 point 2 (R5-5).
# Task type: implementation. What it adds:
# - in src/aieos_bootstrap/adapter.py, a fifth call, session_violation(root, session_id, observation, event_id,
#   recorder, now, lookup=None, append=None, release=None): the violation path tied to a session by its session id and
#   the one live lease the core's store holds for it (spec 5 :109); the hook side never holds the fencing token (it
#   follows from spec 5 :109, the tie by the session id and the store's one lease, with :108 for what the launcher
#   passes in the environment: the session id and the root, no token; R5-1), so the token is read core-side from that
#   lease. lookup, append and release default, at call time, to writer.session_lease, writer.append_event and
#   writer.release_lease_token (the module's existing stand-in form); and a private constant _LEASE_KEYS =
#   frozenset({'task_id', 'fencing_token', 'expires_at'}), equal to eventlog.LEASE_KEYS by a test, so adapter.py's
#   import set stays the base's (R3-B1);
# - tests: a new module tests/unit/test_adapter_session.py (R3-B2: tests/unit/test_adapter.py is not changed, so its
#   R9OwnTests, which scans test_adapter.py, test_replay.py and test_violation.py, :356, passes unchanged), a new module
#   tests/property/test_adapter_properties.py, and one new class of end-to-end tests in
#   tests/integration/test_writer_files.py (the only kind of place a real store may be built: the workflow's per-path
#   allowance for sqlite3 and tempfile).
# writer.py, violation.py and eventlog.py are unchanged (D-1524's correction: session_lease's tied value already
# carries task_id and fencing_token, writer.py:316-320, :1008-1009). No hook-side module is changed, and nothing
# hook-side calls the new function: its only callers are its tests; the caller is H2's PreToolUse program, a later
# contract. The allowed pair (claude_code_channel.py, adapter.violation) of TASK-068's separation check stays
# unchanged (D-1524 (h)); H2 replaces it.
# The flow of session_violation, in this order, the first step that ends giving the result; the result is a mapping
# with exactly adapter.RESULT_KEYS:
# (1) the session-level arguments, all inside one try whose any exception gives "refused", reason "argument", findings
#     ["argument: checking the arguments raised <type name>"]: root a non-empty str; session_id a non-empty str (so
#     the lookup is always made with a session id); now a timezone-aware datetime in UTC with whole seconds
#     (adapter._utc_whole); a failed check gives "refused", "argument", with a fixed finding naming the argument. The
#     observation, event_id and recorder are checked in step (3), by violation.argument_findings.
# (2) the lookup: lookup(root, session_id, now), reached at call time, with the lookup's own default timeout. Its
#     answer is read through adapter._store_done: a "refused" with a str reason gives "refused", reason "lease",
#     findings the writer's findings as a list of str (each "<writer reason>: ...", writer.py:961-963, :971, :975 and
#     _live_lease's), or, when that list is empty, the fixed finding "lease: the lookup refused (<reason>)" (R1-1), so
#     the writer's own reasons stay visible as findings[0]'s prefix: "argument", "root",
#     "no_store", "link", "unreadable", "tables", "lease_row_without_session", "no_lease_row", "session", "ended",
#     "leases" (writer.py:1010-1011). The writer's "argument" is thus told apart from steps (1) and (3)'s by the
#     result's reason ("lease", not "argument"). "lease_row_without_session" and a "done" with reason "no_lease_row"
#     cannot arise, since step (1) requires a session id (writer.py:973-976); either, if a stand-in gives it, ends as
#     the next sentence says. A "done" goes on only with reason "tied" and a value that is a dict with exactly
#     _LEASE_KEYS whose task_id is "TASK-" followed by digits and whose fencing_token has adapter._token_form;
#     every other answer, and an exception raised by lookup, gives "refused", reason "lease", findings ["lease: the
#     lookup gave no tied lease"] (an exception: ["lease: session_lease raised <type name>"]). expires_at is not
#     checked here: the lookup's "unexpired" is expires_at > now, and the writer's fence checks it again (step 3).
# (3) the record: adapter.violation(root, the lease's task_id, the lease's fencing_token, observation, event_id,
#     recorder, now, append=append, release=release), the existing fourth call, unchanged: "argument" from
#     violation.argument_findings (an observation whose subject is not the tied lease's task gives "argument:
#     observation subject is not the task id", violation.py:127-128; nothing is appended and the lease is kept); "core"
#     for every refusal of violation.record, the fence among them; "done" with decision 'STOP: violation' and released
#     copied out.
# (3b) the token removed (D-1529 C1): adapter.violation's result can carry a fencing token by two routes: on "done",
#     released and core['released'] are the released lease in eventlog.LEASE_KEYS' form, its fencing_token included
#     (violation.py:197; adapter.py:299; writer.py:483); and when the lease was granted again to another holder before
#     the release, the release's "token" refusal finding names the held and the given epoch and counter
#     (writer.py:476-478), which record keeps in core['findings'] after its note "release: nothing released (token)"
#     (violation.py:198-199), so a live token of another holder would reach the caller. session_violation therefore
#     returns a new mapping, never the one adapter.violation gave and never a mutated one, in which: released, when a
#     dict, and core['released'], when a dict, are copies without the key fencing_token (task_id and expires_at kept);
#     core is a copy of record's result, its appended, duplicate and findings lists copied too (R1-4); and in findings
#     and in core['findings'] every str that starts with "the lease on " and contains " is held with epoch " (the
#     writer's token-refusal form, writer.py:477), and every str that holds both "epoch" and "counter" (R2-4), is
#     replaced by the fixed finding "release: the lease is held with another token (not shown)". The same filter runs
#     on every result the function returns, step (2)'s copied lookup findings included (R3-5). adapter.violation's
#     answer that is not a mapping with exactly RESULT_KEYS, or whose core is neither None nor a dict, or whose
#     findings or core's appended, duplicate or findings is not a list, or whose released or core['released'] is
#     neither a dict nor None (t69b-R1-4), gives "refused", reason "entry", findings
#     ["entry: adapter.violation gave no result mapping"] (R1-2, R3-3). An exception raised in step (3b) gives
#     "refused", reason "entry", findings ["entry: after the record: <type name>"] (R1-3, R2-5): the violation, the
#     decision and the release may then be in the log and the store (a stated limit below). The result's fencing_token
#     key is None (adapter.py:73-75). So no fencing token, the session's or another holder's, leaves the core-side
#     function, and the hook side never holds one (spec 5 :109; D-1524 :30, :120). The fence's findings print no
#     token (eventlog.py:125-144), so the filter leaves them as they are.
# (4) no exception escapes session_violation: any exception outside steps (1) to (3b)'s own handling gives "refused",
#     reason "entry", findings ["entry: <type name>"], never a message; this is the ending of an exception raised by a
#     stand-in of adapter.violation itself (the real one catches its own, adapter.py:280-299), and violation.record may
#     then already have appended and released (a stated limit; t69b-R1-3, t69b-R3-2).
# The token predicate (R3-4; D-1530's note), used by AC4's walk and AC8's property: a result holds a token when, walked
# recursively through its dicts, lists and tuples, it holds a dict with the keys epoch and counter, a str holding both
# "epoch" and "counter", or a str holding the epoch value of the store (AC4) or of the generated tokens (AC8).
# A "lease" refusal is not a section 8 violation (R5-3; spec 5 :82, :112): with no live tied lease there is no session
# to stop, nothing is recorded and nothing is appended; H2 must not treat a "lease" result as a STOP.
# One now serves both the lookup and the record (D-1528 C2): the lookup's "unexpired" is expires_at > now
# (writer.py:1014-1015) and the fence's is expires_at > appended_at (eventlog.py:139-143), and record passes now as
# appended_at to both appends (violation.py:180-185); so the two agree for one call.
# The fencing (spec 5 :108-109; D-999 M2's rule kept): no token check of the new function's own; writer.append_event
# gives eventlog.append the store's held lease on the task (writer.py:249), whose fence refuses unless the lease is on
# the event's task, its token equals the event's and expires_at > appended_at (eventlog.py:125-144); a refusal
# appends its own record.added (evidence_type refused_submission, eventlog.py:117-122; writer.py:256-263).
# What it writes, only through violation.record: violation.detected, the decision STOP: violation, the release of the
# lease by its token (spec 5 §8; spec 3 :106, :154). It never writes an observed read-set record, a reads row, a
# session row or any other event (DEF-0084 h4d Y4-6); it never opens the store or the event log itself; it reads no
# clock, no environment and no standard input (adapter.py's purity statement kept).
# Stated outcomes and limits (D-1528 C2):
# - the race between the lookup and the appends: the store (sqlite) and the event log (a file) are not one
#   transaction; a lease removed between them (released, or expired and removed by the launcher's expiry) or granted
#   again gives the writer's fence refusal (its refusal record stays in the log) and nothing further: "refused",
#   "core", fail closed; a re-grant to another holder has a new counter, so the old token cannot append for it; a lease
#   that only passes its expires_at during the call, its row still present, is judged live by the one now in the
#   lookup and in both fence checks (R2-1; the fail-open window of an early now, below);
# - the partial outcome: when violation.detected is appended and the decision append is then refused (for example, by
#   the fence after the lease is lost between the two appends), the result is "refused", "core", with the violation's
#   event_id in core's appended and decision None (violation.py:184-187; adapter.py:293-298); the log then holds a
#   violation with no STOP: violation decision; the violation still makes every later evaluation of the task reject
#   where the task is evaluable (TASK-053), and the lease, if still held, is released only by its expiry (the
#   fallback, violation.py's limits) or by a retry; fail closed; a retry by the caller with the same event_id while the
#   lease is still held completes it (violation.detected gives "duplicate", eventlog.py:180-182, then the decision is
#   appended), while a different event_id would repeat the observation's record_id (the TASK-054 hazard), so H2 must
#   reuse the event_id (R2-2; stated, not tested);
# - an "entry: after the record" result: the violation, the decision and the release may already be in the log and
#   the store although the result is "refused" (R1-3, R2-5); with the real adapter.violation, step (3b) does not
#   raise on its results;
# - a repeat after a "done" call: the lease is released, so the lookup refuses ("lease", findings[0] "no_lease_row:"
#   when no other lease row exists, R2-3); the duplicate path of violation.record (D-1000 E1) is reached only while
#   the same lease is still live (a release refused);
# - the observed read-set record (R5-2; spec 5 :74, :119): the violation path releases the lease with no observed
#   read-set record; the session's stored reads stay in the store, for specification 5 §11 point 10's record by the
#   launcher or the next start of the task (H4); nothing here writes or removes them;
# - the session tie rests on the session id the caller passes (for H2, the environment's, which an agent can set for a
#   nested runtime; spec 5 :115, A25's limit for a determined agent);
# - now is taken from the caller (a now earlier than real time would make an expired lease read as live, the
#   fail-open direction; H2 must take the process clock rounded up, as TASK-068's main does);
# - one refused command ends the session (spec 5 :80, cost stated) and there is no bound on repeated STOP: violation
#   (spec 5 §11 point 12);
# - C6 and P-LOC unmeasured; nothing placed, wired, set or measured; every limit TASK-051 to TASK-068 carried.
# DEF-0084 taken: h4d Y4-6 ("how the hook's violation path is fenced, and that it never writes an observed read-set
# record"). Stay deferred: the token-less observe and point 10's paths (H4); h4c Y1-7 (the lock a store lookup takes
# and its refusal cost: the lookup here is read-only, writer.py:1017-1021, but its cost is reached: a lookup refused
# "unreadable" during a long commit gives "lease", with no record and no STOP; accepted and stated here, Y1-7 open for
# H2; R5-4); h4d Y1-3, Y2-6; h4b Y2-6; h4c Y2-10, Y3-2, Y5-7, Y5-9; h4d Y5-7. DEF-0088: not reached (no message is
# shown); its point 2 (an AIEOS refusal names the corrected form) stays open for H2's messages, since the findings here
# are fixed strings (R5-5). DEF-0080, DEF-0081, DEF-0082, DEF-0085, DEF-0087,
# DEF-0089 and DEF-0090: not touched (no change to their modules). Their log lines are written at the records step.
# Risk: high (risk rules revision 6, §2 point 3: R3 matches every path under src/** and tests/**), computed over the
# base by script before commit C. GOV-003: every path of the write-set is an evaluator path by the workflow's pinned
# list, by script; change class critical_cr, as for TASK-060 to TASK-068, ruled at acceptance. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles. Reviews: five way-2 reviews on Sonnet 5.5, a Claude model other than
# the implementer's (Opus 5.5), never Fable (the owner's words of 2026-10-17); and the decision agent's own reviews:
# INV-003's human_review, OPS-002's human_review and the cross-model half, each its own record (D-1148 Q2).
# Records: in the readable form, as TASK-068's; per-entry coverage checked by script before the acceptance request
# (L-0022), and the governor's evaluation over the records reported (D-1098).
# Naming (D-544 Q3): every new test function names the AC ids it stands for as "TASK-069 ACn" in its own docstring.
# Evaluation path (A61; as TASK-019 to TASK-068): commit C changes only docs/tasks/TASK-069.yaml and has one parent
# equal
# to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-069" and no e-mail address in its message, go to
# task/TASK-069 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011; GOV-001, GOV-004 to
# GOV-006 and SEC-003 (no path of the write-set meets them). INV-004 applies: the writer stays the only module that
# opens the store and the event log. INV-009 applies (reading): the new call appends to the event log, through the
# writer only, by violation.record.
# Owner-kept acts: none. No hook placed, no matcher chosen, no Claude Code setting, nothing measured, nothing under
# .github/ or .claude/, no push of its own; it weakens no evidence requirement; so its acceptance is one delegated
