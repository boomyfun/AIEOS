constitution: [INV-001, INV-002, INV-003, INV-004, INV-009, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      session_violation's arguments and result. It returns a mapping with exactly adapter.RESULT_KEYS; result is "done"
      or "refused"; findings is a list of str; fencing_token is None in every result, and no fencing token appears
      anywhere in the result by the header's token predicate (header step (3b)). Step (1) of the header refuses,
      reason "argument", with a fixed finding naming the argument: root not a non-empty str (None, "", bytes);
      session_id not a non-empty str (None, "", an int); now not a timezone-aware datetime in UTC with whole seconds
      (naive, a fraction of a second, another offset, a date, a str); an argument whose own methods raise gives
      "argument: checking the arguments raised <type name>". No later step's function is called after a step-(1)
      refusal (recording stand-ins). No exception escapes: any exception outside steps (1) to (3b)'s own handling gives
      "refused", "entry", findings ["entry: <type name>"]; an exception in step (3b) gives ["entry: after the record:
      <type name>"], shown by a stand-in of adapter.violation whose answer is a dict subclass whose keys, items,
      values, __iter__, __getitem__, get and copy all raise, so that any way of copying it meets the exception (R1-3,
      R2-5, R3-3; t69b-R1-2, t69b-R3-1); a stand-in of adapter.violation that raises gives ["entry: <type name>"],
      not the "after the record" form (t69b-R1-3, t69b-R3-2); a stand-in answer that is not a mapping with exactly
      RESULT_KEYS, whose core is neither None nor a dict, whose findings or core's appended, duplicate or findings is
      not a list, or whose released or core['released'] is neither a dict nor None gives ["entry: adapter.violation
      gave no result mapping"] (R1-2; t69b-R1-4). Equal arguments over an unchanged store and log give equal results;
      nothing is
      kept between calls.
  - AC2: >-
      The lookup, step (2). lookup is called once, with exactly (root, session_id, now), reached at call time (a
      test's stand-in is the one called), and by default writer.session_lease. Each writer reason of a "refused" answer
      ("argument", "root", "no_store", "link", "unreadable", "tables", "lease_row_without_session", "no_lease_row",
      "session", "ended", "leases") gives "refused", reason "lease", findings the writer's findings as a list, with
      findings[0] starting "<writer reason>:", and adapter.violation is not called; a "refused" with a str reason and
      no str finding gives ["lease: the lookup refused (<reason>)"] (R1-1); through the real writer.session_lease, a
      relative root gives "lease" with findings[0] starting "root:", never "argument" (R1-5); the real lookup refuses
      it at its root check, after only an os.path.isdir check of the given path (writer.py:154-159, :954-958) and
      before the store is looked up or any file is opened or written, so this call is allowed in the unit module
      (t69b-R3-4). A "done" with reason
      "no_lease_row", a "done" with reason "tied" whose value is None, not a dict, a dict missing or adding a key of
      _LEASE_KEYS, a task_id not "TASK-" followed by digits, or a fencing_token without _token_form's shape; a
      "refused" with a non-str reason; a non-StoreResult answer; and an exception raised by lookup: each gives
      "refused", "lease", findings exactly the header's fixed finding, and adapter.violation is not called. A test
      asserts that no text of the stand-in's answer (beyond the writer's own findings on "refused") appears in a
      finding, and that a stand-in's refused findings holding a token (both "epoch" and "counter") come out replaced by
      the fixed finding (R3-5). A test asserts _LEASE_KEYS == eventlog.LEASE_KEYS.
  - AC3: >-
      The record, step (3). On a tied lease, adapter.violation is called once with exactly (root, the lease's task_id,
      the lease's fencing_token, observation, event_id, recorder, now) and append and release passed through (a
      recording stand-in of adapter.violation, patched on the module at call time, shows the call); its result is
      returned unchanged but for the token's removal of header step (3b) (a test compares it with the stand-in's
      return value: equal but for released's and core['released']'s fencing_token key and the replaced token-refusal
      findings; the stand-in's own mapping, its core and the nested lists appended, duplicate and findings are not
      mutated and are not the same objects as the result's (R1-4); a stand-in result whose released and
      core['released'] carry a token, and whose findings and core['findings'] carry a token-refusal finding and a
      finding holding both "epoch" and "counter", shows each removal). Through the real
      adapter.violation with stand-ins for append and release: an observation whose subject is not the lease's task
      gives "refused", "argument", nothing appended, release not called; record's "fence" on the first append gives
      "refused", "core", decision None, appended []; the partial outcome (the first append "appended", the second
      refused by the fence) gives "refused", "core", decision None, the violation's event_id in core's appended; a
      "done" gives decision 'STOP: violation' and released copied out.
  - AC4: >-
      End to end over a real store and event log, in a new class of tests/integration/test_writer_files.py: a store
      made by writer.open_store in a tempfile folder, a session started and a lease granted to it on a task; a valid
      violation.detected observation (one observation record, outcome blocking, blocking_kind violation, subject the
      task, source_class deterministic_tool_local) and a fixed now inside the lease. Cases: the tied call gives "done",
      decision 'STOP: violation'; the log, checked by records.check_log with no finding, ends with violation.detected
      and decision.execution (STOP: violation, refers_to the violation's event_id), both carrying the lease's task and
      token; writer.held_leases is empty; the same call again gives "refused", "lease", findings[0] starting
      "no_lease_row:" (the lease is released and no other lease row exists; R2-3), and the log is unchanged; a now at or
      after the lease's expires_at gives "refused", "lease", with findings[0] starting
      "leases:" (no unexpired lease), and the log unchanged; an ended session: a session s-2 is started and then ended
      by writer.end_session while the tied session s-1 still holds its lease (so the store holds a lease row), and the
      call with s-2's id gives "lease", findings[0] starting "ended:"; an unknown session id (with s-1's lease row
      present) gives "lease", "session:"; an observation for another
      task gives "refused", "argument", the log unchanged and the lease kept; the race: a lookup stand-in that returns
      a lease read before the lease was released and granted again to a second session (a new counter) gives
      "refused", "core", with core's reason "fence", one record.added (evidence_type refused_submission) appended, no
      violation.detected, and the second lease kept; the partial outcome: an append stand-in that forwards to
      writer.append_event and, after the first append, releases the lease by its token, gives "refused", "core",
      decision None, the log holding violation.detected and the fence's record.added and no decision.execution; the
      release-"token" race (D-1529 C1): a release stand-in that first releases the lease by its token and grants the
      task again to a second session (a new counter), then forwards to writer.release_lease_token, gives "done",
      decision 'STOP: violation', released None, the second lease kept, and the fixed finding "release: the lease is
      held with another token (not shown)" in core's findings. In the done case and in this race case the header's
      token predicate, with the store's epoch value, finds no token in the result (R3-4). After each case the store's
      leases and
      the log's event types are as expected. The project-state files are only the
      store and the log.
  - AC5: >-
      What the module imports and does (INV-001 to INV-004, INV-009). adapter.py's import set is the base's, unchanged:
      datetime, re, and of aieos_bootstrap execution, gitread, submit, violation and writer (R3-B1; D-1532); the key
      set is the private constant _LEASE_KEYS, equal to eventlog.LEASE_KEYS by AC2's test; tests/unit/test_adapter.py's
      R9Purity (:320-345) and R9OwnTests (:348-367) pass unchanged: the new code uses none of the attribute names
      R9Purity refuses (now, utcnow, today, time, environ, getenv, system, popen, open) and none of its refused names
      (open, exec, eval, compile, __import__), and the docstring keeps its six pinned phrases and never holds "called
      only by this function"; the new function calls of writer only session_lease by default
      (as lookup) and passes append and release through; it opens no file, starts no process, reads no clock, no
      environment and no standard input, makes no network or model call, names no string with the project-state
      directory, and uses no exec, eval, compile, __import__, importlib or assert (a check over its AST). TASK-068's
      separation check (tests/unit/test_claude_code_read_hook.py) passes unchanged, and no hook-side module names
      session_violation (a test over the six hook-side modules' text). At the task's commits the CI steps report no
      finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC6: >-
      What is stated. adapter.py's module docstring adds a paragraph for the fifth call: the tie by the session id and
      the one live lease (spec 5 :109, with :108 for the environment), the token read core-side and never returned
      (the two routes of header step (3b), their removal and the epoch-and-counter rule), the flow (1) to (4), that a
      "lease" refusal is no section 8 violation and no STOP (R5-3), the "entry: after the record" outcome (R1-3), the
      retry with the same event_id after a partial outcome (R2-2), the observed read-set record left for point 10
      (R5-2), the
      lookup's reasons kept as findings[0]'s prefix under reason "lease", that "lease_row_without_session" and a
      "no_lease_row" done cannot arise with a session id required, one now for the lookup and the record, the
      observation's subject required to be the tied lease's task, the race and the partial outcome as stated limits,
      the repeat after "done", the session tie and now as the caller's (the fail-open direction of an early now), what
      it never writes, and that nothing hook-side calls it yet (H2's). The existing paragraphs are unchanged. No
      docstring or other string constant of adapter.py contains the project-state directory's name (the workflow's
      INV-004 rule).
  - AC7: >-
      Its own tests and the changed ones (GOV-003). Every new test function names the AC ids it stands for as
      "TASK-069 ACn" in its own docstring; no other task's AC is named in qualified form in a new test. In adapter.py
      every function, class and module-level assignment present at the base is byte-identical, and only the module
      docstring (AC6) and new definitions are added, with no import line added or changed; tests/unit/test_adapter.py
      is not changed at all (R3-B2); in tests/integration/test_writer_files.py every top-level and class-level function
      and class present at the base is
      byte-identical and none is removed, and nothing else changes but added functions, classes and module-level
      assignments of new names, and the imports they need. An acceptance-time script by source segment (as TASK-068
      AC8's) lists every changed definition and refuses any not allowed here. Before each commit the added text is
      scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, each count 0. Every test is buildable under
      deterministic_rule: real stores, sqlite3 and tempfile only in tests/integration/test_writer_files.py; the unit and
      property modules use stand-ins only (but for AC2's one call of the real writer.session_lease with a relative
      root, t69b-R3-4), write no file and read sources only by pathlib's read_bytes on paths relative to __file__;
      tests/integration/test_ac_tests_tree.py and every other existing test pass unchanged, and the new test names
      leave its ambiguous-key count (EXPECTED_AMBIGUOUS) unchanged, shown by the suite run before the task's commit
      (t69b-R3-3); no real path of this machine's user folders, no real session id, no credential-shaped
      string, no literal "/tmp".
  - AC8: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1; R2 AC2 (each writer reason, each shape
      ending, the exception); R3 AC3; R4 AC4 as stated; R5 AC5 by the in-suite AST and text checks; R6 AC6 by an
      in-suite check of the docstring words, matched with whitespace collapsed (D-1286); R7 AC7 by the acceptance-time
      script and one run of it against a deliberately weakened copy (one more definition allowed than listed); and
      property tests (standard library only, fixed seeds, at most 50 cases each): over generated lookup answers and
      arguments (stand-ins for lookup and adapter.violation, the latter's results generated with tokens in released,
      core['released'] and token-refusal findings; the generator puts epoch values only in released,
      core['released'] and the two filtered finding forms, each generated epoch at least 16 characters long, distinct
      from the others and not a substring of any fixed finding text; t69b-R1-1), the result has exactly RESULT_KEYS,
      fencing_token is always None,
      no fencing token appears anywhere in the result (the header's token predicate, with the generated epochs; R3-4),
      adapter.violation is called only after a tied lease of the checked shape and then with that lease's
      task and token, and equal inputs give equal results. Broken copies are made and run in the scratchpad, outside
      tests/, as for TASK-059 to TASK-068, and each fails at least one test: released returned with its fencing_token;
      core['released'] returned with its fencing_token; the token-refusal finding kept in core['findings']; the
      stand-in's result mutated in place instead of copied; the nested lists shared instead of copied; the
      epoch-and-counter rule removed; the filter not run on the lookup's findings; the empty-findings fallback removed;
      the "after the record" finding given as plain "entry: <type name>"; a non-mapping answer of adapter.violation
      passed through; the lookup made without the session id
      (None passed); a session_id of "" accepted; a naive now accepted; the token returned in the result; the task
      taken from the observation's subject instead of the lease; the lease's shape check removed; a "done" with
      "no_lease_row" accepted as tied; the writer's findings dropped on "refused"; the writer's reason used as the
      result's reason; adapter.violation called after a refused lookup; a second now (a fresh one) passed to the record;
      an exception let escape; a check of its own of the token against the lease (a second fence: it compares the
      tied lease's token with a fresh writer.held_lease of the task and refuses when they are equal, inverted; R3-6),
      which the "done" cases catch; the new function opening the log itself; adapter.py importing eventlog (R9Purity
      catches it); a pinned docstring phrase removed (one per word check);
      and a hook-side module calling session_violation. The copy-making script refuses any copy whose edit text is not
      found exactly once. tests/run_tests.py, unchanged, runs the tests.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 600k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC8]}
  - {gate: G3, check: constitution, args: [AC5, AC6, AC7, INV-001, INV-002, INV-003, INV-004, INV-009, GOV-002, GOV-003,
    SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
