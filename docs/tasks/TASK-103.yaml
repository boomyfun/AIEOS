constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only .github/workflows/aieos-checks.yml. The new file equals, byte for byte, the file built by the
      approved scripts from the base (mk_wf103b.py, then mk_wf103c.py, then mk_wf103d.py, or a successor approved by the decision agent; the final output SHA-256, now d64a6206be6194c4faf70b14b593fa44df8c59dc6f99e793b4b500e69d62bc03, is to be bound in the A66 decision and checked by the executor); a diff
      against the base shows only the two EVALUATOR list tails, the revision-14 header entry, the evaluator-lists-equal step before the deterministic_rule step, and the base-tests step as the job's last step (after static_security_analysis). Approvals: mk_wf103b.py under D-3757 C2 and D-3758, its output accepted in D-3759; mk_wf103c.py built under D-3784 C3 and run under D-3786, its output accepted as a draft for review in D-3787; mk_wf103d.py under D-3792 C1 and D-3793, its output accepted in D-3794. At acceptance the record brings the diff of the task commit against the base and the byte comparison of the file with the built file.
  - AC2: >-
      The lists. Both EVALUATOR literals are single plain quoted lists that scope_reconcile._LITERAL accepts and are identical; no
      other line starts with "EVALUATOR = ["; the workflow holds exactly two "def parse_contract(text):" (test_task_contract_repo.py
      :99-107). Raw output of evaluator_from_workflow(new workflow text) shows the full new list (the old entries plus the new ones),
      and of the same function on the base text shows the old list. The earlier output of check103.py is a rehearsal on the wf103b text (nine entries added to 26); the acceptance run prints the full new list and both copies from the task commit. These scripts are run by the worker at acceptance, each under its own decision, not by the executor.
  - AC3: >-
      Coverage. A coverage table in the acceptance record names every file under native/ and bench/ and the pattern of the new lists
      that matches it, computed by script with BOTH matchers (the workflow's own pattern_re of the gov003 step, and the governor's
      aieos_bootstrap.governor.matches, which reads the list through scope_drift) over the Glob of native/** and bench/**; no pattern contains "native/" or "bench/"; tests/unit/test_native_isolation.py and
      tests/unit/test_bench_isolation.py pass unchanged. The wider patterns '**/go/**', '**/rust/**', '**/ts/**' over-match (stricter
      handling; stated, not computed). governor.matches lets ** match zero names, so a bare file named go, rust or ts matches the governor but not the workflow's regex (D-3784 C4).
  - AC4: >-
      The base-tests step. Its output is fixed: first the line "aieos_bootstrap imported from <path>" with the path under the merged tree (a git worktree of the commit under test; D-3756 C3 replaced the work/ tree of D-3755 C2 by it so that the base tests have git access; the local run under the scratchpad's merged tree is accepted in D-3774),
      then one summary line "GOV-003 base tests: <N> run, <F> failed, tests from <base_commit>, src from <HEAD>", then the failing
      test names; exit 0; "GOV-003 base tests: no task" when task.json names none; "GOV-003 base tests: no base commit in task.json" (exit 0) when task.json has no 40-hex base_commit; "GOV-003 base tests: setup failed: <worktree|archive|extract|import>"
      (exit 0) when a setup command fails; "GOV-003 base tests: zero tests ran" when no test ran. The pass proof is the CI run of the task commit; the
      broken-copy proof is a local run on a commit that is never pushed (its command a decision of its own) over a copy whose src changes one comparison in autonomy.py (14 of the 24 tests of the pattern fail in the run), showing F > 0 and
      the failing names, the import path under the merged tree. Tests the change adds are not judged; this is stated in the output
      comment and in the acceptance record. The acceptance evidence records, from the job data of the task-branch CI run (a read-only
      query), the conclusion of every step and the base-tests step's summary line; a skipped blocking step means the run does not count. The two messages "no task" and "no base commit in task.json" are read from the step text, not run in the local simulation. Standard error lines (for example the traceback in the import case) may appear after or among the fixed lines; D-3774 rules them expected. The zero-tests line follows the summary line. An unexpected error in an unguarded command of the step ends it as failed without failing the job (continue-on-error); the exit 0 above holds for the guarded paths and the normal end. Every later acceptance of a task that changes tests/ brings this step's raw output and names each base-test failure in its departure (D-3755 C3; DEF-0107 point 4 (i)).
  - AC5: >-
      Nothing else changes. Every other step of the workflow is byte-equal to the base; permissions stay "contents: read"; the file
      uses no secret, no token, no write access, no third-party action and changes no setting; the tests that read the workflow file (the isolation tests, test_task_contract_repo.py :99-107) pass; test_scope_reconcile.py :259 and :316 run the parser on a synthetic workflow text (WORKFLOW_TEXT, :32) and test_scope_drift.py :309 uses the workflow's path as a name only, so these three do not read the file and do not pin its list; they pass. The local suites ran on a clone with the wf103b build installed; the final file is tested only by the CI run of the task commit.
  - AC6: >-
      Honest limits. The acceptance record states: report-only (it is not a gate); same-lineage evidence; it does not judge tests the
      change adds; point 5's gap; the native, bench and Go suites are not run by the step; the overlay tree is a git worktree whose
      tests/ are the base's, so a base test that expects a clean status or its own HEAD may fail by construction (such names are
      listed with the reason). Further stated limits (R1, R1b): a step timeout may show as a red step, or may make the job red, and loses
      the report (no summary line); GitHub's behaviour here is not verified; the revision-14 header entry carries no decision number (it
      does not exist before the A66 decision) and calls go.mod, go.sum and tsconfig.json lockfile and configuration forms; header line 3
      ("writes nothing to the repository") does not mention the runner-side worktree; the counts come from logs the code under test can
      write; a group missing from the base is not counted; a test that expects .git to be a directory may fail on the worktree's .git
      file; the step timeout N = ceil(1.5 x S / 60 s) minutes = 4 comes from one sample (run 40973930972: S = 139 s); the local
      simulation used python for python3, git -c core.longpaths=true, the unit group only and the pattern test_autonomy.py only, and the
      full unmodified run is proven only by the CI on the task branch; the base-tests step is the job's last step so that a timeout
      cannot skip a blocking step. The refusal side of G0 (every other path fails) is read from the script (D-3757), not run. Further limits (R2d, not counted): the step has no shell key, so the runner's default shell applies (R1b); the job's timeout-minutes 15 also covers the conformance steps, which have no timeouts of their own (R1b); the base's workflow-reading tests (test_bench_isolation, test_native_isolation, test_task_contract_repo) read the change's workflow, because .github is not replaced in the overlay (R1); coverage is by directory name, so later files such as bench/README.md are not covered (R1); the timing sample was one run on another branch whose G0 scope step failed, and it timed the change's tests, not the base's (R1b); the local overlay did not run the git-reading tests (test_task_contract_repo, test_scope_reconcile_log); one integration test was skipped in the local suite (skipped=1) and is not named. At acceptance a deferred item is opened for the question whether to make the step failing (D-3755 Q1). The local simulation commands (bash, python -m unittest discover) were run in the scratchpad under their own decisions and are not the executor's capabilities.
  - AC7: >-
      The CI evidence. On the aieos-checks and aieos-native runs of the accepted commit and of main after the records commit, every job
      and step is successful, read by a read-only script by run id. The reads of GitHub job data (here and in AC4) are made by the worker with read-only commands, each its own decision, outside the task's capabilities. Pushes are made by the worker, each its own decision (the task's capabilities forbid push).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 1500k, wall_time: 8h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5]}
  - {gate: G3, check: constitution, args: [AC6, AC7, INV-001, INV-002, INV-003, INV-004, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts AND the aieos-checks and aieos-native runs of the accepted commit succeed
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
