# Task contract TASK-103, DRAFT r3 (= r1 with F5 of D-3758, the Edits of D-3794, the R2d Edits of D-3803 and the R2e Edits of D-3808 applied, these last not reviewed again; scratchpad only; not approved; not committed). The CI step of DEF-0107 point 7 with DEF-0109's
# list fix. Fields and value forms follow specification 2 section 5.1 and TASK-102's contract. Drafted under D-3752 C2/C3/C4,
# D-3755 and D-3756 (C1 to C5). Whether it is approved is recorded in the decision files, not here.
# Ordering departure (D-3752 C4): the plan docs/plan/m8-plan.md section 7 puts DEF-0105, DEF-0101 and DEF-0095 next; this task
# comes first because DEF-0107's decided policy (point 7) names it as the next build task and it gives every later tests/ task the
# base-tests run automatically. After this task's acceptance the plan's order resumes with DEF-0105, then DEF-0101, then DEF-0095.
# Point 5's gap stays (DEF-0107): src/aieos_bootstrap/** is an evaluator path, so a changed governor is judged by itself; this task
# does not close it and is not claimed to close GOV-003.
# Risk: critical. R9 (.github/**) is critical (risk-rules section 3). Change class: critical_cr; every path of the write set is a
# GOV-003 evaluator path (the workflow lists '.github/**'). Profile for critical (assurance-model.md section 5):
# unit_test, integration_test, deterministic_rule, static_security_analysis and ai_review (cross-model), plus functional
# [property/fuzz] (met by property_test records) and architecture [human_review]. The cross-model entry is the pair of section 5:
# a way-2 review by a Claude model other than the implementer's, checked by machine against every model that did task work
# (L-0037, L-0038), and a separate review of the decision agent; a decision-agent review that meets human_review is not also that
# half, so two decision-agent reviews are needed. Recorded per article (L-0034).
# How G0 and SEC-003 treat the workflow path (confirmed by the reads recorded in D-3757; the refusal side is read, not run): G0 (aieos-checks.yml :158-320) accepts a
# write_set path that matches and no forbidden pattern (aieos-checks.yml :312-318: forbidden first, then write_set); any other
# .github path fails as "outside the write-set", so this contract needs no '.github/**' in forbidden and lists the other two
# workflows by name only as a belt; SEC-003 (constitution, revision 4) puts a .github/ change to the
# decision agent under DM A66, each change its own decision; the binding by SHA-256 comes from D-3752 C3, and the limits (no
# write access, secret, token or setting, else the owner) from DM A66 and DEF-0107 point 7.
# owner_kept_act: false is read as follows: spec 2 section 5.1 sets it for an act that A51 item (4) keeps. A51 (4) keeps "anything under
# `.github/`"; DM A66 (in force by A67) says that for the AIEOS self-build the decision agent decides in the owner's place "adding,
# changing or deleting files under `.github/`, including changes that remove or loosen a check, each change as its own decision",
# and that every other act of A51 (4) stays the owner's. So this task's one act, a change of the workflow, is not owner-kept; each
# change is bound by SHA-256 (D-3752 C3). A73 (2026-10-30) amends A51 (4) for other acts (settings, publishing, history rewrite)
# and does not concern files under .github/;
# the change grants no write access, uses no secret or token and changes no setting (AC5), which would stay the owner's; no other
# owner-kept act is in the task. OPS-002 is listed and is met by this reading.
# Applicable articles: as listed; INV-001 to INV-004 and GOV-002 are listed fail closed (their scopes, the core's and the bootstrap's
# source trees, the project-state directory and the scenario files, are not changed: the forbidden list holds src/**, tests/**
# and .aieos/**). Not applicable, with reasons: INV-005 to INV-008 and INV-010 (their scope is the decision engine,
# the governor and their records; the task changes none of them, and the workflow's conformance steps stay byte-equal, AC5);
# INV-009 (the event log is not touched); INV-011 (no auto-accept is set or used); GOV-001 (the concept file is not touched);
# GOV-004 (no Genesis-bound artifact is touched); GOV-005 and GOV-006 (the task changes no decision-matrix row, record or
# pre-genesis document; the records after acceptance fall under their own decisions); OPS-001 (scope: the repository's refs; the task changes no ref,
# as in TASK-001 :11-12; its git capabilities forbid push, and every push, the task branch's included, is the worker's under its
# own decision and carries OPS-001's push rule).
# traces_to: DEF-0107 point 7 is the requirement and GOV-003 the article. No specification section governs the CI step itself:
# governor-spec.md section 8 and assurance-model.md section 6, which GOV-003 cites, govern a change to the governor and
# auto-accept, and this task makes neither.
# DEF-0107's policy (D-3740) was reviewed once, before four small fixes that were not reviewed again, among them the wording of
# point 7's handling rule (DEF-0107 log, 2026-10-30).
# What the task does not do: no change under src/, tests/, native/, bench/, docs/ except docs/tasks/TASK-103.yaml (commit C) and the
# records; no change of permissions (contents: read), no secret, no token, no setting, no third-party action; the base-tests step
# is report-only (D-3755); tests the change adds are not judged by it. Commit C (docs/tasks/TASK-103.yaml) is made by the worker
# under its own decision, outside the executor's write capability.
task: TASK-103
contract_version: v1
task_type: implementation
objective: >-
  Add to the CI workflow aieos-checks.yml (1) a check that fails when the two embedded EVALUATOR lists are not exactly two equal
  lists, (2) a report-only step that runs the base commit's tests against the change in an overlay tree and prints one summary line
  and the failing test names, and (3) the native, bench and Go governor and lockfile forms in both EVALUATOR lists with patterns
  that contain neither "native/" nor "bench/"; every other step stays byte-equal.
traces_to:
  - docs/Deferred/DEF-0107-gov-003-in-the-self-build-the-change-s-own-tests.md#7
  - docs/Deferred/DEF-0109-the-pinned-evaluator-list-and-the-native-and-bench-governor-files.md
  - docs/pre-genesis/constitution.md#GOV-003
input_state:
  # base_commit is filled by script from refs/heads/main just before commit C; commit C has it as its one parent.
  base_commit: f0dec7fe049e6bba34f13d9020342d147cee64e0
  depends_on: [TASK-102]
  intent_versions:
    docs/pre-genesis/constitution.md: 9b396c3c0f31d3a3fbccf9433cf81eb820b6e0f0a3a7d099e2899043abfe1f5a
    docs/pre-genesis/assurance-model.md: 945615316968a5c064bf88be71add9271bbb9f95692eaa22582b6020fa69cb85
    docs/specs/risk-rules-gov-aieos.md: 9a740f4d882f5519b9d5c28227c89a7a47eeb360416cff81904b37f2c71e205b
    docs/Deferred/DEF-0107-gov-003-in-the-self-build-the-change-s-own-tests.md: 6b0095a97879a1f3bfa9bb8f11004da2e8ebbb79c7e22ece84ee9c701d8f0382
