# Task contract TASK-030, constitution drift (Master Plan revision 3, §4 M4; specification 4 revision 3, section 7
# item 1; concept lines 742-749 and 948). Revision 0, drafted under decisions D-663 (Q1 and C1 to C3) and D-646 C1,
# brought for approval in its own request; whether it is approved is recorded in the decision files, not in this file.
# Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-029. Readings marked
# "(reading)" are the worker's, for the decision agent's ruling; the four readings of D-663 C1 are the decision agent's,
# marked proposed, not the specification's own words.
# Task type: implementation. What it adds: one pure module, src/aieos_bootstrap/drift.py. Its function violations takes,
# as values, one base commit's facts (the commit, its changed paths, the constitution's articles at the base, the rule
# results recorded for that commit, and the records of a task whose evaluated commit is that commit) and returns the
# violation.detected events of specification 4 section 7 item 1, one per article whose scope meets a changed path and
# whose rule failed on that commit, each with an event id and a record id derived from the commit and the article; the
# articles it could not check (uncovered); and the articles already found at that task's evaluation (one finding, not
# two). It reads no Git, no file and no log, and appends nothing: reading the facts and appending the events through the
# core's single writer (TASK-016) are TASK-031's, the reconciliation caller (decision D-663), not built here.
# The specification's text (spec 4 line 80): "**Constitution drift:** after a commit reaches the base, the
# deterministic rules of every article whose scope meets the commit's changed paths are run (the CI's G3 steps are those
# rules); a failed rule on the base is a `violation.detected` with the article's id in `refers_to`; its subject is the
# commit, no task's state changes, and it is handled as a record by the decision agent or the owner (proposed). A G3
# failure at a task's evaluation and the same failure found later on the base are one finding, not two." Line 83: "All
# three are pure computations; their events are appended only through the single writer (INV-004)." Specification 2
# line 163: `refers_to` is, "for a check observation of a constitution article, that article's id"; line 191 (the
# event table): `violation.detected` is "one `observation` record with `outcome` `blocking` and `blocking_kind`
# `violation`".
# What it does not do: it runs no rule (the CI's G3 steps run them; the governor "runs no test or checker", and this
# module reads results only); no scope drift (section 7 item 2, which waits for the policy's list of non-task paths,
# section 12 point 11); no stale evidence (TASK-023's); no lease, no state effect, no governor rule (a violation.detected
# about a base commit has no task_id, so no evaluation reads it); no Git read, no file read, no writer call, no caller,
# nothing under .github/, no policy, no frozen fixture. It changes no governor, writer, records, eventlog, resume_check,
# stale, evaluation or other existing module.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain drift; it must not name the Resume Check
# fixture folder (TASK-010's assertion) nor the Risk Engine fixture folder (TASK-020's allow list). No module of the
# repository calls drift yet.
# Rule results (reading): the CI's G3 records in docs/records name a CI step in refers_to, not an article id; this
# module reads a rule result only in specification 2's form for a check observation of an article (refers_to the
# article's id); mapping CI steps to articles is the caller's (TASK-031), and a result in another form is no result
# (D-663 C1). So, until the caller maps them, the one-finding rule matches no record of the earlier tasks (a limit).
# Risk: high, and change class critical_cr, each computed over the base by script, as for TASK-029. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles.
# Reviews (as TASK-029's): five way-2 reviews by a Claude model other than the implementer's, and the decision agent's
# three, each brief naming for testing: the selection of articles (governor.matches called, a scope that cannot be
# evaluated applies); the one-finding rule and its limit; uncovered articles, never passed; a malformed rule result
# counted as no result; the derived ids; the payload's form under records.check_payload; purity; AC11's limits.
# Naming (D-544 Q3, as TASK-023 to TASK-029): every test of the three new test modules names the AC ids it stands for
# as "TASK-030 ACn" in its own docstring.
# Evaluation path (A61; as TASK-007 to TASK-029): commit C changes only docs/tasks/TASK-030.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-030", go to task/TASK-030 under their own
# decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-004 and INV-009 (the module writes no file and no log; the
# events are returned, not appended); INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the governor,
# evidence records as stored, the replay and the policy meet no path of the write-set: the module returns events and
# stores none); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the bound artifacts, the decision matrix,
# the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (it reports violations and blocks no
# task; CR-002 part 4 limit 8 does not apply), so its acceptance is one delegated approval of the decision agent
# (Master Plan section 6), for the decision agent's ruling.
task: TASK-030
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/drift.py, the constitution-drift computation of
  specification 4 section 7 item 1: violations(inputs) takes one base commit's facts as values (the commit, its changed
  paths, the articles at the base, the rule results recorded for that commit and the records of a task evaluated at
  that commit) and returns one violation.detected event per article whose scope meets a changed path and whose rule
  failed on that commit, unless that task's own records already hold the same failure (one finding, not two), each with
  an event id and a record id derived from the commit and the article; the articles it could not check; and, for a
  malformed input, an error and no event (fail closed). It reads and writes nothing. With unit, integration and
  property tests in new test modules, each test naming its AC ids as "TASK-030 ACn" in its own docstring; the
  integration test appends the returned events to an in-memory log with aieos_bootstrap.eventlog.append.
