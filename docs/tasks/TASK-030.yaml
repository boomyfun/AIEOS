acceptance_criteria:
  - AC1: >-
      The input. violations(inputs) takes a mapping with exactly the keys base_commit, changed_paths, articles,
      rule_results, task_records and recorder: base_commit 40 or 64 lowercase hex characters; changed_paths a list of
      strings; articles a list of mappings, each with a non-empty string id (unique in the list) and a key scope, other
      keys ignored; rule_results and task_records each a list of mappings; recorder a non-empty string. Any other form
      gives the result of AC8 with error naming the first key that fails, in the order above, and no event (fail
      closed). A malformed entry inside rule_results or task_records is not an input error: AC4 and AC5 say what it
      counts as.
  - AC2: >-
      The articles that apply (D-663 C1, second reading, proposed). An article applies when its scope meets a changed
      path: scope is a non-empty list of non-empty strings and aieos_bootstrap.governor.matches(pattern, path) is true
      for some pattern and some changed path (called, not copied, so it follows the risk rules' section 2 point 6, as
      the governor's own article selection does). A scope in any other form cannot be evaluated, so the article applies
      (fail closed, as the governor's derive_inputs reads it) and it is also named in an uncovered entry {ref the
      article id, detail "scope cannot be evaluated"}. An article's other keys (for example applicability by task type)
      are not read: a base commit has no task type (reading). An empty changed_paths meets no evaluable scope.
  - AC3: >-
      Rule results (D-663 C1, third reading, proposed). A rule result is usable for an article when
      aieos_bootstrap.records.check_record finds nothing in it and it has fact_kind "observation", gate "G3", commit
      equal to base_commit, outcome "pass" or "fail", and refers_to equal to the article's id. An applicable article
      fails when some usable result for it has outcome "fail"; it passes when it has a usable result and none fails. An
      applicable article with no usable result gives an uncovered entry {ref the article id, detail "no rule result"}
      and is never reported as passed. A rule result for an article that does not apply is not read.
  - AC4: >-
      Results that cannot be used. An entry of rule_results that is not usable for any article by AC3's form (all but
      the refers_to condition) gives an uncovered entry {ref its record_id when it is a non-empty string, otherwise
      "rule_results[i]" with its index, detail "not a usable rule result"} and counts as no result.
  - AC5: >-
      One finding, not two (D-663 C1, first reading, proposed). A failing applicable article gives no event when some
      entry of task_records has gate "G3", refers_to equal to the article's id, commit equal to base_commit and outcome
      "fail" (an entry missing any of these, one in which aieos_bootstrap.records.check_record finds anything, or one
      whose fact_kind is not "observation", is not a match: a malformed record never suppresses a finding, fail
      closed); the article's id is then listed in already. task_records are the kept records of a task whose
      evaluated commit is base_commit (the caller's facts). When the commit that
      reaches the base is not the task's evaluated commit (for example a landing that is not a fast-forward), no
      record matches and the findings are two: a stated limit.
  - AC6: >-
      The events (D-663 C1, fourth reading, proposed). Each failing applicable article not in already gives one event
      {event_id, event_type "violation.detected", payload}, with payload exactly {record_id, fact_kind "observation",
      source_class "deterministic_tool_local", recorder, subject base_commit, commit base_commit, outcome "blocking",
      blocking_kind "violation", refers_to the article id}; record_id is the SHA-256 hex digest of the UTF-8 text
      "violation", base_commit and the article id joined by LF, and event_id the SHA-256 hex digest of
      "violation.detected", base_commit and the article id joined by LF (as the writer's _digest joins its parts).
      aieos_bootstrap.records.check_payload("violation.detected", payload) finds nothing. The event carries no task_id
      (the subject is a commit; specification 4 line 80: no task's state changes). Events are sorted by article id;
      the same inputs always give the same ids.
  - AC7: >-
      What it does not decide. The module runs no rule, changes no task state, blocks no task and appends nothing; it
      makes no scope-drift or stale-evidence finding; its docstring says so, names the caller as TASK-031 (decision
      D-663) and states that mapping CI steps to articles is the caller's. No module of src/ changes except
      __init__.py's docstring and __all__.
  - AC8: >-
      The result. violations returns a mapping with exactly the keys events, already, uncovered and error: events the
      list of AC6; already the sorted article ids of AC5; uncovered a list of mappings with exactly the keys ref and
      detail, sorted by (ref, detail), without duplicates; error None, or for a malformed input a short English text,
      with events [], already [] and uncovered []. violations is a pure function: the same input gives the same
      output, and the input is not changed.
  - AC9: >-
      Purity and the CI checks (INV-001, INV-002, INV-003). The module imports only the Python 3 standard library
      (hashlib and re among the allowed) and aieos_bootstrap.governor and aieos_bootstrap.records; it opens, writes and
      removes no file, reads no clock and no environment, and makes no process, network or model call; no exec, eval,
      compile, __import__ or importlib; no assert in src (bandit B101); no string that names the project-state
      directory. At the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002
      and bandit.
  - AC10: >-
      The events in a log (integration). tests/integration/test_drift_log.py builds, in the test, a base commit with
      three articles (one failing, one passing, one with no result) and a task record that matches a fourth failing
      one, runs violations, and appends each returned event in order to an empty in-memory log with
      aieos_bootstrap.eventlog.append (fixed appended_at, no fencing token, no task_id): each result is "appended", the
      final log has records.check_log findings none, and appending the same events again to that log gives "duplicate"
      each time. No file is opened.
  - AC11: >-
      Limits, stated: the facts are the caller's and are not checked against Git, the CI or the log; the rule results
      count only in the article-id form, and mapping CI steps to articles is the caller's; the one-finding rule holds
      only when the base commit is the task's evaluated commit (AC5); a scope that cannot be evaluated applies; the
      event's appending, the writer and the caller are TASK-031's (DEF-0030). Every existing module and test not in the
      write set is unchanged, and if one can pass only by a change the task escalates (needs_out_of_scope_change).
  - AC12: >-
      Its own tests and the added text. Every test function of the three new test modules names the AC ids it stands
      for as "TASK-030 ACn" in its own docstring and names no other task's AC in qualified form there. Before each
      commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0;
      the file names are scanned with the same patterns and the records executors' pre-push pattern (D-282).
  - AC13: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 (each malformed form, the first one
      named; no event on error); R2 AC2 (a scope met; a scope not met; a scope that cannot be evaluated applies and is
      uncovered; an empty changed_paths); R3 AC3 (a failing result gives an event; a passing one does not; pass and
      fail together fail; no result is uncovered; a result for another commit, gate or article is no result); R4 AC4
      (each unusable form, named by record_id or index); R5 AC5 (a matching task record gives no event and is listed
      in already; a record differing in gate, article, commit or outcome does not match; a record otherwise matching
      but malformed, or not an observation, does not match and the event is given); R6 AC6 (the payload's keys and
      values; the two ids' values; check_payload finds nothing; no task_id; the sorting); R7 AC8 (the keys, the
      sorting, no duplicates, purity: the input unchanged, a second call equal); R8 AC7 and AC9 (a script check of the
      module's imports and of the absence of open, write and clock calls). Unit tests in tests/unit/test_drift.py;
      AC10 in tests/integration/test_drift_log.py; property tests in tests/property/test_drift_properties.py
      (standard library only, fixed seeds): for random well-formed inputs, every event's article applies and has a
      usable failing result and is not in already; every applicable article is in exactly one of the events, already,
      the passing set or the uncovered refs; the result never depends on the order of articles, rule_results or
      task_records. tests/run_tests.py, unchanged, runs all groups.
