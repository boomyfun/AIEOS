objective: >-
  (G1) Make the seven tools of the aieos MCP server callable without a prompt: the file C:\Users\Admin\AIEOS-runtime\claude-settings.json keeps its "hooks" object byte for byte and gains a "permissions" object whose "allow" list is exactly the seven names mcp__aieos__status, mcp__aieos__acknowledge, mcp__aieos__ask, mcp__aieos__report, mcp__aieos__handoff, mcp__aieos__get_work_order, mcp__aieos__query, in that order (the draft file is claude-settings.draft.json, 869 bytes, sha256 242533e144193b758532bd5c1e78aefc196ae5c5e430c055dd01a7044fef4512); in src/aieos_runtime/claude_starter.py change exactly one line, SETTINGS_SHA256 (line 31), to that hash; in tests/unit/test_claude_starter.py change exactly the pinned settings hash (line 249) to that hash. The write of the settings file is NOT done by the task commit (it lies outside the repository): it is an act of the executor after the fix is checked and re-read, and the machine may ask the owner for a click. The order (D-6395): the records commit; the CI revision 22 (form B); the contract commit; this task through its route to acceptance and landing; THEN the write of the settings file (its draft hash 242533e1... checked by the executor step); then the CI revision 23; then the launch decision for the one more session.
  (G2) In src/aieos_bootstrap/claude_code.py make the tool ToolSearch covered with the narrowest verdict: "allow" (concern "schema", reason "schema", a new word of REASONS) only when tool_input is a mapping whose "query" is a string of the exact form `select:` followed by one or more of the seven names of MCP_TOOLS separated by commas, and nothing else, whatever other keys hold; every other ToolSearch call (a keyword query, an empty select, a name of another tool, a different case, a missing or non-string query) stays "uncovered". Add tests.
