      Limits stated at acceptance: (1) whether the runtime honours a "permissions.allow" rule with exact MCP tool names together with `--permission-prompts none` for the named build is measured only by the second real session; (2) whether ToolSearch is needed at all to call a deferred MCP tool is unmeasured; (3) the shape of ToolSearch's tool_input in a hook input is unmeasured; (4) the rule takes effect only when the settings file is written (not by this task's commit); (5) the CI revision 22 (form B) must have landed on main before this task's commit is pushed, else the CI refuses the new settings hash; the CI revision 23 drops the old hash after this task has landed and the settings file is written; (6) a session that ends with no work and exit 0 stays a named finding.
