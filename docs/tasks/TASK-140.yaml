      The pin. claude_starter.SETTINGS_SHA256 is exactly the sha256 of the new settings file (242533e1...4512 for the draft; the executor recomputes it from the file at approval and shows the command output unedited), a constant string as before (TASK-134 AC2); the new file parses as JSON, its "hooks" object equals the base file's, and its "permissions" is exactly {"allow": [the seven names in the order above]}; nothing else of the file changes. A diff of claude_starter.py and test_claude_starter.py against the base shows exactly the lines of the constants (line 31; line 249).
  - AC2: >-
      The hook. For ToolSearch with query `select:mcp__aieos__get_work_order` (and any non-empty comma list of the seven names) judge gives verdict allow, concern schema, reason schema, and the pre-tool hook gives exit 0 reason tied_allow; for a query with any other name, a keyword query, an empty select, a different case, a missing or non-string query, a tool_input that is not a mapping, and for every tool name other than the nine judged ones and ToolSearch, the verdict is "uncovered" as at the base; MCP_TOOLS, READ_TOOLS, WRITE_TOOLS and SHELL_TOOLS and every other branch of judge are unchanged; the module docstring is updated (the uncovered list at :17-18) and states that the shape of ToolSearch's tool_input (a "query" string) is taken from the tool's own definition in the session and is unmeasured in a hook input.
