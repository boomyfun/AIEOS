acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only the seven files of the write set (four modules under src/aieos_bootstrap/ and
      three test modules). No module changes behaviour except as AC3, AC4 and AC5 say. Existing tests pass unchanged except
      the altered cases named in AC3; other assertions are only added to or made stricter. No test writes a file, starts a
      process or imports a module that the workflow's deterministic_rule step refuses; no exec, eval, compile,
      __import__ or importlib is used; the only imports added are of the own package. No public name is added to or removed
      from a module.
  - AC2: >-
      DEF-0032 (F-h; D-7630 Q2; DEF-0032:18, open per its Log :34-:35; code src/aieos_bootstrap/eventlog.py:79-:90, :172-:184 and :237-:239). A test in tests/unit/test_eventlog.py shows the integer-key sameness case: a record.added event whose
      payload's intent_versions mapping holds the key "1" is logged (the logged line passes records.check_log; if it does
      not, that is a spec_conflict), and a retry whose mapping holds the integer key 1 gives "duplicate" (the keys
      serialise alike in the sameness text of eventlog's _canonical and _same_text; the sameness check at :176-:184 comes
      before the form check). A sentence in the docstring of eventlog.append states that the AC5 re-check cannot fail as
      built, and why. No behaviour of eventlog changes for this item.
  - AC3: >-
