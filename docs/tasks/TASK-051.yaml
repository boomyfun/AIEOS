acceptance_criteria:
  - AC1: >-
      The arguments of the three adapter calls. Each call checks every argument before anything is called: root a
      non-empty string; task_id "TASK-" followed by digits; session_id, holder and recorder non-empty strings; inputs
      a mapping (execution.execute judges its keys); code_sha256 64 lowercase hex characters; expires_at and now
      timezone-aware datetimes in UTC with whole seconds, expires_at after now; repo a non-empty string; commit_id 40
      lowercase hex characters; event_id a non-empty string; fencing_token a mapping or None. A wrong argument gives
      the result of AC5 with result "refused", reason "argument" and a finding naming it, and no function is called.
      Each call takes keyword arguments for the functions it calls (start: start_session and execute's read_log,
      append, grant, release, held and check; submit: submit.submit's read, append, release and held; end:
      release_lease_token and end_session), each defaulting, at call time, to the named function of writer,
      execution, submit or gitread; the adapter itself keeps no state between calls.
  - AC2: >-
      start (specification 5 section 2 item 1; specification 3 section 1). start_session(root, session_id, holder,
      now) is called first; a StoreResult other than "done", or a raised exception, gives "refused", reason
      "session", and execute is not called. Then execution.execute(root, task_id, inputs, code_sha256, {holder,
      session_id, expires_at}, recorder, now, ...) is called once with the given functions; its result is returned in
      the adapter's result unchanged under "core", with decision and lease copied out, and the fencing token is the
      lease's fencing_token when a lease was granted or kept, else None. When execute grants no lease, the session row
      stays open and is the caller's to close with end (reading: a session with no lease still ends through end).
  - AC3: >-
      submit (specification 5 section 2 item 4). submit.submit(root, repo, commit_id, task_id, event_id, recorder,
      now, ...) is called once with the given functions and its result is returned under "core"; the adapter reads no
      commit and compares no token of its own (the fence decision is the writer's, specification 5 line 24).
  - AC4: >-
      end (specification 5 section 2 item 5). When fencing_token is a mapping, release_lease_token(root, task_id,
      fencing_token) is called once; "done" gives the released lease; a refusal with reason "none" or "token" (no
      lease held, or another token held: a submission or the core released it, or another holder holds it now) is no
      error and releases nothing (specification 5 line 25); any other result or a raised exception gives "refused",
      reason "release", and end_session is not called. When fencing_token is None, no release is called. Then
      end_session(root, session_id, now) is called once; a result other than "done" or a raised exception gives
      "refused", reason "session".
  - AC5: >-
      The adapter's result. Each call returns a mapping with exactly the keys result ("done" or "refused"), reason
      (None or one of "argument", "session", "core", "release"), findings (a list of texts), core (the called core
      function's result, or None), decision (start only, else None), fencing_token (start only, else None) and
      released (end only, else None). A core result whose result is "refused" gives the adapter's result "refused",
      reason "core", with core's findings copied. An exception raised by a called function is caught and becomes a
      result with the step's reason; none escapes.
  - AC6: >-
      The replay document (specification 5 section 5; §11 point 9). replay(document, root, functions=None) takes the
      document as a mapping (the caller parses it; replay opens no file) with exactly the keys replay_id (a non-empty
      string), recorder (a string starting with "replay:"), epoch (a non-empty string), setup (a list of events to
      append before the session, each a mapping with exactly the keys type, payload, event_id, appended_at and
      task_id), session (a mapping with exactly the keys task_id, session_id, holder, inputs, code_sha256, start_at,
      expires_at and expected_token, the last a mapping or None), submission (None, or a mapping with exactly the keys
      commit_id, commit_text, event_id and at) and end_at; every time is a text in UTC with whole seconds,
      "YYYY-MM-DDTHH:MM:SSZ", read into a datetime by replay. A document in another form gives the result of AC8 with
      result "refused", reason "document", and nothing is called.
  - AC7: >-
      The replay's run and M1 of decision D-983. replay calls, in this order and each once: read_log(root) and
      open_store(root, epoch); unless the log read is empty and open_store returns the document's epoch with counter
      0, replay refuses with reason "store" before any append and calls nothing else (N1 of decision D-984: replayed
      records never enter a project's event log, specification 5 line 48); then append_event for each setup event in its order, with the document's recorder; adapter.start with the session's
      values; when the start granted a lease and expected_token is a mapping, a comparison of the granted token with
      it, a difference giving "refused", reason "token", after which only end is called; adapter.submit when
      submission is not None, with a read function that answers ["cat-file", "-t", commit_id] with "commit" and
      ["cat-file", "-p", commit_id] with commit_text in gitread.run's result form, and refuses any other call; then
      adapter.end with the session's id, the granted token (or None) and end_at. Every call passes the root it was
      given and the document's recorder; replay names no other root and no project-state directory; in the log the run
      produced, every record.added event has a source_class of deterministic_tool_local or none, and no line names a
      recorder not starting with "replay:" (N2 of decision D-984).
  - AC8: >-
      The replay's result and its determinism. replay returns a mapping with exactly the keys result ("done" or
      "refused"), reason (None or one of "document", "store", "setup", "start", "token", "submit", "end"), findings,
      steps (one entry per call made: its name and its result) and fencing_token. A refusal at a step stops the run
      there, except that end is still called after a granted lease (so no lease is left held by a replay that the
      replay itself can release). Two runs over equal documents and equal empty roots give equal steps and equal logs
      (property test). functions, when given, is a mapping that replaces any of open_store, append_event, start_session,
      end_session, read_log, grant_lease, release_lease_token, held_lease and resume_check.check, for tests.
  - AC9: >-
      Limits, stated in both modules' docstrings and carried at acceptance: no observation and no violation call
      (specification 5 §2 item 3, §7, §8; §11 points 3 and 4), so the replay sequence has no observations, although
      section 5 line 46 lists them; abnormal ends beyond the lease's expiry not handled (§11 point 10); the lease's
      write-set not passed or enforced (left open, reading); the token taken from the grant, not the document (M2, a
      stated departure from line 49's wording); the commit read from the document in a replay, so a replay shows the
      core's handling of a recorded commit, never that a runtime made it; one run at a time (the writer's limit); a
      passing replay shows how the core handles a recorded session, never that any hook observes anything (C6 stays
      unmeasured); a run against the real writer's files is not tested in this task (the tests open no file, AC11;
      N2 of decision D-984); __init__.py not changed. Every existing module and test is unchanged, and if one can pass only by a
      change the task escalates (needs_out_of_scope_change).
  - AC10: >-
      Purity and the CI checks (INV-001 to INV-004). adapter.py imports only the Python 3 standard library and
      aieos_bootstrap's execution, gitread (for the default read only, by reference to submit's default), submit and
      writer; replay.py only the standard library and aieos_bootstrap's adapter and writer. Neither starts a process,
      opens a file, reads a clock or the environment, builds an event-log line itself, or makes a network or model
      call; no exec, eval, compile, __import__ or importlib; no assert in src (bandit B101); no string that names the
      project-state directory; tests/unit/test_writer.py's R8 test and tests/unit/test_gitread.py's subprocess test
      pass unchanged. At the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001,
      SEC-002 and bandit.
  - AC11: >-
      Its own tests and the added text. Every test function of the new test modules names the AC ids it stands for as
      "TASK-051 ACn" in its own docstring and names no other task's AC in qualified form there. Before each commit, the
      added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0; the file
      names are scanned with the same patterns and the records executors' pre-push pattern (D-282). The tests open,
      write and remove no file (the deterministic_rule step's exemption covers only the writer's tests).
  - AC12: >-
      Tests, each rule with at least one passing and one failing case, with stand-ins for the writer's functions and
      for the check (no process, no file): R1 AC1 (each wrong argument refused before any call; each default is, at
      call time, the named function; every call a stand-in records binds to the real function's signature, by
      inspect.signature(...).bind); R2 AC2 (start_session before execute; a refused session start stops before
      execute; the token from a granted lease; no token without a lease); R3 AC3 (submit.submit called once with the
      given values; no token comparison in the adapter); R4 AC4 (release then end_session; "none" and "token" are no
      error; no release without a token; a refused release stops before end_session); R5 AC5 (the keys; an exception
      caught at each step); R6 AC6 (each malformed document refused before any call; a recorder without "replay:"
      refused); R7 AC7 (the call order; the commit stand-in answers the two reads and refuses any other; a token
      difference stops and still ends; every call carries the given root; an empty log with a new store at counter 0
      passes, and a non-empty log, and an existing store with counter above 0, are each refused "store" with no append;
      the record.added and recorder rules over the log the end-to-end run produced); R8 AC8 (a refusal at each step; end after a
      granted lease); R9 AC9 and AC10 (a script check of the imports and of the absence of open, write, subprocess,
      clock and environment calls, and of the docstrings' words). Unit tests in tests/unit/test_adapter.py and
      tests/unit/test_replay.py, the latter with an end-to-end replay over the real execution.execute,
      resume_check.check and submit.submit with in-memory stand-ins for the log and the store built on eventlog.append,
      and a property test (standard library only, fixed seeds) that two runs over equal documents give equal steps and
      equal stand-in logs. tests/run_tests.py, unchanged, runs them.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC12]}
  - {gate: G3, check: constitution, args: [AC9, AC10, AC11, INV-001, INV-002, INV-003, INV-004, INV-009, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
