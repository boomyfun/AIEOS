# Task contract TASK-051, the adapter–core interface and the replay adapter (Master Plan revision 4, §4 M5;
# specification 5 revision 3, sections 2, 5, 9 and 11 points 7, 9 and 10; specification 1 revision 2, sections 5.1 and
# 8; specification 3 revision 4, section 1).
# Revision 0, drafted under decision D-983 (C2), from the scope note approved there with its changes M1 to M4; brought
# for approval in its own request; whether it is approved is recorded in the decision files, not in this file. Fields
# and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-050. Readings marked "(reading)"
# are the worker's, for the decision agent's ruling.
# Revision 1, under decision D-984: N1 (the replay refuses a log that is not empty or a store already used) and N2
# (AC7's clause on the records read over the log the run produced; a run against the real writer's files untested).
# Task type: implementation. What it adds: two modules. src/aieos_bootstrap/adapter.py is the subset of specification
# 5 section 2 that the core already has paths for: start (section 2 item 1: the session row opened through
# writer.start_session, then the Resume Check and, on CONTINUE or CONTINUE_WITH, the lease through
# execution.execute, TASK-032), submit (item 4: submit.submit, TASK-025, which takes the fencing token from the
# commit's AIEOS-Fence trailer; the adapter compares no token) and end (item 5: the lease released by its token through
# writer.release_lease_token, TASK-028, when neither a submission nor the core released it, then the session row closed
# through writer.end_session). src/aieos_bootstrap/replay.py replays one recorded session from a replay document
# (specification 5 section 5) through those three calls, deterministically, with no model call (INV-001).
# The ids (specification 5 §11 point 7): a session is named by its task_id, its session_id and its holder, given by the
# caller (for a replay, by the document); the fencing token is the one the lease grant returns, carried by the caller
# from start to end, and the adapter keeps no state between calls. Where the lease's write-set comes from (§11 point 7):
# left open in this task (reading): no call of this task enforces or passes a write-set, because enforcement while
# running is the Claude Code adapter's hooks (section 6), whose install is the owner's (A51 item (4)); the write-set
# stays the approved contract's, read by the gates afterwards (G0). The channel from a hook to the core (§11 point 7):
# left open, with the observations (below).
# M2 of decision D-983, the token's source (specification 5 line 49: every value a replayed session needs, "times, ids,
# the fencing token", comes from the fixture): the document gives the store's epoch, every time and every id; the
# replay opens the store with that epoch (writer.open_store(root, epoch)), so the grant's token (the epoch and the
# store's counter) is deterministic; when the document states an expected token, the replay compares the granted one
# with it and stops at a difference. The token itself is therefore the grant's, not read from the document: a stated
# departure from line 49's wording, with the same outcome (two runs give equal records).
# M1 of decision D-983 (specification 5 line 48: "Replayed records exist only in a conformance run, never in a
# project's event log, and claim no class above deterministic_tool_local"): the replay writes only through the core's
# functions and only under the root its caller gives, never names the project-state directory, and refuses a document
# whose recorder does not start with "replay:"; every record the core appends during a replay (the fence refusal's
# record.added included) has no source_class above deterministic_tool_local, which AC7 checks.
# M4 of decision D-983, the limits: no observation and no violation call (specification 5 §2 item 3, §7, §8: the
# record keys are for specification 2's next revision, §11 points 3 and 4, and the core has no path yet from a hook's
# refusal to violation.detected), so the replay's sequence is start, submission and end only, without the observations
# that line 46 lists; abnormal ends beyond the lease's expiry (§11 point 10) are not handled; both carried in a Deferred
# item at acceptance. ADV-02's executable fixture is a later task with its own fixture-freeze approval; nothing under
# tests/conformance/ changes.
# The commit in a replay: submit.submit reads the commit through its read function; the replay gives it a stand-in that
# answers "cat-file -t" and "cat-file -p" from the document's commit text, so a replay needs no Git repository and
# starts no process (reading); a live session's submission (adapter.submit with no read given) reads the repository
# through gitread.run, as submit.submit does.
# What it does not do: no hook, no Claude Code setting, no measurement (specification 5 sections 6 and 10); no
# observation, no violation, no Work Order, no Context Compiler; no T0 adapter flow; no store creation by the adapter
# (open_store stays the caller's: the replay's, or a later CLI's; D-414's requirement on epochs stays with that caller);
# no lease expiry (writer.expire_leases stays the caller's); no change to any existing module; nothing under .github/,
# tests/conformance/ or bench/; no network.
# Readers of the changed paths (D-263 C3's practice): none exist; both modules are new, and no module calls them yet.
# Two existing tests read every module of src/: tests/unit/test_writer.py (R8: only writer.py opens files or names the
# project-state directory) and tests/unit/test_gitread.py (only gitread.py imports subprocess); both new modules keep
# them passing. src/aieos_bootstrap/__init__.py is not changed (the scope note's write-set, D-983 C2), so __all__ does
# not name the new modules (a stated limit; a later change may add them).
# Risk: high (risk rules revision 6, policy v4, §2 point 3: R3 matches every path under src/** and tests/** until an
# approved architecture entity exists), computed over the base by script, as for TASK-027 to TASK-036. Change class
# normal: the governor is not touched. Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test],
# architecture [deterministic_rule], functional [integration_test], security [static_security_analysis] and
# architecture [ai_review (cross-model)], plus the evidence_required of the applicable articles.
# Reviews (as TASK-032's): five way-2 reviews by a Claude model other than the implementer's and other than the main
# session's, and the decision agent's own review for the cross-model entry, each brief naming for testing: the order
# start_session then execute, and release then end_session; the token carried, not compared, at submission; the
# replay's determinism (two runs equal), the epoch and the expected token; M1's rules; the commit stand-in; the
# stand-ins bound to the real signatures; purity (no file, no process, no clock, no environment).
# Naming (D-544 Q3): every test of the new test modules names the AC ids it stands for as "TASK-051 ACn" in its own
# docstring.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-051.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-051", go to task/TASK-051 under their own decisions; main receives
# the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (decision contracts,
# acceptance, evidence and the policy meet no path of the write-set); GOV-001, GOV-004 to GOV-006 and SEC-003 (the
# concept file, the bound artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no
# path of the write-set). INV-004 applies: both modules write only through the writer's functions (directly, or
# through execution.execute and submit.submit). INV-009 applies through the writer, which this task does not change.
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: no hook, no Claude Code
# setting, nothing under .github/, no push of its own; it weakens no evidence requirement; so its acceptance is one
# delegated approval of the decision agent (Master Plan section 6), for the decision agent's ruling.
task: TASK-051
contract_version: v1
task_type: implementation
objective: >-
  Add two standard-library Python 3 modules. src/aieos_bootstrap/adapter.py gives the adapter contract's subset of
  specification 5 section 2 that the core has paths for: start(root, task_id, session_id, holder, inputs, code_sha256,
  expires_at, recorder, now) opens the session row through writer.start_session and then calls execution.execute,
  returning its decision and, on a grant, the fencing token; submit(root, repo, commit_id, task_id, event_id, recorder,
  now) calls submit.submit; end(root, task_id, session_id, fencing_token, now) releases the lease by its token through
  writer.release_lease_token and closes the session row through writer.end_session. src/aieos_bootstrap/replay.py gives
  replay(document, root): it checks one replay document, opens the store with the document's epoch, and drives start,
  submit and end in order with every time and id from the document, so that two runs over equal inputs give equal
  records. With unit, integration and property tests in new test modules, each test naming its AC ids as "TASK-051
  ACn" in its own docstring; the tests use stand-ins for the writer's functions and open, write and remove no file.
