objective: >-
  Part A (DEF-0116). In src/aieos_bootstrap/launcher.py extend `_run_statement_findings` so that the statement owner_kept_act false (decision_agent only) is also refused, with the reason argument and a finding that names the path class, for a write path that, compared after lower-casing (as the existing three are) and after the same normalisation the function already applies (none beyond lower-casing; the contract says below how other forms are handled), is equal to `aieos-concept.md`, `docs/pre-genesis/decision-matrix.md`, `docs/pre-genesis/constitution.md` or `claude.md`, or whose first segment is `.claude`; the existing three refusals are kept unchanged and keep their finding text. A write path in the form `./x`, with a backslash, or with a trailing slash is NOT normalised by this task; each is named as a limit in the docstring (a write path in such a form is refused earlier or elsewhere by the launch reader and `_run_path_ok`, whose behaviour is not changed). Tests: one test per path and per case form (all upper case, mixed case) in tests/unit/test_cli_launch.py or the test file of the run command where `_run_statement_findings` is tested.
  Part B (DEF-0117 first gap, option (d3) of D-5526). In src/aieos_bootstrap/evaluation.py, in `evaluate_task`, after the contract bytes are checked against the approved contract_hash (the step 'contract', evaluation.py:361-363) and before governor.derive_inputs is called, bind the governor's owner_kept_act input to those bytes, failing closed: let SAYS_FALSE be true only when the contract text, split at LF, holds exactly one line equal to `owner_kept_act: false` at column 0 and no other line that begins with `owner_kept_act` (any case, any spacing, a duplicate or a differently spelled key means "not false"), and any decode or parse failure means "not false". When SAYS_FALSE is not true, the governor's owner_kept_act input is True whatever values say; this is done on a copy that is passed to derive_inputs, and the caller's values mapping is not changed. When SAYS_FALSE is true, the governor sees what values say. There is no new refusal: the binding sits inside the existing try around derive_inputs, so any exception in it gives the existing `values` refusal (fail closed). The binding covers owner_kept_act only; the other values fields stay caller data (D-633 C1), named in the docstring as a limit.
  Tests (Part B) in tests/unit/test_evaluation.py: an exact `owner_kept_act: false` line with values False (the governor, real or stand-in, sees False); values True with bytes false (the governor sees True); for each not-false variant of the bytes with values False (the key missing, a duplicate key, a case variant, a spacing variant: a leading space, a space before the colon, a CRLF line end, a tab, and bytes that are not UTF-8) the governor receives owner_kept_act True and the call is not refused for that reason; the caller's values mapping is unchanged after the call.
