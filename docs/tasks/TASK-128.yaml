# Task contract TASK-128 (DRAFT r1 for approval; D-5304 C2 prerequisite 3: DEF-0116 with DEF-0117, the run-made contract conversion task; plan D-5525, Part B changed to option (d3) by D-5526; session d01f63a5, 2026-11-07). Drafted in the scratchpad by Write (the form of docs/tasks/TASK-127.yaml, whose text it follows; not a cp -n and Edit copy: disclosed at D-5526); whether this text is approved is recorded only in the decision agent's decision that names its SHA-256, not in this file. The worker's own claim until checked.
# Why: DEF-0116: `aieos run --class decision_agent --owner-kept-act false` is refused by path for .github/, the measurement protocol and the measurements folder only (launcher.py:1893-1911); it is not refused for AIEOS-concept.md, docs/pre-genesis/decision-matrix.md, docs/pre-genesis/constitution.md, CLAUDE.md or a path under .claude/. DEF-0117 first gap: no code makes the governor's owner_kept_act input depend on the approved contract bytes; evaluate_task takes values as caller data (evaluation.py:61-64, D-633 C1) and governor.py:586 reads `kept = contract['owner_kept_act'] is not False`, so the owner routing of a run-made contract rests only on the gap, which is not a control (DEF-0117:7, :11).
# Not in this task: the second gap of DEF-0117 (statements by act and not by path: concept errata, CR-002 part 4 limits 5 and 8 outside the path rules; they stay with the approver), any change to the governor's own logic (governor.py), to the CI's path rules or workflows, to cli.py, writer.py, gitread.py or base_inputs.py, to any spec or doc or DEF file (the DEF-0116 and DEF-0117 Log lines, statuses and bullets are changed at acceptance by the records change-set), the other values fields (they stay caller data, D-633 C1), the runtime starter (a2, D-5304 C2 item 6, DM A75).
# Risk, change class: high, as TASK-125 to TASK-127 (launcher.py and evaluation.py are gate files; the change class is critical_cr because the CI's EVALUATOR list holds src/aieos_bootstrap/** and the tests folders).
# RULED POINTS (D-5526): (1) owner_kept_act of this contract is false (D-5526 Q4: Part B only makes the governor's owner-kept input stricter; it changes neither governor.py nor any spec, the delegation, the measurement protocol, credentials or money, and raises no autonomy level, so A51 item (4) and A54 point 2 are not touched). (2) Part B is option (d3): bytes not saying exactly `owner_kept_act: false` give the governor owner-kept True, with no new refusal; option (d) (a refusal) was dropped because every existing evaluate_task route whose bytes lack the line, the conformance runner's call included (conformance.py:1456, ADV-02: tests/conformance/fixtures_cb/adv_02.py:417 and :507), would refuse. The scratch experiment of (d3) (a clone at 03a02fa5, evaluation.py edited in the clone only, never committed or pushed) ran the six slices of the suite before and after: 892, 644, 582, 469, 223 and 219 tests, 0 failures and 0 errors both times (3029 tests), so no existing test and no conformance-runner test (test_runner_cb*, test_conformance_*) changes result and the write set holds no test file beyond the two named for new tests. (3) Specification 2 section 6.5 (spec-02:218-221) and conformance-files.md section 11 state no caller-data limit (a Grep of docs/specs and docs/pre-genesis at 03a02fa5 finds none); the limit is stated in evaluation.py:61-64, TASK-027.yaml:315 and DEF-0055:15, so no specification change comes first, and DEF-0055's carried-limit line is noted by the records change-set at acceptance.
