acceptance_criteria:
  - AC1: >-
      Part A, the paths. `_run_statement_findings(source_class, write, owner_kept_act)` with owner_kept_act the text false and source_class decision_agent returns a finding that begins "argument:" and names the refused class for a write path equal to aieos-concept.md, docs/pre-genesis/decision-matrix.md, docs/pre-genesis/constitution.md or claude.md, or whose first segment is .claude, compared after lower-casing (so AIEOS-concept.md, DOCS/PRE-GENESIS/Decision-Matrix.md, CLAUDE.md and .Claude/settings.json are refused); the three existing refusals (.github/, the measurement protocol, the measurements folder) and their finding text are unchanged; a path that merely contains one of the names (docs/notes/claude.md.txt, notes/.claude-notes.md) is not refused by the new rule; with owner_kept_act None the function returns [] as before. One test per path and per case form; the existing tests of the function pass unchanged.
  - AC2: >-
      Part A, the forms not normalised. The docstring states that a write path written with a leading "./", with a backslash or with a trailing slash is not normalised by this function (each is refused, or not, by the launch reader and `_run_path_ok`, whose behaviour is not changed by this task), and one test shows the actual behaviour for each of the three forms on one new path (for example "./CLAUDE.md": the test pins what the function does today, whichever it is, and the docstring says it).
  - AC3: >-
      Part B, the binding (option (d3)). In `evaluate_task`, after the 'contract' step and before derive_inputs: with values['contract']['owner_kept_act'] False, the governor sees False only when the contract bytes hold exactly one line `owner_kept_act: false` at column 0 and no other line beginning `owner_kept_act` (the exact rule of the objective); otherwise it sees True, on a copy, with no refusal for that reason and the caller's values unchanged. Tests: exact false with values False (the governor stand-in or the real governor sees False); values False with bytes true; a missing key; a duplicate key; a case variant (`Owner_kept_act: false`, `owner_kept_act: False`); a spacing variant (a leading space, a space before the colon, two spaces after it, a CRLF line end, a tab); values True with bytes false (the governor sees True); bytes that are not UTF-8 (not false: the governor sees True); the caller's values mapping equal to a deep copy taken before the call.
  - AC4: >-
      Part B, the other fields and the docstring. Only owner_kept_act is bound; the docstring's limit (evaluation.py:61-64) is amended to say so in plain words (the other values fields stay caller data, D-633 C1) and to say what the binding does and why; no other behaviour of evaluate_task changes (a test per untouched path of the existing suites passes unchanged except where AC5 says); governor.py is unchanged.
  - AC5: >-
      The existing tests. The routes to evaluate_task in the existing tests are tests/unit/test_evaluation.py, test_evaluation_failed.py, test_evaluation_repeated.py, test_evaluation_violation.py, tests/property/test_evaluation_properties.py, tests/integration/test_evaluation_repo.py (it reads docs/tasks/TASK-026.yaml, whose line 354 says owner_kept_act: false, so it is not affected) and, through the conformance runner (src/aieos_bootstrap/conformance.py:1456, the ADV-02 fixture tests/conformance/fixtures_cb/adv_02.py), tests/unit/test_runner_cb.py, tests/property/test_runner_cb_properties.py and tests/integration/test_runner_cb_run.py. The scratch experiment of option (d3) in a clone at 03a02fa5 (evaluation.py edited in the clone only) ran the six slices of the suite before and after (892, 644, 582, 469, 223 and 219 tests, 0 failures and 0 errors both times): no existing test changes result, so no existing test is amended by this task, and none is deleted or weakened. The conformance files and src/aieos_bootstrap/conformance.py stay forbidden; if the build shows that any conformance case or file must change, the task stops and the finding comes back to the decision agent before anything else, and it is not done in this task.
  - AC6: >-
      Purity and tests (INV-001, INV-002, INV-004). No new import in a changed src file beyond those already present (evaluation.py: hashlib is imported); no new process form, clock read or file access; the directory's name appears as a string in no changed src file; the new docstring sentences use none of MEASURED, ENFORCED and GUARANTEED and no string constant in a changed src file is exactly "valid", "accepted" or "approved"; every new test's docstring begins with the task id of the test file's own convention plus "(amended by TASK-128 ACn)" where the module's rule requires it; no test runs git init or a subprocess or touches this repository's real state; the whole suite passes locally (`timeout 110 python tests/run_tests.py < /dev/null`, in slices if it does not finish) and on the CI. The risk class is high; the evidence profile is that of assurance-model section 5 for high, as for TASK-125 to TASK-127 (unit_test, integration_test, deterministic_rule, static_security_analysis, ai_review cross-model by a pair of reviews on Haiku 5.5 and a per-article review, a separate decision_agent_review, and the profile's other entries); the expected governor shadow result at the GOV-003 row is a stated departure as in TASK-125 to TASK-127 (the change class is critical_cr). The raw output of the step 'GOV-003 base tests (report only)' of the task-branch run is brought at acceptance with each base-test failure named. The first run is on the task branch.
  - AC7: >-
      Limits. No change to governor.py, base_inputs.py, cli.py, writer.py, gitread.py, the conformance runner or fixtures, the hook, the workflows, any spec or doc, any DEF file (the DEF-0116 and DEF-0117 Log lines, statuses and bullets are changed at acceptance by the records change-set; DEF-0116 can close if Part A lands, DEF-0117 stays open for its second gap unless the decision agent rules otherwise); no launching of a runtime; no change to the autonomy level or the measurement protocol. Stated limits in the docstrings in plain words: the second gap of DEF-0117 (statements by act and not by path) is not closed and stays with the approver; the other values fields stay caller data; the binding reads the bytes of the contract the caller gives, which are checked against the approved contract_hash first; a run-made contract's approval refusal (launcher.py:1556) and the run's path refusal remain the first filters; the path refusal of Part A is by path only and not by act.
