acceptance_criteria:
  - AC1: >-
      Scope. Each entering part of the scope note, as adjusted in the header (appendix A lists the items, files and
      findings), is either changed, or listed in commit X's map with the reason it leaves (done already, not text or test,
      group B, or needs a file outside the write set: header and D-3600 C5), by a script check that every entering item of appendix A appears once in the map. The map's exact lines
      come from the files at the task's base. No item or part that the note leaves is changed. DEF-0033, 0036, 0071, 0102
      and 0104 are not touched. DEF-0067's D11 is done already and not changed.
  - AC2: >-
      No behaviour changes in src/. For every file of src/ in the write set, the module's parse tree with every docstring
      removed and every comment dropped is equal at the base and at the task commit, shown by a script that prints the
      comparison per file; the comparison is ast.dump(ast.parse(text)) with default attributes (no positions) after removing
      the first statement of every Module, ClassDef, FunctionDef and AsyncFunctionDef when it is a string constant; any
      difference fails. A point that would change the parse tree (for
      example removing the unused KINDS of ac_coverage.py, moving state['passed'] in read_set_record.py, or changing a
      string literal or a message) is done by a comment or a docstring only, or leaves with
      the reason in the map. src/aieos_bootstrap/resume_check.py, governor.py, records.py and session_violation.py are not
      in the write set.
  - AC3: >-
      Tests. Every existing test function that the task changes keeps its assertions, or gets stronger ones: a script
      compares, per test function (by name, or through the rename map of commit X's map), the ordered list of ast.dump of
      each assert statement and each self.assert* call at the base and at the task commit, and prints every difference;
      it passes when the base list is a subsequence of the new list, the one named exception below differs only in its
      expected string, and every renamed test keeps its assertions; a rename changes the name and the docstring and
      nothing else of that test;
      an added test passes at the task commit and fails on a stated broken copy where the item says "pin"; no existing
      test is deleted, and the number of test functions of each changed module does not fall. Where a test pins a
      docstring sentence that the task corrects (DEF-0094: tests/unit/test_t0.py :359 pins the sentence of t0.py :48), its
      expected text changes to the corrected sentence, named in the map, and the test is shown failing on a copy that
      holds the old sentence. A test added or changed in a module whose naming test requires a task's criteria in every
      docstring (test_t0.py, test_task_contract.py, test_task_contract_properties.py, test_task_contract_repo.py,
      test_adapter.py, test_scope_reconcile.py, test_scope_reconcile_properties.py, test_scope_reconcile_log.py,
      test_context_compiler.py, test_ac_tests_tree.py, test_writer.py) names the criteria that module's naming test
      requires and no TASK-102 id; the link to TASK-102 is in commit X's map. A docstring edit in src/ keeps every
      phrase that a test outside the write set pins (for example launcher.py, cli.py and claude_code.py in
      tests/unit/test_cli_*.py, test_launcher*.py, test_claude_code.py, test_execution_status.py and test_mcp_server.py) and adds none that such a
      test refuses by assertNotIn; otherwise the point leaves (header; D-3600 C5).
  - AC4: >-
      Withdrawn (D-3599 M2). The shared state helpers of DEF-0036 and DEF-0046 stay copied in the four test modules,
      because a shared module under tests/ cannot be imported under the CI's rule (aieos-checks.yml :1611-1621 at main db866ffd). DEF-0046's
      F4 (the docstring line of tests/integration/test_runner_risk_run.py) and F5 (the count assertion) remain in this task.
  - AC5: >-
      Parity. The frozen fixtures and the reference outputs of the Python Resume Check and governor are byte-unchanged:
      tests/conformance/ is unchanged, tests/unit/test_export_reference.py and test_export_resume.py are unchanged and their
      pins hold (REFERENCE_SHA256 and the Resume Check pin), and the aieos-native run of the task commit shows the governor
      and the Resume Check compare lines byte-equal as before, both jobs. native/go/governor, native/go/resume and bench/go
      are unchanged, each file checked by SHA-256 against main. This is checked by the CI.
  - AC6: >-
      Prerequisites. P1 to P8 are on main before commit C. The texts of P1 to P6 are decided one by one and land under
      one executor plan, one push decision and one CI read; P7 and P8 each land under their own A66 decision; input_state
      pins the revised hashes; this task changes no spec and no workflow file.
  - AC7: >-
      Nothing else changes. Every test that tests/run_tests.py runs passes at the task's commit on a compiled tree; no DEF
      file, no record of an accepted task and no contract is changed; the carries and gate T5 of the header are named in the
      acceptance record and stay carried.
  - AC8: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). No exec, eval, builtin compile, __import__ or importlib is
      added; nothing starts a process, opens a connection or writes a file at import; no Python file is added; no added text
      in src/ names .aieos (INV-004, aieos-checks.yml :1483, coded :1639-1641 at main db866ffd); the ALLOW entries for writer.py and its three tests are not used
      for anything new. The CI steps at the task's commits report no finding (deterministic_rule, OPS-003, SEC-001, SEC-002,
      bandit); before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns and
      the pre-push pattern, each count 0. No added text in src/ or tests/ holds the byte strings that the closed name
      lists refuse outside the modules already allowed ('native/', 'bench/', 'fixtures_rc', 'fixtures_risk',
      'fixtures_cb'; TASK-101's contract, test_native_isolation.py, test_bench_isolation.py).
  - AC9: >-
      The records (L-0034). The task's evidence records' forms are built and checked through records.check_record and a
      governor shadow over a dry records list at r0's approval request with their raw output: per-article records for
      INV-001, INV-002, INV-004, GOV-002, GOV-003, SEC-001, SEC-002 and OPS-003 (whichever of them the constitution gives an
      evidence_required), the property_test step's copies for INV-005 to INV-008 and the replay record for INV-010, INV-003 and OPS-002 (decision agent
      reviews), and the profile entries of risk high; the expected result, to be confirmed by the shadow's raw output for
      risk high and change class critical_cr, is NEEDS_REVIEW at row 5 with no missing entry; if the output differs, this
      line is corrected from it.
  - AC10: >-
      The CI evidence. On the aieos-checks and aieos-native runs of the accepted commit, every job and step is
      successful, read by a read-only script by run id; on main after the records commit likewise.
