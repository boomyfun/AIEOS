# the script outputs and the dry records are in the approval request (D-3600 C5 to C7, D-3620 C4 to C6).
# The scope: the placed scope note C:\Users\Admin\AIEOS-REG0-lite\CS\records\cleanup-scope-note-2026-10-29.md, SHA-256
# b0b01e08bc821edf6951785c7a82664b0c39688fbf7a063ff696beb5bea19f3b (decision D-3597). It lists, per item, what enters and what
