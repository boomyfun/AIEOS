# decisions D-3466 C3, D-3550, D-3568, D-3595 to D-3599). Drafted under D-3598 C2 to C4 and corrected under D-3599 M1 to M9;
# brought for approval in its own request; whether it is approved is recorded in the decision files, not here. Fields and
# value forms follow specification 2 section 5.1 and TASK-101's contract.
