acceptance_criteria:
  - AC1: >-
      read_contract's arguments and result: a mapping with exactly result, reason, findings, task, base_commit,
      write_set and forbidden; result "read" or "unreadable"; findings a list of str, [] on "read"; on "unreadable"
      task, base_commit, write_set and forbidden are None. Step (1) refuses, reason "argument", with step (1)'s exact
      findings, a root that is not of type str, relative, or not an existing folder (through gitread.form_error), a
      commit not of type str or not fullmatching gitread.OBJECT_ID, a task_id not of type str or not "TASK-" and ASCII
      digits (a str subclass and an Arabic-Indic digit among the cases, and "TASK-071\n", a 40-hex commit with a
      final "\n", a 41-hex and a 63-hex commit, and a root that is an absolute path to an existing file; t71f-R1-5),
      before run is called (a recording stand-in);
      with two bad arguments, the first in the order root, commit, task_id is the one finding. No exception escapes:
      a patched gitread.parse_commit that raises gives reason "entry", ["entry: <type name>"]. Equal arguments over an unchanged
      repository give equal results.
  - AC2: >-
      The git reads, step (2): run is called at call time (a stand-in is the one called; by default gitread.run), only
      as run(root, ["cat-file", "-p", <id>], 10), each id fullmatching gitread.OBJECT_ID, at most five times, in the
      order commit, root tree, docs, tasks, blob. Each case a stand-in, asserting step (2)'s exact finding: reason
      "git" for run raising; a result that is not a dict, a dict subclass, or a dict with other keys; an error not
      None; an exit of 1, of True, of None, of "MARKER"; an out of type str, bytearray or a bytes subclass; a commit
      text of 1 MiB + 1 byte (1 MiB exactly passes) or not UTF-8; a commit out of form (a parse_commit error, and a
      patched gitread.parse_commit returning a tree id not in OBJECT_ID form; t71f-R1-4); reason
      "tree" for a tree text of 1 MiB + 1 byte (1 MiB exactly passes) or not UTF-8; a tree line without its final
      "\n", out of form, with a mode not [0-7]{6}, a type other than blob, tree or commit, an id not in OBJECT_ID
      form, an empty name or a "/" in it; a C-quoted name and a raw non-ASCII name, neither matching a sought name; a
      tree name holding U+2028 or U+0085, which does not split its line; a repeated name; docs or
      tasks missing or not "040000 tree"; the contract missing or "100755 blob" or "120000 blob". With "MARKER" put in
      exit, out, err, error and a tree name, "MARKER" is absent from the repr of every result. The cases are single
      faults, plus one ordering case per sequence of step (2)'s order (exit 1 with an out of type str gives "git: exit
      1"; a tree with a bad line and no docs entry gives "tree: line out of form"). A stand-in records that
      parse_commit is given the commit's original bytes. The result-check faults (a raise, the result's shape,
      error, exit, out not bytes) are tested at every one of the five call positions; the commit's cap, decode and
      form faults at the first; each tree-class fault at each of the three trees; and the blob's cap and decode at
      the fifth (as "bytes"), as parametrised cases (t71e-R2-4, t71g-R1-2).
  - AC3: >-
      The bytes and the parse, steps (3) to (5): 1 MiB + 1 byte (1 MiB exactly passes), invalid UTF-8, a leading
      byte-order mark, a U+FEFF inside a comment line, a carriage return, a NUL, a tab, a form feed, a vertical tab,
      DEL, a C1 control (U+0085 among them), or a U+2028 or U+2029 inside a comment line (t71f-R1-2, R1-3) gives
      "bytes", in step (3)'s order when several fail; a non-ASCII text without controls is not refused by step
      (3); read_contract(root, <HEAD id>, task_id), the real five-call walk, and parse_contract on the same blob
      bytes, give "read" for each of docs/tasks/TASK-061.yaml to TASK-070.yaml as committed at HEAD (t71d-R1-6), read
      through gitread.run (HEAD's id by rev-parse --verify --end-of-options HEAD, then cat-file, so a working tree's
      line endings play no part; t71b-R1-11), in tests/integration/test_task_contract_repo.py, with write_set and
      forbidden equal to
      the lists G0's own rules take from the same bytes (the test's copy of G0's loop, the oracle only for these
      well-formed files); and "parse", each with a fixed test text and the exact finding of step (4)'s table (one
      case per rule of the table at least; a text with two faults gives the first by step (4)'s order: two line
      faults give the earlier line's, a line fault and a field fault give the line fault's; t71e-R1-1, R2-6), for: a
      task line "task:  TASK-071", one with a trailing space and "task: TASK-071 # c" ("parse: task value out of
      form"; t71e-R2-1, R1-5); a missing task or
      base_commit; a short or upper-case base_commit; an empty write_set or forbidden; a repeated top-level key (a
      second write_set or forbidden), a repeated task, base_commit or paths; a top-level line of another form; a value
      on the write_set, forbidden or paths line; a bare "-" line; an item at indent 4 before paths, at indent 3 or 6 in
      write_set, or at indent 4 in forbidden; another key under write_set; a key line in forbidden; an item line "- "
      with an empty item; "-x"; a second "paths:" with a value ("parse: write_set line out of form"), a second exact
      "  paths:" ("parse: repeated key"), a second "  base_commit:x" ("parse: base_commit line out of form"), an
      empty item "  - " in forbidden ("parse: forbidden line out of form"), "task:" with no value ("parse: task
      missing"), "task: " with an empty value (the same; t71g-R1-3, R2-6), "task:  " with a whitespace-only value
      ("parse: task value out of form"), "  base_commit:" and
      "  base_commit: " with no value ("parse: base_commit missing"), and "  base_commit:   " with a whitespace-only
