# Stated outcomes and limits:
# - the reader reads the committed object store only, never the working tree; a commit that does not exist, a shallow
#   or partial clone without the objects, or a repository of another hash form gives "unreadable";
# - the commit argument is not proven to be a commit object (t71a-R1-6): only "cat-file -p" is used, and any object
#   whose text parse_commit accepts is followed; the trees and the blob reached are form-checked; no sixth call;
# - parse_contract is stricter than G0 in the refusals of step (4) (the top-level form, repeated keys, every
#   unrecognised line inside write_set and forbidden, a bare "-", the item charset, a leading "/" or a ".." segment,
#   a task other than task_id) and step (3) (a U+FEFF anywhere, a carriage return, NUL, tab and the other C0
#   controls, DEL, the C1 controls, U+2028 and U+2029; so a committed CRLF contract that G0 accepts is refused;
#   t71e-R2-8, t71f-R1-2, R1-3): a
#   contract G0 accepts can be "unreadable" here, which fails closed; G0 itself drops such lines silently (t71a-R1-1,
#   R2-2), which H2a does not change;
# - a base commit with an "encoding" header and a non-UTF-8 message is "git: commit text not UTF-8" although its tree
#   is fine: an availability limit H2b must expect (t71e-R1-6);
# - contracts before TASK-061 were not scanned (D-1587 C4 scanned TASK-061 to TASK-070 only): an older contract may be
#   "unreadable" under the strict rules, and for H2b that is an expected STOP, not a bug (t71d-R1-5);
# - the workflow holds two copies of G0's parse_contract (:162-191 and :583-612); a test asserts both are equal and
#   hold the rule lines, comparing dedented text, never line numbers; a workflow change to parse_contract (the
#   owner's, A66/A67) needs a paired change of that test (t71d-R1-3, R2-6);
# - G0's layout rules are copied, not shared: the workflow's parse_contract and parse_contract here could drift apart;
#   a test reads the workflow text and checks that its rule lines are present, but does not run them;
# - the commit and tree texts and the contract are capped at 1 MiB only after run has returned the whole output
#   (gitread caps nothing);
# - the 1 MiB cap on each tree text bounds a tree at roughly 15,000 entries (about 70 bytes per entry line): a root
#   tree or docs/tasks folder larger than that makes every read "tree: tree text over the cap", an availability limit,
#   fail closed (t71e-R1-7);
# - up to five git processes of up to 10 seconds each per call: H2b's hook calls may wait up to about 50 seconds
