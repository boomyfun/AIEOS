# Task contract TASK-026, recovery at start (Master Plan revision 3, §4 M4; specification 1 sections 5.1, 7 and 8;
# specification 2 sections 6.1, 6.3 and 6.6; DEF-0030, the core's caller). Revision 0, drafted under decisions D-605
# (Q2, C2) and D-616 (C3), brought for approval in its own request; whether it is approved is recorded in the decision
# files, not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-028.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: one module, src/aieos_bootstrap/startup.py, the third piece of the core's
# caller (DEF-0030; decision D-591 Q4): one function, recover, that runs specification 1 section 7 at start, before any
# new event: it walks the commits reachable from HEAD through the Git reader (TASK-024), reads the event log and the
# held leases through the single writer (TASK-016), lets recovery.reconcile (TASK-009) decide every event, appends
# those events through the writer one by one, releases by token the lease of each compensating submission (TASK-028),
# and then expires the leases whose expiry has passed. And one small function in the writer, read_log(root), so that
# the log's bytes are read by the only module that opens the project-state directory (INV-004) and not by this one.
# The walk and its bound (decision D-605, option (a)): the whole history reachable from HEAD, every parent of every
# commit, each commit read once with "cat-file -p" and parsed by gitread.parse_commit, up to a maximum number of
# commits (default 10000, a parameter); above it, or on any read that fails, the whole recovery is refused and nothing
# is appended, released or expired (fail closed). Commits are given to reconcile parents before children.
# The trailer-body rule (DEF-0030, decision D-584 F6): a commit whose message has fewer than two paragraphs is not
# given to reconcile, since git would not read its last paragraph as a trailer block; when the trailers of such a
# message give a task or any finding, the commit is named in a finding (it stands in Git; nothing is appended for it).
# The release (decisions D-605 C2 and D-617 M1): after the appends, every held lease whose task and token equal those
# of a task.submitted event in the log (compensating or not, appended in this run or an earlier one, or by submit) is
# released by its token through writer.release_lease_token (TASK-028), since specification 1 section 5.1 releases the
# lease on task.submitted and a lease left held would let submit append a second submission; so a run, or a submit,
# that stopped between its append and its release is completed by the next start.
# Partial appends (decision D-605 C2): the events are appended one at a time; a run that stops between two appends
# leaves the first appended, and the next run completes the rest, since reconcile builds the same events with the same
# event_ids and the log ignores an event_id it already holds (specification 1 section 7 step 4, concept line 856).
# What it does not do: no evaluation path (TASK-027), no grant of a lease, no store creation (it never calls
# open_store, grant_lease, start_session or end_session; DEF-0041 (c), never giving an earlier store's epoch to a
# recreated store, does not apply), no projection of task state, no check of a commit's changed paths, no Git write of
# any kind, no process except through gitread.run, no file opened except through the writer's functions, no clock read,
# nothing under .github/ and no workflow change (the writer's paths are covered by the workflow's revision-7
# allowances; startup.py and its tests need none, as submit.py needed none), no policy, no frozen fixture. It changes
# no other module of src/ apart from the package's docstring and __all__ and the one writer function.
# The trusted PATH (DEF-0052 G1) is the caller's precondition: gitread refuses an empty or relative entry, and an
# absolute entry is trusted as given.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain startup; writer.py is imported by submit,
# startup and the writer's tests. No module of the repository calls recover yet.
# Risk: high, and change class critical_cr, each computed over the base by script (risk_class26.py and gov003_class26.py
# of the drafting session). Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture
# [deterministic_rule], functional [integration_test], security [static_security_analysis] and architecture
# [ai_review (cross-model)], plus the evidence_required of the applicable articles.
# Reviews (as TASK-025's and TASK-028's): five way-2 reviews by a Claude model other than the implementer's, and the
# decision agent's three, each brief naming for testing: the walk's bound and order and that any read failure refuses
# the whole recovery; the body rule; that every event is reconcile's and goes through the writer with reconcile's own
# event_id, payload and token; the equality of the log after the appends with reconcile's log; the release by token
# of every held lease a logged task.submitted names, and only of those (the release on a rerun, decision D-617 M1);
# expiry only after a complete replay; the partial-append rerun; the
# result form and that no exception escapes; the injected defaults; the limits of AC13.
# Naming: every test this task adds names the AC ids it stands for as "TASK-026 ACn" in its own docstring, following
# DEF-0049's convention.
# Evaluation path (A61; as TASK-007 to TASK-028): commit C changes only docs/tasks/TASK-026.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-026", go to task/TASK-026 under their own
# decisions; main receives the task only at its acceptance. The task push's CI base run is a RISK-01 conformance run
# over the set file of DM F35, reported advisory, never MEASURED.
# Not applicable: OPS-001 (the task changes no ref; gitread runs only read-only subcommands); INV-005 to INV-008,
# INV-010 and INV-011 (the decision engine, the governor, evidence records other than recovery's observations, the
# replay and the policy meet no path of the write-set); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the
# bound artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the
# write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (CR-002 part 4 limit 8 does not apply),
# so its acceptance is one delegated approval of the decision agent (Master Plan section 6), for the decision agent's
# ruling.
task: TASK-026
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/startup.py, recovery at start (specification 1 section 7;
  DEF-0030): recover(root, repo, recorder, now) walks every commit reachable from HEAD through gitread.run within a
  bound, leaves out commits with no message body, reads the event log and the held leases through the writer, lets
  recovery.reconcile decide every event, appends those events one by one through writer.append_event, releases by
  token the lease of each compensating submission through writer.release_lease_token, and then expires the leases
  whose expiry has passed through writer.expire_leases; any read failure, a walk past the bound or a damaged log
  refuses the whole recovery with nothing appended, released or expired. Add writer.read_log(root), the log's bytes or
  empty bytes when it is absent. With unit tests on injected stand-ins, a read-only integration test walking this
  repository's history, property tests, and a unit test of read_log, each test naming its AC ids as "TASK-026 ACn".
