acceptance_criteria:
  - AC1: >-
      The interface and its arguments. recover(root, repo, recorder, now, head=None, max_commits=10000, read=None,
      read_log=None, append=None, leases=None, release=None, expire=None) takes root and repo, non-empty str values
      that are absolute paths; recorder, a non-empty str; now, a timezone-aware datetime in UTC with whole seconds
      (specification 2 section 6.1), the appended_at of every event and the recovery time; head, None (the walk starts
      at HEAD) or 40 lowercase hexadecimal characters (reading: for tests and for a caller that has already resolved
      HEAD); max_commits, an int that is not a bool, from 1 to 100000. Any other value gives the result of AC10 with
      result "refused", reason "argument" and a finding naming the argument, before read is called (fail closed).
  - AC2: >-
      The walk. When head is None, read is called exactly as read(repo, ["rev-parse", "--verify", "--end-of-options",
      "HEAD"]), and its result must have error None, exit 0 and out a 40-hex id followed by one LF. Then, starting
      from that id (or head), each commit is read once as read(repo, ["cat-file", "-p", id]); the result must have
      error None and exit 0, and gitread.parse_commit of its out must give error None; every parent of every commit
      is followed, each id at most once. Any other result (a refused form or PATH, a timeout, a git that cannot be
      started, a non-zero exit, an object that is not a commit, bytes out of form) gives "refused", reason "git", a
      finding naming the call and its error or exit, and nothing appended, released or expired. More than max_commits
      distinct commits gives "refused", reason "bound", and nothing read further, appended, released or expired.
  - AC3: >-
      The order and the body rule. The commits are given to reconcile as {commit, message} mappings, parents before
      children (a post-order of the walk that visits a commit's parents in the order its header lists them; for a
      line of history, oldest first). A commit whose message has fewer than two paragraphs, split as
      recovery.trailers splits them, is not given; when recovery.trailers of its message gives a task or any finding
      (a misspelled or mis-cased AIEOS-Task or AIEOS-Fence line among them; decision D-617 M3), the result's left_out
      lists its id and a finding names it (DEF-0030, decision D-584 F6); nothing is appended for it.
  - AC4: >-
      Reconcile. The log is read_log(root) and the leases are leases(root), each read once, after the walk and before
      reconcile; recovery.reconcile(log, commits, leases, now, recorder) is called exactly once. When its findings
      name a damaged log (a finding that begins "log: "), the result is "refused", reason "log", with those findings,
      and nothing is appended, released or expired. Its other findings (step 2's, the commits' trailer findings, an
      append it could not build) are copied into the result's findings.
  - AC5: >-
      The appends through the writer (INV-004). For each event reconcile returns with result "appended", in its order,
      the line reconcile appended for it is taken from its log after the given bytes, and append(root, type, payload,
      event_id, now, recorder, task_id=task_id, fencing_token=<the line's fencing_token, or None>) is called exactly
      once, with the line's own type, payload, event_id, task_id and token; no other event is appended and no line is
      built here. Each call must give "appended", or "duplicate" for an event a stopped earlier run already appended;
      any other result or an exception stops the appends there and gives result "partial", reason "store", with a
      finding naming the event, and nothing further is released or expired. After all appends, read_log(root) is read
      once more; when it differs from reconcile's log, a finding says so (no repair) and the result is "partial".
  - AC6: >-
      The release by token (decisions D-605 C2 and D-617 M1; TASK-028). After the appends, for each lease read in AC4
      whose task and token equal those of a task.submitted event in the log after the appends (compensating or not,
      appended in this run or earlier), release(root, task_id, token) is called once with that task and token; a
      result whose result is the exact str "done" adds its value to released; any other result, a result that cannot
      be read, or an exception adds a finding naming the task, and the recovery goes on (the lease then expires by its
      own expiry). release is called for nothing else.
  - AC7: >-
      Step 5 after step 1 (specification 1 section 7). Only when every append gave "appended" or "duplicate" and the
      log equality of AC5 holds, expire(root, now) is called once, and its returned leases are the result's expired;
      an exception gives result "partial", reason "store", and a finding. The result is then "recovered".
  - AC8: >-
      Reruns and partial appends (decisions D-605 C2 and D-617 M1, M2). A second recover over the same repository, log
      and store appends nothing new: reconcile builds no event for a commit a task.submitted names, and an
      observation's event_id is derived from its commit, so reconcile gives it as a duplicate and append is not called
      for it. A run that stopped after k of n appends is completed by the next run, which appends the remaining n - k
      and appends nothing it did not need; a run that stopped after a compensating append and before its release is
      completed by the next run, which releases that lease by its token (AC6) (tests with a stand-in writer that
      keeps a log and the leases, stopped after one append, and stopped before a release).
  - AC9: >-
      The injected functions. read, read_log, append, leases, release and expire, when None, are gitread.run,
      writer.read_log, writer.append_event, writer.held_leases, writer.release_lease_token and writer.expire_leases,
      resolved at call time; tests pass stand-ins; a test pins the six defaults (by replacing the module attributes for
      the duration of the test and restoring them).
  - AC10: >-
      The result. recover returns a mapping with exactly the keys result ("recovered", "partial" or "refused"),
      reason (None, or one of argument, git, bound, log, store), findings (a list of str), appended (the event_ids
      append gave "appended" or "duplicate" for, in order), released (the leases released), expired (the leases
      expired) and left_out (the commit ids of AC3). An exception raised by any injected function, or by reading the
      objects they return, is caught and becomes a result with a finding naming its type; none escapes recover.
  - AC11: >-
      writer.read_log(root). One function added to src/aieos_bootstrap/writer.py after log_path: it checks root as the
      writer's other functions do and returns the bytes of log_path(root), or b"" when the file does not exist; it
      creates and writes nothing. Every other writer function, query, constant and the schema are unchanged; the
      module docstring gains one sentence naming it. A unit test in tests/unit/test_writer.py covers an absent log
      (b"", nothing created) and a log with lines (its bytes).
  - AC12: >-
      Purity apart from the calls (INV-001, INV-004). startup.py imports only the Python 3 standard library and
      aieos_bootstrap's gitread, recovery and writer; it opens, writes and removes no file itself, starts no process
      except through read, reads no clock and no environment variable, calls of the writer only read_log,
      append_event, held_leases, release_lease_token and expire_leases (through the injected names), and no
      open_store, grant_lease, start_session, end_session or release_lease, and builds no event-log line itself. No
      exec, eval, compile, __import__ or importlib; no assert in src; no string that names the project-state
      directory; deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit report no finding at the task's commits, on
      the base with the workflow's revision 8, with no change under .github/.
  - AC13: >-
      Limits, stated in the module's docstring: the PATH git is found by is the caller's precondition (DEF-0052 G1);
      the tests use stand-ins for the writer except read_log's own unit test, so the real store's path is covered by
      the writer's tests and not end to end with recover; v0.1 runs one task at a time and recovery runs at start,
      before any new event, so nothing else writes the log or the store while it runs; the walk reads every reachable
      commit each time (cost grows with the history; the bound refuses past it); a commit left out by the body rule
      stands in Git with no observation; the release and the expiry are separate calls after the appends, so a stop
      between them is completed by the next run, which releases by token every held lease whose task and token a
      logged task.submitted names (AC6), or by the lease's own expiry; whether an unfenced write blocks the
      task's acceptance stays open (specification 2 section 10 point 7). Every existing module and test not in the
      write set is unchanged, and if one can pass only by a change the task escalates (needs_out_of_scope_change).
  - AC14: >-
      This repository's history, read only. tests/integration/test_startup_repo.py finds the repository root from its
      own path (pathlib, two parents up) and calls recover with the real gitread.run and stand-ins for read_log
      (b""), leases ([]), append (records its calls, gives "appended"), release and expire (record their calls): the
      walk reaches a commit with no parent; for commit 057cc530e8fa39814eed4431c4de0fd9887014cf (a commit of main
      whose last paragraph holds "AIEOS-Task: TASK-024" and no AIEOS-Fence) append is called once with a record.added
      event whose payload's evidence_type is "unfenced_write" and refers_to is that commit; no task.submitted is
      appended (no lease is held), release is not called, expire is called once. root is a path that is never written.
  - AC15: >-
      Tests, each rule with at least one passing and one failing case, and the added text. R1 AC1 (each argument wrong
      in turn, read not called); R2 AC2 (a linear history, a merge with two parents, a commit reached twice, each
      failing read result, the bound reached; nothing appended on a failure); R3 AC3 (the order; a one-paragraph
      message with an AIEOS-Task left out with a finding; one without, left out with none); R4 AC4 (a damaged log
      refused with nothing appended); R5 AC5 (the exact append calls from reconcile's lines; a refused append stops
      the rest; the log equality finding); R6 AC6 (a compensating submission released by its token; a held lease
      whose task and token an earlier logged task.submitted names released; a held lease of another token, or of a
      task no task.submitted names, not released; a refused or raising release gives a finding and the recovery goes
      on; no release for an observation); R7 AC7 (expire once, only after a complete replay); R8 AC8 (a rerun appends
      nothing new; a run stopped after one append completed by the next; a run stopped before a release completed by
      the next, which releases by token); R9 AC9 (the six defaults pinned); R10 AC10 (the result keys; exceptions from each injected function);
      R11 AC11 (read_log); R12 AC12 (a script check of the module's imports and of the absence of process, file,
      clock, environment and store-changing calls); R13 AC14 (the integration test). Unit tests in
      tests/unit/test_startup.py and, for read_log, tests/unit/test_writer.py; AC14 in
      tests/integration/test_startup_repo.py; property tests in tests/property/test_startup_properties.py (standard
      library only, fixed seeds): random histories as parent graphs always give parents before children and each
      commit once; random read failures never reach append. Every test this task adds names the AC ids it stands for
      as "TASK-026 ACn" in its own docstring; before each commit, the added text is scanned with the workflow's
      SEC-001, SEC-002 and OPS-003 patterns, and each count is 0. tests/run_tests.py, unchanged, runs all groups.
