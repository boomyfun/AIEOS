acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only the ten files of the write set (three modules under src/aieos_bootstrap/ and
      seven test modules). No module changes behaviour except as AC2, AC3 (c) and (d), AC4 and AC5 say. Existing tests pass
      unchanged except the altered cases AC8 predicts; other assertions are only added to or made stricter. No test
      writes a file, starts a process or imports a module that the workflow's deterministic_rule step refuses; no exec,
      eval, compile, __import__ or importlib is used; the only imports added are of the own package or of a standard
      library module that the same test folder's modules already import. No public name is added to or removed from a
      module under src/. New tests and docstrings keep the existing pins of their modules (among them: in
      test_launcher_outside.py only the literal 'C:/outside-root-92' as a C:/ constant, exactly six functions named
      end_outside or _outside*, and "TASK-092 AC" in every test docstring; in test_cli_run.py its C:/ pin, "TASK-098 AC"
      in every test docstring and no project-state directory name in the strings of run_task and the _run names; in
      test_cli_import.py its C:/ pin and "TASK-097 AC"; in test_claude_code.py "TASK-061 AC" in every test docstring and
      no '.aieos' in claude_code.py's source).
  - AC2: >-
      DEF-0104 (src/aieos_bootstrap/launcher.py :918-:922, :942-:951 and :954-:1034). F1: when a raise happens after step "end" has
      been entered, whether in end_session or after its return (reading its answer, building the store finding, reading
      the released leases), the result is "refused" with reason "end" and its last finding ends "; the session may be
      ended", the fallback of the outer except included. F2: _outside_store's own finding quotes nothing the callee
      gave: it is exactly "<head><name> did not give done"; the callee's own str findings follow unchanged. Those
      callee findings remain callee text and may hold what the callee gave, the root among it: a limit stated in the
      acceptance, which F2 does not cover. The released task ids: _outside_released also requires each task_id to be
      TASK- followed by digits (the form _outside_rows requires), and otherwise the value is out of form, so that the
      finding "end: <task_id> released with no record ..." (:1024-:1027) can name only such an id. Tests in
      tests/unit/test_launcher_outside.py: a raise after end_session's return (an answer whose attribute access
      raises, and a refused answer whose findings raise) gives the "may be ended" finding; a callee whose result and
      reason hold the root gives no own finding that holds the root; a released lease whose task_id is the root gives
      result "done", released [], the out-of-form finding and no own finding that holds the root. The tests that pin the
      old store finding assert the new one (altered cases). Each new test fails at base_commit.
  - AC3: >-
      DEF-0113 (launcher.py :283-:290, :1768-:1774, :2094-:2108, :2143-:2155; tests/unit/test_cli_import.py :612-:615).
      (a) The docstrings of import_task and run_task say which raise gives which reason as the code does it: a raise
      while a step's variable is unchanged gives that reason (for run_task, "log" for the exists check, the class, the
      intent's id and claim, the dry run of eventlog.append and, with no trace, the kind and its template; "trace" for
      them after a trace was read; for import_task, "exists" for a raise while the template is built). Each sentence is
      checked against the code at the task commit. (b) The broken phrase of test_this_test_file's docstring is
      corrected; no assertion changes. (c) The finding of _run_conflict says "the subject alone can cause this" only
      when the conflicting line's payload holds the same record_id as the new claim; otherwise that clause and its
      semicolon are absent. (d) The finding shows the intent id and the recorder by %r, so a stored value with a line
      feed gives one line. (e) The module docstring's clause is replaced by the cause as the code does it: run_task
      takes the intent id from the first claim of the record_id in the log, and a refused statement appends nothing.
      Tests in tests/unit/test_cli_run.py for (c) (both cases) and (d): the test of (c) without the same record_id and
      the test of (d) fail at base_commit; the test of (c) with the same record_id passes at base_commit and guards the
      kept clause. (a), (b) and (e) are text, checked by the reviews, with no test.
  - AC4: >-
      DEF-0043 (open points (c) and (d); src/aieos_bootstrap/conformance.py :587-:590 and :1066). (c) The reason for a
      raising Risk Engine derivation names the error's type only: "case %d: the derivation raised %s"; a test in
      tests/unit/test_runner_risk.py asserts that a message given to the raised error is not in the reason. (d) The
      Verification fixture checker compares record ids only when they are str (as the Risk checker does at :766-:776),
      so a case record whose record_id is a list gives errors and no exception; a test in tests/unit/test_runner_rc.py
      shows it through conformance.check_fixture. Each test fails at base_commit. Points (a), (b) and (e) of the item
      are not changed here; the acceptance says what closed each. The note of the item's Log of 2026-10-29 on section
      9's row inputs of docs/specs/conformance-files.md (:94, the words of :176) is an open point of DEF-0043 under
      D-7630 R6 (D-7703); AC11 says when the item closes.
  - AC5: >-
      DEF-0029 (D-7630 Q12; R3-1 and R5-4: conformance.py :1560-:1578). The runner loads the Resume Check only when the
      list blocking (:1557, taken before the stand-in governor problem) is empty, that is when no blocking problem
      already means the run cannot count; every scenario keeps its result and reason, the run record
      keeps its keys and values, and only the import is skipped (the problem line of a failed load is then absent). The
      comment at conformance.py :1561-:1562 is made to say that it is loaded only when such a fixture exists and the
      list blocking is empty. A test asserts that, with a blocking problem and a failing Resume Check, Run.problems
      equals base_commit's list without exactly the failed-load line.
      Tests in tests/unit/test_runner_rc.py show, with a blocking problem, that the import is not attempted and that the
      record, the results and the reasons equal those of base_commit's behaviour for a loadable, an absent and a
      failing Resume Check; a test with a stand-in governor (not in blocking) and a loadable Resume Check shows the
      same record, results and reasons as base_commit; without a blocking problem the load is as before (the existing
      tests). R4-6's docstring
      half: the module docstring of tests/property/test_runner_rc_properties.py says that the one-byte property rests
      largely on the stand-in answering by exact inputs. The point on test_each_not_run_rule (the item's Log of
      2026-10-10) is closed by citing two existing tests of tests/unit/test_runner_rc.py,
      test_an_unknown_key_is_the_only_finding (:526) and test_each_not_run_rule (:535): both build the same answer
      (RC-01's first case inputs, stand_in() plus next_task_state 'DONE'), the first shows that this answer has exactly
      the one finding of rule 6.4:unknown_key, so that with the assertion at :557-:558 the subtest's NOT_RUN is tied to
      that finding alone; the review confirms this. At least one new test of this criterion fails at base_commit.
  - AC6: >-
      DEF-0135 (D-7630 Q11). 1: a test in tests/unit/test_claude_code.py gives an MCP_TOOLS name with a wrong argument
      of the judge (its root, task_id or write_set) and asserts the argument refusal, so that moving the MCP branch of claude_code._judge before the argument findings
      fails it (shown by a broken copy run outside the repository). 2: the docstring of claude_code.py says that the
      reads of get_work_order and query are not in the observed read-set, and the docstring word list of
      test_claude_code.py (:351-:358) gains words of that sentence. 3: a test calls mcp_server.handle(line, environ,
      clock) with a tools/list request and compares the names of result.tools, prefixed, with claude_code.MCP_TOOLS (it
      passes at base_commit). 4: the worker's cited
      reading of the import-time code of mcp_server, writer, base_inputs and context_compiler and of the own modules
      they import is recorded in the dated Log line of DEF-0135 and confirmed by the task's review. No statement of
      claude_code.py other than its module docstring changes.
  - AC7: >-
      Errata (D-7623 R1). The acceptance text, committed by the records commit, carries one dated erratum for each
      earlier text this task supersedes, quoting it and stating the correct reading: (a) TASK-092's contract
      (docs/tasks/TASK-092.yaml :63-:68), on a released value out of form and on a raise giving "may be ended": from this
      task on a released task_id not in the TASK- form makes the value out of form, and every raise after step "end" is
      entered gives "may be ended" (the contract does not fix the store finding's words); (b) TASK-104's contract on
      the conflict finding's statement that the subject alone can cause the refusal. Each is checked against the quoted text at base_commit; where a quoted contract does not
      say what this criterion names, the acceptance says so and no erratum is written for it.
  - AC8: >-
      Before the first task commit the worker runs the base tests against the changed modules outside the repository and
      records which fail. The prediction: exactly the four base cases of tests/unit/test_launcher_outside.py that pin
      the old store finding: TASK092AC2Order.test_failed_removal_line,
      TASK092AC3FailingClosed.test_lease_rows_refused, TASK092AC3FailingClosed.test_stored_reads_refused and
      TASK092AC3FailingClosed.test_end_refused. A different failing set is brought to the decision agent before the
      commit.
  - AC9: >-
      Checks. unit_test, integration_test and property_test pass in CI on the task commit; deterministic_rule, OPS-003,
      SEC-001, SEC-002, static_security_analysis and lint report no finding; before each commit the added text is scanned
      with the workflow's SEC-001, SEC-002 and OPS-003 patterns and each count is 0.
  - AC10: >-
      GOV-003 (a stated departure for this task, DEF-0107's form; DEF-0110 gives these paths no other policy yet): every
      changed path is an evaluator path, the conformance runner among them. The acceptance text states the departure,
      gives the base-tests step's printed line with every failing name, and a review of the diff by a model other than
      the implementer's. The push of main changes the runner: its head commit has exactly one AIEOS-Task trailer line,
      and the main run's conformance base run is read. The pushes are the worker's route under their own decisions,
      outside the task's capabilities.
  - AC11: >-
      Records, in the records commit (made by the worker under its own decision, no AIEOS-Task trailer, pushed only after
      the task commits are on main; not a task commit; its paths are under docs/runs, docs/Deferred, docs/records and
      docs/History): a dated line on each of the five items saying point by point what closed it, with file and line, and
      the state done only where every open point is met (D-7630 R6); a point not met stays open and the item counts
      nothing; DEF-0043 is marked done only if a revision of the section 9 row inputs of conformance-files.md is
      committed by its own decision before the records commit (docs/specs stays forbidden to the task commits), and
      otherwise stays open, counts nothing, and the acceptance says so; DEF-0029's R3-2 and R5-2, which its What
      line gives to TASK-008's and TASK-005b's contracts, are cited as theirs (tests/integration/test_runner_rc_run.py
      :294 and :297); for each other item of the touch list, why it is not done; the counts and accepted limits of master plan
      section 6 point (6); the number of items this task closed as done toward the 36 of point (6) (c), the cumulative
      number of the series, and the re-plan the stop rule of D-7623 C4 and D-7638 requires; a history page.
  - AC12: >-
      Limits. The base-test prediction run, the broken-copy run of AC6 and the added-text scans are the worker's own runs
      outside the task's shell capability. The errata correct readings; they change no accepted task's contract, record
      or commit.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [src/aieos_bootstrap/launcher.py, src/aieos_bootstrap/conformance.py, src/aieos_bootstrap/claude_code.py, tests/unit/test_launcher_outside.py, tests/unit/test_cli_run.py, tests/unit/test_cli_import.py, tests/unit/test_runner_risk.py, tests/unit/test_runner_rc.py, tests/property/test_runner_rc_properties.py, tests/unit/test_claude_code.py]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
# Risk: src/** and tests/**: risk-rules-gov-aieos.md R3, unevaluable and therefore matching src/** and tests/** (:18); R3's
# tags cover the conformance runner (:74); re-checked at the contract commit. The records commit lies outside the task.
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 900k, wall_time: 6h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC8, AC9]}
  - {gate: G3, check: constitution, args: [AC7, AC10, AC11, AC12, INV-001, INV-002, INV-003, INV-004, INV-005, INV-006, INV-007, INV-008, INV-009, INV-010, INV-011, GOV-001, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of risk high is satisfied (an other_model_review and a separate decision_agent_review, both bound to the evaluated commit, the contract and the pins, before any fast-forward of main) AND the task acceptance by the decision agent before any landing step AND the aieos-checks run of the accepted commit succeeds
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
