constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The arguments. reconcile_scope(root, repo, commit, values, recorder, now, read=None, read_log=None, append=None)
      checks every argument before anything is read: root and repo non-empty strings; commit 40 or 64 lowercase hex
      characters; values a mapping with exactly the key contracts, a mapping from task ids ("TASK-" followed by digits)
      to mappings with exactly the keys contract_bytes (bytes) and write_set (a list of strings); recorder a non-empty
      string; now a timezone-aware datetime whose offset is zero. Any other form gives the result of AC9 with result
      "refused", reason "argument" and one finding per wrong argument, and nothing is read or appended. read, read_log
      and append default, at call time, to gitread.run, writer.read_log and writer.append_event (tests pass stand-ins).
  - AC2: >-
      The commit and the order of checks (decision D-713 C1). The commit is read once with read(repo, ["cat-file",
      "-p", commit]) and parsed by gitread.parse_commit; its trailer tasks are the values of its "AIEOS-Task" trailers
      (gitread.parse_commit's trailers), in order; when any such value is not "TASK-" followed by digits, no trailer
      task is passed (so the commit is detected, fail closed) and the uncovered entry {ref the commit, detail "trailer
      out of form"} is added (reading). The parent count is checked first: a commit with other than one
      parent (a merge, L1, or a root commit) gives result "reconciled", no event, no further read, no call of claims,
      and the uncovered entry {ref the commit, detail "not one parent"}. Otherwise the changed paths are read once with
      read(repo, gitread.DIFF_TREE + [commit]) and parsed by gitread.parse_paths; a one-parent commit with no changed
      path gives result "reconciled", no event, no call of claims and the uncovered entry {ref the commit, detail "no
      changed path"}. A read whose result is not of gitread.run's form, whose error is not None or whose exit is not 0,
      and a parse error, give result "refused", reason "git", with a finding naming the read, and no event.
  - AC3: >-
      The base read (decision D-713 P1 and C3; reading B1). For a one-parent commit with changed paths, the files
      docs/specs/risk-rules-gov-aieos.md and .github/workflows/aieos-checks.yml are read at the commit's first parent
      P, never at the commit judged, with the pinned form read(repo, ["cat-file", "-p", id]) only: P is parsed by
      gitread.parse_commit for its tree id; each path element is looked up in the listing of the current tree, parsed
      line by line, each line exactly "<mode> <type> <id>" TAB "<name>" (mode octal digits, type one of blob, tree and
      commit, id 40 or 64 lowercase hex characters, name non-empty without "/" or NUL); a directory element must be a
      tree entry and the last element a blob entry; the blob's bytes must decode as UTF-8. A listing line out of form,
      a missing element, a type other than the one expected, a failed read or a text that does not decode gives result
      "refused", reason "base", a finding naming the file and the cause, and no event.
  - AC4: >-
      The policy's facts (decision D-713 P2; DEF-0060 point 1). The list is scope_drift.non_task_list(policy text) (None
      is passed on). The rules are read from section 3's yaml block (as AC2 of TASK-033 finds it): each entry under
      "risk_rules:" is one line "- match: { paths: [...] }" or "- match: { component_tags: [...] }" followed by one line
      "risk: <class>" (comment lines skipped), and is translated into a mapping with exactly the keys match and class:
      paths gives match the quoted patterns; component_tags gives match ["src/**", "tests/**"] (R3 read by tags as
      every path under src/** and tests/**, TASK-033 AC11); risk gives class. An entry out of this form, an unknown
      match key or an unreadable class is passed on as the mapping {"match": [], "class": null}, which claims (TASK-033
      AC4) reads as a rule out of form, so no path is non-task (fail closed; the run goes on, and a detected commit is a
      claim); a block that cannot be found gives the same single refused rule. The evaluator list is read from the
      workflow's literals "EVALUATOR = [...]" (from a line whose stripped text starts "EVALUATOR = [" to the line that
      closes it with "]"), each item a single-quoted pattern: when there is at least one literal and every literal
      gives the same non-empty list, that list; otherwise (no literal, literals that differ, an unclosed literal or an
      item out of form) the empty list, which claims reads as out of form, so no path is non-task. constitution_path
      is "docs/pre-genesis/constitution.md" and policy_path "docs/specs/risk-rules-gov-aieos.md", fixed in the module.
  - AC5: >-
      The contract (decision D-713 P4; departure D1). When the commit has trailer tasks, the log is read once with
      read_log(root) and checked by records.check_log; a result that is not bytes or a log with findings gives result
      "refused", reason "log", and no event. For each distinct trailer task T, its contract hash is the contract_hash
      of the last task.approved event of T in the log; T's entry in the contracts given to claims is
      values["contracts"][T]["write_set"] only when values["contracts"] has T and the SHA-256 of its contract_bytes
      equals that hash; otherwise T has no entry (no task.approved event, no value given, or a hash that differs), so
      claims names it "no contract" and the commit is detected (fail closed). The write-set list is caller data not
      bound to the bytes, as evaluation's limit (decision D-633 C1). Values for other tasks are not read.
  - AC6: >-
      The call. claims is called once with exactly: the commit, parents 1, the trailer tasks, the changed paths, the
      contracts of AC5, the list, the rules and the evaluator list of AC4, and the two fixed paths. A result whose error
      is not None gives result "refused", reason "scope_drift", a finding holding the error text, and no event (DEF-0060
      point 2: never read as "no claim"). Otherwise detected, exempt and uncovered are taken from claims' result.
  - AC7: >-
      The append (INV-004). The returned event, when there is one, is appended once with append(root,
      "drift.detected", payload, event_id, now, recorder) with no task_id and no fencing token, under claims' event id.
      A result whose result text is "appended" or "duplicate" counts (a rerun with the same facts gives "duplicate");
      any other result text (a conflict included: a rerun with other facts, DEF-0060 point 3), an object without a
      string result, or an exception, gives result "refused", reason "append", with the writer's findings when given.
  - AC8: >-
      The facts used (DEF-0060 point 3). The result's facts is null when the run stops before the base read, and
      otherwise a mapping with exactly the keys commit, parent, policy_blob, workflow_blob, non_task (the list or null),
      rules (the number of rules passed), evaluator (the list passed) and contracts (a mapping from each trailer task
      to the contract_hash matched, or to one of the texts "no task.approved event", "no value given" and "hash
      differs").
  - AC9: >-
      The result. reconcile_scope returns a mapping with exactly the keys result ("reconciled" or "refused"), reason
      (None or one of "argument", "git", "base", "log", "scope_drift", "append"), findings (a list of short English
      texts), appended and duplicate (lists of event ids), detected and exempt (bools), uncovered (a list of mappings
      with exactly the keys ref and detail, sorted, without duplicates) and facts (AC8). No exception escapes; an
      exception raised by a called function becomes a refused result naming the step.
  - AC10: >-
      What it does not do. It closes no claim, classifies and proposes nothing, changes no task state, grants, releases
      or expires no lease, evaluates no task, calls no governor function except through scope_drift, makes no
      constitution or stale-evidence finding and walks no range of commits; its docstring says so, states B1, D1 and L1,
      and names DEF-0030's caller as the one that chooses the commits. No module of src/ changes except __init__.py's
      docstring and __all__.
  - AC11: >-
      Purity and the CI checks (INV-001 to INV-004). The module imports only the Python 3 standard library (datetime,
      hashlib and re among the allowed) and aieos_bootstrap.gitread, records, scope_drift and writer; it starts no
      process except through read, opens no file except through read_log and append, reads no clock and no environment,
      and makes no network or model call; no exec, eval, compile, __import__ or importlib; no assert in src (bandit
      B101); no string that names the project-state directory; it builds no event-log line itself. At the task's
      commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC12: >-
      End to end (integration). tests/integration/test_scope_reconcile_log.py runs reconcile_scope over a stand-in
      repository (commits, trees and blobs answered in gitread.run's result form, holding a policy text in policy v3's
      form and a workflow text with two equal EVALUATOR literals) and an event log kept in memory, read by a stand-in
      read_log and appended by aieos_bootstrap.eventlog.append, with scope_drift as it is: a claim commit gives one
      appended event and a log with records.check_log findings none; a rerun gives "duplicate"; an exempt commit, a task
      commit held by its approved contract and a merge give no event. No git starts and no file is opened in those
      cases. One further case (decision D-714 C1) runs the module's base read with read = gitread.run over this
      repository's own history, at the fixed one-parent commit fc5c4e5ca8bf27e7ce205d633f4bd4d5b7894ef8 of main, whose
      first parent 57bbe3780ef4108c5d3acf39ac184555c689b9aa holds policy v3: the policy and workflow blobs are read and
      decode, the rules number eleven, and the evaluator list equals the workflow's literal at that parent; nothing is
      appended and no file is written (it needs the repository's full history, as TASK-024's integration test does).
  - AC13: >-
      Limits, stated: B1 is a reading; D1 is a departure; L1 (a merge not read against its first parent) is a limit;
      the write-set is caller data bound only by the contract bytes' hash; the rules' translation reads R3 by tags as
      src/** and tests/**; one run at a time (the writer reads the log and appends with no check that it is unchanged);
      the PATH git is found by is the caller's precondition (DEF-0052 G1); the event id depends on the commit only, so a
      rerun with other facts is refused as a conflict. Every existing module and test not in the write set is
      unchanged, and if one can pass only by a change the task escalates (needs_out_of_scope_change).
  - AC14: >-
      Its own tests and the added text. Every test function of the three new test modules names the AC ids it stands
      for as "TASK-034 ACn" in its own docstring and names no other task's AC in qualified form there. The tests write
      and remove no file, and open none except the package's own source files, read for AC15 R10's script checks (as
      TASK-033 reads its AC12). Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and
      OPS-003 patterns, and each count is 0; the file names are scanned with the same patterns and the records
      executors' pre-push pattern (D-282).
  - AC15: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 (each malformed argument; nothing read);
      R2 AC2 (a merge and a root: uncovered, no further read, claims not called; no changed path: uncovered, claims not
      called; each failed read and parse error refused "git"); R3 AC3 (the files read at the first parent, never at
      the commit, shown by a stand-in that answers the commit's tree differently; each fail-closed case: a listing line
      out of form, a missing element, a blob where a tree is expected and a tree where a blob is expected, a failed
      read, bytes that do not decode; the real-Git case of AC12 at fc5c4e5c over this repository's history); R4 AC4
      (the translation of every rule of the policy at the base, R3 by tags; an entry out of form passed on as the
      refused rule and no path non-task; one literal, two equal literals, two that differ, none, an unclosed one, an
      item out of form); R5 AC5 (a matching hash; no task.approved event, no value
      and a hash that differs: "no contract" and detected; the last task.approved counts; a log with findings refused
      "log"); R6 AC6 (claims' error refused "scope_drift", no append); R7 AC7 (appended; duplicate; a conflict, an
      object without a result and an exception refused "append"); R8 AC8 and AC9 (the keys, the facts, the sorting, no
      exception for any input); R9 AC10 and AC11 (a script check of the imports and of the absence of open, write,
      clock and process calls, and of the docstring's B1, D1, L1 and DEF-0030 sentences); R10 AC14 (the naming). Unit
      tests in tests/unit/test_scope_reconcile.py; AC12 in tests/integration/test_scope_reconcile_log.py; property
      tests in tests/property/test_scope_reconcile_properties.py (standard library only, fixed seeds): for random
      well-formed stand-in repositories and logs, the result equals what claims gives on the facts read (the event
      appended exactly when claims returns one), the files are read only at the first parent, and a second run appends
      nothing new. tests/run_tests.py, unchanged, runs all groups.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9, AC12, AC15]}
  - {gate: G3, check: constitution, args: [AC10, AC11, AC13, AC14, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
