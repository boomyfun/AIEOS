# Task contract TASK-034, the scope-drift caller (Master Plan revision 3, §4 M4; specification 4 revision 3, section 7
# items 2 and 4; the risk rules' revision 4, policy version v3, section 2 point 7; concept lines 745 and 948).
# Revision 0, drafted under decisions D-711 (Q3) and D-713 (P1 to P5, C1 to C4), from the scope note approved by
# decision D-713; brought for approval in its own request; whether it is approved is recorded in the decision files,
# not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-033.
# Readings marked "(reading)" or "(proposed)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: one module, src/aieos_bootstrap/scope_reconcile.py, the core's caller of
# scope_drift.claims (TASK-033, accepted, decision D-708). Its function reconcile_scope runs for one base commit: it
# reads the commit's parents, AIEOS-Task trailers and changed paths from Git through gitread's pinned forms; reads the
# policy (docs/specs/risk-rules-gov-aieos.md) and the CI workflow's EVALUATOR list (.github/workflows/aieos-checks.yml)
# at the commit's first parent by a walk of Git trees with the pinned "cat-file -p <id>" form only, never from the
# commit judged; translates the policy's rules into the governor's form {match, class}; checks the trailer task's
# contract bytes against the contract_hash of the task's last task.approved event in the log (read through the
# writer); calls scope_drift.claims once; and appends the drift.detected event it returns through the core's single
# writer (TASK-016), naming the facts the run used. It is the scope-drift half of DEF-0030's reconciliation line;
# reconcile.py (TASK-031, the constitution and stale-evidence half) is not changed.
# The specification's text (spec 4 line 81): "**Scope drift:** the concept's "Commit sửa file không thuộc task nào"
# [...] So (proposed): a base commit with no `AIEOS-Task` trailer, or with a trailer whose contract (the version the
# task's lease named) does not hold a changed path, is detected. A detected commit is not a claim when all its changed
# paths lie in a list of non-task paths that the approved policy at the base names; never by its message or trailer
# alone. A commit that touches the constitution, the policy, the evaluator paths or `.github/` is always a claim. Every
# other detected commit is a `drift.detected` claim, which changes no state [...] and is closed by an authority record
# [...]. A merge commit is read by its changes against its first parent, as specification 3 reads commits." Line 83
# (item 4): "All three are pure computations; their events are appended only through the single writer (INV-004)." The
# policy (line 18): "Rules are read from the base or a pinned ref, never from the change they classify".
# Reading B1 (proposed; decision D-713 P1): "the base" at which the policy and the evaluator list are read, for one base
# commit, is that commit's first parent, read from Git by the tree walk.
# Departure D1, stated (decision D-713 C2): the contract version used is the one the task's last task.approved event in
# the log names (its contract_hash), not "the version the task's lease named" (spec 4 line 81): no lease event of
# specification 2 carries a contract hash. The facts record names the hash used.
# Limit L1, stated (decision D-713 P3): a merge commit is not read against its first parent (gitread pins no diff form
# for it); it is named uncovered, with no event (DEF-0058's and DEF-0060's merge limit).
# What it does not do: no closing of a claim (an authority's record), no classification or proposal, no task state, no
# lease, no evaluation, no governor call except through scope_drift (governor.matches), no constitution or stale
# finding, no walk over a range of commits (one commit per call; the range is DEF-0030's caller's, decision D-713 P5),
# nothing under .github/, no policy change, no frozen fixture. It changes no scope_drift, reconcile, gitread, writer,
# records, eventlog, governor or other existing module.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain scope_reconcile; it must not name the
# Resume Check fixture folder (TASK-010's assertion) nor the Risk Engine fixture folder (TASK-020's allow list). No
# module of the repository calls scope_reconcile yet.
# Risk: high, and change class critical_cr, each computed over the base by script, as for TASK-031 and TASK-033.
# Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule],
# functional [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus
# the evidence_required of the applicable articles.
# Review points (for the five way-2 reviews and the decision agent's three): the order of checks (AC2, decision D-713
# C1); the tree walk and its fail-closed cases (AC3, C3); the rule translation and the evaluator literals (AC4); the
# contract hash check (AC5) and D1; claims' error as a stop (AC6); the append and a rerun (AC7); the facts record
# (AC8); purity (gitread and the writer only); AC13's limits.
# Naming (D-544 Q3, as TASK-023 to TASK-033): every test of the three new test modules names the AC ids it stands for
# as "TASK-034 ACn" in its own docstring.
# Evaluation path (A61; as TASK-007 to TASK-033): commit C changes only docs/tasks/TASK-034.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-034", go to task/TASK-034 under their own
# decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the
# governor, evidence records as stored, the replay and the policy meet no path of the write-set: the module reads the
# policy and changes none); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the bound artifacts, the decision
# matrix, the records and pre-genesis documents, and .github/, meet no path of the write-set; the workflow is read, not
# changed). INV-004 applies: the module appends only through writer.append_event.
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (it records claims and blocks no task;
# CR-002 part 4 limit 8 does not apply), so its acceptance is one delegated approval of the decision agent (Master Plan
# section 6), for the decision agent's ruling.
task: TASK-034
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/scope_reconcile.py, the core's caller of
  scope_drift.claims (specification 4 section 7 items 2 and 4): reconcile_scope(root, repo, commit, values, recorder,
  now) reads one base commit's parents, trailers and changed paths from Git through gitread, reads the policy and the
  CI workflow's EVALUATOR list at the commit's first parent by a tree walk with the pinned cat-file form, translates the
  policy's rules into the governor's form, checks the trailer task's contract bytes against the log's last task.approved
  contract_hash, calls scope_drift.claims once, appends the returned drift.detected event through writer.append_event,
  and returns what it appended, what it could not check and the facts it used; any malformed argument, failed read or
  claims error is a refusal with no event (fail closed). With unit, integration and property tests in new test modules,
  each test naming its AC ids as "TASK-034 ACn" in its own docstring.
