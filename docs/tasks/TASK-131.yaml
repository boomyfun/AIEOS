objective: >-
  (A) In src/aieos_bootstrap/reconcile.py add the public function accepts(record), which is true for a decision.acceptance payload exactly when its decision is ACCEPT, or its decision is NEEDS_REVIEW and its next_task_state is ACCEPTED and its approval_record is a non-empty string; and make _done_tasks (reconcile.py:199-220) use it in place of the test record.get('decision') != 'ACCEPT' (line 214); the other two gaps (record absent; no evaluated_commit) and every uncovered detail text stay as they are. (C) Add a new module src/aieos_bootstrap/done.py with the function done(root, task_id, event_id, recorder, now, read_log=None, append=None), which appends one task.done event {decision_record: the record_id of the task's last decision.acceptance} through writer.append_event, with task_id and no fencing token, only when the task's state in the log is ACCEPTED and that last decision.acceptance satisfies reconcile.accepts and carries a commit-form evaluated_commit; it refuses otherwise, and it gives the result duplicate (nothing appended) when the state is DONE and the task's last task.done already names that record. Tests: new cases in tests/unit/test_reconcile.py and a new file tests/unit/test_done.py, including one composed chain of the existing functions (governor.evaluate with an approval record, then done, then execution.task_states, then reconcile._done_tasks) built from stand-ins and values, with no git and no file.
