# Task contract TASK-131 (DRAFT r1 for the decision agent's reading; DEF-0119 options A + C, one separate fix task; session 7d0b3852, 2026-11-12). Drafted in the scratchpad; whether this text is approved is recorded only in the decision agent's decision that approves it. The number 131 is proposed because TASK-130 is the informal label of the records-route tool (README of C:\Users\Admin\AIEOS-REG0-lite\records-route, decisions D-5824 to D-5842), which has no contract file.
# Why: at the self-build's autonomy level L1 the governor never gives the decision ACCEPT (governor.py:474-475; LEVEL_AT_LEAST_L2 False at :55); a re-evaluation that finds an approval record that counts keeps the decision NEEDS_REVIEW and sets next_task_state ACCEPTED with approval_record set (governor.py:476-482, :497). reconcile accepts a DONE task's commit only from a decision.acceptance record whose decision is ACCEPT (reconcile.py:214-215), and no function in src writes task.done (DEF-0119:11). So no task accepted at L1 is covered by reconciliation and the metrics report counts no done task (metrics_report.py:361, :379). Rulings: option A (reconcile) and option C (a task.done writer) are the decision agent's (group A, decisions D-5847 and D-5848); option B (a new governor decision value) is the owner's and is not part of this task; the order is prerequisite 5 (this task) before prerequisite 6 (the runtime starter a2), D-5854.
# Not in this task: governor.py, evaluation.py, records.py (the forms), execution.py, metrics_report.py, writer.py, cli.py, launcher.py and every specification or governance text; a CLI command or a launcher call for the writer; the check that the accepted commit is on main before task.done (reconcile's walk does it); any change to who may approve; the autonomy level; option B.
# Risk, change class: high (R3 matches every path under src/** and tests/** until an architecture names the components, risk-rules-gov-aieos.md:18; reconcile.py is the reconciliation caller, not a governor file); not critical: no governor, secrets or CI change and no spec text; the change class is critical_cr because the CI's EVALUATOR list holds src/aieos_bootstrap/** and the tests folders, as for TASK-125 to TASK-129.
