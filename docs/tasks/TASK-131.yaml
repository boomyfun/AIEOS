acceptance_criteria:
  - AC1: >-
      Part A, reconcile. reconcile.accepts(record) is public, pure and total on a mapping: it returns True exactly in these two cases and False in every other case, including a missing or non-string field: (1) record['decision'] == 'ACCEPT'; (2) record['decision'] == 'NEEDS_REVIEW' and record['next_task_state'] == 'ACCEPTED' and record['approval_record'] is a str with at least one non-space character. _done_tasks keeps its other two gaps (the decision record not in the log; no commit-form evaluated_commit) and every detail text it has at the base commit, and uses accepts() in place of line 214's test; the module docstring (lines 8-12) names the new case. No other line of reconcile.py changes (the diff is brought at acceptance). The tests of AC3 pin each of: ACCEPT counts; NEEDS_REVIEW with ACCEPTED and an approval record counts; NEEDS_REVIEW with IN_REVIEW, with no approval_record, with an empty or non-string approval_record does not count; INSUFFICIENT_EVIDENCE, NEEDS_REWORK and REJECT do not count, even with next_task_state ACCEPTED or an approval_record present.
  - AC2: >-
      Part C, the task.done writer. done(root, task_id, event_id, recorder, now, read_log=None, append=None) checks every argument before anything is read (a wrong one gives a refusal result and appends nothing); reads the log once through read_log (default writer.read_log, bound at call time) and checks it with records.check_log (a finding gives a refusal result); takes the task's state from execution.task_states (a state other than ACCEPTED, or a state None, gives a refusal result; a DONE state whose last task.done names the record that this function would name gives the result duplicate and appends nothing); takes the task's last decision.acceptance event and requires accepts() on its payload, a commit-form evaluated_commit and a non-empty record_id (otherwise a refusal result); appends exactly one task.done event with payload {decision_record: record_id}, task_id set, no fencing token, through append (default writer.append_event). The result is a mapping with exactly the keys result ('done', 'duplicate' or 'refused'), reason, findings and appended; an exception from read_log or append is caught and becomes a refusal result. The module reads no clock, no environment variable and no file itself, starts no process, builds no log line itself, grants no lease and creates no store.
  - AC3: >-
      The tests. tests/unit/test_reconcile.py gains the cases of AC1 and keeps every existing test unchanged (an existing test that fails on the new rule is a finding that stops the task: it comes to the decision agent, and no existing assertion is edited to fit); tests/unit/test_done.py is new and covers: each argument refusal before any read; a log with a finding; a task in each state other than ACCEPTED (DRAFT, READY, IN_PROGRESS, VERIFYING, IN_REVIEW, REWORK, ESCALATED, REJECTED, STALE, BLOCKED, DONE with another record) refused with nothing appended; ACCEPTED with ACCEPT and with NEEDS_REVIEW plus an approval record done with one append of the exact payload; ACCEPTED whose last decision.acceptance does not satisfy accepts() refused; the duplicate case; a stand-in append that raises or refuses; the defaults bound at call time. One composed chain: governor.evaluate at a re-evaluation (task_state IN_REVIEW) with an approval record that counts gives decision NEEDS_REVIEW, next_task_state ACCEPTED and approval_record set; that record is added to a stand-in log as a decision.acceptance (and the approval flows, as the existing execution tests build them); done appends task.done; execution.task_states gives DONE; reconcile._done_tasks maps the task to the record's evaluated_commit. No test runs git init or a subprocess, writes a file or touches this repository's real state.
  - AC4: >-
      Limit 8 and limit 5 of CR-002 part 4 (docs/pre-genesis/CR-002-concept-errata.md:61 and :64), stated and shown. Limit 8: this task weakens no evidence requirement. The governor's gates, evidence profiles, independence rule and approval rule (governor.py:373-402, :426-431, :474-482) are not touched; no kind of review or record counts as acceptance evidence where it did not count before: option A only lets reconciliation read, for coverage, a record that the governor itself wrote after an approval record counted, and a record without such an approval still does not count; option C only writes a state transition that an accepting record already decided and refuses every state and record that the projection or accepts() would not treat as accepted. The acceptance names, with the diff, the line of each file that decides this. Limit 5: no act that DM A51 item (4) keeps for the owner: no runtime is launched, no visibility change or publication, no measurement protocol, no concept erratum, no change to the autonomy level or to who may approve. If a reviewer shows that a form counts that did not require an approval record, or that done appends for a state that is not ACCEPTED, the contract comes back to the decision agent.
  - AC5: >-
      Purity and the suite (INV-001, INV-002, INV-004). done.py imports only from the standard library modules already used by submit.py and execution.py, aieos_bootstrap.writer, aieos_bootstrap.records, aieos_bootstrap.execution and aieos_bootstrap.reconcile; no process form, clock read or file access in src; the single writer stays the only code that builds log lines (INV-004); the new text uses none of the words MEASURED, ENFORCED and GUARANTEED and no string constant in a changed src file is exactly "valid", "accepted" or "approved"; the whole suite passes locally (`timeout 110 python tests/run_tests.py < /dev/null`, in slices if it does not finish) and on the CI, and pyflakes (the CI's pinned lint step) is silent on src and tests. The raw output of the full unit suite and of pyflakes is brought unedited. The first run is on the task branch.
  - AC6: >-
      Class, evidence and the departures. The risk class is high; the evidence profile is that of assurance-model section 5 for high, as for TASK-125 to TASK-129 (unit_test, integration_test, deterministic_rule, static_security_analysis, ai_review by a pair of reviews on Haiku 5.5, labelled same-vendor and not cross-model, with the profile's ai_review (cross-model) entry met or stated as a departure at acceptance as for TASK-128, a per-article review, and a separate decision_agent_review, plus the profile's other entries; the integration_test entry is met as TASK-128's acceptance met it, named at this acceptance, or its absence is stated there as a departure); the expected governor shadow result at the GOV-003 row is a stated departure as in TASK-125 to TASK-129 (the change class is critical_cr; the acceptance names it). The raw output of the step 'GOV-003 base tests (report only)' of the task-branch run is brought at acceptance with each base-test failure named.
  - AC7: >-
      Limits and the closing of DEF-0119. Stated at acceptance: (1) done() is not wired into the CLI or the launcher; the first real run calls it as a scripted function of the existing code (DEF-0119:23, option O2); (2) it does not check that the accepted commit is on main; reconcile's walk leaves a task whose accepted commit is not reached uncovered (reconcile.py:13-18); (3) reconcile trusts the approval_record field as the governor wrote it and does not re-run the governor's approval rule; (4) a task whose last decision.acceptance is not an accepting record, or whose state is not ACCEPTED, cannot get a task.done from this writer, whatever its earlier records say; (5) DEF-0099 stays done. No change to any file outside the write set; no change under .github/; no docs, spec or DEF file in the task commit. DEF-0119 may be closed only at this task's acceptance and records step: the Log line held in C:\Users\Admin\AIEOS-REG0-lite\held is re-applied with the D-5854 C1 correction, a Log line for this task is added, and the status and the two header lines change as DEF-0118's did (7e4a274); if the acceptance does not state this, DEF-0119 stays open with a Log line only. No launching of a runtime; no change to the autonomy level or the measurement protocol.
