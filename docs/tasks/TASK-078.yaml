# TASK-078: the MCP server's frame and its status tool (specification 6 revision 6, sections 3, 4 and 8; M6's first
# slice). Plan: decisions D-2103 to D-2106 (session 308d8b07).
#
# Scope (D-2103 (a) to (c), D-2105, D-2106):
# - src/aieos_bootstrap/mcp_server.py (new): MCP over stdio, one JSON-RPC 2.0 message per line, in the Python 3
#   standard library only (spec 6 section 3, the bootstrap limit); the methods initialize, notifications/initialized,
#   tools/list and tools/call, and no other; tools/list lists only status (the six other tools of section 4 are added
#   by the slices that build them, D-2103 (b)); the identity from the environment (AIEOS_SESSION_ID, AIEOS_ROOT; the
#   names of claude_code_pretool_hook.py :130-131); AIEOS_BASE is not read in this slice (status does not need it);
#   the closed error vocabulary of section 8, of which status uses no_session and core_error; and status, which
#   writes nothing. A function main(stdin, stdout, environ, clock) runs the loop over the given streams until end of
#   input, so tests drive it; a __main__ guard calls it with the process's streams, environment and UTC clock.
# - src/aieos_bootstrap/writer.py: one new read-only function, session_leases(root, session_id, now, timeout=5.0),
#   the session's lease rows each with its expiry and whether the session has ended. It calls the existing helpers
#   _check_lookup_root, _store_present (session_lease's presence step and link check, kept for TASK-067's
#   functions), _store_uri, _check_schema, _lease, _named and _refused unchanged; only its read is its own (a
#   read-only connection, BEGIN DEFERRED, its reads, ROLLBACK, the connection closed in finally), as TASK-067's
#   _read_reads (writer.py :659) is. Its code stands above the marker at writer.py :906, beside TASK-067's code:
#   "# ---- the read-only lookup of the store (task TASK-066) ----"; its queries are module-level str constants.
#   Every existing function and constant is unchanged. Its read is a hand-kept copy of session_lease's transaction
#   steps, kept in step by hand (a stated limit, as DEF-0092 R-4 states for the walk copies).
# - The status mapping (D-2104, D-2105, D-2109 N4), word for word in AC5.
#
# Owner-act boundary: none reached. The server is a program nobody runs but its tests: launching it in a runtime and
# connecting it to one (a Claude Code setting) are the owner's (spec 6 section 10; A51 item (4)); no hook, setting,
# policy or measurement; nothing under .github/ or .claude/.
#
# Stated limits.
# - MCP alone is at most tier T2, as a target and unmeasured (spec 6 section 2); nothing here is measured.
# - Whether a server started by a runtime inherits the runtime's environment is unmeasured (spec 6 section 3).
# - "expired" exists only between a lease's expiry and the next expire_leases (writer.py :487-502), which removes
#   expired rows; status reports what the store holds at its read.
# - More than one unexpired lease row for one session: this contract reads spec 3's one-lease rule (spec 3 :157, as
#   spec 6 section 9 quotes it, "one lease at a time") as at most one unexpired row per session, an inference;
#   status answers more than one with core_error and does not name the rows.
# - The protocol version the server answers is a stated choice, "2025-06-18"; it negotiates nothing else.
# - session_leases' read is a hand-kept copy of session_lease's transaction steps (above).
# - The server reads the store only through the writer's read functions (INV-004; spec 6 section 2) and opens no file.
# - The answer forms are stated choices: session_leases' {ended, leases} with reason "rows"; status's success object
#   and its expires_at in YYYY-MM-DDTHH:MM:SSZ; a tool error as a tools/call result with isError true and the text
#   {"error": <word>}.
# - The refusal mapping is a stated choice where spec 6 section 4's status row does not fix it: argument (only the
#   server's own clock or timeout, the identity being checked first) gives core_error; root and no_store give
#   no_session; session (an id the store never saw, so no lease row for it) gives {"task": null, "lease": "none"};
#   unreadable, link, tables and any other answer give core_error.
#
# The pins (L-0026; MYSP/m6t/pinscan78-out.txt at 3a3e578f; D-2104, D-2106). Each passes unchanged:
# - tests/unit/test_writer.py R8 (:396-411): only writer.py opens files or names the project-state directory (with
#   claude_code_shell_allow.py's strings); mcp_server.py opens nothing and names no such directory.
# - tests/unit/test_claude_code_read_hook.py HOOK_SIDE (:35, eight modules at :492) and OWN_IMPORTS (:38): the new
#   module is not hook-side.
# - The export pins: tests/unit/test_export_round2.py :61-62 and tests/unit/test_export_reference.py :57.
# - The deterministic rule (aieos-checks.yml :1484-1637): mcp_server.py is under NONE (json, os's environ, sys,
#   datetime, re and the own package); writer.py's ALLOW (sqlite3, os.makedirs, open rb/ab, the directory's name) is
#   unchanged and covers session_leases; tests/unit/test_writer.py is one of WRITER_TESTS (sqlite3, tempfile).
#   tests/unit/test_mcp_server.py and tests/property/test_mcp_server_properties.py are under NONE: no tempfile,
#   sqlite3 or open; they read source by pathlib's read_bytes and use no real store (stand-ins only).
# - tests/unit/test_writer.py :860-880 (R14): writer.py split at the marker at writer.py :906, exactly two
#   "finally:" below it, no PRAGMA, INSERT, UPDATE, DELETE or makedirs below it; tests/unit/test_writer.py
#   :1725-1737 (TASK-067 AC9): the helpers' defs above the marker and the same count; tests/unit/test_writer.py
#   :1694-1719 (R20): every execute query a str constant or a module-level str constant. Each passes unchanged by the
#   placement above. No test hashes writer.py; __init__.py's __all__ is not changed. These three pins were missed
#   by the plan's own scan and by decision D-2106, and found by both contract reviews (D-2109).
#
# Risk: high, computed over the base by MYSP/m6t/risk_class78c.py (R2 medium and R3 high for each path). GOV-003:
# src/aieos_bootstrap/** is an evaluator path (aieos-checks.yml :423, :490); change class critical_cr, as TASK-077's,
# ruled at acceptance. Profile as TASK-077's (functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis], architecture [ai_review (cross-model)]), plus the
# evidence_required of the applicable articles. Reviews on Sonnet 5.5 or Opus 5.5 (never Fable). Naming (D-544 Q3):
# every new test function names "TASK-078 ACn" in its own docstring.
# Not applicable: OPS-001; INV-005 to INV-011; GOV-001, GOV-004 to GOV-006, SEC-003. INV-004 applies (the writer).
# Owner-kept acts: none in this task (launching and connecting the server stay the owner's and are not done).
# Shadow (D-2042 C3 as amended by D-2068): the governor's evaluate at acceptance, any difference named.
# Records obligations of the acceptance (AC10; outside the write-set): the shadow's result; DEF-0092's log line: the
# session_leases sibling path as a further hand-kept copy (R-4); any DEF line the reviews leave.
