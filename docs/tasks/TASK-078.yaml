acceptance_criteria:
  - AC1: >-
      writer.session_leases(root, session_id, now, timeout=5.0): read-only; never raises; answers in StoreResult's
      form: "done" with reason "rows" and value {ended, leases}, where ended is a bool and leases is the session's lease
      rows in eventlog.LEASE_KEYS' form, ordered by fencing counter (empty when the session is ended or holds none);
      or "refused" with one finding and one of the reasons argument (session_id not a non-empty str, now not a
      timezone-aware UTC datetime with whole seconds, timeout out of (0, 60]), root, no_store, link, unreadable, tables,
      session (no session with this id). The store's bytes are unchanged and no file or folder is created by a call.
      Tests in tests/unit/test_writer.py over real stores: no store; a session never started; a started session with no
      row, with one unexpired row, with one expired row (expires_at <= now), with two rows; an ended session; the
      argument and root refusals.
  - AC2: >-
      Every existing function and constant of writer.py is unchanged: tests/unit/test_writer.py's existing tests
      pass unchanged, R8 (writer.py stays the one module that opens files), R14 (tests/unit/test_writer.py
      :860-880) and R20 (tests/unit/test_writer.py :1694-1737) among them; a new test reads writer.py's top-level
      names by ast and finds exactly the names at the base plus session_leases and its private helpers and
      constants, each named with "_session_leases" or "_SESSION_LEASES" at its start, all above the marker at
      writer.py :906.
  - AC3: >-
      The protocol, in mcp_server.main(stdin, stdout, environ, clock), each input line taken in this order: (1) an
      empty or whitespace-only line gets no answer; (2) a line that is not JSON answers -32700 with id null; (3) a
      JSON value that is not an object (a batch array included) answers -32600 with id null; (4) an object whose
      "jsonrpc" is not "2.0", whose "method" is not a str, or whose "id" is present but not a str, an int (not a
      bool) or null answers -32600 with its id when that id is valid, else null; (5) an object without "id" is a
      notification and gets no answer (notifications/initialized among them); (6) initialize is answered with
      protocolVersion "2025-06-18", serverInfo {name: "aieos", version: "0.1"} and capabilities {tools: {}};
      tools/list answers exactly one tool, status, with an input schema of an object with no properties; tools/call
      whose params is not an object, whose "name" is absent or not a str, or which names any tool but status answers
      -32602; tools/call with name status runs status; any other method answers -32601. Every answer is one line of
      JSON on stdout; main returns 0 at end of input and never raises. Tests for each case; a property test over
      arbitrary lines finds no exception and one answer line at most per input line.
  - AC4: >-
      The identity: AIEOS_SESSION_ID absent, empty or not of the form [A-Za-z0-9._-]{1,128}, or AIEOS_ROOT absent, empty
      or not absolute, gives status's error no_session; AIEOS_BASE is not read. Tests for each case.
  - AC5: >-
      status's mapping over writer.session_leases(root, session id, now from the clock): done with ended true, or
      with no lease row: {"task": null, "lease": "none"}; done with exactly one unexpired row (expires_at > now):
      {"task": <its task_id>, "lease": "live", "expires_at": <its expiry as YYYY-MM-DDTHH:MM:SSZ>}; done with one
      or more rows and none unexpired: {"task": <the task_id of the row with the highest fencing counter>,
      "lease": "expired"}; done with more than one unexpired row: the error core_error; refused with session:
      {"task": null, "lease": "none"}; refused with root or no_store: the error no_session; refused with argument,
      unreadable, link or tables, or any other answer: the error core_error. A tool error is answered as a
      tools/call result with isError true and the text {"error": <word>}; a success as a result whose one text item
      is the JSON object above. Tests for each row with a stand-in for session_leases in
      tests/unit/test_mcp_server.py, and one test in tests/unit/test_writer.py that imports mcp_server and runs
      status over real stores for the live, expired, none and ended cases.
  - AC6: >-
      mcp_server.py writes nothing: it calls no writer function but session_leases, opens no file, names no
      project-state directory, and imports only json, os, re, sys, datetime and aieos_bootstrap.writer; tests read its
      source (pathlib's read_bytes) by ast and check that a status call through stand-ins calls only
      session_leases.
  - AC7: >-
      Every existing test passes unchanged, the pins of the header among them (R8, HOOK_SIDE and OWN_IMPORTS, the export
      pins); the full suite runs locally in a scratch clone before the first code commit; the deterministic rule's
      local run over the clone gives no finding.
  - AC8: >-
      The docstrings of mcp_server.py and of session_leases state the scope and the limits of the header (the protocol
      version, the methods, the one tool, the identity, "expired" until expire_leases, more than one unexpired row as
      core_error, the sibling open path, launching and connecting the owner's, T2 unmeasured) in words a test reads;
      every new test function names "TASK-078 ACn" in its own docstring, and the modules' naming test refuses one that
      does not or that names another task's AC.
  - AC9: >-
      Broken copies: for each of AC1 to AC6 and AC8 at least one copy with one change that breaks it, each failing the
      test its AC names and no other cause, among them a session_leases copy that reports an expired row as no row, a
      status copy that answers a session with no row as expired, and a naming-test copy that admits another task's id;
      the list and the failing tests go to the decision agent with the acceptance request.
  - AC10: >-
      Acceptance-time records (not a test): the governor's evaluate at acceptance (the shadow, D-2068) with any
      difference from the decision agent's decision named; any DEF line the reviews leave.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 600k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8]}
  - {gate: G3, check: constitution, args: [AC9, AC10, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
