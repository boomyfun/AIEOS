acceptance_criteria:
  - AC1: >-
      Docstrings. Only docstring text changes in the two modules of src. (a) DEF-0089 S1-1:
      src/aieos_bootstrap/claude_code_read_hook.py :44 names the source of "as documented": it keeps the words
      "(as documented, unmeasured" (pinned by tests/unit/test_claude_code_read_hook.py :591) and states that the source is
      the hooks reference at https://code.claude.com/docs/en/hooks as summarised by a web-reading tool on 2026-10-18, a
      summary and not the page (the form of claude_code_hook.py :20-:21); it claims no measurement. (b) DEF-0141 item 8:
      src/aieos_bootstrap/claude_code_hook.py :28-:29 names, beside Write, Edit, Bash, PowerShell, Read, Grep and Glob,
      the other tools judge answers for (claude_code.py :350-:357): the seven aieos MCP tool names and ToolSearch with a
      "select:" query of them; every phrase that tests/unit/test_claude_code_hook.py :416-:418 pins stays.
  - AC2: >-
      DEF-0089 S1-2: tests/unit/test_claude_code_read_hook.py asserts, over the same 32 results as
      test_every_result_has_the_result_keys, that each result's keys in order are RESULT_KEYS; the assertion fails on a
      copy of the module whose result keys are built in another order.
  - AC3: >-
      DEF-0089 DA-4 R-3, restated as claude_code_store.py :57-:58 states it: a test of
      tests/unit/test_claude_code_read_hook.py reads the syntax tree of each module of its HOOK_SIDE list (:35-:37) and asserts
      that the ones whose import statements name claude_code_store are exactly claude_code_read_hook.py and claude_code_pretool_hook.py; writer.py is not
      in HOOK_SIDE and is outside the point. The test fails on a copy where a third HOOK_SIDE module imports it.
  - AC4: >-
      DEF-0141 item 1: in the test test_every_other_query_stays_uncovered of tests/unit/test_claude_code.py (:474, its queries
      :481-:484) three queries are added: a name with an added suffix, a name with an added prefix and a name followed by the escape '\r', each answered
      uncovered as the others; no test function is added or removed in that module (its TASK-061 naming rule, :363-:372).
  - AC5: >-
