# TASK-093: `aieos status`. A new core function execution.status_report, added to execution.py by added lines only,
# reads the log once and gives the project's status: progress (each approved task with its state and stale_evidence,
# from execution.task_states) and three items "not available" (drift, tasks waiting for approval, requirements lacking
# assurance), since no reader of them exists (specification 7 revision 2, section 3 :31, section 10 point 5; concept
# :800-801; M7's remaining part, its third task). A new command status in cli.py calls it and prints the answer; it
# writes nothing and does not refuse inside a runtime. Plan: decisions D-3085 to D-3088 (session ea6ea0a3): the scope
# note (MYSP/t93/scope93.md) with D-3086's rulings Q1 to Q6 and its forms C1 to C4; the pin scan (pinscan93-out.txt at
# 0b37a1aa) and its reading (pinscan93-reading.md, D-3088); the risk run (MYSP/t93/risk_class93.py at 0b37a1aa: high)
# and the forbidden list (MYSP/t93/forbid93.txt at 0b37a1aa; cli.py and execution.py left out; the new
# tests/unit/test_execution_status.py is not in it) (D-3088); the reviews rv93a (claude-sonnet-5-5) and rv93b
# (claude-opus-5-5) of r0 and their dispositions (MYSP/t93/disp93.md, D-3090, twelve rows); the round-2 review
# rv93c (claude-opus-5-5) of r1 and its dispositions (MYSP/t93/disp93r2.md, D-3093, eight rows); the decision
# agent's read of r2 in place of a third round, with this one provenance fix (D-3096).
#
# Scope:
# - In src/aieos_bootstrap/execution.py, by added lines only (D-3086 Q3): a paragraph added to the module docstring
#   after :122 (before the closing quotes at :123), and after the last function, task_view:
#   - STATUS_KEYS = ('progress', 'drift', 'waiting_for_approval', 'requirements_lacking_assurance') and
#     NOT_AVAILABLE = 'not available';
#   - status_report(root, now, read_log=None) -> (a mapping with exactly STATUS_KEYS, None) or (None, findings); it
#     never raises an Exception. In order:
#     1. The arguments: root a non-empty str, now a timezone-aware UTC datetime with whole seconds, read_log None or
#        callable; a wrong one gives (None, ['argument: ...']) with read_log not called; a check that raises gives
#        (None, ['argument: checking the arguments raised <type>']). read_log defaults at call time to
#        writer.read_log. now is checked and not otherwise used (no lease is read; D-3086 Q4).
#     2. The log, read once: read_log(root) is called exactly once; a value that is not bytes gives (None, ['log:
#        read_log gave <type>, not bytes']); the bytes are checked by records.check_log through _given_log, its
#        findings given as "log: line <n>: <finding>".
#     3. The approved ids: the task ids of the log's task.approved events, ignored duplicate lines left out, in the
#        TASK- form, sorted by task number (_task_key), as list_tasks gathers them (execution.py :464-466).
#     4. Progress: execution.task_states(the same bytes, the approved ids) once; its findings are given as they are;
#        else progress is the list, in the approved ids' order, of {task, state, stale_evidence} with the state and
#        stale_evidence task_states gives.
#     5. The answer: {progress, drift: NOT_AVAILABLE, waiting_for_approval: NOT_AVAILABLE,
#        requirements_lacking_assurance: NOT_AVAILABLE} (D-3086 Q1, Q2; spec 7 :31 "not available" where no reader
#        exists yet).
#     A raise in steps 2 to 4 gives (None, ['status_report: a step raised <type>']). No partial answer is given.
#   - It calls no held_leases and reads no store (D-3086 Q4), appends, grants, releases and expires nothing; its added
#     lines name no attribute now or write and no project-state directory text (test_execution.py :724, :727).
# - In src/aieos_bootstrap/cli.py (D-3090 rows 2, 6, 8):
#   - COMMANDS becomes ('tasks', 'end', 'status'); USAGE gains the line for status; _parse takes `status --root
#     <path> [--json]` as it takes tasks (no session; its "end" branch untouched); _run gets an explicit status branch
#     after end's, so tasks' fall-through is not reached for status.
#   - The command status, in two new functions: _status(root, as_json, clock) calls clock() once, then
#     execution.status_report(root, now) once, looked up at call time; it does not call in_runtime (spec 7 :34 names
#     only end and launch; D-3086 C1). A raise in the clock or status_report gives exit 1 and the one finding "status:
#     a step raised <type>". The answer's form uses exact types (type(x) is), as tasks' _item_in_form (cli.py
#     :135-137), except the findings branch: a tuple of two whose first is None gives findings, the second and its
#     items taken by isinstance as tasks takes them (cli.py :150-152): the str items of a list or a tuple second, or
#     "status: status_report gave no finding" when the second is not a list or tuple or holds no str; a tuple of two
#     whose first is a dict with exactly STATUS_KEYS, progress a list of dicts each with
#     exactly task (a str), state (a str) and stale_evidence (a bool), the other three each the str "not available",
#     and whose second is None, is an answer; anything else gives exit 1 and the one finding "status: status_report
#     gave an answer out of form". Findings give exit 1 through _findings. _render_status(answer, as_json) makes an
#     answer's output, exit 0: in text, "progress: <task> <state>" per task, with " stale" added when stale_evidence is
#     true, or the one line "progress: no approved task", then "drift: not available", "waiting for approval: not
#     available" and "requirements lacking assurance: not available"; under --json the one line
#     json.dumps({"drift": ..., "progress": the items passed through unchanged, "requirements_lacking_assurance": ...,
#     "waiting_for_approval": ...}, sort_keys=True). A raise in _render_status gives exit 1 and "cli: a step raised
#     <type>" (the frame's rule). The frame's rules (one write, flush, a raising write giving 1, never raising) are
#     TASK-091's, unchanged.
#   - cli.py's docstring gains status's paragraph and rewords the sentences status makes incomplete: :9 ("a command of
#     COMMANDS, tasks or end", to name status), :35-36 ("tasks does not call it; end calls it after the parse", to name
#     status with tasks) and main's docstring :216-217 ("tasks does not read it", to name tasks and status); every
#     phrase of tests/unit/test_cli.py :405-411 and of tests/unit/test_launcher_outside.py's cli docstring test stays,
#     and "whose only entry is tasks" and "come with later tasks" are not written; cli.py's imports stay {datetime,
#     json, os, re, sys, execution, launcher}.
# - New tests/unit/test_execution_status.py: status_report by stand-ins (a read_log stand-in giving built log bytes and
#   counting its calls), and the command status by stand-ins (mock.patch.object of execution.status_report), a literal
#   root 'C:/status-root-93' (L-0032); no tempfile, sqlite3, shutil or open; its naming test requires "TASK-093 AC" in
#   every test.
# - What it does not do: no change to tests/unit/test_cli.py (pinscan93-reading.md (6)), writer.py, launcher.py,
#   mcp_server.py or __init__.py; no change to execute, list_tasks, task_states, rework_count or task_view; no
#   process; no runtime, hook or setting.
#
# Stated limits: drift and tasks waiting for approval are "not available" (no reader of what is open exists: drift.py
# and scope_drift.py compute new events from a commit's inputs; D-3086 Q1, Q2); requirements lacking assurance is "not
# available" since specification 4 section 6's checks exist (ac_coverage.check, ac_tests.listing) but no reader of
# contract and test files feeds them (ac_coverage.py :1-2, :19-20; ac_tests.py :1-2, :27-28). An approved task that
# was replanned or drafted again shows DRAFT in progress while waiting for approval says "not available", and a task
# drafted and never approved is not shown. A task under a live lease shows its log state (READY or REWORK), not
# IN_PROGRESS, since no lease is read; a log that gives a task IN_PROGRESS (which list_tasks refuses, execution.py
# :470-472) is shown as task_states gives it. A root that is not an existing folder gives only "status_report: a step
# raised ValueError" (as tasks, cli.py :39); a folder with no event log gives b'' (writer.py :222-224) and "progress:
# no approved task".
# Every approved task is listed, DONE ones included. Specification 7 :31's "from the same core reads" is a stated
# departure: the MCP tool status reads writer.session_leases and the command reads writer.read_log and task_states, so
# no read is shared (D-3086 Q3; spec 7 section 10 point 5 leaves it open); the MCP tool is not changed. The log is read
# at one moment, so a task approved after the read is not shown; a log that check_log refuses gives findings only, no
# partial status; one run at a time (the writer's limit); __init__.py's stale module list stays.
#
# Owner-act boundary: none reached. A read-only command; no process, no runtime, no hook, no setting (DM A51 item
# (4)); CR-002 part 4 limit 5 (CR-002-concept-errata.md :61) is not reached.
