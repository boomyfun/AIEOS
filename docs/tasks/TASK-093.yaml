constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      status_report's arguments by stand-ins: a root that is empty or not a str, a now that is naive, not UTC or with
      microseconds, a now whose checks raise, and a read_log neither None nor callable each give (None, findings
      beginning "argument: ") with read_log not called; read_log defaults at call time (mock.patch.object of
      writer.read_log made after import is the one called); no call raises.
  - AC2: >-
      status_report's answer by stand-ins over built log bytes: read_log is called exactly once with the root; the
      answer has exactly STATUS_KEYS; progress lists the tasks with a task.approved, three of them given in the log in
      the order TASK-10, TASK-2, TASK-9, in task-number order (TASK-2, TASK-9, TASK-10), each {task, state,
      stale_evidence} equal to task_states' over the same bytes (READY; REWORK after task.submitted and a
      decision.acceptance with next_task_state REWORK; DONE with stale_evidence true after an evidence.stale); a log
      with no task.approved, and an
      empty log (b''), give progress []; drift, waiting_for_approval and requirements_lacking_assurance are each "not
      available"; by ast, status_report names no held_leases and uses no writer attribute but read_log.
  - AC3: >-
      status_report's findings by stand-ins: read_log giving a str or None ("log: read_log gave ..."), bytes that
      check_log refuses ("log: line ..."), a log whose task events the projection refuses (task_states' findings, as
      given), and a raise in read_log or task_states ("status_report: a step raised <type>") each give (None,
      findings) with no partial answer; no call raises.
  - AC4: >-
      The command status by stand-ins (mock.patch.object of execution.status_report, restored after each test; a
      counting clock): "status --root R" and "status --root R --json" call the clock once and status_report once with
      (R, the clock's value); "status", "status --root", "status --root R extra", "status R --root R" and "status
      --root R --json --json" give exit 2 and USAGE with nothing called; an answer gives exit 0 and the progress lines
      in order (a stale task with " stale"), or "progress: no approved task", then the three "not available" lines;
      under --json the output equals an exact expected string, the stand-in's progress items carrying their keys in
      the order task, state, stale_evidence; findings give exit 1 and their str items, and (None, None), (None, 'x')
      and (None, [3]) give the no-finding line; each out-of-form answer (not a tuple of two, a list in place of the
      tuple, an OrderedDict answer, other keys, a list subclass for progress, a progress item with a non-str state or
      a stale_evidence of 1, an item other than "not available") gives the out-of-form finding; a raising clock or
      status_report gives "status: a step raised <type>"; a raising _render_status (patched) gives "cli: a step
      raised <type>"; an environ holding the three RUNTIME_VARS gives the same output as {}; tasks' and end's tests
      all still pass.
  - AC5: >-
      The modules: execution.py's import set unchanged (tests/unit/test_execution.py :718-719 passes) and its refused
      names and attributes unchanged (:720-727 passes); execution.py's diff from the base is added lines only (the
      docstring paragraph before :123 and the block after task_view), checked at G3 by a scratchpad git-diff script;
      cli.py's imports unchanged (tests/unit/test_cli.py :333-343 passes); by ast, cli.py's _status and _render_status
      name no writer, held_leases or in_runtime; tests/unit/test_writer.py :397-412 passes; the new test file uses no
      tempfile, sqlite3, shutil or open, roots only the literal 'C:/status-root-93', and uses no one-argument
      .replace() and no .replace(target=...).
  - AC6: >-
      Docstrings: execution.py's module docstring gains a paragraph holding "status_report", "TASK-093", "not
      available", "reads the log once" and "no held_leases", and keeps every phrase of tests/unit/test_execution.py
      :733-735, tests/unit/test_launcher.py :738-739, tests/unit/test_resume_log_inputs.py :517-518 and
      tests/unit/test_execution_list_tasks.py :386-388; cli.py's docstring gains "aieos status" and "TASK-093", does
      not hold "COMMANDS, tasks or end" and names status in that sentence's list of COMMANDS, and keeps every phrase
      of tests/unit/test_cli.py :405-411; USAGE names status;
      every test of tests/unit/test_execution_status.py names "TASK-093 AC", checked by its own naming test, more than
      20 tests in all.
  - AC7: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) read_log called twice (AC2); (2) a
      held_leases call added (AC2); (3) the approved ids sorted by str in place of _task_key (AC2); (4)
      stale_evidence dropped (AC2); (5) drift given as a count (AC2); (6) a log check_log refuses giving a partial
      answer (AC3); (7) read_log bound at import time (AC1); (8) a raise in task_states escaping (AC3); (9) status
      refusing inside a runtime (AC4); (10) findings giving exit 0 (AC4); (11) the --json line without sort_keys
      (AC4); (12) "progress: no approved task" left out (AC4); (13) cli.py importing writer (AC5); (14) the clock
      called twice (AC4); (15) an out-of-form answer printed (AC4); (16) a line of execution.py's list_tasks changed
      (AC5, the G3 diff script); (17) the answer's form checked by isinstance, an OrderedDict answer printed (AC4);
      (18) (None, None) given as out of form in place of the no-finding line (AC4);
      eighteen copies in all; each copy made in a scratchpad script at G3, not committed; the governor's evaluate at
      acceptance (the shadow) with any difference named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6]}
  - {gate: G3, check: constitution, args: [AC7, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
