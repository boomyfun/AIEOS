acceptance_criteria:
  - AC1: >-
      The arguments and the readers: list_tasks(root, now, read_log=None, held_leases=None); root not a non-empty str,
      or now not a timezone-aware UTC datetime with whole seconds, each give (None, findings) with zero reader calls
      (stand-ins count them); read_log and held_leases default, at call time, to writer.read_log and
      writer.held_leases (a patch of either after import is the one called); every stand-in call binds to the real
      function's signature; one call reads the log once and the store once, the log first. The test file calls
      datetime's replace by keywords only (the deterministic rule refuses a one-argument .replace(, aieos-checks.yml
      :1622-1625; D-2479 row 12).
  - AC2: >-
      Which tasks: from a log built by eventlog.append, a task whose last task.approved is followed by nothing, by
      task.blocked then task.unblocked, or by a decision.acceptance with next_task_state REWORK is listed with that
      state (READY, READY, REWORK); a task in DRAFT, BLOCKED, VERIFYING, IN_REVIEW, ACCEPTED, DONE, STALE, REJECTED or
      ESCALATED (by its own events after the last task.approved) is not listed; a task with no task.approved is not
      listed; a duplicate line, built by hand since eventlog.append makes none (eventlog.py :180-182; a copy of an
      appended line with its seq set to the next number, by json; records.py :693-697), is not counted: a duplicated
      task.approved lists its task once, and a duplicated task.blocked after its task.unblocked leaves the task
      READY; each element is exactly {task, state, contract_hash, lease},
      contract_hash the last task.approved's (a task approved twice gives the second hash); the list is sorted by task
      number (TASK-9 before TASK-10); an empty log (b"") gives ([], None).
  - AC3: >-
      The leases: a held lease on a listed task with expires_at after now removes it from the list; with expires_at at
      or before now lists it with lease "expired"; with no lease, lease "none"; an in-form lease, unexpired or expired,
      on a task the log has in VERIFYING (task.submitted then no release, as a stop at submit.py :41-42 leaves it) or
      in another state other than READY and REWORK leaves that task out with no finding, the other tasks listed as
      without it; a lease out of eventlog.LEASE_KEYS' form (a missing key, an extra key, a counter not an int, a naive
      expires_at), a lease whose task_id is not a str in the _TASK form, a lease on a task with no task.approved, two
      leases on one task, held_leases raising, or held_leases answering a non-list, each gives findings.
  - AC4: >-
      Fail closed: read_log answering a non-bytes value, or a log records.check_log refuses, gives findings with no
      held_leases call; a task.* event _project does not name gives findings (made, as records.EVENT_TYPES leaves no
      such type, by mock.patch.object(execution, 'STATE_OF', …) as tests/unit/test_execution.py :275-283 does), the
      event of any approved task, a DONE one too, failing the whole list; a decision.acceptance giving a task the
      next_task_state IN_PROGRESS gives findings; a stand-in that raises at any step (a RecursionError and a
      MemoryError among them) gives findings; no call returns a partial list or raises; findings are a non-empty list
      of strs.
  - AC5: >-
      Reads only: by ast over pathlib's read_bytes, list_tasks and every function the task adds use of writer at most
      read_log and held_leases, and none names expire_leases, grant_lease, release_lease_token, append_event,
      open_store, start_session or end_session; a call through stand-ins records exactly one read_log and one
      held_leases call and nothing else; the new code names no local or attribute R10Purity refuses (no Name time,
      open, os, sys, compile or exec; no attribute now, write, expire_leases or release_lease) and its docstring and
      comments hold no ".aieos" substring (tests/unit/test_execution.py :722-727); execution.py's import set, the
      names R10Purity refuses and its docstring
      phrases are unchanged (tests/unit/test_execution.py :704-736 pass unchanged).
  - AC6: >-
      The projection is shared: by ast, list_tasks calls _project; _project, _state and execute are the base's, byte
      for byte (checked at review from the change C..X, not by a test); a seeded loop of 300 random logs (each task's
      events drawn from task.approved, task.blocked, task.unblocked, task.submitted, decision.acceptance with a drawn
      next_task_state other than IN_PROGRESS, task.done and task.stale) with drawn held leases, at most one per task,
      each in form and on an approved task of any state: every listed task is one _project gives READY or REWORK with
      no unexpired lease, every other approved task is not listed, no call gives findings and no call raises; and a
      further seeded draw adding a lease out of form, on an unapproved task or a second one on a task gives findings
      each time (D-2479 row 10).
  - AC7: >-
      Every existing test passes, the pins of the header among them; tests/unit/test_execution.py is unchanged; the
      full suite runs locally in three unit parts, integration and property before the first code commit; the
      deterministic rule's local run gives no finding. The module docstring holds, whitespace read as single spaces,
      the nine phrases of tests/unit/test_execution.py :733-735 and the phrases "list_tasks", "the tasks that may be
      taken", "DEF-0099" and "reads only", read by a test by ast; every new test names "TASK-084 ACn".
  - AC8: >-
      Broken copies, each failing the tests of its AC: (1) lists a task with an unexpired lease (AC3); (2) lists a
      task in BLOCKED (AC2); (3) leaves out a task whose lease has expired (AC3); (4) takes the first task.approved's
      hash (AC2); (5) returns the list found so far on a refused log line (AC4); (6) calls writer.expire_leases (AC5);
      (7) sorts the ids as strings (AC2); (8) accepts a naive now (AC1); (9) counts a duplicate line (AC2); (10) binds
      the defaults at import time (AC1); (11) skips a lease out of form (AC3); (12) copies the projection instead of
      calling _project (AC6); (13) fails the whole list on an in-form lease of a VERIFYING task (AC3); each copy made
      in a scratchpad script at G3 (brk84, as brk83: the module copied, one exact replacement, the named tests run),
      not committed, since the test file may not exec or compile source (aieos-checks.yml :1494); AC5's ast check is a
      function over a source text, so copy (6)'s text is shown failing it; the governor's evaluate at acceptance
      (the shadow) with any difference named; the stated
      choices in the records (not tests).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7]}
  - {gate: G3, check: constitution, args: [AC8, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
