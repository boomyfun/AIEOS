# TASK-084: list_tasks, the tasks that may be taken, as a core function in execution.py (specification 6 revision 7,
# section 1; specification 7 revision 2, section 3; specification 1, section 5; M7's fourth task). Plan: decisions
# D-2475 to D-2477 (session 3797498a): the scope note (MYSP/t84/scope84.md) and the ten rulings of D-2475, the pin
# scan (MYSP/t84/pinscan84-out.txt at 80934ee5 and its reading MYSP/t84/pinscan84-reading.md, D-2476, D-2477), the
# risk run (MYSP/t84/risk/risk_class84.py, D-2477), the forbidden list (MYSP/t84/forbid84.txt, D-2477, the one
# write-set file under src/ left out), DEF-0099's draft (MYSP/t84/def0099.md); r1: reviews rv84a (claude-sonnet-5-5)
# and rv84b (claude-opus-5-5) of r0, read tools only, and their dispositions (MYSP/t84/disp84.md, D-2479).
#
# Scope:
# - In src/aieos_bootstrap/execution.py, one new public function, list_tasks(root, now, read_log=None,
#   held_leases=None), returning (a list, None) or (None, findings), findings a non-empty list of strs, never a partial
#   list; read_log and held_leases default, at call time, to writer.read_log and writer.held_leases (D-2477 C2), as
#   execute's defaults are bound (execution.py :294-295, the signature, and :298-303, the binding;
#   tests/unit/test_execution.py :202-212).
# - It reuses _project (execution.py :190-208) unchanged for each task's state; _project, _state, execute and every
#   other existing name of the module are unchanged (D-2475 ruling 5: no copy of the projection, INV-003).
# - Spec 6 :14: listing the tasks that may be taken is a core function, not an MCP tool; mcp_server.py is not in the
#   write set, and its tests that refuse "list_tasks" as an unlisted tool name stay true
#   (tests/unit/test_mcp_server.py :100; tests/unit/test_mcp_server_work_order.py :162).
# - What it does not do: no CLI command (the command `aieos tasks` is a later task's, with the CLI frame and its entry
#   point, D-2475 ruling 1; specification 7 :26 leaves the entry point open); no write, no append, no grant, no
#   release, no expiry (writer.expire_leases stays the launcher's, specification 7 :45); no Git read; no contract read.
#
# The rulings (D-2475), each this task's choice (proposed; specification 7 section 10 item 10 stays open for its next
# revision):
# - Which tasks (ruling 2; specification 1 :60, :78; specification 7 :32): only the tasks that may be taken: those
#   the log has in READY or REWORK with no unexpired lease in the store. No other state is listed.
# - Where the ids come from (ruling 3): the log alone: every task with a task.approved, its state projected after its
#   last task.approved by _project. No contract is read: a task without an approval cannot be taken.
# - Dependencies (ruling 4): not re-checked; READY already requires every dependency DONE at task.approved
#   (specification 1 :65). A stated limit, carried by DEF-0099 (MYSP/t84/def0099.md) for the launcher's grant path
#   (TASK-086, where the contract is read anyway), written to docs/Deferred at TASK-084's records commit as a second
#   path, as DEF-0097 and DEF-0098 were.
# - The lease read (ruling 6): one held_leases(root) call, at the clock given as now. A lease whose expires_at is
#   after now: its task is not listed. A lease whose expires_at is at or before now (a row that the launcher's expiry
#   has not yet removed): its task is listed, its "lease" field "expired" (it may be taken once the launcher's expiry
#   has run, which runs before every grant, specification 7 :45). A lease out of eventlog.LEASE_KEYS' form (as
#   execution's _lease_form reads it, :211-217), or whose task_id is not a str in the _TASK form (execution.py :114):
#   fail closed. An in-form lease on a task the log has in a state other than READY or REWORK, expired or not: that
#   task is left out, with no finding (it could not be listed anyway; a stated limit, its cause a stop between
#   task.submitted and the lease's release, submit.py :41-42, and the leftover rows of specification 7 :48; D-2479
#   row 1). A lease on a task with no task.approved, or two leases on one task: fail closed (no crash path leaves
#   either, a grant coming only on an approved task in READY or REWORK; the store and the log then disagree; D-2479
#   row 1, proposed). _state itself is not called and not changed.
# - The output (ruling 7): (a list, None), each element {task, state, contract_hash, lease}, state "READY" or
#   "REWORK", contract_hash that of the task's last task.approved (as _project returns it), lease "none" or
#   "expired"; sorted by the task number, by the key (the length of the digits after "TASK-" with leading zeros
#   stripped, those digits, the whole id), with no int() (so TASK-9 before TASK-10 and TASK-07 and TASK-7 in a fixed
#   order; records.check_log holds task_id to the TASK- form, records.py :667-681; D-2479 row 2; proposed). No text
#   form (no CLI).
# - The errors (ruling 8): fail closed, (None, findings), no partial list, never raises: root or now out of form
#   (checked before any read: root a non-empty str; now a timezone-aware UTC datetime with whole seconds, as execute's
#   now, execution.py :132-134, :171-172); read_log's answer not bytes; records.check_log's findings; an unnamed task.*
#   event (as _project refuses it); a log giving a task the state IN_PROGRESS (a decision.acceptance with that
#   next_task_state, as _state refuses it, :222-225); held_leases raising, or answering other than a list; a lease out
#   of form or with a task_id not in the _TASK form; a lease on a task with no task.approved; two leases on one task;
#   any other exception.
# - The self-build's own log (ruling 9): the tests alone exercise it: logs built in the test by eventlog.append, and
#   held_leases a stand-in; no tempfile, no sqlite3, no file (the deterministic rule, aieos-checks.yml :1490-1491,
#   :1503-1510; D-2433). No integration test: list_tasks reads no Git and no file but through its two readers.
#
# Owner-act boundary: none reached. The function reads only; it grants nothing and launches nothing; no hook,
# setting, policy or measurement (DM A51 item (4)).
#
# Stated limits (ruling 10):
# - No transition check against specification 1's state machine (DEF-0055 P6; execution.py :81), as _project.
# - Dependencies not re-checked (DEF-0099).
# - A leftover in-form lease on a task the log has in another state (a stop between task.submitted and the release,
#   submit.py :41-42) is not reported: the task is only left out (D-2479 row 1).
# - The store is read at one moment: a lease may be granted, released or expire after the list is made; the list is a
#   reading, not a reservation.
# - The clock is an argument; the function reads no clock.
# - The listing grants nothing and changes nothing.
# - The log and the store are read once each, in that order, with no lock across the two reads (execution.py :85-86's
#   limit).
#
# The pins (L-0026; MYSP/t84/pinscan84-out.txt at 80934ee5; D-2476, D-2477): tests/unit/test_execution.py :704-727
# (R10Purity: execution.py imports exactly datetime, re and aieos_bootstrap's records, resume_check and writer; no
# ast.Assert; no ast.Name open, exec, eval, compile, __import__, importlib, subprocess, os, sys or time; no attribute
# now, utcnow, today, environ, getenv, system, Popen, write, open_store, start_session, end_session, expire_leases,
# release_lease or evaluate; no ".aieos" string), kept: list_tasks adds no import and calls none of them; :729-736 (the
# docstring's phrases "What it does not do", "DEF-0030", "Point (i)", "DEF-0055 P6", "decision D-687 M4", "it gathers
# no Resume Check input", "no task.unblocked", "expires no lease" and "One run at a time"), kept; :738-744 (__init__.py
# names execution), unchanged; :202-227 (execute's defaults and the stand-ins' signatures), unchanged; :275-283
# (execution.STATE_OF), unchanged; no test enumerates execution.py's public names; the package-wide scans
# tests/unit/test_autonomy.py :241-246, tests/unit/test_gitread.py :374-380 and tests/unit/test_bench_isolation.py
# :35-52 hold unchanged (D-2479 row 9). The deterministic rule
# (.github/workflows/aieos-checks.yml :1489-1520, :1612-1631), checked for each write-set path:
# src/aieos_bootstrap/execution.py and tests/unit/test_execution_list_tasks.py have no allowance (:1501), so they
# import only the standard library and aieos_bootstrap, no DENY_MODULES module (tempfile, sqlite3 and shutil among
