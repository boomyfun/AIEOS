      "unreadable" with the finding "unreadable: RuntimeError", the store unchanged (D-1397 C1: the test that the
      broken copy "the catch-all removed" must fail); real-root variants are optional and any skip states its reason; the
      finding rule (K3): for every refusal reason of the four functions, with a made-up hostile session id, task id,
