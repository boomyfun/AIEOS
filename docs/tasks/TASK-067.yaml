      "unreadable: ValueError"; a stand-in for _store_uri returning a URI without the "?mode=ro" suffix gives
      "unreadable" for the three write functions; for each of the four functions, a stand-in for one of the named
      helpers (_store_present for each of the four; _write_store for add_reads, remove_reads and migrate_store;
