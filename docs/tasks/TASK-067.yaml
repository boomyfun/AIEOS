      committed; an exception from close or ROLLBACK let escape; the write URI left at "?mode=ro", made "?mode=rwc",
      and replaced by the plain path; stored_reads' BEGIN DEFERRED changed to BEGIN IMMEDIATE; UNIQUE on path removed;
      UNIQUE on seq removed; a NOT NULL removed; a live-lease check added to stored_reads, and to remove_reads; a
      finding text changed in _live_lease; AC5's two error kinds swapped, in the probe and after the CREATE; no
      rollback on a "tables" exit of migrate_store; migrate_store run with check=True; stored_reads without its session
