# Task contract TASK-067, the reads table and the read-set accumulation of the Claude Code adapter's hook process
# (Master Plan revision 4, §4 M5; concept line 945; specification 5 revision 4, section 7 and section 11 point 7,
# bullets 3 and 6; specification 2 revision 7, section 3).
# Revision 4, drafted under decisions D-1387 (K1 next), D-1388 (the scoping note approved, its rulings and C1 to C5),
# D-1389 (round k1a's dispositions B1 to B7 and (e), and its C1 (i) to (iii)), D-1391 C2, D-1393 (round k1b's
# dispositions K1 to K9 and (e), and its C1 (a) to (d)) and D-1395 (round k1c's dispositions M1 to M5 and (f), and its
# C1 (a) to (g); D-1395 replaces D-1393 C1 (b)'s wording by AC5's error table); brought for approval in
# its own request; whether it is approved is recorded in the decision files, not in this file. Fields and value forms
# follow specification 2 §5.1 and the contracts of TASK-062 to TASK-066. Readings marked "(reading)" are the worker's,
# for the decision agent to rule; values marked "(filled by script)" are written by script from the base just before
# commit C.
# Task type: implementation. What it adds, all in the writer module (src/aieos_bootstrap/writer.py, changed; INV-004:
# the accumulation and its live-lease check open the store for writing, which only the writer may do; the workflow's
# deterministic_rule refuses sqlite3 and open outside writer.py and the three writer test files,
# aieos-checks.yml:1449-1470):
# - the fourth table reads (session_id, task_id, seq, path) of specification 2 revision 7 §3 (:44): TABLES and _SCHEMA
#   gain it, and _check_schema's refusal text names four tables;
# - add_reads(root, session_id, paths, now, timeout=5.0): the read-set accumulation (spec 5 :74, :109): in one write
#   transaction (BEGIN IMMEDIATE), refused unless the session holds a live lease, then each given path not yet stored
#   for the session and the lease's task is added in the given order with the next seq; the only new function meant for
#   a later hook-side caller (D-1388 C5);
# - stored_reads(root, session_id, task_id, timeout=5.0): the stored paths of a session and task in seq order, read
#   only, for the launcher's record before the release (spec 5 :108); core-only;
# - remove_reads(root, session_id, task_id, timeout=5.0): removes them once the record is appended or found present
#   (spec 2 :44); core-only; the caller (the launcher, specification 7) decides when; the function reads no event log;
# - migrate_store(root, timeout=5.0): adds the reads table to a store in exactly the pre-TASK-067 form, in one write
#   transaction, and changes nothing else; a store already in the four-table form is left unchanged; core-only;
#   open_store keeps its meaning (create, or open unchanged) (D-1388 ruling).
# Where the new code goes (D-1389 B3): every new definition (the four functions and every new private helper and
# constant) is placed above the marker line "# ---- the read-only lookup of the store (task TASK-066) ----"
# (writer.py:491), so that TASK-066's test_the_lookup_connects_read_only (tests/unit/test_writer.py:840-860), which
# scans the text after that marker for INSERT, UPDATE, DELETE and PRAGMA and counts "finally:" as 2, passes unchanged.
# The shared helpers (D-1389 B1, (e), B7), all new and private, all above the marker:
# - the live-lease helper _live_lease (D-1388 C4): called inside the caller's transaction by both _store_answer's
#   session branch and add_reads, each passing whether the store holds any lease row (_store_answer's existing query
#   at writer.py:557; add_reads' own query of the same text), so the helper runs no second any-lease query (it runs
#   the sessions and lease-rows queries itself); in this
#   order: no lease row at all in the store gives the refusal "no_lease_row"; no sessions row
#   with that id gives "session"; a row whose ended_at IS NOT NULL gives "ended"; then the stored times of that
#   session's lease rows only are parsed (a malformed one raises ValueError, which each caller's own handler turns into
#   "unreadable" with the exception's type name, so session_lease's finding stays "unreadable: ValueError"); not
#   exactly one lease row of that session with expires_at > now gives "leases"; else the one live lease. This is
#   TASK-066 AC2's order (TASK-066.yaml:405-410; writer.py:562-573); the refusal results and their finding strings are
#   those _store_answer gives today, byte for byte; session_lease's session_id-None branch ("done"/"no_lease_row" and
#   "lease_row_without_session") stays in _store_answer, outside the helper;
# - the presence-and-link helper _store_present: for the four new functions only (session_lease and _read_store unchanged): the store
#   path's os.lstat ("no_store" for FileNotFoundError or NotADirectoryError, "unreadable" for any other OSError or a
#   ValueError, "link" for an entry that is not a regular file), then the realpath comparison of session_lease's link
#   check ("link", a raising step included); returns the checked realpath; the same steps and reasons as session_lease;
# - the write-transaction helper _write_store (_transaction unchanged; D-1393 K1, K2, C1 (a)): takes the checked
#   realpath, the timeout, the work and check (True by default); builds the URI inside its guarded region (a ValueError
#   of _store_uri, for a UNC path or a path not encodable as UTF-8, or a URI not ending in exactly "?mode=ro", gives
#   "unreadable"); connects with the given timeout through the URI _store_uri gives for
#   the checked realpath with its final "?mode=ro" turned into "?mode=rw" (reading, accepted by round k1b's R5: SQLite's
#   rw mode opens an existing file only, so a store removed between the check and the open is never created; the URI
#   is checked to end in exactly "?mode=ro" before only that suffix is changed; _store_uri percent-encodes any "?" in
#   the path), uri=True, isolation_level None; runs BEGIN IMMEDIATE; when check is True runs _check_schema in its own
#   try (a ValueError gives "tables"); runs the work. The ending: when the work returns a "done" StoreResult, COMMIT;
#   when it returns a refused StoreResult, ROLLBACK and that refusal; when it returns anything else (None among it),
#   ROLLBACK and "unreadable"; any exception raised inside the work (a
#   TypeError from a malformed stored seq among them), a lock held past the timeout, a damaged file, any sqlite error
#   and a failing COMMIT give "unreadable" after a ROLLBACK; ROLLBACK runs only while con.in_transaction is True; close
#   runs in a finally (the connection name set to None before the try); a failing ROLLBACK or a failing close before a
#   successful COMMIT gives "unreadable"; after a successful COMMIT a failing close does not change the result; no
#   exception escapes from ROLLBACK, COMMIT or close; these failures are handled without a bare pass or continue in
#   any handler (by a flag or a returned value; bandit B110, B112, aieos-checks.yml:1708-1710); the "unreadable"
#   findings of this helper name the exception's type ("unreadable: <type name>");
# - the read helper _read_reads for stored_reads: the URI of _store_uri for the checked realpath ("?mode=ro", built
#   inside its guarded region as _write_store's), uri=True, the timeout, isolation_level None; BEGIN DEFERRED;
#   _check_schema in its own try ("tables"); the reads; ROLLBACK only while con.in_transaction is True (so a failed
#   BEGIN DEFERRED skips it, as _read_store's nested try does, writer.py:579-589) and close, in finally blocks, whose
#   failure gives "unreadable"; writes and creates nothing.
# - two new module-level constants: the CREATE TABLE reads statement, named, and also an item of _SCHEMA (so open_store
#   and migrate_store run the same text); and the pre-task tables (TABLES without reads), for migrate_store.
# The new code above the marker uses names defined below it (_store_uri, _KIND_BITS, _REGULAR_FILE,
# _LOOKUP_TIMEOUT_MAX, _check_lookup_root, _check_lookup, _named); Python resolves them at call time; a later move of
# those names must keep them defined in the module. The four private helper names above are fixed: K7's and M1's
# stand-ins, AC8's scripts and the broken copies name them (D-1395 C1 (e)).
# The finding rule, for all four new functions (D-1393 K3): a finding is fixed words and, where an exception is
# named, its type, or the lease count of the "leases" finding (writer.py:572), never a message, a root, a path, a
# session id or a task id.
# The catch-all (D-1395 M1, C1 (b)): each of the four functions wraps everything after its "root" step in one
# "except Exception" (as session_lease, writer.py:669-670); any exception given no named reason gives "unreadable"
# with the finding "unreadable: <exception type name>". It handles only what happens outside _write_store's open
# transaction, or a defect; it never takes the place of _write_store's own ROLLBACK and close. The live-lease
# helper's ValueError (a malformed stored time), raised inside add_reads' work, reaches _write_store's handler, which
# turns it into "unreadable: ValueError", as through session_lease.
# The type rule (D-1393 K9): session_id, task_id and every path must be exactly of type str (type(x) is str); a str
# subclass gives "argument" (session_id, task_id) or "path" (a path), although session_lease accepts a str-subclass
# session id (its _is_str uses isinstance); paths must be exactly a list or a tuple.
# No hook-side module changes; claude_code_store.py and TASK-066's check of its calls (store_path and session_lease
# only, TASK-066.yaml:445-451) stay unchanged (D-1388 C5); nothing calls the new functions yet but the tests. A later
# hook-side caller of add_reads needs that call check widened by its own contract; this task does not widen it.
# The table form (spec 5 :112; D-1388 C2): from this task on, open_store creates the four-table form; every existing
# writer function that opens the store raises on a three-table store, as it does today for any wrong table form
# (_transaction's call of _check_schema at writer.py:265, whose ValueError is raised at :250; open_store's own check), session_lease refuses it "tables", and the four new
# functions refuse it "tables" (migrate_store migrates it); until migrate_store has run. No store exists in this
# repository (.aieos/ is absent at the base, by script) and no hook is placed, so nothing is refused in practice.
# _tables (writer.py:240-245) compares table and column names only: a reads table without the UNIQUE constraints passes
# the check (a stated limit); "each once" and the next seq are held by add_reads' own reads inside its transaction, and
# the UNIQUE constraints are a second guard only; no AUTOINCREMENT and nothing else that adds a table to sqlite_master
# (D-1388 C2).
# The bound (DEF-0084 h4b Y2-11; D-1388 ruling): at most 10000 stored paths per session and task, and at most 4096
# characters per path; a call that would exceed either bound is refused whole ("bound" or "path") and adds nothing;
# cost stated: a long session's later reads are refused, so the record stays a lower bound (spec 5 :73). The bound is
# per session and task: the table's total size stays unbounded across sessions and tasks (a stated limit).
# seq (reading, accepted by round k1b's R5): the first stored path of a session and task has seq 0; specification 2
# :44 says only "first-seen order". stored_reads orders by seq, then rowid.
# The lease's task id (D-1393 K5): add_reads checks the live lease's task_id by isinstance(task_id, str) and
# _TASK.fullmatch(task_id) (the form of _check_task, writer.py:140-142) before any insert; a lease row whose task_id
# fails it (a BLOB or a number among them) gives "unreadable" with the finding "unreadable: the lease's task id is
# not in the writer's form" (a malformed stored value, as a malformed stored time; session_lease does not check it).
# now (as session_lease's docstring, writer.py:600-602): add_reads takes now as an argument; a now earlier than the real
# time would make an expired lease read as live (the fail-open direction), so the later hook-side caller must take now
# from the process clock; stated in add_reads' docstring.
# DEF-0084 points taken, by its own wording (D-1388 C1): h4b Y2-11 "The local store's table reads ... has no bound on
# its size" (the bound above); h4c "reading and removing a session's stored reads" (stored_reads and remove_reads); h4d
# Y1-1's second part "who removes the stored reads after a lease holder's record" (remove_reads, called by the
# launcher after the record is appended or found present); h4c Y2-8 "the write lock that the store lookup takes and its
# refusal cost", for the write path (add_reads takes the write lock like the other writer functions; a call while
# another writer holds it past the timeout is refused "unreadable"); h4d Y2-4 "whitespace-only values" for paths (a
# stored path is a non-empty str of exactly type str, encodable as UTF-8, without NUL, within the length bound;
# whitespace-only kept as given; the raw string, no normalisation, as TASK-064 and TASK-065 keep it); Y2-4's other parts
# (a link or junction as the store file, where the upward search ends) and Y2-8 for the lookup were TASK-066's
# (DEF-0084's log, 2026-10-18), and Y2-8 is taken here for the write path only. Stay deferred in
# DEF-0084: the token-less observe and finding a task's leftover sessions (point 10's contract); h4d Y1-3 "whether the
# core's append accepts a token-less record while an expired lease row of the task is still present", and h4d Y2-6
# "the record's slot against specification 1 §7"; h4c Y1-7 the record's place among spec 1 §7's start steps; h4b Y2-6
# whether the core should refuse a second grant to one session; h4c Y2-10 the lease length; h4c Y3-2 an unreadable
# contract; h4d Y4-6 how the hook's violation path is fenced; h4c Y5-7 and Y5-9 a global placement; h4d Y5-8 beyond
# this task (no core-only path of point 10 is added); the cost of fail closed when a lease expires during a run; the
# hook input's own session_id; h4c Y1-4 "the separation of the hook's entry points from the core-only path and a test
# of it" (this task marks stored_reads, remove_reads and migrate_store core-only and keeps TASK-066's call check, but
# adds no hook entry point and no test of that separation); and h4d Y5-7's second half "D2-4, D2-5 and D3-2's "not a
# holding" named in the text".
# DEF-0085 (D-1388 ruling: it fires per module): this task changes writer.py, so its writer-side points are taken, by
# their own wording (DEF-0085:11-16): "The WAL state ... no test builds a WAL-mode store, and whether a read-only open
# of one reads it or creates its side files is untested" (AC7 (a)); "mutation M9 (the deferred BEGIN) is caught only by
# a source-text check" (AC7 (b)); "AC9's short-name case of the link check is not exercised as written (the stand-in's
# key is never looked up ...)" (AC7 (c)); "the presence and link stand-ins patch functions of the global os module for
# one call" stays a limit only. Its claude_code_store points ("The lexical search (fail-open)", "claude_code_store's
# docstring says any exception inside gives "entry"", "judge's check of now ... and the writer's ... differ", "_map
# accepts "done"/"tied" with a lease on the search path", "mutation J9 is caught only by the unit module") and its
# second trigger ("before any contract lets a hook call act on judge's "enforce_nothing"") stay open; this task lets no
# hook call act on that result (no hook-side caller, and add_reads refuses without a live lease). At acceptance,
# DEF-0085's log records which points closed and which stay open. DEF-0080, DEF-0081 and DEF-0082 stay deferred: this
# task changes none of their modules. DEF-0076, DEF-0077, DEF-0078 and DEF-0083 are not touched.
# Limits (carried at acceptance): C6 and P-LOC unmeasured; no hook placed, no matcher, no setting, nothing measured
# (CC-3, the owner's, A51 item (4)); every limit TASK-061 to TASK-066 carried; the table-check and bound limits above;
# the presence step, the link check and the open are separate steps, and a change between them is not seen (as
# session_lease), for the write path too: a component replaced by a link between the check and the "?mode=rw" open
# would let add_reads, remove_reads or migrate_store write into another existing store of the four-table form; the
# existing writer functions make no link check at all (only session_lease and the four new functions do); a write
# lock held past the timeout refuses a call without a record; stored_reads and remove_reads check no lease, so
# remove_reads can remove the reads of a session whose lease is live (the launcher's order is specification 7's); a
# store migrated while a hook process reads it is a race (the lookup refuses "tables" before and reads after); the
# writer never makes a WAL-mode store, and the existing writer functions' behaviour on one is not tested;
# session_lease's docstring stays byte-identical (D-1389 B4), so its sentences on "the writer's three tables, before
# K1" and on a four-table store being refused (writer.py:626-629) are stale by design, for a later contract to correct;
# a late add_reads between remove_reads and the lease's release is accepted (the lease is live) and stores reads that
# no record uses and nothing removes (the launcher's order, spec 5 :108, narrows it); now is trusted from the caller,
# and a datetime subclass passes _check_time; a COMMIT that fails, or a process that dies after it, may have applied
# the change although "unreadable" is returned, and "each once" makes a retry of add_reads safe; stored_reads has no
# row cap (a store written outside the writer can hold more than 10000 rows of a session and task).
# Risk: high (risk rules revision 6, §2 point 3: R3 matches every path under src/** and tests/**), computed over the
# base by script before commit C. GOV-003: every path of the write-set is an evaluator path by the workflow's pinned
# list, by script; change class critical_cr, as for TASK-060 to TASK-066, ruled at acceptance. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles. Reviews: five way-2 reviews on Sonnet 5.5, a Claude model other than
# the implementer's (Opus 5.5), never Fable (the owner's words of 2026-10-17); and the decision agent's own reviews:
# INV-003's human_review, OPS-002's human_review and the cross-model half, each its own record (D-1148 Q2).
# Records: in the readable form, as TASK-066's; per-entry coverage checked by script before the acceptance request
# (L-0022), and the governor's evaluation over the records reported (D-1098). AC8's checks against the base run as
# acceptance-time scripts over the task's commits, not as tests in tests/.
# Naming (D-544 Q3): every new test function names the AC ids it stands for as "TASK-067 ACn" in its own docstring.
# Evaluation path (A61; as TASK-019 to TASK-066): commit C changes only docs/tasks/TASK-067.yaml and has one parent equal
# to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-067" and no e-mail address in its message, go to
# task/TASK-067 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011; INV-009 (the task touches
# no event log); GOV-001, GOV-004 to GOV-006 and SEC-003 (no path of the write-set meets them). INV-004 applies: the
# writer stays the only module that opens the store.
# Owner-kept acts: none. No hook placed, no matcher chosen, no Claude Code setting, nothing measured, nothing under
# .github/ or .claude/, no push of its own; migrate_store is called only by the tests; it weakens no evidence
# requirement (the changed tests are listed in AC8, each with the rule its check applies, and none is weakened); so its
# acceptance is one delegated approval of the decision agent (Master Plan section 6).
task: TASK-067
contract_version: v1
task_type: implementation
objective: >-
  Add the reads table of specification 2 revision 7 §3 and the read-set accumulation of specification 5 §7 and §11
  point 7 bullet 3 to src/aieos_bootstrap/writer.py in standard-library Python 3: TABLES and _SCHEMA gain the table
  reads (session_id, task_id, seq, path); add_reads(root, session_id, paths, now, timeout=5.0) adds a session's read
  paths under its one live lease, each once, in first-seen order, within a bound; stored_reads(root, session_id,
  task_id, timeout=5.0) reads them read-only; remove_reads(root, session_id, task_id, timeout=5.0) removes them;
  migrate_store(root, timeout=5.0) adds the table to a store of the earlier form. With new test functions in
  tests/unit/test_writer.py, tests/integration/test_writer_files.py and tests/property/test_writer_properties.py, and
  the three existing test functions AC8 names changed as it says, each new test naming its AC ids in its own docstring.
