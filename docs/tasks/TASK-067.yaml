constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The table. TABLES gains 'reads': ('session_id', 'task_id', 'seq', 'path'); _SCHEMA gains one CREATE TABLE reads
      (an ordinary rowid table, not WITHOUT ROWID) with session_id, task_id and path TEXT NOT NULL, seq INTEGER NOT
      NULL, and UNIQUE (session_id, task_id, path) and UNIQUE (session_id,
      task_id, seq), with no AUTOINCREMENT and nothing else that adds a table to sqlite_master; _check_schema's
      refusal text names the four tables. open_store on a new root creates the four-table form; on an existing
      four-table store it opens unchanged; on a three-table store it raises, by its existing check. Every existing
      writer function that opens the store raises on a three-table store, as it does today for any wrong table form;
      session_lease gives "tables"; add_reads, stored_reads and remove_reads give "tables". A reads table whose columns
      match but whose constraints are missing passes _check_schema (a stated limit). On a store open_store makes, a
      duplicate (session_id, task_id, path), a duplicate (session_id, task_id, seq) and a NULL in each of the four
      columns, each inserted through a test connection, raise sqlite3.IntegrityError; sqlite_master holds exactly the
      four tables and their automatic indexes, and no sqlite_sequence; _check_schema's message names reads.
  - AC2: >-
      add_reads(root, session_id, paths, now, timeout=5.0) returns a writer.StoreResult and lets no exception escape:
      "done" with value the number of paths added (0 or more), or "refused" with exactly one finding and the reason of
      the first step that applies, in this order: (1) "argument": session_id not exactly of type str (type(x) is not
      str), empty, or not encodable as UTF-8; paths not exactly a list or a tuple (type(paths) not in (list, tuple));
      now not a timezone-aware UTC datetime in whole seconds; timeout not an int or float, or a bool, or not in
      0 < timeout <= 60 (session_lease's range rule, writer.py:535-536); these checks, in that order, and the snapshot
      tuple(paths) run inside one try whose any exception (a raising tzinfo among them) gives "argument"; every later
      step uses only the snapshot; (2) "bound": the snapshot holds more than 10000 paths (the early bound, after every
      "argument" check and before any "path" check, so a huge list is refused before its items are read); (3) "path":
      an item not exactly of type str, empty, holding NUL, longer than 4096 characters, or not encodable as UTF-8,
      checked inside one try whose any exception gives "path"; a path error is reported before any store read;
      (4) "root": the root not a non-empty str, not absolute, or not an existing folder (session_lease's root rule);
      (5) the presence-and-link helper: "no_store", "unreadable" or "link"; (6) the write-transaction helper's open:
      "unreadable" (a lock held past the timeout, a damaged file, any sqlite error); (7) "tables" (_check_schema, in
      its own try); (8) the live-lease helper of AC4: "no_lease_row", "session", "ended", "unreadable" (a malformed
      stored time of that session's lease rows), "leases"; then the lease's task_id checked against _TASK
      ("unreadable", the header's finding); (9) "bound": a COUNT of the paths already stored for (session, the lease's
      task) is read first, and a count above 10000 refuses "bound" before any path is read; then the stored count plus
      the number of new ones would exceed 10000. Then the snapshot's paths are taken in order; a path already
      stored for (session, task) or repeated earlier in the call is passed over; each new one is inserted with seq one
      more than the largest seq stored for (session, task) (0 for the first; reading), computed by the function's own
      read inside the transaction. All reads and inserts run inside the one BEGIN IMMEDIATE transaction, ended as the
      header's write-transaction helper says. A refusal changes nothing (rolled back, or refused before the store is
      opened). The task is the lease's task, never an argument. Findings follow the header's finding rule; any other
      exception gives "unreadable" by the header's catch-all.
  - AC3: >-
      stored_reads(root, session_id, task_id, timeout=5.0) returns StoreResult "done" with value the list of stored
      paths of (session, task) in the order of seq, then rowid (empty when none), or a refusal with one finding, in
      this order: "argument" (session_id as AC2's; task_id not exactly of type str or not "TASK-" followed by digits,
      the writer's _TASK form; timeout as AC2's; in one try), "root" (AC2's rule), "no_store", "unreadable" or "link" (the
      presence-and-link helper), "unreadable" (open or read, a lock past the timeout included), "tables". It connects
      only through the read helper of the header (the "?mode=ro" URI from the checked realpath, uri=True, the timeout,
      isolation_level None, BEGIN DEFERRED, ROLLBACK and close in finally blocks), writes and creates nothing, and lets
      no exception escape; a stored path that is not a str gives "unreadable" with the finding "unreadable: a stored
      path is not text". remove_reads(root, session_id, task_id, timeout=5.0) removes every stored path of
      (session, task) in one write transaction (the write-transaction helper) and returns "done" with the number
      removed, or a refusal in the order "argument", "root", "no_store"/"unreadable"/"link", "unreadable", "tables";
      it reads no event log, removes nothing else and lets no exception escape; its count is the DELETE's rowcount.
      Neither checks a lease (the launcher calls them outside the runtime session, spec 5 :108): both work for a
      session with no lease, an expired lease, an ended session and an unknown session id. Findings of both follow the
      header's finding rule; any other exception gives "unreadable" by the header's catch-all.
  - AC4: >-
      The shared rule (D-1388 C4). The live-lease helper of the header is called inside the caller's transaction by
      both _store_answer's session branch and add_reads, in the order no_lease_row, session, ended, the parse of that
      session's lease times (a malformed one raises ValueError; each caller gives "unreadable"), leases, as TASK-066 AC2
      states it. session_lease's results are unchanged: every result, reason and finding string it gives today is
      byte-equal (for example "no_lease_row: the store holds no lease row", "session: no session with this id",
      "unreadable: ValueError"), its session_id-None branch stays in _store_answer, and every TASK-066 test of
      session_lease passes unchanged except the three AC8 names. An unknown session on a store with no lease row gives
      "no_lease_row" through both session_lease and add_reads. A property test over generated store states (no lease
      row; unknown, ended and started sessions; zero, one and two live leases of the session; expired leases) with
      valid arguments only (paths that pass "path", under both bounds) shows that session_lease gives "tied" exactly
      when add_reads accepts, and that on refusal both give the same reason; it compares the lease state only (the link
      and table steps are the same steps in both, AC3 and AC5's tests cover them), and only over well-formed lease rows
      (task ids in the _TASK form): a lease row whose task_id fails the form gives "unreadable" through add_reads and
      may give "tied" through session_lease, which does not check it; that case is tested on its own (D-1393 K5,
      C1 (c)).
  - AC5: >-
      migrate_store(root, timeout=5.0) returns StoreResult "done" with value "migrated" or "current", or a refusal with
      one finding, in the order "argument" (timeout as AC2's), "root" (AC2's rule), "no_store"/"unreadable"/"link" (the
      presence-and-link helper), "unreadable" (open, a lock past the timeout, any sqlite error), "tables"; it lets no
      exception escape. It runs through _write_store with check=False (D-1393 K2), so its work, inside the one BEGIN
      IMMEDIATE transaction, runs these points in order, with this table of outcomes (D-1395 C1 (a); it replaces
      D-1393 C1 (b)'s wording, by D-1395): (P1) the probe, the unchanged _check_schema: passes: "current" (nothing
      changed; committed with no change); ValueError: not a result, go to P2; sqlite3.Error: "unreadable";
      (P2) _tables compared with the new private constant of the pre-task tables: differs: "tables"; equal: go to P3;
      (P3) the named CREATE TABLE reads constant run: sqlite3.Error: "unreadable"; any other exception: "unreadable:
      <type>" by the catch-all rule; done: go to P4; (P4) the unchanged _check_schema again (so the store-row rule is
      checked once, by _check_schema itself): passes: "migrated" (committed); ValueError: "tables"; sqlite3.Error:
      "unreadable". Every refusal is rolled back, so the store is unchanged. Any other form (a leftover reads table of
      other columns, an extra table, a missing table) gives "tables" at P2; a pre-task form with not one store row gives
      "tables" at P4. Nothing else changes: the other tables' rows and the
      store row are equal by a dump before and after. It never creates a store ("no_store" when none; the "?mode=rw"
      open). After "migrated", every writer function reads the store as a four-table store. Findings follow the
      header's finding rule; any other exception gives "unreadable" by the header's catch-all.
  - AC6: >-
      What the module imports and does (INV-001 to INV-004). writer.py's change adds no import (its imports stay within
      tests/unit/test_writer.py:410's set); every execute call in writer.py takes as its query a str constant (implicit
      concatenation of constants included), a module-level name bound to a str constant, or a name bound by a for loop
      over _SCHEMA, with ? parameters (an in-suite AST check over the whole module: no f-string, "%", "+", call,
      subscript or other expression as the query); it reads no clock; writer.py stays the only module
      that opens the store; claude_code_store.py is unchanged, and TASK-066's AST check of its calls passes unchanged.
      At the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC7: >-
      DEF-0085's writer-side points. (a) WAL: a test in tests/integration/test_writer_files.py builds a store by
      open_store, sets it to WAL mode on a test connection (PRAGMA journal_mode=WAL; the test may use sqlite3 there),
      closes that connection, and takes the store's bytes and the list of files under the project-state directory; it
      then calls session_lease and stored_reads and asserts, for each, that the result is either "refused" with reason
      "unreadable" or the right answer (session_lease "tied" with the lease; stored_reads "done" with the stored list),
      and that the store's bytes are unchanged. Whether a file appears beside the store (a -wal or -shm file a
      read-only connection may create when the folder is writable) is recorded as an observation in the test's output,
      not asserted; if one appears, or if the bytes change, the worker brings the raw result to the decision agent
      before commit (D-1362 C6's form), and changes no text of session_lease for it. Limit stated: the disjunction
      cannot fail for code that always refuses "unreadable"; it guards the bytes and the answer's form only.
      (b) M9: a behavioural test records the statements each connection runs, by set_trace_callback on the real
      connection (a stand-in for writer's sqlite3.connect for one call returns the real connection with the callback
      set, since sqlite3.Connection's execute cannot be patched), and shows that session_lease and stored_reads run,
      by each statement's leading keyword matched case-insensitively, only BEGIN DEFERRED, SELECT and ROLLBACK (so the
      table check's SELECT over pragma_table_info is allowed), never BEGIN IMMEDIATE. (c) The short-name case: TASK-066's
      test_case_and_separator_differences_are_not_links (class R13PresenceAndLink) looks up a root given in a short
      form, keys its realpath stand-in on the paths that lookup really reaches (store_path of that root and that root),
      counts the stand-in's hits, and asserts that each keyed path was looked up at least once and that the result is
      not "link"; its assertions at tests/unit/test_writer.py:813-814 and :818 (the real lookup of the short-form root
      giving 'tied') stay present and unchanged. R13's class-level helpers (with_realpath, lookup, with_lstat) stay
      byte-identical: the strengthened test calls writer.session_lease with the short-form root itself and carries its
      own counting stand-in.
  - AC8: >-
      Its own tests and the changed ones (GOV-003). Every new test function names the AC ids it stands for as
      "TASK-067 ACn" in its own docstring; no other task's AC is named in qualified form in a new test. In the three
      writer test files every top-level and class-level function and class present at the base is byte-identical
      after the change and none is removed, and nothing else in them changes but added functions and classes and the
      imports they need, except exactly these three functions: (1) tests/unit/test_writer.py
      R11SessionLease.test_tables_of_another_form: a table named reads now exists, so the extra-table case uses another
      name (a fifth table) and the drop removes that table; (2) tests/integration/test_writer_files.py
      StoreLookupFiles.test_no_case_changes_the_store_or_its_folder: its CREATE TABLE reads (:144) creates another
      name instead; (3) tests/unit/test_writer.py R13PresenceAndLink.test_case_and_separator_differences_are_not_links:
      AC7 (c). The acceptance-time script by source segment over the AST lists every changed definition and refuses
      any not on this list; for each listed function it compares the assertion calls (calls of self.assert* and of the
      class's refused helper), as an ordered sequence of source segments, of the base and the head, and refuses unless
      the base's sequence is present unchanged and in order at the head (the head may add assertions) except, for (3)
      only, the one at tests/unit/test_writer.py:817 (assertNotEqual 'link'), which AC7 (c)'s assertions strengthen;
      :813-814 and :818 must stay; for (1) and (2) it also checks that the base and head function sources are equal
      after the token reads is replaced by the new table name (so their docstrings stay as they are; (1)'s "a fourth
      table" is stale once reads exists, accepted and stated; (2)'s docstring names no fourth table and stays true);
      for (2) it also checks that the final reasons set is
      equal to the base's ({no_store, no_lease_row, lease_row_without_session, session, ended, leases, tied, tables}).
      Each acceptance-time script of AC8 is also run once against a deliberately weakened copy (one assertion deleted
      from a listed test; an unlisted base test edited; an existing writer definition edited) and must exit nonzero;
      the raw outputs go to the decision agent (AC6's query rule is an in-suite check, exercised as AC9 R6 says). At
      acceptance the whole tests/ suite passes at the head, and a grep of tests/** for "CREATE TABLE reads", "TABLES",
      "_SCHEMA", "sqlite_master", "pragma_table_info" and "reads" lists no hit that the change breaks outside the three
      named functions (raw output reported); a hit outside the write-set escalates (needs_out_of_scope_change). writer.py: every function, class
      and module-level assignment present at the base is byte-identical except TABLES, _SCHEMA, _check_schema (its
      message) and _store_answer (its session branch calls the AC4 helper), each change stated; session_lease is
      byte-identical, its docstring included (so the words test_writer.py:875-881 pins stay); the module docstring
      may change, keeping the four phrases test_writer.py:869-870 pins, and only to name the reads table in its store
      list and add TASK-067's lines and limits; every added top-level definition is one of the four functions or
      private (its name starts with "_"); an acceptance-time script lists every changed definition and refuses any
      other. Before each commit the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns,
      each count 0. Every test is buildable under deterministic_rule (as TASK-066 AC8: real stores, sqlite3 and
      tempfile only in the three writer test files; no mkdir or makedirs, exec, compile, __import__ or importlib; open
      only in "rb" or "ab"; no link or folder created; no real path of this machine's user folders, no real session id,
      no credential-shaped string, no literal "/tmp").
  - AC9: >-
      Tests, each rule with at least one passing and one failing case, over real stores in the writer test files: R1
      AC1 (the four-table form created; a three-table store, built by a test connection dropping reads, raising or
      refused by each function as AC1 says; a reads table without the constraints passing; the IntegrityError cases,
      the sqlite_master contents and _check_schema's message of AC1); R2 AC2 (each reason, in order, a case where two
      apply showing the earlier wins: an argument and a path error, an early bound and a path error, a path error on a
      store with no lease row; a raising tzinfo; a lone-surrogate session id and path; a str subclass as session id
      ("argument") and as path ("path"); a list subclass as paths ("argument"); a non-list paths; an added path, a
      repeated path in one call, a path stored before; the seq values read directly through a test connection (0, 1, 2
      across calls, and after a gap made by a test connection the next seq is the largest plus one, not the count);
      two tasks of one session kept apart (a lease released and another granted); the bound at exactly 10000 and one
      over (early and stored); a 4096- and a 4097-character path; NUL and empty paths; a whitespace path kept; a held
      write lock (another connection's BEGIN IMMEDIATE) with timeout about 0.2 giving "unreadable"; the timeout passed
      to connect, by a connect stand-in recording its arguments; a garbage store ("unreadable") and a 0-byte store
      ("tables"); a three-table store giving "tables"; a lease row whose task_id fails _TASK giving "unreadable" with the
      header's finding; a malformed stored seq (a test connection) giving "unreadable"; a tuple of paths accepted; an
      empty list giving "done" 0 with a live lease and refused without one; each bad timeout (a bool, 0, 61, inf, nan,
      a str, None) and each bad now (naive, a fraction of a second, another offset, a date, a raising tzinfo) by name;
      the mixed bound case (9999 stored, one new and one duplicate accepted; two new refused); a numeric-looking path
      ("007", "1e3") read back unchanged as text; the store's rows unchanged after any refusal); R3 AC3 (stored_reads'
      order, a seq tie on a reads table without the constraints ordered by rowid, empty, each refusal, bytes unchanged,
      a stored path that is not a str giving "unreadable"; remove_reads' count, only that session and task removed, its
      "argument", "root", garbage and 0-byte cases; stored_reads and remove_reads working for a session with no lease,
      an expired lease, an ended session and an unknown session id (D-1395 M2); stored_reads' read helper failing at
      ROLLBACK and at close (a connect stand-in), giving "unreadable", and a failed BEGIN DEFERRED skipping ROLLBACK; for each of the four functions the presence-step reasons "no_store",
      "unreadable" (an lstat OSError and a ValueError) and "link" (a directory, a raising realpath, a realpath
      elsewhere) by the stand-ins of TASK-066's R13PresenceAndLink form, in one parametrised test that also asserts
      session_lease gives the same reason and finding over the same stand-ins); R4 AC4 (the helper's reasons in order
      through both callers, an unknown session on a store with no lease row among them; the property test of agreement
      over well-formed lease rows; the malformed-task_id case on its own; D-1395 M3: a test asserts session_lease's exact
      finding tuple for each refusal reason with fixed text (no_lease_row, session, ended, leases with its count,
      "unreadable: ValueError" for a malformed stored time, lease_row_without_session), the strings copied by hand from
      the base text of writer.py:556-572 and never imported from the module); R5 AC5 (migrated, current, a leftover
      reads table of other columns, an extra table, a missing table, two store rows, a pre-task form with a bad store
      row (P3 runs, P4 refuses "tables", the store unchanged), no store; its "argument", "root", "link" and held-lock
      "unreadable" cases; rows unchanged by a dump; after "migrated" each writer function reads the store as a
      four-table store; D-1395 M5: every cell of AC5's table driven, the store unchanged after each refusal: the probe's
      and the second check's ValueError and sqlite3.Error by a stand-in for writer._check_schema keyed on its call
      count, and the CREATE's sqlite3.Error and another exception by a connect stand-in that returns a wrapper around
      the real connection whose execute raises for the CREATE TABLE reads text (sqlite3.Connection.execute cannot be
      patched; D-1395 C1 (c)); the write helper's ending (K1): a normal call of add_reads, remove_reads and migrate_store
      each returns "done" with its change present; a refusal returned by the work leaves the store unchanged; a failing
      close after a successful COMMIT (a connect stand-in) still returns "done"; a failing COMMIT (a stand-in) gives
      "unreadable" with the store unchanged; a work result that is not a StoreResult (a stand-in work) gives
      "unreadable" with the store unchanged; the "?mode=rw" reading (K7, D-1393 C1 (d)): a stand-in for _store_present
      returns the root joined with a made-up file name (a missing file in an existing folder; no mkdir, makedirs,
      remove or unlink), a connect recorder shows the open was reached with a URI ending "?mode=rw", and add_reads,
      remove_reads and migrate_store give "unreadable" with no file created; the rw URI changes only the final suffix
