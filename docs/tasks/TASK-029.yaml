acceptance_criteria:
  - AC1: >-
      The builder's interface. build_records(task_id, contract_version, evaluated_commit, intent_versions, values,
      coverage_contract, recorder, source_class='deterministic_tool_local') takes task_id, a str of the form
      TASK-<digits>; contract_version, "v" followed by digits; evaluated_commit, a full lowercase hex commit id (40 or
      64 digits); intent_versions, a non-empty dict from non-empty str ids to "v" followed by digits (the form
      records.check_record accepts); values, a dict in governor.derive_inputs's form whose policy_version is a
      non-empty str; coverage_contract, the contract mapping ac_coverage.check reads; recorder, a non-empty str;
      source_class, deterministic_tool_local or deterministic_tool_external_ci. It returns a list of records in the
      order risk_class, evidence_profile, then the AC coverage record when there is one. Any other value, or
      governor.derive_inputs raising, raises ValueError naming the argument or the step, and nothing is returned. It
      reads no file, clock or environment and changes none of its arguments.
  - AC2: >-
      The risk_class record. Its value is governor.derive_inputs(values with the contract's risk set to "low")["risk"]
      (reading: the class the policy's rules give, without a higher declared risk), one of low, medium, high and
      critical, or None where derive_inputs gives none. The record has exactly the keys record_id, fact_kind
      "observation", source_class, recorder, subject (task_id), evidence_type "risk_class", risk_class (the value, None
      written as null), commit (evaluated_commit) and intent_versions (a copy of the argument); record_id is the
      SHA-256 hex digest of "risk-class", task_id, evaluated_commit and values["policy_version"] joined by LF.
  - AC3: >-
      The evidence_profile record. Its value is governor.derive_inputs(values)["evidence_profile"], a list of
      {dimension, evidence_types} copied so that changing the record changes nothing else, or None where derive_inputs
      gives none. The record has exactly the keys of AC2 with evidence_type "evidence_profile" and the key
      evidence_profile in place of risk_class; record_id is the SHA-256 hex digest of "evidence-profile", task_id,
      evaluated_commit and values["policy_version"] joined by LF.
  - AC4: >-
      The AC coverage record. ac_coverage.check(coverage_contract) gives the findings, and
      ac_coverage.coverage_record(task_id, contract_version, findings, recorder, source_class) the record, both
      called unchanged; it is in the list only when that record is not None (there are findings). Its record_id is
      coverage_record's own (once per task and contract version, specification 4 §10).
  - AC5: >-
      Form. Every record build_records returns gives no finding from records.check_record as extended by AC7, and the
      record ids in one list are distinct.
  - AC6: >-
      The caller. record_evaluation(root, task_id, contract_version, evaluated_commit, intent_versions, values,
      coverage_contract, recorder, now, source_class='deterministic_tool_local', append=None) calls build_records
      with its arguments; a ValueError from it gives result "refused", reason "argument", with a finding, and append
      is not called. Otherwise, for each record in order, it calls append(root, "record.added", record, event_id,
      now, recorder, task_id=task_id), with no fencing token, where event_id is the SHA-256 hex digest of
      "record.added" and the record_id joined by LF; a writer result "appended" is reported as appended and
      "duplicate" as already written; any other result, a result whose "result" is not a str, or append raising,
      stops the loop with result "refused", reason "store" and the writer's findings, and the records after it are
      not appended. append defaults, at call time, to writer.append_event. It returns a dict with exactly the keys
      result ("written" when every record was appended or already written, else "refused"), reason (None, "argument"
      or "store"), records (per record, its record_id, event_id and "appended", "duplicate" or "not appended") and
      findings (a list of str); no exception escapes it. now is passed through as the writer takes it.
  - AC7: >-
      records.py. RECORD_KEYS gains risk_class and evidence_profile. check_record gives a finding, under rule names
      beginning "6.2:audit_copy", for a record whose evidence_type is risk_class or evidence_profile and whose
      fact_kind is not observation; whose source_class is neither deterministic_tool_local nor
      deterministic_tool_external_ci; that lacks its own key, or carries the other one; whose key's value is not
      null or, for risk_class, one of low, medium, high and critical, or, for evidence_profile, a list of mappings
      with exactly the keys dimension (a non-empty str) and evidence_types (a list of non-empty str); that lacks
      commit or intent_versions; or that carries outcome, gate, blocking_kind or dimension. A record of any other
      evidence_type, or with none, that carries risk_class or evidence_profile gets a finding too. The new rules are
      one helper whose findings all begin "6.2:audit_copy" and which gives none for a record that carries neither key
      and neither name, so check_record's findings for such a record are those of the rules it had at base_commit: the
      existing tests pass unchanged, and a test runs the helper over every record of every docs/records/*.jsonl file
      (read with Path.read_bytes, as the existing tests read repository files) and finds none.
  - AC8: >-
      The governor is unchanged in what it decides. For records given to governor.evaluate together with the audit
      copies build_records returns for the same task and evaluated commit, the decision record equals the record
      given without them in every key except reverify and uncovered, which may name them; tested over request, input
      and record sets reaching each table row the governor's own tests reach, including the INSUFFICIENT_EVIDENCE and
      error records, with audit copies well formed, bound to an earlier commit, and malformed in each AC7 way (a
      malformed one that carries outcome blocking still blocks, as rule 4 says: the test shows its effect and that a
      well-formed one has none).
  - AC9: >-
      No repeated record (decision D-652 C4, reviewer Y4's finding Y4-7(b)). Each audit copy is appended under an
      event id derived from its record id, so a second record_evaluation for the same task, evaluated commit and
      policy version gives "duplicate" for each record and appends nothing; a test drives record_evaluation twice with
      an append stand-in that keeps an in-memory log and appends through eventlog.append (the writer's own append
      rule, which gives "duplicate" for a repeated event id; no file and no temporary directory, which the CI's
      deterministic_rule refuses outside the writer's own tests), and shows that the log then holds one record.added
      per record_id and passes records.check_log, so a later evaluate_task, which takes the task's records from the
      log, is given no repeated record_id by them.
  - AC10: >-
      Purity and imports. verification_records.py imports only hashlib (and copy if used) from the standard library
      and governor, ac_coverage, records and writer from the package; it starts no process, opens no file, reads no
      clock or environment and makes no network or model call; the only call that can write is append. A script check
      in the tests parses the module (ast) and asserts the imports and the absence of open, subprocess, os, time,
      datetime.now, socket and environ.
  - AC11: >-
      Tests and the added text. Each AC has tests with at least one passing and one failing case: AC1 (each argument
      wrong in turn; derive_inputs raising); AC2 and AC3 (the exact records and ids for a classified change, an
      unmatched path giving null, a higher declared risk not raising the risk_class value, an underivable profile
      giving null); AC4 (a contract with findings, one without); AC5; AC6 (the exact append calls and event ids;
      appended, duplicate, a refused result, a non-str result and a raising append, each stopping the loop; a build
      failure); AC7 (each finding and its absence; the base records); AC8; AC9; AC10. Unit tests in
      tests/unit/test_verification_records.py and tests/unit/test_records_audit_copies.py; property tests in
      tests/property/test_verification_records_properties.py (standard library only, fixed seeds): random changed
      paths and policies give a risk_class record whose value is never lower than any matching rule's class and is
      null exactly when a path matches no rule, and random audit copies never change governor.evaluate's decision.
      Every test this task adds names the AC ids it stands for as "TASK-029 ACn" in its own docstring; before each
      commit the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0.
      tests/run_tests.py, unchanged, runs all groups.
  - AC12: >-
      The module's docstring states what it builds and appends, the reading of AC2 and that the evidence_profile value
      rests on the governor's own risk, which a higher declared risk may raise, so the two records may rest on
      different classes, and its limits: the values are the
      writer's statements and not the governor's, whose rules and inputs are unchanged (specification 4 §12 point 10
      stays open); the policy version is not on the record (specification 2 revision 4); at most one record of each
      name per task and evaluated commit is the caller's duty; no evidence.stale event, reconciliation or drift; no
      lease, state effect or Git read; records.py does not gain session, ci_run and acs (DEF-0051, line 24).
