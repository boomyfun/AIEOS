# Task contract TASK-029, the audit copies of specification 4 section 10 (Master Plan revision 3, §4 M4; specification
# 4 sections 4, 6, 8 and 10; specification 2 revision 4, section 6.2). Revision 0, drafted under decisions D-646 (the
# choice of the step), D-647 (the scope note, its order and its rulings), D-652 (C4) and the approval of specification 2
# revision 4 (DM F37), brought for approval in its own request; whether it is approved is recorded in the decision
# files, not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-021 to
# TASK-028. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds:
# - one module, src/aieos_bootstrap/verification_records.py: a pure builder, build_records, of the audit copies that
#   specification 4 section 10 asks to be written at an evaluated commit (the risk class of section 8 and the evidence
#   profile of section 4 item 1, in specification 2 revision 4's form) and of the AC coverage record of section 6
#   item 1 for the contract version (ac_coverage.coverage_record, unchanged); and a small caller, record_evaluation,
#   that appends each built record once as a record.added event through the single writer (INV-004), under an event
#   id derived from the record id, so that a rerun gives the writer's "duplicate";
# - in src/aieos_bootstrap/records.py, the two keys of specification 2 revision 4 and its audit-copy form rules in
#   check_record, so that revision 4's "once a task extends it" is met (decision D-652 C4);
# - the package docstring and __all__.
# The values come from accepted modules, computed again on the caller's values: the risk class from
# governor.derive_inputs with the contract's declared risk set to low (reading: the class the policy's rules give,
# without a higher declared risk, which is the governor's, specification 2 revision 4 section 6.2); the profile from
# governor.derive_inputs on the values as given; the AC coverage from ac_coverage.check and coverage_record. The caller
# of evaluate_task calls record_evaluation beside it with the same values (decision D-647 C2); neither calls the other.
# What it does not do (decisions D-647 and D-652): no change to governor.py or evaluation.py, so the governor reads and
# counts as before and takes no value from these keys (specification 4 §12 point 10 stays open); no evidence.stale
# event and no reconciliation (specification 4 §3 and §7: a later task, with §7 item 1); no constitution or scope
# drift; no lease, no state effect, no task state change (DEF-0030 stays open); no run or write in the CI channel; no
# Git read or write; no file opened except through the writer's functions; no process, network, clock, environment or
# model call; nothing under .github/ and no workflow change; no policy; no frozen fixture.
# Revision 3's keys (decision D-647 C3): records.py does not gain session, ci_run and acs in this task. Allowing them
# would make records that carry them usable before specification 2 section 10 point 11 (how a record's class is
# checked against its channel) is settled; DEF-0051 puts their use after the core's submission path and a specification
# 2 revision that settles point 11, then "a later task implements the check"
# (docs/Deferred/DEF-0051-the-derived-channel.md:24). A limit, stated in AC12.
# Readers of the changed paths (D-263 C3's practice): records.check_record is called by records.check_log (every
# record.added, violation.detected and decision event of a log), by the governor's record sort, by evaluation.py's
# kept records and by ac_coverage.coverage_record; the new rules apply only to records that carry either key or either
# reserved evidence_type name, which no record at the base carries (checked by script over docs/records/ in the
# contract request), so every earlier record's findings stay as they were (AC7). src/aieos_bootstrap/__init__.py is
# read by every module that imports the package and by the CI's G1 build. No module of the repository calls
# record_evaluation yet.
# Risk: high, and change class critical_cr, each computed over the base by script (risk_class29.py and
# gov003_class29.py of the drafting session: every path matches R2 and R3's not-evaluable reading, class high; all six
# paths are GOV-003 evaluator paths). Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test],
# architecture [deterministic_rule], functional [integration_test], security [static_security_analysis] and
# architecture [ai_review (cross-model)], plus the evidence_required of the applicable articles.
# Reviews (as TASK-025 to TASK-028): five way-2 reviews by a Claude model other than the implementer's, and the
# decision agent's three, each brief naming for testing: the two values and their reading (the declared risk set to
# low); the record forms against specification 2 revision 4; the record ids and the event ids; the AC coverage record
# unchanged; that the governor's decision is the same with and without the audit copies; the records.py rules and that
# no earlier record's findings change; the caller's results, duplicates and refusals; that no exception escapes the
# caller; the limits of AC12.
# Naming: every test this task adds names the AC ids it stands for as "TASK-029 ACn" in its own docstring, following
# DEF-0049's convention.
# Evaluation path (A61; as TASK-007 to TASK-028): commit C changes only docs/tasks/TASK-029.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-029", go to task/TASK-029 under their own
# decisions; main receives the task only at its acceptance. The task push's CI base run is a RISK-01 conformance run
# over the set file of DM F35, reported advisory, never MEASURED.
# Not applicable: OPS-001 (the task changes no ref and reads no Git); INV-005 to INV-008, INV-010 and INV-011 (the
# decision engine, the governor's module, evidence records, the replay and the policy meet no path of the write-set;
# records.py is the record checker, not an evidence record); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept
# file, the bound artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of
# the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (CR-002 part 4 limit 8 does not apply:
# the governor's rules and inputs are unchanged, and the new records satisfy no entry), so its acceptance is one
# delegated approval of the decision agent (Master Plan section 6), for the decision agent's ruling.
task: TASK-029
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/verification_records.py, with build_records, a pure
  builder of the audit copies of specification 4 section 10 at an evaluated commit (a risk_class record and an
  evidence_profile record, in specification 2 revision 4's form, their values computed with governor.derive_inputs)
  and of the AC coverage record of the contract version (ac_coverage.check and coverage_record, unchanged), and
  record_evaluation, which appends each built record once as record.added through writer.append_event under an event
  id derived from its record id; extend records.check_record with the two keys and the audit-copy form rules of
  specification 2 revision 4; with unit and property tests, each naming its AC ids as "TASK-029 ACn".
