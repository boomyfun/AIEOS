acceptance_criteria:
  - AC1: >-
      The replay. replay_execution(repo, log_bytes, record_index, accepted_engines) returns (True, []) for the record at line 13 of the tracked .aieos/events.jsonl at the base commit (the integration test reads it from the repository's own history), and (False, findings) for each of: a changed head_commit, a head_commit that is not a commit, a changed log_seq, a record whose seq is not log_seq + 1, a changed code_sha256 (the engine's hash then differs), a code_sha256 equal to the engine at head_commit but not in accepted_engines, a changed decision, a changed record_id, a changed key of any of the 25 keys the probe compared, a missing resume_check.py at head_commit, a log that records.check_log refuses, and an exception of any called reader. Every key of the logged payload and of the recomputed record is compared; engine_identity.python is compared for code_sha256 only and its two values are printed.
  - AC2: >-
      The engine. The Resume Check text comes from head_commit through base_files.read_file and its SHA-256 is that of the text encoded as UTF-8, as launcher.py :506 and :516 compute it (the probe showed that the raw git bytes give the same hash here; the module uses the launcher's way and states the raw bytes as not used). The module refuses to execute any engine text whose hash is not in accepted_engines (the command-line entry takes the pinned AIEOS_PINNED_RESUME_CHECK and, when set, AIEOS_PINNED_RESUME_CHECK_PREVIOUS of the workflow), so a record cannot certify itself with an engine of its own naming. With zero accepted-engine arguments every decision.execution record fails (the finding names the empty list), and a test asserts it.
  - AC3: >-
      The inputs and the limits stated in the module's docstring and printed by the entry: (1) the reader modules (resume_inputs, resume_log_inputs, execution, base_files, gitread, and records, whose check_log the module uses) are those of the commit that the CI checks out, never of a local working tree, and only the engine comes from head_commit; (2) a pass shows that the record is reproducible by the checked tree's readers and the pinned engine, NOT that it is what head_commit's readers computed; (3) any difference, including one that a later reader change causes, fails closed, with no skip list; (4) the remedy named for a historical record that a reader change makes differ is loading the readers from head_commit, to be ruled on by the decision agent (D-6314 C3); (5) runtime.max_risk is taken from the record, because it comes from the launcher's declaration read (launcher.py :519-539), which the replay does not repeat; (6) the held lease is None and `now` is a fixed constant, which only the argument checks of task_view use; (7) the Python of the CI runner may differ from the recorded python, which is reported only; (8) one record was probed before this task (D-6313); this task's tests are the evidence for the others.
  - AC4: >-
      Acceptance records. The command-line entry exits 1 on every decision.acceptance line and prints "NOT REPLAYED: decision.acceptance" with the record_id; no acceptance record is replayed, skipped or counted as passing. A test with an acceptance line asserts exit 1.
  - AC5: >-
      The command-line entry: `python src/aieos_bootstrap/decision_replay.py <repo> [<accepted engine sha256> ...]` (or the module's main(argv)) lists the tracked files named events.jsonl or ending in /events.jsonl (git ls-files), reads each at HEAD, replays every decision.execution line, prints one line per record "REPLAYED <record_id> <path>:<seq> ok" or "FAIL ...", a final summary, and exits 0 only when every decision record in the tree was replayed and passed (no decision record at all also exits 0, as the present step does). A test runs it over a scratch repository.
  - AC6: >-
      Purity (INV-001, INV-002, INV-004). The module imports the standard library and the readers named above, opens and writes no file, reads no clock and no environment variable (the entry takes the accepted pins as arguments), starts a process only through gitread's read forms, makes no network call and no model call, and never raises (every failure is a finding). Executing the engine text is the one dynamic act; it happens only after the hash is accepted. The new text uses none of the words MEASURED, ENFORCED and GUARANTEED.
  - AC7: >-
      Tests and suite. tests/unit/test_decision_replay.py holds the cases of AC1, AC4 and AC5 over stand-ins and a scratch git repository it builds; tests/integration/test_decision_replay_real_record.py replays the real record of the repository's history (line 13 at the base commit); no test is skipped. The whole suite passes locally (`timeout 110 python tests/run_tests.py < /dev/null`). The change adds exactly the three write-set files and changes no existing file.
  - AC8: >-
      Class, evidence and the departures. Risk high; the evidence profile is that of docs/pre-genesis/assurance-model.md :82 (high: medium's entries plus functional [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)]; the pair rule :85), as for TASK-131, TASK-135 and TASK-138: unit_test, integration_test (AC7), deterministic_rule, static_security_analysis, ai_review by a pair of reviews on Haiku 5.5 in their own sessions (D-6206; same-vendor, not cross-model: stated as a departure), a per-article review and a separate decision_agent_review. The governor's shadow result at the GOV-003 row is a stated departure as in TASK-125 to TASK-138, and the run-made evidence gap (DEF-0136) is stated if it shows. The exit condition names the aieos-checks run of the accepted commit; the one stated departure (D-6315 Q1): only the INV-010 replay step of that run may fail, and only because of the existing decision.execution line(s); every other step of that run and the aieos-native run must succeed, shown as unedited run output; and the module's own command-line entry, run locally over the accepted commit, must print REPLAYED ... ok for line 13 and exit 0, with its raw output in the acceptance request. The workflow change then follows as its own A66 decision on an exact diff (the step passes both pins from the job's env, the second only when set), then a green main, then TASK-138; no other task is accepted in between. This task changes no workflow and installs no hook or setting.
