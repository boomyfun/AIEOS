# Task contract TASK-139 (DRAFT r2; r1 plus the edits E1 to E5 of D-6315; the replay of decision.execution records in CI; ordered at D-6310 (route D), D-6312 C2 and D-6314 C2/C3; session 26136a0a, 2026-11-15).
# Why: the CI step "INV-010 replay" (.github/workflows/aieos-checks.yml :630-669) counts every decision.acceptance and decision.execution line of every tracked events.jsonl and fails on any (D-181 P4, D-236 C2): "no replay recomputes them yet". The first real launch writes a
# decision.execution line into the tracked log (.aieos/events.jsonl line 13, seq 13, committed at 4c859678, pushed at 5b7151ff), so main has been red at that step since the push (finding F-INV010, DEF-0137). Constitution INV-010 (docs/pre-genesis/constitution.md :72-74) asks that
# decisions be recomputable and specification 3 :138 says that a decision is recomputable from its record, the repository and the event log (proposed). A read-only probe (scratchpad run37/probe_replay13.py, D-6313; probe13_out.txt) recomputed that one record with the Resume Check
# loaded from its head_commit and the working tree's readers at the tip: 25 keys compared, 0 differing, record_id and uncovered among them. That is evidence for ONE record, not for every record.
# Not in this task: decision.acceptance records (their replay is a separate task B; this task keeps failing closed on them), the change of .github/workflows/aieos-checks.yml (its own decision under A66, an exact diff, after this task; .github/** is critical by R9 and is forbidden here),
# any change to the launcher, the Resume Check, the writer or any existing module, the starter pin (TASK-138), .aieos/**, docs/**, and any relaunch.
# Risk: high. R3 matches every path under src/** and tests/** until an architecture names the components (risk-rules-gov-aieos.md :18, :36-38); not critical: no docs/specs, no .github, no .claude, no conformance path in the write set (to be computed by script at approval).
task: TASK-139
contract_version: v1
task_type: implementation
objective: >-
  Add the module src/aieos_bootstrap/decision_replay.py and its tests. The module recomputes a logged decision.execution record and reports every difference. For each decision.execution line of a tracked events.jsonl it takes the record's own payload (task_id, head_commit, log_seq, engine_identity.code_sha256, runtime),
  cuts the log at the lines with seq <= log_seq (and checks that the record's own seq is log_seq + 1), reads the Resume Check text at head_commit, hashes it exactly as launcher.py :506 and :516 do (base_files.read_file text, encoded as UTF-8, SHA-256), refuses unless that hash equals the record's code_sha256 AND is an accepted engine pin,
  loads that text as a module, builds the 22 inputs as launcher._inputs does (launcher.py :498-516) with the cut log, no held lease and the runtime taken from the record, calls that engine's check(inputs, code_sha256) and compares the result with the logged payload key by key. It passes only when every key is equal; engine_identity.python is compared for code_sha256 only and the python value is printed, never failed on. Any other outcome (a difference, a missing commit, a missing engine, an unaccepted engine, an unreadable log, an exception) is a failure with its finding, with no special case and no skip list.
  A command-line entry runs it over the tracked events.jsonl files of a checkout and exits 1 on any failure; it keeps failing closed on every decision.acceptance line, printing "NOT REPLAYED: decision.acceptance (task B)".
