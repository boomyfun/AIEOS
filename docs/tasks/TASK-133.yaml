# Placement (Claude's reading, PROPOSED, not text of the constitution): launcher.py:229-231 says "the starter does whatever the caller's code does; the core's own code starts no process". The starter is the CALLER of launch_outside, not part of the core. It lives in a new package directory src/aieos_runtime/, outside src/aieos_bootstrap/ (the core's modules), and is imported by the command's entry line (cli.py) only. No document defines where "the core's source tree" ends; whether this placement satisfies INV-001's review item ("whether an allowed executable ... runs a model", constitution.md:28-29) is an explicit QUESTION for the way-2 review and the decision agent's review. The CI's deterministic_rule (aieos-checks.yml:1579 on) lets only gitread.py import subprocess, knows only the package aieos_bootstrap as its own (OWN), and refuses the builtin open and open-type calls; the starter therefore needs its own workflow revision (OWN gets aieos_runtime; one ALLOW entry for this one path with subprocess; one pattern rule for its single call form pinned to the exact path string; a check that no src/ module other than src/aieos_bootstrap/cli.py imports aieos_runtime, and that cli.py does so only inside its `if __name__ == '__main__':` block; bandit B404, B603 skipped for that one file as for gitread.py): a .github change, critical by R9, its own request and its own A66 decision, BEFORE this task's first build commit is pushed. NOT part of this task (.github/** forbidden). To fit that rule the starter reads file bytes with pathlib's read_bytes (not on the pattern rule's refused list) and hashes with hashlib.
