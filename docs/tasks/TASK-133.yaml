acceptance_criteria:
  - AC1: >-
      Form: starter(env) -> None (launcher.py:1321). It raises, before any process starts, when env lacks a string AIEOS_SESSION_ID (form [A-Za-z0-9._-]{1,128}, mcp_server.py:19-20), AIEOS_ROOT (an absolute path) or AIEOS_BASE (exactly 40 lowercase hexadecimal characters); launch_outside then records "run: the starter raised ..." and still ends the session (launcher.py:1323-1326).
  - AC2: >-
      Executable (D-5985 C3, D-5986 ruling (b)). Constants, verbatim: EXE_PATH = C:\Users\Admin\AppData\Roaming\Claude\claude-code\2.1.321\d0e23af87588\claude.exe; EXE_SHA256 = e6dae5fc45902b15751f2591a02f51760351c4788c5fd8291b3f1443d40c13a4 (346487456 bytes). The other installed copy, d020ce1b5d30, SHA-256 185dbc197835e568c1701f928b9c5b3a3e233731d9ae22f46fb80f5f09ffa1d9 (346487968 bytes), has a version and a --help text byte-equal to the pinned one; which copy the desktop app uses is NOT known and the 512-byte size difference is not explained. No PATH search, no ~, no environment-variable expansion. Before any process starts the starter refuses if the file is missing, is not a regular file, does not end in .exe, or its SHA-256 differs; a .cmd or .bat target is refused outright. Gap stated: the file can change between the hash check and the start. Each update of the desktop app changes the folder name and the hash, so the starter refuses until a new pin, which is its own decision (stated in plain words at acceptance). `claude` is on no PATH on this machine (the four probes of D-5984 C1).
  - AC3: >-
      Argument form, fixed, quoted from the installed --help (2.1.321), passed as a list with no shell, in this order: [EXE_PATH, "-p", PROMPT, "--permission-prompts", "none", "--strict-mcp-config", "--mcp-config", MCP_FILE, "--settings", SETTINGS_FILE]. The prompt follows "-p" at once and never follows the variadic --mcp-config (a test pins the order). NO --setting-sources: the run loads the default sources (user, project, local) plus the --settings file, so the OWNER'S COMMAND GUARD (the PreToolUse hooks of C:\Users\Admin\.claude\settings.json:49-71, user source) stays loaded in the launched run. --permission-prompts none: "nobody: anything that would prompt is denied automatically; the permission mode still decides everything else" (--help lines 155-160): a prompt is denied and never answered in anyone's place; work that needs a prompt stops (stated limit). NO option that skips, pre-answers or widens permissions or tools: no --dangerously-skip-permissions, no --allow-dangerously-skip-permissions, no --permission-mode, no --allowedTools, no --tools, no --add-dir. Effective permission mode and allow rules come only from the settings sources (the user source and the file below); the contract adds none; the two files below set no defaultMode, no permission rule, and never bypassPermissions, auto or acceptEdits. With no allow rule, every edit and command that needs permission is denied: stated.
      The two runtime files (D-5986 M3), OUTSIDE E:\AIEOS because the project-state directory is the core's and a new untracked file in the root gives "root after" (spec-07:50; .gitignore:1-2; spec-07:26): MCP_FILE = C:\Users\Admin\AIEOS-runtime\claude-mcp.json and SETTINGS_FILE = C:\Users\Admin\AIEOS-runtime\claude-settings.json. Their draft content is in the scratchpad (runtime-files\, sha256 of the drafts: claude-mcp.json cbfc039cd668ca362c5713ad5498a3c18eeca7a59505363756e303c81035f882 (315 bytes); claude-settings.json bb9c8724b7e24955f07ea185b045008adcf313dfe9ecc9268a3023c9e75bf26b (619 bytes)); placing them is its own A73 settings decision BEFORE this contract is approved, so the hashes below are final: MCP_SHA256 = cbfc039cd668ca362c5713ad5498a3c18eeca7a59505363756e303c81035f882; SETTINGS_SHA256 = bb9c8724b7e24955f07ea185b045008adcf313dfe9ecc9268a3023c9e75bf26b (equal to the read-back of the placed files, D-5988). The starter refuses when a file is missing, is not a regular file, or its SHA-256 differs.
  - AC4: >-
      Prompt, verbatim, ONE constant string in the module, no file read: PROMPT = "Call the AIEOS tool get_work_order of the connected aieos MCP server, do the work its Work Order describes within its limits, and stop when it is done." The starter has no task id and no Work Order, only the three variables (launcher.py:1321); the server serves get_work_order from AIEOS_SESSION_ID, AIEOS_ROOT and AIEOS_BASE (mcp_server.py:19-20).
  - AC5: >-
      Process form (INV-001): no shell; standard input closed; a pinned working directory, the root (AIEOS_ROOT); a fixed timeout of 6600 seconds (110 minutes, below launch_outside's two-hour lease, launcher.py:1074); on a timeout the process is terminated and the starter raises; a non-zero exit raises; child processes the runtime started may survive its termination (stated limit); the runtime's output is inherited to the console, not captured, stored or parsed. The starter reads no file besides the bytes of the executable and of the two runtime files (for the hashes), and the existence of the two files.
  - AC6: >-
      Environment, a constant list in the module, pinned by a test; nothing else is passed. From the launcher's copy: AIEOS_SESSION_ID, AIEOS_ROOT, AIEOS_BASE (the readers are the hooks and the MCP server). From the starter's own process environment (os.environ; refused if PATH is absent): PATH, unchanged (the owner's guard hooks run `python`, and the runtime's Bash tool needs Git Bash, found through it); SYSTEMROOT, SYSTEMDRIVE, COMSPEC, PATHEXT (Windows process creation and program lookup); USERPROFILE, APPDATA, LOCALAPPDATA (where the desktop app's program and the runtime's own stored login live; Claude Code finds the user settings, and so the owner's command guard, through USERPROFILE; the starter reads none of their content); TEMP, TMP (scratch). PYTHONPATH is NOT passed: the two runtime files set it themselves for the hook and server commands. HOME is not passed. No variable that holds a credential (no API key or token variable) is ever passed; if the runtime's login needs one, that is the owner's (accounts) and the work stops there. Whether the runtime's stored login costs money per use is checked at the first-run decision (money is the owner's).
  - AC7: >-
      No acceptance logic and no event: the module imports no aieos_bootstrap module at all (a test pins the import list), so it can reach none of governor, reconcile, done, writer, execution, records or evaluation. A finish refused "stored_reads" is left to `aieos end` or the lease's expiry (D-3164:31-33). Lease renewal is NOT in this task: a session longer than the timeout is ended by it. A denied permission prompt is NOT detected by the starter (the run goes on and can exit 0); its effect shows only in the run's output and records.
  - AC8: >-
      Carried gaps of done() (DEF-0119, TASK-131), STATED and unchanged: (G1) done()'s reads of the log are not atomic with its append; (G2) the approval_record named by an accepting NEEDS_REVIEW record is checked for form only, not for existence; (G3) the real writer path with a lease has not been run (done() was tested with stand-ins only): the first real run exercises it and must record what it shows. DA-2's limit holds: no caller of the governor, reconcile or done adds acceptance logic beside the governor's.
  - AC9: >-
      Tests: tests/unit/test_claude_starter.py (each refusal of AC1; each refusal of AC2 and AC3 for a missing, non-regular or hash-differing file; the exact argument list of AC3 and the prompt of AC4 against a stand-in process runner; the order of the prompt after "-p"; no shell; stdin closed; the timeout and the termination; a non-zero exit; the environment of AC6 equal to the constant list and refused without PATH; the import list of AC7); tests/unit/test_cli.py (the entry line passes the real starter; main with starter=None still gives NO_STARTER; the help line of AC10; a stand-in starter still works; a test that asserts the old help text is changed only as AC10 states); tests/property/test_claude_starter_properties.py (for random env values a refused input never starts a process, the starter returns no value, the environment passed is a subset of the AC6 list). No test starts a real runtime or writes a file in the repository. The whole suite passes locally (`timeout 110 python tests/run_tests.py < /dev/null`, in slices) and on the CI's branch run; pyflakes silent; the preceding CI revision accepts the module. One more file is changed (the contract's seventh path): in tests/unit/test_gitread.py only the test test_no_other_src_module_imports_subprocess changes: its assertion becomes exact equality to the sorted list ['src/aieos_bootstrap/gitread.py', 'src/aieos_runtime/claude_starter.py'], no looser form (no subset, prefix or at-most-N test); its docstring keeps "TASK-024 AC6" and names TASK-133 as the amending task; no other line of the file changes (the diff is brought at acceptance). The change mirrors the one ALLOW entry of CI revision 20 (STARTER = 'src/aieos_runtime/claude_starter.py'); INV-001's review question stays the one of AC11.
  - AC10: >-
      cli.py edit: the help line (cli.py:151) `launch <task>  launch a session for a task (no runtime starter is shipped)` becomes `launch <task>  launch a session for a task through the pinned runtime starter`; the docstring lines that say the entry line passes no starter (cli.py:8-10, :62-70) are updated to say it passes the starter of src/aieos_runtime; NO_STARTER (cli.py:182) stays for starter=None. Two further changes, in the `if __name__ == '__main__':` block (cli.py:746-747): the import of aieos_runtime.claude_starter is added inside that block, and the entry line at :747 passes `starter=claude_starter.starter`. No other line of cli.py changes: the changed lines are exactly these two, the help line (:151) and the docstring lines named above (the diff is brought at acceptance).
  - AC11: >-
      Evidence profile for critical (assurance-model.md section 5): unit_test, integration_test (a departure if absent, as TASK-128), property/fuzz, deterministic_rule, static_security_analysis, ai_review by the A59/A60 pair (same-vendor, not cross-model), a per-article review, and two separate decision_agent_reviews (assurance-model.md:85). The human_review entries (the architecture entry; INV-003's) are met ONLY as the owner's answer to Q-A allows: if yes, the decision agent's review plus another Claude model's review fill them and the decision matrix records the owner's words; if no or no answer, the task is built and not accepted, and the software is not used until the owner has reviewed it on a plain-words explanation. The GOV-003 shadow result is a stated departure as in TASK-125 to TASK-131 (critical_cr). The question for the way-2 review and the decision agent: does the pinned program count as "an allowed executable that runs a model" under INV-001, and is the placement outside src/aieos_bootstrap/ a valid reading.
  - AC12: >-
      Limits, stated at acceptance (D-5986 M4, M5, M9): the launch itself is NOT done by this task; the first real launch is its own decision under A73 after the gate check (DEF-0095, DEF-0101, DEF-0117) and the pre-run record (master-plan.md:117); -p mode silently ignores settings files that fail validation (--help lines 177-180) and skips the workspace trust dialog (--help lines 172-176), so the first real run's pre-run record must show, in a launched run and before any work: (i) the AIEOS PreToolUse hook REFUSES one call outside the write-set (not only that it fires); (ii) the owner's command guard fires; (iii) the read hook records one read; (iv) the MCP server's status answers with the session's task, which shows that the AIEOS_* values reach it; a hook that fails to start (shell or PYTHONPATH) or exceeds its 10-second timeout lets the call through (stated limit); known stale text, not changed here: claude_code_pretool_hook.py:8-9 says placing the hook is the owner's under A51 item (4), and A73 has since moved settings and hooks to the decision agent; the gap between the hash check and the start; no allow rule means every edit and command is denied, and the effective permission mode and its source are named in that record; the run uses the desktop app's stored login, and whether it costs money per use is the owner's and is checked at the first-run decision; lease renewal; the undetected denied prompt; surviving child processes; what the root-after read does not see (DEF-0101 Log 2026-11-07); a finish refused "stored_reads"; the pin that stops working at each app update; observed 2.1.321 against declared 2.1.317. DEF-0101 may be closed only at this task's acceptance and records step, by a Log line, and only if the acceptance says every open point of the item is met or moved by its own decision (the point "launching with a runtime" is the first real run's).
