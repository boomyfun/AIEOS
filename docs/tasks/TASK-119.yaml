# Facts read (main 711d7a95; Grep, Read): aieos-checks.yml: runs-on ubuntu-24.04 (:160); the CI python is 3.12.3 (the G1 step's `python3 --version` line in the log of run 41921916719, lines 1545, 7216, 7243, 7270); G1 build is `python3 -m compileall -q src tests` (:1499-1507); the bandit step (:1822-1850) installs into a venv with `pip install --quiet --no-deps --require-hashes --only-binary :all: -r requirements.txt` from a requirements file whose lines carry `--hash=sha256:...`, exits at once with "no task" when task.json holds `"task": null`, and fails the job when a run fails (`[ "$S" = 0 ]`); the two embedded EVALUATOR lists (:481 and :551, equal copies, TASK-103 AC2) start with `.github/**`; the bandit step sets no working-directory, runs `cd "$A"` and calls its tool by the absolute venv path (:1827-1849); no `lint` in aieos-checks.yml or aieos-native.yml (the only `lint` hit under .github is aieos-bench.yml:4, the Rust port's own); `lint` in src occurs only at conformance.py:130 (LOW_PAIRS); governor.py :285-319: a tool-produced type is met by a record of source_class deterministic_tool_external_ci with that evidence_type and the entry's dimension and outcome pass (the gate is not read); the records maker of a task holds a fixed list CI of (step name prefix, gate, evidence_type, dimension) rows (make_records_118.py :209-226). The package index (public JSON, saved raw in the scratchpad): pyflakes 4.0.3, wheel pyflakes-4.0.3-py2.py3-none-any.whl, sha256 330ba92b8c1db2eb0b8f4068f6c58674e2649a99e334769aa50e3e9c5b11c23a, requires_python >=3.10, requires_dist null, uploaded 2026-10-07, not yanked; the downloaded wheel's sha256 equals it. pyflakes 4.1.0 (uploaded 2026-10-28, wheel b2e05e6b...97dc1) was not chosen (D-4871: 8 days old).
