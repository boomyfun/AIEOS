acceptance_criteria:
  - AC1: >-
      The module. evaluation_policy.py defines read_evaluation_policy and EVIDENCE_DEFINING_PATHS and nothing else public; it imports re only (a test reads the file with read_bytes and ast, checks the import list, the defined public names and that no open, no subprocess, no os, no time and no environment name is used); the function never raises an Exception: a non-str argument, a very long text and a text of 10000 lines each give a result (a test); the answer has exactly the keys result, sources and findings; sources always has exactly the six keys.
  - AC2: >-
      The grammar of the block (the specification). Item lines and nested blocks are, exactly: owner_kept_rules items "  - match: [<item>, ...]" (a flow list of 1 or more scalars, separated by ", "; here and below "[<item>, ...]" is the notation of such a list, <item> a scalar, and the three dots are notation, not text of the file); articles items as three lines "  - id: <scalar>", "    scope: [<item>, ...]", "    evidence_required: [<item>, ...]" (evidence_required may be "[]" ); requirement_profiles items as "  - id: <scalar>" and "    add:" followed by lines "      - {dimension: <scalar>, evidence_types: [<item>, ...]}"; default_profiles is "default_profiles:" followed by, per risk in the order low, medium, high, critical (any subset, in that order), a line "  <risk>:" and lines "    - {dimension: <scalar>, evidence_types: [<item>, ...]}"; auto_accept is "auto_accept:" followed by lines "  <risk>: true" or "  <risk>: false", per risk in the same order. A test table gives for each of the six keys one accepted block (the returned value compared as a whole) and, for each closed reason of the objective, at least one refused block (the finding's reason compared); the marker "<key>: gap" gives None for exactly that key and leaves the others read; "<key>: []" gives [] for owner_kept_rules, articles and requirement_profiles; "delegation: true" and "delegation: false" give the bools; "delegation: gap" gives None.
  - AC3: >-
      The refusals. Tests: a text with no heading, with the heading and no fence, with the fence never closed, with the block twice (block); a line with a tab, with trailing spaces, with a CR, with a key written with different case (line); an unknown key, a repeated key, a missing key, two keys swapped (key); a risk class not in low, medium, high, critical, a boolean written as True or yes, a delegation value that is not true, false or gap, an empty list where one or more items are needed (value); the scalars 0, 12, 3.5, 1e3, NaN, nan, Infinity, -Infinity, inf, +1, 0x1F (scalar), each in an item position and in a boolean position; an unquoted word with a space (scalar in an item position, value in a boolean position, as the objective's VALUES rule says); a lone surrogate in a quoted item and in a comment line (encoding: the comment case must ALSO be refused, because the text is checked whole before it is read); a repeated id in articles, a repeated risk, a repeated pattern in one list (duplicate). Every refusal returns sources with all six keys None and result refused, never a partial mapping (a test over all the refused cases). Also refused (D-6875 E4): the scalar '' (scalar); a flow list written [a,b] without the space (line); a comment after a value (line); evidence_types: [] and scope: [] (value); an empty default_profiles block and an empty auto_accept block (value).
  - AC4: >-
      The forms meet the governor. A test builds a policy text whose six values are in form (FIXTURE values, not policy: the test says so), reads it, merges the six sources with the other keys of governor.VALUE_KEYS as fixtures and checks that governor.derive_inputs accepts them and that an article read from the text applies to a changed path that its scope matches (the governor's own matches); and that a policy with "articles: gap" read gives articles None, which eval_inputs refuses as reason gap (a test calls eval_inputs with the other eleven sources as fixtures and checks the refusal names exactly articles).
  - AC5: >-
      The policy path (the TASK-152 AC4 rule extended). With docs/specs/evaluation-policy-gov-aieos.md among the changed paths eval_inputs is refused with reason policy_path naming that path (a test in tests/unit/test_eval_inputs.py); the four earlier paths still refuse (the TASK-152 tests stay and pass); the edit of eval_inputs.py is the one added tuple element and two docstring words: "one of the four policy" (:17) becomes "one of the five policy", and "the exact text of four files" (:40) becomes "the exact text of five files"; nothing else of eval_inputs.py changes (a test compares the module's other public behaviour on the TASK-152 fixtures: the TASK-152 test file passes unchanged except for the new test).
  - AC6: >-
      EVIDENCE_DEFINING_PATHS. A test checks that it is a tuple of text paths without duplicates, that it holds exactly the paths of the objective's list, that every one of them is a repository-relative path with no "..", no leading "/" and no "\\", and that it contains the five policy paths of eval_inputs._POLICY_PATHS (the old four and the new one) (a test imports both).
  - AC7: >-
      Nothing else changes. Only the four paths of the write set; no data file; no .github change; the whole suite passes by the slice method (D-6249 C2, D-6328 E1.6); a pin scan of the existing tests (made at approval, brought to the decision agent) shows that no existing test pins the list of _POLICY_PATHS other than test_eval_inputs.py (the same scan as TASK-152's AC8).
  - AC8: >-
      The CI evidence of the task push (pre-registered before the commit exists, as at TASK-150 to TASK-152, with the D-6865 C3 rules: patterns anchored to the exact line form, run counts that name the branch). deterministic_rule 0 findings and no FAIL line; bandit "No issues identified"; the pyflakes step silent; the GOV-003 step reports an evaluator change ONLY as far as the lists contain the touched paths: the new module is NOT on the evaluator lists until its own .github decision (stated, not hidden).
  - AC9: >-
      Limits and evidence, stated at acceptance. (1) The reader checks FORM, not the decision: a file that is in form but holds a wrong policy is read as given; the owner's three elements are BT3c-2's. (2) Until the .github/evaluator-list decision, evaluation_policy.py is not an evaluator path of GOV-003: a change to it is not judged by the base version; stated as an open duty with its own decision. The GOV-003 evaluator-list decision (A66) is taken before the approval of any contract that calls read_evaluation_policy. (3) spec-02 §7 :228 describes the product's project.yaml (autonomy with a level_version per class; default_profiles for v0.1 low and medium only); this file is the self-build's own policy file, as risk-rules-gov-aieos.md is, its reader is not the project.yaml reader, level_version is derived as named in the objective and the grammar accepts all four risks in default_profiles: stated as a departure from that description, not hidden. The derivations of level_version and ruleset_version and the evidence_comparison producer are BT3b-2's and are described, not coded. (4) The list is incomplete against governor-spec :44 ("an evidence entry of a requirement"): BT3b-2 may not give evidence_comparison {weakens: false} for any task until the requirement entities' paths are added by a decided change, or a decision records, with a Grep over every requirement entity, that none holds an evidence entry (the module docstring states the same). (5) Review of the evaluator: GOV-003 :94 and INV-011 :78 bar auto-accept; acceptance is by explicit decision of the decision agent.
capabilities:
  filesystem: {read: [src/aieos_bootstrap/governor.py, src/aieos_bootstrap/scope_reconcile.py, src/aieos_bootstrap/claude_code_shell_allow.py, docs/pre-genesis/governor-spec.md, docs/pre-genesis/constitution.md, docs/pre-genesis/assurance-model.md, docs/specs/risk-rules-gov-aieos.md, docs/specs/spec-02-aieos-file-format.md, docs/runs/TASK-152-acceptance.md], write: [src/aieos_bootstrap/evaluation_policy.py, tests/unit/test_evaluation_policy.py, src/aieos_bootstrap/eval_inputs.py, tests/unit/test_eval_inputs.py]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 400k, wall_time: 3h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7]}
  - {gate: G3, check: constitution, args: [AC8, AC9, INV-001, INV-002, INV-003, INV-004, INV-008, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND the aieos-checks run of the accepted commit succeeds
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
