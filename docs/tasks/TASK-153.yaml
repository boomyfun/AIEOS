# Task contract TASK-153 (DRAFT v3 = v1 with D-6875 E1 to E8 and D-6876 F1 to F5, scratchpad only until approved; session dc7cf6ca, 2026-11-21; BT3c-1, the pure reader of the evaluation policy file, DEF-0152 :33 item 1; decisions D-6796 C5, D-6873, D-6874 (C1 to C4: BT3c is split; this task has NO data file, NO .github change), D-6875 (E1 to E8) and D-6876 (F1 to F5); the id TASK-153 is the next free id after docs/tasks/TASK-152.yaml and is NOT reserved by this draft).
# Authority and scope: BT3c-1 is ONLY a pure module: no process, no file, no clock, no network, no credential, no write to the event log. It reads TEXT that the caller gives (the text of docs/specs/evaluation-policy-gov-aieos.md at the pinned policy_ref, read by the caller through the Git object store as claude_code_shell_allow.read_policy_text does) and returns the policy-file sources in the governor's form. It does NOT create that file (BT3c-2, with one owner question: owner_kept_rules, delegation, auto_accept; D-6874 C4), does not edit any .github file (the GOV-003 evaluator-list edit that adds the new module is its own decision under A66; D-6874 (g)), does not derive level_version or ruleset_version (BT3b-2 computes them: this contract names the derivation), and does not touch evidence_comparison (a per-run input, governor-spec :44).
# Not in this task: the data file, any .github edit, the loader call and the append (BT3b-2), the intent_versions producer, the pin tasks (BT5), the second real run (the owner's typed yes), the change of DEF-0152 (a records item, with D-6874 C3's "at most eight of the ten" correction).
task: TASK-153
contract_version: v1
task_type: implementation
objective: >-
  Add a pure core module src/aieos_bootstrap/evaluation_policy.py with ONE public function read_evaluation_policy(text) that returns a mapping with exactly the keys result, sources and findings, and ONE public constant EVIDENCE_DEFINING_PATHS (a tuple of repository paths; the list of D-6874 (e), with its source lines in the docstring); add the path docs/specs/evaluation-policy-gov-aieos.md to eval_inputs._POLICY_PATHS (a task whose changed paths include it is refused with reason policy_path, as for the four existing files; fail closed although the file does not exist yet). THE FORMAT. The policy file is a markdown file with a heading line "## 3. The sources" followed by one fenced block that starts with the line "```yaml" and ends with the line "```" (the convention of scope_reconcile._block for risk-rules-gov-aieos.md); the reader reads that block only and ignores every other line of the text. Inside the block every line is one of: blank, a comment (first non-space character #), a key line, an item line. KEYS (a closed set of six, exactly once each, in this order): owner_kept_rules, articles, default_profiles, requirement_profiles, delegation, auto_accept. A key line is "<key>:" (a block follows) or "<key>: gap" (the open-gap marker: the source is None) or, for delegation only, "delegation: true" or "delegation: false". owner_kept_rules, articles and requirement_profiles: a list, written either as the key line "<key>: []" (the empty list) or as "<key>:" followed by one or more items in the forms of AC2; default_profiles and auto_accept: "<key>:" followed by one or more risk lines in the forms of AC2 (an empty block is refused, reason value; "<key>: gap" is the way to give no value). Blank lines and comment lines (first non-space character #) may stand between any two lines of the block and are ignored; a comment after a value on the same line is refused (reason line). The exact grammar of the item lines and nested blocks is AC2, which is the specification; the reader accepts nothing else. VALUES are texts only. In a scalar position a scalar is either a bare word that matches [A-Za-z0-9_.:/*-]+ in full, or a single-quoted text of one or more characters with no quote, no backslash and no line break (the quotes are not part of the value); any other token in a scalar position (for example +1, a word with a space, or '') is refused with reason scalar. A bare word is also refused with reason scalar when it is number-like or YAML-special: its first character is a digit; or Python float(word) or int(word, 0) accepts it; or word.lower() is one of nan, .nan, inf, .inf, -inf, -.inf, infinity, -infinity, true, false, yes, no, on, off, null. A quoted text is always a text. The booleans of delegation and auto_accept are the bare texts true and false in their key or risk lines; there, a number-like token is reason scalar and any other value (True, yes, …) is reason value. The reader never reads a number. The reader NEVER raises an Exception and opens nothing.
  THE ANSWER. {result: present, sources: {...}, findings: []} when the block is found and every line is in form; sources is a dict with exactly the six keys of the file, each a value in the governor's form (owner_kept_rules a list of {match: [texts]}; articles a list of {id, scope: [texts], evidence_required: [texts]}; default_profiles a dict from risk to a list of {dimension, evidence_types: [texts]} (only the risks written; a risk not written is absent, so governor.derive_inputs gives profile None for it: fail closed); requirement_profiles a list of {id, add: [{dimension, evidence_types}]}; delegation a bool; auto_accept a dict from risk to bool) or None for a key marked gap. {result: refused, sources: {all six keys None}, findings: [...]} for ANY departure: the findings are a closed set of reasons: argument (the text is not a str), block (the heading or the fence not found, or found twice), line (a line not of the grammar), key (an unknown, a repeated, a missing or an out-of-order key), value (a value outside the form of its key), scalar (a number-like or non-text scalar), encoding (a text that UTF-8 cannot encode: a lone surrogate), duplicate (a repeated id in articles or requirement_profiles, a repeated risk, a repeated pattern in one list). No partial answer: one departure refuses the whole file and gives no value, as eval_inputs refuses on any gap (never a half-read policy). On a refusal findings holds exactly one finding {reason, line, detail}: reason one of the eight; line the 1-based line number of the text where the departure is, or None for argument and block; detail a short text. It is the first departure in this order: argument, encoding (the whole text, the line of the first lone surrogate), block, then the block's lines from the top. On present findings is [].
  WHAT IT DOES NOT DO. It does not check that the values are the decided policy (the file's content is BT3c-2's, and the owner's for owner_kept_rules, delegation and auto_accept); it does not read the repository; it does not derive level_version, ruleset_version or evidence_comparison (below); it adds no source to eval_inputs: BT3b-2 calls it.
  DERIVATIONS NAMED FOR BT3b-2 (not coded here; D-6874 (f), C2): ruleset_version := the text "governor-sha256:" followed by the sha256 of src/aieos_bootstrap/governor.py read at the pinned policy_ref, and BT3b-2 refuses if it differs from the CI's AIEOS_PINNED_GOVERNOR value that the same run printed (that pin equals the governor.py hash today: the TASK-152 contract's intent_versions line for governor.py, 2f2dcd75...); level_version := the text "L1:" followed by policy_version, where L1 is the level in force for every risk class of the self-build (assurance-model :90, spec-04 :93) and is NOT a value of the policy file; if that ever changes, the derivation changes by a change request. evidence_comparison := {weakens: false} only when no changed path is in EVIDENCE_DEFINING_PATHS, otherwise NO value (an open gap and a refusal) or the owner path: governor-spec :44.
  EVIDENCE_DEFINING_PATHS (D-6874 (e), C2), with the lines each is taken from: docs/pre-genesis/constitution.md (governor-spec :44 "an evidence_required entry of the constitution, or the scope, applicability or severity of an article"); docs/pre-genesis/assurance-model.md (the default profiles, :76-:84, :95-:96); docs/specs/risk-rules-gov-aieos.md (governor-spec :44 "the policy's risk rules"); docs/pre-genesis/decision-matrix.md (the pinned delegation and the approvals the policy mirrors; eval_inputs._POLICY_PATHS); docs/specs/evaluation-policy-gov-aieos.md (the new policy file); src/aieos_bootstrap/governor.py (governor-spec :44 "this governor's rules on which records satisfy an entry"); docs/pre-genesis/governor-spec.md (the definitions of the inputs, :43-:44 and :196); src/aieos_bootstrap/evaluation_policy.py and src/aieos_bootstrap/eval_inputs.py (the modules that give the sources). NOT in the list because their location is not established: the requirement entities (where a requirement's evidence entries live was NOT found: D-6874 (d)). The list is therefore incomplete against governor-spec :44 ("an evidence entry of a requirement"): BT3b-2 may not give evidence_comparison {weakens: false} for any task until the requirement entities' paths are added by a decided change, or a decision records, with a Grep over every requirement entity, that none holds an evidence entry. Shrinking this list later is itself a weakens-evidence change (D-6874 (e)).
