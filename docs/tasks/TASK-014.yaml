acceptance_criteria:
  - AC1: >-
      The set file, byte for byte. At the task's commit, tests/conformance/set.py has the SHA-256
      f1c01c75f3e018ee2d1430337a848535a1fb97742ded45602316c7bce9bcfbc9 (10320 bytes), the bytes the freeze record
      TASK-014-freeze-set binds, checked by script; a script also shows again that it differs from the set file at the
      base (158323324f2803bceee870403bc6c0e297c407fbe50902d60bec90624cc95208) only in fixture_set_version (1 to 2) and in
      the fixture of the entries RC-01 to RC-11, each now the path conformance.expected_path gives for its id and
      capability and the SHA-256 of that frozen file, bound by its TASK-005 freeze record; and that the bytes are the
      canonical form of section 2.
  - AC2: >-
      The set checks (tests/unit/test_conformance_files.py, tests/property/test_conformance_properties.py,
      tests/integration/test_conformance_set.py; the helpers repeated in each, as today). check_set accepts a fixture
      for exactly the Verification and the Resume Check capabilities, each at the path its capability gives (the
      Verification folder or tests/conformance/fixtures_rc/, sections 2 and 9), and requires fixture_set_version 2; the
      tree load reads the fixture files of both folders; every other condition of check_set is kept. The set file test
      and the end-to-end test assert exactly: 32 entries in the bound file's order; 30 with a fixture, the 19
      Verification and the 11 Resume Check ones, by id; exactly RISK-01 and ADV-02 without a fixture; each named file's
      SHA-256 equal to its entry's; scenario_set_version 2, the bound file's hash and fixture_set_version 2. The
      altered-set cases keep every case and each still gives an error (the fixture set version case uses a value other
      than 2; a fixture outside the two capabilities still errs), and a new case gives an error for a Resume Check
      fixture at the Verification folder's path and for a Verification fixture at the Resume Check folder's path.
  - AC3: >-
      The fixture checks keep to their kind. The Verification fixture checks (check_fixture, the fixture tests and the
      faithfulness tests of tests/unit/test_conformance_files.py, and the tree loads of
      tests/property/test_conformance_properties.py) run over exactly the 19 Verification fixtures, as they did at the
      base, with every assertion and every altered-fixture case kept; they do not apply the Verification form to a
      Resume Check fixture, which the Resume Check modules of TASK-005 (test_conformance_rc_files.py,
      test_conformance_rc_properties.py, unchanged) check. A test asserts that the Verification fixtures they run over
      are exactly the 19 entries with capability Verification, so none is skipped.
  - AC4: >-
      The Resume Check set test (tests/integration/test_conformance_rc_set.py). test_the_set_file_is_unchanged_and_frozen
      becomes a test that the set file is bound by exactly one freeze approval of TASK-014 (docs/records/TASK-014.jsonl,
      an authority record with approval_binding {kind: change_request, hash} equal to the set file's SHA-256), and that
      TASK-002's freeze record of the earlier set file still exists unchanged; test_the_set_names_no_resume_check_fixture
      becomes a test that each of the 11 Resume Check entries names exactly its frozen file
      (tests/conformance/fixtures_rc/<module name>.py) with that file's SHA-256, and that no other entry names a file of
      that folder; every other test of the module is kept, with its assertions.
  - AC5: >-
      The folder check. tests/integration/test_conformance_rc_set.py's list of the modules allowed to name the Resume
      Check fixture folder adds, each by name, exactly the paths that name it after this task: tests/conformance/set.py
      (the entries name the folder as data) and those of tests/unit/test_conformance_files.py,
      tests/property/test_conformance_properties.py and tests/integration/test_conformance_set.py that name it for AC2;
      test_a_module_that_is_not_allowed_is_named still catches an unnamed source module and an unnamed test module.
  - AC6: >-
      Nothing else changes, and the runner tests run over the tree. Every other test that tests/run_tests.py runs passes
      unchanged at the task's commit, with the freeze record of docs/records/TASK-014.jsonl in the tree; in particular the
      present-state branches of TASK-013's tree-run tests (test_runner_rc_run.py's R7 test, test_governor_conformance.py,
      test_runner_run.py) now run over the tree and pass with their exact values (RC-01 to RC-11 PASS, the run counts,
      the outcome pass), and TASK-013's fixed-value pin (its AC2, 158323324f…) still holds.
  - AC7: >-
      The 25. At the base, with only the set file of AC1 put in place in a scratch clone, the failing tests are exactly
      the 25 class (c) ids of decision D-369; at the task's commit the whole suite passes over the tree; both runs and
      the id comparison are in the request that brings the first push.
  - AC8: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The modules import only what they import at the base and
      the standard library; they use no exec, eval, compile, __import__ or importlib, start no process, open no
      network connection, call no model and write no file; they name no project-state directory; no fixture or set
      module is imported or executed (files are read as bytes). The CI steps at the task's commits report no finding:
      deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit, as TASK-005's contract lists them. Before each commit,
      the added text and the file names are scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns and the
      records executors' pre-push pattern (D-282), and each count is 0.
  - AC9: >-
      Does not loosen (GOV-003), and the limits. A script over the base and the task's commit shows, for the four
      modules: no test removed or skipped; every assertion line of the base either byte-equal in the changed module or
      listed with its replacement, each replacement comparing with one exact value (no assertion that a value may be
      either of two results); every altered-set and altered-fixture case of the base kept; the count of assertion
      calls in each module does not fall. Limits: as the header states (no CI conformance run over the new set file
      before the task lands; the first base run after landing is reported, not part of this acceptance).
  - AC10: >-
      Tests, with this rule-to-test list: R1 AC1 (the pin of the set file's SHA-256, by script and by the end-to-end
      test); R2 AC2 (the set tests and the altered-set cases, including the new wrong-folder case); R3 AC3 (the 19
      Verification fixtures, exactly, by id); R4 AC4 (the freeze and naming tests); R5 AC5 (the folder test); R6 AC6
      and AC7 (both suite runs). tests/run_tests.py, unchanged, runs them.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC10]}
  - {gate: G3, check: constitution, args: [AC8, AC9, INV-001, INV-002, INV-004, INV-010, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts AND the set file at the task's commit is the one TASK-014-freeze-set binds
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
