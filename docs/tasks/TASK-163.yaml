acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only paths of the write set. The only production files changed are launcher.py (run_task, its helpers, RUN_REASONS and the templates), cli.py (the parse, the run command, USAGE and docstrings) and evaluate_command.py (the comparison of AC6 and its docstring). No module is added, no import of launcher.py or cli.py changes, evaluate_command.py gains no import, and base_files.py, base_inputs.py, evaluation_sources.py, intent_map.py, task_contract.py, writer.py, evaluation.py, eval_inputs.py and evaluation_policy.py are not changed. No new file is opened and no process started by the new code; every read of a traced file is a call of base_files.read_file.
  - AC2: >-
      The command (spec :31). aieos run takes --trace <path> any number of times; its value rules are those of --write (non-empty, not beginning "--"); every other command given --trace is a wrong form (exit 2 and USAGE, nothing called). When at least one --trace is given, cli passes launcher.run_task the keyword trace, the tuple of the values in the order given; without the flag no keyword is passed, so that call is exactly as before. The parse gives the --trace values to the run path (the form of that internal answer is the builder's, the tests' pins of it kept). A traced path changes neither the class, the kind nor the statement owner_kept_act, which read the write paths only. USAGE names the flag in the run line (after [--write <path>]...) and in the list of flags, and the docstrings say what is true after the change, every sentence that a test pins staying, those of launcher.py's docstring that test_cli_run.py pins (:961-965, :1095-1102) among them. aieos import has no such flag.
  - AC3: >-
      The arguments (spec :31). run_task gains the keyword trace, default (), after owner_kept_act. Step "argument" refuses, with nothing read and nothing written, a trace that is not a list or tuple; more than 100 entries (a new constant RUN_TRACE_MAX = 100); a repeated entry; and an entry that is not a str of the form of a write path (launcher._RUN_PATH, its segment rule and its state-folder rule, as --write checks them; launcher._run_path_ok is not changed: the check calls it for the write-path form and writes no further "_segment_forms_ok(" in launcher.py, whose three occurrences test_cli_launch.py:772 counts; the further rules are a separate check) or that a reader of the contract would refuse or misread. Beyond spec :31's refusals, and stated as such: the write-path form above; a first character that is not an ASCII letter, digit or "_" (a path beginning with a dot among them, which the contract reader of the evaluation refuses as an intent_versions key, base_inputs._KEY; the state-folder rule is thereby implied and kept for --write's sake); "#", which base_files accepts but base_inputs splits a traces_to entry at (_RUN_PATH already excludes it); the ADR id form (ADR- and digits), which base_inputs refuses; and an entry beginning "owner_kept_act" in any letter case, whose intent_versions line evaluation's key-line reader would count as a second owner_kept_act line. The finding names argument trace.
