acceptance_criteria:
  - AC1: >-
      The keys. RECORD_KEYS holds session, acs and text; ci_run stays out. A record otherwise well formed that carries
      any of the three in form gets no "6.2:unknown_key" finding; a record with ci_run still gets it. Tests in
      tests/unit/test_records_session_claims.py.
  - AC2: >-
      session: a value that is not a non-empty str gives the finding "6.2:session"; a non-empty str gives none, on a
      record of any fact_kind. Tests in tests/unit/test_records_session_claims.py with None, '', 3, a list and
      a dict, and passing values.
  - AC3: >-
      text: a value that is not a non-empty str gives "6.2:text"; a non-empty str on a record whose fact_kind is claim
      and whose session is set (present and a non-empty str) gives none; text on a record of any other fact_kind, with
      session absent, or with session present but invalid gives "6.2:text" (with "6.2:session" in the last case).
      Tests in tests/unit/test_records_session_claims.py for each case.
  - AC4: >-
      acs: a value that is not a non-empty list of distinct non-empty strs gives "6.2:acs" (None, a str, [], an empty
      string inside, a repeat, a non-str inside); acs on a record without gate set and not a claim whose session is
      set gives "6.2:acs"; on a claim whose session is set, a list of other than exactly one id gives "6.2:acs" and no
      acs gives none; on a record with gate set, a list of one or more distinct ids gives none. Tests in
      tests/unit/test_records_session_claims.py for each case.
  - AC5: >-
      The observed read-set rule is unchanged: a record of evidence_type observed_read_set with session still gives
      "6.2:read_set_forbidden"; check_read_set is unchanged (its ten findings for the all-bad record of
      tests/unit/test_records_read_set.py :80-83); the docstring keeps the phrases read at :92-93 and the module its
      imports collections, datetime, json and re. Tests in tests/unit/test_records_session_claims.py and the existing
      tests.
  - AC6: >-
      Every existing test passes unchanged, the pins of the header among them (the enumerating tests, the export
      pins, test_t0.py :359); the full suite runs locally in a scratch clone before the first code commit; no module
      but records.py changes in src/.
  - AC7: >-
      The docstring of records.py states the three keys' rules and the limits of the header (the writer's statement,
      no standing derived from the values, ci_run out, the pinned-identity limit) in words a test in
      tests/unit/test_records_session_claims.py reads; the four stale sentences of the header are not changed.
  - AC8: >-
      Naming: every test function of tests/unit/test_records_session_claims.py names "TASK-077 ACn" in its own
      docstring;
      the module's own naming test refuses a test that does not (as TASK-076's AC7).
  - AC9: >-
      Broken copies: for each of AC1 to AC5, AC7 and AC8 at least one copy (of records.py, or of the test module for
      AC8) with one change that breaks it, each failing the test its AC names and no other cause, among them a copy
      of the naming test that admits another task's id; the list and the failing tests go to the decision agent
      with the acceptance request.
  - AC10: >-
      Acceptance-time records (not a test): the DEF log lines of the header; the governor's evaluate at acceptance,
      with any difference from the decision agent's decision named (the shadow mode as D-2068 amends it).
