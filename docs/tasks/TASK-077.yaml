# TASK-077: the record checker accepts the keys session, acs and text (specification 2 revisions 3 and 10, section 6.2;
# specification 6 revision 6, section 11 point 5). Plan: decisions D-2059 to D-2062 (session 308d8b07).
#
# Scope: src/aieos_bootstrap/records.py: RECORD_KEYS gains session, acs and text, and check_record checks their form as
# specification 2 section 6.2 states it, with two readings marked: session a non-empty str, accepted on a record of any
# fact_kind (spec 2 :149 names no restriction: a reading); "session is set" means present and a non-empty str; text a
# non-empty str, allowed only on a record whose fact_kind is claim and whose session is set; acs, when present, a
# non-empty list of distinct non-empty strs (spec 2 :152: absent where none is named), allowed only on a record with
# gate set (a gate result) or on a claim whose session is set, where it holds exactly one id (any other placement:
# a finding, fail closed: a reading of spec 2 :152). Each value is the writer's statement, recorded and not checked
# against anything else; no check derives standing from these keys' values (spec 2 section 10 point 11 stays open); a
# record that carries them and was refused as malformed becomes well formed, so it may now count where its other keys
# let it (the pinned-identity limit below). ci_run stays outside RECORD_KEYS (a stated limit). The observed read-set
# rule is unchanged: session stays forbidden on such a record (records.py READ_SET_FORBIDDEN :98).
#
# Owner-act boundary: none reached; no hook, setting, policy or measurement; nothing under .github/ or .claude/.
#
# Stated limits.
# - The pinned identities are governor.py's hash alone (AIEOS_PINNED_GOVERNOR) and resume_check.py's alone
#   (AIEOS_PINNED_RESUME_CHECK, aieos-checks.yml :135), although the governor's decisions depend on records.py
#   (aieos-checks.yml :19-21) and resume_check.py imports records (resume_check.py :42): this task changes which records
#   are well formed for the governor and the evaluator, and neither pin sees it.
# - Four docstring sentences go stale after this task, left by decision D-2061, resumed at each module's next text
#   change (DEF log lines at acceptance); tests/unit/test_t0.py :359 pins the first:
#   src/aieos_bootstrap/t0.py :48 (quoted on one line):
#     "- The session is named only in the recorder's words, since records.py has no ``session`` key (specification 2"
#   src/aieos_bootstrap/claude_code.py :77 (from one source line, wrapped over 2 contract lines):
#     "session only in the recorder's words (records.py has no ``session`` key). This module is called only by its
#     tests;"
#   src/aieos_bootstrap/verification_records.py :37 (quoted on one line):
#     "- records.py does not gain the keys session, ci_run and acs of specification 2 revision 3 (DEF-0051, line 24)."
#   src/aieos_bootstrap/claude_code_channel.py :18-19 (from two source lines, joined and wrapped over 3 contract
#   lines):
#     "- The session is tied in words only, by a recorder that holds session_id verbatim: specification 2 revision 6
#     keeps no session key on a record (section 6.2), and adapter.violation takes no session id. The core does not
#     check it."
# - The benchmark ports keep their own key lists (bench/go/records.go :30, bench/ts/records.ts :20,
#   bench/rust/src/records.rs :51 and their round-2 copies) without the three keys; no test compares them with
#   records.py's RECORD_KEYS; the benchmark's round inputs carry none of the keys, so its references are unchanged
#   (a stated gap, a DEF line at acceptance).
#
# The pins (L-0026; MYSP/ck/pinscan-out.txt and hashscan-out.txt at 99a8e0b1). Each passes unchanged unless named:
# - tests/property/test_records_execution_properties.py :131 draws from EXECUTION_KEYS minus RECORD_KEYS, which stays
#   non-empty (records.py :110-113 holds none of the three keys); tests/unit/test_records_execution.py :69 skips keys
#   in RECORD_KEYS and :82 names none of the three; tests/unit/test_records_audit_copies.py :43-46;
#   tests/unit/test_records_read_set.py :33-36, :55-61 (session still a forbidden key there, its value a non-empty
#   string), :78-84 (check_read_set's ten findings), :87-101 (the docstring phrases at :92-93 kept, the imports
#   collections, datetime, json and re unchanged).
# - The export pins: tests/unit/test_export_round2.py :61-62 and tests/unit/test_export_reference.py :57, whose
#   generators write none of the keys; if either moved, it would be a spec_conflict, not a change in this task.
# - tests/unit/test_t0.py :359 reads the stale t0.py :48 sentence: it passes unchanged (t0.py is forbidden) and is
#   named in the DEF line, to change with t0.py.
# - No test and no workflow line hashes records.py's bytes.
#
# Risk: high, computed over the base 99a8e0b1 by MYSP/ck/risk_class77.py (a copy of risk_class62.py with this
# task's write set; output risk77-out.txt): R2 medium and R3 high (point 3, src/** and tests/**). GOV-003:
# src/aieos_bootstrap/** is an evaluator path (aieos-checks.yml :423, :490); change class as TASK-076's, ruled at
# acceptance. Profile as TASK-076's (functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis], architecture [ai_review (cross-model)]), plus the
# evidence_required of the applicable articles. Reviews on Sonnet 5.5 or Opus 5.5 (never Fable). Naming (D-544 Q3):
# every new test function names "TASK-077 ACn" in its own docstring.
# Not applicable: OPS-001; INV-005 to INV-011; GOV-001, GOV-004 to GOV-006, SEC-003. INV-004 applies unchanged.
# Owner-kept acts: none.
# Shadow Resume Check: not run; the bootstrap has no input reader for resume_check.check (its 22 inputs;
# resume_check.py :29-31); deferred to M7's launcher; D-2042 C3 amended by D-2068 to the governor's evaluate only
# until then.
# Records obligations of the acceptance (AC10; outside the write-set): DEF-0051's log line (verification_records.py);
# a DEF log line for t0.py (with test_t0.py :359), claude_code.py and claude_code_channel.py; a DEF line for the
# benchmark ports' key lists.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-077.yaml, has one parent equal to base_commit, and goes to
# main under its own decision; the task's commits carry "AIEOS-Task: TASK-077" and go to task/TASK-077; main receives
# them only at acceptance. X, in AC10 and the records, is the task head at acceptance.
