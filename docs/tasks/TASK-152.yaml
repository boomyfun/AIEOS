acceptance_criteria:
  - AC1: >-
      The module. eval_inputs.py defines eval_inputs and nothing else public; it imports re, aieos_bootstrap.ci_evidence and aieos_bootstrap.governor only (a test reads the file with read_bytes and ast, checks the import list, the defined public names, the public attributes of the module (eval_inputs and the three imports) and the absence of the direct calls open, exec, eval, compile and __import__ and of the names subprocess, system, environ, time and now); the return form has exactly the five keys and, on a refusal, declared and values None, ci_records [] and evidence None; every argument check of the objective is a test and each case asserts its EXACT refusal reason and detail (no case may pass for another reason); a bool where an int is required, a policy_ref equal to evaluated_commit, an upper-case commit, a non-dict contract and an owner_kept_act that is not the text true or false (a bool, 'True', 'yes', an empty text) are refused; a dict subclass whose own method raises RuntimeError gives refusal argument and no exception escapes; a test-defined BaseException raised from an argument's own method passes through.
  - AC2: >-
      The gaps (D-6827 C2). With every source given in form the module goes on; with ONE source None each of the twelve keys gives refusal gap naming exactly that key; with several None the detail names ALL of them in the list order of the objective; a missing key and an extra key of sources are refusal argument; the answer is never a partial mapping (declared and values None). The docstring says that fixture values in the tests are not policy and that no value is typed into the module; a test reads both sentences and a test shows that a gap is never filled (the same sources with one None never give values).
  - AC3: >-
      The parts that have sources (D-6827 C3). Retries: the texts '0', '3' and '100' are accepted and give the ints; '101', '-1', '+3', ' 3', '03', '', 'three', '3.0', a number given as an int and a missing budgets or retries key are each refused with reason retries and their own detail. Plan: the gate ids are the entries' gate values in order; an entry that is not a dict, without a gate, with a gate that is not a text or not G and digits is refused with reason plan; the {gate: G3, check: review, args: [AC1]} entry is accepted. Risk rules: a rule {match: [...], class: 'medium'} is passed on unchanged (as a copy); the refused rule {match: [], class: None}, a class of None, a class outside the four, a match that is not a list or is empty, a match holding a non-text and an extra key are each refused with reason risk_rules and their own detail. policy_version: a non-empty text is taken as given, anything else is refusal argument.
  - AC4: >-
      The policy paths (D-6826 C4 (b)). A changed path equal to docs/specs/risk-rules-gov-aieos.md, docs/pre-genesis/constitution.md, docs/pre-genesis/assurance-model.md or docs/pre-genesis/decision-matrix.md is refused with reason policy_path naming that path, one test per source file; a path that only contains one of them (docs/pre-genesis/constitution.md.bak, other/docs/pre-genesis/constitution.md) and a path in another case are NOT refused (the limit is stated: the rule is the exact text); policy_ref is carried in the evidence and a policy_ref equal to evaluated_commit is refusal argument.
  - AC5: >-
      The CI records (D-6827 C2). With the branch fixture of the TASK-151 tests (a run of the task branch whose log names the task) and the run-made plan the module returns the records of ci_evidence unchanged (compared as whole values) and its uncovered entries are not lost: ci_evidence's refusal is passed on as refusal ci with the detail 'ci_evidence refused: <reason>: <detail>' (a test per reason of ci_evidence that is easy to provoke: path, run, detect); the ci_evidence call is made once and receives a fresh copy of intent_versions; the evidence mapping of ci_evidence is carried in evidence.ci.
  - AC6: >-
      The guard against the log (D-6827 C2 (b)). With log_payloads empty every CI record is in ci_records; a log payload equal as a whole mapping to a CI record is not returned again and its record_id is listed in evidence.already_in_log; a log payload with the same record_id and other content (the outcome, any other key) is refusal conflict naming the record_id with ci_records [] even when other records were new (the order check-all-then-append: shown by a log holding one equal and one differing payload); each of these cases has its own test; the module appends nothing and calls no writer.
  - AC7: >-
      The result and the completeness check. With sources in form (test fixtures, not policy) the module returns declared {intent_versions: a copy, retries: the int} and values with exactly the thirteen governor.VALUE_KEYS (a test imports governor and compares the key set) and the contract mapping with exactly governor.CONTRACT_KEYS; a copy of the values given to governor.derive_inputs does not raise; a values that derive_inputs would turn into a risk of None, an evidence profile of None or a delegation of None is refusal incomplete naming which (fixtures that cause each); all returned values are fresh copies (no argument is changed: a deep comparison before and after; no returned container is an argument or a value inside an argument); equal arguments give equal results.
  - AC8: >-
      Nothing else changes. Only the two paths of the write set; the whole suite passes by the slice method (D-6249 C2, D-6328 E1.6); a pin scan of the existing tests (made at approval, brought to the decision agent) shows that no existing test pins the list or the count of the modules of src/aieos_bootstrap (TASK-150 and TASK-151 found none; test_writer.py :428 and test_autonomy.py :241 must pass with the new module); tests/run_tests.py discovers the new test file without a change.
  - AC9: >-
      The CI evidence of the task push (pre-registered before the commit exists, as at TASK-150 and TASK-151). deterministic_rule must report 0 findings and no FAIL line; bandit "No issues identified" and the pyflakes step silent; the GOV-003 step reports an evaluator change for the two paths (a report, not a block) and the "GOV-003 base tests (report only)" line shows NO failure; acceptance is by the decision agent's explicit decision only (GOV-003 :94 and INV-011 :78 of the constitution).
  - AC10: >-
      Limits and evidence, stated at acceptance. (1) The module reads nothing and appends nothing: the caller reads the repository through the existing readers and BT3b-2 appends the returned ci_records and wires `aieos evaluate` (D-6827 C5). (2) The module cannot check that the sources are the real policy: every policy value is plain data given by the caller, fixture values in tests are not policy, and until BT3c supplies a policy file ten of the twelve sources (all but policy_version and risk_rules, which have readers) have no producer, so no real evaluation can pass the gap check (D-6827 C5). (3) policy_ref is checked for form and inequality only; that the files were read at that ref is the caller's. (4) The policy-path rule is the exact text of four files; BT3c adds its own file and states any others. (5) The retries reader is strict and local to this module; the contract reader's own refusals (duplicate keys: base_inputs.py :362-:363) are the reader's; the module reads the mapping, not the contract bytes (D-6828). (6) intent_versions is a gap because no reader maps path to sha256 into the version form (D-634 E1); a reader found later replaces the gap in a new task. (7) The departure from D-6607 C2 on provenance (the record cannot name the fetch; the manifest, its hash printed by the command and its copy in the run record) is stated in BT3b-2's contract, not built here (D-6826 C3). (8) How decision_replay.py and reconcile.py treat an appended CI-class record.added is read at the BT3b-2 contract's base (D-6826 C2 (e)). (9) DEF-0153 (the owner's G3 question) and the owner's typed yes for the second real run stay open and this task depends on neither. (10) The evidence profile of the high class: unit_test, deterministic_rule, static_security_analysis, ai_review by a PAIR of blind reviews on Haiku 5.5 in their own sessions (same vendor, a stated departure), a per-article review (GOV-003 applies, INV-008 applies, INV-001 applies and is met: TASK-151 acceptance F7) and a decision_agent_review; no launched session judges its own work. (11) A launch needs the owner's typed yes; the contract authorises none. (12) The risk class is high (risk-rules R3, fail closed): the module decides whether the inputs of an evaluation may be used. (13) The module cannot check that contract is the contract whose bytes hash to contract_sha256; the caller takes both from one base_inputs.contract_at call (D-6828). (14) base_inputs.contract_at reads contracts through its subset reader, which refuses the self-build contracts of docs/tasks whose intent_versions keys begin with a dot (TASK-151.yaml at c0e1b61f: contract_at answers "line 24: a line out of the subset", the line ".github/workflows/aieos-checks.yml: <sha256>"; shown by readonly_checks_152.py); this assembler is for run-made contracts (.aieos/tasks, the form `aieos run` writes and the second real run produces: TASK-143 is read without a finding, with retries the text '1', the plan entries as mappings and owner_kept_act the text 'false'); evaluating a self-build task through this path is out of scope.
capabilities:
  filesystem: {read: [src/aieos_bootstrap/ci_evidence.py, src/aieos_bootstrap/gate_records.py, src/aieos_bootstrap/evaluation.py, src/aieos_bootstrap/governor.py, src/aieos_bootstrap/records.py, src/aieos_bootstrap/verification_records.py, src/aieos_bootstrap/base_inputs.py, src/aieos_bootstrap/resume_log_inputs.py, src/aieos_bootstrap/scope_reconcile.py, src/aieos_bootstrap/launcher.py, docs/pre-genesis/decision-matrix.md, docs/specs/risk-rules-gov-aieos.md, docs/pre-genesis/constitution.md, docs/pre-genesis/assurance-model.md, docs/runs/TASK-151-acceptance.md, tests/unit/test_ci_evidence.py, tests/unit/test_governor.py, tests/run_tests.py], write: [src/aieos_bootstrap/eval_inputs.py, tests/unit/test_eval_inputs.py]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 400k, wall_time: 3h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8]}
  - {gate: G3, check: constitution, args: [AC9, AC10, INV-001, INV-002, INV-003, INV-004, INV-008, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND the aieos-checks run of the accepted commit succeeds
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
