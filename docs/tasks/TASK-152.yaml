# Task contract TASK-152 (DRAFT v1, scratchpad only until approved; session dc7cf6ca, 2026-11-21; BT3b-1, the pure input assembler of the evaluation runner, DEF-0136 and DEF-0152; decisions D-6796, D-6826 (C2 to C4), D-6827 (C2 to C6), D-6828 (R1 to R7) and D-6829 (R8 to R10); v2 = v1 with D-6828 R1 to R7; v3 = v2 with D-6829 R8 to R10; the first contract draft of BT3b-1). The id TASK-152 is the next free one by Glob at this draft (docs/tasks ends at TASK-151, .aieos/tasks at TASK-143; re-read at approval). The contract is approved by the decision agent (A41, A51) at the decision of its commit, not by the owner.
# Authority and scope: BT3b-1 is ONLY a pure module (option (A) of D-6827 in its REFUSING form): no process, no file, no clock, no network, no credential, no write to the event log. It takes plain data that the caller has read through the existing readers (base_inputs.contract_at, scope_reconcile.rules_from_policy for the risk rules, scope_reconcile.policy_block for the policy version, the writer's log reader) and returns either the full `declared` and `values` of evaluation.evaluate_task plus the CI records to append, or a refusal that names every open gap. It does NOT append anything (BT3b-2), does NOT wire `aieos evaluate` (BT3b-2), does NOT read or write a policy file (BT3c, D-6827 C5), does NOT settle G3 (DEF-0153, the owner's question) and does NOT change gate_records.py, ci_evidence.py, governor.py, evaluation.py, records.py, verification_records.py, writer.py, cli.py, the CI workflow or any DEF text.
# Not in this task: any file under src/aieos_runtime or .github, any launch, any settings file, the executor fetch, the append of records, the `aieos evaluate` command, a policy snapshot (BT3c), the pin tasks (BT5), the second real run (the owner's typed yes), any change of DEF-0152 or DEF-0136 (their log lines are a records item of the acceptance commit).
task: TASK-152
contract_version: v1
task_type: implementation
objective: >-
  Add a pure core module src/aieos_bootstrap/eval_inputs.py with ONE public function eval_inputs(task_id, evaluated_commit, policy_ref, contract, contract_sha256, changed_paths, runs, sources, log_payloads, recorder) that assembles, from plain data, every input of evaluation.evaluate_task that a repository file can give, and refuses when one cannot be given (D-6606 C3: derive every input, nothing hand-typed, refuse a missing input; D-6827 C2). It imports re, aieos_bootstrap.ci_evidence and aieos_bootstrap.governor only (hashlib is not needed: the module computes no hash; D-6828 R7; the import list is tested by ast); no process, file, clock, environment variable or network; public names eval_inputs and nothing else defined. It returns a mapping with exactly the keys declared, values, ci_records, evidence and refusal; on a refusal declared and values are None, ci_records is [], evidence is None and refusal is {reason, detail}; the reasons form a closed set: argument, gap, retries, plan, risk_rules, policy_path, ci, conflict, incomplete. It never raises an Exception; a BaseException that is not an Exception passes through. THE ARGUMENTS (checked first, each failure is refusal argument and nothing else is read): task_id TASK- and digits; evaluated_commit and policy_ref 40 lowercase hexadecimal characters, and policy_ref differs from evaluated_commit (the policy is read at a pinned ref, never from the evaluated tree, D-6826 C4 (b); the module checks the form and the inequality, the caller reads the files at policy_ref); contract a dict (the mapping base_inputs.contract_at returns for the approved contract) holding traces_to (a non-empty list of non-empty texts), risk (one of low, medium, high, critical), owner_kept_act (the text true or false, as the subset reader of base_inputs gives scalars as texts: the module converts it to the bool and any other value is refusal argument; evaluation.evaluate_task binds the field to the contract bytes again), verification_plan (a non-empty list of dicts) and autonomy (a dict whose budgets is a dict); contract_sha256 64 lowercase hexadecimal characters; changed_paths a non-empty list of non-empty texts; runs a list (passed on to ci_evidence, which checks its own form); sources a dict (below); log_payloads a list of dicts (the payloads of the task's record.added events already in the log); recorder a non-empty text. THE GAPS (D-6827 C2): the closed list, in this order, of the values that no repository reader supplies today: intent_versions, owner_kept_rules, articles, default_profiles, requirement_profiles, evidence_comparison, delegation, auto_accept, level_version, ruleset_version; plus policy_version and risk_rules, which the caller passes as the output of the existing readers in the same dict. sources must be a dict whose keys are exactly intent_versions, owner_kept_rules, articles, default_profiles, requirement_profiles, evidence_comparison, delegation, auto_accept, level_version, ruleset_version, policy_version and risk_rules; a key whose value is None is an OPEN GAP; if any gap is open the answer is ONE refusal, reason gap, whose detail names EVERY open gap in the list order, one name each (never a partial mapping, never a fail-closed value passed on); a missing or extra key is refusal argument. The values of sources are plain data in the forms that governor.derive_inputs and evaluation.evaluate_task require; fixture values in the tests are not policy (the docstring says it and a test reads the sentence); no value is typed into the module (D-6826 C4 (a)). THE PARTS THAT HAVE SOURCES (D-6827 C3): (a) retries: contract['autonomy']['budgets']['retries'] must be a str of one to three decimal digits with no sign, no space and no leading zero (except the text 0) whose int is 0 to 100, else refusal retries with an exact detail (the contract reader gives the budgets as texts, resume_log_inputs docstring; the module is the strict reader of that one field). This departs from D-6827 C3 (a), which named the approved contract bytes: the module reads the mapping that base_inputs.contract_at gives, whose reader already refuses a repeated key (base_inputs.py :362-:363) and returns plain values as text (:380); the departure is decided at D-6828; (b) verification_plan: the gate ids are exactly the entries' gate values in order, each G and digits (the form of the run-made contracts that launcher.py writes: mappings {gate, check, args}, launcher.py :1693-:1695, :1848-:1850, :1883, :1898); an entry that is not a dict with a text gate, or a gate not G and digits, is refusal plan; the entries' check and args keys are passed to ci_evidence, which drops args; (c) risk_rules: sources['risk_rules'] is the list that scope_reconcile.rules_from_policy returns for the policy text read at policy_ref, in the governor's form (scope_reconcile.py :267-:293; a component_tags rule is given as TAGS_MATCH, :102 and :286-:287): each rule must be a dict with exactly the keys match and class, match a non-empty list of non-empty texts and class one of low, medium, high or critical; the refused rule {match: [], class: None} and any other form is refusal risk_rules; a rule in form is passed on as a copy; (d) policy_version is sources['policy_version'] (a non-empty text). THE POLICY PATHS (D-6826 C4 (b)): a task whose changed_paths include any of the four policy source files docs/specs/risk-rules-gov-aieos.md, docs/pre-genesis/constitution.md, docs/pre-genesis/assurance-model.md or docs/pre-genesis/decision-matrix.md (the exact text, case-sensitive; the decision matrix is the source of the owner-kept and delegation rules that BT3c will restate: D-6828) is refused with reason policy_path naming the path: a task cannot edit the rules that evaluate it (BT3c adds the policy file's own path to the constant). THE CI RECORDS: ci_evidence.ci_evidence is called ONCE with task_id, evaluated_commit, contract_sha256, a fresh copy of sources['intent_versions'], the plan entries as given, a copy of changed_paths, runs and recorder; a refusal of it is refusal ci with the detail 'ci_evidence refused: <its reason>: <its detail>'; its records are checked against log_payloads BEFORE anything is returned (D-6827 C2 (b), the order check-all-then-append): a log payload equal as a whole mapping to a CI record is not returned again (its record_id is listed in evidence.already_in_log), a log payload with the SAME record_id and other content is refusal conflict naming the record_id with ci_records empty; otherwise ci_records are the records to append. THE RESULT: declared is {intent_versions: a fresh copy, retries: the int}; values has exactly the thirteen governor.VALUE_KEYS (contract {traces_to, risk, owner_kept_act, verification_plan: the gate ids}, a copy of changed_paths, the mapped risk_rules and the other sources as given in copies) and a copy of governor.derive_inputs' view of it is computed as the last check: ValueError, a risk of None, an evidence profile of None or a delegation of None is refusal incomplete with the detail naming which (the module never returns values that the governor would turn into no decision); evidence is {policy_ref, evaluated_commit, contract_sha256, ci: the evidence mapping of ci_evidence, already_in_log: the listed record ids, gaps: []}. All values returned are fresh plain copies: no argument is changed and nothing returned aliases an argument.
