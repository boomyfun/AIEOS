acceptance_criteria:
  - AC1: >-
      The rule (decision D-1027, form (ii), with C-a). After _kept, evaluation.evaluate_task refuses with result
      "refused" and reason "records" when _kept has left out a record, from the log or from extra_records, whose
      outcome is 'blocking', for being out of form or for a record_id an earlier kept record has, unless its record_id
      equals that of an earlier kept record whose outcome is 'blocking' and whose blocking_kind is the same; the
      findings hold _kept's findings and one
      finding per such record naming its record_id (or its position when it has none) and its source; nothing is
      appended and governor.evaluate is not called.
  - AC2: >-
      What does not change. With no such record the result, decision, next_task_state and event id are those of the
      base (TASK-027 AC1 to AC11 and TASK-053 AC1 to AC10): tests/unit/test_evaluation.py,
      tests/integration/test_evaluation_repo.py and tests/property/test_evaluation_properties.py pass unchanged; a
      record that is not blocking and is out of form or repeats a kept record's id is left out with _kept's finding
      and the evaluation goes on; a blocking record repeating the id of a kept blocking record with the same
      blocking_kind is left out and the evaluation goes on (a violation repeating a kept violation gives REJECT, as
      TASK-053's R3LeftOut test shows). RESULT_KEYS, event_id_of and the governor are
      unchanged; the new reason is the only new value.
  - AC3: >-
      The cost (a limit). A task with such a record in the log is refused at every evaluation, the rerun included,
      with nothing appended, also after a later task.approved and a new submission (the whole-log span); it is
      neither accepted nor rejected by evaluation and stays in its state until superseded by a new task. A blocking
      record given only through extra_records refuses only while it is given.
  - AC4: >-
      The texts (OPS-003). evaluation.py's docstring states the rule (its item 7, the new reason in its result
      section) and AC3's cost as a limit, in place of the limit that a violation whose record_id an earlier kept
      record has is left out and need not REJECT; violation.py's first limit, adapter.py's and replay.py's sentence
      state the same in place of that exception, each keeping the words test_violation R8Purity ("every later
      evaluation of it reject") and test_replay and test_adapter R9Purity ("makes every later evaluation of the task
      reject (task TASK-053)") require. The code of violation.py, adapter.py and replay.py does not change: each
      module's text after the line that closes its module docstring is byte-equal to the base's.
      tests/unit/test_evaluation_violation.py's R7Limits requires the new words in place of "need not REJECT", "a
      later task is to make this fail closed" and "an earlier kept record", keeping every other requirement; the
      change is listed with its reason in the first task commit's request.
  - AC5: >-
      Purity and the CI checks (INV-001 to INV-004). evaluation.py's imports are unchanged (test_evaluation.py's
      import test and R7Limits pass); no module starts a process except as at the base, opens a file, reads a clock
      or the environment, builds an event-log line itself, or makes a network or model call; no exec, eval, compile,
      __import__ or importlib; no assert in src (bandit B101); no string that names the project-state directory. At
      the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC6: >-
      Its own tests and the added text. Every test function of tests/unit/test_evaluation_repeated.py names the AC
      ids it stands for as "TASK-054 ACn" in its own docstring; the changed R7Limits names "TASK-054 AC4" beside its
      earlier ids; no other task's AC is named in qualified form in the new module. No earlier test is removed or
      weakened (GOV-003). Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and
      OPS-003 patterns, and for constant values beside password- or token-like names (decision D-1003 amendment 1),
      each count 0; the file names are scanned with the same patterns and the records executors' pre-push pattern
      (D-282). The tests write and remove no file.
  - AC7: >-
      Tests, each rule with at least one passing and one failing case, with stand-ins for the writer's and Git's
      functions bound to the real signatures (inspect.signature(...).bind): R1 AC1 (a violation.detected reusing
      the record_id of an earlier passing record.added of the task gives "refused", "records", nothing appended, the
      governor not called; the failing case: the base's _kept alone would leave it out and evaluate); R2 AC1 (a
      blocking record.added reusing such an id, and a blocking record in extra_records that is out of form or
      repeats a log record's id, each refuse; a violation.detected reusing the id of an earlier kept blocking
      record.added of another blocking_kind refuses); R3 AC2 (a violation repeating a kept violation's id gives
      REJECT; a passing record repeating an id, and an out-of-form passing record, are left out and the evaluation
      goes on); R4 AC3 (the rerun refused again with nothing appended; a new task.approved and submission refused
      again); R5 AC2 (a property test over generated logs and extra_records, standard library only, fixed seeds:
      with no blocking record left out, the result equals what the base's steps give, and with one it is refused);
      R6 AC4 (for each of violation.py, adapter.py and replay.py, the SHA-256 of its text after the line that closes
      its module docstring equals a value recorded in the test module, computed from the base's file, with a real
      failing case; the docstrings' new words present and the old absent); R7 AC5 (a script check of evaluation.py's
      docstring words and of the imports); and an end-to-end test whose in-memory log, built with the real
      eventlog.append, holds the task's task.approved, a passing record.added, a first lease, violation.record whose
      observation reuses that record's record_id, a second lease and a task.submitted, then evaluate_task giving
      "refused", "records". tests/run_tests.py, unchanged, runs them.
  - AC8: >-
      Limits, stated in evaluation.py's docstring and carried at acceptance: AC3's cost; event_id_of and the
      governor unchanged; records.py's uniqueness rule unchanged; a repeated id between records that are not
      blocking left out as before; the limits of TASK-053 (its AC7) stand; no conformance set or fixture changed.
      Every existing module other than the write-set is unchanged, and if one can pass only by a change the task
      escalates (needs_out_of_scope_change).
