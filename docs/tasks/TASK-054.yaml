# Task contract TASK-054, a blocking record that the evaluation would leave out refuses the evaluation (Master Plan
# revision 4, §4 M5; specification 3 revision 4, section 8 line 106; governor-spec.md section 4; constitution INV-003).
# Revision 0, drafted under decision D-1027 (C2), from the scope note approved there with form (ii) and its conditions
# C-a and C-b; brought for approval in its own request; whether it is approved is recorded in the decision files, not
# in this file. Fields and value forms follow specification 2 §5.1 and the contract of TASK-053.
# Revision 1: errata E1 and E2 of decision D-1028.
# Task type: implementation. Why: the five way-2 reviews of TASK-053 and decision D-1021 (its D1) found a fail-open
# path of the acceptance: evaluation._kept leaves out, with a finding only, a record whose record_id an earlier kept
# record has (records.py does not check record_id uniqueness across a log), so a violation.detected or a blocking
# record.added that reuses the id of an earlier passing record of the task never reaches the governor, and the
# evaluation may ACCEPT. Constitution INV-003 asks the rule to fail closed.
# What it changes: after _kept, src/aieos_bootstrap/evaluation.py refuses the evaluation with the new reason "records"
# when _kept has left out a record whose outcome is 'blocking', for being out of form or for a repeated record_id,
# except a record whose record_id equals that of an earlier kept record whose outcome is 'blocking' with the same
# blocking_kind (the first already blocks with the same kind; this keeps TASK-053's R3LeftOut test true). Nothing is
# appended and the governor is not called.
# Form (ii) of decision D-1027, chosen over (i) (keep every blocking record: the governor then refuses the request for
# a record id used twice, governor.py:197-208, an error record each time) and (iii) (a blocking record replaces the
# earlier kept one: the event id is then unchanged, so in IN_REVIEW, where a NEEDS_REVIEW decision keeps the setter,
# an evaluation after the blocking record gives "duplicate" and appends no REJECT; closing that needs a change to
# event_id_of, TASK-027 AC8 and a forbidden test).
# C-a (decision D-1027): in the log, an out-of-form record cannot be present: eventlog.append checks every payload with
# records.check_payload (eventlog.py:198) and evaluation's _task_events refuses a log with any check_log finding
# (evaluation.py:169-172, reason "log"); through extra_records (the caller's data) it can, so the rule covers both
# kinds of leaving out.
# C-b (decision D-1027): no module of src calls evaluate_task (verification_records.py names it in its docstring only);
# its callers are the three forbidden evaluation tests and TASK-053's module, none of which switches on a closed set of
# reasons; the reasons used are argument, store, bound, contract, git, governor, log, merge, state and values; so a new
# reason "records" is added. RESULT_KEYS are unchanged.
# A change of earlier accepted behaviour, stated: TASK-027 AC7 ("a repeated record_id ... left out with a finding") and
# TASK-053 AC3 ("a violation.detected whose record_id an earlier kept record has is left out with the finding _kept
# gives at the base") prescribed leaving such a record out and evaluating on; for a blocking record (other than one
# repeating the id of a kept blocking record of the same blocking_kind) this task refuses instead. A repeated or
# out-of-form record that is not blocking is left out as before. The concept and the decision matrix are not changed.
# The cost, stated (a limit): the span is the whole log, so a task with such a record is refused at every evaluation:
# it can be neither accepted nor rejected by evaluation and stays in VERIFYING or IN_REVIEW until it is superseded by a
# new task. A blocking record given only through extra_records stops refusing when the caller stops giving it.
# The texts that state the old limit become false and change (OPS-003): evaluation.py's docstring item 7 and its limit
# on a repeated record_id, violation.py's first limit, adapter.py's and replay.py's sentence; each keeps the words that
# test_violation R8Purity ("every later evaluation of it reject") and test_replay and test_adapter R9Purity ("makes
# every later evaluation of the task reject (task TASK-053)") require, so those three test modules do not change. The
# code of violation.py, adapter.py and replay.py does not change (tested by the SHA-256 of each module's text after its
# docstring). tests/unit/test_evaluation_violation.py's R7Limits requires the new words in place of the old limit's
# ("need not REJECT", "a later task is to make this fail closed", "an earlier kept record"), keeping every other
# requirement (GOV-003).
# Check before the contract (M2 of decision D-1012, repeated at D-1027): the forbidden test_evaluation.py's R7Records
# (lines 423-434) and R8Append (lines 454-460) use only records with outcome 'pass' (its record() helper, lines
# 143-148) and an out-of-form record without an outcome, so they keep passing; test_evaluation_repo.py and
# test_evaluation_properties.py name no repeated record_id; no forbidden test reads evaluation.py's docstring.
# Limits (carried at acceptance): the stuck task above; event_id_of and the governor unchanged; records.py's uniqueness
# rule unchanged (a repeated record_id is still accepted into the log); a repeated id between records that are not
# blocking is left out as before; the limits of TASK-053 (AC7) stand; no conformance set or fixture changed.
# Readers of the changed paths (D-263 C3's practice): tests/unit/test_evaluation.py, tests/integration/
# test_evaluation_repo.py and tests/property/test_evaluation_properties.py read evaluation.py and keep passing unchanged
# (forbidden here); src/aieos_bootstrap/verification_records.py names evaluation.evaluate_task in its docstring only;
# tests/unit/test_violation.py, test_adapter.py and test_replay.py read the docstrings of violation.py, adapter.py and
# replay.py and keep passing unchanged (forbidden here); tests/unit/test_writer.py's R8 test and tests/unit/
# test_gitread.py's subprocess test read every module of src/ and keep passing.
# Risk: high (risk rules revision 6, policy v4, §2 point 3: R3 matches every path under src/** and tests/**), computed
# over the base by script (risk_class54.py: every path R2 medium and R3 high). Change class critical_cr, computed by
# script and read as for TASK-053 (gov003_class54.py: "GOV-003 evaluator change: yes (6 of 6 paths)"; the evaluation
# path's decision inputs change); decided by decision D-1027; the approval form is ruled at acceptance (decision
# D-492's precedent). Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture
# [deterministic_rule], functional [integration_test], security [static_security_analysis] and architecture
# [ai_review (cross-model)], plus the evidence_required of the applicable articles. Reviews as TASK-053's: five way-2
# reviews on a model other than the implementer's and the main session's, and the decision agent's own review for the
# cross-model entry.
# Naming (D-544 Q3): every test of the new test module names the AC ids it stands for as "TASK-054 ACn" in its own
# docstring; a changed test names "TASK-054 ACn" beside its earlier ids.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-054.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-054", go to task/TASK-054 under their own decisions; main receives
# the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (the governor, its
# decision contracts and the policy are not changed); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the
# bound artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the
# write-set). INV-004 applies: the modules write only through the writer's functions. INV-009 applies through the
# writer, which this task does not change.
# Owner-kept acts: none. No hook, no Claude Code setting, nothing under .github/, no push of its own; it weakens no
# evidence requirement; the approval form is ruled at acceptance (Master Plan section 6).
task: TASK-054
contract_version: v1
task_type: implementation
objective: >-
  Make a blocking record that the evaluation would leave out refuse the evaluation, in standard-library Python 3.
  src/aieos_bootstrap/evaluation.py, after _kept, refuses with reason "records" when a record whose outcome is
  'blocking' was left out (out of form, or for a record_id an earlier kept record has), except one whose record_id
  equals that of an earlier kept blocking record with the same blocking_kind; nothing is appended and the governor is
  not called. The docstrings
  of evaluation.py, violation.py, adapter.py and replay.py state the new rule and its cost in place of the old limit;
  the code of violation.py, adapter.py and replay.py does not change. With unit and property tests in a new
  tests/unit/test_evaluation_repeated.py, each test naming its AC ids in its own docstring, and R7Limits of
  tests/unit/test_evaluation_violation.py brought to the new words; the tests use stand-ins for the writer's and Git's
  functions and write no file.
