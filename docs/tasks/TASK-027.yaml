acceptance_criteria:
  - AC1: >-
      The interface and its arguments. evaluate_task(root, repo, task_id, contract_bytes, declared, values,
      extra_records, recorder, now, max_commits=1000, read=None, read_log=None, append=None) takes root and repo,
      non-empty str values that are absolute paths; task_id, a str of the form TASK-<digits>; contract_bytes, bytes;
      declared, a dict with exactly the keys intent_versions (a dict from non-empty str ids to "v" followed by
      digits, the governor's form and specification 2 section 2's, line 20) and retries (an int that is not a bool, from 0 to 100); values, a dict (its form is
      governor.derive_inputs's, checked in AC6); extra_records, a list; recorder, a non-empty str; now, a
      timezone-aware datetime in UTC with whole seconds (specification 2 section 6.1); max_commits, an int that is
      not a bool, from 1 to 10000. Any other value gives the result of AC11 with result "refused", reason "argument"
      and a finding naming the argument, before read_log or read is called (fail closed).
  - AC2: >-
      The log and the task's events. read_log(root) is called once; records.check_log of its bytes must give no
      finding, else "refused", reason "log", with the findings, and nothing read further or appended. Of the parsed
      events whose task_id is the task: the last task.approved gives contract_hash; with none, "refused", reason
      "state". Of the task's events after it, in log order: a task.submitted sets the state VERIFYING and the
      evaluated commit (its payload's commit); a decision.acceptance whose payload's next_task_state is a str sets that
      state, and one whose next_task_state is null sets nothing; record.added and decision.execution set nothing; any
      other event type whose name begins "task." gives "refused", reason "state" (reading: a state this path does not
      evaluate, such as STALE or BLOCKED). The state-setting event is the last event that set the state. The state must
      be VERIFYING or IN_REVIEW and an evaluated commit must exist, else "refused", reason "state". retries used is the
      number of the task's decision.acceptance events after the last task.approved whose next_task_state is REWORK
      (specification 1 line 73).
  - AC3: >-
      The contract. The SHA-256 of contract_bytes must equal contract_hash, else "refused", reason "contract", and
      nothing read further or appended. task_content_hash is the SHA-256 hex digest of contract_bytes followed by one
      LF and the evaluated commit id in ASCII (specification 2 section 2, line 22).
  - AC4: >-
      The task's commits (decision D-633, point 5). Starting at the evaluated commit, each commit is read once as
      read(repo, ["cat-file", "-p", id]); the result must have error None and exit 0, and gitread.parse_commit of its
      out must give error None. A commit belongs to the task when its message has at least two paragraphs, split as
      recovery.trailers splits them, and recovery.trailers gives the task's id as task with no finding (DEF-0052 F6).
      A commit where recovery.trailers gives any finding, or whose message has one paragraph that holds an AIEOS-Task
      line naming this task, gives "refused", reason "git". The evaluated commit must belong to the task, else
      "refused", reason "git". A commit that belongs to the task must have at most one parent, else "refused", reason
      "merge"; the walk goes on to its parent, and ends only at a commit whose trailers give no finding and name no
      task or another task, or after a commit with no parent (decision D-634). More than max_commits commits that belong to the task give "refused", reason "bound". Any read
      result other than the one required (a refused form or PATH, a timeout, a git that cannot be started, a non-zero
      exit, an object that is not a commit, bytes out of form) gives "refused", reason "git", with a finding naming the
      call and its error or exit. Nothing is appended on any refusal.
  - AC5: >-
      The changed paths. For each commit that belongs to the task, read is called once as read(repo, ["diff-tree",
      "--no-commit-id", "--name-only", "-r", "--no-renames", "--no-ext-diff", "--no-textconv", "-z", "--root", id]),
      and gitread.parse_paths of its out must give error None, else "refused", reason "git". The changed paths are the
      union of those paths, sorted, without duplicates; an empty union gives "refused", reason "git".
  - AC6: >-
      The governor's inputs. values["changed_paths"] must be a list equal to the changed paths of AC5, else
      "refused", reason "values", with a finding naming the difference (so the caller cannot give other paths).
      governor.derive_inputs(values) is called once; a ValueError, or any other exception, gives "refused", reason
      "values", with a finding naming its type and text. The request is exactly {task_id, task_content_hash,
      evaluated_commit, intent_versions (declared's), task_state (AC2's state), changed_paths (AC5's), retry_count
      {used (AC2's), limit (declared's retries)}} (specification 2 section 6.5).
  - AC7: >-
      The records. The payloads of the task's record.added events in the whole log, in log order, then the entries of
      extra_records, in their order; each is kept when records.check_record of it gives no finding and its record_id
      is a str no earlier kept record has; any other is left out and named in a finding (decision D-633 (e);
      specification 2 line 23: a malformed input is not used). governor.evaluate(request, inputs, kept) is called
      exactly once; an exception gives "refused", reason "governor", with a finding.
  - AC8: >-
      The append through the writer (INV-004). The event id is the SHA-256 hex digest of the UTF-8 text made of the
      lines "evaluation", the task id, the state-setting event's event_id, and then the kept records' record_ids,
      sorted, joined by LF (decision D-633 (f)). append(root, "decision.acceptance", record, event_id, now, recorder,
      task_id=task_id) is called exactly once with the governor's record, with no fencing token (the lease was
      released at submission: specification 1 section 5.1), also when the record carries an error and a null decision
      (decision D-633 (g); governor-spec.md section 4 rule 7: the task stays where it is). A result whose result is
      "appended" gives "evaluated"; "duplicate" gives "duplicate"; any other result, or an exception, gives "refused",
      reason "store", with a finding. No event-log line is built here.
  - AC9: >-
      Reruns. A second evaluate_task over the same log, the same commits and the same records computes the same event
      id, so the writer gives "duplicate" and no second decision is appended; after a decision that set a new state
      (for example IN_REVIEW), a record added to the task changes the set of kept record ids, so a re-evaluation from
      IN_REVIEW gets a new event id (tests with a stand-in writer that keeps a log, built with eventlog.append).
  - AC10: >-
      The injected functions. read, read_log and append, when None, are gitread.run, writer.read_log and
      writer.append_event, resolved at call time; tests pass stand-ins; a test pins the three defaults (by replacing
      the module attributes for the duration of the test and restoring them).
  - AC11: >-
      The result. evaluate_task returns a mapping with exactly the keys result ("evaluated", "duplicate" or
      "refused"), reason (None, or one of argument, log, state, contract, git, merge, bound, values, governor, store),
      findings (a list of str), event_id (the derived id, or None before it is derived), changed_paths (AC5's list, or
      None before it is computed), decision (the record's decision, or None) and next_task_state (the record's, or
      None). An exception raised by any injected or called function, or by reading the objects they return, is caught
      and becomes a result with a finding naming its type; none escapes evaluate_task.
  - AC12: >-
      Purity apart from the calls (INV-001, INV-004). evaluation.py imports only the Python 3 standard library and
      aieos_bootstrap's gitread, governor, records, recovery and writer; it opens, writes and removes no file itself,
      starts no process except through read, reads no clock and no environment variable, calls of the writer only
      read_log and append_event (through the injected names), and no open_store, grant_lease, release_lease,
      release_lease_token, expire_leases, start_session or end_session, and builds no event-log line itself. No exec,
      eval, compile, __import__ or importlib; no assert in src; no string that names the project-state directory;
      deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit report no finding at the task's commits, on the base
      with the workflow's revision 8, with no change under .github/.
  - AC13: >-
      Limits, stated in the module's docstring: the PATH git is found by is the caller's precondition (DEF-0052 G1);
      declared (intent_versions and retries) and values (the contract's declared fields, the policy's rules, the
      articles, the profiles, the delegation and the versions) are caller data, not bound to the hashed contract
      bytes, as the governor's own limit says (decision D-633 C1); one evaluation of a task runs at a time, since the
      writer reads the log and appends with no check that it is unchanged since this module's read; the walk has a
      bound and reads every task commit each time; the walk ends at the first commit without the task's trailer, so a
      task commit that lacks it would end the walk early (the CI's G0 refuses such a commit); a merge in the task's
      commits is refused; records of the CI channel are the caller's to give (no network); the records of
      specification 4 section 10 and its reconciliation are not made here; this repository's contracts write
      input_state.intent_versions as path to SHA-256, not specification 2's version form, so the caller maps them
      (decision D-634 E1; carried to this task's Deferred item); the tests use stand-ins for the writer, so
      the real store's path is covered by the writer's tests and not end to end. Every existing module and test not
      in the write set is unchanged, and if one can pass only by a change the task escalates
      (needs_out_of_scope_change).
  - AC14: >-
      This repository's history, read only. tests/integration/test_evaluation_repo.py finds the repository root from
      its own path (pathlib, two parents up) and calls evaluate_task with the real gitread.run for task TASK-026,
      contract_bytes the bytes of docs/tasks/TASK-026.yaml read from the checkout, whose SHA-256 the test first
      asserts equal to 3214886e13d348d83ca886d4e53773629879a4b4edf692525ae2da759882f21b (its hash at commit C of
      TASK-026 and on main), values built by the test in governor.derive_inputs's form, declared built by the test with intent_versions in
      the version form, a stand-in read_log giving a log built with eventlog.append that holds a task.approved with that hash and a
      task.submitted naming 1f6ff6d8131b5d53a881f895aedb0dd632075ff4, and a stand-in append that records its calls and
      gives "appended": the walk reads 1f6ff6d8… and 92e4ab140d2f311d4cb3a188f1b6e496bae5baf4 as the task's commits and
