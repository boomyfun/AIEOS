# Task contract TASK-027, the evaluation path (Master Plan revision 3, §4 M4; specification 1 section 5.1; specification
# 2 sections 2, 6.1, 6.3, 6.4 and 6.5; governor-spec.md sections 3 and 4; DEF-0030, the core's caller). Revision 0,
# drafted under decisions D-591 (Q4), D-631 (step 2) and D-633 (the scope note and its rulings), brought for approval
# in its own request; whether it is approved is recorded in the decision files, not in this file. Fields and value
# forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-028. Readings marked "(reading)" are the
# worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: one module, src/aieos_bootstrap/evaluation.py, the last named piece of the
# core's caller (DEF-0030; decision D-591 Q4): one function, evaluate_task, that evaluates one task in VERIFYING (after
# its task.submitted) or in IN_REVIEW (re-evaluation): it reads the event log through the single writer (TASK-016,
# TASK-026), derives from the task's own events the evaluated commit, the state, the approved contract hash and the
# retries used, checks the contract's bytes against the approved hash, reads the task's whole change through the Git
# reader (TASK-024), derives the governor's inputs (governor.derive_inputs, TASK-004 and TASK-015), calls
# governor.evaluate with the task's records, and appends the decision record as decision.acceptance through the writer.
# The changed paths (decision D-633, point 5): the union of the paths that each of the task's commits changes against
# its first parent, without rename detection, not the evaluated commit's own diff, so that a task of several commits is
# never classed by its last commit only. The task's commits are walked back from the evaluated commit (ruled in
# decision D-634: the walk ends at the first commit whose trailers give no finding and name no task or another task,
# the CI's G0 reading of a task's commits, which every pushed task commit must meet; D-633 named base_commit as the
# end, which would also count the contract commit C and any records commit the branch was rebased onto, as TASK-026's
# branch was (decision D-622, departure D2); a trailer finding, or this task's trailer in a message with no body,
# refuses instead of ending the walk). Any commit of the walk with more than one parent, a walk past the bound, or any
# read that fails refuses the evaluation with nothing appended.
# The event id (decision D-633 (f)): derived by the module from the task, the event that set the task's current state
# and the record ids it used, so that a rerun over the same state and records gives "duplicate" and never a second
# decision (which, for a REWORK decision, would raise the retries used: specification 1 line 73).
# What it does not do (decision D-633 (h) and section 3.3 of its request): no run in the CI channel and no fetch of CI
# records (the caller gives them; no network); no reading of the policy, the constitution, the requirements or the
# contract's fields from the repository (the governor's own limit; specification 4 §12 point 12); none of the records
# of specification 4 §10 (profile, risk class, AC coverage, stale list) and no reconciliation (specification 4 §7);
# no execution decision, no grant or release of a lease, no task.stale, no general projection of task state, no
# trigger (the caller decides when to evaluate), no Git write of any kind, no process except through gitread.run, no
# file opened except through the writer's functions, no clock read, nothing under .github/ and no workflow change (the
# module opens no file and starts no process itself, like submit.py and startup.py, which needed none), no policy, no
# frozen fixture. It changes no other module of src/ apart from the package's docstring and __all__.
# The trusted PATH (DEF-0052 G1) is the caller's precondition: gitread refuses an empty or relative entry, and an
# absolute entry is trusted as given. A trailer is trusted only in a message with a body (DEF-0052 F6).
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain evaluation. No module of the repository
# calls evaluate_task yet.
# Risk: high, and change class critical_cr, each computed over the base by script (risk_class27.py and
# gov003_class27.py of the drafting session: every path matches R2 and R3's not-evaluable reading, class high; all
# five paths are GOV-003 evaluator paths). Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test],
# architecture [deterministic_rule], functional [integration_test], security [static_security_analysis] and
# architecture [ai_review (cross-model)], plus the evidence_required of the applicable articles.
# Reviews (as TASK-025, TASK-026 and TASK-028): five way-2 reviews by a Claude model other than the implementer's, and
# the decision agent's three, each brief naming for testing: the state derivation and its refusals; the contract hash
# check and the task content hash; the walk of the task's commits (its end, its bound, merges, read failures) and the
# union of their paths; that values' changed paths must equal the computed union; the records left out with a finding;
# the derived event id and the duplicate on a rerun; that every decision record, an error record included, goes
# through the writer once; the result form and that no exception escapes; the injected defaults; the limits of AC13.
# Naming: every test this task adds names the AC ids it stands for as "TASK-027 ACn" in its own docstring, following
# DEF-0049's convention.
# Evaluation path (A61; as TASK-007 to TASK-028): commit C changes only docs/tasks/TASK-027.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-027", go to task/TASK-027 under their own
# decisions; main receives the task only at its acceptance. The task push's CI base run is a RISK-01 conformance run
# over the set file of DM F35, reported advisory, never MEASURED.
# Not applicable: OPS-001 (the task changes no ref; gitread runs only read-only subcommands); INV-005 to INV-008,
# INV-010 and INV-011 (the decision engine, the governor's own module, evidence records, the replay and the policy meet
# no path of the write-set; the module calls the governor and changes it in nothing); GOV-001, GOV-004 to GOV-006 and
# SEC-003 (the concept file, the bound artifacts, the decision matrix, the records and pre-genesis documents, and
# .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own; it weakens no evidence requirement (CR-002 part 4 limit 8 does not apply),
# so its acceptance is one delegated approval of the decision agent (Master Plan section 6), for the decision agent's
# ruling.
task: TASK-027
contract_version: v1
task_type: implementation
objective: >-
  Add a standard-library Python 3 module, src/aieos_bootstrap/evaluation.py, the evaluation path (specification 1
  section 5.1; DEF-0030): evaluate_task(root, repo, task_id, contract_bytes, declared, values, extra_records, recorder,
  now) reads the event log through the writer, derives from the task's own events its state (VERIFYING or IN_REVIEW),
  its evaluated commit, its approved contract hash and its retries used, checks the contract's bytes against that
  hash, walks the task's commits through gitread.run within a bound and takes the union of their changed paths,
  derives the governor's inputs with governor.derive_inputs, calls governor.evaluate with the task's records, and
  appends the decision record once as decision.acceptance through writer.append_event under an event id derived from
  the task, its state-setting event and the records used; any refusal appends nothing. With unit tests on injected
  stand-ins, a read-only integration test walking this repository's history, and property tests, each test naming its
  AC ids as "TASK-027 ACn".
