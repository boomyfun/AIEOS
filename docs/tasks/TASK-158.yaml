# Authority and scope: BT3b-2c-1 adds ONE new module src/aieos_bootstrap/evaluation_sources.py with three public functions and ONE new test file, and extends EVIDENCE_DEFINING_PATHS (src/aieos_bootstrap/evaluation_policy.py) by six entries, with the matching EXPECTED tuple in tests/unit/test_evaluation_policy.py and the pin of the tuple in tests/unit/test_evaluation_derive.py (D-7063 B3). The module reads the repository ONLY through the existing safe reader base_files.read_file (which reads through gitread's fixed forms) and through evaluation._task_commits and evaluation._changed_paths (the same walk that evaluate_task uses); it starts no process of its own, opens no file, reads no clock, no environment and no network, and writes nothing. It is called by no command yet (2d).
# THE ROUTE (D-7059, D-7060): BT3b-2c is ONE package task (this one); the second package task 2c-2 of the plan is DROPPED: the manifest, its printed hash, its copy in the run record and the guarded append of the ci_records go into 2d (the command), because they need the log, the lock and the writer. The CI fetch is an EXECUTOR script outside the package (gitread allows only git; INV-001). Order: this task, then 2d (aieos evaluate), then BT5.
