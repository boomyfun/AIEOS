ion_derive.py' (the two checks of base, kept: they test the indices 9 and 8 of the ten-entry tuple and keep the same indices after the append); paths[10:16] equal to the six new entries in the order above. The lines :275-:277 of base are unchanged; :277 then checks that the last entry, src/aieos_bootstrap/ci_evidence.py, is a file, and the existence of evaluation_derive.py stays covered by the test file's import of it (D-7064 E4). No check of base is lost. The after-files' sha256 and the new files' sha256 are brought at approval (the approval script compares the staged files). evaluation_derive.py is NOT in the write set: the F2 limit (its docstring line 4 is false read literally) is CARRIED, not fixed here; if a later review finds that this task must touch evaluation_derive.py, F2 is fixed in the same change.
