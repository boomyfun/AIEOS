objective: >-
  Add src/aieos_bootstrap/evaluation_sources.py and tests/unit/test_evaluation_sources.py, and extend EVIDENCE_DEFINING_PATHS (src/aieos_bootstrap/evaluation_policy.py) by six entries (AC7), with the matching EXPECTED tuple in tests/unit/test_evaluation_policy.py and the pin of the tuple in tests/unit/test_evaluation_derive.py (D-7063 B3). THE FUNCTIONS. (1) load_sources(repo, policy_ref, evaluated_commit, task_id, ci_logs, read=None, max_commits=1000) returns a mapping with exactly the keys result, sources, changed_paths, provenance and findings. result is "present" or "refused". On present: sources is a dict with exactly the twelve keys of eval_inputs (intent_versions, owner_kept_rules, articles, default_profiles, requirement_profiles, evidence_comparison, delegation, auto_accept, level_version, ruleset_version, policy_version, risk_rules; eval_inputs.py :69-71), changed_paths is the sorted unique list of the task's change, provenance is a list of facts that only the loader knows (AC2), findings is []. On refused: sources and changed_paths are None, provenance is [] and findings is exactly ONE {reason, detail}; the answer is never partial. The reasons of load_sources are a closed set: argument, read, policy, rules, pin, governor, git, plain (AC6 gives the sets of the other two functions). (2) pinned_governor(ci_logs) returns {value, findings}: the sha256 that the CI printed as AIEOS_PINNED_GOVERNOR (AC3). (3) parse_json(text) returns {value, findings}: a pure JSON text parser that refuses NaN, Infinity and -Infinity, a repeated object key and anything that evaluation_derive.plain_data_problem refuses (AC4). THE I/O: none of its own; reads go through base_files.read_file and the two evaluation helpers, with the injectable seam read (default gitread.run). It never raises an Exception. THE INTENT VERSIONS: the source intent_versions has NO producer in this task (Q-IV, decided at D-7061: an open gap, None, and a new deferred item DEF-0156), so every real evaluation is refused as a gap by eval_inputs until the mapper exists (AC9).
