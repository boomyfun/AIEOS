constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      launch_outside by stand-ins (keyword callees; a counting clock; a counting starter): a granting begin gives one
      begin call with (root, root, task_id, 'claude_code', None, 'aieos cli launch', 'aieos cli launch', now, now +
      LAUNCH_LEASE), then one contract_at call with (root, head_commit, task_id), then one starter call with a copy
      of the grant's environment, then one finish call with (root, task_id, session_id, fencing_token, now2, the
      contract's write_set paths, [], 'aieos cli launch for session ' + session_id), then one write_handoff call with
      (root, task_id, session_id, None), in that order, no finish_outside call, and "done" with the session id, start,
      end and handoff the callees' dicts, run "returned", and start's and finish's str findings kept; each callee
      defaults at call time (mock.patch.object of launcher.start, launcher.end, launcher.end_outside,
      base_inputs.contract_at and handoff_file.write made after import are the ones called); the result has exactly
      LAUNCH_KEYS, with None for each step not reached.
  - AC2: >-
      launch_outside's failures: each wrong argument gives "argument" with nothing called; a raising or out-of-form
      clock gives "clock" with nothing else called; a begin giving "not granted", "refused", a non-dict or a raise
      gives that outcome with reason "start", "start" None for the non-dict and the raise, and no contract_at,
      starter, finish, finish_outside or write_handoff call; a granted answer out of form (session_id, fencing_token,
      head_commit or environment) gives reason "start", no starter call, and one finish_outside call with (root,
      session_id, now2, the recorder) when session_id is a str; contract_at findings, a raise, a write_set out of
      form, an empty paths list, or a path outside _LAUNCH_PATH or with an empty segment ('a b', 'x//y') give reason
      "contract", no starter call, no finish call and one finish_outside call; a raising starter (an Exception) gives
      "run" with finish and write_handoff still called; a starter raising KeyboardInterrupt has finish and
      write_handoff called and the KeyboardInterrupt re-raised; finish "refused" with reason "argument" or "record"
      is followed by one finish_outside call, whose answer is in "end"; finish "refused" with reason "held" or
      "lease_rows" is followed by no finish_outside call; an end other than "done", a raise or a non-dict gives "end"
      ("end" None for the raise and the non-dict) with no write_handoff call and the "handoff: not written" finding;
      write_handoff "refused", a raise or a non-dict gives "handoff"; no Exception escapes; by ast, launch_outside
      and the names beginning _launch name no open, exec, eval, compile, __import__, subprocess, os, sys or time.
  - AC3: >-
      handoff_file.py's docstring holds "calls write after the launcher" and not "nothing calls write but its tests",
      keeps the other eight phrases of tests/unit/test_handoff_file.py :301-303 as widened, and holds no project-state
      directory name; handoff_file.py's diff from the base replaces the docstring's :18-19 lines by the reworded lines
      and changes no other line (checked at G3 by a scratchpad git-diff script).
  - AC4: >-
      The command launch by stand-ins (mock.patch.object of launcher.launch_outside; a counting clock): "launch TASK-1
      --root R" with no starter (main's default) gives exit 1 and the one finding NO_STARTER with neither the clock
      nor launch_outside called; with a starter, one launch_outside call with (R, 'TASK-1', the clock, the starter);
      "launch", "launch --root R", "launch TASK-1", "launch task-1 --root R", "launch TASK-1 --root R extra" and
      "launch TASK-1 --root R --json --json" give exit 2 and USAGE with nothing called, inside a runtime too; an
      environ holding any one of the three RUNTIME_VARS ('' included) gives exit 1 and LAUNCH_RUNTIME_REFUSAL with
      nothing called, starter given or not; "done" gives exit 0 and the four lines then one "finding:" line per
      finding, or under --json the exact string '{"findings": [...], "session_id": "..."}'; "not granted" and
      "refused" give exit 1 and "finding: launch: <result> <reason>" then the findings, a "refused" with reason "end"
      (end a refused dict) and one with reason "handoff" (handoff a refused dict) among them; each answer out of form
      (not a dict, a dict subclass, other keys, a result outside the three, a done with a reason, a done with
      session_id None, a done whose start, run, end or handoff is out of form, a start, end or handoff that is
      neither None nor a dict, a run outside its three forms, a reason outside LAUNCH_REASONS, a non-str finding)
      gives the out-of-form finding; a raising launch_outside gives "launch: a step raised <type>"; a raising
      _render_launch gives "cli: a step raised <type>"; tasks', end's, status' and init's tests all still pass.
  - AC5: >-
      The modules: launcher.py's import set equal to the widened test (base_inputs and handoff_file added);
      launcher.py's diff from the base is the added docstring paragraph after :130, the two import lines and a block
      after :765 only (checked at G3 by a scratchpad git-diff script); its names test (:707-719, as widened: the
      'write' attribute allowed only on the Name handoff_file) passes, and fails for launcher.py with any other
      'write' attribute; launcher._LAUNCH_PATH.pattern equals claude_code_channel._PATTERN.pattern; cli.py's imports
      unchanged and its refused names and strings (tests/unit/test_cli.py :333-356, :369-375) pass; the
      deterministic rule passes with launcher.py, handoff_file.py and cli.py at NONE; the new test file uses no
      tempfile, sqlite3, shutil, subprocess or open, roots only the literal 'C:/launch-root-94', and uses no
      one-argument .replace() and no .replace(target=...).
  - AC6: >-
      Docstrings: launcher.py's module docstring gains a paragraph holding "launch_outside", "TASK-094", "no starter",
      "max_risk None", "reads the caller's clock" and "end_outside", and keeps every phrase of
      tests/unit/test_launcher.py :722-733, tests/unit/test_launcher_gone.py :420-429 and
      tests/unit/test_launcher_outside.py's launcher docstring test; cli.py's gains "aieos launch", "TASK-094" and "no
      runtime starter", holds "COMMANDS, tasks, end, status, init or launch" and "end and init call it after the
      parse" and not "COMMANDS, tasks, end, status or init" nor "comes with a later task", and keeps every phrase of
      tests/unit/test_cli.py :405-411, tests/unit/test_launcher_outside.py :609-620 and CLI_KEPT; USAGE names launch;
      the widened tests of tests/unit/test_cli_init.py and tests/unit/test_execution_status.py pass; every test of
      tests/unit/test_cli_launch.py names "TASK-094 AC", checked by its own naming test, more than 20 tests.
  - AC7: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) begin called with a max_risk other than
      None (AC1); (2) begin bound at import time (AC1); (3) the starter called before contract_at (AC1); (4) finish
      not called after a raising starter (AC2); (5) write_handoff called after a failing finish (AC2); (6) the starter
      called on a contract_at failure (AC2); (7) finish called with write_set [] in place of finish_outside on a
      contract failure (AC2); (8) a non-empty allowlist passed to finish (AC1); (9) write_handoff given a commit
      (AC1); (10) the starter called on "not granted" (AC2); (11) a raise escaping launch_outside (AC2); (12)
      launch_outside naming os (AC2, AC5); (13) the command calling the clock with no starter (AC4); (14) the command
      calling launch_outside with no starter (AC4); (15) the command not refusing inside a runtime (AC4); (16) the
      in_runtime check made before the parse (AC4); (17) a refusal giving exit 0 (AC4); (18) the --json line without
      sort_keys (AC4); (19) cli.py importing handoff_file (AC5); (20) a line of launcher.py's init_project changed
      (AC5, the G3 diff script); (21) a code line of handoff_file.py changed (AC3, the G3 diff script); (22) finish
      given the bare LAUNCH_RECORDER, without the session id (AC1); (23) launcher.py with a writer.write attribute
      (AC5, the widened names test); (24) finish and write_handoff skipped on a KeyboardInterrupt from the starter
      (AC2); (25) _LAUNCH_PATH altered to allow a space (AC2, AC5); (26) no finish_outside after a finish refused
      "record" (AC2); (27) the write set's path check dropped (AC2); twenty-seven copies in all; each copy made in a
      scratchpad script at G3, not committed; the governor's evaluate at acceptance (the shadow) with any difference
      named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6]}
  - {gate: G3, check: constitution, args: [AC7, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: true
