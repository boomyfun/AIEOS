# GENERATED by scratch script fill_contract_166d.py: base_commit, intent_versions, read_set, forbidden, the write list of capabilities, the touch list of AC12 and the prediction text of AC11 are filled by script. Lines cited are of main ea9ccb57.
task: TASK-166
contract_version: v1
task_type: implementation
objective: >-
  Let aieos evaluate take the reviews of a task's applicable articles (design B1 of D-7493): an optional reviews file, whose entries a pure maker in evaluation_intake.py turns into review records bound to the evaluated commit and the intent versions of the evaluation's own sources, appended in the same guarded batch as the CI records and named by the file's SHA-256 in the manifest. A review record never has the CI source class. With every needed record present, a run-made low task can reach table row 5 (NEEDS_REVIEW); this task claims nothing about a real run.
