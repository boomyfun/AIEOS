acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only paths of the write set. Production changes only: cli.py (the optional flag --reviews of evaluate, the reading of that file, its refusal text, the usage text and the docstring), evaluate_command.py (an optional last keyword reviews_text, default None, the review step, the records in the append batch, the manifest argument and the docstring), evaluation_intake.py (one new public function read_reviews, the private constants and helpers it needs, an optional last parameter reviews_sha256 of manifest, and the docstring). No production module is added; the only imports added are pathlib in cli.py and governor in evaluate_command.py. Tests are added in the write-set test files; an existing test changes only where this contract makes its pinned text false: the usage line of evaluate, the public names of evaluation_intake, the pinned import set of cli.py (test_cli.py, which gains pathlib) and the pinned import set of evaluate_command.py (test_evaluate_command.py, which gains aieos_bootstrap.governor). Every other existing test passes unchanged.
  - AC2: >-
      The maker. evaluation_intake.read_reviews(text, task_id, evaluated_commit, profile, intent_versions, recorder) returns a mapping with exactly the keys result ("present" or "refused"), records, sha256 and findings (on a refusal records and sha256 are None and findings holds one {reason, detail}). text must be a str that UTF-8 can write, parsed by evaluation_sources.parse_json into a non-empty list of at most 100 entries; sha256 is that of the text's UTF-8 bytes. profile is the derived evidence profile (a list of {dimension, evidence_types}). Each entry is an object whose keys are exactly, by its evidence_type: other_model_review: dimension, evidence_type, commit, outcome, decision_ref, models (exactly reviewer and implementer, non-empty texts that differ); decision_agent_review: dimension, evidence_type, commit, outcome, decision_ref, basis (a non-empty text), stands_for (one of human_review, human_security_review, ai_review (cross-model)). Any other evidence_type, human_review and human_security_review among them, or any other key, the key source_class among them, refuses: no record of the class human_authority is made by this command, and the way a person's own review enters is later work. outcome is pass or fail; commit must equal evaluated_commit; the profile must hold, under the entry's dimension, a type that the record can satisfy alone or as one half of the cross-model pair: ai_review or ai_review (cross-model) for other_model_review, its stands_for for decision_agent_review; otherwise the whole file is refused. The reason of the finding is argument (an argument out of form, among them an intent_versions that is not a mapping from ids to versions v and digits and a profile that is not a list of mappings of a dimension and its evidence types, or an unexpected Exception), json (parse_json refuses the text) or entry (the list or an entry is out of form, or the profile asks for no such review under the entry's dimension). Each record has the keys record_id, fact_kind (observation), source_class (same_lineage_review for other_model_review, decision_agent for decision_agent_review; never a CI class and never human_authority), recorder, subject (the task), commit, intent_versions (a copy), evidence_type, dimension, outcome, decision_ref, and as its type models, or basis and stands_for. record_id is the SHA-256 of "review-record", the task, the commit and the entry's canonical JSON text (json.dumps with sort_keys=True, separators=(',', ':') and ensure_ascii=False) joined by line feeds. Entries equal in canonical text make one record. Every record passes records.check_record. The function opens no file and never raises an Exception.
