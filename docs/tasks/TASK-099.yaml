# Task contract TASK-099, the risk rules policy v5 (rule R13, native/** high), RISK-01's next fixture version and the
# next set file, with the tests that pin them (M8 plan, docs/plan/m8-plan.md §3; decisions D-3336 (E4), D-3345 and
# D-3347: the native implementation lives under native/, which no rule of policy v4 classes, and RISK-01's fixture
# carries the policy's rules as values). Revision 0, drafted under decisions D-3345 (O1), D-3346 (C3), D-3347 (C3) and
# D-3366; brought for approval in its own request; whether it is approved is recorded in the decision files, not here.
# Fields and value forms follow specification 2 §5.1 and TASK-040's contract, whose method this task repeats.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Numbering (D-3347 C3): docs/plan/m8-plan.md :8 names "TASK-099" for the native governor; under D-3345 this fixture
# task is TASK-099 and the native governor is TASK-100; m8-plan.md :24's "before TASK-099's contract" is met by this
# order (the v5 rule is approved and frozen before this contract). The plan's wording is fixed in its next change.
# The three data files are already approved and frozen by hash before this task (conformance-files.md section 7,
# revisions 5 and 8, as revision 10 keeps them; decisions D-3347, D-3350 and D-3356; DM F68 to F70; records
# TASK-099-freeze-risk-01 and TASK-099-freeze-set of docs/records/TASK-099.jsonl, on main since commit ad76ac1a): the
# policy 9a740f4d882f5519b9d5c28227c89a7a47eeb360416cff81904b37f2c71e205b (F68), the fixture
# 463c772e4be707b82ebf31b918a2ddf5fc292f21dbeba8d341fe2931e44709af (F69) and the set file
# f3297aec6d9ba78df02c7e335cb64e26dd43ee5583b94f8ba45ac9bdaaa5e5ec (F70). At each of the task's commits and at its
# acceptance the three files must be exactly those bytes (AC1); other bytes need a new decision first; the acceptance
# cites those approvals and gives no other.
# A scratch run (session 87e2584b, decision D-3366: a clone at ad76ac1a with only the three files put in place, the
# suite run by groups on a compiled tree) gave unit 2240 tests with 6 failures, integration 180 with 12 failures (1
# skipped), property 202 with 3 failures: 21 failures, 0 errors, in twelve test modules, each failure a pin of the old
# values: the rule ids R1 to R12 (one); fixture_set_version 5 (six, through check_set's three copies and the end-to-end
# assertions); the set file's one freeze record of TASK-059 (one); RISK-01's frozen SHA-256 in the runner tree-run
# modules and the Capability Boundaries set pins (CB_SET_SHA256 d237d5dc… and fixture_set_version 5) in the seven
# modules that hold them (thirteen). So the test modules change only those pins, each to the new exact value, and the
# docstrings and comments that name the old row, hash or version (AC2 to AC6).
# A second scratch run (decision D-3369), with the pin edits of this file's appendix made by script in the same
# clone, gave no failure in any group (unit 2240, integration 180 with 1 skipped, property 202), so no failure was
# masked by another. The appendix lists every pin edit by file:line with its old and new text (D-3346 C3).
# The id: TASK-098 is the highest contract id used; TASK-099 is the id decisions D-3345 and D-3356 gave this task and
# its freeze records name.
# Task type: fixture (docs/specs/conformance-files.md section 8, revision 9 as revision 10 keeps it, DM F45): the
# fixture and the set file are files of sections 2 to 4 under tests/conformance/; the five test_conformance_* modules
# check only those files; the seven runner and governor modules change only pins of the files this task writes, each
# with one exact new value (section 8 (i), shown by AC9's script); the policy changes only to the bytes F68 approves
# before the task (section 8 (ii)). GOV-002 does not apply, as the constitution writes its applicability
# (implementation, refactoring); every other article whose applicability names implementation is applied as to an
# implementation task, so no evidence requirement narrows (section 8; CR-002 part 4 limit 8).
# Readers of the changed paths: the governor and the CI's base conformance runs read the policy, the set file and the
# fixtures from the base, so this task's own pushes run the base's (RISK-01 against v4's rules) and the first
# conformance run over the new files is the base run of the next push after this task lands; scope_drift.py and
# scope_reconcile.py read the policy's non-task list and rules at a base, and the non-task list does not change;
# tests/integration/test_resume_log_inputs_repo.py reads the policy at the fixed commit ed4d482e and does not move
# (D-3346); tests/run_tests.py and the CI's unit_test, integration_test and property_test steps run the changed modules.
# Risk: critical. R6 matches docs/specs/** (critical) and R11 matches tests/conformance/** (critical); R3 read fail
# closed matches tests/** (high); the highest wins (risk rules section 2 point 1); computed over the base by script, its
# output in the approval request.
# Profile (assurance-model.md §5, gov-AIEOS, critical): unit_test, integration_test, property_test, deterministic_rule,
# static_security_analysis, ai_review (cross-model) and human_review; plus the evidence_required of the applicable
# articles.
# Change class: critical_cr (reading, fail closed, as TASK-040's): GOV-003's tool part over the base marks the test
# modules as evaluator paths, all modified, whose assertions change; the data files change under freezes already given
# (DM B10: normal_cr with a freeze). The stricter class is taken.
# Freeze: no freeze approval is given in this task's acceptance (section 7, revisions 5 and 8, (c) and (e)): the
# acceptance cites TASK-099-freeze-risk-01, TASK-099-freeze-set and F68. No other fixture changes.
# Reviews (as TASK-040's): five way-2 reviews by a Claude model other than the implementer's, each brief to the decision
# agent first (architecture, security, governance (GOV-003, that no test is weakened, by vacuity included), operational,
# and the cross-model half), and the decision agent's reviews (architecture human_review, also checking that the fixture
# and the set file name the policy and the fixture faithfully; operational human_review; the cross-model half). Each
# reviewer's prompt is self-sufficient, every input a copy under the scratchpad's review folders.
# The contract itself had one way-2 review, of r1 (D-3367); the reviews above are the task's, at its acceptance.
# Evaluation path (A61; as TASK-040): the approved contract is committed on main as its own commit C, which changes only
# docs/tasks/TASK-099.yaml and has one parent equal to base_commit, and is pushed normally; the files are made in
# scratchpad clones (push URL disabled, the no-reply identity set first), the suite run on a compiled tree (L-0018); the
# task's commits, each carrying the trailer "AIEOS-Task: TASK-099" and no e-mail address in its message, go to the
# branch task/TASK-099 on GitHub, each push under its own decision after a secret scan, a check of the three files'
# SHA-256 (AC1) and a dry run, never by force and never deleting; the CI channel's records are re-fetched into
# docs/records/TASK-099.jsonl after the two freeze records, which stay its first lines; main receives the task only at
# its acceptance, by a fast-forward under its own decision (or by rebuilt commits checked equal).
# Not applicable: GOV-002 (above); OPS-001 (the task changes no ref); INV-009, INV-011, GOV-001, GOV-004, GOV-005,
# GOV-006 and SEC-003 (their scopes meet none of the write-set's paths (reading); the policy is not a Genesis-bound
# artifact (reading)).
# Owner-kept acts: none. Nothing under .github/, no workflow change, no Claude Code setting (CR-002 part 4 limit 5 does
# not apply); no class is lowered and no evidence requirement is weakened (limit 8 does not apply; F68). Approver of the
# acceptance (reading): one delegated approval of the decision agent (Master Plan §6).
# Uncovered and stated limits: this task's own conformance runs take the policy, the set file and the fixture from the
# base, so no CI conformance run over the new files exists before the task lands; RISK-01's first run over v5 is the
# CI's base run after landing, advisory and not part of this acceptance; no native code exists yet, so R13 classes no
# change until the native governor's task (TASK-100); every review is by AI of one vendor.
