acceptance_criteria:
  - AC1: >-
      The state. A test that needs RISK-01's state reads the set file of the tree (conformance.SET_FILE, unwrapped as
      the runner reads it) and takes the entries whose capability is Risk Engine; it asserts that their ids are exactly
      [RISK-01] and that its fixture is either null (the null state) or has the path conformance.expected_path gives for
      it and the sha256 8a0bdb1665dc30998fae3a6926a37f854a38780695e6276d62ce5d9ece06a45b, which is that file's SHA-256
      in the tree and the hash that DM row F34's freeze binds (the present state); any other value fails the test. No
      test reads the state from anywhere else.
  - AC2: >-
      Class (a), the fixed set value. In each of tests/unit/test_runner.py, tests/unit/test_runner_rc.py and
      tests/property/test_runner_properties.py, the helper that returns TASK-013's fixed set value (fixed_files and the
      helpers built on it) also sets the fixture of every Risk Engine entry to null, so its bytes keep the SHA-256
      158323324f2803bceee870403bc6c0e297c407fbe50902d60bec90624cc95208 (the set file at 1659a8cb, frozen by TASK-002's
      record) in both states, and the existing pin test of that hash stays byte-equal. The class (a) tests of D-481 pass
      unchanged through it: in test_runner.py FixedSetValue.test_the_fixed_value_is_the_frozen_set_file,
      R1ReaderAndRoot.test_the_running_runner_must_be_the_roots,
      R3DoesNotCount.test_a_stand_in_never_counts_but_its_results_are_computed, R6EntryPoint.test_absent and
      test_loaded_from_the_root, R8RunRecord.test_outcome_pass_and_fail and R9Main.test_output_and_return_values; in
      test_runner_rc.py FixedSetValue.test_the_fixed_value_is_the_frozen_set_file; in test_runner_properties.py
      FixedSetValue.test_the_fixed_value_is_the_frozen_set_file. A script shows every line of the three modules outside
      the changed lines of the helpers byte-equal and in order before and after, and every assertion line byte-equal.
  - AC3: >-
      The mirror. In tests/unit/test_runner_rc.py, the test R6RunRecord.test_the_outcome_with_a_resume_check_scenario
      takes an in-memory mirror that also holds every .py file of conformance.RISK_FIXTURE_DIR as the tree holds them
      (a new helper; real_files() itself does not change), so that a run over the mirror equals the run over the tree in
      either state. Its assertions stay byte-equal and hold in both states; if one cannot, the worker stops before any
      task commit and brings it to the decision agent, whose ruling is recorded as an erratum by decision (decision
      D-359's route).
  - AC4: >-
      Class (b), the null state keeps every assertion. The tree-run tests test_runner_risk_run.py
      RunnerRiskEndToEndTest.test_the_tree_as_it_is, test_runner_rc_run.py
      R7RepositoryTree.test_ac8_the_results_over_the_repositorys_tree_are_unchanged, test_governor_conformance.py
      GovernorConformanceTest.test_the_verification_scenarios_pass_and_the_others_are_not_run, and test_runner_run.py
      RunnerEndToEndTest.test_no_governor, test_a_stand_in_that_answers_from_the_expected_values and
      test_a_stand_in_with_one_decision_outside_a_list read RISK-01's state by AC1 and branch on it. In the null state
      each asserts exactly what it asserts at the base: a script shows that every line of the four modules at the base is
      present, byte-equal after stripping its leading spaces and in order, in the changed module, and lists every
      re-indented line; no added line in the null-state path is a return, a raise, a skip or a condition that can be
      true in the null state and leave a kept assertion unexecuted; the script prints each added control-flow line with
      the branch it guards; the added lines hold no assertion that a value may be either of two results.
  - AC5: >-
      Class (b), the present state is exact. In the present state each test of AC4 asserts exact values, never one of
      several: every scenario's result and, for each NOT_RUN, its reason; the record's outcome and the run record's
      counts. RISK-01 is never dropped from a compared map. In the null state RISK-01 is (NOT_RUN, 'no fixture') in
      every test, as at the base. In the present state: for test_runner_risk_run.py test_the_tree_as_it_is,
      test_runner_rc_run.py's R7 test and test_governor_conformance.py's test, run with the root's governor, RISK-01 is
      (PASS, ''), ADV-02 stays (NOT_RUN, 'no fixture'), every other scenario's result and reason is as in the null
      state, and test_the_tree_as_it_is asserts the record's outcome pass; for test_runner_run.py's
      test_a_stand_in_that_answers_from_the_expected_values and test_no_governor, RISK-01 is
      (NOT_RUN, 'the entry point is absent'), and for its test_a_stand_in_with_one_decision_outside_a_list RISK-01's
      reason is 'the entry point is absent', every other value as in the null state. These are the values a run of the
      tests with unittest's diff limit removed gave over AC7's simulation at 4238c4bf (full_diffs.py, archived with the
      evidence of session b94736f9); the request that brings the first push shows them again at the task's commit. The
      simulated RISK-01 PASS is worker evidence about the tests, not conformance evidence (TASK-017 AC15); RISK-01 is
      first run as conformance by the CI's base run after TASK-020 lands.
  - AC6: >-
      Nothing else changes. Every other test that tests/run_tests.py runs passes unchanged at the task's commit. The
      changed modules name the Risk Engine fixture folder only through conformance.RISK_FIXTURE_DIR,
      conformance.expected_path or the constants they hold at the base, and the Resume Check fixture folder only as
      TASK-013's AC6 allows, so the folder checks of tests/integration/test_conformance_rc_set.py and
      tests/integration/test_conformance_risk_set.py are unchanged in outcome.
  - AC7: >-
      Both states, by the whole suite. At the task's commit, tests/run_tests.py passes in full over the tree (the null
      state) on a compiled tree. In a scratch clone at the task's commit with the present state simulated by the script
      simulate_set.py of decision D-481 (RISK-01's entry naming the frozen fixture with its SHA-256,
      fixture_set_version 3, one freeze record of the new hash), on a compiled tree, the failing tests are exactly the
      four class (c) ids of decision D-481 (test_conformance_files SetFileTest.test_the_set_file; test_conformance_rc_set
      RcSetTest.test_the_set_file_is_unchanged_and_frozen; test_conformance_set
      ConformanceSetEndToEndTest.test_the_set_binds_the_bound_file and test_the_whole_set) and nothing else. Both runs
      and the id comparison are in the request that brings the first push.
  - AC8: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The modules import only what they import at the base and
      the standard library; they use no exec, eval, compile, __import__ or importlib, start no process, open no
      network connection, call no model and write no file; they name no project-state directory. The CI steps at the
      task's commits report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit, as TASK-006's
      contract lists them. Before each commit, the added text and the file names are scanned with the workflow's
      SEC-001, SEC-002 and OPS-003 patterns and the records executors' pre-push pattern (D-282), and each count is 0.
  - AC9: >-
      Does not loosen (GOV-003), and the limits. A script over the base and the task's commit shows: no assertion line
      of the seven modules removed or changed other than by re-indentation under AC4; no test removed or skipped; every
      added assertion compares with one exact value; the count of assertion calls in each module does not fall; and no
      added control-flow line bypasses a kept assertion in the null state (AC4). Limits: until TASK-020 lands, the
      present state is run only by AC7's simulation; the exact present-state results rest on the frozen fixture of F34
      and the governor at the base; AC2's pin fails closed if TASK-020 changes the set file beyond RISK-01's fixture and
      fixture_set_version.
  - AC10: >-
      Tests, with this rule-to-test list: R1 AC1 (a wrong state fails: the state check run over an in-memory set value
      with RISK-01's fixture naming another path, or another hash, gives a failure); R2 AC2 (the pin of the fixed value's
      SHA-256, unchanged; the line check by script); R3 AC3 (the mirror test passes over the tree and under AC7's
      simulation); R4 AC4 (the line check by script; the null branch passes over the tree); R5 AC5 (the present branch
      passes under AC7's simulation); R6 AC7 (both suite runs). tests/run_tests.py, unchanged, runs them.
