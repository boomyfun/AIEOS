# Task contract TASK-019, the runner tests that depend on the set file's RISK-01 entry, made to hold in both states of
# that entry (Master Plan revision 3, §4 M4; M4's work order of decision D-429 as refined by decision D-459: RISK-01's
# step 3 split into TASK-018, the fixture, TASK-019, the runner tests, and TASK-020, the set file's entry with its freeze
# first; specification 2 §5.1). Revision 0, drafted under decisions D-480 and D-481; revision 1, under decision D-482
# (E1, E2); whether it is approved is recorded in the decision files, not in this file. Fields and value forms follow
# specification 2 §5.1 and TASK-013's contract, whose method this task repeats for the Risk Engine entry. Readings
# marked "(reading)" are the worker's, for the decision agent's ruling.
# Why (D-480, D-481): TASK-020 will give RISK-01's set entry the fixture TASK-018 added and froze (DM F34). A scratch run
# of the whole suite at 4238c4bf with the set file in that state (RISK-01's entry naming
# tests/conformance/fixtures_risk/risk_01.py with its SHA-256 8a0bdb16…a45b, fixture_set_version 3, one freeze record of
# the new hash; the script simulate_set.py, archived with the evidence of session b94736f9) gave "FAILED (failures=20)":
# classified by script and confirmed by decision D-481, 9 in tests that build their files on a fixed set value
# (class (a)), 7 in tests whose point is a run over the repository's tree or its in-memory mirror (class (b)), and 4 in
# test_conformance_* modules, which belong to TASK-020 (class (c)); a control run without the scratch freeze record
# showed that none is caused by the simulation itself. A fixture task may change only files under tests/conformance/
# and test_conformance_* modules (conformance-files.md section 8), and an implementation task may not change
# tests/conformance/**, so the seven modules of classes (a) and (b) change first, in this task, and no assertion
# becomes weaker (D-364's stricter form, applied by D-480).
# The id: TASK-018 is the highest id used (checked by script against docs/tasks/ and the decision files), so this is
# TASK-019; TASK-020 is the next (D-459).
# Task type: implementation (reading, as TASK-013's: the changed paths are tests of the conformance runner, of its
# Resume Check and Risk Engine parts and of the governor's conformance run, not tests of the conformance files of
# section 8, so not a fixture task). GOV-002 applies: tests/conformance/** is forbidden.
# Readers of the changed paths: tests/run_tests.py and the CI workflow's unit_test, property_test and integration_test
# steps run them; tests/integration/test_conformance_rc_set.py and tests/integration/test_conformance_risk_set.py read
# the bytes of every .py file under src/ and tests/ for their fixture folders' last path parts and allow them only in
# the modules they list (test_conformance_risk_set.py: conformance.py, test_runner_risk*.py, the set file and its own
# three modules, with erratum E1 of decision D-472), so the changed modules name the Risk Engine fixture folder only
# through conformance.RISK_FIXTURE_DIR, conformance.expected_path or the constants they hold at the base (AC6); no other
# file imports or reads them (checked by script).
# Risk: high, to be computed over the base by script and its output pasted unedited in the approval request (decision
# D-428 C3): R2 matches tests/** (medium); R3 read fail closed matches tests/** (high; risk rules section 2 point 3); no
# path of the write set meets R11 (tests/conformance/**); the highest wins. Profile (assurance-model.md §5, gov-AIEOS,
# high): functional [unit_test], architecture [deterministic_rule], functional [integration_test], security
# [static_security_analysis] and architecture [ai_review (cross-model)], plus the evidence_required of the applicable
# articles (none adds an entry). Dimensions are named as TASK-006's records name them (decision D-181, reading R-dim).
# Change class: critical_cr (reading, fail closed, as TASK-013's): the seven modules are tests of the conformance
# runner, of its Resume Check and Risk Engine parts and of the governor's conformance run, evaluator parts (DM A29), so
# the change is judged by the base version and never auto-accepted (constitution GOV-003; governor-spec.md §8);
# computed by script.
# Evidence: the task changes no evidence requirement and weakens no test (D-364): every assertion line of the class (a)
# tests is kept byte-equal (AC2); the null-state branch of every class (b) test keeps today's assertions (AC4), and the
# present-state branch asserts exact values of its own (AC5); a script shows that no assertion line is removed and none
# added that accepts either of two values (AC9).
# Reviews (as TASK-013's): five way-2 reviews by a Claude model other than the implementer's, each brief to the decision
# agent first (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002; governance
# ai_review for GOV-003, which also checks that no test is weakened; operational ai_review for OPS-003; the cross-model
# half), and three decision-agent reviews (architecture human_review for INV-003; operational human_review for OPS-002;
# the cross-model half). Each way-2 review record's basis names every article whose entry it covers. Each reviewer's
# prompt is self-sufficient, with the scratchpad's absolute path in its first line (D-277).
# Evaluation path (A61; as TASK-013 to TASK-018): the approved contract is committed on main as its own commit C, which
# changes only docs/tasks/TASK-019.yaml and has one parent equal to base_commit, and is pushed normally; the files are
# drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first), the suite run on a
# compiled tree as the CI's G1 step leaves it (L-0018); the task's commits, each carrying the trailer
# "AIEOS-Task: TASK-019" and no e-mail address in its message, go to the branch task/TASK-019 on GitHub, each push under
# its own decision of the decision agent after a secret scan and a dry run against a bare copy, never by force and
# never deleting; the CI channel runs on each push and its records are re-fetched into docs/records/TASK-019.jsonl;
# main receives the task only at its acceptance, by a fast-forward under its own decision (or, if main has moved, by
# rebuilt commits checked equal, as decision D-475 C3 did).
# Not applicable: OPS-001 (scope: the repository's refs; the task changes no ref); INV-005 (scope: the decision engine
# and the governor; tests of the runner meet neither); INV-006 to INV-011, GOV-001, GOV-004 to GOV-006 and SEC-003
# (their scopes meet no path of the write set).
# Owner-kept acts: none. Nothing under .github/, no workflow change, no Claude Code setting (CR-002 part 4 limit 5 does
# not apply).
# Uncovered and stated limits (AC9): until TASK-020 lands, the tree is in the null state of RISK-01's entry, so the
# present-state branches run only over the simulation of AC7 (a scratch clone), not over the tree; the exact
# present-state results rest on the frozen fixture of F34 and the governor at the base; the simulated run that gives
# RISK-01 PASS with the root governor is worker evidence about the tests, never conformance evidence (TASK-017 AC15);
# the fixed set value of AC2 is the set file at 1659a8cb, so a TASK-020 that changes any other field of the set file
# than RISK-01's fixture and fixture_set_version makes AC2's pin fail, and TASK-020 must then bring it (fail closed);
# every review is by AI of one vendor.
task: TASK-019
contract_version: v1
task_type: implementation
objective: >-
  Change only seven test modules so that every test of theirs passes in both states of the set file's RISK-01 entry
  (fixture null, the null state of the tree today; the frozen fixture tests/conformance/fixtures_risk/risk_01.py of
  F34, the present state TASK-020 makes), with no assertion weakened. In tests/unit/test_runner.py,
  tests/unit/test_runner_rc.py and tests/property/test_runner_properties.py, the fixed set value of TASK-013's AC2 also
  sets the Risk Engine entry's fixture to null, so it stays the set file at 1659a8cb in both states, with every
  assertion line of the class (a) tests kept; the mirror test of AC3 takes an in-memory mirror that also holds the Risk
  Engine fixture files. In tests/integration/test_runner_run.py, tests/integration/test_governor_conformance.py,
  tests/integration/test_runner_rc_run.py and tests/integration/test_runner_risk_run.py, the tree-run tests named in AC4
  first read RISK-01's state from the tree, keep today's assertions in the null state and assert exact values of their
  own in the present state. No other test, file, fixture or set file changes.
