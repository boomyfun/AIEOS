# Task contract TASK-017, the conformance runner's Risk Engine entry (Master Plan revision 3, §4 M4; M4's work order of
# decisions D-428 and D-429, RISK-01's step 2; specification 2 §5.1). Revision 1, drafted under decision D-443 (C1 to
# C5) and edited under decision D-444 (E1 to E4), brought for approval in its own request; whether it is approved is
# recorded in the decision files, not in this
# file. Fields and value forms follow specification 2 §5.1 and TASK-006's contract, the same kind of change to the same
# runner. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. Constitution GOV-002 applies: tests/conformance/** (the fixtures and the set file,
# scenario files in the sense of conformance-files.md section 8) is in the forbidden set, so the task can read them but
# never change them.
# What it changes (conformance-files.md revision 7, section 10, DM F33): the runner routes the capability Risk Engine
# to the fixture folder tests/conformance/fixtures_risk/; it checks a Risk Engine fixture's form and the Given, "a
# change that matches no risk rule", from the fixture's values alone with a matcher of its own; per case it calls the
# governor's derivation (derive_inputs), compares the derived inputs at once, then calls the governor's acceptance
# function (evaluate) with the derived inputs and compares the record's profile_used; the capability Capability
# Boundaries stays NOT_RUN. No Risk Engine fixture exists, and the set file's RISK-01 entry is null until TASK-018, so
# over the repository's own tree every run record is unchanged by this task, byte for byte except the runner's own
# sha256 (AC10).
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/conformance.py is read by the CI workflow's
# conformance base run (from the base) and candidate run (from the base too; only GOVERNOR_FILES come from the head),
# and imported by the test modules test_runner.py, test_runner_run.py, test_runner_properties.py,
# test_governor_conformance.py, test_runner_rc.py, test_runner_rc_run.py and test_runner_rc_properties.py. Of these, two
# tests of test_runner_rc.py assert the very limit this task lifts (RISK-01's entry point "absent until its milestone",
# and no expected path for Risk Engine); they change by AC11 and in no other way (decision D-443 C1). Every other
# assertion of those modules must keep passing unchanged (AC13). The run record gains no key (section 10: "The run
# record of section 6 needs no new key"), so the workflow's check of the run record reads the same keys as now and no
# file under .github/ changes. src/aieos_bootstrap/__init__.py's docstring describes the runner's entries and gains
# this one (as TASK-006 changed it); __all__ does not change.
# Risk: high. R2 matches src/** and tests/** (medium); R3 read fail closed matches them too, the runner falling under
# its tag verification (risk rules section 2 point 3); no path of the write set meets R11 (tests/conformance/**); the
# highest wins. Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture
# [deterministic_rule], functional [integration_test], security [static_security_analysis] and architecture [ai_review
# (cross-model)], plus the evidence_required of the applicable articles. The class is to be computed over the base by
# script and its output pasted unedited in the approval request (decision D-428 C3), as for TASK-015 and TASK-016.
# Change class: critical_cr (an evaluator part that enforces acceptance, not bound: DM B1; A29; constitution GOV-003;
# governor-spec.md §8), to be computed over the base by script as for TASK-015 and TASK-016 (the runner is on the
# workflow's pinned evaluator list).
# Reviews (as TASK-006's): five way-2 reviews by a Claude model other than the implementer's, and the decision agent's
# three, each brief naming for testing: that a wrong classification is FAIL and never PASS or a silent NOT_RUN; that
# the runner's matcher reads exactly the pattern forms of risk rules section 2 point 6 and refuses every other; that
# the two changed tests of test_runner_rc.py lose nothing for ADV-02; that a run over the repository's own tree is
# byte-equal before and after; the limits of AC15. Each reviewer's prompt is self-sufficient, with the scratchpad's
# absolute path in its first line (D-277).
# Evaluation path (A61; as TASK-006 to TASK-016): the approved contract is committed on main as its own commit C, which
# changes only docs/tasks/TASK-017.yaml and has one parent equal to base_commit, and is pushed normally; the files are
# drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first); the task's commits,
# each carrying the trailer "AIEOS-Task: TASK-017" and no e-mail address in its message, go to the branch
# task/TASK-017 on GitHub, each push under its own decision of the decision agent after a secret scan and a dry run
# against a bare single-branch copy, never by force and never deleting; the CI channel runs on each push and its
# records are re-fetched into docs/records/TASK-017.jsonl; main receives the task only at its acceptance, by a
# fast-forward under its own decision.
# Not applicable: OPS-001 (the task changes no ref); INV-009, INV-011, GOV-001, GOV-004, GOV-005, GOV-006 and SEC-003
# (their scopes, the event log, the policy, the concept file, the bound artifacts, the decision matrix, the records and
# pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own (CR-002 part 4 limit 5 does not apply).
# Uncovered and stated limits (AC15): no Risk Engine fixture exists and RISK-01's set entry is null, so RISK-01 stays
# NOT_RUN in every run over the repository's tree and nothing here shows that the governor meets RISK-01; the runner
# reads the policy's rules only from a fixture's values, never from the repository (section 10, "Not covered"); in the
# CI channel the base run takes the runner from the base, so this entry first runs there after it lands on main; every
# review is by AI of one vendor.
task: TASK-017
