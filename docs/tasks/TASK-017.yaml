task_type: implementation
objective: >-
  Add to the conformance runner (src/aieos_bootstrap/conformance.py, TASK-003 and TASK-006) the Risk Engine entry of
  docs/specs/conformance-files.md revision 7, section 10: the expected fixture path for the capability Risk Engine;
  the form check of a Risk Engine fixture, with the scenario's Given checked from the fixture's values alone by a path
  matcher of the runner's own for exactly the pattern forms of the risk rules' section 2 point 6; the per-case order
  of the governor's derivation, the comparison of the derived inputs, the governor's acceptance call and the comparison
  of its profile_used; with unit, integration and property tests in new test modules, and the change of exactly two
  tests of tests/unit/test_runner_rc.py that assert the limit this task lifts. It adds no fixture, changes no set file,
  adds no key to the run record, changes nothing a run over the repository's own tree reports, and does not wire the CI
  channel.
