acceptance_criteria:
  - AC1: >-
      Unchanged where the task does not reach (TASK-003's AC1 to AC9 and AC11, TASK-006's AC1 to AC8). The run's
      inputs, the reader and listing, the wrapped-file and canonical-form rules, the set file's form, its freeze
      approval, the governor entry point, the Verification and Resume Check entries and comparisons, the run record's
      keys and its record, and the command-line entry stay as those contracts say, apart from the changes AC2 to AC10
      name. Every result of a Verification or Resume Check scenario is the same as before this task for the same tree,
      governor, Resume Check and stand-ins.
  - AC2: >-
      The route (section 10, "Where the file is"). expected_path gives tests/conformance/fixtures_risk/<module name>.py
      for the capability Risk Engine, the module name formed as section 2 says; Verification and Resume Check keep their
      paths; any other capability (Capability Boundaries) gives none and its scenario stays NOT_RUN for "the entry point
      of Capability Boundaries is absent until its milestone". TASK-006's order is kept: the path, then the row hash, then
      the capability against the bound scenario file, all before the fixture file is read.
  - AC3: >-
      The entry point (section 10, "The entry and the comparison"; GS §4 rule 1). The derivation is the function
      derive_inputs and the acceptance function the function evaluate of the one governor module the runner already
      loads by TASK-003's AC6 (the root's src/aieos_bootstrap/governor.py, by a plain import statement); no other module
      is loaded for it. When that module is absent, failed to load, or has no callable derive_inputs or evaluate, every
      Risk Engine scenario with a fixture is NOT_RUN for "the entry point is absent" (reading: the run's counting stays
      as TASK-003's AC6 gives it for the governor). The run function also takes a derivation function as a test seam
      (reading): a run with a stand-in derivation never counts; the command-line entry never takes one.
  - AC4: >-
      A Risk Engine fixture's form (section 10, the fixture file and its table; section 5 applied). After the
      conditions of TASK-003's AC5 that read the set entry, the row and the file's bytes and hash, and the wrapped-file
      and canonical-form rules, a Risk Engine fixture is malformed, and its scenario NOT_RUN with none of its cases
      run, unless: its object is exactly scenario, row_hash and cases, those two equal to the set entry; cases is a
      non-empty list; each case is exactly values, request, records, when and expected; values is an object with exactly
      the keys section 10's table names (contract, changed_paths, risk_rules, owner_kept_rules, articles,
      default_profiles, requirement_profiles, delegation, evidence_comparison, auto_accept, policy_version,
      level_version, ruleset_version), changed_paths a non-empty list of strings, every rule of risk_rules an object
      exactly {match, class} with match a non-empty list of patterns of AC5's forms and class one of low, medium, high
      and critical, every article an object exactly {id, scope, evidence_required} with scope a non-empty list of
      patterns of AC5's forms, and requirement_profiles the empty list (reading: the runner checks these forms; the
      others are the governor's to read); request has the form TASK-003's AC5 gives a request, with changed_paths equal
      to values.changed_paths and task_state VERIFYING; records has the form TASK-003's AC5 gives records; when is
      evaluate; and expected is exactly risk_not, profile_excludes and not_fixed, with risk_not exactly ["low"],
      profile_excludes exactly the two pairs {dimension functional, evidence_type build} and {dimension functional,
      evidence_type lint} in any order, and not_fixed exactly ["decision", "next_state"] in any order (section 10,
      "Faithfulness": "a fixture with any other list is malformed").
  - AC5: >-
      The Given and the runner's own matcher (section 10: the Given is checked "from the values alone, without the
      governor under test"; risk-rules-gov-aieos.md section 2 point 6, line 21). The matcher is a function of the
      runner, never imported from the governor or any other module. A pattern is well formed only if it is a non-empty
      string of names joined by "/", each name non-empty, with no leading or trailing "/", and each name holds only the
      ASCII letters, the digits, ".", "_", "-" and "*" (decision D-444 E2); "**" is allowed only as a whole name; every
      other character makes the pattern ill formed. The only pattern characters are "*" and "**" as point 6 defines
      them: "*" matches any part of one name and never crosses "/"; "**" as a whole name matches any sequence of names,
      so a trailing "/**" matches every file at any depth below that folder and "**/x/**" matches x at any depth; a
      pattern without "/" matches a file name in any folder; matching is case-sensitive on the path as given. An ill
      formed pattern makes the fixture malformed (NOT_RUN). Each path of changed_paths must be names joined by "/",
      with no leading or trailing "/", each name non-empty and holding only the same characters without "*";
      otherwise the fixture is malformed (NOT_RUN). The Given holds only if every rule's patterns are well formed and
      no path of changed_paths is matched by any pattern of any rule; and, for the placeholders (section 10, reading: the runner
      checks the one that keeps the articles out), no article's scope matches any changed path. A fixture whose values
      break the Given is malformed (NOT_RUN), decided before any call.
  - AC6: >-
      Step (1), the derivation (section 10, r7 line 122). For each case, derive_inputs is called with a copy of the
      case's values. A call that raises makes the scenario NOT_RUN, with the raised error's type recorded as the reason
      in the runner's output (the scenario's reason, not a key of the run record), unless another case fails.
  - AC7: >-
      Step (2), the derived inputs (section 10, r7 line 122). The case fails if the derived inputs are not an object
      whose risk is one of low, medium, high and critical or null and whose evidence_profile is a list of objects
      exactly {dimension, evidence_types}, dimension a string and evidence_types a list of strings, or null; if their
      risk is in expected.risk_not; or if a pair of expected.profile_excludes is held by their evidence_profile when it
      is a list, a pair being held when an entry's dimension equals the pair's dimension and its evidence_types holds
      the pair's evidence_type. A failure here makes the case fail whatever the acceptance call then does, and the call
      is not made for that case.
  - AC8: >-
      Step (3), the acceptance call (section 10, r7 line 122). Only when step (2) passes, evaluate is called with a copy
      of the case's request, the derived inputs and a copy of the case's records. A record in the form of spec 2 §6.4
      is the expected kind of return, also one with decision null and error set (what GS §4 rule 8 gives a change that
      matches no rule): the runner's decision_problem (TASK-003's AC7) gives no problem for it; this describes the form
      of the return, not an expected decision value, which is never compared. A return whose profile_used is not a list
      of objects is not such a record. The case fails if a pair of expected.profile_excludes is held by an entry of
      profile_used, the entry's dimension equal to the pair's and its required holding the pair's evidence_type, and
      passes otherwise. A call that raises, or returns anything that is not such a record, makes the scenario NOT_RUN
      with the reason in the runner's output, unless another case fails.
  - AC9: >-
      The scenario's result (section 10, r7 line 122; CM §3). Every case is run, also after one has made the scenario
      NOT_RUN by AC6 or AC8; a scenario is FAIL if any case fails; otherwise NOT_RUN under AC2 to AC8 and the
      conditions of section 6 with "the entry point" read as this entry; otherwise PASS.
  - AC10: >-
      The run record (sections 6 and 10). The run record gains no key, and the record of spec 2 §6.2 keeps TASK-003's
      keys and rules: outcome pass exactly when the run counts, at least one scenario has a fixture and every scenario
      with a fixture is PASS, a Risk Engine scenario included; for RISK-01, "a scenario with a fixture" is one whose set
      entry is not null, so a NOT_RUN RISK-01 with a fixture makes outcome fail. Over the repository's own tree (RISK-01's
      entry null), a run with no stand-in gives the run record the runner at base_commit gives for the same tree, the
      same commit and the same task, byte for byte except the runner's own sha256 in its runner key, which is the
      changed module's hash (reading: decision D-443 C4's "byte-equal" cannot hold for that one value): the same keys,
      counts true, every Verification and Resume Check scenario PASS as at base_commit, RISK-01 and ADV-02 NOT_RUN for
      "no fixture", and the record's outcome pass. A test checks the keys, the counts, every result and reason and the
      outcome; a script run at the task's last commit runs the runner of base_commit and the runner of that commit over
      that commit's tree and compares the two run records' bytes after setting runner.sha256 to the same placeholder,
      its output recorded in the acceptance request.
  - AC11: >-
      The change of tests/unit/test_runner_rc.py (decision D-443 C1). Only the tests test_an_unrouted_capability and
      test_the_expected_path change, and only by removing RISK-01 from them; every ADV-02 assertion stays; no other line
      of the module changes; RISK-01's routing and expected path are asserted in the new modules instead. At base_commit
      the two tests read, at lines 306 to 327 (quoted in the approval request); after the task, line 309 and line 318
      each read `        for sid, cap in (('ADV-02', 'Capability Boundaries'),):` and line 326,
      `        self.assertIsNone(conformance.expected_path('RISK-01', 'Risk Engine'))`, is removed; nothing else in the
      file differs. A script at each task commit compares the file with base_commit's and prints the diff, which must
      be exactly these three changes; its output is recorded in the acceptance request (reading: a test cannot read
      base_commit's file without a process, which AC12 forbids).
  - AC12: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The module and its tests import only the Python 3 standard
      library, aieos_bootstrap.records, the tests also aieos_bootstrap.conformance, and, in the module only, aieos_bootstrap.governor and aieos_bootstrap.resume_check by
      the guarded imports of TASK-003's AC6 and TASK-006's AC4; they use no exec, eval, compile, __import__ or
      importlib, start no process, open no network connection, call no model, and write no file; they read files only
      with pathlib's read_bytes and list them only with pathlib's glob; the tests build fixtures and malformed inputs in
      memory and pass them through the byte reader and listing, never through files. The CI steps at the task's
      commits report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit, as TASK-003's AC10 lists
      them.
  - AC13: >-
      The existing test modules unchanged and passing. Every existing test module other than tests/unit/test_runner_rc.py
      is unchanged (forbidden), and all pass at the task's commits, test_runner_rc.py with AC11's change. If one of them
      can pass only by another change, the task escalates (needs_out_of_scope_change) instead of changing it.
  - AC14: >-
      The added text. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0; the file names are scanned with the same patterns and the records executors'
      pre-push pattern.
  - AC15: >-
      Limits, stated and tested as such: no Risk Engine fixture exists and RISK-01's set entry is null, so a run over
      the repository's tree gives RISK-01 NOT_RUN and its run record is unchanged (AC10); the runner checks its inputs
      and compares values, and never decides a classification or an acceptance; it reads the policy's rules only from a
      fixture's values; its matcher reads only point 6's forms, so a fixture with any other form is NOT_RUN, never PASS;
      a raising derivation on well-formed values is NOT_RUN with its reason shown, never PASS (decision D-438, option
      (a)); the entry first runs in the CI's base run after it lands on main; running RISK-01 needs its fixture and the
      set file's entry (TASK-018); the in-memory integration test of AC16 in which the root's governor gives RISK-01
      PASS tests the runner, not the governor's conformance, and is not conformance evidence.
  - AC16: >-
      Tests, with this rule-to-test list, each rule with at least one passing case and one failing case, the failing
      cases built in memory: R1 AC2's route (Risk Engine's path, a Risk Engine fixture under another folder, Capability
      Boundaries still absent); R2 AC3's entry point (absent, failed, no callable derive_inputs, a stand-in derivation
      that never counts); R3 each malformed condition of AC4, one failing case per rule; R4 AC5's matcher and Given (each
      point-6 form matching and not matching, a character outside the allowlist, "**" inside a name, an ill-formed
      changed path, a changed path matched by a rule, an article scope meeting a changed path); R5 AC6 (a raising derivation NOT_RUN with its reason, and FAIL
      when another case fails); R6 AC7 (a derived risk low, a derived low pair, each malformed derived form FAIL, and
      no acceptance call after a failure); R7 AC8 (the governor's error record passes, a profile_used holding a low pair
      fails, no profile_used list NOT_RUN, a raise NOT_RUN); R8 AC9 (every case run, FAIL before NOT_RUN); R9 AC10 (the
      run record over the repository's tree: its keys, counts, every result and reason and its outcome; the outcome with
      a Risk Engine scenario PASS, FAIL and NOT_RUN); AC10's byte comparison and AC11's diff are checked by the scripts
      those criteria name, not by tests. Unit tests in
      tests/unit/test_runner_risk.py; integration tests in tests/integration/test_runner_risk_run.py run over the
      repository's own tree end to end: AC10 with no stand-in; with an in-memory set file whose RISK-01 entry names an
