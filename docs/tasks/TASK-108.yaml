acceptance_criteria:
  - AC1: >-
      The listing and the files. base_inputs._handoff lists the handoff files of the task at the base in two folders: the docs folder as today (the listing of docs,
      the names docs/handoffs/<task>-<session>.md with no '/' after the head, so TASK-1000 files are not TASK-100's) and the state folder's handoffs folder (the
      listing of '<state directory>/handoffs', the state directory taken as the first component of contract_path.candidates(task_id)[0], so base_inputs gains no
      import, no used name of contract_path beyond candidates and decide, and no substring of the state directory's name; the claim test of AC2 is written inside
      base_inputs.py and is not an import of handoff_file (the import pin at test_base_inputs.py :607-:608 stays unchanged); a missing folder lists as empty by _listing's
      rule of _absent, any other listing failure is a refusal as today). A name under a task's head that ends in '.md' and whose session part does not fullmatch
      [A-Za-z0-9._-]{1,128} or is '.' or '..' gives the finding 'last_handoff: <path>: the session part is out of form' and nothing is read (a stated choice of this
      task, fail closed: today any such name counts). The same '<task>-<session>.md' name in both folders gives the finding 'last_handoff: <name> is in both folders'
      and nothing is read. No file gives None; exactly one file gives {ref, text} as today, the ref being the path read, whether or not the log holds a claim of its
      session. The text of the chosen file is read with the reader's existing byte rules.
  - AC2: >-
      The order. With two or more files the choice uses the events that _inputs already holds (the task's deduplicated events from _log_events; no second read of the log):
      a claim of a session is an event of type 'record.added' whose payload is an object with fact_kind 'claim', subject the task, session the file's session, and refers_to
      starting 'handoffs/<task>-<session>.md#' (handoff_file._claims' test, which also fixes the form of the whole reference); the rank of a file is the largest position of
      such an event in the events list (the log's order, no clock is read); the file with the largest rank is chosen; a session with claims and no file is not counted; the
      refers_to of one session never matches another session's file because the test ends in '.md#'. With two or more files and any file with no claim of its session the
      finding is 'last_handoff: <n> handoffs of <task>; which is the last cannot be told: <path> has no handoff claim in the log' and nothing is read (a stated choice of this
      task, proposed and fail closed, not the specification's words, which order by claim records only). Two files cannot share a rank; if they do, _Stop with the finding
      'last_handoff: two handoffs share a rank' (a guard, covered by a test with a hand-built events list).
  - AC3: >-
      The call bounds. With the docs folder only (no state folder), the git call list, the findings and the shapes of every reader result are today's, except the
      handoff findings of AC1 and AC2. The state folder's listing adds the calls of one base_files.list_paths of the prefix '<state directory>/handoffs' (nothing when the
      root listing does not hold the state directory, by base_files' rule), cached by prefix so that no identical call repeats (test_read_cache's property holds). The
      docstring states the added bound.
  - AC4: >-
      The pins and the tests. tests/unit/test_base_inputs.py's import pin (:597-:616) is unchanged and still passes (no new import, no new used attribute); the naming pin
      (:671-:678) is met by the docstring of every added test starting 'TASK-082 AC7' with the words 'amended by TASK-108'; the existing test_handoffs (:508-:521) keeps its
      assertions (two files and no claim in the log still give findings, which AC2 keeps true) and gets stronger ones; added tests, each with its stated broken copy where the
      item says 'pin': none, one, and two files in docs only with and without claims; the state folder only; both folders with different names; the same name in both
      folders; the out-of-form session part; the newest claim chosen though the other file's name sorts later; a claim of another task or session not counted; a claim whose
      refers_to is of another session; a file with no claim among two; the TASK-1000 head; the rank guard; a test that contract_path.candidates(TASK)[0][0] equals
      writer.STATE_DIR (the test file may import writer; the import pin applies to base_inputs.py only); the call list and the cache property; a missing state folder as
      empty and a refused state listing as a refusal. A property test is added only if the pin scan finds a test module without a naming pin; otherwise the random ordering
      case is a loop inside one unit test. In tests/integration/test_base_inputs_repo.py, if it has no naming pin, a test reads the commit named by its BASE through base_inputs
      with the expected answer (no handoff file) written in the test. No test makes a temporary repository.
  - AC5: >-
      The docstrings. The module docstring's last_handoff line (:32) states the true rule (none, one, the claim-order choice among two or more, the two folders, the findings), its
      TASK-107 limits sentence (:37-:40) no longer says the handoff reader is not done and states the new call bound. contract_path.py and its test are not touched. The
      phrases pinned at test_base_inputs.py :660-:669 stay.
  - AC6: >-
      The stated limits. The docstring of base_inputs.py states, in plain words, the five limits of the header (both folders, committed base only, the unorderable choice
      refused, abnormal ends, the state commit not made by the core and the unenforced write-set rule), and that the write after a submission, the launcher's wiring, DEF-0113
      and DEF-0101's untouched-root check are not done by this task. DEF-0095's and DEF-0105's Log lines are written by their own decision after landing.
  - AC7: >-
      Parity and purity (INV-001, INV-002, INV-004). tests/conformance/, the native ports, the CI files, writer.py, handoff_file.py, gitread.py, base_files.py, launcher.py,
      mcp_server.py, resume_inputs.py and every file of the forbidden list are unchanged; no new process form, no import beyond what base_inputs imports today; the substring of the
      state directory's name appears in no changed src file; the deterministic rule, OPS-003, SEC-001, SEC-002 and bandit steps report no finding at the task commits; the
      resume_inputs and context_compiler tests that read last_handoff pass unchanged.
  - AC8: >-
      The CI evidence. On the aieos-checks and aieos-native runs of the accepted commit every job and step is successful, read by run id; on main after the records commit
      likewise. Each push and each GitHub job-data read is a decision of the decision agent, outside the capabilities above.
  - AC9: >-
      The records (L-0034, L-0037). The task's evidence records' forms are built and checked through records.check_record and a governor shadow over a dry records list at the
      approval request, with their raw output: per-article records, and the profile entries of risk high; the expected result is NEEDS_REVIEW or NEEDS_REWORK at the GOV-003 row as in
      TASK-102 to TASK-107, stated in the acceptance as a departure. The contract's budgets and exit conditions are printed at the first step of the work (L-0037).
