# Task contract TASK-108 (draft r1, session c7d6f32b, 2026-10-31; plan ruled in D-4075 and D-4077; r0 changed by D-4078 C1 and C2): the reader half of DEF-0095, "the last handoff"
# of a task chosen by the claim records' order among the handoff files at the base, in both folders (docs/Deferred/DEF-0095-the-handoff-file-of-the-claim-tools-for-the-launcher.md).
# The text it builds is specification 7 revision 6 (on main, sha256 97026c84ba96e198bfa33a87f924487845bf0649335a72abd5e053f9b706c852): section 6 (the state
# directory of the readers; the handoff listing is base_inputs only), section 7 (the last handoff; the state-file rule) and section 10 items 9 and 17.
# Fields and value forms follow specification 2 section 5.1 and TASK-107's contract (docs/tasks/TASK-107.yaml).
# Not in this task: the write after a submission and any launcher wiring, abnormal ends, the state commit and its automation, the rule that a contract's
# write set does not list the state directory (stated, read by no check), DEF-0113, DEF-0101's untouched-root check, specification 7 revision 7 (the
# TASK-105 rename and the stale citation base_inputs.py :595-597 at :63; it follows this task's findings), any change to cli.py, launcher.py,
# writer.py, handoff_file.py, gitread.py, base_files.py, mcp_server.py, the program of the hook, settings or the CI workflows.
# Risk: high. R3 reads src/** and tests/** fail closed as high (risk-rules section 2 point 3); no critical rule matches the write set (no docs/specs/**, no
# .github/**). Confirmed by script over the base in the approval request (TASK-107's form). Change class: critical_cr, because the CI's EVALUATOR list holds
# src/aieos_bootstrap/** and the tests folders; confirmed by script in the approval request.
# Evidence profile (assurance-model.md section 5, gov-AIEOS, high): unit_test, integration_test, property_test, deterministic_rule, static_security_analysis,
# ai_review (cross-model), plus the evidence_required of the applicable articles, recorded per article from the start (L-0034) through records.check_record and
# the governor shadow in the approval request. GOV-003 is recorded as it falls (DEF-0107's policy): acceptance is a stated per-task departure from the
# advisory governor in the form of TASK-102 to TASK-107; compensating controls: the local run of the base's tests against the change's src and a review of the
# test diff by a reviewer whose model differs from every model that did task work (L-0038), listed by machine.
# Models (L-0044): the main session writes the code and the tests; reviewers and helpers run on Haiku 5.5 only; any other model for them needs the owner first; no
# Fable; the decision agent runs on Opus 5.5. Each brief goes to the decision agent first.
# Pin scan (first step of the work, reads only, written in the map of commit X): the pins on base_inputs.py (test_base_inputs.py :597-:616 imports and used names,
# :618- refused names and strings including the state directory's substring, :660-:669 docstring phrases, :671-:678 the naming pin "TASK-082 ACn"; test_resume_inputs.py
# :518-:535 the import pin of TASK-085 AC7; the call-count pins) is re-run at the base; a pin not in the list below stops the work and comes to the decision agent.
# Stated limits: (1) a handoff file of one task and session in both folders refuses the task's handoff until an approved act removes one; (2) only the committed
# base is read; (3) with two or more files, a file whose session has no handoff claim in the log cannot be ordered, so the reader refuses (a stated choice of this
# task, proposed and fail closed, not the specification's words); (4) a handoff made in a session that ended abnormally writes no file and is never "the last
# handoff" (specification 7 section 7); (5) the core does not commit the state files: who commits them is the user, or on the self-build the owner or an approved
# executor script (specification 7 :74), and they stay out of an agent's commit because the work tree is cut after the state commit and CI refuses any changed
# path under the state folder (specification 7 :75); the rule that a contract's write set does not list the state directory is stated and not enforced.
task: TASK-108
contract_version: v1
task_type: implementation
objective: >-
  Build specification 7 revision 6's reader of "the last handoff": base_inputs lists the handoff files of the task at the base under the writer's state
  directory (its handoffs folder) and under docs (docs/handoffs, as today), a file of one name in both folders is a finding, and among two or more files
  it chooses the one whose session has the newest handoff claim record in the event log's order (the position among the task's deduplicated events, not a
  clock); one file is returned as today, none gives None, and an unorderable choice or an out-of-form session part is a finding, never a guess; the docs-only
  git calls and every other finding text stay as today.
