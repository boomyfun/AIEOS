  - tests/unit/test_export_fixtures.py
  - tests/unit/test_bench_isolation.py
  - .gitattributes
  - .gitignore
constitution: [INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The input document. `python tests/unit/test_export_round2.py --input` prints to standard output, through
      sys.stdout.buffer, the bytes of aieos_bootstrap.conformance.canonical_text of one object with the keys "append"
      (N_APPEND calls) and "reconcile" (N_RECONCILE cases), built by the generator from fixed tables and a counter only:
      no random source, clock, environment, file or network read. The recorder is "bench-round2" everywhere; each
      record_id is formed from its call's index; times are "YYYY-MM-DDTHH:MM:SSZ" text. Building it twice in one
      process gives the same bytes.
  - AC2: >-
      The reference document. `--reference <file>` reads the file with read_bytes, refuses it unless it is an input
      document of AC1's form, and for each append call in order calls aieos_bootstrap.eventlog.append with the log
      carried from call to call (an "appended" result's new log becomes the next call's log; any other result leaves
      it), and for each reconcile case calls aieos_bootstrap.recovery.reconcile; it prints the canonical text of one
      object {"append": [...], "reconcile": [...]} whose entries are, for append, {result, reason, findings, seq, line,
      record} and, for reconcile, {log, events, expired, findings}, every bytes value as text and every datetime as
      AC1's text form. test_export_reference.py's --compare accepts the document's form (one object of lists) unchanged.
  - AC3: >-
      Pins. The module holds INPUT_SHA256 and REFERENCE2_SHA256, the SHA-256 of the two documents at the task's commit;
      tests assert both, and that each document has no CR byte, is ASCII only and ends with one LF; `--input --check`
      and `--reference <file> --check` exit non-zero, printing nothing to standard output and a message to standard
      error, when the SHA-256 differs; each document is built whole before its single write. The docstring states that a
      later task changing eventlog.py, recovery.py, records.py or the generator changes these pins, pin-only, with one
      exact new value. Each document is built at most once per test process, shared by the tests that need it (AC3 and
      AC4).
  - AC4: >-
      Coverage and size (D-905 C2). A test builds the reference in memory and asserts that every result of
      eventlog.RESULTS and every reason of eventlog.REASONS occurs among the append entries (a reason that no call
      starting from a log the bootstrap accepts can reach is named, with the reason it cannot be reached, in the test's
      docstring and in the commit message, and the test asserts it absent; a reading for the decision agent at code
      time), and that among the
      reconcile entries there is an appended compensating task.submitted, an observation record.added, a duplicate, a
      reported commit missing from the given commits, and an expired lease. N_APPEND and N_RECONCILE are module
      constants; the first task commit's message states the local export time on the worker's machine, at most 60
      seconds.
  - AC5: >-
      Fail closed. The command line is the export only when the first argument is `--input` or `--reference`;
      otherwise the module is the test runner. A missing or extra argument, an unreadable file, a document not of AC1's
      form, or a call that raises exits non-zero and prints nothing to standard output. Tests cover each case on texts
      held in memory (no file made) and the file-reading part on a path that does not exist.
  - AC6: >-
      The workflow step (A66). In each of the two jobs of .github/workflows/aieos-bench.yml, one step named "round-2
      export (the generated log and the bootstrap's results)" is added right after the reference export step, running
      `$PY tests/unit/test_export_round2.py --input --check > "$RUNNER_TEMP/round2-input.json"`, then
      `$PY tests/unit/test_export_round2.py --reference "$RUNNER_TEMP/round2-input.json" --check >
      "$RUNNER_TEMP/round2-reference.json"`, then `wc -c` of both; the header's revision line goes from 5 to 6 and one
      header sentence names the step; nothing else changes (no trigger, permission, secret, token, `uses:`, download or
      port step). The earlier tests of tests/unit/test_export_fixtures.py pass unchanged over it (their pins of the port
      steps, the step list's symmetry and the counts of TASK-039 AC6 and TASK-043 AC12).
  - AC7: >-
      Advisory only. Nothing writes a record the governor or the existing CI reads; aieos-checks.yml and its two pins
      are
      unchanged, byte for byte; bench/ is unchanged.
  - AC8: >-
      Purity and the CI checks (INV-001 to INV-003). The module imports only copy, datetime, hashlib, io, json, sys,
      unittest, pathlib and aieos_bootstrap (its conformance, eventlog, recovery and records modules); it runs no
      process
      and no model, reads no network, clock or environment except its arguments, and writes nothing; its only output is
      standard output and standard error. At the task's commits the existing CI steps report no finding: G0 scope,
      deterministic_rule, OPS-003, SEC-001, SEC-002, SEC-003's record and bandit; before the first push the added lines
      are scanned for the bandit test patterns the CI applies (a stated limit; the CI's run is the evidence).
  - AC9: >-
      Naming and its own tests. Every test function names "TASK-047 ACn" in its own docstring; a naming test reads the
      loaded TestCase classes' docstrings. tests/run_tests.py is unchanged; running it loads the module only as a unit
      test and runs no export. Every earlier test passes; if any can pass only by a change outside the write-set, the
      task escalates (needs_out_of_scope_change).
  - AC10: >-
      Stop conditions. If any step needs a secret, a token, write access, money or a setting, the task stops and the
      point goes to the owner (A66, fail closed).
