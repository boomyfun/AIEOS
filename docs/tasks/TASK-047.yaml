# Task contract TASK-047, the stack benchmark's round-2 export (Master Plan revision 4, §4 "The benchmark and the stack
# ADR"; docs/plan/m4-exit-review.md §6, line 70: "plus the event log's append and recovery over a generated log";
# decisions D-794 Q1, D-904 and D-905; DEF-0063).
# Revision 0, drafted under decision D-905 (C1 to C3, C5); brought for approval in its own request; whether it is
# approved is recorded in the decision files, not in this file. Fields and value forms follow specification 2 §5.1 and
# the contracts of TASK-007 to TASK-046. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: round 2's input and reference, the first task of round 2 (D-905). The
# workload (reading, D-905): the two pure computations of the bootstrap for line 70, aieos_bootstrap.eventlog.append
# (TASK-007) and aieos_bootstrap.recovery.reconcile (TASK-009), with the record forms of aieos_bootstrap.records they
# use; not the writer (files and SQLite) and not startup (it starts git), which a port may not do (bench-port-brief.md
# §3); a stated limit: no file behaviour is compared.
# The generated log (D-794 Q1): never committed. A deterministic generator in the new module produces, from fixed tables
# and a counter (no random source, clock or environment), the round-2 input document: a list of append calls, each
# with its event type, payload, event_id, appended_at, task_id, fencing_token, corrects, lease, recorder and record_id,
# and a list of reconcile cases, each with its log (the bytes of a log the generator builds with eventlog.append, given
# as text), commits, leases, now and recorder. The recorder is the fixed text "bench-round2" in every call and case, and
# every record_id is formed from the call's index (D-905 C3). Every value is given as canonical JSON text (times as
# "YYYY-MM-DDTHH:MM:SSZ" text, converted to aware UTC datetimes by the export, as a port must).
# The reference (byte-equality, D-905): the module also computes, from the input document only, the bootstrap's results:
# for each append call in order, its result with the log carried from one call to the next ("appended" calls extend it;
# others leave it), as {result, reason, findings, seq, line, record}; for each reconcile case, {log, events, expired,
# findings}; all in the canonical text of aieos_bootstrap.conformance.canonical_text, one object whose keys are
# "append" and "reconcile" and whose values are the lists of results in order, so that test_export_reference.py's
# --compare compares a port's output with it unchanged (TASK-041 AC4). Both documents are pinned: INPUT_SHA256 and
# REFERENCE2_SHA256, each with --check; a later task that changes eventlog.py, recovery.py or records.py, or the
# generator, changes these pins, pin-only, with one exact new value, and its contract says so. No conformance fixture
# set and no freeze decision: the pins play that role for the benchmark only, which feeds nothing (D-905).
# Size (D-905 C2): fixed by the generator's parameters N_APPEND and N_RECONCILE, chosen at code time so a test shows
# every result of eventlog.RESULTS, every reason of eventlog.REASONS and every reconcile outcome (an appended
# compensating task.submitted, an observation record.added, a duplicate, a reported missing commit, an expired lease)
# occurs at least once, and so that the local export (the worker's machine, the bootstrap's Python) takes at most 60
# seconds, recorded as a stated fact in the first task commit's message; eventlog.append re-checks the whole log on
# each call, so the cost grows with the square of the log's length (a stated reason for the bound).
# Main guard (D-905 C1): the generator and the reference export run only when the module is run as a script with
# --input or --reference as its first argument, as test_export_reference.py's export does; no unit test writes a file;
# the generated documents go only to standard output, and the workflow writes them only into the job's temporary
# folder.
# The workflow change (A66, its own decision): in each job of .github/workflows/aieos-bench.yml, one step after the
# reference export runs the input export with --check into "$RUNNER_TEMP/round2-input.json" and the reference with
# --check into "$RUNNER_TEMP/round2-reference.json"; nothing else changes (no trigger, permission, secret, token,
# `uses:`, download or port step); the header's revision line from 5 to 6 and one header sentence naming the step. The
# ports' round-2 compares come with each port's own task under its own A66 decision. The workflow's first run with the
# step is at the landing on main, read after acceptance.
# Trigger (a stated limit): aieos-bench.yml runs only on changes to bench/**, itself and test_export_fixtures.py, so a
# later change to test_export_round2.py or src/** runs its --check only at the next triggering push; the pins are
# asserted on every push by aieos-checks' unit_test step (AC3).
# What it is not: the results are advisory (A29, A31) and feed nothing; aieos-checks.yml and its two pins are not
# touched; no port is written; bench/ is not touched.
# Risk: computed over the base by script (risk_class47.py: risk_class46.py with only the write-set and its header line
# changed): .github/** is R9 (critical); tests/** is R2 (medium) with R3's fail-closed reading (high); the result is
# critical, change class critical_cr; .github/** and tests/unit/** are evaluator paths of GOV-003's list.
# Profile (assurance-model.md §5, gov-AIEOS, critical): high's entries plus architecture [human_review], met for
# gov-AIEOS by the decision agent's review, and functional [the property/fuzz entry] by the CI's property_test step over
# the existing property suite; the cross-model entry by the pair of reviews: five way-2 reviews from the hardening
# review template (a non-port task, D-893) on claude-sonnet-5-5, and the decision agent's separate review. One
# delegated approval (reading, as TASK-041).
# Naming (D-544 Q3): every test this task adds names the AC ids it stands for as "TASK-047 ACn" in its docstring.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-047.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-047", go to task/TASK-047 under their own decisions; main receives the
# task only at its acceptance.
# Not applicable: OPS-001; INV-004 to INV-008 and INV-010 to INV-011 (the module calls eventlog, recovery and records
# read only, on bytes in memory); GOV-001, GOV-004 to GOV-006. SEC-003 applies (a .github/ path), under A66.
# Owner-kept acts: none, on these conditions: the changed workflow grants no write, uses no secret or token, changes no
# repository or security setting and costs nothing (public repository, hosted runners); if any of these is not so, the
# task stops and the point is the owner's (CR-002 part 4 limit 5), fail closed.
task: TASK-047
contract_version: v1
task_type: implementation
objective: >-
  Add tests/unit/test_export_round2.py: run as a script with --input it prints round 2's generated input document; with
  --reference <input file> it prints the bootstrap's results over that input (eventlog.append and recovery.reconcile)
  as round 2's reference document; with --check each verifies its document against a pinned SHA-256; it fails closed
  on any other input; with its unit tests. Add one step to each job of .github/workflows/aieos-bench.yml that writes
  both documents into the job's temporary folder with their checks. Nothing else changes; the results are advisory and
  feed nothing.
traces_to:
  - docs/plan/m4-exit-review.md#6
  - docs/plan/master-plan.md#4
  - docs/plan/bench-port-brief.md
  - docs/pre-genesis/constitution.md#SEC-003
input_state:
  # base_commit is the `main` commit on top of which the approved contract is committed as its own commit C, changing
  # only docs/tasks/TASK-047.yaml; G0 requires C's one parent to equal base_commit. It is filled by script from
  # refs/heads/main just before C is made: the placeholder and its quotes are replaced by the 40-hex id, unquoted.
  base_commit: 2f136dbb7d21b0fc653ad8cd87e77f50f05496ad
  depends_on: [TASK-007, TASK-009, TASK-041, TASK-046]
  intent_versions:
    docs/plan/m4-exit-review.md: 6c41ca8200a4e757f04b22aa521e52cd67f7ac3122690e667ac4c864aa57c4a4
    docs/plan/master-plan.md: 8276a587bbf6f75be8867feb97df6726379babfcdb2266344bfdb4d01e6b2d23
    docs/plan/bench-port-brief.md: d307c6ede5080a9012c16697184437d5a579ebfd41e9bedee69dfffcd25a15e0
    docs/pre-genesis/constitution.md: 9b396c3c0f31d3a3fbccf9433cf81eb820b6e0f0a3a7d099e2899043abfe1f5a
    docs/specs/risk-rules-gov-aieos.md: 29dd803aed6a55c11fad04d01dac32ee10a8f15f96f099857a00212c100d4ed5
write_set:
