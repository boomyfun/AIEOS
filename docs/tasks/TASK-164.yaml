acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only paths of the write set. The only production changes are: gate_records.py (one entry added to DEFAULT_CHECK_MAP, and its module docstring), launcher.py (the one gates line of _RUN_SINGLE and the comment above it), and in ci_evidence.py and eval_inputs.py their module docstrings only (their code, with the docstring removed, is the same as at the base). No production module, import, name or file is added. The tests add test functions in the write-set test files, and change there only the pinned texts that AC2 and AC3 make false: test_gate_records.py's test of the default map (base :368-:375) and its comment at :23-:24, and the low run-made G3 line of test_cli_run.py (base :87, :184, :376).
  - AC2: >-
      The map (D-7441 C1). DEFAULT_CHECK_MAP gains exactly one entry, 'constitution', whose list is these seven step names of .github/workflows/aieos-checks.yml at the base, copied byte for byte and in the workflow's order: "SEC-001 secret scan (tip tree; every commit's message, file names and added lines)", "SEC-002 pattern rules (every commit's added lines)", "OPS-002 owner-kept paths", "INV-010 replay", "deterministic_rule (INV-001, INV-002, INV-004)", "OPS-003 pattern rules", "static_security_analysis (bandit, every package pinned by version and hash)". The entries scope, build and lint are unchanged. The module docstring says what the entry holds and why three further steps of the constitution gate are left out: "SEC-003 record (changes under .github/)" and "GOV-003 evaluator paths (reports an evaluator change)" only report and never fail, so counting them as passed would be false, and "GOV-003 evaluator lists equal" is not among the steps that spec-04 :27 gives to the gate. The docstring's paragraph on DEFAULT_CHECK_MAP (base :37-:40) then says that the map has no entry for review or tests, no longer says that the run-made plan's review gate stays uncovered, states the limit of AC5 and points to AC7 for the governor's outcome; and limit (4) names the three constitution steps (deterministic_rule, OPS-003 pattern rules, static_security_analysis) that also conclude as success with a note in a run that has no task, and says that the other four run their checks on every push (ci_evidence refuses a run whose detect step says no task, ci_evidence.py :163-:164).
