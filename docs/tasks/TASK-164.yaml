  filesystem: {read: [the repository at base_commit], write: [src/aieos_bootstrap/gate_records.py, src/aieos_bootstrap/launcher.py, src/aieos_bootstrap/ci_evidence.py, src/aieos_bootstrap/eval_inputs.py, tests/unit/test_gate_records.py, tests/unit/test_cli_run.py, tests/unit/test_ci_evidence.py]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
