acceptance_criteria:
  - AC1: >-
      Scope. The task commits change only the seven test modules of the write set; in the task commits no file under src/,
      .github/, docs/ or tests/conformance/ changes (the contract commit and the records commit are not task commits; AC11).
      No name that the deterministic_rule step refuses (for example input, open or compile as a variable) is used. Existing tests pass; their assertions are only added to or made stricter, except the one
      altered case named in AC3. No test writes a file, starts a process or imports a module that the workflow's
      deterministic_rule step refuses; no exec, eval, compile, __import__ or importlib is used; the only imports added
      are of the own package.
  - AC2: >-
      DEF-0134. tests/unit/test_runner_rc.py imports aieos_bootstrap.evaluation at module level, and a test uses that
      import (so the lint step finds no unused import), so that the tests test_absent and test_a_loaded_module of
      R3EntryPoint pass when that file is run alone. The worker's own evidence: the file run alone at base_commit shows
      those two failures, and the file run alone at the task commit passes.
  - AC3: >-
      DEF-0037. In tests/unit/test_conformance_files.py the base case 'a fixture path' isolates the path rule: the moved
      path's bytes are in the files map and the case asserts the exact error list of the path rule alone (it may move into
      test_a_moved_fixture_errs_by_the_path_rule_alone or a test of its own; the case is not dropped). A copy of the set
      check without the path rule fails that test.
  - AC4: >-
      DEF-0044. In tests/unit/test_conformance_risk_files.py: a test asserts the Source cell and the other cells of
      RISK-01's row not asserted at base_commit, against the bound scenario file's text; and each observation record of the
      fixture is also checked with aieos_bootstrap.records.check_record, finding nothing, and each case's request is
      also checked with aieos_bootstrap.governor._request_errors (a private name; records.py holds no request check),
      finding nothing. The module's own record and request checks stay. For this task only, this supersedes the sentence of TASK-018's AC8 that the test modules import only the
      standard library; the module docstring says so.
  - AC5: >-
      DEF-0080. In tests/unit/test_claude_code_channel.py: (a) a test with a copy of _root_relative that lacks the
      backslash check, written out in the test, shows that the copy accepts a path with a backslash that the module
      refuses; (b) a copy without the leading-slash check still refuses '/etc/x', and
      a copy without the empty-text check still refuses '' (each returns False, as the empty-segment check of
      claude_code_channel.py:207 gives), and a copy lacking also that segment check accepts the same input; the test
      names the segment check.
  - AC6: >-
      DEF-0081. In tests/unit/test_read_set_record.py, for each of the two broken copies the item names (the given list
      changed in place by build or observe; observe without its record-is-None check): a test that fails under that broken
      copy (an existing test may be it, for example tests/unit/test_read_set_record.py:84-90 and :148-161, when the
      worker's run shows it fails), or an executable test that shows why it changes no result. The worker runs each
      broken copy outside the repository and records which test fails.
  - AC7: >-
      DEF-0082. For R2-3, R3-6 and R5-4, one broken copy of claude_code_reads.py for each kind the item names: the input
      kinds (one each for input_bytes, input_json, input_shape and input), Glob (not in SEARCH_TOOLS), MCP (no mcp__
      class), the subagent class (SUBAGENT_TOOLS empty), a non-string file_path accepted, a non-object tool_input
      accepted. For each, a test of tests/unit/test_claude_code_reads.py fails under it; where an existing test already
      does (for example :34-47, :108-112, :122-133), it is named. For R3-2, a test of the AC5 integration module
      (tests/integration/test_claude_code_reads_inputs.py) asserts that a "read" result's read_paths is exactly the one
      input path, for a path with mixed case and forward slashes as well, so that a copy that changes the returned list
      (a second entry, another case) fails a test of that module. The worker runs each broken copy outside the repository
      and records which test fails. The record of TASK-065 does not state the content of the broken copy it calls R5; the
      acceptance text says so.
      The record of TASK-065 does not state the content of mutant R5; AC11's line on DEF-0082 records the R3-2 point as
      met by the returned-list test of the AC5 module on the reading of decision D-7640, without claiming that mutant R5
      is killed.
  - AC8: >-
      Errata (D-7623 R1). The acceptance text carries one dated erratum for each text that cannot change, quoting it,
      citing it by file and line or commit and stating the correct reading: (a) the message of TASK-014's task commit
      948f70009fcbfe7ef3a09e6eafb65d0ebceff1c4 (the two wrong-folder cases were added only to
      tests/unit/test_conformance_files.py, not to all three modules it names); (b) docs/tasks/TASK-018.yaml:23-26, the
      header sentence on what TASK-017's test modules glob (true: tests/unit/test_runner_risk.py:28 and
      tests/integration/test_runner_risk_run.py:78 read only fixtures and fixtures_rc; checked by script at drafting,
      not from the reviewers' inputs), and its AC8's word "compile" (:218: the builtin, as the deterministic_rule step
      reads bare names); (c) docs/tasks/TASK-063.yaml:19-20, "specification 2 revision 6 keeps no session key on a
      record" (a session key is kept on an agent's claim and not on the read-set observation: records.py:109, :117,
      :439-441); (d) docs/tasks/TASK-064.yaml's header on the fence and on "duplicate" (:24-33) and the same sentence of
      its AC3 (:349-350): eventlog.append decides "duplicate" or "conflict" by the stored event, the fencing token among
      the compared keys, before the lease is looked at (eventlog.py:176-187), so a repeat after a release or under
