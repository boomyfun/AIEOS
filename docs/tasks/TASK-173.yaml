acceptance_criteria:
  - AC1: >-
      The pin. In src/aieos_runtime/claude_starter.py exactly one line differs from the base: line 31 reads
      SETTINGS_SHA256 = 'c0f2e19246889ac12dcc08e64c0c3edf281ffcdbc318ee2ba05e5be60c0094e1'. EXE_PATH, EXE_SHA256, PROMPT, MCP_FILE, MCP_SHA256, SETTINGS_FILE and the
      ten-element argument list of the one subprocess.run call are byte for byte unchanged (a diff against the base shows
      one changed line).
  - AC2: >-
      The test. In tests/unit/test_claude_starter.py exactly one line differs from the base: line 249, the expected value
      in the test of the pinned values, is the same new value. No test is added, removed, weakened or skipped. The other
      places where a test names the settings hash (test_claude_starter.py :118 and
      tests/property/test_claude_starter_properties.py :96) compute it from test bytes and need no change.
  - AC3: >-
      The new value. The new value equals the SHA-256 of the settings variant A of decision D-7802 (1065 bytes: the live
      file's bytes with the two allow rules Edit(//e/AIEOS/docs/Deferred/DEF-0030-event-log-writer-and-workflow-revision-6.md)
      and Edit(//e/AIEOS/docs/Deferred/DEF-0058-the-review-findings-and-limits-carried-from-task-031.md), the two write
      sets of docs/runs/second-real-run-pre-run-record.md), recomputed from those bytes by script before the task commit
      and cited in the acceptance; if the recomputed value differs, nothing is committed and the task goes to the decision
      agent. The variant holds the two hooks (PreToolUse and PostToolUse), the seven mcp__aieos__ tools, the two Edit rules
      and nothing else. The hooks run programs of src/aieos_bootstrap that this pin does not cover.
  - AC4: >-
      Checks. The whole suite passes by the slice method (each slice under timeout 110) before the task commit, and
      tests/unit/test_claude_starter.py passes alone; before the task commit the base test against the changed module
      fails exactly at the test of the pinned values, and a different failing set is brought to the decision agent
      before the commit. In CI on the task commit unit_test, integration_test and property_test pass, and
      deterministic_rule (which runs check_starter, CI revision 32) reports no finding; OPS-003, SEC-001, SEC-002,
      static_security_analysis and lint report no finding; before the commit the added lines are scanned with the
      workflow's SEC-001, SEC-002 and OPS-003 patterns and each count is 0. A settings file whose sha256 differs from the
      pin still raises StarterError.
  - AC5: >-
      GOV-003 (a stated departure, the policy of DEF-0110): the test file is an evaluator path; GOV-003 is not claimed to
      hold. The acceptance states it, gives the base-tests step's printed line with every failing name, and a review of
      the whole diff by a model other than the implementer's. The push of main's head has exactly one AIEOS-Task trailer
      line. The pushes are the worker's route under their own decisions, outside the task's capabilities.
  - AC6: >-
      Records, in the records commit (made by the worker under its own decision, no AIEOS-Task trailer, pushed only
      after the task commit is on main; not a task commit; its paths are under docs/runs, docs/Deferred and
      docs/History): the acceptance text; for each item of the touch list why it is not done; the counts and accepted
      limits of master plan section 6 point (6) and the running total (D-7754 C6); a dated line on DEF-0149 for CI
      revision 32 with its review findings not applied (D-7803, D-7804) and for this pin; a dated line on DEF-0139,
      whose "next change of claude_starter.py" this task is, saying why it is not done (for its item 9: the two typed
      literals are changed together and checked by the test of line 249 and by the CI check) and naming DEF-0141's open
      point that no unit test checks the typed pin against the settings file; a history page of the stretch D-7798
      onward.
  - AC7: >-
      Limits. (1) The settings file (C:\Users\Admin\AIEOS-runtime\claude-settings.json) is outside the repository and is
      not written by this task; its write is step 5c, at the owner's own permission prompt; until it is written the
      starter refuses to start with the new pin, and no launch is made. (2) This task lands under CI revision 32 (the
      two-value window); step 5d returns check_starter to the single new value and is an open obligation, its own
      decision under DM A66; step 5e (the rules removed after the run) is the owner's typed word. (3) The slice runs,
      the base prediction and the scans are the worker's own runs outside the task's shell capability. (4) The evidence
      profile is that of risk high (an other_model_review and a separate decision_agent_review). (5) The task enables no
      launch: it reads and writes nothing under C:\Users\Admin\AIEOS-runtime and runs neither aieos launch, the starter
      nor the runtime program. The step 5c write is checked against the new value and the content AC3 names before any
      launch, and the two Edit rules stay in the written file until step 5e.
