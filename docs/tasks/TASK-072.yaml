# What it adds: a new module src/aieos_bootstrap/claude_code_pretool_hook.py, the hook-side program Claude Code would
# run before a tool call (no hook is placed by this task: spec 5 :7, :92). Its imports, all in the form
# "from aieos_bootstrap import X" (the separation check flags "from aieos_bootstrap.X import ...",
# test_claude_code_read_hook.py :387-388): claude_code, claude_code_store, claude_code_hook, claude_code_channel,
# task_contract and session_violation, and the standard library (t72a-R1-2, R2-2). Its public names:
# - SESSION_VAR = "AIEOS_SESSION_ID", ROOT_VAR = "AIEOS_ROOT" and BASE_VAR = "AIEOS_BASE", local constants (the first
#   two tested equal to claude_code_read_hook's, :73-74, without importing that module, which would bring writer into
#   this module's imports);
# - OUTCOMES = ("allow", "refuse") and REASONS, the closed set of reason words (t72a-R1-8): "enforce_nothing",
#   "tied_allow", "store", "base", "contract", "uncovered", "no_record", "record_form", "recorded", "lease_lost",
#   "core", "entry";
# - run(stdin_bytes, environ, working_folder, now, clock=None) -> a mapping with exactly the keys exit_code, outcome,
#   reason, findings; never raises for an Exception; clock is a function of no argument that gives the current time
#   in UTC rounded up to the next whole second (t72b-R1b-1); and
# - main(), the process entry (step 7).
# The flow of run, in this order, the first step that ends giving the result. run's findings are only this module's
# fixed words and exception type names; nothing is copied from claude_code_store's, entry's, judge's or
# session_violation's findings, from standard input, from the environment or from a path (t72a-R1-5):
#   (1) The tie: claude_code_store.judge(environ.get(SESSION_VAR), environ.get(ROOT_VAR), working_folder, now) (spec 5
#       :108-:112). "enforce_nothing" gives exit_code 0, outcome "allow", reason "enforce_nothing" (spec 5 :111).
#       "refuse" gives exit_code 2, outcome "refuse", reason "store", the store's reason word kept as findings[0] only
#       when it is one of claude_code_store's and writer.session_lease's fixed reasons (claude_code_store.py :135-160;
#       writer.py :1009-1011), else "store: other", and nothing recorded (spec 5 :112, :82). "tied" goes on, with the
#       lease's task_id and the root (a tie is only ever given with a session id: claude_code_store.py :124-127). Any
#       other shape of judge's answer gives reason "entry". The session id must then be a str of [A-Za-z0-9._-]{1,128}
#       (t72a-R1-13, D-1703 C4): one that fails gives exit_code 2, outcome "refuse", reason "store", finding
#       "store: session id form", and nothing recorded (a refusal with no usable tie to name in a record; a launcher
#       makes the id, spec 5 :108).
#   (2) The base (proposed; D-1583 C2; D-1699 C4 (iv); D-1701 M1, M2): the commit at which the contract is read is
#       environ.get(BASE_VAR), set by the launcher with the session id and the root at the grant: the tip of the base
#       branch at the grant, written as exactly 40 lowercase hexadecimal characters (stricter than gitread.OBJECT_ID,
#       which also takes 64, t72a-R1-9 (d)). For the self-build that branch is main (spec 3 :25), which holds the
#       approved contract from its commit C on (Evaluation path below), so the value is commit C or a later commit of
#       main. It is never the contract's own input_state.base_commit, at which the contract file does not exist (commit
#       C's parent): a launcher that passes that value makes every judged call a recorded STOP (contract missing).
#       Sources: spec 5 :109 ("the write-set is the task contract's write_set.paths at the base"), the primary one; spec
#       3 :19 (the contract is read "at HEAD") and :20, :177 (HEAD is "the tip of the base branch on which the task's
#       work lands, never the task's own branch"); spec 5 :34 supports it by analogy. Why not HEAD: gitread can resolve
#       only HEAD or an object id (gitread.py :7, :92), and the hook's HEAD is the agent's checkout, which the change
#       controls; never the working tree. Limit (restored, t72b-R1b-4): the base is fixed at the grant, so main
#       moving during a session is not seen (spec 3 :180, "HEAD moving after the decision"; t72g Q2 (e)). This is not
#       the "base commit's source" that TASK-066 took (DEF-0084 :21;
#       TASK-066.yaml :92-93): that was the filling of a contract's own base_commit by script; this is the commit at
#       which the hook reads the contract. An AIEOS_BASE absent, empty or out of form, with a live tied lease, is read
#       as "a contract not readable at the base" (step 3), reason "base".
#   (3) The contract: task_contract.read_contract(root, base, task_id), with no run argument (the run seam closed:
#       DEF-0091 :27; D-1667 (i)). It runs before the judgement, so every judged call of a leased session pays it (up
#       to five git calls of ten seconds each, about 50 seconds at worst, task_contract.py :42-44), reads included, and
#       an unreadable contract gives a recorded STOP even on a Read, Grep or Glob call (t72a-R1-10): spec 5 :113 names
#       the write-set concern; this task applies it on every concern alike, a stated choice (fail closed). "unreadable"
#       (or a bad base, step 2) with a live tied lease is a refusal on the write-set concern and section 8's: recorded,
#       STOP: violation (spec 5 :113), by step 5 with a record of evidence_type write_outside_write_set and the fixed
#       refers_to "the task contract is not readable at the base" (no new evidence type, D-1701 option 3;
#       claude_code_channel.EVIDENCE_TYPES :93 stays three), exit_code 2, reason "contract" or "base". The record is
#       built by this module in judge's record form (claude_code.py :256-259: its recorder is claude_code.RECORDER, then
#       ", for ", then the recorder of step 5), subject the lease's task_id; it is checked by
#       claude_code_channel.record_findings (:166-182) before redact; redact leaves the fixed text unchanged (it has no
#       ":", "\" or leading "/", claude_code_channel.py :193-196). Its event_id and record_id carry the segment
#       "/pretool-contract/" in place of "/pretool/" (step 5). Limit (D-1701 M3): a path under the root equal to the
#       fixed text reads the same in refers_to.
#   (4) The judgement: claude_code_hook.entry(stdin_bytes, root, task_id, write_set, allowlist, record_id, recorder)
#       (claude_code_hook.py :162), unchanged, with the ids and the recorder of step 5. The allowlist (proposed; D-1583
#       C3; D-1699 C4 (v)): this task authors no shell policy and reads none: the allowlist is the empty list, until an
#       approved policy at the base exists (spec 5 :105) and a later contract reads it (claude_code_hook's
#       allowlist_findings accepts an empty list, :111-121). Cost, stated in plain words: once the owner places this
#       hook, every shell call of a session holding a live lease is refused and ends the session (spec 5 :79-80), so no
#       leased task can run a shell command until such a policy exists. The mapping (t72a-R1-8, R1-14): entry's
#       "allow" (a Read, Grep or Glob call, or a write inside the write-set) gives exit_code 0, outcome "allow", reason
#       "tied_allow"; "uncovered" gives exit_code 2, outcome "refuse", reason "uncovered", nothing recorded (uncovered is
#       none of section 8's three concerns, spec 5 :79); "refuse" with a record goes to step 5; "refuse" without a
#       record gives exit_code 2, outcome "refuse", reason "no_record", nothing recorded (a caller's error, as
#       claude_code_channel.py :50-52 states). The cases that give a refusal without a record, by file:line (D-1701
#       M5): entry's "argument" (claude_code_hook.py :137) and "allowlist_form" (:140); judge's "argument"
#       (claude_code.py :291, among them a root that is not a Windows absolute path, :273-275, so on a UNC or POSIX root
#       every call of a leased session is refused with no record and no STOP, t72a-R1-12; a task_id or write-set out of
#       form, :275-279) and "record" (:265, a record that fails records.check_payload); entry passes judge's record only
#       for "refuse" (claude_code_hook.py :158). Any other shape of entry's answer gives reason "entry".
#   (5) The record (t72a-R1-1, R1-6, R1-13; D-1703 C4): the recorder is the text "claude_code_pretool_hook, session "
#       followed by the session id (checked in step 1), the one value passed in steps 3 to 5; so the record's recorder
#       is claude_code.RECORDER + ", for " + that text and holds the session id, the only tie between a record and its
#       session (claude_code.py :77). The record must pass claude_code_channel.record_findings, its subject must equal
#       the lease's task_id and its recorder the text above, and claude_code_channel.redact must give a record; any of
#       these failing gives exit_code 2, outcome "refuse", reason "record_form", and nothing passed to the core. The
#       redacted record is passed to session_violation.session_violation(root, session_id, redacted, event_id,
#       recorder, now_record) with no lookup, append or release argument (the run seam closed: DEF-0084 :30, DEF-0091
#       :27, TASK-070's DA-3 (i)). now_record is clock() called inside run once, in every path that reaches this call
#       (the bad-base path included), after every other step of run (read_contract when it was called, entry,
#       record_findings and redact) and just before this call (t72a-R1-11, t72b-R1b-1, t72c-R1c-2); a clock that
#       raises, or gives a value session_violation refuses, ends as step 6's "entry" or this step's "core" (fail
#       closed): a fresh time, so a lease that expired during step 3 reads as
#       expired; run's now serves steps 1 to 4; when run is given no clock, now is used, a stated limit for tests. The
#       result: "done" gives reason "recorded"; a "lease" result (the lease lost between the tie and the record, or a
#       repeat after an earlier STOP released it) gives reason "lease_lost" and nothing appended (no STOP, spec 5 :82;
#       session_violation.py :46-53); any other result gives reason "core"; in every case exit_code 2 and outcome
#       "refuse"; findings hold nothing from the result, whose reason only chooses among "recorded", "lease_lost" and
#       "core" (t72b-R1b-7). No STOP is recorded by this hook for "record_form", "lease_lost" or "core": for the
#       first two the record is not accepted; "core" may follow a record already appended (session_violation's
#       partial outcome or its "entry: after the record" ending, session_violation.py :40-43, :50-53); a departure from
#       spec 5 :79 and :104 of the same kind as step 4's "no_record", stated in AC9 (t72c-R1c-1). The ids (proposed; claude_code_channel.py :66-70 names the candidates): tool_use_id is
#       read by the same strict parse entry uses (UTF-8, no byte-order mark, one JSON object, no duplicate keys or
#       constants; claude_code_hook.py :141-152); event_id is "<session_id>/pretool/<tool_use_id>" when tool_use_id is a
#       str of [A-Za-z0-9_-]{1,200}, else "<session_id>/pretool/sha256-<the SHA-256 of stdin_bytes in hexadecimal>" (on
#       any parse failure too); record_id the same text with "/record" appended; both hold no whitespace (the session id
#       form of step 1). The core checks the ids only as non-empty strings (violation.py :116-117, :131-132); this
#       module keeps each id at most 128 + 21 + 200 + 7 characters by the forms above (t72b-R1b-10). A repeated
#       identical call after a recorded STOP is refused at step 1 (the lease was released)
#       with nothing recorded (t72a-R1-3, R2-1); the core's "duplicate" for a repeated event_id can arise only after
#       session_violation's partial outcome (session_violation.py :51-53) and is shown only with a stand-in for this
#       module's own reference to session_violation, as AC5 says.
#   (6) No exception escapes run for an Exception: any gives exit_code 2, outcome "refuse", reason "entry", the type
#       name only. A BaseException that is not an Exception is not caught (DEF-0089 P2), a stated limit.
#   (7) main (t72a-R1-7, R2-3): it reads standard input whole as bytes, os.environ, os.getcwd() (an OSError gives the
