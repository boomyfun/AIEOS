acceptance_criteria:
  - AC1: >-
      The tie (step 1), with a real store made by writer.open_store, writer.start_session and writer.grant_lease (added definitions in
      tests/integration/test_writer_files.py): with neither variable set and no store
      upward, or a store with no lease row, run gives exit 0, outcome "allow", reason "enforce_nothing"; each
      claude_code_store refusal reason gives exit 2, outcome "refuse", reason "store" and that word as findings[0]
      (an unknown word gives "store: other", by a stand-in), and nothing appended or released (the store's leases and
      the log before and after, by writer functions); a session id out of form gives "store: session id form" and
      nothing recorded.
  - AC2: >-
      The base (step 2), with a stand-in gitread.run on the contract reader's call that records the ids asked: the
      first id asked is AIEOS_BASE and "HEAD" is never asked; AIEOS_BASE absent, empty, of 64 characters, or with an
      upper-case letter, with a live tied lease (a stand-in tie), gives exit 2, reason "base" and one record passed to
      the session_violation stand-in with the fixed refers_to; a well-formed AIEOS_BASE naming no commit, or equal to
      the contract's own input_state.base_commit, gives the recorded STOP, reason "contract" (t72b-R1b-3).
  - AC3: >-
      The contract (step 3): read_contract's "unreadable" for each of its reasons gives exit 2, reason "contract" and
      the record of step 3, in judge's form, passing claude_code_channel.record_findings, left unchanged by redact,
      with ids holding "/pretool-contract/"; the same on a Read call (step 3 before step 4); a readable contract's
      write_set is the one judged (a write inside it allowed, reason "tied_allow"; outside it refused and recorded).
  - AC4: >-
      The judgement (step 4): allow (a Read, Grep or Glob call; a write inside the write-set) gives exit 0, reason
      "tied_allow", nothing appended; uncovered gives exit 2, reason "uncovered", nothing appended; a shell call under
      the empty allowlist is refused and recorded (shell_not_allowed), a git push refused and recorded
      (git_push_refused), a write outside the write-set refused and recorded (write_outside_write_set); each refusal
      without a record of step 4 (entry's argument and allowlist_form, judge's argument, among them a POSIX root, and
      record) gives exit 2, reason "no_record", nothing passed to the core.
  - AC5: >-
      The record (step 5): the recorder text of step 5, holding the session id, and the record's recorder equal to
      claude_code.RECORDER + ", for " + it; the record passed is claude_code_channel.redact's (no command text); a
      record failing record_findings, a subject or recorder mismatch, or redact giving None gives exit 2, reason
      "record_form", nothing passed; the ids of step 5 (from tool_use_id, and the SHA-256 fallback for a missing, bad
      or unparsable tool_use_id), each id within the length of step 5; a repeat of an identical call after a recorded
      STOP is refused at step 1 with nothing recorded (a stand-in tie that answers "ended" on the second call); a lease
      lost between the tie and the record (a session_violation stand-in answering "lease") gives reason "lease_lost";
      the core's "duplicate" shown only with a stand-in set on this module's reference to session_violation. The clock
      (t72b-R1b-1, t72c-R1c-2): clock is called once in every path that reaches session_violation, the bad-base path
      included, after every other step (read_contract when it was called, entry, record_findings and redact) and
      immediately before session_violation, and its value is the now passed to it, shown by a stand-in clock that
      records a call counter; a clock that raises gives reason "entry", and one whose value is refused gives "core". The run seam (D-1703 C1), by an AST
      check of the new module: the names task_contract and session_violation appear only as the value of an Attribute
      naming read_contract and session_violation respectively; that Attribute is the func of an ast.Call with exactly
      3 (read_contract) or exactly 6 (session_violation) args, none an ast.Starred, and keywords equal to []; no other
      reference to either module or either function exists (no alias by "as", assignment, argument, return value,
      getattr, functools.partial, importlib or __import__ call, and no "from aieos_bootstrap.task_contract import" or
      "from aieos_bootstrap.session_violation import"); string constants count only as arguments to getattr,
      importlib or __import__; docstrings are exempt; the module uses no other attribute of those two modules. Added
      rules (t72b-R1b-2, R1b-9): (a) the only binders of the two module names anywhere in the module are the
      module-level "from aieos_bootstrap import task_contract" and "from aieos_bootstrap import session_violation",
      one alias node each, exempt from the name rule (t72c-R1c-5), so an argument, a
      def or class name, an except-as name, a global or nonlocal name, a match name, an "as" name or any assignment
      target binding either name is refused; (b) any str constant outside docstrings that contains "task_contract",
      "session_violation" or "read_contract" is refused ("contains" is chosen because none of the module's own strings,
      its reasons, recorder text, refers_to, ids and standard-error line, contains them); (c) any ast.Name whose id
      is setattr, delattr, globals, vars, locals, eval, exec, compile or attrgetter, and any Attribute whose attr is
      __dict__, or modules on the name sys, is refused (an Attribute named compile, as re.compile, is not; t72c-R1c-3); (d) any
      Attribute whose attr is writer, adapter, eventlog, violation, read_set_record or observe is refused (no chain
      through an imported module reaches the core). Hostile samples, one per form (a Starred argument, a keyword,
      **kwargs, an alias, a rebound module name, getattr, partial, a wrapper function, an argument or def named for a
      module, setattr, globals, a string holding a name, an attribute chain), are each refused by the check, the
      legitimate calls task_contract.read_contract(a, b, c) and session_violation.session_violation(a, b, c, d, e, f)
      and the call re.fullmatch(p, s) are accepted, and broken copies of the module with each form are caught.
  - AC6: >-
      Separation (spec 5 :109, :119): the new module imports only the standard library and claude_code,
      claude_code_store, claude_code_hook, claude_code_channel, task_contract and session_violation, each as "from
      aieos_bootstrap import X"; it opens no file, starts no process, names no ".aieos" string and reaches no record
      path but session_violation: it imports neither aieos_bootstrap.read_set_record (whose observe,
      read_set_record.py :177, is the lease holder's read-set record path) nor writer, adapter, eventlog or violation;
      the core's token-less read-set record path of spec 5 :119 (point 10) does not exist yet (DEF-0084's "token-less
      observe", H4), and the AST check pins that no call of the new module names a function of those modules; the
      hook-side separation check of test_claude_code_read_hook.py covers it as a seventh module, with THE_PAIR
      unchanged; SESSION_VAR and ROOT_VAR equal claude_code_read_hook's.
  - AC7: >-
      main (step 7), with stand-ins for standard input, the environment, os.getcwd and the clock: nothing on standard
      output; on exit 2 exactly the line "AIEOS: this tool call was refused by the AIEOS hook (<reason>)" on standard
      error, reason a word of REASONS; a standard error whose write raises keeps run's exit code; an OSError from
      os.getcwd with no session id set gives a refusal, and with a session id and a root set the folder is not used
      (t72b-R2b-2); any other Exception inside main gives 2, reason "entry", and the line; main passes the clock function itself, not
      its value, to run.
  - AC8: >-
      No exception escapes run or main for an Exception (a property test over arbitrary bytes, environments and
