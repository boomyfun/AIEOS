# Task contract TASK-055, a 'fail' record that the evaluation would leave out for a repeated record_id refuses the
# evaluation (Master Plan revision 4, §4 M5; governor-spec.md sections 4 and 5; constitution INV-003).
# Revision 0, drafted under decisions D-1043 and D-1044 (Q3), from the scope note approved at decision D-1040 (with the
# order of its two cases as corrected at decision D-1042 Q2) and carried in DEF-0070; brought for approval in its own
# request; whether it is approved is recorded in the decision files, not in this file. Fields and value forms follow
# specification 2 §5.1 and the contract of TASK-054.
# Task type: implementation. Why: TASK-054's reviews (R2, R5; its H2, decision D-1035) and decision D-1039 found a
# fail-open path of the acceptance left by TASK-054: evaluation._kept leaves out, with a finding only, a record whose
# record_id an earlier kept record has; when that record's outcome is 'fail', the governor does not see the failed gate
# or entry, so an evaluation that would give NEEDS_REWORK (and REWORK) may give another decision, NEEDS_REVIEW and, on
# re-evaluation with an approval, ACCEPTED included. Constitution INV-003 asks the rule to fail closed.
# What it changes: after _kept, src/aieos_bootstrap/evaluation.py refuses the evaluation with the reason "records"
# (reused) when _kept has left out, for a record_id an earlier kept record has, a record that records.check_record finds
# in form and whose outcome is 'fail', unless the left-out record equals the earlier kept record with that record_id as
# a whole mapping (==). Nothing is appended and the governor is not called. TASK-054's rule for blocking records stands.
# Which left-out records refuse, from the governor's use of each (decision D-1040, governor.py read at 56675042): a
# left-out 'pass' record and a left-out out-of-form record that is not blocking stay left out, because their absence can
# only lower the decision, never raise it: another subject is skipped (governor.py 334-336); an out-of-form record is
# not used (344-346); an authority record whose outcome is not pass is noted only (351-353 with 384-386); rows 1 and 2
# depend only on blocking and 'fail' records (309, 317-318, 429-430, 463-466), so a missing pass can only add missing
# types and move row 5 to row 3; an approval counts only at row 5 when re-evaluating (476-482). A left-out in-form
# 'fail' can raise the decision from row 2 (NEEDS_REWORK) to row 3 or row 5, so it refuses.
# The same function (decision D-1040 C3): evaluation reads records through `from aieos_bootstrap import records`
# (evaluation.py:109) and the governor through `from aieos_bootstrap import records as record_forms` (governor.py:33),
# calling record_forms.check_record (governor.py:337); so "in form" here is the governor's own form check.
# The orders (decision D-1042 Q2, correcting D-1040 C5): a 'pass' record then a 'fail' record with the same record_id:
# the pass is kept and the fail is left out, so the evaluation is refused; a 'fail' then a 'pass' with the same
# record_id: the fail is kept and the pass is left out, so the evaluation goes on as at the base (the governor sees the
# fail). A 'fail' left out after an equal 'fail' (the whole mapping) goes on: the governor sees the same record.
# The cost, stated (a limit): the span is the whole log, so a task with such a record is refused at every evaluation:
# it can be neither accepted nor rejected by evaluation and stays in VERIFYING or IN_REVIEW until superseded by a new
# task. The rule over-refuses: a left-out 'fail' whose absence changes nothing (a stale record, an authority record
# whose outcome is not pass, a record that is not an observation or has no evidence type or binding) refuses too (fail
# closed; decision D-1040 option (b), passing the commit and versions into _kept, was rejected). One given only through
# extra_records refuses only while it is given.
# A change of earlier accepted behaviour, stated: TASK-027 AC7 ("a repeated record_id ... left out with a finding") and
# TASK-054 AC2 ("a record that is not blocking and ... repeats a kept record's id is left out with _kept's finding and
# the evaluation goes on") prescribed leaving such a record out and evaluating on; for an in-form 'fail' record (other
# than the whole-mapping twin of the kept record) this task refuses instead. The concept and the decision matrix are
# not changed.
# The texts that state the old limit become false and change (OPS-003): evaluation.py's docstring item 7 and its
# TASK-054 limit sentence "a record with outcome fail whose record_id an earlier kept record has is not seen by the
# governor, and an evaluation that would give REWORK may give another decision, ACCEPT included (a later task is to
# close this)". tests/unit/test_evaluation_repeated.py's R7Script asserts that sentence (line 454) and "left out with a
# finding as before" (line 458); only those two requirements change, to the new words, keeping every other requirement
# (GOV-003).
# Checks before the contract (decision D-1040 C2 to C4, read at decision D-1041; grep output in the decision files):
# only test_evaluation_repeated.py and test_evaluation_violation.py read evaluation.py's docstring, and only the former
# asserts the sentences that change; no 'fail' record in tests/integration/test_evaluation_repo.py or
# tests/property/test_evaluation_properties.py. tests/unit/test_evaluation.py's R7Records (lines 423-434) and R8Append
# (lines 454-460) use only records with outcome 'pass' and an out-of-form record without an outcome, so they keep
# passing.
# Limits (carried at acceptance): the stuck task and the over-refusal above; event_id_of and the governor unchanged;
# records.py's uniqueness rule unchanged; a left-out 'pass' record and an out-of-form record that is not blocking left
# out as before; records still selected by the event envelope's task_id, not by the record's subject (H5, DEF-0070);
# the limits of TASK-053 (its AC7) and TASK-054 (its AC8) stand; no conformance set or fixture changed.
# Readers of the changed paths (D-263 C3's practice): tests/unit/test_evaluation.py, tests/unit/
# test_evaluation_violation.py, tests/integration/test_evaluation_repo.py and tests/property/
# test_evaluation_properties.py read evaluation.py and keep passing unchanged (forbidden here); src/aieos_bootstrap/
# verification_records.py names evaluation.evaluate_task in its docstring only; tests/unit/test_writer.py's R8 test and
# tests/unit/test_gitread.py's subprocess test read every module of src/ and keep passing.
# Risk: high (risk rules revision 6, policy v4, §2 point 3: R3 matches every path under src/** and tests/**), computed
# over the base by script (risk_class55.py: every path R2 medium and R3 high). Change class critical_cr, computed by
# script and read as for TASK-054 (gov003_class55.py: "GOV-003 evaluator change: yes (3 of 3 paths)"; the evaluation
# path's decision inputs change); decided by decision D-1040; the approval form is ruled at acceptance (decision
# D-492's precedent). Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture
# [deterministic_rule], functional [integration_test], security [static_security_analysis] and architecture
# [ai_review (cross-model)], plus the evidence_required of the applicable articles. Reviews as TASK-054's: five way-2
# reviews on a model other than the implementer's and the main session's, and the decision agent's own review for the
# cross-model entry.
# Naming (D-544 Q3): every test of the new test module names the AC ids it stands for as "TASK-055 ACn" in its own
# docstring; a changed test names "TASK-055 ACn" beside its earlier ids.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-055.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-055", go to task/TASK-055 under their own decisions; main receives
# the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011 (the governor, its
# decision contracts and the policy are not changed); GOV-001, GOV-004 to GOV-006 and SEC-003 (the concept file, the
# bound artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the
# write-set). INV-004 applies: the module writes only through the writer's functions. INV-009 applies through the
# writer, which this task does not change.
# Owner-kept acts: none. No hook, no Claude Code setting, nothing under .github/, no push of its own; it weakens no
# evidence requirement; the approval form is ruled at acceptance (Master Plan section 6).
task: TASK-055
contract_version: v1
task_type: implementation
objective: >-
  Make an in-form 'fail' record that the evaluation would leave out for a repeated record_id refuse the evaluation, in
  standard-library Python 3. src/aieos_bootstrap/evaluation.py, after _kept, refuses with reason "records" when a
  record that records.check_record finds in form and whose outcome is 'fail' was left out for a record_id an earlier
  kept record has, unless it equals that kept record as a whole mapping; nothing is appended and the governor is not
  called. Its docstring states the new rule, its cost and its over-refusal in place of the old limit. With unit and
  property tests in a new tests/unit/test_evaluation_failed.py, each test naming its AC ids in its own docstring, and
  R7Script of tests/unit/test_evaluation_repeated.py brought to the new words; the tests use stand-ins for the writer's
  and Git's functions and write no file.
