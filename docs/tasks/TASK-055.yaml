acceptance_criteria:
  - AC1: >-
      The rule (decision D-1040). After _kept, evaluation.evaluate_task refuses with result "refused" and reason
      "records" when _kept has left out a record, from the log or from extra_records, that records.check_record finds
      in form, whose outcome is 'fail' and whose record_id an earlier kept record has, unless the left-out record
      equals that earlier kept record as a whole mapping (==); the findings hold _kept's findings, those of TASK-054's
      rule, and one finding per such record naming its record_id and its source; nothing is appended and
      governor.evaluate is not called. TASK-054's rule for blocking records is unchanged; both rules are applied
      together, and either refuses.
  - AC2: >-
      What does not change. With no such record the result, decision, next_task_state and event id are those of the
      base (TASK-027 AC1 to AC11, TASK-053 AC1 to AC10 and TASK-054 AC1 to AC8): tests/unit/test_evaluation.py,
      tests/unit/test_evaluation_violation.py, tests/integration/test_evaluation_repo.py and
      tests/property/test_evaluation_properties.py pass unchanged. A left-out record whose outcome is 'pass', and an
      out-of-form record that is not blocking, are left out with _kept's finding and the evaluation goes on; a 'fail'
      record followed by a 'pass' record with the same record_id goes on as the base (the fail is kept and the
      governor sees it); a 'fail' record left out after a kept record equal to it as a whole mapping goes on.
      RESULT_KEYS, event_id_of and the governor are unchanged; the reason "records" is reused and no new value is
      added.
  - AC3: >-
      The cost and the over-refusal (limits). A task with such a record in the log is refused at every evaluation, the
      rerun included, with nothing appended, also after a later task.approved and a new submission (the whole-log
      span); it is neither accepted nor rejected by evaluation and stays in its state until superseded by a new task.
      A left-out in-form 'fail' record whose absence would change no decision (a stale record, an authority record,
      a record that is not an observation or has no evidence type or binding) refuses too (fail closed). A record
      given only through extra_records refuses only while it is given.
  - AC4: >-
      The texts (OPS-003). evaluation.py's docstring states the rule (its item 7, naming task TASK-055 AC1, and the
      reason "records" as reused) and AC3's cost and over-refusal as limits, in place of TASK-054's limit sentence that
      a record with outcome fail whose record_id an earlier kept record has is not seen by the governor (a later task
      is to close this); it keeps stating that a left-out 'pass' record is left out with a finding.
      tests/unit/test_evaluation_repeated.py's R7Script requires the new words in place of the two phrases at its
      lines 454 and 458, keeping every other requirement, and names "TASK-055 AC4" beside its earlier ids; no other
      test of that module changes; the change is listed with its reason in the first task commit's request.
  - AC5: >-
      Purity and the CI checks (INV-001 to INV-004). evaluation.py's imports are unchanged (test_evaluation.py's
      import test and R7Script pass); no module starts a process except as at the base, opens a file, reads a clock
      or the environment, builds an event-log line itself, or makes a network or model call; no exec, eval, compile,
      __import__ or importlib; no assert in src (bandit B101); no string that names the project-state directory. At
      the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit.
  - AC6: >-
      Its own tests and the added text. Every test function of tests/unit/test_evaluation_failed.py names the AC ids
      it stands for as "TASK-055 ACn" in its own docstring; the changed R7Script names "TASK-055 AC4" beside its
      earlier ids; no other task's AC is named in qualified form in the new module. No earlier test is removed or
      weakened (GOV-003). Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and
      OPS-003 patterns, and for constant values beside password- or token-like names (decision D-1003 amendment 1),
      each count 0; the file names are scanned with the same patterns and the records executors' pre-push pattern
      (D-282). The tests write and remove no file.
  - AC7: >-
      Tests, each rule with at least one passing and one failing case, with stand-ins for the writer's and Git's
      functions bound to the real signatures (inspect.signature(...).bind): R1 AC1 (in the log, a passing
      record.added then an in-form 'fail' record.added with the same record_id gives "refused", "records", nothing
      appended, the governor not called; the failing case: the base's steps alone would leave the fail out and give a
      decision other than NEEDS_REWORK); R2 AC1 (through extra_records: a 'fail' repeating a log record's id, and a
      'fail' repeating an earlier extra record's id, each refuse; a 'fail' that differs from its kept 'fail' twin in
      one field refuses); R3 AC2 (a 'fail' then a 'pass' with the same record_id gives the base's NEEDS_REWORK; a
      'fail' left out after its whole-mapping twin goes on to the same decision; a left-out 'pass' and an out-of-form
      record that is not blocking are left out and the evaluation goes on; a left-out blocking record still refuses
      by TASK-054's rule); R4 AC3 (the rerun refused again with nothing appended; a new task.approved and submission
      refused again; a stale left-out 'fail' refuses, the over-refusal); R5 AC2 (a property test over generated logs
      and extra_records, standard library only, fixed seeds, with outcomes pass, fail and blocking and repeated ids:
      with no record left out that either rule names, the result equals what the base's steps give, and with one it
      is refused); R6 AC4 and AC5 (a script check of evaluation.py's docstring words, the old limit sentence absent,
      and the imports); and an end-to-end test whose in-memory log, built with the real eventlog.append, holds the
      task's task.approved, a passing record.added, a 'fail' record.added reusing its record_id, a lease and a
      task.submitted, then evaluate_task giving "refused", "records", with its failing case under a fresh record_id
      giving NEEDS_REWORK. tests/run_tests.py, unchanged, runs them.
  - AC8: >-
      Limits, stated in evaluation.py's docstring and carried at acceptance: AC3's cost and over-refusal; event_id_of
      and the governor unchanged; records.py's uniqueness rule unchanged; a left-out 'pass' record and an out-of-form
      record that is not blocking left out as before; records still selected by the event envelope's task_id (H5);
      the limits of TASK-053 (its AC7) and TASK-054 (its AC8) stand; no conformance set or fixture changed. Every
      existing module other than the write-set is unchanged, and if one can pass only by a change the task escalates
      (needs_out_of_scope_change).
