objective: >-
  Make the launch reader refuse a contract whose write set lists a path under the project-state directory. In src/aieos_bootstrap/launcher.py add one private helper, `_under_state_dir(path)`, true when the first segment of the path, split on "/", equals writer.STATE_DIR compared case-insensitively (the test `_run_path_ok` already makes, launcher.py:1820), and use it in two places: `_run_path_ok` (its result for every input stays what it is today) and `_launch_write_set` (after the pattern rule, a path for which the helper is true gives (None, ['contract: a write-set path is under the project-state directory']), so launch_outside ends the session without calling the starter, with the reason it already gives for a contract read that does not pass). `_launch_write_set` also refuses a path whose first segment contains "*" with (None, ['contract: a write-set path may cover the project-state directory']), checked after the pattern rule and before the helper; `_under_state_dir` stays the exact first-segment test, so `_run_path_ok`, which already refuses "*", is unchanged. The directory is taken from writer.STATE_DIR; its name is never written as a literal in src. Tests are added to tests/unit/test_cli_launch.py.
