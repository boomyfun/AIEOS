acceptance_criteria:
  - AC1: >-
      The refusal. `launcher._launch_write_set` gives (None, ['contract: a write-set path is under the project-state directory']) when any path of the write set has the first segment equal to writer.STATE_DIR in any letter case, and gives what it gives today for every other write set (a test passes a list of write sets that today give (paths, None) and checks the answers are unchanged, byte for byte). The test is made with `launcher.launch_outside` and the `World` stand-ins of tests/unit/test_cli_launch.py: for such a contract the answer's reason is 'contract' and the calls are exactly clock, begin, contract_at, clock, finish_outside, write_handoff in that order, as in the existing test at tests/unit/test_cli_launch.py :253-:261; the starter is not called; the findings hold the new finding; the test names the case of a path whose first segment is the directory name in upper case. A path whose first segment contains "*" gives the same answer with the finding 'contract: a write-set path may cover the project-state directory'; the test cases are `*/x`, `**`, `.a*/tasks/x.yaml` and `*.md`. The list of write sets that must be unchanged holds no "*" in a first segment (no write-set item of any file in docs/tasks begins with "*": a Grep at D-5305 found none).
  - AC2: >-
      The helper and parity. `_under_state_dir` is used by `_run_path_ok` and `_launch_write_set` and by nothing else; `_run_path_ok` gives for every input the answer it gives at base_commit (a test compares it with the base text's behaviour on a list that holds a plain path, the directory itself, a path under it in each letter case, a path with the directory name as a later segment, a path whose first segment only begins with the directory name, and the forms the function already refuses). A path whose first segment is only a prefix of the directory name, or that holds the directory name as a later segment, is not refused by the new check.
  - AC3: >-
      Purity (INV-001, INV-002, INV-004). The directory's name appears as a string in no changed src file (the string rule of spec 7 :57 and the pinned tests in test_cli_init.py, test_cli_import.py and test_cli_approve.py); the new finding text does not contain it; no new import; no new process form; no read of the clock or of the file system beyond what the module does today. The new docstring sentences use none of the effect labels MEASURED, ENFORCED and GUARANTEED, and no string constant in a changed src file is exactly "valid", "accepted" or "approved" (aieos-checks.yml :1800-:1813), and no string in a changed src file names the state directory (aieos-checks.yml :1756-:1758; test_cli_init.py :297); the deterministic rule, OPS-003, SEC-001, SEC-002 and bandit report no finding at the task commits; the pinned phrases in the launcher.py docstring that other modules test stay unchanged (the sentences of TASK-109 AC3 and AC6 are not touched).
  - AC4: >-
      Tests. Each added test function's docstring begins "TASK-094 ACn (amended by TASK-125 ACm)", in the form of TASK111Token (tests/unit/test_cli_launch.py :579-:581), so the module's rule that every test names "TASK-094 AC" (:569-:577) still holds; no existing test changes; the whole suite passes locally (`timeout 110 python tests/run_tests.py < /dev/null`) and on the CI; no test starts a runtime or touches this repository's real state.
  - AC5: >-
      Evidence, records and the stated limits. The risk class is high; the evidence profile is that of assurance-model section 5 for high, as for TASK-109 and TASK-110 (unit_test, integration_test, deterministic_rule, static_security_analysis, ai_review cross-model by a pair of reviews on Haiku 5.5 and a separate decision_agent_review, plus the profile's other entries); the expected governor shadow result at the GOV-003 row is a stated departure as in TASK-109 AC9 (the change class is critical_cr; the acceptance names it). The raw output of the step 'GOV-003 base tests (report only)' of the task-branch run is brought at acceptance with each base-test failure named. The first run is on the task branch (DEF-0115's route). The limit is stated in the launcher.py docstring in plain words: only the first segment is checked, and a first segment holding "*" is refused because it may cover the directory; a contract whose write set is read at the base by another reader (the hook, base_inputs) is not changed here; the state commit is not automated (option S) and the root's state after the check is open (DEF-0101).
  - AC6: >-
      Limits. No change to cli.py, writer.py, gitread.py, base_inputs.py, the hook, the workflows, any spec or doc, any DEF file (their Log lines are written by their own decisions after landing: DEF-0095 gets a Log line that the write-set rule is checked at launch; spec 7 :75's wording follows in a later revision); no launching of a runtime; no change to the autonomy level or the measurement protocol.
