# Task contract TASK-125, a scratch DRAFT r2 (r1 and the changes M1 to M7 of D-5305: the tests go to tests/unit/test_cli_launch.py, the cites are corrected, the expected answer of AC1 is named and a first segment holding "*" is refused; session ce14b08a, 2026-11-06; scope ruled in D-5304 C2/C3: step 1 of the first-real-run prerequisites, "a1.1 only"); NOT approved, NOT in the repository. Whether this text is approved is recorded only in the decision agent's decision that names its SHA-256, not in this file. Form: TASK-109 and TASK-124 (docs/tasks/); the worker's own claim until checked.
# Why: DEF-0095 (spec 7 revision 6 section 7, the state-file rule, :75): "a task contract's write set does not list the state directory (proposed rule; no check reads this rule)". Today only `aieos run` refuses such a path (launcher._run_path_ok, launcher.py:1810-1820); the launch reader launcher._launch_write_set (launcher.py:1121-1139) checks the pattern rule only, so a hand-written or imported contract whose write set lists a path under the project-state directory is read and launched. CI already refuses an agent commit that changes a path under the state directory (aieos-checks.yml:1774-1775).
# Not in this task (D-5304 C3): the state commit and its automation (option S), the "committed at the base" finding (an uncommitted contract is already unread, spec 7 :73), the root's state after the check (DEF-0101 open part (a)), the runtime starter (a2), any change to cli.py, writer.py, gitread.py, the hook, base_inputs.py, the workflows, any spec or docs.
# Risk, change class: high, as TASK-109 and TASK-110: R2 reads src/** and tests/** as medium, and R3 cannot be evaluated so it matches every path it could cover (risk-rules section 2 point 3); the change class is critical_cr because the CI's EVALUATOR list holds src/aieos_bootstrap/** and the tests folders (the form of TASK-109's header).
