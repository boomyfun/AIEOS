constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      run's arguments and result. run(stdin_bytes, environ, working_folder, now) returns a mapping with exactly the
      keys exit_code, outcome, reason and findings; exit_code is always 0; outcome is one of "skip", "recorded" and
      "lost"; findings is a list of str. Step (1) of the header refuses, outcome "skip", reason "argument": stdin_bytes
      not of exactly type bytes (a bytearray, a memoryview, a str, None); environ not a collections.abc.Mapping (a list
      of pairs, None); working_folder neither a str nor None; now not a timezone-aware datetime in UTC with whole
      seconds (naive, a fraction of a second, another offset, a date, a time, a str); a raising tzinfo gives "skip",
      "argument", findings ["argument: <type name>"], by step (1)'s own try. No exception escapes run: any exception
      after step (1) gives the header's step (6) result, findings holding only the exception's type name. Equal
      arguments over an unchanged store give equal results; nothing is kept between calls.
  - AC2: >-
      run's flow, in the header's order (1) to (6); the first step that ends gives the result, and no later step's
      function is called (shown by recording stand-ins). Only environ.get(SESSION_VAR) and environ.get(ROOT_VAR) are
      called on environ: a recording Mapping whose __getitem__, __iter__, __len__ and __contains__ raise, and whose get
      raises for any other name. judge is called with exactly (session_id, root, working_folder, now) as taken, "" and
      None passed unchanged; read_paths with exactly stdin_bytes; add_reads with exactly (judge's root, session_id, the
      list read_paths gave, now). Test data (R2-4): the stdin bytes carry session_id and cwd keys whose values differ
      from the environment's session id and from working_folder; judge's stand-in returns a root that differs from the
      environment's ROOT_VAR value; so a copy that reads either is caught. Each mapping of the header is shown, in its
      order: judge's answer not a dict, missing a key, with an extra key, or with findings not a list of str ("entry");
      "enforce_nothing"; "refuse" with a str reason (judge's findings copied) and with a non-str reason ("entry");
      "tied" with a non-str or empty session id or root, with a reason other than "tied", or with a lease that is not a
      dict ("entry"; t68b R1-4); read_paths' answer of another shape ("entry"),
      "uncovered" (findings []), "read" with an empty list or a non-str item ("entry"); add_reads' "done"
      ("recorded"), "refused" with each reason of TASK-067 AC2 passed through ("lost", the writer's reason, its findings
      tuple given as a list), "refused" with a non-str finding ("entry"), and a non-StoreResult ("lost", "entry"); an
      exception raised by each stand-in, before and at step (5), and by environ.get for each of the two names ("skip",
      "entry"; t68b R1-6). Each "entry" ending of steps (3), (4) and (5) gives exactly the header's fixed findings
      (["entry: judge"], ["entry: read_paths"], ["entry: add_reads"]), and a test asserts that no text of the input,
      the environment or a stand-in's answer appears in any finding (t68b R2-3). Judge's and the writer's own reason
      on "refuse" and "lost" is asserted as findings[0] starting with "<reason>:" (t68b R2-2; their findings take that
      form, claude_code_store.py:136-138, writer.py:551-560).
  - AC3: >-
      main. main() reads sys.stdin.buffer.read() once, passes os.environ to run unread (run's two .get calls are its
      only reads), takes os.getcwd() once and the clock once, calls run once with them, and returns run's exit_code; it
      prints nothing (standard output and standard error unchanged, by stand-ins for sys.stdout and sys.stderr).
      os.getcwd() raising OSError gives working_folder None. The clock (R2-3): _raw_clock() returns
      datetime.datetime.now(datetime.timezone.utc); _whole_second_now() calls _raw_clock() and rounds up to the next
      whole second when the microsecond is not 0, keeping it when it is 0; tests replace _raw_clock only (12:00:00.000000
      gives 12:00:00; 12:00:00.000001 and 12:00:00.999999 give 12:00:01; 23:59:59.5 gives the next day's 00:00:00), and a
      source check shows that _raw_clock calls datetime.datetime.now with datetime.timezone.utc. An exception while reading standard input, the environment, the working folder or the
      clock, or raised by run, gives the return value 0 and nothing written; no exception escapes main. The line
      `if __name__ == '__main__': sys.exit(main())` is present (a source check); no test runs it as a process.
  - AC4: >-
      End to end over real stores, in a new class of tests/integration/test_writer_files.py (the only place a real
      store may be built): a store made by writer.open_store in a tempfile folder, a session started and a lease
      granted to it; run called with the bytes of a PostToolUse input for the Read tool (tool_name "Read",
      tool_input.file_path a made-up path), an environ mapping holding SESSION_VAR and ROOT_VAR, and a fixed now:
      "recorded", and writer.stored_reads shows the path; the same call again: "recorded", the path stored once; an
      expired lease: "skip", reason "refuse", nothing stored; an ended session: "skip", "refuse"; a store with no lease
      row and neither name set, the working folder the store's root: "skip", "enforce_nothing"; a store with a lease
      row and neither name set: "skip", "refuse"; an input for Grep: "skip", "uncovered", nothing stored; with one or
      both names set (R1-9): a session id and no root ("refuse", session_without_root), a root but no session id ("refuse",
      root_without_session), an unknown session id ("refuse", session), a root whose store holds no lease row
      ("refuse", no_lease_row, never "enforce_nothing"), a root with no store ("refuse", no_store), two unexpired leases
      of the session ("refuse", leases), a store of the three-table form made by a test connection dropping reads
      ("refuse", tables); a Read input whose file_path holds NUL (as the JSON escape) and one of 4097 characters
      ("lost", reason "path"); a held write lock (another connection's BEGIN IMMEDIATE, which leaves judge's read-only
      lookup unblocked, as TASK-066's test_the_locks shows) with add_reads reached through a stand-in of
      writer.add_reads that forwards with a timeout of about 0.2 seconds: "lost", reason "unreadable", nothing stored.
      The file_path values are plain made-up strings. After each case, the store's tables, reads included, are as
      expected (a dump). Set-ups (t68b R1-5, R2-1): for the ended session and the unknown session id, a second session
      holds a lease in the same store (else judge answers no_lease_row first, writer.py:972-977); the two unexpired
      leases come from a second grant to the session on a different task (leases.task_id is the key); the root with no
      store is an existing folder (a missing one gives "root"); the held-lock case's dump is taken after the holder's
      ROLLBACK. Each "refuse" case asserts judge's own reason as findings[0]'s prefix (AC2), so no case passes for
      another reason.
  - AC5: >-
      What the modules import and do (INV-001 to INV-004; D-1469 ruling 2). claude_code_read_hook.py imports exactly
      collections.abc, datetime, os, sys and, of aieos_bootstrap, claude_code_reads, claude_code_store and writer; it
      calls of writer only add_reads, of claude_code_store only judge, of claude_code_reads only read_paths (a check
      over its AST); it opens no file, starts no process, makes no network or model call, names no string with the
      project-state directory, and uses no exec, eval, compile, __import__, importlib or assert. Its os and sys uses
      (t68b R1-2), by the same AST check: of os only the attributes getcwd and environ, of sys only stdin and exit; the
      name environ (as os.environ) only as the argument of main's call of run; no getenv, putenv or argv anywhere, and
      no ".environ.get". The separation (DEF-0084
      h4c Y1-4; h4d Y5-8 in its current extent; R1-6, R2-6): an in-suite check, a function (path, text) -> findings,
      run over the hook-side modules claude_code.py, claude_code_hook.py, claude_code_channel.py, claude_code_reads.py,
      claude_code_store.py and claude_code_read_hook.py. It resolves every local name bound to the writer or the
      adapter module (import aieos_bootstrap.writer, from aieos_bootstrap import writer, either with "as"); refuses
      any star import, any from-import of a name out of aieos_bootstrap.writer or aieos_bootstrap.adapter, and any
      import of aieos_bootstrap.read_set_record; refuses any aieos_bootstrap module import not in the module's own list
      (the base's imports of each existing module, and the new module's three); and refuses any attribute of a writer
      or adapter name that is not in an allow-list: writer's store_path, session_lease and StoreResult for
      claude_code_store.py, writer's add_reads and StoreResult for claude_code_read_hook.py, none for the others; and
      adapter's violation for claude_code_channel.py only, the one pair (claude_code_channel.py, adapter.violation)
      named in the test as that exact pair, allowed until H2 or H3 rule its place. Any other reference fails, so a
      later writer function (read_log, log_path or one not yet written) is refused by default. It also refuses any use
      of a writer or adapter name other than as the object of an attribute (getattr(writer, ...), w = writer, a call
      argument), and any dotted chain aieos_bootstrap.<module>.<attr> through a bound aieos_bootstrap name (plain
      "import aieos_bootstrap.writer", or "import aieos_bootstrap as ab" with ab.writer.x) (t68b R2-7). The check passes on
      the six files and is run on hostile samples, each found: a text naming writer.remove_reads under the file name
      claude_code_channel.py; one naming adapter.violation under another hook-side name; an alias "import
      aieos_bootstrap.writer as w" with w.append_event; a star import; an import of read_set_record; a dotted chain
      aieos_bootstrap.writer.remove_reads; and getattr(writer, 'remove_reads') (t68b R2-7). read_set_record.observe is stated, in the new module's docstring, as a core-side
      function. TASK-066's AST check of claude_code_store.py's calls (store_path and session_lease only) passes
      unchanged. At the task's commits the CI steps report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002
      and bandit.
  - AC6: >-
      What is stated. claude_code_read_hook.py's module docstring states: the PostToolUse use and that nothing wires it
      into Claude Code (placement and the matcher are the owner's, CC-3, A51 item (4); C6 unmeasured); the flow and its
      order; the two names and that the empty-or-absent rule is judge's; the working folder as the process's own,
      never the input's cwd; that no key of the hook input is read but through read_paths, and that this program writes
      no record; the clock rounded up and why (the fail-closed direction), and the clock window as a limit in the
      fail-open direction (now fixed before the lookups; a lease may expire during the call; t68b R1-1); exit code 0 and
      silence on every outcome, and why (D-1469 ruling 1); the silent loss as a stated limit; the behaviour a hook-side caller of add_reads meets
      (DEF-0087: "done" 0 at the bound for a duplicate or an empty call, the hot-journal rollback of a "?mode=rw" open,
      a COMMIT that fails yet may have applied); read_set_record.observe as core-side; and every limit of the header.
      No docstring or other string constant of claude_code_read_hook.py or claude_code_store.py contains the
      project-state directory's name (the workflow's INV-004 rule, aieos-checks.yml:1589-1591; they say
      "project-state directory"), shown by the in-suite check (R1-8, R2-7). No test asserts anything about a running
      Claude Code.
  - AC7: >-
      DEF-0085's claude_code_store points. (a) The lexical search: judge's module docstring states that the upward
      search climbs lexical parents of os.path.abspath of the working folder, so a working folder reached through a
      link from outside a project's tree finds no store and gives "enforce_nothing" (fail-open for that case; the
      search itself unchanged). (b) The docstring's "any exception inside gives "entry"" is corrected to name the
      "argument: now (<type>)" finding of a raising now check. (c) _map's guard: "done" with reason "tied" gives
      "tied" only when the lookup was made with a session id (not on the search path); on the search path it gives
      "refuse", reason "entry", with a test through a stand-in of writer.session_lease; the module docstring's sentence
      on the mapping says so; the guard is a separate condition placed before the existing ones, and the line
      "answer.reason == 'no_lease_row' and searched:" stays byte-identical (t68b R1-7). (d) TASK-066's broken copy J9 (a scratch copy outside the repository only; _map keeps
      "and searched" in the task's code; R1-7), "no_lease_row on any path" (session fb812044's t066/brk66.py:58), replaces in _map the text
      "answer.reason == 'no_lease_row' and searched:" by "answer.reason == 'no_lease_row':", so a "no_lease_row"
      answer on the both-present path gives "enforce_nothing"; review 66a-R3 found it caught only by the unit module,
      because the property generator reaches the both-present path with a "no_lease_row" answer only by chance. A new
      property test function in tests/property/test_claude_code_store_properties.py generates, in at least half of its
      cases, a present session id (a non-empty str), a present absolute root and the answer "done"/"no_lease_row",
      and asserts that "enforce_nothing" occurs only when both values are absent and that those cases give "refuse",
      reason "entry" (R2-8); J9's copy, applied to the module after AC7 (c)'s change, fails it; the copy-making
      script refuses unless the replaced text occurs exactly once. (e) judge's
      check of now (a class named datetime in the type's MRO) and the writer's (isinstance) are stated in the module
      docstring (the place of (a), (b) and (c)'s sentence; t68b R2-5) as different and both fail closed; no code change. Every other result of judge is unchanged.
  - AC8: >-
      Its own tests and the changed ones (GOV-003). Every new test function names the AC ids it stands for as
      "TASK-068 ACn" in its own docstring; no other task's AC is named in qualified form in a new test. In
      tests/unit/test_claude_code_store.py, tests/property/test_claude_code_store_properties.py and
      tests/integration/test_writer_files.py every top-level and class-level function and class present at the base is
      byte-identical after the change and none is removed, and nothing else in them changes but added functions,
      classes and module-level assignments of new names, and the imports they need (R2-12), except exactly these: (1) tests/unit/test_claude_code_store.py
      R4UpwardSearch.test_a_folder_whose_state_folder_is_a_file_is_passed_over, which asserts "tied" on the search
      path with a stand-in "tied" answer (:180-181), a case AC7 (c)'s guard turns into "refuse"/"entry": its stand-in
      answer becomes writer.StoreResult('done', 'no_lease_row') and its expected outcome "enforce_nothing", with the
      same lookup call [(PROJ, None, T0)], so its purpose (the folder passed over and the outer store looked up) is
      kept; (2) tests/property/test_claude_code_store_properties.py Properties.test_the_shape_and_the_enforce_nothing_rule,
      expected to need a change (R2-11: under AC7 (c)'s guard a "tied" case needs the both-present path, under 1% of
      its cases, so seed 66 very likely no longer gives all three outcomes): a recorded scratchpad run against the
      guarded code decides it (t68b R2-4): if seed 66 still gives all three outcomes the function stays byte-identical;
      else only its seed changes, its assertions unchanged, the new seed being the first integer from 67 upward for
      which the recorded run gives all three outcomes; the run's output (each seed tried and its three counts) goes to
      the decision agent before commit C;
      and, so that "tied" is not left to chance, a new property function forces the both-present path with a "tied"
      answer in at least half its cases and asserts "tied" with the lease there. No existing function pins the docstring words AC7 (a), (b) or (e)
      change: R6WhatIsStated.test_the_docstring_states_the_rules_and_limits (:300-314) pins phrases that these changes
      keep (they add sentences and correct the one sentence on exceptions, which no test pins), so it passes unchanged.
      The acceptance-time script by source segment (as TASK-067 AC8's) lists every changed definition and refuses any
      not on this list; for (1) it compares the assertion calls of base and head and refuses unless only the expected
      tuple of :181 and the stand-in answer differ; for (2) it accepts the function unchanged or with only the seed's
      constant changed, and refuses any other difference (t68b R2-4). Before commit C, a grep of the whole tests/ tree
      for other callers of judge that expect "tied" on the search path, its unedited output to the decision agent
      (t68b R2-10). claude_code_store.py: every function, class and module-level assignment present at
      the base is byte-identical except _map (AC7 (c)) and the module and judge docstrings (AC7 (a), (b), (c)'s mapping
      sentence, (e)); an
      acceptance-time script lists every changed definition and refuses any other. Before each commit the added text
      is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, each count 0. Every test is buildable under
      deterministic_rule: real stores, sqlite3 and tempfile only in tests/integration/test_writer_files.py; the two new
      test modules use stand-ins only (for judge, read_paths, add_reads, sys.stdin, sys.stdout, sys.stderr, os.getcwd
      and the clock helper), write no file and read sources only by pathlib's read_bytes on paths relative to
      __file__; no mkdir or makedirs, exec, compile, __import__ or importlib; open only in "rb" or "ab"; no link or
      folder created; no real path of this machine's user folders, no real session id, no credential-shaped string, no
      literal "/tmp".
  - AC9: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 (each bad argument kind by name; the
      result's keys; exit code 0 in every case; equal results for equal arguments); R2 AC2 (every step's ending and the
      calls not made after it; the exact arguments passed; each mapping); R3 AC3 (main's order of reads, the getcwd
      OSError, the clock's rounding cases, every exception kind giving 0, nothing printed, the __main__ line); R4 AC4 as
      stated; R5 AC5 by the in-suite AST checks and their hostile samples; R6 AC6 by an in-suite check of the docstring
      words, matched with whitespace collapsed (D-1286); R7 AC7 (a), (b), (e) by docstring word checks and (c), (d) as
      stated. The pinned phrases (t68b R2-6), each a required substring after collapsing whitespace: in
      claude_code_read_hook.py's module docstring "PostToolUse", "nothing wires this program into Claude Code",
      "AIEOS_SESSION_ID", "AIEOS_ROOT", "the empty-or-absent rule is judge's", "the process's own working folder",
      "no key of the hook input is read but through read_paths", "writes no record", "rounded up to the next whole
      second", "now is fixed before the lookups", "exit code 0", "prints nothing", "a read may be lost silently",
      "0 at the bound", "hot journal", "a failed COMMIT may have applied", "read_set_record.observe is core-side", "outside
      every project's folder tree is not judged", "an inner project's store judges alone", "a removed or emptied
      store", "outside the launcher" and "project-state directory"; in claude_code_store.py's module docstring "lexical
      parents" (AC7 (a)), "argument: now (" (AC7 (b)), "only when the lookup was made with a session id" (AC7 (c)) and
      "the two checks of now differ and both fail closed" (AC7 (e)). R8 AC8 by the acceptance-time scripts and one run
      of each against a deliberately weakened copy: the by-segment script with one more definition allowed than listed;
      the AC8 (1) check accepting any changed assertion; and the AC8 (2) check accepting a changed assertion (t68b
      R2-12); and
      property tests (standard library only, fixed seeds, at most 50 cases each): over generated judge, read_paths and
      add_reads answers (stand-ins) and generated environ mappings, the result has exactly its four keys, exit_code is
      always 0, add_reads is called only after "tied" and a covered read, and equal inputs give equal results. Broken
      copies are made and run in the scratchpad, outside tests/, as for TASK-059 to TASK-067, and each fails at least
      one test: run with the steps reordered (read_paths before judge; add_reads before read_paths); a non-zero exit
      code on "lost"; "tied" accepted without a session id; the input's session_id or cwd read; another environment
      name read; the root taken from the environment instead of judge's result; the clock truncated instead of rounded
      up; the clock rounded up when the microsecond is 0; main printing a line; an exception let escape run, and main;
      the AST check without the allowed pair's exactness (any adapter.violation allowed); the check exempting the whole
      channel file; the check without alias resolution; _map's guard removed; and, for AC7 (d), J9 itself run against
      the property module; and (R2-13): a bytearray accepted for stdin_bytes; a naive, and a fractional, now accepted;
      a non-Mapping environ accepted; a non-str working_folder accepted; step (2) turning "" into None; the new module
      importing a fifth module, calling writer.stored_reads, and calling open; the __main__ line removed; a pinned
      docstring phrase removed (one per word check); add_reads given a now other than judge's; judge's findings not
      copied on "refuse"; and the writer's findings left as a tuple; and (t68b R1-2, R1-4, R2-7, R2-12): run reading
      a third environment name through os.environ or os.getenv; "tied" accepted with a reason other than "tied" or a
      lease None; read_paths' finding copied on "uncovered"; main reading a name of os.environ itself; state kept
      between calls (a module-level cache); the new module using exec, eval or assert, or a string naming the
      project-state directory; and the separation check without its dotted-chain or getattr refusal. The copy-making
      script refuses any copy whose edit text is not found exactly once. Each broken copy is run with the tests copied
      beside the source, since the tests read sources relative to __file__; the integration class's stand-in for
      writer.add_reads keeps the real function before the patch and forwards to it with timeout=0.2 (t68b R2-9).
      tests/run_tests.py, unchanged, runs the tests.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 600k, wall_time: 3h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC7, AC9]}
  - {gate: G3, check: constitution, args: [AC5, AC6, AC8, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
