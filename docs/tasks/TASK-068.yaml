# Task type: implementation. What it adds:
# - a new hook-side module src/aieos_bootstrap/claude_code_read_hook.py, for a PostToolUse hook on the file-reading
#   tool, with the constants SESSION_VAR = "AIEOS_SESSION_ID" and ROOT_VAR = "AIEOS_ROOT" (D-1469 ruling 4; names only:
#   nothing is placed or set) and two functions:
#   - run(stdin_bytes, environ, working_folder, now): the judgement of one hook call, every outside value an argument;
#     it returns a mapping with exactly exit_code, outcome, reason and findings; it writes only through
#     writer.add_reads;
#   - main(): the glue that reads standard input once (sys.stdin.buffer.read()), takes os.environ (passed to run
#     unread: run is the only reader of the two names), the process's own working folder (os.getcwd()) and the clock,
#     calls run, and returns its exit_code; and the line
#     `if __name__ == '__main__': sys.exit(main())`;
# - in src/aieos_bootstrap/claude_code_store.py, DEF-0085's claude_code_store points (D-1469 ruling 3), as AC7 says;
# - tests: two new test modules for the new module, additions to the two claude_code_store test modules, and one new
#   class of end-to-end tests in tests/integration/test_writer_files.py (the only kind of place a real store may be
#   built: the workflow's per-path allowance for sqlite3 and tempfile, aieos-checks.yml:1462-1470).
# Nothing in the repository wires the program into Claude Code: no settings file, no matcher, no hook entry, nothing
# under .claude/ (D-1469; CC-3, the owner's, A51 item (4)); how the owner would run it is placement, described only in
# the module docstring. writer.py is unchanged.
# The flow of run (D-1469 note §3), in this order, the first step that ends giving the result; every result has
# exit_code 0 (D-1469 ruling 1):
# (1) the arguments, all inside one try whose any exception (a raising tzinfo among them) gives outcome "skip", reason
#     "argument", findings ["argument: <type name>"]: stdin_bytes of exactly type bytes; environ an instance of
#     collections.abc.Mapping (only .get of the two names is used); working_folder a str or None; now passing the
#     test isinstance(now, datetime.datetime) and now.tzinfo is not None and now.utcoffset() == timedelta(0) and
#     now.microsecond == 0 (the form of the writer's _check_time and of read_set_record's _utc_whole; reading); a
#     failed check gives "skip", "argument", with a fixed finding naming the argument;
# (2) session_id = environ.get(SESSION_VAR) and root = environ.get(ROOT_VAR), passed unchanged (an absent name is None,
#     an empty value "", both passed as they are); no other name is read; the empty-or-absent rule is judge's (TASK-066
#     AC4; spec 5 :110); an exception raised by environ.get for either name gives step (6)'s "skip", "entry" (t68b R1-6);
# (3) claude_code_store.judge(session_id, root, working_folder, now), its answer checked in this order: not a dict whose
#     keys are exactly judge's KEYS, or its findings not a list of str, gives "skip", reason "entry"; outcome
#     "enforce_nothing" gives "skip", reason "enforce_nothing", findings []; outcome "refuse" with a str reason gives
#     "skip", reason "refuse", findings judge's own findings (judge's fixed sentences, never input text, TASK-066 AC1
#     and AC5) copied as a new list; outcome "tied" with judge's reason "tied", a dict lease, and session_id and judge's
#     root both non-empty str goes on (t68b R1-4); every other answer gives "skip", reason "entry". Every "entry" ending
#     of this step gives findings ["entry: judge"] (t68b R2-3). The session id used later is step (2)'s environment value, never
#     anything taken from judge's lease;
# (4) claude_code_reads.read_paths(stdin_bytes), its answer checked: not a dict whose keys are exactly read_paths'
#     RESULT_KEYS (claude_code_reads.py:57) gives "skip", "entry"; result "uncovered" gives "skip", reason "uncovered",
#     findings [] (read_paths' finding may name the tool, so it is not copied); result "read" with a non-empty list of
#     str under read_paths goes on; every other answer gives "skip", "entry", findings ["entry: read_paths"] (t68b R2-3);
# (5) writer.add_reads(judge's root, session_id, the paths, now), reached as an attribute of the writer module at call
#     time (so a test's stand-in for writer.add_reads is the one called): a writer.StoreResult "done" gives outcome
#     "recorded", reason None, findings [] (the count added is not kept; the caller needs none); a StoreResult
#     "refused" with a str reason gives outcome "lost", reason the writer's reason, findings the writer's findings
#     converted to a list (fixed words: TASK-067's finding rule), each checked to be a str, else "lost", "entry";
#     anything else gives "lost", reason "entry"; each "entry" ending of this step gives findings ["entry: add_reads"]
#     (t68b R2-3); no input text ever appears in findings;
# (6) no exception escapes run: an exception after step (1) gives "lost", reason "entry" when step (5) was reached,
#     else "skip", reason "entry"; findings ["entry: <type name>"], never a message.
# run reads no key of the hook input itself: the input's bytes go only to claude_code_reads.read_paths, which reads
# only tool_name and tool_input (D-1469 C1; DEF-0084 h4b Y5-6: the input's session_id, cwd and transcript_path are
# never read; this program writes no record, so no recorder words exist here; the record is the launcher's, spec 5
# :108, specification 7).
# main (D-1469 C1): reads standard input once, then takes os.environ (unread), then os.getcwd() (an OSError gives
# working_folder None, which judge refuses on the search path and which is unused when both names are set), then the
# clock through two private helpers (R2-3): _raw_clock() returns datetime.datetime.now(datetime.timezone.utc) and is
# the one a test replaces; _whole_second_now() calls _raw_clock() and rounds its value up to the next whole second
# when its microsecond is not 0 (D-1469 ruling 5; the rounding is the fail-closed direction: rounding never makes
# a lease that has expired at the clock's reading read as live); the same now goes to judge and add_reads through run.
# A limit in the fail-open direction (t68b R1-1; D-1484 C2): now is fixed before judge's lookup and before add_reads'
# lock waits (up to about 5 seconds each), so a lease that expires during the call, up to about 10 seconds, may still
# be judged live, and a read may then be stored for it. The clock is not read again before add_reads: add_reads takes
# now as an argument and checks the lease after its own BEGIN IMMEDIATE wait, so about 5 seconds would remain anyway,
# and D-1469 ruling 5's "the same now" is kept.
# An error while reading standard input, the environment or the clock gives exit code 0, no output and nothing
# written; no exception escapes main (it returns 0 on any exception); main prints nothing and writes nothing to
# standard output or standard error.
# Outcomes and messages (D-1469 ruling 1): every outcome gives exit code 0 and no text; a PostToolUse
# hook runs after the read, so a refusal would block nothing; the program never asks for an approval and never shows
# a stop. A stated limit (R1-5): a read is lost silently, and nothing records the loss, on a "lost" outcome (a lock
# held past add_reads' 5.0-second default timeout, the bound, a path refused, a damaged store, an exception) and on
# every "skip" other than "enforce_nothing" ("argument", "refuse", "uncovered", "entry") while the session holds a
# lease (t68b R1-3; for example a Read input read_paths cannot parse, which gives "uncovered", or judge's lookup refusing
# "unreadable" during a long commit, spec 5 :112, writer.py:1022-1025); the read-set stays a lower bound and an
# estimate (spec 5 :72-73; spec 2 :184). One hook call may wait up to about 10 seconds (judge's lookup timeout, then
# add_reads'), beside Claude Code's own hook timeout, unmeasured (C6). A new deferred point, for specification 2's next
# revision: a count of reads lost while a session holds a lease (every "lost" and every "skip" but "enforce_nothing";
# t68b R1-3; written at the records step, not in this task's write-set; D-1469 C1).
# The check of calls (D-1469 ruling 2; DEF-0084 h4c Y1-4 and h4d Y5-8 as far as this task reaches): AC5.
# The behaviour a hook-side caller of add_reads meets (DEF-0087's trigger, "before a contract lets a hook-side caller
# use add_reads"; D-1469 C1), stated in the new module's docstring: with exactly 10000 stored, a duplicate or an empty
# call returns "done" 0 (DA-1); a "?mode=rw" open may roll back a hot journal and so change the store's bytes (t67a-R2);
# a failed COMMIT may have applied the change ("each once" makes a later call safe). DEF-0087's other points stay open
# (writer.py is unchanged); its log line is written at the records step.
# DEF-0085 (its second trigger fires: run acts on judge's "enforce_nothing" by storing nothing; DEF-0085 :19) taken by
# AC7: the lexical search stated; the "argument: now (<type>)" finding stated; _map's guard; the J9 property case; the
# two now checks stated; and the mapping sentence of its docstring, after the guard (R2-9). Left: the global-os
# stand-ins (a limit only). Its writer-side points (the WAL state, mutation M9, AC9's short-name case) were taken by
# TASK-067 (DEF-0085's log, 2026-10-19). Its log line is written at the records step.
# DEF-0084 taken: h4c Y1-4 as far as this task reaches, h4d Y5-8 in its current extent (AC5), h4b Y5-6 (above);
# already taken by earlier tasks and not reopened: h4b Y2-11 (the bound, TASK-067; t68b R1-8), h4d Y1-1's second part
# (remove_reads, TASK-067), Y2-4, Y2-8, Y1-6 (TASK-066 and TASK-067). Stay deferred: the token-less observe and finding a task's leftover sessions (point 10's
# contract); h4d Y1-3, Y2-6; h4c Y1-7; h4b Y2-6; h4c Y2-10; h4c Y3-2; h4d Y4-6; h4c Y5-7, Y5-9; the cost of fail closed
# when a lease expires during a run; h4d Y5-7 in full (D2-4, D2-5 and D3-2's "not a holding" named in the text). DEF-0080, DEF-0081 and DEF-0082 stay deferred: this task changes none of their modules.
# DEF-0083 and DEF-0076 to DEF-0078 are not touched. DEF-0088: point 2 not reached: no message is shown; silence chosen by
# D-1469 ruling 1 (t68b R1-8); points 1 and 3 not reached; its log line is written at the records step.
# Limits (carried at acceptance): C6 and P-LOC unmeasured; no hook placed, no matcher, no setting, nothing measured
# (CC-3, the owner's, A51 item (4)); every limit TASK-061 to TASK-067 carried; whether a PostToolUse hook inherits the
# runtime's environment, in subagents and across a resume or a compaction, and the folder it runs in (spec 5 :115);
# in the desktop app's sessions the tie is covered by no measurement (spec 5 :53), so with neither name set a hook
# inside a project whose store holds a lease row stores nothing; reads through Grep, Glob, a shell or an MCP tool are
# not seen (claude_code_reads); the silent loss above; the machine's clock is trusted; the clock window above (now
# fixed before the lookups; a lease may expire during the call, t68b R1-1); spec 5 :111's limits (t68b R1-9): a hook
# call outside every project's folder tree is not judged, an inner project's store judges alone, a removed or emptied
# store turns the hook off when no session id is set, and a run outside the launcher while no task is leased is not
# judged; standard input is read whole
# (no size bound of its own); no test starts a process, so `python -m` and the __main__ line are not run by the suite
# (main is called with stand-ins); a hook killed by Claude Code's own timeout (unmeasured) stores nothing.
# Risk: high (risk rules revision 6, §2 point 3: R3 matches every path under src/** and tests/**), computed over the
# base by script before commit C. GOV-003: every path of the write-set is an evaluator path by the workflow's pinned
# list, by script; change class critical_cr, as for TASK-060 to TASK-067, ruled at acceptance. Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles. Reviews: five way-2 reviews on Sonnet 5.5, a Claude model other than
# the implementer's (Opus 5.5), never Fable (the owner's words of 2026-10-17); and the decision agent's own reviews:
# INV-003's human_review, OPS-002's human_review and the cross-model half, each its own record (D-1148 Q2).
# Records: in the readable form, as TASK-067's; per-entry coverage checked by script before the acceptance request
# (L-0022), and the governor's evaluation over the records reported (D-1098).
# Naming (D-544 Q3): every new test function names the AC ids it stands for as "TASK-068 ACn" in its own docstring.
# Evaluation path (A61; as TASK-019 to TASK-067): commit C changes only docs/tasks/TASK-068.yaml and has one parent equal
# to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-068" and no e-mail address in its message, go to
# task/TASK-068 under their own decisions; main receives the task only at its acceptance.
# Not applicable: OPS-001 (the task changes no ref); INV-005 to INV-008, INV-010 and INV-011; INV-009 (the task touches
# no event log); GOV-001, GOV-004 to GOV-006 and SEC-003 (no path of the write-set meets them). INV-004 applies: the
# writer stays the only module that opens the store; the new module reaches it only through writer.add_reads.
# Owner-kept acts: none. No hook placed, no matcher chosen, no Claude Code setting, nothing measured, nothing under
# .github/ or .claude/, no push of its own; it weakens no evidence requirement; so its acceptance is one delegated
# approval of the decision agent (Master Plan section 6).
