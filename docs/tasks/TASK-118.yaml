  - AC1: >-
      The constant. launcher.py:1068 reads `LAUNCH_ADAPTER = 'claude-code'`; no other line of src changes (a docstring of launcher.py that names the old string, if any, is corrected; the search found none). launcher.py holds no '.aieos' anywhere, comments included (tests/unit/test_launcher.py:1378). The begin call at launcher.py:1237 is unchanged in shape. tests/unit/test_cli_launch.py:143 (the begin-args pin) changes to 'claude-code' and the docstring of that test (test_the_arguments, tests/unit/test_cli_launch.py:134-139) begins "TASK-094 AC1 (amended by TASK-111), as TASK-117 AC3 and TASK-118 AC1 change it:" (the module's naming rule: "TASK-094 AC" in every test, :569-576).
  - AC2: >-
      The agreement test. A test in tests/unit/test_launcher.py, named "TASK-086 AC... as TASK-118 AC2 adds it" under the module's naming rule (:1409-1416), carries its own literal declaration text with the one item of TASK-117 AC6 (written in the test; no helper is imported from tests/unit/test_adapter_declaration.py, as tests/unit/test_launcher.py:3-5 requires; no file, no Git) and asserts that adapter_declaration.declared_max_risk(text, launcher.LAUNCH_ADAPTER) gives result low and max_risk 'low'; and a second assertion that the old name 'claude_code' gives error. The test uses the module's existing import of adapter_declaration (tests/unit/test_launcher.py:17); no new import is added to launcher.py, whose import set stays as tests/unit/test_launcher.py:1356-1360 pins it. Tests first, a red run before the change.
  - AC3: >-
      The limits of the change. No spec text, no grammar, no writer, no CI file changes; the full test suite in parts is green as at the base (the count and the one integration skip that the run at base_commit reports, plus the new test); the CI deterministic rule gives 0 findings on the changed files; no persisted record, event or contract changes (no record under docs/records and nothing under .aieos holds the id; the history text of docs/tasks/TASK-094.yaml :38 and :490 that names 'claude_code' stays as written). DEF-0122 is closed by a docs commit after acceptance (its Status and a Log line), and a note is added to its Log that the id pattern (adapter_declaration.py:80) admits an id of digits only and is kept unchanged; P1-3 and every scripted launch stay later, each its own decision.
