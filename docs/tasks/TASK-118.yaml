# Task contract TASK-118, r2 DRAFT (r2 = r1 corrected after one read-only Haiku 5.5 review of r1 (t118/review118_r1.txt), by D-4812; session a0a0bdef; a new file in the layout of TASK-117.yaml r8; written in the scratchpad; NOT approved, NOT in the repository). Whether this text is approved is recorded only in the decision agent's decision that names its SHA-256, not in this file.
# Why: DEF-0122 (opened at the acceptance of TASK-117, D-4776): launcher.LAUNCH_ADAPTER is 'claude_code' (launcher.py:1068) and launcher.start gives that name to the step "declaration" (launcher.py:651 calls _declaration (:512), whose line :518 is read_declaration(repo, head, adapter_name)), whose grammar (adapter_declaration.py g5; spec-02:237) accepts only a lowercase ASCII word or words joined by single hyphens, so `aieos launch` ends at the step "declaration" with no lease whatever the base holds, and the state commit P1-3 of the declaration for 'claude-code' (TASK-117 AC6) is useless until the two names agree. D-4810 ruled the TASK-118 read-only search and a contract kept to the minimum DEF-0122 names.
# Facts read (the search of D-4810; Grep and Glob at main 00ad2b4e): in src the only string use of the id is launcher.py:1068 `LAUNCH_ADAPTER = 'claude_code'`, used at launcher.py:1237 `begin(root, root, task_id, LAUNCH_ADAPTER, LAUNCH_HOLDER, LAUNCH_RECORDER, now, now + LAUNCH_LEASE, ...)`; the other `claude_code` hits in src (88 in 16 files) and tests (368 in 31 files) are module names (claude_code.py, claude_code_hook.py, ...); the only test that asserts the id is tests/unit/test_cli_launch.py:143 (`'claude_code'` as the fourth argument of the begin call); the hyphen form `claude-code` is the adapter id in tests/unit/test_adapter_declaration.py and tests/unit/test_writer.py:2895, in AIEOS-concept.md:633 (`adapter: claude-code`) and in the declaration to be committed at P1-3 (TASK-117 AC6); `.aieos/events.jsonl` and `.aieos/tasks/TASK-116.yaml` hold neither form (Grep of `claude_code|claude-code|adapter` there: no match); the persisted contracts and records under docs/tasks and docs/records name `claude_code` as module names, except the history text of docs/tasks/TASK-094.yaml (:38 `LAUNCH_ADAPTER = 'claude_code'`, :490 the begin call with 'claude_code') and docs/tasks/TASK-106.yaml:182 (the constant LAUNCH_ADAPTER by name), which record what those tasks did, stay unchanged and are opened by no test; the long lines docs/tasks/TASK-117.yaml:90 (the AC6 declaration text, `  - adapter: claude-code`) and docs/records/TASK-065.jsonl:27 and TASK-068.jsonl:27 (prose naming the Claude Code adapter's modules) were read in part by the decision agent (D-4811) and hold no underscore id; the adapter name flows into the Resume Check input runtime.adapter (launcher.py:504; resume_check.py:257, :690), which accepts any non-empty string; `begin` in launch_outside is launcher.start itself (launcher.py:1225 `begin = start if begin is None else begin`), so the name reaches only the step "declaration" (_declaration, :651; read_declaration at :518) and the Resume Check input (:504, :671) and, through its record, the records the Resume Check writes; adapter.py does not take the name (Grep of adapter_name|adapter in adapter.py: only docstring hits at lines 1, 3, 49); these reads answer where the name flows.
# Risk: critical (launcher.py is in src/aieos_bootstrap/**, a GOV-003 evaluator path, so D-4580 sets critical; same route as TASK-117).
# Authority: a self-build change under DM A41/A51; the grammar route (a grammar that accepted an underscore) is NOT taken: it would need a spec-02 revision and widen the id form; the canonical id is the hyphen form that spec-02:237, the concept (AIEOS-concept.md:633), the declaration and the tests already use. No spec text changes.
# Settled before this draft (decisions of the decision agent, kept outside the repository): the id pattern of adapter_declaration.py:80, which admits an id of digits only, stays unchanged and a note is added to DEF-0122's Log (AC3); where the name flows is answered by the Facts above; the agreement test is kept (AC2). No question is open.
task: TASK-118
contract_version: v1
task_type: implementation
objective: >-
  Make the launcher's adapter name agree with the declaration grammar: (1) launcher.LAUNCH_ADAPTER becomes 'claude-code' (launcher.py:1068), the only change to src; (2) the test that asserts the begin call (tests/unit/test_cli_launch.py:143) is changed to the new name and a new test in tests/unit/test_launcher.py pins that launcher.LAUNCH_ADAPTER is accepted by adapter_declaration.declared_max_risk as an adapter id (a text with one item for that id gives result low, so the step "declaration" does not refuse the launcher's own name); (3) DEF-0122 is closed at acceptance by a docs commit (its own decision). No spec text and no grammar change. One observable result changes: today `aieos launch` refuses at the step "declaration" because the name is not a valid id (adapter_declaration.py:228-229); after the change, at a base with no declaration (.aieos/project.yaml absent, as at base_commit) the read gives "absent" (adapter_declaration.py:236-237), max_risk is None and the Resume Check stops with "the runtime has no declaration" (launcher.py:512-523); either way no lease is granted, only the refusal and its reason change. No other behaviour changes; any other finding becomes a DEF entry.
