  - AC1: >-
      Scope. The task commits change only paths of the write set. The only existing production files changed are cli.py (AC11), eval_inputs.py (its docstring sentence only, AC12) and evaluation_policy.py (the tuple EVIDENCE_DEFINING_PATHS and its docstring, AC12). writer.py, evaluation.py, evaluation_sources.py, evaluation_intake.py, base_inputs.py, base_files.py, contract_path.py and eventlog.py are not changed. The new module aieos_bootstrap/evaluate_command.py imports only standard-library modules that read nothing (hashlib, json, re, datetime, copy and os, os only for os.path.isabs, each import used) and modules of aieos_bootstrap; it opens no file, starts no process, reads no clock, environment or network, and calls the writer only through read_log and append_event.
  - AC2: >-
      The function (spec :37). evaluate_command.evaluate(root, repo, task_id, ci_text, recorder, now, read=None, read_log=None, append=None) returns a mapping with exactly the keys result, reason, findings, event_id, decision, next_task_state, manifest_sha256, manifest, appended and uncovered. result is "evaluated", "duplicate" or "refused"; reason is None unless refused, and then one of the closed set argument, log, state, contract, ci, policy_ref, sources, inputs, manifest, append, evaluate. findings is a list of str, a refusal of a called module given as the text "<its reason>: <its detail>" (or its own finding texts); the first refusal ends the call; appended is the list of the record ids this call appended, in order; uncovered is eval_inputs' evidence uncovered list, or None before step 5 succeeded. It raises no Exception (an unexpected one is refused with the reason of the step it happened in, naming its type; one in the argument checks gives "argument" and one at read_log gives "log"); a BaseException that is not an Exception passes through. read_log (default writer.read_log) and append (default writer.append_event) are looked up at each call; read is passed to every Git reader. The argument checks (task_id TASK- and digits, ci_text a str, recorder a non-empty str, now a whole-second UTC datetime, root and repo non-empty absolute path strings, as evaluation.py :191-:193 asks) come before any read and any write.
  - AC3: >-
      The log and the commit (step 1, spec :38). read_log(root) is called once; its bytes L are the log of steps 1 to 7. The approved contract_hash, the state, the evaluated commit and the task's record payloads come from evaluation._task_events given a function that returns L, so no second read happens there (a private helper, used as evaluation_sources uses evaluation._task_commits; a stated choice): the evaluation._Stop it raises is caught and gives its reason "log" or "state" with its findings; any other exception there gives reason "log". The command takes no commit argument.
  - AC4: >-
      The contract (step 2, spec :39). base_inputs.contract_at(repo, commit, task_id, read) gives (contract, sha) or reason "contract" with its findings. The bytes given to the evaluation are read at the same commit by base_files.read_file at the paths "/".join(place) of the places contract_path.candidates(task_id) gives; they are the UTF-8 encoding of value["text"] of a (value, findings) answer whose SHA-256 equals sha; when no path read gives that sha the reason is "contract". sha must also equal the approved contract_hash of AC3, else reason "contract" before any append (evaluate_task compares it again at step 8, spec :45). Nothing of the working tree is read.
  - AC5: >-
      The CI data (step 3, spec :37, :40). evaluation_sources.parse_json(ci_text), then evaluation_intake.read_ci_data(value, task_id, commit): a parse finding, a value that is not a JSON object, or a refused intake gives reason "ci" with the module's reason and detail in the findings; from a present answer the command takes its runs and files.
  - AC6: >-
      The policy ref and the sources (step 4, spec :41). policy_ref is contract["input_state"]["base_commit"], with no argument of the caller; an absent or non-mapping input_state, an absent value, a value that is not 40 lowercase hexadecimal characters, or one equal to the evaluated commit gives reason "policy_ref" before any source is read. evaluation_sources.load_sources(repo, policy_ref, commit, task_id, logs, read) is called with logs exactly the "log" texts of the runs read_ci_data returned, in its order, and no other; a refusal (the loader's pin-line refusal of a log without the pinned line among them) gives reason "sources" with the loader's reason and detail.
  - AC7: >-
      The inputs and the manifest (steps 5 and 6, spec :42-:43). eval_inputs.eval_inputs(task_id, commit, policy_ref, contract, sha, changed_paths, runs, sources, payloads, recorder), changed_paths the loader's; every refusal of it gives the command's reason "inputs" with its reason and detail in the findings (an open gap among them; eval_inputs' own reasons ci and conflict appear only in the findings, the command's reason staying "inputs"). evaluation_intake.manifest(task_id, commit, policy_ref, sha, provenance, ci, files, recorder) with provenance the loader's, ci eval_inputs' evidence["ci"] and files the intake's, each passed as a fresh deep copy so that no container stands twice in the arguments (D-7149 M1); its refusal gives reason "manifest"; from a present answer the command takes its text, sha256 and record. From here every answer, a refusal included, carries manifest_sha256 and manifest (the manifest's sha256 and text); before step 6 succeeded both are None.
  - AC8: >-
      The appends (step 7, spec :44; D-7278 C4). The records to append are eval_inputs' ci_records (those the log does not hold) and then the manifest record, unless a payload of the task in L already equals it as a whole mapping under the same record_id, in which case it is left out; a payload with the manifest record's record_id that differs from it gives reason "append" with nothing written. The event id of a record is the SHA-256 hex of the UTF-8 text "evaluation-record\n" + task_id + "\n" + record_id; each event is record.added with the record as payload (whose recorder field is the caller's recorder, as the records carry it) and task_id, appended_at now, no fencing token; the recorder is also passed to append, which uses it only for a fence refusal's record. Check all, then append: every record is first decided with eventlog.append over L followed by the lines decided so far, with the same event type, payload, event id, appended_at, task_id and recorder as the real call; if any is not "appended", reason "append" and nothing is written. Then each is written with append(root, "record.added", record, event_id, now, recorder, task_id=task_id, expected_log_sha256=H) where H is the SHA-256 of L followed by the lines the writer returned for this call's earlier appends (each the result's line bytes as given, ending in LF, neither decoded nor stripped, so that H is the hash of the bytes the writer's guard reads); an answer other than "appended", or an exception of append, gives reason "append", stops the appends, and appended names what was written. A root without a store is refused by the writer's guard ("nostore") and so by this step. A second call over a log that holds the records of an earlier run that recorded no decision appends no record the log already holds (CI records and manifest) and goes on.
  - AC9: >-
      The decision (step 8, spec :45). evaluation.evaluate_task(root, repo, task_id, contract_bytes, declared, values, [], recorder, now, read=read) is called once, only after every append of AC8 succeeded; declared and values are eval_inputs'; its read_log and append are not passed, so it reads the log again and appends the decision unguarded (specification 7 section 3, stated limit). Its result "evaluated" or "duplicate" is the command's result, with its event_id, decision and next_task_state (decision None, the governor's error record, included); any other answer, or an answer out of form, gives "refused" with reason "evaluate" and its findings.
  - AC10: >-
      Nothing else is written (spec :46). The call writes only through the appends of AC8 and the append evaluate_task makes; it makes no file of the manifest: the copy kept with the task's records (DEF-0152) is the executor's act, from the command's output.
  - AC11: >-
      The command (cli.py; spec :37, :46). COMMANDS ends with import, run, evaluate. The form is evaluate <task> --root <path> --repo <path> [--json], <task> TASK- and digits, each flag once with a value that is non-empty and does not begin with "--" (as the other flags), any other argv exit 2 with USAGE and nothing called; USAGE names it. main and _run gain the keyword stdin=None after restore (_launch is unchanged); the entry line passes stdin=sys.stdin (no attribute of it is taken there, so the other commands do not depend on it). Order: inside a runtime (in_runtime) exit 1 with one refusal finding before stdin is read and before the clock; then, in the evaluate command only, stdin.buffer.read(STDIN_CAP + 1) is called once, STDIN_CAP = 67108864 (64 MiB, a resource bound), and a stdin that is None or has no buffer, an access or read that raises, a value that is not bytes, more than STDIN_CAP bytes, or bytes that are not UTF-8 give exit 1 with one finding; then clock(), then evaluate_command.evaluate(root, repo, task, text, EVALUATE_RECORDER, now) with the new constant EVALUATE_RECORDER = "aieos cli evaluate" (RECORDER of end is unchanged), looked up at each call. An answer out of form gives exit 1. "evaluated" and "duplicate" with a decision that is not None give exit 0; "refused", and an answer whose decision is None (the governor's error record: appended, but no decision), give exit 1; the text output holds, one per line, the result (with decision, next state and event id, or "refused" with the reason), "manifest-sha256: <hex>" and "manifest: <text>" whenever the answer carries them, each appended record id, each uncovered entry as one JSON text, and each finding; --json gives one JSON line of the whole answer. No output says that the task was accepted: exit 0 says a decision was recorded or already held (spec :46). The module docstring and main's docstring say what is true after the change; every other command behaves as before, and the sentences of cli.py that other tests pin or count stay as they are, except those AC14 names (main's docstring sentence among them). cli.py's imports gain only aieos_bootstrap.evaluate_command; it still names no writer and no open.
  - AC12: >-
      The paths and the stale sentence. EVIDENCE_DEFINING_PATHS gains "src/aieos_bootstrap/evaluate_command.py" as its nineteenth and last entry, and evaluation_policy's docstring says what it is (it chooses what is read and appended for an evaluation), its sentences that count or order the entries ("Five other entries follow", intent_map.py as "the last entry") staying true. eval_inputs' docstring sentence "until the policy file of BT3c exists ten of the twelve sources (all but policy_version and risk_rules, which have readers) have no producer, so no real evaluation can pass the gap check" is replaced by "the producer of the sources is evaluation_sources.load_sources, and a source it gives as None is an open gap (DEF-0156 for intent_versions)"; the rest of the limit stays.
  - AC13: >-
      The rules of the checker. No new file is opened by the new code and nothing under .github/ changes (D-7277 C5). The new code holds no string naming the project-state directory, no constant "valid", "accepted" or "approved" and no effect label of OPS-003, and passes pyflakes and bandit as the workflow runs them. If the deterministic_rule or another CI step refuses the stdin read, the new module or the entry line, the builder stops and escalates; no rule is changed in this task.
  - AC14: >-
      Tests, using only what the CI rules allow each module. test_evaluate_command.py: every reason of AC2 reached with nothing appended before step 7, the order of the calls, the logs given to the loader, the policy_ref cases, the deep copies of AC7, AC8's skip, conflict, check-all-first, expected hashes, a refused or raising second append, AC9's pass-through. test_writer_files.py (the one integration module among the writer's test modules, which may use tempfile): one new test class with a real chain over a temporary root with a store: real read_ci_data, eval_inputs, manifest, writer.append_event and evaluate_task (Git reads and the contract and source readers stood in), ending in a recorded decision; the source stand-in gives each of the twelve sources a fixture value, intent_versions included, which the test's docstring calls stand-in values and not policy (the real loader leaves an open gap there, DEF-0156); a first run refused at step 8, by a Git read stand-in that fails inside evaluate_task after the appends, leaves the records, and a second run appends none of them again and records the decision (D-7278 C4); its existing tests are unchanged. test_cli_evaluate.py: AC11 with stand-ins, the decision-None exit among them; the existing tests are changed only where they pin the command list, the docstring phrases (main's among them), the imports, the entry line or the last parameters of main and _run (test_cli_launch.py :1072-:1075), test_execution_status.py :514-:525 among them; the three path-list tests only for the nineteenth entry. Expected values are literals, not computed by the code under test.
  - AC15: >-
      CI evidence, pre-registered before the task commit exists: on the task branch and on main, "GOV-003 evaluator lists: 2 found, equal, 40 entries"; "GOV-003 evaluator change: yes (N of N changed paths)" for the N paths the task commits change (every write-set path matches an EVALUATOR pattern); the base tests run on the change (GOV-003 base tests, report only) with the predicted failures named in the acceptance (the tests that pin the old command list, phrases, imports, entry line, the last parameters of main and _run, and path list; test_execution_status.py among them).
  - AC16: >-
      Limits and open items, stated at acceptance: those of specification 7 section 3's bullet of aieos evaluate (spec :46: the trust of base_commit not checked, the guard covering step 7's appends only, records left by a refusal in step 7 or 8, the CI texts trusted, the sources of gov-AIEOS only, the refusal of a contract without a trace and of open gaps); evaluate_task's own read and unguarded decision append; a rerun after a decision that leaves a state outside VERIFYING and IN_REVIEW is refused by the state check (exit 1) (spec :46's "was already recorded" is read as evaluate_task's answer "duplicate", a reading decided at D-7294 and to be made explicit at the next revision of specification 7), and a rerun while the state stays evaluable may append another decision or answer "duplicate" (evaluation.py :236-:251, :569), and a repeated decision whose payload differs from the one held under its event id is refused (reason evaluate); an error record (decision None) gives exit 1 (spec :46's "a decision was recorded" is read as excluding the governor's error record, a reading decided at D-7295 and to be made explicit at the next revision of specification 7); the CI texts are the executor's fetch; the input on stdin is bounded at 64 MiB only; DEF-0156 stays open and no real run is made by this task; DEF-0152's lines for 2d-2s and 2d-2b are written in the records commit of this task, which is not a task commit and is made after the task commits are on main.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [src/aieos_bootstrap/evaluate_command.py, src/aieos_bootstrap/cli.py, src/aieos_bootstrap/eval_inputs.py, src/aieos_bootstrap/evaluation_policy.py, tests/unit/test_evaluate_command.py, tests/integration/test_writer_files.py, tests/unit/test_cli_evaluate.py, tests/unit/test_cli.py, tests/unit/test_cli_approve.py, tests/unit/test_cli_import.py, tests/unit/test_cli_init.py, tests/unit/test_cli_launch.py, tests/unit/test_cli_run.py, tests/unit/test_execution_status.py, tests/unit/test_evaluation_policy.py, tests/unit/test_evaluation_derive.py, tests/unit/test_evaluation_sources.py]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
# Risk: every path is src/** or tests/**: risk-rules-gov-aieos.md R2 raised by R3 (high), as TASK-161; no R4 to R13 path in the write set (to be re-checked against the rules at the contract commit).
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 900k, wall_time: 6h, retries: 3, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9, AC10, AC11, AC12, AC13, AC14]}
  - {gate: G3, check: constitution, args: [AC15, AC16, INV-001, INV-002, INV-003, INV-004, INV-007, INV-008, INV-009, INV-010, INV-011, GOV-001, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of risk high is satisfied (an other_model_review and a separate decision_agent_review, both bound to the evaluated commit, the contract and the pins, before any fast-forward of main) AND the task acceptance by the decision agent before any landing step AND the aieos-checks run of the accepted commit succeeds
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
