# Task contract TASK-144 (r1; session 26136a0a, 2026-11-19; D-6449 CO3, D-6450 CP3; the pin change for the Edit allow rule of the first real run).
# Why (the record DEF-0146, to be written by the records commit; this contract does not trace to it, because the file is not on main when the contract is committed): the sixth launch of TASK-142 made the right Edit of the write-set file and the runtime denied it, because the settings file holds no allow rule for it and the starter runs `claude -p --permission-prompts none`. The decision agent chose (D-6445) ONE per-path Edit allow rule in the settings file (variant A, cfb055d0...). The starter refuses to start unless the settings file has the pinned sha256 (claude_starter.py :94), so the pin must name the new file. The throwaway test (D-6447, perm_test_run.py) showed that an Edit allow rule naming one file lets the session edit that file and nothing else.
# Authority: D-6445 (the fix), D-6448 and D-6449 (the route: CI revision 24, this task, the settings write at the owner's prompt, CI revision 25, then TASK-143). Not in this task: the settings file itself (outside the repository; written only with the owner's own permission at the prompt), the CI revisions 24 and 25 (.github, DM A66, executor commits), TASK-143, any launch of a session.
# Risk: high (R3 matches src/** and tests/** until an architecture names components); not critical (no docs/specs, no .github, no .claude in the write set; to be computed by script at approval). Precedent: the pin change of TASK-140 (6811ffb: claude_starter.py :31 and tests/unit/test_claude_starter.py :249).
