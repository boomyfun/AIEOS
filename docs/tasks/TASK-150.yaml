acceptance_criteria:
  - AC1: >-
      The module. gate_records.py defines gate_records and DEFAULT_CHECK_MAP and nothing else public; it imports the standard library only (hashlib, re) (a test reads the file with read_bytes and ast and checks the import list and the absence of open, exec, eval, compile, subprocess, os.system, environ, time, now); no exception escapes (arguments whose own methods raise give an error); the return form has exactly the three keys; every argument check of the objective is a test (including a step whose conclusion is neither a str nor None, which is an error and gives no records); a test raises a test-defined BaseException subclass from an argument's own method and shows that it passes through.
  - AC2: >-
      The matching by check (D-6770 C3 (a)). A plan whose G3 entry has the check 'review' and steps that include every constitution step as success gives NO record for G3 and one 'uncovered' entry; the same steps keyed under a check that the map names give a record only for that check's gate; two entries of one gate, one covered and passed and one uncovered, give no record for the gate and one uncovered entry; one covered and failed and one uncovered give one 'fail' record and one uncovered entry; a check absent from the map is uncovered with the detail of the objective; a map entry whose step is absent, or present twice, or has a conclusion that is not 'success' or 'failure' (skipped, cancelled, None, any other str) is uncovered with its own detail; each is a test.
  - AC3: >-
      The outcomes (D-6770 C3 (c)). All steps success: 'pass'; every step present and one concluded 'failure': 'fail' (and a CHECK with one step 'failure' and another mapped step missing, duplicated or skipped is uncovered, never 'fail'); a gate of two entries, one failing, one passing: 'fail'; no record is ever made for an absent or skipped step; each is a test.
  - AC4: >-
      The records (D-6770 C3 (d)). Every record has exactly the keys record_id, fact_kind, source_class, recorder, subject, commit, intent_versions, gate, outcome (no other key; no ci_run); subject is the task; source_class deterministic_tool_external_ci; the intent_versions are a copy (the argument is not changed and the record does not alias it); the record_id is the SHA-256 hex of 'ci-gate', task, commit and gate joined by LF (recomputed in the test); the same arguments give equal results (INV-010 reading); and every record passes records.check_record with no finding (the test imports records, which the module does not) and is counted by the governor: a test calls the PUBLIC governor.evaluate with a minimal request and inputs built as the governor's own tests build them (the test file reads them from no file), with the maker's records as its records and a plan of G0, G1, G2, G3, and shows that the governor's result names no missing gate among G0, G1, G2 and names G3 as missing (the expected outcome of the objective; governor.py :334-336 subject, :357-364 binding, :365-368 observation only, :428 CI class are the conditions that this exercises); no private function of the governor is called. If building that request needs more than the contract allows, it is brought to the decision agent as a named departure before the test is written.
  - AC5: >-
      The default map (D-6770 C3 (b), (g)). DEFAULT_CHECK_MAP has exactly the three checks 'scope', 'build', 'lint' with the exact step names of the objective; a test reads .github/workflows/aieos-checks.yml of the checkout with read_bytes and shows that each named step exists there as a `- name:` line exactly once (the names are the workflow's at the base, spec-04 being illustrative); there is no entry for 'review', 'tests' or 'constitution' (a test).
  - AC6: >-
      Nothing else changes. Only the two paths of the write set; the whole suite passes by the slice method (D-6249 C2, D-6328 E1.6); a pin scan of the existing tests (made at approval, brought to the decision agent) shows that no existing test pins the list or the count of the modules of src/aieos_bootstrap (if one does, its amendment is a named departure, as D-6738 did); tests/run_tests.py discovers the new test file without a change.
  - AC7: >-
      The CI evidence of the task push. deterministic_rule must report 0 findings and no FAIL line; bandit "No issues identified" and the pyflakes step silent; the GOV-003 step reports an evaluator change for the two paths (a report, not a block; src/aieos_bootstrap and tests/unit are evaluator paths) and the "GOV-003 base tests (report only)" line shows NO failure (the change adds a module and a test file and edits no existing test); acceptance is by the decision agent's explicit decision only (constitution.md :94).
  - AC8: >-
      Limits and evidence, stated at acceptance. (1) The maker reads no CI run: the caller gives the steps (BT3). (2) It appends nothing: the records are the caller's to append (spec-01 :93-94). (3) The default map covers 'scope', 'build' and 'lint' only; the run-made plan's G3 'review' is uncovered by design and the governor's INSUFFICIENT_EVIDENCE for it is the honest result; whether that gate may be replaced is the owner's question (D-6770, escalated) and is NOT answered here; a deferred item for that crux is made in the acceptance records (D-6770 C4): the run-made plan's G3 'review' has no CI evidence, with launcher.py :1883, spec-04 :27 and :32, governor.py :428 and the DEF-0118 :35 inaccuracy against conformance-scenarios-initial.md :11. (4) A gate passes on the conclusions of the steps of the CI run as given: whether the steps are of the run on the right commit is the caller's. (5) The step names are the workflow's at the base; a later rename of a step makes the maker report 'step not present' (fail closed). (6) The record has no ci_run key because records.py has none (spec-02 :151 describes one). (7) The evidence profile of the high class: unit_test, deterministic_rule, static_security_analysis, ai_review by a PAIR of blind reviews on Haiku 5.5 in their own sessions (same vendor, a stated departure), a per-article review (GOV-003, INV-001 not applicable, OPS-003) and a decision_agent_review; no launched session judges its own work. (8) A launch needs the owner's typed yes; the contract authorises none. (9) The risk class is high (risk-rules R3, fail closed): the maker's records decide whether the governor can accept a task.
