# Task contract TASK-150 (DRAFT v1, scratchpad only until approved; session dc7cf6ca, 2026-11-20; BT2, the gate maker, DEF-0136; decisions D-6767 to D-6771; v2 = v1 with D-6771 R1 to R8; the first contract draft of BT2, option (A) of D-6769/D-6770). The id TASK-150 is the next free one by Glob at this draft (docs/tasks ends at TASK-149; re-read at approval). The contract is approved by the decision agent (A41, A51) at the decision of its commit, not by the owner.
# Authority and scope: BT2 is ONLY the pure maker of gate records (option (A), D-6770): no I/O, a new module only, nothing under .github/. It does NOT change the governor, reconcile.py, launcher.py (the run-made plan), the CI workflow or any DEF text. The question whether the run-made plan's G3 'review' gate may be replaced is the OWNER's (escalated at D-6770; CR-002 part 4 limit 8) and is not part of this task. Wiring (reading a CI run, appending the records, running the governor) is BT3 and is not here.
# Not in this task: the governor (pinned), reconcile.py, evaluation.py, launcher.py, cli.py, any change under src/aieos_runtime or .github, any launch, any settings file, BT3 (the evaluation runner), BT5 (the pins), the DEF for the G3 crux (its text is a records item of the acceptance commit, D-6770 C4).
task: TASK-150
contract_version: v1
task_type: implementation
objective: >-
  Add a pure core function that turns the step conclusions of ONE CI run on ONE commit into gate-result records that the governor counts for a task, honestly: a gate gets a record only when the CI evidence of the check that the plan NAMES for that gate is present and concluded, and every other gate is reported as uncovered. THE NEW MODULE src/aieos_bootstrap/gate_records.py (no process, no file, no clock, no network; it imports the standard library only: hashlib and re; it does not import records, reconcile or governor): public names gate_records and DEFAULT_CHECK_MAP only. gate_records(task_id, commit, intent_versions, plan, steps, check_map, recorder) returns a mapping with exactly the keys records (a list of mappings), uncovered (a list of mappings {gate, check, detail}) and error (None, or a short text for a malformed argument, in which case records and uncovered are both empty). It never raises an Exception; a BaseException that is not an Exception passes through (as TASK-148). THE ARGUMENTS (checked first, each failure is an error and no record): task_id TASK- followed by digits; commit 40 lowercase hexadecimal characters; intent_versions a non-empty mapping from a non-empty str to a str of the form v followed by digits; plan a non-empty list of mappings with exactly the keys gate (G followed by digits) and check (a non-empty str) (the entries of a contract's verification_plan; the optional args key of an entry is NOT passed); steps a list of mappings with exactly the keys name (a non-empty str) and conclusion (a str or None) (the step conclusions of the CI run as DATA: the caller reads them); check_map a mapping from a non-empty str to a non-empty list of non-empty str (the exact step names that are evidence of that check); recorder a non-empty str. THE MATCHING, by CHECK and not only by gate (D-6770 C3 (a)): the plan's entries are grouped by gate in the order of the plan; for each gate every one of its entries is evaluated; an entry whose check has NO entry in check_map is uncovered with the detail 'no CI step is evidence of this check' (so a caller cannot turn the steps of another check into a pass for 'review' by keying on the gate); otherwise each step name that check_map gives for the check must occur in steps EXACTLY once (absent: uncovered, 'step not present'; twice or more: uncovered, 'step named more than once'); when every mapped step of the check is present once, a conclusion other than 'success' and 'failure' (skipped, cancelled, None, anything else) makes the entry uncovered ('conclusion is neither success nor failure'); otherwise the entry's outcome is 'fail' when any of its steps concluded 'failure' and 'pass' when all concluded 'success'. A gate gets at most ONE record: 'fail' when at least one of its entries is covered and failed, even when another entry of the gate is uncovered (that entry is still listed under uncovered); 'pass' only when every entry of the gate is covered and passed; otherwise no record, and each uncovered entry of the gate is listed (D-6771 R1, the ruling on D-6770 C3 (c): a 'fail' comes only from a check whose mapped steps are all present exactly once and concluded, never from a missing, duplicated or skipped step). THE RECORD of a gate: record_id the SHA-256 hex of the four texts 'ci-gate', task_id, commit and the gate id joined by LF (a form different from reconcile's 'ci-rule' id, so the two cannot collide), fact_kind 'observation', source_class 'deterministic_tool_external_ci', recorder, subject task_id, commit, intent_versions (a copy of the given mapping), gate, outcome; and NO other key (in particular no ci_run: it is not a key of records.py, RECORD_KEYS :106-109). DEFAULT_CHECK_MAP is a module constant (a mapping from check to a list of the exact CI step names of .github/workflows/aieos-checks.yml at the base): 'scope' -> ['G0 task detection (the contract commit on main)', 'G0 scope (V0)'] (spec-04 :24), 'build' -> ['G1 build'] (spec-04 :25), 'lint' -> ['lint (pyflakes 4.0.3, pinned by version and hash)'] (DEF-0118 :32 and :35; spec-04 :32, which says its table is illustrative and a task checks it against the workflow at its base); it has NO entry for 'review' (the plan's G3 'review' has no CI evidence: spec-04 :27 gives G3 as 'constitution' and :32 says V3 and V5 are evidence types of a profile, not gates; governor.py :428 counts only CI-class gate results), and none for 'tests' or 'constitution' (a later decision or the owner's answer may add them). THE EXPECTED GOVERNOR OUTCOME with this maker alone (D-6770 C3 (e)): for a run-made LOW task (the plan G0 scope, G1 build, G2 lint, G3 review [AC1, AC2], launcher.py :1848-1849 and :1883) the maker gives records for G0, G1 and G2 when their steps are present and concluded, and G3 is uncovered, so the governor still decides INSUFFICIENT_EVIDENCE for G3 (governor.py :467-473): that is honest, and master-plan.md :117 is not met by this task alone.
