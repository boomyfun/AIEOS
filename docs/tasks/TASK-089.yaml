constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      end's arguments: root (an absolute Windows path, the form claude_code_channel.context_findings checks; a root
      starting with "/" is refused), task_id, session_id, fencing_token (None or a mapping; its own form is left to
      adapter.end), now (timezone-aware UTC whole seconds), violation (exactly a bool) and every callee (None or
      callable: session_leases, stored_reads, remove_reads, observe, observe_gone, release_lease_token, end_session)
      out of form give "refused" with reason "argument", path None and zero callee calls; every callee defaults, at
      call time, to its named function (a patch after import is the one called); the result has exactly END_KEYS.
  - AC2: >-
      The fenced path, by recording stand-ins: with a token given and session_leases giving "done" with a row of the
      task unexpired at now (expires_at > now) whose fencing_token equals the given one, with violation false and
      also with violation true, the calls are session_leases (once, with root, session_id and now), stored_reads,
      observe, remove_reads, adapter.end in that order; observe's context is exactly {root, task_id, session_id,
      fencing_token, write_set, allowlist, recorder} as given; path is "fenced"; adapter.end gets the token; an
      expired row of another task beside the task's matching row does not count (D-2797 Q-F, Q-G).
  - AC3: >-
      Held and gone, by recording stand-ins: (a) held: a row of the task unexpired at now with the token None or
      another token, an unexpired row of another task alone, or an unexpired row of the task holding the given token
      beside any other unexpired row of the session (D-2797 Q-F, Q-G), each gives "refused" with reason "held", path
      None, and no stored_reads, record, remove_reads or adapter.end call, with violation false and true; (b) gone:
      no row, only rows expired at now (expires_at <= now) of the task or of other tasks, or "ended" true with no
      rows, observe is not called and observe_gone is,
      with reason "violation" exactly when violation is true, else "no fencing token given" exactly when the token is
      None, else "lease gone (released or expired)"; path is "gone"; remove_reads and adapter.end follow as in AC2,
      adapter.end with the given token, and adapter.end's result is passed through in "end", including an
      end_session refusal of an already-ended session (D-2783 C1).
  - AC4: >-
      observe_gone, with a recording append stand-in: one append of record.added, task_id the task, no fencing_token
      argument (or None), event id record_ids(task_id, session_id)[0], the record build gives for the recorder
      "<recorder>; written by the core without a held lease: <reason>" (record_id the derived one, read_paths
      distinct in first order, evidence_type records.READ_SET_TYPE); the append's own recorder argument is that same
      recorder_text; records.check_record finds nothing; "appended" gives "written" and "duplicate" gives
      "duplicate"; any other answer gives "refused" with reason "core" and the core mapping {result, reason, seq,
      findings} in the "core" field, as observe's (a "conflict" stand-in gives core reason "conflict"); an argument
      out of form gives "refused" with no append: a bad root, task_id, session_id (record_ids giving None), a reason
      outside GONE_WHY, now out of form or a recorder without the session id gives reason "argument", and read_paths
      not a list of non-empty strs gives reason "read_paths", each case tested (disp89c row 5); a raising append
      gives "refused" with reason "observe";
      every result reason is in GONE_RESULT_REASONS, and GONE_WHY and GONE_RESULT_REASONS are exactly the tuples the
      scope names; it never raises.
  - AC5: >-
      Found present: on either path, an observe or observe_gone result "duplicate", or "refused" with reason "core"
      and core result "refused" with core reason "conflict", is followed by remove_reads, as "written" is, the
      conflict named in end's findings; any other record result (a "core" refusal with another core reason, such as
      "fence" or "log", or a refusal for any other reason) is followed by no remove_reads.
  - AC6: >-
      No reads: stored_reads giving an empty list still gives a record call with read_paths [] on either path.
  - AC7: >-
      Failing closed: a session_leases or stored_reads refusal, a "held" outcome, or a raising call before the record
      gives "refused" with no record, no removal and no adapter.end: any refused session_leases result gives reason
      "lease_rows" with its finding named, tested with "session", "no_store" and "tables" stand-ins (D-2783 Gap 1,
      C2); a stored_reads refusal "tables" and a raising session_leases or stored_reads are tested; on the fenced path
      a record not found present (or a raising observe) gives "refused" with no removal and no adapter.end; on the
      gone path such a record (or a raising observe_gone) gives no removal, and adapter.end is still called once; a
      remove_reads refusal or raise is named in the findings and adapter.end is still called; adapter.end refused
      gives result "refused" with its result in "end"; a "done" session_leases result with a malformed value (not
      a mapping, "ended" not a bool, "leases" not a list, a row without exactly LEASE_KEYS, an expires_at not a
      timezone-aware UTC datetime) gives reason "lease_rows" with nothing written, no removal and no adapter.end
      (disp89c row 4); on P2 with a token mapping out of the store's form, the record is written, the reads are
      removed, then adapter.end's "argument" refusal is passed through in "end" with result "refused", in that order
      (D-2797 Q-E, D-2801 C1); no call raises.
  - AC8: >-
      A real append over the event log's own form: observe_gone's record line, appended with eventlog.append to an
      in-memory log (no file), is "appended" with no fencing_token and no lease, and a second append of the same
      event gives "duplicate".
  - AC9: >-
      start and its order are unchanged: TASK-086's AC1 to AC7 (AC5b included) and AC9 tests, start's parts, and
      tests/integration/test_launcher_repo.py pass unchanged; of tests/unit/test_launcher.py only TASK086AC8End,
      TASK086AC10Modules.test_the_import_sets and TASK086AC12Docstrings.test_the_new_module change, and TASK086Naming
      passes unchanged.
  - AC10: >-
      The modules: by ast, read_set_record.py's import set is exactly the one tests/unit/test_read_set_record.py
      :212-213 pins and its 22 pinned phrases stay; the diff of read_set_record.py from the base is added lines only;
      launcher.py imports only datetime, hashlib and re and aieos_bootstrap's adapter, base_files, execution, gitread,
      read_set_record, resume_check, resume_inputs, resume_log_inputs and writer, and names no open, exec, eval,
      compile, __import__, subprocess, os, sys or time, no attribute environ, getenv, now, write or open_store, no
      ".aieos" string, and no assert (TASK086AC10Modules, test_launcher.py :661-686, its test_the_import_sets changed
      to add read_set_record; end reads its argument now as a name, never an attribute named now);
      tests/unit/test_writer.py :397-412 and tests/unit/test_claude_code_read_hook.py :35-42 and :489-495 (OWN_IMPORTS
      :38-44) pass.
  - AC11: >-
      Docstrings: launcher.py's holds "starts no runtime", "never raises", "not before TASK-089 lands" replaced by
      "not before TASK-090 lands", "the store is the caller's", "max_risk null never grants", "AIEOS_BASE is the
      head_commit", "the log is read twice", "this task's choice", "the record before the release", "no fencing
      token" and "TASK-090", and no longer "writes no observed read-set record" (of TASK-086's nine phrases seven
      stay, one is removed and one replaced); read_set_record.py's new paragraph names observe_gone, TASK-089 and
      point 10 and says that "three functions, called only by their tests" (:5) and the abnormal ends listed as not
      covered (:58-59) no longer hold; every new test in tests/unit/test_launcher_end.py and
      tests/unit/test_read_set_gone.py names "TASK-089 ACn", and the three changed tests of
      tests/unit/test_launcher.py name "TASK-086 AC" and "TASK-089 ACn".
  - AC12: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) end calls adapter.end before the
      record (AC2); (2) end calls observe when the lease is gone (AC3); (3) end calls observe_gone with "expired"
      for a lease it did not see expire (AC3); (4) observe_gone passes a fencing_token (AC4); (5) observe_gone's
      recorder drops "without a held lease" (AC4); (6) end removes the reads after a refused record (AC5, AC7); (7)
      end skips the record when reads is empty (AC6); (8) end calls adapter.end after a fenced record refusal (AC7);
      (9) end raises on a raising stored_reads (AC7); (10) read_set_record.py gains an import (AC10); (11) end binds a
      callee at import time (AC1); (12) violation forces the gone path over an unexpired row holding the token (AC2;
      disp89 row 1); (13) a found-present conflict taken as refused, so the reads are not removed (AC5; row 3); (14)
      end removes the reads before the record (AC2; row 11); (15) the fenced path chosen without the expiry or the
      token check (AC3; row 11); (16) a duplicate taken as refused (AC5; row 11); (17) a "held" outcome written as
      gone, observe_gone called over an unexpired row with another token (AC3; D-2782 Q-A); (18) a refused
      session_leases result ("session") taken as gone (AC7; D-2783 Gap 1, disp89c row 7); (19) the gone path skips
      adapter.end after a record not found present (AC7; disp89c row 7); (20) end counts only the task's rows, so
      that another task's unexpired row of the session is ignored and the gone path taken (AC3; D-2797 Q-F, D-2802
      C1); twenty copies in all; each copy made in a scratchpad script at G3, not committed; the governor's evaluate
      at acceptance (the shadow) with any difference named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9, AC10, AC11]}
  - {gate: G3, check: constitution, args: [AC12, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
