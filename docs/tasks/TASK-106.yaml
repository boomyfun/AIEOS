# OPS-003. Not applicable, with reasons: INV-005 to INV-008 and INV-010 (decision engine, governor, records: not changed), INV-011 (no auto-accept),
# GOV-001, GOV-004, GOV-005, GOV-006, SEC-003 (no .github/ change), OPS-001 (no ref change by the task: git forbids push).
# owner_kept_act: false: the task's acts are source and test edits in the write set; it never runs `aieos launch` on E:/AIEOS or any real
# project (the tests use stand-ins and read-only reads of this repository); A51 item (4) keeps launching with a runtime with the owner.
# Stated limits: (1) the check reads the local ref refs/heads/<base> once, at step "base"; the ref can move after it (a race between the check
# and the grant; AIEOS_BASE is the head read at step "head"); (2) the remote-tracking ref is not read: the launcher fetches nothing; (3) the
# untouched-root and Git-state check of spec 5 :121 stays open (DEF-0101); (4) the hook still makes no check 0 (spec 5 :121) - closed for the
# launcher by the Resume Check (resume_check.py :529-:530), as D-3918 C3 rules; the hook needs none (spec 7 revision 5 :49); (5) `aieos launch` passes the default base "main"; an
# option for other bases is open (spec 7 section 10 item 7); (6) the strict name rule of spec 7 revision 5 is stricter than git's own, so a base that
# git accepts but the rule refuses is refused at the argument check.
task: TASK-106
contract_version: v1
task_type: implementation
objective: >-
  Build the base-tip check of specification 7 revision 5 in src/aieos_bootstrap/launcher.py and src/aieos_bootstrap/gitread.py and their tests:
  start and launch_outside take a keyword base (default "main"); start refuses a base out of form at its argument check; after the HEAD read
  and before the log read, start reads refs/heads/<base> once through gitread and gives "refused" with the reason "base" when it cannot be read
  or is out of form, and "not granted" with the reason "base" when HEAD is not that tip; launch_outside always passes base to begin by
  keyword; gitread's rev-parse form accepts that one branch ref name; the launcher's check 0 is pinned by a test of the composed path.
