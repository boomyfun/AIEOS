# checker's rules before the work).
# Models: the main session writes the code and the tests; helpers read only; each brief goes to the decision agent first.
# Applicable articles: INV-001 (gitread is INV-001's single process wrapper; a new name form inside its fixed rev-parse form is a change to it),
