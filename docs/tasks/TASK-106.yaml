acceptance_criteria:
  - AC1: >-
      The argument. launcher.start gains the keyword parameter base="main" after its existing parameters (the nine positional parameters
      keep their order); its argument check (step 1) refuses a base that is not a str or is out of the strict name rule of spec 7 revision 5
      (1 to 100 characters of ASCII letters, digits, ".", "_", "-" and "/"; split on "/", every part non-empty, beginning with a letter or digit,
      not ending in "." or ".lock"; ".." nowhere) with "refused", the reason "argument" and a finding that begins "argument: base"; this happens
      before the gone sessions' records and the expiry, so no callee is called; the samples are tested ('', 3, None, 'a..b', '-x', 'a//b', 'a/',
      '/a', 'a.lock', 'a/.b', 'a.', 'x@{1}', a 101-character name, a name with a space or a newline) and the accepted samples ('main',
      'release-1.2', 'feature/x', 'a_b'). _CALLEES and START_KEYS are unchanged. The argument check calls gitread's one name-rule function,
      never gitread.form_error, so the first recorded call that tests/unit/test_launcher.py :312 pins stays the HEAD form with no call before it.
  - AC2: >-
      The step. In start, after the step "head" and before the step "log", a step "base" reads the ref once with
      read(repo, ['rev-parse', '--verify', '--end-of-options', 'refs/heads/' + base], TIMEOUT) through the same callee as the HEAD read: an
      answer that is not the form of a dict with no error, exit 0 and bytes, or that is not exactly 40 lowercase hexadecimal characters after
      ascii decoding and strip, gives "refused" with the reason "base" and a finding that begins "base:"; an answer that differs from the head
      gives "not granted" with the reason "base" and a finding that begins "base: HEAD" and names both commits (40 hex, shown as read); an
      equal answer lets start go on as today. In both refusals head_commit carries the head, no session row is opened, no lease and no end,
      and read_log, held, start and end are not called; the gone sessions' records and the expiry run before the step as today. The step
      variable is "base" while the read runs, so a raise inside it gives "refused" with the reason "base" as the other steps do.
  - AC3: >-
      gitread. form_error accepts for rev-parse exactly the forms of today (HEAD or an object id) and, as a third, the name 'refs/heads/' + base
      where base satisfies the same strict rule (the rule is one pure function written once in gitread.py, called by form_error and by launcher.py through gitread; it
      is not duplicated anywhere); every other name is refused as today; cat-file, rev-list and diff-tree are unchanged; SUBCOMMANDS is bound once to the same
      tuple. The docstring of gitread.py states the third form. The tests: the accepted and refused samples of AC1 through form_error;
      property tests for the rule (every accepted name starts with a letter or digit and holds none of the refused forms); the name-rule function
      uses no os attribute and no os call that tests/unit/test_gitread.py :384-:393 does not already allow. No test makes a temporary repository
      (the deterministic rule denies subprocess, tempfile, shutil and file writes in tests, aieos-checks.yml :1532-:1542; only the writer tests
      may use tempfile, :1545-:1552) and no test reads refs/heads/main of the real repository (absent on CI, :163-:166). The one real-repository
      test in tests/integration/test_gitread_repo.py reads, through gitread.run, a well-formed ref name that exists in no checkout (for example
      refs/heads/no-such-branch-106) and asserts the non-zero exit as git gives it, with the wrapper's answer in form.
  - AC4: >-
      launch_outside. It gains the keyword parameter base="main" after write_handoff, checks it with the same rule (gitread's one function) in its own argument check
      ("refused", reason "argument", no clock call, no begin call), so an out-of-form base never reaches begin (D-3928 ruling 1), and always calls begin(root, root, task_id, LAUNCH_ADAPTER, None, LAUNCH_HOLDER, LAUNCH_RECORDER, now,
      now + LAUNCH_LEASE, base=base) with base as a keyword. The stand-in begin of tests/unit/test_cli_launch.py becomes
      `def begin(self, *args, **kwargs)` and records the keywords; the pin at :136-:137 asserts the positional tuple unchanged and the
      keywords {'base': 'main'}; one test covers a non-default base. cli.py is unchanged: `aieos launch` passes no base.
  - AC5: >-
      Check 0 and the unchanged cases. One test in tests/integration/test_launcher_repo.py (the class that runs the real adapter.start and the real
      Resume Check over the real repository at COMMIT) runs start with a log whose task.approved names a contract hash that differs from the
      contract at COMMIT, and shows that start gives "not granted" with the reason "decision" and no fencing token, and that the decision.execution record passed
      to the append stand-in (read as test_launcher_repo.py :92-:93 does) has decision None and the error exactly "check 0: the contract at
      HEAD is not the approved contract" (resume_check.py :529-:530; start's own answer does not carry that text); the Resume Check is not
      stubbed, so the refusal comes from resume_check.py's code; a broken copy that removes the comparison at resume_check.py :529-:530 makes
      the test fail because the record's error is not the check-0 text, not merely because no grant is given; the held, state, inputs, start and decision refusals keep their
      reasons and order; the environment of a grant carries AIEOS_BASE equal to the head; the gone records, expiry and other steps are
      unchanged.
  - AC6: >-
      Tests. Every existing test function that the task changes keeps its assertions or gets stronger ones, shown by a script that compares,
      per test function, the ordered list of ast.dump of each assert statement and each self.assert* call at the base and at the task commit
      (TASK-102's AC3 form, TASK-104's AC4), with the exempted assertions whose value changes listed in commit X's map and named in the
      approval request: the order pins that count the callee 'read' (tests/unit/test_launcher.py :369, :377, :384, and any other pin of the recorded read calls in that file), the Intercept of
      tests/integration/test_launcher_repo.py (:45-:56; its pins at :95-:104 keep their assertions), the begin tuple pin (tests/unit/test_cli_launch.py :136-:137), and any pin of the
      recorded calls that the new second read changes; an added test passes at the task commit and fails on a stated broken copy where the item
      says "pin"; no test is deleted; a test added or changed in a module whose naming test requires a task's criteria in every test docstring
      names the criteria that naming test requires and no TASK-106 id (the link is in commit X's map). The Repo stand-in of test_launcher.py
      answers refs/heads/main with self.head at call time (:457-:467 sets a new repo.head); the Intercept of test_launcher_repo.py answers the
      exact base form with COMMIT. Named as unchanged: tests/unit/test_launcher.py :312 (the first recorded call is the HEAD form). Named as a
      test whose coverage shifts: tests/unit/test_launcher.py :563-:571 (reader_raises: its second read is now the base read); a case is added
      in which the HEAD read succeeds and the base read raises, giving "refused" with the reason "base". Named naming tests and pins that stay:
      tests/unit/test_gitread.py :407-:425 (every test names "TASK-024 AC") and :432 ("no caller exists yet"); test docstrings that become
      inexact are updated: tests/unit/test_gitread.py :81-:84 ("a ref name other than HEAD") and tests/integration/test_launcher_repo.py :2 and
      :46 ("answers only the exact HEAD form").
  - AC7: >-
      Parity and purity (INV-001, INV-002, INV-004). The frozen fixtures and reference outputs, tests/conformance/ and the native ports are
      unchanged; launcher.py and gitread.py add no import beyond the standard library already used (gitread keeps its pinned import of
      subprocess under the CI pattern rule; no exec, eval, compile, __import__ or importlib, no new process form, no connection, no file write at
      import); the literal ".aieos" appears nowhere in launcher.py (test_launcher.py :725); phrases pinned by tests stay; the deterministic rule,
      OPS-003, SEC-001, SEC-002 and bandit steps report no finding at the task commits; the CI workflow files are unchanged.
  - AC8: >-
      The stated limits. launcher.py's docstrings (module and start's step list, launch_outside) state the step "base", the two outcomes and the
      limits of the header (the race; the local ref only; the untouched-root check open; the hook without check 0; the default base in
      `aieos launch`; the strict rule stricter than git's), without the literal ".aieos". The two phrases that tests/unit/test_launcher.py
      :735-:739 pins stay, and the sentences around them are rewritten so that they stay true: "AIEOS_BASE is the head_commit" (launcher.py :27)
      now says that step "base" has found it equal to the base branch's tip at the read, and "not before DEF-0101's open points are closed"
      (:89) now lists open points that no longer name the base-tip check. approval_act's docstring (launcher.py :150-:152) stops calling the
      base-tip check open and still states that approval_act itself does not check that HEAD is the base branch's tip (that check is start's step
      "base"; a docstring change only; the task changes no behaviour of approval_act). The docstring citation in
      tests/integration/test_launcher_repo.py :107, "aieos-checks.yml :135" for the pinned Resume Check hash, is corrected to :153 (the pin is
      AIEOS_PINNED_RESUME_CHECK at aieos-checks.yml :153; :135 is the start of the job's env block). DEF-0101's closed and open points are written by its own
      decision after landing (a reading of D-3918 C3, "inside TASK-106 when it runs", as the DEF-0105 Log line and DEF-0113 were written after
      TASK-104 landed), with the content D-3918 C3 requires (the check-0 bullet closed by the Resume Check and the new composed-path test;
      the untouched-root check as an open bullet citing spec 5 :121; the max_risk and launch bullets unchanged).
  - AC9: >-
      The CI evidence. On the aieos-checks and aieos-native runs of the accepted commit every job and step is successful, read by run id; the
      real-repository tests run on the Linux leg (the aieos-checks job is ubuntu-24.04) and, on Windows, in the worker's own local run of the
      tests; on main after the records commit likewise. Each push and each GitHub job-data read is a decision of the decision agent,
      outside the capabilities above.
  - AC10: >-
      The records (L-0034, L-0037). The task's evidence records' forms are built and checked through records.check_record and a governor shadow
      over a dry records list at the approval request, with their raw output: per-article records, the property records for gitread's rule, and
      the profile entries of risk high; the expected result is NEEDS_REVIEW or NEEDS_REWORK at the GOV-003 row as in TASK-102 to TASK-104,
      stated in the acceptance as a departure.
