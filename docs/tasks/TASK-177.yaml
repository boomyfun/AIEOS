acceptance_criteria:
  - AC1: >-
      The env value. The diff of the workflow adds, directly after the line AIEOS_PINNED_RESUME_CHECK_PREVIOUS: ''
      (:229), one comment block (each line six spaces and "# ") and the line "      AIEOS_PINNED_GOVERNOR_PREVIOUS: ''"
      (single quotes, empty). The comment begins "      # AIEOS_PINNED_GOVERNOR_PREVIOUS qualifies the "Pinned:" sentence
      of AIEOS_PINNED_GOVERNOR above. Empty means off." It names its revision, "revision 34 (TASK-177)", the next
      after the highest revision in the file (the newest header is revision 31, :190; revisions 32 and 33 are named at
      :162), and says: the value holds the version that a landing of a new
      governor version leaves; it is accepted only under the rule of AC3; changing it is a change under .github/, its own
      decision (DM A66; D-317); setting it does not accept a governor version; it is emptied by the next such step after
      the new version is accepted. The lines :204-:229 stay byte for byte.
  - AC2: >-
      The code, in both conformance steps (the copies whose PINNED line is :956 and :1298). Each step gets exactly these
      lines and no other change. (a) Directly after "PINNED = os.environ.get('AIEOS_PINNED_GOVERNOR', '')" (10 spaces),
      one line (10 spaces): PREV_GOV = os.environ.get('AIEOS_PINNED_GOVERNOR_PREVIOUS', ''). (b) Directly after
      "rc_ok.add(PREV_RC)" (:1140, :1482), two lines (14 spaces): head_pin = blob(head, GOVERNOR_FILES[0]) and
      head_pin_sha = hashlib.sha256(head_pin).hexdigest() if head_pin is not None else 'absent'. (c) Directly after the
      lines "if report_only:" and "return 0" (:1207-:1208, :1549-:1550) and before the line "if gov_sha != PINNED or
      value['governor_identity'] != PINNED:", these lines: (14 spaces) if HEX.fullmatch(PREV_GOV) and gov_sha ==
      PREV_GOV and head_pin_sha == PINNED and value['governor_identity'] == PREV_GOV: ; (18 spaces) if
      record['outcome'] != 'pass': ; (22 spaces) return fail(title, 'outcome %s with the previous pinned governor' %
      record['outcome']) ; (18 spaces) print('%s: pass with the previous pinned governor %s' % (title, PREV_GOV)) ;
      (18 spaces) return 0. (d) Directly after the step comment line ending "pass. This step runs before any step that
      runs code from the pushed commits." (:910, :1252), exactly this one comment line, with the indentation of the
      lines before it: "#              From revision 34, with AIEOS_PINNED_GOVERNOR_PREVIOUS set, the base run also
      accepts that version under the rule of the job's comment." (ten spaces before "#", one line in the file).
  - AC3: >-
      The rule of the base run, with pin P, previous Q, base governor file hash b, the run's governor identity n and the
      head's governor file hash h, a run record whose outcome is pass: accepted if and only if P is empty, or b == P and
      n == P, or Q is 64 lowercase hex digits and b == Q and n == Q and h == P. A run record whose outcome is not pass is
      refused as at base_commit whenever P is set. With Q empty the rule equals base_commit's for every input; with
      Q == P the accepted set equals base_commit's. Unchanged and still applied first: the checks of :1202-:1206 (a PASS
      with no governor in the base; the Resume Check's accepted versions), the main-push check that a touched governor
      file equals P (:1113-:1114, :1455-:1456), the candidate run (report only) and every other line. The bound, stated
      plainly: P and Q are read from the pushed commit's own workflow and the code cannot tell whether they are
      accepted versions, so a push that sets both values and replaces the governor file passes the base run, a return
      to an older version among them (at base_commit a pushed workflow with the pin emptied, which is the owner's act,
      already passed any replacement). What guards the values is the A66 decision on the exact diff and the exact
      values, which accepts no governor version. Who accepts a new governor version is not decided here (DM A64, A65;
      D-7916 Q2, answered by the owner, D-7918; its matrix row follows this task).
  - AC4: >-
      tests/integration/test_ci_resume_pin_logic.py is not changed and all of its tests pass on the task tree, its
      AC4 pins of the governor lines (:31-:34) among them. AIEOS_PINNED_GOVERNOR, AIEOS_PINNED_RESUME_CHECK and
      AIEOS_PINNED_RESUME_CHECK_PREVIOUS keep their values. The INV-010 replay step (:658-:695) is not changed: it gives
      the entry AIEOS_PINNED_GOVERNOR as its governor pin (:690-:691), so after a later pin change a decision.acceptance record made under the old
      version would fail closed (DEF-0137); at base_commit no tracked events.jsonl holds a decision.acceptance line, and
      the contract of the step that changes the pin refuses it if one exists then (D-7916 C2); nothing in this task
      enforces that.
  - AC5: >-
      The text test tests/integration/test_ci_governor_pin_logic.py (standard library only; no subprocess, tempfile,
      exec, compile, open or eval; it reads the workflow with pathlib read_bytes; each test names "TASK-177 ACn" in its
      docstring and no other task's criterion) checks: (i) the comment's first line, the value line (empty) and their
      place after the Resume Check's previous value; (ii) the text cut into the two steps at the two PINNED lines, and in
      each step each exact line of AC2 exactly once, (a) after the PINNED line, (b) after rc_ok.add(PREV_RC), (c) as one
      contiguous block between "return 0" of report_only and the unchanged governor condition; (iii) the unchanged
      governor lines of the push check and the base check, once per step, and the comment line of AC2 (d), whole,
      once per step directly after its anchor line; (iv) that no added line holds a word of the
      forbidden list of test_ci_resume_pin_logic.py; and it holds a pure-Python reference function written for AC3 (it
      takes the outcome too; it is not base_run_accepts of the Resume Check's test) with a truth
      table that covers: a landing that moves b == Q to h == P passes, as a main push and as a branch run; h other than P
      fails; b outside P and Q fails; n other than the accepted value fails (n == P with b == Q, n == Q with b == P,
      'none', 'not used', empty); a Q that is not 64 lowercase hex digits is never accepted; an empty Q equals
      base_commit's rule for every input; an empty P accepts; Q == P equals base_commit's rule; a non-pass outcome is
      refused whenever P is set; and a wrong model (one that accepts Q whenever Q is non-empty) is told apart. Plainly:
      the table checks a model, not the workflow; the workflow is tied to the model only by the literal line pins and by
      the decision agent's reading of the exact diff.
  - AC6: >-
      Limits. No write access, secret, token, repository or security setting is added or changed (no permissions change;
      no secrets., GITHUB_TOKEN, uses:, continue-on-error, curl, wget in any added line). No file of src, bench or native
      changes. The new acceptance path is not exercised by this task's CI runs (the value is empty); its first real
      exercise is the branch run of the later governor task. The task runs neither a hook, the runtime program nor a
      launch. The slice runs, the base-test run, the runs on scratch copies of AC7 and the added-text scans are the
      worker's own runs outside the task's shell and filesystem capabilities.
  - AC7: >-
      Checks and evidence. Each new test is shown to fail on a scratch copy of the workflow without the lines it holds,
      and to pass on the task tree, the output returned unedited. The whole suite passes by the slice method (each slice
      under timeout 110) on the task tree before the task commit, and the base tests are run on the task tree; before the
      commit the added lines are scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, each 0. Profile of
      risk critical: unit_test, integration_test, property_test, deterministic_rule, static_security_analysis (CI), an
      ai_review (cross-model) by a way-2 review of a claude-haiku-5-5 reviewer in its own session (another model of the
      same vendor; not an independent review), and a separate
      decision_agent review that stands for human_review, both bound to the evaluated commit, the contract and the pins.
      The A66 decision, which binds by SHA-256 the built workflow, the base blob, the diff, the test and this contract,
      precedes the commit. The first run is on refs/heads/task/TASK-177 (its log prints "G0 detect: task TASK-177
      contract commit"); the commit goes to main only after the acceptance; a push stopped by a safety check goes to the
      decision agent (DM A71). GOV-003 is a stated departure (the workflow and tests/integration/** are on the evaluator
      list; DEF-0110); the acceptance gives the base-tests step's printed line. The task commit has exactly one
      AIEOS-Task trailer line. The pushes are the worker's route under their own decisions, outside the task's
      capabilities.
  - AC8: >-
      Records, in a records commit after the acceptance: not the task commit, without an AIEOS-Task trailer, outside
      this task's write set, under its own decisions. DEF-0132 stays open with a dated Log line: step 1 done, steps 2 (the governor task) and 3 (the policy
      chain) not done, with the events that resume them. The acceptance states under master plan section 6 point (6):
      the touch list with why each item is not done; the counts at the contract commit (79 open, resumed or
      waiting-owner, 14 'Blocks v0.1: yes') and after; the first batch's running total (21 of 36 at base_commit; this task
      closes none toward it); batch 3's count from its start of 83 (97 at base_commit), each accepted limit and each
      entry raising it; and the batch 2 deferral (D-7839). A history page goes into the records commit.
