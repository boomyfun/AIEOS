  - tests/run_tests.py
  - tests/unit/test_bench_isolation.py
  - tests/unit/test_export_reference.py
  - tests/unit/test_export_round2.py
  - .gitattributes
  - .gitignore
constitution: [INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The round-2 program's output. Built from bench/go by `go build -trimpath -o <file> ./round2` and run as `<file>
      <round-2 input document>`, the program prints a document byte-equal to round 2's reference document
      (tests/unit/test_export_round2.py at base_commit, REFERENCE2_SHA256 unchanged) and exits 0; on a missing or extra
      argument, a file that is not a round-2 input document, or a call or case it cannot compute (the texts naming a
      Python type among them, brief §6.3), it exits non-zero and prints nothing to standard output. Evidence before
      acceptance: the worker's run with go1.24.13 (windows-amd64) on this machine, compared by `--compare`, its output
      saved; the hosted runners' compare at the landing is read after acceptance (a stated limit).
  - AC2: >-
      The writer and its inputs (the brief's §6.2; decision D-938 B1). The round-2 code is written by a fresh agent on
      claude-opus-5-5, given only the brief's §6.2 inputs (the documents made at 6b026569 and checked against
      INPUT_SHA256 and REFERENCE2_SHA256) and a copy of bench/go at base_commit, in a scratch folder; its tool calls are
      only file reads there, writes inside its own folder and go commands there through the worker's wrapper (checked by
      script over its transcript before any of its files is used); its file set holds no file of another port; every
      file it writes is committed byte-equal to the hash the decision agent accepts after that check. No file under
      bench/go/round2 holds a 64-hex value, record id or line of the round-2 reference document that the input document
      and the given Python sources do not hold, nor any entry's expected values (checked by script against the two
      documents, by the rule as corrected in decision D-927).
  - AC3: >-
      The port's form (the brief's §3 and §6.3; D-938 B2, B5, M1). bench/go holds its eight round-1 files byte-equal to
      base_commit and one folder round2/ holding only .go files in one `package main` written by the port writer: its
      entry (the argument, the single write, the exit code), its modules, and its tests in round2_test.go (and any other
      *_test.go file); no go.mod, go.sum, vendor folder or other module, and no further subfolder. Each file under
      round2/ that is a copy of a round-1 file is byte-equal to that file at base_commit, checked by SHA-256 and named in
      the writer's report; every other file states, in the writer's report, why a whole-file copy could not serve (M1).
      The code imports only Go's standard library and holds none of TASK-044's forbidden forms: no os/exec, net, unsafe,
      cgo, syscall, time, math/rand, crypto/rand, plugin or reflect-based call of a name; os only for os.Args, reading
      the one argument path, os.Stdout, os.Stderr and os.Exit (its tests only reading the two documents given as
      arguments); it writes nothing but standard output and standard error, reads no clock, environment variable or
      random value and starts no process; its SHA-256 is the standard library's crypto/sha256 (brief §6.4).
  - AC4: >-
      The static checks and the build. In bench/go, with GOTOOLCHAIN=local, GOPROXY=off and CGO_ENABLED=0: `go vet .` and
      `go vet ./round2` report nothing and exit 0; `gofmt -l .` prints nothing (it covers round2/); `go build -trimpath`
      builds the round-1 and the round-2 binaries. Before the first push the worker runs the go step's exact lines of
      AC6, round 1 and round 2, on this machine with go1.24.13 for windows-amd64 (the zip of D-938 B6, checked by its
      SHA-256 before it is unpacked), in the scratchpad only, with GOCACHE, GOPATH, GOMODCACHE, APPDATA, TMP and TEMP
      under the scratchpad.
  - AC5: >-
      The round-2 program's own tests. bench/go/round2 holds tests run as `go test -count=1 ./round2 -args <round-2
      input document> <round-2 reference document>` that check at least: the byte equality over the whole input against
      the reference; one append call and one reconcile case field by field; the carried log (an entry after an appended
      one and after a refused one); each fail-closed input of AC1. `go test -count=1 . -args <fixture document>
      <reference document>` still passes unchanged. Both pass on the worker's machine, and the workflow runs both.
  - AC6: >-
      The workflow (A66, its own element). In each of the two jobs of .github/workflows/aieos-bench.yml, identically,
      the step "port go (only if bench/go exists)", under its one existing guard, keeps its lines unchanged and after
      its round-1 test line runs, from bench/go, `go vet ./round2` and `go build -trimpath -o "$RUNNER_TEMP/go/port2.exe"
      ./round2`; then the binary on "$RUNNER_TEMP/round2-input.json" into "$RUNNER_TEMP/go2.json"; then, from the
      checkout's root, `$PY tests/unit/test_export_reference.py --compare "$RUNNER_TEMP/round2-reference.json"
      "$RUNNER_TEMP/go2.json"`; then one run of the built port2 program with no argument that must exit non-zero and
      print nothing to standard output, its output kept in the job's temporary folder, in TASK-046's probe form; then,
      from bench/go, `go test -count=1 ./round2 -args "$RUNNER_TEMP/round2-input.json"
      "$RUNNER_TEMP/round2-reference.json"`. The header names the round-2 lines; the revision line goes from 7 to 8.
      Nothing else changes: no download, trigger, permission, secret, token, `uses:`, TypeScript or Rust byte, export
      step or round-2 export step. The earlier tests of tests/unit/test_export_fixtures.py pass over it, with only the
      pins of AC8 updated.
  - AC7: >-
      Isolation (decision D-800 C3; the risk rules policy revision 6, R12). tests/unit/test_bench_isolation.py,
      unchanged, passes: no file under src/ or tests/ outside its allow-list, nor aieos-checks.yml, names bench/ or
      imports from it, and aieos-bench.yml is the only workflow naming bench/.
  - AC8: >-
      The pins (D-938 B4), in tests/unit/test_export_fixtures.py: TASK-044's pin of the go step's lines (GoStepTests'
      GO_STEP, updated in place to the step of AC6, its lines in order, GOTOOLCHAIN=local, GOPROXY=off and
      CGO_ENABLED=0 set before the first go command, and no `go get`, `go install`, `go mod`, `go env -w` or go
      telemetry command) and TASK-046's pin of bench/go's file set (GO_FILES, updated to the exact new set, the eight
      round-1 files, the folder round2 and its files) are each updated to their one exact new value, as pin updates and
      not a loosening; go.mod's pin unchanged; and a new test class whose docstrings start with TASK-049 pins
      bench/go/round2's exact file set, the round-2 lines' order in each job, each round-1 file byte-equal to its bytes
      at base_commit by SHA-256, each M1 copy byte-equal to its round-1 file, and no go.mod, go.sum or vendor folder
      under bench/go/round2. The TypeScript and Rust steps of each job unchanged from base_commit. No earlier assertion
      is removed or loosened beyond these updates; the module's export, its other tests and its main guard are
      unchanged.
  - AC9: >-
      The CI checks and purity. At the task's commits the existing CI steps report no finding: G0 scope,
      deterministic_rule, OPS-003, SEC-001, SEC-002, SEC-003's record and bandit; every earlier test passes; the added
      Python lines are scanned for the bandit test patterns the CI applies before the first push (a stated limit: that
      scan is not bandit; the branch run's bandit step is the evidence); the forbidden forms of AC3 are checked by
      script over bench/go/round2 before the first push; if any earlier test can pass only by a change outside the
      write-set, the task escalates (needs_out_of_scope_change).
  - AC10: >-
      Naming. Every Python test function the task adds names "TASK-049 ACn" in its own docstring; no existing test's
      docstring changes, with one exception (D-938 M2): the docstring of HardeningTests.test_ts_and_go_file_sets
      changes only to state bench/go's new exact set (its eight round-1 files and the folder round2 with its files),
      the rest of that docstring and its assertions staying unchanged apart from GO_FILES's exact new value; keeping
      the old docstring ("exactly its eight, with no subfolder") is rejected, since it would become false (OPS-003);
      tests/run_tests.py is unchanged and runs no export or port.
  - AC11: >-
      Stop conditions. If any step needs a secret, a token, write access, money, a setting, the network or anything
      installed outside the scratchpad, or the copied zip's SHA-256 differs from the value in session 08c626cc's
      archived listing, the task stops and the point goes to the decision agent, and to the owner when it is the
      owner's (A66, fail closed).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell:
    allow:
      - "timeout 110 python tests/run_tests.py < /dev/null"
      - >-
        go vet . / go vet ./round2 / gofmt -l . / go build -trimpath -o <file> <. or ./round2> / go test -count=1 <. or
        ./round2> -args <file> <file> (with GOTOOLCHAIN=local, GOPROXY=off, CGO_ENABLED=0 and, locally, the scratchpad
        environment of AC4)
      - "<binary> <file>"
      - "sha256sum <SP>/go/go1.24.13.windows-amd64.zip (compared with the archived listing's value before unpacking)"
      - "timeout 110 python <SP script> < /dev/null (the standard library's zipfile, unpacking into <SP>/go only)"
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: critical
autonomy:
  max_level: L1
  budgets: {tokens: 900k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC7, AC8, AC10]}
  - {gate: G3, check: constitution, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC9, AC11, INV-001, INV-002, INV-003, GOV-002, GOV-003, SEC-001, SEC-002, SEC-003, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
