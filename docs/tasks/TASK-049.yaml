# Task contract TASK-049, the stack benchmark's second round-2 port: Go (Master Plan revision 4, §4 "The benchmark and
# the stack ADR"; docs/plan/m4-exit-review.md §6, line 70; docs/plan/bench-port-brief.md revision 3, §6; decisions
# D-794, D-800 C3, D-814 Q4, D-905, D-919, D-934 C4, D-935 C2, D-938; DEF-0063).
# Revision 0, drafted under decision D-938 (the scope note, B1 to B9, with its rulings M1 and M2); brought for approval
# in its own request; whether it is approved is recorded in the decision files, not in this file. Fields and value
# forms follow specification 2 §5.1 and the contracts of TASK-007 to TASK-048. Readings marked "(reading)" are the
# worker's, for the decision agent's ruling.
# Task type: implementation, with two writers on two path sets (as TASK-044 and TASK-048):
# - the round-2 code, bench/go/round2/** (AC3), is written by a fresh agent (claude-opus-5-5, started for this task
# only) given only the inputs of the port brief's §6.2: the brief at revision 3 (its hash below), the four Python files
# at commit 6b026569b4c62ec5d5b061138d8522d2ab651542 by the hashes the brief names, the round-2 input and reference
# documents made at that commit and checked against their pins (with the source of tests/unit/test_export_round2.py,
# 6fd0c9d2…), bench/go's round-1 code at base_commit, and this contract. It works only in a scratch folder of the
# worker's scratchpad holding a copy of bench/go at base_commit, with no access to the repository, the archives, the
# other ports (bench/rust's round 2 included) or any review, and runs only the go command there, through the worker's
# wrapper script (TASK-044's go_wrapper.sh, decision D-860, with this session's paths);
# - everything else (the workflow step and the tests of AC8) is written by the worker.
# Round 1 unchanged (brief §6.3; decision D-938 B2): bench/go's eight round-1 files (export.go, go.mod, governor.go,
# json.go, main.go, port_test.go, records.go, resume.go) stay byte-equal to base_commit; checked by script before any
# writer file is used.
# The second program (a reading of §6.3 for Go; decision D-938 B2 and M1): bench/go's round-1 code is one `package main`
# in the module root (module aieosbench, go 1.24). Go builds one program per package folder and cannot import a
# `package main`, so round 2 is a second `package main` in a new folder bench/go/round2/ of the same module (its own
# main, its modules and its test file round2_test.go; no go.mod change), and "reuses" (§6.2 item 4) is met for Go as
# follows (M1): where round 2 needs a round-1 source file whole (for example the canonical text or the JSON reading), the
# writer uses a byte-equal copy of that round-1 file under bench/go/round2/, each copy checked by its SHA-256 against
# the round-1 file at base_commit and named in the writer's report and in the acceptance record; code written anew is
# allowed only where a whole-file copy cannot compile in round2/ or would carry round-1's `main` or its argument rule,
# and the writer states each such case. The duplication and every rewritten form are stated limits and review points.
# The alternative, moving round-1's computation into an importable package, is rejected: it changes round-1 files.
# The toolchain (brief §3; D-938 B6): in CI, the go command the hosted runners provide (go1.24.13 on both in the
# benchmark's run 8), not downloaded, its version printed by the toolchain-versions step; locally, go1.24.13 for
# windows-amd64 from the zip already fetched in session 08c626cc (decisions D-858 and D-859: checked then against the
# SHA-256 that go.dev's download listing published), copied into this session's scratchpad and checked against the
# value in that session's archived listing before anything is unpacked or run, then unpacked with that session's
# go_unzip.py with this session's paths only, its own decision; no network. Every go run, in CI and locally, has
# GOTOOLCHAIN=local, GOPROXY=off and CGO_ENABLED=0; locally also GOCACHE, GOPATH, GOMODCACHE, APPDATA, TMP and TEMP under
# the scratchpad. No go telemetry, go get, go install or go mod command.
# The workflow change (A66, its own element at code time; D-938 B3): in both jobs of .github/workflows/aieos-bench.yml,
# identically, the step "port go (only if bench/go exists)" keeps its one guard, its export line and its round-1 lines
# unchanged (reading: `go vet .`, `go build ... .` and `go test -count=1 . -args …` name the root package only, so the
# round-2 folder does not enter them; `gofmt -l .` recurses into bench/go/round2 and so already checks it), and after
# the round-1 test line adds the round-2 vet and build, run, compare, no-argument probe and tests (AC6); the header
# names the round-2 lines; the revision line goes from 7 to 8. No download, trigger, permission, secret, token or
# `uses:`; the TypeScript and Rust steps' bytes, the export steps and the round-2 export step are unchanged. TASK-048's
# carried D4 (the probe header's "print nothing", meaning standard output) is applied to the new header words only
# ("print nothing to standard output"); the round-1 header wording stays for D4's own decision (D-935 C2).
# Limits: the benchmark workflow runs on pushes to main only, so the round-2 port's hosted evidence on Linux and Windows
# comes from the landing's run, read after acceptance; before acceptance, the evidence of byte equality is the worker's
# local run (go1.24.13, windows-amd64) and the reviews; the runners' go version is not pinned (brief §3); the download
# listing's hash was self-attested by its publisher; the texts the Python builds naming a Python type fail closed (brief
# §6.3), reached by no generated input; no file behaviour is compared; Go's no-import rule (M1), with round-1 files
# copied whole or their forms written again; round 2's ports are written one after another, Go second after Rust (order
# bias); every writer and reviewer is an AI of one vendor; TASK-046's carried limit (a probe passes when its program is
# missing) holds for the new probe as for the others, and the landing's log is read for the round-2 program's own usage
# line; TASK-048's D1 and D6 kinds (fail-closed inputs tested in-process only; a refusal the Python does not state) are
# review points here.
# What it is not: the results are advisory (A29, A31) and feed no gate, record or evidence entry; aieos-checks.yml and
# its two pins are not touched; src/ is not touched; no TypeScript or Rust change; the round-1 port's results do not
# change.
# Risk: critical, and change class critical_cr, computed over the base by script (risk_class49.py: risk_class48.py with
# only the write-set and its header line changed): .github/** is R9 (critical); bench/** is R12 (high); tests/** is R2
# (medium) with R3's fail-closed reading (high); .github/** and tests/unit/** are evaluator paths of GOV-003's list.
# Profile (assurance-model.md §5, gov-AIEOS, critical): high's entries plus architecture [human_review], met for
# gov-AIEOS by the decision agent's review, and functional [the property/fuzz entry] by the CI's property_test step over
# the existing property suite (the task adds no property test; it changes no decision code); the cross-model entry by
# the pair of reviews: five way-2 reviews from the port review template (revision 1, unchanged, brief §6.5) with D-934
# C4's five round-2 fill texts, only their task facts changed, on claude-sonnet-5-5 (a model other than the port
# writer's and the main session's), and the decision agent's separate review. One delegated approval (reading, as
# TASK-048). Round 2's findings are counted apart from round 1's (§6.5).
# Naming (D-544 Q3): every Python test this task adds names the AC ids it stands for as "TASK-049 ACn" in its docstring.
# Evaluation path (A61): commit C changes only docs/tasks/TASK-049.yaml and has one parent equal to base_commit; the
# task's commits, each carrying "AIEOS-Task: TASK-049", go to task/TASK-049 under their own decisions; main receives the
# task only at its acceptance.
# Not applicable: OPS-001 (no ref changed by the task's code); INV-004 to INV-011 (no project state, decision engine,
# governor, evidence record, replay or policy path in the write-set); GOV-001, GOV-004 to GOV-006. SEC-003 applies (a
# .github/ path), under A66 as above.
# Owner-kept acts: none, on these conditions: the changed workflow grants no write, uses no secret or token, changes no
# repository or security setting and costs nothing (public repository, hosted runners); the local toolchain needs no
# network and installs nothing outside the scratchpad. If any of these is not so, the task stops and the point is the
# owner's (CR-002 part 4 limit 5), fail closed.
task: TASK-049
contract_version: v1
task_type: implementation
objective: >-
  Extend bench/go with round 2 of the benchmark (the brief's §6): a second program in bench/go/round2/, written from the
  port brief (revision 3) by a fresh agent, which prints a document byte-equal to round 2's reference from round 2's
  input, with its own tests, round 1's eight files unchanged; extend the go step of both jobs of
  .github/workflows/aieos-bench.yml to vet, build, run, compare and test it and probe it with no argument; update
  TASK-044's and TASK-046's pins in tests/unit/test_export_fixtures.py. Nothing else changes; the results are advisory
  and feed nothing.
traces_to:
  - docs/plan/m4-exit-review.md#6
  - docs/plan/master-plan.md#4
  - docs/plan/bench-port-brief.md
  - docs/pre-genesis/constitution.md#SEC-003
input_state:
  # base_commit is the `main` commit on top of which the approved contract is committed as its own commit C, changing
  # only docs/tasks/TASK-049.yaml; G0 requires C's one parent to equal base_commit. It is filled by script from
  # refs/heads/main just before C is made: the placeholder and its quotes are replaced by the 40-hex id, unquoted.
  base_commit: 8d8fee5dec7c4cb87e93c0b9c121daf61b8d657b
  depends_on: [TASK-039, TASK-044, TASK-046, TASK-047, TASK-048]
  intent_versions:
    docs/plan/m4-exit-review.md: 6c41ca8200a4e757f04b22aa521e52cd67f7ac3122690e667ac4c864aa57c4a4
    docs/plan/master-plan.md: 8276a587bbf6f75be8867feb97df6726379babfcdb2266344bfdb4d01e6b2d23
    docs/plan/bench-port-brief.md: 1f5376c7113c3286cfe67dfa1567da31ed0dfae74b7d43f4ff455ea3141d4450
    docs/pre-genesis/constitution.md: 9b396c3c0f31d3a3fbccf9433cf81eb820b6e0f0a3a7d099e2899043abfe1f5a
    docs/specs/risk-rules-gov-aieos.md: 29dd803aed6a55c11fad04d01dac32ee10a8f15f96f099857a00212c100d4ed5
    docs/specs/conformance-files.md: 2f1c224466fe3657167b116b49f902648130bf76e1274367d7780cc38ec7b021
write_set:
  # The round-2 folder under bench/go/ (the writer's files), one modified workflow, one modified test module.
  paths:
    - bench/go/round2/**
    - .github/workflows/aieos-bench.yml
    - tests/unit/test_export_fixtures.py
read_set:
  paths:
    - docs/plan/**
    - docs/pre-genesis/constitution.md
    - docs/specs/risk-rules-gov-aieos.md
    - docs/specs/conformance-files.md
    - docs/tasks/**
    - src/aieos_bootstrap/**
    - tests/unit/**
    - tests/run_tests.py
    - .github/workflows/aieos-checks.yml
    - bench/go/**
  interfaces:
    - tests/unit/test_export_round2.py (the round-2 input and reference documents, run as a script)
    - tests/unit/test_export_reference.py (--compare, run as a script)
    - bench/go/round2 (the round-2 program, built from bench/go by `go build -trimpath -o <file> ./round2` and run as
      `<file> <round-2 input document>`)
  schemas:
    - conformance-files canonical form (2)
    - the round-2 documents' forms (TASK-047 AC1, AC2)
forbidden:
  - .github/workflows/aieos-checks.yml
  - .aieos/**
  - .claude/**
  - CLAUDE.md
  - AIEOS-concept.md
  - bench/ts/**
  - bench/rust/**
  - bench/go/export.go
  - bench/go/go.mod
  - bench/go/go.sum
  - bench/go/governor.go
  - bench/go/json.go
  - bench/go/main.go
  - bench/go/port_test.go
  - bench/go/records.go
  - bench/go/resume.go
  - bench/go/vendor/**
  - bench/go/round2/go.mod
  - docs/**
  - src/**
  - tests/conformance/**
  - tests/integration/**
