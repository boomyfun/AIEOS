# Task contract TASK-020, the set file's RISK-01 entry and the conformance-file tests that check the set file (Master
# Plan revision 3, §4 M4; M4's work order of decision D-429 as refined by decision D-459: RISK-01's step 3 split into
# TASK-018, the fixture, TASK-019, the runner tests, and TASK-020, the set file's entry with its freeze first;
# specification 2 §5.1). Revision 0, drafted under decisions D-495 (E2, C3), D-496 (C1) and D-500 (Step B, C3);
# brought for approval in its own request; whether it is approved is recorded in the decision files, not in this file.
# Fields and value forms follow specification 2 §5.1 and TASK-014's contract, whose method this task repeats for the
# Risk Engine entry. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Why: TASK-018 added and froze the Risk Engine fixture tests/conformance/fixtures_risk/risk_01.py (SHA-256
# 8a0bdb1665dc30998fae3a6926a37f854a38780695e6276d62ce5d9ece06a45b, DM F34) and left the set file's RISK-01 entry null;
# TASK-019 made the runner tests hold in both states of that entry. This task gives the set file RISK-01's entry and
# fixture_set_version 3, and changes the test_conformance_* modules whose checks of the set file and its freeze fail in
# that state, or would pass in it only because every input then gives an error: the four class (c) ids of decision
# D-481 (TASK-019 AC7; DEF-0045), and the copies of the set check that those tests and the property tests use.
# The owner's words for this task (the session prompt of 2026-10-11, item 3, approved in decision D-499):
# "danh sách lúc nộp và lúc nhận kết quả đúng bằng bản đã khoá".
# The set file's freeze is already given (conformance-files.md section 7, revision 5; decision D-496; DM F35): the
# approval of the set file's bytes, SHA-256
# 2d952987089977fca6e62699393ccce7b047674f34053a0f0ae68602c3498b3b, is the record TASK-020-freeze-set of
# docs/records/TASK-020.jsonl, on main since commit a87f84e9 with DM row F35 (decision D-497). So the set file at each
# of the task's commits and at its acceptance must be exactly those bytes, and any other set file is refused (AC1;
# D-496 C1); the acceptance cites that freeze and gives no other (section 7 (c)); other bytes would need a new freeze
# under section 7 before any acceptance.
# A scratch run (session e6209999, a clone at 20d18c08 with only the frozen set file put in place, on a compiled tree)
# gave "Ran 594 tests", "FAILED (failures=4)", exactly the four class (c) ids; in that state every copy of check_set in
# tests/unit/test_conformance_files.py, tests/integration/test_conformance_set.py and
# tests/property/test_conformance_properties.py returns five errors over the tree's own set file (the script
# vacuity20.py, archived with that session's evidence), so the altered-set and altered-file cases that assert "an error"
# would pass whatever they alter (reading: a weakening by vacuity under GOV-003, so the property module changes too).
# The id: TASK-019 is the highest contract id used, and TASK-020 is the id decision D-459 gave this task and the freeze
# record names (checked by script against docs/tasks/ and docs/records/).
# Task type: fixture (docs/specs/conformance-files.md section 8, revision 5). Every changed path is the set file of
# section 3 under tests/conformance/ or a test module test_conformance_*.py directly under tests/unit/,
# tests/integration/ or tests/property/ that checks only the conformance files against that document and the bound
# scenario file. GOV-002 does not apply, as the constitution writes its applicability (implementation, refactoring);
# every other article whose applicability names implementation is applied as to an implementation task, so no evidence
# requirement narrows (section 8; CR-002 part 4 limit 8).
# Readers of the changed paths: the CI workflow's conformance base and candidate runs read the set file from the base,
# so this task's own pushes run the base's set file (RISK-01 null) and the first conformance run over the new set file
# is the base run of the next push after this task lands; tests/run_tests.py and the CI workflow's unit_test,
# integration_test and property_test steps run the changed modules; the runner tests of TASK-013 and TASK-019
# (test_runner.py, test_runner_rc.py, test_runner_properties.py, test_runner_run.py, test_governor_conformance.py,
# test_runner_rc_run.py, test_runner_risk_run.py) read the set file's state from the tree and hold in both states;
# tests/integration/test_conformance_rc_set.py and tests/integration/test_conformance_risk_set.py read every .py file
# under src/ and tests/ for their fixture folders' last path parts and allow them only in the modules they list
# (AC5 changes the Risk Engine list).
# Risk: critical. R11 matches tests/conformance/** (critical); R3 read fail closed matches tests/** (high); the highest
# wins (risk rules section 2 point 1); computed over the base by script, its output in the approval request.
# Profile (assurance-model.md §5, gov-AIEOS, critical): unit_test, integration_test, property_test,
# deterministic_rule, static_security_analysis, ai_review (cross-model) and human_review; plus the evidence_required
# of the applicable articles. Dimensions are named as TASK-005's records name them (decision D-181, reading R-dim).
# Change class: critical_cr (reading, fail closed, as TASK-014's; computed, not asserted): GOV-003's tool part over the
# base marks every path of the write set as an evaluator path, all modified, none added; five of them are existing
# evaluator tests whose assertions change; the set file's change is a change under a freeze that is already given
# (DM B10: normal_cr with a freeze), which alone would be normal_cr. The stricter class is taken. Either way the change
# is judged by the base version and never auto-accepted (constitution GOV-003; governor-spec.md §8).
# Freeze: no freeze approval is given in this task's acceptance (section 7, revision 5, (c)): the acceptance cites
# TASK-020-freeze-set. No fixture changes (the 19 files of fixtures/, the 11 of fixtures_rc/ and the one of
# fixtures_risk/ are forbidden).
# Reviews (as TASK-014's): five way-2 reviews by a Claude model other than the implementer's, each brief to the decision
# agent first (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002; governance
# ai_review for GOV-003, which also checks that no test is weakened, by vacuity included; operational ai_review for
# OPS-003; the cross-model half), and three decision-agent reviews (architecture human_review, which is both INV-003's
# entry and the critical profile's, and which also checks that the set file names the fixture faithfully and that the
# property tests still cover the related invariants (assurance-model.md §5); operational human_review for OPS-002; the
# cross-model half). Each way-2 review record's basis names every article whose entry it covers. Each reviewer's prompt
# is self-sufficient, with the scratchpad's absolute path in its first line and every input a copy under the
# scratchpad's review folders (D-277, D-373, D-374).
# Evaluation path (A61; as TASK-013 to TASK-019): the approved contract is committed on main as its own commit C, which
# changes only docs/tasks/TASK-020.yaml and has one parent equal to base_commit, and is pushed normally; the files are
# drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set first), the suite run on a
# compiled tree as the CI's G1 step leaves it (L-0018); the task's commits, each carrying the trailer
# "AIEOS-Task: TASK-020" and no e-mail address in its message, go to the branch task/TASK-020 on GitHub, each push under
# its own decision of the decision agent after a secret scan, a check of the set file's SHA-256 (AC1) and a dry run
# against a bare copy, never by force and never deleting; the CI channel runs on each push and its records are
# re-fetched into docs/records/TASK-020.jsonl, after the freeze record, which stays its first line; main receives the
# task only at its acceptance, by a fast-forward under its own decision (or, if main has moved, by rebuilt commits
# checked equal, as decision D-475 C3 did).
# Not applicable: GOV-002 (above); OPS-001 (scope: the repository's refs; the task changes no ref); INV-009, INV-011,
# GOV-001, GOV-004, GOV-005, GOV-006 and SEC-003 (their scopes, the event log, the policy, the concept file, the bound
# artifacts, the decision matrix, the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. Nothing under .github/, no workflow change, no Claude Code setting (CR-002 part 4 limit 5 does
# not apply); no evidence requirement is weakened (limit 8 does not apply). Approver of the acceptance (reading, for the
# decision agent's ruling with this contract, as decision D-492 ruled for TASK-019): one delegated approval of the
# decision agent (Master Plan §6: the owner approves only a task under CR-002 part 4 limit 5 or limit 8 and the first
# governor version; a critical_cr change class alone is neither).
# Pinning RISK-01 in the CI workflow, if a pin is wanted, is not part of this task: it is a later .github/ change of its
# own under DM A66 (decision D-495 C3).
# Uncovered and stated limits (AC9): this task's own conformance runs take the set file from the base, so no CI
# conformance run over the new set file exists before the task lands; RISK-01's result over the tree is shown at the
# task's commits only by TASK-019's tree-run tests (test_runner_risk_run.py among them), which then run their
# present-state branches over the tree for the first time; RISK-01's first conformance run is the CI's base run after
# landing, reported and advisory, never "MEASURED" and not part of this acceptance; the Risk Engine fixture is checked in
# its own form by TASK-018's three modules, not by the Verification form; TASK-018's
# test_the_set_file_is_frozen_and_risk_01_is_null_or_this_file keeps its two allowed states (this task does not narrow
# it); every review is by AI of one vendor.
task: TASK-020
contract_version: v1
task_type: fixture
objective: >-
  Give the set file tests/conformance/set.py RISK-01's entry naming its frozen fixture
  tests/conformance/fixtures_risk/risk_01.py with its SHA-256, and fixture_set_version 3, so that the file is byte for
  byte the set file whose freeze is already approved (SHA-256
  2d952987089977fca6e62699393ccce7b047674f34053a0f0ae68602c3498b3b, record TASK-020-freeze-set, DM F35), at each of the
  task's commits and at its acceptance; and change only the five test_conformance_* modules whose checks of the set file
  and its freeze fail in that state or would pass in it only by vacuity (tests/unit/test_conformance_files.py,
  tests/property/test_conformance_properties.py, tests/integration/test_conformance_set.py,
  tests/integration/test_conformance_rc_set.py and tests/integration/test_conformance_risk_set.py), so that they check
  the new set file exactly, with no assertion weakened. No fixture, runner, governor or other test changes.
