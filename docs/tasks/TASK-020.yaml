acceptance_criteria:
  - AC1: >-
      The set file, byte for byte, at each commit and at acceptance. At each of the task's commits and at its
      acceptance, tests/conformance/set.py has the SHA-256
      2d952987089977fca6e62699393ccce7b047674f34053a0f0ae68602c3498b3b (10472 bytes), the bytes the freeze record
      TASK-020-freeze-set binds (decision D-496, DM F35), checked by script before each push and in the acceptance
      request; a set file with any other SHA-256 is refused: no push and no acceptance is brought with it, and other
      bytes need a new freeze under section 7 first (D-496 C1). A script also shows again that it differs from the set
      file at the base (f1c01c75f3e018ee2d1430337a848535a1fb97742ded45602316c7bce9bcfbc9, DM F31) only in
      fixture_set_version (2 to 3) and in RISK-01's fixture, now the path conformance.expected_path gives for RISK-01
      and Risk Engine (tests/conformance/fixtures_risk/risk_01.py) and the SHA-256
      8a0bdb1665dc30998fae3a6926a37f854a38780695e6276d62ce5d9ece06a45b bound by DM F34; and that the bytes are the
      canonical form of section 2.
  - AC2: >-
      The set checks (tests/unit/test_conformance_files.py, tests/property/test_conformance_properties.py,
      tests/integration/test_conformance_set.py; the helpers repeated in each, as today). check_set accepts a fixture
      for exactly the Verification, the Resume Check and the Risk Engine capabilities, each at the path its capability
      gives (the Verification folder, tests/conformance/fixtures_rc/ or tests/conformance/fixtures_risk/, sections 2, 9
      and 10), and requires fixture_set_version 3; the tree load reads the fixture files of the three folders; every
      other condition of check_set is kept. Over the tree, check_set returns exactly [] in each of the three modules (a
      test asserts it in each, so that no altered-input case passes by vacuity). The set file test and the end-to-end
      test assert exactly: 32 entries in the bound file's order; 31 with a fixture, the 19 Verification, the 11 Resume
      Check and RISK-01, by id; exactly ADV-02 without a fixture; each named file's SHA-256 equal to its entry's;
      scenario_set_version 2, the bound file's hash and fixture_set_version 3. The altered-set cases keep every case and
      each still gives an error (the fixture set version case uses a value other than 3; a fixture for ADV-02, outside
      the three capabilities, still errs), and a new case gives an error for the Risk Engine fixture at the
      Verification or the Resume Check folder's path and for a Verification fixture at the Risk Engine folder's path.
      The property module's one-byte-change test covers the Risk Engine fixture file too.
  - AC3: >-
      The fixture checks keep to their kind. The Verification fixture checks (check_fixture, the fixture tests and the
      faithfulness tests of tests/unit/test_conformance_files.py, and the tree loads of
      tests/property/test_conformance_properties.py) run over exactly the 19 Verification fixtures, as they did at the
      base, with every assertion and every altered-fixture case kept; they do not apply the Verification form to the
      Risk Engine fixture, which TASK-018's modules (test_conformance_risk_files.py, test_conformance_risk_set.py,
      test_conformance_risk_properties.py) check in its own form. The end-to-end test checks RISK-01's entry by its path
      (module_path for its id and capability) and its SHA-256 only. The existing test that the Verification fixtures
      run over are exactly the 19 Verification entries still holds.
  - AC4: >-
      The Resume Check set test (tests/integration/test_conformance_rc_set.py).
      test_the_set_file_is_unchanged_and_frozen becomes a test that the set file is bound by exactly one freeze
      approval of TASK-020 (docs/records/TASK-020.jsonl, an authority record with approval_binding {kind:
      change_request, hash} equal to the set file's SHA-256, its record_id TASK-020-freeze-set), that TASK-014's freeze
      record of the replaced set file (f1c01c75…) still exists unchanged, and that TASK-002's freeze record of the
      earlier set file still exists unchanged; every other test of the module is kept, with its assertions.
  - AC5: >-
      The folder check (tests/integration/test_conformance_risk_set.py). Its list of the modules allowed to name the
      Risk Engine fixture folder adds, each by name, exactly those of tests/unit/test_conformance_files.py,
      tests/property/test_conformance_properties.py and tests/integration/test_conformance_set.py that name it for AC2;
      test_a_module_that_is_not_allowed_is_named still catches each of its unnamed paths, and
      test_the_allowed_modules_are_all_allowed names the added modules; every other test of the module is kept, with its
      assertions.
  - AC6: >-
      Nothing else changes, and the runner tests run over the tree. Every other test that tests/run_tests.py runs passes
      unchanged at the task's commit, with the freeze record of docs/records/TASK-020.jsonl in the tree; in particular
      the present-state branches of TASK-019's tree-run tests now run over the tree and pass with their exact values
      (TASK-019 AC5: RISK-01 (PASS, '') with the root's governor in test_runner_risk_run.py's test_the_tree_as_it_is,
      test_runner_rc_run.py's R7 test and test_governor_conformance.py's test, and the record's outcome pass;
      'the entry point is absent' where TASK-019 AC5 names it), and TASK-013's and TASK-019's fixed-value pin
      (158323324f…) still holds.
  - AC7: >-
      The four, and nothing else. At the base, with only the set file of AC1 put in place in a scratch clone on a
      compiled tree, the failing tests are exactly the four class (c) ids of decision D-481 (test_conformance_files
      SetFileTest.test_the_set_file; test_conformance_rc_set RcSetTest.test_the_set_file_is_unchanged_and_frozen;
      test_conformance_set ConformanceSetEndToEndTest.test_the_set_binds_the_bound_file and test_the_whole_set); at the
      task's commit the whole suite passes over the tree on a compiled tree; both runs and the id comparison are in the
      request that brings the first push.
  - AC8: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The modules import only what they import at the base and
      the standard library; they use no exec, eval, compile, __import__ or importlib, start no process, open no
      network connection, call no model and write no file; they name no project-state directory; no fixture or set
      module is imported or executed (files are read as bytes). The CI steps at the task's commits report no finding:
      deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit, as TASK-005's contract lists them. Before each commit,
      the added text and the file names are scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns and the
      records executors' pre-push pattern (D-282), and each count is 0.
  - AC9: >-
      Does not loosen (GOV-003), and the limits. A script over the base and the task's commit shows, for the five
      modules: no test removed or skipped; every assertion line of the base either byte-equal in the changed module or
      listed with its replacement, each replacement comparing with one exact value (no assertion that a value may be
      either of two results); every altered-set and altered-fixture case of the base kept; the count of assertion
      calls in each module does not fall; and, over the tree at the task's commit, check_set returns [] in each module
      that holds it (no vacuous error case). Limits: as the header states.
  - AC10: >-
      Tests, with this rule-to-test list: R1 AC1 (the pin of the set file's SHA-256, by script at each commit and at
      acceptance, and by the end-to-end test through the freeze record); R2 AC2 (the set tests, the [] over the tree in
      each of the three modules, the altered-set cases including the new wrong-folder case, and the one-byte-change
      property over the three folders); R3 AC3 (the 19 Verification fixtures, exactly, by id); R4 AC4 (the freeze
      test); R5 AC5 (the folder tests); R6 AC6 and AC7 (both suite runs). tests/run_tests.py, unchanged, runs them.
