# TASK-083: get_work_order and query in the MCP server (specification 6 revision 7, sections 3, 4, 5 and 8;
# specification 7 revision 2, section 6; M7's third task). Plan: decisions D-2402 to D-2406 (session 3797498a): the
# scope note (MYSP/t83/scope83.md, D-2403), the nine rulings of D-2403, the pin scan (MYSP/t83/pinscan83-out.txt at
# 35e4a00c and its reading MYSP/t83/pinscan83-reading.md, D-2405), the risk run (MYSP/t83/risk/risk_class83.py,
# D-2405), the rulings (a) and (b) of D-2405 and its conditions C1 and C2, the forbidden list (MYSP/t83/forbid83.txt,
# D-2406, the two write-set files left out); r1: reviews rv83a (claude-sonnet-5-5) and rv83b (claude-opus-5-5) of r0,
# read tools only, and their dispositions (MYSP/t83/disp83.md, D-2409), DEF-0098's draft (MYSP/t83/def0098.md).
#
# Scope:
# - In src/aieos_bootstrap/mcp_server.py, two new tools of specification 6 section 4 (:37-38), get_work_order and
#   query, listed by tools/list after the five existing ones (seven tools, specification 6 :33), and answered by
#   tools/call; each is a function of the module, get_work_order(arguments, environ, now, read=None) and
#   query(arguments, environ, now, read=None) (D-2409 row 2), returning (an object, None), (None, an error word) as
#   status and claim do (mcp_server.py :174-183, :277-325), or, for a core_error with findings, (None, {"error":
#   "core_error", "detail": [the findings]}) (D-2409 row 1); read is passed through to base_inputs (None for
#   gitread.run).
# - The listing (D-2414 row 1): TOOL_NAMES (mcp_server.py :104) gains get_work_order and query; tools/list (:370)
#   answers STATUS_TOOL, CLAIM_TOOLS and a new list WORK_ORDER_TOOLS holding the two tools' definitions, in that order.
# - handle's change (D-2409 row 1, C1), every changed line of mcp_server.py :371-381: the tools/call branch dispatches
#   get_work_order and query, each given params.get('arguments'), the environ and clock(); an error that is a dict is
#   answered as is, _tool_result(the dict, True); an error that is a word is answered as now, _tool_result({"error":
#   word}, True). status's and claim's paths through handle are unchanged, their answers byte-identical (AC1 checks
#   them in the form of tests/unit/test_mcp_server.py :244-253).
# - One task (D-2403 ruling 1; proposed): both tools are thin layers over base_inputs.work_order_inputs (TASK-082) and
#   context_compiler.build_work_order (TASK-080); no new reader of any input.
# - The order of each call: the identity (AIEOS_SESSION_ID and AIEOS_ROOT, by _identity, mcp_server.py :116-124); the
#   base; the input's shape; the lease (_live_lease over writer.session_leases, mcp_server.py :186-205), its task the
#   task; the log (writer.read_log(root), bytes, else core_error); base_inputs.work_order_inputs(root, base, task,
#   session id, log, read); context_compiler.build_work_order(inputs). An error found at a step makes no later call.
# - What it does not do: no change to status or the four claim tools (their code and answers unchanged); no write, no
#   append and no event (specification 6 :37-38: both write nothing); nothing stored (specification 6 :55); no new
#   reader; no connection to a runtime (the owner's act).
#
# The rulings (D-2403), each this task's choice (proposed; specification 6 section 11 stays open for its next
# revision):
# - The base (ruling 2): AIEOS_BASE, read by environ.get in one new function, _base(environ), used only by
#   get_work_order and query (D-2405 C1); it must be exactly 40 lowercase hexadecimal characters, as specification 7
#   :45 and specification 5 :112 say the launcher passes it and as the hook reads it
#   (src/aieos_bootstrap/claude_code_pretool_hook.py :26, :132, :315); absent or out of form (64 characters, upper
#   case, any other value among them) gives no_session, the base being part of the session's identity as
#   AIEOS_SESSION_ID and AIEOS_ROOT are. status, _status_of, _identity and the claim tools' functions read no
#   AIEOS_BASE. DEF-0093 stays open for its G-8 limit (the core cannot show the base is main's tip).
# - Compiled at each call (ruling 3): each call builds the Work Order from the base and the log as they are at that
#   call; nothing is cached across calls and nothing is stored (specification 6 :55). Specification 6 :54's "the same
#   object for the whole session" holds while the log's last task.approved and last decision.execution of the task
#   stay the same (a stated limit); a change of either, a new grant among them, can give another object.
# - The error words (ruling 4; specification 6 :74): the identity or the base missing or out of form, no_session; the
#   input out of form, invalid_input; the lease words as _live_lease gives them (no_lease, lease_expired, no_session,
#   core_error), unchanged; findings of work_order_inputs or of build_work_order, or a log read that is not bytes,
#   core_error, the findings carried in the answer (the text {"error": "core_error", "detail": [the findings]}, a
#   proposed answer form beside the existing {"error": <word>}, for these two tools only; a log read that is not
#   bytes gives {"error": "core_error"} with no detail); for query, a ref outside the Work Order out_of_scope,
#   and a ref the Work Order names whose full item cannot be produced not_found; any exception core_error.
# - query's scope (ruling 5): only the refs the Work Order holds, as items in full or as {ref, hash} references
#   (context_compiler.py :27-33); any other ref, an article not applicable, a path not matched or a made-up text among
#   them, gives out_of_scope. This fails closed and does not yet serve specification 6 :38's wider "an intent entity,
#   constitution article or component that the contract's traces reach", for which no rule is written (specification
#   6 :62 names the graph's edges and gives no rule for "reach"); a departure listed for specification 6's next
#   revision.
# - query's answer (ruling 6): the item in its own form, {ref, hash, content}, the content in full.
# - How query finds the ref (ruling 7): by the same path as get_work_order, so one rule decides what is in scope; a
#   ref the Work Order gives in full is answered with that item; a ref given as a reference is answered from a second
#   build_work_order of the same inputs with every budget set to UNBUDGETED, a module constant 1 << 62 (D-2409 row 5;
#   build_work_order's budgets take any int above 0, context_compiler.py :176, :283), whose item of that ref must carry
#   the Work Order's reference hash, else not_found (a fail-closed guard, not expected to be reached; D-2409 C2). A ref
#   in more than one layer (D-2409 row 6; context_compiler.py :350 refuses a repeat only within one layer): every item
#   of it in the Work Order must carry the same hash, else not_found; the answer is its first item held in full by
#   layer order, or else the unbudgeted build's first item of it by layer order. Findings of the unbudgeted build
#   give core_error with detail, as ruling 4 says (D-2414 row 10).
# - AIEOS_BASE against the lease or the record (ruling 8): not compared; the base and the Resume Check's HEAD may
#   differ (specification 6 :54), a stated limit; DEF-0093 keeps the gap.
# - Seven tools (ruling 9): the module docstring, tools/list and TOOL_NAMES change; the docstring keeps the phrase
#   "tasks TASK-078 and TASK-079" (tests/unit/test_mcp_server.py :723) and names TASK-083.
# - The tools' input schemas: get_work_order {type object, properties {}}, as status; query {type object, properties
#   {ref: {type string}}, required [ref]}. get_work_order's arguments are absent, null or {}; anything else gives
#   invalid_input. query's arguments are exactly {ref: a non-empty str UTF-8 can encode}, else invalid_input.
# - Two stricter choices, stated (D-2414 row 5): get_work_order refuses arguments other than absent, null or {}, while
#   specification 6 :37 gives it no input and status takes none; the base is exactly 40 characters, while
#   base_inputs.work_order_inputs takes a commit of 40 or 64 (base_inputs.py :598).
#
# The changes to the existing test file (D-2403 ruling 9; D-2405 (a), (b), C2), each line listed with its reason; no
# other line of tests/unit/test_mcp_server.py changes, and every changed test keeps its "TASK-078 ACn" or "TASK-079 ACn"
# naming (:315-331 refuse any other task's AC in that file), so every TASK-083 AC is tested in the new files only:
# - :86, the list ['status', 'acknowledge', 'ask', 'report', 'handoff'] becomes the seven names in order, with
#   get_work_order and query last; :87 stays (status's schema). Reason: tools/list lists seven tools.
# - :99, {'name': 'get_work_order'} becomes {'name': 'list_tasks'}, a name still unlisted (listing tasks is a core
#   function, not an MCP tool, specification 6 :14); the other cases stay. Reason: get_work_order is listed now; the
#   case keeps testing an unlisted name.
# - :197-199, the check that 'AIEOS_BASE' is no str constant of the whole module becomes an AST check that no
#   ast.Constant equal to 'AIEOS_BASE' lies outside the function _base (D-2409 row 9; the module docstring contains
#   the word but is not equal to it); :193-196 stay (status with an out-of-form AIEOS_BASE answers as before and
#   passes the identity to session_leases). Reason: the new tools read AIEOS_BASE in _base only; status still needs
#   and reads none (D-2405 (a)).
# - :82-83, the docstring "tools/list answers status, acknowledge, ask, report and handoff" becomes "tools/list
#   answers the seven tools, status first", its TASK-078 AC3 and TASK-079 AC1 names kept (D-2407 C3; D-2409 row 10).
#   Reason: it is no longer true.
# - :261-262, the docstring "the module imports only datetime, hashlib, json, os, re, sys and aieos_bootstrap.writer"
#   gains "base_inputs and context_compiler", its TASK-078 AC6 and TASK-079 AC8 names kept (D-2409 row 10). Reason:
#   it is no longer true.
# - :270-271, the exact import set gains ('aieos_bootstrap', 'base_inputs') and ('aieos_bootstrap',
#   'context_compiler'). Reason: the two tools call them.
# - :304, the phrases 'lists five tools' and 'AIEOS_BASE is not read in this slice' become 'lists seven tools' and
#   'AIEOS_BASE is read only by _base'. Reason: the docstring states the new scope.
# - Kept and binding: :286 (the writer attributes used are exactly session_leases, append_event, read_log, StoreResult
#   and WriteResult: the two tools use only session_leases and read_log); :436-447 (('get_work_order', {}) given to
#   claim(), which answers invalid_input for a name it does not know); :718-731 (the TASK-079 phrases, "tasks TASK-078
#   and TASK-079" among them).
#
# Departures for specification 6's next revision (D-2409 row 7), carried by DEF-0098 (MYSP/t83/def0098.md), written
# to docs/Deferred at TASK-083's records commit as a second path, as DEF-0097 was at TASK-082's:
