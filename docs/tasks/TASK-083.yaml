#   reference";
# - (b) query answers only the refs the Work Order holds, narrower than :38's "the contract's traces reach" (no rule
#   for "reach" is written: :62 names the graph's edges only);
# - (c) the "detail" answer form of a core_error with findings, beside :74's vocabulary and the {"error": <word>} form;
# - (d) AIEOS_BASE missing or out of form gives no_session, which :39 and :74 do not name for the base (the server takes
#   the base from the environment with the session id and the root, :27; specification 7 :45);
# - (e) compiled at each call, so :54's "the same object for the whole session" (repeated by specification 7 :55)
#   holds only while the task's last
#   approval and last record stay; a new grant, or a later lease on another task in the same session
#   (tests/unit/test_writer.py :2235-2246), gives another object.
# - A stale line left by this task: src/aieos_bootstrap/context_compiler.py :38 ("No reader of the inputs and no MCP
#   tool are here … Nothing calls build_work_order but its tests"), in a forbidden file, carried in DEF-0098 for a
#   later task (D-2409, option (2) lost).
#
# Owner-act boundary: none reached. Nothing is launched or connected; no hook, setting, policy or measurement
# (specification 6 :88; specification 7 :50; DM A51 item (4)). Nothing runs the server but its tests.
#
