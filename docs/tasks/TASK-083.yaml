constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      tools/list lists exactly seven tools in the order status, acknowledge, ask, report, handoff, get_work_order,
      query, get_work_order's input schema {type object, properties {}} and query's {type object, properties {ref
      {type string}}, required [ref]}; tools/call with each of the two names runs its tool and answers in the
      existing result form, a dict error answered as is and a word error as {"error": <word>}; an unlisted name still
      answers -32602; status's and ask's answers through handle equal fixed expected texts written in the test (a
      status success and a no_session error, an ask success and an invalid_input error), in the form of
      tests/unit/test_mcp_server.py :244-253 (a result with isError and one text item). Tests in
      tests/unit/test_mcp_server_work_order.py.
  - AC2: >-
      The identity and the base: AIEOS_SESSION_ID or AIEOS_ROOT missing or out of form, and AIEOS_BASE missing, of 64
      characters, in upper case, of 39 or 41 characters, or not a str, each give no_session with zero writer and zero
      read calls (stand-ins count them); with the identity missing or out of form, an environ stand-in that records
      its key reads shows AIEOS_BASE never read (the identity before the base); by ast over pathlib's read_bytes, no
      ast.Constant equal to "AIEOS_BASE" lies outside the function _base, and get_work_order and query are the only
      functions that call _base.
  - AC3: >-
      The input's shape: get_work_order with arguments absent, null or {} goes on, and with any other value (a key, a
      list, a str) gives invalid_input; query with exactly {ref, a non-empty str} goes on, and with ref missing, empty,
      not a str or not encodable as UTF-8, or another key, gives invalid_input; each refusal before any writer or read
      call.
  - AC4: >-
      The lease: a session never seen, ended or with no row gives no_lease; rows none unexpired give lease_expired;
      two unexpired rows give core_error; root and no_store give no_session; the task given to work_order_inputs is the
      live lease's task_id, never a value of the input (a query ref "TASK-1" under a lease of TASK-100 calls
      work_order_inputs with TASK-100); no log read and no read call before a live lease.
  - AC5: >-
      The Work Order: work_order_inputs is called once with (root, base, the lease's task, the session id, the bytes
      read_log returned, the read given), and get_work_order answers build_work_order's value unchanged; findings of
      work_order_inputs or of build_work_order give the error value {"error": "core_error", "detail": [the findings]},
      answered by handle as that text; a read_log answer that is not bytes gives core_error with no detail and no
      work_order_inputs call; two calls over the same stand-ins give equal objects, and a call after a changed log
      gives the object of the new log (compiled at each call; no cache across calls).
  - AC6: >-
      query: a ref of an item the Work Order holds in full answers that item {ref, hash, content}; a ref the Work Order
      holds as a reference answers {ref, hash, content} with the same hash and the content of the unbudgeted build;
      a ref the Work Order does not hold (an article not applicable, a path not matched, an AC id not in the contract,
      a made-up text) gives out_of_scope; a ref held as a reference whose unbudgeted item is missing or has another
      hash (a stand-in build_work_order) gives not_found; a ref in two layers answers its first full item by
      layer order when every item of it carries the same hash, and not_found when they differ; findings of the
      unbudgeted build (a stand-in) give core_error with detail; a seeded loop of 500 random refs, built from the Work
      Order's own refs changed by one character and from random texts, gives only items of the Work Order or
      out_of_scope, and never raises.
  - AC7: >-
      Writes nothing: by ast, every function mcp_server.py gains in this task (get_work_order, query, _base and any
      helper they call) uses of writer at most session_leases and read_log, and none calls append_event; a call
      through stand-in writers holding only session_leases, read_log and StoreResult answers; no event, no file and
      no store change after any call (the stand-ins record every call).
  - AC8: >-
      Purity and touch: mcp_server.py imports exactly datetime, hashlib, json, os, re, sys and aieos_bootstrap's
      writer, base_inputs and context_compiler; no ast.Name open, exec, eval, compile, __import__, input, sqlite3 or
      subprocess; no .open, .makedirs, .remove, .unlink, .write_text, .write_bytes or .connect; no ".aieos" string;
      never raises (stand-ins of work_order_inputs, build_work_order, read_log and session_leases that raise, a
      RecursionError among them, give core_error); no except clause whose body is only pass or continue (bandit B110,
      B112). Tests by ast over pathlib's read_bytes.
  - AC9: >-
      This repository: with a store under a temporary root built by writer's own functions (as
      tests/unit/test_writer.py :2098-2259 builds stores for mcp_server), a log holding one task.approved of TASK-081
      with the SHA-256 of docs/tasks/TASK-081.yaml at 4c496d7e406523e495498dd377f3a40587a14ac9 and one
      decision.execution CONTINUE after it, in TASK-082's AC9 payload form, each appended by writer.append_event with
      no fencing token before the lease is granted (eventlog.py :112-114 asks a lease only of a token or a
      task.submitted), then a live lease of TASK-081 for session "s1", and read given as a wrapper that runs
      gitread.run at this repository's root (the store's root is a temporary folder, not a repository; D-2409 row 4):
      one get_work_order call with AIEOS_BASE 4c496d7e… answers a Work Order of TASK-081 whose base is that commit
      and whose work_order_hash is the SHA-256 of its canonical form without that key, and one query call of
      docs/specs/spec-07-cli-and-zero-friction-path.md answers its item with the SHA-256 613cbd72… of the file's
      text; the two calls together within the runner's 110 seconds, measured before the code commit; the
      integration group may run as its own part, or split into parts of the allowed scratchpad script, each part
      within 110 seconds (D-2414 row 11). Tests in
      tests/integration/test_mcp_server_work_order_repo.py.
  - AC10: >-
      Every existing test passes, the pins of the header among them; tests/unit/test_mcp_server.py changes exactly at
      the lines the header lists, each for its stated reason, and no other test of it is weakened; the full suite runs
      locally in three unit parts, integration and property before the first code commit; the deterministic rule's
      local run gives no finding. The module docstring holds, whitespace read as single spaces, the phrases "tasks
      TASK-078 and TASK-079", "task TASK-083", "lists seven tools", "AIEOS_BASE is read only by _base", "compiled at
      each call", "only the refs the Work Order holds" and "writes nothing", read by a test by ast; every new test
      names "TASK-083 ACn".
  - AC11: >-
      Broken copies, each failing the tests of its AC: (1) accepts a 64-character base (AC2); (2) reads AIEOS_BASE in
      status (AC2's checks: no constant equal to "AIEOS_BASE" outside _base, and only get_work_order and query
      calling _base; the narrowed test of test_mcp_server.py too, for a copy using the literal); (3) takes the task
      from query's ref (AC4's "TASK-1" case); (4) skips the lease check (AC4); (5) answers findings as a success
      (AC5); (6) answers a ref outside the Work Order (AC6); (7)
      answers a reference without its content, or with another hash (AC6); (8) appends an event (AC7); (9) accepts an
      extra key in query's arguments (AC3); (10) leaves query out of tools/list (AC1); (11) keeps the Work Order
      across calls (AC5); (12) uses read_log's answer unchecked (AC5); (13) reads the base before the identity (AC2);
      the governor's evaluate at acceptance (the shadow) with any difference named; the stated choices in the records
      (not tests).
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 800k, wall_time: 4h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8, AC9, AC10]}
  - {gate: G3, check: constitution, args: [AC11, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
