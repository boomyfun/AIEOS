acceptance_criteria:
  - AC1: >-
      Unchanged where the task does not reach (TASK-003's AC1 to AC9, AC11). The run's inputs, the reader and listing,
      the wrapped-file and canonical-form rules, the set file's form, its freeze approval, the governor entry point,
      the acceptance comparison, the run record's existing keys and its record, and the command-line entry stay as
      TASK-003's contract says, apart from the changes AC2 to AC7 name. Every result of a Verification scenario is
      the same as before this task for the same tree, governor and stand-in.
  - AC2: >-
      The capability the bound scenario file gives an id (conformance-files.md section 9, "Where the files are")
      (reading). It is read from the bound scenario file at the root, from the same lines whose hashes the run already
      takes: for a row of a table whose header line names a column Capability, that row's cell in that column; for any
      other row, the heading of the numbered section (a line beginning "## " and a number) that holds the row, its text
      after the number up to the first colon or the line end. An id whose row holds no such capability, or a
      capability that is not one of section 3's four, gives no capability.
  - AC3: >-
      The entry and the expected path by capability (section 9; D-262, D-263). For each set entry with a fixture: when
      the entry's capability differs from the capability AC2 gives its id, or AC2 gives none, the scenario is NOT_RUN;
      Verification expects the path tests/conformance/fixtures/<module name>.py (unchanged), Resume Check expects
      tests/conformance/fixtures_rc/<module name>.py, the module name formed as section 2 says; any other capability
      is NOT_RUN, the entry point being absent until its milestone. A path other than the one expected is NOT_RUN. All
      these are decided before the fixture file is read, after the row-hash check of TASK-003's AC5, so that only a
      path built from an id of the bound file is read.
  - AC4: >-
      The Resume Check entry point (section 9, "The entry and the comparison"). The entry is the function check of the
      module aieos_bootstrap.resume_check, loaded by a plain import statement (no importlib) only when at least one
      Resume Check entry of the set file has a fixture (reading), with the rules of TASK-003's AC6 applied to it: absent
      when the import raises ModuleNotFoundError naming that module (each Resume Check scenario NOT_RUN for "the entry
      point is absent", and the run can still count); any other failure to load it, a module whose file is not the
      root's src/aieos_bootstrap/resume_check.py, or no callable check, makes every Resume Check scenario NOT_RUN and
      the run not count (reading). The run function also takes a check function as a test seam (reading): a run with a
      stand-in never counts; the command-line entry never takes one.
  - AC5: >-
      A Resume Check fixture's form (section 9). After the conditions of TASK-003's AC5 that read the set entry, the
      row and the file's bytes and hash, and the wrapped-file and canonical-form rules, a Resume Check fixture is
      malformed, and its scenario NOT_RUN with none of its cases run, unless: its object is exactly scenario, row_hash
      and cases, those two equal to the set entry; cases is a non-empty list; each case is exactly inputs, when and
      expected; when is resume; inputs is an object with exactly the keys section 9 names (task_id, log_seq,
      task_state, contract, contract_hash, approved_contract_hash, head_commit, base_is_ancestor, commits, components,
      interfaces, symbols, schemas, derived_read_set, observed_read_set, intent_current, dependencies, articles,
      runtime, risk_rules, policy_version, budget_use), task_id a task id, task_state one of READY, REWORK and
      IN_PROGRESS, contract an object, contract_hash and approved_contract_hash 64 lowercase hex, head_commit a full
      lowercase hex commit id and base_is_ancestor true or false (reading: the runner checks these forms only; the
      others are the Resume Check's to read, specification 3 section 7's error); and expected is exactly decision and
      not_fixed, decision a list of exactly one of the eight A15 values and not_fixed the empty list.
  - AC6: >-
      The call and the comparison (section 9). For each case, check is called with a copy of the case's inputs. A call
      that raises, or returns a value that is not a dict, or that gives a finding under check_decision for
      decision.execution, or that carries error (its decision then null), makes the scenario NOT_RUN unless another
      case fails. A case passes only if the observed decision is in expected.decision; the comparison is on that value
      only, never on wording. A scenario with a failed case is FAIL, before any NOT_RUN condition of AC5 or this point;
      otherwise NOT_RUN as AC3, AC4, AC5 and this point say; otherwise PASS.
  - AC7: >-
      The run record (sections 6 and 9). When at least one Resume Check entry of the set file has a fixture, the run
      record gains one key, resume_check: {path, sha256} of src/aieos_bootstrap/resume_check.py at the root, sha256
      null when the file is absent or a stand-in check is used (reading); otherwise the run record has exactly
      TASK-003's keys, so that a run over a set with no Resume Check fixture gives the same bytes as before this task.
      The record of specification 2 §6.2 keeps TASK-003's keys and rules: outcome pass exactly when the run counts, at
      least one scenario has a fixture and every scenario with a fixture is PASS, a Resume Check scenario included.
  - AC8: >-
      Unchanged results over the repository's own tree. At base_commit's tree the set file names no Resume Check
      fixture (RC-01 to RC-11 null), so a run there, with no stand-in and the root's governor, gives what TASK-003's
      runner gives at base_commit (CI run 61's notice: outcome pass, counts true, 19 PASS, 13 NOT_RUN): the run
      record has exactly TASK-003's keys and no resume_check key, counts true, ACC-01 to ACC-17, ADV-01 and ADV-03
      PASS, the 13 others NOT_RUN (RC-01 to RC-11 for "no fixture"), and the record's outcome pass. The Resume Check
      module is not loaded in that run (AC4).
  - AC9: >-
      Purity and the CI checks (INV-001, INV-002, INV-004). The module and its tests import only the Python 3 standard
      library, aieos_bootstrap.records, the tests also aieos_bootstrap.conformance, and, in the module only,
      aieos_bootstrap.governor and aieos_bootstrap.resume_check by the guarded imports of TASK-003's AC6 and AC4 here;
      they use no exec, eval, compile, __import__ or importlib, start no process, open no network connection, call no
      model, and write no file; they read files only with pathlib's read_bytes and list them only with pathlib's glob;
      the tests build malformed inputs in memory and pass them through the byte reader and listing, never through
      files, and read the frozen fixtures under tests/conformance/fixtures_rc/ only as bytes. The CI steps at the
      task's commits report no finding: deterministic_rule, OPS-003, SEC-001, SEC-002 and bandit, as TASK-003's AC10
      lists them.
  - AC10: >-
      The existing test modules unchanged and passing. test_runner.py, test_runner_run.py, test_runner_properties.py
      and test_governor_conformance.py are not changed (forbidden) and pass at the task's commits. If one of them can
      pass only by a change, the task escalates (needs_out_of_scope_change) instead of changing it.
  - AC11: >-
      The added text. Before each commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003
      patterns, and each count is 0; the file names are scanned with the same patterns and the records executors'
      pre-push pattern (D-282).
  - AC12: >-
      Limits, stated and tested as such: no Resume Check exists and the set file names no Resume Check fixture, so a run
      over the repository's tree gives every RC scenario NOT_RUN and its run record is unchanged (AC8); the runner
      checks its inputs and compares values, and never decides an execution or an acceptance; it does not check how a
      Resume Check derives the inputs of specification 3 §1, which the fixtures give as values; the runner and the
      Resume Check are taken from the base only when the CI channel runs the runner from a base checkout, and this
      runner first runs in the CI's base run after it lands on main; running the RC scenarios in the CI channel needs
      the set file's RC entries (TASK-005b) and the workflow's revision 5 (O1, the owner's); the capability reading of
      AC2 depends on the bound scenario file's table and heading layout, and a later revision of that file that
      changes the layout makes its scenarios NOT_RUN, never PASS.
  - AC13: >-
      Tests, with this rule-to-test list, each rule with at least one passing case and one failing case, the failing
      cases built in memory: R1 the capability reading of AC2 (a Capability column, a section heading, a heading with a
      colon, no capability, an unknown one); R2 each condition of AC3 (a capability that differs from the bound file's,
      a Verification fixture under fixtures_rc/, a Resume Check fixture under fixtures/, an unrouted capability); R3 the
      entry-point conditions of AC4 (absent, a failing import, a module from elsewhere, no callable, a stand-in that
      never counts, no load when no Resume Check entry has a fixture); R4 each malformed condition of AC5, one failing
      case per rule; R5 each call and comparison rule of AC6 (a decision in the list, one outside it, a raise, a
      non-dict, a check_decision finding, an error record, FAIL before NOT_RUN); R6 the run record's resume_check key
      present and absent, and the outcome with a Resume Check scenario PASS and NOT_RUN (AC7); R7 AC8 over the
      repository's own tree. Unit tests in tests/unit/test_runner_rc.py; integration tests in
      tests/integration/test_runner_rc_run.py run over the repository's own tree end to end: AC8 with no stand-in;
      with an in-memory set file that names the 11 frozen fixtures under fixtures_rc/ and a stand-in check that answers
      each case from its own expected value, RC-01 to RC-11 PASS and the run does not count; with a stand-in that
      answers one decision outside a list, that scenario FAIL. Property tests (tests/property/test_runner_rc_properties.py;
      standard library only, fixed seeds): the same inputs always give the same run record; any one-byte change of a
      Resume Check fixture never gives that scenario PASS; any capability other than the bound file's never gives
      PASS; and these properties of the invariants the task relates to: for INV-005, every Resume Check result is PASS,
      FAIL or NOT_RUN and a returned string is never an execution decision record; for INV-006, with no Resume Check no
      RC scenario is PASS; for INV-007, a Resume Check fixture whose bytes differ from its set entry's hash is never
      run; for INV-008, a stand-in check never makes a run count. tests/run_tests.py, unchanged, runs all three groups.
