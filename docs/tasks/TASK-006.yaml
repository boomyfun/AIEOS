# Task contract TASK-006, the conformance runner's Resume Check entry (Master Plan revision 3, §4 M3; the M3 work order
# of decision D-254, as amended by decisions D-262 and D-263; specification 2 §5.1). Revision 0, drafted under decision
# D-284 (C5), brought for approval in D-285; whether it is approved is recorded in the decision files, not in this
# file. Fields and value forms follow specification 2 §5.1 and TASK-003's contract, whose runner this task changes.
# Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. Constitution GOV-002 applies: tests/conformance/** (the fixtures, the Resume Check
# fixtures and the set file, scenario files in the sense of conformance-files.md section 8) is in the forbidden set, so
# the task can read them but never change them.
# What it changes (conformance-files.md revision 4, section 9): the runner chooses each scenario's entry by the
# capability of its set entry, which must equal the capability the bound scenario file gives that id; it expects a
# Verification fixture under tests/conformance/fixtures/ (unchanged) and a Resume Check fixture under
# tests/conformance/fixtures_rc/ (D-262, D-263: the path check made capability-aware); it checks a Resume Check fixture's
# form, calls the Resume Check entry (the function check of the module aieos_bootstrap.resume_check, from the base) per
# case, and compares the observed execution decision; any other capability is NOT_RUN. No Resume Check exists, and the
# set file names no Resume Check fixture (its entries RC-01 to RC-11 are null until TASK-005b, after TASK-008), so over
# the repository's own tree every run record is unchanged by this task: the same keys, counts, outcome and results.
# Readers of the changed path (D-263 C3's practice): src/aieos_bootstrap/conformance.py is read by the CI workflow's
# conformance base run (from the base; a push that changes it must name exactly one task, revision 4, F5 (b)) and
# candidate run (from the base too; only GOVERNOR_FILES come from the head), and imported by the test modules
# test_runner.py, test_runner_run.py, test_runner_properties.py and test_governor_conformance.py, which this task does
# not change (forbidden): their assertions must keep passing (AC10). The run record gains its resume_check key only
# when a Resume Check scenario has a fixture (AC7), so the workflow's check of the run record (valid(), revision 4)
# reads the same keys as now.
# Risk: high. R2 matches src/** and tests/** (medium); R3 read fail closed matches them too, the runner falling under
# its tag verification (risk rules section 2 point 3); no path of the write set meets R11 (tests/conformance/**); the
# highest wins. Profile (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture
# [deterministic_rule], functional [integration_test], security [static_security_analysis] and architecture [ai_review
# (cross-model)], plus the evidence_required of the applicable articles. Dimensions are named as TASK-003's records name
# them (decision D-181, reading R-dim).
# Change class: critical_cr (D-254 P4, as TASK-003): an evaluator part that enforces acceptance and is not bound (DM
# B1; A29: the evaluator includes the runner), so it is judged by the base version and never auto-accepted (constitution
# GOV-003; governor-spec.md §8); stricter than required, since the bound identity is governor.py's hash alone (charter
# version 3), and lowering nothing.
# Reviews (as TASK-003's, D-181 P2, P3): five way-2 reviews by a Claude model other than the implementer's, each under a
# decision of the decision agent (architecture ai_review for INV-001, INV-002, INV-004; security ai_review for SEC-002;
# governance ai_review for GOV-003; operational ai_review for OPS-003; the cross-model half), and three
# decision-agent reviews (architecture human_review for INV-003, which also checks that the property tests cover the
# related invariants; operational human_review for OPS-002; the cross-model half). Each way-2 review record's basis
# names every article whose entry it covers and addresses each of their rules, beyond what the tool parts decide. Each
# reviewer's prompt is self-sufficient, with the scratchpad's absolute path in its first line (D-277).
# Evaluation path (A61; as TASK-003's and TASK-005's, D-181 P1, D-182 and D-273): the approved contract is committed on
# main as its own commit C, which changes only docs/tasks/TASK-006.yaml and has one parent equal to base_commit, and is
# pushed normally; the files are drafted and tested in scratchpad clones (push URL disabled, the no-reply identity set
# first); the task's commits, each carrying the trailer "AIEOS-Task: TASK-006" and no e-mail address in its message,
# go to the branch task/TASK-006 on GitHub, each push under its own decision of the decision agent after a secret scan
# and a dry run against a bare single-branch copy (D-229, D-274), never by force and never deleting; the CI channel
# runs on each push and its records are re-fetched into docs/records/TASK-006.jsonl; main receives the task only at
# its acceptance, by a fast-forward under its own decision. Before each task commit, the added text is scanned with
# the workflow's SEC-001, SEC-002 and OPS-003 patterns (AC11).
# Not applicable: OPS-001 (scope: the repository's refs; the task changes no ref); INV-009, INV-011, GOV-001, GOV-004,
# GOV-005, GOV-006 and SEC-003 (their scopes, the event log, the policy, the concept file, the bound artifacts, the
# decision matrix, the records and pre-genesis documents, and .github/, meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/, no
# Claude Code setting, no push of its own (CR-002 part 4 limit 5 does not apply). O1, the CI workflow revision 5 that
# runs the Resume Check scenarios through the pinned runner with this entry, stays the owner's (A61; SEC-003), asked
# once after this task is accepted (D-254).
# Uncovered and stated limits (AC12): no Resume Check exists and the set file names no Resume Check fixture, so every
# RC scenario stays NOT_RUN in every run over the repository's tree, and nothing here shows that any Resume Check meets
# a fixture; in the CI channel the base run takes the runner from the base, so this runner first runs there after it
# lands on main; the runner checks a Resume Check fixture's form only as far as AC5 says, and the fixtures give the
# inputs of specification 3 §1 as values (conformance-files.md section 9, "Not covered"); every review is by AI of one
# vendor.
task: TASK-006
contract_version: v1
task_type: implementation
objective: >-
  Add to the conformance runner (src/aieos_bootstrap/conformance.py, TASK-003) the Resume Check entry of
  docs/specs/conformance-files.md revision 4, section 9: the choice of entry and of the expected fixture path by each
  scenario's capability, checked against the bound scenario file; the form check of a Resume Check fixture; the call
  of the Resume Check entry point per case and the comparison of the observed execution decision; and the run
  record's resume_check key, with unit, integration and property tests in new test modules. It adds no Resume Check,
  changes no fixture, set file or existing test module, changes nothing a run over the repository's own tree reports,
  and does not wire the CI channel.
