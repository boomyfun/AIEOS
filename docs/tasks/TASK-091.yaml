# TASK-091: the CLI frame and `aieos tasks`. A new module cli.py, run as `python -m aieos_bootstrap.cli <command>`,
# with main(argv, stdout, environ, clock) that never raises, its own small argument parser, the helper in_runtime and
# its one command, tasks, over execution.list_tasks (specification 7 revision 2, section 3 :26, :32, :34; section 10
# points 10 and 15; M7's remaining part, its first task). Plan: decisions D-3013 to D-3017 (session ea6ea0a3): M7 stays
# open for its own goal, the CLI commands (D-3013); the cut of M7's remaining tasks (MYSP/m7/m7-rest-plan.md, D-3014);
# the scope note (MYSP/t91/scope91.md) with D-3015's rulings (a1), (b1) with (b2), (c1) with --json, (d) to (g) and R1;
# the pin scan (pinscan91-out.txt at 49cd8795) and its reading (pinscan91-reading.md) with D-3017's ruling on
# RUNTIME_VARS; the risk run (MYSP/t91/risk_class91.py at 49cd8795: high) and the forbidden list (MYSP/t91/forbid91.txt
# at 49cd8795; the two write-set files are new and not in it) (D-3017); the reviews rv91a (claude-sonnet-5-5) and
# rv91b (claude-opus-5-5) of r0 and their dispositions (MYSP/t91/disp91.md, D-3019, twenty rows); the round-2
# review rv91c (claude-opus-5-5) of r1 and its dispositions (MYSP/t91/disp91r2.md, D-3021, six rows, and G7 of
# D-3021 C2); the decision agent's read of r2 in place of a third round (D-3022).
#
# Scope:
# - New src/aieos_bootstrap/cli.py (D-3015 (a1)):
#   - main(argv, stdout, environ, clock) -> an int, 0, 1 or 2: argv exactly a list of str, the arguments after the
#     program name; stdout an object with write(str); environ a mapping; clock a callable giving now. It never raises
#     an Exception; KeyboardInterrupt and SystemExit escape, as mcp_server.py :525 and claude_code_pretool_hook.py
#     :105-106 state (D-3019 row 8). The whole output of one call is built first, every line ending with LF, and is
#     written by one stdout.write call; then stdout.flush is called through getattr when present (mcp_server.py
#     :522-524) (row 1). A write or a flush that raises gives exit 1 on every path (a usage error, a success, findings),
#     whatever the code would have been, and nothing more is written (row 3). The lines of tasks' answer are made by
#     a module function _render(answer, as_json) -> str, looked up as a module global at each call; the CLI's own
#     findings (out of form, no finding, a step raised) are made by a separate fixed function _findings(texts,
#     as_json) -> str, never by _render. Any Exception outside the tasks step (in the parser or in _render) gives exit
#     1 and the one finding "cli: a step raised <exception type name>" through _findings: in the text form when the
#     parser raised (--json not yet known), in the chosen form when _render raised (row 4; rv91c F1, F4).
#     The entry line is `if __name__ == '__main__':` followed by
#     `sys.exit(main(sys.argv[1:], sys.stdout, os.environ, _clock))`, mcp_server.py :534-535's form; os.environ is
#     read only there. _clock gives datetime.datetime.now(datetime.timezone.utc) with microseconds 0 (mcp_server.py
#     :530-531).
#   - Its own parser (D-3015 (c)), not argparse: argv[0] is the command, from the dispatch table COMMANDS, whose only
#     entry is "tasks"; the flags are "--root <path>" (required, once, its value a non-empty str not beginning "--")
#     and "--json" (optional, once). An empty argv, an argv that is not exactly a list (a tuple or a list subclass
#     included) or holds a non-str, an unknown command, a missing --root, a flag without its value, an empty --root
#     value, a --root value beginning "--", an unknown flag, a flag given twice and an extra positional argument each
#     give exit 2 and the usage text USAGE on stdout (rv91c F3); USAGE ends with LF and names the command tasks and the
#     flags --root and --json. On a usage error neither clock nor list_tasks is called. Nothing is written to stderr.
#     So "--root R tasks", "--json tasks --root R", "--", "-h" and "--help" are unknown commands; "--root=R" and "-r"
#     are unknown flags; "tasks --root -r" is accepted with the root "-r"; a whitespace-only root is accepted by the
#     parser and refused through list_tasks' readers, a finding (D-3019 row 7).
#   - The command tasks: calls clock() once, then execution.list_tasks(root, now) once, list_tasks looked up as
#     execution.list_tasks at each call (a mock.patch.object of execution.list_tasks made after cli's import is the
#     one called; row 13); when clock raises, list_tasks is not called. On (a list, None): exit 0 and, in the text
#     form, one line per item in list_tasks' order, "<task> <state> <contract_hash> lease=<lease>", or the one line
#     "no task may be taken" for an empty list; in the --json form one line, json.dumps({"tasks": <the list>},
#     sort_keys=True). On (None, findings): exit 1 and one line "finding: <text>" per finding, list_tasks' str
#     findings printed as given (the str items of a list or a tuple only, DEF-0102's rule; row 18); when no str
#     finding remains (findings a str, an empty list or tuple, a list or tuple with no str item, or any other value
#     such as None, 5 or a dict), the one finding "tasks: list_tasks gave no finding" (row 2; rv91c F2). An answer
#     that is not a 2-tuple of (a list, None) or (None, any value) gives exit 1 and the finding "tasks: list_tasks
#     gave an answer out of form"; so does an item that is not of type dict with exactly the keys task, state,
#     contract_hash and lease, each value of type str exactly (type(v) is str; rv91c F1). A raise in clock or
#     list_tasks gives exit 1 and the finding "tasks: a step raised <exception type name>".
#     Every finding, list_tasks' and the CLI's own, is printed in the chosen form: one "finding: <text>" line each, or
#     under --json the one line json.dumps({"findings": [...]}, sort_keys=True) (row 5); a usage error is always
#     USAGE as text. No line holds the --root value or other caller text; the lines hold only list_tasks' values and
#     findings and the CLI's own fixed texts (row 17).
#   - RUNTIME_VARS = ('AIEOS_SESSION_ID', 'AIEOS_ROOT', 'AIEOS_BASE') and in_runtime(environ) -> bool: true when any
#     name of RUNTIME_VARS is in environ, whatever its value ('' included); true also when the test itself raises (an
#     environ whose membership test raises), failing closed; false otherwise (spec 7 :34; D-3015 (b)). Two stated
#     choices, both fail-closed (D-3015 (b2); D-3019 row 11): AIEOS_BASE is counted beside spec 7 :34's session id and
#     project root, and a name present with the value '' counts as present, while specification 5 :114 counts an
#     empty session id or root as absent. Built and tested here; tasks does not call it and does not refuse inside a
#     runtime (spec 7 :34 names only end and launch); spec 7 :34's refusal itself comes with TASK-092 and TASK-094,
#     which call in_runtime.
# - New tests/unit/test_cli.py: stand-ins only (a list of str as stdout's sink, compared as ''.join(sink); a fixed or
#   counting clock; list_tasks replaced by mock.patch.object of execution.list_tasks, and in AC3 cli._render by
#   mock.patch.object of cli._render, each restored after each test); a
#   literal root 'C:/cli-root-91' (L-0032); no tempfile, sqlite3, shutil or open; no os.mkdir; RUNTIME_VARS checked
#   against mcp_server.SESSION_VAR and ROOT_VAR, claude_code_pretool_hook.BASE_VAR (module attributes; only the test
#   imports the hook module, and every attribute it takes of it is BASE_VAR, checked by ast) and the keys of the dict
#   literal assigned to `environment` in launcher.start, read as (SRC / 'launcher.py').read_bytes().decode('utf-8') and
#   ast.parse (tests/unit/test_launcher_end.py :360's form): the FunctionDef start, the one Assign whose target is the
#   Name environment and whose value is an ast.Dict, its keys all str constants (D-3017: the ast read is used, since a
#   granted start needs launcher.start's four input readers patched; D-3019 row 9); the naming test.
# - What it does not do: no write of any file, store or log; no process; no change to execution.py, mcp_server.py,
#   launcher.py, writer.py or __init__.py; no installed command, no manifest (pyproject.toml, setup.py and the rest are
#   refused by the deterministic rule, aieos-checks.yml :1521, :1653, and are evaluator paths, :423-430, :490-497); no
#   other command (end, status, init, launch, approve, import and run are TASK-092 to TASK-098, D-3014).
#
# Stated limits: the installed name and how the owner starts the CLI stay open (spec 7 :26); "aieos <command>" in texts
# means `python -m aieos_bootstrap.cli <command>`; a root value beginning "--" cannot be given. in_runtime sees only the
# three names: a determined agent can start a nested runtime with an environment it chooses (spec 5 :120); its two
# stated choices are in Scope. "Never raises" covers every Exception, not KeyboardInterrupt or SystemExit. tasks lists
# what list_tasks lists, with its own limits (execution.py :45-57; DEF-0099). A root that names no folder, or a
# whitespace-only root, gives only the finding "list_tasks: a step raised <type>" (writer.py :208-211 raises in
# read_log; execution.py :501-502). list_tasks' default held_leases reads the store inside BEGIN IMMEDIATE
# (writer.py :298-313, :523-528): it changes no content, but it takes the store's write lock and can fail while a
# session holds the lock, which also gives "a step raised". The text form of a non-ASCII value or finding on a stdout
# in a legacy code page raises at the write (UnicodeEncodeError), exit 1; the --json form is ASCII. A real stdout in
# Windows text mode writes CRLF for each LF. __init__.py's package docstring still says "It holds twenty-one modules"
# (__init__.py :5), stale already and not changed (the file is forbidden; pinscan91-reading.md (2)). The CLI is not run
# outside its tests by this task. (D-3019 rows 1, 7, 8, 11, 12.)
#
# Owner-act boundary: none reached. tasks reads the log and the store through list_tasks' readers and writes nothing; no
# process, no hook, no setting, no runtime (DM A51 item (4)). CR-002 part 4 limit 5 (CR-002-concept-errata.md :61) is
# not reached: the task neither carries out nor changes an act A51 item (4) keeps (D-3015 (e)).
#
# The pins (L-0026; pinscan91-out.txt at 49cd8795; pinscan91-reading.md; D-3017): tests/unit/test_writer.py :397-412
# (R8: no open or connect call and no ".aieos" string outside writer.py), kept; tests/unit/test_ac_tests.py :249-250,
