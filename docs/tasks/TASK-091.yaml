constitution: [INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]
acceptance_criteria:
  - AC1: >-
      The parser: each of these gives exit 2 and exactly USAGE (ending with LF) as the whole output, with neither the
      clock nor list_tasks called (a counting clock and a counting stand-in): an empty argv; an argv that is a tuple, a
      list subclass, or a list holding a non-str; an unknown command ("task", "Tasks", "end", "--", "-h", "--help");
      a flag before the command ("--root R tasks", "--json tasks --root R"); tasks without --root; "--root" as the
      last argument; "--root" followed by a value beginning "--"; an empty --root value; an unknown flag ("--all",
      "-r", "--root=R"); --root or --json given twice; an extra positional argument. These are accepted, each seen by
      the stand-in called once with that root and an exit code other than 2: "tasks --root R", "tasks --json --root
      R", "tasks --root R --json", "tasks --root -r" (the root "-r") and a whitespace-only root (passed to list_tasks
      as given).
  - AC2: >-
      tasks by stand-ins (mock.patch.object of execution.list_tasks, restored after each test, seen called once with
      (the root, the clock's value); the stand-in items built in the key order task, state, contract_hash, lease, as
      execution.py :497 builds them; the output compared as ''.join(sink)): a list of two items gives exit 0 and
      exactly the two lines "<task> <state> <contract_hash> lease=<lease>" in order, each ending with LF; an empty list
      gives exit 0 and the one line "no task may be taken"; findings ['a', 'b'] give exit 1 and the lines "finding: a"
      and "finding: b"; findings with non-str items keep only the str items of a list or tuple; findings given as a
      str, as [], as (), as [3], as None, as 5 and as {} give exit 1 and the one line "finding: tasks: list_tasks gave
      no finding"; with --json, the list gives the one line json.dumps({"tasks": [...]}, sort_keys=True) compared as
      an exact string, and each findings case the one line json.dumps({"findings": [...]}, sort_keys=True), the CLI's
      own findings included; an answer that is not a 2-tuple of (a list, None) or (None, any value), and an item that
      is not of type dict with exactly the keys task, state, contract_hash and lease each of type str exactly, give
      exit 1 and the finding "tasks: list_tasks gave an answer out of form", in both forms; list_tasks is looked up
      as execution.list_tasks at each call (a mock.patch.object
      made after cli's import is the one called); the clock is called once and its value passed; with stand-in
      findings that do not name it, no output line holds the --root value.
  - AC3: >-
      Never raises an Exception: a raising list_tasks and a raising clock each give exit 1 and the one line
      "finding: tasks: a step raised <type name>" (and its --json form), and a raising clock leaves list_tasks
      uncalled; a mock.patch.object of cli._render that raises gives exit 1 and "finding: cli: a step raised <type
      name>", in the text form and, under --json, in the --json form; the output of one call is one stdout.write
      call, then flush through getattr when the sink has one; a stdout whose write raises gives exit 1 on a usage
      error, on a success and on findings, and so does a stdout whose every call raises and a sink whose flush
      raises; type(rc) is int and rc is 0, 1 or 2 in every case of AC1 to AC3; the module's entry line is exactly
      `if __name__ == '__main__':` followed by `sys.exit(main(sys.argv[1:], sys.stdout, os.environ, _clock))` (checked
      by ast), and _clock gives a timezone-aware UTC datetime with microsecond 0.
  - AC4: >-
      in_runtime and RUNTIME_VARS: RUNTIME_VARS is exactly ('AIEOS_SESSION_ID', 'AIEOS_ROOT', 'AIEOS_BASE'), equal to
      (mcp_server.SESSION_VAR, mcp_server.ROOT_VAR, claude_code_pretool_hook.BASE_VAR) and, as a set, to the keys of
      the one dict literal assigned to the name environment in the FunctionDef start of launcher.py, read as
      (SRC / 'launcher.py').read_bytes().decode('utf-8') and ast.parse, its keys all str constants; in_runtime gives
      true for an environ holding any one of the three names, with any value, '' included; false for {} and for an
      environ holding only other names ("AIEOS_OTHER", "PATH"); true for an environ whose membership test raises;
      tasks by stand-ins gives the same output with an environ holding all three names as with {}.
  - AC5: >-
      The module: cli.py's imports are exactly datetime, json, os, sys and execution (from aieos_bootstrap); it names
      no open, exec, eval, compile, __import__, input, argparse, subprocess, writer, time or getenv; os is used only as
      os.environ in the entry line; it holds no ".aieos" string, no assert and no except clause whose body is only
      pass; tests/unit/test_writer.py :397-412 (R8), tests/unit/test_gitread.py :370-380 and
      tests/unit/test_autonomy.py :238-246 pass; the new test file uses no tempfile, sqlite3, shutil or open, roots
      only the literal 'C:/cli-root-91', takes of claude_code_pretool_hook only the attribute BASE_VAR (checked by
      ast), and uses no one-argument .replace() and no .replace(target=...) (aieos-checks.yml :1622-1625).
  - AC6: >-
      Docstrings: cli.py's holds "python -m aieos_bootstrap.cli", "the installed name is open", "writes nothing",
      "never raises", "every Exception", "outside any runtime", "AIEOS_BASE is counted", "'' counts as present",
      "spec 5 :120", "__init__.py is not changed" and "TASK-091"; USAGE names the command tasks and the flags --root
      and --json; every new test names "TASK-091 ACn", checked by a naming test in tests/unit/test_cli.py over its own
      tests (tests/unit/test_launcher_end.py :359-364's form), more than 20 tests in all.
  - AC7: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) --root defaulting to "." when missing
      (AC1); (2) an unknown command giving exit 0 (AC1); (3) a usage error giving exit 1 (AC1); (4) an extra positional
      argument accepted (AC1); (5) the lease mark left out of a task line (AC2); (6) findings giving exit 0 (AC2); (7)
      list_tasks bound at import time (AC2); (8) now taken from datetime.now in place of clock (AC2); (9) the --json
      form without sort_keys (AC2); (10) a raising list_tasks escaping (AC3); (11) a raising stdout escaping (AC3);
      (12) in_runtime without AIEOS_BASE (AC4); (13) in_runtime giving false when the membership test raises (AC4);
      (14) cli.py importing argparse (AC5); (15) an item out of form printed (AC2); (16) a raising clock not caught
      (AC3); (17) a usage error whose raising write escapes (AC3); seventeen copies in all; each copy made in a
      scratchpad script at G3, not committed; the governor's evaluate at acceptance (the shadow) with any difference
      named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6]}
  - {gate: G3, check: constitution, args: [AC7, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: false
