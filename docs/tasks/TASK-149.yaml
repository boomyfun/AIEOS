objective: >-
  Change the module src/aieos_runtime/task_capture.py and its unit test tests/unit/test_task_capture.py so that they meet the CI revision 29 and close the three items of DEF-0150 that lie in the write set. THE PIN: in the module-level literal CAPTURE_FORMS the diff form becomes exactly ('diff', '--no-ext-diff', '--no-textconv', '--no-renames', '--name-only', '<id>', '<id>') (the literal of the workflow's pin at aieos-checks.yml on main, revision 29; every other form, CAPTURE_OPTIONS and CAPTURE_ENV_FIXED stay as they are, byte for byte; the module's single subprocess.run call, its keywords and its call-list form stay as they are). THE REASON WORD: an id that git itself printed (the tree id printed by write-tree and the commit id printed by commit-tree) and that is not 40 lowercase hexadecimal characters is refused with the reason git-failed and a finding that says so, never with invalid-argument (the contract of TASK-147 reserves invalid-argument for validation before any process starts); no other behaviour of capture or restore changes (the closed set of six reason words stays; each function still returns exactly the keys of TASK-147's objective; no exception escapes either). THE DOCSTRING: it states, in plain words and without the labels MEASURED, ENFORCED or GUARANTEED (OPS-003), the state-name rule as the code applies it (a name that begins with a dot and is not only a dot and holds no slash and no backslash; AC8 (19) of TASK-147), that the real-git behaviour is not run by the suite (AC8 (13)), that a git directory with a non-ASCII character is refused as git-failed (AC8 (20)), and the int timeout constant 60. THE TEST WORDING (review B10 of TASK-147): the header docstring of the unit test says which files it reads (the module, the workflow and the test file itself), and the docstring that says restore refuses every refusal of capture says exactly which refusals the test covers; no test is removed, weakened or skipped.
