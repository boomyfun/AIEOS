acceptance_criteria:
  - AC1: >-
      The pin. The module's CAPTURE_FORMS literal holds the diff form of the objective exactly and every other form unchanged; CAPTURE_OPTIONS and CAPTURE_ENV_FIXED are unchanged; the module still has exactly one subprocess.run call of the form that check_capture judges, one top-level import os and each of the three literals bound once. The existing pin test of the unit test (it reads the workflow's literals and compares) passes with no change of its mechanism; the cut-out check_capture and check_source on the module (the workflow of the same commit) give 0 findings, shown by the scratch harness of AC5 and by the CI run of AC7.
  - AC2: >-
      The reason word. The unit test has a test with a stand-in process function that answers write-tree, then commit-tree, with an output that is not 40 lowercase hexadecimal characters (empty, too short, upper-case, with a trailing garbage) and sees {'result': 'refused', 'reason': 'git-failed', 'findings': [..]} (exactly those three keys, a finding that names the step and says that the id is malformed), the steps after it not called and the ref not written; and a test that the refusals before any process (invalid-argument) still start no process. The closed set of reason words is unchanged (the existing test of the set passes).
  - AC3: >-
      The docstring and the test wording. The module's docstring states the four items of the objective in plain words, with no label MEASURED, ENFORCED or GUARANTEED (the existing docstring test passes), and names the value 60 of the timeout constant; the unit test's header docstring names the files it reads and the docstring of the restore-refusal test names the refusals it covers; the unit test has a test that the docstring holds the four statements (a substring check of each statement's key words; the check is written so that it fails if a statement is removed).
  - AC4: >-
      No other change. The diff of the task commit touches only the two paths of the write set; in the module the only changed lines are the diff form of CAPTURE_FORMS, the id check of the two process outputs (and the finding text), the docstring and, if needed, one helper for the id check; no new import; the validation before any process (the findings of capture and of restore, reason invalid-argument) and the argument builder _build with its own id check are unchanged; the new check of a printed id runs after write-tree or commit-tree has answered and before that id reaches _build; in the unit test no test is removed, weakened or skipped.
  - AC5: >-
      The real-git behaviour, shown at acceptance by the scratch harness: BT1a_harness_v3.py with ONE new case (a v4, its exact source released by the decision agent before acceptance; outside the repository, never run in E:\AIEOS; it builds a throwaway repository in the scratchpad, imports a COPY of the module taken from the task's commit (git show) and reads a COPY of the workflow from the same commit): a capture of a deleted path and an added path of IDENTICAL content in one commit gives {'result': 'done', 'commit': <id>} and the tree differs from HEAD's exactly in those two paths ('D' and 'A', not one rename); a second capture, of a deleted path and an added path of near-identical content, is judged the same way; every case of v3 stays OK (the capture of modified, added and deleted paths, the parent, the modes, the refusals, the index and HEAD byte-equal, restore, the hooks, the filter INFO, check_capture and check_source 0 findings). As a negative control, shown once, the same new case on the module of main at 8ff21ea6 (the old diff form) is expected to give name-list-mismatch (or the harness's FAIL line for the case), which is the observation that DEF-0150 describes; the negative control also pre-registers that check_capture on the module of 8ff21ea6 reports the diff-form mismatch with the workflow of 8ff21ea6. The unedited output is acceptance evidence, labelled worker-supplied; if git's behaviour breaks a case, that is a finding and is brought to the decision agent, the case is not loosened.
  - AC6: >-
      The suite. tests/run_tests.py discovers the changed unit test without a change; the whole suite passes by the slice method (D-6249 C2, D-6328 E1.6) in a scratch clone of the base holding the two changed files, per group as the CI discovers them, with the count of tests of the base (3236 at the draft; re-read at the base by the slice method and stated at acceptance) plus the new tests of AC2 and AC3 and no failure and no error (one known skip, Windows-only); the changed unit test passes alone; the test identity has an e-mail value with no '@' at all and no GitHub URL appears in an added line; the CI's own SEC-002 rule and the CI's source rules (the script of D-6649 K5, ci_rules_147.py or a counted transform) are run on the two files before the task push (L-0048, L-0050); no test file works around the deny sets of check_source. tests/unit/test_gitread.py is unchanged.
  - AC7: >-
      The evidence of the task push. On the CI run of the task branch the read must show: the deterministic_rule summary "deterministic_rule: files N, changed paths 2, findings 0" with N equal to the number of entries of `git ls-files src tests` at the base commit (the rule's own file list, aieos-checks.yml :2122; the task adds no file), printed by command before the contract commit and written here as a number: N = 264, and no FAIL line; the bandit invocation of `[ -e "$CR" ]` run on src/aieos_runtime/task_capture.py with its own output lines ("No issues identified"); the unit step's pin test passing against the workflow of the same commit (this is the FIRST task run in which revision 29's pin meets the module); the GOV-003 report 'GOV-003 evaluator change: yes (1 of 2 changed paths)' and 'GOV-003 evaluator path: tests/unit/test_task_capture.py' (tests/unit/** is an EVALUATOR path, aieos-checks.yml :532; src/aieos_runtime/** is not; a report, not a block), and the result of the step 'GOV-003 base tests (report only)' (the base's unit test run against the change; expected to pass; a failing base test is named and explained at acceptance). An absent line is a finding, not a pass; a finding from either step blocks acceptance and is fixed inside the write set before main moves.
  - AC8: >-
      Limits, class, evidence and departures, stated at acceptance. (1) The limits (1) to (22) of TASK-147's AC8 stand as stated there, except that (13), (19) and (20) are now also stated in the docstring and the rename-detection item of DEF-0150 is closed by this task and the revision 29. (2) New limits found at the TASK-147 review and still open: the bare name git is looked up by the operating system (on Windows the caller's current directory may be searched first); a timeout or kill can leave a lock file for the index file or the new ref; Windows device names and the 8.3 short form of '.git' are not refused by the module's own validation; calls other than commit-tree inherit the caller's standard input; the unit tests use a stand-in process function. (3) The module is not called by anything until BT1b (TASK-148, reserved). (4) The risk class is high; the evidence profile is that of docs/pre-genesis/assurance-model.md :82 as for TASK-147 (unit_test, deterministic_rule, static_security_analysis, ai_review by a PAIR of blind reviews on Haiku 5.5 in their own sessions (same vendor, a stated departure), a per-article review, a decision_agent_review; the shadow governor result is a stated departure; no launched session is used). (5) The review pair reads the whole task (one commit) with the harness output apart from it. (6) The ids: TASK-149 for BT1c while TASK-148 stays reserved for BT1b (D-6679, D-6680). (7) No vendor attribution trailer (the owner's rule); the commit carries the "AIEOS-Task: TASK-149" trailer once and a "Decided by" line. (8) The contract was written in TASK-147's structure as a rewrite, not as a counted transform of TASK-147.yaml: a departure from D-6679 C2 and D-6680 C2, accepted at D-6681.
