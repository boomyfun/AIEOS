# Authority and order (the decision agent's, never the owner's): BT1c was decided as a separate small task at D-6658 C3 and D-6659; its CI revision 29 came first as its own A66 commit (D-6673, D-6675, D-6678, CI accepted at D-6679); its task id is TASK-149 (D-6679, D-6680). TASK-148 STAYS RESERVED FOR BT1b (the core part that calls the module), which keeps its draft header; the order of work is BT1c, then the backlog series, then TASK-148 (D-6664 R3, D-6679 C3). The ids skip a number until BT1b lands; G0 finds a task by its trailer id and its contract file, and the execution list sorts approved tasks by number whatever the order of landing (D-6680).
# Not in this task: the core part (BT1b, TASK-148), any launch, any .github change (the pin is already on main), the gate maker (BT2), the evaluation runner (BT3), any change of tests/unit/test_gitread.py (its list of modules that import subprocess is unchanged: the module still imports it), the backlog of records (DEF-0141 to DEF-0149 and the records of TASK-140, TASK-141 and TASK-144). The real-git behaviour is shown at acceptance by the scratch harness (BT1a_harness_v3.py plus ONE new case, as a v4 whose exact source the decision agent releases before acceptance), not by a test file (the CI's source rules refuse a test file that starts git).
