acceptance_criteria:
  - AC1: >-
      The pinned forms. run(repo, args, timeout=30) takes repo, an absolute path string of an existing directory, args,
      a list of strings, and timeout, a number of seconds greater than 0 and at most 120. args[0] is one of exactly four
      subcommands, each with its fixed form (the object names are 40 or 64 lowercase hex characters, or the literal
      HEAD for rev-parse only): rev-parse: ["rev-parse", "--verify", "--end-of-options", <name>]; cat-file:
      ["cat-file", "-p", <hex>] or ["cat-file", "-t", <hex>]; rev-list: ["rev-list", "--parents", "-n", "1", <hex>];
      diff-tree: ["diff-tree", "--no-commit-id", "--name-only", "-r", "--no-renames", "--no-ext-diff",
      "--no-textconv", "-z", "--root", <hex>]. Any other repo, args or timeout gives the refusal result of AC3 with an
      error naming what failed, and no process is started (fail closed).
  - AC2: >-
      The process and git's own routes to other programs (decision D-567 C2). For a pinned form, run calls
      subprocess.run once with the argument list ["git", "--no-pager", "-c", "core.fsmonitor=false", "-c",
      "core.hooksPath=" + os.devnull, "-c", "diff.external=", "-c", "core.pager=cat", "-C", repo] + args, shell False,
      stdin subprocess.DEVNULL, stdout and stderr captured, cwd repo, timeout the given timeout, check False, and env a
      new mapping holding exactly: PATH (copied from os.environ, or the empty string when absent), SYSTEMROOT (copied
      only when present, for Windows), GIT_CONFIG_NOSYSTEM "1", GIT_CONFIG_GLOBAL os.devnull, GIT_TERMINAL_PROMPT
      "0", GIT_OPTIONAL_LOCKS "0" and LC_ALL "C"; no other key of os.environ (in particular no GIT_DIR, GIT_WORK_TREE,
      GIT_EXEC_PATH or HOME) reaches git. --no-ext-diff and --no-textconv are in diff-tree's fixed form (AC1). The
      executable is the name git, found by the operating system's own search (reading): on POSIX through the PATH of
      the call; on Windows the process-creation search looks first in the Python program's own directory, the Python
      process's current directory and the system directories, and then in the Python process's own PATH.
  - AC3: >-
      The result. run returns a mapping with exactly the keys exit, out, err and error: for a completed process, exit
      its return code, out and err its output as bytes, error None; for a timeout, exit None, out b"", err b"", error
      "timeout"; when the executable cannot be started (OSError), exit None, out b"", err b"", error a short English
      text; for a refused form (AC1), exit None, out b"", err b"", error a short English text naming the failing part.
      run raises nothing for these cases.
  - AC4: >-
      The commit parser. parse_commit(data) takes the bytes of "git cat-file -p <commit>" and returns a mapping with
      exactly the keys tree, parents, author, committer, message, trailers and error: tree the 40 or 64 hex id; parents
      the list of parent ids in order (empty for a root commit); author and committer the header lines' values as
      strings; message the text after the first empty line, decoded as UTF-8; trailers the list of [key, value] pairs
      of the message's last paragraph when every line of it has the form "<key>: <value>" with the key made of letters,
      digits and hyphens (git's trailer form, reading), else an empty list. Bytes that are not UTF-8, a missing tree or
      author or committer line, a header line out of form, or a missing empty line give error a short English text and
      every other key empty (None for tree, author and committer, [] for parents and trailers, "" for message).
  - AC5: >-
      The paths parser. parse_paths(data) takes the bytes of the AC1 diff-tree form and returns a mapping with exactly
      the keys paths and error: paths the list of the NUL-separated names in order, decoded as UTF-8, with the empty
      name after the last NUL dropped; error None. Bytes that are not UTF-8, or an empty name before the last NUL, give
      paths [] and error a short English text.
  - AC6: >-
      The single wrapper (INV-001; decision D-567 Q2). gitread.py is the only module of src/ that imports subprocess,
      and run is the only place in it that calls subprocess; it calls no other process function (os.system, os.popen,
      os.exec*, os.spawn*, pty) and no network module. Its docstring says it is INV-001's single process wrapper with the
      pinned list [git] and the four subcommands, and that a further executable or subcommand is a change to this
      module and to the workflow's pattern rule (revision 8).
  - AC7: >-
      Read only. The four subcommands of AC1 write no ref, object, index or configuration, and GIT_OPTIONAL_LOCKS "0"
      keeps git from refreshing the index; the module opens, writes and removes no file, reads no clock, and reads the
      environment only for AC2's PATH and SYSTEMROOT.
  - AC8: >-
      This repository's history, read only. tests/integration/test_gitread_repo.py finds the repository root from its
      own path (pathlib, two parents up) and, with run and the parsers, asserts on fixed commits of main: cat-file -p
      of 2b7bf15269c57484e3306c6a6532d4cea6b5d3e2 parses with parents [8cc5af058c1acd37b729ae7e44b6a2367a851043] and
      trailers holding ["AIEOS-Task", "TASK-023"]; diff-tree of it gives exactly the four paths
      src/aieos_bootstrap/stale.py, tests/integration/test_stale_records.py, tests/property/test_stale_properties.py and
      tests/unit/test_stale.py; rev-list --parents of 8cc5af058c1acd37b729ae7e44b6a2367a851043 names
      badd0c97ffb1f35b37d78bebf4167e05b6207304 as its parent; cat-file -t of it gives "commit"; and a refused form
      (["commit", "-m", "x"], and ["log"]) returns the refusal result. These are data about accepted commits: they
      reopen nothing.
  - AC9: >-
      Purity and the CI checks (INV-001, INV-002, INV-003). The module imports only the Python 3 standard library (os,
      re and subprocess among the allowed); no exec, eval, compile, __import__ or importlib; no assert in src (bandit
      B101); no string that names the project-state directory; subprocess with shell=False only (bandit B603 is
      reported as advisory and each occurrence is justified by AC1's pinned forms, reading). At the task's commits,
      on the base with the workflow's revision 8, the CI steps report no finding: deterministic_rule, OPS-003, SEC-001,
      SEC-002 and bandit (bandit's subprocess findings, if any, are named in the task's report and not silenced in the
      code, reading).
  - AC10: >-
      Limits, stated: git is trusted as the operating system finds it (the executable is the name, not a pinned path
      or hash; on Windows a git program placed in one of the places searched before PATH would be found first, a stated
      limit); the repository's own configuration (.git/config) is still read by git, and the fixed options override only the keys
      AC2 names, so a repository whose configuration sets another program-starting key is outside what this module
      closes; core.hooksPath has no test of effect, since none of the four subcommands runs a hook (reading); the
      parsers check form, not that a commit exists or is reachable; no caller exists, and the submission and evaluation
      paths are later tasks (DEF-0030). Every existing module and test not in the write set is unchanged, and if one can
      pass only by a change the task escalates (needs_out_of_scope_change).
  - AC11: >-
      Its own tests and the added text. Every test function of the three new test modules names the AC ids it stands
      for as "TASK-024 ACn" in its own docstring and names no other task's AC in qualified form there. Before each
      commit, the added text is scanned with the workflow's SEC-001, SEC-002 and OPS-003 patterns, and each count is 0;
      the file names are scanned with the same patterns and the records executors' pre-push pattern (D-282).
  - AC12: >-
      Tests, each rule with at least one passing and one failing case: R1 AC1 (each pinned form accepted; a fifth
      subcommand, an extra or missing option, a ref name other than HEAD, an option-like object name, a relative repo
      and a timeout of 0 or above 120 refused, with no call to the process function, shown by a stand-in that records
      calls); R2 AC2 (the stand-in receives exactly the argument list, the keyword arguments and the environment of AC2,
      and no key from a planted os.environ entry such as GIT_DIR); R3 AC3 (a completed call, a non-zero exit, a timeout
      and an OSError from the stand-in, each giving its result); R4 AC4 (recorded commit bytes with one parent, two
      parents and none; with and without trailers; each malformed form); R5 AC5 (several paths, one, none; a non-UTF-8
      name; an empty name); R6 AC6, AC7 and AC9 (a script check of the module's imports, of the absence of other process,
      file, clock and network calls, and that subprocess appears in no other src module); R7 AC8 (the integration
      test). Unit tests in tests/unit/test_gitread.py; AC8 in tests/integration/test_gitread_repo.py; property tests in
      tests/property/test_gitread_properties.py (standard library only, fixed seeds): random argument lists outside the
      pinned forms are always refused without a call; random well-formed commit and path bytes round-trip through the
      parsers. tests/run_tests.py, unchanged, runs all groups.
