# Task contract TASK-024, the Git reader (Master Plan revision 3, §4 M4; specification 4 revision 3, section 7 item 4
# and section 12 point 4 (o4), "the core's caller is DEF-0030's line"; constitution INV-001). Revision 0, drafted under
# decision D-567 (Q2, Q3, C1, C2), brought for approval in its own request; whether it is approved is recorded in the
# decision files, not in this file. Fields and value forms follow specification 2 §5.1 and the contracts of TASK-007 to
# TASK-023. Readings marked "(reading)" are the worker's, for the decision agent's ruling.
# Task type: implementation. What it adds: one module, src/aieos_bootstrap/gitread.py, the first piece of the core's
# caller (DEF-0030; the row 13 note of decision D-567): INV-001's single process wrapper. Its function run starts one
# executable, git, with one of a pinned list of read-only subcommands and fixed options, with no shell, a controlled
# environment, a pinned working directory and a timeout, and returns bytes and an exit code; pure parsers turn a commit
# object and a list of changed paths into values. It is the only module of the bootstrap that may import subprocess
# (decision D-567 Q2: "it is INV-001's single process wrapper").
# Precondition (decision D-567 C3): the CI workflow's revision 8, a decision of its own under DM A66, named as a
# loosening of a check: the deterministic_rule step allows subprocess for exactly src/aieos_bootstrap/gitread.py (its
# test modules reach it only through gitread, for example gitread.subprocess.TimeoutExpired), and a pattern rule pins git and the subcommands. Until revision 8 is on main, the task's
# commits fail deterministic_rule and the task stays at INSUFFICIENT_EVIDENCE; the contract's commit C comes after
# revision 8.
# The constitution's text (constitution.md line 29, INV-001's tool part): "a process is started only through one wrapper
# with a pinned list of allowed executables; and the core writes files only to the project-state directory and its
# logs". Here the list holds one executable, git, and the module writes no file.
# Git's own ways of starting other programs (decision D-567 C2), closed by fixed options on every call (AC2): no pager
# (--no-pager, core.pager=cat); core.fsmonitor=false; core.hooksPath set to the null device; diff.external empty and
# --no-ext-diff and --no-textconv where the subcommand takes them; the system and global configuration ignored
# (GIT_CONFIG_NOSYSTEM=1, GIT_CONFIG_GLOBAL the null device); an environment built from nothing but the keys AC2 names;
# the working directory pinned to the repository root given. The repository's own configuration is still read by git
# and is a stated limit (AC10): the options above override the keys named, not every key a configuration can set.
# What it does not do: no caller (TASK-025 and TASK-026, the submission and evaluation paths of the row 13 note, are
# later tasks), no writer call, no event, no record, no Git write of any kind (no commit, ref, index, object, config or
# fetch), no network, no file opened by the module, nothing under .github/ (revision 8 is its own decision), no policy,
# no frozen fixture. It changes no other module of src/.
# Readers of the changed paths (D-263 C3's practice): src/aieos_bootstrap/__init__.py is read by every module that
# imports the package and by the CI's G1 build; its docstring and __all__ gain gitread; it must not name the Resume
# Check fixture folder (TASK-010's assertion) nor the Risk Engine fixture folder (TASK-020's allow list). No module of
# the repository calls gitread yet.
# Risk: high, and change class critical_cr, each computed over the base by script (risk_class24.py and
# gov003_class24.py of the drafting session: task risk class high; GOV-003 evaluator change, 5 of 5 paths). Profile
# (assurance-model.md §5, gov-AIEOS, high): functional [unit_test], architecture [deterministic_rule], functional
# [integration_test], security [static_security_analysis] and architecture [ai_review (cross-model)], plus the
# evidence_required of the applicable articles.
# Reviews (as TASK-023's): five way-2 reviews by a Claude model other than the implementer's, and the decision agent's
# three, each brief naming for testing: the pinned subcommands and options and the refusal of anything else before any
# process starts; each closed route of AC2 and its test; the controlled environment; the timeout; the parsers on
# malformed bytes; purity apart from the one process; AC10's limits.
# Naming: every test of the three new test modules names the AC ids it stands for as "TASK-024 ACn" in its own
# docstring, following DEF-0049's convention as TASK-023 did (decision D-544 Q3), for this contract only.
# Evaluation path (A61; as TASK-007 to TASK-023): commit C changes only docs/tasks/TASK-024.yaml and has one parent
# equal to base_commit; the task's commits, each carrying "AIEOS-Task: TASK-024", go to task/TASK-024 under their own
# decisions; main receives the task only at its acceptance. The task push's CI base run is a RISK-01 conformance run
# over the set file of DM F35, reported advisory, never MEASURED.
# Not applicable: OPS-001 (the task changes no ref; the module runs only read-only subcommands); INV-004 and INV-009
# (the module writes no file and no log); INV-005 to INV-008, INV-010 and INV-011 (the decision engine, the governor,
# evidence records, the replay and the policy meet no path of the write-set); GOV-001, GOV-004 to GOV-006 and SEC-003
# (the concept file, the bound artifacts, the decision matrix, the records and pre-genesis documents, and .github/,
# meet no path of the write-set).
# Owner-kept acts: none. The task carries out or changes no act that A51 item (4) keeps: nothing under .github/ in the
# task (revision 8 is the decision agent's own decision under A66, outside this task), no Claude Code setting, no push of
# its own; it weakens no evidence requirement (CR-002 part 4 limit 8 does not apply), so its acceptance is one delegated
# approval of the decision agent (Master Plan section 6), for the decision agent's ruling.
