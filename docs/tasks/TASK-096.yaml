acceptance_criteria:
  - AC1: >-
      approval_act by stand-ins (keyword callees; a counting clock), over a log holding the task's task.drafted with
      the contract's hash and version and its dependencies' task.approved and task.done: approve with decision_agent
      and 'D-1' gives one _head read, one contract_at call with (root, head, task_id), one read_log, one task_states
      call with (log, depends_on), then two appends, each (root, <type>, <payload>, <event id>, now, the record's
      recorder) with task_id the task and no fencing token: record.added (an authority record, approval_binding
      {kind: 'contract', hash}, no outcome, decision_ref 'D-1', the stated recorder) then task.approved
      {contract_version, contract_hash, approval_record}, and "done" with record_id, both event ids and appends
      ['appended', 'appended']; with human_authority the record has no decision_ref and its recorder says "not
      checked"; reject appends one record.added with outcome 'fail' and no task.approved; edit appends one
      record.added holding a claim with evidence_type 'contract_edit' and the note as text; reject and edit call no
      task_states; every record passes records.check_payload('record.added', ...) and the resulting log passes
      records.check_log; over the log a first run made, a rerun of reject or edit gives "done" with the same ids and
      appends ['duplicate'], a rerun of an approve whose task.approved was refused after its record was appended gives
      "done" with ['duplicate', 'appended'], and a full rerun of approve gives "refused" with reason "state"; each
      callee defaults at call time (mock.patch.object of gitread.run, writer.read_log, writer.append_event,
      base_inputs.contract_at and execution.task_states made after import are the ones called); the result has
      exactly APPROVAL_KEYS.
  - AC2: >-
      approval_act's refusals, each with nothing appended unless said: each wrong argument ("argument", nothing
      called), a human_authority `who` or an Edit note holding "owner" in any case among them; a raising or
      out-of-form clock ("clock"); _head's findings or a raising read ("head"); contract_at findings, a raise or an
      answer out of form ("contract"); a raising or non-bytes read_log or a log check_log refuses ("log"); a task
      with no task.drafted,
      or whose task.drafted is followed by task.approved, task.blocked, decision.acceptance or another state event
      ("state"); a contract hash or contract_version other than the last task.drafted's or task.replanned's
      ("version"); for approve a dependency not DONE, task_states' findings or a raise, or a depends_on out of form
      ("dependencies"), a decision_agent approval of a contract whose owner_kept_act is 'true' or out of form
      ("owner_kept_act", while a human_authority approval of it is done), an earlier Reject of the same version after
      the last task.drafted ("rejected"); an append "refused" or raising ("append"), a rerun of approve with another
      --by over a log holding the first record and no task.approved refused as a conflict ("append"), a refused
      task.approved after an
      appended record.added naming that the record is in the log, with record_id and the first event id given; no
      Exception escapes; by ast, approval_act and the names beginning _approval name no open, exec, eval, compile,
      __import__, subprocess, os, sys or time.
  - AC3: >-
      records.py: a claim with evidence_type 'contract_edit', a TASK- subject, text and no session gives no finding by
      check_record; the same with a subject that is not a TASK- id, or with another evidence_type, gives "6.2:text";
      the same with a session that is not a non-empty str gives "6.2:session"; the same with acs and no gate gives
      "6.2:acs"; an observation with evidence_type 'contract_edit' and text gives "6.2:text";
      tests/unit/test_records_session_claims.py passes unchanged; records.py's diff from the base is added lines and
      the one changed line :420 (checked at G3 by a scratchpad git-diff script) and its imports unchanged.
  - AC4: >-
      The commands by stand-ins (mock.patch.object of launcher.approval_act; a counting clock): "approve TASK-1 --root
      R --class decision_agent --by D-1" gives one approval_act call with (R, 'TASK-1', 'approve', 'decision_agent',
      'D-1', None, the clock); edit with --note passes the note; each argv out of form (no --class, no --by, a class
      outside the two, --note on approve or reject, no --note on edit, a flag twice, a value empty or beginning "--",
      a bad task, an extra word) gives exit 2 and USAGE with nothing called, inside a runtime too; a --by out of
      approval_act's form passes the parse and, with the real approval_act (step 1 refuses before any callee),
      gives exit 1 with "finding: approve: refused argument"; an environ
      holding any one of the three RUNTIME_VARS ('' included) gives exit 1 and the runtime refusal, filled with the
      act, with nothing called; "done" gives exit 0 and the record and event lines, or under --json the exact sorted
      string; "refused" gives exit 1 and "finding: <act>: refused <reason>" then the findings, or under --json one
      findings line; each answer out of form (not a dict, a dict subclass, other keys, a result outside the two, a
      done with a reason, a done with the wrong number of event ids, event_ids and appends of unequal length, an
      append outside its two words, a reason outside APPROVAL_REASONS, a non-str finding) gives the out-of-form
      finding; a raising approval_act gives "<act>: a step raised <type>"; a raising _render_approval gives "cli: a
      step raised <type>"; the earlier commands' tests all still pass.
  - AC5: >-
      The modules: launcher.py's import set equal to the widened test (tests/unit/test_launcher.py :697-705, widened
      by exactly records, a change to TASK-086's test, named); launcher.py's diff from the base is the added
      docstring paragraph, the one import line and a block after launch_outside only (checked at G3 by a scratchpad
      git-diff script); its names test (tests/unit/test_launcher.py :708-725) passes; cli.py's imports unchanged and
      its refused names and strings (tests/unit/test_cli.py :333-356, :369-375) pass; the deterministic rule passes
      with launcher.py, records.py and cli.py at NONE; no recorder or text field of any record approval_act builds,
      over every act and class of AC1, holds "owner" in any case; the new test file uses no tempfile, sqlite3,
      shutil, subprocess or open, roots only the literal 'C:/approve-root-96', and uses no one-argument .replace() and
      no .replace(target=...).
  - AC6: >-
      Docstrings: launcher.py's module docstring gains a paragraph holding "approval_act", "TASK-096", "contract-kind",
      "HEAD", "not checked", "DEF-0101", "reads the caller's clock once" and "writer.append_event", and keeps every
      phrase of its pinned tests; records.py's module docstring gains "contract_edit" and "TASK-096" and keeps its
      pinned phrases (records.py :61 among them);
      cli.py's gains "aieos approve", "aieos edit", "aieos reject", "TASK-096", "writes nothing the governor counts at
      acceptance" and "not checked", holds "COMMANDS, tasks, end, status, init, launch, approve, edit or reject" and
      "end and init call it after the parse" and not "COMMANDS, tasks, end, status, init or launch", and keeps every
      phrase of tests/unit/test_cli.py :405-411, tests/unit/test_launcher_outside.py :609-620 and CLI_KEPT; USAGE
      names approve, edit and reject; the widened tests of tests/unit/test_cli_init.py, tests/unit/test_cli_launch.py,
      tests/unit/test_execution_status.py and tests/unit/test_launcher.py pass; every test of
      tests/unit/test_cli_approve.py names "TASK-096 AC", checked by its own naming test, more than 20 tests.
  - AC7: >-
      Broken copies, each naming its file and failing the tests of its AC: (1) an acceptance-kind binding written by
      approve (AC1); (2) task.approved appended before the record (AC1); (3) an outcome on the approve record (AC1);
      (4) reject appending task.approved (AC1); (5) approve with no task.drafted appending (AC2); (6) the version check
      dropped (AC2); (7) the dependency check dropped (AC2); (8) a decision_agent approval of an owner-kept task done
      (AC2); (9) the Reject check dropped (AC2); (10) a fencing token passed to append (AC1); (11) a callee bound at
      import time (AC1); (12) a raise escaping approval_act (AC2); (13) approval_act naming os (AC2, AC5); (14) a
      recorder holding "owner" (AC5); (15) records' widening for every claim without session (AC3); (16) the command
      not refusing inside a runtime (AC4); (17) the in_runtime check made before the parse (AC4); (18) a default class
      when --class is missing (AC4); (19) the --json line without sort_keys (AC4); (20) cli.py importing writer (AC5);
      (21) a line of launch_outside changed (AC5, the G3 diff script); (22) the contract read at a commit other than
      _head's (AC1); (23) approve's record_id holding who and the class (AC2, the conflict case); (24) a
      human_authority `who` holding "owner" accepted (AC2); (25) records' widening that skips the session check for
      an Edit's claim (AC3); (26) decision.acceptance left out of the state-setting events (AC2); (27) an Edit note
      holding "owner" accepted (AC2); twenty-seven copies in all; each copy made in a scratchpad script at G3, not
      committed; the governor's evaluate at acceptance (the shadow) with any difference named.
capabilities:
  filesystem: {read: [the repository at base_commit], write: [the write_set paths]}
  shell: {allow: ["timeout 110 python tests/run_tests.py < /dev/null", "timeout 110 python <a scratchpad script that
    compiles src and tests and runs a part of tests/ with unittest> < /dev/null"]}
  network: {allow: []}
  git: {allow: [commit], forbid: [push, "push --force", rebase, "reset --hard", tag]}
  secrets: deny
  external_side_effects: deny
risk: high
autonomy:
  max_level: L1
  budgets: {tokens: 1000k, wall_time: 5h, retries: 2, human_attention: 0m}
verification_plan:
  - {gate: G0, check: scope}
  - {gate: G1, check: build}
  - {gate: G2, check: tests, args: [AC1, AC2, AC3, AC4, AC5, AC6]}
  - {gate: G3, check: constitution, args: [AC7, INV-001, INV-002, INV-003, INV-004, GOV-002, GOV-003, SEC-001, SEC-002, OPS-002, OPS-003]}
exit_conditions:
  success: all gates pass AND the evidence profile of the task's risk class and applicable articles is satisfied AND one
    approval record counts
  escalate: [needs_out_of_scope_change, spec_conflict, budget_exhausted, retries_exceeded, needs_owner_act]
owner_kept_act: true
