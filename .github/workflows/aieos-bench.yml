# AIEOS: the stack benchmark (TASK-039; Master Plan revision 4 §4; docs/plan/m4-exit-review.md §6), revision 8
# (decisions D-765 to D-767, with erratum E1 of decision D-773; the reference export of TASK-041; the TypeScript
# port's type check and run of TASK-043; the Go port's vet, format check, build, run, compare and tests of TASK-044,
# with GOTOOLCHAIN=local, GOPROXY=off and CGO_ENABLED=0; the Rust port's format check, lint, build, run, compare and
# tests of TASK-045; TASK-046's hardening: gofmt's own exit kept, and in each port step, after its compare, one run of
# the port's program with no argument that must exit non-zero and print nothing). Every port's own toolchain (node, go,
# cargo and rustc) is the runners', not downloaded. It runs, on GitHub's hosted Linux and Windows runners, the export
# of the frozen fixtures and the reference export into the job's temporary folder, prints the toolchain versions, and
# runs each language port only when its folder bench/<language>/ exists. It reads only: it checks
# out the pushed commit from the repository's public address, built from the runner's server and repository variables,
# with no credential, and each job makes one download, the pinned type checker (TypeScript 6.0.3) from the npm
# registry, checked by its integrity value before it is used; it uses no action, no secret and no token, writes
# nothing to the repository and calls no API.
# Round 2's export (TASK-047) writes the generated input and the bootstrap's results over it into the job's
# temporary folder, each checked against its pin. The Rust port's step (TASK-048) then runs round 2's program port2
# over that input, compares its output with round 2's reference, runs its tests and runs it once with no argument,
# which must exit non-zero and print nothing; its round-1 run and test lines name their binary and test target.
# The Go port's step (TASK-049) then vets and builds round 2's program port2 from bench/go/round2, runs it over
# that input, compares its output with round 2's reference, runs it once with no argument, which must exit
# non-zero and print nothing to standard output, and runs its tests; its round-1 lines are unchanged.
# Its results are advisory (DM A29, A31): they are this run's
# job logs only, and no record of the governor or of the CI workflow aieos-checks.yml reads them. It is not a
# trust-boundary measurement (Master Plan §9 item 3). Who decides a change to this file: the decision agent under DM A66,
# each change its own decision; a change that grants write access, uses a secret or token, or changes a repository or
# security setting stays the owner's. The port steps' commands are proposed here and may be changed only by the port
# tasks' own decisions (decision D-767 C1).
name: aieos-bench

on:
  push:
    branches: [main]
    paths:
      - 'bench/**'
      - '.github/workflows/aieos-bench.yml'
      - 'tests/unit/test_export_fixtures.py'
  # for the owner only: the agent never starts it without its own decision (decision D-766 C1)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PY: python3
    steps:
      - name: checkout (the pushed commit only, from the public address, no credential)
        run: |
          git init -q .
          git fetch -q --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: checkout check (HEAD is the pushed commit)
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: export the frozen fixtures into the temporary folder
        run: |
          $PY tests/unit/test_export_fixtures.py --root tests/conformance > "$RUNNER_TEMP/fixtures.json"
          wc -c "$RUNNER_TEMP/fixtures.json"
      - name: reference export (bootstrap decisions over the frozen fixtures)
        run: |
          $PY tests/unit/test_export_reference.py --root tests/conformance --check > "$RUNNER_TEMP/reference.json"
          wc -c "$RUNNER_TEMP/reference.json"
      - name: round-2 export (the generated log and the bootstrap's results)
        run: |
          $PY tests/unit/test_export_round2.py --input --check > "$RUNNER_TEMP/round2-input.json"
          $PY tests/unit/test_export_round2.py --reference "$RUNNER_TEMP/round2-input.json" --check > "$RUNNER_TEMP/round2-reference.json"
          wc -c "$RUNNER_TEMP/round2-input.json" "$RUNNER_TEMP/round2-reference.json"
      - name: toolchain versions
        run: |
          $PY --version
          node --version
          go version
          rustc --version
      - name: type-check ts (only if bench/ts exists)
        run: |
          if [ -d bench/ts ]; then
            mkdir "$RUNNER_TEMP/tsc"
            curl -sS --fail --proto =https --max-time 120 --max-filesize 20000000 https://registry.npmjs.org/typescript/-/typescript-6.0.3.tgz -o "$RUNNER_TEMP/tsc/typescript-6.0.3.tgz"
            got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/tsc/typescript-6.0.3.tgz" | base64 -w0)"
            if [ "$got" != "sha512-y2TvuxSZPDyQakkFRPZHKFm+KKVqIisdg9/CZwm9ftvKXLP8NRWj38/ODjNbr43SsoXqNuAisEf1GdCxqWcdBw==" ]; then
              echo "the type checker's integrity differs: $got"
              exit 1
            fi
            (cd "$RUNNER_TEMP/tsc" && tar -xzf typescript-6.0.3.tgz)
            node "$RUNNER_TEMP/tsc/package/bin/tsc" -p bench/ts
          else
            echo "no port in bench/ts"
          fi
      - name: port ts (only if bench/ts exists)
        run: |
          if [ -d bench/ts ]; then
            (cd bench/ts && node main.ts "$RUNNER_TEMP/fixtures.json") > "$RUNNER_TEMP/ts.json"
            $PY tests/unit/test_export_reference.py --compare "$RUNNER_TEMP/reference.json" "$RUNNER_TEMP/ts.json"
            if (cd bench/ts && node main.ts) > "$RUNNER_TEMP/ts-noarg.txt"; then echo "ts: the port exits 0 with no argument"; false; fi
            test ! -s "$RUNNER_TEMP/ts-noarg.txt"
            (cd bench/ts && node test.ts "$RUNNER_TEMP/fixtures.json" "$RUNNER_TEMP/reference.json")
          else
            echo "no port in bench/ts"
          fi
      - name: port go (only if bench/go exists)
        run: |
          if [ -d bench/go ]; then
            export GOTOOLCHAIN=local GOPROXY=off CGO_ENABLED=0
            mkdir "$RUNNER_TEMP/go"
            (cd bench/go && go vet . && out="$(gofmt -l .)" && test -z "$out" && go build -trimpath -o "$RUNNER_TEMP/go/port.exe" .)
            "$RUNNER_TEMP/go/port.exe" "$RUNNER_TEMP/fixtures.json" > "$RUNNER_TEMP/go.json"
            $PY tests/unit/test_export_reference.py --compare "$RUNNER_TEMP/reference.json" "$RUNNER_TEMP/go.json"
            if "$RUNNER_TEMP/go/port.exe" > "$RUNNER_TEMP/go-noarg.txt"; then echo "go: the port exits 0 with no argument"; false; fi
            test ! -s "$RUNNER_TEMP/go-noarg.txt"
            (cd bench/go && go test -count=1 . -args "$RUNNER_TEMP/fixtures.json" "$RUNNER_TEMP/reference.json")
            (cd bench/go && go vet ./round2 && go build -trimpath -o "$RUNNER_TEMP/go/port2.exe" ./round2)
            "$RUNNER_TEMP/go/port2.exe" "$RUNNER_TEMP/round2-input.json" > "$RUNNER_TEMP/go2.json"
            $PY tests/unit/test_export_reference.py --compare "$RUNNER_TEMP/round2-reference.json" "$RUNNER_TEMP/go2.json"
            if "$RUNNER_TEMP/go/port2.exe" > "$RUNNER_TEMP/go2-noarg.txt"; then echo "go: port2 exits 0 with no argument"; false; fi
            test ! -s "$RUNNER_TEMP/go2-noarg.txt"
            (cd bench/go && go test -count=1 ./round2 -args "$RUNNER_TEMP/round2-input.json" "$RUNNER_TEMP/round2-reference.json")
          else
            echo "no port in bench/go"
          fi
      - name: port rust (only if bench/rust exists)
        run: |
          if [ -d bench/rust ]; then
            export CARGO_NET_OFFLINE=true CARGO_TARGET_DIR="$RUNNER_TEMP/rust"
            cargo --version
            cargo fmt --version
            cargo clippy --version
            (cd bench/rust && cargo fmt --check && cargo clippy --locked --offline --release -- -D warnings && cargo build --locked --offline --release)
            (cd bench/rust && cargo run --locked --offline --release --quiet --bin port -- "$RUNNER_TEMP/fixtures.json") > "$RUNNER_TEMP/rust.json"
            $PY tests/unit/test_export_reference.py --compare "$RUNNER_TEMP/reference.json" "$RUNNER_TEMP/rust.json"
            p="$RUNNER_TEMP/rust/release/port"; if [ -f "$p.exe" ]; then p="$p.exe"; fi
            if "$p" > "$RUNNER_TEMP/rust-noarg.txt"; then echo "rust: the port exits 0 with no argument"; false; fi
            test ! -s "$RUNNER_TEMP/rust-noarg.txt"
            (cd bench/rust && cargo test --locked --offline --release --test port_test -- "$RUNNER_TEMP/fixtures.json" "$RUNNER_TEMP/reference.json")
            (cd bench/rust && cargo run --locked --offline --release --quiet --bin port2 -- "$RUNNER_TEMP/round2-input.json") > "$RUNNER_TEMP/rust2.json"
            $PY tests/unit/test_export_reference.py --compare "$RUNNER_TEMP/round2-reference.json" "$RUNNER_TEMP/rust2.json"
            (cd bench/rust && cargo test --locked --offline --release --test port2_test -- "$RUNNER_TEMP/round2-input.json" "$RUNNER_TEMP/round2-reference.json")
            p2="$RUNNER_TEMP/rust/release/port2"; if [ -f "$p2.exe" ]; then p2="$p2.exe"; fi
            if "$p2" > "$RUNNER_TEMP/rust2-noarg.txt"; then echo "rust: port2 exits 0 with no argument"; false; fi
            test ! -s "$RUNNER_TEMP/rust2-noarg.txt"
          else
            echo "no port in bench/rust"
          fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PY: python
    steps:
      - name: checkout (the pushed commit only, from the public address, no credential)
