          A="$RUNNER_TEMP/aieos-sa"
          python3 -m venv "$A/venv"
          cat > "$A/requirements.txt" <<'PINS'
          bandit==1.9.4 --hash=sha256:f89ffa663767f5a0585ea075f01020207e966a9c0f2b9ef56a57c7963a3f6f8e
          PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc
