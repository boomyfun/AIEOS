# AIEOS: the CI channel (Master Plan M0, docs/plan/master-plan.md), revision 5: the checks the first code task needs
# (decision D-181, option K1), with the conformance runs of M2 (DM A62; decisions D-217 C5 and D-218). Runs on every push
# to any branch and checks every pushed commit. It reads only: it writes nothing to the repository and uses no secret.
# Records: this run's log, its step summary, its annotations and each step's conclusion. Its results are advisory (DM
# A29; C7 is TBD): the job runs code that the pushed commits change, and that code can write to the log, the
# annotations and the conclusions of the steps after it. A code task's commits carry the trailer "AIEOS-Task: <id>";
# their contract is the file docs/tasks/<id>.yaml, added on main by its own commit; the task steps judge only such
# commits. Revision 3 adds: the conformance base run (the runner, the frozen set, the fixtures, the bound scenario file
# and the records, all from the base) and, right after it, the candidate run (the same base inputs with only the head's
# governor files), each written as one annotation; the conformance inputs and the records on GOV-003's list; the pinned
# governor in one place, the job's AIEOS_PINNED_GOVERNOR; and deterministic_rule for module aliases, `from os import`,
# `.replace(...)` with one argument or only the keyword target (Path.replace) and `.chmod`/`.lchmod`.
# Revision 4 (decision D-236 C2; written only on the owner's own yes, DM A61) sets AIEOS_PINNED_GOVERNOR to the first
# governor version, which the owner accepted (DM A64), with what the re-check of revision 3 carried for the pin: the
# conformance runs fail when what later steps read changes while the runner runs (F1); on main they take the runner
# and its inputs from the tip main held before the push, and fail when a push changes the runner or a governor file
# without naming exactly one task, or leaves a governor file other than the pinned version (F5); they fail when the
# run names a governor identity other than the governor file put in place (F7); and the replay step fails on any
# decision record whether or not a version is pinned (F13). Limits: on main the pushed governor file is compared
# with the pin by its hash and not run; the pinned identity is governor.py's hash alone, although the governor's
# decisions also depend on src/aieos_bootstrap/records.py; the deterministic_rule lists and GOV-003's list keep their
# known gaps (docs/Deferred/DEF-0024); a push to main whose head commit names no task gets no conformance run, so the
# pinned check first runs at the next push of a task's commits.
# Revision 5 (decision D-311 C3; written only on the owner's own yes, DM A61) adds, for M3: the Resume Check file
# src/aieos_bootstrap/resume_check.py (TASK-008, not yet written) in the conformance runs: its SHA-256 in the base is
# reported; a run record that names a Resume Check must name that file put in place; on main a push that changes it
# must name exactly one task, as for the runner and the governor; and one value, the job's AIEOS_PINNED_RESUME_CHECK,
# empty until a version is accepted, pins it as AIEOS_PINNED_GOVERNOR pins the governor. GOV-003's list adds the
# test modules (tests/unit/**, tests/integration/**, tests/property/**, tests/run_tests.py) and the dependency files
# (pyproject.toml, setup.cfg, setup.py, requirements*.txt, at any depth), which DM A29 counts as the evaluator. Limits:
# the Resume Check runs in the runner's process, as the governor does; the RC scenarios are NOT_RUN until a Resume
# Check exists and the set file names its fixtures (TASK-005b); the pin can only be set by a later revision, and only
# once the set file names those fixtures, since a pinned base run whose record names no Resume Check fails; the pin
# covers resume_check.py alone, not the modules it imports; the candidate run takes the Resume Check from the base,
# so a task branch that changes resume_check.py is not run against the fixtures before it lands, as for the runner.
name: aieos-checks

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The pinned governor version's content hash (SHA-256 of src/aieos_bootstrap/governor.py; Master Plan section 5
      # points 5 and 6), set by revision 4 to the first version, which the owner accepted (DM A64; the file at commit
      # aa14ae8d). Pinned: the conformance base run fails unless the base's governor file and the run's governor
      # identity have this SHA-256 and the outcome is pass. Empty: no version is pinned, and the base run reports and
      # does not fail on its outcome. The replay step fails on any decision record either way (revision 4). The one
      # place; changing it is the owner's (DM A61, A63).
      AIEOS_PINNED_GOVERNOR: '2f2dcd7525bcc39dcb3539ada93daff428a624cf2c47876c2d17599cf7ec022f'
      # The pinned Resume Check version's content hash (SHA-256 of src/aieos_bootstrap/resume_check.py), revision 5.
      # Empty: no version is pinned; the conformance runs report the file's hash and compare it with the run record, and
      # do not fail on a version. Pinned: the conformance base run fails unless the base's Resume Check file and the run
      # record's resume_check have this SHA-256, and a push to main that changes the file must leave it at this SHA-256.
      # Set it only once the set file names the Resume Check fixtures (TASK-005b): a pinned base run whose record names
      # no Resume Check fails. The one place; changing it is the owner's (DM A61).
      AIEOS_PINNED_RESUME_CHECK: ''
    steps:
      - name: Fetch the pushed commit, its history and main (no third-party action, no token)
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git init -q work
          git -C work fetch -q "$SERVER/$REPO.git" "$SHA"
          git -C work fetch -q "$SERVER/$REPO.git" "+refs/heads/main:refs/remotes/origin/main"
          git -C work checkout -q --detach "$SHA"
          test "$(git -C work rev-parse HEAD)" = "$SHA"
          printf '%s\n' "$BEFORE" > before.txt

      - name: G0 task detection (the contract commit on main)
        if: ${{ !cancelled() }}
        working-directory: work
        shell: python3 {0}
        env:
          AIEOS_ARGS: detect
        run: |
          # AIEOS CI: G0 scope (V0) for a task commit (D-181 P9, C2). Standard library only. Run in the checkout of the pushed
          # commit. Modes (argument, or the environment variable AIEOS_ARGS):
          #   detect: find the task named by the "AIEOS-Task:" trailer of the pushed commits that main does not hold; find its
          #           contract commit C on main (the one
          #           commit that adds docs/tasks/<id>.yaml, changes nothing else, has one parent equal to the contract's
          #           base_commit); print the SHA-256 of the contract bytes read at C (the approval check compares it with the
          #           approved contract_hash); write ../task.json and ../range-base.txt (the task's commits, oldest first, or
          #           empty when there is no task).
          #   scope:  for a task, C is an ancestor of HEAD, and every pushed commit that main does not hold has one parent,
          #           carries the same trailer, and changes only paths that match write_set and no forbidden pattern (patterns
          #           as the risk rules section 2 point 6 define them).
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys

          TRAILER = re.compile(r'^AIEOS-Task: (TASK-[0-9]+)$', re.M)


          def git(*a):
              r = subprocess.run(['git'] + list(a), capture_output=True)
              if r.returncode != 0:
                  raise SystemExit('G0 FAIL: git ' + ' '.join(a) + ': ' + r.stderr.decode('utf-8', 'replace').strip())
              return r.stdout


          def trailer(commit):
              msg = git('log', '-1', '--format=%B', commit).decode('utf-8', 'replace')
              ids = sorted(set(TRAILER.findall(msg)))
              return ids[0] if len(ids) == 1 else (None if not ids else 'MANY')


          def parse_contract(text):
              """The fields G0 needs, from the contract's fixed layout; anything unexpected fails (fail closed)."""
              out = {'task': None, 'base_commit': None, 'write_set': [], 'forbidden': []}
              section = sub = None
              for raw in text.split('\n'):
                  if not raw.strip() or raw.lstrip().startswith('#'):
                      continue
                  indent = len(raw) - len(raw.lstrip(' '))
                  line = raw.strip()
                  if indent == 0:
                      section, sub = line.split(':', 1)[0], None
                      if section == 'task':
                          out['task'] = line.split(':', 1)[1].strip()
                      continue
                  if section == 'input_state' and indent == 2 and line.startswith('base_commit:'):
                      out['base_commit'] = line.split(':', 1)[1].strip()
                  elif section == 'write_set' and indent == 2:
                      sub = line.split(':', 1)[0]
                  elif section == 'write_set' and sub == 'paths' and indent == 4 and line.startswith('- '):
                      out['write_set'].append(line[2:].strip())
                  elif section == 'forbidden' and indent == 2 and line.startswith('- '):
                      out['forbidden'].append(line[2:].strip())
              for k in ('task', 'base_commit'):
                  if not out[k]:
                      raise SystemExit('G0 FAIL: contract field missing: ' + k)
              if not re.fullmatch(r'[0-9a-f]{40}', out['base_commit']):
                  raise SystemExit('G0 FAIL: base_commit is not a full commit id')
              if not out['write_set'] or not out['forbidden']:
                  raise SystemExit('G0 FAIL: contract write_set or forbidden empty or not found')
              return out


          def pattern_re(p):
              """Risk rules section 2 point 6: '*' within one name, '**' any sequence of names; no '/' means a file name anywhere."""
              if '/' not in p:
                  p = '**/' + p
              parts = p.split('/')
              rx = ''
              for i, part in enumerate(parts):
                  last = i == len(parts) - 1
                  if part == '**':
                      rx += '.*' if last else '(?:[^/]+/)*'
                  else:
                      rx += re.escape(part).replace(r'\*', '[^/]*') + ('' if last else '/')
              return re.compile(rx + r'\Z')


          def matches(path, pats):
              return any(pattern_re(p).match(path) for p in pats)


          def detect():
              # every pushed commit that main does not hold; a task is named by the trailer of any of them, so a commit without
              # the trailer on top of task commits cannot hide them (scope then fails that commit)
              ahead = git('rev-list', 'HEAD', '--not', 'refs/remotes/origin/main').decode().split()
              ids = set(trailer(x) for x in ahead) - {None}
              if not ids:
                  json.dump({'task': None}, open('../task.json', 'w'))
                  open('../range-base.txt', 'w').write('')
                  print('G0 detect: no task (no pushed commit outside main carries an AIEOS-Task trailer; commits outside main: %d)' % len(ahead))
                  return 0
              if len(ids) != 1 or 'MANY' in ids:
                  raise SystemExit('G0 FAIL: the pushed commits name more than one task: ' + ', '.join(sorted(ids)))
              tid = ids.pop()
              path = 'docs/tasks/' + tid + '.yaml'
              adds = git('log', '--format=%H', '--diff-filter=A', 'HEAD', '--', path).decode().split()
              if len(adds) != 1:
                  raise SystemExit('G0 FAIL: commits adding %s: %d (expected 1)' % (path, len(adds)))
              c = adds[0]
              if subprocess.run(['git', 'merge-base', '--is-ancestor', c, 'refs/remotes/origin/main']).returncode != 0:
                  raise SystemExit('G0 FAIL: the contract commit is not on main')
              parents = git('log', '-1', '--format=%P', c).decode().split()
              changed = git('diff-tree', '--no-commit-id', '--name-only', '-r', '--no-renames', c).decode().split('\n')
              changed = [x for x in changed if x]
              if len(parents) != 1 or changed != [path]:
                  raise SystemExit('G0 FAIL: the contract commit must have one parent and change only ' + path)
              body = git('show', c + ':' + path)
              k = parse_contract(body.decode('utf-8'))
              if k['task'] != tid or k['base_commit'] != parents[0]:
                  raise SystemExit('G0 FAIL: the contract names task %s and base %s; expected %s and %s' % (k['task'], k['base_commit'], tid, parents[0]))
              sha = hashlib.sha256(body).hexdigest()
              json.dump({'task': tid, 'contract_commit': c, 'base_commit': parents[0], 'contract_sha256': sha,
                         'write_set': k['write_set'], 'forbidden': k['forbidden']}, open('../task.json', 'w'))
              # the task's commits: the pushed commits that main does not hold (D-182 C2 (1)), oldest first
              open('../range-base.txt', 'w').write('\n'.join(reversed(ahead)) + '\n')
              print('G0 detect: task', tid, 'contract commit', c, 'base', parents[0])
              print('G0 contract sha256', sha)
              return 0


          def scope():
              t = json.load(open('../task.json'))
              if t['task'] is None:
                  print('G0 scope: no task')
                  return 0
              c = t['contract_commit']
              # the task's commits are the pushed commits that main does not hold, so a task rebased onto a later main (for
              # example after a session-end records push) is judged on its own commits only (D-182 C2 (1))
              commits = git('rev-list', '--reverse', 'HEAD', '--not', 'refs/remotes/origin/main').decode().split()
              bad = 0
              touched = set()
              if subprocess.run(['git', 'merge-base', '--is-ancestor', c, 'HEAD']).returncode != 0:
                  print('G0 FAIL: the contract commit is not an ancestor of the pushed commit')
                  bad += 1
              for x in commits:
                  if len(git('log', '-1', '--format=%P', x).decode().split()) != 1:
                      print('G0 FAIL: commit %s does not have exactly one parent (no merge in a task)' % x[:12])
                      bad += 1
                  if trailer(x) != t['task']:
                      print('G0 FAIL: commit %s does not carry exactly "AIEOS-Task: %s"' % (x[:12], t['task']))
                      bad += 1
                  names = git('diff-tree', '--no-commit-id', '--name-only', '-r', '--no-renames', '--root', x).decode().split('\n')
                  touched.update(n for n in names if n)
              for p in sorted(touched):
                  if matches(p, t['forbidden']):
                      print('G0 FAIL: forbidden path', p)
                      bad += 1
                  elif not matches(p, t['write_set']):
                      print('G0 FAIL: path outside the write-set', p)
                      bad += 1
              print('G0 scope: task %s, commits %d, paths %d, failures %d' % (t['task'], len(commits), len(touched), bad))
              return 1 if bad or not commits else 0


          if __name__ == '__main__':
              args = sys.argv[1:] or os.environ.get('AIEOS_ARGS', '').split()
              sys.exit({'detect': detect, 'scope': scope}[args[0]]())

      - name: Collect the pushed commits and their changed paths
        if: ${{ !cancelled() }}
        working-directory: work
        run: |
          set -euo pipefail
          BEFORE=$(cat ../before.txt)
          RB=$(cat ../range-base.txt 2>/dev/null || true)
          Z=0000000000000000000000000000000000000000
          if [ -n "$RB" ]; then
            printf '%s\n' "$RB" > ../commits.txt
            WHY="range: the task's commits (the pushed commits that main does not hold)"
          elif [ "$BEFORE" != "$Z" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" HEAD; then
            git rev-list --reverse "$BEFORE..HEAD" > ../commits.txt
            WHY="range: previous tip to pushed commit"
          else
            git rev-parse HEAD > ../commits.txt
            if [ "$BEFORE" = "$Z" ]; then WHY="range: last commit only (new branch)"; else WHY="range: last commit only (previous tip not found or not an ancestor)"; fi
          fi
          EMPTY=$(git hash-object -t tree /dev/null)
          mkdir -p ../c
          : > ../changed-paths.txt
          while read -r C; do
            if git rev-parse -q --verify "${C}^1" >/dev/null; then P="${C}^1"; else P=$EMPTY; fi
            git log -1 --format=%B "$C" > "../c/$C.msg"
            git diff --no-renames --name-only "$P" "$C" > "../c/$C.names"
            { git diff --no-renames -U0 "$P" "$C" | grep -E '^\+' | grep -vE '^\+\+\+ ' || true; } > "../c/$C.added"
            git diff --no-renames --name-status "$P" "$C" | sed "s/^/${C:0:12} /" >> ../changed-paths.txt
          done < ../commits.txt
          {
            echo "## AIEOS checks (advisory)"
            echo "- pushed commit: $(git rev-parse HEAD)"
            echo "- $WHY"
            echo "- commits checked: $(wc -l < ../commits.txt)"
            echo "- changed paths: $(wc -l < ../changed-paths.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
          cat ../changed-paths.txt

      - name: SEC-001 secret scan (tip tree; every commit's message, file names and added lines)
        if: ${{ !cancelled() }}
        working-directory: work
        run: |
          set -uo pipefail
          B='(^|[^A-Za-z0-9_])'
          D='-----'
          PAT="${B}ghp_[A-Za-z0-9]{20,}|${B}github_pat_[A-Za-z0-9_]{20,}|${B}gh[ousr]_[A-Za-z0-9]{20,}|${B}sk-[A-Za-z0-9_-]{20,}|${B}AKIA[0-9A-Z]{16}|${D}BEGIN [A-Z ]*PRIVATE KEY${D}|${B}xox[baprs]-[A-Za-z0-9-]{10,}"
          # Counts, commits and file names only: a match is never printed, so a leaked secret is not copied into the public log.
          F=$(git grep -cE "$PAT" HEAD -- . || true)
          T=$(printf '%s\n' "$F" | grep -c . || true)
          H=0
          L=""
          while read -r C; do
            m=$(grep -cE "$PAT" "../c/$C.msg" || true)
            n=$(grep -cE "$PAT" "../c/$C.names" || true)
            a=$(grep -cE "$PAT" "../c/$C.added" || true)
            if [ $((m + n + a)) -gt 0 ]; then H=$((H + 1)); L="${L}${C:0:12} message lines $m, file names $n, added lines $a"$'\n'; fi
          done < ../commits.txt
          echo "SEC-001 tip tree files with a secret pattern: $T; pushed commits with a hit: $H" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$F" ] && printf '%s\n' "$F" | sed -E 's/^HEAD://' | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$L" ] && printf '%s' "$L" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$T" = 0 ] && [ "$H" = 0 ]

      - name: SEC-002 pattern rules (every commit's added lines)
        if: ${{ !cancelled() }}
        working-directory: work
        run: |
          set -uo pipefail
          H=0
          L=""
          while read -r C; do
            e=$(grep -cE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "../c/$C.added" || true)
            u=$(grep -ciE 'github\.com/' "../c/$C.added" || true)
            if [ $((e + u)) -gt 0 ]; then H=$((H + 1)); L="${L}${C:0:12} e-mail addresses $e, GitHub URLs $u"$'\n'; fi
          done < ../commits.txt
          echo "SEC-002 pushed commits whose added lines hold an e-mail address or a GitHub URL: $H" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$L" ] && printf '%s' "$L" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SEC-002 not checked here: account names (DM A24 exemption) and the list of unrelated projects; they stay with review" >> "$GITHUB_STEP_SUMMARY"
          [ "$H" = 0 ]

      - name: SEC-003 record (changes under .github/)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          G=$(grep -cE '^[0-9a-f]{12} [A-Z][0-9]*[[:space:]]+\.github/' changed-paths.txt || true)
          echo "SEC-003 changed paths under .github/ in the pushed commits: $G (each needs the owner's own yes)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: GOV-003 evaluator paths (reports an evaluator change)
        if: ${{ !cancelled() }}
        shell: python3 {0}
        env:
          AIEOS_ARGS: gov003
        run: |
          # AIEOS CI: two path rules over ../changed-paths.txt (lines "<commit12> <status>\t<path>", written by the collect
          # step), on every push (D-181 C2). Standard library only. Modes (argument, or the environment variable AIEOS_ARGS):
          #   gov003: GOV-003's tool part: a change that touches a pinned evaluator path is reported as an evaluator change
          #           (judged by the base version, never auto-accepted); the step reports and passes. The pinned list is here,
          #           in the workflow, which is itself one of its paths.
          #   ops002: OPS-002's path part: a change to the measurement protocol or the measurements is routed to the owner; the
          #           step fails so that it is seen.
          import os
          import re
          import sys

          EVALUATOR = ['.github/**', 'src/aieos_bootstrap/**', 'tests/conformance/**',
                       'docs/pre-genesis/conformance-scenarios-initial.md', 'docs/records/**',
                       'tests/unit/**', 'tests/integration/**', 'tests/property/**', 'tests/run_tests.py',
                       '**/pyproject.toml', '**/setup.cfg', '**/setup.py', '**/requirements*.txt']
          OWNER_PATHS = ['docs/pre-genesis/measurement-protocol.md', 'docs/pre-genesis/measurements/**']


          def pattern_re(p):
              parts = p.split('/')
              rx = ''
              for i, part in enumerate(parts):
                  last = i == len(parts) - 1
                  if part == '**':
                      rx += '.*' if last else '(?:[^/]+/)*'
                  else:
                      rx += re.escape(part).replace(r'\*', '[^/]*') + ('' if last else '/')
              return re.compile(rx + r'\Z')


          def changed():
              out = []
              for line in open('changed-paths.txt', encoding='utf-8').read().split('\n'):
                  if line.strip():
                      out.append(line.split('\t')[-1])
              return sorted(set(out))


          def main(mode):
              paths = changed()
              pats = EVALUATOR if mode == 'gov003' else OWNER_PATHS
              hits = [p for p in paths if any(pattern_re(q).match(p) for q in pats)]
              if mode == 'gov003':
                  print('GOV-003 evaluator change: %s (%d of %d changed paths)' % ('yes' if hits else 'no', len(hits), len(paths)))
                  for h in hits:
                      print('GOV-003 evaluator path:', h)
                  return 0
              for h in hits:
                  print('OPS-002 FAIL: a change to an owner-kept path, routed to the owner:', h)
              print('OPS-002 paths: %d of %d changed paths are owner-kept' % (len(hits), len(paths)))
              return 1 if hits else 0


          if __name__ == '__main__':
              args = sys.argv[1:] or os.environ.get('AIEOS_ARGS', '').split()
              sys.exit(main(args[0]))

      - name: OPS-002 owner-kept paths
        if: ${{ !cancelled() }}
        shell: python3 {0}
        env:
          AIEOS_ARGS: ops002
        run: |
          # AIEOS CI: two path rules over ../changed-paths.txt (lines "<commit12> <status>\t<path>", written by the collect
          # step), on every push (D-181 C2). Standard library only. Modes (argument, or the environment variable AIEOS_ARGS):
          #   gov003: GOV-003's tool part: a change that touches a pinned evaluator path is reported as an evaluator change
          #           (judged by the base version, never auto-accepted); the step reports and passes. The pinned list is here,
          #           in the workflow, which is itself one of its paths.
          #   ops002: OPS-002's path part: a change to the measurement protocol or the measurements is routed to the owner; the
          #           step fails so that it is seen.
          import os
          import re
          import sys

          EVALUATOR = ['.github/**', 'src/aieos_bootstrap/**', 'tests/conformance/**',
                       'docs/pre-genesis/conformance-scenarios-initial.md', 'docs/records/**',
                       'tests/unit/**', 'tests/integration/**', 'tests/property/**', 'tests/run_tests.py',
                       '**/pyproject.toml', '**/setup.cfg', '**/setup.py', '**/requirements*.txt']
          OWNER_PATHS = ['docs/pre-genesis/measurement-protocol.md', 'docs/pre-genesis/measurements/**']


          def pattern_re(p):
              parts = p.split('/')
              rx = ''
              for i, part in enumerate(parts):
                  last = i == len(parts) - 1
                  if part == '**':
                      rx += '.*' if last else '(?:[^/]+/)*'
                  else:
                      rx += re.escape(part).replace(r'\*', '[^/]*') + ('' if last else '/')
              return re.compile(rx + r'\Z')


          def changed():
              out = []
              for line in open('changed-paths.txt', encoding='utf-8').read().split('\n'):
                  if line.strip():
                      out.append(line.split('\t')[-1])
              return sorted(set(out))


          def main(mode):
              paths = changed()
              pats = EVALUATOR if mode == 'gov003' else OWNER_PATHS
              hits = [p for p in paths if any(pattern_re(q).match(p) for q in pats)]
              if mode == 'gov003':
                  print('GOV-003 evaluator change: %s (%d of %d changed paths)' % ('yes' if hits else 'no', len(hits), len(paths)))
                  for h in hits:
                      print('GOV-003 evaluator path:', h)
                  return 0
              for h in hits:
                  print('OPS-002 FAIL: a change to an owner-kept path, routed to the owner:', h)
              print('OPS-002 paths: %d of %d changed paths are owner-kept' % (len(hits), len(paths)))
              return 1 if hits else 0


          if __name__ == '__main__':
              args = sys.argv[1:] or os.environ.get('AIEOS_ARGS', '').split()
              sys.exit(main(args[0]))

      - name: INV-010 replay
        if: ${{ !cancelled() }}
        working-directory: work
        shell: python3 {0}
        run: |
          # AIEOS CI: replay (INV-010) (D-181 P4). Standard library only. Run in the checkout of the pushed commit, on every push.
          # Counts the decision records in the tree at HEAD: lines of any file named events.jsonl whose type is
          # decision.acceptance or decision.execution. No replay that recomputes a decision record with the pinned governor exists
          # yet, so any decision record fails, whether or not a governor version is pinned (revision 4, decision D-236 C2: the
          # re-check's F13; setting the pin does not open this step); with none, it reports 0 and passes.
          import json
          import os
          import subprocess
          import sys

          PINNED_GOVERNOR = os.environ.get('AIEOS_PINNED_GOVERNOR') or None  # the job's env, the one place (revision 3)


          def main():
              files = [p for p in subprocess.run(['git', 'ls-files'], capture_output=True, check=True).stdout.decode('utf-8').split('\n')
                       if p == 'events.jsonl' or p.endswith('/events.jsonl')]
              n = 0
              for p in files:
                  data = subprocess.run(['git', 'show', 'HEAD:' + p], capture_output=True, check=True).stdout.decode('utf-8', 'replace')
                  for line in data.split('\n'):
                      try:
                          if json.loads(line).get('type') in ('decision.acceptance', 'decision.execution'):
                              n += 1
                      except (ValueError, AttributeError):
                          if 'decision.acceptance' in line or 'decision.execution' in line:
                              n += 1
              print('replay: event logs %d, decision records: %d, pinned governor: %s' % (len(files), n, PINNED_GOVERNOR or 'none'))
              if n:
                  print('replay FAIL: decision records exist and no replay recomputes them yet (pinned or not)')
                  return 1
              return 0


          if __name__ == '__main__':
              sys.exit(main())

      - name: G0 scope (V0)
        if: ${{ !cancelled() }}
        working-directory: work
        shell: python3 {0}
        env:
          AIEOS_ARGS: scope
        run: |
          # AIEOS CI: G0 scope (V0) for a task commit (D-181 P9, C2). Standard library only. Run in the checkout of the pushed
          # commit. Modes (argument, or the environment variable AIEOS_ARGS):
          #   detect: find the task named by the "AIEOS-Task:" trailer of the pushed commits that main does not hold; find its
          #           contract commit C on main (the one
          #           commit that adds docs/tasks/<id>.yaml, changes nothing else, has one parent equal to the contract's
          #           base_commit); print the SHA-256 of the contract bytes read at C (the approval check compares it with the
          #           approved contract_hash); write ../task.json and ../range-base.txt (the task's commits, oldest first, or
          #           empty when there is no task).
          #   scope:  for a task, C is an ancestor of HEAD, and every pushed commit that main does not hold has one parent,
          #           carries the same trailer, and changes only paths that match write_set and no forbidden pattern (patterns
          #           as the risk rules section 2 point 6 define them).
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys

          TRAILER = re.compile(r'^AIEOS-Task: (TASK-[0-9]+)$', re.M)


          def git(*a):
              r = subprocess.run(['git'] + list(a), capture_output=True)
              if r.returncode != 0:
                  raise SystemExit('G0 FAIL: git ' + ' '.join(a) + ': ' + r.stderr.decode('utf-8', 'replace').strip())
              return r.stdout


          def trailer(commit):
              msg = git('log', '-1', '--format=%B', commit).decode('utf-8', 'replace')
              ids = sorted(set(TRAILER.findall(msg)))
              return ids[0] if len(ids) == 1 else (None if not ids else 'MANY')


          def parse_contract(text):
              """The fields G0 needs, from the contract's fixed layout; anything unexpected fails (fail closed)."""
              out = {'task': None, 'base_commit': None, 'write_set': [], 'forbidden': []}
              section = sub = None
              for raw in text.split('\n'):
                  if not raw.strip() or raw.lstrip().startswith('#'):
                      continue
                  indent = len(raw) - len(raw.lstrip(' '))
                  line = raw.strip()
                  if indent == 0:
                      section, sub = line.split(':', 1)[0], None
                      if section == 'task':
                          out['task'] = line.split(':', 1)[1].strip()
                      continue
                  if section == 'input_state' and indent == 2 and line.startswith('base_commit:'):
                      out['base_commit'] = line.split(':', 1)[1].strip()
                  elif section == 'write_set' and indent == 2:
                      sub = line.split(':', 1)[0]
                  elif section == 'write_set' and sub == 'paths' and indent == 4 and line.startswith('- '):
                      out['write_set'].append(line[2:].strip())
                  elif section == 'forbidden' and indent == 2 and line.startswith('- '):
                      out['forbidden'].append(line[2:].strip())
              for k in ('task', 'base_commit'):
                  if not out[k]:
                      raise SystemExit('G0 FAIL: contract field missing: ' + k)
              if not re.fullmatch(r'[0-9a-f]{40}', out['base_commit']):
                  raise SystemExit('G0 FAIL: base_commit is not a full commit id')
              if not out['write_set'] or not out['forbidden']:
                  raise SystemExit('G0 FAIL: contract write_set or forbidden empty or not found')
              return out


          def pattern_re(p):
              """Risk rules section 2 point 6: '*' within one name, '**' any sequence of names; no '/' means a file name anywhere."""
              if '/' not in p:
                  p = '**/' + p
              parts = p.split('/')
              rx = ''
              for i, part in enumerate(parts):
                  last = i == len(parts) - 1
                  if part == '**':
                      rx += '.*' if last else '(?:[^/]+/)*'
                  else:
                      rx += re.escape(part).replace(r'\*', '[^/]*') + ('' if last else '/')
              return re.compile(rx + r'\Z')


          def matches(path, pats):
              return any(pattern_re(p).match(path) for p in pats)


          def detect():
              # every pushed commit that main does not hold; a task is named by the trailer of any of them, so a commit without
              # the trailer on top of task commits cannot hide them (scope then fails that commit)
              ahead = git('rev-list', 'HEAD', '--not', 'refs/remotes/origin/main').decode().split()
              ids = set(trailer(x) for x in ahead) - {None}
              if not ids:
                  json.dump({'task': None}, open('../task.json', 'w'))
                  open('../range-base.txt', 'w').write('')
                  print('G0 detect: no task (no pushed commit outside main carries an AIEOS-Task trailer; commits outside main: %d)' % len(ahead))
                  return 0
              if len(ids) != 1 or 'MANY' in ids:
                  raise SystemExit('G0 FAIL: the pushed commits name more than one task: ' + ', '.join(sorted(ids)))
              tid = ids.pop()
              path = 'docs/tasks/' + tid + '.yaml'
              adds = git('log', '--format=%H', '--diff-filter=A', 'HEAD', '--', path).decode().split()
              if len(adds) != 1:
                  raise SystemExit('G0 FAIL: commits adding %s: %d (expected 1)' % (path, len(adds)))
              c = adds[0]
              if subprocess.run(['git', 'merge-base', '--is-ancestor', c, 'refs/remotes/origin/main']).returncode != 0:
                  raise SystemExit('G0 FAIL: the contract commit is not on main')
              parents = git('log', '-1', '--format=%P', c).decode().split()
              changed = git('diff-tree', '--no-commit-id', '--name-only', '-r', '--no-renames', c).decode().split('\n')
              changed = [x for x in changed if x]
              if len(parents) != 1 or changed != [path]:
                  raise SystemExit('G0 FAIL: the contract commit must have one parent and change only ' + path)
              body = git('show', c + ':' + path)
              k = parse_contract(body.decode('utf-8'))
              if k['task'] != tid or k['base_commit'] != parents[0]:
                  raise SystemExit('G0 FAIL: the contract names task %s and base %s; expected %s and %s' % (k['task'], k['base_commit'], tid, parents[0]))
              sha = hashlib.sha256(body).hexdigest()
              json.dump({'task': tid, 'contract_commit': c, 'base_commit': parents[0], 'contract_sha256': sha,
                         'write_set': k['write_set'], 'forbidden': k['forbidden']}, open('../task.json', 'w'))
              # the task's commits: the pushed commits that main does not hold (D-182 C2 (1)), oldest first
              open('../range-base.txt', 'w').write('\n'.join(reversed(ahead)) + '\n')
              print('G0 detect: task', tid, 'contract commit', c, 'base', parents[0])
              print('G0 contract sha256', sha)
              return 0


          def scope():
              t = json.load(open('../task.json'))
              if t['task'] is None:
                  print('G0 scope: no task')
                  return 0
              c = t['contract_commit']
              # the task's commits are the pushed commits that main does not hold, so a task rebased onto a later main (for
              # example after a session-end records push) is judged on its own commits only (D-182 C2 (1))
              commits = git('rev-list', '--reverse', 'HEAD', '--not', 'refs/remotes/origin/main').decode().split()
              bad = 0
              touched = set()
              if subprocess.run(['git', 'merge-base', '--is-ancestor', c, 'HEAD']).returncode != 0:
                  print('G0 FAIL: the contract commit is not an ancestor of the pushed commit')
                  bad += 1
              for x in commits:
                  if len(git('log', '-1', '--format=%P', x).decode().split()) != 1:
                      print('G0 FAIL: commit %s does not have exactly one parent (no merge in a task)' % x[:12])
                      bad += 1
                  if trailer(x) != t['task']:
                      print('G0 FAIL: commit %s does not carry exactly "AIEOS-Task: %s"' % (x[:12], t['task']))
                      bad += 1
                  names = git('diff-tree', '--no-commit-id', '--name-only', '-r', '--no-renames', '--root', x).decode().split('\n')
                  touched.update(n for n in names if n)
              for p in sorted(touched):
                  if matches(p, t['forbidden']):
                      print('G0 FAIL: forbidden path', p)
                      bad += 1
                  elif not matches(p, t['write_set']):
                      print('G0 FAIL: path outside the write-set', p)
                      bad += 1
              print('G0 scope: task %s, commits %d, paths %d, failures %d' % (t['task'], len(commits), len(touched), bad))
              return 1 if bad or not commits else 0


          if __name__ == '__main__':
              args = sys.argv[1:] or os.environ.get('AIEOS_ARGS', '').split()
              sys.exit({'detect': detect, 'scope': scope}[args[0]]())

      - name: conformance base run (V1; the runner, its inputs and any governor from the base)
        if: ${{ !cancelled() }}
        working-directory: work
        shell: python3 {0}
        env:
          AIEOS_ARGS: base
        run: |
          # AIEOS CI: the conformance runs (V1) of revision 3 (DM A62; decisions D-217 C5 and D-218), with the changes of
          # revision 4 (decision D-236 C2: the re-check's F1, F5 (b), F5 (c) and F7). Standard library only. Run in the checkout
          # of the pushed commit, after G0 detect, which wrote ../task.json. Modes (argument, or the environment variable
          # AIEOS_ARGS):
          #   base:      the runner of TASK-003 runs from the base over the base, extracted from Git into ../conformance-base. The
          #              base and the run's task: for a push to main, the tip that main held before the push (../before.txt, the
          #              first step's record of the push; revision 4, F5 (c): as governor-spec section 7 takes the pinned
          #              governor from the base, the runner and its inputs never come from the pushed commits on main), which
          #              must be a commit id, not all zeros, and an ancestor of the pushed commit (GITHUB_SHA), else the step
          #              fails, on every push to main, with a task or not, because F5 (b) needs that tip; and the task named by
          #              the one AIEOS-Task trailer line of the pushed head commit, with no run when it has none or more than
          #              one, except that a push whose commits change the runner or a file of GOVERNOR_FILES must have exactly
          #              one such line, else the step fails (revision 4, F5 (b)), and, with a version pinned, must leave the
          #              governor file with the pinned SHA-256, else the step fails (as revision 3's run on the pushed commit
          #              did); for any other branch, main as the first step fetched it (refs/remotes/origin/main) and the task
          #              that G0 detect found, with no run when there is none. On main the run is therefore the base's, and the
          #              pushed governor file is not run there: only its hash is compared with the pin; when it came through a
          #              task branch it was run there as a candidate. Limits: the trailer is read from the head commit only, so
          #              an earlier commit of the push may belong to another task; the notice names the base and the pushed
          #              head. The runner, the frozen set, the fixtures, the bound scenario file, the records and the records
          #              module, and the governor if one exists, all come from the base. Whether a governor exists is decided
          #              from the base tree. With no governor version pinned (the job's
          #              AIEOS_PINNED_GOVERNOR is empty) the step reports and does not fail on the run's outcome; with one pinned,
          #              the base's governor file and the run's governor identity must have that SHA-256 and the outcome must be
          #              pass. This step runs before any step that runs code from the pushed commits.
          #   candidate: on a branch other than main, for a task whose commits change a file of GOVERNOR_FILES, the same base
          #              inputs with only the head's governor files put in their place (../conformance-candidate). It is a
          #              candidate run, advisory (DM A29; governor-spec section 10), never the pinned governor's run; it reports
          #              and does not fail on its outcome. It runs right after the base run, so that its inputs are read before
          #              any other step runs code from the pushed commits. Limits: the candidate governor runs in the runner's
          #              process and as the same user as the step, so it can change what the runner prints, write to the step's
          #              log directly, and decide whether this step passes or fails; a governor that prints to standard output or
          #              exits early gives no run record and fails this step; a governor that imports a module that only the head
          #              has fails to load (the runner's FAILED), because only GOVERNOR_FILES come from the head; the record line
          #              names the head commit, and only the annotation says it is a candidate run. Its run counts only together
          #              with the reviews and the deterministic rules (which refuse the forms they list; an accident filter, not a
          #              containment), never alone. The later steps also run code from the pushed commits and can change what
          #              any later step prints, including annotations (DM A29).
          #   Both modes fail the step when the runner gives no run record: exit 2, a crash, a timeout, or output that is not one
          #   record with its text and checked values (outcome, counts, governor identity, commit, task, scenario ids and results).
          #   Both modes also fail it (revision 4, F7) when the run names a governor identity that is neither none nor the SHA-256
          #   of the governor file the step put in place (the base's in base mode, the head's in candidate mode); the runner names
          #   none when the governor is absent or fails to load, which stays report-only as in revision 3, and a pinned base run
          #   then still fails at the pin comparison. And (revision 4, F1) when, after the runner has ended, any of these differs
          #   from what it was just before the runner started: the files ../task.json, ../range-base.txt, ../commits.txt,
          #   ../changed-paths.txt and ../before.txt, the files named by GITHUB_ENV and GITHUB_PATH (through which a step can set
          #   the environment and the search path of the steps after it), and the commits of HEAD and refs/remotes/origin/main.
          #   Limits: only these are watched (not, for example, the git directory of the checkout, its configuration or replace
          #   refs, the working tree, or GITHUB_OUTPUT, GITHUB_STATE and GITHUB_STEP_SUMMARY); the check detects and does not undo,
          #   so a changed file stays in place and the later steps run on it, and only this step's failure shows it; a detached
          #   grandchild of the runner that writes after the runner has ended escapes the check.
          #   The result is one annotation (a notice) per run, built only from checked values; the runner's raw output is printed
          #   only between stop-commands markers with a random token, opened before the runner starts and closed in every case;
          #   every annotation value is escaped (%, CR, LF).
          #   Revision 5 (decision D-311 C3): the Resume Check file (RESUME_CHECK_FILE) is put in place from the base in both
          #   modes; its SHA-256 is in the notice; the step fails when the run record's resume_check (present only when a
          #   Resume Check scenario has a fixture) names another path or a SHA-256 other than none or that file's; on main a
          #   push that changes it is treated as one that changes the runner (exactly one task), and, with a version pinned in
          #   AIEOS_PINNED_RESUME_CHECK, must leave it at that version; and a base run with a version pinned fails unless the
          #   base's file and the run's resume_check both have that SHA-256. Empty, it changes no outcome.
          import hashlib
          import json
          import os
          import re
          import secrets
          import subprocess
          import sys

          RUNNER = 'src/aieos_bootstrap/conformance.py'
          GOVERNOR_FILES = ['src/aieos_bootstrap/governor.py']
          PINNED = os.environ.get('AIEOS_PINNED_GOVERNOR', '')
          RESUME_CHECK_FILE = 'src/aieos_bootstrap/resume_check.py'
          PINNED_RC = os.environ.get('AIEOS_PINNED_RESUME_CHECK', '')
          HEX = re.compile(r'[0-9a-f]{64}')
          COMMIT_ID = re.compile(r'[0-9a-f]{40}')
          WATCHED = ['../task.json', '../range-base.txt', '../commits.txt', '../changed-paths.txt', '../before.txt']
          TRAILER = re.compile(r'^AIEOS-Task: (TASK-[0-9]+)$', re.M)
          SCENARIO = re.compile(r'[A-Z]{2,5}-[0-9]{2,3}')
          RESULTS = ('PASS', 'FAIL', 'NOT_RUN')
          MAX_RESULTS = 64
          MAX_OUT = 4 * 1024 * 1024
          SHOW = 256 * 1024


          def git(*a):
              return subprocess.run(['git'] + list(a), capture_output=True, check=True).stdout


          def blob(commit, path):
              p = subprocess.run(['git', 'show', commit + ':' + path], capture_output=True)
              return p.stdout if p.returncode == 0 else None


          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')


          def extract(commit, dest):
              os.makedirs(dest)
              subprocess.run(['tar', '-x', '-f', '-', '-C', dest], input=git('archive', '--format=tar', commit), check=True)


          def snapshot():
              # Revision 4 (the re-check's F1): only these files and refs, taken just before the runner starts and compared after
              # it ends; a file that cannot be read is recorded as absent. It detects; it does not undo.
              seen = {}
              for p in WATCHED + [os.environ[k] for k in ('GITHUB_ENV', 'GITHUB_PATH') if os.environ.get(k)]:
                  try:
                      with open(p, 'rb') as f:
                          seen[p] = hashlib.sha256(f.read()).hexdigest()
                  except OSError:
                      seen[p] = 'absent'
              seen['HEAD refs/remotes/origin/main'] = git('rev-parse', 'HEAD', 'refs/remotes/origin/main').decode().split()
              return seen


          def run_runner(root, commit, task):
              # The stop-commands block opens before the runner starts, so a child that never learns the token cannot end it, and
              # it is closed in every case. The output shown is cut at SHOW bytes per stream; a timeout gives no run record.
              env = {'PATH': os.environ.get('PATH', '/usr/bin:/bin'), 'PYTHONPATH': os.path.join(root, 'src'),
                     'PYTHONDONTWRITEBYTECODE': '1', 'PYTHONIOENCODING': 'utf-8', 'LANG': 'C.UTF-8'}
              token = secrets.token_hex(16)
              print('::stop-commands::' + token)
              sys.stdout.flush()
              rc, out = None, b''
              try:
                  try:
                      p = subprocess.run([sys.executable, os.path.join(root, RUNNER), root, commit, task], capture_output=True,
                                         env=env, cwd=root, timeout=300)
                  except subprocess.TimeoutExpired:
                      print('runner timed out after 300 seconds')
                  else:
                      rc, out = p.returncode, p.stdout
                      print('runner exit %d' % rc)
                      for data in (p.stdout, p.stderr):
                          sys.stdout.write(data[:SHOW].decode('utf-8', 'replace'))
                          if len(data) > SHOW:
                              print('\n[%d more bytes not shown]' % (len(data) - SHOW))
                      print('')
              finally:
                  print('::' + token + '::')
                  sys.stdout.flush()
              return rc, out


          def valid(value, record, commit, task):
              # Every value that is printed or compared is checked here first: a candidate governor runs in the runner's process
              # and can print a record of its own, so nothing from the output is trusted by its form alone (way-2 review, F1).
              results = value.get('results')
              gid = value.get('governor_identity')
              return (record.get('outcome') in ('pass', 'fail') and isinstance(value.get('counts'), bool)
                      and (gid is None or (isinstance(gid, str) and HEX.fullmatch(gid) is not None))
                      and value.get('commit') == commit and record.get('commit') == commit and record.get('subject') == task
                      and isinstance(results, list) and 0 < len(results) <= MAX_RESULTS
                      and all(isinstance(r, dict) and isinstance(r.get('id'), str) and SCENARIO.fullmatch(r['id']) is not None
                              and r.get('result') in RESULTS for r in results))


          def parse(out, commit, task):
              # The runner prints the run record's text (canonical JSON, ending with LF) and then its record (one JSON line). A
              # CRLF from a Windows dry run is read as LF; the JSON text holds no raw CR.
              if len(out) > MAX_OUT:
                  return None
              out = out.replace(b'\r\n', b'\n')
              if not out.endswith(b'\n'):
                  return None
              body = out[:-1]
              i = body.rfind(b'\n')
              if i < 0:
                  return None
              text, last = body[:i + 1], body[i + 1:]
              try:
                  value = json.loads(text.decode('utf-8'))
                  record = json.loads(last.decode('utf-8'))
              except ValueError:
                  return None
              if not (isinstance(value, dict) and isinstance(record, dict) and isinstance(value.get('results'), list)):
                  return None
              digest = hashlib.sha256(text).hexdigest()
              if record.get('refers_to') != digest or record.get('record_id') != 'conformance-run-' + digest:
                  return None
              if not valid(value, record, commit, task):
                  return None
              return value, record


          def annotate(kind, title, msg):
              print('::%s title=%s::%s' % (kind, title, esc(msg)))


          def fail(title, msg):
              annotate('error', title, msg)
              print(title + ' FAIL: ' + msg)
              return 1


          def main(mode):
              title = 'conformance %s run' % mode
              head = git('rev-parse', 'HEAD').decode().strip()
              on_main = os.environ.get('GITHUB_REF') == 'refs/heads/main'
              if on_main:
                  if mode == 'candidate':
                      print('conformance candidate run: a push to main; no candidate run')
                      return 0
                  if os.environ.get('GITHUB_SHA') != head:
                      return fail(title, 'the checkout is not the pushed commit')
                  named = TRAILER.findall(git('log', '-1', '--format=%B', head).decode('utf-8', 'replace'))
                  try:
                      with open('../before.txt', encoding='utf-8') as f:
                          before = f.read().strip()
                  except OSError:
                      before = ''
                  ancestor = COMMIT_ID.fullmatch(before) is not None and before != '0' * 40 and subprocess.run(
                      ['git', 'merge-base', '--is-ancestor', before, head], capture_output=True).returncode == 0
                  if not ancestor:
                      shown = before if COMMIT_ID.fullmatch(before) else 'unreadable or not a commit id'
                      return fail(title, 'the tip main held before the push (%s) is not a commit id that is an ancestor of the '
                                         'pushed commit' % shown)
                  touched = git('diff', '--name-only', before, head, '--', RUNNER, *GOVERNOR_FILES,
                                RESUME_CHECK_FILE).decode('utf-8', 'replace')
                  touched = touched.split()
                  if touched and len(named) != 1:
                      return fail(title, 'the push changes %s and its head commit has %d trailer lines' % (
                          ', '.join(touched), len(named)))
                  pushed_gov = blob(head, GOVERNOR_FILES[0])
                  pushed_sha = hashlib.sha256(pushed_gov).hexdigest() if pushed_gov is not None else 'absent'
                  if PINNED and GOVERNOR_FILES[0] in touched and pushed_sha != PINNED:
                      return fail(title, 'the push leaves the governor file %s, not the pinned version %s' % (pushed_sha, PINNED))
                  pushed_rc = blob(head, RESUME_CHECK_FILE)
                  pushed_rc_sha = hashlib.sha256(pushed_rc).hexdigest() if pushed_rc is not None else 'absent'
                  if PINNED_RC and RESUME_CHECK_FILE in touched and pushed_rc_sha != PINNED_RC:
                      return fail(title, 'the push leaves the Resume Check file %s, not the pinned version %s' % (
                          pushed_rc_sha, PINNED_RC))
                  if len(named) != 1:
                      print('conformance base run: a push to main whose head commit has %d trailer lines; no run' % len(named))
                      return 0
                  task, base = named[0], before
              else:
                  task = json.load(open('../task.json'))['task']
                  if task is None:
                      print('conformance %s run: no task' % mode)
                      return 0
                  base = git('rev-parse', 'refs/remotes/origin/main').decode().strip()
              gov = blob(base, GOVERNOR_FILES[0])
              runner_blob = blob(base, RUNNER)
              runner_sha = hashlib.sha256(runner_blob).hexdigest() if runner_blob is not None else None
              gov_sha = hashlib.sha256(gov).hexdigest() if gov is not None else 'absent'
              rc_file = blob(base, RESUME_CHECK_FILE)
              rc_sha = hashlib.sha256(rc_file).hexdigest() if rc_file is not None else 'absent'
              if mode == 'base':
                  root, commit, note = os.path.abspath('../conformance-base'), base, 'base %s' % base
                  if on_main:
                      note = 'base %s (the tip main held before the push of %s)' % (base, head)
                  extract(base, root)
              else:
                  changed = [f for f in GOVERNOR_FILES if blob('HEAD', f) != blob(base, f)]
                  if not changed:
                      print('conformance candidate run: no governor file changed by the pushed commits; no candidate run')
                      return 0
                  root, commit = os.path.abspath('../conformance-candidate'), head
                  extract(base, root)
                  for f in GOVERNOR_FILES:
                      data, target = blob('HEAD', f), os.path.join(root, f)
                      inside = os.path.realpath(os.path.dirname(target)).startswith(os.path.realpath(root) + os.sep)
                      if os.path.islink(target) or not inside:
                          return fail(title, 'the place of a governor file in the base is a link or outside the tree: %s' % f)
                      if data is None:
                          if os.path.exists(target):
                              os.remove(target)
                      else:
                          with open(target, 'wb') as w:
                              w.write(data)
                  note = 'candidate: the inputs of base %s with the governor files of %s (%s); advisory' % (base, head, ', '.join(changed))
              if mode == 'base':
                  placed = gov_sha if gov is not None else None
              else:
                  head_gov = blob('HEAD', GOVERNOR_FILES[0])
                  placed = hashlib.sha256(head_gov).hexdigest() if head_gov is not None else None
              watched = snapshot()
              rc, out = run_runner(root, commit, task)
              moved = sorted(k for k, v in snapshot().items() if watched.get(k) != v)
              if moved:
                  return fail(title, 'changed while the runner ran: %s; %s' % (', '.join(moved), note))
              parsed = parse(out, commit, task)
              if rc not in (0, 1) or parsed is None:
                  return fail(title, 'no run record (runner exit %s); %s' % (rc, note))
              value, record = parsed
              if (rc == 0) != (record['outcome'] == 'pass'):
                  return fail(title, 'runner exit %d and outcome %s disagree; %s' % (rc, record['outcome'], note))
              if not (isinstance(value.get('runner'), dict) and value['runner'].get('sha256') == runner_sha):
                  return fail(title, 'the run record does not name the base runner; %s' % note)
              if value.get('governor_identity') not in (placed, None):
                  return fail(title, 'the run names governor %s, not the governor file put in place (%s); %s' % (
                      value['governor_identity'], placed or 'none', note))
              rc_run = value.get('resume_check')
              rc_placed = rc_sha if rc_file is not None else None
              if rc_run is not None and not (isinstance(rc_run, dict) and rc_run.get('path') == RESUME_CHECK_FILE
                                             and 'sha256' in rc_run and rc_run['sha256'] in (None, rc_placed)):
                  return fail(title, 'the run names a Resume Check other than the file put in place (%s); %s' % (
                      rc_placed or 'none', note))
              rc_named = 'not used' if rc_run is None else (rc_run.get('sha256') or 'none')
              results = ', '.join('%s %s' % (r['id'], r['result']) for r in value['results'])
              report_only = mode == 'candidate' or not PINNED
              msg = ('outcome %s; counts %s; record %s; commit %s; task %s; governor %s; base governor file %s; resume check %s; '
                     'base resume check file %s; %s; %s; %s; results: %s') % (
                  record['outcome'], value['counts'], record['record_id'], commit, task, value['governor_identity'],
                  gov_sha, rc_named, rc_sha, note, 'report only' if report_only else 'pinned governor %s' % PINNED,
                  'pinned resume check %s' % PINNED_RC if PINNED_RC else 'no resume check pinned', results)
              annotate('notice', title, msg)
              print('%s: outcome %s, record %s' % (title, record['outcome'], record['record_id']))
              if mode == 'base' and gov is None and any(r['result'] == 'PASS' for r in value['results']):
                  return fail(title, 'a PASS with no governor in the base')
              if mode == 'base' and PINNED_RC and (rc_sha != PINNED_RC or rc_named != PINNED_RC):
                  return fail(title, 'the base Resume Check (file %s, run %s) is not the pinned version %s' % (
                      rc_sha, rc_named, PINNED_RC))
              if report_only:
                  return 0
              if gov_sha != PINNED or value['governor_identity'] != PINNED:
                  return fail(title, 'the base governor (file %s, run %s) is not the pinned version %s' % (
                      gov_sha, value['governor_identity'], PINNED))
              if record['outcome'] != 'pass':
                  return fail(title, 'outcome %s with the pinned governor' % record['outcome'])
              return 0


          if __name__ == '__main__':
              args = sys.argv[1:] or os.environ.get('AIEOS_ARGS', '').split()
              sys.exit(main(args[0]))

      - name: conformance candidate run (advisory; the base inputs with the head's governor files)
        if: ${{ !cancelled() }}
        working-directory: work
        shell: python3 {0}
        env:
          AIEOS_ARGS: candidate
        run: |
          # AIEOS CI: the conformance runs (V1) of revision 3 (DM A62; decisions D-217 C5 and D-218), with the changes of
          # revision 4 (decision D-236 C2: the re-check's F1, F5 (b), F5 (c) and F7). Standard library only. Run in the checkout
          # of the pushed commit, after G0 detect, which wrote ../task.json. Modes (argument, or the environment variable
          # AIEOS_ARGS):
          #   base:      the runner of TASK-003 runs from the base over the base, extracted from Git into ../conformance-base. The
          #              base and the run's task: for a push to main, the tip that main held before the push (../before.txt, the
          #              first step's record of the push; revision 4, F5 (c): as governor-spec section 7 takes the pinned
          #              governor from the base, the runner and its inputs never come from the pushed commits on main), which
          #              must be a commit id, not all zeros, and an ancestor of the pushed commit (GITHUB_SHA), else the step
          #              fails, on every push to main, with a task or not, because F5 (b) needs that tip; and the task named by
          #              the one AIEOS-Task trailer line of the pushed head commit, with no run when it has none or more than
          #              one, except that a push whose commits change the runner or a file of GOVERNOR_FILES must have exactly
          #              one such line, else the step fails (revision 4, F5 (b)), and, with a version pinned, must leave the
          #              governor file with the pinned SHA-256, else the step fails (as revision 3's run on the pushed commit
          #              did); for any other branch, main as the first step fetched it (refs/remotes/origin/main) and the task
          #              that G0 detect found, with no run when there is none. On main the run is therefore the base's, and the
          #              pushed governor file is not run there: only its hash is compared with the pin; when it came through a
          #              task branch it was run there as a candidate. Limits: the trailer is read from the head commit only, so
          #              an earlier commit of the push may belong to another task; the notice names the base and the pushed
          #              head. The runner, the frozen set, the fixtures, the bound scenario file, the records and the records
          #              module, and the governor if one exists, all come from the base. Whether a governor exists is decided
          #              from the base tree. With no governor version pinned (the job's
          #              AIEOS_PINNED_GOVERNOR is empty) the step reports and does not fail on the run's outcome; with one pinned,
          #              the base's governor file and the run's governor identity must have that SHA-256 and the outcome must be
          #              pass. This step runs before any step that runs code from the pushed commits.
          #   candidate: on a branch other than main, for a task whose commits change a file of GOVERNOR_FILES, the same base
          #              inputs with only the head's governor files put in their place (../conformance-candidate). It is a
          #              candidate run, advisory (DM A29; governor-spec section 10), never the pinned governor's run; it reports
          #              and does not fail on its outcome. It runs right after the base run, so that its inputs are read before
          #              any other step runs code from the pushed commits. Limits: the candidate governor runs in the runner's
          #              process and as the same user as the step, so it can change what the runner prints, write to the step's
          #              log directly, and decide whether this step passes or fails; a governor that prints to standard output or
          #              exits early gives no run record and fails this step; a governor that imports a module that only the head
          #              has fails to load (the runner's FAILED), because only GOVERNOR_FILES come from the head; the record line
          #              names the head commit, and only the annotation says it is a candidate run. Its run counts only together
          #              with the reviews and the deterministic rules (which refuse the forms they list; an accident filter, not a
          #              containment), never alone. The later steps also run code from the pushed commits and can change what
          #              any later step prints, including annotations (DM A29).
          #   Both modes fail the step when the runner gives no run record: exit 2, a crash, a timeout, or output that is not one
          #   record with its text and checked values (outcome, counts, governor identity, commit, task, scenario ids and results).
          #   Both modes also fail it (revision 4, F7) when the run names a governor identity that is neither none nor the SHA-256
          #   of the governor file the step put in place (the base's in base mode, the head's in candidate mode); the runner names
          #   none when the governor is absent or fails to load, which stays report-only as in revision 3, and a pinned base run
          #   then still fails at the pin comparison. And (revision 4, F1) when, after the runner has ended, any of these differs
          #   from what it was just before the runner started: the files ../task.json, ../range-base.txt, ../commits.txt,
          #   ../changed-paths.txt and ../before.txt, the files named by GITHUB_ENV and GITHUB_PATH (through which a step can set
          #   the environment and the search path of the steps after it), and the commits of HEAD and refs/remotes/origin/main.
          #   Limits: only these are watched (not, for example, the git directory of the checkout, its configuration or replace
          #   refs, the working tree, or GITHUB_OUTPUT, GITHUB_STATE and GITHUB_STEP_SUMMARY); the check detects and does not undo,
          #   so a changed file stays in place and the later steps run on it, and only this step's failure shows it; a detached
          #   grandchild of the runner that writes after the runner has ended escapes the check.
          #   The result is one annotation (a notice) per run, built only from checked values; the runner's raw output is printed
          #   only between stop-commands markers with a random token, opened before the runner starts and closed in every case;
          #   every annotation value is escaped (%, CR, LF).
          #   Revision 5 (decision D-311 C3): the Resume Check file (RESUME_CHECK_FILE) is put in place from the base in both
          #   modes; its SHA-256 is in the notice; the step fails when the run record's resume_check (present only when a
          #   Resume Check scenario has a fixture) names another path or a SHA-256 other than none or that file's; on main a
          #   push that changes it is treated as one that changes the runner (exactly one task), and, with a version pinned in
          #   AIEOS_PINNED_RESUME_CHECK, must leave it at that version; and a base run with a version pinned fails unless the
          #   base's file and the run's resume_check both have that SHA-256. Empty, it changes no outcome.
          import hashlib
          import json
          import os
          import re
          import secrets
          import subprocess
          import sys

          RUNNER = 'src/aieos_bootstrap/conformance.py'
          GOVERNOR_FILES = ['src/aieos_bootstrap/governor.py']
          PINNED = os.environ.get('AIEOS_PINNED_GOVERNOR', '')
          RESUME_CHECK_FILE = 'src/aieos_bootstrap/resume_check.py'
          PINNED_RC = os.environ.get('AIEOS_PINNED_RESUME_CHECK', '')
          HEX = re.compile(r'[0-9a-f]{64}')
          COMMIT_ID = re.compile(r'[0-9a-f]{40}')
          WATCHED = ['../task.json', '../range-base.txt', '../commits.txt', '../changed-paths.txt', '../before.txt']
          TRAILER = re.compile(r'^AIEOS-Task: (TASK-[0-9]+)$', re.M)
          SCENARIO = re.compile(r'[A-Z]{2,5}-[0-9]{2,3}')
          RESULTS = ('PASS', 'FAIL', 'NOT_RUN')
          MAX_RESULTS = 64
          MAX_OUT = 4 * 1024 * 1024
          SHOW = 256 * 1024


          def git(*a):
              return subprocess.run(['git'] + list(a), capture_output=True, check=True).stdout


          def blob(commit, path):
              p = subprocess.run(['git', 'show', commit + ':' + path], capture_output=True)
              return p.stdout if p.returncode == 0 else None


          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')


          def extract(commit, dest):
              os.makedirs(dest)
              subprocess.run(['tar', '-x', '-f', '-', '-C', dest], input=git('archive', '--format=tar', commit), check=True)


          def snapshot():
              # Revision 4 (the re-check's F1): only these files and refs, taken just before the runner starts and compared after
              # it ends; a file that cannot be read is recorded as absent. It detects; it does not undo.
              seen = {}
              for p in WATCHED + [os.environ[k] for k in ('GITHUB_ENV', 'GITHUB_PATH') if os.environ.get(k)]:
                  try:
                      with open(p, 'rb') as f:
                          seen[p] = hashlib.sha256(f.read()).hexdigest()
                  except OSError:
                      seen[p] = 'absent'
              seen['HEAD refs/remotes/origin/main'] = git('rev-parse', 'HEAD', 'refs/remotes/origin/main').decode().split()
              return seen


          def run_runner(root, commit, task):
              # The stop-commands block opens before the runner starts, so a child that never learns the token cannot end it, and
              # it is closed in every case. The output shown is cut at SHOW bytes per stream; a timeout gives no run record.
              env = {'PATH': os.environ.get('PATH', '/usr/bin:/bin'), 'PYTHONPATH': os.path.join(root, 'src'),
                     'PYTHONDONTWRITEBYTECODE': '1', 'PYTHONIOENCODING': 'utf-8', 'LANG': 'C.UTF-8'}
              token = secrets.token_hex(16)
              print('::stop-commands::' + token)
              sys.stdout.flush()
              rc, out = None, b''
              try:
                  try:
                      p = subprocess.run([sys.executable, os.path.join(root, RUNNER), root, commit, task], capture_output=True,
                                         env=env, cwd=root, timeout=300)
                  except subprocess.TimeoutExpired:
                      print('runner timed out after 300 seconds')
                  else:
                      rc, out = p.returncode, p.stdout
                      print('runner exit %d' % rc)
                      for data in (p.stdout, p.stderr):
                          sys.stdout.write(data[:SHOW].decode('utf-8', 'replace'))
                          if len(data) > SHOW:
                              print('\n[%d more bytes not shown]' % (len(data) - SHOW))
                      print('')
              finally:
                  print('::' + token + '::')
                  sys.stdout.flush()
              return rc, out


          def valid(value, record, commit, task):
              # Every value that is printed or compared is checked here first: a candidate governor runs in the runner's process
              # and can print a record of its own, so nothing from the output is trusted by its form alone (way-2 review, F1).
              results = value.get('results')
              gid = value.get('governor_identity')
              return (record.get('outcome') in ('pass', 'fail') and isinstance(value.get('counts'), bool)
                      and (gid is None or (isinstance(gid, str) and HEX.fullmatch(gid) is not None))
                      and value.get('commit') == commit and record.get('commit') == commit and record.get('subject') == task
                      and isinstance(results, list) and 0 < len(results) <= MAX_RESULTS
                      and all(isinstance(r, dict) and isinstance(r.get('id'), str) and SCENARIO.fullmatch(r['id']) is not None
                              and r.get('result') in RESULTS for r in results))


          def parse(out, commit, task):
              # The runner prints the run record's text (canonical JSON, ending with LF) and then its record (one JSON line). A
              # CRLF from a Windows dry run is read as LF; the JSON text holds no raw CR.
              if len(out) > MAX_OUT:
                  return None
              out = out.replace(b'\r\n', b'\n')
              if not out.endswith(b'\n'):
                  return None
              body = out[:-1]
              i = body.rfind(b'\n')
              if i < 0:
                  return None
              text, last = body[:i + 1], body[i + 1:]
              try:
                  value = json.loads(text.decode('utf-8'))
                  record = json.loads(last.decode('utf-8'))
              except ValueError:
                  return None
              if not (isinstance(value, dict) and isinstance(record, dict) and isinstance(value.get('results'), list)):
                  return None
              digest = hashlib.sha256(text).hexdigest()
              if record.get('refers_to') != digest or record.get('record_id') != 'conformance-run-' + digest:
                  return None
              if not valid(value, record, commit, task):
                  return None
              return value, record


          def annotate(kind, title, msg):
              print('::%s title=%s::%s' % (kind, title, esc(msg)))


          def fail(title, msg):
              annotate('error', title, msg)
              print(title + ' FAIL: ' + msg)
              return 1


          def main(mode):
              title = 'conformance %s run' % mode
              head = git('rev-parse', 'HEAD').decode().strip()
              on_main = os.environ.get('GITHUB_REF') == 'refs/heads/main'
              if on_main:
                  if mode == 'candidate':
                      print('conformance candidate run: a push to main; no candidate run')
                      return 0
                  if os.environ.get('GITHUB_SHA') != head:
                      return fail(title, 'the checkout is not the pushed commit')
                  named = TRAILER.findall(git('log', '-1', '--format=%B', head).decode('utf-8', 'replace'))
                  try:
                      with open('../before.txt', encoding='utf-8') as f:
                          before = f.read().strip()
                  except OSError:
                      before = ''
                  ancestor = COMMIT_ID.fullmatch(before) is not None and before != '0' * 40 and subprocess.run(
                      ['git', 'merge-base', '--is-ancestor', before, head], capture_output=True).returncode == 0
                  if not ancestor:
                      shown = before if COMMIT_ID.fullmatch(before) else 'unreadable or not a commit id'
                      return fail(title, 'the tip main held before the push (%s) is not a commit id that is an ancestor of the '
                                         'pushed commit' % shown)
                  touched = git('diff', '--name-only', before, head, '--', RUNNER, *GOVERNOR_FILES,
                                RESUME_CHECK_FILE).decode('utf-8', 'replace')
                  touched = touched.split()
                  if touched and len(named) != 1:
                      return fail(title, 'the push changes %s and its head commit has %d trailer lines' % (
                          ', '.join(touched), len(named)))
                  pushed_gov = blob(head, GOVERNOR_FILES[0])
                  pushed_sha = hashlib.sha256(pushed_gov).hexdigest() if pushed_gov is not None else 'absent'
                  if PINNED and GOVERNOR_FILES[0] in touched and pushed_sha != PINNED:
                      return fail(title, 'the push leaves the governor file %s, not the pinned version %s' % (pushed_sha, PINNED))
                  pushed_rc = blob(head, RESUME_CHECK_FILE)
                  pushed_rc_sha = hashlib.sha256(pushed_rc).hexdigest() if pushed_rc is not None else 'absent'
                  if PINNED_RC and RESUME_CHECK_FILE in touched and pushed_rc_sha != PINNED_RC:
                      return fail(title, 'the push leaves the Resume Check file %s, not the pinned version %s' % (
                          pushed_rc_sha, PINNED_RC))
                  if len(named) != 1:
                      print('conformance base run: a push to main whose head commit has %d trailer lines; no run' % len(named))
                      return 0
                  task, base = named[0], before
              else:
                  task = json.load(open('../task.json'))['task']
