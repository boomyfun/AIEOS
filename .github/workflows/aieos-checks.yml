      - name: deterministic_rule (INV-001, INV-002, INV-004)
        if: ${{ !cancelled() }}
        working-directory: work
        shell: python3 {0}
        run: |
          # AIEOS CI: deterministic_rule, the tool parts of INV-001, INV-002 and INV-004 (constitution section 3, way 1), for a
          # task commit (D-181 C2). Standard library only. Run in the checkout of the pushed commit, after G0 detect.
          # Checks every file Git tracks under src/ and tests/ at HEAD, and the task's changed paths:
          # - file rule (INV-002): only .py files; no package manifest and no vendored package anywhere in the change;
          # - import rule (INV-001, INV-002): every import resolves to the standard library (this Python's own list of its module
          #   names) or to the package aieos_bootstrap; a pinned deny-list of standard-library modules is refused as well
          #   (dynamic import, processes, network, files written, foreign code);
          # - pattern rule (INV-001, INV-002): no exec, eval, compile, __import__, open, input or breakpoint; no __builtins__;
          #   no call that starts a process or writes, removes or renames a file;
          # - INV-004: no changed path under .aieos/; no string in src/ that names .aieos (no core writer exists yet).
          import ast
          import json
          import subprocess
          import sys

          OWN = {'aieos_bootstrap'}
          DENY_MODULES = {'importlib', 'subprocess', 'multiprocessing', 'socket', 'ssl', 'http', 'urllib', 'ftplib', 'smtplib',
                          'poplib', 'imaplib', 'telnetlib', 'xmlrpc', 'asyncio', 'ctypes', 'pty', 'shutil', 'tempfile', 'sqlite3',
                          'webbrowser', 'runpy', 'pickle', 'marshal', 'shelve', 'dbm', 'zipimport', 'pkgutil', 'code', 'codeop',
                          'builtins'}
          DENY_NAMES = {'exec', 'eval', 'compile', '__import__', 'open', 'input', 'breakpoint', '__builtins__'}
          DENY_OS = {'system', 'popen', 'fork', 'forkpty', 'kill', 'remove', 'unlink', 'rename', 'renames', 'replace', 'mkdir',
                     'makedirs', 'rmdir', 'removedirs', 'chmod', 'chown', 'write', 'open', 'fdopen', 'truncate', 'link', 'symlink'}
          # (str.replace is common, so `replace` is refused only as os.replace, through DENY_OS); `.open` on any object covers
          # io.open, codecs.open, gzip.open and Path(...).open (D-182 C2 (5))
          DENY_ATTR_CALLS = {'write_text', 'write_bytes', 'touch', 'mkdir', 'unlink', 'rmdir', 'rename', 'symlink_to',
                             'hardlink_to', 'open', 'fdopen'}
          MANIFESTS = {'setup.py', 'setup.cfg', 'pyproject.toml', 'Pipfile', 'Pipfile.lock', 'poetry.lock', 'MANIFEST.in'}
          VENDOR_DIRS = {'site-packages', 'vendor', '_vendor', 'node_modules', '__pypackages__'}


          def git(*a):
              return subprocess.run(['git'] + list(a), capture_output=True, check=True).stdout.decode('utf-8')


          def check_source(path, text, findings):
              try:
                  tree = ast.parse(text, filename=path)
              except SyntaxError as e:
                  findings.append('%s: does not parse (%s)' % (path, e.msg))
                  return
              std = set(sys.stdlib_module_names)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      if isinstance(node, ast.ImportFrom) and node.level:
                          continue
                      names = [a.name for a in node.names] if isinstance(node, ast.Import) else [node.module or '']
                      for n in names:
                          top = n.split('.')[0]
                          if top in DENY_MODULES:
                              findings.append('%s:%d: import of a refused module %s' % (path, node.lineno, n))
                          elif top not in std and top not in OWN:
                              findings.append('%s:%d: import outside the standard library and the own package: %s' % (path, node.lineno, n))
                  elif isinstance(node, ast.Name) and node.id in DENY_NAMES:
                      findings.append('%s:%d: refused name %s' % (path, node.lineno, node.id))
                  elif isinstance(node, ast.Attribute):
                      base = node.value.id if isinstance(node.value, ast.Name) else ''
                      if base == 'os' and (node.attr in DENY_OS or node.attr.startswith(('spawn', 'exec', 'posix_spawn'))):
                          findings.append('%s:%d: refused call os.%s' % (path, node.lineno, node.attr))
                      elif node.attr in DENY_ATTR_CALLS:
                          findings.append('%s:%d: refused file-changing call .%s' % (path, node.lineno, node.attr))
                  elif isinstance(node, ast.Constant) and isinstance(node.value, str) and path.startswith('src/') and '.aieos' in node.value:
                      findings.append('%s:%d: a string names .aieos (INV-004)' % (path, node.lineno))


          def main():
              t = json.load(open('../task.json'))
              if t['task'] is None:
                  print('deterministic_rule: no task')
                  return 0
              findings = []
              # the paths the task's own commits change (written by G0 detect), not main's later commits (D-182 C2 (1))
              changed = set()
              for x in open('../range-base.txt').read().split():
                  changed.update(p for p in git('diff-tree', '--no-commit-id', '--name-only', '-r', '--no-renames', '--root', x).split('\n') if p)
              changed = sorted(changed)
              for p in changed:
                  parts = p.split('/')
                  if p.startswith('.aieos/'):
                      findings.append('%s: a changed path under .aieos/ (INV-004)' % p)
                  if parts[-1] in MANIFESTS or parts[-1].startswith('requirements') or parts[-1].endswith('.egg-info'):
                      findings.append('%s: a package manifest (INV-002)' % p)
                  if VENDOR_DIRS.intersection(parts[:-1]):
                      findings.append('%s: a vendored package folder (INV-002)' % p)
              files = [p for p in git('ls-files', 'src', 'tests').split('\n') if p]
              for p in files:
                  if not p.endswith('.py'):
                      findings.append('%s: not a Python source file (INV-002 file rule)' % p)
                      continue
                  check_source(p, git('show', 'HEAD:' + p), findings)
              for f in findings:
                  print('deterministic_rule FAIL:', f)
              print('deterministic_rule: files %d, changed paths %d, findings %d' % (len(files), len(changed), len(findings)))
              return 1 if findings or not files else 0


          if __name__ == '__main__':
              sys.exit(main())

      - name: OPS-003 pattern rules
        if: ${{ !cancelled() }}
        working-directory: work
        shell: python3 {0}
        run: |
          # AIEOS CI: the tool part of OPS-003 ("unmeasured means advisory") for a task commit (D-181 P1, C2). Standard library
          # only. Run in the checkout of the pushed commit, after G0 detect. Over every file Git tracks under src/ and tests/:
          # - a line that uses an effect label (MEASURED, ENFORCED, GUARANTEED) must cite a decision-matrix row on that line;
          # - in src/, no string is exactly "valid", "accepted" or "approved" (lowercase, an exact and case-sensitive match): the
          #   module's results never call a record valid, accepted or approved (TASK-001 AC7); state names such as ACCEPTED pass.
          import ast
          import json
          import re
          import subprocess
          import sys

          LABEL = re.compile(r'\b(MEASURED|ENFORCED|GUARANTEED)\b')
          ROW = re.compile(r'\b[A-P][0-9]{1,3}\b')
          WORDS = {'valid', 'accepted', 'approved'}


          def git(*a):
              return subprocess.run(['git'] + list(a), capture_output=True, check=True).stdout.decode('utf-8')


          def main():
              t = json.load(open('../task.json'))
              if t['task'] is None:
                  print('OPS-003: no task')
                  return 0
              findings = []
              files = [p for p in git('ls-files', 'src', 'tests').split('\n') if p]
              for p in files:
                  text = git('show', 'HEAD:' + p)
                  for i, line in enumerate(text.split('\n'), 1):
                      if LABEL.search(line) and not ROW.search(line):
                          findings.append('%s:%d: an effect label without a decision-matrix row' % (p, i))
                  if p.startswith('src/') and p.endswith('.py'):
                      try:
                          tree = ast.parse(text)
                      except SyntaxError:
                          continue
                      for node in ast.walk(tree):
                          # exact and case-sensitive: the state names of specification 2 section 2 (ACCEPTED and the others) pass
                          if isinstance(node, ast.Constant) and isinstance(node.value, str) and node.value in WORDS:
                              findings.append('%s:%d: a result word "%s" (AC7)' % (p, node.lineno, node.value))
              for f in findings:
                  print('OPS-003 FAIL:', f)
              print('OPS-003: files %d, findings %d' % (len(files), len(findings)))
              return 1 if findings else 0


          if __name__ == '__main__':
              sys.exit(main())

