          "$A/venv/bin/bandit" --version
          # src/: every bandit test. tests/: every test but B101 (assert) and B311 (the random module, which seeded
          # property tests use); both options are written here, never read from the change.
          S=0
          "$A/venv/bin/bandit" -r "$GITHUB_WORKSPACE/work/src" --ini "$A/empty.bandit" --ignore-nosec -f txt || S=1
          "$A/venv/bin/bandit" -r "$GITHUB_WORKSPACE/work/tests" --ini "$A/empty.bandit" --ignore-nosec --skip B101,B311 -f txt || S=1
          [ "$S" = 0 ]
