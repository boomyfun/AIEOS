                      print('conformance %s run: no task' % mode)
                      return 0
                  base = git('rev-parse', 'refs/remotes/origin/main').decode().strip()
              gov = blob(base, GOVERNOR_FILES[0])
              runner_blob = blob(base, RUNNER)
              runner_sha = hashlib.sha256(runner_blob).hexdigest() if runner_blob is not None else None
              gov_sha = hashlib.sha256(gov).hexdigest() if gov is not None else 'absent'
              rc_file = blob(base, RESUME_CHECK_FILE)
              rc_sha = hashlib.sha256(rc_file).hexdigest() if rc_file is not None else 'absent'
              if mode == 'base':
                  root, commit, note = os.path.abspath('../conformance-base'), base, 'base %s' % base
                  if on_main:
                      note = 'base %s (the tip main held before the push of %s)' % (base, head)
                  extract(base, root)
              else:
                  changed = [f for f in GOVERNOR_FILES if blob('HEAD', f) != blob(base, f)]
                  if not changed:
                      print('conformance candidate run: no governor file changed by the pushed commits; no candidate run')
                      return 0
                  root, commit = os.path.abspath('../conformance-candidate'), head
                  extract(base, root)
                  for f in GOVERNOR_FILES:
                      data, target = blob('HEAD', f), os.path.join(root, f)
                      inside = os.path.realpath(os.path.dirname(target)).startswith(os.path.realpath(root) + os.sep)
                      if os.path.islink(target) or not inside:
                          return fail(title, 'the place of a governor file in the base is a link or outside the tree: %s' % f)
                      if data is None:
                          if os.path.exists(target):
                              os.remove(target)
                      else:
                          with open(target, 'wb') as w:
                              w.write(data)
                  note = 'candidate: the inputs of base %s with the governor files of %s (%s); advisory' % (base, head, ', '.join(changed))
              if mode == 'base':
                  placed = gov_sha if gov is not None else None
              else:
                  head_gov = blob('HEAD', GOVERNOR_FILES[0])
                  placed = hashlib.sha256(head_gov).hexdigest() if head_gov is not None else None
              watched = snapshot()
              rc, out = run_runner(root, commit, task)
              moved = sorted(k for k, v in snapshot().items() if watched.get(k) != v)
              if moved:
                  return fail(title, 'changed while the runner ran: %s; %s' % (', '.join(moved), note))
              parsed = parse(out, commit, task)
              if rc not in (0, 1) or parsed is None:
                  return fail(title, 'no run record (runner exit %s); %s' % (rc, note))
              value, record = parsed
              if (rc == 0) != (record['outcome'] == 'pass'):
                  return fail(title, 'runner exit %d and outcome %s disagree; %s' % (rc, record['outcome'], note))
              if not (isinstance(value.get('runner'), dict) and value['runner'].get('sha256') == runner_sha):
                  return fail(title, 'the run record does not name the base runner; %s' % note)
              if value.get('governor_identity') not in (placed, None):
                  return fail(title, 'the run names governor %s, not the governor file put in place (%s); %s' % (
                      value['governor_identity'], placed or 'none', note))
              rc_run = value.get('resume_check')
              rc_placed = rc_sha if rc_file is not None else None
              if rc_run is not None and not (isinstance(rc_run, dict) and rc_run.get('path') == RESUME_CHECK_FILE
                                             and 'sha256' in rc_run and rc_run['sha256'] in (None, rc_placed)):
                  return fail(title, 'the run names a Resume Check other than the file put in place (%s); %s' % (
                      rc_placed or 'none', note))
              rc_named = 'not used' if rc_run is None else (rc_run.get('sha256') or 'none')
              results = ', '.join('%s %s' % (r['id'], r['result']) for r in value['results'])
              report_only = mode == 'candidate' or not PINNED
              msg = ('outcome %s; counts %s; record %s; commit %s; task %s; governor %s; base governor file %s; resume check %s; '
                     'base resume check file %s; %s; %s; %s; results: %s') % (
                  record['outcome'], value['counts'], record['record_id'], commit, task, value['governor_identity'],
                  gov_sha, rc_named, rc_sha, note, 'report only' if report_only else 'pinned governor %s' % PINNED,
                  'pinned resume check %s' % PINNED_RC if PINNED_RC else 'no resume check pinned', results)
              annotate('notice', title, msg)
              print('%s: outcome %s, record %s' % (title, record['outcome'], record['record_id']))
              if mode == 'base' and gov is None and any(r['result'] == 'PASS' for r in value['results']):
                  return fail(title, 'a PASS with no governor in the base')
              if mode == 'base' and PINNED_RC and (rc_sha != PINNED_RC or rc_named != PINNED_RC):
                  return fail(title, 'the base Resume Check (file %s, run %s) is not the pinned version %s' % (
                      rc_sha, rc_named, PINNED_RC))
              if report_only:
                  return 0
              if gov_sha != PINNED or value['governor_identity'] != PINNED:
                  return fail(title, 'the base governor (file %s, run %s) is not the pinned version %s' % (
                      gov_sha, value['governor_identity'], PINNED))
              if record['outcome'] != 'pass':
                  return fail(title, 'outcome %s with the pinned governor' % record['outcome'])
              return 0


          if __name__ == '__main__':
              args = sys.argv[1:] or os.environ.get('AIEOS_ARGS', '').split()
              sys.exit(main(args[0]))

